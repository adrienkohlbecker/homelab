# CI topology: hosted runners handle stateless jobs; the AWS fleeting pool runs
# detect and qemu cells by default; HOMELAB_CI_TARGET=lab uses lab's shell runner.
# Both qemu pools use the promoted images built on lab (S3 on AWS, local on lab).
# CI receives only the masked HOMELAB_VAULT_PASSWORD_TEST identity.

# detect generates the child pipeline; jobs otherwise default to test.
stages:
  - prepare
  - test

default:
  # Pairs with auto-cancel-redundant-pipelines.
  interruptible: true

variables:
  HOMELAB_CI_TARGET: aws_qemu
  # Keep qemu cells available as manual jobs without auto-running the matrix:
  #   git push -o ci.variable=SKIP_TEST_CELLS=true
  # The trigger tolerates the skipped child, and detect excludes it as a future
  # green base so later diffs are not suppressed.
  SKIP_TEST_CELLS: ""

# GitLab expands tags before job rules:variables, so select the runner tag at
# workflow scope. Target alone is authoritative across web, push-option, and API
# pipelines; the catch-all preserves every other pipeline source.
workflow:
  rules:
    - if: $HOMELAB_CI_TARGET == "lab"
      variables:
        DETECT_RUNNER_TAG: lab-shell-qemu
    - when: always
      variables:
        DETECT_RUNNER_TAG: aws-shell-qemu

# Hosted jobs use the manually published CI image. Bootstrap is normally a
# no-op, but installs toolchain drift and makes a stale image visible in logs.
# CI auto-trusts mise.toml; unused op:// values remain literal without op run.
.hosted:
  image: $CI_REGISTRY_IMAGE/ci:latest
  before_script:
    - mise run ci:bootstrap

.push_or_web:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "push"'

.manual_job:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - when: manual
      allow_failure: true

.protected_manual_job:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_REF_PROTECTED == "true"
      when: manual
      allow_failure: true

# detect emits one child job per role:variant[:ubuntu] cell. Its diff base is the
# newest fully-green ancestor, so fixes retest everything since the last green;
# missing or failed API resolution safely expands to the full universe.
# CI_JOB_TOKEN queries pipelines by default; GITLAB_API_TOKEN is the optional
# read_api fallback. See notes/ci_aws_nested_qemu_cells.md.
detect:
  stage: prepare
  # Rendering on the selected cell pool warms its first runner for the matrix.
  tags:
    - $DETECT_RUNNER_TAG
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    # Detect still renders manual cells under SKIP_TEST_CELLS. The lab rule must
    # precede source rules because lab uses host tools rather than /opt caches.
    - if: $HOMELAB_CI_TARGET == "lab"
    - if: '$CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "push"'
      variables:
        MISE_DATA_DIR: /opt/mise
        UV_CACHE_DIR: /opt/uv-cache
  variables:
    # detect fetches an older resolved base on demand.
    GIT_DEPTH: "50"
    # The AWS AMI cache is cross-filesystem. Omit UV_PROJECT_ENVIRONMENT so
    # detect gets a per-job venv; copy mode is harmless on lab.
    UV_LINK_MODE: copy
  timeout: 15m
  script:
    - mise run ci:bootstrap
    - mise run ci:detect --target "$HOMELAB_CI_TARGET"
  artifacts:
    paths:
      - test-child.yml

# strategy:depend mirrors child status. detect emits a no-op child when no role
# is relevant because runtime cell presence cannot gate pipeline-creation rules.
test_cells:
  stage: test
  needs:
    - job: detect
      artifacts: true
  rules:
    # An all-manual child is "skipped"; tolerate that status only under SKIP.
    - if: '($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "push") && $SKIP_TEST_CELLS == "true"'
      allow_failure: true
    - if: '$CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "push"'
  trigger:
    include:
      - artifact: test-child.yml
        job: detect
    forward:
      pipeline_variables: true
    strategy: depend

lint:
  stage: prepare
  extends:
    - .hosted
    - .push_or_web
  tags:
    - saas-linux-medium-amd64
  timeout: 30m
  variables:
    # Syntax-check loads vaulted vars; CI must never attempt the prod identity.
    ANSIBLE_VAULT_IDENTITY_LIST: test@vault-client.sh
    # Ansible ignores cwd config under world-writable /builds unless pinned.
    ANSIBLE_CONFIG: $CI_PROJECT_DIR/ansible.cfg
  script:
    - mise run lint

# Hermetic Python and Fluent Bit Lua unit suites.
unit_tests:
  stage: prepare
  extends:
    - .hosted
    - .push_or_web
  timeout: 15m
  script:
    - mise run test
    - mise run test:fluentbit-lua

# Manually publish Dockerfile as ci:<sha>; only master also moves :latest.
# Hosted dind cannot reach Nexus, so the build uses upstream apt. An optional
# no-scope MISE_GITHUB_TOKEN is mounted only as a BuildKit secret.
ci_image:
  stage: prepare
  extends: .manual_job
  image: docker:28.3.3
  services:
    - docker:28.3.3-dind
  tags:
    - saas-linux-medium-amd64
  # Serialize and never cancel a possible :latest push.
  resource_group: ci_image
  interruptible: false
  timeout: 45m
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    # A missing cache is expected on the first build.
    - docker pull "$CI_REGISTRY_IMAGE/ci:latest" || true
    - |
      docker build ${MISE_GITHUB_TOKEN:+--secret id=mise_github_token,env=MISE_GITHUB_TOKEN} \
        --build-arg USE_NEXUS_MIRRORS=0 \
        --build-arg BUILDKIT_INLINE_CACHE=1 \
        --cache-from "$CI_REGISTRY_IMAGE/ci:latest" \
        --tag "$CI_REGISTRY_IMAGE/ci:$CI_COMMIT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE/ci:$CI_COMMIT_SHA"
    # Branch dispatches must not retarget what other pipelines pin.
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        docker tag "$CI_REGISTRY_IMAGE/ci:$CI_COMMIT_SHA" "$CI_REGISTRY_IMAGE/ci:latest"
        docker push "$CI_REGISTRY_IMAGE/ci:latest"
      fi

# Bake the AWS nested-qemu runner host AMI, not a guest fixture. Terraform's ASG
# resolves its promoted /homelab-ci/ami/qemu-host/noble parameter.
qemu_host_ami:
  stage: prepare
  extends:
    - .hosted
    - .protected_manual_job
  tags:
    - saas-linux-small-amd64
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: sts.amazonaws.com
  resource_group: ami-qemu-host-noble
  interruptible: false
  timeout: 60m
  script:
    - mise run packer:init
    - source mise-tasks/ci/aws-oidc.sh arn:aws:iam::000390721279:role/homelab-ci-bake "qemu-host-ami-$CI_JOB_ID"
    - mise run packer:qemu-host-ami --promote

# Build protected box fixtures on lab's KVM runner, retain them locally for lab,
# and promote versioned bundles plus promoted.json pointers to S3 for AWS cells.
# Promotion is global but verify-boots first, retains prior S3 versions, and
# prints rollback instructions. Per-machine/release resource groups serialize
# only builds that share an output path and pointer; box_deps still needs box.
.qemu_image:
  stage: prepare
  extends: .protected_manual_job
  # lab is both the sole KVM builder and the lab cells' local image store.
  tags:
    - lab-shell-qemu
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: sts.amazonaws.com
  # Cancellation can leave a half-published bundle.
  interruptible: false
  timeout: 90m
  parallel:
    matrix:
      - UBUNTU:
          - noble
          - resolute
  before_script:
    - mise run ci:bootstrap
    - source mise-tasks/ci/aws-oidc.sh arn:aws:iam::000390721279:role/homelab-ci-bake "qemu-image-$CI_JOB_ID"

"qemu_image:box":
  extends: .qemu_image
  # A failed box must block box_deps rather than seed from an older publication.
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_REF_PROTECTED == "true"
      when: manual
      allow_failure: false
  resource_group: qemu_image_box_$UBUNTU
  script:
    - mise run packer:publish-qemu box --ubuntu "$UBUNTU" --promote

# box_deps layers seed_deps.yml onto the matching box artifact in lab's shared
# HOMELAB_CI_DIR; the explicit need prevents using an older box.
"qemu_image:box_deps":
  extends: .qemu_image
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_REF_PROTECTED == "true"
  resource_group: qemu_image_box_deps_$UBUNTU
  script:
    - mise run packer:publish-qemu box_deps --ubuntu "$UBUNTU" --promote
  # Pair releases; artifacts stay in HOMELAB_CI_DIR rather than GitLab.
  needs:
    - job: "qemu_image:box"
      parallel:
        matrix:
          - UBUNTU: [ '$[[ matrix.UBUNTU ]]' ]
      artifacts: false

# Reaper-only schedules would otherwise overwrite the branch badge. Mirror the
# last complete full-universe verdict; this must remain required and queries only
# GitLab with CI_JOB_TOKEN.
schedule_status_guard:
  stage: prepare
  extends: .hosted
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_REF_PROTECTED == "true"
  tags:
    - saas-linux-small-amd64
  timeout: 10m
  script:
    - mise run ci:schedule-guard

# Delete stale immutable S3 image prefixes without touching promoted.json targets.
# Protected schedules apply; manual runs default to dry-run.
qemu_image_reaper:
  stage: prepare
  extends: .hosted
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_REF_PROTECTED == "true"
    - if: $CI_COMMIT_REF_PROTECTED == "true"
      when: manual
      allow_failure: true
  tags:
    - saas-linux-small-amd64
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: sts.amazonaws.com
  resource_group: qemu-image-reaper
  interruptible: false
  timeout: 15m
  script:
    - source mise-tasks/ci/aws-oidc.sh arn:aws:iam::000390721279:role/homelab-ci-bake "qemu-image-reaper-$CI_JOB_ID"
    - |
      if [ "$CI_PIPELINE_SOURCE" = "schedule" ] || [ "${QEMU_IMAGE_REAPER_APPLY:-}" = "true" ]; then
        mise run ci:reap-qemu-images --apply
      else
        mise run ci:reap-qemu-images
      fi

# Build fox's ZFS-root disk on lab, stream it through a temporary Hetzner rescue
# server, and retain the two newest snapshots. The published project-global
# snapshot becomes Terraform's most_recent fox image. This protected manual job
# alone receives the masked HCLOUD_TOKEN; no AWS credentials are involved.
fox_image:
  stage: prepare
  extends: .protected_manual_job
  # Both build and upload need lab's persistent HOMELAB_CI_DIR.
  tags:
    - lab-shell-qemu
  # Serialize the shared build and prune set; cancellation can orphan a server.
  resource_group: fox_image
  interruptible: false
  timeout: 90m
  script:
    - test -n "${HCLOUD_TOKEN:-}" || { echo "HCLOUD_TOKEN CI/CD variable is not set" >&2; exit 1; }
    - mise run ci:bootstrap
    - mise run packer:init
    # fox stays noble; the shipped image uses upstream mirrors despite the build.
    - mise run packer:build hetzner --ubuntu noble
    - mise run packer:hetzner

# Manually rebuild ZFSBootMenu after a version or overlay change, verify the
# artifacts, then pin the tarball. zbm:ci-build owns dind setup, cache, assertions,
# and default-branch publication.
zbm_build:
  stage: prepare
  extends:
    - .hosted
    - .manual_job
  services:
    - docker:28.3.3-dind
  tags:
    - saas-linux-medium-amd64
  # Serialize the shared cache ref and never cancel a publish.
  resource_group: zbm_build
  interruptible: false
  timeout: 60m
  variables:
    # The Ubuntu CI image does not auto-configure the dind TLS client.
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
  artifacts:
    expire_in: 30 days
    paths:
      - zbm-build/**/*-bootmenu
      - zbm-build/**/*-bootmenu.img
      - zbm-build/**/zfsbootmenu.EFI
      - zbm-build/**/ssh_host_ed25519_key.pub
      - zbm-build/**/*.tar.gz
      - zbm-build/**/*.sha256sum
  script:
    - mise run zbm:ci-build
