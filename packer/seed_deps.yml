# Bake the heavy cross-cutting test deps (podman + noble backports,
# nginx + snakeoil certs, and fluent-bit) into the box_deps variant image so role
# tests that opt in via roles/<role>/meta/test.yml skip the ~140s of
# backports-upgrade + podman/nginx/fluent-bit install every _setup.yml
# hook pays today. Invoked by qemu.pkr.hcl's seed-deps post-processor,
# which boots the freshly-built image, runs this playbook against it,
# and shuts it down cleanly so the shipped artifacts carry the deps.
- name: Bake homelab test deps into the box_deps variant image
  hosts: all
  become: true
  tasks:
    # This seed runs outside site.yml, so it never gets the apt role's
    # mirror rewrite that every normal converge does first. The packer
    # image ships /etc/apt/sources.list pointing at upstream
    # archive.ubuntu.com; the build VM reaches that on a fresh boot, but
    # loses external egress through its nested SLIRP-over-slirp4netns NAT
    # after the in-guest reboot below (lab-internal Nexus stays reachable).
    # Point apt at the Nexus mirror up front so neither the HWE install nor
    # the post-reboot podman/backports step depends on external
    # connectivity. The qemu image has no cloud-init, so the rewritten
    # sources.list survives the reboot.
    - name: Configure apt to use the Nexus mirror
      import_role:
        name: apt

    - name: Install podman + noble-backported runtime
      import_role:
        name: podman
        tasks_from: install

    - name: Install nginx + snakeoil cert at letsencrypt paths
      import_role:
        name: test
        tasks_from: nginx

    - name: Install fluent-bit
      import_role:
        name: fluentbit

    # Everything above wrote its apt sources through the lab Nexus: test
    # hosts set nexus_url, and the bake needs Nexus because external egress
    # dies after the in-guest reboot. Rewrite each shared apt mirror to the
    # value it has without Nexus before shipping the fixture so AWS
    # nested-qemu cells do not try to route through the lab.
    - name: Assert the source Nexus URL is defined
      assert:
        that:
          - nexus_url | length > 0
        fail_msg: nexus_url must identify the source mirror before sanitizing box_deps.

    - name: Capture Nexus-backed apt mirror URLs
      set_fact:
        box_deps_apt_mirror_sources: >-
          {{ box_deps_apt_mirror_sources | default({}) |
             combine({item: lookup('vars', item)}) }}
      loop: "{{ query('varnames', '^mirror_apt_') | sort }}"

    - name: Resolve upstream apt mirror URLs
      vars:
        nexus_url: ""
        test_in_aws: false
      set_fact:
        box_deps_apt_mirror_rewrites: >-
          {{ box_deps_apt_mirror_rewrites | default([]) +
             [{'source': item.value, 'replacement': lookup('vars', item.key)}] }}
      loop: "{{ box_deps_apt_mirror_sources | dict2items }}"

    - name: Find Nexus-backed apt source files
      find:
        paths: /etc/apt
        file_type: file
        recurse: true
        patterns:
          - sources.list
          - "*.list"
          - "*.sources"
        contains: "{{ nexus_url | regex_escape }}"
        read_whole_file: true
      register: box_deps_apt_sources

    - name: Rewrite baked apt sources to upstream
      replace:
        path: "{{ item.0.path }}"
        regexp: "{{ item.1.source | regex_escape }}"
        replace: "{{ item.1.replacement }}"
        backup: true
      loop: >-
        {{ box_deps_apt_sources.files |
           product(box_deps_apt_mirror_rewrites) | list }}
      loop_control:
        label: "{{ item.0.path }}: {{ item.1.source }}"

    # Fail closed: the rewrite pairs above only cover URLs derived from
    # mirror_apt_* vars, so an apt source pointing at Nexus through any other
    # shape would ship silently and only surface as a strict apt-get update
    # failure inside an AWS cell. Re-scan and refuse to ship a fixture that
    # still references the lab. The rewrite's `<file>.<pid>.<ts>~` backups
    # keep the old URLs by design and fall outside the patterns below.
    - name: Re-scan for apt sources still pointing at Nexus
      find:
        paths: /etc/apt
        file_type: file
        recurse: true
        patterns:
          - sources.list
          - "*.list"
          - "*.sources"
        contains: "{{ nexus_url | regex_escape }}"
        read_whole_file: true
      register: box_deps_apt_sources_leftover

    - name: Assert the shipped fixture is Nexus-free
      assert:
        that:
          - box_deps_apt_sources_leftover.files | length == 0
        fail_msg: >-
          Baked apt sources still reference {{ nexus_url }}:
          {{ box_deps_apt_sources_leftover.files | map(attribute='path') | join(', ') }}
