datasource_list: [ Hetzner, ConfigDrive, NoCloud, None ]
# growpart's default device "/" resolves to a ZFS dataset on this image and is
# skipped, so name rpool's partition.
growpart:
  devices: [ /dev/sda5 ]
# resizefs reads rpool's vdev as `zpool status` names it, a bare partition UUID
# it cannot resolve to a device, so it only warns and leaves cloud-init
# degraded. Expand the pool into the grown partition explicitly instead; runcmd
# runs once per instance, after growpart.
resize_rootfs: false
runcmd:
  - [ sh, -c, 'zpool online -e rpool "$(zpool list -vHP rpool | awk "NR == 2 { print \$1 }")"' ]
