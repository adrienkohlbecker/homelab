# Synthetic ARM host benchmark. Each group traverses the 130-cell test universe
# while detect.py maps unsupported machine/release dimensions onto the existing
# Noble box or box_deps ARM fixture.
stages:
  - benchmark

default:
  interruptible: false

.arm_benchmark_cell:
  stage: benchmark
  dependencies: []
  tags:
    - aws-shell-qemu-arm
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: sts.amazonaws.com
  timeout: 45m
  variables:
    ARCH: aarch64
    HOMELAB_TEST_IN_AWS: "true"
    HOMELAB_TEST_AWS_COMPUTE_REGION: eu-west-1
    HOMELAB_TEST_AWS_ECR_REGION: eu-west-1
    HOMELAB_NET_BACKEND: slirp
    ANSIBLE_VAULT_IDENTITY_LIST: test@vault-client.sh
    MISE_DATA_DIR: /opt/mise
    MISE_DISABLE_TOOLS: aqua:Kampfkarren/selene
    UV_CACHE_DIR: /opt/uv-cache
    UV_LINK_MODE: copy
    HOMELAB_AARCH64_FIRMWARE_DIR: /opt/homelab-ci/qemu-firmware/aarch64
  before_script:
    - test -n "${HOMELAB_VAULT_PASSWORD_TEST:-}" || { echo "HOMELAB_VAULT_PASSWORD_TEST CI/CD variable is not set" >&2; exit 1; }
    - mise run ci:bootstrap
    - source mise-tasks/ci/aws-oidc.sh arn:aws:iam::000390721279:role/homelab-ci-cell "arm-benchmark-$CI_JOB_ID" --cache-dir --region eu-west-1
    - |
      set -euo pipefail
      spec="$(mise exec -- python mise-tasks/ci/detect.py --arm-benchmark-index "$CI_NODE_INDEX")"
      export ROLE="${spec%%:*}"
      export VARIANT="${spec#*:}"
      export UBUNTU=noble
      export HOMELAB_TEST_OUT_DIR="test/out/arm_benchmark/${CI_JOB_NAME_SLUG}-${CI_NODE_INDEX}"
      mise run ci:hydrate-qemu-images "$VARIANT" --ubuntu "$UBUNTU" \
        --bucket homelab-ci-arm-images-eu-west-1 --region eu-west-1 \
        --architecture aarch64
  script:
    - |
      set -euo pipefail
      rc=0
      mise exec -- timeout --kill-after=30s 1560 test/testrole.py \
        "$ROLE" --machine "$VARIANT" --ubuntu "$UBUNTU" \
        --timeout 1500 --benchmark || rc=$?
      echo "harness exit code: $rc"
      exit "$rc"
  after_script:
    - rm -f "$CI_PROJECT_DIR/.aws_web_identity_token"
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - test/out/arm_benchmark/$CI_JOB_NAME_SLUG-$CI_NODE_INDEX/

"arm_benchmark:1":
  extends: .arm_benchmark_cell
  parallel: 130

"arm_benchmark:2":
  extends: .arm_benchmark_cell
  parallel: 130

"arm_benchmark:3":
  extends: .arm_benchmark_cell
  parallel: 130
