# Per-architecture facts shared by the qemu harness (test/machine.py), the qemu
# fixture build (packer/qemu.pkr.hcl), the CI image tasks, the AWS audit, and
# Terraform. Keys are uname-style architecture names.
#
# guest.cloud_image_suffix is the architecture token in Ubuntu cloud-image names.
# guest.uefi_firmware maps a lowercase `uname -s` host OS to the UEFI CODE/VARS
# pair Packer builders, CI hosts, and the harness load on it: Ubuntu's packages
# (ovmf, qemu-efi-aarch64) on Linux, Homebrew's qemu on macOS. Packer bakes the
# VARS store into fixtures, so the harness must load the paired CODE. A missing
# host OS is an unsupported builder for that architecture.
# ci.ami_parameter is an SSM parameter name template; `{ubuntu}` is replaced by
# the Ubuntu codename.
x86_64:
  guest:
    machine_type: q35
    net_device: virtio-net
    # virtio-gpu with a VGA BIOS, so SeaBIOS and GRUB draw on it too.
    display_device: virtio-vga
    cloud_image_suffix: amd64
    # Ubuntu 24.04 dropped the legacy non-4M names.
    uefi_firmware:
      linux:
        code: /usr/share/OVMF/OVMF_CODE_4M.fd
        vars: /usr/share/OVMF/OVMF_VARS_4M.fd
  ci:
    ami_name_prefix: homelab-ci-qemu-host
    ami_parameter: /homelab-ci/ami/qemu-host/{ubuntu}
aarch64:
  guest:
    machine_type: virt
    # Ubuntu's ARM qemu package omits the optional virtio EFI ROM. The guest
    # firmware discovers PCI devices directly, so no ROM is needed.
    net_device: virtio-net,romfile=
    # virt has no legacy VGA; edk2's virtio-gpu driver draws the early display.
    display_device: virtio-gpu-pci
    cloud_image_suffix: arm64
    # AAVMF_CODE.fd is only a deprecated compatibility link to this image, and
    # QEMU_EFI.fd is a 2 MiB build that cannot pair with the 64 MiB VARS store.
    uefi_firmware:
      linux:
        code: /usr/share/AAVMF/AAVMF_CODE.no-secboot.fd
        vars: /usr/share/AAVMF/AAVMF_VARS.fd
      darwin:
        code: /opt/homebrew/share/qemu/edk2-aarch64-code.fd
        vars: /opt/homebrew/share/qemu/edk2-arm-vars.fd
  ci:
    ami_name_prefix: homelab-ci-qemu-host-aarch64
    ami_parameter: /homelab-ci/ami/qemu-host/aarch64/{ubuntu}
