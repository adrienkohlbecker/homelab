# Per-architecture facts shared by the qemu harness (test/arch.py), the qemu
# fixture build (packer/qemu.pkr.hcl), the CI image tasks, the AWS audit, and
# Terraform. Keys are uname-style architecture names.
#
# guest.cloud_image_suffix is the architecture token in Ubuntu cloud-image names.
# guest.firmware names the pinned CODE/VARS pair `mise run test:firmware`
# installs; architectures without it use packaged firmware.
# ci.ami_parameter is an SSM parameter name template; `{ubuntu}` is replaced by
# the Ubuntu codename.
x86_64:
  guest:
    machine_type: q35
    net_device: virtio-net
    cloud_image_suffix: amd64
  ci:
    ami_name_prefix: homelab-ci-qemu-host
    ami_parameter: /homelab-ci/ami/qemu-host/{ubuntu}
aarch64:
  guest:
    machine_type: virt
    # Ubuntu's ARM qemu package omits the optional virtio EFI ROM. The guest
    # firmware discovers PCI devices directly, so no ROM is needed.
    net_device: virtio-net,romfile=
    cloud_image_suffix: arm64
    firmware:
      code_name: edk2-aarch64-code.fd
      vars_name: edk2-aarch64-vars.fd
  ci:
    ami_name_prefix: homelab-ci-qemu-host-aarch64
    ami_parameter: /homelab-ci/ami/qemu-host/aarch64/{ubuntu}
