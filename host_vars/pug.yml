zfs_arc_min: 1073741824
zfs_arc_max: 4294967296

# Derived from `sudo sensors-detect` on the host; re-run after hardware changes.
lm_sensors_modules:
  - drivetemp
  - coretemp
  - nct6775

# The nct6798 super-I/O ships PECI Agent 0 (temp7, the CPU package read) with
# tempN_max=80C / hyst=75C -- below this CPU's normal under-load peaks, so the
# kernel alarm bit (and netdata's debugfs.plugin) flap clear<->alarm dozens of
# times a day. Raise the limit to a genuine over-temp threshold (Tjmax ~100C),
# keeping the chip's 5C hysteresis band, so the alarm means something.
lm_sensors_limits:
  - chip: nct6798-isa-02a0
    set:
      - feature: temp7_max
        value: 90
      - feature: temp7_max_hyst
        value: 85

# The macvlan role derives the per-host /28 from data/network_topology.yml.
# pug is slot 1, so its management block resolves to .144/28.
macvlan_blocks:
  - name: mac_mgmt
    parent: eth0
    vlan: management

swap_partition: /dev/disk/by-partlabel/swap

podman_storage_backend: partition
podman_storage_device: /dev/disk/by-partlabel/podman

# zram is the primary swap; the partition above is the overflow
# (notes/swap_strategy.md).
swap_zram:
  size: 8G

netplan:
  ethernets:
    # match.driver pins the block to the physical PCIe NIC. Without it
    # netplan's apply-time matcher walks /sys using the *current* MAC
    # (not PermanentMACAddress like the generated .network files), so
    # any virtual link that inherits the parent's MAC would also be
    # caught. r8169 is the Realtek driver pug's onboard NIC uses;
    # virtual links don't match.
    nic0:
      match:
        macaddress: "{{ mac_addresses.pug }}"
        driver: r8169
      set-name: eth0
      link-local: [] # do not setup random link local address when no dhcp is present
      wakeonlan: true
      dhcp4: true
      dhcp6: false
      # Keep the DHCP lease through a networkd restart so a netplan
      # apply can't momentarily drop eth0 and sever in-flight SSH (the
      # 2026-05-10 lockout). Upstream's lease-preservation fix; the
      # timer-armed rollback in roles/netplan is the backstop for what
      # it can't cover.
      critical: true

zfs_autobackup_sources:
  - host: lab
    dest_dataset: apoc/lab
zfs_autobackup_ssh_public_key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINqTc8cI1r7PWtSMam2CXSsq+FSr7DGKXRvuIP2aVEHT root@lab

fan2go_enabled: true

dns_reboot_guard_enabled: true
dns_keepalived_priority: 10
netdata_keepalived_vrrp_enabled: true

# dns.{{ domain }} is the DoT (Private DNS) name: it resolves to the DNS
# VIP via an adguard rewrite, so whichever DNS peer holds the VIP must
# present a cert covering it. Mirrored in host_vars/lab.yml.
certbot_extra_sans:
  - dns.{{ domain }}

netdata_contexts:
  conntrack:       netfilter.conntrack_sockets
  containers:      cgroup.cpu_limit
  diskspace:       disk.space
  diskstatistics:  disk.io
  entropy:         system.entropy
  extfrag:         mem.numa_node_zone_fragmentation_index
  idlejitter:      system.idlejitter
  interrupts:      system.interrupts
  ipc:             system.ipc_semaphores
  keepalived_vrrp: keepalived_vrrp.state
  loadavg:         system.load
  meminfo:         system.ram
  netdev:          system.net
  netstat:         system.ip
  postfix:         postfix.qsize
  powercap:        cpu.powercap_intel_rapl_zone
  pressure:        system.cpu_some_pressure
  procstat:        system.cpu
  softirqs:        system.softirqs
  systemd_service: systemd.service.cpu.utilization
  uptime:          system.uptime
  vmstat:          mem.swapio
  zfs:             zfs.arc_size
netdata_collectors:
  # No chrony: ntp cmdport=0 blocks go.d UDP-only collector (timex alarm covers clock-sync).
  - go.d:collector:docker:local
  - go.d:collector:intelgpu:intelgpu
  - go.d:collector:logind:logind
  - go.d:collector:nginx:local
  - go.d:collector:nvme:nvme
  - go.d:collector:prometheus:fluentbit
  - go.d:collector:sensors:sensors
  - go.d:collector:smartctl:smartctl
  - go.d:collector:systemdunits:service-units
  - go.d:collector:upsd:local
  # No web_log: pug's nginx serves essentially no traffic, so access.log is
  # empty after every rotation and the collector can never build its parser
  # (an error retry every 60s, ~10k journal lines/week). The job itself is
  # skipped via nginx_web_log_metrics below.
  - go.d:collector:wireguard:wireguard
  # No apex (https://{{ domain }}/) site to monitor -- nginx only serves
  # subdomain hosts. The certbot role's x509check.conf.j2 ships only the
  # host_cert job; this list intentionally mirrors that.
  - go.d:collector:x509check:host_cert
  - go.d:collector:zfspool:zfspool
# See the web_log note in netdata_collectors above.
nginx_web_log_metrics: false
netdata_zfspool_thresholds:
  rpool: [ 85, 90, 95 ] #  464GiB => 70GiB, 47GiB, 24GiB
  apoc: [ 85, 90, 95 ] # 9,312GiB => 464GiB => 1,397GiB, 932GiB, 467GiB
netdata_diskspace_blocklist:
  - /
  - /boot
  - /mnt/old_bionic
  - /mnt/old_services
  - /mnt/services

# Tailscale home exit node (HA pair with lab -- see notes/headscale_mesh_redesign.md §C).
# Advertise the physical partition. On Trusted WiFi, DHCP's more-specific
# 10.123.0.0/21 option-121 route wins and the DNS VIP stays local; off-home,
# this /18 reaches the physical sites without selecting an exit node.
tailscale_advertise_routes:
  - 10.123.0.0/18
# Direct public endpoint for roaming clients (symmetric/CGNAT mobile) so home-exit
# and subnet traffic lands directly instead of relaying through fox's DERP. pug
# shares the home WAN with lab, so it pins 41642 (lab uses 41644) to
# get an unambiguous forwarded endpoint. The firewall role opens WAN ingress on
# this port. MANUAL operator step: add the UniFi port-forward
# WAN:41642 -> pug:41642 (udp).
tailscale_port: 41642
tailscale_wan_direct: true

nginx_static_proxies:
  - marantz
  - printer
  - siglent
  - ups
  - tubeszb
  - unifi

# NUT staged-shutdown ladder (roles/nut_server thresholds + roles/nut_monitor
# upsmon), with the UPS card owning every power cut and restart natively --
# load-shed Group 1 at 15% / Group 2 at 2%, forced reboot on AC return,
# staggered group restarts; see notes/ups_shutdown_ladder.md. The windows box
# (unmanaged, vendor IPP, Group 1) drops out first on a short on-battery
# delay, lab (Group 1) at the 20%/300s role defaults, pug (Group 2) last:
nut_server_battery_charge_low: 5
nut_server_battery_runtime_low: 180
# Wake lab when a short outage ends before its Group 1 cut ever fired (the
# 20%->15% window; lab's own outlet kept power, so BIOS restore-on-AC has
# nothing to do). The windows box is deliberately NOT listed: its equivalent
# gap is recovered manually by sending WoL to the UDM relay for the home VLAN.
nut_monitor_wake_peers:
  - "{{ mac_addresses.lab_i210 }}"
