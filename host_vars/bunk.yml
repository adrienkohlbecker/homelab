ansible_python_interpreter: /usr/local/bin/python3.9
# DSM's sftp subsystem is the restricted internal-sftp (-u 000, no arbitrary
# paths) and its scp is an older OpenSSH the modern control node can't negotiate
# with, so the default "smart" transfer method logs sftp+scp failures before
# falling back. Force piped (dd over the ssh session) to skip both and silence
# the warnings.
ansible_ssh_transfer_method: piped
ansible_become_pass: !vault |
          $ANSIBLE_VAULT;1.2;AES256;prod
          31323465343565656262643331303439656635393061343335356135373164326565653339326238
          6234393638356233313535336533303136313935643561640a346261643134626237346132663137
          31626639373564353665643035333033663161636632336131626239376130383962626565656133
          6536346630343466330a613962646132343064616666353961373064366238306637633265653431
          39373839306164653938393333326531336134333430623131363937306232383132

# The nightly zfs_autobackup offsite step on each source host pushes its
# bak-tagged datasets here as root over wg0. bunk.yml derives both the restricted
# backup roots and forced-command authorized keys from this catalog: each key gets
# command= running ~ak/bin/rrsync with -wo and /volume1/Backup/<name>, so a source
# can only WRITE into its own root -- it cannot read another host's backups,
# escape the dir, or open a shell.
#
# name must match the source's offsite target in
# roles/zfs_autobackup/files/zfs_backup_offsite.sh, and public_key the source
# host's actual root key. Neither coupling is checked anywhere: a mismatch
# surfaces as a nightly rrsync refusal, not a converge failure.
bunk_offsite_backup_sources:
  - name: lab
    public_key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINqTc8cI1r7PWtSMam2CXSsq+FSr7DGKXRvuIP2aVEHT root@lab
  - name: pug
    public_key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJV4m+yJxWvdWwreul2M21yyDEhvIAh8hxS18zkAhVKz root@pug
  - name: fox
    public_key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDyYBrn9Im8oTbstBQZseVT+KhO4hLU6QbcJhcPiQ2ug root@fox

# Tailscale mesh: bunk is the Bonniers subnet router + exit node, enrolled into
# headscale by the standalone bunk.yml playbook (`mise run ansible:bunk --tags
# tailscale`), NOT site.yml -- bunk is DSM (no apt), so the role uses its DSM
# entry point. The Tailscale package is installed via Package Center (operator
# runbook); the role configures and registers it. The control-plane constants
# (tailscale_login_server / _headscale_host / _headscale_user) live in
# group_vars/prod.yml; these are bunk-specific.
tailscale_advertise_routes:
  - "{{ prod_network.sites.bonniers.cidr }}"
# DSM package binary path (vs lab/pug's apt-installed `tailscale` on PATH).
tailscale_bin: /var/packages/Tailscale/target/bin/tailscale
# Pin a distinct underlay port so bunk has a stable public endpoint at Bonniers:
# roaming clients then reach the Bonniers subnet router / exit node DIRECTLY
# (1:1 router forward) instead of relaying through fox's DERP. This site has its
# own WAN, independent of the home mappings (pug 41642, lab 41644).
# DSM hardcodes the port in the package launcher (not /etc/default/tailscaled as
# the apt unit does), so the DSM role entry point patches start-stop-status.
# Requires a manual udp/41643 1:1 forward on the Bonniers router (+ DSM firewall
# allow if enabled) -- off-fleet, see runbook.
tailscale_port: 41643
