# Dedicated _site_test pool (terraform ASG homelab-ci-qemu-site, 4-vCPU
# c8id.xlarge): runs only the full-site converge cell, off the role-cell pool, so
# it runs uncontended and the role-cell pool drains without waiting on it. The
# project-runner token (tagged aws-shell-qemu-site) is vaulted in
# group_vars/prod.yml (gitlab_runner_aws_qemu_site_token); the role-cell runner's
# AWS plugin + .aws profile are reused. detect.py routes _site_test here via the
# aws_qemu site_runner_tag.
# One job per pipeline, so warm reuse buys nothing here either -- same 2m drain.
gitlab_runner_aws_qemu_site_idle_time: "2m"
