# fox: off-home Hetzner Cloud cpx22 VPS (x86_64, Ubuntu 24.04/noble) running
# the Headscale control plane + embedded DERP for the Tailscale mesh. It is
# the ONLY internet-facing host; the home hosts dial outbound to it.
#
# fox is NOT a home host -- no home LAN/VLANs (it sits on its own
# Hetzner private net, the `hetzner` topology site, at 10.123.55.2) -- so it
# runs a curated minimal role set (the dedicated `fox` play in site.yml),
# excluded from the all:!bunk base plays. It DOES join the wg0 backbone (scoped:
# peer host /32s only: each server peer's wg /32 plus the physical /32 for
# cross-site peers), which lets fox reach lab/pug services at their LAN IPs
# without routing whole home subnets. Provisioned by terraform/hetzner.tf;
# reached at fox.fahm.fr (public A -> reserved primary IP).

# Hetzner cloud-init owns matching and addressing for both NICs, including the
# private-net DHCP address and eth0's static IPv6 configuration. This stanza
# layers only the local behavior Ansible needs:
#   - eth0: critical preserves the DHCP lease across the networkd restart
#     `netplan apply` triggers (remote-apply safety; cf. lab/pug).
#   - enp7s0: dhcp4-overrides keeps fox's own resolvers off the private net;
#     optional means a private-net DHCP hiccup never blocks boot (eth0 is the
#     only boot-critical link).
netplan:
  ethernets:
    eth0:
      critical: true
    enp7s0:
      dhcp4-overrides:
        use-dns: false
      optional: true

# Cloud-init owns first-boot bootstrap and networking, so cleanup retains the
# package and netplan retains its rendered 50-cloud-init.yaml.
cloud_init_managed: true

# Cloud-init selects Hetzner's in-network mirrors on first boot; keep the same
# sources when the apt role takes ownership during subsequent converges.
ubuntu_mirror: https://mirror.hetzner.com/ubuntu/packages/
ubuntu_mirror_security: https://mirror.hetzner.com/ubuntu/security/

zfs_arc_min: 0
zfs_arc_max: 536870912
# rpool carries autoexpand=on (chroot.sh sets it so the 20G image grows into
# cpx22's larger disk on first boot) + autotrim=on; both are set live, the zfs
# role asserts them.
zfs_pool_properties:
  - { pool: rpool, name: autotrim, value: "on" }
  - { pool: rpool, name: autoexpand, value: "on" }
# fox runs no onsite pull of its own (empty sources) -- it is a leaf source
# that lab pulls (lab's zfs_autobackup_sources lists fox -> tank/fox). It still
# snapshots locally and rsyncs its bak-tagged datasets offsite to bunk: fox
# reaches bunk's rsync endpoint (external_ips.bunk) over wg0 because wg.conf
# grants cross-site peers the physical /32, same path lab/pug use. The key
# below authorizes root@lab on fox's zfs_autobackup user so lab's pull works.
zfs_autobackup_sources: []
zfs_autobackup_ssh_public_key: "{{ zfs_autobackup_public_keys.lab }}"

# Hetzner is resetting this to 0
boot_efi_timeout: 0

# zram is primary on this 4G VM; the installer-baked sda3 swap partition is its
# disk overflow. Higher swappiness than the fleet default leans on compressed
# swap to keep the working set resident. See notes/swap_strategy.md.
#
# algorithm=lz4 (the fleet default is zstd): under a full-universe CI fan-out
# this 2-vCPU host is CPU-bound (CPU PSI ~96%) while it pages hard at
# swappiness 150, so zstd's per-page compression cost shows up directly in
# system time. lz4 is ~5-10x cheaper to (de)compress for a lower ratio (~2.5x
# vs ~4x here) -- the right trade when CPU, not RAM, is the binding constraint
# during builds; the disk-overflow partition backstops the lost headroom.
swap_zram_size: 4G
swap_zram_algorithm: lz4
swap_swappiness: 150

# Hetzner VPS has a standard 8250 UART at 0x3f8 (Hetzner serial console).
boot_serial_console: "earlycon=uart8250,io,0x3f8 console=ttyS0,115200"

# Firewall: fox relies on the Hetzner Cloud firewall (terraform) rather than
# the home `firewall` role (whose nftables template is built around the home
# WAN/VLANs/wireguard and isn't run here).

# fox is a dual-stack DERP relay: it carries a public AAAA (terraform) and the
# Hetzner firewall opens 443/3478 to ::/0, so IPv6-only tailnet clients reach
# the relay without NAT64. Unlike the home fleet (IPv6 killed at the kernel by
# roles/firewall), fox keeps its IPv6 stack up, so nginx must add [::] listeners
# to actually answer on v6. The embedded DERP STUN gets the same treatment via a
# dual-stack podman network (roles/headscale).
nginx_ipv6: true

# Public addresses the embedded DERP advertises in the DERPMap, pinned to the
# terraform-reserved primary IPs (terraform/hetzner.tf hcloud_primary_ip.fox /
# .fox_v6, auto_delete=false so they survive rebuilds; IPv6 uses the first host
# in the reserved /64, matching fox's eth0 and the public AAAA). headscale can't
# auto-detect them:
# behind nginx + the dual-stack podman bridge it would advertise the container's
# bridge/ULA address, and ansible_default_ipv6 is itself hijacked by podman's ULA
# gateway. So hardcode them -- update here if the reserved IPs ever change.
headscale_derp_ipv4: "46.225.182.74"
headscale_derp_ipv6: "2a01:4f8:1c19:c5d9::1"

# The control plane is published at the apex-level headscale.fahm.fr (terraform
# dns_fahm_fr.tf, real public IPs), decoupled from fox.fahm.fr -- which now
# resolves to fox's Tailscale CGNAT IP, unreachable by a client not yet enrolled.
# The headscale template's <service>.<host>.<domain> default (headscale.fox.fahm.fr)
# would ride the *.fox.fahm.fr CNAME onto that CGNAT address, so override it here.
# nginx already serves this name (the nginx_site vhost server_name carries the
# <subdomain>.<domain> form alongside <subdomain>.<host>.<domain>); the cert SAN
# below makes its TLS cert cover it.
headscale_server_url: "https://headscale.{{ domain }}"

# fox's issued cert covers fox.fahm.fr + *.fox.fahm.fr; the wildcard does NOT
# cover the apex-level headscale.fahm.fr control-plane vhost, so add it explicitly.
certbot_extra_sans:
  - headscale.{{ domain }}

# Headscale OIDC (user-device enrollment via Authelia). Headless hosts (lab/pug)
# still enroll via pre-auth keys regardless; this is for the Apple-app enrollment
# flow. The operator prerequisites (notes/headscale_mesh_redesign.md §E) are in
# place: the prod authelia_oidc_clients[headscale] row + the vaulted
# headscale_oidc_client_secret. Headscale validates this issuer via OIDC
# discovery at startup, so it needs auth.fahm.fr reachable over wg0 when it boots
# -- the headscale unit orders After=wg-quick@wg0 for exactly that.
headscale_oidc_issuer: "https://auth.{{ domain }}"

headscale_oidc_client_id: headscale

# Tailnet node and Hetzner exit/subnet router, registered against its co-located
# Headscale. Route and DNS acceptance stay off so wg0 remains Fox's independent
# path home; see notes/headscale_mesh_redesign.md.
tailscale_advertise_routes:
  - "{{ prod_network.sites.hetzner.cidr }}"

# Fox omits physical-hardware and keepalived metrics that the VM cannot expose.
# Its ZFS root and zram-backed swap remain part of the monitored host surface.
netdata_contexts:
  conntrack:       netfilter.conntrack_sockets
  containers:      cgroup.cpu_limit
  diskspace:       disk.space
  diskstatistics:  disk.io
  entropy:         system.entropy
  extfrag:         mem.numa_node_zone_fragmentation_index
  idlejitter:      system.idlejitter
  interrupts:      system.interrupts
  ipc:             system.ipc_semaphores
  loadavg:         system.load
  meminfo:         system.ram
  netdev:          system.net
  netstat:         system.ip
  postfix:         postfix.qsize
  pressure:        system.cpu_some_pressure
  procstat:        system.cpu
  softirqs:        system.softirqs
  systemd_service: systemd.service.cpu.utilization
  uptime:          system.uptime
  vmstat:          mem.swapio
  zfs:             zfs.arc_size
netdata_collectors:
  # No chrony collector: cmdport=0 blocks go.d UDP access (timex alarm covers clock-sync).
  - go.d:collector:docker:local
  - go.d:collector:logind:logind
  - go.d:collector:nginx:local
  - go.d:collector:prometheus:fluentbit
  - go.d:collector:systemdunits:service-units
  # - go.d:collector:web_log:nginx # is down when no http requests have been made recently, let's skip alerting on this
  - go.d:collector:wireguard:wireguard
  - go.d:collector:x509check:host_cert
  - go.d:collector:prometheus:headscale
  # Doubles as a runner liveness signal: the presence alert fires if the
  # gitlab_runner scrape goes missing (its config.toml metrics endpoint dies).
  - go.d:collector:prometheus:gitlab_runner
  - go.d:collector:zfspool:zfspool
netdata_zfspool_thresholds: {}
netdata_diskspace_blocklist: []

# The Hetzner image carves this rebuild-only partition before rpool. Persistent
# service state remains under /mnt/services; this ext4 filesystem carries only
# reconstructible images and container layers.
podman_storage_device: /dev/disk/by-partlabel/podman

# Process-wide safety ceiling across both AWS runner blocks. Actual work remains
# bounded by each runner's limit and the AWS Spot quota; fox only holds their
# connections and log streams.
gitlab_runner_concurrent: 82

gitlab_runner_aws_qemu_enabled: true

# Per-host job concurrency on each c8id.4xlarge qemu host (16 vCPU / 32 GiB,
# dedicated to CI). The burst fans out across up to max_instances (below) such
# hosts at 13 cells each -- the horizontal-burst form of the proven
# one-8xlarge-at-26 shape: same ~2.46 GiB/cell density per host, but many small
# hosts instead of one big one, for spot-placement spread and a smaller
# per-host blast radius. The current five-host quota ceiling runs up to 65 role
# cells at once; larger universes finish in a second wave.
# Memory -- not CPU -- is the ceiling: vCPU oversubscription (13 x 4 = 52 on 16,
# ~3.25x, identical to the 8xlarge ratio) is a non-issue; peak guest RSS during
# synchronized converge is the hard wall.
#
# Density set from the full-host (c8id.8xlarge, 64 GiB) measurements, 2026-06-20:
#   24 cells -> ~48 GiB RSS peak, ~9 GiB free, 0 OOM. Safe even with no swap.
#   26 cells -> ~55.5 GiB RSS peak (88%), ~7.5 GiB free, ~4.6 GiB of 16 GiB swap,
#               0 OOM, 0% steal, CPU idle floor 10%.
#   28 cells -> ~51 GiB RSS peak, swap to ~10.4 of 16 GiB, ~5.4 GiB free, 0 OOM
#               -- held, but the cushion ran ~65% full.
#   30 cells -> RSS past 51 GiB, global OOM ~6 min in (no swap), kernel culled 2
#               qemu guests (flaked cells).
# 13 per 32 GiB host is exactly that 26-per-64-GiB density, so the same swap-as-
# insurance margin carries over: the qemu-host AMI boot service
# (homelab_ci_prepare_scratch) puts a 16 GiB swapfile on the idle NVMe scratch
# with vm.swappiness=1, so a transient converge overshoot pages out cold pages
# instead of OOM-killing a guest. If swap routinely fills, lower this rather than
# enlarge it. KSM does NOT help here: enabled live at 30 it reclaimed ~0
# (pages_sharing 0, full_scans 0) because converge keeps pages volatile/
# unmergeable.
# Lower this first if qemu boot flakes or OOM kills reappear.
gitlab_runner_aws_qemu_capacity_per_instance: 13
# Host ceiling fits the 96-vCPU All-Standard-Spot quota (L-34B43A08,
# eu-central-1) while reserving 8 vCPUs for the c8id.2xlarge site worker:
# floor((96 - 8) / 16) = 5 c8id.4xlarge role hosts. Fleeting counts accepted
# ASG desired-capacity changes before AWS fulfills them, so exceeding the quota
# leaves phantom instances in taskscaler and prevents later scale-ups. The
# aws_autoscaling_group max_size must match (ci_qemu_host_pool.max_size in
# terraform/aws_ci.tf). Raise the quota to at least 264 vCPUs before restoring
# the 16-host ceiling.
gitlab_runner_aws_qemu_max_instances: 5
# A full-universe run is a short burst: cells land in about two waves, so warm
# hosts are reused within the pipeline but cross-push reuse buys little. Hold the
# drain just long enough for a straggler to claim a freed slot while avoiding
# idle billing across every host the burst launched. This is the main AWS cost
# lever against the free lab baseline. The site pool overrides it below.
gitlab_runner_aws_qemu_idle_time: "2m"
