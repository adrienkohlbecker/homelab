# Test-only overlay loaded with -e after host_vars/lab.yml for Lab QEMU runs.
qemu_test: true

# The QEMU NIC is not VLAN-trunked; its user network and `network.*` vars share
# the test supernet, so the derived per-host macvlan block remains reachable.
macvlan_blocks:
  - name: mac_iot
    parent: "{{ ansible_facts.interfaces | select('match', '^en') | sort | first }}"
    vlan: iot
    podman_network: true

has_transcoding_acceleration: false

# Match QEMU's single virtio NIC by name instead of Lab's physical MACs.
netplan:
  ethernets:
    en:
      match:
        name: "en*"
      link-local: [] # do not setup random link local address when no dhcp is present
      wakeonlan: true
      dhcp4: true
      dhcp6: false
