[project]
name = "homelab"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
  "ansible>=13.6.0",
  "ansible-lint>=25.11.0",
  "mitogen>=0.3.27",
  "ruff>=0.14.5",
  "yamllint>=1.38.0",
  "tabulate>=0.9.0",
  # for ansible modules
  "jmespath>=1.0.1",          # json_query
  "netaddr>=1.3.0",           # ipmath
  "dnspython>=2.8.0",         # dig
  "pytest>=8.0",
  "check-jsonschema>=0.37.2", # lint:topology (a dep, not uvx, so it's CI-cached)
  "boto3>=1.40.0",            # mise-tasks/ci/{reap-qemu-images,audit-aws}.py (in-process S3/EC2 calls)
]

[tool.ruff]
exclude = [".claude"]
line-length = 120

[tool.ruff.lint]
extend-select = ["B", "I", "PERF", "PIE", "PT", "RET", "RUF", "SIM", "UP"]
# mise usage flags are exposed as lowercase `usage_*` environment variables.
ignore = ["SIM112"]

[tool.pyright]
# Point at the uv venv explicitly: the pyright binary comes from mise's npm
# backend, outside the venv, so PATH-based interpreter discovery can't be
# relied on (CI runs tasks without an activated shell).
venvPath = "."
venv = ".venv"
# Mirrors pytest's pythonpath: unit_tests import test-harness modules
# (machine, testrole, ...) as top-level names.
extraPaths = ["test"]
# First three are pyright's defaults (setting exclude replaces them); notes/
# and zbm-build/ are gitignored in-place clones with their own tooling.
exclude = ["**/node_modules", "**/__pycache__", "**/.*", "notes", "zbm-build"]

[tool.pytest.ini_options]
testpaths = ["unit_tests"]
pythonpath = [".", "test"]
