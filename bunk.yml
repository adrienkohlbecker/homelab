- name: Configure bunk
  hosts: bunk
  strategy: linear
  tasks:
    - name: Configure offsite backup rsync
      tags:
        - offsite_rrsync
      block:
        # Source hosts push bak-tagged datasets through forced-command rrsync
        # keys, confined write-only to /volume1/Backup/<host>.
        - name: Create ak's bin directory
          file:
            path: "{{ ansible_user_dir }}/bin"
            state: directory
            mode: "0755"

        - name: Create ak's cache directory
          file:
            path: "{{ ansible_user_dir }}/.cache"
            state: directory
            mode: "0755"
          register: bunk_cache_dir

        - name: Download the pinned rrsync
          when: not (ansible_check_mode and bunk_cache_dir.changed)
          get_url:
            url: "{{ rrsync_artifact.url }}"
            dest: "{{ ansible_user_dir }}/.cache/rrsync.upstream"
            checksum: "sha256:{{ rrsync_artifact.sha256 }}"
            mode: "0644"
          register: bunk_rrsync_download

        - name: Read the pinned rrsync
          when: not (ansible_check_mode and (bunk_cache_dir.changed or bunk_rrsync_download is changed))
          slurp:
            src: "{{ ansible_user_dir }}/.cache/rrsync.upstream"
          register: bunk_rrsync_upstream

        # Two local edits, applied in one write so the install stays
        # idempotent; mandatory_count fails a version bump whose upstream lines
        # moved instead of silently shipping an unpatched wrapper.
        #   - Shebang: bunk's /usr/bin/python3 (3.8.x). DSM ships no perl, so
        #     the classic Perl rrsync from rsync <= 3.2.3 can't run.
        #   - RSYNC: the SynoCli rsync 3.4.1, since DSM's stock /usr/bin/rsync
        #     3.1.2 is too old to negotiate zstd.
        - name: Install the rrsync wrapper
          when: bunk_rrsync_upstream is not skipped
          copy:
            content: >-
              {{ bunk_rrsync_upstream.content | b64decode
              | regex_replace('\A#!/usr/bin/env python3$', '#!/usr/bin/python3', multiline=true, mandatory_count=1)
              | regex_replace("^RSYNC = '/usr/bin/rsync'$", "RSYNC = '/var/packages/synocli-net/target/bin/rsync'", multiline=true, mandatory_count=1) }}
            dest: "{{ ansible_user_dir }}/bin/rrsync"
            mode: "0755"
            backup: true
            validate: /usr/bin/python3 -m py_compile %s

        # rrsync refuses to run if its restricted root is missing.
        - name: Create the per-source offsite backup roots
          file:
            path: "/volume1/Backup/{{ item.name }}"
            state: directory
            mode: "0755"
          loop: "{{ bunk_offsite_backup_sources }}"
          loop_control:
            label: "{{ item.name }}"

    # bunk is DSM, so roles/user (which manages this fleet-wide) doesn't run
    # here. Mirror its authorized_keys task: the fleet login key (ssh_public_keys)
    # plus bunk's backup-rsync keys (bunk_offsite_backup_sources in host_vars).
    # exclusive so a key removed from the vars is actually revoked -- this is the
    # single source of truth for who can log in as ak. Runs as ak (no become):
    # it manages ak's own ~/.ssh/authorized_keys.
    - name: Manage ak's authorized keys
      authorized_key:
        user: "{{ ansible_user_id }}"
        key: |
          {{ ssh_public_keys | trim }}
          {% for source in bunk_offsite_backup_sources %}
          command="/var/services/homes/ak/bin/rrsync -wo /volume1/Backup/{{ source.name }}",no-agent-forwarding,no-port-forwarding,no-pty,no-user-rc,no-X11-forwarding {{ source.public_key }}
          {% endfor %}
        exclusive: true
      tags:
        - authorized_keys

    # roles/ssh doesn't run here either. Password login would skip the 2FA on the
    # DSM account, and a DSM update or Terminal setting can rewrite sshd_config,
    # so this asserts the one directive rather than templating the whole file.
    - name: Disable SSH password login
      tags:
        - sshd
      block:
        - name: Set PasswordAuthentication
          lineinfile:
            path: /etc/ssh/sshd_config
            regexp: '^#?PasswordAuthentication\s'
            line: PasswordAuthentication no
            backup: true
            validate: /usr/bin/sshd -t -f %s
          become: true
          register: bunk_sshd_config

        - name: Reload sshd
          when: bunk_sshd_config.changed
          systemd:
            name: sshd
            state: reloaded
          become: true

    # Mirrors roles/user. DSM ships no visudo to validate with. The rrsync keys
    # can't reach this: their forced command allows no shell. ansible_become_pass
    # stays in host_vars so a DSM update that drops this file gets it back.
    - name: Sudo without password  # noqa: require-validate
      copy:
        dest: "/etc/sudoers.d/{{ ansible_user_id }}"
        content: "{{ ansible_user_id }} ALL=(ALL) NOPASSWD:ALL\n"
        backup: true
        owner: root
        group: root
        mode: "0400"
      become: true
      tags:
        - sudo

    - name: Configure wireguard
      tags:
        - wireguard
      block:
        - name: Copy wireguard configuration
          template:
            src: "{{ playbook_dir }}/roles/wireguard/templates/wg.conf.j2"
            dest: /etc/wireguard/wg0.conf
            owner: root
            group: root
            mode: "0600"
            backup: true
            validate: grep -qE '^\[(Interface|Peer)\]$' %s
          become: true
          register: wg_conf

        - name: Restart wireguard
          when: wg_conf.changed
          systemd:
            name: pkg-wg-quick@wg0
            state: restarted
          become: true

    # The DSM package is installed out of band through Package Center. Configure
    # it here, then reuse the role's shared headscale registration.
    - name: Configure Tailscale
      tags:
        - tailscale
      block:
        - name: Assert the Tailscale package is installed
          stat:
            path: "{{ tailscale_bin }}"
          register: tailscale_dsm_bin
          failed_when: not tailscale_dsm_bin.stat.exists

        - name: Grant Synology routing permissions once
          command: "{{ tailscale_bin }} configure synology"
          args:
            creates: /var/packages/Tailscale/conf/resource.own
          register: tailscale_dsm_configure
          become: true

        # DSM hardcodes tailscaled's underlay port in its package launcher.
        - name: Pin the underlay port in the package launcher
          lineinfile:
            path: /var/packages/Tailscale/scripts/start-stop-status
            regexp: '^PORT='
            line: 'PORT="{{ tailscale_port }}"'
            backup: true
          register: tailscale_dsm_port
          become: true

        - name: Restart the package after configuration changes
          command: /usr/syno/bin/synosystemctl restart pkgctl-Tailscale.service
          when: tailscale_dsm_configure.changed or tailscale_dsm_port.changed
          changed_when: true
          become: true

        - name: Register against the headscale control plane
          import_role:
            name: tailscale
            tasks_from: register

    # DSM has no certbot package or hook into its certificate store, so bunk uses
    # acme.sh. Its deploy hook logs in through a temporary admin user and, with no
    # description set, replaces DSM's default certificate in place. Let's Encrypt
    # is explicit because the acme.sh default is not in the CAA records.
    - name: Configure the DSM certificate
      tags:
        - acme
      vars:
        acme_home: /usr/local/share/acme.sh
        acme_domain: "{{ inventory_hostname }}.{{ domain }}"
        acme_domain_conf: "{{ acme_home }}/{{ acme_domain }}_ecc/{{ acme_domain }}.conf"
        acme_path: /usr/syno/sbin:/usr/syno/bin:/usr/sbin:/usr/bin:/sbin:/bin
      block:
        - name: Download the pinned acme.sh
          get_url:
            url: "{{ acme_sh_artifact.url }}"
            dest: "{{ ansible_user_dir }}/.cache/acme.sh.tar.gz"
            checksum: "sha256:{{ acme_sh_artifact.sha256 }}"
            mode: "0644"

        # Through bash because DSM mounts /tmp noexec.
        - name: Install acme.sh
          shell: |
            set -euo pipefail
            source_dir=$(mktemp -d)
            trap "rm -rf $source_dir" EXIT
            tar -xzf {{ ansible_user_dir }}/.cache/acme.sh.tar.gz -C "$source_dir" --strip-components=1
            cd "$source_dir"
            bash ./acme.sh --install --nocron --noprofile --home {{ acme_home }} --accountemail {{ root_email }}
            touch {{ acme_home }}/.installed_{{ acme_sh_artifact.version }}
          args:
            executable: /bin/bash
            creates: "{{ acme_home }}/.installed_{{ acme_sh_artifact.version }}"
          become: true

        - name: Check for the acme.sh home
          stat:
            path: "{{ acme_home }}"
          register: bunk_acme_home
          become: true

        - name: Configure and schedule acme.sh
          when: bunk_acme_home.stat.exists
          block:
            - name: Write the Cloudflare token  # noqa: require-validate
              copy:
                dest: "{{ acme_home }}/cloudflare.env"
                content: "CF_Token={{ cloudflare_api_token }}\n"
                owner: root
                group: root
                mode: "0600"
                backup: true
              become: true

            # A fixed wait because acme.sh otherwise polls public DNS-over-HTTPS
            # resolvers, whose names AdGuard's blocklist answers with 0.0.0.0, until
            # it gives up after 20 minutes. Renewals reuse the saved value.
            - name: Issue the certificate
              shell: |
                set -euo pipefail
                set -a
                . {{ acme_home }}/cloudflare.env
                set +a
                {{ acme_home }}/acme.sh --issue --home {{ acme_home }} --server letsencrypt \
                  --keylength ec-256 --dns dns_cf --dnssleep 30 -d {{ acme_domain }} -d "*.{{ acme_domain }}"
              args:
                executable: /bin/bash
                creates: "{{ acme_home }}/{{ acme_domain }}_ecc/fullchain.cer"
              become: true

            # The domain's saved deploy hook is what makes renewals deploy, so a
            # run interrupted before it is recorded deploys again here.
            - name: Deploy the certificate to DSM
              shell: |
                set -euo pipefail
                if grep -q "^Le_DeployHook=.*synology_dsm" {{ acme_domain_conf }}; then
                  exit 0
                fi
                PATH={{ acme_path }} SYNO_USE_TEMP_ADMIN=1 {{ acme_home }}/acme.sh --deploy --home {{ acme_home }} \
                  --ecc -d {{ acme_domain }} --deploy-hook synology_dsm
                echo acme_deployed
              args:
                executable: /bin/bash
              register: bunk_acme_deploy
              changed_when: "'acme_deployed' in bunk_acme_deploy.stdout"
              become: true

            # A timer because DSM rewrites /etc/crontab. Persistent catches up
            # after downtime, and acme.sh only renews once a certificate is due.
            - name: Write the renewal units  # noqa: require-validate
              copy:
                dest: "/usr/local/lib/systemd/system/{{ item.name }}"
                content: "{{ item.content }}"
                owner: root
                group: root
                mode: "0644"
                backup: true
              loop:
                - name: acme_renew.service
                  content: |
                    [Unit]
                    Description=Renew and deploy the DSM certificate
                    After=network-online.target

                    [Service]
                    Type=oneshot
                    Environment=PATH={{ acme_path }}
                    EnvironmentFile={{ acme_home }}/cloudflare.env
                    ExecStart={{ acme_home }}/acme.sh --cron --home {{ acme_home }}
                - name: acme_renew.timer
                  content: |
                    [Unit]
                    Description=Renew and deploy the DSM certificate daily

                    [Timer]
                    OnCalendar=*-*-* 09:13:00
                    Persistent=true

                    [Install]
                    WantedBy=timers.target
              loop_control:
                label: "{{ item.name }}"
              register: bunk_acme_units
              become: true

            - name: Enable the renewal timer
              systemd:
                name: acme_renew.timer
                enabled: true
                state: started
                daemon_reload: "{{ bunk_acme_units.changed }}"
              become: true

    - name: Configure Ghostty terminfo
      tags:
        - terminfo
      block:
        # bunk lacks tic/infocmp, so ship the precompiled entry built beside the
        # source terminfo in roles/user/files/.
        - name: Create the per-user terminfo directory
          file:
            path: "{{ ansible_user_dir }}/.terminfo/x"
            state: directory
            mode: "0755"

        - name: Install the xterm-ghostty terminfo entry
          copy:
            src: "{{ playbook_dir }}/roles/user/files/xterm-ghostty"
            dest: "{{ ansible_user_dir }}/.terminfo/x/xterm-ghostty"
            mode: "0644"
            backup: true
