---
# Conditions whose opposite branch requires a platform or external state that
# the local QEMU matrix cannot safely provide. Each case evaluates the exact
# current Ansible expression; stale selectors or incorrect expected outcomes
# fail the gate.
scenarios:
  # Ubuntu release variants
  - path: roles/apt/tasks/configure.yml
    expression: ansible_distribution_version is version('25.10', '>=')
    all: true
    cases:
      - outcome: false
        variables:
          ansible_distribution_version: "24.04"
      - outcome: true
        variables:
          ansible_distribution_version: "25.10"

  - path: roles/apt/tasks/configure.yml
    expression: apt_coreutils_from_gnu.rc != 0 or 'install ok installed' not in apt_coreutils_from_gnu.stdout
    cases:
      - outcome: false
        variables:
          apt_coreutils_from_gnu:
            rc: 0
            stdout: install ok installed
      - outcome: true
        variables:
          apt_coreutils_from_gnu:
            rc: 1
            stdout: ""

  # Architecture variants
  - path: roles/jellyfin/tasks/main.yml
    expression: jellyfin_transcoding_backend == 'intel_qsv'
    all: true
    cases:
      - outcome: false
        variables:
          jellyfin_transcoding_backend: software
      - outcome: true
        variables:
          jellyfin_transcoding_backend: intel_qsv

  - path: roles/kdump/tasks/main.yml
    expression: ansible_architecture == 'x86_64'
    cases:
      - outcome: false
        variables:
          ansible_architecture: aarch64
      - outcome: true
        variables:
          ansible_architecture: x86_64

  - path: roles/netdata/tasks/configure.yml
    expression: netdata_intelgpu_enabled
    cases:
      - outcome: false
        variables:
          netdata_intelgpu_enabled: false
      - outcome: true
        variables:
          netdata_intelgpu_enabled: true

  - path: roles/netdata/tasks/configure.yml
    expression: ansible_architecture == "x86_64"
    cases:
      - outcome: false
        variables:
          ansible_architecture: aarch64
      - outcome: true
        variables:
          ansible_architecture: x86_64

  - path: roles/netdata/tasks/configure.yml
    expression: not (netdata_intelgpu_enabled and ansible_architecture == "x86_64")
    all: true
    cases:
      - outcome: false
        variables:
          netdata_intelgpu_enabled: true
          ansible_architecture: x86_64
      - outcome: true
        variables:
          netdata_intelgpu_enabled: false
          ansible_architecture: aarch64

  - path: roles/refind/tasks/main.yml
    expression: boot_via_efi_stub
    all: true
    cases:
      - outcome: false
        variables:
          boot_via_efi_stub: false
      - outcome: true
        variables:
          boot_via_efi_stub: true

  - path: roles/user/tasks/main.yml
    expression: ansible_architecture == "x86_64"
    cases:
      - outcome: false
        variables:
          ansible_architecture: aarch64
      - outcome: true
        variables:
          ansible_architecture: x86_64

  - path: roles/zfsbootmenu/tasks/main.yml
    expression: ansible_architecture == "aarch64"
    cases:
      - outcome: false
        variables:
          ansible_architecture: x86_64
      - outcome: true
        variables:
          ansible_architecture: aarch64

  # Production versus QEMU variants
  - path: roles/gitea/tasks/main.yml
    expression: not qemu_test
    cases:
      - outcome: false
        variables:
          qemu_test: true
      - outcome: true
        variables:
          qemu_test: false

  - path: roles/jellyfin/tasks/main.yml
    expression: not qemu_test
    all: true
    cases:
      - outcome: false
        variables:
          qemu_test: true
      - outcome: true
        variables:
          qemu_test: false

  - path: roles/jellyfin/tasks/main.yml
    expression: not (qemu_test | default(false))
    cases:
      - outcome: false
        variables:
          qemu_test: true
      - outcome: true
        variables:
          qemu_test: false

  - path: roles/macos_vm/tasks/main.yml
    expression: qemu_test | bool
    cases:
      - outcome: false
        variables:
          qemu_test: false
      - outcome: true
        variables:
          qemu_test: true

  - path: roles/media/tasks/main.yml
    expression: qemu_test
    cases:
      - outcome: false
        variables:
          qemu_test: false
      - outcome: true
        variables:
          qemu_test: true

  - path: roles/nut/tasks/server.yml
    expression: qemu_test | bool
    cases:
      - outcome: false
        variables:
          qemu_test: false
      - outcome: true
        variables:
          qemu_test: true

  - path: roles/zfs_autobackup/tasks/dest.yml
    expression: not qemu_test
    all: true
    cases:
      - outcome: false
        variables:
          qemu_test: true
      - outcome: true
        variables:
          qemu_test: false

  - path: roles/zfs_autobackup/tasks/dest.yml
    expression: not qemu_test and zfs_autobackup_keyscan_result.stdout | default('') | length > 0
    cases:
      - outcome: false
        variables:
          qemu_test: true
          zfs_autobackup_keyscan_result: {}
      - outcome: true
        variables:
          qemu_test: false
          zfs_autobackup_keyscan_result:
            stdout: ssh-ed25519 test-key

  # Hardware-dependent feature variants
  - path: roles/fan2go/tasks/main.yml
    expression: fan2go_enabled
    all: true
    cases:
      - outcome: false
        variables:
          fan2go_enabled: false
      - outcome: true
        variables:
          fan2go_enabled: true

  - path: roles/fan2go/tasks/main.yml
    expression: not fan2go_enabled
    cases:
      - outcome: false
        variables:
          fan2go_enabled: true
      - outcome: true
        variables:
          fan2go_enabled: false

  - path: roles/fan2go/tasks/main.yml
    expression: not (ansible_check_mode and (fan2go_binary_download.changed | default(false)))
    cases:
      - outcome: false
        variables:
          ansible_check_mode: true
          fan2go_binary_download:
            changed: true
      - outcome: true
        variables:
          ansible_check_mode: false
          fan2go_binary_download: {}

  - path: roles/fan2go/tasks/main.yml
    expression: not (ansible_check_mode and (fan2go_tui_binary_download.changed | default(false)))
    cases:
      - outcome: false
        variables:
          ansible_check_mode: true
          fan2go_tui_binary_download:
            changed: true
      - outcome: true
        variables:
          ansible_check_mode: false
          fan2go_tui_binary_download: {}

  - path: roles/fan2go/tasks/main.yml
    expression: not (ansible_check_mode and fan2go_config_directories.changed)
    all: true
    cases:
      - outcome: false
        variables:
          ansible_check_mode: true
          fan2go_config_directories:
            changed: true
      - outcome: true
        variables:
          ansible_check_mode: false
          fan2go_config_directories:
            changed: true

  - path: roles/fan2go/tasks/main.yml
    expression: not ansible_check_mode
    cases:
      - outcome: false
        variables:
          ansible_check_mode: true
      - outcome: true
        variables:
          ansible_check_mode: false

  - path: roles/headscale/tasks/main.yml
    expression: headscale_derp_ipv4 is defined and headscale_derp_ipv6 is defined
    cases:
      - outcome: false
        variables: {}
      - outcome: true
        variables:
          headscale_derp_ipv4: 192.0.2.1
          headscale_derp_ipv6: 2001:db8::1

  - path: roles/lm_sensors/tasks/main.yml
    expression: lm_sensors_dropped_loaded.results | default([]) | selectattr('rc', 'defined') | selectattr('rc', 'eq', 0) | list | length > 0
    cases:
      - outcome: false
        variables:
          lm_sensors_dropped_loaded:
            results: []
      - outcome: true
        variables:
          lm_sensors_dropped_loaded:
            results:
              - rc: 0

  - path: roles/lm_sensors/tasks/main.yml
    expression: lm_sensors_hwmon.matched | int > 0
    cases:
      - outcome: false
        variables:
          lm_sensors_hwmon:
            matched: 0
      - outcome: true
        variables:
          lm_sensors_hwmon:
            matched: 1

  # macOS installer mode requires external recovery artifacts and VM firmware.
  - path: roles/macos_vm/tasks/artifacts.yml
    expression: macos_vm_install_mode
    all: true
    cases:
      - outcome: false
        variables:
          macos_vm_install_mode: false
      - outcome: true
        variables:
          macos_vm_install_mode: true

  - path: roles/macos_vm/tasks/artifacts.yml
    expression: not (ansible_check_mode and macos_vm_artifacts_dir_result.changed)
    all: true
    cases:
      - outcome: false
        variables:
          ansible_check_mode: true
          macos_vm_artifacts_dir_result:
            changed: true
      - outcome: true
        variables:
          ansible_check_mode: false
          macos_vm_artifacts_dir_result:
            changed: true

  - path: roles/macos_vm/tasks/artifacts.yml
    expression: not (ansible_check_mode and (macos_vm_artifacts_dir_result.changed or macos_vm_workdir_result.changed))
    cases:
      - outcome: false
        variables:
          ansible_check_mode: true
          macos_vm_artifacts_dir_result:
            changed: true
          macos_vm_workdir_result:
            changed: false
      - outcome: true
        variables:
          ansible_check_mode: false
          macos_vm_artifacts_dir_result:
            changed: true
          macos_vm_workdir_result:
            changed: true

  - path: roles/macos_vm/tasks/artifacts.yml
    expression: not (ansible_check_mode and (macos_vm_workdir_result.changed or macos_vm_basesystem_result.changed | default(false)))
    cases:
      - outcome: false
        variables:
          ansible_check_mode: true
          macos_vm_workdir_result:
            changed: true
          macos_vm_basesystem_result: {}
      - outcome: true
        variables:
          ansible_check_mode: false
          macos_vm_workdir_result:
            changed: false
          macos_vm_basesystem_result: {}

  - path: roles/macos_vm/tasks/artifacts.yml
    expression: not (ansible_check_mode and macos_vm_workdir_result.changed)
    cases:
      - outcome: false
        variables:
          ansible_check_mode: true
          macos_vm_workdir_result:
            changed: true
      - outcome: true
        variables:
          ansible_check_mode: false
          macos_vm_workdir_result:
            changed: true

  - path: roles/macos_vm/tasks/artifacts.yml
    expression: not (ansible_check_mode and (macos_vm_basesystem_result.changed | default(false)))
    cases:
      - outcome: false
        variables:
          ansible_check_mode: true
          macos_vm_basesystem_result:
            changed: true
      - outcome: true
        variables:
          ansible_check_mode: false
          macos_vm_basesystem_result: {}

  - path: roles/macos_vm/tasks/artifacts.yml
    expression: not (ansible_check_mode and (macos_vm_basesystem_convert_result.changed | default(false)))
    cases:
      - outcome: false
        variables:
          ansible_check_mode: true
          macos_vm_basesystem_convert_result:
            changed: true
      - outcome: true
        variables:
          ansible_check_mode: false
          macos_vm_basesystem_convert_result: {}

  # OIDC drift and migration states are unsafe to synthesize against live apps.
  - path: roles/gitea/tasks/main.yml
    expression: gitea_oidc_desired_fp != gitea_oidc_current_fp
    cases:
      - outcome: false
        variables:
          gitea_oidc_desired_fp: same
          gitea_oidc_current_fp: same
      - outcome: true
        variables:
          gitea_oidc_desired_fp: desired
          gitea_oidc_current_fp: current

  - path: roles/gitea/tasks/main.yml
    expression: gitea_authelia_source_id | length == 0
    cases:
      - outcome: false
        variables:
          gitea_authelia_source_id: "1"
      - outcome: true
        variables:
          gitea_authelia_source_id: ""

  - path: roles/gitea/tasks/main.yml
    expression: gitea_authelia_source_id | length > 0
    cases:
      - outcome: false
        variables:
          gitea_authelia_source_id: ""
      - outcome: true
        variables:
          gitea_authelia_source_id: "1"

  - path: roles/jellyfin/tasks/main.yml
    expression: jellyfin_oidc_desired_fp != jellyfin_oidc_current_fp
    all: true
    cases:
      - outcome: false
        variables:
          jellyfin_oidc_desired_fp: same
          jellyfin_oidc_current_fp: same
      - outcome: true
        variables:
          jellyfin_oidc_desired_fp: desired
          jellyfin_oidc_current_fp: current

  # Fresh-check and external-state variants
  - path: roles/apt_source/tasks/configure.yml
    expression: apt_deb822_available | default(true)
    cases:
      - outcome: false
        variables:
          apt_deb822_available: false
      - outcome: true
        variables:
          apt_deb822_available: true

  - path: roles/authelia/tasks/main.yml
    expression: not ansible_check_mode or authelia_podman_available
    cases:
      - outcome: false
        variables:
          ansible_check_mode: true
          authelia_podman_available: false
      - outcome: true
        variables:
          ansible_check_mode: false
          authelia_podman_available: false

  - path: roles/headscale/tasks/main.yml
    expression: not ansible_check_mode or headscale_podman_available
    cases:
      - outcome: false
        variables:
          ansible_check_mode: true
          headscale_podman_available: false
      - outcome: true
        variables:
          ansible_check_mode: false
          headscale_podman_available: false

  - path: roles/influxdb/tasks/main.yml
    expression: not ansible_check_mode or influxdb_podman_available
    all: true
    cases:
      - outcome: false
        variables:
          ansible_check_mode: true
          influxdb_podman_available: false
      - outcome: true
        variables:
          ansible_check_mode: false
          influxdb_podman_available: false

  - path: roles/influxdb/tasks/main.yml
    expression: influxdb_bolt_db.stat.exists
    cases:
      - outcome: false
        variables:
          influxdb_bolt_db:
            stat:
              exists: false
      - outcome: true
        variables:
          influxdb_bolt_db:
            stat:
              exists: true

  - path: roles/influxdb/tasks/main.yml
    expression: _influxdb_root_password_secret.changed | default(false)
    cases:
      - outcome: false
        variables:
          _influxdb_root_password_secret: {}
      - outcome: true
        variables:
          _influxdb_root_password_secret:
            changed: true

  - path: roles/homeassistant/tasks/main.yml
    expression: not (ansible_check_mode and (homeassistant_hacs_dir.changed or homeassistant_hacs_download.changed | default(false)))
    cases:
      - outcome: false
        variables:
          ansible_check_mode: true
          homeassistant_hacs_dir:
            changed: true
          homeassistant_hacs_download: {}
      - outcome: true
        variables:
          ansible_check_mode: false
          homeassistant_hacs_dir:
            changed: true
          homeassistant_hacs_download: {}

  - path: roles/homeassistant/tasks/main.yml
    expression: homeassistant_unit_file.stat.exists
    cases:
      - outcome: false
        variables:
          homeassistant_unit_file:
            stat:
              exists: false
      - outcome: true
        variables:
          homeassistant_unit_file:
            stat:
              exists: true

  - path: roles/kuma/tasks/main.yml
    expression: kuma_disableauth_seed.changed | default(false)
    cases:
      - outcome: false
        variables:
          kuma_disableauth_seed: {}
      - outcome: true
        variables:
          kuma_disableauth_seed:
            changed: true

  - path: roles/locale/tasks/main.yml
    expression: not (ansible_check_mode and locale_apt.changed)
    all: true
    cases:
      - outcome: false
        variables:
          ansible_check_mode: true
          locale_apt:
            changed: true
      - outcome: true
        variables:
          ansible_check_mode: false
          locale_apt:
            changed: true

  - path: roles/locale/tasks/main.yml
    expression: locale_cfg.changed
    cases:
      - outcome: false
        variables:
          locale_cfg:
            changed: false
      - outcome: true
        variables:
          locale_cfg:
            changed: true

  - path: roles/mutt/tasks/main.yml
    expression: not ansible_check_mode or _mutt_getmail_maildir.stat.exists
    cases:
      - outcome: false
        variables:
          ansible_check_mode: true
          _mutt_getmail_maildir:
            stat:
              exists: false
      - outcome: true
        variables:
          ansible_check_mode: false
          _mutt_getmail_maildir:
            stat:
              exists: false

  - path: roles/transmission/tasks/main.yml
    expression: not ansible_check_mode or transmission_podman_available
    cases:
      - outcome: false
        variables:
          ansible_check_mode: true
          transmission_podman_available: false
      - outcome: true
        variables:
          ansible_check_mode: false
          transmission_podman_available: false

  - path: roles/user/tasks/main.yml
    expression: ansible_user_id != "root"
    cases:
      - outcome: false
        variables:
          ansible_user_id: root
      - outcome: true
        variables:
          ansible_user_id: ubuntu

  - path: roles/zfs_autobackup/tasks/dest.yml
    expression: zfs_root
    all: true
    cases:
      - outcome: false
        variables:
          zfs_root: false
      - outcome: true
        variables:
          zfs_root: true

  - path: roles/zfs_autobackup/tasks/source.yml
    expression: zfs_root
    cases:
      - outcome: false
        variables:
          zfs_root: false
      - outcome: true
        variables:
          zfs_root: true

  - path: roles/zfs_autobackup/tasks/identity.yml
    expression: not (ansible_check_mode and zfs_autobackup_identity_directory.changed)
    all: true
    cases:
      - outcome: false
        variables:
          ansible_check_mode: true
          zfs_autobackup_identity_directory:
            changed: true
      - outcome: true
        variables:
          ansible_check_mode: false
          zfs_autobackup_identity_directory:
            changed: true

  - path: roles/zfs_dataset/tasks/dataset.yml
    expression: (zfs_dataset_args.extra_properties | default({})) | length > 0
    all: true
    cases:
      - outcome: false
        variables:
          zfs_dataset_args: {}
      - outcome: true
        variables:
          zfs_dataset_args:
            extra_properties:
              compression: zstd

  - path: roles/zfs_dataset/tasks/dataset.yml
    expression: __prop_line.split()[1] != 'local'
    cases:
      - outcome: false
        variables:
          __prop_line: compression local
      - outcome: true
        variables:
          __prop_line: compression received

  - path: roles/zfsbootmenu/tasks/main.yml
    expression: zfsbootmenu_common_artifact_install is changed or (zfsbootmenu_aarch64_component_install is defined and zfsbootmenu_aarch64_component_install is changed)
    cases:
      - outcome: false
        variables:
          zfsbootmenu_common_artifact_install:
            changed: false
      - outcome: true
        variables:
          zfsbootmenu_common_artifact_install:
            changed: true
