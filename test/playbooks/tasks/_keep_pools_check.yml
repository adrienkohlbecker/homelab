# Checks after booting a root, for test/playbooks/_keep_pools.yml.
# _kp_expected_release and _kp_expected_root name the root that should be
# running; _kp_compare_fingerprint also requires the shared storage and
# identity to read back exactly as they did before the install.
- name: Read the running release
  command: awk -F= '$1 == "VERSION_CODENAME" { print $2 }' /etc/os-release
  register: _kp_release
  changed_when: false

- name: Read the running root
  command: findmnt -no SOURCE /
  register: _kp_root
  changed_when: false

- name: The expected root is running
  assert:
    that:
      - _kp_release.stdout == _kp_expected_release
      - _kp_root.stdout == _kp_expected_root

# Every service on the shared storage needs the boot to complete: pool
# imports, md assembly, the ESP and swap mounts, and the mount generator's
# units for the shared datasets all report through this. Bounded as the
# harness bounds it (SYSTEM_RUNNING_WAIT_TIMEOUT in test/machine.py), so a
# wedged start fails here with its pending jobs.
- name: Wait for the boot to settle
  command: timeout 600 systemctl is-system-running --wait
  register: _kp_system_state
  changed_when: false
  failed_when: false

- name: List failed units
  command: systemctl --failed --no-legend --plain  # noqa: command-instead-of-module
  register: _kp_failed_units
  changed_when: false

- name: List pending jobs
  command: systemctl list-jobs --no-legend  # noqa: command-instead-of-module
  register: _kp_pending_jobs
  changed_when: false

- name: The boot completed without failed units
  assert:
    that: _kp_system_state.stdout == 'running'
    fail_msg: |-
      rc={{ _kp_system_state.rc }} state={{ _kp_system_state.stdout }}
      failed units:
      {{ _kp_failed_units.stdout }}
      pending jobs:
      {{ _kp_pending_jobs.stdout }}

- name: Read the pool health
  command: zpool status -x
  register: _kp_pool_health
  changed_when: false

- name: Every pool imported healthy
  assert:
    that: _kp_pool_health.stdout == 'all pools are healthy'
    fail_msg: "{{ _kp_pool_health.stdout }}"

- name: List the imported pools
  command: zpool list -H -o name
  register: _kp_imported_pools
  changed_when: false

- name: Read the pools from before the install
  slurp:
    src: "{{ _kp_dir }}/pools"
  register: _kp_expected_pools

- name: Every pool imported
  assert:
    that: _kp_imported_pools.stdout_lines == (_kp_expected_pools.content | b64decode).splitlines()
    fail_msg: "imported: {{ _kp_imported_pools.stdout_lines }}"

# The rebuild keeps the login user's ids, which own its files on the shared
# storage.
- name: The login user reads its own file on the shared storage
  become: false
  command: cat {{ _kp_dir }}/login_user_file
  changed_when: false

- name: Read every canary
  command: cat /mnt/kp_canary_{{ item }}/canary
  register: _kp_canaries
  changed_when: false
  loop: "{{ _kp_imported_pools.stdout_lines }}"

- name: Every pool's canary dataset mounted with its contents
  assert:
    that: _kp_canaries.results | map(attribute='stdout') | list == _kp_imported_pools.stdout_lines

- name: Compare the shared storage with before the install
  when: _kp_compare_fingerprint | bool
  block:
    - name: Fingerprint the shared storage
      command: bash {{ _kp_dir }}/keep_pools_fingerprint.sh {{ _kp_new_root }} {{ keep_pools_user }}
      register: _kp_fingerprint
      changed_when: false

    - name: Read the fingerprint from before the install
      slurp:
        src: "{{ _kp_dir }}/fingerprint.before"
      register: _kp_fingerprint_before

    - name: The shared storage reads back as before the install
      assert:
        that: _kp_fingerprint.stdout == (_kp_fingerprint_before.content | b64decode | trim)
        fail_msg: |-
          before:
          {{ _kp_fingerprint_before.content | b64decode }}
          now:
          {{ _kp_fingerprint.stdout }}
