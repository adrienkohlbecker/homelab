- name: Select the service account for alternate unit rendering
  set_fact:
    _storage_account_name: "{{ _storage_user | default(_storage_service) }}"

- name: Resolve the service account for alternate unit rendering
  getent:
    database: passwd
    key: "{{ _storage_account_name }}"

- name: Publish the service account for the production unit template
  set_fact:
    "{{ _storage_service }}_user":
      uid: "{{ ansible_facts.getent_passwd[_storage_account_name][1] }}"
      gid: "{{ ansible_facts.getent_passwd[_storage_account_name][2] }}"

- name: Resolve the shared group for alternate unit rendering
  when: _storage_group is defined
  getent:
    database: group
    key: "{{ _storage_group }}"

- name: Publish the shared group for the production unit template
  when: _storage_group is defined
  set_fact:
    "{{ _storage_group }}_group":
      gid: "{{ ansible_facts.getent_group[_storage_group][1] }}"

- name: Render production units for alternate storage layouts
  set_fact:
    _storage_units: >-
      {{ _storage_units | default({})
         | combine({item.name: lookup('template', role_path ~ '/templates/' ~ _storage_service ~ '.service.j2')}) }}
  vars:
    zfs_root: "{{ item.zfs_root }}"
    zfs_has_services_mount: "{{ item.zfs_root }}"
    zfs_has_scratch_mount: "{{ item.zfs_root }}"
    zfs_has_media_mount: "{{ item.zfs_root }}"
  loop:
    - name: ext4
      zfs_root: false
    - name: zfs_datasets
      zfs_root: true

- name: Verify alternate autosnapshot dependencies
  assert:
    that:
      - "'After=zfs_autosnapshot.target' not in _storage_units.ext4"
      - "'WantedBy=zfs_autosnapshot.target' not in _storage_units.ext4"
      - "('After=zfs_autosnapshot.target' in _storage_units.zfs_datasets) == (_storage_autosnapshot | default(true) | bool)"
      - "('WantedBy=zfs_autosnapshot.target' in _storage_units.zfs_datasets) == (_storage_autosnapshot | default(true) | bool)"

- name: Verify alternate storage mount dependencies
  assert:
    that:
      - "('After=zfs_mount_mnt_' ~ item ~ '.service') not in _storage_units.ext4"
      - "('Requires=zfs_mount_mnt_' ~ item ~ '.service') not in _storage_units.ext4"
      - "('After=zfs_mount_mnt_' ~ item ~ '.service') in _storage_units.zfs_datasets"
      - "('Requires=zfs_mount_mnt_' ~ item ~ '.service') in _storage_units.zfs_datasets"
  loop: "{{ _storage_mounts }}"
