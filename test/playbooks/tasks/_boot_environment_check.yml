# Checks after booting into a boot environment, for
# test/playbooks/_boot_environment.yml. _be_expected_release and
# _be_expected_root name the root that should be running;
# _be_compare_fingerprint also requires the shared storage to read back exactly
# as it did before the install.
- name: Read the running release
  command: awk -F= '$1 == "VERSION_CODENAME" { print $2 }' /etc/os-release
  register: _be_release
  changed_when: false

- name: Read the running root
  command: findmnt -no SOURCE /
  register: _be_root
  changed_when: false

- name: The expected root is running
  assert:
    that:
      - _be_release.stdout == _be_expected_release
      - _be_root.stdout == _be_expected_root

# Every service on the shared storage needs the boot to complete: pool
# imports, md assembly, the ESP and swap mounts, and the mount generator's
# units for the shared datasets all report through this.
- name: Wait for the boot to settle
  command: systemctl is-system-running --wait  # noqa: command-instead-of-module
  register: _be_system_state
  changed_when: false
  failed_when: false

- name: List failed units
  command: systemctl --failed --no-legend --plain  # noqa: command-instead-of-module
  register: _be_failed_units
  changed_when: false

- name: The boot completed without failed units
  assert:
    that: _be_system_state.stdout == 'running'
    fail_msg: "{{ _be_system_state.stdout }}: {{ _be_failed_units.stdout }}"

- name: Read the pool health
  command: zpool status -x
  register: _be_pool_health
  changed_when: false

- name: Every pool imported healthy
  assert:
    that: _be_pool_health.stdout == 'all pools are healthy'
    fail_msg: "{{ _be_pool_health.stdout }}"

- name: List the imported pools
  command: zpool list -H -o name
  register: _be_imported_pools
  changed_when: false

- name: Read the pools from before the install
  slurp:
    src: "{{ _be_dir }}/pools"
  register: _be_expected_pools

- name: Every pool imported
  assert:
    that: _be_imported_pools.stdout_lines == (_be_expected_pools.content | b64decode).splitlines()
    fail_msg: "imported: {{ _be_imported_pools.stdout_lines }}"

- name: Read every canary
  command: cat /mnt/be_canary_{{ item }}/canary
  register: _be_canaries
  changed_when: false
  loop: "{{ _be_imported_pools.stdout_lines }}"

- name: Every pool's canary dataset mounted with its contents
  assert:
    that: _be_canaries.results | map(attribute='stdout') | list == _be_imported_pools.stdout_lines

- name: Read the carried file
  slurp:
    src: /etc/boot_environment_carried
  register: _be_carried

- name: The carried file is in the running root
  assert:
    that: _be_carried.content | b64decode == 'carried\n'

- name: Fingerprint the shared storage
  command: bash {{ _be_dir }}/boot_environment_fingerprint.sh {{ _be_new_root }} {{ _be_user.stdout }}
  register: _be_fingerprint
  changed_when: false

- name: Read the fingerprint from before the install
  slurp:
    src: "{{ _be_dir }}/fingerprint.before"
  register: _be_fingerprint_before

- name: The shared storage reads back as before the install
  assert:
    that: _be_fingerprint.stdout == (_be_fingerprint_before.content | b64decode | trim)
    fail_msg: |-
      before:
      {{ _be_fingerprint_before.content | b64decode }}
      now:
      {{ _be_fingerprint.stdout }}
  when: _be_compare_fingerprint | bool
