- name: Prepare the test environment
  hosts: all
  tasks:
    # Exercise lazy production variables through Ansible under the environment
    # variants that one physical QEMU cell cannot represent simultaneously.
    - name: Verify physical console rendering without a serial console
      vars:
        qemu_test: false
        boot_serial_console: ""
      assert:
        that:
          - _console_serial | trim == ''
          - _console_cmdline == 'console=tty0'

    - name: Verify physical console rendering keeps tty0 last
      vars:
        qemu_test: false
        boot_serial_console: earlycon=uart8250,io,0x3f8 console=ttyS0,115200
      assert:
        that:
          - _console_cmdline == 'earlycon=uart8250,io,0x3f8 console=ttyS0,115200 console=tty0'

    - name: Verify ARM QEMU console rendering
      vars:
        qemu_test: true
        ansible_architecture: aarch64
      assert:
        that:
          - _console_serial | trim == 'earlycon=pl011,0x9000000,115200 console=ttyAMA0,115200'
          - _console_cmdline == 'console=tty0 earlycon=pl011,0x9000000,115200 console=ttyAMA0,115200'

    - name: Verify x86 QEMU console rendering
      vars:
        qemu_test: true
        ansible_architecture: x86_64
      assert:
        that:
          - _console_serial | trim == 'earlycon=uart8250,io,0x3f8 console=ttyS0,115200'
          - _console_cmdline == 'console=tty0 earlycon=uart8250,io,0x3f8 console=ttyS0,115200'

    - name: Verify x86 Nexus mirror rendering
      vars:
        ansible_architecture: x86_64
        nexus_url: nexus.fixture.invalid
        test_in_aws: false
      assert:
        that:
          - mirror_apt_ubuntu_archive == 'http://nexus.fixture.invalid/repository/ubuntu-archive'
          - mirror_apt_ubuntu_security == 'http://nexus.fixture.invalid/repository/ubuntu-security'
          - mirror_apt_ubuntu_ports == 'http://nexus.fixture.invalid/repository/ubuntu-ports'
          - mirror_apt_netdata == 'https://nexus.fixture.invalid/repository/netdata'
          - mirror_apt_fluentbit == 'https://nexus.fixture.invalid/repository/fluentbit'
          - mirror_apt_docker == 'https://nexus.fixture.invalid/repository/docker-ce'
          - mirror_apt_tailscale == 'https://nexus.fixture.invalid/repository/tailscale'
          - mirror_apt_mise == 'https://nexus.fixture.invalid/repository/mise'
          - mirror_apt_1password == 'https://nexus.fixture.invalid/repository/1password'
          - mirror_github == 'https://nexus.fixture.invalid/repository/github'
          - mirror_gitlab == 'https://nexus.fixture.invalid/repository/gitlab'
          - mirror_raw_githubusercontent == 'https://nexus.fixture.invalid/repository/raw-githubusercontent'
          - mirror_gitea_dl == 'https://nexus.fixture.invalid/repository/gitea-dl'
          - ubuntu_mirror == 'http://nexus.fixture.invalid/repository/ubuntu-archive/'
          - ubuntu_mirror_security == 'http://nexus.fixture.invalid/repository/ubuntu-security/'
          - test_registry_mirrors['docker.io'] == 'nexus.fixture.invalid/docker.io'
          - test_dot_servers == [prod_network.virtual_ips.dns ~ '#dns.fahm.fr']

    - name: Verify ARM Nexus mirror rendering
      vars:
        ansible_architecture: aarch64
        nexus_url: nexus.fixture.invalid
        test_in_aws: false
      assert:
        that:
          - mirror_apt_1password == 'https://downloads.1password.com/linux/debian/arm64'
          - ubuntu_mirror == 'http://nexus.fixture.invalid/repository/ubuntu-ports/'
          - ubuntu_mirror_security == 'http://nexus.fixture.invalid/repository/ubuntu-ports/'

    - name: Verify AWS upstream mirror rendering
      vars:
        ansible_architecture: x86_64
        bootstrap_dns_resolver: [ 1.1.1.1, 1.0.0.1 ]
        nexus_url: ""
        test_aws_region: eu-test-1
        test_ecr_registry: registry.fixture.invalid
        test_in_aws: true
      assert:
        that:
          - mirror_apt_ubuntu_archive == 'http://eu-test-1.ec2.archive.ubuntu.com/ubuntu'
          - mirror_apt_ubuntu_security == 'http://eu-test-1.ec2.archive.ubuntu.com/ubuntu'
          - mirror_apt_ubuntu_ports == 'http://ports.ubuntu.com/ubuntu-ports'
          - mirror_apt_netdata == 'https://repo.netdata.cloud/repos/stable/ubuntu'
          - mirror_apt_fluentbit == 'https://packages.fluentbit.io/ubuntu'
          - mirror_apt_docker == 'https://download.docker.com/linux/ubuntu'
          - mirror_apt_tailscale == 'https://pkgs.tailscale.com/stable/ubuntu'
          - mirror_apt_mise == 'https://mise.en.dev/deb'
          - mirror_apt_1password == 'https://downloads.1password.com/linux/debian/amd64'
          - mirror_github == 'https://github.com'
          - mirror_gitlab == 'https://gitlab.com'
          - mirror_raw_githubusercontent == 'https://raw.githubusercontent.com'
          - mirror_gitea_dl == 'https://dl.gitea.com'
          - test_dot_servers == bootstrap_dns_resolver
          - test_registry_mirrors['docker.io'] == 'registry.fixture.invalid/docker-hub'
          - test_registry_mirrors['ghcr.io'] == 'registry.fixture.invalid/github'
          - test_registry_mirrors['registry.gitlab.com'] == 'registry.fixture.invalid/gitlab'
          - test_registry_mirrors['quay.io'] == 'registry.fixture.invalid/quay'

    - name: Verify local upstream mirror rendering
      vars:
        ansible_architecture: x86_64
        nexus_url: ""
        test_in_aws: false
      assert:
        that:
          - mirror_apt_ubuntu_archive == 'http://archive.ubuntu.com/ubuntu'
          - mirror_apt_ubuntu_security == 'http://security.ubuntu.com/ubuntu'
          - mirror_apt_ubuntu_ports == 'http://ports.ubuntu.com/ubuntu-ports'
          - test_registry_mirrors == {}
          - test_dot_servers == [prod_network.virtual_ips.dns ~ '#dns.fahm.fr']

    - name: Configure test-only connectivity and credentials
      become: true
      block:
        # man-db rebuilds its whole index as a dpkg trigger after every install
        # that ships man pages, a large share of each converge's apt time. The
        # trigger is a no-op without the flag file; the debconf answer keeps man-db
        # upgrades from recreating it.
        - name: Disable man-db index rebuilds on package installs
          debconf:
            name: man-db
            question: man-db/auto-update
            vtype: boolean
            value: "false"

        - name: Remove the man-db auto-update flag
          file:
            path: /var/lib/man-db/auto-update
            state: absent

        # dpkg syncs every unpacked file. The disks are cache=unsafe, so the
        # host ignores those flushes, but the guest filesystem still pays the
        # journal and ZIL work per file on every install.
        - name: Skip dpkg per-file syncs
          copy:
            dest: /etc/dpkg/dpkg.cfg.d/90-test-unsafe-io
            content: "force-unsafe-io\n"
            owner: root
            group: root
            mode: "0644"

        - name: Create systemd-resolved configuration directory
          file:
            path: /etc/systemd/resolved.conf.d
            state: directory
            owner: root
            group: root
            mode: "0755"

        - name: Install DNS-over-TLS configuration
          copy:
            dest: /etc/systemd/resolved.conf.d/10-test-dns-over-tls.conf
            owner: root
            group: root
            mode: "0644"
            content: |
              [Resolve]
              DNS={{ test_dot_servers | join(' ') }}
              FallbackDNS=
              DNSOverTLS=yes
              Domains=~.
            validate: python3 -c 'import configparser,sys; configparser.ConfigParser(strict=False, delimiters=("=",)).read(sys.argv[1])' %s
          register: test_resolved_conf

        - name: Restart systemd-resolved to pick up DoT config
          systemd:
            name: systemd-resolved
            state: restarted
          when: test_resolved_conf.changed

        - name: Ensure /etc/containers/registries.conf.d exists
          when: test_registry_mirrors | length > 0
          file:
            path: /etc/containers/registries.conf.d
            state: directory
            mode: "0755"
            owner: root
            group: root

        - name: Configure podman registry mirrors
          when: test_registry_mirrors | length > 0
          copy:
            dest: /etc/containers/registries.conf.d/homelab-mirrors.conf
            mode: "0644"
            owner: root
            group: root
            # Nexus path-based routing treats the mirror location's repository suffix
            # as the first image namespace beneath its native /v2/ API.
            content: |
              {% for source, location in test_registry_mirrors | dictsort %}
              [[registry]]
              location = "{{ source }}"

              [[registry.mirror]]
              location = "{{ location }}"
              {% endfor %}

        - name: Ensure root containers auth dir exists
          when: test_in_aws
          file:
            path: /root/.config/containers
            state: directory
            mode: "0700"
            owner: root
            group: root

        - name: Write ECR auth for root podman pulls
          when: test_in_aws
          copy:
            dest: /root/.config/containers/auth.json
            mode: "0600"
            owner: root
            group: root
            content: |
              {
                "auths": {
                  "{{ test_ecr_registry }}": {
                    "auth": "{{ ('AWS:' ~ lookup('pipe', 'aws --region ' ~ test_aws_region ~ ' ecr get-login-password')) | b64encode }}"
                  }
                }
              }
            validate: python3 -m json.tool "%s"
          diff: false

    # Assert the running resolver state, not merely the drop-in written above.
    # Scope it to the Global block controlled by resolved.conf.d.
    - name: Verify DNS-over-TLS is enforced at the configured resolver
      vars:
        # Per-link DHCP resolvers must not satisfy the global drop-in contract.
        _test_resolvectl_global: >-
          {{ test_resolvectl.stdout.split('\nLink ') | first }}
        _test_resolvectl_global_protocols: >-
          {{ _test_resolvectl_global.splitlines()
             | select('search', 'Protocols:') | list | first | default('') }}
      command: resolvectl status
      register: test_resolvectl
      changed_when: false
      failed_when: >-
        '+DNSOverTLS' not in _test_resolvectl_global_protocols or
        (test_dot_servers | select('in', _test_resolvectl_global) | list | length)
        != (test_dot_servers | length)

    # Prove public resolution end-to-end; retry boundedly for a cold DoT handshake.
    - name: Verify public resolution over the enforced resolver
      command: resolvectl query --cache=no wikipedia.org
      register: test_public_resolve
      changed_when: false
      retries: 5
      delay: 3
      until: test_public_resolve.rc == 0

    - name: Configure shared base-role prerequisites
      when: test_base_prerequisites | default(false) | bool
      block:
        - name: Set hostname and seed /etc/hosts
          import_role:
            name: hostname
            tasks_from: configure

        - name: Configure apt retries and sources
          import_role:
            name: apt
            tasks_from: configure
