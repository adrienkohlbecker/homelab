- name: Run the selected role task file
  hosts: all
  vars:
    # Real harness runs override this; the fallback keeps standalone syntax
    # checks resolvable.
    _test_role_under_test: apt
  tasks:
    - name: Import the selected role task file
      import_role:
        name: "{{ _test_role_under_test }}"
        tasks_from: "{{ _role_tasks_from | default('main') }}"
