- name: Configure shared role-test prerequisites
  hosts: all
  tasks:
    - name: Configure test-only connectivity and credentials
      import_tasks: tasks/environment.yml

    - name: Verify test-only connectivity
      import_tasks: tasks/verify_environment.yml

    - name: Set hostname and seed /etc/hosts
      import_role:
        name: hostname
        tasks_from: configure

    - name: Configure apt retries and sources
      import_role:
        name: apt
        tasks_from: configure
