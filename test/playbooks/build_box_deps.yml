# Bake the heavy cross-cutting test deps (podman, nginx + snakeoil certs, and
# fluent-bit) into the box_deps variant image so role tests that opt in via
# roles/<role>/meta/test.yml skip their installation in every _setup.yml hook.
# The test:build_box_deps task boots the published box fixture, runs this
# playbook against it, and shuts it down cleanly before publishing the derived
# fixture.
- name: Bake homelab test deps into the box_deps variant image
  hosts: all
  become: true
  tasks:
    # This seed runs outside site.yml, so configure the same Nexus-backed apt
    # sources that normal converges get before installing the baked dependencies.
    # The qemu image has no cloud-init, so the rewrite persists until sanitized
    # back to upstream below.
    - name: Configure apt to use the Nexus mirror
      import_role:
        name: apt
        tasks_from: configure

    - name: Install podman runtime
      import_role:
        name: podman
        tasks_from: install

    - name: Install nginx + snakeoil cert at letsencrypt paths
      import_role:
        name: nginx
        tasks_from: test_fixture

    - name: Install fluent-bit
      import_role:
        name: fluentbit
        tasks_from: configure

    # Everything above wrote its apt sources through the lab Nexus. Rewrite each
    # shared apt mirror to its value without Nexus before shipping the fixture so
    # AWS nested-qemu cells do not try to route through the lab.
    - name: Assert the source Nexus URL is defined
      assert:
        that:
          - nexus_url | length > 0
        fail_msg: nexus_url must identify the source mirror before sanitizing box_deps.

    - name: Capture Nexus-backed apt mirror URLs
      set_fact:
        box_deps_apt_mirror_sources: >-
          {{ box_deps_apt_mirror_sources | default({}) |
             combine({item: lookup('vars', item)}) }}
      loop: "{{ query('varnames', '^mirror_apt_') | sort }}"

    - name: Resolve upstream apt mirror URLs
      vars:
        nexus_url: ""
        test_in_aws: false
      set_fact:
        box_deps_apt_mirror_rewrites: >-
          {{ box_deps_apt_mirror_rewrites | default([]) +
             [{'source': item.value, 'replacement': lookup('vars', item.key)}] }}
      loop: "{{ box_deps_apt_mirror_sources | dict2items }}"

    - name: Find Nexus-backed apt source files
      find:
        paths: /etc/apt
        file_type: file
        recurse: true
        patterns:
          - sources.list
          - "*.list"
          - "*.sources"
        contains: "{{ nexus_url | regex_escape }}"
        read_whole_file: true
      register: box_deps_apt_sources

    - name: Rewrite baked apt sources to upstream
      replace:
        path: "{{ item.0.path }}"
        regexp: "{{ item.1.source | regex_escape }}"
        replace: "{{ item.1.replacement }}"
        backup: true
      loop: >-
        {{ box_deps_apt_sources.files |
           product(box_deps_apt_mirror_rewrites) | list }}
      loop_control:
        label: "{{ item.0.path }}: {{ item.1.source }}"

    # Fail closed: the rewrite pairs above only cover URLs derived from
    # mirror_apt_* vars, so an apt source pointing at Nexus through any other
    # shape would ship silently and only surface as a strict apt-get update
    # failure inside an AWS cell. Re-scan and refuse to ship a fixture that
    # still references the lab. The rewrite's `<file>.<pid>.<ts>~` backups
    # keep the old URLs by design and fall outside the patterns below.
    - name: Re-scan for apt sources still pointing at Nexus
      find:
        paths: /etc/apt
        file_type: file
        recurse: true
        patterns:
          - sources.list
          - "*.list"
          - "*.sources"
        contains: "{{ nexus_url | regex_escape }}"
        read_whole_file: true
      register: box_deps_apt_sources_leftover

    - name: Assert the shipped fixture is Nexus-free
      assert:
        that:
          - box_deps_apt_sources_leftover.files | length == 0
        fail_msg: >-
          Baked apt sources still reference {{ nexus_url }}:
          {{ box_deps_apt_sources_leftover.files | map(attribute='path') | join(', ') }}
