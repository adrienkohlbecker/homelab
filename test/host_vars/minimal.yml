# Minimal is the vanilla Ubuntu cloud-image fixture: ext4, with snapd and
# cloud-init preinstalled. Roles list `minimal:` in meta/test.yml to exercise
# GRUB paths (versus ZFSBootMenu on Lab/Pug), cloud-init cleanup, non-ZFS
# compression toggles, and snap removal without another maintained Packer image.
qemu_test_minimal: true

zfs_root: false
zfs_trim_pools: []
zfs_pool_properties: []
zfs_mount_cache_pools: []
# Mirror Fox's small-VM ARC policy (no floor, 512 MiB cap) so zfs.conf.j2
# renders its unset-minimum branch; Lab and Pug test fixtures set both bounds.
zfs_arc_min: 0
zfs_arc_max: 536870912
grub_bootloader: true

# The role installs the optional kernel-module package omitted by this trimmed
# cloud image, making minimal the zram-only fixture.
swap_zram_size: 2G

# Netdata monitoring surface, mirroring Lab's always-live and never-existed
# presence entries; _setup serves the GitLab Runner metrics fixture on its
# production port. The MinIO and intelgpu collectors, the keepalived VIP, and
# the packer process group stay disabled.
netdata_contexts:
  - system.cpu
  - foo.does_not_exist
netdata_collectors:
  - go.d:collector:systemdunits:service-units
  - go.d:collector:prometheus:gitlab_runner
  - go.d:collector:fake_plugin:fake_job
netdata_expected_charts:
  system_cpu_chart: system.cpu
  missing_fixture_chart: fixture.does_not_exist

# No pool means nothing to pull or receive; the placeholder key only satisfies
# zfs_autobackup's input assert.
zfs_autobackup_sources: []
zfs_autobackup_ssh_public_key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKEQFR3KzOd/MuPj+EoQkXAuuzTdRkpRp4mNBzwlofTP root@minimal
