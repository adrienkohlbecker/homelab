# Minimal is the vanilla Ubuntu cloud-image fixture: ext4, with snapd and
# cloud-init preinstalled. Roles list `minimal:` in meta/test.yml to exercise
# GRUB paths (versus ZFSBootMenu on Lab/Pug), cloud-init cleanup, non-ZFS
# compression toggles, and snap removal without another maintained Packer image.
qemu_test_minimal: true

zfs_root: false
# Minimal inherits empty macvlan_blocks: it does not trunk VLANs or need an
# L2-on-LAN presence for containers.

# The role installs the optional kernel-module package omitted by this trimmed
# cloud image, making minimal the zram-only fixture.
swap_zram_size: 2G
