---
# Fluent Bit calls these Lua filters by name through its `call` config key.
base: lua51
globals:
  set_priority: &filter_callback
    args:
      - type: any
      - type: any
      - type: any
  normalize_podman_event: *filter_callback
  shape_lnav: *filter_callback
  reassemble_conmon_message: *filter_callback
