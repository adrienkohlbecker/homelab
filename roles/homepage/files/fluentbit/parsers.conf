# Homepage's Winston console transport emits a stable timestamp, colored level,
# optional logger label, and message. Keep journald's arrival timestamp as the
# event time; the application timestamp is redundant and removed after parsing.
[PARSER]
    Name    homepage_winston
    Format  regex
    Regex   /^\[(?<homepage_timestamp>[^]]+)\] (?:\x1b\[[0-9;]*m)?(?<homepage_level>error|warn|info|http|verbose|debug|silly)(?:\x1b\[[0-9;]*m)?: (?:<(?<homepage_source>[^>]+)> )?(?<homepage_message>.*)$/m

# Winston renders Error.stack after the metadata header. Conmon records each
# newline separately, so attach Node stack frames before extracting the header.
[MULTILINE_PARSER]
    Name          multiline_homepage
    Type          regex
    Flush_Timeout 1000
    Rule          "start_state" "/^\[[^]]+\] (?:\x1b\[[0-9;]*m)?(error|warn|info|http|verbose|debug|silly)/" "continuation"
    Rule          "continuation" "/^([[:space:]]+at |Caused by:|[A-Za-z_$][A-Za-z0-9_$.]*(Error|Exception):)/" "continuation"
