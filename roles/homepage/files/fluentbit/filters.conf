# Join Winston stack frames before parsing. The fleet-wide multiline filter
# excludes this tag so exactly one emitter processes Homepage records.
[FILTER]
    Name                   multiline
    Match                  svc.homepage.service
    multiline.parser       multiline_homepage
    multiline.key_content  log
    buffer                 on
    flush_ms               1000
    emitter_name           multiline_homepage_emitter
    emitter_storage.type   filesystem

# Preserve the raw line until the normalizer has validated the parsed schema.
# The Lua filter uses CONTAINER_TAG to leave podman and systemd unit output
# untouched even if it happens to resemble Homepage's console grammar.
[FILTER]
    Name          parser
    Match         svc.homepage.service
    Key_Name      log
    Parser        homepage_winston
    Reserve_Data  On
    Preserve_Key  On

[FILTER]
    Name    lua
    Match   svc.homepage.service
    script  /etc/fluent-bit/homepage_normalize.lua
    call    normalize_homepage
