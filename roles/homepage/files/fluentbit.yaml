parsers:
  - name: homepage_winston
    format: regex
    regex: '/^\[[^]]+\] (?:\x1b\[[0-9;]*m)?(?<_level>error|warn|info|http|verbose|debug|silly)(?:\x1b\[[0-9;]*m)?: (?:<(?<source>[^>]+)> )?(?<log>.*)$/m'

pipeline:
  filters:
    - name: parser
      match: svc.homepage.service
      key_name: MESSAGE
      parser: homepage_winston
      reserve_data: true
