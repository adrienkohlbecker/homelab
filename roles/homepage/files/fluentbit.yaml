parsers:
  - name: homepage_winston
    format: regex
    regex: '/^\[(?<homepage_timestamp>[^]]+)\] (?:\x1b\[[0-9;]*m)?(?<homepage_level>error|warn|info|http|verbose|debug|silly)(?:\x1b\[[0-9;]*m)?: (?:<(?<homepage_source>[^>]+)> )?(?<homepage_message>.*)$/m'

multiline_parsers:
  - name: multiline_homepage
    type: regex
    flush_timeout: 1000
    rules:
      - state: start_state
        regex: '/^\[[^]]+\] (?:\x1b\[[0-9;]*m)?(error|warn|info|http|verbose|debug|silly)/'
        next_state: continuation
      - state: continuation
        regex: '/^([[:space:]]+at |Caused by:|[A-Za-z_$][A-Za-z0-9_$.]*(Error|Exception):)/'
        next_state: continuation

pipeline:
  filters:
    - name: modify
      match: svc.homepage.service
      rename: MESSAGE log
    - name: multiline
      match: svc.homepage.service
      multiline.parser: multiline_homepage
      multiline.key_content: log
      buffer: true
      flush_ms: 1000
      emitter_name: multiline_homepage_emitter
      emitter_storage.type: filesystem
    - name: parser
      match: svc.homepage.service
      key_name: log
      parser: homepage_winston
      reserve_data: true
      preserve_key: true
    - name: modify
      match: svc.homepage.service
      condition:
        - key_exists CONTAINER_TAG
        - key_exists homepage_message
        - key_exists homepage_level
      hard_rename:
        - homepage_message log
        - homepage_level _level
        - homepage_source source
      remove: homepage_timestamp
      set: parser_status parsed
    - name: modify
      match: svc.homepage.service
      condition: key_value_equals _level http
      set: _level debug
    - name: modify
      match: svc.homepage.service
      condition: key_value_equals _level verbose
      set: _level debug
    - name: modify
      match: svc.homepage.service
      condition: key_value_equals _level silly
      set: _level trace
    # The homepage_alerts timer fires every minute, so auditd records a
    # SERVICE_START/STOP pair for it each run. Omit only its successful
    # bookkeeping; failures and other units stay.
    - name: grep
      match: audit
      exclude: "log ^type=SERVICE_(START|STOP) msg=audit\\([0-9.]+:[0-9]+\\): pid=1 uid=0 auid=4294967295 ses=4294967295 subj=unconfined msg='unit=homepage_alerts .* res=success'"
