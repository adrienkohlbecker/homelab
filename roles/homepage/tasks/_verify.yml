- name: _verify | Map the homepage vhost FQDN to loopback for SNI-correct probing
  import_role:
    name: nginx
    tasks_from: test_loopback_hosts
  vars:
    nginx_test_loopback_hosts_args:
      hostnames:
        - "homepage.{{ inventory_hostname }}.{{ domain }}"

- name: _verify | Homepage answers through nginx
  uri:
    url: https://homepage.{{ inventory_hostname }}.{{ domain }}/api/healthcheck
    validate_certs: false
    status_code: 200
  register: _homepage_http
  retries: 30
  delay: 2
  until: _homepage_http.status == 200
  become: true

- name: _verify | Resolve the installed Homepage account
  getent:
    database: passwd
    key: homepage

- name: _verify | Render Homepage units for alternate storage layouts
  template:
    src: homepage.service.j2
    dest: "/tmp/homepage-{{ item.name }}.service"
    mode: "0644"
  vars:
    homepage_user:
      uid: "{{ ansible_facts.getent_passwd.homepage[1] }}"
      gid: "{{ ansible_facts.getent_passwd.homepage[2] }}"
    zfs_root: "{{ item.zfs_root }}"
    zfs_has_services_mount: "{{ item.zfs_has_services_mount }}"
  loop:
    - name: ext4
      zfs_root: false
      zfs_has_services_mount: false
    - name: zfs_services
      zfs_root: true
      zfs_has_services_mount: true
  become: true

- name: _verify | Read alternate-storage Homepage units
  slurp:
    src: "/tmp/homepage-{{ item }}.service"
  loop:
    - ext4
    - zfs_services
  register: _homepage_storage_units
  become: true

- name: _verify | Assert storage dependencies match the rendered layout
  assert:
    that:
      - '"Requires=zfs_mount_mnt_services.service" not in (_homepage_storage_units.results[0].content | b64decode)'
      - '"After=zfs_mount_mnt_services.service" not in (_homepage_storage_units.results[0].content | b64decode)'
      - '"Requires=zfs_mount_mnt_services.service" in (_homepage_storage_units.results[1].content | b64decode)'
      - '"After=zfs_mount_mnt_services.service" in (_homepage_storage_units.results[1].content | b64decode)'

- name: _verify | Remove alternate-storage Homepage units
  file:
    path: "/tmp/homepage-{{ item }}.service"
    state: absent
  loop:
    - ext4
    - zfs_services
  become: true

# Wait + assert split: the post-install service start renders index.html, but
# ansible may race that first run. Combining retry-until with a content check
# would fail fast on the first 404, so retries get their full budget first.
- name: _verify | Homepage_alerts renders HTML through nginx
  uri:
    url: https://homepage.{{ inventory_hostname }}.{{ domain }}/alerts/
    validate_certs: false
    return_content: true
    status_code: 200
  register: _homepage_alerts_html
  retries: 30
  delay: 2
  until: _homepage_alerts_html.status == 200
  become: true

- name: _verify | Homepage_alerts HTML names every configured host
  assert:
    that: item in _homepage_alerts_html.content
    fail_msg: "Host {{ item }} missing from rendered HTML"
  loop: "{{ homepage_netdata_hosts }}"

# The designated fixture points homepage_netdata_hosts at an unreachable
# Netdata endpoint, so _fetch_one's bare-except is guaranteed to fire and
# render_html should emit `<div class="err">`. A regression that silently
# drops the error rendering (e.g. _fetch_one swallowing the entry, or
# render_html stripping the err branch) would pass the "host name in content"
# check above (because the <h2> still renders) but fail this one.
- name: _verify | Per-host error path renders on designated fixture
  assert:
    that:
      - '"<div class=\"err\">" in _homepage_alerts_html.content'
    fail_msg: >-
      Expected a per-host <div class="err"> rendered with no reachable Netdata
      endpoint. HTML content was:
      {{ _homepage_alerts_html.content }}

- name: _verify | Set unique Homepage log-normalization marker
  set_fact:
    _homepage_lnav_marker: "homepage-normalize-{{ ansible_date_time.epoch }}"

# Write through the running container's PID 1 stderr so conmon sends the
# representative colored Winston record through the real journald pipeline.
- name: _verify | Emit colored multiline Homepage log record
  command:
    argv:
      - podman
      - exec
      - homepage
      - /bin/sh
      - -c
      - |
        printf "[2026-07-11T21:00:00.000Z] \033[31merror\033[39m: <homepage.verify> Error: {{ _homepage_lnav_marker }}\n    at verify (/app/verify.js:7:1)\n    at async handler (/app/api.js:9:2)\n" > /proc/1/fd/2
  changed_when: false
  become: true

- name: _verify | Wait for normalized Homepage records in lnav store
  command:
    argv:
      - python3
      - -c
      - |
        import json
        import sys

        marker = sys.argv[2]
        with open(sys.argv[1], encoding="utf-8") as handle:
            for line in handle:
                try:
                    record = json.loads(line)
                except json.JSONDecodeError:
                    continue
                if record.get("service") != "homepage":
                    continue
                if marker in record.get("message", ""):
                    print(json.dumps(record, sort_keys=True))
                    sys.exit(0)
        sys.exit(1)
      - /var/log/fluent-bit/lnav.jsonl
      - "{{ _homepage_lnav_marker }}"
  register: _homepage_lnav_normalized
  changed_when: false
  retries: 30
  delay: 1
  until: _homepage_lnav_normalized.rc == 0
  become: true

- name: _verify | Exercise homepage fluent-bit record contracts
  import_role:
    name: fluentbit
    tasks_from: verify_extension
  vars:
    fluentbit_verify_args:
      name: homepage
      records:
        - MESSAGE: "[2099-01-02T03:04:05.678Z] verbose: <homepage.verify> homepage-valid"
          CONTAINER_TAG: homepage
          SYSLOG_IDENTIFIER: conmon
          SYSTEMD_UNIT: homepage.service
          parser_status: forged
        - MESSAGE: "[2099-01-02T03:04:05.679Z] http: <homepage.verify> homepage-access"
          CONTAINER_TAG: homepage
          SYSLOG_IDENTIFIER: conmon
          SYSTEMD_UNIT: homepage.service
        - MESSAGE: homepage-raw
          CONTAINER_TAG: homepage
          SYSLOG_IDENTIFIER: conmon
          SYSTEMD_UNIT: homepage.service
      expected:
        - message: homepage-valid
          level: debug
          service: homepage
          fields.source: homepage.verify
        - message: homepage-access
          level: debug
          service: homepage
          fields.source: homepage.verify
        - message: homepage-raw
          service: homepage
