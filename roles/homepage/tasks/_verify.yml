- name: _verify | Homepage answers on its loopback port
  uri:
    url: http://localhost:{{ service_ports.homepage }}/api/healthcheck
    status_code: 200
  register: _homepage_http
  retries: 30
  delay: 2
  until: _homepage_http.status == 200
  become: true

# Map the vhost FQDN to loopback so SNI matches the served certificate.
# Probing https://localhost with a Host: header leaves SNI=localhost, which
# OpenSSL 3.x (noble/resolute) rejects as a fatal unrecognized_name alert
# (status -1); hitting the FQDN directly keeps SNI correct on every release.
- name: _verify | Map the homepage vhost FQDN to loopback for SNI-correct probing
  lineinfile:
    path: /etc/hosts
    line: "127.0.0.1 homepage.{{ inventory_hostname }}.{{ domain }}"
    state: present
  become: true

- name: _verify | Homepage answers through nginx
  uri:
    url: https://homepage.{{ inventory_hostname }}.{{ domain }}/api/healthcheck
    validate_certs: false
    status_code: 200
  become: true

# Wait + assert split: the post-install service start renders index.html, but
# ansible may race that first run. Combining retry-until with a content check
# would fail fast on the first 404, so retries get their full budget first.
- name: _verify | Homepage_alerts renders HTML through nginx
  uri:
    url: https://homepage.{{ inventory_hostname }}.{{ domain }}/alerts/
    validate_certs: false
    return_content: true
    status_code: 200
  register: _homepage_alerts_html
  retries: 30
  delay: 2
  until: _homepage_alerts_html.status == 200
  become: true

- name: _verify | Homepage_alerts HTML carries the iframe-resize script
  assert:
    that:
      - "'frameElement' in _homepage_alerts_html.content"
    fail_msg: "Expected the same-origin iframe-resize script (frameElement) in the rendered HTML"

- name: _verify | Homepage_alerts HTML names every configured host
  assert:
    that: item in _homepage_alerts_html.content
    fail_msg: "Host {{ item }} missing from rendered HTML"
  loop: "{{ homepage_netdata_hosts }}"

# Functional check on the per-host error path (A3-lite). The box fixture sets
# homepage_netdata_hosts = [box] and the test VM has no real netdata on
# :19999, so _fetch_one's bare-except is guaranteed to fire and render_html
# should emit `<div class="err">`. A regression that silently drops the
# error rendering (e.g. _fetch_one swallowing the entry, or render_html
# stripping the err branch) would pass the "host name in content" check
# above (because the <h2> still renders) but fail this one. Box-only — on
# lab-qemu/pug-qemu the netdata targets may be reachable from the test VM.
- name: _verify | Per-host error path renders on test box
  when: inventory_hostname == 'box'
  assert:
    that:
      - '"<div class=\"err\">" in _homepage_alerts_html.content'
    fail_msg: >-
      Expected a per-host <div class="err"> rendered on box (no real netdata
      reachable from the test fixture). HTML content was:
      {{ _homepage_alerts_html.content }}

# Hot-reload proof: the role intentionally skips restart on YAML config
# edits because gethomepage watches /app/config. If a future image bump
# drops the watcher this assertion fires loudly instead of letting the
# regression hide as "ansible reports changed, dashboard shows old data".
- name: _verify | Inject sentinel bookmark to exercise homepage hot-reload
  copy:
    dest: /mnt/services/homepage/bookmarks.yaml
    content: |
      - Verify:
          - HomepageVerifySentinel:
              - abbr: VS
                href: https://verify.example/
    owner: homepage
    group: homepage
    mode: "0644"
  become: true

- name: _verify | Homepage hot-reloads bookmarks.yaml and renders the sentinel
  # Probe /api/bookmarks rather than the SSR'd `/` page: getStaticProps
  # caches the rendered HTML by path (query string doesn't differentiate
  # SSG output), so polling `/?_t=N` returns the same year-old HIT
  # response no matter how many random query strings you throw at it.
  # The /api/bookmarks JSON endpoint reads from the live in-memory
  # config that gethomepage's chokidar file-watch refreshes, so the
  # sentinel appears here as soon as the watcher fires.
  uri:
    url: "http://localhost:{{ service_ports.homepage }}/api/bookmarks"
    return_content: true
    status_code: 200
  register: _homepage_hotreload
  retries: 60
  delay: 2
  until: "'HomepageVerifySentinel' in _homepage_hotreload.content"
  become: true

- name: _verify | Set unique Homepage log-normalization marker
  set_fact:
    _homepage_lnav_marker: "homepage-normalize-{{ ansible_date_time.epoch }}"

# Write through the running container's PID 1 stderr so conmon sends the
# representative colored Winston record through the real journald pipeline.
- name: _verify | Emit colored multiline Homepage log record
  command:
    argv:
      - podman
      - exec
      - homepage
      - /bin/sh
      - -c
      - |
        printf "[2026-07-11T21:00:00.000Z] \033[31merror\033[39m: <homepage.verify> Error: {{ _homepage_lnav_marker }}\n    at verify (/app/verify.js:7:1)\n    at async handler (/app/api.js:9:2)\n" > /proc/1/fd/2
  changed_when: false
  become: true

- name: _verify | Wait for normalized Homepage records in lnav store
  command:
    argv:
      - python3
      - -c
      - |
        import json
        import sys

        marker = sys.argv[2]
        with open(sys.argv[1], encoding="utf-8") as handle:
            for line in handle:
                try:
                    record = json.loads(line)
                except json.JSONDecodeError:
                    continue
                if record.get("service") != "homepage":
                    continue
                if marker in record.get("message", ""):
                    print(json.dumps(record, sort_keys=True))
                    sys.exit(0)
        sys.exit(1)
      - /var/log/fluent-bit/lnav.jsonl
      - "{{ _homepage_lnav_marker }}"
  register: _homepage_lnav_normalized
  changed_when: false
  retries: 30
  delay: 1
  until: _homepage_lnav_normalized.rc == 0
  become: true

- name: _verify | Exercise homepage fluent-bit record contracts
  import_role:
    name: fluentbit
    tasks_from: verify_extension
  vars:
    fluentbit_verify_args:
      name: homepage
      records:
        - MESSAGE: "[2099-01-02T03:04:05.678Z] verbose: <homepage.verify> homepage-valid"
          CONTAINER_TAG: homepage
          SYSLOG_IDENTIFIER: conmon
          SYSTEMD_UNIT: homepage.service
          parser_status: forged
        - MESSAGE: "[2099-01-02T03:04:05.679Z] http: <homepage.verify> homepage-access"
          CONTAINER_TAG: homepage
          SYSLOG_IDENTIFIER: conmon
          SYSTEMD_UNIT: homepage.service
        - MESSAGE: homepage-raw
          CONTAINER_TAG: homepage
          SYSLOG_IDENTIFIER: conmon
          SYSTEMD_UNIT: homepage.service
        - _tag: audit
          log: "type=SERVICE_START msg=audit(4072368012.092:808): pid=1 uid=0 auid=4294967295 ses=4294967295 subj=unconfined msg='unit=homepage_alerts comm=systemd exe=/usr/lib/systemd/systemd hostname=? addr=? terminal=? res=success'"
          marker: homepage-audit-success-drop
        - _tag: audit
          log: "type=SERVICE_START msg=audit(4072368012.092:809): pid=1 uid=0 auid=4294967295 ses=4294967295 subj=unconfined msg='unit=homepage_alerts comm=systemd exe=/usr/lib/systemd/systemd hostname=? addr=? terminal=? res=failed'"
          marker: homepage-audit-failed-keep
        - _tag: audit
          log: "type=SERVICE_STOP msg=audit(4072368012.092:810): pid=1 uid=0 auid=4294967295 ses=4294967295 subj=unconfined msg='unit=unrelated comm=systemd exe=/usr/lib/systemd/systemd hostname=? addr=? terminal=? res=success'"
          marker: homepage-unrelated-audit-success-keep
      expected:
        - message: homepage-valid
          level: debug
          service: homepage
          _not_prefix:
            time: 2099-
          fields.parser_status: parsed
          fields.source: homepage.verify
        - message: homepage-access
          level: debug
          service: homepage
          fields.parser_status: parsed
          fields.source: homepage.verify
        - message: homepage-raw
          service: homepage
          _absent:
            - fields.parser_status
        - fields.marker: homepage-audit-failed-keep
        - fields.marker: homepage-unrelated-audit-success-keep

- name: _verify | Successful homepage_alerts audit bookkeeping was omitted
  assert:
    that: "'-drop' not in fluentbit_verify_result.stdout"
