- name: _setup | Install podman
  import_role:
    name: podman
    tasks_from: install

- name: _setup | Install nginx
  import_role:
    name: nginx
    tasks_from: test_fixture
  vars:
    nginx_test_fixture_args:
      authelia_mode: authed

- name: _setup | Install fluent-bit for container-log integration
  import_role:
    name: fluentbit

- name: _setup | Setup dependencies
  shell: |
    set -euo pipefail
    mkdir /mnt/services
  args:
    executable: /bin/bash
    creates: /mnt/services
  become: true
