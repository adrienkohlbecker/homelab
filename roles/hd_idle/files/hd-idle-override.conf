[Service]
# Noble's C 1.05 daemonizes without a PIDFile, making its packaged Type=forking
# unit unreliable across configuration restarts. Foreground mode gives systemd
# a stable process to supervise, while the log filter drops its per-poll probes
# and retains power-state changes. Resolute's Go rewrite uses its native
# Type=simple unit and does not receive this drop-in.
Type=simple
ExecStart=
ExecStart=/usr/sbin/hd-idle -d $HD_IDLE_OPTS
LogFilterPatterns=~^probing sd[a-z]+: reads:
