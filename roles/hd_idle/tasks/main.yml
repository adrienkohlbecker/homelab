- name: Install hd-idle
  apt:
    pkg: hd-idle
    policy_rc_d: 101
    cache_valid_time: 3600
  register: hd_idle_apt
  become: true
  tags:
    - hd_idle

- name: Copy hd-idle configuration
  template:
    src: hd-idle.j2
    dest: /etc/default/hd-idle
    owner: root
    group: root
    mode: "0644"
    backup: true
    validate: 'sh -c ''. "%s" && test -n "${HD_IDLE_OPTS:-}"'''
  when: not (ansible_check_mode and hd_idle_apt.changed)
  register: hd_idle_conf
  become: true
  tags:
    - hd_idle

# Install before service start so releases that need the foreground workaround
# use it immediately.
- name: Run hd-idle in the foreground (noble fork-tracking race)
  import_role:
    name: systemd_unit
    tasks_from: install
  vars:
    systemd_unit_args:
      for: hd-idle.service
      src: hd-idle-override.conf
      condition: >-
        {{ hd_idle_foreground_override_enabled
           and not (ansible_check_mode and hd_idle_apt.changed) }}
  tags:
    - hd_idle

- name: Record whether the hd-idle foreground override changed
  set_fact:
    hd_idle_foreground_override_installed: >-
      {{ hd_idle_service_d_override_conf_result.changed }}
  tags:
    - hd_idle

- name: Remove the hd-idle foreground override when disabled
  import_role:
    name: systemd_unit
    tasks_from: remove
  vars:
    systemd_unit_args:
      for: hd-idle.service
      condition: >-
        {{ not hd_idle_foreground_override_enabled
           and not (ansible_check_mode and hd_idle_apt.changed) }}
  tags:
    - hd_idle

- name: Enable hd_idle service
  when: not (ansible_check_mode and hd_idle_apt.changed)
  systemd:
    name: hd-idle.service
    enabled: true
    state: >-
      {{ 'restarted'
         if hd_idle_apt.changed or hd_idle_conf.changed
            or hd_idle_foreground_override_installed
            or hd_idle_service_d_override_conf_result.changed
         else 'started' }}
  become: true
  tags:
    - hd_idle
