- name: Validate journald_storage is volatile or persistent
  assert:
    quiet: true
    that:
      - journald_storage in ['volatile', 'persistent']
    fail_msg: >-
      journald_storage={{ journald_storage | default('<undefined>') }}
      is not one of: volatile, persistent. Define it in
      group_vars/all/ (or override per host in
      host_vars/{{ inventory_hostname }}.yml).
  tags:
    - journald

# Numbered 99- (not 10-): journald.conf.d/ merges lexicographically,
# last-wins, so a high number keeps these settings on top of any
# lower-numbered drop-in a package or cloud-init might land here.
- name: Create journald configuration directory
  file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true
  tags:
    - journald

- name: Render journald.conf.d/99-custom.conf
  template:
    src: 99-custom.conf.j2
    dest: /etc/systemd/journald.conf.d/99-custom.conf
    owner: root
    group: root
    mode: "0644"
    backup: true
    validate: python3 -c 'import configparser,sys; configparser.ConfigParser(strict=False, delimiters=("=",)).read(sys.argv[1])' %s
  register: journald_conf_d_99_custom_conf_result
  become: true
  tags:
    - journald

# Mask + stop systemd-journald-audit.socket. The conf above sets
# Audit=no; this releases the kernel audit netlink fd so auditd has
# sole ownership of the audit stream. auditd writes
# /var/log/audit/audit.log (100% coverage), which fluent-bit tails
# directly -- the previous dual-write through journald put ~80% of
# records into both streams and surfaced as duplicate facets in
# HyperDX.
#
# Why mask, not just `enabled: false`: the upstream unit ships as
# `static` (no [Install] section) + `WantedBy=systemd-journald.service`
# in its [Unit]. `enabled: false` is a no-op on a static unit, and
# the WantedBy makes every journald restart re-activate the socket.
# Masking with a /dev/null symlink is the only way to keep it down
# across journald restarts; the `Audit=no` conf is the belt, this is
# the suspenders.
- name: Mask systemd-journald-audit.socket
  systemd:
    name: systemd-journald-audit.socket
    masked: true
    state: stopped
  become: true
  register: journald_audit_socket
  tags:
    - journald

# Conf change requires journald restart to pick up Audit=no (and to
# drop the audit fd it currently holds, if any). A pure restart
# suffices: with audit.socket stopped above, there's no downstream
# socket activation needing coordinated ordering. Steady-state apply
# (no conf change, socket already disabled) skips the restart.
- name: Restart systemd-journald.service
  when: journald_conf_d_99_custom_conf_result.changed or journald_audit_socket.changed
  systemd:
    name: systemd-journald.service
    state: restarted
  become: true
  tags:
    - journald

# /var/log/journal/<machine-id>/ persists across a Storage= flip — journald
# creates it lazily on the first persistent write but never tears it down
# when the operator switches back to volatile. Reap it loudly so a
# persistent→volatile rollback doesn't leave multi-GiB orphans on the pool
# (and so box's pre-baked dir from an earlier image generation gets cleaned
# up on first apply).
- name: Remove orphaned persistent journal directory on volatile hosts
  when: journald_storage == 'volatile'
  file:
    path: /var/log/journal
    state: absent
  become: true
  tags:
    - journald

# state=started is idempotent (no-op when active) and fails loudly if the
# unit can't start. Doubles as the post-conf liveness assertion: without
# journald running, container --log-driver=journald, every systemd unit,
# and kuma's systemdunits collector silently degrade until next reboot.
- name: Start systemd-journald.service
  systemd:
    name: systemd-journald.service
    state: started
  become: true
  tags:
    - journald
