---

- name: Install smartmontools
  apt:
    pkg:
      - smartmontools
    policy_rc_d: 101
    cache_valid_time: 3600
  register: smart_apt
  become: true
  tags:
    - smart

- name: Divert smartd.conf
  community.general.dpkg_divert:
    path: /etc/smartd.conf
  when: not (ansible_check_mode and smart_apt.changed)
  become: true
  tags:
    - smart

- name: Configure smartd
  template:
    src: smartd.conf.j2
    dest: /etc/smartd.conf
    owner: root
    group: root
    mode: "0644"
    backup: true
    # smartd returns 17 after successfully parsing a config with no device
    # entries, which is the expected QEMU shape. Accept only that explicit
    # parsed result; syntax errors retain their nonzero status.
    validate: >-
      python3 -c 'import subprocess,sys;
      p=subprocess.run(["smartd","-q","showtests","-c",sys.argv[1]],
      capture_output=True,text=True);
      sys.stdout.write(p.stdout); sys.stderr.write(p.stderr);
      sys.exit(0 if p.returncode == 17 and "parsed but has no entries" in p.stdout
      else p.returncode)' %s
  when: not (ansible_check_mode and smart_apt.changed)
  register: smart_smartd_cfg
  become: true
  tags:
    - smart

- name: Enable smartmontools service
  when: not (ansible_check_mode and smart_apt.changed)
  systemd:
    name: smartmontools.service
    enabled: true
    state: >-
      {{ 'restarted' if smart_apt.changed
         else 'reloaded' if smart_smartd_cfg.changed
         else 'started' }}
  register: smart_smartmontools_started
  changed_when:
    - smart_smartmontools_started.changed
    - smart_smartmontools_started.status.ConditionResult | default('yes') != 'no'
    - smart_smartmontools_started.status.AssertResult | default('yes') != 'no'
  become: true
  tags:
    - smart
