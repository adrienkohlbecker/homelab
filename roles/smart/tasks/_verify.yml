- name: _verify | Read rendered smartd.conf
  slurp:
    src: /etc/smartd.conf
  register: _smart_smartd_conf
  become: true

# Identity, not count: the rendered per-device set must equal the shared
# smart_monitored_disks_by_id selector (group_vars/all/main.yml) the
# template consumes -- catching both a device the template dropped and an
# extra one (e.g. an optical drive) it should have filtered.
- name: _verify | Per-device lines cover exactly the qualifying devices
  vars:
    _conf: "{{ _smart_smartd_conf.content | b64decode }}"
    _conf_devices: "{{ _conf | regex_findall('/dev/disk/by-id/(\\S+)') }}"
  assert:
    that:
      - _conf_devices | sort == smart_monitored_disks_by_id | list
    fail_msg: >-
      per-device line mismatch: config renders {{ _conf_devices | sort }}
      but the qualifying device set is {{ smart_monitored_disks_by_id }}

- name: _verify | Smartd configuration diversion is active  # noqa: command-instead-of-module
  command: dpkg-divert --listpackage /etc/smartd.conf
  register: _smart_smartd_divert
  changed_when: false
  failed_when: _smart_smartd_divert.stdout != "LOCAL"
  become: true

- name: _verify | Exercise smart fluent-bit extension
  import_role:
    name: fluentbit
    tasks_from: verify_extension
  vars:
    fluentbit_verify_args:
      name: smart
      records:
        - _tag: svc.smartmontools.service
          MESSAGE: "Device: /dev/disk/by-id/ata-fixture, no SCT Error Recovery Control support, ignoring -l scterc"
          SYSLOG_IDENTIFIER: smartd
          marker: smartd-scterc-drop
        - _tag: svc.smartmontools.service
          MESSAGE: "Device: /dev/disk/by-id/ata-fixture, no Extended Comprehensive SMART Error Log, ignoring -l xerror (override with -T permissive)"
          SYSLOG_IDENTIFIER: smartd
          marker: smartd-xerror-drop
        - _tag: svc.smartmontools.service
          MESSAGE: "Device: /dev/disk/by-id/ata-fixture, set of SCT Error Recovery Control failed"
          SYSLOG_IDENTIFIER: smartd
          marker: smartd-scterc-set-drop
        # smartd raises real alerts at PRIORITY 2; the body scan independently
        # reaches fatal, so this stays loud whichever path classifies it.
        - _tag: svc.smartmontools.service
          MESSAGE: "Device: /dev/disk/by-id/ata-fixture, Temperature 56 Celsius reached critical limit of 55 Celsius"
          SYSLOG_IDENTIFIER: smartd
          PRIORITY: "2"
          marker: smartd-critical-keep
        - _tag: svc.smartmontools.service
          MESSAGE: "Device: /dev/disk/by-id/nvme-fixture, NVMe error count increased from 0 to 3 (2 new, 1 ignored, 0 unknown)"
          SYSLOG_IDENTIFIER: smartd
          marker: smartd-nvme-error-keep
        - _tag: svc.smartmontools.service
          MESSAGE: "Device: /dev/disk/by-id/ata-fixture, Temperature 48 Celsius dropped below 50 Celsius, warning condition reset after 1 email"
          SYSLOG_IDENTIFIER: smartd
          marker: smartd-temp-clear-drop
        - _tag: svc.smartmontools.service
          MESSAGE: "Sending warning via /usr/share/smartmontools/smartd-runner to root ..."
          SYSLOG_IDENTIFIER: smartd
          marker: smartd-runner-sending-drop
        - _tag: svc.smartmontools.service
          MESSAGE: "Warning via /usr/share/smartmontools/smartd-runner to root: successful"
          SYSLOG_IDENTIFIER: smartd
          marker: smartd-runner-result-drop
      expected:
        - level: fatal
          fields.marker: smartd-critical-keep
        - level: error
          fields.marker: smartd-nvme-error-keep

- name: _verify | Smartd option diagnostics are omitted
  assert:
    that: "'-drop' not in fluentbit_verify_result.stdout"
