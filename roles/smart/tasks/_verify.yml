- name: _verify | Production smartd config applies the per-device policies
  vars:
    smart_devices:
      nvme0n1:
        removable: "0"
        links:
          ids: [ nvme-verify ]
      sda:
        removable: "0"
        links:
          ids: [ ata-CT1000MX500SSD1 ]
      sdb:
        removable: "0"
        links:
          ids: [ ata-verify-rotational ]
      sdc:
        removable: "0"
        links:
          ids: [ ata-unsafe/device ]
    rotational_disks_by_id:
      - ata-verify-rotational
    _unsafe_device_id: unsafe-device-id-was-rejected
    smart_verify_config: "{{ lookup('template', 'smartd.conf.j2') }}"
  assert:
    that:
      - "'unsafe-device-id-was-rejected' in smart_verify_config"
      - "'/dev/disk/by-id/nvme-verify -d nvme,0xffffffff ' in smart_verify_config"
      - "'/dev/disk/by-id/ata-verify-rotational -s (S/../../6/01) ' in smart_verify_config"
      # Only the MX500 opts out of the pending/uncorrectable sector reports.
      - smart_verify_config | regex_findall('(?m)^/dev/disk/by-id/([^ ]+) .* -C 0 -U 0$') == ['ata-CT1000MX500SSD1']
    fail_msg: "{{ smart_verify_config | regex_findall('(?m)^(?:/dev/|unsafe-).*$') }}"
    quiet: true
