- name: _verify | Assert smartmontools unit is enabled and state is expected
  systemd:
    name: smartmontools
  register: _smart_unit
  failed_when: >-
    _smart_unit.status.UnitFileState != "enabled"
    or (_smart_unit.status.ActiveState != "inactive"
        and _smart_unit.status.ActiveState != "active")
  become: true

- name: _verify | Read rendered smartd.conf
  slurp:
    src: /etc/smartd.conf
  register: _smart_smartd_conf
  become: true

- name: _verify | Assert smartd.conf contains required directives
  vars:
    _conf: "{{ _smart_smartd_conf.content | b64decode }}"
  assert:
    that:
      - "'DEFAULT ' in _conf"
      - "'-l error' in _conf"
      - "'-l selftest' in _conf"
      - "'-m root' in _conf"
      - "'-M diminishing' in _conf"
      - "'-n standby,q' in _conf"
    fail_msg: "rendered /etc/smartd.conf missing expected directives:\n{{ _conf }}"

# Identity, not count: the rendered per-device set must equal the shared
# smart_monitored_disks_by_id selector (group_vars/all/main.yml) the
# template consumes -- catching both a device the template dropped and an
# extra one (e.g. an optical drive) it should have filtered.
- name: _verify | Per-device lines cover exactly the qualifying devices
  vars:
    _conf: "{{ _smart_smartd_conf.content | b64decode }}"
    _conf_devices: "{{ _conf | regex_findall('/dev/disk/by-id/(\\S+)') }}"
  assert:
    that:
      - _conf_devices | sort == smart_monitored_disks_by_id | list
    fail_msg: >-
      per-device line mismatch: config renders {{ _conf_devices | sort }}
      but the qualifying device set is {{ smart_monitored_disks_by_id }}

- name: _verify | Assert smartd.conf dpkg divert is active  # noqa: command-instead-of-module
  command: dpkg-divert --list /etc/smartd.conf
  register: _smart_smartd_divert
  changed_when: false
  become: true

- name: _verify | Assert divert entry exists
  assert:
    that:
      - "'diversion of /etc/smartd.conf' in _smart_smartd_divert.stdout"
    fail_msg: "dpkg-divert not active for /etc/smartd.conf: {{ _smart_smartd_divert.stdout }}"

- name: _verify | Assert /etc/default/smartmontools dpkg divert is active  # noqa: command-instead-of-module
  command: dpkg-divert --list /etc/default/smartmontools
  register: _smart_default_divert
  changed_when: false
  become: true

- name: _verify | Assert default divert entry exists
  assert:
    that:
      - "'diversion of /etc/default/smartmontools' in _smart_default_divert.stdout"
    fail_msg: "dpkg-divert not active for /etc/default/smartmontools: {{ _smart_default_divert.stdout }}"

- name: _verify | Deploy smart netdata collector config
  import_tasks: netdata.yml

- name: _verify | Start netdata
  systemd:
    name: netdata
    state: started
  become: true

- name: _verify | Read deployed smartctl collector config
  slurp:
    src: /etc/netdata/go.d/smartctl.conf
  register: _smart_smartctl_conf
  become: true

- name: _verify | Assert smartctl collector config is valid
  vars:
    _parsed: "{{ _smart_smartctl_conf | slurp_yaml }}"
  assert:
    that:
      - _parsed.jobs | length > 0
      - _parsed.jobs[0].name == 'smartctl'
      - _parsed.jobs[0].poll_devices_every == 300
    fail_msg: "deployed /etc/netdata/go.d/smartctl.conf:\n{{ _smart_smartctl_conf | slurp_text(trim=false) }}"
