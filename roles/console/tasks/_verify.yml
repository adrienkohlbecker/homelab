# Functional checks for the console role. The converge proves apt + copy +
# image generation exit-coded cleanly; these checks verify that the live VT
# carries the AZERTY keymap and that the generated image carries the console
# policy (source configuration on Noble, a compiled AZERTY keymap on Resolute).
#
# We reboot at the top of the verify so the keymap check sees what the boot
# chain applies, not just the live setupcon run from converge. Costs one extra
# ~30s boot per test run.

- name: _verify | Reboot to apply role changes
  import_role:
    name: reboot
    tasks_from: reboot

# dumpkeys reads the kernel VT's current keymap via KDGKBENT on /dev/tty0, so it
# doesn't depend on a controlling terminal and works from ansible's ssh session.
# AZERTY maps keycode 16 to 'a' (QWERTY maps it to 'q'). The end anchor avoids
# the ansible-core 2.20 handling bug for a word-boundary escape in `failed_when`.
- name: _verify | Live VT keymap is French AZERTY
  command: dumpkeys
  register: _console_dumpkeys
  changed_when: false
  failed_when: >-
    _console_dumpkeys.stdout
    | regex_findall('^\s*keycode\s+16\s*=\s*\+?a\s*$', multiline=True)
    | length == 0
  become: true

# initramfs-tools copies the policy files; Dracut console-setup compiles them
# into a keymap and a small setupcon script without the source configuration.
#
# Minimal boots a pre-baked initrd outside /boot. Deployment-shaped fixtures
# provide the per-kernel initrd inspected here.
- name: _verify | Inspect the current kernel's initrd
  when: not qemu_test_minimal
  block:
    - name: _verify | Initrd bundles console-setup + keyboard configs
      when: not initramfs_use_dracut
      command: lsinitramfs /boot/initrd.img-{{ ansible_kernel }}
      register: _console_initrd
      changed_when: false
      failed_when: >-
        not (['etc/default/console-setup', 'etc/default/keyboard']
             is subset(_console_initrd.stdout_lines))
      become: true

    - name: _verify | Dracut image contains a French AZERTY keymap
      when: initramfs_use_dracut
      command: >-
        lsinitrd --file etc/console-setup/cached_UTF-8_del.kmap
        /boot/initrd.img-{{ ansible_kernel }}
      register: _console_dracut_keymap
      changed_when: false
      failed_when: >-
        _console_dracut_keymap.stdout is not search('(?m)^keycode\\s+16\\s+=\\s+\\+?(a|U\\+0061)\\s')
      become: true
