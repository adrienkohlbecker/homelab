- name: Configure the boot image provider
  import_role:
    name: boot
    tasks_from: initramfs_provider
  tags:
    - console

- name: Install console dependencies
  apt:
    pkg: console-setup
    cache_valid_time: 3600
  register: console_apt
  become: true
  tags:
    - console

- name: Configure console policy
  copy:
    src: "{{ item }}"
    dest: /etc/default/{{ item }}
    owner: root
    group: root
    mode: "0644"
    backup: true
    validate: sh -n %s
  loop:
    - console-setup
    - keyboard
  register: console_cfg
  become: true
  tags:
    - console

# setupcon --save reads both policy files, applies them to the live VTs, and
# refreshes the cached keymap/font artifacts consumed by the initramfs hook.
# No --force (intentionally dropped): setupcon then fails loudly on a bad
# config rather than forcing it onto the live VTs, and --force can trigger
# a hard reboot when X holds the console.
- name: Apply console-setup + keyboard to live ttys
  when: console_cfg.changed
  command: setupcon --save
  changed_when: true
  become: true
  tags:
    - console

# setupcon already applied the policy to the live VTs; only the next boot's
# image needs it.
- name: Rebuild boot images with the console policy
  import_role:
    name: boot
    tasks_from: initramfs_rebuild
  vars:
    boot_initramfs_args:
      changed: '{{ console_cfg.changed or console_apt.changed }}'
      reboot: false
  tags:
    - console
