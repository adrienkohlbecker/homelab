- name: Install console dependencies
  apt:
    pkg:
      - initramfs-tools
      - console-setup
    cache_valid_time: 3600
  become: true
  tags:
    - console

- name: Configure console policy
  copy:
    src: "{{ item }}"
    dest: /etc/default/{{ item }}
    owner: root
    group: root
    mode: "0644"
    backup: true
    validate: sh -n %s
  loop:
    - console-setup
    - keyboard
  register: console_cfg
  become: true
  tags:
    - console

# setupcon --save reads both policy files, applies them to the live VTs, and
# refreshes the cached keymap/font artifacts consumed by the initramfs hook.
# No --force (intentionally dropped): setupcon then fails loudly on a bad
# config rather than forcing it onto the live VTs, and --force can trigger
# a hard reboot when X holds the console.
- name: Apply console-setup + keyboard to live ttys
  when: console_cfg.changed
  command: setupcon --save
  changed_when: true
  become: true
  tags:
    - console

- name: Update initramfs
  when: console_cfg.changed
  command: update-initramfs -u -k all
  changed_when: true
  become: true
  tags:
    - console

# The kernel argument below disables VT blanking; this unit separately disables
# monitor DPMS after console setup.
- name: Manage console_noblank.service
  import_role:
    name: systemd_unit
    tasks_from: unit
  vars:
    systemd_unit_args:
      src: console_noblank.service
  tags:
    - console

# Removing a grub.d fragment does not update grub.cfg by itself. Regenerate
# explicitly so a host with both filenames cannot retain the duplicate there.
- name: Remove legacy console GRUB fragment
  when: grub_bootloader
  file:
    path: /etc/default/grub.d/99-console.cfg
    state: absent
  register: console_legacy_grub_fragment
  become: true
  tags:
    - console

# Apply the argument to recovery entries too.
- name: Set consoleblank=0 kernel arg
  import_role:
    name: boot
    tasks_from: cmdline
  vars:
    boot_cmdline_args:
      name: consoleblank
      contents: consoleblank=0
      grub_scope: all
  tags:
    - console

- name: Update grub after removing the legacy console fragment
  when:
    - grub_bootloader
    - console_legacy_grub_fragment.changed
    - not ansible_check_mode
  command: update-grub
  changed_when: true
  become: true
  tags:
    - console
