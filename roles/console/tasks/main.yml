- name: Install console dependencies
  apt:
    pkg:
      - initramfs-tools
      - console-setup
    cache_valid_time: 3600
  become: true
  register: console_apt
  tags:
    - console

- name: Configure console policy
  copy:
    src: "{{ item }}"
    dest: /etc/default/{{ item }}
    owner: root
    group: root
    mode: "0644"
    backup: true
    validate: sh -n %s
  loop:
    - console-setup
    - keyboard
  register: console_cfg
  become: true
  tags:
    - console

# setupcon --save reads both /etc/default/console-setup and
# /etc/default/keyboard, so a single invocation covers both changes.
# No --force (intentionally dropped): setupcon then fails loudly on a bad
# config rather than forcing it onto the live VTs, and --force can trigger
# a hard reboot when X holds the console. The live VTs pick up the new
# config at the next boot (reboot-required is touched below).
- name: Apply console-setup + keyboard to live ttys
  when: console_cfg.changed and not ansible_check_mode
  command: setupcon --save
  changed_when: true
  become: true
  tags:
    - console

- name: Update initramfs
  when:
    - console_cfg.changed
    - not (ansible_check_mode and console_apt.changed)
  command: update-initramfs -u -k all
  changed_when: true
  become: true
  tags:
    - console

# The kernel argument below disables VT blanking; this unit separately disables
# monitor DPMS after console setup.
- name: Manage console_noblank.service
  import_role:
    name: systemd_unit
    tasks_from: unit
  vars:
    systemd_unit_args:
      src: console_noblank.service
  tags:
    - console

# Apply the argument to recovery entries too; keep the historical GRUB fragment
# name distinct from the ZBM fragment name.
- name: Set consoleblank=0 kernel arg
  import_role:
    name: boot
    tasks_from: cmdline
  vars:
    boot_cmdline_args:
      name: consoleblank
      grub_name: console
      contents: consoleblank=0
      grub_scope: all
  tags:
    - console

# The cmdline engine touches /var/run/reboot-required for the consoleblank arg on
# either bootloader; this covers the console-setup / keyboard file changes.
- name: Ask to reboot
  when: console_cfg.changed
  file:
    path: /var/run/reboot-required
    state: touch
    owner: root
    group: root
    mode: "0644"
  become: true
  tags:
    - console
