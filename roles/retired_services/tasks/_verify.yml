---
- name: _verify | Query retired kdump packages
  command:
    argv:
      - dpkg-query
      - --show
      - --showformat=${db:Status-Status}
      - "{{ item }}"
  loop:
    - kdump-tools
    - makedumpfile
    - kexec-tools
    - crash
  register: retired_services_kdump_packages
  changed_when: false
  failed_when: >-
    retired_services_kdump_packages.rc != 1
    and retired_services_kdump_packages.stdout != 'not-installed'

# ZFSBootMenu boots the next kernel with this property.
- name: _verify | Next boot reserves no crash memory
  command: zfs get -H -o value org.zfsbootmenu:commandline rpool/ROOT
  register: retired_services_kdump_cmdline
  changed_when: false
  failed_when: >-
    retired_services_kdump_cmdline.rc != 0
    or 'crashkernel' in retired_services_kdump_cmdline.stdout
  become: true

- name: _verify | Query retired kdump units
  systemd:
    name: "{{ item }}"
  loop:
    - kdump_nmi_watchdog.timer
    - kdump_nmi_watchdog.service
    - kdump-tools.service
  register: retired_services_kdump_units
  failed_when: retired_services_kdump_units.status.LoadState != 'not-found'
  become: true

# Teardown must never delete saved dumps.
- name: _verify | Saved vmcore survives the teardown
  command: cat /var/crash/202601010000/dump.202601010000
  register: retired_services_kdump_vmcore
  changed_when: false
  failed_when: retired_services_kdump_vmcore.stdout != 'vmcore'
  become: true

- name: _verify | Query retired zfs units
  systemd:
    name: "{{ item }}"
  loop:
    - zfs_trim_rpool.timer
    - zfs_trim_rpool.service
    - zfs_health.timer
    - zfs_health.service
  register: retired_services_zfs_units
  failed_when: retired_services_zfs_units.status.LoadState != 'not-found'
  become: true

- name: _verify | Query the retired i7z package
  command:
    argv:
      - dpkg-query
      - --show
      - --showformat=${db:Status-Status}
      - i7z
  register: retired_services_i7z
  changed_when: false
  failed_when: >-
    retired_services_i7z.rc != 1
    and retired_services_i7z.stdout != 'not-installed'

# A removed but unpurged package reports config-files.
- name: _verify | Retired user role packages are purged
  command:
    argv:
      - dpkg-query
      - --show
      - --showformat=${db:Status-Status}
      - "{{ item }}"
  loop:
    - ccze
    - fatrace
    - nmon
    - nnn
    - stress
    - telnet
  register: retired_services_user_packages
  changed_when: false
  failed_when: >-
    retired_services_user_packages.rc != 1
    and retired_services_user_packages.stdout != 'not-installed'

- name: _verify | Stat retired leftovers
  stat:
    path: "{{ item }}"
  loop:
    - /etc/terminfo/xterm-ghostty.terminfo
    - /etc/terminfo/g
    - /mnt/services/tailscale/tailscaled.log.conf
    - /mnt/services/tailscale/tailscaled.log1.txt
    - /boot/efi/EFI/refind/BOOT.CSV
    - /boot/efi/EFI/refind/keys
    - /boot/efi/EFI/refind/refind.conf-sample
  register: retired_services_leftovers
  become: true

- name: _verify | Retired leftovers are gone
  assert:
    that: retired_services_leftovers.results | selectattr('stat.exists') | list | length == 0
    fail_msg: "left behind: {{ retired_services_leftovers.results | selectattr('stat.exists') | map(attribute='item') | join(', ') }}"

# The teardown names exact files; tailscale's live state must survive.
- name: _verify | Tailscale state survives the teardown
  stat:
    path: /mnt/services/tailscale/tailscaled.state
  register: retired_services_tailscale_state
  failed_when: not retired_services_tailscale_state.stat.exists
  become: true

- name: _verify | Retired Eaton IPP state is gone
  stat:
    path: /mnt/services/eaton_ipp
  register: retired_services_eaton_ipp
  failed_when: retired_services_eaton_ipp.stat.exists
  become: true

- name: _verify | Stat the backup key paths
  stat:
    path: /root/.ssh/id_ed25519{{ item }}
  loop:
    - ""
    - .pub
  register: retired_services_backup_keys
  become: true

- name: _verify | Backup key link is gone and the regular file survives
  assert:
    that:
      - not retired_services_backup_keys.results[0].stat.exists
      - retired_services_backup_keys.results[1].stat.isreg

- name: _verify | Query the retired operator prune user units
  systemd:
    name: "{{ item }}"
    scope: user
  loop:
    - podman_prune.timer
    - podman_prune.service
  register: retired_services_operator_prune_units
  failed_when: retired_services_operator_prune_units.status.LoadState != 'not-found'
  become: true
  become_user: "{{ ansible_user_id }}"

- name: _verify | Find leftover operator prune user enablement links
  find:
    paths: "{{ ansible_user_dir }}/.config/systemd/user"
    patterns: podman_prune.*
    file_type: any
    recurse: true
  register: retired_services_operator_prune_links
  failed_when: retired_services_operator_prune_links.matched != 0
