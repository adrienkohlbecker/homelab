---
- name: _verify | Retired logrotate diversion is absent  # noqa: command-instead-of-module -- read-only query
  command: dpkg-divert --listpackage /etc/logrotate.d/apt
  register: retired_services_logrotate_diversion
  changed_when: false
  failed_when: retired_services_logrotate_diversion.stdout | trim | length > 0
  become: true

- name: _verify | Retired diversion files were preserved
  command: grep -Fx "{{ item.content }}" "{{ item.path }}"
  loop:
    - path: /etc/logrotate.d/apt
      content: '# active local config'
    - path: /etc/logrotate.d/apt.dpkg-dist
      content: '# saved package config'
  changed_when: false
  become: true

- name: _verify | Retired podman socket drop-in is absent
  stat:
    path: /etc/systemd/system/podman.socket.d/override.conf
  register: retired_services_podman_socket_dropin
  failed_when: retired_services_podman_socket_dropin.stat.exists
  become: true

- name: _verify | Retired NUT driver drop-in is absent
  stat:
    path: /etc/systemd/system/nut-driver@eaton.service.d/override.conf
  register: retired_services_nut_driver_dropin
  failed_when: retired_services_nut_driver_dropin.stat.exists
  become: true

- name: _verify | Retired upsset CGI sentinel is absent
  command: grep -Fx I_HAVE_SECURED_MY_CGI_DIRECTORY /etc/nut/upsset.conf
  register: retired_services_upsset_sentinel
  changed_when: false
  failed_when: retired_services_upsset_sentinel.rc not in [1, 2]
  become: true

- name: _verify | Packaged podman tmpfiles entry is active
  command: grep -Fx 'D! /run/podman 0700 root root' /usr/lib/tmpfiles.d/podman.conf
  changed_when: false
  become: true

- name: _verify | Retired podman tmpfiles diversion is absent  # noqa: command-instead-of-module
  command: dpkg-divert --listpackage /usr/lib/tmpfiles.d/podman.conf
  register: retired_services_podman_diversion
  changed_when: false
  failed_when: retired_services_podman_diversion.stdout | trim | length > 0
  become: true

- name: _verify | Packaged chrony defaults are active
  command: grep -Fx 'DAEMON_OPTS="-F 1"' /etc/default/chrony
  changed_when: false
  become: true

- name: _verify | Retired chrony defaults diversion is absent  # noqa: command-instead-of-module
  command: dpkg-divert --listpackage /etc/default/chrony
  register: retired_services_chrony_diversion
  changed_when: false
  failed_when: retired_services_chrony_diversion.stdout | trim | length > 0
  become: true

- name: _verify | Chrony no longer runs IPv4-only
  command: pgrep -a chronyd
  register: retired_services_chronyd_process
  changed_when: false
  failed_when: retired_services_chronyd_process.stdout is search('/chronyd .* -4( |$)')
  become: true

- name: _verify | Retired timesyncd mask is absent
  stat:
    path: /etc/systemd/system/systemd-timesyncd.service
    follow: false
  register: retired_services_timesyncd_mask
  failed_when: retired_services_timesyncd_mask.stat.exists
  become: true

- name: _verify | Retired podman socket group is absent
  command: getent group podman-socket
  register: retired_services_podman_socket_group
  changed_when: false
  failed_when: retired_services_podman_socket_group.rc != 2
  become: true

- name: _verify | Retired custom Samba mDNS service is absent
  stat:
    path: /etc/avahi/services/smb.service
  register: retired_services_samba_mdns
  failed_when: retired_services_samba_mdns.stat.exists
  become: true

- name: _verify | Retired Netdata smartctl collector override is absent
  stat:
    path: /etc/netdata/go.d/smartctl.conf
  register: retired_services_netdata_smartctl
  failed_when: retired_services_netdata_smartctl.stat.exists
  become: true

- name: _verify | Retired Netdata diversion is absent  # noqa: command-instead-of-module
  command: dpkg-divert --listpackage /etc/netdata/netdata.conf
  register: retired_services_netdata_diversion
  changed_when: false
  failed_when: retired_services_netdata_diversion.stdout | trim | length > 0
  become: true

- name: _verify | Managed Netdata conffile was retained
  command: grep -Fx '# retained Netdata config' /etc/netdata/netdata.conf
  changed_when: false
  become: true

- name: _verify | Retired smartmontools defaults file is absent
  stat:
    path: /etc/default/smartmontools
  register: retired_services_smartmontools_defaults
  failed_when: retired_services_smartmontools_defaults.stat.exists
  become: true

- name: _verify | Retired smartmontools defaults diversion is absent  # noqa: command-instead-of-module
  command: dpkg-divert --listpackage /etc/default/smartmontools
  register: retired_services_smartmontools_diversion
  changed_when: false
  failed_when: retired_services_smartmontools_diversion.stdout | trim | length > 0
  become: true

- name: _verify | Retired kdump oops panic sysctl pin is absent
  command: grep -Eq '^kernel[.]panic_on_oops=' /etc/sysctl.d/30-kdump.conf
  register: retired_services_kdump_oops_panic
  changed_when: false
  failed_when: retired_services_kdump_oops_panic.rc != 1
  become: true

- name: _verify | Active kdump sysctl entry was preserved
  command: grep -Fx kernel.panic=10 /etc/sysctl.d/30-kdump.conf
  changed_when: false
  become: true

- name: _verify | Retired smartd diversion is absent  # noqa: command-instead-of-module
  command: dpkg-divert --listpackage /etc/smartd.conf
  register: retired_services_smartd_diversion
  changed_when: false
  failed_when: retired_services_smartd_diversion.stdout | trim | length > 0
  become: true

- name: _verify | Managed smartd conffile was retained
  command: grep -Fx '# retained smartd config' /etc/smartd.conf
  changed_when: false
  become: true

- name: _verify | Retired hd-idle diversion is absent  # noqa: command-instead-of-module
  command: dpkg-divert --listpackage /etc/default/hd-idle
  register: retired_services_hd_idle_diversion
  changed_when: false
  failed_when: retired_services_hd_idle_diversion.stdout | trim | length > 0
  become: true

- name: _verify | Managed hd-idle conffile was retained
  command: grep -Fx '# retained hd-idle config' /etc/default/hd-idle
  changed_when: false
  become: true

- name: _verify | Retired hdparm diversion is absent  # noqa: command-instead-of-module
  command: dpkg-divert --listpackage /etc/hdparm.conf
  register: retired_services_hdparm_diversion
  changed_when: false
  failed_when: retired_services_hdparm_diversion.stdout | trim | length > 0
  become: true

- name: _verify | Managed hdparm conffile was retained
  command: grep -Fx '# retained hdparm config' /etc/hdparm.conf
  changed_when: false
  become: true

- name: _verify | Retired ZFS cron files are absent
  stat:
    path: "{{ item }}"
  loop:
    - /etc/cron.d/zfsutils-linux
    - /etc/cron.d/zfsutils-linux.disabled
  register: retired_services_zfs_cron_files
  failed_when: retired_services_zfs_cron_files.stat.exists
  become: true

- name: _verify | Retired Mailutils sender-domain config is absent
  stat:
    path: /etc/mailutils.conf
  register: retired_services_mailutils
  failed_when: retired_services_mailutils.stat.exists
  become: true

- name: _verify | GNU Mailutils package is absent
  command: dpkg-query -W mailutils
  register: retired_services_mailutils_package
  changed_when: false
  failed_when: retired_services_mailutils_package.rc == 0

- name: _verify | Retired compiled Postfix aliases are absent
  stat:
    path: /etc/aliases.db
  register: retired_services_postfix_aliases
  failed_when: retired_services_postfix_aliases.stat.exists
  become: true

- name: _verify | Retired www-data ssl-cert membership is absent
  getent:
    database: group
    key: ssl-cert
  register: retired_services_ssl_cert_group
  failed_when: >-
    'www-data' in
    (retired_services_ssl_cert_group.ansible_facts.getent_group['ssl-cert'][2]
    | default('')).split(',')
  become: true

- name: _verify | Retired nginx files are absent
  stat:
    path: "{{ item }}"
  loop:
    - /etc/nginx/dhparam.pem
    - /etc/nginx/conf.d/status.conf
  register: retired_services_nginx_files
  failed_when: retired_services_nginx_files.stat.exists
  become: true

- name: _verify | Retired service state is absent
  stat:
    path: "{{ item }}"
  loop:
    - /mnt/services/healthchecks
    - /mnt/services/sqlite/healthchecks
    - /mnt/services/openobserve
    - /mnt/services/sqlite/openobserve
    - /mnt/services/plex
    - /mnt/services/sqlite/plex
    - /mnt/services/tautulli
    - /mnt/services/sqlite/tautulli
    - /mnt/services/webmail
    - /mnt/services/sqlite/roundcube
  register: retired_services_state
  failed_when: retired_services_state.stat.exists
  become: true

- name: _verify | Gather service facts
  service_facts:
  become: true

- name: _verify | Retired units are absent
  assert:
    that:
      - item not in ansible_facts.services
    fail_msg: "{{ item }} remains known to systemd"
  loop:
    - dovecot.service
    - healthchecks.service
    - plex.service
    - roundcube.service
    - speedtest.service
    - tautulli.service
    - sabnzbd_ini_sort.path
    - sabnzbd_ini_sort.service
    - sort_ini_mnt-services-sabnzbd-sabnzbd.ini.path
    - sort_ini_mnt-services-sabnzbd-sabnzbd.ini.service
    - sort_ini_mnt-services-tautulli-config.ini.path
    - sort_ini_mnt-services-tautulli-config.ini.service

- name: _verify | Retired ini canonicalizers are absent
  stat:
    path: "{{ item }}"
  loop:
    - /usr/local/bin/sort_ini
    - /usr/local/bin/sabnzbd_sort_ini
  register: retired_services_sort_ini
  failed_when: retired_services_sort_ini.stat.exists
  become: true

- name: _verify | Retired nzbToMedia files are absent
  stat:
    path: "{{ item }}"
  loop:
    - /opt/nzbToMedia
    - /mnt/services/sabnzbd/autoProcessMedia.cfg
    - /mnt/services/sabnzbd/autoProcessMedia.cfg.123.2026-08-21@00:00:00~
  register: retired_services_nzbtomedia_files
  failed_when: retired_services_nzbtomedia_files.stat.exists
  become: true

- name: _verify | Retired root backup SSH config is absent
  stat:
    path: /root/.ssh/config
  register: retired_services_root_ssh_config
  failed_when: retired_services_root_ssh_config.stat.exists
  become: true

- name: _verify | Retired Netplan rollback files are absent
  stat:
    path: "{{ item }}"
  loop:
    - /etc/systemd/system/netplan_rollback.service
    - /etc/systemd/system/netplan_rollback.timer
    - /usr/local/bin/netplan_rollback
  register: retired_services_netplan_rollback_files
  failed_when: retired_services_netplan_rollback_files.stat.exists
  become: true

- name: _verify | Retired root backup identity is absent
  stat:
    path: /mnt/services/ssh_root
  register: retired_services_root_backup_identity
  failed_when: retired_services_root_backup_identity.stat.exists
  become: true

- name: _verify | Retired Fluent Bit files are absent
  stat:
    path: "{{ item }}"
  loop:
    - /etc/fluent-bit/services/plex.yaml
    - /etc/fluent-bit/services/speedtest.yaml
    - /etc/fluent-bit/services/tautulli.yaml
    - /var/lib/fluent-bit/plex.db
    - /var/lib/fluent-bit/plex.db-shm
    - /var/lib/fluent-bit/plex.db-wal
    - /var/lib/fluent-bit/plex-scanner.db
    - /var/lib/fluent-bit/plex-crash-uploader.db
    - /var/lib/fluent-bit/tautulli-websocket.db
    - /var/lib/fluent-bit/nzbtomedia.db
    - /var/lib/fluent-bit/nzbtomedia.db-shm
    - /var/lib/fluent-bit/nzbtomedia.db-wal
  register: retired_services_fluentbit_files
  failed_when: retired_services_fluentbit_files.stat.exists
  become: true

- name: _verify | Retired Speedtest nginx site is absent
  stat:
    path: /etc/nginx/{{ item }}/speedtest
  loop:
    - sites-available
    - sites-enabled
  register: retired_services_speedtest_nginx_files
  failed_when: retired_services_speedtest_nginx_files.stat.exists
  become: true

- name: _verify | Retired Speedtest Podman network is absent
  command:
    argv:
      - podman
      - network
      - exists
      - speedtest
  register: retired_services_speedtest_network
  changed_when: false
  failed_when: retired_services_speedtest_network.rc != 1
  become: true

- name: _verify | Retired webmail Podman network is absent
  command:
    argv:
      - podman
      - network
      - exists
      - webmail
  register: retired_services_webmail_network
  changed_when: false
  failed_when: retired_services_webmail_network.rc != 1
  become: true

- name: _verify | Retired service accounts and groups are absent
  command:
    argv:
      - getent
      - "{{ item.database }}"
      - "{{ item.name }}"
  loop:
    - { name: plex, database: passwd }
    - { name: plex, database: group }
    - { name: speedtest, database: passwd }
    - { name: speedtest, database: group }
    - { name: tautulli, database: passwd }
    - { name: tautulli, database: group }
  register: retired_services_identities
  changed_when: false
  failed_when: retired_services_identities.rc != 2
  become: true

- name: _verify | Explicitly configured management macvlan remains UP
  command: ip -br link show mac_mgmt
  register: retired_services_mac_mgmt
  changed_when: false
  failed_when: "'UP' not in retired_services_mac_mgmt.stdout"

- name: _verify | Retire management macvlan with an empty configuration twice
  include_role:
    name: retired_services
  vars:
    macvlan_blocks: [] # noqa: var-naming[no-role-prefix] -- macvlan input under test
  loop:
    - first removal
    - repeated removal

- name: _verify | Repeated management macvlan removal is idempotent
  assert:
    that: not mac_mgmt_service_result.changed

- name: _verify | Retired management macvlan is absent from the kernel
  command: ip -j link show
  register: retired_services_links
  changed_when: false
  failed_when: >-
    retired_services_links.stdout | from_json
    | selectattr('ifname', 'equalto', 'mac_mgmt') | list | length > 0

- name: _verify | Other configured macvlans remain UP
  command: ip -br link show {{ item.name }}
  loop: "{{ macvlan_blocks | rejectattr('name', 'equalto', 'mac_mgmt') | list }}"
  loop_control:
    label: "{{ item.name }}"
  register: retired_services_macvlan
  changed_when: false
  failed_when: "'UP' not in retired_services_macvlan.stdout"
