---
# dpkg can keep a not-installed record of a purged package, so compare the
# status itself; config-files would mean a removal without the purge.
- name: _verify | Query retired libvirt packages
  command:
    argv:
      - dpkg-query
      - --show
      - --showformat=${db:Status-Status}
      - "{{ item }}"
  loop:
    - libvirt-daemon-system
    - libvirt-clients
    - libvirt0
    - python3-libvirt
    - python3-lxml
  register: retired_services_libvirt_packages
  changed_when: false
  failed_when: >-
    retired_services_libvirt_packages.rc != 1
    and retired_services_libvirt_packages.stdout != 'not-installed'

# The bridge outlives the purged daemon unless the network was destroyed.
- name: _verify | Retired libvirt bridge is gone
  command: ip link show virbr0
  register: retired_services_libvirt_bridge
  changed_when: false
  failed_when: retired_services_libvirt_bridge.rc == 0

- name: _verify | Query retired libvirt units
  systemd:
    name: "{{ item }}"
  loop:
    - virsh_backup.timer
    - virsh_backup.service
    - zfs_mount_var_lib_libvirt_images.service
  register: retired_services_libvirt_units
  failed_when: retired_services_libvirt_units.status.LoadState != 'not-found'
  become: true

- name: _verify | Retired libvirt state is absent
  stat:
    path: "{{ item }}"
  loop:
    - /usr/local/bin/virsh_backup
    - /etc/libvirt
    - /var/lib/libvirt
    - /var/log/libvirt
  register: retired_services_libvirt_state
  failed_when: retired_services_libvirt_state.stat.exists
  become: true

- name: _verify | Retired libvirt accounts are absent
  command: getent {{ item.database }} {{ item.name }}
  loop:
    - {database: passwd, name: libvirt-qemu}
    - {database: passwd, name: libvirt-dnsmasq}
    - {database: group, name: libvirt}
    - {database: group, name: libvirt-qemu}
  register: retired_services_libvirt_accounts
  changed_when: false
  failed_when: retired_services_libvirt_accounts.rc != 2
