---
- name: _verify | Lookup retired Netdata poller account
  command:
    argv:
      - getent
      - passwd
      - netdata_poll
  register: retired_services_netdata_poll_passwd_verify
  changed_when: false
  failed_when: false

- name: _verify | Inspect retired Netdata poller artifacts
  stat:
    path: "{{ item }}"
  register: retired_services_netdata_poll_artifacts
  become: true
  loop:
    - /var/lib/systemd/linger/netdata_poll
    - /var/lib/netdata_poll
    - /usr/local/bin/netdata_poll_fetch
    - /opt/homepage_alerts/.ssh

- name: _verify | Assert retired Netdata poller was removed
  assert:
    that:
      - retired_services_netdata_poll_passwd_verify.rc != 0
      - retired_services_netdata_poll_artifacts.results | map(attribute='stat.exists') | select | list | length == 0
    quiet: true
    fail_msg: >-
      Netdata poller retirement left the account or an artifact behind.
