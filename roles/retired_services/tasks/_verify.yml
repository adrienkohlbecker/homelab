---
- name: _verify | Retired podman socket drop-in is absent
  stat:
    path: /etc/systemd/system/podman.socket.d/override.conf
  register: retired_services_podman_socket_dropin
  failed_when: retired_services_podman_socket_dropin.stat.exists
  become: true

- name: _verify | Packaged podman tmpfiles entry is active
  command: grep -Fx 'D! /run/podman 0700 root root' /usr/lib/tmpfiles.d/podman.conf
  changed_when: false
  become: true

- name: _verify | Retired podman tmpfiles diversion is absent  # noqa: command-instead-of-module
  command: dpkg-divert --listpackage /usr/lib/tmpfiles.d/podman.conf
  register: retired_services_podman_diversion
  changed_when: false
  failed_when: retired_services_podman_diversion.stdout | trim | length > 0
  become: true

- name: _verify | Retired podman socket group is absent
  command: getent group podman-socket
  register: retired_services_podman_socket_group
  changed_when: false
  failed_when: retired_services_podman_socket_group.rc != 2
  become: true

- name: _verify | Retired operator podman prune units are absent
  stat:
    path: /etc/systemd/user/{{ item }}
  loop:
    - podman_prune.service
    - podman_prune.timer
  register: retired_services_operator_podman_prune
  failed_when: retired_services_operator_podman_prune.stat.exists
  become: true

- name: _verify | Operator linger retired with the podman prune timer is absent
  stat:
    path: /var/lib/systemd/linger/{{ ansible_user_id }}
  register: retired_services_operator_linger
  failed_when: retired_services_operator_linger.stat.exists
  become: true

- name: _verify | Retired custom Samba mDNS service is absent
  stat:
    path: /etc/avahi/services/smb.service
  register: retired_services_samba_mdns
  failed_when: retired_services_samba_mdns.stat.exists
  become: true

- name: _verify | Retired Netdata smartctl collector override is absent
  stat:
    path: /etc/netdata/go.d/smartctl.conf
  register: retired_services_netdata_smartctl
  failed_when: retired_services_netdata_smartctl.stat.exists
  become: true

- name: _verify | Retired smartmontools defaults file is absent
  stat:
    path: /etc/default/smartmontools
  register: retired_services_smartmontools_defaults
  failed_when: retired_services_smartmontools_defaults.stat.exists
  become: true

- name: _verify | Retired smartmontools defaults diversion is absent  # noqa: command-instead-of-module
  command: dpkg-divert --listpackage /etc/default/smartmontools
  register: retired_services_smartmontools_diversion
  changed_when: false
  failed_when: retired_services_smartmontools_diversion.stdout | trim | length > 0
  become: true

- name: _verify | Retired Mailutils sender-domain config is absent
  stat:
    path: /etc/mailutils.conf
  register: retired_services_mailutils
  failed_when: retired_services_mailutils.stat.exists
  become: true

- name: _verify | GNU Mailutils package is absent
  command: dpkg-query -W mailutils
  register: retired_services_mailutils_package
  changed_when: false
  failed_when: retired_services_mailutils_package.rc == 0

- name: _verify | Retired compiled Postfix aliases are absent
  stat:
    path: /etc/aliases.db
  register: retired_services_postfix_aliases
  failed_when: retired_services_postfix_aliases.stat.exists
  become: true

- name: _verify | Retained Plex and Tautulli data markers remain
  stat:
    path: "{{ item }}/.retired_services_keep"
  loop:
    - /mnt/services/plex
    - /mnt/services/sqlite/plex
    - /mnt/services/tautulli
    - /mnt/services/sqlite/tautulli
  register: retired_services_data_markers
  failed_when: not retired_services_data_markers.stat.exists
  become: true

- name: _verify | Gather service facts
  service_facts:
  become: true

- name: _verify | Retired units are absent
  assert:
    that:
      - item not in ansible_facts.services
    fail_msg: "{{ item }} remains known to systemd"
  loop:
    - plex.service
    - speedtest.service
    - tautulli.service
    - sabnzbd_ini_sort.path
    - sabnzbd_ini_sort.service
    - sort_ini_mnt-services-sabnzbd-sabnzbd.ini.path
    - sort_ini_mnt-services-sabnzbd-sabnzbd.ini.service
    - sort_ini_mnt-services-tautulli-config.ini.path
    - sort_ini_mnt-services-tautulli-config.ini.service

- name: _verify | Retired ini canonicalizers are absent
  stat:
    path: "{{ item }}"
  loop:
    - /usr/local/bin/sort_ini
    - /usr/local/bin/sabnzbd_sort_ini
  register: retired_services_sort_ini
  failed_when: retired_services_sort_ini.stat.exists
  become: true

- name: _verify | Retired nzbToMedia files are absent
  stat:
    path: "{{ item }}"
  loop:
    - /opt/nzbToMedia
    - /mnt/services/sabnzbd/autoProcessMedia.cfg
    - /mnt/services/sabnzbd/autoProcessMedia.cfg.123.2026-08-21@00:00:00~
  register: retired_services_nzbtomedia_files
  failed_when: retired_services_nzbtomedia_files.stat.exists
  become: true

- name: _verify | Retired root backup SSH config is absent
  stat:
    path: /root/.ssh/config
  register: retired_services_root_ssh_config
  failed_when: retired_services_root_ssh_config.stat.exists
  become: true

- name: _verify | Retired root backup identity is absent
  stat:
    path: /mnt/services/ssh_root
  register: retired_services_root_backup_identity
  failed_when: retired_services_root_backup_identity.stat.exists
  become: true

- name: _verify | Retired Fluent Bit files are absent
  stat:
    path: "{{ item }}"
  loop:
    - /etc/fluent-bit/services/plex.yaml
    - /etc/fluent-bit/services/speedtest.yaml
    - /etc/fluent-bit/services/tautulli.yaml
    - /var/lib/fluent-bit/plex.db
    - /var/lib/fluent-bit/plex.db-shm
    - /var/lib/fluent-bit/plex.db-wal
    - /var/lib/fluent-bit/plex-scanner.db
    - /var/lib/fluent-bit/plex-crash-uploader.db
    - /var/lib/fluent-bit/tautulli-websocket.db
    - /var/lib/fluent-bit/nzbtomedia.db
    - /var/lib/fluent-bit/nzbtomedia.db-shm
    - /var/lib/fluent-bit/nzbtomedia.db-wal
  register: retired_services_fluentbit_files
  failed_when: retired_services_fluentbit_files.stat.exists
  become: true

- name: _verify | Retired Speedtest nginx site is absent
  stat:
    path: /etc/nginx/{{ item }}/speedtest
  loop:
    - sites-available
    - sites-enabled
  register: retired_services_speedtest_nginx_files
  failed_when: retired_services_speedtest_nginx_files.stat.exists
  become: true

- name: _verify | Retired Speedtest Podman network is absent
  command:
    argv:
      - podman
      - network
      - exists
      - speedtest
  register: retired_services_speedtest_network
  changed_when: false
  failed_when: retired_services_speedtest_network.rc != 1
  become: true

- name: _verify | Retired Speedtest account and group are absent
  command:
    argv:
      - getent
      - "{{ item }}"
      - speedtest
  loop:
    - passwd
    - group
  register: retired_services_speedtest_identity
  changed_when: false
  failed_when: retired_services_speedtest_identity.rc != 2
  become: true
