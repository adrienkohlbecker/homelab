---
# dpkg can keep a not-installed record of a purged package, so compare the
# status itself; config-files would mean a removal without the purge.
- name: _verify | Query retired libvirt packages
  command:
    argv:
      - dpkg-query
      - --show
      - --showformat=${db:Status-Status}
      - "{{ item }}"
  loop:
    - libvirt-daemon-system
    - libvirt-clients
    - libvirt0
    - python3-libvirt
    - python3-lxml
  register: retired_services_libvirt_packages
  changed_when: false
  failed_when: >-
    retired_services_libvirt_packages.rc != 1
    and retired_services_libvirt_packages.stdout != 'not-installed'

# The bridge outlives the purged daemon unless the network was destroyed.
- name: _verify | Retired libvirt bridge is gone
  command: ip link show virbr0
  register: retired_services_libvirt_bridge
  changed_when: false
  failed_when: retired_services_libvirt_bridge.rc == 0

- name: _verify | Query retired libvirt units
  systemd:
    name: "{{ item }}"
  loop:
    - virsh_backup.timer
    - virsh_backup.service
    - zfs_mount_var_lib_libvirt_images.service
  register: retired_services_libvirt_units
  failed_when: retired_services_libvirt_units.status.LoadState != 'not-found'
  become: true

- name: _verify | Retired libvirt state is absent
  stat:
    path: "{{ item }}"
  loop:
    - /usr/local/bin/virsh_backup
    - /etc/libvirt
    - /var/lib/libvirt
    - /var/log/libvirt
  register: retired_services_libvirt_state
  failed_when: retired_services_libvirt_state.stat.exists
  become: true

- name: _verify | Retired libvirt accounts are absent
  command: getent {{ item.database }} {{ item.name }}
  loop:
    - {database: passwd, name: libvirt-qemu}
    - {database: passwd, name: libvirt-dnsmasq}
    - {database: group, name: libvirt}
    - {database: group, name: libvirt-qemu}
  register: retired_services_libvirt_accounts
  changed_when: false
  failed_when: retired_services_libvirt_accounts.rc != 2

- name: _verify | Query retired kdump packages
  command:
    argv:
      - dpkg-query
      - --show
      - --showformat=${db:Status-Status}
      - "{{ item }}"
  loop:
    - kdump-tools
    - makedumpfile
    - kexec-tools
    - crash
  register: retired_services_kdump_packages
  changed_when: false
  failed_when: >-
    retired_services_kdump_packages.rc != 1
    and retired_services_kdump_packages.stdout != 'not-installed'

# ZFSBootMenu boots the next kernel with this property.
- name: _verify | Next boot reserves no crash memory
  command: zfs get -H -o value org.zfsbootmenu:commandline rpool/ROOT
  register: retired_services_kdump_cmdline
  changed_when: false
  failed_when: >-
    retired_services_kdump_cmdline.rc != 0
    or 'crashkernel' in retired_services_kdump_cmdline.stdout
  become: true

- name: _verify | Query retired kdump units
  systemd:
    name: "{{ item }}"
  loop:
    - kdump_nmi_watchdog.timer
    - kdump_nmi_watchdog.service
    - kdump-tools.service
  register: retired_services_kdump_units
  failed_when: retired_services_kdump_units.status.LoadState != 'not-found'
  become: true

# Teardown must never delete saved dumps.
- name: _verify | Saved vmcore survives the teardown
  command: cat /var/crash/202601010000/dump.202601010000
  register: retired_services_kdump_vmcore
  changed_when: false
  failed_when: retired_services_kdump_vmcore.stdout != 'vmcore'
  become: true

- name: _verify | Query retired zfs units
  systemd:
    name: "{{ item }}"
  loop:
    - zfs_trim_rpool.timer
    - zfs_trim_rpool.service
    - zfs_health.timer
    - zfs_health.service
  register: retired_services_zfs_units
  failed_when: retired_services_zfs_units.status.LoadState != 'not-found'
  become: true
