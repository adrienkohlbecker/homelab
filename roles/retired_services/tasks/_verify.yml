---
- name: _verify | Read retired zfs_autobackup Podman user masks
  stat:
    path: "/var/lib/zfs_autobackup/.config/systemd/user/{{ item }}"
    follow: false
  loop:
    - podman.service
    - podman.socket
  register: retired_services_zfs_autobackup_masks
  become: true

- name: _verify | Retired zfs_autobackup Podman user masks are absent
  assert:
    that:
      - retired_services_zfs_autobackup_masks.results | map(attribute='stat.exists') | select | list | length == 0
