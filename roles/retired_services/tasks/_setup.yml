---
# Recreate what the retired libvirt role left on a host: the daemon with its
# default network running, the virsh_backup timer, the images mount check,
# and libvirt's own state directories.
- name: _setup | Install retired libvirt packages
  apt:
    name:
      - libvirt-clients
      - libvirt-daemon
      - libvirt-daemon-system
      - python3-libvirt
      - python3-lxml
    state: present
    cache_valid_time: 3600
  become: true

- name: _setup | Start the retired libvirt default network
  command: virsh net-start default
  register: retired_services_setup_net_start
  changed_when: retired_services_setup_net_start.rc == 0
  failed_when:
    - retired_services_setup_net_start.rc != 0
    - "'already active' not in retired_services_setup_net_start.stderr"
  become: true

- name: _setup | Create the retired virsh_backup executable
  copy:
    content: "#!/bin/sh\n"
    dest: /usr/local/bin/virsh_backup
    owner: root
    group: root
    mode: "0755"
  become: true

- name: _setup | Install the retired virsh_backup timer
  import_role:
    name: systemd_timer
    tasks_from: install
  vars:
    systemd_timer_args:
      name: virsh_backup
      description: Daily libvirt domain backup
      on_calendar: "*-*-* 00:05:00"
      exec_start: /usr/local/bin/virsh_backup

- name: _setup | Create the retired libvirt images mount check
  copy:
    content: |
      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/bin/true

      [Install]
      WantedBy=multi-user.target
    dest: /etc/systemd/system/zfs_mount_var_lib_libvirt_images.service
    owner: root
    group: root
    mode: "0644"
  become: true

- name: _setup | Start the retired libvirt images mount check
  systemd:
    name: zfs_mount_var_lib_libvirt_images.service
    daemon_reload: true
    enabled: true
    state: started
  become: true

- name: _setup | Seed retired libvirt images state
  copy:
    content: "<pool/>\n"
    dest: /var/lib/libvirt/images/pool_default.xml
    owner: root
    group: root
    mode: "0600"
  become: true
