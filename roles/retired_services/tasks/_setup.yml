---
# Recreate what the retired kdump role left on a host: the capture packages,
# the crashkernel reservation, the NMI re-arm timer, its sysctl file, and a
# saved vmcore beside the kdump-config runtime files.
- name: _setup | Install retired kdump packages
  apt:
    name:
      - kdump-tools
      - makedumpfile
      - kexec-tools
      - crash
    install_recommends: false
    policy_rc_d: 101
    state: present
    cache_valid_time: 3600
  become: true

- name: _setup | Reserve crashkernel memory
  import_role:
    name: boot
    tasks_from: cmdline
  vars:
    boot_cmdline_args:
      name: crashkernel
      contents: crashkernel=512M,high crashkernel=128M,low

- name: _setup | Create the retired kdump NMI watchdog re-arm units
  copy:
    content: "{{ item.content }}"
    dest: /etc/systemd/system/{{ item.name }}
    owner: root
    group: root
    mode: "0644"
  loop:
    - name: kdump_nmi_watchdog.service
      content: |
        [Service]
        Type=oneshot
        ExecStart=/bin/true
    - name: kdump_nmi_watchdog.timer
      content: |
        [Timer]
        OnBootSec=3min

        [Install]
        WantedBy=timers.target
  loop_control:
    label: "{{ item.name }}"
  become: true

- name: _setup | Enable the retired kdump NMI watchdog re-arm timer
  systemd:
    name: kdump_nmi_watchdog.timer
    daemon_reload: true
    enabled: true
  become: true

- name: _setup | Create the retired kdump sysctl file
  copy:
    content: "kernel.panic=10\n"
    dest: /etc/sysctl.d/30-kdump.conf
    owner: root
    group: root
    mode: "0644"
  become: true

- name: _setup | Create the crash directory
  file:
    path: /var/crash/202601010000
    state: directory
    owner: root
    group: root
    mode: "0750"
  become: true

- name: _setup | Seed a saved vmcore and kdump-config runtime files
  copy:
    content: "{{ item.content }}"
    dest: "{{ item.path }}"
    owner: root
    group: root
    mode: "0600"
  loop:
    - { path: /var/crash/202601010000/dump.202601010000, content: "vmcore\n" }
    - { path: /var/crash/kdump_lock, content: "" }
    - { path: /var/crash/kexec_cmd, content: "kexec -p\n" }
  loop_control:
    label: "{{ item.path }}"
  become: true

- name: _setup | Install the retired zfs_trim timer
  import_role:
    name: systemd_timer
    tasks_from: install
  vars:
    systemd_timer_args:
      name: zfs_trim_rpool
      description: Weekly ZFS trim for rpool
      on_calendar: "Thu *-*-* 00:05:00"
      exec_start: /bin/true

- name: _setup | Create the retired ZFS scripts
  copy:
    content: "#!/bin/sh\n"
    dest: "{{ item }}"
    owner: root
    group: root
    mode: "0755"
  loop:
    - /usr/local/bin/zfs_update_mount_cache
    - /usr/local/bin/zfs_health
  become: true

- name: _setup | Install the retired zfs_health timer
  import_role:
    name: systemd_timer
    tasks_from: install
  vars:
    systemd_timer_args:
      name: zfs_health
      description: Daily ZFS health check
      on_calendar: "*-*-* 00:06:00"
      exec_start: /usr/local/bin/zfs_health

# i7z is an x86-only package.
- name: _setup | Install the retired i7z package
  when: ansible_architecture == 'x86_64'
  apt:
    name: i7z
    state: present
    install_recommends: false
    cache_valid_time: 3600
  become: true

- name: _setup | Create the retired terminfo alias directory
  file:
    path: /etc/terminfo/g
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: _setup | Create the tailscale services directory
  file:
    path: /mnt/services/tailscale
    state: directory
    owner: root
    group: root
    mode: "0700"
  become: true

- name: _setup | Create the refind ESP directory
  file:
    path: /boot/efi/EFI/refind/keys
    state: directory
    mode: "0755"
  become: true

- name: _setup | Seed retired leftovers
  copy:
    content: "stale\n"
    dest: "{{ item }}"
    mode: "0644"
  loop:
    - /etc/terminfo/xterm-ghostty.terminfo
    - /etc/terminfo/g/ghostty
    - /mnt/services/tailscale/tailscaled.log.conf
    - /mnt/services/tailscale/tailscaled.log1.txt
    - /mnt/services/tailscale/tailscaled.state
    - /boot/efi/EFI/refind/BOOT.CSV
    - /boot/efi/EFI/refind/refind.conf-sample
    - /boot/efi/EFI/refind/keys/refind.cer
  become: true
