---
- name: _setup | Register retired logrotate conffile diversion
  community.general.dpkg_divert:
    path: /etc/logrotate.d/apt
    divert: /etc/logrotate.d/apt.dpkg-dist
  become: true

- name: _setup | Install retired kdump sysctl pins
  copy:
    dest: /etc/sysctl.d/30-kdump.conf
    content: |
      kernel.panic_on_oops=1
      kernel.softlockup_all_cpu_backtrace=1
      kernel.hardlockup_all_cpu_backtrace=1
      kernel.hung_task_all_cpu_backtrace=1
      kernel.oops_all_cpu_backtrace=1
      kernel.panic=10
    owner: root
    group: root
    mode: "0644"
  become: true

- name: _setup | Install active and package logrotate fixtures
  copy:
    dest: "{{ item.path }}"
    content: "{{ item.content }}\n"
    owner: root
    group: root
    mode: "0644"
  loop:
    - path: /etc/logrotate.d/apt
      content: '# active local config'
    - path: /etc/logrotate.d/apt.dpkg-dist
      content: '# saved package config'
  become: true

- name: _setup | Start configured macvlan fixtures
  import_role:
    name: macvlan

- name: _setup | Create retired GitLab Runner account
  import_role:
    name: service_user
    tasks_from: user
  vars:
    service_user_args:
      name: gitlab_runner
      home: /mnt/services/gitlab_runner

- name: _setup | Enable retired GitLab Runner linger
  import_role:
    name: linger
    tasks_from: linger
  vars:
    linger_args:
      name: gitlab_runner
      uid: "{{ gitlab_runner_user.uid }}"

- name: _setup | Install retired GitLab Runner prune timer
  import_role:
    name: podman
    tasks_from: prune
  vars:
    podman_prune_args:
      name: gitlab_runner_podman_prune
      user: gitlab_runner

- name: _setup | Enable retired GitLab Runner rootless Podman socket
  systemd:
    name: podman.socket
    enabled: true
    state: started
    scope: user
  become: true
  become_user: gitlab_runner

- name: _setup | Install retired GitLab Runner subordinate IDs
  lineinfile:
    path: /etc/{{ item }}
    regexp: '^gitlab_runner:'
    line: 'gitlab_runner:165536:65536'
    owner: root
    group: root
    mode: "0644"
  loop:
    - subuid
    - subgid
  become: true

- name: _setup | Create retired GitLab Runner slice drop-in directory
  file:
    path: /etc/systemd/system/user-{{ gitlab_runner_user.uid }}.slice.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: _setup | Install retired GitLab Runner slice caps
  copy:
    content: |
      [Slice]
      MemoryHigh=512M
      MemoryMax=1G
    dest: >-
      /etc/systemd/system/user-{{ gitlab_runner_user.uid }}.slice.d/{{ item }}
    owner: root
    group: root
    mode: "0644"
  loop:
    - override.conf
    - 50-memory.conf
  become: true

- name: _setup | Install retired Netplan rollback fixtures
  copy:
    dest: "{{ item.path }}"
    content: "{{ item.content }}"
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - path: /etc/systemd/system/netplan_rollback.service
      mode: "0644"
      content: |
        [Service]
        Type=oneshot
        ExecStart=/usr/local/bin/netplan_rollback
    - path: /etc/systemd/system/netplan_rollback.timer
      mode: "0644"
      content: |
        [Timer]
        OnActiveSec=90
    - path: /usr/local/bin/netplan_rollback
      mode: "0755"
      content: |
        #!/bin/bash
        set -euo pipefail
        exit 0
  become: true

- name: _setup | Create retired podman socket group
  group:
    name: podman-socket
    gid: 60802
    system: true
  become: true

- name: _setup | Create retired podman socket drop-in directory
  file:
    path: /etc/systemd/system/podman.socket.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: _setup | Install retired podman socket drop-in fixture
  copy:
    content: |
      [Socket]
      SocketGroup=podman-socket
    dest: /etc/systemd/system/podman.socket.d/override.conf
    owner: root
    group: root
    mode: "0644"
  become: true

- name: _setup | Create retired NUT driver drop-in directory
  file:
    path: /etc/systemd/system/nut-driver@eaton.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: _setup | Install retired NUT driver drop-in fixture
  copy:
    content: |
      [Unit]
      Wants=network-online.target
      After=network-online.target
    dest: /etc/systemd/system/nut-driver@eaton.service.d/override.conf
    owner: root
    group: root
    mode: "0644"
  become: true

- name: _setup | Create NUT configuration directory
  file:
    path: /etc/nut
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: _setup | Install retired upsset CGI sentinel fixture
  copy:
    content: |
      # Retired opt-in for the state-changing CGI.
      I_HAVE_SECURED_MY_CGI_DIRECTORY
    dest: /etc/nut/upsset.conf
    owner: root
    group: root
    mode: "0644"
  become: true

- name: _setup | Register retired podman tmpfiles diversion
  community.general.dpkg_divert:
    path: /usr/lib/tmpfiles.d/podman.conf
  become: true

- name: _setup | Create retired podman tmpfiles fixture
  lineinfile:
    regexp: '^(# )?(.*) /run/podman (.*)$'
    line: '# \2 /run/podman \3'
    backrefs: true
    dest: /usr/lib/tmpfiles.d/podman.conf
  become: true

- name: _setup | Install chrony for retired IPv4 fixture
  apt:
    name: chrony
    state: present
    policy_rc_d: 101
  become: true

- name: _setup | Register retired chrony defaults diversion
  community.general.dpkg_divert:
    path: /etc/default/chrony
  become: true

- name: _setup | Install retired chrony IPv4 defaults fixture
  copy:
    content: 'DAEMON_OPTS="-F 1 -4"'
    dest: /etc/default/chrony
    owner: root
    group: root
    mode: "0644"
  become: true

- name: _setup | Start chrony with retired IPv4 defaults
  systemd:
    name: chrony.service
    enabled: true
    state: restarted
  become: true

- name: _setup | Create retired timesyncd mask
  file:
    src: /dev/null
    dest: /etc/systemd/system/systemd-timesyncd.service
    state: link
    force: true
  become: true

- name: _setup | Create legacy Avahi service directory
  file:
    path: /etc/avahi/services
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: _setup | Create custom Samba mDNS fixture
  copy:
    content: retired
    dest: /etc/avahi/services/smb.service
    owner: root
    group: root
    mode: "0644"
  become: true

- name: _setup | Install retired fail2ban package fixture
  apt:
    name: fail2ban
    state: present
    policy_rc_d: 101
  become: true

- name: _setup | Create retired fail2ban state directories
  file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /etc/fail2ban/jail.d
    - /var/lib/fail2ban
  become: true

- name: _setup | Create retired fail2ban state fixtures
  copy:
    content: "retired fail2ban fixture\n"
    dest: "{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - /etc/fail2ban/jail.local
    - /etc/fail2ban/jail.d/00-nftables.local
    - /etc/fail2ban/jail.d/99-nftables.local
    - /var/lib/fail2ban/fail2ban.sqlite3
    - /var/log/fail2ban.log
  become: true

- name: _setup | Create legacy Netdata collector directories
  file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /usr/libexec/netdata/charts.d
    - /etc/netdata/charts.d
    - /etc/netdata/go.d
    - /etc/netdata/health.d
  become: true

- name: _setup | Register retired Netdata conffile diversion
  community.general.dpkg_divert:
    path: /etc/netdata/netdata.conf
  become: true

- name: _setup | Install retained Netdata conffile fixture
  copy:
    content: "# retained Netdata config\n"
    dest: /etc/netdata/netdata.conf
    owner: root
    group: root
    mode: "0644"
  become: true

- name: _setup | Create legacy Netdata smartctl collector fixture
  copy:
    content: |-
      jobs:
        - name: smartctl
          poll_devices_every: 300
    dest: /etc/netdata/go.d/smartctl.conf
    owner: root
    group: root
    mode: "0644"
  become: true

- name: _setup | Create legacy Netdata fail2ban fixtures
  copy:
    content: "retired fail2ban fixture\n"
    dest: "{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - /etc/netdata/go.d/fail2ban.conf
    - /etc/netdata/health.d/fail2ban.conf
  become: true

- name: _setup | Create hdparm Netdata fixtures on a diskless host
  copy:
    content: "retired hdparm fixture\n"
    dest: "{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - /usr/libexec/netdata/charts.d/hdparm.chart.sh
    - /etc/netdata/charts.d/hdparm.conf
    - /etc/netdata/health.d/hdparm.conf
  become: true

- name: _setup | Add netdata to disk group on a diskless host
  user:
    name: netdata
    groups: disk
    append: true
  become: true

- name: _setup | Register legacy smartmontools defaults diversion
  community.general.dpkg_divert:
    path: /etc/default/smartmontools
  become: true

- name: _setup | Create legacy smartmontools defaults fixture
  copy:
    content: "smartd_opts=\"--interval=1800\"\n"
    dest: /etc/default/smartmontools
    owner: root
    group: root
    mode: "0644"
  become: true

- name: _setup | Register retired smartd conffile diversion
  community.general.dpkg_divert:
    path: /etc/smartd.conf
  become: true

- name: _setup | Install retained smartd conffile fixture
  copy:
    content: "# retained smartd config\n"
    dest: /etc/smartd.conf
    owner: root
    group: root
    mode: "0644"
  become: true

- name: _setup | Register retired hd-idle conffile diversion
  community.general.dpkg_divert:
    path: /etc/default/hd-idle
  become: true

- name: _setup | Install retained hd-idle conffile fixture
  copy:
    content: "# retained hd-idle config\n"
    dest: /etc/default/hd-idle
    owner: root
    group: root
    mode: "0644"
  become: true

- name: _setup | Install hdparm
  apt:
    name: hdparm
    state: present
    cache_valid_time: 3600
  become: true

- name: _setup | Register retired hdparm conffile diversion
  community.general.dpkg_divert:
    path: /etc/hdparm.conf
  become: true

- name: _setup | Install managed hdparm conffile fixture
  copy:
    content: "# Managed hdparm configuration fixture\nquiet\n"
    dest: /etc/hdparm.conf
    owner: root
    group: root
    mode: "0644"
  become: true

- name: _setup | Install retired ZFS cron conffile fixture
  copy:
    content: "# retired ZFS cron fixture\n"
    dest: /etc/cron.d/zfsutils-linux
    owner: root
    group: root
    mode: "0644"
  become: true

- name: _setup | Register retired ZFS cron conffile diversion
  community.general.dpkg_divert:
    path: /etc/cron.d/zfsutils-linux
    divert: /etc/cron.d/zfsutils-linux.disabled
    rename: true
  become: true

- name: _setup | Create retired Mailutils sender-domain fixture
  copy:
    content: "address { email-domain example.invalid; };\n"
    dest: /etc/mailutils.conf
    owner: root
    group: root
    mode: "0644"
  become: true

- name: _setup | Install retired GNU Mailutils package fixture
  apt:
    name: mailutils
    state: present
    install_recommends: false
    cache_valid_time: 3600
  become: true

- name: _setup | Create retired compiled Postfix aliases fixture
  copy:
    content: retired
    dest: /etc/aliases.db
    owner: root
    group: root
    mode: "0644"
  become: true

- name: _setup | Add www-data to ssl-cert as a retired membership fixture
  user:
    name: www-data
    groups: ssl-cert
    append: true
  become: true

- name: _setup | Create retired nginx file fixtures
  copy:
    content: "# retired\n"
    dest: "{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - /etc/nginx/dhparam.pem
    - /etc/nginx/conf.d/status.conf
  become: true

- name: _setup | Create retired service groups
  group:
    name: "{{ item.name }}"
    gid: "{{ item.id }}"
    state: present
  loop:
    - { name: plex, id: 60728 }
    - { name: speedtest, id: 60734 }
    - { name: tautulli, id: 60735 }
  become: true

- name: _setup | Create retired service accounts
  user:
    name: "{{ item.name }}"
    uid: "{{ item.id }}"
    group: "{{ item.name }}"
    home: /nonexistent
    create_home: false
    shell: /usr/sbin/nologin
    state: present
  loop:
    - { name: plex, id: 60728 }
    - { name: speedtest, id: 60734 }
    - { name: tautulli, id: 60735 }
  become: true

- name: _setup | Create retired state and Fluent Bit fixture directories
  file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /opt/nzbToMedia
    - /mnt/services/healthchecks
    - /mnt/services/sqlite/healthchecks
    - /mnt/services/openobserve
    - /mnt/services/sqlite/openobserve
    - /mnt/services/plex
    - /mnt/services/sabnzbd
    - /mnt/services/sqlite/plex
    - /mnt/services/tautulli
    - /mnt/services/sqlite/tautulli
    - /mnt/services/webmail
    - /mnt/services/sqlite/roundcube
    - /var/lib/fluent-bit
  become: true

- name: _setup | Create retired nzbToMedia fixtures
  copy:
    content: retired
    dest: "{{ item }}"
    owner: root
    group: root
    mode: "0600"
  loop:
    - /opt/nzbToMedia/.installed-12.1.13
    - /mnt/services/sabnzbd/autoProcessMedia.cfg
    - /mnt/services/sabnzbd/autoProcessMedia.cfg.123.2026-08-21@00:00:00~
  become: true

- name: _setup | Populate retired state fixtures
  copy:
    content: retained
    dest: "{{ item }}/.retired_services_fixture"
    owner: root
    group: root
    mode: "0600"
  loop:
    - /mnt/services/healthchecks
    - /mnt/services/sqlite/healthchecks
    - /mnt/services/openobserve
    - /mnt/services/sqlite/openobserve
    - /mnt/services/plex
    - /mnt/services/sqlite/plex
    - /mnt/services/tautulli
    - /mnt/services/sqlite/tautulli
    - /mnt/services/webmail
    - /mnt/services/sqlite/roundcube
  become: true

- name: _setup | Install disposable retired service fixture units
  copy:
    content: |
      [Unit]
      Description=retired fixture

      [Service]
      Type=oneshot
      ExecStart=/bin/true
      RemainAfterExit=yes

      [Install]
      WantedBy=multi-user.target
    dest: /etc/systemd/system/{{ item }}.service
    owner: root
    group: root
    mode: "0644"
  loop:
    - dovecot
    - healthchecks
    - plex
    - roundcube
    - speedtest
    - tautulli
  become: true

- name: _setup | Start disposable retired service fixture units
  systemd:
    name: "{{ item }}.service"
    daemon_reload: true
    enabled: true
    state: started
  loop:
    - dovecot
    - healthchecks
    - plex
    - roundcube
    - speedtest
    - tautulli
  become: true

- name: _setup | Install disposable Tautulli watcher path fixture
  copy:
    content: |
      [Unit]
      Description=retired fixture

      [Path]
      PathChanged=/tmp/retired_tautulli_fixture
      Unit=sort_ini_mnt-services-tautulli-config.ini.service

      [Install]
      WantedBy=multi-user.target
    dest: /etc/systemd/system/sort_ini_mnt-services-tautulli-config.ini.path
    owner: root
    group: root
    mode: "0644"
  become: true

- name: _setup | Install disposable Tautulli watcher service fixture
  copy:
    content: |
      [Unit]
      Description=retired fixture

      [Service]
      Type=oneshot
      ExecStart=/bin/true
    dest: /etc/systemd/system/sort_ini_mnt-services-tautulli-config.ini.service
    owner: root
    group: root
    mode: "0644"
  become: true

- name: _setup | Create retired Fluent Bit extension directory
  file:
    path: /etc/fluent-bit/services
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: _setup | Create retired Fluent Bit extension fixtures
  copy:
    content: "service: {{ item }}\n"
    dest: /etc/fluent-bit/services/{{ item }}.yaml
    owner: root
    group: root
    mode: "0644"
  loop:
    - plex
    - speedtest
    - tautulli
  become: true

- name: _setup | Create retired Fluent Bit ANSI filter fixture
  copy:
    content: "return 0\n"
    dest: /etc/fluent-bit/strip_ansi.lua
    owner: root
    group: root
    mode: "0644"
  become: true

- name: _setup | Align baked Fluent Bit config with the current role
  replace:
    path: /etc/fluent-bit/fluent-bit.yaml
    regexp: '(?ms)^    - name: tail\n      tag: nginx[.]error\n.*?^      storage[.]pause_on_chunks_overlimit: true\n\n'
    replace: ""
  become: true

- name: _setup | Create retired root backup SSH config fixture
  copy:
    content: "Host *\n    Compression no\n"
    dest: /root/.ssh/config
    owner: root
    group: root
    mode: "0600"
  become: true

- name: _setup | Create retired root backup identity directory fixture
  file:
    path: /mnt/services/ssh_root
    state: directory
    owner: root
    group: root
    mode: "0700"
  become: true

- name: _setup | Create retired root backup identity fixture
  copy:
    content: "retired identity\n"
    dest: /mnt/services/ssh_root/id_ed25519
    owner: root
    group: root
    mode: "0600"
  become: true

- name: _setup | Create retired Speedtest nginx fixture directories
  file:
    path: /etc/nginx/{{ item }}
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - sites-available
    - sites-enabled
  become: true

- name: _setup | Create retired Speedtest nginx site fixtures
  copy:
    content: "retired\n"
    dest: /etc/nginx/{{ item }}/speedtest
    owner: root
    group: root
    mode: "0644"
  loop:
    - sites-available
    - sites-enabled
  become: true

- name: _setup | Create retired Speedtest Podman network
  containers.podman.podman_network:
    name: speedtest
    disable_dns: false
    state: present
  become: true

- name: _setup | Create retired webmail Podman network
  containers.podman.podman_network:
    name: webmail
    disable_dns: false
    state: present
  become: true

- name: _setup | Create retired Fluent Bit cursor fixtures
  copy:
    content: retired
    dest: /var/lib/fluent-bit/{{ item }}
    owner: root
    group: root
    mode: "0600"
  loop:
    - nginx-error.db
    - nginx-error.db-shm
    - nginx-error.db-wal
    - plex.db
    - plex.db-shm
    - plex.db-wal
    - plex-scanner.db
    - plex-crash-uploader.db
    - tautulli-websocket.db
    - nzbtomedia.db
    - nzbtomedia.db-shm
    - nzbtomedia.db-wal
  become: true

- name: _setup | Install legacy SABnzbd ini watcher path fixture
  copy:
    content: |
      [Unit]
      Description=retired fixture

      [Path]
      PathChanged=/tmp/retired_sabnzbd_fixture

      [Install]
      WantedBy=multi-user.target
    dest: /etc/systemd/system/sort_ini_mnt-services-sabnzbd-sabnzbd.ini.path
    owner: root
    group: root
    mode: "0644"
  become: true

- name: _setup | Install legacy SABnzbd ini watcher service fixture
  copy:
    content: |
      [Unit]
      Description=retired fixture

      [Service]
      Type=oneshot
      ExecStart=/bin/true
    dest: /etc/systemd/system/sort_ini_mnt-services-sabnzbd-sabnzbd.ini.service
    owner: root
    group: root
    mode: "0644"
  become: true

- name: _setup | Install SABnzbd ini canonicalizer path fixture
  copy:
    content: |
      [Unit]
      Description=retired fixture

      [Path]
      PathModified=/tmp/retired_sabnzbd_fixture

      [Install]
      WantedBy=multi-user.target
    dest: /etc/systemd/system/sabnzbd_ini_sort.path
    owner: root
    group: root
    mode: "0644"
  become: true

- name: _setup | Install SABnzbd ini canonicalizer service fixture
  copy:
    content: |
      [Unit]
      Description=retired fixture

      [Service]
      Type=oneshot
      ExecStart=/bin/true
    dest: /etc/systemd/system/sabnzbd_ini_sort.service
    owner: root
    group: root
    mode: "0644"
  become: true

- name: _setup | Enable SABnzbd ini watcher fixtures
  systemd:
    name: "{{ item }}"
    daemon_reload: true
    enabled: true
    state: started
  loop:
    - sort_ini_mnt-services-sabnzbd-sabnzbd.ini.path
    - sabnzbd_ini_sort.path
  become: true

- name: _setup | Install retired ini canonicalizer fixtures
  copy:
    content: "#!/bin/sh\nexit 0\n"
    dest: "{{ item }}"
    owner: root
    group: root
    mode: "0755"
  loop:
    - /usr/local/bin/sort_ini
    - /usr/local/bin/sabnzbd_sort_ini
  become: true
