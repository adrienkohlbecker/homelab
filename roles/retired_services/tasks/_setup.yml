---
# Recreate what the retired libvirt role left on a host: the daemon with its
# default network running, the virsh_backup timer, the images mount check,
# and libvirt's own state directories.
- name: _setup | Install retired libvirt packages
  apt:
    name:
      - libvirt-clients
      - libvirt-daemon
      - libvirt-daemon-system
      - python3-libvirt
      - python3-lxml
    state: present
    cache_valid_time: 3600
  become: true

- name: _setup | Start the retired libvirt default network
  command: virsh net-start default
  register: retired_services_setup_net_start
  changed_when: retired_services_setup_net_start.rc == 0
  failed_when:
    - retired_services_setup_net_start.rc != 0
    - "'already active' not in retired_services_setup_net_start.stderr"
  become: true

- name: _setup | Create the retired virsh_backup executable
  copy:
    content: "#!/bin/sh\n"
    dest: /usr/local/bin/virsh_backup
    owner: root
    group: root
    mode: "0755"
  become: true

- name: _setup | Install the retired virsh_backup timer
  import_role:
    name: systemd_timer
    tasks_from: install
  vars:
    systemd_timer_args:
      name: virsh_backup
      description: Daily libvirt domain backup
      on_calendar: "*-*-* 00:05:00"
      exec_start: /usr/local/bin/virsh_backup

- name: _setup | Create the retired libvirt images mount check
  copy:
    content: |
      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/bin/true

      [Install]
      WantedBy=multi-user.target
    dest: /etc/systemd/system/zfs_mount_var_lib_libvirt_images.service
    owner: root
    group: root
    mode: "0644"
  become: true

- name: _setup | Start the retired libvirt images mount check
  systemd:
    name: zfs_mount_var_lib_libvirt_images.service
    daemon_reload: true
    enabled: true
    state: started
  become: true

- name: _setup | Seed retired libvirt images state
  copy:
    content: "<pool/>\n"
    dest: /var/lib/libvirt/images/pool_default.xml
    owner: root
    group: root
    mode: "0600"
  become: true

# Recreate what the retired kdump role left on a host: the capture packages,
# the crashkernel reservation, the NMI re-arm timer, its sysctl file, and a
# saved vmcore beside the kdump-config runtime files.
- name: _setup | Install retired kdump packages
  apt:
    name:
      - kdump-tools
      - makedumpfile
      - kexec-tools
      - crash
    install_recommends: false
    policy_rc_d: 101
    state: present
    cache_valid_time: 3600
  become: true

- name: _setup | Reserve crashkernel memory
  import_role:
    name: boot
    tasks_from: cmdline
  vars:
    boot_cmdline_args:
      name: crashkernel
      contents: crashkernel=512M,high crashkernel=128M,low

- name: _setup | Create the retired kdump NMI watchdog re-arm units
  copy:
    content: "{{ item.content }}"
    dest: /etc/systemd/system/{{ item.name }}
    owner: root
    group: root
    mode: "0644"
  loop:
    - name: kdump_nmi_watchdog.service
      content: |
        [Service]
        Type=oneshot
        ExecStart=/bin/true
    - name: kdump_nmi_watchdog.timer
      content: |
        [Timer]
        OnBootSec=3min

        [Install]
        WantedBy=timers.target
  loop_control:
    label: "{{ item.name }}"
  become: true

- name: _setup | Enable the retired kdump NMI watchdog re-arm timer
  systemd:
    name: kdump_nmi_watchdog.timer
    daemon_reload: true
    enabled: true
  become: true

- name: _setup | Create the retired kdump sysctl file
  copy:
    content: "kernel.panic=10\n"
    dest: /etc/sysctl.d/30-kdump.conf
    owner: root
    group: root
    mode: "0644"
  become: true

- name: _setup | Create the crash directory
  file:
    path: /var/crash/202601010000
    state: directory
    owner: root
    group: root
    mode: "0750"
  become: true

- name: _setup | Seed a saved vmcore and kdump-config runtime files
  copy:
    content: "{{ item.content }}"
    dest: "{{ item.path }}"
    owner: root
    group: root
    mode: "0600"
  loop:
    - { path: /var/crash/202601010000/dump.202601010000, content: "vmcore\n" }
    - { path: /var/crash/kdump_lock, content: "" }
    - { path: /var/crash/kexec_cmd, content: "kexec -p\n" }
  loop_control:
    label: "{{ item.path }}"
  become: true

- name: _setup | Install the retired zfs_trim timer
  import_role:
    name: systemd_timer
    tasks_from: install
  vars:
    systemd_timer_args:
      name: zfs_trim_rpool
      description: Weekly ZFS trim for rpool
      on_calendar: "Thu *-*-* 00:05:00"
      exec_start: /bin/true

- name: _setup | Create the retired ZFS scripts
  copy:
    content: "#!/bin/sh\n"
    dest: "{{ item }}"
    owner: root
    group: root
    mode: "0755"
  loop:
    - /usr/local/bin/zfs_update_mount_cache
  become: true
