---
- name: Remove retired smartmontools defaults file
  file:
    path: /etc/default/smartmontools
    state: absent
  become: true
  tags:
    - retired_services

- name: Remove retired smartmontools defaults diversion
  community.general.dpkg_divert:
    path: /etc/default/smartmontools
    state: absent
  become: true
  tags:
    - retired_services

# Speedtest was stateless, so retirement removes its account along with every
# runnable artifact. Its numeric identity remains reserved in legacy_service_ids.
- name: Retire Speedtest service
  import_role:
    name: systemd_unit
    tasks_from: remove
  vars:
    systemd_unit_args:
      dest: speedtest.service
  tags:
    - retired_services

- name: Retire Speedtest nginx site
  import_role:
    name: nginx
    tasks_from: site_remove
  vars:
    nginx_site_remove_args:
      subdomain: speedtest
  tags:
    - retired_services

# Plex and Tautulli are retired, but their state stays intact for possible
# inspection or recovery. Their locked users/groups and legacy ID reservations
# keep the retained files' ownership meaningful; only runnable artifacts and
# disposable Fluent Bit cursors/container images are removed here.
- name: Retire Plex service
  import_role:
    name: systemd_unit
    tasks_from: remove
  vars:
    systemd_unit_args:
      dest: plex.service
  tags:
    - retired_services

- name: Retire Tautulli service
  import_role:
    name: systemd_unit
    tasks_from: remove
  vars:
    systemd_unit_args:
      dest: tautulli.service
  tags:
    - retired_services

- name: Retire Tautulli ini watcher path
  import_role:
    name: systemd_unit
    tasks_from: remove
  vars:
    systemd_unit_args:
      dest: sort_ini_mnt-services-tautulli-config.ini.path
  tags:
    - retired_services

- name: Retire Tautulli ini watcher service
  import_role:
    name: systemd_unit
    tasks_from: remove
  vars:
    systemd_unit_args:
      dest: sort_ini_mnt-services-tautulli-config.ini.service
  tags:
    - retired_services

- name: Retire legacy SABnzbd ini watcher path
  import_role:
    name: systemd_unit
    tasks_from: remove
  vars:
    systemd_unit_args:
      dest: sort_ini_mnt-services-sabnzbd-sabnzbd.ini.path
  tags:
    - retired_services
    - sabnzbd

- name: Retire legacy SABnzbd ini watcher service
  import_role:
    name: systemd_unit
    tasks_from: remove
  vars:
    systemd_unit_args:
      dest: sort_ini_mnt-services-sabnzbd-sabnzbd.ini.service
  tags:
    - retired_services
    - sabnzbd

- name: Remove retired generic ini canonicalizer
  file:
    path: /usr/local/bin/sort_ini
    state: absent
  become: true
  tags:
    - retired_services
    - sabnzbd

- name: Retire Plex nginx site
  import_role:
    name: nginx
    tasks_from: site_remove
  vars:
    nginx_site_remove_args:
      subdomain: plex
  tags:
    - retired_services

- name: Retire Tautulli nginx site
  import_role:
    name: nginx
    tasks_from: site_remove
  vars:
    nginx_site_remove_args:
      subdomain: tautulli
  tags:
    - retired_services

- name: Remove retired service Fluent Bit extensions
  import_role:
    name: fluentbit
    tasks_from: extension_remove
  vars:
    fluentbit_extension_remove_args:
      names:
        - plex
        - speedtest
        - tautulli
  tags:
    - retired_services

- name: Find retired Plex and Tautulli Fluent Bit cursors
  find:
    paths: /var/lib/fluent-bit
    patterns:
      - plex.db*
      - plex-scanner.db*
      - plex-crash-uploader.db*
      - tautulli-websocket.db*
    file_type: file
  register: retired_services_media_cursors
  become: true
  tags:
    - retired_services

- name: Remove retired Plex and Tautulli Fluent Bit cursors
  file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ retired_services_media_cursors.files }}"
  loop_control:
    label: "{{ item.path }}"
  become: true
  tags:
    - retired_services

- name: Check whether Podman is installed for retired image cleanup
  stat:
    path: /usr/bin/podman
  register: retired_services_podman
  tags:
    - retired_services

- name: Remove retired Speedtest Podman network
  when: retired_services_podman.stat.exists
  containers.podman.podman_network:
    name: speedtest
    state: absent
  become: true
  tags:
    - retired_services

- name: Remove retired service container images
  when: retired_services_podman.stat.exists
  containers.podman.podman_image:
    name: "{{ item }}"
    state: absent
  loop:
    - docker.io/plexinc/pms-docker:1.43.2.10687-563d026ea
    - ghcr.io/librespeed/speedtest:6.1.0
    - docker.io/linuxserver/tautulli:2.14.2
  become: true
  tags:
    - retired_services

- name: Remove retired Speedtest account
  user:
    name: speedtest
    state: absent
    force: true
  become: true
  tags:
    - retired_services

- name: Remove retired Speedtest group
  group:
    name: speedtest
    state: absent
  become: true
  tags:
    - retired_services

- name: Remove retired zfs_autobackup files
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/logrotate.d/zfs_autobackup
    - /root/.ssh/config
    - /mnt/services/ssh_root
    - /var/lib/zfs_autobackup/.config/systemd
  become: true
  tags:
    - retired_services

- name: Lookup retired Netdata poller account
  command:
    argv:
      - getent
      - passwd
      - netdata_poll
  register: retired_services_netdata_poll_passwd
  changed_when: false
  failed_when: retired_services_netdata_poll_passwd.rc not in [0, 2]
  check_mode: false

- name: Disable lingering for retired Netdata poller
  import_role:
    name: linger
    tasks_from: disable
  vars:
    linger_args:
      name: netdata_poll
      uid: >-
        {{ retired_services_netdata_poll_passwd.stdout.split(':')[2] | int
           if retired_services_netdata_poll_passwd.rc == 0 else omit }}

- name: Remove retired Netdata poller account
  user:
    name: netdata_poll
    state: absent
    remove: true
    force: true
  become: true

- name: Remove retired Netdata poller group
  group:
    name: netdata_poll
    state: absent
  become: true

- name: Remove retired Netdata poller files
  file:
    path: "{{ item }}"
    state: absent
  become: true
  loop:
    - /var/lib/netdata_poll
    - /usr/local/bin/netdata_poll_fetch
    - /usr/local/bin/stderr_priority
    - /opt/homepage_alerts/.ssh
