---
# Add temporary teardown tasks here when retiring services from the fleet.

# Drop once lab and pug have converged. Wolweb's only state was its rendered
# device list; uid 60737 stays reserved in legacy_service_ids.
- name: Retire the wolweb service
  import_role:
    name: systemd_unit
    tasks_from: remove
  vars:
    systemd_unit_args:
      dest: wolweb.service
  tags:
    - retired_services
    - wolweb

- name: Remove the retired wolweb nginx site
  file:
    path: /etc/nginx/{{ item }}/wolweb
    state: absent
  loop:
    - sites-enabled
    - sites-available
  register: retired_services_wolweb_site
  become: true
  tags:
    - retired_services
    - wolweb

- name: Reload nginx without the retired wolweb site
  when:
    - not ansible_check_mode
    - retired_services_wolweb_site.changed
  systemd:
    name: nginx
    state: reloaded
  become: true
  tags:
    - retired_services
    - wolweb

- name: Remove the retired wolweb fluent-bit extension
  import_role:
    name: fluentbit
    tasks_from: extension_remove
  vars:
    fluentbit_extension_remove_args:
      names:
        - wolweb
  tags:
    - retired_services
    - wolweb

- name: Check whether podman is installed for the retired wolweb image
  stat:
    path: /usr/bin/podman
  register: retired_services_podman
  tags:
    - retired_services
    - wolweb

- name: Remove the retired wolweb image
  when: retired_services_podman.stat.exists
  containers.podman.podman_image:
    name: ghcr.io/sameerdhoot/wolweb:alpine@sha256:4dacd33d9d1d747efa4018a7fcf07c62e3a4afd348c0ef45ca31fe4ecd51c36a
    state: absent
  become: true
  tags:
    - retired_services
    - wolweb

- name: Remove the retired wolweb state
  file:
    path: /mnt/services/wolweb
    state: absent
  become: true
  tags:
    - retired_services
    - wolweb

- name: Remove the retired wolweb account
  user:
    name: wolweb
    state: absent
    force: true
  become: true
  tags:
    - retired_services
    - wolweb

- name: Remove the retired wolweb group
  group:
    name: wolweb
    state: absent
  become: true
  tags:
    - retired_services
    - wolweb

# Drop once lab and pug have converged. Stopping the unit runs its ExecStop,
# which deletes lab's host-side mac_iot child interface and its block route;
# the homeassistant role keeps the same-named podman network.
- name: Retire the mac_iot host interface unit
  import_role:
    name: systemd_unit
    tasks_from: remove
  vars:
    systemd_unit_args:
      dest: mac_iot.service
  tags:
    - retired_services
    - macvlan

# The firewall role's all.arp_ignore/arp_announce pins cover every interface.
- name: Remove the retired per-interface macvlan ARP policy
  file:
    path: /etc/sysctl.d/30-macvlan.conf
    state: absent
  become: true
  tags:
    - retired_services
    - macvlan

# Drop once lab, pug, and fox have converged. Removing the fragment requests
# the reboot that drops consoleblank=0 from the running command line.
- name: Retire console_noblank.service
  import_role:
    name: systemd_unit
    tasks_from: remove
  vars:
    systemd_unit_args:
      dest: console_noblank.service
  tags:
    - retired_services
    - console

- name: Remove the retired consoleblank kernel argument
  import_role:
    name: boot
    tasks_from: cmdline
  vars:
    boot_cmdline_args:
      name: consoleblank
      contents: ''
  tags:
    - retired_services
    - console

# Drop once pug and fox have converged. Only Home Assistant's host uses the
# recorder dataset (roles/services). Elsewhere it is retired, not destroyed:
# emptied and left unmounted, keeping its snapshots. autobackup:bak stays true,
# so the next nightly local leg takes the final (empty) @bak- snapshot on
# schedule and the onsite pull and offsite leg carry it. An out-of-band
# snapshot here would satisfy the onsite pull's newest-snapshot wait early and
# ship the previous night's state for every other dataset of that host.
# Retention then thins the history like any other dataset's; flip the tag to
# false (source and replicas) to freeze it once offsite holds the final state.
- name: Retire the unused sqlite dataset
  when:
    - zfs_root
    - not (services_sqlite_enabled | bool)
  tags:
    - retired_services
    - services
  block:
    - name: Retire the sqlite dataset mount unit
      import_role:
        name: systemd_unit
        tasks_from: remove
      vars:
        systemd_unit_args:
          dest: zfs_mount_mnt_services_sqlite.service

    - name: Read the sqlite dataset mount state
      command:
        argv:
          - zfs
          - get
          - -H
          - -o
          - value
          - canmount,mounted
          - rpool/services/sqlite
      register: retired_services_sqlite_state
      changed_when: false
      check_mode: false
      failed_when: >-
        retired_services_sqlite_state.rc != 0
        and 'dataset does not exist' not in retired_services_sqlite_state.stderr
      become: true

    - name: Empty and stop mounting the sqlite dataset
      when: retired_services_sqlite_state.stdout_lines == ['on', 'yes']
      block:
        # Guard the delete: it must only ever see the dataset, never the parent
        # directory underneath an unmounted mountpoint.
        - name: Assert the sqlite dataset is what is mounted
          command:
            argv:
              - /usr/local/bin/zfs_check_mount
              - rpool/services/sqlite
              - /mnt/services/sqlite
          changed_when: false
          become: true

        - name: Empty the sqlite dataset
          command:
            argv:
              - find
              - /mnt/services/sqlite
              - -xdev
              - -mindepth
              - 1
              - -delete
          changed_when: true
          become: true

        - name: Stop mounting the sqlite dataset
          community.general.zfs:
            name: rpool/services/sqlite
            state: present
            extra_zfs_properties:
              canmount: 'off'
          become: true

    - name: Unmount the sqlite dataset
      when:
        - retired_services_sqlite_state.rc == 0
        - retired_services_sqlite_state.stdout_lines[1] == 'yes'
      command:
        argv:
          - zfs
          - unmount
          - rpool/services/sqlite
      register: retired_services_sqlite_unmount
      changed_when: true
      # canmount=off unmounts on its own; an already-unmounted dataset is fine.
      failed_when: >-
        retired_services_sqlite_unmount.rc != 0
        and 'not currently mounted' not in retired_services_sqlite_unmount.stderr
      become: true

    # rmdir refuses a non-empty directory, so anything written underneath the
    # unmounted mountpoint fails loudly instead of vanishing.
    - name: Remove the sqlite mountpoint directory
      command:
        argv:
          - rmdir
          - /mnt/services/sqlite
        removes: /mnt/services/sqlite
      become: true
