---
# Add temporary teardown tasks here when retiring services from the fleet.

# Drop once lab, pug, and fox have converged.
- name: Remove the retired zfs_scan charts.d collector
  import_role:
    name: netdata
    tasks_from: remove
  vars:
    netdata_args:
      name: zfs_scan
  tags:
    - retired_services
    - netdata
    - zfs

# Drop once lab, pug, and fox have converged.
- name: Remove the retired fluent-bit output-drop alert
  import_role:
    name: netdata
    tasks_from: remove
  vars:
    netdata_args:
      dest: health.d/fluentbit.conf
  tags:
    - retired_services
    - netdata

- name: Restart netdata without the retired collector and alert
  import_role:
    name: netdata
    tasks_from: restart
  tags:
    - retired_services
    - netdata
    - zfs

# Drop once lab, pug, and fox have converged. The package's weekly trim timer
# replaces the per-pool zfs_trim timers; lab trimmed rpool, dozer, and tank.
- name: Remove the retired zfs_trim timer for rpool
  import_role:
    name: systemd_timer
    tasks_from: remove
  vars:
    systemd_timer_args:
      name: zfs_trim_rpool
  tags:
    - retired_services
    - zfs

- name: Remove the retired zfs_trim timer for dozer
  import_role:
    name: systemd_timer
    tasks_from: remove
  vars:
    systemd_timer_args:
      name: zfs_trim_dozer
  tags:
    - retired_services
    - zfs

- name: Remove the retired zfs_trim timer for tank
  import_role:
    name: systemd_timer
    tasks_from: remove
  vars:
    systemd_timer_args:
      name: zfs_trim_tank
  tags:
    - retired_services
    - zfs

- name: Remove the retired zfs_health timer
  import_role:
    name: systemd_timer
    tasks_from: remove
  vars:
    systemd_timer_args:
      name: zfs_health
  tags:
    - retired_services
    - zfs

- name: Remove retired ZFS scripts
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /usr/local/bin/zfs_update_mount_cache
    - /usr/local/bin/zfs_health
    - /opt/zfs
  become: true
  tags:
    - retired_services
    - zfs

# Drop once lab and pug have converged.
#
# The purge keeps /var/crash: no package owns it, so saved vmcores stay until
# the operator deletes them. crash and kexec-tools came in with kdump-tools.
- name: Remove retired kdump packages
  apt:
    name:
      - kdump-tools
      - makedumpfile
      - kexec-tools
      - crash
    state: absent
    purge: true
  become: true
  tags:
    - retired_services
    - kdump

# Requests the reboot that releases the reserved crash memory. GRUB hosts got
# the reservation from the package's own grub.d conffile, which the purge
# removes.
- name: Remove the retired crashkernel reservation
  when: not grub_bootloader
  import_role:
    name: boot
    tasks_from: cmdline
  vars:
    boot_cmdline_args:
      name: crashkernel
      contents: ''
  tags:
    - retired_services
    - kdump

- name: Remove the retired kdump NMI watchdog re-arm timer
  import_role:
    name: systemd_timer
    tasks_from: remove
  vars:
    systemd_timer_args:
      name: kdump_nmi_watchdog
  tags:
    - retired_services
    - kdump

# The panic role now owns these sysctls in 30-panic.conf. The lock and command
# files are kdump-config runtime state, not dumps.
- name: Remove retired kdump state
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/sysctl.d/30-kdump.conf
    - /usr/lib/dracut/dracut.conf.d/kdump-tools
    - /var/crash/kdump_lock
    - /var/crash/kexec_cmd
  become: true
  tags:
    - retired_services
    - kdump

# Drop once lab, pug, and fox have converged.
- name: Remove the retired fluent-bit service include manifest
  file:
    path: /etc/fluent-bit/services.yaml
    state: absent
  become: true
  tags:
    - retired_services
    - fluentbit

# The smart role no longer ships a fluent-bit extension; the include glob would
# otherwise keep loading the stale fragment left on lab and pug.
- name: Remove the retired smart fluent-bit extension
  import_role:
    name: fluentbit
    tasks_from: extension_remove
  vars:
    fluentbit_extension_remove_args:
      names:
        - smart
  tags:
    - retired_services
    - fluentbit

# Drop once lab, pug, and fox have converged. The user role stopped shipping
# i7z and now copies the compiled Ghostty entry directly; the source copy and
# its ghostty alias are inert.
- name: Remove the retired i7z package
  apt:
    name: i7z
    state: absent
  become: true
  tags:
    - retired_services
    - user

# Drop once lab, pug, and fox have converged. The user role stopped shipping
# these desktop and ad hoc tools that no headless host uses.
- name: Purge the retired user role packages
  apt:
    name:
      - ccze
      - fatrace
      - gparted
      - mitmproxy
      - nmon
      - nnn
      - pandoc
      - stress
      - telnet
    state: absent
    purge: true
  become: true
  tags:
    - retired_services
    - user

- name: Remove the retired Ghostty terminfo source and alias
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/terminfo/xterm-ghostty.terminfo
    - /etc/terminfo/g
  become: true
  tags:
    - retired_services
    - user

# Drop once lab, pug, and fox have converged. tailscaled writes its logtail
# files to /var/lib/tailscale; the copies on the services dataset stopped
# changing on 2026-08-19.
- name: Remove the stale tailscale logtail copies
  file:
    path: /mnt/services/tailscale/{{ item }}
    state: absent
  loop:
    - tailscaled.log.conf
    - tailscaled.log1.txt
    - tailscaled.log2.txt
  become: true
  tags:
    - retired_services
    - tailscale

# Drop once pug and fox have converged. Package upgrades used to run
# refind-install, which left these unused files on the ESP.
- name: Remove refind-install leftovers from the ESP
  file:
    path: /boot/efi/EFI/refind/{{ item }}
    state: absent
  loop:
    - BOOT.CSV
    - keys
    - icons-backup
    - refind.conf-sample
  become: true
  tags:
    - retired_services
    - refind

# Drop once lab has converged. The Windows box no longer mirrors the retired
# Eaton IPP config; uid 60711 stays reserved in group_vars/all/identities.yml.
- name: Remove the retired Eaton IPP state
  file:
    path: /mnt/services/eaton_ipp
    state: absent
  become: true
  tags:
    - retired_services
    - nut

# Drop once lab and pug have converged. The firewall auto-revert now targets
# the template backup instead of this snapshot.
- name: Remove the retired nftables pre-reload snapshot
  file:
    path: /etc/nftables.conf.pre-reload
    state: absent
  become: true
  tags:
    - retired_services
    - firewall

# Drop once lab, pug, and fox have converged. netdata 2.11+ has no go.d sensors
# module, and fox's runner reads the default AWS profile and names the ARM key
# after its pool.
- name: Remove retired netdata and runner leftovers
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/netdata/go.d/sensors.conf
    - /mnt/services/gitlab_runner/.aws/config
    - /mnt/services/gitlab_runner/.ssh/fleeting_arm
  become: true
  tags:
    - retired_services
    - netdata
    - gitlab_runner

# Drop once lab, pug, and fox have converged. The apt roles stopped installing
# python3-debian for deb822_repository. Marking it automatic lets a later
# autoremove take it only if nothing else depends on it.
- name: Read whether python3-debian is marked manually installed  # noqa: command-instead-of-module
  command: apt-mark showmanual python3-debian
  register: retired_services_python3_debian
  changed_when: false
  check_mode: false
  become: true
  tags:
    - retired_services
    - apt

- name: Mark python3-debian as automatically installed  # noqa: command-instead-of-module
  when: retired_services_python3_debian.stdout | trim == 'python3-debian'
  command: apt-mark auto python3-debian
  changed_when: true
  become: true
  tags:
    - retired_services
    - apt

# Drop once lab, pug, and fox have converged. The backup SSH config names the
# persistent key on rpool/services directly, so the old /root/.ssh links to it
# are unused. Remove only links: a regular key file there is not ours to drop.
- name: Inspect the retired backup key links
  stat:
    path: /root/.ssh/id_ed25519{{ item }}
  loop:
    - ""
    - .pub
  register: retired_services_backup_key_links
  become: true
  tags:
    - retired_services
    - zfs_autobackup

- name: Remove the retired backup key links
  when: item.stat.islnk | default(false)
  file:
    path: /root/.ssh/id_ed25519{{ item.item }}
    state: absent
  loop: "{{ retired_services_backup_key_links.results }}"
  loop_control:
    label: /root/.ssh/id_ed25519{{ item.item }}
  become: true
  tags:
    - retired_services
    - zfs_autobackup

# Drop once lab has converged. The Lab operator prune runs as the system-scope
# podman_prune_operator timer; the user-scope units it replaces sit in
# /etc/systemd/user and are enabled in the operator's own manager.
- name: Inspect the retired operator prune user units
  stat:
    path: /etc/systemd/user/podman_prune.{{ item }}
  loop:
    - timer
    - service
  register: retired_services_operator_prune_units
  become: true
  tags:
    - retired_services
    - podman

# The systemd module derives XDG_RUNTIME_DIR from the become_user uid, which
# reaches the operator's lingered user manager; disable also drops the links
# under ~/.config/systemd/user.
- name: Stop and disable the retired operator prune user units
  when: item.stat.exists
  systemd:
    name: podman_prune.{{ item.item }}
    state: stopped
    enabled: false
    scope: user
  loop: "{{ retired_services_operator_prune_units.results }}"
  loop_control:
    label: podman_prune.{{ item.item }}
  become: true
  become_user: "{{ ansible_user_id }}"
  tags:
    - retired_services
    - podman

- name: Remove the retired operator prune user unit files
  file:
    path: /etc/systemd/user/podman_prune.{{ item }}
    state: absent
  loop:
    - timer
    - service
  register: retired_services_operator_prune_removed
  become: true
  tags:
    - retired_services
    - podman

- name: Reload the operator user manager
  when: retired_services_operator_prune_removed.changed
  systemd:
    daemon_reload: true
    scope: user
  become: true
  become_user: "{{ ansible_user_id }}"
  tags:
    - retired_services
    - podman
