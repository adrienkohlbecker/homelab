---
# Add temporary teardown tasks here when retiring services from the fleet.

# Drop once lab, pug, and fox have converged.
- name: Remove the retired zfs_scan charts.d collector
  import_role:
    name: netdata
    tasks_from: charts_d_remove
  vars:
    netdata_args:
      name: zfs_scan
  tags:
    - retired_services
    - netdata
    - zfs

# Drop once lab, pug, and fox have converged.
- name: Remove the retired fluent-bit output-drop alert
  import_role:
    name: netdata
    tasks_from: health_remove
  vars:
    netdata_args:
      dest: fluentbit.conf
  tags:
    - retired_services
    - netdata

- name: Restart netdata without the retired collector and alert
  import_role:
    name: netdata
    tasks_from: restart
  tags:
    - retired_services
    - netdata
    - zfs

# Drop once lab, pug, and fox have converged. The package's weekly trim timer
# replaces the per-pool zfs_trim timers; lab trimmed rpool, dozer, and tank.
- name: Remove the retired zfs_trim timer for rpool
  import_role:
    name: systemd_timer
    tasks_from: remove
  vars:
    systemd_timer_args:
      name: zfs_trim_rpool
  tags:
    - retired_services
    - zfs

- name: Remove the retired zfs_trim timer for dozer
  import_role:
    name: systemd_timer
    tasks_from: remove
  vars:
    systemd_timer_args:
      name: zfs_trim_dozer
  tags:
    - retired_services
    - zfs

- name: Remove the retired zfs_trim timer for tank
  import_role:
    name: systemd_timer
    tasks_from: remove
  vars:
    systemd_timer_args:
      name: zfs_trim_tank
  tags:
    - retired_services
    - zfs

- name: Remove the retired zfs_health timer
  import_role:
    name: systemd_timer
    tasks_from: remove
  vars:
    systemd_timer_args:
      name: zfs_health
  tags:
    - retired_services
    - zfs

- name: Remove retired ZFS scripts
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /usr/local/bin/zfs_update_mount_cache
    - /usr/local/bin/zfs_health
    - /opt/zfs
  become: true
  tags:
    - retired_services
    - zfs

# Drop once lab has converged.
#
# macos_vm adopts rpool/libvirt by moving it off /var/lib/libvirt/images.
# Until it has, removing /var/lib/libvirt below would delete the VM workdir:
# if this fails on a live mount, converge macos_vm first. Check mode never
# runs the adoption, so the mount is still expected there.
- name: Refuse to remove a mounted libvirt images dataset
  command: findmnt --mountpoint /var/lib/libvirt/images
  register: retired_services_libvirt_images_mount
  changed_when: false
  failed_when: >-
    retired_services_libvirt_images_mount.rc > 1
    or (retired_services_libvirt_images_mount.rc == 0 and not ansible_check_mode)
  check_mode: false
  tags:
    - retired_services
    - libvirt

# Purging libvirt stops the daemon but leaves a running network's bridge,
# dnsmasq, and firewall rules in place until the next reboot.
- name: Stop the retired libvirt default network
  command:
    argv:
      - virsh
      - net-destroy
      - default
    removes: /usr/bin/virsh
  register: retired_services_libvirt_net_destroy
  # removes: reports rc 0 when it skips, so key off virsh's own success line.
  changed_when: "'destroyed' in retired_services_libvirt_net_destroy.stdout"
  failed_when:
    - retired_services_libvirt_net_destroy.rc != 0
    - "'is not active' not in retired_services_libvirt_net_destroy.stderr"
  become: true
  tags:
    - retired_services
    - libvirt

# Purging libvirt0 also removes everything that depends on it: the clients,
# the daemon packages, and python3-libvirt.
- name: Remove retired libvirt packages
  apt:
    name:
      - libvirt-l10n
      - libvirt0
      - python3-lxml
    state: absent
    purge: true
  become: true
  tags:
    - retired_services
    - libvirt

- name: Remove the retired virsh_backup timer
  import_role:
    name: systemd_timer
    tasks_from: remove
  vars:
    systemd_timer_args:
      name: virsh_backup
  tags:
    - retired_services
    - libvirt

- name: Remove the retired libvirt images mount check
  import_role:
    name: systemd_unit
    tasks_from: remove
  vars:
    systemd_unit_args:
      dest: "{{ '/var/lib/libvirt/images' | zfs_mount_unit }}"
  tags:
    - retired_services
    - libvirt

- name: Remove retired libvirt state
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /usr/local/bin/virsh_backup
    - /etc/libvirt
    - /var/lib/libvirt
    - /var/log/libvirt
  become: true
  tags:
    - retired_services
    - libvirt

# Package purges keep the system accounts they created.
- name: Remove retired libvirt users
  user:
    name: "{{ item }}"
    state: absent
  loop:
    - libvirt-qemu
    - libvirt-dnsmasq
  become: true
  tags:
    - retired_services
    - libvirt

- name: Remove retired libvirt groups
  group:
    name: "{{ item }}"
    state: absent
  loop:
    - libvirt
    - libvirt-qemu
  become: true
  tags:
    - retired_services
    - libvirt

# Drop once lab and pug have converged.
#
# The purge keeps /var/crash: no package owns it, so saved vmcores stay until
# the operator deletes them. crash and kexec-tools came in with kdump-tools.
- name: Remove retired kdump packages
  apt:
    name:
      - kdump-tools
      - makedumpfile
      - kexec-tools
      - crash
    state: absent
    purge: true
  become: true
  tags:
    - retired_services
    - kdump

# Requests the reboot that releases the reserved crash memory. The helper skips
# hosts without a ZFS root, where the reservation came from the package's own
# grub.d conffile, which the purge removes.
- name: Remove the retired crashkernel reservation
  import_role:
    name: boot
    tasks_from: cmdline
  vars:
    boot_cmdline_args:
      name: crashkernel
      contents: ''
  tags:
    - retired_services
    - kdump

- name: Remove the retired kdump NMI watchdog re-arm timer
  import_role:
    name: systemd_timer
    tasks_from: remove
  vars:
    systemd_timer_args:
      name: kdump_nmi_watchdog
  tags:
    - retired_services
    - kdump

# The panic role now owns these sysctls in 30-panic.conf. The lock and command
# files are kdump-config runtime state, not dumps.
- name: Remove retired kdump state
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/sysctl.d/30-kdump.conf
    - /usr/lib/dracut/dracut.conf.d/kdump-tools
    - /var/crash/kdump_lock
    - /var/crash/kexec_cmd
  become: true
  tags:
    - retired_services
    - kdump

# Drop once lab, pug, and fox have converged.
- name: Remove the retired fluent-bit service include manifest
  file:
    path: /etc/fluent-bit/services.yaml
    state: absent
  become: true
  tags:
    - retired_services
    - fluentbit

# The smart role no longer ships a fluent-bit extension; the include glob would
# otherwise keep loading the stale fragment left on lab and pug.
- name: Remove the retired smart fluent-bit extension
  import_role:
    name: fluentbit
    tasks_from: extension_remove
  vars:
    fluentbit_extension_remove_args:
      names:
        - smart
  tags:
    - retired_services
    - fluentbit
