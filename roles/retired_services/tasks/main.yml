---
- name: Remove retired podman socket drop-in
  import_role:
    name: systemd_unit
    tasks_from: remove
  vars:
    systemd_unit_args:
      for: podman.socket
  tags:
    - retired_services
    - podman

- name: Restore packaged podman tmpfiles configuration
  lineinfile:
    regexp: '^# (.*) /run/podman (.*)$'
    line: '\1 /run/podman \2'
    backrefs: true
    dest: /usr/lib/tmpfiles.d/podman.conf
    backup: true
    owner: root
    group: root
    mode: "0644"
  become: true
  tags:
    - retired_services
    - podman

- name: Remove retired podman tmpfiles diversion
  community.general.dpkg_divert:
    path: /usr/lib/tmpfiles.d/podman.conf
    state: absent
  become: true
  tags:
    - retired_services
    - podman

- name: Restart podman socket after removing its retired drop-in
  when:
    - not ansible_check_mode
    - podman_socket_d_override_conf_result.changed
  systemd:
    name: podman.socket
    state: restarted
  become: true
  tags:
    - retired_services
    - podman

- name: Query retired chrony defaults diversion # noqa: command-instead-of-module -- read-only query
  command: dpkg-divert --list /etc/default/chrony
  register: retired_services_chrony_diversion
  changed_when: false
  check_mode: false
  become: true
  tags:
    - retired_services
    - chrony

- name: Check for packaged chrony defaults saved by dpkg
  when: retired_services_chrony_diversion.stdout | length > 0
  stat:
    path: /etc/default/chrony.distrib
  register: retired_services_chrony_distrib
  become: true
  tags:
    - retired_services
    - chrony

- name: Restore packaged chrony defaults
  when: retired_services_chrony_diversion.stdout | length > 0
  copy:
    src: >-
      {{ '/etc/default/chrony.distrib'
         if retired_services_chrony_distrib.stat.exists
         else 'chrony.default' }}
    remote_src: "{{ retired_services_chrony_distrib.stat.exists }}"
    dest: /etc/default/chrony
    owner: root
    group: root
    mode: "0644"
    backup: true
    validate: 'sh -c ''. "%s" && test -n "${DAEMON_OPTS:-}"'''
  register: retired_services_chrony_default
  become: true
  tags:
    - retired_services
    - chrony

- name: Remove retired chrony defaults diversion
  when: retired_services_chrony_diversion.stdout | length > 0
  community.general.dpkg_divert:
    path: /etc/default/chrony
    state: absent
  become: true
  tags:
    - retired_services
    - chrony

- name: Remove packaged chrony defaults saved by the retired diversion
  when: retired_services_chrony_diversion.stdout | length > 0
  file:
    path: /etc/default/chrony.distrib
    state: absent
  become: true
  tags:
    - retired_services
    - chrony

- name: Remove retired chrony IPv4 drop-in
  import_role:
    name: systemd_unit
    tasks_from: remove
  vars:
    systemd_unit_args:
      for: chrony.service
  tags:
    - retired_services
    - chrony

- name: Restart chrony after removing retired IPv4 configuration
  when:
    - not ansible_check_mode
    - >-
      (retired_services_chrony_default.changed | default(false))
      or chrony_service_d_override_conf_result.changed
  systemd:
    name: chrony.service
    state: restarted
  become: true
  tags:
    - retired_services
    - chrony

- name: Inspect the retired timesyncd mask
  stat:
    path: /etc/systemd/system/systemd-timesyncd.service
    follow: false
  register: retired_services_timesyncd_mask
  become: true
  tags:
    - retired_services
    - chrony

- name: Remove the retired timesyncd mask
  when:
    - retired_services_timesyncd_mask.stat.islnk | default(false)
    - retired_services_timesyncd_mask.stat.lnk_target == '/dev/null'
  file:
    path: /etc/systemd/system/systemd-timesyncd.service
    state: absent
  register: retired_services_timesyncd_unmasked
  become: true
  tags:
    - retired_services
    - chrony

- name: Reload systemd after removing the retired timesyncd mask
  when: retired_services_timesyncd_unmasked.changed | default(false)
  systemd:
    daemon_reload: true
  become: true
  tags:
    - retired_services
    - chrony

- name: Remove retired NUT driver network-ordering drop-in
  import_role:
    name: systemd_unit
    tasks_from: remove
  vars:
    systemd_unit_args:
      for: nut-driver@eaton.service
  tags:
    - retired_services
    - nut

- name: Remove retired upsset CGI sentinel
  lineinfile:
    path: /etc/nut/upsset.conf
    regexp: ^I_HAVE_SECURED_MY_CGI_DIRECTORY$
    state: absent
    backup: true
    owner: root
    group: root
    mode: "0644"
  become: true
  tags:
    - retired_services
    - nut

- name: Remove retired podman socket group
  group:
    name: podman-socket
    state: absent
  become: true
  tags:
    - retired_services
    - podman

- name: Remove retired custom Samba mDNS service
  file:
    path: /etc/avahi/services/smb.service
    state: absent
  register: retired_services_samba_mdns
  become: true
  tags:
    - retired_services
    - samba

- name: Check Avahi state after Samba mDNS service removal
  when: retired_services_samba_mdns.changed
  systemd:
    name: avahi-daemon
  register: retired_services_avahi_state
  failed_when: false
  changed_when: false
  become: true
  tags:
    - retired_services
    - samba

- name: Reload Avahi after Samba mDNS service removal
  when:
    - not ansible_check_mode
    - retired_services_samba_mdns.changed
    - retired_services_avahi_state.status.ActiveState | default('') == 'active'
  systemd:
    name: avahi-daemon
    state: reloaded
  become: true
  tags:
    - retired_services
    - samba

- name: Remove retired Netdata smartctl collector override
  file:
    path: /etc/netdata/go.d/smartctl.conf
    state: absent
  become: true
  tags:
    - retired_services

- name: Remove retired smartmontools defaults file
  file:
    path: /etc/default/smartmontools
    state: absent
  become: true
  tags:
    - retired_services

- name: Remove retired smartmontools defaults diversion
  community.general.dpkg_divert:
    path: /etc/default/smartmontools
    state: absent
  become: true
  tags:
    - retired_services

- name: Remove retired Mailutils sender-domain config
  file:
    path: /etc/mailutils.conf
    state: absent
  become: true
  tags:
    - retired_services
    - postfix

- name: Remove retired GNU Mailutils package
  apt:
    name: mailutils
    state: absent
    autoremove: true
    purge: true
  become: true
  tags:
    - retired_services
    - postfix

- name: Remove retired compiled Postfix aliases
  file:
    path: /etc/aliases.db
    state: absent
  become: true
  tags:
    - retired_services
    - postfix

# Retired numeric identities remain reserved in legacy_service_ids so restored
# files cannot acquire ambiguous ownership. Runtime accounts and state are gone.
- name: Retire Speedtest service
  import_role:
    name: systemd_unit
    tasks_from: remove
  vars:
    systemd_unit_args:
      dest: speedtest.service
  tags:
    - retired_services

- name: Retire Speedtest nginx site
  import_role:
    name: nginx
    tasks_from: site_remove
  vars:
    nginx_site_remove_args:
      subdomain: speedtest
  tags:
    - retired_services

- name: Retire Healthchecks service
  import_role:
    name: systemd_unit
    tasks_from: remove
  vars:
    systemd_unit_args:
      dest: healthchecks.service
  tags:
    - retired_services

- name: Retire Roundcube service
  import_role:
    name: systemd_unit
    tasks_from: remove
  vars:
    systemd_unit_args:
      dest: roundcube.service
  tags:
    - retired_services

- name: Retire Dovecot service
  import_role:
    name: systemd_unit
    tasks_from: remove
  vars:
    systemd_unit_args:
      dest: dovecot.service
  tags:
    - retired_services

- name: Retire Plex service
  import_role:
    name: systemd_unit
    tasks_from: remove
  vars:
    systemd_unit_args:
      dest: plex.service
  tags:
    - retired_services

- name: Retire Tautulli service
  import_role:
    name: systemd_unit
    tasks_from: remove
  vars:
    systemd_unit_args:
      dest: tautulli.service
  tags:
    - retired_services

- name: Retire Tautulli ini watcher path
  import_role:
    name: systemd_unit
    tasks_from: remove
  vars:
    systemd_unit_args:
      dest: sort_ini_mnt-services-tautulli-config.ini.path
  tags:
    - retired_services

- name: Retire Tautulli ini watcher service
  import_role:
    name: systemd_unit
    tasks_from: remove
  vars:
    systemd_unit_args:
      dest: sort_ini_mnt-services-tautulli-config.ini.service
  tags:
    - retired_services

- name: Retire legacy SABnzbd ini watcher path
  import_role:
    name: systemd_unit
    tasks_from: remove
  vars:
    systemd_unit_args:
      dest: sort_ini_mnt-services-sabnzbd-sabnzbd.ini.path
  tags:
    - retired_services
    - sabnzbd

- name: Retire legacy SABnzbd ini watcher service
  import_role:
    name: systemd_unit
    tasks_from: remove
  vars:
    systemd_unit_args:
      dest: sort_ini_mnt-services-sabnzbd-sabnzbd.ini.service
  tags:
    - retired_services
    - sabnzbd

- name: Retire SABnzbd ini canonicalizer path
  import_role:
    name: systemd_unit
    tasks_from: remove
  vars:
    systemd_unit_args:
      dest: sabnzbd_ini_sort.path
  tags:
    - retired_services
    - sabnzbd

- name: Retire SABnzbd ini canonicalizer service
  import_role:
    name: systemd_unit
    tasks_from: remove
  vars:
    systemd_unit_args:
      dest: sabnzbd_ini_sort.service
  tags:
    - retired_services
    - sabnzbd

- name: Remove retired ini canonicalizers
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /usr/local/bin/sort_ini
    - /usr/local/bin/sabnzbd_sort_ini
  become: true
  tags:
    - retired_services
    - sabnzbd

- name: Remove retired nzbToMedia installation
  file:
    path: /opt/nzbToMedia
    state: absent
  become: true
  tags:
    - retired_services
    - sabnzbd

- name: Check for retained SABnzbd state
  stat:
    path: /mnt/services/sabnzbd
  register: retired_services_sabnzbd_state
  become: true
  tags:
    - retired_services
    - sabnzbd

- name: Find retired nzbToMedia configuration files
  when: retired_services_sabnzbd_state.stat.isdir | default(false)
  find:
    paths: /mnt/services/sabnzbd
    patterns: autoProcessMedia.cfg*
    file_type: file
  register: retired_services_nzbtomedia_configs
  become: true
  tags:
    - retired_services
    - sabnzbd

- name: Remove retired nzbToMedia configuration files
  file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ retired_services_nzbtomedia_configs.files | default([]) }}"
  loop_control:
    label: "{{ item.path }}"
  become: true
  tags:
    - retired_services
    - sabnzbd

- name: Retire Plex nginx site
  import_role:
    name: nginx
    tasks_from: site_remove
  vars:
    nginx_site_remove_args:
      subdomain: plex
  tags:
    - retired_services

- name: Retire Tautulli nginx site
  import_role:
    name: nginx
    tasks_from: site_remove
  vars:
    nginx_site_remove_args:
      subdomain: tautulli
  tags:
    - retired_services

- name: Retire Healthchecks nginx site
  import_role:
    name: nginx
    tasks_from: site_remove
  vars:
    nginx_site_remove_args:
      subdomain: healthchecks
  tags:
    - retired_services

- name: Retire Roundcube nginx site
  import_role:
    name: nginx
    tasks_from: site_remove
  vars:
    nginx_site_remove_args:
      subdomain: roundcube
  tags:
    - retired_services

- name: Remove retired service Fluent Bit extensions
  import_role:
    name: fluentbit
    tasks_from: extension_remove
  vars:
    fluentbit_extension_remove_args:
      names:
        - plex
        - speedtest
        - tautulli
  tags:
    - retired_services

- name: Find retired Plex and Tautulli Fluent Bit cursors
  find:
    paths: /var/lib/fluent-bit
    patterns:
      - plex.db*
      - plex-scanner.db*
      - plex-crash-uploader.db*
      - tautulli-websocket.db*
    file_type: file
  register: retired_services_media_cursors
  become: true
  tags:
    - retired_services

- name: Remove retired Plex and Tautulli Fluent Bit cursors
  file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ retired_services_media_cursors.files }}"
  loop_control:
    label: "{{ item.path }}"
  become: true
  tags:
    - retired_services

- name: Find retired nzbToMedia Fluent Bit cursors
  find:
    paths: /var/lib/fluent-bit
    patterns: nzbtomedia.db*
    file_type: file
  register: retired_services_nzbtomedia_cursors
  become: true
  tags:
    - retired_services
    - sabnzbd

- name: Remove retired nzbToMedia Fluent Bit cursors
  file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ retired_services_nzbtomedia_cursors.files }}"
  loop_control:
    label: "{{ item.path }}"
  become: true
  tags:
    - retired_services
    - sabnzbd

- name: Check whether Podman is installed for retired image cleanup
  stat:
    path: /usr/bin/podman
  register: retired_services_podman
  tags:
    - retired_services

- name: Remove retired Speedtest Podman network
  when: retired_services_podman.stat.exists
  containers.podman.podman_network:
    name: speedtest
    state: absent
  become: true
  tags:
    - retired_services

- name: Remove retired webmail Podman network
  when: retired_services_podman.stat.exists
  containers.podman.podman_network:
    name: webmail
    state: absent
  become: true
  tags:
    - retired_services

- name: Remove retired service container images
  when: retired_services_podman.stat.exists
  containers.podman.podman_image:
    name: "{{ item }}"
    state: absent
  loop:
    - docker.io/plexinc/pms-docker:1.43.2.10687-563d026ea
    - ghcr.io/librespeed/speedtest:6.1.0
    - docker.io/linuxserver/tautulli:2.14.2
  become: true
  tags:
    - retired_services

- name: Remove retired service state
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /mnt/services/healthchecks
    - /mnt/services/sqlite/healthchecks
    - /mnt/services/openobserve
    - /mnt/services/sqlite/openobserve
    - /mnt/services/plex
    - /mnt/services/sqlite/plex
    - /mnt/services/tautulli
    - /mnt/services/sqlite/tautulli
    - /mnt/services/webmail
    - /mnt/services/sqlite/roundcube
  become: true
  tags:
    - retired_services

- name: Remove retired service accounts
  user:
    name: "{{ item }}"
    state: absent
    force: true
  loop:
    - plex
    - speedtest
    - tautulli
  become: true
  tags:
    - retired_services

- name: Remove retired service groups
  group:
    name: "{{ item }}"
    state: absent
  loop:
    - plex
    - speedtest
    - tautulli
  become: true
  tags:
    - retired_services

- name: Remove retired zfs_autobackup files
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/logrotate.d/zfs_autobackup
    - /root/.ssh/config
    - /mnt/services/ssh_root
    - /var/lib/zfs_autobackup/.config/systemd
  become: true
  tags:
    - retired_services

- name: Lookup retired Netdata poller account
  command:
    argv:
      - getent
      - passwd
      - netdata_poll
  register: retired_services_netdata_poll_passwd
  changed_when: false
  failed_when: retired_services_netdata_poll_passwd.rc not in [0, 2]
  check_mode: false

- name: Disable lingering for retired Netdata poller
  import_role:
    name: linger
    tasks_from: disable
  vars:
    linger_args:
      name: netdata_poll
      uid: >-
        {{ retired_services_netdata_poll_passwd.stdout.split(':')[2] | int
           if retired_services_netdata_poll_passwd.rc == 0 else omit }}

- name: Remove retired Netdata poller account
  user:
    name: netdata_poll
    state: absent
    remove: true
    force: true
  become: true

- name: Remove retired Netdata poller group
  group:
    name: netdata_poll
    state: absent
  become: true

- name: Remove retired Netdata poller files
  file:
    path: "{{ item }}"
    state: absent
  become: true
  loop:
    - /var/lib/netdata_poll
    - /usr/local/bin/netdata_poll_fetch
    - /usr/local/bin/stderr_priority
    - /opt/homepage_alerts/.ssh
