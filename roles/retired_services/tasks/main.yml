---
- name: Remove retired keepalived tenant configuration
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/keepalived/conf.d
    - /etc/systemd/system/keepalived.service.d/override.conf
  register: retired_services_keepalived_tenant_config
  become: true
  tags:
    - retired_services
    - keepalived
    - adguard

- name: Reload systemd after removing retired keepalived configuration
  when: retired_services_keepalived_tenant_config.changed
  systemd:
    daemon_reload: true
  become: true
  tags:
    - retired_services
    - keepalived
    - adguard

- name: Remove retired AdGuard inhibitor delay override
  file:
    path: /etc/systemd/logind.conf.d/adguard_reboot_guard.conf
    state: absent
  become: true
  tags:
    - retired_services
    - adguard

- name: Remove retired logrotate conffile diversions
  community.general.dpkg_divert:
    path: "{{ item }}"
    divert: "{{ item }}.dpkg-dist"
    state: absent
  loop:
    - /etc/logrotate.conf
    - /etc/logrotate.d/btmp
    - /etc/logrotate.d/wtmp
    - /etc/logrotate.d/rsyslog
    - /etc/logrotate.d/ubuntu-pro-client
    - /etc/logrotate.d/cloud-init
    - /etc/logrotate.d/apt
    - /etc/logrotate.d/dpkg
    - /etc/logrotate.d/alternatives
    - /etc/logrotate.d/unattended-upgrades
    - /etc/logrotate.d/nginx
    - /etc/logrotate.d/certbot
    - /etc/logrotate.d/hd-idle
    - /etc/logrotate.d/libvirtd
    - /etc/logrotate.d/libvirtd.libxl
    - /etc/logrotate.d/libvirtd.lxc
    - /etc/logrotate.d/libvirtd.qemu
    - /etc/logrotate.d/netdata
    - /etc/logrotate.d/fail2ban
    - /etc/logrotate.d/chrony
  become: true
  tags:
    - retired_services
    - logrotate

- name: Remove retired libvirt guest creation tools
  apt:
    name:
      - libhugetlbfs-bin
      - virtinst
    state: absent
    purge: true
  become: true
  tags:
    - retired_services
    - libvirt

- name: Remove unconfigured management macvlan
  import_role:
    name: systemd_unit
    tasks_from: remove
  vars:
    systemd_unit_args:
      dest: mac_mgmt.service
      condition: "{{ macvlan_blocks | selectattr('name', 'equalto', 'mac_mgmt') | list | length == 0 }}"
  tags:
    - retired_services
    - macvlan

- name: Find retired Apport log files
  find:
    paths: /var/log
    patterns:
      - 'apport.log'
      - 'apport.log.*'
    file_type: file
  register: retired_services_apport_logs
  become: true
  tags:
    - retired_services
    - kdump

- name: Remove retired Apport log files
  file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ retired_services_apport_logs.files }}"
  loop_control:
    label: "{{ item.path }}"
  become: true
  tags:
    - retired_services
    - kdump

- name: Remove retired kdump sysctl pins
  ansible.posix.sysctl:
    name: "kernel.{{ item }}"
    state: absent
    sysctl_file: /etc/sysctl.d/30-kdump.conf
    reload: false
  loop:
    - panic_on_oops
    - softlockup_all_cpu_backtrace
    - hardlockup_all_cpu_backtrace
    - hung_task_all_cpu_backtrace
    - oops_all_cpu_backtrace
  loop_control:
    label: "kernel.{{ item }}"
  become: true
  tags:
    - retired_services
    - kdump

- name: Remove retired podman socket drop-in
  import_role:
    name: systemd_unit
    tasks_from: remove
  vars:
    systemd_unit_args:
      for: podman.socket
  tags:
    - retired_services
    - podman

- name: Remove retired InfluxDB username secret
  containers.podman.podman_secret:
    name: influxdb_root_user
    state: absent
  become: true
  tags:
    - retired_services
    - influxdb

- name: Restore packaged podman tmpfiles configuration
  lineinfile:
    regexp: '^# (.*) /run/podman (.*)$'
    line: '\1 /run/podman \2'
    backrefs: true
    dest: /usr/lib/tmpfiles.d/podman.conf
    backup: true
    owner: root
    group: root
    mode: "0644"
  become: true
  tags:
    - retired_services
    - podman

- name: Remove retired podman tmpfiles diversion
  community.general.dpkg_divert:
    path: /usr/lib/tmpfiles.d/podman.conf
    state: absent
  become: true
  tags:
    - retired_services
    - podman

- name: Restart podman socket after removing its retired drop-in
  when:
    - not ansible_check_mode
    - podman_socket_d_override_conf_result.changed
  systemd:
    name: podman.socket
    state: restarted
  become: true
  tags:
    - retired_services
    - podman

- name: Query retired chrony defaults diversion # noqa: command-instead-of-module -- read-only query
  command: dpkg-divert --list /etc/default/chrony
  register: retired_services_chrony_diversion
  changed_when: false
  check_mode: false
  become: true
  tags:
    - retired_services
    - chrony

- name: Check for packaged chrony defaults saved by dpkg
  when: retired_services_chrony_diversion.stdout | length > 0
  stat:
    path: /etc/default/chrony.distrib
  register: retired_services_chrony_distrib
  become: true
  tags:
    - retired_services
    - chrony

- name: Restore packaged chrony defaults
  when: retired_services_chrony_diversion.stdout | length > 0
  copy:
    src: >-
      {{ '/etc/default/chrony.distrib'
         if retired_services_chrony_distrib.stat.exists
         else 'chrony.default' }}
    remote_src: "{{ retired_services_chrony_distrib.stat.exists }}"
    dest: /etc/default/chrony
    owner: root
    group: root
    mode: "0644"
    backup: true
    validate: 'sh -c ''. "%s" && test -n "${DAEMON_OPTS:-}"'''
  register: retired_services_chrony_default
  become: true
  tags:
    - retired_services
    - chrony

- name: Remove retired chrony defaults diversion
  when: retired_services_chrony_diversion.stdout | length > 0
  community.general.dpkg_divert:
    path: /etc/default/chrony
    state: absent
  become: true
  tags:
    - retired_services
    - chrony

- name: Remove packaged chrony defaults saved by the retired diversion
  when: retired_services_chrony_diversion.stdout | length > 0
  file:
    path: /etc/default/chrony.distrib
    state: absent
  become: true
  tags:
    - retired_services
    - chrony

- name: Remove retired chrony IPv4 drop-in
  import_role:
    name: systemd_unit
    tasks_from: remove
  vars:
    systemd_unit_args:
      for: chrony.service
  tags:
    - retired_services
    - chrony

- name: Restart chrony after removing retired IPv4 configuration
  when:
    - not ansible_check_mode
    - >-
      (retired_services_chrony_default.changed | default(false))
      or chrony_service_d_override_conf_result.changed
  systemd:
    name: chrony.service
    state: restarted
  become: true
  tags:
    - retired_services
    - chrony

- name: Inspect the retired timesyncd mask
  stat:
    path: /etc/systemd/system/systemd-timesyncd.service
    follow: false
  register: retired_services_timesyncd_mask
  become: true
  tags:
    - retired_services
    - chrony

- name: Remove the retired timesyncd mask
  when:
    - retired_services_timesyncd_mask.stat.islnk | default(false)
    - retired_services_timesyncd_mask.stat.lnk_target == '/dev/null'
  file:
    path: /etc/systemd/system/systemd-timesyncd.service
    state: absent
  register: retired_services_timesyncd_unmasked
  become: true
  tags:
    - retired_services
    - chrony

- name: Reload systemd after removing the retired timesyncd mask
  when: retired_services_timesyncd_unmasked.changed | default(false)
  systemd:
    daemon_reload: true
  become: true
  tags:
    - retired_services
    - chrony

- name: Remove retired NUT driver network-ordering drop-in
  import_role:
    name: systemd_unit
    tasks_from: remove
  vars:
    systemd_unit_args:
      for: nut-driver@eaton.service
  tags:
    - retired_services
    - nut

- name: Remove retired upsset CGI sentinel
  lineinfile:
    path: /etc/nut/upsset.conf
    regexp: ^I_HAVE_SECURED_MY_CGI_DIRECTORY$
    state: absent
    backup: true
    owner: root
    group: root
    mode: "0644"
  become: true
  tags:
    - retired_services
    - nut

- name: Remove retired podman socket group
  group:
    name: podman-socket
    state: absent
  become: true
  tags:
    - retired_services
    - podman

- name: Remove retired custom Samba mDNS service
  file:
    path: /etc/avahi/services/smb.service
    state: absent
  register: retired_services_samba_mdns
  become: true
  tags:
    - retired_services
    - samba

- name: Check Avahi state after Samba mDNS service removal
  when: retired_services_samba_mdns.changed
  systemd:
    name: avahi-daemon
  register: retired_services_avahi_state
  failed_when: false
  changed_when: false
  become: true
  tags:
    - retired_services
    - samba

- name: Reload Avahi after Samba mDNS service removal
  when:
    - not ansible_check_mode
    - retired_services_samba_mdns.changed
    - retired_services_avahi_state.status.ActiveState | default('') == 'active'
  systemd:
    name: avahi-daemon
    state: reloaded
  become: true
  tags:
    - retired_services
    - samba

- name: Remove retired Netdata Packagecloud source
  file:
    path: /etc/apt/sources.list.d/packagecloud_io_netdata_netdata_ubuntu.list
    state: absent
  become: true
  tags:
    - retired_services
    - netdata

- name: Remove retired Netdata smartctl collector override
  file:
    path: /etc/netdata/go.d/smartctl.conf
    state: absent
  become: true
  tags:
    - retired_services

- name: Remove hdparm Netdata files from diskless hosts
  when: rotational_disks_by_id | length == 0
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /usr/libexec/netdata/charts.d/hdparm.chart.sh
    - /etc/netdata/charts.d/hdparm.conf
    - /etc/netdata/health.d/hdparm.conf
  register: retired_services_hdparm_netdata_files
  become: true
  tags:
    - retired_services
    - hdparm

- name: Read disk group membership on diskless hosts
  when: rotational_disks_by_id | length == 0
  getent:
    database: group
    key: disk
  become: true
  tags:
    - retired_services
    - hdparm

- name: Remove netdata from disk group on diskless hosts
  when:
    - rotational_disks_by_id | length == 0
    - not ansible_check_mode
    - "'netdata' in ansible_facts.getent_group.disk[2].split(',')"
  command: gpasswd --delete netdata disk
  register: retired_services_hdparm_disk_group
  changed_when: true
  become: true
  tags:
    - retired_services
    - hdparm

- name: Check Netdata state after diskless hdparm cleanup
  when:
    - rotational_disks_by_id | length == 0
    - not ansible_check_mode
    - >-
      retired_services_hdparm_netdata_files.changed
      or retired_services_hdparm_disk_group.changed | default(false)
  systemd:
    name: netdata
  register: retired_services_hdparm_netdata_state
  failed_when: false
  changed_when: false
  become: true
  tags:
    - retired_services
    - hdparm

- name: Restart Netdata after diskless hdparm cleanup
  when:
    - retired_services_hdparm_netdata_state.status.ActiveState | default('') == 'active'
  systemd:
    name: netdata
    state: restarted
  become: true
  tags:
    - retired_services
    - hdparm

- name: Remove retired Netdata conffile diversion
  community.general.dpkg_divert:
    path: /etc/netdata/netdata.conf
    state: absent
  become: true
  tags:
    - retired_services
    - netdata

- name: Remove retired smartmontools defaults file
  file:
    path: /etc/default/smartmontools
    state: absent
  become: true
  tags:
    - retired_services

- name: Remove retired smartmontools defaults diversion
  community.general.dpkg_divert:
    path: /etc/default/smartmontools
    state: absent
  become: true
  tags:
    - retired_services

- name: Remove retired smartd conffile diversion
  community.general.dpkg_divert:
    path: /etc/smartd.conf
    state: absent
  become: true
  tags:
    - retired_services
    - smart

- name: Remove retired hd-idle conffile diversion
  community.general.dpkg_divert:
    path: /etc/default/hd-idle
    state: absent
  become: true
  tags:
    - retired_services
    - hd_idle

- name: Remove retired hdparm conffile diversion
  community.general.dpkg_divert:
    path: /etc/hdparm.conf
    state: absent
  become: true
  tags:
    - retired_services
    - hdparm

- name: Check retired hdparm configuration
  stat:
    path: /etc/hdparm.conf
    checksum_algorithm: md5
  register: retired_services_hdparm_conf
  become: true
  tags:
    - retired_services
    - hdparm

- name: Read retired hdparm configuration
  when: retired_services_hdparm_conf.stat.exists
  slurp:
    src: /etc/hdparm.conf
  register: retired_services_hdparm_conf_content
  become: true
  tags:
    - retired_services
    - hdparm

- name: Query packaged hdparm configuration checksum # noqa: command-instead-of-module -- read-only package metadata query
  command: dpkg-query -W -f=${Conffiles} hdparm
  register: retired_services_hdparm_conffiles
  changed_when: false
  failed_when: retired_services_hdparm_conffiles.rc not in [0, 1]
  check_mode: false
  tags:
    - retired_services
    - hdparm

- name: Restore packaged hdparm configuration
  vars:
    _active_directives: >-
      {{ (retired_services_hdparm_conf_content.content | default('') | b64decode).splitlines()
         | map('trim') | reject('equalto', '') | reject('match', '^#') | list }}
    _packaged_checksum: >-
      {{ retired_services_hdparm_conffiles.stdout
         | regex_search('/etc/hdparm\.conf\s+([0-9a-f]{32})', '\1')
         | first | default('') }}
  when:
    - retired_services_hdparm_conffiles.rc == 0
    - retired_services_hdparm_conf.stat.exists
    - _active_directives == ['quiet']
    - retired_services_hdparm_conf.stat.checksum != _packaged_checksum
  command:
    argv:
      - apt-get
      - --reinstall
      - -o
      - Dpkg::Options::=--force-confask
      - -o
      - Dpkg::Options::=--force-confnew
      - install
      - -y
      - hdparm
  environment:
    DEBIAN_FRONTEND: noninteractive
  changed_when: true
  become: true
  tags:
    - retired_services
    - hdparm

- name: Remove retired ZFS cron conffile diversion
  community.general.dpkg_divert:
    path: /etc/cron.d/zfsutils-linux
    state: absent
  become: true
  tags:
    - retired_services
    - zfs

- name: Remove retired ZFS cron conffile paths
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/cron.d/zfsutils-linux
    - /etc/cron.d/zfsutils-linux.disabled
  become: true
  tags:
    - retired_services
    - zfs

- name: Remove retired Mailutils sender-domain config
  file:
    path: /etc/mailutils.conf
    state: absent
  become: true
  tags:
    - retired_services
    - postfix

- name: Remove retired GNU Mailutils package
  apt:
    name: mailutils
    state: absent
    autoremove: true
    purge: true
  become: true
  tags:
    - retired_services
    - postfix

- name: Remove retired compiled Postfix aliases
  file:
    path: /etc/aliases.db
    state: absent
  become: true
  tags:
    - retired_services
    - postfix

# nginx workers inherit the TLS context loaded by the root master and never
# read certificate files themselves. Keep this migration tombstone so restored
# hosts cannot regain the obsolete group membership.
- name: Read ssl-cert group membership
  getent:
    database: group
    key: ssl-cert
  register: retired_services_ssl_cert_group
  become: true
  tags:
    - retired_services
    - nginx

- name: Remove retired www-data ssl-cert membership
  when: >-
    'www-data' in
    (retired_services_ssl_cert_group.ansible_facts.getent_group['ssl-cert'][2]
    | default('')).split(',')
  command: gpasswd --delete www-data ssl-cert
  changed_when: true
  become: true
  tags:
    - retired_services
    - nginx

- name: Remove retired nginx files
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/nginx/dhparam.pem
    - /etc/nginx/conf.d/status.conf
  register: retired_services_nginx_file_cleanup
  become: true
  tags:
    - retired_services
    - nginx

# Retired numeric identities remain reserved in legacy_service_ids so restored
# files cannot acquire ambiguous ownership. Runtime accounts and state are gone.
- name: Retire Speedtest service
  import_role:
    name: systemd_unit
    tasks_from: remove
  vars:
    systemd_unit_args:
      dest: speedtest.service
  tags:
    - retired_services

- name: Remove retired nginx sites
  file:
    path: /etc/nginx/{{ item.1 }}/{{ item.0 }}
    state: absent
  loop: >-
    {{ ['speedtest', 'plex', 'tautulli', 'healthchecks', 'roundcube']
       | product(['sites-enabled', 'sites-available']) | list }}
  loop_control:
    label: "{{ item.0 }} ({{ item.1 }})"
  become: true
  register: retired_services_nginx_site_cleanup
  tags:
    - retired_services

- name: Reload nginx after removing retired configuration
  when:
    - not ansible_check_mode
    - retired_services_nginx_file_cleanup.changed or retired_services_nginx_site_cleanup.changed
  systemd:
    name: nginx
    state: reloaded
  become: true
  tags:
    - retired_services

- name: Retire Healthchecks service
  import_role:
    name: systemd_unit
    tasks_from: remove
  vars:
    systemd_unit_args:
      dest: healthchecks.service
  tags:
    - retired_services

- name: Retire Roundcube service
  import_role:
    name: systemd_unit
    tasks_from: remove
  vars:
    systemd_unit_args:
      dest: roundcube.service
  tags:
    - retired_services

- name: Retire Netplan rollback service
  import_role:
    name: systemd_unit
    tasks_from: remove
  vars:
    systemd_unit_args:
      dest: netplan_rollback.service
  tags:
    - retired_services
    - netplan

- name: Retire Netplan rollback timer
  import_role:
    name: systemd_unit
    tasks_from: remove
  vars:
    systemd_unit_args:
      dest: netplan_rollback.timer
  tags:
    - retired_services
    - netplan

- name: Remove retired Netplan rollback helper
  file:
    path: /usr/local/bin/netplan_rollback
    state: absent
  become: true
  tags:
    - retired_services
    - netplan

- name: Retire Dovecot service
  import_role:
    name: systemd_unit
    tasks_from: remove
  vars:
    systemd_unit_args:
      dest: dovecot.service
  tags:
    - retired_services

- name: Retire Plex service
  import_role:
    name: systemd_unit
    tasks_from: remove
  vars:
    systemd_unit_args:
      dest: plex.service
  tags:
    - retired_services

- name: Retire Tautulli service
  import_role:
    name: systemd_unit
    tasks_from: remove
  vars:
    systemd_unit_args:
      dest: tautulli.service
  tags:
    - retired_services

- name: Retire Tautulli ini watcher path
  import_role:
    name: systemd_unit
    tasks_from: remove
  vars:
    systemd_unit_args:
      dest: sort_ini_mnt-services-tautulli-config.ini.path
  tags:
    - retired_services

- name: Retire Tautulli ini watcher service
  import_role:
    name: systemd_unit
    tasks_from: remove
  vars:
    systemd_unit_args:
      dest: sort_ini_mnt-services-tautulli-config.ini.service
  tags:
    - retired_services

- name: Retire legacy SABnzbd ini watcher path
  import_role:
    name: systemd_unit
    tasks_from: remove
  vars:
    systemd_unit_args:
      dest: sort_ini_mnt-services-sabnzbd-sabnzbd.ini.path
  tags:
    - retired_services
    - sabnzbd

- name: Retire legacy SABnzbd ini watcher service
  import_role:
    name: systemd_unit
    tasks_from: remove
  vars:
    systemd_unit_args:
      dest: sort_ini_mnt-services-sabnzbd-sabnzbd.ini.service
  tags:
    - retired_services
    - sabnzbd

- name: Retire SABnzbd ini canonicalizer path
  import_role:
    name: systemd_unit
    tasks_from: remove
  vars:
    systemd_unit_args:
      dest: sabnzbd_ini_sort.path
  tags:
    - retired_services
    - sabnzbd

- name: Retire SABnzbd ini canonicalizer service
  import_role:
    name: systemd_unit
    tasks_from: remove
  vars:
    systemd_unit_args:
      dest: sabnzbd_ini_sort.service
  tags:
    - retired_services
    - sabnzbd

- name: Remove retired ini canonicalizers
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /usr/local/bin/sort_ini
    - /usr/local/bin/sabnzbd_sort_ini
  become: true
  tags:
    - retired_services
    - sabnzbd

- name: Remove retired nzbToMedia installation
  file:
    path: /opt/nzbToMedia
    state: absent
  become: true
  tags:
    - retired_services
    - sabnzbd

- name: Check for retained SABnzbd state
  stat:
    path: /mnt/services/sabnzbd
  register: retired_services_sabnzbd_state
  become: true
  tags:
    - retired_services
    - sabnzbd

- name: Find retired nzbToMedia configuration files
  when: retired_services_sabnzbd_state.stat.isdir | default(false)
  find:
    paths: /mnt/services/sabnzbd
    patterns: autoProcessMedia.cfg*
    file_type: file
  register: retired_services_nzbtomedia_configs
  become: true
  tags:
    - retired_services
    - sabnzbd

- name: Remove retired nzbToMedia configuration files
  file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ retired_services_nzbtomedia_configs.files | default([]) }}"
  loop_control:
    label: "{{ item.path }}"
  become: true
  tags:
    - retired_services
    - sabnzbd

- name: Remove retired service Fluent Bit extensions
  import_role:
    name: fluentbit
    tasks_from: extension_remove
  vars:
    fluentbit_extension_remove_args:
      names:
        - plex
        - speedtest
        - tautulli
  tags:
    - retired_services

- name: Find retired Plex and Tautulli Fluent Bit cursors
  find:
    paths: /var/lib/fluent-bit
    patterns:
      - plex.db*
      - plex-scanner.db*
      - plex-crash-uploader.db*
      - tautulli-websocket.db*
    file_type: file
  register: retired_services_media_cursors
  become: true
  tags:
    - retired_services

- name: Remove retired Plex and Tautulli Fluent Bit cursors
  file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ retired_services_media_cursors.files }}"
  loop_control:
    label: "{{ item.path }}"
  become: true
  tags:
    - retired_services

- name: Find retired nzbToMedia Fluent Bit cursors
  find:
    paths: /var/lib/fluent-bit
    patterns: nzbtomedia.db*
    file_type: file
  register: retired_services_nzbtomedia_cursors
  become: true
  tags:
    - retired_services
    - sabnzbd

- name: Remove retired nzbToMedia Fluent Bit cursors
  file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ retired_services_nzbtomedia_cursors.files }}"
  loop_control:
    label: "{{ item.path }}"
  become: true
  tags:
    - retired_services
    - sabnzbd

- name: Check whether Podman is installed for retired image cleanup
  stat:
    path: /usr/bin/podman
  register: retired_services_podman
  tags:
    - retired_services

- name: Remove retired Speedtest Podman network
  when: retired_services_podman.stat.exists
  containers.podman.podman_network:
    name: speedtest
    state: absent
  become: true
  tags:
    - retired_services

- name: Remove retired webmail Podman network
  when: retired_services_podman.stat.exists
  containers.podman.podman_network:
    name: webmail
    state: absent
  become: true
  tags:
    - retired_services

- name: Remove retired service container images
  when: retired_services_podman.stat.exists
  containers.podman.podman_image:
    name: "{{ item }}"
    state: absent
  loop:
    - docker.io/plexinc/pms-docker:1.43.2.10687-563d026ea
    - ghcr.io/librespeed/speedtest:6.1.0
    - docker.io/linuxserver/tautulli:2.14.2
  become: true
  tags:
    - retired_services

- name: Remove retired service state
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /mnt/services/healthchecks
    - /mnt/services/sqlite/healthchecks
    - /mnt/services/openobserve
    - /mnt/services/sqlite/openobserve
    - /mnt/services/plex
    - /mnt/services/sqlite/plex
    - /mnt/services/tautulli
    - /mnt/services/sqlite/tautulli
    - /mnt/services/webmail
    - /mnt/services/sqlite/roundcube
  become: true
  tags:
    - retired_services

- name: Remove retired service accounts
  user:
    name: "{{ item }}"
    state: absent
    force: true
  loop:
    - plex
    - speedtest
    - tautulli
  become: true
  tags:
    - retired_services

- name: Remove retired service groups
  group:
    name: "{{ item }}"
    state: absent
  loop:
    - plex
    - speedtest
    - tautulli
  become: true
  tags:
    - retired_services

- name: Remove retired Traefik and UniFi log files
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /var/log/traefik
    - /var/log/unifi
    - /etc/logrotate.d/unifi
  become: true
  tags:
    - retired_services
    - logrotate

- name: Remove retired udm_syslog rsyslog drop-in
  file:
    path: /etc/rsyslog.d/60-unifi.conf
    state: absent
  become: true
  register: retired_services_rsyslog_unifi_dropin
  tags:
    - retired_services
    - logrotate

# Reload after removing the UDP 5140 input so rsyslog releases the port.
- name: Reload rsyslog after drop-in removal
  systemd:
    name: rsyslog.service
    state: reloaded
  become: true
  when: retired_services_rsyslog_unifi_dropin.changed
  tags:
    - retired_services
    - logrotate

- name: Remove retired zfs_autobackup files
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/logrotate.d/zfs_autobackup
    - /root/.ssh/config
    - /mnt/services/ssh_root
    - /var/lib/zfs_autobackup/.config/systemd
  become: true
  tags:
    - retired_services

- name: Lookup retired Netdata poller account
  command:
    argv:
      - getent
      - passwd
      - netdata_poll
  register: retired_services_netdata_poll_passwd
  changed_when: false
  failed_when: retired_services_netdata_poll_passwd.rc not in [0, 2]
  check_mode: false

- name: Disable lingering for retired Netdata poller
  import_role:
    name: linger
    tasks_from: disable
  vars:
    linger_args:
      name: netdata_poll
      uid: >-
        {{ retired_services_netdata_poll_passwd.stdout.split(':')[2] | int
           if retired_services_netdata_poll_passwd.rc == 0 else omit }}

- name: Remove retired Netdata poller account
  user:
    name: netdata_poll
    state: absent
    remove: true
    force: true
  become: true

- name: Remove retired Netdata poller group
  group:
    name: netdata_poll
    state: absent
  become: true

- name: Remove retired Netdata poller files
  file:
    path: "{{ item }}"
    state: absent
  become: true
  loop:
    - /var/lib/netdata_poll
    - /usr/local/bin/netdata_poll_fetch
    - /usr/local/bin/stderr_priority
    - /opt/homepage_alerts/.ssh
