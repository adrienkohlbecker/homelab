# Noble ships 6.8 as GA, so the HWE meta only overshoots into the rolling
# edge. Strip it (and its image/headers metas) and let autoremove reclaim
# the orphaned rolling kernel. Ubuntu's apt never autoremoves the *running*
# kernel, so on a host currently booted into the rolling HWE (e.g. fox on
# 6.17) this drops the meta but leaves the live kernel in place -- demoting
# that running kernel needs an explicit purge + reboot done by hand, not an
# unattended converge that could reboot-loop. Once the host is back on 6.8,
# this task is a no-op.
- name: Remove rolling HWE kernel (GA is already 6.8)
  apt:
    pkg:
      - linux-generic-hwe-{{ ansible_distribution_version }}
      - linux-image-generic-hwe-{{ ansible_distribution_version }}
      - linux-headers-generic-hwe-{{ ansible_distribution_version }}
    state: absent
    autoremove: true
    purge: true
  become: true
  tags:
    - hwe_kernel

# thermald's D-Bus policy grants optional access to the Debian `power` group,
# which Ubuntu does not create. The package can be present on any supported
# release, independently of the HWE meta-package, so key the workaround to the
# policy file rather than the Ubuntu release. The empty group grants no users
# access and prevents dbus-daemon warning on every configuration reload.
- name: Probe thermald D-Bus policy
  stat:
    path: /usr/share/dbus-1/system.d/org.freedesktop.thermald.conf
    get_checksum: false
    get_mime: false
    get_attributes: false
  register: hwe_kernel_thermald_policy
  tags:
    - hwe_kernel

- name: Create power group (silence thermald dbus policy warning)
  when: hwe_kernel_thermald_policy.stat.exists
  group:
    name: power
    system: true
    state: present
  become: true
  tags:
    - hwe_kernel
