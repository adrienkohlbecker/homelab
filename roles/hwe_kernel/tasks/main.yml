# Noble's rolling HWE meta can outrun the pinned ZFS userspace. Remove its
# package chain, but let apt protect any running HWE kernel; demotion requires
# a deliberate purge and reboot.
- name: Remove rolling HWE kernel (GA is already 6.8)
  apt:
    pkg:
      - linux-generic-hwe-{{ ansible_distribution_version }}
      - linux-image-generic-hwe-{{ ansible_distribution_version }}
      - linux-headers-generic-hwe-{{ ansible_distribution_version }}
    state: absent
    autoremove: true
    purge: true
  become: true
  tags:
    - hwe_kernel

# thermald's D-Bus policy grants optional access to Debian's `power` group,
# which Ubuntu does not create. Keep it empty so access remains root-only while
# dbus-daemon can resolve the policy group without warning.
- name: Create power group (silence thermald dbus policy warning)
  group:
    name: power
    system: true
    state: present
  become: true
  tags:
    - hwe_kernel
