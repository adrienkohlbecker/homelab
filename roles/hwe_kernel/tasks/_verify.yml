# Functional verify. Pairs with _setup.yml, which installs the rolling HWE
# meta-package and removes the power group so both probes exercise converge.

- name: _verify | Rolling HWE meta-package is absent
  command: dpkg-query -W -f='${Status}' linux-generic-hwe-{{ ansible_distribution_version }}
  register: hwe_kernel_verify_dpkg
  changed_when: false
  failed_when: hwe_kernel_verify_dpkg.stdout == 'install ok installed'
  check_mode: false

- name: _verify | Power group exists for thermald D-Bus policy
  getent:
    database: group
    key: power
