# QEMU has no GPU, so create the render-group/device shape consumed by Jellyfin.
# The phantom device has no driver bound: it exercises Ansible and
# container wiring, not runtime codec acceleration.
- name: fake_render_device | Create render group
  group:
    name: render
    system: true
  become: true
  tags:
    - media

- name: fake_render_device | Create fake renderD128 char device
  command: systemd-tmpfiles --create -
  args:
    stdin: |
      d /dev/dri 0755 root root -
      c /dev/dri/renderD128 0660 root render - 226:128
    creates: /dev/dri/renderD128
  become: true
  tags:
    - media
