# QEMU has no GPU, so create the render-group/device shape consumed by Plex and
# Jellyfin. The phantom device has no driver bound: it exercises Ansible and
# container wiring, not runtime codec acceleration.
- name: fake_render_device | Create render group
  group:
    name: render
    system: true
  become: true
  tags:
    - media

- name: fake_render_device | Ensure /dev/dri exists
  file:
    path: /dev/dri
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true
  tags:
    - media

- name: fake_render_device | Create fake renderD128 char device
  command: mknod -m 0660 /dev/dri/renderD128 c 226 128
  args:
    creates: /dev/dri/renderD128
  register: media_fake_render_device_mknod
  become: true
  tags:
    - media

# mknod sets the mode atomically but cannot set the group. Check mode only
# predicts creation, so do not chgrp a device that is not actually present.
- name: fake_render_device | Set device group
  when: not (ansible_check_mode and media_fake_render_device_mknod.changed)
  file:
    path: /dev/dri/renderD128
    owner: root
    group: render
  become: true
  tags:
    - media
