- name: Set up media runtime
  import_tasks: runtime.yml

# Full-site QEMU tests do not invoke service _setup hooks, so the shared media
# layer owns the phantom render device used by both media servers.
- name: Create the QEMU render-device fixture
  when:
    - qemu_test
    - has_transcoding_acceleration
  import_tasks: fake_render_device.yml
  tags:
    - media

- name: Add user to media group
  user:
    name: "{{ ansible_user_id }}"
    groups: media
    append: true
  become: true
  when: not (ansible_check_mode and media_group.changed)
  tags:
    - media

- name: Configure media dataset
  import_role:
    name: zfs_dataset
    tasks_from: dataset
  when: not (ansible_check_mode and media_group.changed)
  vars:
    zfs_dataset_args:
      dataset: tank/media
      mountpoint: /mnt/media
      group: media
      mode: '0775'
      extra_properties: "{{ media_dataset_properties }}"
  tags:
    - media

- name: Create storage directories
  file:
    dest: "{{ item }}"
    state: directory
    owner: "{{ ansible_user_id }}"
    group: media
    mode: "0775"
  become: true
  when: not (ansible_check_mode and media_group.changed)
  tags:
    - media
  loop: "{{ media_library_dirs }}"
