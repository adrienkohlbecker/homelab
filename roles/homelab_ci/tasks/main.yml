- name: Create homelab_ci group
  group:
    name: homelab_ci
    gid: "{{ static_group_ids.homelab_ci }}"
    state: present
    system: true
  become: true
  register: homelab_ci_group
  tags:
    - homelab_ci

- name: Add operator to homelab_ci group
  when: not (ansible_check_mode and homelab_ci_group.changed)
  user:
    name: "{{ ansible_user_id }}"
    groups:
      - homelab_ci
    append: true
  become: true
  tags:
    - homelab_ci

- name: Install CI host packages
  apt:
    name:
      - acl
      - xorriso
    state: present
  register: homelab_ci_packages
  become: true
  tags:
    - homelab_ci

# The operator and CI runner replace each other's QEMU artifacts. Setgid and the
# default ACL share new trees; publish.py repairs explicitly narrowed modes.
- name: Create /mnt/scratch/homelab_ci packer artifacts dir
  file:
    path: /mnt/scratch/homelab_ci
    state: directory
    owner: root
    group: homelab_ci
    # Published artifacts are whole converged root filesystems, so keep them private.
    mode: "02770"
  become: true
  register: homelab_ci_dir
  tags:
    - homelab_ci

- name: Set default ACL on homelab_ci
  ansible.posix.acl:
    path: /mnt/scratch/homelab_ci
    entity: "{{ item.entity }}"
    etype: "{{ item.etype }}"
    permissions: "{{ item.permissions }}"
    default: true
    state: present
  become: true
  # In check mode the directory or setfacl may only be predicted present, so
  # defer the ACL operation until both prerequisites truly exist.
  when: >-
    not (ansible_check_mode and
    (homelab_ci_dir.changed or homelab_ci_packages.changed))
  loop:
    # Owning-group rwx supports cross-publisher replacement. Pin other to no
    # access to repair stale or drifted default ACLs.
    - entity: ""
      etype: group
      permissions: rwx
    - entity: ""
      etype: other
      permissions: "---"
  tags:
    - homelab_ci
