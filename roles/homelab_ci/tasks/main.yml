- name: Create homelab_ci group
  group:
    name: homelab_ci
    gid: "{{ static_group_ids.homelab_ci }}"
    system: true
  become: true
  register: homelab_ci_group
  tags:
    - homelab_ci

# kvm lets the operator's own harness and Packer runs use /dev/kvm; the CI
# runner account gets the same groups from gitlab_runner.
- name: Add operator to CI groups
  when: not (ansible_check_mode and homelab_ci_group.changed)
  user:
    name: "{{ ansible_user_id }}"
    groups:
      - homelab_ci
      - kvm
    append: true
  become: true
  tags:
    - homelab_ci

# The harness and Packer boot native-architecture guests with the UEFI pair
# that data/architectures.yml names. Packer's network wrapper prefers passt,
# image bundles are zstd tarballs, and the Hetzner upload pipes through mbuffer.
- name: Install CI host packages
  apt:
    name:
      - acl
      - mbuffer
      - passt
      - qemu-utils
      - xorriso
      - zstd
      - "{{ 'qemu-system-x86' if ansible_architecture == 'x86_64' else 'qemu-system-arm' }}"
      - "{{ 'ovmf' if ansible_architecture == 'x86_64' else 'qemu-efi-aarch64' }}"
    state: present
    cache_valid_time: 3600
  register: homelab_ci_packages
  become: true
  tags:
    - homelab_ci

# The operator and CI runner replace each other's QEMU artifacts. Setgid and the
# default ACL share new trees; publish.py repairs explicitly narrowed modes.
- name: Create /mnt/scratch/homelab_ci packer artifacts dir
  file:
    path: /mnt/scratch/homelab_ci
    state: directory
    owner: root
    group: homelab_ci
    # Published artifacts are whole converged root filesystems, so keep them private.
    mode: "02770"
  become: true
  register: homelab_ci_dir
  tags:
    - homelab_ci

- name: Remove the packer passt settings from login shells
  file:
    path: /etc/profile.d/homelab_ci.sh
    state: absent
  become: true
  tags:
    - homelab_ci

- name: Set default ACL on homelab_ci
  ansible.posix.acl:
    path: /mnt/scratch/homelab_ci
    entity: ""
    etype: "{{ item.etype }}"
    permissions: "{{ item.permissions }}"
    default: true
    state: present
  become: true
  # In check mode the directory or setfacl may only be predicted present, so
  # defer the ACL operation until both prerequisites truly exist.
  when: >-
    not (ansible_check_mode and
    (homelab_ci_dir.changed or homelab_ci_packages.changed))
  loop:
    # Owning-group rwx supports cross-publisher replacement. Pin other to no
    # access to repair stale or drifted default ACLs.
    - etype: group
      permissions: rwx
    - etype: other
      permissions: "---"
  loop_control:
    label: "{{ item.etype }}"
  tags:
    - homelab_ci
