- name: Create homelab_ci group
  group:
    name: homelab_ci
    gid: "{{ static_group_ids.homelab_ci }}"
    state: present
    system: true
  become: true
  register: homelab_ci_group
  tags:
    - homelab_ci

- name: Add operator to homelab_ci group
  when: not (ansible_check_mode and homelab_ci_group.changed)
  user:
    name: "{{ ansible_user_id }}"
    groups:
      - homelab_ci
    append: true
  become: true
  tags:
    - homelab_ci

- name: Install CI host packages
  apt:
    name:
      - acl
      - xorriso
    state: present
  register: homelab_ci_packages
  become: true
  tags:
    - homelab_ci

# Both the operator (ak) running packer:build locally and the CI runner
# (gitlab_runner) publish qemu test-fixture artifacts here, so a tree one
# identity built must be fully manageable by the other. The setgid group and
# default ACL propagate the shared identity into new trees. A creator-supplied
# mode can still narrow the ACL mask, so publish.py grants group rwx on every
# staged directory before installation. The x is load-bearing: publish.py needs
# to traverse and remove the previous tree.
- name: Create /mnt/scratch/homelab_ci packer artifacts dir
  file:
    path: /mnt/scratch/homelab_ci
    state: directory
    group: homelab_ci
    # No world bits: published trees are whole converged root filesystems, and
    # every consumer (operator, gitlab_runner, the qemu cells) is a group member.
    mode: "02770"
  become: true
  register: homelab_ci_dir
  tags:
    - homelab_ci

- name: Set default ACL on homelab_ci
  ansible.posix.acl:
    path: /mnt/scratch/homelab_ci
    entity: "{{ item.entity }}"
    etype: "{{ item.etype }}"
    permissions: "{{ item.permissions }}"
    default: true
    state: present
  become: true
  # In check mode the directory or setfacl may only be predicted present, so
  # defer the ACL operation until both prerequisites truly exist.
  when: >-
    not (ansible_check_mode and
    (homelab_ci_dir.changed or homelab_ci_packages.changed))
  loop:
    # Owning group keeps rwx so either publisher can traverse and rmtree the
    # other's tree. The other class is emptied explicitly: setfacl would
    # otherwise back-fill it from the directory mode and leak read access to
    # every local account on the host.
    - entity: ""
      etype: group
      permissions: rwx
    - entity: ""
      etype: other
      permissions: "---"
  tags:
    - homelab_ci
