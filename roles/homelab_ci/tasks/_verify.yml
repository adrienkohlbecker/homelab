- name: _verify | Group homelab_ci exists
  command:
    argv:
      - getent
      - group
      - homelab_ci
  changed_when: false
  become: true

- name: _verify | CI artifacts dir exists with homelab_ci group and setgid
  stat:
    path: /mnt/scratch/homelab_ci
  register: homelab_ci_verify_dir
  become: true
  # stat no longer emits the sgid boolean -- assert the setgid + 775 perms via
  # the mode string the role declares (02775 -> stat reports '2775').
  failed_when: >-
    not homelab_ci_verify_dir.stat.exists
    or not homelab_ci_verify_dir.stat.isdir
    or homelab_ci_verify_dir.stat.gr_name != 'homelab_ci'
    or homelab_ci_verify_dir.stat.mode != '2775'

- name: _verify | CI artifacts dir defaults to owning-group rwx
  command:
    argv:
      - getfacl
      - --omit-header
      - /mnt/scratch/homelab_ci
  register: homelab_ci_verify_acl
  changed_when: false
  # rwx, not rw: the x is what lets a group member traverse and rmtree another
  # member's published tree during publish.py's atomic swap.
  failed_when: "'default:group::rwx' not in homelab_ci_verify_acl.stdout"
  become: true

- name: _verify | Create a second CI publisher
  user:
    name: homelab_ci_verify
    groups:
      - homelab_ci
    append: true
    create_home: false
    shell: /usr/sbin/nologin
    state: present
    system: true
  become: true

# runuser starts fresh processes with supplementary groups from the account
# database. Use two identities so this exercises the cross-publisher contract,
# not merely one owner creating and removing its own file.
- name: _verify | Cross-publisher artifact access works
  block:
    - name: _verify | Operator creates a group-managed artifact directory
      command:
        argv:
          - runuser
          - -u
          - "{{ ansible_user_id }}"
          - --
          - install
          - -d
          - -m
          - "0770"
          - /mnt/scratch/homelab_ci/.cross_publisher_probe
      changed_when: true
      become: true

    - name: _verify | Operator creates a group-managed artifact
      command:
        argv:
          - runuser
          - -u
          - "{{ ansible_user_id }}"
          - --
          - install
          - -m
          - "0660"
          - /dev/null
          - /mnt/scratch/homelab_ci/.cross_publisher_probe/artifact
      changed_when: true
      become: true

    - name: _verify | Second publisher can read the operator artifact
      command:
        argv:
          - runuser
          - -u
          - homelab_ci_verify
          - --
          - test
          - -r
          - /mnt/scratch/homelab_ci/.cross_publisher_probe/artifact
      changed_when: false
      become: true

    - name: _verify | Second publisher can remove the operator artifact
      command:
        argv:
          - runuser
          - -u
          - homelab_ci_verify
          - --
          - rm
          - /mnt/scratch/homelab_ci/.cross_publisher_probe/artifact
      changed_when: true
      become: true

    - name: _verify | Second publisher can remove the operator directory
      command:
        argv:
          - runuser
          - -u
          - homelab_ci_verify
          - --
          - rmdir
          - /mnt/scratch/homelab_ci/.cross_publisher_probe
      changed_when: true
      become: true
  always:
    - name: _verify | Remove the cross-publisher probe
      file:
        path: /mnt/scratch/homelab_ci/.cross_publisher_probe
        state: absent
      become: true

    - name: _verify | Remove the second CI publisher
      user:
        name: homelab_ci_verify
        state: absent
        remove: false
      become: true
