# Creating without an explicit mode makes the default ACL, rather than chmod,
# responsible for granting the second publisher access despite umask 077.
- name: _verify | Cross-publisher artifact access works
  shell: |
    set -euo pipefail
    probe=/mnt/scratch/homelab_ci/.cross_publisher_probe
    trap "rm -rf ${probe}" EXIT

    runuser -u {{ ansible_user_id }} -- sh -c "umask 077; mkdir ${probe} && touch ${probe}/artifact"
    ! runuser -u nobody -- test -r "${probe}/artifact"
    runuser -u nobody -G homelab_ci -- test -r "${probe}/artifact"
    runuser -u nobody -G homelab_ci -- rm -r "${probe}"
  args:
    executable: /bin/bash
  become: true
  changed_when: true
