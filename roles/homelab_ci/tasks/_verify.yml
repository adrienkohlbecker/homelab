- name: _verify | Create a second CI publisher
  user:
    name: homelab_ci_verify
    groups:
      - homelab_ci
    append: true
    create_home: false
    shell: /usr/sbin/nologin
    state: present
    system: true
  become: true

# runuser starts fresh processes with supplementary groups from the account
# database, so three identities exercise the real contract: two publishers must
# be able to manage each other's trees, and a non-member must not see them.
#
# The probe creates under umask 077 and never passes an explicit mode. That is
# what puts the default ACL under test: with it, the kernel ignores the umask
# and the new objects inherit group rwx; without it the umask applies, the
# group gets nothing, and the second publisher's steps below fail. Passing
# `install -m 0770` here would set the group bits directly and pass either way.
- name: _verify | Cross-publisher artifact access works
  become: true
  block:
    - name: _verify | Operator creates a group-managed artifact tree
      command:
        argv:
          - runuser
          - -u
          - "{{ ansible_user_id }}"
          - --
          - sh
          - -c
          - >-
            umask 077;
            mkdir /mnt/scratch/homelab_ci/.cross_publisher_probe &&
            touch /mnt/scratch/homelab_ci/.cross_publisher_probe/artifact
      changed_when: true

    - name: _verify | Non-member cannot reach the operator artifact
      command:
        argv:
          - runuser
          - -u
          - nobody
          - --
          - test
          - -r
          - /mnt/scratch/homelab_ci/.cross_publisher_probe/artifact
      register: homelab_ci_verify_outsider
      changed_when: false
      failed_when: homelab_ci_verify_outsider.rc == 0

    - name: _verify | Second publisher can read the operator artifact
      command:
        argv:
          - runuser
          - -u
          - homelab_ci_verify
          - --
          - test
          - -r
          - /mnt/scratch/homelab_ci/.cross_publisher_probe/artifact
      changed_when: false

    - name: _verify | Second publisher can remove the operator artifact tree
      command:
        argv:
          - runuser
          - -u
          - homelab_ci_verify
          - --
          - rm
          - -r
          - /mnt/scratch/homelab_ci/.cross_publisher_probe
      changed_when: true
  always:
    - name: _verify | Remove the cross-publisher probe
      file:
        path: /mnt/scratch/homelab_ci/.cross_publisher_probe
        state: absent

    - name: _verify | Remove the second CI publisher
      user:
        name: homelab_ci_verify
        state: absent
        remove: false
