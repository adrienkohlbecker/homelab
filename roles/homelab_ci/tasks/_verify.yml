# Creating without an explicit mode makes the default ACL, rather than chmod,
# responsible for granting the second publisher access despite umask 077.
- name: _verify | Cross-publisher artifact access works
  shell: |
    set -euo pipefail
    probe=/mnt/scratch/homelab_ci/.cross_publisher_probe
    trap "rm -rf ${probe}" EXIT

    runuser -u {{ ansible_user_id }} -- sh -c "umask 077; mkdir ${probe} && touch ${probe}/artifact"
    ! runuser -u nobody -- test -r "${probe}/artifact"
    runuser -u nobody -G homelab_ci -- test -r "${probe}/artifact"
    runuser -u nobody -G homelab_ci -- rm -r "${probe}"
  args:
    executable: /bin/bash
  become: true
  changed_when: true

# Packer builds read these from the environment of whichever login shell
# launched them: an operator session or the GitLab shell executor (bash -l).
- name: _verify | Login shells hand packer the passt isolation settings
  command: runuser -l {{ ansible_user_id }} -c 'printenv QEMU_NET_WRAPPER_ISOLATE_HOST QEMU_NET_WRAPPER_DNS'
  become: true
  register: homelab_ci_login_env
  changed_when: false

- name: _verify | Assert packer gets host isolation and the lab resolver
  assert:
    that:
      - homelab_ci_login_env.stdout_lines == ['1', external_ips.dns]

# The harness and Packer load this machine type and UEFI pair.
- name: _verify | Read the native architecture facts
  set_fact:
    homelab_ci_guest: "{{ (lookup('file', playbook_dir ~ '/data/architectures.yml') | from_yaml)[ansible_architecture].guest }}"
    homelab_ci_qemu: qemu-system-{{ ansible_architecture }}

- name: _verify | Create a CI toolchain fixture
  tempfile:
    state: directory
    suffix: homelab_ci
  register: homelab_ci_fixture
  become: true

- name: _verify | Exercise the CI host toolchain
  block:
    - name: _verify | Copy the writable UEFI vars store
      copy:
        src: "{{ homelab_ci_guest.uefi_firmware.linux.vars }}"
        dest: "{{ homelab_ci_fixture.path }}/vars.fd"
        remote_src: true
        mode: "0600"
      become: true

    # -S holds the guest before its first instruction; QMP then quits, so a
    # zero exit proves QEMU accepted the machine and both pflash images.
    - name: _verify | Start QEMU paused and quit
      command:
        argv:
          - "{{ homelab_ci_qemu }}"
          - -machine
          - "{{ homelab_ci_guest.machine_type }}"
          - -cpu
          - max
          - -nodefaults
          - -display
          - none
          - -drive
          - if=pflash,format=raw,readonly=on,file={{ homelab_ci_guest.uefi_firmware.linux.code }}
          - -drive
          - if=pflash,format=raw,file={{ homelab_ci_fixture.path }}/vars.fd
          - -S
          - -qmp
          - stdio
        stdin: |
          {"execute": "qmp_capabilities"}
          {"execute": "quit"}
      changed_when: false
      become: true

    # passt needs a qemu with the stream netdev. aarch64 QEMU has no default
    # machine, so the listing needs one there.
    - name: _verify | Check passt can back QEMU
      shell: |
        set -euo pipefail
        passt --version >/dev/null
        {{ homelab_ci_qemu }} -machine {{ homelab_ci_guest.machine_type }} -netdev help | grep -qw stream
      args:
        executable: /bin/bash
      changed_when: false

    # Image bundles are sparse zstd tarballs (mise-tasks/ci/qemu_image_store.py).
    - name: _verify | Round-trip a sparse zstd tarball
      shell: |
        set -euo pipefail
        cd {{ homelab_ci_fixture.path }}
        truncate -s 64M disk.raw
        printf payload | dd of=disk.raw bs=1M seek=32 conv=notrunc status=none
        tar --zstd --sparse -cf bundle.tar.zst disk.raw
        mkdir out
        tar --zstd -xf bundle.tar.zst -C out
        cmp disk.raw out/disk.raw
      args:
        executable: /bin/bash
      changed_when: false
      become: true

  always:
    - name: _verify | Remove the CI toolchain fixture
      file:
        path: "{{ homelab_ci_fixture.path }}"
        state: absent
      become: true

# runuser initializes supplementary groups from /etc/group, as a new login
# does. Hosts without a KVM device have nothing to open.
- name: _verify | Operator can open the KVM device
  shell: |
    set -euo pipefail
    [ ! -e /dev/kvm ] || runuser -u {{ ansible_user_id }} -- test -r /dev/kvm -a -w /dev/kvm
  args:
    executable: /bin/bash
  changed_when: false
  become: true
