- name: _verify | All sqlite_dataset scenarios
  block:
    - name: _verify | Create fixture directories
      file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      become: true
      loop:
        - /mnt/services/sqlite
        - /mnt/services/sqlite_dataset_test
        - /mnt/services/sqlite_dataset_test/sub

    # -- Scenario 1: default symlink mode --------------------------------
    - name: _verify | Scenario 1 — pre-created targets and symlinks
      import_role:
        name: sqlite_dataset
        tasks_from: dataset
      vars:
        sqlite_dataset_args:
          name: sqlite_dataset_test
          owner: root
          group: root
          links:
            - /mnt/services/sqlite_dataset_test/test.db
            - /mnt/services/sqlite_dataset_test/sub/other.db

    - name: _verify | Scenario 1 — stat symlinks at dest
      stat:
        path: "{{ item }}"
        follow: false
      loop:
        - /mnt/services/sqlite_dataset_test/test.db
        - /mnt/services/sqlite_dataset_test/sub/other.db
      register: _sqlite_dataset_symlinks
      become: true
      failed_when: >-
        not _sqlite_dataset_symlinks.stat.exists
        or not _sqlite_dataset_symlinks.stat.islnk
        or _sqlite_dataset_symlinks.stat.lnk_target != '/mnt/services/sqlite/sqlite_dataset_test/' ~ (item | basename)

    # -- Scenario 2: populated DBs survive an identical re-apply ----------
    # Write through the app-facing symlink, then prove an identical converge
    # preserves the bytes, source mtime, and indirection.
    - name: _verify | Scenario 2 — write through the dest symlink
      copy:
        content: "WRITE-THROUGH"
        dest: /mnt/services/sqlite_dataset_test/test.db
        owner: root
        group: root
        mode: "0640"
        follow: true
      become: true

    - name: _verify | Scenario 2 — capture src mtime before re-run
      stat:
        path: /mnt/services/sqlite/sqlite_dataset_test/test.db
      register: _sqlite_dataset_before
      become: true

    - name: _verify | Scenario 2 — re-apply identical args
      import_role:
        name: sqlite_dataset
        tasks_from: dataset
      vars:
        sqlite_dataset_args:
          name: sqlite_dataset_test
          owner: root
          group: root
          links:
            - /mnt/services/sqlite_dataset_test/test.db
            - /mnt/services/sqlite_dataset_test/sub/other.db

    - name: _verify | Scenario 2 — re-stat src mtime after re-run
      stat:
        path: /mnt/services/sqlite/sqlite_dataset_test/test.db
      register: _sqlite_dataset_after
      become: true

    - name: _verify | Scenario 2 — re-stat the dest symlink
      stat:
        path: /mnt/services/sqlite_dataset_test/test.db
        follow: false
      register: _sqlite_dataset_through_link
      become: true
      failed_when: not _sqlite_dataset_through_link.stat.islnk

    - name: _verify | Scenario 2 — read back from the sqlite-dataset src
      slurp:
        src: /mnt/services/sqlite/sqlite_dataset_test/test.db
      register: _sqlite_dataset_through
      become: true
      failed_when: _sqlite_dataset_through.content | b64decode != 'WRITE-THROUGH'

    - name: _verify | Scenario 2 — src mtime survived the re-apply
      assert:
        that:
          - _sqlite_dataset_before.stat.mtime == _sqlite_dataset_after.stat.mtime
        fail_msg: test.db changed across an identical re-apply.

    # -- Scenario 3: no-force state=link refuses to clobber a real DB -----
    # The load-bearing safety: a real file already at a dest is never
    # converted to a symlink (snapshot-restore / downgrade protection). The
    # helper creates the src first, so the only reason to fail is the real
    # dest, not a dangling target.
    - name: _verify | Scenario 3 — plant a real DB at the dest
      copy:
        content: "REAL-DB"
        dest: /mnt/services/sqlite_dataset_test/real.db
        owner: root
        group: root
        mode: "0640"
      become: true

    - name: _verify | Scenario 3 — applying the helper must refuse the clobber
      block:
        - name: _verify | Scenario 3 — attempt symlink over the real DB
          import_role:
            name: sqlite_dataset
            tasks_from: dataset
          vars:
            sqlite_dataset_args:
              name: sqlite_dataset_test
              owner: root
              group: root
              links:
                - /mnt/services/sqlite_dataset_test/real.db

        - name: _verify | Scenario 3 — record wrongly converted
          set_fact:
            _sqlite_dataset_clobber_refused: false
      rescue:
        - name: _verify | Scenario 3 — record refused (expected)
          set_fact:
            _sqlite_dataset_clobber_refused: true

    - name: _verify | Scenario 3 — re-stat the dest
      stat:
        path: /mnt/services/sqlite_dataset_test/real.db
        follow: false
      register: _sqlite_dataset_real
      become: true
      failed_when: >-
        not _sqlite_dataset_clobber_refused
        or not _sqlite_dataset_real.stat.exists
        or _sqlite_dataset_real.stat.islnk

    - name: _verify | Scenario 3 — read the surviving dest content
      slurp:
        src: /mnt/services/sqlite_dataset_test/real.db
      register: _sqlite_dataset_real_content
      become: true
      failed_when: _sqlite_dataset_real_content.content | b64decode != 'REAL-DB'

    # -- Scenario 4: force plants a dangling symlink ---------------------
    - name: _verify | Scenario 4 — force on a cold (dangling) target
      import_role:
        name: sqlite_dataset
        tasks_from: dataset
      vars:
        sqlite_dataset_args:
          name: sqlite_dataset_test
          owner: root
          group: root
          force: true
          links:
            - /mnt/services/sqlite_dataset_test/forced.db

    - name: _verify | Scenario 4 — stat the dest symlink
      stat:
        path: /mnt/services/sqlite_dataset_test/forced.db
        follow: false
      register: _sqlite_dataset_forced
      become: true
      failed_when: >-
        not _sqlite_dataset_forced.stat.exists
        or not _sqlite_dataset_forced.stat.islnk
        or _sqlite_dataset_forced.stat.lnk_target != '/mnt/services/sqlite/sqlite_dataset_test/forced.db'

    - name: _verify | Scenario 4 — stat the (absent) target
      stat:
        path: /mnt/services/sqlite/sqlite_dataset_test/forced.db
      register: _sqlite_dataset_forced_target
      become: true
      failed_when: _sqlite_dataset_forced_target.stat.exists

    # -- Scenario 5: runtime condition false skips filesystem changes -----
    - name: _verify | Scenario 5 — resolve a false runtime condition
      set_fact:
        _sqlite_dataset_condition: false

    - name: _verify | Scenario 5 — apply helper with the runtime condition
      import_role:
        name: sqlite_dataset
        tasks_from: dataset
      vars:
        sqlite_dataset_args:
          name: sqlite_dataset_skip
          owner: root
          group: root
          condition: "{{ _sqlite_dataset_condition }}"
          links:
            - /mnt/services/sqlite_dataset_test/skip.db

    - name: _verify | Scenario 5 — stat paths skipped by the condition
      stat:
        path: "{{ item }}"
        follow: false
      loop:
        - /mnt/services/sqlite/sqlite_dataset_skip
        - /mnt/services/sqlite_dataset_test/skip.db
      register: _sqlite_dataset_skipped
      become: true
      failed_when: _sqlite_dataset_skipped.stat.exists

    # -- Scenario 6: force still refuses to clobber a real DB at a dest --
    # force relaxes only the dangling-target refusal; a real file at the dest
    # must still be protected (snapshot-restore safety).
    - name: _verify | Scenario 6 — plant a real DB at a force dest
      copy:
        content: "FORCE-REAL"
        dest: /mnt/services/sqlite_dataset_test/force_real.db
        owner: root
        group: root
        mode: "0640"
      become: true

    - name: _verify | Scenario 6 — force must still refuse the real-file clobber
      block:
        - name: _verify | Scenario 6 — attempt force symlink over the real DB
          import_role:
            name: sqlite_dataset
            tasks_from: dataset
          vars:
            sqlite_dataset_args:
              name: sqlite_dataset_test
              owner: root
              group: root
              force: true
              links:
                - /mnt/services/sqlite_dataset_test/force_real.db

        - name: _verify | Scenario 6 — record wrongly clobbered
          set_fact:
            _sqlite_dataset_force_refused: false
      rescue:
        - name: _verify | Scenario 6 — record refused (expected)
          set_fact:
            _sqlite_dataset_force_refused: true

    - name: _verify | Scenario 6 — re-stat the dest
      stat:
        path: /mnt/services/sqlite_dataset_test/force_real.db
        follow: false
      register: _sqlite_dataset_force_real
      become: true
      failed_when: >-
        not _sqlite_dataset_force_refused
        or not _sqlite_dataset_force_real.stat.exists
        or _sqlite_dataset_force_real.stat.islnk

    - name: _verify | Scenario 6 — read the surviving dest content
      slurp:
        src: /mnt/services/sqlite_dataset_test/force_real.db
      register: _sqlite_dataset_force_real_content
      become: true
      failed_when: _sqlite_dataset_force_real_content.content | b64decode != 'FORCE-REAL'

  always:
    - name: _verify | Teardown — remove test fixtures
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /mnt/services/sqlite/sqlite_dataset_test
        - /mnt/services/sqlite/sqlite_dataset_skip
        - /mnt/services/sqlite_dataset_test
      become: true
