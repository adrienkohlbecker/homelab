# Create /mnt/services/sqlite/<name>/ and symlink DBs onto it.
#
# Caller passes one dict `sqlite_dataset_args`:
#   user           required service_user result; owns the directory and targets
#   databases      required paths relative to /mnt/services/<name>; parent dirs
#                  must already exist
#   create_target  optional bool, default true; create empty 0640 target files
#
# The helper always refuses to replace a real file at a destination. The dict
# form keeps arguments from leaking between import_role calls.

- name: "Validate inputs for {{ sqlite_dataset_args.user.name | default('<unset>') }}"
  assert:
    quiet: true
    that:
      - sqlite_dataset_args.user is defined
      - sqlite_dataset_args.user.name is defined
      # is string before is match: a non-string name raises an opaque
      # templating error instead of this role's fail_msg (same guard as
      # roles/service_user).
      - sqlite_dataset_args.user.name is string
      - sqlite_dataset_args.user.name is match('^[a-z_][a-z0-9_-]*$')
      - sqlite_dataset_args.user.config_group is defined
      - sqlite_dataset_args.databases is defined
      - sqlite_dataset_args.databases | default([]) | length > 0
      - sqlite_dataset_args.create_target is not defined or sqlite_dataset_args.create_target is boolean
      - >-
        sqlite_dataset_args.databases | default([])
        | select('match', '^[A-Za-z0-9_-][A-Za-z0-9_.-]*(/[A-Za-z0-9_-][A-Za-z0-9_.-]*)*$')
        | list | length == sqlite_dataset_args.databases | default([]) | length
      # case_sensitive: basenames become files on a case-sensitive fs, so
      # Foo.db and foo.db are distinct; the default case-insensitive unique
      # would wrongly reject them as a collision.
      - >-
        sqlite_dataset_args.databases | default([]) | map('basename') | list | unique(case_sensitive=true) | length
        == sqlite_dataset_args.databases | default([]) | length
    fail_msg: >-
      sqlite_dataset_args requires a service_user result and at least one safe
      service-relative database path; the user name must match
      [a-z_][a-z0-9_-]* and database basenames must be unique.

- name: Pre-create /mnt/services/sqlite/{{ sqlite_dataset_args.user.name }}
  when: not ansible_check_mode or sqlite_dataset_args.user.uid is defined
  file:
    path: "/mnt/services/sqlite/{{ sqlite_dataset_args.user.name }}"
    state: directory
    owner: "{{ sqlite_dataset_args.user.name }}"
    group: "{{ sqlite_dataset_args.user.config_group }}"
    mode: "0750"
  become: true

# Check every destination before creating any target, so one unsafe database
# cannot leave another database half-migrated.
- name: >-
    Refuse real files at database destinations; before re-running, move them
    under {{ '/mnt/services/sqlite/' ~ sqlite_dataset_args.user.name ~ '/' }}
  stat:
    path: "/mnt/services/{{ sqlite_dataset_args.user.name }}/{{ sqlite_dataset_database }}"
    follow: false
  become: true
  register: sqlite_dataset_destination
  failed_when:
    - sqlite_dataset_destination.stat.exists
    - not sqlite_dataset_destination.stat.islnk
  loop: "{{ sqlite_dataset_args.databases }}"
  loop_control:
    label: "{{ sqlite_dataset_database }}"
    loop_var: sqlite_dataset_database

# state=touch with preserve timestamps is idempotent: creates the file if
# absent, leaves an existing DB untouched (no truncation, no mtime bump).
- name: Pre-create SQLite DB src files for {{ sqlite_dataset_args.user.name }}
  when:
    - not ansible_check_mode or sqlite_dataset_args.user.uid is defined
    - sqlite_dataset_args.create_target | default(true) | bool
  file:
    path: "/mnt/services/sqlite/{{ sqlite_dataset_args.user.name }}/{{ sqlite_dataset_database | basename }}"
    state: touch
    owner: "{{ sqlite_dataset_args.user.name }}"
    group: "{{ sqlite_dataset_args.user.config_group }}"
    mode: "0640"
    modification_time: preserve
    access_time: preserve
  become: true
  loop: "{{ sqlite_dataset_args.databases }}"
  loop_control:
    label: "{{ sqlite_dataset_database }}"
    loop_var: sqlite_dataset_database

- name: Symlink DBs onto sqlite dataset for {{ sqlite_dataset_args.user.name }}
  when: not ansible_check_mode or sqlite_dataset_args.user.uid is defined
  file:
    src: "/mnt/services/sqlite/{{ sqlite_dataset_args.user.name }}/{{ sqlite_dataset_database | basename }}"
    dest: "/mnt/services/{{ sqlite_dataset_args.user.name }}/{{ sqlite_dataset_database }}"
    state: link
    follow: false
    force: true
  become: true
  loop: "{{ sqlite_dataset_args.databases }}"
  loop_control:
    label: "{{ sqlite_dataset_database }}"
    loop_var: sqlite_dataset_database
