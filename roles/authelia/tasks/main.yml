- name: Set up authelia system user, group, and config dir
  import_role:
    name: service_user
    tasks_from: user
  vars:
    service_user_args:
      name: authelia
  tags:
    - authelia

- name: Configure authelia files
  when: not ansible_check_mode or authelia_user.uid is defined
  template:
    src: "{{ item }}.j2"
    dest: "/mnt/services/authelia/{{ item }}"
    owner: authelia
    group: authelia
    mode: "0640"
    backup: true
    # Best-effort YAML parse. Catches jinja quoting bugs + vault
    # substitution typos before the file lands; Authelia itself
    # validates on startup but writes a default-config fallback to
    # disk if it can't parse the user file, which silently masks the
    # bug.
    validate: python3 -c 'import yaml,sys; yaml.safe_load(open(sys.argv[1]))' "%s"
  loop:
    - configuration.yml
    - users.yml
  register: authelia_files
  become: true
  tags:
    - authelia

- name: Install authelia fluent-bit extension
  import_role:
    name: fluentbit
    tasks_from: extension
  vars:
    fluentbit_extension_args:
      name: authelia
  tags:
    - authelia

- name: Pull authelia image
  import_role:
    name: podman
    tasks_from: image
  vars:
    podman_image_args:
      name: authelia
      image: "{{ authelia_image }}"
  tags:
    - authelia

- name: Create authelia secrets
  when: not ansible_check_mode or authelia_podman_available
  containers.podman.podman_secret:
    name: "{{ item.name }}"
    data: "{{ item.data }}"
  loop:
    - name: authelia_storage_encryption_key
      data: "{{ authelia_storage_encryption_key }}"
    - name: authelia_smtp_password
      data: "{{ authelia_smtp_password }}"
    - name: authelia_oidc_hmac_secret
      data: "{{ authelia_oidc_hmac_secret }}"
  loop_control:
    label: "{{ item.name }}"
  register: _authelia_secrets
  become: true
  tags:
    - authelia

# The OIDC issuer RSA private key is inlined into configuration.yml
# rather than mounted as a podman secret: Authelia v4.39 only
# accepts the PEM via the YAML `jwks[].key` field, not via a path
# or *_FILE env override. Rotation rides on authelia_files.changed.

- name: Create authelia podman network
  when: not ansible_check_mode
  containers.podman.podman_network:
    name: authelia
    disable_dns: false
    state: present
  register: authelia_network
  become: true
  tags:
    - authelia

- name: Manage authelia service
  import_role:
    name: systemd_unit
    tasks_from: unit
  vars:
    systemd_unit_args:
      src: authelia.service.j2
      condition: "{{ not ansible_check_mode or authelia_user.uid is defined }}"
      restart: >-
        {{ authelia_network.changed
           or authelia_files.changed
           or (_authelia_secrets.changed | default(false)) }}
  tags:
    - authelia

- name: Configure nginx
  import_role:
    name: nginx
    tasks_from: site
  vars:
    nginx_site_args:
      # Keep the portal at the cookie-domain apex rather than a per-host URL.
      subdomain: auth
      proxy_pass: http://127.0.0.1:{{ service_ports.authelia }}/
      # Avoid intersecting nginx's blanket CSP with Authelia's portal policy.
      csp_passthrough: true
  tags:
    - authelia
