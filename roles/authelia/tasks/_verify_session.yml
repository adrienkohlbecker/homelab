- name: _verify | Restart {{ authelia_verify_restart }}
  systemd:
    name: "{{ authelia_verify_restart }}"
    state: restarted
  become: true

# Requires= restarts Authelia along with Redis; retry until both answer again.
- name: _verify | Session cookie is still authenticated after restarting {{ authelia_verify_restart }}
  uri:
    url: https://auth.{{ authelia_cookie_domain }}/api/state
    headers:
      Cookie: authelia_session={{ authelia_verify_login.cookies.authelia_session }}
    validate_certs: false
  register: authelia_verify_state
  until: >-
    authelia_verify_state.status == 200
    and authelia_verify_state.json.data.username == 'homepage_alerts'
    and authelia_verify_state.json.data.authentication_level == 1
  retries: 15
  delay: 2
