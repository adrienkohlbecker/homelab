parsers:
  - name: authelia_json
    format: json

pipeline:
  filters:
    - name: modify
      match: svc.authelia.service
      rename: MESSAGE log
    - name: parser
      match: svc.authelia.service
      key_name: log
      parser: authelia_json
      reserve_data: true
      preserve_key: true
    - name: modify
      match: svc.authelia.service
      condition:
        - key_exists CONTAINER_TAG
        - key_exists msg
        - key_exists level
      hard_rename:
        - msg log
        - level _level
      remove: time
      add: parser_status parsed
