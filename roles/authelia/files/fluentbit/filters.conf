# The systemd input tags every record from the unit identically. The parser
# filter cannot condition on a record field, so normalize.lua uses
# CONTAINER_TAG presence to distinguish Authelia stdout from podman command and
# systemd lifecycle records. Preserve_Key retains malformed JSON for diagnosis.
[FILTER]
    Name          parser
    Match         svc.authelia.service
    Key_Name      log
    Parser        authelia_json
    Reserve_Data  On
    Preserve_Key  On

[FILTER]
    Name    lua
    Match   svc.authelia.service
    script  /etc/fluent-bit/authelia_normalize.lua
    call    normalize_authelia
