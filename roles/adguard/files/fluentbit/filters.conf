# Parse only container output. The Lua normalizer uses CONTAINER_TAG to leave
# podman commands and systemd lifecycle records from the same unit unchanged.
[FILTER]
    Name          parser
    Match         svc.adguard.service
    Key_Name      log
    Parser        adguard_text
    Reserve_Data  On
    Preserve_Key  On

[FILTER]
    Name    lua
    Match   svc.adguard.service
    script  /etc/fluent-bit/adguard_normalize.lua
    call    normalize_adguard
