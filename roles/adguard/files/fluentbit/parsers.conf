# AdGuard Home emits a stable text envelope followed by a prose message and
# optional logfmt attributes. Journald remains the event-time authority: the
# application stamp is local wall time without an offset and is redundant.
[PARSER]
    Name    adguard_text
    Format  regex
    Regex   /^(?<adguard_timestamp>[0-9]{4}\/[0-9]{2}\/[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{6}) \[(?<adguard_level>[a-z]+)\] (?<adguard_body>.*)$/m
