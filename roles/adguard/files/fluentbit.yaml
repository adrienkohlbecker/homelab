parsers:
  - name: adguard_text
    format: regex
    regex: '/^(?<adguard_timestamp>[0-9]{4}\/[0-9]{2}\/[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{6}) \[(?<adguard_level>[a-z]+)\] (?<adguard_body>.*)$/m'

pipeline:
  filters:
    - name: modify
      match: svc.adguard.service
      rename: MESSAGE log
    - name: parser
      match: svc.adguard.service
      key_name: log
      parser: adguard_text
      reserve_data: true
      preserve_key: true
    - name: lua
      match: svc.adguard.service
      script: /etc/fluent-bit/adguard_normalize.lua
      call: normalize_adguard
