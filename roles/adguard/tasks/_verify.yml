- name: _verify | Container reports healthy
  command: /usr/bin/podman healthcheck run adguard
  register: adguard_verify_health
  changed_when: false
  retries: 30
  delay: 2
  until: adguard_verify_health.rc == 0
  become: true

- name: _verify | Exercise alternate service storage layouts
  include_tasks: "{{ ansible_config_file | dirname }}/test/playbooks/tasks/_verify_service_storage.yml"
  vars:
    _storage_service: adguard
    _storage_mounts:
      - services

- name: _verify | Read adguard podman network
  containers.podman.podman_network_info:
    name: adguard
  register: adguard_verify_network
  become: true

- name: _verify | Bridge gateway uses the persistent client
  uri:
    url: >-
      {{
        'http://127.0.0.1:' ~ service_ports.adguard
        ~ '/control/clients/find?ip0='
        ~ adguard_verify_network.networks[0].subnets[0].gateway
      }}
    status_code: 200
  register: adguard_verify_gateway_client
  failed_when: >-
    adguard_verify_gateway_client.json[0]
    [adguard_verify_network.networks[0].subnets[0].gateway].name
    != inventory_hostname ~ ' (host + containers)'

- name: _verify | Create unique adguard fluent-bit marker
  set_fact:
    adguard_lnav_marker: "verify_adguard_{{ ansible_date_time.iso8601_basic_short }}_{{ 99999 | random }}"

# Write through the container init's stderr so conmon records the fixture with
# the same journald metadata as AdGuard itself. `podman exec` stderr would be
# attached to Ansible directly and bypass the container log driver.
- name: _verify | Emit representative adguard logger record
  command:
    argv:
      - podman
      - exec
      - adguard
      - /bin/sh
      - -c
      - >-
        printf "%s\n" "2099/01/02 03:04:05.678901 [error]
        dnsproxy: {{ adguard_lnav_marker }}" > /proc/1/fd/2
  changed_when: false
  become: true

- name: _verify | Wait for normalized adguard record in lnav store
  import_role:
    name: fluentbit
    tasks_from: verify_live
  vars:
    fluentbit_verify_live_args:
      expected:
        - message: "{{ adguard_lnav_marker }}"
          service: adguard
          unit: adguard.service
          level: error
          fields.source: dnsproxy

- name: _verify | Keepalived healthcheck script reports healthy
  command: /usr/local/bin/adguard_healthcheck
  register: adguard_verify_hc_script
  changed_when: false
  retries: 30
  delay: 2
  until: adguard_verify_hc_script.rc == 0
  become: true

- name: _verify | Split-horizon override resolves
  command: /usr/bin/podman exec adguard nslookup lab.{{ domain }} 127.0.0.1
  register: adguard_verify_splithorizon
  changed_when: false
  failed_when: external_ips.lab not in adguard_verify_splithorizon.stdout
  become: true

# Recursive resolution through the DoH upstream chain -- every other dig
# here hits a local rewrite, so without this a broken upstream config
# (bad DoH URL, bootstrap failure) would pass _verify while real client
# queries fail. Upstreams ride HTTP/2 over TCP; the retries absorb the
# plain-UDP bootstrap lookup of the DoH host, which qemu SLIRP can drop,
# and one upstream_timeout before the fallback upstream answers.
- name: _verify | Upstream resolution answers through DoH
  command: dig +short +timeout=2 +tries=2 @{{ ansible_facts.default_ipv4.address }} example.com A
  register: adguard_verify_upstream
  changed_when: false
  retries: 10
  delay: 2
  until: adguard_verify_upstream.stdout_lines | length > 0

# Blocking is enforced, not just configured: doubleclick.net is an exact
# entry in the test adlist (group_vars/test.yml), so the filtering engine
# must report it filtered. The API check is robust against blocking_mode
# answer-shape changes.
- name: _verify | Filtering engine blocks a listed domain
  uri:
    url: http://127.0.0.1:{{ service_ports.adguard }}/control/filtering/check_host?name=doubleclick.net
    status_code: 200
  register: adguard_verify_blocked
  retries: 30
  delay: 2
  until: (adguard_verify_blocked.json | default({})).reason | default('') is match('Filtered')

# Real TLS handshake against the VIP publish (dig +tls skips CA
# validation without +tls-ca, so the snakeoil fixture cert passes), and
# the answer proves the dns.<domain> rewrite Private-DNS clients rely on.
# This is also the only probe on the VIP socket itself -- the others all
# target the host address.
- name: _verify | DoT on the VIP answers with the rewrite
  command: dig +short +tls +timeout=3 +tries=2 @{{ network.virtual_ips.dns }} dns.{{ domain }} A
  register: adguard_verify_dot
  changed_when: false
  retries: 30
  delay: 2
  until: network.virtual_ips.dns in adguard_verify_dot.stdout_lines

# The user_rules undelegated-suffix guard answers NXDOMAIN locally
# instead of leaking the query upstream.
- name: _verify | Undelegated suffix is answered NXDOMAIN locally
  command: dig +timeout=2 +tries=2 @{{ ansible_facts.default_ipv4.address }} printer.lan A
  register: adguard_verify_undelegated
  changed_when: false
  failed_when: "'status: NXDOMAIN' not in adguard_verify_undelegated.stdout"

# AdGuard checks HTTPS-record ipv6hints as hostnames against the filters
# (filterSVCBHint), so an over-broad rule swallows every type-65 answer
# that carries one. cloudflare-dns.com reliably publishes such a record.
- name: _verify | HTTPS-type answers survive response filtering
  command: dig +short +timeout=2 +tries=2 @{{ ansible_facts.default_ipv4.address }} cloudflare-dns.com HTTPS
  register: adguard_verify_https_rr
  changed_when: false
  retries: 30
  delay: 2
  until: adguard_verify_https_rr.stdout_lines | length > 0

- name: _verify | Verify AdGuard Authelia gate
  import_role:
    name: nginx
    tasks_from: verify_authelia_gate
  vars:
    nginx_verify_authelia_gate_args:
      subdomain: adguard

# Plain grep (not -q): it consumes all input so systemd-inhibit never
# takes a SIGPIPE under pipefail, and the matching line lands in the
# task output for debugging.
- name: _verify | Reboot guard holds the inhibitor lock
  shell:
    cmd: >-
      set -euo pipefail;
      systemd-inhibit --list --no-legend | grep adguard_reboot_guard
    executable: /bin/bash
  register: _adguard_verify_inhibitor
  changed_when: false
  retries: 6
  delay: 5
  until: _adguard_verify_inhibitor.rc == 0
  become: true

# The fixture's peers never answer, so the guard keeps its lock. Since systemd
# 257, logind refuses even root's reboot while it is held. Noble's logind
# ignores a lock held by the caller's own uid, so this control would reboot
# there; on Noble only the site.yml DNS safety gate protects reboots. The
# systemd module cannot request a logind reboot.
- name: _verify | Reboot guard refuses a root reboot
  when: ansible_distribution_release != 'noble'
  command: /usr/bin/systemctl reboot # noqa: command-instead-of-module
  register: adguard_verify_refused_reboot
  changed_when: false
  failed_when: >-
    adguard_verify_refused_reboot.rc == 0
    or 'inhibitor' not in adguard_verify_refused_reboot.stderr
  become: true

- name: _verify | Exercise adguard fluent-bit record contracts
  import_role:
    name: fluentbit
    tasks_from: verify_extension
  vars:
    fluentbit_verify_args:
      name: adguard
      records:
        - MESSAGE: >-
            2099/01/02 03:04:05.678901 [error] dnsproxy: adguard-valid
            retry=true count=3 source=attribute service=attribute
          CONTAINER_TAG: adguard
          SYSLOG_IDENTIFIER: conmon
          SYSTEMD_UNIT: adguard.service
        - MESSAGE: adguard-raw
          CONTAINER_TAG: adguard
          SYSLOG_IDENTIFIER: conmon
          SYSTEMD_UNIT: adguard.service
      expected:
        - message: adguard-valid
          level: error
          service: adguard
          fields.source: dnsproxy
          fields.retry: true
          fields.count: 3
          fields.adguard_source: attribute
          fields.adguard_service: attribute
        - message: adguard-raw
          service: adguard
