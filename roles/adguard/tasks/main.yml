- name: Assert required adguard inputs are set
  assert:
    that:
      # Each condition is boolean and safe to evaluate when the var is
      # unset (filters carry a default) -- ansible 2.20 rejects a
      # non-boolean conditional result, and `is defined` doesn't
      # short-circuit a sibling `that:` item.
      - network.virtual_ips.dns is defined
      # The service unit publishes :53 on this address; a malformed value
      # must fail here, not render a unit that silently skips the VIP.
      - (network.virtual_ips.dns | default('') | ansible.utils.ipaddr('address')) is string
      - dns_keepalived_vrid is defined
      - dns_keepalived_priority is defined
      - (dns_keepalived_priority | default(0) | int) > 0
      - (dns_keepalived_priority | default(0) | int) <= 255
      - dns_keepalived_peers is defined
      - dns_keepalived_peers | length > 0
      - inventory_hostname in external_ips
      - adguard_adlists is defined
      - adguard_whitelists is defined
      - (adguard_adlists | default([]) | select('search', '\s') | list | length) == 0
      - (adguard_whitelists | default([]) | select('search', '\s') | list | length) == 0
    fail_msg: >-
      adguard requires the DNS VIP from network.virtual_ips.dns plus
      dns_keepalived_{vrid,priority,peers} (priority 1-255, set per-host
      in host_vars), an external_ips entry for this host, and the
      adguard_adlists / adguard_whitelists lists with no whitespace in any URL.
  tags:
    - adguard

- name: Set up adguard system user, group, and config dir
  import_role:
    name: service_user
    tasks_from: user
  vars:
    service_user_args:
      name: adguard
  tags:
    - adguard

- name: Create adguard directories
  when: not ansible_check_mode or adguard_user.uid is defined
  file:
    dest: "{{ item.path }}"
    state: directory
    owner: "{{ adguard_user.uid }}"
    group: "{{ adguard_user.gid }}"
    mode: "{{ item.mode }}"
  loop:
    - path: /mnt/services/adguard/conf
      mode: "0755"
    - path: /mnt/services/adguard/conf/tls
      mode: "0700"
    - path: /mnt/services/adguard/work
      mode: "0700"
  become: true
  tags:
    - adguard

# The container user can't read the letsencrypt key in place: live/ and
# archive/ are deliberately 0750 root:ssl-cert with root-only privkeys
# (see roles/certbot -- group-readable wildcard keys are a forever-cert
# blast radius). Copy the pair into service state owned by the adguard
# user instead; renewals re-copy through the certbot deploy hook below.
- name: Copy host certificate for DoT
  when: not ansible_check_mode or adguard_user.uid is defined
  copy:
    src: /etc/letsencrypt/live/{{ inventory_hostname }}.{{ domain }}/{{ item }}
    remote_src: true
    dest: /mnt/services/adguard/conf/tls/{{ item }}
    owner: "{{ adguard_user.uid }}"
    group: "{{ adguard_user.gid }}"
    mode: "0600"
    backup: true
  loop:
    - fullchain.pem
    - privkey.pem
  register: adguard_tls_certs
  become: true
  tags:
    - adguard

# The deploy/ hook dir normally comes with the certbot package, which the
# adguard test fixture deliberately omits (snakeoil certs instead); create
# it so the hook task below works on both.
- name: Create certbot deploy hook directory
  file:
    dest: /etc/letsencrypt/renewal-hooks/deploy
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true
  tags:
    - adguard

- name: Install certbot deploy hook for DoT certs
  when: not ansible_check_mode or adguard_user.uid is defined
  template:
    src: adguard_certbot_deploy.j2
    dest: /etc/letsencrypt/renewal-hooks/deploy/adguard
    owner: root
    group: root
    mode: "0755"
    backup: true
    validate: bash -n %s
  become: true
  tags:
    - adguard

- name: Create adguard podman network
  when: not ansible_check_mode
  containers.podman.podman_network:
    name: adguard
    disable_dns: false
    state: present
  register: adguard_network
  become: true
  tags:
    - adguard

- name: Read adguard podman network
  containers.podman.podman_network_info:
    name: adguard
  register: adguard_network_info
  failed_when: adguard_network_info.failed and not ansible_check_mode
  become: true
  tags:
    - adguard

- name: Configure adguard
  when:
    - not ansible_check_mode or adguard_user.uid is defined
    - adguard_network_info.networks | default([]) | length > 0
  template:
    src: AdGuardHome.yaml.j2
    dest: /mnt/services/adguard/conf/AdGuardHome.yaml
    owner: "{{ adguard_user.uid }}"
    group: "{{ adguard_user.gid }}"
    mode: "0600"
    backup: true
    validate: >-
      /usr/bin/podman run --rm
      --volume %s:/tmp/AdGuardHome.yaml:ro
      --volume /mnt/services/adguard/conf/tls:/opt/adguardhome/conf/tls:ro
      {{ adguard_image }}
      --no-check-update
      --no-permcheck
      --check-config
      --config /tmp/AdGuardHome.yaml
      --work-dir /tmp
  register: adguard_config
  become: true
  tags:
    - adguard

- name: Install adguard fluent-bit extension
  import_role:
    name: fluentbit
    tasks_from: extension
  vars:
    fluentbit_extension_args:
      name: adguard
  tags:
    - adguard

- name: Pull adguard image
  import_role:
    name: podman
    tasks_from: image
  vars:
    podman_image_args:
      name: adguard
      image: "{{ adguard_image }}"
  tags:
    - adguard

- name: Manage adguard service
  import_role:
    name: systemd_unit
    tasks_from: unit
  vars:
    systemd_unit_args:
      src: adguard.service.j2
      condition: >-
        {{ (not ansible_check_mode or adguard_user.uid is defined)
           and adguard_network_info.networks | default([]) | length > 0 }}
      restart: "{{ adguard_network.changed or adguard_config.changed or adguard_tls_certs.changed }}"
      throttle: 1
  tags:
    - adguard

- name: Configure nginx
  import_role:
    name: nginx
    tasks_from: site
  vars:
    nginx_site_args:
      subdomain: adguard
      proxy_pass: http://127.0.0.1:{{ service_ports.adguard }}/
      auth: true
  tags:
    - adguard

- name: Install DNS reboot guard script
  template:
    src: adguard_reboot_guard.j2
    dest: /usr/local/sbin/adguard_reboot_guard
    owner: root
    group: root
    mode: "0755"
    backup: true
    validate: bash -n %s
  register: adguard_reboot_guard_script
  become: true
  tags:
    - adguard

- name: Manage DNS reboot guard service
  import_role:
    name: systemd_unit
    tasks_from: unit
  vars:
    systemd_unit_args:
      src: adguard_reboot_guard.service.j2
      restart: "{{ adguard_reboot_guard_script.changed }}"
  tags:
    - adguard
