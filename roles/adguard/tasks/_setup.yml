- name: _setup | Install nginx
  import_role:
    name: nginx
    tasks_from: test_fixture
  vars:
    nginx_test_fixture_args:
      authelia_mode: gate
      subdomains:
        - adguard

- name: _setup | Install podman
  import_role:
    name: podman
    tasks_from: install

- name: _setup | Install fluent-bit for container-log normalization
  import_role:
    name: fluentbit
    tasks_from: configure

# The fixture uses snakeoil certs and never runs certbot, which creates the
# deploy hook directory on prod.
- name: _setup | Create the certbot deploy hook directory
  file:
    dest: /etc/letsencrypt/renewal-hooks/deploy
    state: directory
    mode: "0755"
  become: true

- name: _setup | Install dependencies
  apt:
    pkg:
      - dnsutils
    install_recommends: false
    cache_valid_time: 3600
  become: true

# Install the complete DNS VRRP configuration and the ip_nonlocal_bind sysctl
# that lets AdGuard publish VIP sockets while this host is BACKUP.
- name: _setup | Install keepalived
  import_role:
    name: keepalived
