- name: Install lm-sensors
  apt:
    pkg:
      - i2c-tools
      - lm-sensors
    cache_valid_time: 3600
  register: lm_sensors_package
  become: true
  tags:
    - lm_sensors

# Load before persisting so unavailable modules never enter the boot list.
- name: Load sensor modules now
  modprobe:
    name: "{{ item }}"
    state: present
  loop: "{{ lm_sensors_modules }}"
  become: true
  tags:
    - lm_sensors

- name: Persist the sensor module list for boot  # noqa: require-validate
  copy:
    dest: /etc/modules-load.d/lm_sensors.conf
    content: "{{ lm_sensors_modules | join('\n') }}\n"
    mode: "0644"
    owner: root
    group: root
    backup: true
  become: true
  tags:
    - lm_sensors

- name: Write the libsensors configuration
  template:
    src: libsensors.conf.j2
    dest: /etc/sensors.d/zz_homelab.conf
    mode: "0644"
    owner: root
    group: root
    backup: true
    # sensors exits 1 both on a parse error and on a sensorless host after a
    # clean parse, so only the parser "Error:" lines on stderr tell them apart.
    validate: sh -c '! sensors -c "$1" 2>&1 >/dev/null | grep "Error:" >&2' sh %s
  register: lm_sensors_config_file
  become: true
  tags:
    - lm_sensors

# The package enables lm-sensors.service without starting it. Its
# ExecStart=-/usr/bin/sensors -s applies `set` limits and tolerates a host
# without hwmon chips.
- name: Restart lm-sensors to apply the libsensors limits
  when:
    - lm_sensors_config_file.changed
    - not (ansible_check_mode and lm_sensors_package.changed)
  systemd:
    name: lm-sensors.service
    state: restarted
  become: true
  tags:
    - lm_sensors

# debugfs.plugin reads libsensors at startup. try-restart leaves an inactive
# Netdata alone; it reads the new config when it starts.
- name: Restart netdata to re-read the libsensors configuration  # noqa: command-instead-of-module
  when: lm_sensors_config_file.changed
  command: systemctl try-restart netdata.service
  changed_when: true
  become: true
  tags:
    - lm_sensors
