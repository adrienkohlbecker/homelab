# Requires netdata installed. metrics.yml supplies the fresh-install check-mode
# condition; standalone imports default to enabled.

# Check required input fields before rendering; YAML parsing alone cannot
# validate the collector schema.
- name: Assert lm_sensors_relabel is well-formed before rendering the collector config
  vars:
    _relabel: "{{ lm_sensors_effective_relabel }}"
    _sensors: "{{ _relabel | map(attribute='sensors', default=[]) | flatten }}"
  assert:
    that:
      - _relabel is sequence and _relabel is not string
      - _relabel | selectattr('chip', 'undefined') | list | length == 0
      - _relabel | selectattr('sensors', 'undefined') | list | length == 0
      - _sensors | selectattr('name', 'undefined') | list | length == 0
      - _sensors | selectattr('label', 'undefined') | list | length == 0
    fail_msg: >-
      lm_sensors_relabel entries each need a `chip` and a non-empty `sensors` list
      of {name, label} dicts. Got: {{ _relabel }}
  tags:
    - lm_sensors

- name: Configure lm_sensors metrics
  import_role:
    name: netdata
    tasks_from: config
  vars:
    netdata_args:
      src: sensors.conf.j2
      dest: go.d/sensors.conf
      condition: "{{ lm_sensors_netdata_condition | default(true) }}"
  tags:
    - lm_sensors
