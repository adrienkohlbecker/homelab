# Verify module loading/removal and libsensors configuration.
# The arm64 QEMU fixture has no hwmon chips, so live sensor charts and chip
# limit application require hardware verification.

- name: _verify | Load production defaults outside the role-under-test fixture
  include_vars:
    file: "{{ role_path }}/defaults/main.yml"
    name: _lm_sensors_inactive_defaults
  vars:
    _role_under_test: another_role

- name: _verify | Inactive fixture defaults provide no synthetic sensor inputs
  assert:
    that:
      - _lm_sensors_inactive_defaults.lm_sensors_qemu_test_modules == []
      - _lm_sensors_inactive_defaults.lm_sensors_qemu_test_config is none
  vars:
    _role_under_test: another_role

- name: _verify | Resolve physical sensor inputs
  vars:
    qemu_test: false
    lm_sensors_modules:
      - verify_physical
    lm_sensors_config: verify physical config
  assert:
    that:
      - lm_sensors_effective_modules == ['verify_physical']
      - lm_sensors_effective_config == 'verify physical config'

- name: _verify | Read the modules-load.d file
  slurp:
    path: /etc/modules-load.d/lm_sensors.conf
  register: _lm_sensors_modload
  become: true

- name: _verify | Assert it lists exactly lm_sensors_modules
  assert:
    that:
      - (_lm_sensors_modload.content | b64decode).split() == lm_sensors_effective_modules
    fail_msg: >-
      /etc/modules-load.d/lm_sensors.conf = {{ _lm_sensors_modload.content | b64decode | trim }};
      expected {{ lm_sensors_effective_modules }}

- name: _verify | Assert each module is loaded in the running kernel
  command: grep -qw {{ item | replace('-', '_') }} /proc/modules
  loop: "{{ lm_sensors_effective_modules }}"
  changed_when: false
  become: true

- name: _verify | Parse the installed libsensors configuration
  command: sensors -c /etc/sensors.d/zz_homelab.conf
  register: _lm_sensors_config_parse
  changed_when: false
  failed_when: >-
    _lm_sensors_config_parse.rc != 0
    and not (_lm_sensors_config_parse.rc == 1
    and _lm_sensors_config_parse.stderr.startswith("No sensors found!"))
  become: true

# Exercise the role's running-Netdata restart path during config removal.
- name: _verify | Start netdata
  systemd:
    name: netdata
    state: started
  become: true

# The unused dummy module should unload cleanly without requiring a reboot.
- name: _verify | Clear any pre-existing reboot-required sentinel
  file:
    path: /var/run/reboot-required
    state: absent
  become: true

- name: _verify | Switch to an empty module list
  set_fact:
    lm_sensors_qemu_test_modules: []
    # The inactive default fixture is native-typed as null during a site run.
    lm_sensors_qemu_test_config: null

- name: _verify | Re-run the role's module-management tasks
  import_tasks: main.yml

- name: _verify | Stat the modules-load.d file after removal
  stat:
    path: /etc/modules-load.d/lm_sensors.conf
  register: _lm_sensors_modload_after
  become: true

- name: _verify | Stat the libsensors configuration after removal
  stat:
    path: /etc/sensors.d/zz_homelab.conf
  register: _lm_sensors_config_after
  become: true

- name: _verify | Check whether the dropped module is still loaded
  command: grep -qw dummy /proc/modules
  register: _lm_sensors_dummy_loaded
  changed_when: false
  failed_when: false
  become: true

- name: _verify | Stat the reboot-required sentinel
  stat:
    path: /var/run/reboot-required
  register: _lm_sensors_reboot_after
  become: true

- name: _verify | Assert removal dropped the files and live-unloaded the module
  assert:
    that:
      - not _lm_sensors_modload_after.stat.exists
      - not _lm_sensors_config_after.stat.exists
      - _lm_sensors_dummy_loaded.rc != 0
      - not _lm_sensors_reboot_after.stat.exists
    fail_msg: >-
      empty-list removal arm: modules-load.d exists={{ _lm_sensors_modload_after.stat.exists }},
      sensors.d config exists={{ _lm_sensors_config_after.stat.exists }},
      dummy still loaded={{ _lm_sensors_dummy_loaded.rc == 0 }},
      reboot-required exists={{ _lm_sensors_reboot_after.stat.exists }}
