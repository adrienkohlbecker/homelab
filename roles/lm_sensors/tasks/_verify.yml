# The QEMU fixtures have no hwmon chips, so live sensor charts and chip limit
# application need hardware verification; these checks cover boot-time module
# loading and the restarts a config change drives.

- name: _verify | Unload the fixture module
  command: modprobe -r dummy
  changed_when: true
  become: true

- name: _verify | Replay boot-time module loading
  systemd:
    name: systemd-modules-load.service
    state: restarted
  become: true

- name: _verify | Assert systemd-modules-load reloaded the fixture module
  command: grep -qw ^dummy /proc/modules
  changed_when: false

- name: _verify | Read lm-sensors.service state
  systemd:
    name: lm-sensors.service
  register: _lm_sensors_unit

# The role relies on the package enabling the unit so limits apply at boot.
- name: _verify | Assert lm-sensors.service applies limits at boot
  assert:
    that:
      - _lm_sensors_unit.status.UnitFileState == 'enabled'

- name: _verify | Start netdata
  systemd:
    name: netdata.service
    state: started
  become: true

- name: _verify | Read the running netdata
  systemd:
    name: netdata.service
  register: _lm_sensors_netdata_before

- name: _verify | Change the libsensors configuration
  set_fact:
    lm_sensors_config: |
      chip "verify-isa-0000"
          ignore temp3

- name: _verify | Re-run the role with the changed configuration
  import_tasks: main.yml

- name: _verify | Read netdata after the config change
  systemd:
    name: netdata.service
  register: _lm_sensors_netdata_after

- name: _verify | Assert the config change restarted running netdata
  assert:
    that:
      - _lm_sensors_netdata_after.status.ActiveState == 'active'
      - _lm_sensors_netdata_after.status.MainPID != _lm_sensors_netdata_before.status.MainPID
