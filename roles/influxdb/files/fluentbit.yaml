parsers:
  - name: influxdb_logfmt
    format: logfmt
    logfmt_no_bare_keys: true

pipeline:
  filters:
    - name: modify
      match: svc.influxdb.service
      rename: MESSAGE log
    - name: parser
      match: svc.influxdb.service
      key_name: log
      parser: influxdb_logfmt
      reserve_data: true
      preserve_key: true
    - name: modify
      match: svc.influxdb.service
      condition:
        - key_exists CONTAINER_TAG
        - key_exists msg
        - key_exists lvl
      hard_rename:
        - msg log
        - lvl _level
      remove: ts
      set: parser_status parsed
    # InfluxDB 2.8 emits this once per start for an internal argument that the
    # image itself supplies. Keep all other warnings.
    - name: grep
      match: svc.influxdb.service
      logical_op: and
      exclude:
        - 'CONTAINER_TAG ^.+$'
        - 'log \Anats-port argument is deprecated and unused\z'
