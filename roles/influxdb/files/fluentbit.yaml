parsers:
  - name: influxdb_logfmt
    format: logfmt
    logfmt_no_bare_keys: true

pipeline:
  filters:
    - name: modify
      match: svc.influxdb.service
      rename: MESSAGE log
    - name: parser
      match: svc.influxdb.service
      key_name: log
      parser: influxdb_logfmt
      reserve_data: true
      preserve_key: true
    - name: modify
      match: svc.influxdb.service
      condition:
        - key_exists CONTAINER_TAG
        - key_exists msg
        - key_exists lvl
      hard_rename:
        - msg log
        - lvl _level
      remove: ts
      add: parser_status parsed
