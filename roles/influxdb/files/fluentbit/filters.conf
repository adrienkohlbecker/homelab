# Parse only records on the InfluxDB unit tag. The parser filter cannot test
# CONTAINER_TAG, so the Lua normalizer keeps same-unit systemd and podman output
# unchanged and processes only container stdout/stderr records.
[FILTER]
    Name          parser
    Match         svc.influxdb.service
    Key_Name      log
    Parser        influxdb_logfmt
    Reserve_Data  On
    Preserve_Key  On

[FILTER]
    Name    lua
    Match   svc.influxdb.service
    script  /etc/fluent-bit/influxdb_normalize.lua
    call    normalize_influxdb
