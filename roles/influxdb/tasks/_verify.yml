# Loopback /health probe -- confirms influxd is up and the publish path
# is wired. Retries cover cold-start (--health-start-period is 30s; the
# budget below gives ~60s headroom). Host header matches the nginx leg
# below to future-proof against ALLOWED_HOSTS-style restrictions.
- name: _verify | Influxdb /health on loopback port
  uri:
    url: http://localhost:{{ service_ports.influxdb }}/health
    headers:
      Host: influxdb.{{ inventory_hostname }}.{{ domain }}
    return_content: true
  register: _influxdb_loopback
  retries: 30
  delay: 2
  until:
    - _influxdb_loopback.status == 200
    - _influxdb_loopback.json.status | default('') == 'pass'
  become: true

# Authelia gate probe -- the influxdb subdomain uses `auth: true`,
# so a cookie-less GET / has to land on Authelia's 302 redirect chain.
# Validates the auth_request wiring (without it the request would reach
# InfluxDB and return the SPA's HTML 200).
#
- name: _verify | Verify InfluxDB Authelia gate
  import_role:
    name: nginx
    tasks_from: verify_authelia_gate
  vars:
    nginx_verify_authelia_gate_args:
      subdomain: influxdb
      require_rd: false

# The converge provisioned every influxdb_buckets tenant (the fixture declares
# two). Check each one's bucket, authorization, and write path in InfluxDB.
- name: _verify | List the managed org's buckets
  command:
    argv:
      - podman
      - exec
      - influxdb
      - influx
      - bucket
      - list
      - --org
      - "{{ influxdb_root_org }}"
      - --json
  register: _influxdb_verify_buckets
  changed_when: false
  become: true

# The token is redacted after creation, but its owner, status, and exact
# permission list remain. Matching each tenant's own bucket ID also proves the
# second entry did not reuse the first entry's derived IDs. `auth list --user`
# returns every authorization in the org, hence the explicit owner filter.
- name: _verify | Each tenant holds an active write-auth for its own bucket
  vars:
    _verify_bucket: >-
      {{ _influxdb_verify_buckets.stdout
         | from_json
         | selectattr('name', 'eq', item.bucket)
         | first
         | default({}) }}
    _verify_write_permission: >-
      write:orgs/{{ _verify_bucket.orgID }}/buckets/{{ _verify_bucket.id }}
  command:
    argv:
      - podman
      - exec
      - influxdb
      - influx
      - auth
      - list
      - --user
      - "{{ item.user }}"
      - --json
  loop: "{{ influxdb_buckets }}"
  loop_control:
    label: "{{ item.user }} / {{ item.bucket }}"
  register: _influxdb_verify_auth_list
  changed_when: false
  failed_when: >-
    _verify_bucket == {}
    or ((_influxdb_verify_auth_list.stdout | from_json)
        | selectattr('userName', 'eq', item.user)
        | selectattr('status', 'eq', 'active')
        | selectattr('permissions', 'eq', [_verify_write_permission])
        | list | length) == 0
  become: true

- name: _verify | Write a sentinel point into each tenant bucket
  command:
    argv:
      - podman
      - exec
      - influxdb
      - influx
      - write
      - --bucket
      - "{{ item.bucket }}"
      - --org
      - "{{ influxdb_root_org }}"
      - sentinel,source=ansible_verify value=1
  loop: "{{ influxdb_buckets }}"
  loop_control:
    label: "{{ item.bucket }}"
  changed_when: false
  become: true

- name: _verify | Exercise alternate service storage layouts
  include_tasks: "{{ ansible_config_file | dirname }}/test/playbooks/tasks/_verify_service_storage.yml"
  vars:
    _storage_service: influxdb
    _storage_mounts: [ services ]
