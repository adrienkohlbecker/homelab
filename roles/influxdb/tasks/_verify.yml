# Loopback /health probe -- confirms influxd is up and the publish path
# is wired. Retries cover cold-start (--health-start-period is 30s; the
# budget below gives ~60s headroom). Host header matches the nginx leg
# below to future-proof against ALLOWED_HOSTS-style restrictions.
- name: _verify | Influxdb /health on loopback port
  uri:
    url: http://localhost:{{ service_ports.influxdb }}/health
    headers:
      Host: influxdb.{{ inventory_hostname }}.{{ domain }}
    return_content: true
  register: _influxdb_loopback
  retries: 30
  delay: 2
  until:
    - _influxdb_loopback.status == 200
    - _influxdb_loopback.json.status | default('') == 'pass'
  become: true

# Authelia gate probe -- the influxdb subdomain uses `auth: true`,
# so a cookie-less GET / has to land on Authelia's 302 redirect chain.
# Validates the auth_request wiring (without it the request would reach
# InfluxDB and return the SPA's HTML 200).
#
- name: _verify | Verify InfluxDB Authelia gate
  import_role:
    name: nginx
    tasks_from: verify_authelia_gate
  vars:
    nginx_verify_authelia_gate_args:
      subdomain: influxdb
      require_rd: false

- name: _verify | Create unique influxdb fluent-bit marker
  set_fact:
    influxdb_lnav_marker: "verify_influxdb_{{ ansible_date_time.iso8601_basic_short }}_{{ 99999 | random }}"

# Write through PID 1's stderr so conmon records the fixture through the same
# journald path as influxd. `podman exec` output itself would return to Ansible
# and bypass the container log driver.
- name: _verify | Emit representative influxdb logfmt record
  command:
    argv:
      - podman
      - exec
      - influxdb
      - /bin/sh
      - -c
      - >-
        printf "%s\n"
        "ts=2099-01-02T03:04:05.678Z lvl=warn
        msg=\"Verify influxdb parser\" log_id=verify
        verify_marker={{ influxdb_lnav_marker }}"
        > /proc/1/fd/2
  changed_when: false
  become: true

- name: _verify | Wait for normalized influxdb record in lnav store
  command:
    argv:
      - python3
      - -c
      - |
        import json
        import sys

        with open(sys.argv[1], encoding="utf-8") as handle:
            for line in handle:
                try:
                    record = json.loads(line)
                except json.JSONDecodeError:
                    continue
                fields = record.get("fields", {})
                if fields.get("verify_marker") != sys.argv[2]:
                    continue
                valid = (
                    record.get("service") == "influxdb"
                    and record.get("unit") == "influxdb.service"
                    and record.get("level") == "warn"
                    and record.get("message") == "Verify influxdb parser"
                    and fields.get("log_id") == "verify"
                    and fields.get("parser_status") == "parsed"
                    and fields.get("CONTAINER_ID")
                    and "ts" not in fields
                    and "lvl" not in fields
                    and "msg" not in fields
                    and "CONTAINER_TAG" not in fields
                    and "CONTAINER_ID_FULL" not in fields
                    and "CMDLINE" not in fields
                    and "PRIORITY" not in fields
                    and "SYSTEMD_UNIT" not in fields
                )
                if valid:
                    print(json.dumps(record, sort_keys=True))
                    sys.exit(0)
        sys.exit(1)
      - /var/log/fluent-bit/lnav.jsonl
      - "{{ influxdb_lnav_marker }}"
  register: _influxdb_lnav_record
  changed_when: false
  retries: 30
  delay: 2
  until: _influxdb_lnav_record.rc == 0
  become: true

# Exercise bucket.yml end-to-end with a throwaway tenant, then verify its
# authorization metadata and the bucket's write path.
- name: _verify | Provision throwaway influxdb tenant via bucket.yml
  import_role:
    name: influxdb
    tasks_from: bucket
  vars:
    influxdb_bucket_args:
      user: verify_user
      bucket: verify_bucket

- name: _verify | Resolve verify_bucket id
  command:
    argv:
      - podman
      - exec
      - influxdb
      - influx
      - bucket
      - list
      - --org
      - "{{ influxdb_root_org }}"
      - --name
      - verify_bucket
      - --json
  register: _influxdb_verify_bucket
  changed_when: false
  become: true

# The token is redacted after creation, but its exact permission list remains.
- name: _verify | Bucket.yml minted a write-auth for verify_bucket
  vars:
    _verify_bucket: >-
      {{ _influxdb_verify_bucket.stdout
         | from_json
         | one_by_attr('name', 'verify_bucket') }}
    _verify_write_permission: >-
      write:orgs/{{ _verify_bucket.orgID }}/buckets/{{ _verify_bucket.id }}
  command:
    argv:
      - podman
      - exec
      - influxdb
      - influx
      - auth
      - list
      - --user
      - verify_user
      - --json
  register: _influxdb_verify_auth_list
  changed_when: false
  failed_when: >-
    ((_influxdb_verify_auth_list.stdout | from_json)
     | matching_by_attr('permissions', [_verify_write_permission])
     | list | length) == 0
  become: true

- name: _verify | Write a sentinel point through the managed operator config
  command:
    argv:
      - podman
      - exec
      - influxdb
      - influx
      - write
      - --bucket
      - verify_bucket
      - --org
      - "{{ influxdb_root_org }}"
      - sentinel,source=ansible_verify value=1
  changed_when: false
  become: true

- name: _verify | Exercise influxdb fluent-bit record contracts
  import_role:
    name: fluentbit
    tasks_from: verify_extension
  vars:
    fluentbit_verify_args:
      name: influxdb
      records:
        - MESSAGE: 'ts=2099-01-02T03:04:05Z lvl=WARNING msg="influxdb-valid" parser_status=forged service=attribute'
          CONTAINER_TAG: influxdb
          SYSLOG_IDENTIFIER: conmon
          SYSTEMD_UNIT: influxdb.service
        - MESSAGE: influxdb-raw
          CONTAINER_TAG: influxdb
          SYSLOG_IDENTIFIER: conmon
          SYSTEMD_UNIT: influxdb.service
        - MESSAGE: 'ts=2099-01-02T03:04:07Z lvl=warn msg="nats-port argument rejected" log_id=keep'
          CONTAINER_TAG: influxdb
          SYSLOG_IDENTIFIER: conmon
          SYSTEMD_UNIT: influxdb.service
      expected:
        - message: influxdb-valid
          level: warn
          service: influxdb
          fields.parser_status: parsed
          fields.service: attribute
        - message: influxdb-raw
          service: influxdb
          _absent:
            - fields.parser_status
        - message: nats-port argument rejected
          level: warn
          service: influxdb
          fields.log_id: keep
