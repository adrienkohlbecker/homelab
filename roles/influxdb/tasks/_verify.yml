# Loopback /health probe -- confirms influxd is up and the publish path
# is wired. Retries cover cold-start (--health-start-period is 30s; the
# budget below gives ~60s headroom). Host header matches the nginx leg
# below to future-proof against ALLOWED_HOSTS-style restrictions.
- name: _verify | Influxdb /health on loopback port
  uri:
    url: http://localhost:{{ service_ports.influxdb }}/health
    headers:
      Host: influxdb.{{ inventory_hostname }}.{{ domain }}
    return_content: true
  register: _influxdb_loopback
  retries: 30
  delay: 2
  until:
    - _influxdb_loopback.status == 200
    - _influxdb_loopback.json.status | default('') == 'pass'
  become: true

# Authelia gate probe -- the influxdb subdomain uses `auth: true`,
# so a cookie-less GET / has to land on Authelia's 302 redirect chain.
# Validates the auth_request wiring (without it the request would reach
# InfluxDB and return the SPA's HTML 200).
#
- name: _verify | Verify InfluxDB Authelia gate
  import_role:
    name: nginx
    tasks_from: verify_authelia_gate
  vars:
    nginx_verify_authelia_gate_args:
      subdomain: influxdb
      require_rd: false

# Exercise bucket.yml end-to-end with a throwaway tenant, then verify its
# authorization metadata and the bucket's write path.
- name: _verify | Provision throwaway influxdb tenant via bucket.yml
  import_role:
    name: influxdb
    tasks_from: bucket
  vars:
    influxdb_bucket_args:
      user: verify_user
      bucket: verify_bucket

- name: _verify | Resolve verify_bucket id
  command:
    argv:
      - podman
      - exec
      - influxdb
      - influx
      - bucket
      - list
      - --org
      - "{{ influxdb_root_org }}"
      - --name
      - verify_bucket
      - --json
  register: _influxdb_verify_bucket
  changed_when: false
  become: true

# The token is redacted after creation, but its exact permission list remains.
- name: _verify | Bucket.yml minted a write-auth for verify_bucket
  vars:
    _verify_bucket: >-
      {{ _influxdb_verify_bucket.stdout
         | from_json
         | selectattr('name', 'eq', 'verify_bucket')
         | first }}
    _verify_write_permission: >-
      write:orgs/{{ _verify_bucket.orgID }}/buckets/{{ _verify_bucket.id }}
  command:
    argv:
      - podman
      - exec
      - influxdb
      - influx
      - auth
      - list
      - --user
      - verify_user
      - --json
  register: _influxdb_verify_auth_list
  changed_when: false
  failed_when: >-
    ((_influxdb_verify_auth_list.stdout | from_json)
     | selectattr('permissions', 'eq', [_verify_write_permission])
     | list | length) == 0
  become: true

- name: _verify | Write a sentinel point through the managed operator config
  command:
    argv:
      - podman
      - exec
      - influxdb
      - influx
      - write
      - --bucket
      - verify_bucket
      - --org
      - "{{ influxdb_root_org }}"
      - sentinel,source=ansible_verify value=1
  changed_when: false
  become: true
