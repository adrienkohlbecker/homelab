# Provision a user, bucket, and bucket-scoped write authorization in
# `influxdb_root_org`. Required `influxdb_bucket_args` keys: `user`, `bucket`.
#
# The token is printed only by the first `auth create`; InfluxDB redacts it from
# later listings, so this task neither publishes nor persists it. Delete the
# authorization and re-run to recover a lost token. The main role must have
# authenticated its managed CLI config before this entry point runs.
#
# JSON output avoids table-shape drift; argv slots keep tenant names inert.

- name: bucket | Assert args
  assert:
    that:
      - influxdb_bucket_args.user   is defined
      - influxdb_bucket_args.bucket is defined
    fail_msg: >-
      influxdb_bucket requires influxdb_bucket_args.{user,bucket}.

- name: bucket | Query org {{ influxdb_root_org }}
  command:
    argv:
      - podman
      - exec
      - influxdb
      - influx
      - org
      - list
      - --name
      - "{{ influxdb_root_org }}"
      - --json
  register: _influxdb_bucket_org_query
  changed_when: false
  check_mode: false
  # Let the assertion below report a missing org with recovery guidance.
  failed_when: false
  become: true

# Match the returned name exactly rather than relying on CLI filter semantics.
# The rc check short-circuits JSON parsing on command failure.
- name: "bucket | Assert org exists: {{ influxdb_root_org }}"
  assert:
    that:
      - _influxdb_bucket_org_query.rc == 0
      - (_influxdb_bucket_org_query.stdout
          | from_json
          | matching_by_attr('name', influxdb_root_org)
          | length) > 0
    fail_msg: >-
      Managed influxdb org '{{ influxdb_root_org }}' not found.
      Reapply the influxdb role's main.yml to bootstrap it.

# Keep derived IDs block-scoped so repeated imports cannot leak tenant state.
- name: bucket | Provision tenant {{ influxdb_bucket_args.user ~ ' / ' ~ influxdb_bucket_args.bucket ~ ' in org ' ~ influxdb_root_org }}
  vars:
    _influxdb_org_id: >-
      {{ (_influxdb_bucket_org_query.stdout
          | from_json
          | one_by_attr('name', influxdb_root_org)).id }}
    _influxdb_bucket_id: >-
      {{ (_influxdb_bucket_bucket_id_query.stdout
          | from_json
          | one_by_attr('name', influxdb_bucket_args.bucket)).id }}
  block:
    - name: bucket | Query user {{ influxdb_bucket_args.user }}
      command:
        argv:
          - podman
          - exec
          - influxdb
          - influx
          - user
          - list
          - --name
          - "{{ influxdb_bucket_args.user }}"
          - --json
      register: _influxdb_bucket_user_query
      changed_when: false
      check_mode: false
      failed_when: false
      become: true

    - name: bucket | Create user {{ influxdb_bucket_args.user }}  # noqa: no-changed-when -- when: gates execution, like creates: did
      when: >-
        _influxdb_bucket_user_query.rc != 0
        or (_influxdb_bucket_user_query.stdout | from_json | length) == 0
      command:
        argv:
          - podman
          - exec
          - influxdb
          - influx
          - user
          - create
          - --org-id
          - "{{ _influxdb_org_id }}"
          - --name
          - "{{ influxdb_bucket_args.user }}"
      become: true

    - name: bucket | Query bucket {{ influxdb_bucket_args.bucket }}
      command:
        argv:
          - podman
          - exec
          - influxdb
          - influx
          - bucket
          - list
          - --org-id
          - "{{ _influxdb_org_id }}"
          - --name
          - "{{ influxdb_bucket_args.bucket }}"
          - --json
      register: _influxdb_bucket_bucket_query
      changed_when: false
      check_mode: false
      failed_when: false
      become: true

    - name: bucket | Create bucket {{ influxdb_bucket_args.bucket }}  # noqa: no-changed-when -- when: gates execution, like creates: did
      when: >-
        _influxdb_bucket_bucket_query.rc != 0
        or (_influxdb_bucket_bucket_query.stdout | from_json | length) == 0
      command:
        argv:
          - podman
          - exec
          - influxdb
          - influx
          - bucket
          - create
          - --org-id
          - "{{ _influxdb_org_id }}"
          - --name
          - "{{ influxdb_bucket_args.bucket }}"
      become: true

    # Re-query because create output does not expose a stable ID schema.
    - name: bucket | Query bucket id for {{ influxdb_bucket_args.bucket }}
      command:
        argv:
          - podman
          - exec
          - influxdb
          - influx
          - bucket
          - list
          - --org-id
          - "{{ _influxdb_org_id }}"
          - --name
          - "{{ influxdb_bucket_args.bucket }}"
          - --json
      register: _influxdb_bucket_bucket_id_query
      changed_when: false
      check_mode: false
      failed_when: >-
        _influxdb_bucket_bucket_id_query.rc != 0
        or (_influxdb_bucket_bucket_id_query.stdout
            | from_json
            | matching_by_attr('name', influxdb_bucket_args.bucket)
            | length) == 0
      become: true

    - name: bucket | Query auth for {{ influxdb_bucket_args.user }}
      command:
        argv:
          - podman
          - exec
          - influxdb
          - influx
          - auth
          - list
          - --user
          - "{{ influxdb_bucket_args.user }}"
          - --json
      register: _influxdb_bucket_auth_query
      changed_when: false
      check_mode: false
      failed_when: false
      become: true

    # Match the CLI's exact write permission string on both org and bucket IDs.
    # `auth create --json` prints the token only when this task first runs.
    - name: bucket | Create write-auth for bucket {{ influxdb_bucket_args.bucket }}  # noqa: no-changed-when -- when: gates execution, like creates: did
      when: >-
        ((_influxdb_bucket_auth_query.stdout | default('[]') | from_json)
         | selectattr('permissions', 'defined')
         | selectattr('permissions', 'contains',
             'write:orgs/' ~ _influxdb_org_id ~ '/buckets/' ~ _influxdb_bucket_id)
         | list | length) == 0
      command:
        argv:
          - podman
          - exec
          - influxdb
          - influx
          - auth
          - create
          - --json
          - --org-id
          - "{{ _influxdb_org_id }}"
          - --user
          - "{{ influxdb_bucket_args.user }}"
          - --write-bucket
          - "{{ _influxdb_bucket_id }}"
      become: true
