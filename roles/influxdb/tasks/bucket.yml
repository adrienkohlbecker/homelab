# Provision a per-tenant (org, user, bucket, write-auth) into a
# running influxdb container. Idempotent via query-then-create
# pairs. Each task uses `influx ... --json` and parses via
# `from_json` to avoid the column-shape drift that tab-cut parsing
# carries across influxdb-cli versions.
#
# Inputs flow through `influxdb_bucket_args` (dict) per the
# helper-role pattern in CLAUDE.md so each call replaces the dict
# wholesale and inter-call vars-leak can't happen.
#
# Required keys:
#   user   -- user name (created if missing)
#   bucket -- bucket name (created if missing)
#
# Tenants belong to the role-managed `influxdb_root_org`.
#
# Outputs:
#   (none.) The bucket-scoped write-auth token is the one secret this
#   file mints, and it is deliberately NOT surfaced as a fact or written
#   to disk: influxd 2.8+ redacts the token from `influx auth list`
#   (returned only here, at `auth create`), so there is no reliable
#   re-read path and no value worth persisting. On the converge that
#   first creates the auth, `auth create --json` prints the token to the
#   interactive converge output -- the operator copies it from there for
#   the one-time consumer setup (e.g. the HA UI influxdb integration).
#   A later converge finds the auth present, skips the create, and prints
#   nothing. To recover a lost token, delete the auth and re-run -- a
#   fresh one is minted and printed.
#
# Assumes the influxdb role's main.yml has already been applied in
# the same play -- main.yml's "Wait for influxdb container to answer
# ping" is the synchronization barrier; this file doesn't repeat it.
# argv form across this file: each user-controlled value lands in its
# own argv slot, so a name containing a space or a leading dash can't
# argv-inject if a future caller feeds untrusted input. Today every
# caller passes inventory literals, but the shape is the cheap
# foot-gun fix.

- name: bucket | Assert args
  assert:
    that:
      - influxdb_bucket_args.user   is defined
      - influxdb_bucket_args.bucket is defined
    fail_msg: >-
      influxdb_bucket requires influxdb_bucket_args.{user,bucket}.

- name: bucket | Check whether podman is installed
  stat:
    path: /usr/bin/podman
  register: _influxdb_bucket_podman

- name: bucket | Check whether the influxdb container exists
  when: not ansible_check_mode or _influxdb_bucket_podman.stat.exists
  command: podman container exists influxdb
  register: _influxdb_bucket_container
  changed_when: false
  check_mode: false
  failed_when: false
  become: true

- name: bucket | Decide whether the running influxdb API is available
  set_fact:
    _influxdb_bucket_api_available: >-
      {{ not ansible_check_mode
         or (_influxdb_bucket_podman.stat.exists
             and (_influxdb_bucket_container.rc | default(1)) == 0) }}

- name: bucket | Query org {{ influxdb_root_org }}
  when: _influxdb_bucket_api_available
  command:
    argv:
      - podman
      - exec
      - influxdb
      - influx
      - org
      - list
      - --name
      - "{{ influxdb_root_org }}"
      - --json
  register: _influxdb_bucket_org_query
  changed_when: false
  check_mode: false
  # Tolerate "org not found" (influx-cli 2.7 exits non-zero on no-match
  # for --name) so the assert below fires with its helpful operator
  # message instead of failing as a bare "command returned non-zero".
  # Matches the user/bucket/auth queries downstream.
  failed_when: false
  become: true

# selectattr('name','equalto', ...) is defensive: influx-cli 2.x's
# `--name` is an exact filter today, but `length > 0` against the
# bare result would silently accept a future patch that turned the
# filter into a prefix/substring match. The org is bootstrapped only
# via DOCKER_INFLUXDB_INIT_ORG. First
# `that:` clause short-circuits the from_json filter when stdout is
# non-JSON (rc != 0 case).
- name: "bucket | Assert org exists: {{ influxdb_root_org }}"
  when: _influxdb_bucket_api_available
  assert:
    that:
      - _influxdb_bucket_org_query.rc == 0
      - (_influxdb_bucket_org_query.stdout
          | from_json
          | matching_by_attr('name', influxdb_root_org)
          | length) > 0
    fail_msg: >-
      Managed influxdb org '{{ influxdb_root_org }}' not found.
      Reapply the influxdb role's main.yml to bootstrap it.

# block-scoped lazy vars replace the earlier set_fact pattern. Each
# reference re-evaluates from the relevant query register; values
# never enter host-fact scope, so a subsequent import_role with
# different inputs can't pick up the previous call's ids.
- name: bucket | Provision tenant {{ influxdb_bucket_args.user ~ ' / ' ~ influxdb_bucket_args.bucket ~ ' in org ' ~ influxdb_root_org }}
  when: _influxdb_bucket_api_available
  vars:
    _influxdb_org_id: >-
      {{ (_influxdb_bucket_org_query.stdout
          | from_json
          | one_by_attr('name', influxdb_root_org)).id }}
    _influxdb_bucket_id: >-
      {{ (_influxdb_bucket_bucket_id_query.stdout
          | from_json
          | one_by_attr('name', influxdb_bucket_args.bucket)).id }}
  block:
    - name: bucket | Query user {{ influxdb_bucket_args.user }}
      command:
        argv:
          - podman
          - exec
          - influxdb
          - influx
          - user
          - list
          - --name
          - "{{ influxdb_bucket_args.user }}"
          - --json
      register: _influxdb_bucket_user_query
      changed_when: false
      check_mode: false
      failed_when: false
      become: true

    - name: bucket | Create user {{ influxdb_bucket_args.user }}  # noqa: no-changed-when -- when: gates execution, like creates: did
      when: >-
        _influxdb_bucket_user_query.rc != 0
        or (_influxdb_bucket_user_query.stdout | from_json | length) == 0
      command:
        argv:
          - podman
          - exec
          - influxdb
          - influx
          - user
          - create
          - --org-id
          - "{{ _influxdb_org_id }}"
          - --name
          - "{{ influxdb_bucket_args.user }}"
      become: true

    - name: bucket | Query bucket {{ influxdb_bucket_args.bucket }}
      command:
        argv:
          - podman
          - exec
          - influxdb
          - influx
          - bucket
          - list
          - --org-id
          - "{{ _influxdb_org_id }}"
          - --name
          - "{{ influxdb_bucket_args.bucket }}"
          - --json
      register: _influxdb_bucket_bucket_query
      changed_when: false
      check_mode: false
      failed_when: false
      become: true

    - name: bucket | Create bucket {{ influxdb_bucket_args.bucket }}  # noqa: no-changed-when -- when: gates execution, like creates: did
      when: >-
        _influxdb_bucket_bucket_query.rc != 0
        or (_influxdb_bucket_bucket_query.stdout | from_json | length) == 0
      command:
        argv:
          - podman
          - exec
          - influxdb
          - influx
          - bucket
          - create
          - --org-id
          - "{{ _influxdb_org_id }}"
          - --name
          - "{{ influxdb_bucket_args.bucket }}"
      become: true

    # Re-query post-create so the auth task always sees a concrete bucket
    # id. The conditional create above doesn't emit a usable id (the
    # upstream `influx bucket create` output schema changed across 2.x
    # patch releases).
    - name: bucket | Query bucket id for {{ influxdb_bucket_args.bucket }}
      command:
        argv:
          - podman
          - exec
          - influxdb
          - influx
          - bucket
          - list
          - --org-id
          - "{{ _influxdb_org_id }}"
          - --name
          - "{{ influxdb_bucket_args.bucket }}"
          - --json
      register: _influxdb_bucket_bucket_id_query
      changed_when: false
      check_mode: false
      failed_when: >-
        _influxdb_bucket_bucket_id_query.rc != 0
        or (_influxdb_bucket_bucket_id_query.stdout
            | from_json
            | matching_by_attr('name', influxdb_bucket_args.bucket)
            | length) == 0
      become: true

    - name: bucket | Query auth for {{ influxdb_bucket_args.user }}
      command:
        argv:
          - podman
          - exec
          - influxdb
          - influx
          - auth
          - list
          - --user
          - "{{ influxdb_bucket_args.user }}"
          - --json
      register: _influxdb_bucket_auth_query
      changed_when: false
      check_mode: false
      failed_when: false
      become: true

    # Create the bucket-scoped write-auth only if one doesn't already
    # exist. Identify an existing auth by its bucket-scoped write
    # permission: `influx auth list --json` emits permissions as bare
    # strings shaped `write:orgs/<orgid>/buckets/<bucketid>` (NOT the
    # {action, resource} dict the HTTP API returns), anchored on BOTH ids
    # so a cross-org perm reusing the bucket id can't false-match.
    #
    # The token secret is never surfaced or persisted (see this file's
    # header): influxd 2.8+ redacts it from `auth list`, returning it only
    # here at `auth create`. `--json` prints it to the interactive converge
    # output on the run that first mints it -- the operator copies it from
    # there for the one-time consumer setup. A later converge finds the
    # auth present, skips, and prints nothing.
    - name: bucket | Create write-auth for bucket {{ influxdb_bucket_args.bucket }}  # noqa: no-changed-when -- when: gates execution, like creates: did
      when: >-
        ((_influxdb_bucket_auth_query.stdout | default('[]') | from_json)
         | selectattr('permissions', 'defined')
         | selectattr('permissions', 'contains',
             'write:orgs/' ~ _influxdb_org_id ~ '/buckets/' ~ _influxdb_bucket_id)
         | list | length) == 0
      command:
        argv:
          - podman
          - exec
          - influxdb
          - influx
          - auth
          - create
          - --json
          - --org-id
          - "{{ _influxdb_org_id }}"
          - --user
          - "{{ influxdb_bucket_args.user }}"
          - --write-bucket
          - "{{ _influxdb_bucket_id }}"
      become: true
