# Provision one `influxdb_buckets` entry: a user, bucket, and bucket-scoped
# write authorization in `influxdb_root_org`. main.yml includes this file once
# per entry with the entry bound to `influxdb_bucket_args` (keys: `user`,
# `bucket`), after its authenticated readiness barrier.
#
# The token is printed only by the first `auth create`; InfluxDB redacts it from
# later listings, so this task neither publishes nor persists it. On the
# converge that first mints the auth, the operator copies it from the converge
# output into the consumer (e.g. the one-time Home Assistant UI integration
# setup). Delete the authorization and re-run to recover a lost token.
#
# JSON output avoids table-shape drift; argv slots keep tenant names inert.
# There is no useful check-mode simulation: the helper queries live application
# state and derives IDs needed by later commands, so skip it until the service
# exists after a real converge.

- name: bucket | Assert args
  assert:
    that:
      - influxdb_bucket_args.user   is defined
      - influxdb_bucket_args.bucket is defined
    fail_msg: >-
      Every influxdb_buckets entry needs `user` and `bucket` keys.
  tags:
    - influxdb

# Keep derived IDs block-scoped so one entry cannot leak tenant state into the next.
- name: bucket | Provision tenant {{ influxdb_bucket_args.user ~ ' / ' ~ influxdb_bucket_args.bucket ~ ' in org ' ~ influxdb_root_org }}
  when: not ansible_check_mode
  vars:
    _influxdb_cli_argv: [ podman, exec, influxdb, influx ]
    _influxdb_bucket_record: >-
      {{ _influxdb_bucket_bucket_id_query.stdout
          | from_json
          | selectattr('name', 'eq', influxdb_bucket_args.bucket)
          | first }}
    _influxdb_bucket_id: "{{ _influxdb_bucket_record.id }}"
  tags:
    - influxdb
  block:
    - name: bucket | Query user {{ influxdb_bucket_args.user }}
      command:
        argv: "{{ _influxdb_cli_argv + ['user', 'list', '--name', influxdb_bucket_args.user, '--json'] }}"
      register: _influxdb_bucket_user_query
      changed_when: false
      failed_when: >-
        _influxdb_bucket_user_query.rc != 0
        and '404 Not Found: user not found' not in _influxdb_bucket_user_query.stderr
      become: true

    - name: bucket | Create user {{ influxdb_bucket_args.user }}  # noqa: no-changed-when -- when: gates execution, like creates: did
      when: >-
        _influxdb_bucket_user_query.rc != 0
        or (_influxdb_bucket_user_query.stdout | from_json | length) == 0
      command:
        argv: "{{ _influxdb_cli_argv + ['user', 'create', '--org', influxdb_root_org, '--name', influxdb_bucket_args.user] }}"
      become: true

    - name: bucket | Query bucket {{ influxdb_bucket_args.bucket }}
      command:
        argv: "{{ _influxdb_cli_argv + ['bucket', 'list', '--org', influxdb_root_org, '--name', influxdb_bucket_args.bucket, '--json'] }}"
      register: _influxdb_bucket_bucket_query
      changed_when: false
      failed_when: >-
        _influxdb_bucket_bucket_query.rc != 0
        and not (
          '404 Not Found: bucket' in _influxdb_bucket_bucket_query.stderr
          and 'not found' in _influxdb_bucket_bucket_query.stderr)
      become: true

    - name: bucket | Create bucket {{ influxdb_bucket_args.bucket }}  # noqa: no-changed-when -- when: gates execution, like creates: did
      when: >-
        _influxdb_bucket_bucket_query.rc != 0
        or (_influxdb_bucket_bucket_query.stdout | from_json | length) == 0
      command:
        argv: "{{ _influxdb_cli_argv + ['bucket', 'create', '--org', influxdb_root_org, '--name', influxdb_bucket_args.bucket] }}"
      become: true

    # Re-query because create output does not expose a stable ID schema.
    - name: bucket | Query bucket id for {{ influxdb_bucket_args.bucket }}
      command:
        argv: "{{ _influxdb_cli_argv + ['bucket', 'list', '--org', influxdb_root_org, '--name', influxdb_bucket_args.bucket, '--json'] }}"
      register: _influxdb_bucket_bucket_id_query
      changed_when: false
      failed_when: >-
        _influxdb_bucket_bucket_id_query.rc != 0
        or (_influxdb_bucket_bucket_id_query.stdout
            | from_json
            | selectattr('name', 'eq', influxdb_bucket_args.bucket)
            | list
            | length) == 0
      become: true

    - name: bucket | Query auth for {{ influxdb_bucket_args.user }}
      command:
        argv: "{{ _influxdb_cli_argv + ['auth', 'list', '--user', influxdb_bucket_args.user, '--json'] }}"
      register: _influxdb_bucket_auth_query
      changed_when: false
      become: true

    # Match the CLI's exact write permission string on both org and bucket IDs.
    # `auth create --json` prints the token only when this task first runs.
    - name: bucket | Create write-auth for bucket {{ influxdb_bucket_args.bucket }}  # noqa: no-changed-when -- when: gates execution, like creates: did
      when: >-
        ((_influxdb_bucket_auth_query.stdout | from_json)
         | selectattr('permissions', 'defined')
         | selectattr('permissions', 'contains',
             'write:orgs/' ~ _influxdb_bucket_record.orgID ~ '/buckets/' ~ _influxdb_bucket_id)
         | list | length) == 0
      command:
        argv: "{{ _influxdb_cli_argv + ['auth', 'create', '--json', '--org', influxdb_root_org, '--user', influxdb_bucket_args.user, '--write-bucket', _influxdb_bucket_id] }}"
      become: true
