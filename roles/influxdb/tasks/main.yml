- name: Set up influxdb system user, group, and config dir
  import_role:
    name: service_user
    tasks_from: user
  vars:
    service_user_args:
      name: influxdb
  tags:
    - influxdb

# The image enforces data=0700 and config=0775 on every boot; matching those
# modes prevents Ansible/container flapping. Token files inside config remain
# 0600, and the host group contains only the influxdb user.
- name: Create influxdb config and data directories
  when: not ansible_check_mode or influxdb_user.uid is defined
  file:
    dest: "{{ item.path }}"
    state: directory
    owner: influxdb
    group: influxdb
    mode: "{{ item.mode }}"
  loop:
    - { path: /mnt/services/influxdb/data,    mode: "0700" }
    - { path: /mnt/services/influxdb/config,  mode: "0775" }
  become: true
  tags:
    - influxdb

- name: Check whether influxdb is already initialized
  stat:
    path: /mnt/services/influxdb/data/influxd.bolt
  register: influxdb_bolt_db
  become: true
  tags:
    - influxdb

# The image bootstraps org/user/bucket only while BoltDB is empty. Mounted
# password/token files keep credentials out of command lines and the environment.
- name: Pull influxdb image
  import_role:
    name: podman
    tasks_from: image
  vars:
    podman_image_args:
      name: influxdb
      image: "{{ influxdb_image }}"
  tags:
    - influxdb

- name: Create influxdb_root_password secret
  when: not ansible_check_mode or influxdb_podman_available
  containers.podman.podman_secret:
    name: influxdb_root_password
    data: "{{ influxdb_root_password }}"
  register: _influxdb_root_password_secret
  become: true
  tags:
    - influxdb

# `bucket.yml` needs an operator token's write:users/write:orgs permissions;
# all-access tokens lack them. Seeding `influxdb_root_token` on first boot keeps
# BoltDB and the managed CLI config on the same token instead of a random one.
#
# Rotate offline with the container stopped using `influxd recovery auth
# create-operator`, update the vault, and re-apply; the authenticated readiness
# check confirms the new value.
- name: Create influxdb_admin_token secret
  when: not ansible_check_mode or influxdb_podman_available
  containers.podman.podman_secret:
    name: influxdb_admin_token
    data: "{{ influxdb_root_token }}"
  become: true
  tags:
    - influxdb

- name: Create homeassistant podman network
  when: not ansible_check_mode
  containers.podman.podman_network:
    name: homeassistant
    disable_dns: false
    state: present
  register: influxdb_network
  become: true
  tags:
    - influxdb

# DOCKER_INFLUXDB_INIT_* honors the credentials only on first boot.
# A changed password secret with a pre-existing BoltDB means a vault rotation or
# a restored host whose empty podman store is recreating the existing secret.
# Fail once in both cases: a plain rerun clears the restored-host case, while a
# real rotation still requires the operator procedure below.
- name: Fail if bootstrap password changed with an existing database
  fail:
    msg: |
      influxdb_root_password was created or changed while an existing BoltDB
      is present.

      If this host was restored with an empty podman secret store and
      the vault value did not change, re-run this play. The recreated
      secret will be unchanged on the second run.

      If a vault value changed, ensure the container is running first. A
      restored host may need one rerun to install and start its unit.

      Update the password on the target host:
        podman exec -it influxdb influx user password \
          --name root

      Then re-run this play.
  when:
    - influxdb_bolt_db.stat.exists
    - _influxdb_root_password_secret.changed | default(false)
  tags:
    - influxdb

- name: Remove retired influxdb fluent-bit extension
  import_role:
    name: fluentbit
    tasks_from: extension_remove
  vars:
    fluentbit_extension_remove_args:
      names:
        - influxdb
  tags:
    - influxdb

- name: Manage influxdb service
  import_role:
    name: systemd_unit
    tasks_from: unit
  vars:
    systemd_unit_args:
      src: influxdb.service.j2
      condition: "{{ not ansible_check_mode or influxdb_user.uid is defined }}"
      restart: >-
        {{ influxdb_network.changed
           or (_influxdb_root_password_secret.changed | default(false)) }}
  tags:
    - influxdb

# Keep the per-exec CLI on the vaulted operator token across bootstrap and
# rotation. Influxd does not read this file, so updates need no restart.
- name: Template the influx CLI default config
  when: not ansible_check_mode or influxdb_user.uid is defined
  template:
    src: influx-configs.j2
    dest: /mnt/services/influxdb/config/influx-configs
    owner: influxdb
    group: influxdb
    mode: "0600"
    backup: true
  become: true
  tags:
    - influxdb

# Authenticated readiness barrier for later `tasks_from: bucket` callers.
# The separate assertion turns a persistent 401 into actionable guidance.
- name: Wait for the influx default config to authenticate
  command:
    argv:
      - podman
      - exec
      - influxdb
      - influx
      - org
      - list
      - --name
      - "{{ influxdb_root_org }}"
      - --json
  register: _influxdb_auth_check
  changed_when: false
  failed_when: false
  retries: 10
  delay: 2
  until: _influxdb_auth_check.rc == 0
  when: not ansible_check_mode
  become: true
  tags:
    - influxdb

- name: Assert the influx default config authenticates to the managed org
  assert:
    that:
      - _influxdb_auth_check.rc == 0
      - (_influxdb_auth_check.stdout
          | from_json
          | matching_by_attr('name', influxdb_root_org)
          | length) > 0
    fail_msg: >-
      `influx org list` did not return the managed '{{ influxdb_root_org }}'
      organization. The token in influxdb_root_token must be a recognized
      OPERATOR token because bucket.yml needs write:users, which an all-access
      token lacks. Reapply bootstrap if the org is missing; otherwise mint a
      fresh token offline with `influxd recovery auth create-operator` (stop the
      container first), set influxdb_root_token in the vault, and re-apply.
  when: not ansible_check_mode
  tags:
    - influxdb

# The browser UI uses Authelia plus InfluxDB's own login; nginx never injects
# the operator token. Machine clients use bucket-scoped tokens directly over
# `influxdb.dns.podman:8086`, outside this vhost.
- name: Configure nginx
  import_role:
    name: nginx
    tasks_from: site
  vars:
    nginx_site_args:
      subdomain: influxdb
      proxy_pass: http://127.0.0.1:{{ service_ports.influxdb }}/
      auth: true
  tags:
    - influxdb
