# Emulate a timer helper creating the collector directory before netdata is
# installed. The isolated role test must not hide a fresh-host dependency on
# the netdata user, which is created later in the site play.

- name: _setup | Create netdata systemd_timers collector dir
  file:
    path: /etc/netdata/charts.d/systemd_timers.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true
