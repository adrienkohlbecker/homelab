- name: Install unattended-upgrades
  apt:
    pkg:
      # provides /var/run/reboot-required sentinel (consumed by site.yml
      # reboot check, boot, firewall, DNS reboot guard, etc.)
      - update-notifier-common
      - unattended-upgrades
    cache_valid_time: 3600
    lock_timeout: 300
  become: true
  register: unattended_upgrades_apt
  tags:
    - unattended_upgrades

- name: Configure unattended-upgrades
  copy:
    src: "{{ item }}"
    dest: /etc/apt/apt.conf.d/{{ item }}
    owner: root
    group: root
    mode: "0644"
    backup: true
    validate: 'apt-config dump -c %s'
  become: true
  loop:
    - 20auto-upgrades
    - 50unattended-upgrades
  register: unattended_upgrades_config
  tags:
    - unattended_upgrades

# The qemu test image masks the apt-daily pair during converge. This role owns
# both the package-list download and unattended-upgrade halves of the pipeline.
- name: Ensure unattended-upgrades timers are active
  when: not (ansible_check_mode and unattended_upgrades_apt.changed)
  systemd:
    name: "{{ item }}"
    masked: false
    state: started
    enabled: true
  become: true
  loop:
    - apt-daily.timer
    - apt-daily-upgrade.timer
  tags:
    - unattended_upgrades

- name: Validate unattended-upgrades config
  when: unattended_upgrades_config.changed
  command: unattended-upgrades --dry-run --verbose
  changed_when: false
  timeout: 120
  become: true
  tags:
    - unattended_upgrades

# The collector only needs read access, so metadata can be installed before
# netdata without creating its service identity ahead of the package.
- name: Ensure the systemd_timers metadata directory exists
  file:
    path: /etc/netdata/charts.d/systemd_timers.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true
  tags:
    - unattended_upgrades

# Mail "root" only reports failed runs; this heartbeat also detects a timer
# that is disabled or never fires. The collector alerts after 2 * period_secs.
- name: Register apt-daily-upgrade.timer for netdata overdue monitoring
  # On a fresh check-mode run the directory above is not actually created.
  when: not ansible_check_mode
  copy:
    dest: /etc/netdata/charts.d/systemd_timers.d/apt-daily-upgrade.conf
    content: |
      # Managed by ansible roles/unattended_upgrades/tasks/main.yml.
      # Consumed by /usr/libexec/netdata/charts.d/systemd_timers.chart.sh.
      # period_secs is apt-daily-upgrade.timer's daily cadence
      # (OnCalendar=*-*-* 6:00); RandomizedDelaySec jitter is absorbed by the
      # collector's 2 * period grace.
      period_secs=86400
    owner: root
    group: root
    mode: "0644"
    backup: true
    validate: 'sh -c ''. "%s" && test "${period_secs:-0}" -gt 0'''
  become: true
  tags:
    - unattended_upgrades
