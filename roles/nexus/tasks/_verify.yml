---
- name: _verify | Exercise nexus fluent-bit record contracts
  import_role:
    name: fluentbit
    tasks_from: verify_extension
  vars:
    fluentbit_verify_args:
      name: nexus
      records:
        - MESSAGE: '{"level":"WARN","threadName":"verify-thread","loggerName":"org.sonatype.nexus.Verify","mdc":{"userId":"*TASK"},"formattedMessage":"nexus-valid","throwable":{"className":"java.lang.IllegalStateException","message":"boom"},"parser_status":"forged","service":"attribute"}'
          CONTAINER_TAG: nexus
          SYSLOG_IDENTIFIER: conmon
          SYSTEMD_UNIT: nexus.service
        - MESSAGE: nexus-raw
          CONTAINER_TAG: nexus
          SYSLOG_IDENTIFIER: conmon
          SYSTEMD_UNIT: nexus.service
        - MESSAGE: '{"level":"WARN","formattedMessage":"broken"'
          CONTAINER_TAG: nexus
          SYSLOG_IDENTIFIER: conmon
          SYSTEMD_UNIT: nexus.service
        - MESSAGE: '{"level":"WARN","threadName":"verify-thread","loggerName":"org.sonatype.nexus.Verify","formattedMes'
          CONTAINER_ID_FULL: '1111111111111111111111111111111111111111111111111111111111111111'
          CONTAINER_PARTIAL_MESSAGE: 'true'
          CONTAINER_TAG: nexus
          PRIORITY: '6'
          SYSLOG_IDENTIFIER: conmon
          SYSTEMD_UNIT: nexus.service
        - MESSAGE: 'sage":"nexus-partial","throwable":{"className":"java.lang.IllegalStateException","message":"split-bo'
          CONTAINER_ID_FULL: '1111111111111111111111111111111111111111111111111111111111111111'
          CONTAINER_PARTIAL_MESSAGE: 'true'
          CONTAINER_TAG: nexus
          PRIORITY: '6'
          SYSLOG_IDENTIFIER: conmon
          SYSTEMD_UNIT: nexus.service
        - MESSAGE: 'om"}}'
          CONTAINER_ID_FULL: '1111111111111111111111111111111111111111111111111111111111111111'
          CONTAINER_TAG: nexus
          PRIORITY: '6'
          SYSLOG_IDENTIFIER: conmon
          SYSTEMD_UNIT: nexus.service
        - MESSAGE: '{"level":"ERROR","threadName":"systemd","loggerName":"systemd","formattedMessage":"must-not-parse"}'
          SYSLOG_IDENTIFIER: systemd
          SYSTEMD_UNIT: nexus.service
        - MESSAGE: '{"level":"ERROR","threadName":"quartz-1-thread-1","loggerName":"org.sonatype.nexus.quartz.internal.task.QuartzTaskInfo","formattedMessage":"Task ''nexus-task-failed'' [assetBlob.cleanup] state change RUNNING -> WAITING (FAILED)"}'
          CONTAINER_TAG: nexus
          SYSLOG_IDENTIFIER: conmon
          SYSTEMD_UNIT: nexus.service
        - MESSAGE: '{"level":"INFO","threadName":"quartz-1-thread-1","loggerName":"org.sonatype.nexus.cleanup.internal.task.CleanupTask","mdc":{"userId":"*TASK","taskIdAndDate":"repository.cleanup-20260712010000008"},"formattedMessage":"nexus-task-detail"}'
          CONTAINER_TAG: nexus
          SYSLOG_IDENTIFIER: conmon
          SYSTEMD_UNIT: nexus.service
        - MESSAGE: '{"level":"INFO","threadName":"qtp2132356553-1528","loggerName":"outboundRequests","formattedMessage":"[12/Jul/2026:08:53:12 +0000] - \"GET https://ports.ubuntu.com/ubuntu-ports/dists/noble/InRelease HTTP/1.1\" 304 0 312 45 [qtp2132356553-1528]"}'
          CONTAINER_TAG: nexus
          SYSLOG_IDENTIFIER: conmon
          SYSTEMD_UNIT: nexus.service
        - MESSAGE: '{"timestamp":"2026-07-12 00:00:00,009+0000","nodeId":"node-id","initiator":"admin/127.0.0.1","domain":"repository","type":"created","context":"nexus-audit-useful","thread":"qtp-1","attributes":{"name":"test-repository"}}'
          CONTAINER_TAG: nexus
          SYSLOG_IDENTIFIER: conmon
          SYSTEMD_UNIT: nexus.service
      expected:
        - message: nexus-valid
          level: warn
          service: nexus
          fields.parser_status: parsed
          fields.thread: verify-thread
          fields.source: org.sonatype.nexus.Verify
          fields.mdc.userId: '*TASK'
          fields.exception.className: java.lang.IllegalStateException
          fields.service: attribute
          _absent:
            - fields.formattedMessage
            - fields.level
            - fields.threadName
            - fields.loggerName
            - fields.throwable
        - message: nexus-raw
          level: info
          service: nexus
          _absent:
            - fields.parser_status
        - message: '{"level":"WARN","formattedMessage":"broken"'
          level: warn
          service: nexus
          parse_error: nexus_json
          fields.parser_status: failed
        - message: nexus-partial
          level: warn
          service: nexus
          fields.parser_status: parsed
          fields.source: org.sonatype.nexus.Verify
          fields.exception.className: java.lang.IllegalStateException
          fields.exception.message: split-boom
          _absent:
            - fields.CONTAINER_PARTIAL_MESSAGE
        - message: '{"level":"ERROR","threadName":"systemd","loggerName":"systemd","formattedMessage":"must-not-parse"}'
          service: systemd
          _absent:
            - fields.parser_status
            - fields.source
        - message: "Task 'nexus-task-failed' [assetBlob.cleanup] state change RUNNING -> WAITING (FAILED)"
          level: error
          service: nexus
          fields.parser_status: parsed
          fields.source: org.sonatype.nexus.quartz.internal.task.QuartzTaskInfo
        - message: nexus-task-detail
          level: info
          service: nexus
          fields.parser_status: parsed
          fields.source: org.sonatype.nexus.cleanup.internal.task.CleanupTask
          fields.mdc.taskIdAndDate: repository.cleanup-20260712010000008
        - message: '[12/Jul/2026:08:53:12 +0000] - "GET https://ports.ubuntu.com/ubuntu-ports/dists/noble/InRelease HTTP/1.1" 304 0 312 45 [qtp2132356553-1528]'
          level: debug
          service: nexus
          fields.parser_status: parsed
          fields.source: outboundRequests
          fields.method: GET
          fields.url: https://ports.ubuntu.com/ubuntu-ports/dists/noble/InRelease
          fields.protocol: HTTP/1.1
          fields.status: 304
          fields.bytes_sent: 0
          fields.bytes_received: 312
          fields.response_time: 45
        - message: nexus-audit-useful
          level: info
          service: nexus
          fields.parser_status: parsed
          fields.audit_domain: repository
          fields.event: created
          fields.actor: admin/127.0.0.1
          fields.thread: qtp-1
          fields.attributes.name: test-repository
          _absent:
            - fields.timestamp
            - fields.nodeId
            - fields.domain
            - fields.type
            - fields.initiator

- name: _verify | Routine nexus events are omitted
  assert:
    that:
      - "'nexus-task-failed' in fluentbit_verify_result.stdout"
      - "'nexus-audit-useful' in fluentbit_verify_result.stdout"

- name: _verify | Retired nexus log files remain absent
  stat:
    path: "{{ item }}"
  loop:
    - /mnt/services/nexus/data/log/nexus.log
    - /mnt/services/nexus/data/log/request.log
    - /mnt/services/nexus/data/log/outbound-request.log
    - /mnt/services/nexus/data/log/audit/audit.log
  register: _nexus_retired_log
  failed_when: _nexus_retired_log.stat.exists
  become: true

- name: _verify | Wait for parsed nexus application and audit output in lnav store
  command:
    argv:
      - python3
      - -c
      - |
        import json
        import sys

        application_seen = False
        audit_seen = False
        with open(sys.argv[1], encoding="utf-8") as handle:
            for line in handle:
                try:
                    record = json.loads(line)
                except json.JSONDecodeError:
                    continue
                fields = record.get("fields", {})
                if (
                    record.get("service") != "nexus"
                    or fields.get("parser_status") != "parsed"
                    or not record.get("message")
                ):
                    continue
                assert not (
                    record.get("level") == "info"
                    and fields.get("source")
                    == "org.sonatype.nexus.quartz.internal.task.QuartzTaskInfo"
                ), record
                if not application_seen and fields.get("source"):
                    assert "timestamp" not in fields, record
                    assert "formattedMessage" not in fields, record
                    application_seen = True
                if fields.get("audit_domain") and fields.get("event"):
                    audit_seen = True
        sys.exit(0 if application_seen and audit_seen else 1)
      - /var/log/fluent-bit/lnav.jsonl
  register: _nexus_lnav_records
  changed_when: false
  retries: 60
  delay: 2
  until: _nexus_lnav_records.rc == 0
  become: true

# Nexus creates this path as in-container uid 200. A broken +200 uidmap lands
# it on the wrong host uid and breaks container writes and ZFS portability.
- name: _verify | A Nexus-written path is owned by nexus (exercises the uidmap)
  stat:
    path: /mnt/services/nexus/data/log
  register: _nexus_written
  failed_when: not _nexus_written.stat.exists or _nexus_written.stat.pw_name != 'nexus'
  become: true

# End-to-end through the nginx vhost -- the production ingress every fleet
# host's apt/docker pulls traverse. The /etc/hosts mapping + validate_certs=false
# hits local nginx without real DNS; a jinja typo in proxy_pass, a missing
# proxy_set_header, or a dropped site would surface here.
#
# Map the vhost FQDN to loopback so SNI matches the served certificate.
# Probing https://localhost with a Host: header leaves SNI=localhost, which
# OpenSSL 3.x (noble/resolute) rejects as a fatal unrecognized_name alert
# (status -1); hitting the FQDN directly keeps SNI correct on every release.
- name: _verify | Map the nexus vhost FQDN to loopback for SNI-correct probing
  lineinfile:
    path: /etc/hosts
    line: "127.0.0.1 nexus.{{ inventory_hostname }}.{{ domain }}"
    state: present
  become: true

# Auth uses the bootstrap admin password Nexus writes on first boot -- the
# setup wizard never runs under test, so the file persists. Test-only.
- name: _verify | Read the bootstrap admin password
  slurp:
    src: /mnt/services/nexus/data/admin.password
  register: _nexus_admin_password
  become: true

# Nexus consumes the per-blobstore reconciliation file as durable state. Accept
# the EULA in this disposable VM, upload one object, and prove the dated file
# grows so replacing this appender with a console stream cannot regress again.
- name: _verify | Exercise authenticated Nexus APIs
  module_defaults:
    ansible.builtin.uri:
      url_username: admin
      url_password: "{{ _nexus_admin_password.content | b64decode }}"
      force_basic_auth: true
      timeout: 5
  block:
    - name: _verify | Read the disposable instance EULA status
      uri:
        url: http://127.0.0.1:{{ service_ports.nexus }}/service/rest/v1/system/eula
        return_content: true
        status_code: 200
      register: _nexus_eula

    - name: _verify | Accept the EULA on the disposable instance
      uri:
        url: http://127.0.0.1:{{ service_ports.nexus }}/service/rest/v1/system/eula
        method: POST
        body_format: json
        body:
          accepted: true
          disclaimer: "{{ _nexus_eula.json.disclaimer }}"
        status_code: [ 200, 204 ]
      when: not _nexus_eula.json.accepted

    - name: _verify | Create a throwaway raw hosted repo
      uri:
        url: http://127.0.0.1:{{ service_ports.nexus }}/service/rest/v1/repositories/raw/hosted
        method: POST
        body_format: json
        body:
          name: test_reconciliation
          online: true
          storage:
            blobStoreName: default
            strictContentTypeValidation: true
            writePolicy: ALLOW
          raw:
            contentDisposition: ATTACHMENT
        status_code: [ 201, 400 ]

    - name: _verify | Record the reconciliation log size before upload
      stat:
        path: /mnt/scratch/nexus/reconciliation/{{ ansible_date_time.date }}
      register: _nexus_reconciliation_before
      become: true

    - name: _verify | Upload a raw object to the default blob store
      uri:
        url: https://nexus.{{ inventory_hostname }}.{{ domain }}/repository/test_reconciliation/probe-{{ ansible_date_time.epoch }}.txt
        method: PUT
        validate_certs: false
        body: nexus reconciliation probe
        status_code: [ 201, 204 ]

    - name: _verify | Wait for the reconciliation log to record the upload
      stat:
        path: /mnt/scratch/nexus/reconciliation/{{ ansible_date_time.date }}
      register: _nexus_reconciliation_after
      retries: 10
      delay: 1
      until:
        - _nexus_reconciliation_after.stat.exists
        - _nexus_reconciliation_after.stat.size > (_nexus_reconciliation_before.stat.size | default(0))
      become: true

    # Production Docker repositories use Nexus's native path-based routing. The
    # qemu fixture has none, so create a throwaway hosted repository with the same
    # setting and prove its /v2/<repository>/ API is reachable through nginx.
    - name: _verify | Create a throwaway docker hosted repo
      uri:
        url: http://127.0.0.1:{{ service_ports.nexus }}/service/rest/v1/repositories/docker/hosted
        method: POST
        body_format: json
        body:
          name: test_docker_mirror
          online: true
          storage:
            blobStoreName: default
            strictContentTypeValidation: true
            writePolicy: ALLOW
          docker:
            v1Enabled: false
            forceBasicAuth: true
            pathEnabled: true
        status_code: [ 201, 400 ]  # 400 == repo already exists on a _verify re-run

    # The auth outcome does not matter. Docker-Distribution-Api-Version is present
    # only when Nexus routed the request to the repository's registry-v2 endpoint.
    - name: _verify | Native Docker path reaches the repo's registry-v2 base
      uri:
        url: https://nexus.{{ inventory_hostname }}.{{ domain }}/v2/test_docker_mirror/
        validate_certs: false
        status_code: [ 200, 401, 403 ]  # docker v2 auth challenge; a 404 would mean routing is missing
      register: _nexus_docker_rewrite
      retries: 5
      delay: 2
      until: (_nexus_docker_rewrite.docker_distribution_api_version | default('')) == 'registry/2.0'
