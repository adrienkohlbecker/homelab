---
# Ownership-of-uidmap-target checks. Nexus runs as in-container uid 200
# mapped to the host `nexus` user (--uidmap=+200:<uid>:1); a regression in
# that mapping would land files on the wrong host uid and break ZFS
# replication portability + the container's write access to its volumes.
- name: _verify | Nexus data dir is owned by nexus
  stat:
    path: /mnt/services/nexus/data
  register: _nexus_data_dir
  failed_when: not _nexus_data_dir.stat.exists or _nexus_data_dir.stat.pw_name != 'nexus'
  become: true

- name: _verify | Nexus user dir is owned by nexus
  stat:
    path: /mnt/services/nexus/user
  register: _nexus_user_dir
  failed_when: not _nexus_user_dir.stat.exists or _nexus_user_dir.stat.pw_name != 'nexus'
  become: true

- name: _verify | Nexus blob store dir is owned by nexus
  stat:
    path: /mnt/scratch/nexus
  register: _nexus_blob_dir
  failed_when: not _nexus_blob_dir.stat.exists or _nexus_blob_dir.stat.pw_name != 'nexus'
  become: true

# Functional probe over the published loopback port. status/writable returns
# 200 only once Nexus has fully booted and its DB is writable -- the same
# contract the container healthcheck gates on. A broken converge (bad
# encryption.json, JVM OOM, wrong volume) surfaces here rather than as a
# tautological "data dir is non-empty" check. Converge already blocks on
# --sdnotify=healthy, so this is normally 200 on the first try; the retry
# budget is belt-and-suspenders.
- name: _verify | Nexus answers writable-status on its loopback port
  uri:
    url: http://127.0.0.1:{{ service_ports.nexus }}/service/rest/v1/status/writable
    status_code: 200
    timeout: 5
  register: _nexus_status
  retries: 60
  delay: 2
  until: _nexus_status.status == 200

- name: _verify | Exercise nexus fluent-bit record contracts
  import_role:
    name: fluentbit
    tasks_from: verify_extension
  vars:
    fluentbit_verify_args:
      name: nexus
      records:
        - MESSAGE: '{"level":"WARN","threadName":"verify-thread","loggerName":"org.sonatype.nexus.Verify","mdc":{"userId":"*TASK"},"formattedMessage":"nexus-valid","throwable":{"className":"java.lang.IllegalStateException","message":"boom"},"parser_status":"forged","service":"attribute"}'
          CONTAINER_TAG: nexus
          SYSLOG_IDENTIFIER: conmon
          SYSTEMD_UNIT: nexus.service
        - MESSAGE: nexus-raw
          CONTAINER_TAG: nexus
          SYSLOG_IDENTIFIER: conmon
          SYSTEMD_UNIT: nexus.service
        - MESSAGE: '{"level":"WARN","formattedMessage":"broken"'
          CONTAINER_TAG: nexus
          SYSLOG_IDENTIFIER: conmon
          SYSTEMD_UNIT: nexus.service
        - MESSAGE: '{"level":"ERROR","threadName":"systemd","loggerName":"systemd","formattedMessage":"must-not-parse"}'
          SYSLOG_IDENTIFIER: systemd
          SYSTEMD_UNIT: nexus.service
      expected:
        - message: nexus-valid
          level: warn
          service: nexus
          fields.parser_status: parsed
          fields.thread: verify-thread
          fields.source: org.sonatype.nexus.Verify
          fields.mdc.userId: '*TASK'
          fields.exception.className: java.lang.IllegalStateException
          fields.service: attribute
          _absent:
            - fields.formattedMessage
            - fields.level
            - fields.threadName
            - fields.loggerName
            - fields.throwable
        - message: nexus-raw
          level: info
          service: nexus
          _absent:
            - fields.parser_status
        - message: '{"level":"WARN","formattedMessage":"broken"'
          level: warn
          service: nexus
          parse_error: nexus_json
          fields.parser_status: failed
        - message: '{"level":"ERROR","threadName":"systemd","loggerName":"systemd","formattedMessage":"must-not-parse"}'
          service: systemd
          _absent:
            - fields.parser_status
            - fields.source

- name: _verify | Wait for parsed nexus startup output in lnav store
  command:
    argv:
      - python3
      - -c
      - |
        import json
        import sys

        with open(sys.argv[1], encoding="utf-8") as handle:
            for line in handle:
                try:
                    record = json.loads(line)
                except json.JSONDecodeError:
                    continue
                fields = record.get("fields", {})
                if (
                    record.get("service") == "nexus"
                    and fields.get("parser_status") == "parsed"
                    and fields.get("source")
                    and record.get("message")
                ):
                    assert "timestamp" not in fields, record
                    assert "formattedMessage" not in fields, record
                    print(json.dumps(record, sort_keys=True))
                    sys.exit(0)
        sys.exit(1)
      - /var/log/fluent-bit/lnav.jsonl
  register: _nexus_lnav_record
  changed_when: false
  retries: 30
  delay: 2
  until: _nexus_lnav_record.rc == 0
  become: true

# The dir-ownership checks above stat paths the role itself chowned, so they
# pass even if the +200 uidmap regressed. This one stats a path Nexus wrote
# as in-container uid 200 (its log dir, created on boot) -- a broken mapping
# lands these files on the wrong host uid and the owner here won't be `nexus`.
- name: _verify | A Nexus-written path is owned by nexus (exercises the uidmap)
  stat:
    path: /mnt/services/nexus/data/log
  register: _nexus_written
  failed_when: not _nexus_written.stat.exists or _nexus_written.stat.pw_name != 'nexus'
  become: true

# End-to-end through the nginx vhost -- the production ingress every fleet
# host's apt/docker/pypi pulls traverse. The /etc/hosts mapping + validate_certs=false
# hits local nginx without real DNS; a jinja typo in proxy_pass, a missing
# proxy_set_header, or a dropped site would surface here.
#
# Map the vhost FQDN to loopback so SNI matches the served certificate.
# Probing https://localhost with a Host: header leaves SNI=localhost, which
# OpenSSL 3.x (noble/resolute) rejects as a fatal unrecognized_name alert
# (status -1); hitting the FQDN directly keeps SNI correct on every release.
- name: _verify | Map the nexus vhost FQDN to loopback for SNI-correct probing
  lineinfile:
    path: /etc/hosts
    line: "127.0.0.1 nexus.{{ inventory_hostname }}.{{ domain }}"
    state: present
  become: true

- name: _verify | Nexus UI answers through the nginx site
  uri:
    url: https://nexus.{{ inventory_hostname }}.{{ domain }}/
    validate_certs: false
    follow_redirects: none
    status_code: [ 200, 302, 307 ]
    timeout: 5
  register: _nexus_nginx
  retries: 30
  delay: 2
  until: _nexus_nginx.status in [ 200, 302, 307 ]

# The docker-registry mirror is an nginx rewrite (roles/nexus main.yml
# server_conf): podman emits /v2/repository/<repo>/<image>/... and nginx
# swaps it to Nexus's /repository/<repo>/v2/<image>/... layout. Prod's docker
# proxy repos are terraform-created; the qemu fixture has none, so create a
# throwaway docker hosted repo and prove the rewrite reaches its registry-v2
# base. Without the rewrite the un-swapped path falls through to `location /`
# and Nexus 404s it, so a 200/401 (not 404) is the signal the rewrite fired.
# Auth uses the bootstrap admin password Nexus writes on first boot -- the
# setup wizard never runs under test, so the file persists. Test-only.
- name: _verify | Read the bootstrap admin password
  slurp:
    src: /mnt/services/nexus/data/admin.password
  register: _nexus_admin_password
  become: true

- name: _verify | Create a throwaway docker hosted repo
  uri:
    url: http://127.0.0.1:{{ service_ports.nexus }}/service/rest/v1/repositories/docker/hosted
    method: POST
    url_username: admin
    url_password: "{{ _nexus_admin_password.content | b64decode }}"
    force_basic_auth: true
    body_format: json
    body:
      name: test_docker_mirror
      online: true
      storage:
        blobStoreName: default
        strictContentTypeValidation: true
        writePolicy: ALLOW
      docker:
        v1Enabled: false
        forceBasicAuth: true
    status_code: [ 201, 400 ]  # 400 == repo already exists on a _verify re-run
    timeout: 5

# The probe gets a 403 (Nexus's docker bearer realm declines admin basic
# auth) -- the auth outcome doesn't matter. The signal is the response
# header: Docker-Distribution-Api-Version is set *only* on Nexus's
# /repository/<repo>/v2/ responses, so its presence proves nginx rewrote
# /v2/repository/<repo>/ to that path. Without the rewrite the request falls
# through to `location /`, Nexus 404s it, and the header is absent.
- name: _verify | Docker-mirror rewrite reaches the repo's registry-v2 base
  uri:
    url: https://nexus.{{ inventory_hostname }}.{{ domain }}/v2/repository/test_docker_mirror/
    validate_certs: false
    url_username: admin
    url_password: "{{ _nexus_admin_password.content | b64decode }}"
    force_basic_auth: true
    status_code: [ 200, 401, 403 ]  # docker v2 auth challenge; a 404 would mean the rewrite is missing
    timeout: 5
  register: _nexus_docker_rewrite
  retries: 5
  delay: 2
  until: (_nexus_docker_rewrite.docker_distribution_api_version | default('')) == 'registry/2.0'
