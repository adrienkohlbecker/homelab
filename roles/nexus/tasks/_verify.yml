---
# Ownership-of-uidmap-target checks. Nexus runs as in-container uid 200
# mapped to the host `nexus` user (--uidmap=+200:<uid>:1); a regression in
# that mapping would land files on the wrong host uid and break ZFS
# replication portability + the container's write access to its volumes.
- name: _verify | Nexus data dir is owned by nexus
  stat:
    path: /mnt/services/nexus/data
  register: _nexus_data_dir
  failed_when: not _nexus_data_dir.stat.exists or _nexus_data_dir.stat.pw_name != 'nexus'
  become: true

- name: _verify | Nexus user dir is owned by nexus
  stat:
    path: /mnt/services/nexus/user
  register: _nexus_user_dir
  failed_when: not _nexus_user_dir.stat.exists or _nexus_user_dir.stat.pw_name != 'nexus'
  become: true

- name: _verify | Nexus blob store dir is owned by nexus
  stat:
    path: /mnt/scratch/nexus
  register: _nexus_blob_dir
  failed_when: not _nexus_blob_dir.stat.exists or _nexus_blob_dir.stat.pw_name != 'nexus'
  become: true

# Functional probe over the published loopback port. status/writable returns
# 200 only once Nexus has fully booted and its DB is writable -- the same
# contract the container healthcheck gates on. A broken converge (bad
# encryption.json, JVM OOM, wrong volume) surfaces here rather than as a
# tautological "data dir is non-empty" check. Converge already blocks on
# --sdnotify=healthy, so this is normally 200 on the first try; the retry
# budget is belt-and-suspenders.
- name: _verify | Nexus answers writable-status on its loopback port
  uri:
    url: http://127.0.0.1:{{ service_ports.nexus }}/service/rest/v1/status/writable
    status_code: 200
    timeout: 5
  register: _nexus_status
  retries: 60
  delay: 2
  until: _nexus_status.status == 200

- name: _verify | Exercise nexus fluent-bit record contracts
  import_role:
    name: fluentbit
    tasks_from: verify_extension
  vars:
    fluentbit_verify_args:
      name: nexus
      records:
        - MESSAGE: '{"level":"WARN","threadName":"verify-thread","loggerName":"org.sonatype.nexus.Verify","mdc":{"userId":"*TASK"},"formattedMessage":"nexus-valid","throwable":{"className":"java.lang.IllegalStateException","message":"boom"},"parser_status":"forged","service":"attribute"}'
          CONTAINER_TAG: nexus
          SYSLOG_IDENTIFIER: conmon
          SYSTEMD_UNIT: nexus.service
        - MESSAGE: nexus-raw
          CONTAINER_TAG: nexus
          SYSLOG_IDENTIFIER: conmon
          SYSTEMD_UNIT: nexus.service
        - MESSAGE: '{"level":"WARN","formattedMessage":"broken"'
          CONTAINER_TAG: nexus
          SYSLOG_IDENTIFIER: conmon
          SYSTEMD_UNIT: nexus.service
        - MESSAGE: '{"level":"WARN","threadName":"verify-thread","loggerName":"org.sonatype.nexus.Verify","formattedMes'
          CONTAINER_ID_FULL: '1111111111111111111111111111111111111111111111111111111111111111'
          CONTAINER_PARTIAL_MESSAGE: 'true'
          CONTAINER_TAG: nexus
          PRIORITY: '6'
          SYSLOG_IDENTIFIER: conmon
          SYSTEMD_UNIT: nexus.service
        - MESSAGE: 'sage":"nexus-partial","throwable":{"className":"java.lang.IllegalStateException","message":"split-bo'
          CONTAINER_ID_FULL: '1111111111111111111111111111111111111111111111111111111111111111'
          CONTAINER_PARTIAL_MESSAGE: 'true'
          CONTAINER_TAG: nexus
          PRIORITY: '6'
          SYSLOG_IDENTIFIER: conmon
          SYSTEMD_UNIT: nexus.service
        - MESSAGE: 'om"}}'
          CONTAINER_ID_FULL: '1111111111111111111111111111111111111111111111111111111111111111'
          CONTAINER_TAG: nexus
          PRIORITY: '6'
          SYSLOG_IDENTIFIER: conmon
          SYSTEMD_UNIT: nexus.service
        - MESSAGE: '{"level":"ERROR","threadName":"systemd","loggerName":"systemd","formattedMessage":"must-not-parse"}'
          SYSLOG_IDENTIFIER: systemd
          SYSTEMD_UNIT: nexus.service
        - MESSAGE: '{"level":"INFO","threadName":"quartz-1-thread-1","loggerName":"org.sonatype.nexus.quartz.internal.task.QuartzTaskInfo","formattedMessage":"Task ''nexus-routine-success'' [assetBlob.cleanup] state change RUNNING -> WAITING (OK)"}'
          CONTAINER_TAG: nexus
          SYSLOG_IDENTIFIER: conmon
          SYSTEMD_UNIT: nexus.service
        - MESSAGE: '{"level":"ERROR","threadName":"quartz-1-thread-1","loggerName":"org.sonatype.nexus.quartz.internal.task.QuartzTaskInfo","formattedMessage":"Task ''nexus-task-failed'' [assetBlob.cleanup] state change RUNNING -> WAITING (FAILED)"}'
          CONTAINER_TAG: nexus
          SYSLOG_IDENTIFIER: conmon
          SYSTEMD_UNIT: nexus.service
        - MESSAGE: '{"level":"INFO","threadName":"quartz-1-thread-1","loggerName":"org.sonatype.nexus.cleanup.internal.task.CleanupTask","mdc":{"userId":"*TASK","taskIdAndDate":"repository.cleanup-20260712010000008"},"formattedMessage":"nexus-task-detail"}'
          CONTAINER_TAG: nexus
          SYSLOG_IDENTIFIER: conmon
          SYSTEMD_UNIT: nexus.service
        - MESSAGE: '{"level":"INFO","threadName":"replication-1","loggerName":"org.sonatype.nexus.replication.internal.ReplicationTask","mdc":{"repositoryName":"nexus-releases"},"formattedMessage":"nexus-replication-detail"}'
          CONTAINER_TAG: nexus
          SYSLOG_IDENTIFIER: conmon
          SYSTEMD_UNIT: nexus.service
        - MESSAGE: '{"level":"INFO","threadName":"quartz-1-thread-1","loggerName":"blobstore-reconciliation-log","mdc":{"blobstore-reconciliation-path":"/nexus-data/blobs/default/reconciliation"},"formattedMessage":"nexus-reconciliation-detail"}'
          CONTAINER_TAG: nexus
          SYSLOG_IDENTIFIER: conmon
          SYSTEMD_UNIT: nexus.service
        - MESSAGE: '{"level":"INFO","threadName":"quartz-1-thread-1","loggerName":"blobstore-reconciliation-log","mdc":{"blobstore-reconciliation-path":"/nexus-data/blobs/default/reconciliation"},"formattedMessage":"11111111-1111-1111-1111-111111111111,true"}'
          CONTAINER_TAG: nexus
          SYSLOG_IDENTIFIER: conmon
          SYSTEMD_UNIT: nexus.service
          marker: nexus-reconciliation-success-drop
        - MESSAGE: '{"level":"WARN","threadName":"quartz-1-thread-1","loggerName":"blobstore-reconciliation-log","mdc":{"blobstore-reconciliation-path":"/nexus-data/blobs/default/reconciliation"},"formattedMessage":"22222222-2222-2222-2222-222222222222,false"}'
          CONTAINER_TAG: nexus
          SYSLOG_IDENTIFIER: conmon
          SYSTEMD_UNIT: nexus.service
        - MESSAGE: '{"level":"INFO","threadName":"qtp-1","loggerName":"org.eclipse.jetty.server.RequestLog","formattedMessage":"[0:0:0:0:0:0:0:1] - - [12/Jul/2026:00:00:01 +0000] \"GET /service/rest/v1/status/writable HTTP/1.1\" 200 - 0 0 \"Wget\" [qtp-1]"}'
          CONTAINER_TAG: nexus
          SYSLOG_IDENTIFIER: conmon
          SYSTEMD_UNIT: nexus.service
        - MESSAGE: '{"level":"INFO","threadName":"qtp-2","loggerName":"org.eclipse.jetty.server.RequestLog","formattedMessage":"[0:0:0:0:0:0:0:1] - - [12/Jul/2026:00:00:02 +0000] \"GET /service/rest/v1/status/writable HTTP/1.1\" 503 - 0 1 \"Wget\" [qtp-2]"}'
          CONTAINER_TAG: nexus
          SYSLOG_IDENTIFIER: conmon
          SYSTEMD_UNIT: nexus.service
        - MESSAGE: '{"level":"INFO","threadName":"qtp-3","loggerName":"org.eclipse.jetty.server.RequestLog","formattedMessage":"10.89.0.1 - anonymous [12/Jul/2026:00:00:03 +0000] \"GET /repository/ubuntu/dists/noble/InRelease HTTP/1.1\" 200 - 126904 12 \"Debian APT-HTTP/1.3\" [qtp-3]"}'
          CONTAINER_TAG: nexus
          SYSLOG_IDENTIFIER: conmon
          SYSTEMD_UNIT: nexus.service
        - MESSAGE: '{"level":"INFO","threadName":"qtp2132356553-1528","loggerName":"outboundRequests","formattedMessage":"[12/Jul/2026:08:53:12 +0000] - \"GET https://ports.ubuntu.com/ubuntu-ports/dists/noble/InRelease HTTP/1.1\" 304 0 312 45 [qtp2132356553-1528]"}'
          CONTAINER_TAG: nexus
          SYSLOG_IDENTIFIER: conmon
          SYSTEMD_UNIT: nexus.service
        - MESSAGE: '{"timestamp":"2026-07-12 00:00:00,009+0000","nodeId":"node-id","initiator":"*TASK","domain":"tasks","type":"finished","context":"nexus-audit-routine","thread":"quartz-1-thread-1","attributes":{"endState":"OK"}}'
          CONTAINER_TAG: nexus
          SYSLOG_IDENTIFIER: conmon
          SYSTEMD_UNIT: nexus.service
        - MESSAGE: '{"timestamp":"2026-07-12 00:00:00,009+0000","nodeId":"node-id","initiator":"anonymous/127.0.0.1","domain":"repository.asset","type":"updated-downloaded","context":"nexus-audit-asset","thread":"qtp-1","attributes":{"repositoryName":"ubuntu"}}'
          CONTAINER_TAG: nexus
          SYSLOG_IDENTIFIER: conmon
          SYSTEMD_UNIT: nexus.service
        - MESSAGE: '{"timestamp":"2026-07-12 00:00:00,009+0000","nodeId":"node-id","initiator":"admin/127.0.0.1","domain":"repository","type":"created","context":"nexus-audit-useful","thread":"qtp-1","attributes":{"name":"test-repository"}}'
          CONTAINER_TAG: nexus
          SYSLOG_IDENTIFIER: conmon
          SYSTEMD_UNIT: nexus.service
      expected:
        - message: nexus-valid
          level: warn
          service: nexus
          fields.parser_status: parsed
          fields.thread: verify-thread
          fields.source: org.sonatype.nexus.Verify
          fields.mdc.userId: '*TASK'
          fields.exception.className: java.lang.IllegalStateException
          fields.service: attribute
          _absent:
            - fields.formattedMessage
            - fields.level
            - fields.threadName
            - fields.loggerName
            - fields.throwable
        - message: nexus-raw
          level: info
          service: nexus
          _absent:
            - fields.parser_status
        - message: '{"level":"WARN","formattedMessage":"broken"'
          level: warn
          service: nexus
          parse_error: nexus_json
          fields.parser_status: failed
        - message: nexus-partial
          level: warn
          service: nexus
          fields.parser_status: parsed
          fields.source: org.sonatype.nexus.Verify
          fields.exception.className: java.lang.IllegalStateException
          fields.exception.message: split-boom
          _absent:
            - fields.CONTAINER_PARTIAL_MESSAGE
        - message: '{"level":"ERROR","threadName":"systemd","loggerName":"systemd","formattedMessage":"must-not-parse"}'
          service: systemd
          _absent:
            - fields.parser_status
            - fields.source
        - message: "Task 'nexus-task-failed' [assetBlob.cleanup] state change RUNNING -> WAITING (FAILED)"
          level: error
          service: nexus
          fields.parser_status: parsed
          fields.source: org.sonatype.nexus.quartz.internal.task.QuartzTaskInfo
        - message: nexus-task-detail
          level: info
          service: nexus
          fields.parser_status: parsed
          fields.source: org.sonatype.nexus.cleanup.internal.task.CleanupTask
          fields.mdc.taskIdAndDate: repository.cleanup-20260712010000008
        - message: nexus-replication-detail
          level: info
          service: nexus
          fields.parser_status: parsed
          fields.source: org.sonatype.nexus.replication.internal.ReplicationTask
          fields.mdc.repositoryName: nexus-releases
        - message: nexus-reconciliation-detail
          level: info
          service: nexus
          fields.parser_status: parsed
          fields.source: blobstore-reconciliation-log
          fields.mdc.blobstore-reconciliation-path: /nexus-data/blobs/default/reconciliation
        - message: 22222222-2222-2222-2222-222222222222,false
          level: warn
          service: nexus
          fields.source: blobstore-reconciliation-log
        - message: '[0:0:0:0:0:0:0:1] - - [12/Jul/2026:00:00:02 +0000] "GET /service/rest/v1/status/writable HTTP/1.1" 503 - 0 1 "Wget" [qtp-2]'
          level: debug
