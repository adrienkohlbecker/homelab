- name: Require nexus encryption secrets to be set
  assert:
    that:
      - nexus_encryption_key is defined and nexus_encryption_key | length > 0
      - nexus_encryption_salt is defined and nexus_encryption_salt | length > 0
      - nexus_encryption_iv is defined and nexus_encryption_iv | length > 0
    fail_msg: >-
      nexus_encryption_{key,salt,iv} must be set in group_vars/prod.yml
      (vaulted with --encrypt-vault-id prod) or group_vars/test.yml. They
      seed Nexus's at-rest secret encryption; see
      roles/nexus/templates/encryption.json.j2.
  tags:
    - nexus

- name: Set up nexus system user and group
  import_role:
    name: service_user
    tasks_from: user
  vars:
    service_user_args:
      name: nexus
  tags:
    - nexus

- name: Create nexus directories
  when: not ansible_check_mode or nexus_user.uid is defined
  file:
    path: "{{ item.path }}"
    state: directory
    owner: nexus
    group: nexus
    mode: "{{ item.mode }}"
  become: true
  loop:
    - path: /mnt/services/nexus/data
      mode: "0755"
    - path: /mnt/services/nexus/user
      mode: "0755"
    - path: /mnt/scratch/nexus
      mode: "0750"
  loop_control:
    label: "{{ item.path }}"
  tags:
    - nexus

- name: Read any existing nexus encryption key for comparison
  slurp:
    src: /mnt/services/nexus/user/encryption.json
  register: nexus_encryption_existing
  failed_when: false
  become: true
  tags:
    - nexus

# Nexus reads NEXUS_SECRETS_KEY_FILE once at JVM start and re-encrypting the
# at-rest secrets it already wrote is a manual procedure, so a key that
# changes after first provisioning can't be applied by a restart. Refuse
# BEFORE overwriting the file: leaving the old key on disk keeps the running
# container decryptable, whereas writing a new key would arm the next restart
# (Restart=always, reboot, crash) to load it and fail to decrypt every stored
# secret. Compare parsed JSON so a mode/owner-only change doesn't false-trip.
# First converge has no file yet -- the slurp above soft-fails, so .content
# is undefined and we fall straight through to the template.
- name: Fail if the nexus encryption material would change in place
  when: >-
    nexus_encryption_existing.content is defined
    and (nexus_encryption_existing.content | b64decode | trim | from_json)
        != (lookup('template', 'encryption.json.j2') | from_json)
  fail:
    msg: >-
      encryption.json would change on an already-provisioned host. Rotating
      nexus_encryption_{key,salt,iv} in place breaks decryption of Nexus's
      existing at-rest secrets; the on-disk key was left untouched so the
      running container stays decryptable. Follow Sonatype's re-encryption
      procedure instead.
  tags:
    - nexus

- name: Configure nexus encryption
  when: not ansible_check_mode or nexus_user.uid is defined
  template:
    src: encryption.json.j2
    dest: /mnt/services/nexus/user/encryption.json
    owner: nexus
    group: nexus
    mode: "0600"
    backup: true
    validate: python3 -c 'import json,sys; json.load(open(sys.argv[1]))' "%s"
  become: true
  tags:
    - nexus

# Nexus ships Logback's JsonEncoder, so application, task, replication, and
# outbound-request events can share one structured stdout path. Audit events
# are already JSON. Manage the complete pinned-image config because Nexus's
# data-dir override is for logger levels, not appenders; the read-only bind
# mount below replaces the installation config without modifying the image.
- name: Configure nexus structured console logging
  when: not ansible_check_mode or nexus_user.uid is defined
  copy:
    src: logback.xml
    dest: /mnt/services/nexus/user/logback.xml
    owner: nexus
    group: nexus
    mode: "0644"
    backup: true
    validate: python3 -c 'import sys,xml.etree.ElementTree as e; e.parse(sys.argv[1])' "%s"
  register: nexus_logback
  become: true
  tags:
    - nexus

- name: Install nexus fluent-bit extension
  import_role:
    name: fluentbit
    tasks_from: extension
  vars:
    fluentbit_extension_args:
      name: nexus
  tags:
    - nexus

- name: Create nexus podman network
  when: not ansible_check_mode
  containers.podman.podman_network:
    name: nexus
    disable_dns: false
    state: present
  register: nexus_network
  become: true
  tags:
    - nexus

- name: Pull nexus image
  import_role:
    name: podman
    tasks_from: image
  vars:
    podman_image_args:
      name: nexus
      image: "{{ nexus_image }}"
  tags:
    - nexus

- name: Manage nexus service
  import_role:
    name: systemd_unit
    tasks_from: unit
  vars:
    systemd_unit_args:
      src: nexus.service.j2
      condition: "{{ not ansible_check_mode or nexus_user.uid is defined }}"
      restart: "{{ nexus_network.changed or nexus_logback.changed }}"
  tags:
    - nexus

- name: Configure nginx
  import_role:
    name: nginx
    tasks_from: site
  vars:
    nginx_site_args:
      subdomain: nexus
      proxy_pass: http://127.0.0.1:{{ service_ports.nexus }}/
      enable_http: true
      # Stream large artifact transfers (Ubuntu ISOs, cloud images, docker
      # layers) without nginx buffering to disk or capping the body. Cold-
      # cache fetches of upstream proxies (e.g. cdimage.ubuntu.com) can
      # take minutes; the default 60s read timeout cuts them off mid-pull.
      location_conf: |
        proxy_buffering off;
        proxy_request_buffering off;
        client_max_body_size 0;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
  tags:
    - nexus
