- name: _setup | Install podman
  import_role:
    name: podman
    tasks_from: install

- name: _setup | Install nginx
  import_role:
    name: nginx
    tasks_from: test_fixture
  vars:
    nginx_test_fixture_args:
      subdomains:
        - nexus

- name: _setup | Install fluent-bit for structured-log integration
  import_role:
    name: fluentbit
    tasks_from: configure
