# Assertions for state set up by packer/scripts/{provision,chroot}.sh.
# Run automatically by test/testrole.py after the role-apply +
# idempotence passes. Add new assertions here as packer code grows.

# The harness's first boot is the shipped rEFInd's first: the baked NVRAM has
# no PreviousBoot yet. This reboot is its second, the boot that ASSERTs under
# stock aarch64 edk2 with rEFInd 0.13.2 (see refind_noble_release and
# chroot.sh). The checks below do not depend on it.
- name: _verify | Boot the shipped rEFInd a second time
  import_role:
    name: reboot
    tasks_from: reboot

# --- ESP fundamentals (universal across Lab and Pug) ---

# The everyday rEFInd -> ZBM path is proven by the boot itself; the firmware
# fallback loader is not, so check it is present.
- name: _verify | Firmware fallback loader is present and non-empty
  stat:
    path: /boot/efi/EFI/BOOT/BOOT{{ 'AA64' if ansible_architecture == 'aarch64' else 'X64' }}.EFI
  register: packer_verify_fallback_loader
  failed_when: >-
    not packer_verify_fallback_loader.stat.exists
    or packer_verify_fallback_loader.stat.size == 0
  become: true

# --- NVRAM Boot entries (rEFInd) ---

- name: _verify | Read NVRAM Boot entries via efibootmgr
  command: efibootmgr -v
  changed_when: false
  register: packer_verify_efibootmgr
  become: true

# The first entry is the everyday boot path. The firmware-fallback
# BOOT<arch>.EFI checked above is only the degraded recovery path.
- name: _verify | First BootOrder entry resolves to rEFInd
  vars:
    _bo_first: >-
      {{ (packer_verify_efibootmgr.stdout_lines
          | select('match', '^BootOrder:')
          | first | default(''))
          | regex_replace('^BootOrder:\s*', '')
          | split(',') | first | default('') }}
    _bo_first_line: >-
      {{ packer_verify_efibootmgr.stdout_lines
         | select('match', '^Boot' ~ _bo_first ~ '\*?\s')
         | first | default('') }}
  assert:
    that:
      - _bo_first | length > 0
      - "'EFI\\\\refind\\\\' in _bo_first_line"
    fail_msg: >-
      First BootOrder entry (Boot{{ _bo_first }}) does not resolve to rEFInd:
      {{ _bo_first_line }}

# --- mdadm-EFI multi-disk variants (lab variant) ---
#
# chroot.sh's LAYOUT=mirror branch builds an mdadm RAID1 EFI mirror
# (/dev/md/efi) across the OS disks, a RAID1 /dev/md/swap, and a RAID5
# /dev/md/podman when PODMAN_SIZE is set, and registers per-disk
# "rEFInd (disk N)" NVRAM entries so the host survives losing any single
# disk. Detect via /dev/md/efi presence --
# the LAYOUT="" branch (single-disk variants) doesn't create it.
# Skipping the block on single-disk variants is intentional: the
# universal rEFInd assertion above already covers them.

- name: _verify | Stat /dev/md/efi (mdadm-EFI mirror detection)
  stat:
    path: /dev/md/efi
  register: packer_verify_md_efi

- name: _verify | Mdadm-EFI multi-disk assertions
  when: packer_verify_md_efi.stat.exists
  block:
    - name: _verify | Enumerate assembled md arrays
      find:
        paths: /dev/md
        file_type: link
      register: packer_verify_md_arrays
      become: true

    # Every array, not just efi: the podman raid5 is the one whose creation
    # carries --force, and a degraded swap or podman array assembles and mounts
    # silently. rc 0 = clean, 1 = degraded, 2 = failed.
    - name: _verify | Every assembled md array is clean
      command: mdadm --detail --test {{ item.path }}
      changed_when: false
      become: true
      loop: "{{ packer_verify_md_arrays.files }}"
      loop_control:
        label: "{{ item.path }}"

    - name: _verify | Read the shipped mdadm config
      slurp:
        src: /etc/mdadm/mdadm.conf
      register: packer_verify_mdadm_conf
      become: true

    # mdadm --create without --force builds a raid5 degraded, reporting the
    # rebuilding member as a spare; persisting that transient count makes
    # mdmonitor report a missing hot spare forever after. The mail route is the
    # day-to-day notification path when an array later degrades.
    - name: _verify | Mdadm config routes alerts and requests no nonexistent spares
      vars:
        _mdadm_conf: "{{ packer_verify_mdadm_conf.content | b64decode }}"
      assert:
        that:
          - "'spares=' not in _mdadm_conf"
          - _mdadm_conf is search('(?m)^MAILADDR\\s+\\S+')
        fail_msg: >-
          /etc/mdadm/mdadm.conf must route alerts without requesting nonexistent
          spares: {{ _mdadm_conf }}

    - name: _verify | Mdmonitor watches the assembled arrays
      systemd:
        name: mdmonitor.service
      register: packer_verify_mdmonitor
      changed_when: false
      failed_when: packer_verify_mdmonitor.status.ActiveState != 'active'
      become: true

    - name: _verify | Per-disk "rEFInd (disk N)" NVRAM entries exist
      vars:
        _disk_entries: >-
          {{ packer_verify_efibootmgr.stdout_lines
             | select('match', '^Boot[0-9A-F]{4}\*?\s+rEFInd \(disk \d+\)\s')
             | list }}
      assert:
        that: _disk_entries | length >= 2
        fail_msg: >-
          Multi-disk variant has only {{ _disk_entries | length }}
          per-disk "rEFInd (disk N)" NVRAM entries — chroot.sh's
          per-disk efibootmgr -c loop didn't run for every disk,
          breaking the single-disk-survival path.

# --- rpool health (universal) ---
#
# A degraded mirror still imports and boots, and the mdadm assertions above
# cover only the md arrays, so ask ZFS directly.
- name: _verify | Rpool is healthy
  command: zpool status -x rpool
  changed_when: false
  become: true
  register: packer_verify_rpool_status
  failed_when: packer_verify_rpool_status.stdout | trim != "pool 'rpool' is healthy"

# --- swap active (universal) ---
#
# chroot.sh bakes swap on every variant (sized by SWAP_SIZE): single-disk
# variants format the 8200 partition, mirror variants the /dev/md/swap
# raid1. Either way chroot.sh writes the fstab entry and
# systemd-fstab-generator activates it at boot. We test the live `swapon`
# state rather than parsing fstab because that exercises the full path
# (fstab entry + device resolution + mkswap signature + systemd
# activation); a broken fstab entry would leave swap inactive at runtime
# and the kernel would silently OOM under memory pressure instead of paging.
- name: _verify | At least one swap device is active
  command: swapon --show=NAME --noheadings
  changed_when: false
  register: packer_verify_swapon
  failed_when: packer_verify_swapon.rc != 0 or packer_verify_swapon.stdout_lines | length == 0

# The baked image must carry server-class storage drivers absent from the
# virtio-only build VM. Inspecting the final image exercises the generator and
# its configuration rather than just checking that the source file was copied.
- name: _verify | Boot image carries server-class HBA drivers
  shell:
    # No grep -q: its early exit would SIGPIPE the lister under pipefail.
    cmd: >-
      set -euo pipefail;
      {{ initramfs_list_command }} /boot/initrd.img-{{ ansible_kernel }}
      | grep -E '/(megaraid_sas|mpt3sas)\.ko' >/dev/null
    executable: /bin/bash
  changed_when: false
  become: true

# chroot.sh holds grub* before installing linux-generic so apt doesn't
# pull grub-pc/grub-efi-amd64/etc via the Recommends alternation. The
# safety net (apt-mark hold) is a *mechanism*; the invariant we care
# about is the *outcome* -- no grub package is actually installed.
# Assert the outcome directly: a future Recommends churn could pull
# in a grub variant the existing hold glob didn't catch, and a holds-
# only check would pass while the invariant silently regressed.
#
# dpkg-query rather than `apt list --installed` because the latter
# depends on apt's cache (which test/mirrors rewrites to Nexus before
# _verify runs). dpkg state is mirror-independent. `${db:Status-Status}`
# is the install state proper ("installed" / "not-installed" /
# "config-files" / ...), distinct from selection state ("install" /
# "hold" / "deinstall" / "purge") -- a held-but-not-installed package
# has Status-Status=not-installed, which we want, while an installed-
# and-held package has Status-Status=installed, which we want to fail.
- name: _verify | Dpkg install status for grub*
  command: dpkg-query -W -f='${binary:Package} ${db:Status-Status}\n' 'grub*'
  changed_when: false
  register: packer_verify_grub_status
  # dpkg-query exits 1 when the pattern matches nothing; only an installed
  # grub package is a failure for this invariant.
  failed_when: >-
    packer_verify_grub_status.stdout_lines
    | select('search', '\\sinstalled$')
    | list | length > 0

# --- sshd password-auth lockdown ---
#
# chroot.sh drops /etc/ssh/sshd_config.d/00-hardening.conf to
# force PasswordAuthentication no on the shipped image. Verify via
# `sshd -T` (effective-config dump) rather than slurping the snippet
# directly -- that exercises the whole chain (Include directive in
# /etc/ssh/sshd_config + drop-in file + lexical-order precedence).
# Reading the snippet alone would pass even if /etc/ssh/sshd_config
# were edited to drop the Include line.

- name: _verify | Sshd effective config disables password authentication
  command: sshd -T
  changed_when: false
  become: true
  register: packer_verify_sshd_effective
  failed_when: >-
    packer_verify_sshd_effective.rc != 0
    or packer_verify_sshd_effective.stdout_lines
       | select('match', '^passwordauthentication\s+no$')
       | list | length == 0
