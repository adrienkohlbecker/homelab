# Entry point for the role's verification. The collector exercise is large,
# so it lives in _verify_collector.yml.
#
# It runs on every arch: netdata installs from repo.netdata.cloud's multi-arch
# 2.x series (see roles/netdata), so netdata-plugin-chartsd resolves on arm64
# too, and the exercise is hardware-independent -- _verify_collector.yml
# overlays ghost devices plus an hdparm shim emitting canned power states, so
# it needs no real disk. The role's converge behavior (hdparm package,
# /etc/hdparm.conf, CAP_SYS_RAWIO, the udev re-apply) is exercised on every
# arch regardless.
- name: _verify | Hdparm conffile has no diversion  # noqa: command-instead-of-module
  command: dpkg-divert --listpackage /etc/hdparm.conf
  register: hdparm_verify_diversion
  changed_when: false
  failed_when: hdparm_verify_diversion.stdout | trim | length > 0
  become: true

- name: _verify | Read managed hdparm conffile
  slurp:
    src: /etc/hdparm.conf
  register: hdparm_verify_config_before
  become: true

- name: _verify | Reinstall hdparm while retaining local conffiles
  command:
    argv:
      - apt-get
      - --reinstall
      - -o
      - Dpkg::Options::=--force-confdef
      - -o
      - Dpkg::Options::=--force-confold
      - install
      - -y
      - hdparm
  changed_when: true
  become: true

- name: _verify | Read hdparm conffile after reinstall
  slurp:
    src: /etc/hdparm.conf
  register: hdparm_verify_config_after
  become: true

- name: _verify | Package reinstall preserved the managed hdparm conffile
  assert:
    that: hdparm_verify_config_after.content == hdparm_verify_config_before.content

- name: _verify | Exercise the hdparm charts.d collector
  import_tasks: _verify_collector.yml
