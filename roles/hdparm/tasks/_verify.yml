# The harness runs tasks/main.yml first, then this file installs and exercises
# the Netdata integration. A small direct protocol check covers every parser
# arm; one live chart proves the collector-to-Netdata boundary.

- name: _verify | Start netdata
  systemd:
    name: netdata
    state: started
  become: true

- name: _verify | Install hdparm netdata collector
  import_tasks: netdata.yml

# The active-drive alert references this chart so long ZFS scans suppress it.
- name: _verify | Install zfs_scan collector
  import_role:
    name: zfs
    tasks_from: netdata

- name: _verify | Install canned hdparm shim
  copy:
    content: |
      #!/bin/bash
      set -euo pipefail
      if [ "${1:-}" = "-C" ]; then
        case "${2:-}" in
          /dev/disk/by-id/_verify_active)
            printf "\n%s\n drive state is:  active/idle\n" "$2"; exit 0 ;;
          /dev/disk/by-id/_verify_standby)
            printf "\n%s\n drive state is:  standby\n" "$2"; exit 0 ;;
          /dev/disk/by-id/_verify_sleeping)
            printf "\n%s\n drive state is:  sleeping\n" "$2"; exit 0 ;;
          /dev/disk/by-id/_verify_unknown)
            printf "\n%s\n drive state is:  unknown\n" "$2"; exit 0 ;;
        esac
      fi
      exit 1
    dest: /usr/local/sbin/hdparm
    owner: root
    group: root
    mode: "0755"
    validate: bash -n %s
  become: true

- name: _verify | Ensure device fixture directory exists
  file:
    path: /dev/disk/by-id
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: _verify | Create canned-state device fixtures
  file:
    src: /dev/null
    dest: "/dev/disk/by-id/{{ item }}"
    state: link
    force: true
  loop:
    - _verify_active
    - _verify_standby
    - _verify_sleeping
    - _verify_unknown
  become: true

- name: _verify | Exercise every collector protocol branch
  shell: |
    set -euo pipefail
    PATH=/usr/local/sbin:/usr/bin:/bin
    fixid() { printf "%s\n" "${1#_}"; }
    require_cmd() { command -v "$1" >/dev/null 2>&1; }
    source /usr/libexec/netdata/charts.d/hdparm.chart.sh
    hdparm_disks=(_verify_active _verify_standby _verify_sleeping _verify_unknown _verify_error)
    hdparm_check
    hdparm_create >/dev/null
    create_output=$(hdparm_create)
    update_output=$(hdparm_update 123)
    cases=(
      _verify_active:active
      _verify_standby:standby
      _verify_sleeping:sleeping
      _verify_unknown:unknown
      _verify_error:collector_error
    )
    dimensions=(active standby sleeping unknown collector_error)
    for fixture in "${cases[@]}"; do
      device=${fixture%%:*}
      expected_dimension=${fixture#*:}
      safe_id=${device#_}
      grep -Fq "CHART hdparm.${safe_id} " <<< "$create_output"
      grep -Fq "CLABEL device \"${device}\" 1" <<< "$create_output"
      block=$(sed -n "/^BEGIN hdparm.${safe_id} /,/^END$/p" <<< "$update_output")
      for dimension in "${dimensions[@]}"; do
        expected=0
        [ "$dimension" = "$expected_dimension" ] && expected=1
        grep -Fqx "SET ${dimension} = ${expected}" <<< "$block"
      done
    done
  args:
    executable: /bin/bash
  changed_when: false
  become: true

- name: _verify | Configure one live hdparm chart
  copy:
    content: |
      hdparm_update_every=5
      hdparm_disks=("_verify_active")
    dest: /etc/netdata/charts.d/hdparm.conf
    owner: netdata
    group: netdata
    mode: "0644"
    backup: true
  become: true

- name: _verify | Restart netdata for the live chart
  systemd:
    name: netdata
    state: restarted
  become: true

- name: _verify | Wait for hdparm and zfs_scan charts
  uri:
    url: http://localhost:19999/api/v1/charts
    return_content: true
  register: _hdparm_charts
  retries: 30
  delay: 2
  until: >-
    _hdparm_charts.status == 200
    and 'hdparm.verify_active' in (_hdparm_charts.content | from_json).charts.keys()
    and 'zfs_scan.any_in_progress' in (_hdparm_charts.content | from_json).charts.keys()

- name: _verify | Live chart reports active state
  uri:
    url: http://localhost:19999/api/v1/data?chart=hdparm.verify_active&points=1&after=-30&format=json
    return_content: true
  register: _hdparm_active_data
  retries: 30
  delay: 2
  until: >-
    _hdparm_active_data.status == 200
    and 'active' in (_hdparm_active_data.json.labels | default([]))
    and (_hdparm_active_data.json.data | default([])) | length > 0
    and _hdparm_active_data.json.data[0][_hdparm_active_data.json.labels.index('active')] | int == 1
    and _hdparm_active_data.json.data[0][_hdparm_active_data.json.labels.index('collector_error')] | int == 0

- name: _verify | Read live hdparm chart metadata
  uri:
    url: http://localhost:19999/api/v1/chart?chart=hdparm.verify_active
    return_content: true
  register: _hdparm_active_chart

- name: _verify | Assert device label and shared context
  assert:
    that:
      - _hdparm_active_chart.json.context == "hdparm.power_state"
      - _hdparm_active_chart.json.chart_labels.device | default('') == "_verify_active"
    fail_msg: >-
      chart {{ _hdparm_active_chart.json.id }} context={{ _hdparm_active_chart.json.context }}
      labels={{ _hdparm_active_chart.json.chart_labels | default({}) }}

- name: _verify | Alerts register against the live chart
  uri:
    url: http://localhost:19999/api/v1/alarms?all
    return_content: true
  register: _hdparm_alarms
  retries: 10
  delay: 2
  until: >-
    _hdparm_alarms.status == 200
    and 'hdparm.verify_active.hdparm_drive_active' in (_hdparm_alarms.json.alarms | default({}))
    and 'hdparm.verify_active.hdparm_drive_unknown' in (_hdparm_alarms.json.alarms | default({}))
    and 'hdparm.verify_active.hdparm_drive_collector_error' in (_hdparm_alarms.json.alarms | default({}))

- name: _verify | Hdparm faults use one sustained-state window
  vars:
    _alarms: "{{ (_hdparm_alarms.content | from_json).alarms }}"
    _names:
      - hdparm_drive_unknown
      - hdparm_drive_collector_error
    _alarm: "{{ _alarms['hdparm.verify_active.' ~ item] | default({}) }}"
  assert:
    that:
      - _alarm.recipient | default('') == "sysadmin"
      - _alarm.lookup_method | default('') == "min"
      - _alarm.lookup_after | default(0) == -300
      - _alarm.delay_up_duration | default(0) == 0
      - _alarm.delay_down_duration | default(0) == 1800
    fail_msg: >-
      Expected {{ item }} to alert after one five-minute state window and
      retain only recovery hysteresis. Got: {{ _alarm }}
  loop: "{{ _names }}"

- name: _verify | Restore role hdparm configuration
  template:
    src: charts_d_hdparm.conf.j2
    dest: /etc/netdata/charts.d/hdparm.conf
    owner: netdata
    group: netdata
    mode: "0644"
    backup: true
  become: true

- name: _verify | Remove device fixtures
  file:
    path: "/dev/disk/by-id/{{ item }}"
    state: absent
  loop:
    - _verify_active
    - _verify_standby
    - _verify_sleeping
    - _verify_unknown
  become: true

- name: _verify | Remove hdparm shim
  file:
    path: /usr/local/sbin/hdparm
    state: absent
  become: true

- name: _verify | Restart netdata to drop the fixture chart
  systemd:
    name: netdata
    state: restarted
  become: true
