- name: _verify | Hostname states match inventory
  command: "{{ item }}"
  loop:
    - hostname
    - hostnamectl --static
  register: _hostname_state
  changed_when: false
  failed_when: _hostname_state.stdout != inventory_hostname

- name: _verify | IPv4 hosts entries resolve
  command: getent -s files ahosts {{ item.key }}
  loop: "{{ [{'key': inventory_hostname, 'value': '127.0.1.1'}] + (etc_hosts_entries | dict2items) }}"
  register: _hostname_ipv4_entries
  changed_when: false
  failed_when: >-
    _hostname_ipv4_entries.rc != 0
    or item.value not in _hostname_ipv4_entries.stdout.split()

- name: _verify | IPv6 localhost resolves
  command: getent -s files ahostsv6 localhost
  register: _hostname_ipv6_localhost
  changed_when: false
  failed_when: >-
    _hostname_ipv6_localhost.rc != 0
    or '::1' not in _hostname_ipv6_localhost.stdout.split()
