# Removes a third-party apt repository installed by configure.yml: its package
# pin, the deb822 source, and its scoped signing key.
#
# Inputs: caller passes a single dict `apt_source_args` with keys
#   name:          required; the identifier passed to configure.yml
#
# Like configure.yml, requires the apt role to have run first:
# deb822_repository needs python3-debian even for state=absent.
# Packages installed from the source are the caller's to remove, before this
# call.
#
# The source goes before the key so apt never sees a source whose signed-by
# key is missing. apt ignores the removed source's package lists at once, and
# the next apt-get update prunes them.

- name: remove | Assert apt_source args for {{ apt_source_args.name | default('<unset>') }}
  assert:
    that:
      - apt_source_args is mapping
      - apt_source_args.keys() | difference(['name']) | length == 0
      - apt_source_args.name | default('') is match('^[a-z0-9_-]+\Z')
    fail_msg: >-
      apt_source remove: name must be a [a-z0-9_-] slug and the only key;
      got {{ apt_source_args }}

- name: remove | Remove package pin for {{ apt_source_args.name }}
  file:
    path: /etc/apt/preferences.d/{{ apt_source_args.name }}
    state: absent
  become: true

# state=absent resolves the same slugged .sources filename configure.yml wrote.
# It also removes /etc/apt/keyrings/<slug>.{asc,gpg}, not the
# /usr/share/keyrings key configure.yml fetched, so that one is deleted below.
- name: remove | Remove repository for {{ apt_source_args.name }}
  when: apt_deb822_available | default(true)
  deb822_repository:
    name: "{{ apt_source_args.name }}"
    state: absent
  become: true

- name: remove | Remove repository key for {{ apt_source_args.name }}
  file:
    path: /usr/share/keyrings/{{ apt_source_args.name }}.asc
    state: absent
  become: true
