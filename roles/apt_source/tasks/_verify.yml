# Post-converge assertions for the helper's contract: the signing key is
# scoped (not globally trusted) and, when a pin is set, the pinned source wins
# at its priority. Two callers, distinguished by _role_under_test:
#
#  - A consumer (netdata, docker_client, etc.) imports this with `tasks_from: _verify` and the
#    same apt_source_args it converged with (the harness runs _verify as a
#    separate ansible invocation, so the args don't survive from configure.yml
#    and must be re-passed). The standalone block below is skipped for them.
#  - The standalone apt_source:box cell runs this file directly. main.yml is a
#    stub, so nothing configured a source during converge; the block below
#    stands in for a consumer by configuring a representative real repo (docker,
#    a self-contained real repo) and leaving apt_source_args set for the
#    assertions that follow.
- name: _verify | Standalone — configure a representative source under test
  when: _role_under_test | default('') == 'apt_source'
  block:
    - name: _verify | Standalone — fixture args (docker, a real mirrored repo)
      set_fact:
        apt_source_args:
          name: docker
          key_id: 9DC858229FC7DD38854AE2D88D81803C0EBFCD88
          key_url: https://download.docker.com/linux/ubuntu/gpg
          uris: "{{ mirror_apt_docker }}"
          suites: "{{ ansible_distribution_release }}"
          components: stable

    - name: _verify | Standalone — seed a legacy repository file
      copy:
        dest: /etc/apt/sources.list.d/docker.list
        content: >-
          deb [arch={{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }} signed-by=/usr/share/keyrings/docker.gpg]
          {{ mirror_apt_docker }} {{ ansible_distribution_release }} stable
        owner: root
        group: root
        mode: "0644"
      become: true

    - name: _verify | Standalone — configure the source under test
      import_role:
        name: apt_source
        tasks_from: configure

    - name: _verify | Standalone — stat the legacy repository file
      stat:
        path: /etc/apt/sources.list.d/docker.list
      register: _apt_source_legacy_list
      become: true

    - name: _verify | Standalone — legacy repository file was removed
      assert:
        that:
          - not _apt_source_legacy_list.stat.exists

- name: _verify | Assert apt_source verify args for {{ apt_source_args.name }}
  assert:
    that:
      - apt_source_args.name is defined
      - apt_source_args.uris is defined
    fail_msg: >-
      apt_source _verify needs name and uris; got {{ apt_source_args }}

# apt cache refresh re-validates the repo against the signing key (a wrong
# signed-by keyring surfaces as NO_PUBKEY + the module erroring). The
# converge already refreshed once, but that gate is change-only; running it
# here makes the key wiring an explicit assertion.
- name: _verify | Apt cache refresh re-validates the source for {{ apt_source_args.name }}
  apt:
    update_cache: true
  become: true

- name: _verify | Pin assertions for {{ apt_source_args.name }}
  when: apt_source_args.pin is defined
  block:
    # pin.package may be a glob (e.g. "netdata*") pinning a family of packages;
    # apt-cache policy needs a concrete name. dpkg-query -W takes a glob and
    # lists installed matches as "<pkg>\t<version>" lines (no custom -f, whose
    # \n would be eaten by the command module's shlex); take the first match's
    # package field, falling back to the literal pin.package when none match
    # (then the policy assertion below fails meaningfully, not on empty input).
    - name: _verify | Resolve an installed package matching {{ apt_source_args.pin.package }}
      command: dpkg-query -W {{ apt_source_args.pin.package }}
      changed_when: false
      failed_when: false
      register: _apt_source_pin_pkgs

    - name: _verify | Apt policy is available for {{ apt_source_args.pin.package }}
      command: apt-cache policy {{ (_apt_source_pin_pkgs.stdout_lines | default([]) | first | default('')).split() | first | default(apt_source_args.pin.package) }}
      changed_when: false
      register: _apt_source_policy

    # Turn the pin glob (e.g. "22.*", "5:27.*") into a policy regex -- literal
    # dots, glob * -> .* -- so the check follows whatever the consumer pinned
    # rather than assuming a numeric major.minor shape. Precomputed here, not
    # in the that:, so ansible's conditional re-evaluation can't reprocess it.
    - name: _verify | Derive the pin policy pattern for {{ apt_source_args.pin.package }}
      set_fact:
        _apt_source_policy_re: "[*][*][*] {{ apt_source_args.pin.version | regex_replace('[.]', '[.]') | regex_replace('[*]', '.*') }} {{ apt_source_args.pin.priority }}"

    - name: _verify | Pinned version is the installed candidate for {{ apt_source_args.pin.package }}
      assert:
        that:
          # `*** <ver> <prio>` marks the installed+selected candidate; assert
          # it is the pinned major at the pin priority -- a bare priority
          # substring could match a version string and pass on a no-op pin.
          - _apt_source_policy.stdout is search(_apt_source_policy_re)
          # ...and the winning source is this mirror, so a pin mis-targeting
          # another origin can't satisfy the check above. apt renders a flat
          # repo's URI without its trailing slash (folding "<uri>/ <suite>/"
          # into "<uri> <suite>/"), so normalize before the substring check --
          # a no-op for component repos, whose URI carries no trailing slash.
          - (apt_source_args.uris | regex_replace('/$', '')) in _apt_source_policy.stdout
        fail_msg: >-
          Expected {{ apt_source_args.pin.package }} candidate to match
          {{ apt_source_args.pin.version }} at priority
          {{ apt_source_args.pin.priority }} from {{ apt_source_args.uris }};
          got policy: {{ _apt_source_policy.stdout | default('') }}

# Scoped signed-by keyring on both paths: noble's apt_key and resolute's
# get_url both write /usr/share/keyrings/<name>.gpg, and neither writes the
# legacy global-trust copy at /etc/apt/trusted.gpg.d/ (which would re-grant
# the key fleet-wide trust).
- name: _verify | Keyring is scoped, not globally trusted, for {{ apt_source_args.name }}
  block:
    - name: _verify | Stat the scoped and legacy keyrings for {{ apt_source_args.name }}
      stat:
        path: "{{ item }}"
      loop:
        - /usr/share/keyrings/{{ apt_source_args.name }}.gpg
        - /etc/apt/trusted.gpg.d/{{ apt_source_args.name }}.gpg
      register: _apt_source_keyrings
      become: true

    - name: _verify | Scoped keyring present, legacy global-trust keyring absent
      assert:
        that:
          - _apt_source_keyrings.results[0].stat.exists
          - not _apt_source_keyrings.results[1].stat.exists
        fail_msg: >-
          Expected /usr/share/keyrings/{{ apt_source_args.name }}.gpg present
          and /etc/apt/trusted.gpg.d/{{ apt_source_args.name }}.gpg absent; got
          scoped={{ _apt_source_keyrings.results[0].stat.exists }}
          legacy={{ _apt_source_keyrings.results[1].stat.exists }}
