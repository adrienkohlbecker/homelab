# The standalone apt_source:lab cell configures a representative real source.
# Every case below derives its arguments from this one docker source.
- name: _verify | Define the representative docker source
  set_fact:
    _apt_source_docker:
      name: docker
      key_sha256: 1500c1f56fa9e26b9b8f42452a553675796ade0807cdce11975eb98170b3a570
      key_url: https://download.docker.com/linux/ubuntu/gpg
      uris: "{{ mirror_apt_docker }}"
      suites: "{{ ansible_distribution_release }}"
      components: stable

- name: _verify | Standalone — configure a representative source under test
  import_role:
    name: apt_source
    tasks_from: configure
  vars:
    apt_source_args: "{{ _apt_source_docker }}"

- name: _verify | Resolve both repository architecture variants through the production helper
  check_mode: true
  block:
    - name: _verify | Resolve the x86 repository source
      import_role:
        name: apt_source
        tasks_from: configure
      vars:
        ansible_architecture: x86_64  # noqa: var-naming[no-role-prefix]
        apt_source_args: "{{ _apt_source_docker }}"

    - name: _verify | Resolve the ARM repository source
      import_role:
        name: apt_source
        tasks_from: configure
      vars:
        ansible_architecture: aarch64  # noqa: var-naming[no-role-prefix]
        apt_source_args: "{{ _apt_source_docker }}"

# Pin to the oldest indexed release so apt must choose it over newer candidates;
# a pin that merely matched the newest version would prove nothing.
- name: _verify | List indexed docker-ce-cli versions
  command: apt-cache madison docker-ce-cli
  changed_when: false
  register: _apt_source_madison

- name: _verify | Select the newest and oldest indexed versions
  set_fact:
    _apt_source_versions: >-
      {{ _apt_source_madison.stdout_lines
         | map('split', '|') | map(attribute=1) | map('trim') | unique }}

- name: _verify | The index offers more than one version to choose between
  assert:
    that:
      - _apt_source_versions | length > 1
    fail_msg: "Expected several docker-ce-cli versions; got {{ _apt_source_versions }}"

- name: _verify | Pin docker-ce-cli to its oldest indexed version
  import_role:
    name: apt_source
    tasks_from: configure
  vars:
    apt_source_args: >-
      {{ _apt_source_docker | combine({'pin': {'package': 'docker-ce-cli', 'version': _apt_source_versions | last}}) }}

- name: _verify | Read the pinned docker-ce-cli policy
  command: apt-cache policy docker-ce-cli
  changed_when: false
  register: _apt_source_pinned_policy

- name: _verify | Apt selects the pinned version over newer candidates
  vars:
    _apt_source_candidate_re: "(?m)^  Candidate: {{ _apt_source_versions | last | regex_escape }}$"
  assert:
    that:
      - apt_source_docker_changed
      - _apt_source_pinned_policy.stdout is search(_apt_source_candidate_re)
    fail_msg: >-
      Expected the pin to select {{ _apt_source_versions | last }};
      got policy: {{ _apt_source_pinned_policy.stdout }}

# Once the pinned series leaves the index, apt must refuse to install rather
# than fall back to an out-of-series release.
- name: _verify | Pin docker-ce-cli to a series absent from the index
  import_role:
    name: apt_source
    tasks_from: configure
  vars:
    apt_source_args: >-
      {{ _apt_source_docker | combine({'pin': {'package': 'docker-ce-cli', 'version': '0.*'}}) }}

- name: _verify | Read the unmatched docker-ce-cli policy
  command: apt-cache policy docker-ce-cli
  changed_when: false
  register: _apt_source_unmatched_policy

- name: _verify | Apt offers no candidate outside the pinned series
  assert:
    that:
      - _apt_source_unmatched_policy.stdout is search('(?m)^  Candidate. [(]none[)]$')
    fail_msg: >-
      Expected no candidate for an unmatched pin;
      got policy: {{ _apt_source_unmatched_policy.stdout }}

- name: _verify | Reject a bare wildcard package pin
  block:
    - name: _verify | Attempt a pin for every package (should raise)
      import_role:
        name: apt_source
        tasks_from: configure
      vars:
        apt_source_args: >-
          {{ _apt_source_docker | combine({'pin': {'package': '*', 'version': '0.*'}}) }}
    - name: _verify | Sentinel fail if the bare wildcard pin was accepted
      fail:
        msg: a bare wildcard package pin should have been rejected but was not
  rescue:
    - name: _verify | The argument assertion rejected the bare wildcard
      assert:
        that:
          - ansible_failed_task.name is search('^configure [|] Assert apt_source args')
        fail_msg: "Expected the argument assertion to fail; got {{ ansible_failed_task.name }}"

# A misspelled pin key must fail the call rather than read as no pin, which
# would delete the hold configured above.
- name: _verify | Reject a misspelled pin key
  block:
    - name: _verify | Attempt a pin under a misspelled key (should raise)
      import_role:
        name: apt_source
        tasks_from: configure
      vars:
        apt_source_args: >-
          {{ _apt_source_docker | combine({'pins': {'package': 'docker-ce-cli', 'version': '0.*'}}) }}
    - name: _verify | Sentinel fail if the misspelled pin key was accepted
      fail:
        msg: a misspelled pin key should have been rejected but was not
  rescue:
    - name: _verify | The argument assertion rejected the misspelled key
      assert:
        that:
          - ansible_failed_task.name is search('^configure [|] Assert apt_source args')
        fail_msg: "Expected the argument assertion to fail; got {{ ansible_failed_task.name }}"

- name: _verify | Drop the docker-ce-cli pin
  import_role:
    name: apt_source
    tasks_from: configure
  vars:
    apt_source_args: "{{ _apt_source_docker }}"

- name: _verify | Read the unpinned docker-ce-cli policy
  command: apt-cache policy docker-ce-cli
  changed_when: false
  register: _apt_source_unpinned_policy

- name: _verify | Apt returns to the newest version once the pin is removed
  vars:
    _apt_source_candidate_re: "(?m)^  Candidate: {{ _apt_source_versions | first | regex_escape }}$"
  assert:
    that:
      - apt_source_docker_changed
      - _apt_source_unpinned_policy.stdout is search(_apt_source_candidate_re)
    fail_msg: >-
      Expected the unpinned candidate {{ _apt_source_versions | first }};
      got policy: {{ _apt_source_unpinned_policy.stdout }}

# A false condition must leave the source untouched and report no change, so
# a pin passed alongside it never reaches apt.
- name: _verify | Skip a pin under a false condition
  import_role:
    name: apt_source
    tasks_from: configure
  vars:
    apt_source_args: >-
      {{ _apt_source_docker | combine({'condition': false, 'pin': {'package': 'docker-ce-cli', 'version': '0.*'}}) }}

- name: _verify | Read the docker-ce-cli policy after the skipped call
  command: apt-cache policy docker-ce-cli
  changed_when: false
  register: _apt_source_skipped_policy

- name: _verify | The skipped call left the newest candidate and reported no change
  vars:
    _apt_source_candidate_re: "(?m)^  Candidate: {{ _apt_source_versions | first | regex_escape }}$"
  assert:
    that:
      - not apt_source_docker_changed
      - _apt_source_skipped_policy.stdout is search(_apt_source_candidate_re)
    fail_msg: >-
      Expected no change and the candidate {{ _apt_source_versions | first }};
      got changed={{ apt_source_docker_changed }} and policy:
      {{ _apt_source_skipped_policy.stdout }}

# Removal consumes the standalone source configured above: its pin and package
# must stop resolving and its lists must be pruned once the source is gone, and
# a repeat call must be a no-op. apt names each list file after its URI, with
# the scheme dropped and slashes turned into underscores.
- name: _verify | Pin docker-ce-cli before removing the source
  import_role:
    name: apt_source
    tasks_from: configure
  vars:
    apt_source_args: >-
      {{ _apt_source_docker | combine({'pin': {'package': 'docker-ce-cli', 'version': '0.*'}}) }}

- name: _verify | Derive the docker source list-file pattern
  set_fact:
    _apt_source_docker_lists: "{{ mirror_apt_docker | regex_replace('^https://', '') | replace('/', '_') }}_*"

- name: _verify | Query docker-ce candidate while the source is configured
  command: apt-cache policy docker-ce
  register: _apt_source_policy_configured
  changed_when: false

- name: _verify | Find docker lists while the source is configured
  find:
    paths: /var/lib/apt/lists
    patterns: "{{ _apt_source_docker_lists }}"
  register: _apt_source_lists_configured

- name: _verify | Remove the representative source
  import_role:
    name: apt_source
    tasks_from: remove
  vars:
    apt_source_args:
      name: docker

- name: _verify | Query docker-ce candidate after removal
  command: apt-cache policy docker-ce
  register: _apt_source_policy_removed
  changed_when: false

- name: _verify | Find docker lists after removal
  find:
    paths: /var/lib/apt/lists
    patterns: "{{ _apt_source_docker_lists }}"
  register: _apt_source_lists_removed

- name: _verify | Removal dropped the pin and package candidate and pruned its lists
  assert:
    that:
      - apt_source_removed_pin is changed
      - "_apt_source_policy_configured.stdout is search('Candidate: [0-9]')"
      - "_apt_source_policy_removed.stdout is not search('Candidate: [0-9]')"
      - _apt_source_lists_configured.matched > 0
      - _apt_source_lists_removed.matched == 0
    fail_msg: >-
      configured: {{ _apt_source_policy_configured.stdout }}
      ({{ _apt_source_lists_configured.matched }} lists);
      removed: {{ _apt_source_policy_removed.stdout }}
      ({{ _apt_source_lists_removed.matched }} lists)

- name: _verify | Remove the representative source again
  import_role:
    name: apt_source
    tasks_from: remove
  vars:
    apt_source_args:
      name: docker

- name: _verify | Repeat removal reported no change
  assert:
    that:
      - apt_source_removed_repo is not changed
      - apt_source_removed_refresh is skipped
      - apt_source_removed_key is not changed
      - apt_source_removed_pin is not changed

# A removal whose refresh exhausted its retries leaves its pin and source gone
# but its lists and key behind. Rebuild that state directly rather than waiting
# out the retry backoff, then prove a rerun still refreshes and finishes the
# cleanup.
- name: _verify | Reconfigure the representative source
  import_role:
    name: apt_source
    tasks_from: configure
  vars:
    apt_source_args: "{{ _apt_source_docker }}"

- name: _verify | Drop the source as an interrupted removal would
  file:
    path: /etc/apt/sources.list.d/docker.sources
    state: absent
  become: true

- name: _verify | Find docker lists stranded by the interrupted removal
  find:
    paths: /var/lib/apt/lists
    patterns: "{{ _apt_source_docker_lists }}"
  register: _apt_source_lists_stranded

- name: _verify | Rerun removal after the interrupted one
  import_role:
    name: apt_source
    tasks_from: remove
  vars:
    apt_source_args:
      name: docker

- name: _verify | Find docker lists after the recovering removal
  find:
    paths: /var/lib/apt/lists
    patterns: "{{ _apt_source_docker_lists }}"
  register: _apt_source_lists_recovered

- name: _verify | Rerun refreshed apt and finished the cleanup
  assert:
    that:
      - _apt_source_lists_stranded.matched > 0
      - apt_source_removed_repo is not changed
      - apt_source_removed_refresh is changed
      - apt_source_removed_key is changed
      - apt_source_removed_pin is not changed
      - _apt_source_lists_recovered.matched == 0
    fail_msg: >-
      stranded {{ _apt_source_lists_stranded.matched }} lists,
      {{ _apt_source_lists_recovered.matched }} left after the rerun
