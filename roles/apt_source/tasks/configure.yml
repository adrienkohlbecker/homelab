# Configures a third-party apt repository: signing key + deb822 source.
#
# The armored signing key lives at /usr/share/keyrings/<name>.asc, referenced
# by signed-by= on the repo so it is trusted for this source only. Debian reserves
# /usr/share/keyrings for dpkg-managed keys and points self-fetched ones at
# /etc/apt/keyrings; we deliberately use the former to share one fleet-wide
# keyring location with roles/apt's archive keyring.
#
# Callers pass everything through a single apt_source_args dict so each
# invocation replaces it wholesale and inter-call vars-leak cannot happen:
#
#   name:          identifier -- scoped keyring file and .sources name
#   key_url:       URL of the signing key (fetched into the scoped keyring)
#   key_sha256:    checksum of the exact armored key payload
#   uris:          repo base URL (usually a mirror_apt_* var)
#   suites:        apt suite -- e.g. nodistro, or the release codename
#   components:    optional apt component -- e.g. main, stable; omit for a
#                  flat repo (trailing-slash suite, no components)
#   pin:           optional {package, version} -- holds the matching packages
#                  at a version glob (e.g. netdata* at 2.*) with priority 999
#                  and refuses every other version, so installs and the
#                  fleet-wide safe-upgrade stay inside the series. If the
#                  series leaves the index, fresh installs fail and installed
#                  hosts silently stop receiving updates. Omitting it removes
#                  a previously installed pin.
#   condition:     default true; false skips the call and publishes
#                  apt_source_<name>_changed as false
#
# Exposes apt_source_<name>_changed so callers can gate dependent installs until
# the repository, signing key, and pin are ready.
# The apt role publishes apt_deb822_available=false when a fresh check-mode run
# can only predict installation of deb822_repository's Python dependency.

- name: configure | Assert apt_source args for {{ apt_source_args.name }}
  assert:
    that:
      - apt_source_args is mapping
      # A mistyped key is dropped silently otherwise, and a mistyped pin
      # reads as no pin, which deletes the series hold below.
      - apt_source_args.keys() | difference(['name', 'key_url', 'key_sha256', 'uris', 'suites', 'components', 'pin', 'condition']) | length == 0
      - apt_source_args.name is defined
      - apt_source_args.key_url is defined
      - apt_source_args.key_sha256 is defined
      - apt_source_args.uris is defined
      - apt_source_args.suites is defined
      # name lands in the keyring / .sources / preferences file paths --
      # keep it a bare slug so it cannot traverse or inject path segments.
      - apt_source_args.name | default('') is match('^[a-z0-9_-]+\Z')
      # the key is the source's trust anchor; a plaintext fetch is MITM-able.
      - apt_source_args.key_url | default('') is match('https://')
      - apt_source_args.key_sha256 | default('') is match('^[0-9a-f]{64}\Z')
      - apt_source_args.suites | default('') is not search('[ ,]')
      - apt_source_args.components | default('') is not search('[ ,]')
      # pin fields land verbatim on single preferences-file lines. A bare
      # `*` package is APT's general form, which rejects version pins.
      - apt_source_args.pin is not defined or
        (apt_source_args.pin is mapping and
         apt_source_args.pin.keys() | difference(['package', 'version']) | length == 0 and
         apt_source_args.pin.package | default('') is match('^[a-z0-9.+*-]+\Z') and
         apt_source_args.pin.package != '*' and
         apt_source_args.pin.version | default('') is match('^[A-Za-z0-9.+~:*-]+\Z'))
    fail_msg: >-
      apt_source_args must define name, key_url, key_sha256, uris and suites,
      with name a [a-z0-9_-] slug, key_url an https URL, key_sha256 a
      lowercase SHA-256 digest, and an optional pin carrying a package glob
      and a version glob; no other keys are accepted;
      got {{ apt_source_args }}

- name: configure | Resolve the condition for {{ apt_source_args.name }}
  set_fact:
    _apt_source_condition: "{{ apt_source_args.condition | default(true) }}"

- name: configure | Fetch repository key (armored) for {{ apt_source_args.name }}
  when: _apt_source_condition
  get_url:
    url: "{{ apt_source_args.key_url }}"
    dest: /usr/share/keyrings/{{ apt_source_args.name }}.asc
    checksum: sha256:{{ apt_source_args.key_sha256 }}
    owner: root
    group: root
    mode: "0644"
  become: true
  register: apt_source_key

- name: configure | Configure repository for {{ apt_source_args.name }}
  when:
    - _apt_source_condition
    - apt_deb822_available | default(true)
  deb822_repository:
    name: "{{ apt_source_args.name }}"
    uris: "{{ apt_source_args.uris }}"
    suites: "{{ apt_source_args.suites }}"
    components: "{{ apt_source_args.components | default(omit) }}"
    architectures: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"
    signed_by: /usr/share/keyrings/{{ apt_source_args.name }}.asc
  become: true
  register: apt_source_repo

# deb822_repository writes the .sources file but does not refresh apt. Use a
# strict refresh after changing the repo so a broken source fails here rather
# than as a missing package in the caller.
- name: configure | Refresh apt cache after repository change for {{ apt_source_args.name }}  # noqa: command-instead-of-module
  when:
    - apt_source_repo is changed
    - not ansible_check_mode
  command: apt-get update --error-on=any
  register: apt_source_refresh
  retries: 5
  delay: 30
  until: apt_source_refresh.rc == 0
  changed_when: apt_source_refresh.rc == 0
  become: true

# No validate: apt has no single-file preferences parser; apt-cache policy
# reads the whole preferences.d set. Pin by version rather than origin because
# the mirrored source URL carries the proxy's hostname, not the vendor's.
# APT applies the first record matching a version, so the second record only
# catches versions outside the series; without it they keep their default
# priority and install once the series leaves the index.
- name: configure | Pin packages for {{ apt_source_args.name }}  # noqa: require-validate
  when:
    - _apt_source_condition
    - apt_source_args.pin is defined
  copy:
    content: |
      # Ansible managed
      Package: {{ apt_source_args.pin.package }}
      Pin: version {{ apt_source_args.pin.version }}
      Pin-Priority: 999

      Package: {{ apt_source_args.pin.package }}
      Pin: version *
      Pin-Priority: -1
    dest: /etc/apt/preferences.d/{{ apt_source_args.name }}
    owner: root
    group: root
    mode: "0644"
    backup: true
  become: true
  register: apt_source_pin

- name: configure | Remove package pin for {{ apt_source_args.name }}
  when:
    - _apt_source_condition
    - apt_source_args.pin is not defined
  file:
    path: /etc/apt/preferences.d/{{ apt_source_args.name }}
    state: absent
  become: true
  register: apt_source_unpin

- name: configure | Export change signal for {{ apt_source_args.name }}
  set_fact:
    "apt_source_{{ apt_source_args.name }}_changed": >-
      {{ _apt_source_condition
         and (apt_source_repo is changed
              or apt_source_key is changed
              or apt_source_repo is skipped
              or apt_source_pin is changed
              or apt_source_unpin is changed) }}
