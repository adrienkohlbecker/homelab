- name: _verify | Root mount unit is active
  command:
    argv:
      - systemctl
      - is-active
      - zfs_mount_root.service
  changed_when: false
  become: true

- name: _verify | Check mount passes for root dataset
  command: /usr/local/bin/zfs_check_mount rpool/ROOT/{{ ansible_distribution_release }} / noauto
  changed_when: false
  become: true

- name: _verify | Check invalid mount states fail
  command:
    argv: "{{ ['/usr/local/bin/zfs_check_mount'] + zfs_mount_verify_case.args }}"
  register: _zfs_mount_verify_negative
  changed_when: false
  failed_when: _zfs_mount_verify_negative.rc == 0
  loop:
    - { label: mountpoint mismatch, args: [ "rpool/ROOT/{{ ansible_distribution_release }}", /nonexistent, noauto ] }
    - { label: canmount mismatch, args: [ "rpool/ROOT/{{ ansible_distribution_release }}", /, "on" ] }
    - { label: missing dataset, args: [ rpool/nonexistent_dataset, /, noauto ] }
  loop_control:
    loop_var: zfs_mount_verify_case
    label: "{{ zfs_mount_verify_case.label }}"
  become: true
