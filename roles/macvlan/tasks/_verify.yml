---
# Functional probes against the live macvlan ifaces and podman networks,
# not the rendered unit. Only invoked by test/testrole.py against a qemu
# VM; never from site.yml or `mise run ansible --tags macvlan`. Loops the
# same macvlan_blocks the role consumed and derives the expected addresses
# independently so allocation drift is caught.

- name: _verify | Reboot to exercise boot-time interface setup
  import_role:
    name: reboot
    tasks_from: reboot

- name: _verify | Read each macvlan interface
  command: ip -j -d address show dev {{ item.name }}
  loop: "{{ macvlan_blocks }}"
  loop_control:
    label: "{{ item.name }}"
  register: macvlan_verify_ifaces
  become: true
  changed_when: false

- name: _verify | Assert each interface identity
  vars:
    _macvlan_iface: "{{ item.stdout | from_json | first }}"
    _macvlan_block: "{{ network | host_vlan_block(inventory_hostname, item.item.vlan) }}"
    _macvlan_host_ip: "{{ _macvlan_block | ansible.utils.ipmath(0) }}"
    _macvlan_ipv4: "{{ _macvlan_iface.addr_info | selectattr('family', 'equalto', 'inet') | list }}"
  assert:
    that:
      - _macvlan_iface.linkinfo.info_kind == 'macvlan'
      - "'UP' in _macvlan_iface.flags"
      - _macvlan_iface.address == ('82:48:10' | random_mac(seed=(inventory_hostname ~ '_' ~ item.item.name)))
      - _macvlan_ipv4 | length == 1
      - (_macvlan_ipv4 | first).local == _macvlan_host_ip
      - (_macvlan_ipv4 | first).prefixlen == 32
  loop: "{{ macvlan_verify_ifaces.results }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: _verify | Assert the block route points at each iface
  vars:
    _macvlan_block: "{{ network | host_vlan_block(inventory_hostname, item.vlan) }}"
  command: ip route show {{ _macvlan_block }} dev {{ item.name }}
  loop: "{{ macvlan_blocks }}"
  loop_control:
    label: "{{ item.name }}"
  register: macvlan_verify_route
  become: true
  changed_when: false
  failed_when: macvlan_verify_route.stdout | length == 0

# Self-heal regression guard for the child-device BindsTo: removing the iface
# (a udev remove) must flip the unit to inactive, and starting it again must
# recreate the iface. Destructive, but _verify only runs against a throwaway
# qemu VM.
- name: _verify | Remove each iface to simulate a manual/driver deletion
  command: ip link delete {{ item.name }}
  loop: "{{ macvlan_blocks }}"
  loop_control:
    label: "{{ item.name }}"
  become: true
  changed_when: true

- name: _verify | Assert BindsTo drove the unit inactive
  systemd:
    name: "{{ item.name }}.service"
  loop: "{{ macvlan_blocks }}"
  loop_control:
    label: "{{ item.name }}"
  become: true
  register: macvlan_verify_drift
  changed_when: false
  retries: 15
  delay: 1
  until: macvlan_verify_drift.status.ActiveState != "active"
  failed_when: macvlan_verify_drift.status.ActiveState == "active"

- name: _verify | Heal by starting the unit again (mirrors a reconverge)
  systemd:
    name: "{{ item.name }}.service"
    state: restarted
  loop: "{{ macvlan_blocks }}"
  loop_control:
    label: "{{ item.name }}"
  become: true

- name: _verify | Assert the iface is back UP after the heal
  command: ip -br link show {{ item.name }}
  loop: "{{ macvlan_blocks }}"
  loop_control:
    label: "{{ item.name }}"
  become: true
  register: macvlan_verify_heal
  changed_when: false
  failed_when: "'UP' not in macvlan_verify_heal.stdout"

- name: _verify | Containers can reach the host over each macvlan network
  vars:
    _macvlan_block: "{{ network | host_vlan_block(inventory_hostname, item.vlan) }}"
  command:
    argv:
      - podman
      - run
      - --rm
      - --cap-add=NET_RAW
      - --network
      - "{{ item.name }}"
      - docker.io/library/busybox
      - sh
      - -c
      - ping -c 1 -W 3 "$1" && ip route
      - sh
      - "{{ _macvlan_block | ansible.utils.ipmath(0) }}"
  loop: "{{ macvlan_blocks }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.podman_network | default(false)
  register: macvlan_verify_container
  changed_when: false
  become: true

# Netavark >= 1.7 honours the networks' no_default_route, leaving a macvlan-only
# container with its on-link route; Noble's 1.4 installs a default anyway.
- name: _verify | Macvlan networks give containers no default route
  when: ansible_distribution_release != 'noble'
  vars:
    _routes: "{{ macvlan_verify_container.results | selectattr('stdout', 'defined') | map(attribute='stdout') | list }}"
  assert:
    that:
      - _routes | length > 0
      - _routes | select('search', '^default', multiline=True) | list | length == 0
    fail_msg: "Container routes: {{ _routes }}"
