---
# Functional probes against the live macvlan ifaces and podman networks,
# not the rendered unit. Only invoked by test/testrole.py against a qemu
# VM; never from site.yml or `mise run ansible --tags macvlan`. Loops the
# same macvlan_blocks the role consumed and derives the expected addresses
# independently so allocation drift is caught.

- name: _verify | Reboot to exercise boot-time interface and ARP setup
  import_role:
    name: reboot
    tasks_from: reboot

- name: _verify | Assert each iface exists and is UP
  command: ip -br link show {{ item.name }}
  loop: "{{ macvlan_blocks }}"
  loop_control:
    label: "{{ item.name }}"
  register: macvlan_verify_link
  become: true
  changed_when: false
  failed_when: "'UP' not in macvlan_verify_link.stdout"

- name: _verify | Assert each iface carries its derived host IP
  vars:
    _macvlan_block: "{{ network | host_vlan_block(inventory_hostname, item.vlan, site=network.hosts[inventory_hostname].site) }}"
  command: ip -4 -o addr show dev {{ item.name }}
  loop: "{{ macvlan_blocks }}"
  loop_control:
    label: "{{ item.name }}"
  register: macvlan_verify_addr
  become: true
  changed_when: false
  failed_when: >-
    ((_macvlan_block | ansible.utils.ipmath(0)) ~ '/32')
    not in macvlan_verify_addr.stdout

- name: _verify | Assert each iface carries its seeded MAC
  command: cat /sys/class/net/{{ item.name }}/address
  loop: "{{ macvlan_blocks }}"
  loop_control:
    label: "{{ item.name }}"
  register: macvlan_verify_mac
  changed_when: false
  failed_when: >-
    macvlan_verify_mac.stdout !=
    ('82:48:10' | random_mac(seed=(inventory_hostname ~ '_' ~ item.name)))

- name: _verify | Assert the block route points at each iface
  vars:
    _macvlan_block: "{{ network | host_vlan_block(inventory_hostname, item.vlan, site=network.hosts[inventory_hostname].site) }}"
  command: ip route show {{ _macvlan_block }} dev {{ item.name }}
  loop: "{{ macvlan_blocks }}"
  loop_control:
    label: "{{ item.name }}"
  register: macvlan_verify_route
  become: true
  changed_when: false
  failed_when: macvlan_verify_route.stdout | length == 0

- name: _verify | Check ARP policy after boot
  import_tasks: _verify_arp.yml

- name: _verify | Introduce ARP drift on parents and children
  command: >-
    sysctl -w net/ipv4/conf/{{ item }}/arp_ignore=0
    net/ipv4/conf/{{ item }}/arp_announce=0
  loop: "{{ macvlan_interfaces }}"
  changed_when: true
  become: true

- name: _verify | Reconverge without changing persisted policy
  import_role:
    name: macvlan

- name: _verify | Check that reconvergence repaired ARP drift
  import_tasks: _verify_arp.yml

# Existence + driver + parent only; the upper-/29 ip_range is exercised
# end-to-end by roles/homeassistant/tasks/_verify.yml (a container actually
# attaches and gets an address from the pool).
- name: _verify | Assert the podman macvlan network exists on the right parent
  command: podman network inspect {{ item.name }}
  loop: "{{ macvlan_blocks }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.podman_network | default(false)
  register: macvlan_verify_podman
  become: true
  changed_when: false
  failed_when: >-
    macvlan_verify_podman.rc != 0
    or 'macvlan' not in macvlan_verify_podman.stdout
    or item.parent not in macvlan_verify_podman.stdout

# Inverse of the above: a block without podman_network must NOT leave a network
# behind (guards against the create task losing its `when` gate).
- name: _verify | Assert no podman network for blocks without podman_network
  command: podman network inspect {{ item.name }}
  loop: "{{ macvlan_blocks }}"
  loop_control:
    label: "{{ item.name }}"
  when: not (item.podman_network | default(false))
  register: macvlan_verify_no_podman
  become: true
  changed_when: false
  failed_when: macvlan_verify_no_podman.rc == 0

# Self-heal regression guard for the child-device BindsTo: removing the iface
# (a udev remove) must flip the unit to inactive, and starting it again must
# recreate the iface. Destructive, but _verify only runs against a throwaway
# qemu VM.
- name: _verify | Remove each iface to simulate a manual/driver deletion
  command: ip link delete {{ item.name }}
  loop: "{{ macvlan_blocks }}"
  loop_control:
    label: "{{ item.name }}"
  become: true
  changed_when: true

- name: _verify | Assert BindsTo drove the unit inactive
  systemd:
    name: "{{ item.name }}.service"
  loop: "{{ macvlan_blocks }}"
  loop_control:
    label: "{{ item.name }}"
  become: true
  register: macvlan_verify_drift
  changed_when: false
  retries: 15
  delay: 1
  until: macvlan_verify_drift.status.ActiveState != "active"
  failed_when: macvlan_verify_drift.status.ActiveState == "active"

- name: _verify | Heal by starting the unit again (mirrors a reconverge)
  systemd:
    name: "{{ item.name }}.service"
    state: restarted
  loop: "{{ macvlan_blocks }}"
  loop_control:
    label: "{{ item.name }}"
  become: true

- name: _verify | Assert the iface is back UP after the heal
  command: ip -br link show {{ item.name }}
  loop: "{{ macvlan_blocks }}"
  loop_control:
    label: "{{ item.name }}"
  become: true
  register: macvlan_verify_heal
  changed_when: false
  failed_when: "'UP' not in macvlan_verify_heal.stdout"

- name: _verify | Check ARP policy after child recreation
  import_tasks: _verify_arp.yml

- name: _verify | Containers can reach the host over each macvlan network
  vars:
    _macvlan_block: "{{ network | host_vlan_block(inventory_hostname, item.vlan, site=network.hosts[inventory_hostname].site) }}"
  command:
    argv:
      - podman
      - run
      - --rm
      - --cap-add=NET_RAW
      - --network
      - "{{ item.name }}"
      - docker.io/library/busybox
      - ping
      - -c
      - '1'
      - -W
      - '3'
      - "{{ _macvlan_block | ansible.utils.ipmath(0) }}"
  loop: "{{ macvlan_blocks }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.podman_network | default(false)
  changed_when: false
  become: true
