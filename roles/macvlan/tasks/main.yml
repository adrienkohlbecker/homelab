# macvlan role: per-host macvlan iface setup.
#
# Driven by host_vars `macvlan_blocks` — a list of macvlan_args dicts,
# one per VLAN-tagged parent the host needs an L2 presence on. Each
# entry brings up a macvlan child interface (mac_mgmt, mac_iot, …) at
# a specified IP, on a specified parent NIC.
#
# Entry schema:
#   name        required; iface name. Also drives the systemd unit
#               filename ({{name}}.service) and the MAC seed. Use
#               `mac_<vlan>` (e.g. `mac_mgmt` for the mgmt VLAN,
#               `mac_iot` for VLAN-tagged subifs).
#   parent      required; parent iface (e.g. `eth0` for mgmt VLAN,
#               `iot` for a VLAN-tagged subif).
#   vlan        required; VLAN key under this host's topology site. The
#               role derives the host's slot-indexed /28 block from
#               data/network_topology.yml. The iface gets a /32 IP
#               within the block, plus a route to the whole block via
#               the iface.
#   host_ip     optional; IP for the iface. Defaults to
#               the derived block's first IP, usable as a host slot
#               only because the iface is /32 + an explicit
#               route to the whole block (nothing treats it as a subnet).
#   mac_address optional; MAC for the iface. Defaults to a stable
#               random MAC seeded by `inventory_hostname_<name>` so
#               sibling blocks on the same host pick distinct MACs.
#   podman_network
#               optional bool, default false. When true the role
#               also creates a podman macvlan network named after
#               the block (same `name`), attached to the same parent,
#               with ip_range = upper /29 of the block. Consumers
#               just attach via `--network={{ name }}` and don't
#               need to know the parent / subnet / ip_range — see
#               roles/homeassistant for an example (it consumes
#               `mac_iot`). Precondition: the network's subnet/gateway
#               derive from the parent's gathered primary IPv4 (subnet =
#               that address's network, gateway = its .1), so the parent
#               must carry the VLAN's address, the VLAN must route via .1,
#               and the derived block must sit within the parent network
#               (asserted).
#
# Hosts that don't trunk any macvlan-bearing VLANs leave macvlan_blocks empty;
# the role no-ops cleanly.

- name: Validate macvlan block inputs
  assert:
    that:
      # The name must be safe in a unit filename, ip argument, and sysctl key.
      - macvlan_args.name is string and macvlan_args.name is match('^[a-z][a-z0-9_]*$')
      - macvlan_args.name | length <= 15
      # parent allows a `.` for VLAN subifs (e.g. eth0.4 / iot).
      - macvlan_args.parent is string and macvlan_args.parent is match('^[a-z][a-z0-9_.]*$')
      - macvlan_args.vlan is string and macvlan_args.vlan is match('^[a-z][a-z0-9_]*$')
      - network.hosts[inventory_hostname].site is defined
      - network.hosts[inventory_hostname].slot is defined
      - network.sites[network.hosts[inventory_hostname].site].vlans[macvlan_args.vlan].cidr is defined
      # Reject malformed overrides before the unit invokes ip.
      - macvlan_args.host_ip is not defined or (macvlan_args.host_ip | ansible.utils.ipaddr) != false
      - "macvlan_args.mac_address is not defined or (macvlan_args.mac_address is match('^([0-9a-fA-F]{2}:){5}[0-9a-fA-F]{2}$'))"
    fail_msg: >-
      macvlan_args invalid for '{{ macvlan_args.name | default('<no name>') }}':
      name must be a kernel-legal iface name (^[a-z][a-z0-9_]*$, <=15 chars),
      parent an iface name, vlan a topology VLAN for this host's site, and
      host_ip/mac_address (if set) a valid IP / MAC.
  loop: "{{ macvlan_blocks }}"
  loop_control:
    loop_var: macvlan_args
    label: "{{ macvlan_args.name }}"
  tags:
    - macvlan

- name: Install iproute2
  apt:
    pkg:
      - iproute2
    cache_valid_time: 3600
  become: true
  tags:
    - macvlan

# Slash-form keys preserve dotted parent names such as eth0.4.
- name: Configure ARP policy for macvlan parents and children
  template:
    src: macvlan_sysctl.conf.j2
    dest: /etc/sysctl.d/30-macvlan.conf
    owner: root
    group: root
    mode: "0644"
    backup: true
    validate: sysctl --dry-run --ignore --load %s
  become: true
  tags:
    - macvlan

# Existing links converge immediately; each unit applies the same file to its
# child before bringing it up. Udev also applies it when a link appears.
- name: Apply ARP policy to existing macvlan parents and children
  ansible.posix.sysctl:
    name: "net/ipv4/conf/{{ item.0 }}/{{ item.1.key }}"
    value: "{{ item.1.value }}"
    sysctl_set: true
    sysctl_file: /etc/sysctl.d/30-macvlan.conf
    reload: false
    ignoreerrors: true # Child keys do not exist until their units create the links.
  loop: "{{ macvlan_interfaces | product(macvlan_arp_settings | dict2items) | list }}"
  loop_control:
    label: "{{ item.0 }}/{{ item.1.key }}"
  become: true
  tags:
    - macvlan

- name: Set up macvlan blocks
  include_tasks: install.yml
  vars:
    macvlan_block: "{{ network | host_vlan_block(inventory_hostname, macvlan_args.vlan, site=network.hosts[inventory_hostname].site) }}"
  loop: "{{ macvlan_blocks }}"
  loop_control:
    loop_var: macvlan_args
    label: "{{ macvlan_args.name }}"
  tags:
    - macvlan
