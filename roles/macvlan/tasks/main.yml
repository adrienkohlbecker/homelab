# Each macvlan_blocks entry requires a child interface name, parent interface,
# and topology VLAN. The child receives the first IP of this host's derived /28
# as a /32, a stable seeded MAC, and a route to the complete block.
#
# podman_network optionally creates a same-named macvlan network from the
# parent's gathered IPv4 subnet and gateway, with the block's upper /29 as its
# container pool. The parent must therefore have an IPv4 fact and contain the
# derived block. An empty macvlan_blocks list makes the role a no-op.

- name: Validate macvlan block inputs
  assert:
    that:
      # The name must be safe in a unit filename and an ip argument.
      - macvlan_args.name is string and macvlan_args.name is match('^[a-z][a-z0-9_]*$')
      - macvlan_args.name | length <= 15
      # parent allows a `.` for VLAN subifs (e.g. eth0.4 / iot).
      - macvlan_args.parent is string and macvlan_args.parent is match('^[a-z][a-z0-9_.]*$')
      - macvlan_args.vlan is string and macvlan_args.vlan is match('^[a-z][a-z0-9_]*$')
      - macvlan_args.podman_network is not defined or macvlan_args.podman_network is boolean
      - network.hosts[inventory_hostname].site is defined
      - network.hosts[inventory_hostname].slot is defined
      - network.sites[network.hosts[inventory_hostname].site].vlans[macvlan_args.vlan].cidr is defined
    fail_msg: >-
      macvlan_args invalid for '{{ macvlan_args.name | default('<no name>') }}':
      name must be a kernel-legal iface name (^[a-z][a-z0-9_]*$, <=15 chars),
      parent an iface name, vlan a topology VLAN for this host's site, and
      podman_network a boolean when set.
  loop: "{{ macvlan_blocks }}"
  loop_control:
    loop_var: macvlan_args
    label: "{{ macvlan_args.name }}"
  tags:
    - macvlan

- name: Install iproute2
  apt:
    pkg:
      - iproute2
    cache_valid_time: 3600
  become: true
  tags:
    - macvlan

# The firewall role's all.arp_ignore/arp_announce pins cover every parent and
# child, since the kernel applies the stricter of `all` and the interface.
# Drop this once lab and pug have converged.
- name: Remove retired per-interface ARP policy
  file:
    path: /etc/sysctl.d/30-macvlan.conf
    state: absent
  become: true
  tags:
    - macvlan

- name: Set up macvlan blocks
  include_tasks: install.yml
  vars:
    macvlan_block: "{{ network | host_vlan_block(inventory_hostname, macvlan_args.vlan) }}"
  loop: "{{ macvlan_blocks }}"
  loop_control:
    loop_var: macvlan_args
    label: "{{ macvlan_args.name }}"
  tags:
    - macvlan
