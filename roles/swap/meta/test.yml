# Lab exercises mdadm RAID1 partition swap on a full image that already
# carries zram. Minimal exercises zram-only installation: Resolute ships zram in
# the base module package, Noble pulls it from linux-modules-extra.
machines:
  lab:
  minimal:
ubuntu:
  - noble
skip:
  "lab:noble": >-
    Minimal covers Noble's zram path; Lab's partition swap is
    release-independent.
