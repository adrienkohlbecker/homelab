# Lab exercises mdadm RAID1 partition swap on a full image that already
# carries zram. Minimal exercises zram-only installation: Noble pulls zram
# from linux-modules-extra, Resolute ships it in the base module package.
machines:
  lab:
  minimal:
ubuntu:
  - resolute
skip:
  "lab:resolute": >-
    Minimal covers Resolute's zram path; Lab's partition swap is
    release-independent.
