# Manage required zram swap plus an optional preformatted raw-partition
# overflow device. See notes/swap_strategy.md.
#
# Direct swapon gives immediate activation; the fstab entry persists it.
# An already-active device reports "Device or resource busy", which is the
# idempotent success case.

- name: Validate swap input schema
  assert:
    that:
      - swap_zram_size is defined
      - swap_partition is not defined or (swap_partition is string and swap_partition | length > 0)
    fail_msg: >-
      swap_zram_size is required; swap_partition must be a non-empty device path.
  tags:
    - swap

# Raw-partition swap (no formatting; takes the device as-is)
- name: Verify partition carries a swap signature
  when: swap_partition is defined
  command: blkid -p --usages other -s TYPE -o value {{ swap_partition }}
  register: swap_partition_blkid
  changed_when: false
  check_mode: false
  failed_when: false # evaluated by the assert below so rc==8 gets a real message
  become: true
  tags:
    - swap

- name: Assert the partition carries a clean swap signature
  when: swap_partition is defined
  assert:
    that: swap_partition_blkid.stdout | default('') == 'swap'
    fail_msg: >-
      {{ swap_partition }} is not a clean swap device (blkid
      TYPE={{ swap_partition_blkid.stdout | default('<none>') }},
      rc={{ swap_partition_blkid.rc }}).
      {{ 'rc=8 means ambivalent/multiple on-disk signatures -- wipefs the device first.'
         if swap_partition_blkid.rc == 8
         else 'The role never reformats a partition; it must already carry a swap signature.' }}
  tags:
    - swap

- name: Add partition swap to /etc/fstab
  when: swap_partition is defined
  mount:
    path: none
    src: "{{ swap_partition }}"
    fstype: swap
    opts: defaults,nofail,discard=once,pri=10
    state: present
    backup: true
  become: true
  tags:
    - swap

- name: Activate partition swap
  when: swap_partition is defined
  # Match the persistent priority and one-time SSD trim policy immediately.
  command: swapon --priority 10 --discard=once {{ swap_partition }}
  register: swap_partition_swapon
  changed_when: swap_partition_swapon.rc == 0
  failed_when:
    - swap_partition_swapon.rc != 0
    - "'Device or resource busy' not in swap_partition_swapon.stderr"
  become: true
  tags:
    - swap

# zram-backed swap (primary, high-priority)
# Minimal cloud images omit optional kernel modules; full images already carry
# zram and skip the extra package.
- name: Probe for the zram kernel module
  command: modinfo -k {{ ansible_kernel }} zram
  register: swap_zram_module
  changed_when: false
  failed_when: false
  check_mode: false
  become: true
  tags:
    - swap

- name: Install optional kernel modules when zram is absent
  when: swap_zram_module.rc != 0
  apt:
    name: linux-modules-extra-{{ ansible_kernel }}
    state: present
    cache_valid_time: 3600
  register: swap_zram_modules_installed
  become: true
  tags:
    - swap

- name: Verify the zram kernel module is available
  when: not (ansible_check_mode and (swap_zram_modules_installed.changed | default(false)))
  command: modinfo -k {{ ansible_kernel }} zram
  changed_when: false
  become: true
  tags:
    - swap

- name: Install systemd-zram-generator
  apt:
    name: systemd-zram-generator
    state: present
    cache_valid_time: 3600
  register: swap_zram_installed
  become: true
  tags:
    - swap

- name: Configure zram swap device
  template:
    src: zram-generator.conf.j2
    dest: /etc/systemd/zram-generator.conf
    owner: root
    group: root
    mode: "0644"
    backup: true
    validate: python3 -c 'import configparser,sys; configparser.ConfigParser(strict=False,delimiters=("=",)).read(sys.argv[1])' "%s"
  register: swap_zram_conf
  become: true
  tags:
    - swap

# daemon-reload reruns the generator; restarting applies configuration changes.
# Skip a predicted package/config change in check mode because the generated
# unit does not exist yet.
- name: Activate zram swap device
  when: not (ansible_check_mode and (swap_zram_installed.changed or swap_zram_conf.changed))
  systemd:
    name: dev-zram0.swap
    state: "{{ 'restarted' if swap_zram_conf.changed else 'started' }}"
    daemon_reload: "{{ swap_zram_conf.changed }}"
  become: true
  tags:
    - swap

# Prefer cheap compressed-RAM paging over the disk-tuned swappiness default.
# Disable disk-oriented readahead because zram has no seek penalty.
- name: Tune virtual memory policy for zram
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value | string }}"
    sysctl_file: /etc/sysctl.d/30-swap.conf
    state: present
    reload: true
  loop:
    - name: vm.swappiness
      value: "{{ swap_swappiness }}"
    - name: vm.page-cluster
      value: 0
  loop_control:
    label: "{{ item.name }}={{ item.value }}"
  become: true
  tags:
    - swap
