# Packer bakes an fstab entry for the same device the role manages. Remove it so
# the fixture exercises the role's fstab-write and swapon path without creating
# a duplicate entry through a different device name.
- name: _setup | Deactivate packer-baked swap
  when: swap_partition is defined
  command: swapoff -a
  changed_when: false
  become: true

- name: _setup | Remove packer-baked swap fstab entry
  when: swap_partition is defined
  lineinfile:
    path: /etc/fstab
    regexp: '\sswap\s'
    state: absent
  become: true
