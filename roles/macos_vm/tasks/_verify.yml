- name: _verify | Exercise an explicit MAC address through production resolution
  import_tasks: resolve_mac.yml
  vars:
    macos_vm_mac_address: 02:00:00:00:00:02

- name: _verify | Preserve the explicit MAC address
  assert:
    that: macos_vm_resolved_mac == '02:00:00:00:00:02'

- name: _verify | Exercise unchanged service startup through production tasks
  import_tasks: service.yml
  vars:
    macos_vm_disk_source: "/dev/zvol/{{ macos_vm_zvol_dataset }}"
    macos_vm_start_service: true
    macos_vm_workdir_result:
      changed: false
  check_mode: true

- name: _verify | Create missing firmware fixture
  tempfile:
    state: directory
    suffix: macos_vm_missing_firmware
  register: macos_vm_missing_firmware_fixture

- name: _verify | Exercise missing firmware through production tasks
  block:
    - name: _verify | Predict seeding the missing OVMF vars
      import_tasks: service.yml
      vars:
        macos_vm_workdir: "{{ macos_vm_missing_firmware_fixture.path }}"
        macos_vm_disk_source: "/dev/zvol/{{ macos_vm_zvol_dataset }}"
        macos_vm_autostart: false
        macos_vm_start_service: true
        macos_vm_workdir_result:
          changed: false
      check_mode: true

    - name: _verify | Missing firmware predicts a seed
      assert:
        that:
          - not macos_vm_ovmf_vars.stat.exists
          - macos_vm_ovmf_vars_result.changed

  always:
    - name: _verify | Remove missing firmware fixture
      file:
        path: "{{ macos_vm_missing_firmware_fixture.path }}"
        state: absent

- name: _verify | Render production units for both execution modes
  template:
    src: macos_vm.service.j2
    dest: "/tmp/macos-vm-{{ item.label }}.service"
    mode: "0644"
  vars:
    macos_vm_name: verify
    macos_vm_workdir: /mnt/services/macos_vm
    macos_vm_disk_source: /dev/zvol/tank/macos_vm
    macos_vm_memory_mib: 4096
    macos_vm_vcpus: 2
    macos_vm_resolved_mac: 02:00:00:00:00:01
    macos_vm_ssh_host_listen: 127.0.0.1
    macos_vm_ssh_host_port: 2222
    macos_vm_vnc_keymap: en-us
    macos_vm_vnc_listen: 127.0.0.1
    macos_vm_install_mode: "{{ item.install_mode }}"
    macos_vm_cpu_pinset: "{{ item.cpu_pinset }}"
    macos_vm_domain_type: "{{ item.domain_type }}"
  loop:
    - label: install_kvm
      install_mode: true
      cpu_pinset: 0,1
      domain_type: kvm
    - label: running_tcg
      install_mode: false
      cpu_pinset: ""
      domain_type: qemu
  become: true

- name: _verify | Verify both macOS VM execution modes
  command:
    argv:
      - python3
      - -c
      - |
        import pathlib

        install = pathlib.Path("/tmp/macos-vm-install_kvm.service").read_text()
        assert "ConditionPathExists=/mnt/services/macos_vm/BaseSystem.img" in install
        assert "ExecStart=/usr/bin/taskset -c 0,1 /usr/bin/qemu-system-x86_64" in install
        assert "-enable-kvm" in install
        running = pathlib.Path("/tmp/macos-vm-running_tcg.service").read_text()
        assert "BaseSystem.img" not in running
        assert "taskset" not in running
        assert "-enable-kvm" not in running
  changed_when: false
  become: true

- name: _verify | Remove alternate macOS VM units
  file:
    path: "/tmp/macos-vm-{{ item }}.service"
    state: absent
  loop:
    - install_kvm
    - running_tcg
  become: true

- name: _verify | Create firmware guard fixture
  tempfile:
    state: directory
    suffix: macos_vm_firmware
  register: macos_vm_firmware_fixture

- name: _verify | Reject incompatible firmware without changing a running service
  block:
    - name: _verify | Write incompatible firmware
      copy:
        content: incompatible firmware fixture
        dest: "{{ macos_vm_firmware_fixture.path }}/OVMF_VARS.fd"
        mode: "0644"

    - name: _verify | Install probe service
      copy:
        content: |
          [Service]
          ExecStart=/usr/bin/sleep infinity
          [Install]
          WantedBy=multi-user.target
        dest: /etc/systemd/system/macos-vm-firmware_verify.service
        mode: "0644"
      become: true

    - name: _verify | Start probe service
      systemd:
        name: macos-vm-firmware_verify.service
        daemon_reload: true
        state: started
        enabled: false
      become: true

    - name: _verify | Read initial service state  # noqa: command-instead-of-module
      command: systemctl show macos-vm-firmware_verify.service -p MainPID -p ActiveState -p UnitFileState -p ExecMainStartTimestampMonotonic
      changed_when: false
      register: macos_vm_probe_before

    - name: _verify | Exercise firmware guard
      block:
        - name: _verify | Apply service tasks with incompatible firmware
          import_role:
            name: macos_vm
            tasks_from: service
          vars:
            macos_vm_name: firmware_verify
            macos_vm_workdir: "{{ macos_vm_firmware_fixture.path }}"
            macos_vm_autostart: true
            macos_vm_start_service: true

        - name: _verify | Reject an unexpectedly successful converge
          fail:
            msg: Incompatible firmware was accepted

      rescue:
        - name: _verify | Require the firmware guard failure
          assert:
            that:
              - "'Require compatible OVMF vars before changing the service' in ansible_failed_task.name"

    - name: _verify | Read service state after rejection  # noqa: command-instead-of-module
      command: systemctl show macos-vm-firmware_verify.service -p MainPID -p ActiveState -p UnitFileState -p ExecMainStartTimestampMonotonic
      changed_when: false
      register: macos_vm_probe_after

    - name: _verify | Read firmware after rejection
      slurp:
        src: "{{ macos_vm_firmware_fixture.path }}/OVMF_VARS.fd"
      register: macos_vm_probe_firmware

    - name: _verify | Require untouched firmware and running service
      assert:
        that:
          - "'ActiveState=active' in macos_vm_probe_before.stdout"
          - macos_vm_probe_after.stdout == macos_vm_probe_before.stdout
          - macos_vm_probe_firmware.content | b64decode == 'incompatible firmware fixture'

  always:
    - name: _verify | Stop probe service
      systemd:
        name: macos-vm-firmware_verify.service
        state: stopped
        enabled: false
      become: true

    - name: _verify | Remove probe unit
      file:
        path: /etc/systemd/system/macos-vm-firmware_verify.service
        state: absent
      become: true

    - name: _verify | Reload systemd after probe cleanup
      systemd:
        daemon_reload: true
      become: true

    - name: _verify | Remove firmware fixture
      file:
        path: "{{ macos_vm_firmware_fixture.path }}"
        state: absent
