- name: _verify | Exercise cached recovery artifacts through production tasks
  import_tasks: artifacts.yml

- name: _verify | Cached recovery image skips conversion
  assert:
    that:
      - not macos_vm_basesystem_convert_result.changed
      - macos_vm_basesystem_publish_result.skipped

- name: _verify | Create unsupported recovery image fixture
  tempfile:
    state: directory
    suffix: macos_vm_recovery
  register: macos_vm_recovery_fixture
  become: true

- name: _verify | Reject conversion with unsupported compression
  block:
    - name: _verify | Stage recovery image with an LZFSE block
      # The synthetic UDIF has a zlib prefix followed by LZFSE data, which
      # qemu-img cannot decode without its LZFSE module.
      copy:
        src: _verify_basesystem.dmg
        dest: "{{ macos_vm_recovery_fixture.path }}/BaseSystem.dmg"
        mode: "0644"
      become: true

    - name: _verify | Seed partial output left by an interrupted conversion
      copy:
        content: "incomplete recovery image\n"
        dest: "{{ macos_vm_recovery_fixture.path }}/BaseSystem.img.partial"
        mode: "0644"
      become: true

    - name: _verify | Exercise recovery rejection through production tasks
      block:
        - name: _verify | Apply artifacts with unsupported recovery compression
          import_tasks: artifacts.yml
          vars:
            macos_vm_install_mode: true
            macos_vm_workdir: "{{ macos_vm_recovery_fixture.path }}"

        - name: _verify | Reject an unexpectedly successful conversion
          fail:
            msg: Unsupported recovery compression was accepted

      rescue:
        - name: _verify | Require conversion to fail on the undecodable block
          assert:
            that:
              - "'Report recovery image failure' in ansible_failed_task.name"
              - macos_vm_basesystem_convert_result is failed
              # A read error, not an open or probe failure, proves qemu-img
              # parsed the image and refused the undecodable block.
              - "'Input/output error' in macos_vm_basesystem_convert_result.stderr"
              - "'was removed' in ansible_failed_result.msg"

    - name: _verify | Read rejected recovery image state
      stat:
        path: "{{ macos_vm_recovery_fixture.path }}/{{ item }}"
      loop:
        - BaseSystem.img
        - BaseSystem.img.partial
        - BaseSystem.dmg
      register: macos_vm_rejected_recovery
      become: true

    - name: _verify | Require removed output and retained source
      assert:
        that:
          - not macos_vm_rejected_recovery.results[0].stat.exists
          - not macos_vm_rejected_recovery.results[1].stat.exists
          - macos_vm_rejected_recovery.results[2].stat.exists

  always:
    - name: _verify | Remove unsupported recovery image fixture
      file:
        path: "{{ macos_vm_recovery_fixture.path }}"
        state: absent
      become: true

- name: _verify | Preserve the explicit MAC address
  vars:
    macos_vm_mac_address: 02:00:00:00:00:02
  assert:
    that: macos_vm_resolved_mac == '02:00:00:00:00:02'

- name: _verify | Exercise unchanged service startup through production tasks
  import_tasks: service.yml
  vars:
    macos_vm_disk_source: "/dev/zvol/{{ macos_vm_zvol_dataset }}"
    macos_vm_start_service: true
    macos_vm_workdir_result:
      changed: false
  check_mode: true

- name: _verify | Converged unit is unchanged
  assert:
    that: not macos_vm_chi_service_result.changed

- name: _verify | Create missing firmware fixture
  tempfile:
    state: directory
    suffix: macos_vm_missing_firmware
  register: macos_vm_missing_firmware_fixture

- name: _verify | Exercise missing firmware through production tasks
  block:
    - name: _verify | Predict seeding the missing OVMF vars
      import_tasks: service.yml
      vars:
        macos_vm_workdir: "{{ macos_vm_missing_firmware_fixture.path }}"
        macos_vm_disk_source: "/dev/zvol/{{ macos_vm_zvol_dataset }}"
        macos_vm_autostart: false
        macos_vm_start_service: true
        macos_vm_workdir_result:
          changed: false
      check_mode: true

    - name: _verify | Missing firmware predicts a seed
      assert:
        that:
          - not macos_vm_ovmf_vars.stat.exists
          - macos_vm_ovmf_vars_result.changed

  always:
    - name: _verify | Remove missing firmware fixture
      file:
        path: "{{ macos_vm_missing_firmware_fixture.path }}"
        state: absent

- name: _verify | Verify both macOS VM execution modes
  vars:
    macos_vm_name: verify
    macos_vm_workdir: /mnt/services/macos_vm
    macos_vm_disk_source: /dev/zvol/tank/macos_vm
  block:
    - name: _verify | Verify install-mode KVM unit
      vars:
        macos_vm_install_mode: true
        macos_vm_cpu_pinset: 0,1
        macos_vm_domain_type: kvm
        _macos_vm_unit: "{{ lookup('template', role_path ~ '/templates/macos_vm.service.j2') }}"
      assert:
        that:
          - "'ConditionPathExists=/mnt/services/macos_vm/BaseSystem.img' in _macos_vm_unit"
          - "'ExecStart=/usr/bin/taskset -c 0,1 /usr/bin/qemu-system-x86_64' in _macos_vm_unit"
          - "'-enable-kvm' in _macos_vm_unit"

    - name: _verify | Verify running TCG unit
      vars:
        macos_vm_install_mode: false
        macos_vm_cpu_pinset: ""
        macos_vm_domain_type: qemu
        _macos_vm_unit: "{{ lookup('template', role_path ~ '/templates/macos_vm.service.j2') }}"
      assert:
        that:
          - "'BaseSystem.img' not in _macos_vm_unit"
          - "'taskset' not in _macos_vm_unit"
          - "'-enable-kvm' not in _macos_vm_unit"

- name: _verify | Create firmware guard fixture
  tempfile:
    state: directory
    suffix: macos_vm_firmware
  register: macos_vm_firmware_fixture

- name: _verify | Reject incompatible firmware without changing a running service
  block:
    - name: _verify | Write incompatible firmware
      copy:
        content: incompatible firmware fixture
        dest: "{{ macos_vm_firmware_fixture.path }}/OVMF_VARS.fd"
        mode: "0644"

    - name: _verify | Install probe service
      copy:
        content: |
          [Service]
          ExecStart=/usr/bin/sleep infinity
          [Install]
          WantedBy=multi-user.target
        dest: /etc/systemd/system/macos-vm-firmware_verify.service
        mode: "0644"
      become: true

    - name: _verify | Start probe service
      systemd:
        name: macos-vm-firmware_verify.service
        daemon_reload: true
        state: started
        enabled: false
      become: true

    - name: _verify | Read initial service state  # noqa: command-instead-of-module
      command: systemctl show macos-vm-firmware_verify.service -p MainPID -p ActiveState -p UnitFileState -p ExecMainStartTimestampMonotonic
      changed_when: false
      register: macos_vm_probe_before

    - name: _verify | Exercise firmware guard
      block:
        - name: _verify | Apply service tasks with incompatible firmware
          import_role:
            name: macos_vm
            tasks_from: service
          vars:
            macos_vm_name: firmware_verify
            macos_vm_workdir: "{{ macos_vm_firmware_fixture.path }}"
            macos_vm_autostart: true
            macos_vm_start_service: true

        - name: _verify | Reject an unexpectedly successful converge
          fail:
            msg: Incompatible firmware was accepted

      rescue:
        - name: _verify | Require the firmware guard failure
          assert:
            that:
              - "'Require compatible OVMF vars before changing the service' in ansible_failed_task.name"

    - name: _verify | Read service state after rejection  # noqa: command-instead-of-module
      command: systemctl show macos-vm-firmware_verify.service -p MainPID -p ActiveState -p UnitFileState -p ExecMainStartTimestampMonotonic
      changed_when: false
      register: macos_vm_probe_after

    - name: _verify | Read firmware after rejection
      slurp:
        src: "{{ macos_vm_firmware_fixture.path }}/OVMF_VARS.fd"
      register: macos_vm_probe_firmware

    - name: _verify | Require untouched firmware and running service
      assert:
        that:
          - "'ActiveState=active' in macos_vm_probe_before.stdout"
          - macos_vm_probe_after.stdout == macos_vm_probe_before.stdout
          - macos_vm_probe_firmware.content | b64decode == 'incompatible firmware fixture'

  always:
    - name: _verify | Stop probe service
      systemd:
        name: macos-vm-firmware_verify.service
        state: stopped
        enabled: false
      become: true

    - name: _verify | Remove probe unit
      file:
        path: /etc/systemd/system/macos-vm-firmware_verify.service
        state: absent
      become: true

    - name: _verify | Reload systemd after probe cleanup
      systemd:
        daemon_reload: true
      become: true

    - name: _verify | Remove firmware fixture
      file:
        path: "{{ macos_vm_firmware_fixture.path }}"
        state: absent

- name: _verify | Start the rendered unit under this release's QEMU
  import_tasks: _verify_qemu_start.yml
