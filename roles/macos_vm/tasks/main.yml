- name: Validate inputs
  assert:
    that:
      - zfs_root | bool
      - zfs_dozer_filesystem | length > 0
      - (macos_vm_zvol_size | human_to_bytes | int) > 0
      - macos_vm_domain_type in ['kvm', 'qemu']
      - macos_vm_memory_mib | int >= 4096
    fail_msg: >-
      macos_vm requires a ZFS host with zfs_dozer_filesystem, a positive
      macos_vm_zvol_size, macos_vm_domain_type kvm or qemu, and at least
      4096 MiB of macos_vm_memory_mib.
  tags:
    - macos_vm

- name: Install QEMU runtime dependencies
  apt:
    pkg:
      - fdisk
      - mtools
      - ovmf
      - qemu-block-extra
      - qemu-system-x86
      - qemu-utils
    cache_valid_time: 3600
  become: true
  tags:
    - macos_vm

- name: Fetch and stage upstream artifacts
  import_tasks: artifacts.yml
  tags:
    - macos_vm

- name: Configure VM storage
  import_tasks: storage.yml
  tags:
    - macos_vm

- name: Install QEMU systemd service
  import_tasks: service.yml
  tags:
    - macos_vm
