# Start the rendered unit's QEMU command, paused, under this release's QEMU.
# QEMU validates every option, device, and drive before the guest runs, so
# this proves the release accepts the unit and records the machine model the
# guest would see. Install mode attaches every drive, so it also covers the
# post-install command line. TCG keeps the check independent of nested KVM,
# and a small guest RAM fits the fixture: -S still allocates it up front.
- name: _verify | Create a QEMU start fixture
  tempfile:
    state: directory
    # Not tmpfs: the unit's cache=none disk needs O_DIRECT.
    path: /var/tmp
    suffix: macos_vm_start
  register: macos_vm_start_fixture
  become: true

- name: _verify | Start the rendered QEMU command
  vars:
    macos_vm_name: verify
    macos_vm_workdir: "{{ macos_vm_start_fixture.path }}"
    macos_vm_disk_source: "{{ macos_vm_start_fixture.path }}/disk.raw"
    macos_vm_install_mode: true
    macos_vm_cpu_pinset: ""
    macos_vm_domain_type: qemu
    macos_vm_memory_mib: 512
  block:
    - name: _verify | Create the QEMU start disks
      command:
        argv:
          - qemu-img
          - create
          - -f
          - "{{ item.format }}"
          - "{{ item.path }}"
          - 64M
      loop:
        - format: qcow2
          path: "{{ macos_vm_workdir }}/OpenCore.qcow2"
        - format: raw
          path: "{{ macos_vm_disk_source }}"
        - format: raw
          path: "{{ macos_vm_workdir }}/BaseSystem.img"
      changed_when: true
      become: true

    - name: _verify | Seed the QEMU start firmware vars
      copy:
        src: /usr/share/OVMF/OVMF_VARS_4M.fd
        dest: "{{ macos_vm_workdir }}/OVMF_VARS.fd"
        remote_src: true
        mode: "0600"
      become: true

    - name: _verify | Render the QEMU start unit
      template:
        src: macos_vm.service.j2
        dest: "{{ macos_vm_workdir }}/macos_vm.service"
        mode: "0644"
      become: true

    # -S holds the guest before its first instruction; QMP then reads the
    # resolved machine type and quits.
    - name: _verify | Start QEMU paused and query its machine type
      command:
        argv:
          - python3
          - -c
          - |
            import json
            import os
            import shlex
            import subprocess
            import sys

            unit = open(sys.argv[1]).read().replace("\\\n", " ")
            exec_start = next(line for line in unit.splitlines() if line.startswith("ExecStart="))
            argv = shlex.split(exec_start.removeprefix("ExecStart="))
            env = dict(os.environ)
            env.update(
                line.removeprefix("Environment=").split("=", 1)
                for line in unit.splitlines()
                if line.startswith("Environment=")
            )
            os.makedirs("/run/macos-vm", exist_ok=True)
            commands = [
                {"execute": "qmp_capabilities"},
                {"execute": "qom-get", "arguments": {"path": "/machine", "property": "type"}},
                {"execute": "quit"},
            ]
            proc = subprocess.run(
                [*argv, "-S", "-qmp", "stdio"],
                input="".join(json.dumps(command) + "\n" for command in commands),
                capture_output=True,
                text=True,
                env=env,
                timeout=120,
            )
            replies = [json.loads(line) for line in proc.stdout.splitlines() if line.startswith("{")]
            print(json.dumps({
                "rc": proc.returncode,
                "machine": [reply["return"] for reply in replies if isinstance(reply.get("return"), str)],
                "stderr": proc.stderr,
            }))
          - "{{ macos_vm_workdir }}/macos_vm.service"
      register: macos_vm_start
      changed_when: false
      become: true

    - name: _verify | QEMU accepted the unit on the pinned machine model
      vars:
        _macos_vm_start: "{{ macos_vm_start.stdout | from_json }}"
      assert:
        that:
          - _macos_vm_start.rc == 0
          - _macos_vm_start.machine == ['pc-q35-8.2-machine']
          - "'deprecated' not in (_macos_vm_start.stderr | lower)"
        fail_msg: "{{ _macos_vm_start | to_json }}"

  always:
    - name: _verify | Remove the QEMU start fixture
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ macos_vm_start_fixture.path }}"
        - /run/macos-vm/verify.monitor
      become: true
