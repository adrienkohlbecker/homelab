# Recreate the retired libvirt role's dataset with a used per-VM NVRAM store,
# so converge exercises the adoption path that tasks/_verify.yml checks.
- name: _setup | Create the retired libvirt dataset
  community.general.zfs:
    name: rpool/libvirt
    state: present
    extra_zfs_properties:
      mountpoint: /var/lib/libvirt/images
  become: true

- name: _setup | Create the retired per-VM workdir
  file:
    path: /var/lib/libvirt/images/macos-vm/{{ macos_vm_name }}
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: _setup | Seed retired libvirt state
  copy:
    content: "{{ item.content }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - dest: /var/lib/libvirt/images/macos-vm/{{ macos_vm_name }}/OVMF_VARS.fd
      content: "adopted NVRAM fixture\n"
    - dest: /var/lib/libvirt/images/pool_default.xml
      content: "<pool/>\n"
  loop_control:
    label: "{{ item.dest }}"
  become: true
