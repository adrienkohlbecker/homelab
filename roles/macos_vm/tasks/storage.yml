# Working files live on an rpool dataset. The block-device source is a sparse
# ZFS volume, created or grown here, whose /dev/zvol path QEMU opens as a raw
# block device.

# rpool/libvirt held the workdir under macos-vm/ before the libvirt role
# retired. Renaming it keeps the seeded OpenCore image and OVMF NVRAM, which
# must not be re-seeded once a guest has used them; the moves flatten the
# subdirectory onto the new mountpoint and drop libvirt's own config dumps.
- name: storage | Adopt the retired libvirt dataset
  shell: |
    set -euo pipefail
    zfs rename rpool/libvirt rpool/macos_vm
    zfs set mountpoint=/var/lib/macos_vm rpool/macos_vm
    mv /var/lib/macos_vm/macos-vm/* /var/lib/macos_vm/
    rmdir /var/lib/macos_vm/macos-vm
    rm -f /var/lib/macos_vm/net_default.xml /var/lib/macos_vm/pool_default.xml
  args:
    executable: /bin/bash
    creates: /var/lib/macos_vm
    removes: /var/lib/libvirt/images/macos-vm
  become: true

- name: storage | Create and mount the workdir dataset
  import_role:
    name: zfs_dataset
    tasks_from: dataset
  vars:
    zfs_dataset_args:
      dataset: rpool/macos_vm
      mountpoint: /var/lib/macos_vm
      owner: root
      group: root
      mode: "0711"
      extra_properties:
        # Match qemu's default qcow2 cluster size.
        recordsize: '65536'
        # The guest caches its own pages; keep them out of the host ARC.
        primarycache: metadata
        # Limit atime writes without disabling access-time accounting.
        relatime: 'on'
        # Downloaded artifacts and VM working files are not replicated.
        'autobackup:bak': 'false'

- name: storage | Create macOS zvol parent datasets
  community.general.zfs:
    name: "{{ item }}"
    state: present
    extra_zfs_properties:
      mountpoint: none
  loop:
    - "{{ zfs_dozer_filesystem }}/vms"
    - "{{ zfs_dozer_filesystem }}/vms/macos"
  become: true
  tags:
    - macos_vm

- name: storage | Read current macOS zvol size
  ansible.builtin.command:
    cmd: "zfs get -Hp -o value volsize {{ macos_vm_zvol_dataset }}"
  register: macos_vm_zvol_current
  changed_when: false
  failed_when: false
  check_mode: false
  become: true
  tags:
    - macos_vm

- name: storage | Assert macOS zvol size probe did not error unexpectedly
  when:
    - macos_vm_zvol_current.rc != 0
  assert:
    that: "'does not exist' in macos_vm_zvol_current.stderr"
    fail_msg: >-
      `zfs get volsize {{ macos_vm_zvol_dataset }}` failed unexpectedly
      (rc={{ macos_vm_zvol_current.rc }}): {{ macos_vm_zvol_current.stderr | trim }}.
      Refusing to proceed because the zvol shrink guard cannot verify the current size.
  tags:
    - macos_vm

- name: storage | Refuse to shrink macOS zvol
  when:
    - macos_vm_zvol_current.rc == 0
  assert:
    that: (macos_vm_zvol_size | human_to_bytes) >= (macos_vm_zvol_current.stdout | int)
    fail_msg: >-
      Refusing to shrink {{ macos_vm_zvol_dataset }} from {{ macos_vm_zvol_current.stdout }}
      to {{ macos_vm_zvol_size | human_to_bytes }} bytes. Shrinking would corrupt APFS.
      Create a new smaller zvol and reinstall/restore instead.
  tags:
    - macos_vm

- name: storage | Create or update macOS zvol
  community.general.zfs:
    name: "{{ macos_vm_zvol_dataset }}"
    state: present
    extra_zfs_properties:
      volsize: "{{ macos_vm_zvol_size | human_to_bytes | string }}"
      # Creation-only: the module tries to rewrite properties whose source is default.
      volblocksize: "{{ macos_vm_zvol_volblocksize if macos_vm_zvol_current.rc != 0 else omit }}"
      compression: "{{ macos_vm_zvol_compression }}"
      volmode: dev
      refreservation: "0"
      logbias: throughput
      redundant_metadata: most
  become: true
  tags:
    - macos_vm

# QEMU runs as root and needs no group grant on the zvol device.
- name: storage | Remove the zvol permission udev rule
  file:
    path: "/etc/udev/rules.d/70-macos-vm-{{ macos_vm_name }}-zvol.rules"
    state: absent
  become: true
  tags:
    - macos_vm

- name: storage | Set zvol disk source path
  set_fact:
    macos_vm_disk_source: "/dev/zvol/{{ macos_vm_zvol_dataset }}"
  tags:
    - macos_vm
