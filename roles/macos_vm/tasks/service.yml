- name: service | Seed missing OVMF vars
  when: not (ansible_check_mode and macos_vm_workdir_result.changed)
  copy:
    src: /usr/share/OVMF/OVMF_VARS_4M.fd
    dest: "{{ macos_vm_workdir }}/OVMF_VARS.fd"
    remote_src: true
    owner: root
    group: root
    mode: "0644"
    force: false
    backup: true
  become: true

- name: service | Install QEMU service
  import_role:
    name: systemd_unit
    tasks_from: unit
  vars:
    systemd_unit_args:
      src: macos_vm.service.j2
      dest: "macos-vm-{{ macos_vm_name }}.service"
      enable: "{{ macos_vm_autostart }}"
      start: "{{ macos_vm_start_service }}"
