# Seed OpenCore once; existing per-VM images retain guest identity state.

- name: artifacts | Create artifacts cache dir
  file:
    path: "{{ macos_vm_artifacts_dir }}"
    state: directory
    owner: root
    group: kvm
    mode: "0755"
  become: true
  register: macos_vm_artifacts_dir_result

- name: artifacts | Create per-VM workdir
  file:
    path: "{{ macos_vm_workdir }}"
    state: directory
    owner: root
    group: kvm
    mode: "0755"
  become: true
  register: macos_vm_workdir_result

- name: artifacts | Fetch pinned OpenCore.qcow2
  # Skip in check mode if the dir was just (notionally) created; in check
  # mode the dir doesn't actually exist on disk so get_url's destination
  # check fails. On a real run the dir is real and the task proceeds.
  when: not (ansible_check_mode and macos_vm_artifacts_dir_result.changed)
  get_url:
    url: "{{ macos_vm_opencore_artifact.url }}"
    dest: "{{ macos_vm_artifacts_dir }}/OpenCore.qcow2"
    checksum: "sha256:{{ macos_vm_opencore_artifact.sha256 }}"
    owner: root
    group: kvm
    mode: "0644"
  become: true

- name: artifacts | Seed per-VM OpenCore image
  when: not ansible_check_mode
  script:
    cmd: >-
      seed_opencore.py
      {{ (macos_vm_artifacts_dir ~ '/OpenCore.qcow2') | quote }}
      {{ (macos_vm_workdir ~ '/OpenCore.qcow2') | quote }}
      --prev-lang-kbd={{ macos_vm_opencore_prev_lang_kbd | quote }}
      --apple-locale={{ macos_vm_opencore_apple_locale | quote }}
      --boot-args={{ macos_vm_opencore_boot_args | quote }}
    executable: /usr/bin/python3
    creates: "{{ macos_vm_workdir }}/OpenCore.qcow2"
  register: macos_vm_opencore_seed
  changed_when: "'changed' in macos_vm_opencore_seed.stdout | default('')"
  become: true

- name: artifacts | Stage fetch-macOS script
  when:
    - macos_vm_install_mode
    - not (ansible_check_mode and macos_vm_artifacts_dir_result.changed)
  get_url:
    url: "{{ macos_vm_fetch_macos_artifact.url }}"
    dest: "{{ macos_vm_artifacts_dir }}/fetch-macOS-v2.py"
    checksum: "sha256:{{ macos_vm_fetch_macos_artifact.sha256 }}"
    owner: root
    group: root
    mode: "0755"
  become: true

- name: artifacts | Install python deps for fetch-macOS
  when: macos_vm_install_mode
  apt:
    pkg:
      - python3-requests
    cache_valid_time: 3600
  become: true

- name: artifacts | Fetch BaseSystem recovery image
  when:
    - macos_vm_install_mode
    - not (ansible_check_mode and (macos_vm_artifacts_dir_result.changed or macos_vm_workdir_result.changed))
  ansible.builtin.command:
    # fetch-macOS-v2.py calls os.get_terminal_size() while verifying the
    # chunklist, so give it a pseudo-terminal even though Ansible is non-TTY.
    # timeout runs inside that terminal, so the bound kills the download on
    # the host and script -e reports the 124 exit status.
    argv:
      - script
      - -q
      - -e
      - -c
      - >-
        timeout --kill-after=30 {{ macos_vm_recovery_fetch_timeout }}
        python3 {{ macos_vm_artifacts_dir }}/fetch-macOS-v2.py
        --action download
        --board-id {{ macos_vm_recovery_product.board_id }}
        --mlb {{ macos_vm_recovery_product.mlb }}
        --os-type {{ macos_vm_recovery_product.os_type }}
        --outdir {{ macos_vm_workdir }}
        --basename BaseSystem.partial
      - /dev/null
    chdir: "{{ macos_vm_workdir }}"
    creates: "{{ macos_vm_workdir }}/BaseSystem.dmg"
  become: true
  register: macos_vm_basesystem_result
  vars:
    macos_vm_recovery_product: "{{ macos_vm_recovery_products[macos_vm_macos_version] }}"
    # Keep these in sync with fetch-macOS-v2.py's product menu. `--shortname`
    # is ignored when `--action download` is passed, so provide the resolved
    # board/MLB/os_type tuple directly.
    # 15 = Sequoia, 14 = Sonoma, 13 = Ventura. Add new entries here.
    macos_vm_recovery_products:
      "15":
        board_id: Mac-7BA5B2D9E42DDD94
        mlb: "00000000000000000"
        os_type: default
      "14":
        board_id: Mac-827FAC58A8FDFA22
        mlb: "00000000000000000"
        os_type: default
      "13":
        board_id: Mac-4B682C642B45593E
        mlb: "00000000000000000"
        os_type: latest

# fetch-macOS-v2.py exits non-zero on a chunklist mismatch but keeps the
# file, and an interrupted download leaves a truncated one. Only a verified
# download takes the name that skips the fetch on later runs; the image moves
# last because it is that sentinel.
- name: artifacts | Publish verified BaseSystem download
  when:
    - not ansible_check_mode
    - macos_vm_basesystem_result.changed | default(false)
  ansible.builtin.command:
    argv:
      - mv
      - "{{ macos_vm_workdir }}/BaseSystem.partial.{{ item }}"
      - "{{ macos_vm_workdir }}/BaseSystem.{{ item }}"
    creates: "{{ macos_vm_workdir }}/BaseSystem.{{ item }}"
  loop:
    - chunklist
    - dmg
  become: true

- name: artifacts | Prepare BaseSystem recovery image
  when: macos_vm_install_mode
  become: true
  tags:
    - macos_vm
  block:
    # qemu-img fails the read on chunk types it cannot decode, such as LZFSE
    # without its module, so a successful conversion is complete.
    - name: artifacts | Convert BaseSystem DMG to raw image
      when: not (ansible_check_mode and (macos_vm_workdir_result.changed or macos_vm_basesystem_result.changed | default(false)))
      ansible.builtin.command:
        argv:
          - qemu-img
          - convert
          - -f
          - dmg
          - -O
          - raw
          - "{{ macos_vm_workdir }}/BaseSystem.dmg"
          - "{{ macos_vm_workdir }}/BaseSystem.img.partial"
        creates: "{{ macos_vm_workdir }}/BaseSystem.img"
      register: macos_vm_basesystem_convert_result

    - name: artifacts | Publish converted BaseSystem image
      when:
        - not ansible_check_mode
        - macos_vm_basesystem_convert_result.changed | default(false)
      ansible.builtin.command:
        argv:
          - mv
          - "{{ macos_vm_workdir }}/BaseSystem.img.partial"
          - "{{ macos_vm_workdir }}/BaseSystem.img"
        creates: "{{ macos_vm_workdir }}/BaseSystem.img"

  rescue:
    - name: artifacts | Remove rejected recovery image
      file:
        path: "{{ macos_vm_workdir }}/BaseSystem.img.partial"
        state: absent

    - name: artifacts | Report recovery image failure
      fail:
        msg: >-
          Recovery image conversion failed. The rejected
          {{ macos_vm_workdir }}/BaseSystem.img.partial was removed; the source DMG
          was retained. Re-run the role to retry a transient failure. To fetch a
          fresh, chunklist-verified source, delete {{ macos_vm_workdir }}/BaseSystem.dmg
          and rerun; never replace it by hand, since an existing DMG skips the
          download and its verification.
          {{ ansible_failed_result.msg | default('') }}
          {{ ansible_failed_result.stdout | default('') }}
          {{ ansible_failed_result.stderr | default('') }}

- name: artifacts | Set BaseSystem ownership for QEMU
  when:
    - macos_vm_install_mode
    - >-
      not (ansible_check_mode and (macos_vm_workdir_result.changed
      or macos_vm_basesystem_result.changed | default(false)
      or macos_vm_basesystem_convert_result.changed | default(false)))
  file:
    path: "{{ item }}"
    owner: root
    group: kvm
    mode: "0644"
  loop:
    - "{{ macos_vm_workdir }}/BaseSystem.dmg"
    - "{{ macos_vm_workdir }}/BaseSystem.img"
    - "{{ macos_vm_workdir }}/BaseSystem.chunklist"
  become: true
