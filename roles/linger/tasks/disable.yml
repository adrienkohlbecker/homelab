# Inputs: replace the whole `linger_args` dict on each call.
#   name  required; account name whose linger marker should be removed.
#   uid   optional; stop its manager first when the marker exists. Omit to
#         preserve a login session or clean up a potentially absent account.
#
# The removes guard makes an absent marker a no-op, even without an account.
# Publishes the same bool <name>_lingered result as the enable path.
- name: disable | Validate inputs for {{ linger_args.name | default('<unset>') }}
  assert:
    that:
      - linger_args.name is defined
      - linger_args.name is string
      - linger_args.name is match('^[a-z_][a-z0-9_-]*$')
    quiet: true
    fail_msg: >-
      linger_args needs name (a valid username matching [a-z_][a-z0-9_-]*);
      got name={{ linger_args.name | default('<unset>') }}.

- name: disable | Check whether linger was enabled for {{ linger_args.name }}
  stat:
    path: /var/lib/systemd/linger/{{ linger_args.name }}
  register: _linger_marker
  become: true

- name: disable | Stop the user manager for {{ linger_args.name }}
  # Without a linger marker, the manager may belong to a live login session.
  when: linger_args.uid is defined and _linger_marker.stat.exists
  systemd:
    name: user@{{ linger_args.uid }}.service
    state: stopped
  become: true

- name: disable | Disable linger for {{ linger_args.name }}
  command:
    argv:
      - loginctl
      - --no-ask-password
      - disable-linger
      - "{{ linger_args.name }}"
    removes: /var/lib/systemd/linger/{{ linger_args.name }}
  become: true
  register: _linger_disable_result

- name: disable | Record linger result for {{ linger_args.name }}
  set_fact:
    "{{ linger_args.name | ansible_var_key }}_lingered": "{{ _linger_disable_result is changed }}"
