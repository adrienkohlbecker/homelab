# The harness runs this hook outside --check. Task-level check_mode: true
# does not set ansible_check_mode, so it cannot exercise the helper's gate.
- name: _verify | Create fixture user
  user:
    name: linger_test
    system: true
    create_home: false
    shell: /usr/sbin/nologin
  register: _linger_user
  become: true

- name: _verify | Drive the helper
  import_role:
    name: linger
    tasks_from: linger
  vars:
    linger_args:
      name: linger_test
      uid: "{{ _linger_user.uid }}"

- name: _verify | Linger sentinel exists
  stat:
    path: /var/lib/systemd/linger/linger_test
  register: _linger_sentinel
  become: true

- name: _verify | Assert sentinel and per-user fact were exposed
  assert:
    that:
      - _linger_sentinel.stat.exists
      - linger_test_lingered

- name: _verify | User manager is active  # noqa: command-instead-of-module -- is-active query, not a state change
  command: systemctl is-active user@{{ _linger_user.uid }}.service
  register: _linger_active
  changed_when: false
  failed_when: _linger_active.stdout | trim != 'active'
  become: true

# Probe the runtime directory rather than its bus socket: the minimal
# fixture lacks dbus-user-session.
- name: _verify | XDG_RUNTIME_DIR is provisioned
  stat:
    path: /run/user/{{ _linger_user.uid }}
  register: _linger_runtime_dir
  become: true

# No login session should be keeping the fixture manager alive.
- name: _verify | List active sessions
  command: loginctl list-sessions --no-legend --no-pager
  register: _linger_sessions
  changed_when: false
  become: true

- name: _verify | Assert runtime dir present and manager is lingering, not session-backed
  assert:
    that:
      - _linger_runtime_dir.stat.exists
      - _linger_runtime_dir.stat.isdir
      # Match the whole username, not a substring of another account.
      - "'linger_test' not in _linger_sessions.stdout.split()"

- name: _verify | Drive the helper again (idempotence)
  import_role:
    name: linger
    tasks_from: linger
  vars:
    linger_args:
      name: linger_test
      uid: "{{ _linger_user.uid }}"

- name: _verify | Assert the re-run was a no-op
  assert:
    that:
      - not linger_test_lingered

- name: _verify | Drive the disable subtask (also exercises the disable path)
  import_role:
    name: linger
    tasks_from: disable
  vars:
    linger_args:
      name: linger_test
      uid: "{{ _linger_user.uid }}"

# is-active returns nonzero for an inactive manager.
- name: _verify | User manager is no longer active after disable  # noqa: command-instead-of-module -- is-active query, not a state change
  command: systemctl is-active user@{{ _linger_user.uid }}.service
  register: _linger_inactive
  changed_when: false
  failed_when: _linger_inactive.stdout | trim == 'active'
  become: true

- name: _verify | Confirm the linger marker is gone after disable
  stat:
    path: /var/lib/systemd/linger/linger_test
  register: _linger_sentinel_gone
  failed_when: _linger_sentinel_gone.stat.exists
  become: true

- name: _verify | Remove fixture user
  user:
    name: linger_test
    state: absent
  become: true
