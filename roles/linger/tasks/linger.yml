# Inputs: replace the whole `linger_args` dict on each call.
#   name  required; existing account name (after its user-creation task).
#   uid   required; caller-resolved uid, e.g. <svc>_user.uid.
#
# For the SSH user, use gathered ansible_user_id / ansible_user_uid;
# ansible_user may be unavailable when import_role vars are evaluated.
# Publishes bool <name>_lingered (whether linger state changed), then starts
# the manager synchronously so downstream user-scope tasks can use it.
# See notes/linger_design.md for the result and lifecycle rationale.
- name: linger | Validate inputs for {{ linger_args.name | default('<unset>') }}
  assert:
    that:
      - linger_args.name is defined
      - linger_args.name is string
      - linger_args.name is match('^[a-z_][a-z0-9_-]*$')
      # Fresh check-mode account creation has no uid; the predicted linger
      # change below gates the manager start before it consumes that uid.
      - linger_args.uid is defined or ansible_check_mode
      - linger_args.uid is not defined or (linger_args.uid | string is match('^[0-9]+$'))
    quiet: true
    fail_msg: >-
      linger_args needs name (a valid username matching [a-z_][a-z0-9_-]*)
      and a numeric uid; got name={{ linger_args.name | default('<unset>') }}
      uid={{ linger_args.uid | default('<unset>') }}.

- name: linger | Enable linger for {{ linger_args.name }}
  command:
    argv:
      - loginctl
      # Fail promptly if polkit requests interactive authentication.
      - --no-ask-password
      - enable-linger
      - "{{ linger_args.name }}"
    creates: /var/lib/systemd/linger/{{ linger_args.name }}
  become: true
  register: _linger_enable_result

# Sanitize hyphenated account names for Ansible fact keys.
- name: linger | Record linger result for {{ linger_args.name }}
  set_fact:
    "{{ linger_args.name | ansible_var_key }}_lingered": "{{ _linger_enable_result is changed }}"

- name: linger | Ensure user manager is running for {{ linger_args.name }}
  when: not (ansible_check_mode and _linger_enable_result.changed)
  systemd:
    name: user@{{ linger_args.uid }}.service
    state: started
  become: true
