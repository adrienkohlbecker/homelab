parsers:
  - name: sabnzbd_console
    format: regex
    regex: '/\A[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2},[0-9]{3}::(?<_level>DEBUG|INFO|WARNING|ERROR|CRITICAL)::\[(?<source>[^]:]+):(?<source_line>[0-9]+)\] (?<log>[\s\S]*)\z/'
    types: source_line:integer

pipeline:
  filters:
    - name: parser
      match: svc.sabnzbd.service
      key_name: MESSAGE
      parser: sabnzbd_console
      reserve_data: true
