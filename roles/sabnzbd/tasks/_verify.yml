# mode=version is unauthenticated (SABnzbd serves it without an api_key),
# so it only proves the container is up and answering. Type=notify +
# --sdnotify=healthy means the unit is already active==healthy by converge
# end; the retries are a safety margin on the test fixture.
- name: _verify | SABnzbd answers mode=version on its loopback port
  uri:
    url: "http://127.0.0.1:{{ service_ports.sabnzbd }}/api?mode=version&output=json"
    status_code: 200
    return_content: true
  register: _sabnzbd_version
  retries: 30
  delay: 2
  until:
    - _sabnzbd_version.status == 200
    - _sabnzbd_version.json.version is defined

# The universal-package-install Docker Mod (DOCKER_MODS in the unit) installs
# ffmpeg at init so nzbToMedia's check_media (autoProcessMedia.cfg) has ffprobe.
# Confirm it landed: nothing else exercises the mod, and a missing ffprobe
# silently degrades post-processing. The mod apt-installs ffmpeg from upstream
# at container init; on a cold EC2 cell that fetch runs past the 60s (30x2)
# this used to wait, so allow 120s (60x2). If it still misses, the mod's repo
# is unreachable from the cell (a mirror question), not a timing one.
- name: _verify | The universal-package-install mod installed ffprobe in the container
  command: podman exec sabnzbd ffprobe -version
  register: _sabnzbd_ffprobe
  changed_when: false
  retries: 60
  delay: 2
  until: _sabnzbd_ffprobe.rc == 0
  become: true

# The category scripts SABnzbd invokes (script_dir=/opt/nzbToMedia in
# sabnzbd.ini, and the nzbTo*.py names in the [[movie]]/[[tv]]/[[music]]
# categories) must parse under the *container's* Python -- the host-side
# extraction landing the files proves nothing about whether a wrong
# --strip-components or an interpreter mismatch left them unrunnable, which
# would silently break the *arr handoff. py_compile is the version-mismatch
# probe without needing nzbToMedia's full downloader env to run for real.
- name: _verify | The nzbToMedia scripts compile under the container Python
  command: >-
    podman exec sabnzbd python3 -m py_compile
    /opt/nzbToMedia/nzbToRadarr.py
    /opt/nzbToMedia/nzbToNzbDrone.py
    /opt/nzbToMedia/nzbToLidarr.py
  register: _sabnzbd_nzbtomedia
  changed_when: false
  become: true

# Negative probe: an authenticated mode (queue) WITHOUT the key must be
# refused -- SABnzbd answers HTTP 403. Pairs with the auth'd probe below:
# together they prove the api_key we templated is both required and the one
# the running container accepted, not just a string we wrote to disk.
- name: _verify | SABnzbd refuses an authenticated call without the api_key
  uri:
    url: "http://127.0.0.1:{{ service_ports.sabnzbd }}/api?mode=queue&output=json"
    status_code: 403
  register: _sabnzbd_http_unauth

# Authenticated probe with our key. SABnzbd takes the api_key only as a
# query param (no header form), so it lands in the URL -- fine on the
# ephemeral test host.
- name: _verify | SABnzbd answers mode=queue with our api_key
  uri:
    url: "http://127.0.0.1:{{ service_ports.sabnzbd }}/api?mode=queue&output=json&apikey={{ sabnzbd_api_key }}"
    status_code: 200
    return_content: true
  register: _sabnzbd_http
  failed_when: _sabnzbd_http.json.queue is not defined

# The vhost is `auth: required`, so a cookieless request must be bounced to
# Authelia rather than proxied through. With the stub in gate mode (see
# _setup.yml), assert a cookieless GET / lands on nginx's error_page 401 =302
# redirect to the portal. This is the only probe that fails if `auth: required`
# is dropped from nginx_site_args -- the loopback probes above stay green
# without it (and mode=version is unauthenticated, so it can't prove the gate
# either). The FQDN URL still exercises the subdomain -> server_name routing.
#
# Map the vhost FQDN to loopback so SNI matches the served certificate.
# Probing https://localhost with a Host: header leaves SNI=localhost, which
# OpenSSL 3.x (noble/resolute) rejects as a fatal unrecognized_name alert
# (status -1); hitting the FQDN directly keeps SNI correct on every release.
- name: _verify | Map the sabnzbd vhost FQDN to loopback for SNI-correct probing
  lineinfile:
    path: /etc/hosts
    line: "127.0.0.1 sabnzbd.{{ inventory_hostname }}.{{ domain }}"
    state: present
  become: true

- name: _verify | SABnzbd UI gate redirects unauthenticated requests to Authelia
  uri:
    url: https://sabnzbd.{{ inventory_hostname }}.{{ domain }}/
    validate_certs: false
    follow_redirects: none
    status_code: 302
  register: _sabnzbd_nginx_gate
  failed_when: _sabnzbd_nginx_gate is not authelia_redirects_to('sabnzbd', inventory_hostname, domain, require_rd=false)

# The history-DB symlink + matching --volume is the role's whole reason for
# its non-obvious structure: it lands history1.db (and its -wal/-shm
# siblings) on the 4K-recordsize sqlite dataset. The HTTP probes above pass
# whether or not that routing holds -- a dropped symlink strands the DB at
# /config inside the container and nothing else here would notice. Assert it
# functionally: the on-disk path is a symlink onto the dataset, and SABnzbd
# wrote a real, non-empty DB through it on first start.
- name: _verify | Stat the history DB symlink
  stat:
    path: /mnt/services/sabnzbd/admin/history1.db
  register: _sabnzbd_db_link
  become: true

- name: _verify | History DB is a symlink onto the sqlite dataset
  assert:
    that:
      - _sabnzbd_db_link.stat.islnk
      - _sabnzbd_db_link.stat.lnk_target == "/mnt/services/sqlite/sabnzbd/history1.db"
    fail_msg: "history1.db is not a symlink onto the sqlite dataset (stat={{ _sabnzbd_db_link.stat }})"

- name: _verify | Stat the dataset-side history DB
  stat:
    path: /mnt/services/sqlite/sabnzbd/history1.db
  register: _sabnzbd_db_file
  retries: 15
  delay: 2
  until:
    - _sabnzbd_db_file.stat.exists
    - not _sabnzbd_db_file.stat.islnk
    - (_sabnzbd_db_file.stat.size | default(0) | int) > 0
  become: true

- name: _verify | SABnzbd wrote a real, non-empty history DB onto the dataset
  assert:
    that:
      - _sabnzbd_db_file.stat.exists
      - not _sabnzbd_db_file.stat.islnk
      - (_sabnzbd_db_file.stat.size | int) > 0
    fail_msg: "history1.db on the dataset is missing or empty (stat={{ _sabnzbd_db_file.stat }})"

# autoProcessMedia.cfg is rendered with no validate: (its repeated subsections
# break configparser) and carries four cross-role credentials nothing else
# exercises. Confirm each templated key landed in the file -- a renamed/unset
# var would leave an empty value and silently break nzbToMedia's handoff to the
# *arr apps. Substring checks (not regex) sidestep the repeated-section parse.
- name: _verify | Read the rendered autoProcessMedia.cfg
  slurp:
    src: /mnt/services/sabnzbd/autoProcessMedia.cfg
  register: _sabnzbd_apm
  become: true

- name: _verify | Rendered autoProcessMedia.cfg carries the managed post-processing settings
  vars:
    _apm: "{{ _sabnzbd_apm.content | b64decode }}"
  assert:
    that:
      - "'version_notify = 0' in _apm"
      - sabnzbd_api_key in _apm
      - radarr_api_key in _apm
      - sonarr_api_key in _apm
      - lidarr_api_key in _apm
      - omdb_api_key in _apm
    fail_msg: "autoProcessMedia.cfg is missing a managed setting or api key (version_notify/sabnzbd/radarr/sonarr/lidarr/omdb)"

- name: _verify | Wait for normalized sabnzbd startup record in lnav store
  command:
    argv:
      - python3
      - -c
      - |
        import json
        import sys

        with open(sys.argv[1], encoding="utf-8") as handle:
            for line in handle:
                try:
                    record = json.loads(line)
                except json.JSONDecodeError:
                    continue
                fields = record.get("fields", {})
                if (
                    record.get("service") == "sabnzbd"
                    and fields.get("parser_status") == "parsed"
                    and fields.get("source") == "SABnzbd"
                    and isinstance(fields.get("source_line"), int)
                    and record.get("message", "").startswith("SABnzbd.py-")
                    and "CONTAINER_TAG" not in fields
                    and "sabnzbd_time" not in fields
                    and "sabnzbd_level" not in fields
                ):
                    print(json.dumps(record, sort_keys=True))
                    sys.exit(0)
        sys.exit(1)
      - /var/log/fluent-bit/lnav.jsonl
  register: _sabnzbd_lnav_record
  changed_when: false
  retries: 30
  delay: 2
  until: _sabnzbd_lnav_record.rc == 0
  become: true

- name: _verify | Define nzbToMedia file-ingestion marker
  set_fact:
    sabnzbd_nzbtomedia_marker: "nzbtomedia_{{ ansible_date_time.iso8601_basic_short }}_{{ 99999 | random }}"

- name: _verify | Create the nzbToMedia runtime log fixture directory
  file:
    path: /opt/nzbToMedia/logs
    state: directory
    owner: sabnzbd
    group: media
    mode: "0755"
  become: true

- name: _verify | Append nzbToMedia file-ingestion record
  command:
    argv:
      - /usr/bin/tee
      - --append
      - /opt/nzbToMedia/logs/nzbtomedia.log
    stdin: >-
      2026-07-12 12:00:00 POSTPROCESS::RADARR: {{ sabnzbd_nzbtomedia_marker }} succeeded
  changed_when: true
  become: true
  become_user: sabnzbd

- name: _verify | Read normalized nzbToMedia file record
  command:
    argv:
      - python3
      - -c
      - |
        import json
        import sys

        marker, path = sys.argv[1:]
        with open(path) as records:
            for line in records:
                record = json.loads(line)
                if record.get("stream") == "nzbtomedia" and marker in record.get("message", ""):
                    print(json.dumps(record))
                    sys.exit(0)
        sys.exit(1)
      - "{{ sabnzbd_nzbtomedia_marker }}"
      - /var/log/fluent-bit/lnav.jsonl
  register: _sabnzbd_nzbtomedia_record
  retries: 15
  delay: 1
  until: _sabnzbd_nzbtomedia_record.rc == 0
  changed_when: false

- name: _verify | Assert normalized nzbToMedia file fields
  vars:
    record: "{{ _sabnzbd_nzbtomedia_record.stdout | from_json }}"
  assert:
    that:
      - record.service == "sabnzbd"
      - record.stream == "nzbtomedia"
      - record.unit == "sabnzbd.service"
      - record.identifier == "nzbtomedia"
      - record.level == "info"
      - record.message == sabnzbd_nzbtomedia_marker ~ " succeeded"
      - record.fields.source == "RADARR"
      - record.fields.parser_status == "parsed"
      - record.parse_error is not defined
      - record.fields.nzbtomedia_timestamp is not defined
      - record.fields.filepath is not defined

- name: _verify | Stop fluent-bit before the isolated extension fixture
  systemd:
    name: fluent-bit
    state: stopped
  become: true

- name: _verify | Exercise sabnzbd fluent-bit record contracts
  import_role:
    name: fluentbit
    tasks_from: verify_extension
  vars:
    fluentbit_verify_args:
      name: sabnzbd
      records:
        - MESSAGE: '2099-01-02 03:04:05,678::INFO::[newswrapper:424] 1@example.invalid: Connected using TLSv1.3'
          CONTAINER_TAG: sabnzbd
          SYSLOG_IDENTIFIER: sabnzbd
          SYSTEMD_UNIT: sabnzbd.service
          marker: sabnzbd-connected-nearby-keep
        - MESSAGE: '2099-01-02 03:04:05,679::INFO::[newswrapper:625] 1@example.invalid: Connected using TLSv1.3 (TLS_AES_128_GCM_SHA256)'
          CONTAINER_TAG: sabnzbd
          SYSLOG_IDENTIFIER: sabnzbd
          SYSTEMD_UNIT: sabnzbd.service
          marker: sabnzbd-connected-routine-token
        - MESSAGE: '2099-01-02 03:04:05,680::INFO::[downloader:666] 1@example.invalid: Initiating connection'
          CONTAINER_TAG: sabnzbd
          SYSLOG_IDENTIFIER: sabnzbd
          SYSTEMD_UNIT: sabnzbd.service
          marker: sabnzbd-initiating-routine-token
        - MESSAGE: '2099-01-02 03:04:05,681::INFO::[newswrapper:229] Connecting 1@example.invalid finished'
          CONTAINER_TAG: sabnzbd
          SYSLOG_IDENTIFIER: sabnzbd
          SYSTEMD_UNIT: sabnzbd.service
          marker: sabnzbd-finished-routine-token
        - MESSAGE: '2099-01-02 03:04:06,789::WARNING::[__init__:641] Signal 15 caught, saving and exiting...'
          CONTAINER_TAG: sabnzbd
          SYSLOG_IDENTIFIER: sabnzbd
          SYSTEMD_UNIT: sabnzbd.service
        - MESSAGE: '2099-01-02 03:04:07,890::ERROR::[filesystem:1088] Saving /config/admin/postproc2.sab failed'
          CONTAINER_TAG: sabnzbd
          SYSLOG_IDENTIFIER: sabnzbd
          SYSTEMD_UNIT: sabnzbd.service
        - MESSAGE: '[ls.io-init] done.'
          CONTAINER_TAG: sabnzbd
          SYSLOG_IDENTIFIER: sabnzbd
          SYSTEMD_UNIT: sabnzbd.service
        - MESSAGE: Started sabnzbd.
          SYSLOG_IDENTIFIER: systemd
          SYSTEMD_UNIT: sabnzbd.service
      expected:
        - message: '1@example.invalid: Connected using TLSv1.3'
          level: info
          service: sabnzbd
          fields.source: newswrapper
          fields.source_line: 424
          fields.parser_status: parsed
          _absent:
            - fields.sabnzbd_time
            - fields.sabnzbd_level
            - fields.CONTAINER_TAG
        - message: 'Signal 15 caught, saving and exiting...'
          level: warn
          fields.source: __init__
          fields.source_line: 641
          fields.parser_status: parsed
        - message: Saving /config/admin/postproc2.sab failed
          level: error
          fields.source: filesystem
          fields.source_line: 1088
          fields.parser_status: parsed
        - message: '[ls.io-init] done.'
          service: sabnzbd
          _absent:
            - fields.parser_status
            - fields.source
            - fields.source_line
        - message: Started sabnzbd.
          service: systemd
          _absent:
            - fields.parser_status
            - fields.source
            - fields.source_line

- name: _verify | Routine sabnzbd connections are omitted from the aggregate
  assert:
    that: "'routine-token' not in fluentbit_verify_result.stdout"

- name: _verify | Restart fluent-bit after the isolated extension fixture
  systemd:
    name: fluent-bit
    state: started
  become: true

# usage_at_start preservation (main.yml's slurp+regex readback) is the role's
# most fragile mechanism and the HTTP/DB probes can't see it: a broken readback
# silently resets the per-server quota odometer to the template baseline on the
# next converge. The harness idempotence check never catches it either -- it
# re-converges before any counter has moved off baseline. Exercise it directly:
# seed a sentinel counter on disk, re-run the role, and assert the re-render
# read it back rather than clobbering it. Re-importing the role is out of
# contract on prod, but _verify is test-only (the host is ephemeral).
- name: _verify | Seed a sentinel usage_at_start into the on-disk ini
  replace:
    path: /mnt/services/sabnzbd/sabnzbd.ini
    regexp: '(\[\[eu\.newsdemon\.com\]\][^\[]*?usage_at_start = )\d+'
    replace: '\g<1>987654321'
  become: true

- name: _verify | Re-run the role to exercise the counter readback
  import_role:
    name: sabnzbd

- name: _verify | Re-read the ini after the re-converge
  slurp:
    src: /mnt/services/sabnzbd/sabnzbd.ini
  register: _sabnzbd_usage_ini
  become: true

- name: _verify | The seeded usage_at_start survived the re-render
  vars:
    _ini: "{{ _sabnzbd_usage_ini.content | b64decode }}"
  assert:
    that:
      - (_ini | regex_search('\\[\\[eu\\.newsdemon\\.com\\]\\][^\\[]*?usage_at_start = (\\d+)', '\\1') | first) == '987654321'
    fail_msg: "usage_at_start preservation regressed: the readback reset the seeded counter to baseline"
