- name: _verify | F_require_root succeeds as root
  shell: |
    source /usr/local/lib/functions.sh
    f_require_root
    echo "ok"
  args:
    executable: /bin/bash
  register: _bash_require_root_ok
  changed_when: false
  become: true

- name: _verify | F_require_root root assertions
  assert:
    that:
      - _bash_require_root_ok.rc == 0
      - "'ok' in _bash_require_root_ok.stdout"

- name: _verify | F_require_root fails as non-root
  shell: |
    source /usr/local/lib/functions.sh
    f_require_root
    echo "should-not-run"
  args:
    executable: /bin/bash
  register: _bash_require_root_fail
  changed_when: false
  failed_when: false
  become: true
  become_user: nobody

- name: _verify | F_require_root non-root assertions
  assert:
    that:
      - _bash_require_root_fail.rc == 1
      - "'I require root' in _bash_require_root_fail.stderr"
      - "'should-not-run' not in _bash_require_root_fail.stdout"

- name: _verify | F_rescue continues past failures and records them in f_failed
  shell: |
    source /usr/local/lib/functions.sh
    f_rescue false
    f_rescue true
    f_rescue ls /nonexistent-path-for-verify
    echo "f_failed=$f_failed"
  args:
    executable: /bin/bash
  register: _bash_f_rescue
  changed_when: false

- name: _verify | F_rescue assertions
  assert:
    that:
      - _bash_f_rescue.rc == 0
      - "'f_failed=2' in _bash_f_rescue.stdout"
      - "'Error: false failed with exit 1' in _bash_f_rescue.stderr"
      - "'Error: ls /nonexistent-path-for-verify failed with exit' in _bash_f_rescue.stderr"

- name: _verify | F_trace echoes the shell-quoted command to stdout then runs it
  shell: |
    source /usr/local/lib/functions.sh
    f_trace echo hello "two words"
  args:
    executable: /bin/bash
  register: _bash_f_trace
  changed_when: false

# The `$ <cmd>` banner is a plain printf (not redirected to >&2), so it lands
# on stdout alongside the command's own output — assert both there.
- name: _verify | F_trace assertions
  assert:
    that:
      - _bash_f_trace.rc == 0
      - "'$ echo hello' in _bash_f_trace.stdout"
      - "'hello two words' in _bash_f_trace.stdout"
