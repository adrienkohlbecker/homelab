- name: _verify | F_require_root succeeds as root
  shell: |
    source /usr/local/lib/functions.sh
    f_require_root
    echo "ok"
  args:
    executable: /bin/bash
  register: _bash_require_root_ok
  changed_when: false
  failed_when: >-
    _bash_require_root_ok.rc != 0 or
    'ok' not in _bash_require_root_ok.stdout
  become: true

- name: _verify | F_require_root fails as non-root
  shell: |
    source /usr/local/lib/functions.sh
    f_require_root
    echo "should-not-run"
  args:
    executable: /bin/bash
  register: _bash_require_root_fail
  changed_when: false
  failed_when: >-
    _bash_require_root_fail.rc != 1 or
    'I require root' not in _bash_require_root_fail.stderr or
    'should-not-run' in _bash_require_root_fail.stdout
  become: true
  become_user: nobody

- name: _verify | F_rescue continues past failures and records them in f_failed
  shell: |
    source /usr/local/lib/functions.sh
    f_rescue false
    f_rescue true
    f_rescue ls /nonexistent-path-for-verify
    echo "f_failed=$f_failed"
  args:
    executable: /bin/bash
  register: _bash_f_rescue
  changed_when: false
  failed_when: >-
    _bash_f_rescue.rc != 0 or
    'f_failed=2' not in _bash_f_rescue.stdout or
    'Error: false failed with exit 1' not in _bash_f_rescue.stderr or
    'Error: ls /nonexistent-path-for-verify failed with exit' not in _bash_f_rescue.stderr

- name: _verify | F_trace echoes the shell-quoted command to stdout then runs it
  shell: |
    source /usr/local/lib/functions.sh
    f_trace echo hello "two words"
  args:
    executable: /bin/bash
  register: _bash_f_trace
  changed_when: false
  failed_when: >-
    _bash_f_trace.rc != 0 or
    '$ echo hello' not in _bash_f_trace.stdout or
    'hello two words' not in _bash_f_trace.stdout
