# nut_monitor runs upsmon on every home host, monitoring the co-located
# upsd from roles/nut_server (ordered just before this role in site.yml).
# Together with the per-host low-battery overrides in nut_server's ups.conf
# this forms the staged shutdown ladder: the windows box (unmanaged, on
# Eaton's vendor IPP agent) drops first on a short on-battery timer, lab at
# 20%/300s, pug last at 5%/180s. Power cuts and restarts are card-native
# (per-group load shedding below each trigger, forced reboot on AC return;
# notes/ups_shutdown_ladder.md); the wake_peers hooks cover the hosts an
# outage strands shut-down-but-still-powered.

- name: Assert required inputs
  assert:
    that:
      - nut_upsmon_password | default('') | length > 0
    fail_msg: >-
      nut_monitor requires a vaulted nut_upsmon_password
      (group_vars/{prod,test}.yml)
  tags:
    - nut_monitor

# nut_notify delivers via the bare `mail` binary (mailutils, from the postfix
# role ordered before nut in site.yml). This asserts the binary is PRESENT --
# not that mail is deliverable: root->operator routing is owned by postfix's
# aliases.j2 and relay health is the postfix role's concern. Catches the common
# gap (monitoring enabled on a host that never ran postfix) at converge rather
# than during a real outage.
- name: Check for the mail binary
  command: which mail
  register: nut_monitor_mail_bin
  changed_when: false
  failed_when: false
  tags:
    - nut_monitor

- name: Assert mail is available
  assert:
    that:
      - nut_monitor_mail_bin.rc == 0
    fail_msg: >-
      The `mail` binary is missing. It is provided by mailutils via the
      postfix role (ordered before nut in site.yml) -- run that role on this
      host first, then re-converge nut_monitor.
  tags:
    - nut_monitor

- name: Install nut
  apt:
    pkg:
      - nut-client
    cache_valid_time: 3600
  become: true
  register: nut_monitor_apt
  tags:
    - nut_monitor

# upsmon.conf/upssched.conf carry no validate: -- NUT ships no offline config
# checker (the daemons only parse at startup) and the whitespace-directive
# format isn't INI, so there's no real parser to invent. nut_notify below
# validates with `bash -n` since it is a script.
- name: Configure nut upsmon.conf  # noqa: require-validate
  when: not (ansible_check_mode and nut_monitor_apt.changed)
  template:
    src: upsmon.conf.j2
    dest: /etc/nut/upsmon.conf
    backup: true
    owner: root
    group: nut
    mode: "0640"
  become: true
  register: nut_monitor_upsmon_conf
  tags:
    - nut_monitor

- name: Configure nut upssched.conf  # noqa: require-validate
  when: not (ansible_check_mode and nut_monitor_apt.changed)
  template:
    src: upssched.conf.j2
    dest: /etc/nut/upssched.conf
    backup: true
    owner: root
    group: nut
    mode: "0640"
  become: true
  register: nut_monitor_upssched_conf
  tags:
    - nut_monitor

# nut_notify's wake_peers arm broadcasts on the primary subnet; a degraded
# default_ipv4 fact (wg/podman/bridge default route) would render a
# syntactically valid but unwakeable destination that only surfaces
# mid-outage-recovery. Same guards and derivation as roles/wolweb -- computed
# from address+netmask because the fact's own `broadcast` key is empty on
# some NICs (the qemu SLIRP fixture among them).
- name: Assert default interface is a plausible LAN NIC
  when: nut_monitor_wake_peers | length > 0
  assert:
    quiet: true
    that:
      - ansible_facts.default_ipv4.interface is defined
      - ansible_facts.default_ipv4.interface is not match('^(wg|podman|virbr|docker|br-|veth)')
    fail_msg: >-
      ansible_facts.default_ipv4.interface resolved to
      '{{ ansible_facts.default_ipv4.interface | default("") }}', which looks
      like a bridge/tunnel rather than the management NIC -- the wake_peers
      arm broadcasts on this interface's segment
  tags:
    - nut_monitor

- name: Compute the wake broadcast ip
  when: nut_monitor_wake_peers | length > 0
  set_fact:
    nut_monitor_broadcast: "{{ (ansible_facts.default_ipv4.address + '/' + ansible_facts.default_ipv4.netmask) | ansible.utils.ipaddr('broadcast') }}"
  tags:
    - nut_monitor

- name: Assert the computed wake broadcast ip
  when: nut_monitor_wake_peers | length > 0
  assert:
    quiet: true
    that:
      - nut_monitor_broadcast is match('^([0-9]{1,3}[.]){3}[0-9]{1,3}$')
    fail_msg: >-
      Computed nut_monitor_broadcast ('{{ nut_monitor_broadcast }}') is not a
      valid IPv4 address -- ansible_facts.default_ipv4 may be empty on this
      host, which would render an unwakeable wake_peers arm in nut_notify
  tags:
    - nut_monitor

- name: Configure nut_notify
  template:
    src: nut_notify.sh.j2
    dest: /usr/local/bin/nut_notify
    owner: root
    group: root
    mode: "0755"
    backup: true
    validate: bash -n %s
  become: true
  tags:
    - nut_monitor

# Converged hosts still carry the script under its pre-convention hyphenated
# name; nothing references it once upssched.conf points at nut_notify.
- name: Remove the stale nut-notify copy
  file:
    path: /usr/local/bin/nut-notify
    state: absent
  become: true
  tags:
    - nut_monitor

# The wake leg exists only on hosts late enough in the shutdown ladder to
# have peers to revive (nut_monitor_wake_peers, host_vars/pug.yml + lab.yml).
# wakeonlan is the packaged sender nut_notify's wake_peers arm shells out to.
- name: Install wakeonlan
  when: nut_monitor_wake_peers | length > 0
  apt:
    pkg:
      - wakeonlan
    cache_valid_time: 3600
  become: true
  tags:
    - nut_monitor

- name: Install the boot-time peer wake unit
  when: nut_monitor_wake_peers | length > 0
  import_role:
    name: systemd_unit
    tasks_from: install
  vars:
    systemd_unit_args:
      src: nut_wake_peers.service
  tags:
    - nut_monitor

# The unit's RemainAfterExit keeps it active after the boot run, so the
# `start` here is a boot-behaviour no-op at converge instead of a
# re-broadcast at peers the operator may have deliberately powered off.
- name: Enable the boot-time peer wake
  when: nut_monitor_wake_peers | length > 0
  import_role:
    name: systemd_unit
    tasks_from: service
  vars:
    systemd_unit_args:
      src: nut_wake_peers
      condition: "{{ not (ansible_check_mode and nut_monitor_apt.changed) }}"
      start: "{{ not qemu_test }}"
      restart: false
  tags:
    - nut_monitor

# Emptying the list must retire the unit too: it fires nut_notify wake_peers
# on every boot all by itself -- no upssched involved -- so an orphan would
# keep waking the stale MAC list forever.
- name: Remove the boot-time peer wake unit
  when: nut_monitor_wake_peers | length == 0
  import_role:
    name: systemd_unit
    tasks_from: remove
  vars:
    systemd_unit_args:
      src: nut_wake_peers.service
  tags:
    - nut_monitor

# The wake sender used to be a bespoke python script; wakeonlan replaced it.
- name: Remove the retired nut_wake_peers script
  file:
    path: /usr/local/bin/nut_wake_peers
    state: absent
  become: true
  tags:
    - nut_monitor

# start: gates on qemu_test -- the fixture has no real UPS to reach, so the
# unit is only enabled (it still starts at the _site_test reboot and idles
# on NOCOMM retries, which upsmon tolerates indefinitely).
#
# restart (not `upsmon -c reload`) is deliberate: reload cannot change
# SHUTDOWNCMD or POWERDOWNFLAG -- the privileged (root) half keeps its
# startup copy (upsmon split-process model). jammy's 2.7.4 packaged unit
# also ships no ExecReload. The cost is that a config converge mid-outage
# drops any in-flight upssched debounce timer; acceptable for a rare event.
# nut_notify is never a trigger -- upssched exec's it fresh per event, so a
# script-only change needs nothing.
- name: Enable nut_monitor service
  import_role:
    name: systemd_unit
    tasks_from: service
  vars:
    systemd_unit_args:
      # nut-client.service is a symlink to nut-monitor.service (the upsmon
      # unit); unlike nut-driver, the name doesn't shift across releases, so no
      # version branch is needed here (cf. nut_server's nut-driver@eaton).
      src: nut-client
      condition: "{{ not (ansible_check_mode and nut_monitor_apt.changed) }}"
      start: "{{ not qemu_test }}"
      restart: "{{ nut_monitor_upsmon_conf.changed or nut_monitor_upssched_conf.changed }}"
  tags:
    - nut_monitor
