# nut_notify sources /usr/local/lib/functions.sh from the bash role, which
# site.yml runs before nut_monitor. testrole.py runs only this role, so the
# _verify path that executes nut_notify needs the library deployed here.
- name: _setup | Install bash functions.sh
  import_role:
    name: bash

# mailutils stands in for the postfix role (ordered before nut_monitor in
# site.yml), which provides `mail` on prod -- the converge asserts its
# presence. _verify's capturing shim still wins over it via PATH.
- name: _setup | Install dependencies
  apt:
    pkg:
      - nut-server
      - mailutils
    install_recommends: false
    cache_valid_time: 3600
  become: true

# The FSD drill in _verify runs a real upsmon against the dummy upsd, so
# the upsmon login must exist server-side. Normally roles/nut_server's
# upsd.users provides it; testrole.py runs only this role. Same release-
# keyed keyword as that template (group_vars/all/main.yml).
- name: _setup | Configure upsd.users for the upsmon login
  copy:
    dest: /etc/nut/upsd.users
    owner: root
    group: nut
    mode: "0640"
    content: |
      [upsmon]
      password = {{ nut_upsmon_password }}
      upsmon {{ nut_upsmon_keyword_primary }}
      # Fixture-only, unlike the prod upsd.users: lets _verify's FSD drill
      # flip the dummy UPS critical via upsrw instead of a driver restart.
      actions = SET
  become: true

- name: _setup | Configure nut.conf for the dummy-ups
  copy:
    dest: /etc/nut/nut.conf
    mode: "0644"
    content: |
      MODE=standalone
  become: true

- name: _setup | Configure ups.conf for the dummy-ups
  copy:
    dest: /etc/nut/ups.conf
    mode: "0644"
    content: |
      [eaton]
          driver = dummy-ups
          port = eaton.dev
          desc = "static dummy-ups for tests"
  become: true

# A .dev file (no TIMER) is served statically -- a .seq cycles through
# frames and reports ups.status WAIT until the first poll lands, which
# makes the published values non-deterministic at query time.
# charge/runtime are floats ("42.00"/"900.00") to mirror the real Eaton's
# snmp-ups output -- this is what regression-guards nut_notify's fractional
# battery.runtime handling (an integer frame would never exercise it).
- name: _setup | Configure the static dummy-ups frame
  copy:
    dest: /etc/nut/eaton.dev
    mode: "0644"
    content: |
      ups.status: OB DISCHRG
      battery.charge: 42.00
      battery.runtime: 900.00
      ups.mfr: dummy
      ups.model: evolution500
  become: true
