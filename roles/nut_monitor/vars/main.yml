# The upsmon system identifier (<upsname>@<host>) this host monitors. A role
# constant, not a host knob: the MONITOR line in upsmon.conf, the upsc queries
# in nut-notify and the _verify fixtures all derive from it, and pointing it
# away from the co-located upsd would half-break the system anyway (nut_server's
# files/hosts.conf CGI allowlist and the emailed status link both assume
# localhost).
nut_monitor_ups: eaton@localhost
