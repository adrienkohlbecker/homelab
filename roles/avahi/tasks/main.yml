- name: Install avahi
  apt:
    pkg:
      - avahi-daemon
      - avahi-utils
      - libxml2-utils
    policy_rc_d: 101
    cache_valid_time: 3600
  register: avahi_apt
  become: true
  tags:
    - avahi

- name: Render avahi daemon conf
  template:
    src: avahi-daemon.conf.j2
    dest: /etc/avahi/avahi-daemon.conf
    mode: "0644"
    owner: root
    group: root
    backup: true
    validate: python3 -c 'import configparser,sys; configparser.ConfigParser().read(sys.argv[1])' %s
  when: not (ansible_check_mode and avahi_apt.changed)
  become: true
  register: avahi_daemon_conf
  tags:
    - avahi

- name: Enable avahi service
  when: not (ansible_check_mode and avahi_apt.changed)
  systemd:
    name: avahi-daemon.service
    enabled: true
    state: >-
      {{ 'restarted' if avahi_daemon_conf.changed
         else 'started' }}
  become: true
  tags:
    - avahi
