# libnss-mdns delegates .local resolution to Avahi through its local socket.
# Retry because daemon readiness can lag unit activation on a cold boot.
- name: _verify | Host's own .local name resolves through NSS and Avahi
  command: getent ahostsv4 {{ ansible_hostname }}.local
  register: _avahi_resolve
  retries: 20
  delay: 2
  until:
    - _avahi_resolve.rc == 0
    - ansible_default_ipv4.address in _avahi_resolve.stdout
  changed_when: false

# Local NSS resolution does not prove that Avahi joined the multicast group on
# the configured uplink, so verify that membership separately.
- name: _verify | Avahi joined 224.0.0.251 on the pinned iface
  command: ip -j maddr show dev {{ default_interface }}
  register: _avahi_maddr
  changed_when: false
  failed_when: >-
    _avahi_maddr.rc != 0
    or '224.0.0.251' not in
       ((_avahi_maddr.stdout | from_json | first).maddr
        | selectattr('family', 'defined')
        | selectattr('family', 'equalto', 'inet')
        | map(attribute='address') | list)

# Flag 1 explicitly requests wide-area DNS, which the running daemon must reject.
- name: _verify | Avahi refuses wide-area record browsers
  command:
    argv:
      - busctl
      - --timeout=5
      - call
      - --
      - org.freedesktop.Avahi
      - /
      - org.freedesktop.Avahi.Server
      - RecordBrowserNew
      - iisqqu
      - "-1"
      - "0"
      - example.invalid
      - "1"
      - "1"
      - "1"
  environment:
    LC_ALL: C
  register: _avahi_wide_area
  changed_when: false
  failed_when: >-
    _avahi_wide_area.rc != 1
    or _avahi_wide_area.stderr | trim != 'Call failed: Not supported'
