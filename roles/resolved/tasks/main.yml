# Helper writes /etc/systemd/resolved.conf.d/99-custom.conf via the
# absolute-mode dropin path (sibling of resolved.conf, not under
# systemd-resolved.service.d/). Helper does: dir creation, backup,
# write (copy — src has no .j2 suffix), systemd-analyze verify against
# systemd-resolved.service, daemon-reload. Restart gate downstream
# reads the per-unit result fact resolved_conf_d_99_custom_conf_result.
# Numbered 99-: resolved.conf.d/ merges lexicographically, last-wins,
# so a high number keeps these settings on top of any lower-numbered
# drop-in a package or cloud-init might land here.
# Noble splits resolved into a separate package. Install it here instead of
# relying on systemd's Recommends or the base-image package selection.
- name: Install systemd-resolved package
  apt:
    name: systemd-resolved
    state: present
    cache_valid_time: 3600
    policy_rc_d: 101
  register: resolved_apt
  become: true
  tags:
    - resolved

- name: Render resolved.conf.d/99-custom.conf
  import_role:
    name: systemd_unit
    tasks_from: install
  vars:
    systemd_unit_args:
      for: systemd-resolved.service
      dest_abs: /etc/systemd/resolved.conf.d/99-custom.conf
      src: 99-custom.conf
      condition: "{{ not (ansible_check_mode and resolved_apt.changed) }}"
  tags:
    - resolved

# Remove any 10-custom.conf left by an earlier convention: resolved.conf.d
# merges last-wins, so a stray lower-numbered copy is redundant (99- already
# supersedes it) and removing it changes no effective config.
- name: Remove the superseded 10-custom.conf drop-in
  file:
    path: /etc/systemd/resolved.conf.d/10-custom.conf
    state: absent
  become: true
  tags:
    - resolved

# Guard against a dangling /etc/resolv.conf: systemd-resolved writes
# /run/systemd/resolve/resolv.conf whenever it is running (independent of
# DNSStubListener), so an absent target means resolved is masked/dead --
# fail loudly here rather than silently linking the host into a DNS black
# hole.
- name: Stat the resolved-managed resolv.conf
  when: not (ansible_check_mode and resolved_apt.changed)
  stat:
    path: /run/systemd/resolve/resolv.conf
  register: resolved_run_resolv_conf
  become: true
  tags:
    - resolved

- name: Assert systemd-resolved is producing its resolv.conf
  when: not (ansible_check_mode and resolved_apt.changed)
  assert:
    that:
      - resolved_run_resolv_conf.stat.exists
    fail_msg: >-
      /run/systemd/resolve/resolv.conf is missing -- systemd-resolved is not
      running, so symlinking /etc/resolv.conf to it would black-hole DNS.
      Check `systemctl status systemd-resolved` before re-running.
  tags:
    - resolved

# systemd-resolved writes the DHCP-supplied upstream servers into
# resolv.conf, not stub-resolv.conf (which is only 127.0.0.53 -- dead now
# that the stub listener is off). Pointing /etc/resolv.conf here hands the
# host those servers directly. No owner/group/mode: with follow: true
# (the file-module default) they'd chase the link to its transient
# /run target and re-chown it every run -- a symlink has no meaningful
# perms of its own.
- name: Update resolv conf symlink
  when: not (ansible_check_mode and resolved_apt.changed)
  file:
    src: /run/systemd/resolve/resolv.conf
    dest: /etc/resolv.conf
    state: link
    force: true
  become: true
  register: resolved_resolv_conf
  tags:
    - resolved

# Enable + start (an idempotent liveness assertion: resolved manages
# /run/systemd/resolve/resolv.conf, so if it's down the host's entire DNS
# path goes stale) + restart-on-change. Clear a StartLimitBurst lockout first
# because DNS is load-bearing and can crash-loop. enabled=true pins
# boot-survival so the symlink target is re-produced
# on every boot, not just while resolved happens to be running.
#
# Order is load-bearing: lifecycle management sits after the resolv.conf
# symlink task above, so the symlink
# already points at the upstream-servers file before the restart tears down
# the 127.0.0.53 stub. Without that order there's a window where the stub is
# dead and /etc/resolv.conf still resolves through the now-black-hole
# stub-resolv.conf.
- name: Clear systemd-resolved rate limit
  when: not ansible_check_mode
  # A unit with no failed state needs no reset and remains safe to manage.
  command: systemctl reset-failed systemd-resolved.service
  changed_when: false
  failed_when: false
  become: true
  tags:
    - resolved

- name: Enable, start, and restart-on-change systemd-resolved
  when: not (ansible_check_mode and resolved_apt.changed)
  systemd:
    name: systemd-resolved.service
    enabled: true
    state: >-
      {{ 'restarted'
         if resolved_apt.changed
            or resolved_conf_d_99_custom_conf_result.changed
            or resolved_resolv_conf.changed
         else 'started' }}
  become: true
  tags:
    - resolved
