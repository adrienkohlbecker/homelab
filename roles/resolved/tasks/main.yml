# Numbered 99-: resolved.conf.d/ merges lexicographically, last-wins,
# so a high number keeps these settings on top of any lower-numbered
# drop-in a package or cloud-init might land here.
# Noble splits resolved into a separate package. Install it here instead of
# relying on systemd's Recommends or the base-image package selection.
- name: Install systemd-resolved package
  apt:
    name: systemd-resolved
    state: present
    cache_valid_time: 3600
    policy_rc_d: 101
  register: resolved_apt
  become: true
  tags:
    - resolved

- name: Create resolved configuration directory
  when: not (ansible_check_mode and resolved_apt.changed)
  file:
    path: /etc/systemd/resolved.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true
  tags:
    - resolved

- name: Install resolved.conf.d/99-custom.conf
  when: not (ansible_check_mode and resolved_apt.changed)
  copy:
    src: 99-custom.conf
    dest: /etc/systemd/resolved.conf.d/99-custom.conf
    owner: root
    group: root
    mode: "0644"
    backup: true
    validate: python3 -c 'import configparser,sys; configparser.ConfigParser(strict=False, delimiters=("=",)).read(sys.argv[1])' %s
  register: resolved_custom_conf
  become: true
  tags:
    - resolved

# Fail before replacing /etc/resolv.conf if resolved is not producing its target.
- name: Stat the resolved-managed resolv.conf
  when: not (ansible_check_mode and resolved_apt.changed)
  stat:
    path: /run/systemd/resolve/resolv.conf
  register: resolved_run_resolv_conf
  become: true
  tags:
    - resolved

- name: Assert systemd-resolved is producing its resolv.conf
  when: not (ansible_check_mode and resolved_apt.changed)
  assert:
    that:
      - resolved_run_resolv_conf.stat.exists
    fail_msg: >-
      /run/systemd/resolve/resolv.conf is missing -- systemd-resolved is not
      running, so symlinking /etc/resolv.conf to it would black-hole DNS.
      Check `systemctl status systemd-resolved` before re-running.
  tags:
    - resolved

# Use the DHCP upstream file because the local stub is disabled. Do not set
# metadata: file follows symlinks and would rechown the transient /run target.
- name: Update resolv conf symlink
  when: not (ansible_check_mode and resolved_apt.changed)
  file:
    src: /run/systemd/resolve/resolv.conf
    dest: /etc/resolv.conf
    state: link
    force: true
  become: true
  tags:
    - resolved

# Clear crash-loop limits and keep the service enabled so the /run target
# survives reboot. Lifecycle stays after the symlink: a config restart disables
# the stub, so /etc/resolv.conf must already use the upstream file.
- name: Clear systemd-resolved rate limit
  when: not ansible_check_mode
  # A unit with no failed state needs no reset and remains safe to manage.
  command: systemctl reset-failed systemd-resolved.service
  changed_when: false
  failed_when: false
  become: true
  tags:
    - resolved

- name: Enable, start, and restart-on-change systemd-resolved
  when: not (ansible_check_mode and resolved_apt.changed)
  systemd:
    name: systemd-resolved.service
    enabled: true
    state: >-
      {{ 'restarted'
         if resolved_apt.changed or resolved_custom_conf.changed
         else 'started' }}
  become: true
  tags:
    - resolved
