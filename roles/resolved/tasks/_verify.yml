# Check runtime effects because resolved silently ignores unknown directives.
# Avoid external queries because SLIRP UDP DNS is flaky under load.

- name: _verify | Stat /etc/resolv.conf
  stat:
    path: /etc/resolv.conf
  register: resolved_verify_symlink

- name: _verify | The resolv.conf symlink targets the local stub
  assert:
    that:
      - resolved_verify_symlink.stat.islnk | default(false)
      - resolved_verify_symlink.stat.lnk_target == '/run/systemd/resolve/stub-resolv.conf'
    fail_msg: >-
      /etc/resolv.conf is not a symlink to
      /run/systemd/resolve/stub-resolv.conf (got
      {{ resolved_verify_symlink.stat.lnk_target | default('a regular file') }}).

# Read the managed file directly so SLIRP cannot flake the upstream check.
- name: _verify | Read the resolved-managed resolv.conf
  slurp:
    src: /run/systemd/resolve/resolv.conf
  register: resolved_verify_resolv_conf

- name: _verify | The resolv.conf nameserver is a non-stub LAN upstream
  vars:
    resolved_verify_nameservers: >-
      {{ (resolved_verify_resolv_conf.content | b64decode).splitlines()
         | select('match', '^nameserver ') | list }}
  assert:
    that:
      - resolved_verify_nameservers | length > 0
      - >-
        resolved_verify_nameservers
        | select('search', '127\.0\.0\.53') | list | length == 0
    fail_msg: >-
      /run/systemd/resolve/resolv.conf has no usable upstream nameserver
      (or lists the local 127.0.0.53 stub): {{ resolved_verify_nameservers }}

# Wire-level proof that the standard stub is available to host clients.
- name: _verify | List listening TCP/UDP sockets
  command: ss -Hlntu
  register: resolved_verify_listeners
  changed_when: false

- name: _verify | The 127.0.0.53 stub listener is active
  assert:
    that:
      - resolved_verify_listeners.stdout is search('127\.0\.0\.53.*:53')
    fail_msg: >-
      systemd-resolved is not listening on 127.0.0.53:53
      (DNSStubListener=yes did not take effect): {{ resolved_verify_listeners.stdout }}

# Avahi is absent from the fixture, so these ports must be free.
- name: _verify | The mDNS (5353) and LLMNR (5355) sockets are gone
  assert:
    that:
      - "':5353' not in resolved_verify_listeners.stdout"
      - "':5355' not in resolved_verify_listeners.stdout"
    fail_msg: >-
      systemd-resolved is still bound to :5353 or :5355 (MulticastDNS=no /
      LLMNR=no did not take effect): {{ resolved_verify_listeners.stdout }}
