[Resolve]
# Keep the standard local stub between host clients and the DHCP upstream.
DNSStubListener=yes
# Never fall back to public resolvers when DHCP DNS is unavailable.
FallbackDNS=
# AdGuard is the cache of record; avoid a second stale TTL cache.
Cache=no
# Avahi exclusively owns mDNS on UDP 5353.
MulticastDNS=no
# Local discovery uses Avahi; disable LLMNR and its spoofing surface.
LLMNR=no
