- name: _setup | Install netdata
  import_role:
    name: netdata
    tasks_from: install

# Disabled hosts must remove proxy files left by an earlier enablement. Seed a
# harmless stale pair so the cleanup path and its reload run in the fixture.
- name: _setup | Create static proxy fixture directories
  when: not (nginx_static_proxies_enabled | bool)
  file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /etc/nginx/sites-available
    - /etc/nginx/sites-enabled
  become: true

- name: _setup | Seed a stale static proxy config on disabled hosts
  when: not (nginx_static_proxies_enabled | bool)
  copy:
    dest: /etc/nginx/sites-available/marantz
    content: "# stale static proxy fixture\n"
    owner: root
    group: root
    mode: "0640"
  become: true

- name: _setup | Enable the stale static proxy fixture
  when: not (nginx_static_proxies_enabled | bool)
  file:
    src: /etc/nginx/sites-available/marantz
    dest: /etc/nginx/sites-enabled/marantz
    state: link
  become: true

# Lay snakeoil at the letsencrypt paths nginx.conf.j2 references before the
# role validates and starts nginx.
- name: _setup | Generate certificates
  import_tasks: _setup_snakeoil.yml
  vars:
    nginx_snakeoil_args:
      fqdn: "{{ inventory_hostname }}.{{ domain }}"
