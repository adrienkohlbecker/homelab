# Functional verification of the nginx role. Stand up a throwaway upstream
# stub + a transient nginx_site pointing at it, then probe the live vhost
# through nginx for the contracts the ~46 nginx_site consumers depend on:
# TLS termination + Host routing, key exchange (on OpenSSL >= 3.5 the
# post-quantum hybrid, including a HelloRetryRequest onto it for X25519-first
# clients; X25519 for classical ones), HTTP/2 over TLS, the security headers,
# the Authelia 401->302 redirect, the access-log credential redaction, the
# http->https redirect, the default-server catch-all, and stub_status
# answering on loopback. Probe idiom: map test FQDNs to loopback in
# /etc/hosts, then probe https://<fqdn>/ (validate_certs:false)
# so TLS SNI matches the vhost on every OpenSSL version (noble/resolute 3.x
# reject SNI=localhost with TLSV1_UNRECOGNIZED_NAME). The upstream stub via
# systemd-run (transient unit, no install-time side-effects). The VM is fresh
# per harness run and _verify runs after the idempotence check, so standing up
# fixtures here is safe (no when: qemu_test gate needed).

- name: _verify | Shared facts
  set_fact:
    nginx_verify_host: "nginxverify.{{ inventory_hostname }}.{{ domain }}"

- name: _verify | Map test vhost FQDNs to loopback for SNI-correct probing
  import_tasks: test_loopback_hosts.yml
  vars:
    nginx_test_loopback_hosts_args:
      hostnames:
        - "{{ nginx_verify_host }}"
        - nginxverifybasic.{{ inventory_hostname }}.{{ domain }}
        - nginxverifyloc.{{ inventory_hostname }}.{{ domain }}
        - nginxverifyplain.{{ inventory_hostname }}.{{ domain }}

- name: _verify | Map the IPv6 test vhost to ::1 so the probe reaches [::]:443
  lineinfile:
    path: /etc/hosts
    regexp: '^::1\s+nginxverifyipv6\.'
    line: "::1 nginxverifyipv6.{{ inventory_hostname }}.{{ domain }}"
  become: true

- name: _verify | Start upstream stub via systemd-run
  command:
    argv:
      - systemd-run
      - --unit=nginx_verify_upstream
      - python3
      - -c
      - |
        import http.server

        class H(http.server.BaseHTTPRequestHandler):
            protocol_version = "HTTP/1.1"

            def do_GET(self):
                # Keep each request's path and forwarded headers together so
                # the auth assertions cannot match separate requests.
                print(
                    "upstream-request "
                    + self.path
                    + " auth="
                    + self.headers.get("Authorization", "<none>")
                    + " fwduser="
                    + self.headers.get("X-Forwarded-User", "<none>"),
                    flush=True,
                )
                body = b"nginx_verify_upstream_ok"
                self.send_response(200)
                self.send_header("Content-Length", str(len(body)))
                self.end_headers()
                self.wfile.write(body)

        print("ready", flush=True)
        http.server.HTTPServer(("127.0.0.1", 18080), H).serve_forever()
  changed_when: true
  become: true

- name: _verify | Wait for upstream stub to bind
  wait_for:
    host: 127.0.0.1
    port: 18080
    timeout: 15

# Re-point the Authelia stub to gate mode (401) so the negative auth path
# exercises the error_page 401 -> 302 redirect.
- name: _verify | Install Authelia stub in gate mode
  import_tasks: _test_authelia_stub.yml

# Exercises the nginx_site helper end-to-end (assert, template, symlink, the
# new nginx -t validate-rollback, reload) on top of being the probe target.
- name: _verify | Configure a transient test vhost via the nginx_site helper
  import_tasks: site.yml
  vars:
    nginx_site_args:
      subdomain: nginxverify
      proxy_pass: http://127.0.0.1:18080/
      auth: true

- name: _verify | Unauthenticated navigation redirects to the Authelia portal (302)
  uri:
    url: "https://{{ nginx_verify_host }}/"
    validate_certs: false
    follow_redirects: none
    # Sec-Fetch-Mode: navigate marks a top-level browser navigation, which must
    # still redirect to the portal (the @authelia_unauth navigation arm).
    headers:
      Sec-Fetch-Mode: navigate
    status_code: 302
  register: nginx_verify_unauth
  until:
    - nginx_verify_unauth.status == 302
    - nginx_verify_unauth is authelia_redirects_to('nginxverify', inventory_hostname, domain, require_rd=false)
  retries: 10
  delay: 1

# An XHR/fetch (Sec-Fetch-Mode != navigate) that fails auth must get a bare 401,
# NOT a 302 to the cross-origin portal: an SPA cannot follow that redirect and
# spins in a tight app<->auth redirect loop (the InfluxDB-UI symptom). Asserts
# the @authelia_unauth fetch arm returns 401 and emits no portal Location.
- name: _verify | Unauthenticated XHR returns a bare 401, not a portal redirect
  uri:
    url: "https://{{ nginx_verify_host }}/api/v2/signin"
    validate_certs: false
    follow_redirects: none
    headers:
      Sec-Fetch-Mode: cors
    status_code: 401
  register: nginx_verify_unauth_xhr
  until:
    - nginx_verify_unauth_xhr.status == 401
    - nginx_verify_unauth_xhr.location is not defined
  retries: 10
  delay: 1

# The static LAN-device proxies converge on lab-shaped hosts; an enabled,
# gated vhost redirects without ever reaching the unreachable device.
- name: _verify | Static device proxies are enabled behind Authelia
  import_tasks: verify_authelia_gate.yml
  vars:
    nginx_verify_authelia_gate_args:
      subdomain: marantz

# ssl_ecdh_curve only admits groups; with ssl_prefer_server_ciphers off, the
# client's preference picks among them. The hybrid alone fills the server's
# first group tuple, so a client that supports it but key-shares only X25519
# must be retried onto it rather than falling back to X25519. Without a "*"
# prefix, s_client sends a key share for the first listed group only; its
# -brief summary on stderr names the "Negotiated TLS1.3 group" (OpenSSL >= 3.5).
- name: _verify | A client key-sharing only X25519 is retried onto the hybrid
  command:
    argv:
      - timeout
      - 10s
      - openssl
      - s_client
      - -connect
      - "127.0.0.1:443"
      - -servername
      - "{{ nginx_verify_host }}"
      - -brief
      - -groups
      - X25519:X25519MLKEM768
    stdin: Q
  register: nginx_verify_tls_hrr
  changed_when: false
  failed_when: "'Negotiated TLS1.3 group: X25519MLKEM768' not in nginx_verify_tls_hrr.stderr"
  when: ansible_distribution_release != 'noble'

# -groups X25519 offers no other group, so a completed handshake proves X25519.
- name: _verify | A classical-only client still negotiates X25519
  command:
    argv:
      - timeout
      - 10s
      - openssl
      - s_client
      - -connect
      - "127.0.0.1:443"
      - -servername
      - "{{ nginx_verify_host }}"
      - -brief
      - -groups
      - X25519
    stdin: Q
  changed_when: false

# Noble enables HTTP/2 per listener and newer releases per vhost server; a
# broken release gate would silently fall back to HTTP/1.1.
- name: _verify | TLS clients negotiate HTTP/2
  command:
    argv:
      - curl
      - --silent
      - --show-error
      - --max-time
      - '5'
      - --insecure
      - --http2
      - --output
      - /dev/null
      - --write-out
      - "%{http_version}"
      - "https://{{ nginx_verify_host }}/"
  register: nginx_verify_h2
  changed_when: false
  failed_when: nginx_verify_h2.stdout != '2'

# Access-log credential redaction rebuilds the request line from the method,
# redacted URI, and protocol. The request is logged regardless of status, so
# the gate-mode 302 exercises it. Poll until the buffered line reaches disk.
- name: _verify | Fire a request carrying an apikey query param
  uri:
    url: "https://{{ nginx_verify_host }}/?apikey=__nginx_verify_secret__"
    validate_certs: false
    follow_redirects: none
    status_code: 302
  register: nginx_verify_redacted_auth_request
  until:
    - nginx_verify_redacted_auth_request.status == 302
    - "'__nginx_verify_secret__' not in (nginx_verify_redacted_auth_request.location | default(''))"
    - "'apikey=REDACTED' in (nginx_verify_redacted_auth_request.location | default(''))"
  retries: 10
  delay: 1

- name: _verify | Wait for the redacted apikey to reach the access log
  command: tail -n 200 /var/log/nginx/access.log
  register: nginx_verify_access_log
  changed_when: false
  become: true
  until: "'apikey=REDACTED' in nginx_verify_access_log.stdout"
  retries: 10
  delay: 2

- name: _verify | Nginx access log never contains the raw apikey
  assert:
    that:
      - "'__nginx_verify_secret__' not in nginx_verify_access_log.stdout"
    fail_msg: >-
      Raw apikey leaked into /var/log/nginx/access.log; expected only
      apikey=REDACTED.

# Without auth_request_authorization, the auth subrequest must not carry the
# client's Authorization header. The gate-mode stub admits this exact Basic
# credential, so a 302 proves nginx cleared it; forwarding it would yield 200.
- name: _verify | An Authorization header does not reach the auth subrequest by default
  uri:
    url: "https://{{ nginx_verify_host }}/"
    url_username: nginxverify
    url_password: secret
    force_basic_auth: true
    validate_certs: false
    follow_redirects: none
    status_code: 302
  register: nginx_verify_auth_bypass
  until: nginx_verify_auth_bypass.status == 302
  retries: 10
  delay: 1

# Probe the redirect and default catch-all on the public listener; the status
# endpoint is checked separately through its loopback-only ACL.
- name: _verify | HTTP request 308-redirects to HTTPS
  uri:
    url: "http://{{ ansible_default_ipv4.address }}/"
    headers:
      Host: "{{ nginx_verify_host }}"
    follow_redirects: none
    status_code: 308
  register: nginx_verify_http
  until:
    - nginx_verify_http.status == 308
    - (nginx_verify_http.location | default('')).startswith('https://')
  retries: 10
  delay: 1

- name: _verify | Unknown Host hits the default server (404)
  uri:
    url: "http://{{ ansible_default_ipv4.address }}/"
    headers:
      Host: nonexistent.invalid
    status_code: 404

- name: _verify | Loopback stub_status endpoint answers 200
  uri:
    url: http://127.0.0.1/nginx_status
    return_content: true
    status_code: 200
  register: nginx_verify_stub
  failed_when: "'Active connections' not in (nginx_verify_stub.content | default(''))"

# HTTP Basic service accounts need their Authorization header on the Authelia
# subrequest, while the protected application should not receive the reusable
# credential. The gate-mode stub admits only the fixed Basic credential; the
# helper keeps forwarding opt-in so ordinary Token/Bearer apps retain the
# cookie-only behavior exercised above.

- name: _verify | Configure a Basic-auth service-account vhost
  import_tasks: site.yml
  vars:
    nginx_site_args:
      subdomain: nginxverifybasic
      proxy_pass: http://127.0.0.1:18080/
      auth: true
      auth_request_authorization: true

- name: _verify | Basic-auth service account is admitted
  uri:
    url: "https://nginxverifybasic.{{ inventory_hostname }}.{{ domain }}/basic-probe"
    url_username: nginxverify
    url_password: secret
    force_basic_auth: true
    validate_certs: false
    status_code: 200
  register: nginx_verify_basic
  until: nginx_verify_basic.status == 200
  retries: 10
  delay: 1

- name: _verify | Basic credential was stripped before the protected upstream
  command: journalctl -u nginx_verify_upstream --no-pager
  register: nginx_verify_basic_journal
  changed_when: false
  become: true
  until: "'upstream-request /basic-probe auth=<none> fwduser=nginxverifyuser' in nginx_verify_basic_journal.stdout"
  retries: 10
  delay: 1

# --- auth-passes phase ---
# Switch the stub to `authed` (200 + Remote-User) so browser identity forwarding
# and location_conf re-emit paths run with auth succeeding.
- name: _verify | Switch the Authelia stub to authed mode
  import_tasks: _test_authelia_stub.yml
  vars:
    nginx_test_authelia_stub_args:
      mode: authed

# When Authelia admits a request, the same vhost forwards Remote-User from the
# auth subrequest as X-Forwarded-User for the *arr suite's External auth mode.
- name: _verify | Authenticated browser user is admitted and identity-forwarded
  uri:
    url: "https://{{ nginx_verify_host }}/"
    validate_certs: false
    status_code: 200
  register: nginx_verify_auth
  until: nginx_verify_auth.status == 200
  retries: 10
  delay: 1

- name: _verify | Upstream received X-Forwarded-User from the auth subrequest
  command: journalctl -u nginx_verify_upstream --no-pager
  register: nginx_verify_inj_journal
  changed_when: false
  become: true
  until: "'upstream-request / auth=<none> fwduser=nginxverifyuser' in nginx_verify_inj_journal.stdout"
  retries: 10
  delay: 1

# A location-level add_header drops nginx's inherited add_header set, so the
# helper re-emits the security headers, including the composed CSP, inside
# `location /`. A server_conf snippet adds a sibling location at server scope.
- name: _verify | Configure a vhost with location and server snippets
  import_tasks: site.yml
  vars:
    nginx_site_args:
      subdomain: nginxverifyloc
      proxy_pass: http://127.0.0.1:18080/
      auth: true
      csp: >-
        connect-src api.csptest;
        default-src default.csptest {{ nginx_csp_default }}; frame-ancestors https://frame.csptest;
      location_conf: |
        add_header X-Verify-Loc "1" always;
      server_conf: |
        location = /sidecar {
          return 200 "server-conf-ok";
        }

- name: _verify | A location_conf keeps the security headers AND its own header
  uri:
    url: "https://nginxverifyloc.{{ inventory_hostname }}.{{ domain }}/"
    validate_certs: false
    status_code: 200
  register: nginx_verify_loc
  until:
    - nginx_verify_loc.status == 200
    - nginx_verify_loc.strict_transport_security is defined
    - "'connect-src api.csptest' in (nginx_verify_loc.content_security_policy | default(''))"
    - "'default-src default.csptest' in (nginx_verify_loc.content_security_policy | default(''))"
    - "'frame-ancestors https://frame.csptest' in (nginx_verify_loc.content_security_policy | default(''))"
    - nginx_verify_loc.x_verify_loc is defined
  retries: 10
  delay: 1

- name: _verify | A server_conf snippet adds a working sibling location
  uri:
    url: "https://nginxverifyloc.{{ inventory_hostname }}.{{ domain }}/sidecar"
    validate_certs: false
    return_content: true
    status_code: 200
  register: nginx_verify_serverconf
  until:
    - nginx_verify_serverconf.status == 200
    - "'server-conf-ok' in (nginx_verify_serverconf.content | default(''))"
  retries: 10
  delay: 1

# `csp: false` + enable_http on one auth-less vhost: confirm :80 serves
# cleartext without a redirect, and that `csp: false` emits no CSP header
# (letting the upstream's own through).
- name: _verify | Configure a plaintext, CSP-free vhost
  import_tasks: site.yml
  vars:
    nginx_site_args:
      subdomain: nginxverifyplain
      proxy_pass: http://127.0.0.1:18080/
      enable_http: true
      csp: false

- name: _verify | The enable_http listener serves :80 in cleartext without a redirect
  uri:
    url: "http://{{ ansible_default_ipv4.address }}/"
    headers:
      Host: "nginxverifyplain.{{ inventory_hostname }}.{{ domain }}"
    follow_redirects: none
    return_content: true
    status_code: 200
  register: nginx_verify_plain80
  until:
    - nginx_verify_plain80.status == 200
    - "'nginx_verify_upstream_ok' in (nginx_verify_plain80.content | default(''))"
  retries: 10
  delay: 1

- name: _verify | A csp-false vhost emits no Content-Security-Policy header
  uri:
    url: "https://nginxverifyplain.{{ inventory_hostname }}.{{ domain }}/"
    validate_certs: false
    status_code: 200
  register: nginx_verify_csp
  until:
    - nginx_verify_csp.status == 200
    - nginx_verify_csp.content_security_policy is not defined
  retries: 10
  delay: 1

# The nginx_ipv6 path (group_vars/physical_fox.yml only, never in the test matrix)
# renders [::]-listeners in site.conf.j2 / nginx.conf.j2 that nothing
# else exercises. The firewall role's disable_ipv6 sysctl does NOT run in the
# nginx test path, so the Lab VM has IPv6 live and we can bind + probe it for
# real. Setting nginx_ipv6 only on this call adds `listen [::]:443 ssl` to this
# vhost; it becomes the only server on that socket, so a [::1] probe reaches it.
# No auth -- this exercises the listener, not the auth flow (covered above).
- name: _verify | Configure an IPv6-enabled vhost
  import_tasks: site.yml
  vars:
    nginx_ipv6: true
    nginx_site_args:
      subdomain: nginxverifyipv6
      proxy_pass: http://127.0.0.1:18080/

- name: _verify | The [::]:443 listener serves the vhost over ::1
  uri:
    url: "https://nginxverifyipv6.{{ inventory_hostname }}.{{ domain }}/"
    validate_certs: false
    return_content: true
    status_code: 200
  register: nginx_verify_ipv6
  until:
    - nginx_verify_ipv6.status == 200
    - "'nginx_verify_upstream_ok' in (nginx_verify_ipv6.content | default(''))"
  retries: 10
  delay: 1

# A broken update to an existing, enabled site must put the previous config
# back rather than leave the bad render for the next host-wide reload.
- name: _verify | Read the working IPv6 vhost config
  slurp:
    src: /etc/nginx/sites-available/nginxverifyipv6
  register: nginx_verify_update_before
  become: true

- name: _verify | Broken update to an existing site restores its previous config
  become: true
  block:
    - name: _verify | Configure a broken update for the IPv6 vhost
      import_tasks: site.yml
      vars:
        nginx_site_args:
          subdomain: nginxverifyipv6
          server_conf: |
            nginx_verify_broken_site_directive on;

    - name: _verify | Broken update must fail validation (unexpected success)
      fail:
        msg: The broken update to an existing site unexpectedly passed validation.
  rescue:
    - name: _verify | The previous config is back in place
      slurp:
        src: /etc/nginx/sites-available/nginxverifyipv6
      register: nginx_verify_update_after
      failed_when: nginx_verify_update_after.content != nginx_verify_update_before.content

    - name: _verify | Nginx config is still valid after the update rollback
      command: nginx -t
      changed_when: false

# Remove every transient vhost in one teardown and reload once.
- name: _verify | Remove transient test vhosts
  file:
    path: "/etc/nginx/{{ item.1 }}/{{ item.0 }}"
    state: absent
  become: true
  loop: "{{ nginx_verify_supporting_sites | product(['sites-enabled', 'sites-available']) | list }}"
  register: nginx_verify_site_cleanup
  loop_control:
    label: "{{ item.0 }} ({{ item.1 }})"
  vars:
    nginx_verify_supporting_sites:
      - nginxverify
      - nginxverifybasic
      - nginxverifyloc
      - nginxverifyplain
      - nginxverifyipv6

- name: _verify | Reload nginx after transient vhost teardown
  when: nginx_verify_site_cleanup.changed
  systemd:
    name: nginx
    state: reloaded
  become: true

# Feed the helper a syntactically broken server_conf and confirm the config and
# its sites-enabled symlink are both removed while nginx stays valid.
- name: _verify | Broken site config is validated and rolled back
  become: true
  block:
    - name: _verify | Configure a deliberately broken site
      import_tasks: site.yml
      vars:
        nginx_site_args:
          subdomain: nginxverifybroken
          server_conf: |
            nginx_verify_broken_site_directive on;

    - name: _verify | Broken site must fail validation (unexpected success)
      fail:
        msg: >-
          The broken site should have failed `nginx -t` and rolled back, but the
          helper reported success.
  rescue:
    - name: _verify | Broken site and symlink were rolled back (absent)
      stat:
        path: "{{ item }}"
      register: nginx_verify_broken_site
      failed_when: nginx_verify_broken_site.stat.exists
      loop:
        - /etc/nginx/sites-available/nginxverifybroken
        - /etc/nginx/sites-enabled/nginxverifybroken

    - name: _verify | Nginx config is still valid after the site rollback
      command: nginx -t
      changed_when: false

- name: _verify | Disturb the managed config before exercising reload
  lineinfile:
    path: /etc/nginx/nginx.conf
    line: "# _verify reload path"
    state: present
  become: true

- name: _verify | Restore the managed config through the production tasks
  import_tasks: install.yml
