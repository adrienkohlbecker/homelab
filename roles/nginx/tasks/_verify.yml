# Functional verification of the nginx role. Stand up a throwaway upstream
# stub + a transient nginx_site pointing at it, then probe the live vhost
# through nginx for the contracts the ~46 nginx_site consumers depend on:
# TLS termination + Host routing, the security headers, the Authelia 401->302
# redirect, the access-log credential redaction, the http->https redirect, the
# default-server catch-all, and stub_status's loopback binding. Probe idiom:
# map test FQDNs to loopback in
# /etc/hosts, then probe https://<fqdn>/ (validate_certs:false) so TLS SNI
# matches the vhost on every OpenSSL version (noble/resolute 3.x reject
# SNI=localhost with TLSV1_UNRECOGNIZED_NAME). The upstream stub via
# systemd-run (transient unit, no install-time side-effects). The VM is fresh
# per harness run and _verify runs after the idempotence check, so standing up
# fixtures here is safe (no when: qemu_test gate needed).

- name: _verify | Shared facts
  set_fact:
    nginx_verify_host: "nginxverify.{{ inventory_hostname }}.{{ domain }}"

# Exercise the web-log collector's enabled-to-disabled transition while
# access.log is still empty. The disabled template must replace the active job
# and let the shared netdata helper own the required restart.
- name: _verify | Enable nginx web-log metrics
  import_tasks: netdata.yml
  vars:
    nginx_web_log_metrics: true

- name: _verify | Read enabled web-log metrics config
  slurp:
    src: /etc/netdata/go.d/web_log.conf
  register: nginx_verify_web_log_enabled
  become: true

- name: _verify | Enabled web-log metrics config carries the nginx job
  assert:
    that:
      - (nginx_verify_web_log_enabled.content | b64decode | from_yaml).jobs | map(attribute='name') | list == ['nginx']

- name: _verify | Disable nginx web-log metrics
  import_tasks: netdata.yml
  vars:
    nginx_web_log_metrics: false

- name: _verify | Read disabled web-log metrics config
  slurp:
    src: /etc/netdata/go.d/web_log.conf
  register: nginx_verify_web_log_disabled
  become: true

- name: _verify | Disabled web-log metrics config has no jobs and netdata stayed active
  systemd:
    name: netdata.service
  register: nginx_verify_netdata_active
  failed_when: >-
    (nginx_verify_web_log_disabled.content | b64decode | from_yaml).jobs != []
    or nginx_verify_netdata_active.status.ActiveState != 'active'
  become: true

- name: _verify | Reapply disabled nginx web-log metrics
  import_tasks: netdata.yml
  vars:
    nginx_web_log_metrics: false

- name: _verify | Disabled nginx web-log metrics are idempotent
  assert:
    that:
      - not netdata_config.changed

# TLS SNI follows the URL host, not the Host header. On noble/resolute (OpenSSL
# 3.x), an SNI of `localhost` that matches no server_name triggers a fatal
# TLSV1_UNRECOGNIZED_NAME. Map every test-vhost FQDN to loopback so probes can
# use the real FQDN in the URL, making SNI match the vhost on every release.
- name: _verify | Map test vhost FQDNs to loopback for SNI-correct probing
  lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.0\.1\s+nginxverify'
    line: >-
      127.0.0.1
      {{ nginx_verify_host }}
      nginxverifyempty.{{ inventory_hostname }}.{{ domain }}
      nginxverifyauth.{{ inventory_hostname }}.{{ domain }}
      nginxverifybasic.{{ inventory_hostname }}.{{ domain }}
      nginxverifyloc.{{ inventory_hostname }}.{{ domain }}
      nginxverifyserverconf.{{ inventory_hostname }}.{{ domain }}
      nginxverifybody.{{ inventory_hostname }}.{{ domain }}
      nginxverifybuffering.{{ inventory_hostname }}.{{ domain }}
      nginxverifycsp.{{ inventory_hostname }}.{{ domain }}
      nginxverifyplain.{{ inventory_hostname }}.{{ domain }}
  become: true

- name: _verify | Map the IPv6 test vhost to ::1 so the probe reaches [::]:443
  lineinfile:
    path: /etc/hosts
    regexp: '^::1\s+nginxverifyipv6\.'
    line: "::1 nginxverifyipv6.{{ inventory_hostname }}.{{ domain }}"
  become: true

- name: _verify | Start upstream stub via systemd-run
  command:
    argv:
      - systemd-run
      - --unit=nginx_verify_upstream
      - python3
      - -c
      - |
        import http.server

        class H(http.server.BaseHTTPRequestHandler):
            protocol_version = "HTTP/1.1"

            def do_GET(self):
                # Echo the received request line, Authorization and Authelia
                # identity header to the journal so the identity-forwarding
                # assertions can confirm exactly what reached the upstream.
                print("upstream-saw " + self.path, flush=True)
                print("upstream-auth " + self.headers.get("Authorization", "<none>"), flush=True)
                print(
                    "upstream-request "
                    + self.path
                    + " auth="
                    + self.headers.get("Authorization", "<none>"),
                    flush=True,
                )
                print("upstream-fwduser " + self.headers.get("X-Forwarded-User", "<none>"), flush=True)
                body = b"nginx_verify_upstream_ok"
                self.send_response(200)
                self.send_header("Content-Length", str(len(body)))
                self.end_headers()
                self.wfile.write(body)

        print("ready", flush=True)
        http.server.HTTPServer(("127.0.0.1", 18080), H).serve_forever()
  changed_when: true
  become: true

- name: _verify | Wait for upstream stub to bind
  wait_for:
    host: 127.0.0.1
    port: 18080
    timeout: 15

# Re-point the Authelia stub to gate mode (401) so the negative auth path
# exercises the error_page 401 -> 302 redirect.
- name: _verify | Install Authelia stub in gate mode
  import_tasks: test_authelia_stub.yml

# Bounded readiness probe (fail-fast, per the harness flake contract): the stub
# re-install reloaded nginx, so poll its endpoint until the gate 401 lands
# rather than racing the reload on a slow VM.
- name: _verify | Wait for the Authelia gate stub to answer 401
  uri:
    url: "http://127.0.0.1:{{ service_ports.authelia }}/api/authz/auth-request"
    status_code: 401
  register: nginx_verify_gate_ready
  until: nginx_verify_gate_ready.status == 401
  retries: 10
  delay: 1

# Exercises the nginx_site helper end-to-end (assert, template, symlink, the
# new nginx -t validate-rollback, reload) on top of being the probe target.
- name: _verify | Configure a transient test vhost via the nginx_site helper
  import_role:
    name: nginx
    tasks_from: site
  vars:
    nginx_site_args:
      subdomain: nginxverify
      proxy_pass: http://127.0.0.1:18080/
      auth: true

- name: _verify | Unauthenticated navigation redirects to the Authelia portal (302)
  uri:
    url: "https://{{ nginx_verify_host }}/"
    validate_certs: false
    follow_redirects: none
    # Sec-Fetch-Mode: navigate marks a top-level browser navigation, which must
    # still redirect to the portal (the @authelia_unauth navigation arm).
    headers:
      Sec-Fetch-Mode: navigate
    status_code: 302
  register: nginx_verify_unauth
  until:
    - nginx_verify_unauth.status == 302
    - nginx_verify_unauth is authelia_redirects_to('nginxverifyauth', inventory_hostname, domain, require_rd=false)
  retries: 10
  delay: 1

# An XHR/fetch (Sec-Fetch-Mode != navigate) that fails auth must get a bare 401,
# NOT a 302 to the cross-origin portal: an SPA cannot follow that redirect and
# spins in a tight app<->auth redirect loop (the InfluxDB-UI symptom). Asserts
# the @authelia_unauth fetch arm returns 401 and emits no portal Location.
- name: _verify | Unauthenticated XHR returns a bare 401, not a portal redirect
  uri:
    url: "https://{{ nginx_verify_host }}/api/v2/signin"
    validate_certs: false
    follow_redirects: none
    headers:
      Sec-Fetch-Mode: cors
    status_code: 401
  register: nginx_verify_unauth_xhr
  until:
    - nginx_verify_unauth_xhr.status == 401
    - nginx_verify_unauth_xhr.location is not defined
  retries: 10
  delay: 1

# Access-log credential redaction: nginx logs $request_safe, which rewrites a
# credential query param (apikey, SABnzbd's admin key) to REDACTED before the
# request line lands on disk. The request is logged regardless of status, so the
# gate-mode 302 is enough to exercise it. access_log buffers with flush=5s, so
# poll (bounded, fail-fast) until the redacted line lands rather than racing the
# flush on a slow VM.
- name: _verify | Fire a request carrying an apikey query param
  uri:
    url: "https://{{ nginx_verify_host }}/?apikey=__nginx_verify_secret__"
    validate_certs: false
    follow_redirects: none
    status_code: 302
  register: nginx_verify_redacted_auth_request
  until:
    - nginx_verify_redacted_auth_request.status == 302
    - "'__nginx_verify_secret__' not in (nginx_verify_redacted_auth_request.location | default(''))"
    - "'apikey=REDACTED' in (nginx_verify_redacted_auth_request.location | default(''))"
  retries: 10
  delay: 1

- name: _verify | Wait for the redacted apikey to reach the access log
  command: tail -n 200 /var/log/nginx/access.log
  register: nginx_verify_access_log
  changed_when: false
  become: true
  until: "'apikey=REDACTED' in nginx_verify_access_log.stdout"
  retries: 10
  delay: 2

- name: _verify | Nginx access log never contains the raw apikey
  assert:
    that:
      - "'__nginx_verify_secret__' not in nginx_verify_access_log.stdout"
    fail_msg: >-
      Raw apikey leaked into /var/log/nginx/access.log; expected only
      apikey=REDACTED.

# An auth-enabled vhost must gate EVERY cookieless
# request to Authelia, including one carrying its own Authorization header --
# there is no Authorization-bypass shortcut. Stub is still in gate mode (401), so
# the request must redirect to the portal (302), not short-circuit to the upstream.
- name: _verify | Configure a plain auth-required vhost
  import_role:
    name: nginx
    tasks_from: site
  vars:
    nginx_site_args:
      subdomain: nginxverifyempty
      proxy_pass: http://127.0.0.1:18080/
      auth: true

- name: _verify | A cookieless Authorization-bearing request is still gated (no bypass)
  uri:
    url: "https://nginxverifyempty.{{ inventory_hostname }}.{{ domain }}/"
    headers:
      Authorization: Token should-not-bypass
    validate_certs: false
    follow_redirects: none
    status_code: 302
  register: nginx_verify_empty_auth
  until: nginx_verify_empty_auth.status == 302
  retries: 10
  delay: 1

# http->https redirect and the default-server catch-all are probed on the
# public interface, not loopback: the stub_status server binds 127.0.0.1:80
# specifically, which captures every loopback :80 request regardless of Host.
- name: _verify | HTTP request 308-redirects to HTTPS
  uri:
    url: "http://{{ ansible_default_ipv4.address }}/"
    headers:
      Host: "{{ nginx_verify_host }}"
    follow_redirects: none
    status_code: 308
  register: nginx_verify_http
  until:
    - nginx_verify_http.status == 308
    - (nginx_verify_http.location | default('')).startswith('https://')
  retries: 10
  delay: 1

- name: _verify | Unknown Host hits the default server (404)
  uri:
    url: "http://{{ ansible_default_ipv4.address }}/"
    headers:
      Host: nonexistent.invalid
    status_code: 404

- name: _verify | Loopback stub_status endpoint answers 200
  uri:
    url: http://127.0.0.1/nginx_status
    return_content: true
    status_code: 200
  register: nginx_verify_stub
  failed_when: "'Active connections' not in (nginx_verify_stub.content | default(''))"

# --- auth-passes phase ---
# Switch the stub to `authed` (200 + Remote-User) so the auth-identity forwarding
# and location_conf re-emit paths run with auth SUCCEEDING, which the gate-mode
# tests above can't reach.
- name: _verify | Switch the Authelia stub to authed mode
  import_tasks: test_authelia_stub.yml
  vars:
    nginx_test_authelia_stub_args:
      mode: authed

- name: _verify | Wait for the Authelia authed stub to answer 200
  uri:
    url: "http://127.0.0.1:{{ service_ports.authelia }}/api/authz/auth-request"
    status_code: 200
  register: nginx_verify_authed_ready
  until: nginx_verify_authed_ready.status == 200
  retries: 10
  delay: 1

# When Authelia admits a request, the vhost forwards Remote-User from the auth
# subrequest as X-Forwarded-User for the *arr suite's External auth mode.
- name: _verify | Configure an auth-required vhost for identity forwarding
  import_role:
    name: nginx
    tasks_from: site
  vars:
    nginx_site_args:
      subdomain: nginxverifyauth
      proxy_pass: http://127.0.0.1:18080/
      auth: true

- name: _verify | Authenticated browser user is admitted and identity-forwarded
  uri:
    url: "https://nginxverifyauth.{{ inventory_hostname }}.{{ domain }}/"
    validate_certs: false
    status_code: 200
  register: nginx_verify_auth
  until: nginx_verify_auth.status == 200
  retries: 10
  delay: 1

- name: _verify | Upstream received X-Forwarded-User from the auth subrequest
  command: journalctl -u nginx_verify_upstream --no-pager
  register: nginx_verify_inj_journal
  changed_when: false
  become: true
  until: "'upstream-fwduser nginxverifyuser' in nginx_verify_inj_journal.stdout"
  retries: 10
  delay: 1

# HTTP Basic service accounts need their Authorization header on the Authelia
# subrequest, while the protected application should not receive the reusable
# credential. The helper keeps forwarding opt-in so ordinary Token/Bearer apps
# retain the cookie-only behavior exercised above.
- name: _verify | Switch the Authelia stub to Basic mode
  import_tasks: test_authelia_stub.yml
  vars:
    nginx_test_authelia_stub_args:
      mode: basic

- name: _verify | Configure a Basic-auth service-account vhost
  import_role:
    name: nginx
    tasks_from: site
  vars:
    nginx_site_args:
      subdomain: nginxverifybasic
      proxy_pass: http://127.0.0.1:18080/
      auth: true
      auth_request_authorization: true

- name: _verify | Basic-auth service account is admitted
  uri:
    url: "https://nginxverifybasic.{{ inventory_hostname }}.{{ domain }}/basic-probe"
    url_username: nginxverify
    url_password: secret
    force_basic_auth: true
    validate_certs: false
    status_code: 200
  register: nginx_verify_basic
  until: nginx_verify_basic.status == 200
  retries: 10
  delay: 1

- name: _verify | Basic credential was stripped before the protected upstream
  command: journalctl -u nginx_verify_upstream --no-pager
  register: nginx_verify_basic_journal
  changed_when: false
  become: true
  until: "'upstream-request /basic-probe auth=<none>' in nginx_verify_basic_journal.stdout"
  retries: 10
  delay: 1

- name: _verify | Restore the Authelia stub to authed mode
  import_tasks: test_authelia_stub.yml
  vars:
    nginx_test_authelia_stub_args:
      mode: authed

# location_conf: a location-level add_header drops nginx's inherited add_header
# set, so the helper re-emits the security headers inside `location /`. If that
# re-emit regressed, HSTS/CSP would silently vanish from every location_conf
# site (netdata, minio).
- name: _verify | Configure a vhost with a location_conf snippet
  import_role:
    name: nginx
    tasks_from: site
  vars:
    nginx_site_args:
      subdomain: nginxverifyloc
      proxy_pass: http://127.0.0.1:18080/
      auth: true
      location_conf: |
        add_header X-Verify-Loc "1" always;

- name: _verify | A location_conf keeps the security headers AND its own header
  uri:
    url: "https://nginxverifyloc.{{ inventory_hostname }}.{{ domain }}/"
    validate_certs: false
    status_code: 200
  register: nginx_verify_loc
  until:
    - nginx_verify_loc.status == 200
    - nginx_verify_loc.strict_transport_security is defined
    - nginx_verify_loc.content_security_policy is defined
    - nginx_verify_loc.x_verify_loc is defined
    - nginx_verify_loc.x_xss_protection is not defined
  retries: 10
  delay: 1

# server_conf adds a sibling location at server scope. The only other use of the
# key feeds a deliberately-broken directive (the rollback test below), so the
# positive contract -- the snippet renders and the added location actually
# serves -- would otherwise be untested, yet homepage's /alerts/ relies on it.
- name: _verify | Configure a vhost with a server_conf snippet
  import_role:
    name: nginx
    tasks_from: site
  vars:
    nginx_site_args:
      subdomain: nginxverifyserverconf
      proxy_pass: http://127.0.0.1:18080/
      server_conf: |
        location = /sidecar {
          return 200 "server-conf-ok";
        }

- name: _verify | A server_conf snippet adds a working sibling location
  uri:
    url: "https://nginxverifyserverconf.{{ inventory_hostname }}.{{ domain }}/sidecar"
    validate_certs: false
    return_content: true
    status_code: 200
  register: nginx_verify_serverconf
  until:
    - nginx_verify_serverconf.status == 200
    - "'server-conf-ok' in (nginx_verify_serverconf.content | default(''))"
  retries: 10
  delay: 1

# The first-class client_max_body_size / client_body_buffer_size keys.
# Configuring the vhost proves both render into valid config (the helper's
# nginx -t gates a typo'd directive name); the 413 below proves the size limit
# is enforced before the body reaches the upstream. No auth needed.
- name: _verify | Configure a vhost with body-size limits
  import_role:
    name: nginx
    tasks_from: site
  vars:
    nginx_site_args:
      subdomain: nginxverifybody
      proxy_pass: http://127.0.0.1:18080/
      client_max_body_size: 1k
      client_body_buffer_size: 2k

- name: _verify | A body over client_max_body_size is rejected with 413
  uri:
    url: "https://nginxverifybody.{{ inventory_hostname }}.{{ domain }}/"
    method: POST
    body: "{{ 'x' * 4096 }}"
    validate_certs: false
    status_code: 413
  register: nginx_verify_body_limit
  until: nginx_verify_body_limit.status == 413
  retries: 10
  delay: 1

# proxy_buffering / proxy_request_buffering take the quoted string 'on'/'off' (a
# bare off is YAML-coerced to the boolean false and renders an invalid
# `proxy_buffering false;`). The quoted form must pass the new string-toggle
# assert AND render into config the helper's nginx -t accepts; the proxied 200
# confirms the site is live. No auth needed.
- name: _verify | Configure a vhost with proxy buffering toggled off
  import_role:
    name: nginx
    tasks_from: site
  vars:
    nginx_site_args:
      subdomain: nginxverifybuffering
      proxy_pass: http://127.0.0.1:18080/
      proxy_buffering: false
      proxy_request_buffering: false

- name: _verify | The proxy-buffering vhost serves the proxied response
  uri:
    url: "https://nginxverifybuffering.{{ inventory_hostname }}.{{ domain }}/"
    validate_certs: false
    return_content: true
    status_code: 200
  register: nginx_verify_buffering
  until:
    - nginx_verify_buffering.status == 200
    - "'nginx_verify_upstream_ok' in (nginx_verify_buffering.content | default(''))"
  retries: 10
  delay: 1

- name: _verify | Standard metadata paths reach the upstream
  uri:
    url: "https://nginxverifybuffering.{{ inventory_hostname }}.{{ domain }}{{ item }}"
    validate_certs: false
    return_content: true
    status_code: 200
  loop:
    - /favicon.ico
    - /robots.txt
  register: nginx_verify_metadata
  until:
    - nginx_verify_metadata.status == 200
    - "'nginx_verify_upstream_ok' in (nginx_verify_metadata.content | default(''))"
  retries: 10
  delay: 1

# The csp_default_src / csp_frame_ancestors / csp_additional keys compose into
# the Content-Security-Policy header (site.conf.j2). Only
# csp_passthrough was tested; assert each override token actually lands in the
# rendered header, so a positioning/";" regression on the unifi consumer (the
# real csp_* user) surfaces here. No auth needed.
- name: _verify | Configure a vhost with CSP overrides
  import_role:
    name: nginx
    tasks_from: site
  vars:
    nginx_site_args:
      subdomain: nginxverifycsp
      proxy_pass: http://127.0.0.1:18080/
      csp_additional: connect-src api.csptest
      csp_default_src: default.csptest
      csp_frame_ancestors: https://frame.csptest

- name: _verify | CSP override tokens all appear in the Content-Security-Policy header
  uri:
    url: "https://nginxverifycsp.{{ inventory_hostname }}.{{ domain }}/"
    validate_certs: false
    status_code: 200
  register: nginx_verify_cspov
  until:
    - nginx_verify_cspov.status == 200
    - "'connect-src api.csptest' in (nginx_verify_cspov.content_security_policy | default(''))"
    - "'default-src default.csptest' in (nginx_verify_cspov.content_security_policy | default(''))"
    - "'frame-ancestors https://frame.csptest' in (nginx_verify_cspov.content_security_policy | default(''))"
  retries: 10
  delay: 1

# csp_passthrough + enable_http on one auth-less vhost: confirm :80 serves
# cleartext without a redirect, and that csp_passthrough emits no CSP header
# (letting the upstream's own through).
- name: _verify | Configure a plaintext, CSP-passthrough vhost
  import_role:
    name: nginx
    tasks_from: site
  vars:
    nginx_site_args:
      subdomain: nginxverifyplain
      proxy_pass: http://127.0.0.1:18080/
      enable_http: true
      csp_passthrough: true

- name: _verify | The enable_http listener serves :80 in cleartext without a redirect
  uri:
    url: "http://{{ ansible_default_ipv4.address }}/"
    headers:
      Host: "nginxverifyplain.{{ inventory_hostname }}.{{ domain }}"
    follow_redirects: none
    return_content: true
    status_code: 200
  register: nginx_verify_plain80
  until:
    - nginx_verify_plain80.status == 200
    - "'nginx_verify_upstream_ok' in (nginx_verify_plain80.content | default(''))"
  retries: 10
  delay: 1

- name: _verify | A csp_passthrough vhost emits no Content-Security-Policy header
  uri:
    url: "https://nginxverifyplain.{{ inventory_hostname }}.{{ domain }}/"
    validate_certs: false
    status_code: 200
  register: nginx_verify_csp
  until:
    - nginx_verify_csp.status == 200
    - nginx_verify_csp.content_security_policy is not defined
  retries: 10
  delay: 1

# The nginx_ipv6 path (host_vars/fox.yml only, never in the test matrix)
# renders [::]-listeners in site.conf.j2 / nginx.conf.j2 that nothing
# else exercises. The firewall role's disable_ipv6 sysctl does NOT run in the
# nginx test path, so the box VM has IPv6 live and we can bind + probe it for
# real. Setting nginx_ipv6 only on this call adds `listen [::]:443 ssl` to this
# vhost; it becomes the only server on that socket, so a [::1] probe reaches it.
# No auth -- this exercises the listener, not the auth flow (covered above).
- name: _verify | Configure an IPv6-enabled vhost
  import_role:
    name: nginx
    tasks_from: site
  vars:
    nginx_ipv6: true
    nginx_site_args:
      subdomain: nginxverifyipv6
      proxy_pass: http://127.0.0.1:18080/

- name: _verify | The [::]:443 listener serves the vhost over ::1
  uri:
    url: "https://nginxverifyipv6.{{ inventory_hostname }}.{{ domain }}/"
    validate_certs: false
    return_content: true
    status_code: 200
  register: nginx_verify_ipv6
  until:
    - nginx_verify_ipv6.status == 200
    - "'nginx_verify_upstream_ok' in (nginx_verify_ipv6.content | default(''))"
  retries: 10
  delay: 1

# Remove every transient vhost in one teardown and reload once.
- name: _verify | Remove transient test vhosts
  file:
    path: "/etc/nginx/{{ item.1 }}/{{ item.0 }}"
    state: absent
  become: true
  loop: "{{ nginx_verify_supporting_sites | product(['sites-enabled', 'sites-available']) | list }}"
  register: nginx_verify_site_cleanup
  loop_control:
    label: "{{ item.0 }} ({{ item.1 }})"
  vars:
    nginx_verify_supporting_sites:
      - nginxverify
      - nginxverifyauth
      - nginxverifybasic
      - nginxverifyloc
      - nginxverifyserverconf
      - nginxverifyplain
      - nginxverifyempty
      - nginxverifybody
      - nginxverifybuffering
      - nginxverifycsp
      - nginxverifyipv6

- name: _verify | Reload nginx after transient vhost teardown
  when: nginx_verify_site_cleanup.changed
  systemd:
    name: nginx
    state: reloaded
  become: true

# Feed the helper a syntactically broken server_conf and confirm the config and
# its sites-enabled symlink are both removed while nginx stays valid.
- name: _verify | Broken site config is validated and rolled back
  block:
    - name: _verify | Configure a deliberately broken site
      import_role:
        name: nginx
        tasks_from: site
      vars:
        nginx_site_args:
          subdomain: nginxverifybroken
          proxy_pass: http://127.0.0.1:18080/
          auth: true
          server_conf: |
            nginx_verify_broken_site_directive on;

    - name: _verify | Broken site must fail validation (unexpected success)
      fail:
        msg: >-
          The broken site should have failed `nginx -t` and rolled back, but the
          helper reported success.
  rescue:
    - name: _verify | Broken site and symlink were rolled back (absent)
      stat:
        path: "{{ item }}"
      register: nginx_verify_broken_site
      become: true
      failed_when: nginx_verify_broken_site.stat.exists
      loop:
        - /etc/nginx/sites-available/nginxverifybroken
        - /etc/nginx/sites-enabled/nginxverifybroken

    - name: _verify | Nginx config is still valid after the site rollback
      command: nginx -t
      changed_when: false
      become: true

# enable_http is asserted incompatible with auth -- :80 is cleartext, so the
# forward-auth flow would travel unencrypted. Drive
# that safety assert to its FAILURE direction (the create-tests above only ever
# feed it valid inputs): the asserts run before any write, so there's nothing to
# roll back; the helper's failure is expected, so catch it and confirm it was
# THIS assert that fired (not some unrelated error masquerading as success).
- name: _verify | Reject enable_http when combined with auth (assert must fire)
  block:
    - name: _verify | Configure an enable_http + auth vhost (must fail the assert)
      import_role:
        name: nginx
        tasks_from: site
      vars:
        nginx_site_args:
          subdomain: nginxverifyhttpauth
          proxy_pass: http://127.0.0.1:18080/
          enable_http: true
          auth: true

    - name: _verify | Combining enable_http and auth must fail validation (unexpected success)
      fail:
        msg: >-
          enable_http + auth: true should have failed the site assert
          (cleartext :80 would carry the auth flow), but the helper accepted it.
  rescue:
    - name: _verify | The failure was the enable_http/auth assert (not something else)
      assert:
        that:
          - "'enable_http' in (ansible_failed_task.name | default(''))"
        fail_msg: >-
          Expected the enable_http/auth incompatibility assert to fail, but a
          different task failed: {{ ansible_failed_task.name | default('<unknown>') }}.
