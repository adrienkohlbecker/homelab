# Inputs: caller passes `nginx_site_remove_args.subdomain`, the DNS label of the
# retired site, and may pass `condition` (default true) to gate removal while
# still publishing the result fact. Keep removal calls as tombstones until every
# relevant host has converged so stale vhosts cannot survive a fresh role run.
- name: site_remove | Assert subdomain is a safe DNS label
  assert:
    that:
      - nginx_site_remove_args.subdomain is defined
      - nginx_site_remove_args.subdomain is string
      - nginx_site_remove_args.subdomain | length > 0
      - nginx_site_remove_args.subdomain is match('^[A-Za-z0-9-]+$')
    fail_msg: >-
      nginx_site_remove_args.subdomain must be a non-empty DNS label
      ([A-Za-z0-9-]); got
      {{ nginx_site_remove_args.subdomain | default('<undefined>') }}.
  tags:
    - nginx_site

- name: site_remove | Resolve caller defaults
  set_fact:
    _nginx_site_remove_condition: "{{ nginx_site_remove_args.condition | default(true) }}"
  tags:
    - nginx_site

- name: site_remove | Remove retired nginx site
  when: _nginx_site_remove_condition
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/nginx/sites-enabled/{{ nginx_site_remove_args.subdomain }}
    - /etc/nginx/sites-available/{{ nginx_site_remove_args.subdomain }}
  become: true
  register: nginx_site_remove_result
  tags:
    - nginx_site

- name: site_remove | Reload nginx
  when:
    - _nginx_site_remove_condition
    - nginx_site_remove_result.changed | default(false)
    - not ansible_check_mode
  systemd:
    name: nginx
    state: reloaded
  become: true
  tags:
    - nginx_site

- name: site_remove | Record site result
  set_fact:
    "{{ nginx_site_remove_args.subdomain | ansible_var_key }}_site_result":
      changed: >-
        {{
          (
            _nginx_site_remove_condition
            and (nginx_site_remove_result.changed | default(false))
          ) | bool
        }}
  tags:
    - nginx_site
