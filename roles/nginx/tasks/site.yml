# Inputs: caller passes a single dict `nginx_site_args` with keys
#   subdomain                 required; serves at <subdomain>.<host>.<domain>
#   proxy_pass                optional; URL to reverse-proxy to (location /)
#   enable_http               optional bool, default false; if true, serve the
#                             same site on :80 instead of redirecting to HTTPS.
#                             Cleartext auth is unsafe, so do NOT combine with
#                             `auth`: the forward-auth flow would travel
#                             unencrypted. Asserted below.
#   csp_default_src           optional CSP directive override
#   csp_frame_ancestors       optional CSP directive override
#   csp_additional            optional CSP directive prefix
#   csp_passthrough           optional bool, default false; if true, skip the
#                             site's `add_header Content-Security-Policy` entirely
#                             and let the upstream's own CSP through. Use for apps
#                             that ship a strict nonce-based CSP (Authelia) where
#                             nginx's blanket CSP would intersect with the upstream's
#                             and produce stricter-than-either rules in the browser
#   auth                      optional bool, default false. When true, every
#                             request through / is auth_request'd via Authelia;
#                             a 401 redirects to the portal with returnUrl.
#                             Requires authelia_internal_url to point at a reachable
#                             /api/authz/auth-request endpoint; its local/remote
#                             routing is derived in group_vars/all/main.yml.
#   auth_request_authorization optional bool, default false. Forward the
#                             client's Authorization header to Authelia's auth
#                             subrequest so its HeaderAuthorization strategy can
#                             authenticate HTTP Basic service accounts, then
#                             clear it before proxying to the protected upstream.
#                             Keep false for apps whose own Token/Bearer header
#                             must reach the upstream without affecting cookie
#                             auth.
#   server_conf               optional snippet inserted in the server block.
#                             A `location` added here is NOT covered by the
#                             site's forward-auth (auth_request only wraps
#                             `location /`) nor by the security headers (a
#                             location declaring its own add_header drops the
#                             inherited set), and inherits none of `location /`'s
#                             proxy headers. Re-add auth, forwarded headers, and
#                             security headers explicitly where needed.
#   location_conf             optional snippet inserted in the / location
#                             block. Whenever it is set, the site's security
#                             headers are re-emitted at this location level (see
#                             site.conf.j2): nginx drops inherited add_header at
#                             any level that declares its own, and we can't know
#                             whether the snippet does, so we always re-emit.
#                             csp_passthrough is honoured -- the re-emit reuses
#                             the same capture, so a passthrough site stays CSP-free.
#
# The dict form prevents inter-call leakage at play-vars scope: each
# import_role pass replaces the whole `nginx_site_args` value, so a
# previous caller's proxy_pass / csp / etc. can't bleed into the next
# caller that doesn't explicitly override.
#
# Resolve caller defaults once into _nginx_site_* locals so they are not
# re-spelled at every gate below and in site.conf.j2. Always set them so no
# stale value leaks into the next nginx_site invocation.
- name: site | Resolve caller defaults
  set_fact:
    _nginx_site_auth_enabled: "{{ (nginx_site_args.auth | default(false)) | bool }}"
    _nginx_site_auth_request_authorization: "{{ (nginx_site_args.auth_request_authorization | default(false)) | bool }}"
    _nginx_site_enable_http: "{{ (nginx_site_args.enable_http | default(false)) | bool }}"
  tags:
    - nginx_site

- name: site | Assert site contract
  assert:
    that:
      - nginx_site_args.subdomain is defined
      - nginx_site_args.subdomain is string
      - nginx_site_args.subdomain | default('') | length > 0
      - nginx_site_args.subdomain | default('') is match('^[A-Za-z0-9-]+$')
      - nginx_site_args.proxy_pass is not defined or nginx_site_args.proxy_pass is string
      - nginx_site_args.proxy_pass is not defined or nginx_site_args.proxy_pass | string is match('^https?://')
      # No space/quote/semicolon and no control/non-ASCII char: it is rendered
      # straight into `proxy_pass ...;`, so any of those changes the directive.
      - nginx_site_args.proxy_pass is not defined or nginx_site_args.proxy_pass | string is not search('[ ";]')
      - nginx_site_args.proxy_pass is not defined or nginx_site_args.proxy_pass | string is not search('[^ -~]')
      - (nginx_site_args.csp_additional | default('') | string) is not search('"')
      - (nginx_site_args.csp_default_src | default('') | string) is not search('"')
      - (nginx_site_args.csp_frame_ancestors | default('') | string) is not search('"')
      - not (_nginx_site_enable_http and _nginx_site_auth_enabled)
      - not _nginx_site_auth_enabled or authelia_internal_url is defined
      - not _nginx_site_auth_enabled or (authelia_internal_url | default('')) is string
      - not _nginx_site_auth_enabled or authelia_internal_url | default('') | string is match('^https?://')
      - not _nginx_site_auth_request_authorization or _nginx_site_auth_enabled
    fail_msg: >-
      Invalid nginx_site_args contract: subdomain must be one safe DNS label;
      proxy_pass, when set, must be an injection-safe http(s) URL; CSP overrides
      must not contain double quotes; enable_http cannot be combined with auth;
      auth needs an http(s) authelia_internal_url; and
      auth_request_authorization requires auth.
  tags:
    - nginx_site

# The rendered vhost is written to sites-available/ and symlinked into
# sites-enabled/, then `nginx -t` validates the assembled config in place. On
# failure the previous version is restored from the .backup (or the file and
# symlink are removed if the site is new), so a malformed render -- a bad
# server_conf/location_conf snippet, a CSP typo, an unbalanced quote -- can't
# brick the next host-wide reload for every other site. The template task
# carries no `validate:` because `nginx -t` needs the full assembled config
# (events{}, http{}, and the symlink), not a standalone server{} snippet.
- name: site | Configure and enable nginx site
  become: true
  tags:
    - nginx_site
  block:
    - name: site | Configure nginx site  # noqa: require-validate
      template:
        src: site.conf.j2
        dest: /etc/nginx/sites-available/{{ nginx_site_args.subdomain }}
        owner: root
        group: root
        # 0640 root:root: vhost configs are read by nginx as root and carry no
        # public value, so keep them off world-read as a conservative default.
        mode: "0640"
        backup: true
      register: nginx_static_conf

    - name: site | Enable nginx site
      when: not (ansible_check_mode and nginx_static_conf.changed)
      file:
        src: /etc/nginx/sites-available/{{ nginx_site_args.subdomain }}
        dest: /etc/nginx/sites-enabled/{{ nginx_site_args.subdomain }}
        state: link
      register: nginx_static_conf_enable

    - name: site | Validate nginx config in place
      when:
        - not ansible_check_mode
        - nginx_static_conf.changed or nginx_static_conf_enable.changed
      command: nginx -t
      changed_when: false

    - name: site | Reload nginx config
      when:
        - not ansible_check_mode
        - nginx_static_conf.changed or nginx_static_conf_enable.changed
      systemd:
        name: nginx
        state: reloaded

  rescue:
    - name: site | Restore previous site config  # noqa: require-backup
      when: "'backup_file' in (nginx_static_conf | default({}))"
      copy:
        remote_src: true
        dest: "{{ nginx_static_conf.dest }}"
        src: "{{ nginx_static_conf.backup_file }}"
        owner: root
        group: root
        mode: "{{ nginx_static_conf.mode }}"

    - name: site | Delete failed site backup
      when: "'backup_file' in (nginx_static_conf | default({}))"
      file:
        path: "{{ nginx_static_conf.backup_file }}"
        state: absent

    - name: site | Remove newly added site files
      when:
        - nginx_static_conf.changed | default(false)
        - "'backup_file' not in (nginx_static_conf | default({}))"
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/nginx/sites-enabled/{{ nginx_site_args.subdomain }}
        - /etc/nginx/sites-available/{{ nginx_site_args.subdomain }}

    - name: site | Fail after rolling back the site write
      fail:
        msg: >-
          nginx -t failed after writing
          /etc/nginx/sites-available/{{ nginx_site_args.subdomain }}; previous
          state restored. Inspect the validate output above and the managed content.
