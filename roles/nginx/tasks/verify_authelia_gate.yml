# `nginx_verify_authelia_gate_args` contract:
#   subdomain  required vhost subdomain
#   require_rd optional bool, default true
- name: verify_authelia_gate | Map the vhost FQDN to loopback
  import_tasks: test_loopback_hosts.yml
  vars:
    nginx_test_loopback_hosts_args:
      hostnames:
        - "{{ nginx_verify_authelia_gate_args.subdomain }}.{{ inventory_hostname }}.{{ domain }}"
  tags:
    - nginx

- name: verify_authelia_gate | Verify unauthenticated redirect for {{ nginx_verify_authelia_gate_args.subdomain }}
  uri:
    url: >-
      https://{{ nginx_verify_authelia_gate_args.subdomain }}.{{ inventory_hostname }}.{{ domain }}/
    validate_certs: false
    follow_redirects: none
    status_code: 302
  register: _nginx_authelia_gate
  failed_when: >-
    _nginx_authelia_gate is not authelia_redirects_to(
      nginx_verify_authelia_gate_args.subdomain,
      inventory_hostname,
      domain,
      require_rd=(nginx_verify_authelia_gate_args.require_rd | default(true))
    )
  tags:
    - nginx
