# Lay the Debian snakeoil keypair at the letsencrypt paths nginx.conf.j2
# references, so the nginx role can validate its config and start in tests
# without a real certbot-issued cert. Test-only scaffolding (prod issues real
# certs via certbot): both the nginx role's own _setup and its shared test
# fixture call this, so the placement lives in one spot.
#
# Input: nginx_snakeoil_args.fqdn, the host FQDN whose live/<fqdn>/ dir to fill.
# A fresh check-mode pass predicts the package install without creating its
# files, so dependent placement waits for a real converge.
- name: Snakeoil | Install ssl-cert
  apt:
    pkg:
      - ssl-cert
    install_recommends: false
    cache_valid_time: 3600
  register: nginx_snakeoil_apt
  become: true

- name: Snakeoil | Ensure the letsencrypt live dir exists
  when: not (ansible_check_mode and nginx_snakeoil_apt.changed)
  file:
    path: /etc/letsencrypt/live/{{ nginx_snakeoil_args.fqdn }}
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Snakeoil | Lay down the snakeoil cert files
  when: not (ansible_check_mode and nginx_snakeoil_apt.changed)
  copy:
    src: "{{ item.src }}"
    dest: /etc/letsencrypt/live/{{ nginx_snakeoil_args.fqdn }}/{{ item.dest }}
    remote_src: true
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - src: /etc/ssl/private/ssl-cert-snakeoil.key
      dest: privkey.pem
      mode: "0640"
    - src: /etc/ssl/certs/ssl-cert-snakeoil.pem
      dest: chain.pem
      mode: "0644"
    - src: /etc/ssl/certs/ssl-cert-snakeoil.pem
      dest: fullchain.pem
      mode: "0644"
  loop_control:
    label: "{{ item.dest }}"
  become: true
