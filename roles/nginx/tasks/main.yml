- name: Install nginx package
  import_tasks: install.yml
  tags:
    - nginx

# Device admin UIs keep their own firmware login behind Authelia. UniFi is the
# exception because another login layer breaks its mobile app and API clients.
- name: Manage static nginx proxies
  vars:
    _nginx_static_proxy_sites:
      - subdomain: marantz
        proxy_pass: "https://{{ external_ips.marantz }}:10443/"
        auth: true
      - subdomain: printer
        proxy_pass: "http://{{ external_ips.printer }}:80/"
        auth: true
      - subdomain: siglent
        proxy_pass: "http://{{ external_ips.siglent }}:80/"
        auth: true
      - subdomain: ups
        proxy_pass: "https://{{ external_ips.eaton }}:443/"
        auth: true
      - subdomain: tubeszb
        proxy_pass: "http://{{ external_ips.tubeszb }}:80/"
        auth: true
      - subdomain: unifi
        proxy_pass: "https://{{ external_ips.udm }}:443/"
        csp_additional: connect-src api.mapbox.com ui.com *.ui.com {{ nginx_csp_default }}
        csp_default_src: ui.com *.ui.com
  tags:
    - nginx
  block:
    - name: Configure static nginx proxies
      when: nginx_static_proxies_enabled | bool
      include_tasks:
        file: site.yml
        apply:
          tags:
            - nginx
      vars:
        nginx_site_args: "{{ nginx_static_proxy }}"
      loop: "{{ _nginx_static_proxy_sites }}"
      loop_control:
        label: "{{ nginx_static_proxy.subdomain }}"
        loop_var: nginx_static_proxy
      tags:
        - nginx

    - name: Remove static nginx proxies from disabled hosts
      when: not (nginx_static_proxies_enabled | bool)
      file:
        path: /etc/nginx/{{ item.1 }}/{{ item.0 }}
        state: absent
      loop: >-
        {{ _nginx_static_proxy_sites | map(attribute='subdomain') | list
           | product(['sites-enabled', 'sites-available']) | list }}
      loop_control:
        label: "{{ item.0 }} ({{ item.1 }})"
      become: true
      register: nginx_static_proxy_cleanup
      tags:
        - nginx

    - name: Reload nginx after removing static proxies
      when:
        - not ansible_check_mode
        - nginx_static_proxy_cleanup.changed
      systemd:
        name: nginx
        state: reloaded
      become: true
      tags:
        - nginx
