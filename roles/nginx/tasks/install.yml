- name: install | Install nginx
  apt:
    pkg:
      - nginx
    policy_rc_d: 101
    cache_valid_time: 3600
  register: nginx_apt
  become: true
  tags:
    - nginx

- name: install | Configure nginx log compression
  import_role:
    name: logrotate
    tasks_from: compression
  vars:
    logrotate_args:
      item: /etc/logrotate.d/nginx
      condition: "{{ not (ansible_check_mode and nginx_apt.changed) }}"
  tags:
    - nginx

- name: install | Disable default site
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  register: nginx_default_conf
  become: true
  tags:
    - nginx

# nginx.conf is a complete config, so validate the rendered temporary file
# before replacing the active configuration.
- name: install | Configure nginx
  template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    owner: root
    group: root
    mode: "0644"
    backup: true
    validate: nginx -t -c %s
  become: true
  register: nginx_conf
  tags:
    - nginx

- name: install | Enable nginx service
  when: not (ansible_check_mode and nginx_apt.changed)
  systemd:
    name: nginx.service
    enabled: true
    state: >-
      {{ 'restarted' if nginx_apt.changed
         else 'reloaded'
         if nginx_default_conf.changed or nginx_conf.changed
         else 'started' }}
  become: true
  tags:
    - nginx
