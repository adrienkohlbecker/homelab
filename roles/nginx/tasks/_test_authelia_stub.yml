# Test-only stand-in for Authelia's /api/authz/auth-request endpoint. It lets
# nginx_site auth contracts run without converging the real Authelia service.
#
# Inputs: nginx_test_authelia_stub_args.mode, optional and defaulting to gate:
#   gate        admit the fixed Basic credential, otherwise return 401
#   authed      admit and return a fixed Remote-User header
- name: Test authelia stub | Configure requested mode
  vars:
    _nginx_test_authelia_stub_mode: "{{ (nginx_test_authelia_stub_args | default({})).mode | default('gate') }}"
  become: true
  block:
    # The mode-switching test stub is disposable and needs no backup history.
    - name: Test authelia stub | Install fixture for /api/authz/auth-request  # noqa: require-backup require-validate
      copy:
        dest: /etc/nginx/conf.d/test_authelia_stub.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          server {
            listen 127.0.0.1:{{ service_ports.authelia }};
            location = /api/authz/auth-request {
          {% if _nginx_test_authelia_stub_mode == 'gate' %}
              # The correct Basic credential exercises the service-account
              # path without changing the cookieless 401 gate behavior.
              if ($http_authorization = "Basic bmdpbnh2ZXJpZnk6c2VjcmV0") {
                add_header Remote-User "nginxverifyuser" always;
                return 200 'test_stub_ok';
              }
              # Match Authelia's Location response so nginx's auth_request
              # redirect returns the browser to the originally requested vhost.
              add_header Location "https://auth.{{ inventory_hostname }}.{{ domain }}/?rd=$http_x_original_url" always;
              return 401;
          {% else %}
              add_header Remote-User "nginxverifyuser" always;
              return 200 'test_stub_ok';
          {% endif %}
            }
          }
      register: nginx_test_authelia_stub_conf

    # A reload with a bad config keeps the old workers, so the probe below is
    # what proves the requested mode is live.
    - name: Test authelia stub | Reload nginx
      when: nginx_test_authelia_stub_conf.changed
      systemd:
        name: nginx
        state: reloaded

    - name: Test authelia stub | Wait for the fixture to answer
      uri:
        url: "http://127.0.0.1:{{ service_ports.authelia }}/api/authz/auth-request"
        status_code: "{{ 401 if _nginx_test_authelia_stub_mode == 'gate' else 200 }}"
      register: nginx_test_authelia_stub_ready
      until: nginx_test_authelia_stub_ready is succeeded
      retries: 10
      delay: 1
