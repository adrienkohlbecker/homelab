- name: Install openssh-server
  apt:
    pkg:
      - openssh-server
    cache_valid_time: 3600
    policy_rc_d: 101
  register: ssh_apt
  become: true
  tags:
    - ssh

# --- host-key identity persistence -----------------------------------------
# The configured Ed25519 host identity rides rpool/services so a wipe-and-
# restore rebuild can bring the host identity back and every
# known_hosts pin of this host -- operator workstations, lab root's pin the
# nightly pull authenticates against -- stays valid. Unlike ssh_root's
# keypair, converge only BACKS UP, never restores: swapping host keys
# mid-converge would invalidate the pin the play's own ssh connection was
# verified against. The rebuild runbooks restore by hand right after the
# dataset restore (Phase 5), before ansible first connects. The services role
# runs earlier and installs the shared mount validator used here.
- name: Check the services dataset mount
  command: /usr/local/bin/zfs_check_mount rpool/services /mnt/services
  register: ssh_services_mount
  changed_when: false
  failed_when: ssh_services_mount.rc != 0 and not ansible_check_mode
  check_mode: false
  become: true
  tags:
    - ssh

- name: Stat the live host identity
  when: ssh_services_mount.rc == 0
  stat:
    path: "/etc/ssh/{{ _ssh_host_private_key_file }}"
  become: true
  register: ssh_host_live_identity
  tags:
    - ssh

- name: Stat the persisted host identity
  when: ssh_services_mount.rc == 0
  stat:
    path: "/mnt/services/ssh_host_keys/{{ _ssh_host_private_key_file }}"
  become: true
  register: ssh_host_persisted_identity
  tags:
    - ssh

# A divergent persisted identity means this host was rebuilt without
# restoring its host key. Halt before the copy loop can destroy the old pin.
- name: Refuse to overwrite a divergent persisted host identity
  when:
    - ssh_services_mount.rc == 0
    - ssh_host_live_identity.stat.exists
    - ssh_host_persisted_identity.stat.exists
    - ssh_host_live_identity.stat.checksum != ssh_host_persisted_identity.stat.checksum
  fail:
    msg: >-
      /mnt/services/ssh_host_keys holds a DIFFERENT {{ _ssh_host_private_key_file }}
      identity than /etc/ssh. Either restore the persisted identity:
      sudo cp -a /mnt/services/ssh_host_keys/ssh_host_ed25519_key{,.pub}
      /etc/ssh/ && sudo systemctl restart ssh -- or adopt the new identity by
      deleting /mnt/services/ssh_host_keys, then update every known_hosts pin
      of this host.
  tags:
    - ssh

- name: Create the host-key persistence directory
  when: ssh_services_mount.rc == 0
  file:
    dest: /mnt/services/ssh_host_keys
    state: directory
    owner: root
    group: root
    mode: "0700"
  become: true
  register: ssh_host_persist_dir
  tags:
    - ssh

- name: Persist the host keys
  when:
    - ssh_services_mount.rc == 0
    - not (ansible_check_mode and ssh_host_persist_dir.changed)
  copy:
    src: "/etc/ssh/{{ item }}"
    remote_src: true
    dest: "/mnt/services/ssh_host_keys/{{ item }}"
    owner: root
    group: root
    mode: preserve
    backup: true
  loop: "{{ _ssh_host_key_files }}"
  loop_control:
    label: "{{ item }}"
  become: true
  tags:
    - ssh

- name: Remove legacy drop-ins
  file:
    path: /etc/ssh/sshd_config.d/{{ item }}
    state: absent
  loop:
    - config.conf
    - 02-noble-plus.conf
  register: ssh_sshd_legacy
  become: true
  tags:
    - ssh

- name: Remove packer bootstrap drop-in
  file:
    path: /etc/ssh/sshd_config.d/00-no-password-auth.conf
    state: absent
  become: true
  tags:
    - ssh

- name: Configure sshd
  copy:
    src: 00-hardening.conf
    dest: /etc/ssh/sshd_config.d/00-hardening.conf
    owner: root
    group: root
    mode: "0644"
    backup: true
    # Parse the staged file before it lands, catching a syntax error in the
    # drop-in on write. This validates the drop-in in isolation; the merged
    # Include-chain check is the separate `sshd -t` task below.
    validate: sshd -t -f %s
  when: not (ansible_check_mode and ssh_apt.changed)
  register: ssh_sshd_config
  become: true
  tags:
    - ssh

# X11 forwarding drop-in: deployed only on hosts with ssh_x11_forwarding: true
# (today: lab). Uses a Match User block so only the operator user gets it;
# other accounts are unaffected even when they SSH into the same host.
- name: Configure sshd — X11 forwarding for {{ operator_user }}
  template:
    src: 10-x11-forwarding.conf.j2
    dest: /etc/ssh/sshd_config.d/10-x11-forwarding.conf
    owner: root
    group: root
    mode: "0644"
    backup: true
    validate: sshd -t -f %s
  when:
    - ssh_x11_forwarding
    - not (ansible_check_mode and ssh_apt.changed)
  register: ssh_sshd_config_x11
  become: true
  tags:
    - ssh

- name: Remove sshd X11 forwarding drop-in
  file:
    path: /etc/ssh/sshd_config.d/10-x11-forwarding.conf
    state: absent
  when: not ssh_x11_forwarding
  register: ssh_sshd_config_x11_remove
  become: true
  tags:
    - ssh

# The drop-in declares our audited Subsystem, so comment out the stock line to
# keep ownership unambiguous and avoid duplicate directives.
- name: Comment out stock sftp Subsystem to avoid duplicate
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^([#\s]*)Subsystem(\s+)sftp(\s+)(.*)$'
    line: '# Subsystem\2sftp\3\4'
    backrefs: true
    backup: true
  register: ssh_sshd_config_sftp
  become: true
  tags:
    - ssh

# `sshd -t` (no -f) re-validates the *merged* live config: the whole Include
# chain plus the base-file Subsystem edit above. The copy's validate: only
# sees the drop-in in isolation, so it can't catch the duplicate Subsystem
# from another file. Keep both — per-file gate on write, merged-config gate
# before reload.
- name: Validate sshd config before reload
  when:
    - not (ansible_check_mode and ssh_apt.changed)
    - >-
      ssh_sshd_config.changed or ssh_sshd_config_sftp.changed or ssh_sshd_legacy.changed
      or (ssh_sshd_config_x11 is defined and ssh_sshd_config_x11 is changed)
      or (ssh_sshd_config_x11_remove is defined and ssh_sshd_config_x11_remove is changed)
  command: sshd -t
  changed_when: false
  become: true
  tags:
    - ssh

- name: Enable and reload sshd
  when: not (ansible_check_mode and ssh_apt.changed)
  systemd:
    name: ssh.service
    enabled: true
    state: >-
      {{ 'reloaded'
         if ssh_sshd_config.changed or ssh_sshd_config_sftp.changed or ssh_sshd_legacy.changed
            or (ssh_sshd_config_x11 is defined and ssh_sshd_config_x11 is changed)
            or (ssh_sshd_config_x11_remove is defined and ssh_sshd_config_x11_remove is changed)
         else 'started' }}
  become: true
  tags:
    - ssh
