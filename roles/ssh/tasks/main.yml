- name: Install openssh-server
  apt:
    pkg:
      - openssh-server
    cache_valid_time: 3600
    policy_rc_d: 101
  register: ssh_apt
  become: true
  tags:
    - ssh

# --- host-key identity persistence -----------------------------------------
# The configured Ed25519 host identity rides rpool/services so a wipe-and-
# restore rebuild can bring the host identity back and every
# known_hosts pin of this host -- operator workstations, lab root's pin the
# nightly pull authenticates against -- stays valid. Unlike zfs_autobackup's
# client keypair, converge only BACKS UP, never restores: swapping host keys
# mid-converge would invalidate the pin the play's own ssh connection was
# verified against. The rebuild runbooks restore by hand right after the
# dataset restore (Phase 5), before ansible first connects. The services role
# runs earlier and installs the shared mount validator used here.
- name: Check the services dataset mount
  command: /usr/local/bin/zfs_check_mount rpool/services /mnt/services
  register: ssh_services_mount
  changed_when: false
  failed_when: ssh_services_mount.rc != 0 and not ansible_check_mode
  check_mode: false
  become: true
  tags:
    - ssh

- name: Stat the live host identity
  when: ssh_services_mount.rc == 0
  stat:
    path: "/etc/ssh/{{ _ssh_host_private_key_file }}"
  become: true
  register: ssh_host_live_identity
  tags:
    - ssh

- name: Stat the persisted host identity
  when: ssh_services_mount.rc == 0
  stat:
    path: "/mnt/services/ssh_host_keys/{{ _ssh_host_private_key_file }}"
  become: true
  register: ssh_host_persisted_identity
  tags:
    - ssh

# A divergent persisted identity means this host was rebuilt without
# restoring its host key. Halt before the copy loop can destroy the old pin.
- name: Refuse to overwrite a divergent persisted host identity
  when:
    - ssh_services_mount.rc == 0
    - ssh_host_live_identity.stat.exists
    - ssh_host_persisted_identity.stat.exists
    - ssh_host_live_identity.stat.checksum != ssh_host_persisted_identity.stat.checksum
  fail:
    msg: >-
      /mnt/services/ssh_host_keys holds a DIFFERENT {{ _ssh_host_private_key_file }}
      identity than /etc/ssh. Either restore the persisted identity:
      sudo cp -a /mnt/services/ssh_host_keys/ssh_host_ed25519_key{,.pub}
      /etc/ssh/ && sudo systemctl restart ssh -- or adopt the new identity by
      deleting /mnt/services/ssh_host_keys, then update every known_hosts pin
      of this host.
  tags:
    - ssh

- name: Create the host-key persistence directory
  when: ssh_services_mount.rc == 0
  file:
    dest: /mnt/services/ssh_host_keys
    state: directory
    owner: root
    group: root
    mode: "0700"
  become: true
  register: ssh_host_persist_dir
  tags:
    - ssh

- name: Persist the host keys
  when:
    - ssh_services_mount.rc == 0
    - not (ansible_check_mode and ssh_host_persist_dir.changed)
  copy:
    src: "/etc/ssh/{{ item }}"
    remote_src: true
    dest: "/mnt/services/ssh_host_keys/{{ item }}"
    owner: root
    group: root
    mode: preserve
    backup: true
  loop: "{{ _ssh_host_key_files }}"
  loop_control:
    label: "{{ item }}"
  become: true
  tags:
    - ssh

- name: Configure sshd
  template:
    src: 00-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/00-hardening.conf
    owner: root
    group: root
    mode: "0644"
    backup: true
    # Parse the staged file before it lands, catching a syntax error in the
    # drop-in on write. This validates the drop-in in isolation; the merged
    # Include-chain check is the separate `sshd -t` task below.
    validate: sshd -t -f %s
  when: not (ansible_check_mode and ssh_apt.changed)
  register: ssh_sshd_config
  become: true
  tags:
    - ssh

# The role owns all SSH policy in 00-hardening.conf; keep this path absent.
# Retire this tombstone after every managed host has converged.
- name: Remove legacy sshd X11 forwarding drop-in
  file:
    path: /etc/ssh/sshd_config.d/10-x11-forwarding.conf
    state: absent
  register: ssh_sshd_config_x11_remove
  become: true
  tags:
    - ssh

# `sshd -t` (no -f) re-validates the merged live config, including every
# package and role-owned file. The template's validate sees only the staged drop-in,
# so keep this whole-chain gate before reload.
- name: Validate sshd config before reload
  when:
    - not (ansible_check_mode and ssh_apt.changed)
    - >-
      ssh_sshd_config.changed or ssh_sshd_config_x11_remove.changed
  command: sshd -t
  changed_when: false
  become: true
  tags:
    - ssh

- name: Enable and reload sshd
  when: not (ansible_check_mode and ssh_apt.changed)
  systemd:
    name: ssh.service
    enabled: true
    state: >-
      {{ 'reloaded'
         if ssh_sshd_config.changed or ssh_sshd_config_x11_remove.changed
         else 'started' }}
  become: true
  tags:
    - ssh
