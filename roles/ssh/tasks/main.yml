# --- host-key identity persistence -----------------------------------------
# The configured Ed25519 host identity rides rpool/services so a wipe-and-
# restore rebuild can bring the host identity back and every known_hosts pin
# of this host -- operator workstations, lab root's pin the nightly pull
# authenticates against -- stays valid. Those pins are trust-on-first-use, so
# a new identity breaks them. Ansible itself pins nothing (ansible.cfg
# disables host key checking), which leaves the divergence guard below as the
# only check in the converge path that notices a rebuilt host whose old key
# was not restored. Converge only BACKS UP, never restores; the rebuild
# runbooks restore by hand right after the dataset restore (Phase 5). The
# services role runs earlier and installs the shared mount validator used
# here.
- name: Check the services dataset mount
  when: zfs_root
  command: /usr/local/bin/zfs_check_mount rpool/services /mnt/services
  register: ssh_services_mount
  changed_when: false
  failed_when: ssh_services_mount.rc != 0 and not ansible_check_mode
  check_mode: false
  become: true
  tags:
    - ssh

# A host without a ZFS root has no services dataset and keeps ephemeral keys.
- name: Persist the host identity
  when: zfs_root and ssh_services_mount.rc == 0
  become: true
  tags:
    - ssh
  block:
    - name: Stat the live host identity
      stat:
        path: /etc/ssh/ssh_host_ed25519_key
      register: ssh_host_live_identity

    - name: Stat the persisted host identity
      stat:
        path: /mnt/services/ssh_host_keys/ssh_host_ed25519_key
      register: ssh_host_persisted_identity

    # A divergent persisted identity means this host was rebuilt without
    # restoring its host key. Halt before the copy loop can destroy the old pin.
    - name: Refuse to overwrite a divergent persisted host identity
      when:
        - ssh_host_live_identity.stat.exists
        - ssh_host_persisted_identity.stat.exists
        - ssh_host_live_identity.stat.checksum != ssh_host_persisted_identity.stat.checksum
      fail:
        msg: >-
          /mnt/services/ssh_host_keys holds a DIFFERENT ssh_host_ed25519_key
          identity than /etc/ssh. Either restore the persisted identity:
          sudo cp -a /mnt/services/ssh_host_keys/ssh_host_ed25519_key{,.pub}
          /etc/ssh/ && sudo systemctl restart ssh -- or adopt the new identity by
          deleting /mnt/services/ssh_host_keys, then update every known_hosts pin
          of this host.

    - name: Create the host-key persistence directory
      file:
        dest: /mnt/services/ssh_host_keys
        state: directory
        owner: root
        group: root
        mode: "0700"
      register: ssh_host_persist_dir

    # Keep aligned with the sole HostKey directive in templates/00-hardening.conf.j2.
    - name: Persist the host keys
      when: not (ansible_check_mode and ssh_host_persist_dir.changed)
      copy:
        src: "/etc/ssh/{{ item }}"
        remote_src: true
        dest: "/mnt/services/ssh_host_keys/{{ item }}"
        owner: root
        group: root
        mode: preserve
        backup: true
      loop:
        - ssh_host_ed25519_key
        - ssh_host_ed25519_key.pub

# Starting ssh.service recreates /run/sshd, its RuntimeDirectory, which the
# template's `sshd -t` needs. A package upgrade stops ssh.service behind its
# still-active socket, and the reused ControlMaster never triggers the socket.
- name: Enable and start sshd
  systemd:
    name: ssh.service
    enabled: true
    state: started
  become: true
  tags:
    - ssh

- name: Configure sshd
  template:
    src: 00-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/00-hardening.conf
    owner: root
    group: root
    mode: "0644"
    backup: true
    # Rejects a drop-in that fails to parse before it lands. The merged
    # Include chain is checked by the unit's reload below.
    validate: sshd -t -f %s
  register: ssh_sshd_config
  become: true
  tags:
    - ssh

# Ubuntu's ExecReload runs `sshd -t` over the merged config before it sends
# SIGHUP, so a config that fails as a whole never reaches the running daemon.
- name: Reload sshd
  when: ssh_sshd_config.changed
  systemd:
    name: ssh.service
    state: reloaded
  become: true
  tags:
    - ssh
