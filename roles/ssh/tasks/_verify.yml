# sshd -T (effective-config dump) exercises the whole Include chain:
# /etc/ssh/sshd_config → sshd_config.d/00-hardening.conf. Reading the
# drop-in alone would pass even if the Include were missing.

# Query both units so the check holds whether sshd runs as the long-lived
# ssh.service or the socket-activated ssh.socket + ssh@N-.service. is-active
# prints one state line per unit; passing requires at least one to be 'active'.
- name: _verify | Sshd is active  # noqa: command-instead-of-module -- is-active query, not a state change
  command: systemctl is-active ssh.socket ssh.service
  register: ssh_verify_active
  changed_when: false
  failed_when: "'active' not in ssh_verify_active.stdout_lines"
  become: true

- name: _verify | Read effective sshd config
  command: sshd -T
  changed_when: false
  become: true
  register: ssh_verify_effective

- name: _verify | Hardening directives are active
  assert:
    that:
      - ssh_verify_effective.stdout is search('(?m)^addressfamily any$')
      - ssh_verify_effective.stdout is search('(?m)^passwordauthentication no$')
      - ssh_verify_effective.stdout is search('(?m)^permitrootlogin no$')
      - ssh_verify_effective.stdout is search('(?m)^authenticationmethods publickey$')
      - ssh_verify_effective.stdout is search('(?m)^loglevel VERBOSE$')
      - ssh_verify_effective.stdout is search('(?m)^kbdinteractiveauthentication no$')
      - ssh_verify_effective.stdout is search('(?m)^streamlocalbindunlink yes$')
      - ssh_verify_effective.stdout is search('(?m)^pubkeyacceptedalgorithms ssh-ed25519,sk-ssh-ed25519@openssh.com$')
    fail_msg: >-
      sshd effective config is missing expected hardening directives —
      00-hardening.conf may not have landed, or /etc/ssh/sshd_config
      no longer Includes sshd_config.d.

- name: _verify | Subsystem sftp uses internal-sftp
  assert:
    that:
      - ssh_verify_effective.stdout is search('(?m)^subsystem\s+sftp\s+internal-sftp')
    fail_msg: >-
      sshd effective config does not show internal-sftp as the sftp
      subsystem — the drop-in's Subsystem directive may be shadowed.

- name: _verify | Only EtM MACs are enabled
  vars:
    _ssh_verify_macs: >-
      {{ ssh_verify_effective.stdout_lines
         | select('match', '^macs\s+')
         | first
         | regex_replace('^macs\s+', '') }}
  assert:
    that:
      # Every enabled MAC must be an EtM variant. Assert the invariant
      # positively (no token lacks -etm@) rather than blocklisting specific
      # non-EtM names — a blocklist passes a plain hmac-sha2-256 that simply
      # lacks the substring being excluded.
      - _ssh_verify_macs.split(',') | reject('search', '-etm@') | list | length == 0
    fail_msg: >-
      Non-EtM MACs are still present in the effective config:
      {{ _ssh_verify_macs }}

# Divergence guard: a persisted identity that differs from the live one
# (rebuilt host, restore step skipped) must HALT the converge instead of
# silently overwriting the old identity. Corrupt the persisted copy, re-run
# the role, and expect the failure; then repair.
- name: _verify | Corrupt the persisted host identity
  copy:
    dest: /mnt/services/ssh_host_keys/ssh_host_ed25519_key
    content: "not the real key\n"
    owner: root
    group: root
    mode: "0600"
  become: true

- name: _verify | Re-run the role against the divergent persisted identity
  block:
    - name: _verify | Import the role (must fail on the divergence guard)
      import_role:
        name: ssh
    - name: _verify | Unreachable when the guard fires
      set_fact:
        ssh_verify_guard_tripped: false
  rescue:
    - name: _verify | The expected divergence guard failed
      assert:
        that:
          - ansible_failed_task.name is search('Refuse to overwrite a divergent persisted host identity')
          - ansible_failed_result.msg is search('DIFFERENT ssh_host_ed25519_key identity')
        fail_msg: >-
          The nested role failed in {{ ansible_failed_task.name | default('<unknown>') }},
          not in the expected host-identity divergence guard.

    - name: _verify | Record the guard firing
      set_fact:
        ssh_verify_guard_tripped: true

  always:
    - name: _verify | Repair the persisted host identity
      copy:
        src: /etc/ssh/ssh_host_ed25519_key
        remote_src: true
        dest: /mnt/services/ssh_host_keys/ssh_host_ed25519_key
        owner: root
        group: root
        mode: preserve
      become: true

- name: _verify | The divergence guard halted the converge
  assert:
    that:
      - ssh_verify_guard_tripped
    fail_msg: >-
      re-running the role with a divergent persisted host identity did not
      fail -- a rebuilt host would silently overwrite the old identity and
      strand every known_hosts pin.
