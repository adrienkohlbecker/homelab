# Mirror the production producer so the fixture gets the real dataset
# properties, mount unit, and zfs_check_mount dependency before ssh runs.
- name: _setup | Configure the services datasets
  import_role:
    name: services

# Match the state left by a Noble openssh-server upgrade. The harness keeps its
# existing ControlMaster session alive, so ssh.socket does not restart sshd.
- name: _setup | Stop sshd behind its active socket
  systemd:
    name: ssh.service
    state: stopped
  become: true
