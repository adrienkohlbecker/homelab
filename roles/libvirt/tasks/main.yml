- name: Install virtualization tools
  apt:
    pkg:
      # qemu-kvm is a transitional metapackage in noble; resolute
      # (26.04) dropped it. qemu-system is the modern replacement (pulls
      # qemu-system-x86 / qemu-system-arm transitively via qemu-system-*).
      - "{{ 'qemu-kvm' if ansible_distribution_major_version | int < 26 else 'qemu-system' }}"
      - libvirt-clients
      - libvirt-daemon
      - libvirt-daemon-system
      # Tooling to define/edit/clone guests (virt-install, virt-xml,
      # virt-clone) on a host whose whole job is running VMs.
      - virtinst
      - ovmf
      # TPM 2.0 backend for UEFI guests that need a vTPM (e.g. Windows 11);
      # pairs with the ovmf firmware above.
      - swtpm
      - swtpm-tools
      - libhugetlbfs-bin
      - python3-libvirt
      - python3-lxml
    policy_rc_d: 101
    cache_valid_time: 3600
  become: true
  register: libvirt_apt
  tags:
    - libvirt

- name: Configure libvirtd log compression
  import_role:
    name: logrotate
    tasks_from: compression
  vars:
    logrotate_args:
      item: /etc/logrotate.d/libvirtd
      condition: "{{ not (ansible_check_mode and libvirt_apt.changed) }}"
  tags:
    - libvirt

# Ubuntu 26.04+ puts these configs in the optional Xen and LXC driver packages.
- name: Configure libvirtd.libxl log compression
  import_role:
    name: logrotate
    tasks_from: compression
  vars:
    logrotate_args:
      item: /etc/logrotate.d/libvirtd.libxl
      optional: "{{ ansible_distribution_major_version | int >= 26 }}"
      condition: "{{ not (ansible_check_mode and libvirt_apt.changed) }}"
  tags:
    - libvirt

- name: Configure libvirtd.lxc log compression
  import_role:
    name: logrotate
    tasks_from: compression
  vars:
    logrotate_args:
      item: /etc/logrotate.d/libvirtd.lxc
      optional: "{{ ansible_distribution_major_version | int >= 26 }}"
      condition: "{{ not (ansible_check_mode and libvirt_apt.changed) }}"
  tags:
    - libvirt

- name: Configure libvirtd.qemu log compression
  import_role:
    name: logrotate
    tasks_from: compression
  vars:
    logrotate_args:
      item: /etc/logrotate.d/libvirtd.qemu
      condition: "{{ not (ansible_check_mode and libvirt_apt.changed) }}"
  tags:
    - libvirt

# meta: reset_connection ignores task-level conditionals, so gate a dynamic
# include instead -- import_tasks would hoist the meta task past the `when:` at
# parse time.
- name: Reset connection if the Python libvirt bindings were installed
  when: libvirt_apt.changed
  include_tasks: reset_connection.yml  # noqa: prefer-import
  tags:
    - libvirt

- name: Create and mount libvirt dataset
  import_role:
    name: zfs_dataset
    tasks_from: dataset
  vars:
    zfs_dataset_args:
      dataset: rpool/libvirt
      mountpoint: /var/lib/libvirt/images
      owner: root
      group: root
      mode: "0711"
      extra_properties:
        # Match qemu's default qcow2 cluster size.
        recordsize: '65536'
        # Guests cache their own pages; keep them out of the host ARC.
        primarycache: metadata
        # Limit atime writes without disabling access-time accounting.
        relatime: 'on'
        # VM images and the local configuration dumps are not replicated.
        'autobackup:bak': 'false'
  tags:
    - libvirt

- name: Add current user to virtualization groups
  when: not (ansible_check_mode and libvirt_apt.changed)
  user:
    name: "{{ ansible_user_id }}"
    groups:
      - libvirt
      - kvm
    append: true
  become: true
  tags:
    - libvirt

# libvirt 10.4+ supports a native nftables firewall backend. Noble (10.0)
# lacks the driver; resolute (11.x) and any
# future release have it. The setting moves LIBVIRT_INP / LIBVIRT_FWX
# / LIBVIRT_PRT chains out of `ip filter`/`ip nat` and into
# `inet libvirt_*` tables. The service call below start-or-restarts on
# this register so libvirtd re-reads network.conf; the network-reload
# block at the end re-creates rules under the new backend.
- name: Configure libvirt to use native nftables firewall backend
  when: ansible_distribution_release != "noble"
  lineinfile:
    path: /etc/libvirt/network.conf
    regexp: '^#?\s*firewall_backend\s*='
    line: 'firewall_backend = "nftables"'
    create: true
    backup: true
    owner: root
    group: root
    mode: "0644"
  register: libvirt_firewall_backend
  become: true
  tags:
    - libvirt

- name: Enable libvirtd service
  when: not (ansible_check_mode and libvirt_apt.changed)
  # Ubuntu ships libvirtd with --timeout 120 and active sockets. Keep the
  # service enabled without force-starting an intentionally idle daemon.
  systemd:
    name: libvirtd.service
    enabled: true
    state: "{{ 'restarted' if libvirt_firewall_backend.changed | default(false) else omit }}"
  become: true
  tags:
    - libvirt

- name: Enable libvirtd socket
  when: not (ansible_check_mode and libvirt_apt.changed)
  systemd:
    name: libvirtd.socket
    enabled: true
    state: started
  register: libvirt_libvirtd_socket_started_result
  become: true
  tags:
    - libvirt

# libvirtd.service's [Install] Also= enables the read-only and admin
# sockets, but enabling doesn't start them -- without an explicit start,
# read-only clients and virt-admin only work after the next reboot.
- name: Enable libvirtd read-only socket
  when: not (ansible_check_mode and libvirt_apt.changed)
  systemd:
    name: libvirtd-ro.socket
    enabled: true
    state: started
  become: true
  tags:
    - libvirt

- name: Enable libvirtd admin socket
  when: not (ansible_check_mode and libvirt_apt.changed)
  systemd:
    name: libvirtd-admin.socket
    enabled: true
    state: started
  become: true
  tags:
    - libvirt

- name: Check the default network is defined
  when: not (ansible_check_mode and (libvirt_apt.changed or libvirt_libvirtd_socket_started_result.changed))
  command: virsh net-info default
  register: libvirt_default_net
  changed_when: false
  failed_when: false
  become: true
  tags:
    - libvirt

- name: Assert the default network exists
  when: not (libvirt_default_net is skipped)
  assert:
    that: libvirt_default_net.rc == 0
    fail_msg: >-
      libvirt's `default` network is not defined. It ships with
      libvirt-daemon-system; re-create it with
      `virsh net-define /usr/share/libvirt/networks/default.xml`
      (or restore your bridge config) before re-running.
  tags:
    - libvirt

# The check-mode gate uses the registered libvirtd socket result, which cannot
# be rebound by later systemd operations.
# The whole condition skips the network calls in check mode on a fresh
# host where libvirtd / python3-libvirt aren't really installed yet.
# virt_net's core() returns from its `state:` branch before it reaches the
# `autostart` block, so a single call carrying both silently drops the
# autostart half -- split into two calls (same reason the pool dance below
# needs three). state: active first, then autostart on a stateless call.
- name: Start default network
  when: not (ansible_check_mode and (libvirt_apt.changed or libvirt_libvirtd_socket_started_result.changed))
  community.libvirt.virt_net:
    name: default
    state: active
  become: true
  tags:
    - libvirt

- name: Autostart default network
  when: not (ansible_check_mode and (libvirt_apt.changed or libvirt_libvirtd_socket_started_result.changed))
  community.libvirt.virt_net:
    name: default
    autostart: true
  become: true
  tags:
    - libvirt

# Existing networks keep their old firewall rules until destroyed and
# started — restarting libvirtd doesn't re-install per-network rules.
# Cycle the default network so it picks up the new firewall_backend.
# ~1s connectivity blip for any guest attached; guests don't reboot.
- name: Cycle default network for firewall backend change
  when: libvirt_firewall_backend.changed | default(false) and not ansible_check_mode
  community.libvirt.virt_net:
    name: default
    state: "{{ item }}"
  loop:
    - inactive
    - active
  become: true
  tags:
    - libvirt

# Declare the default dir storage pool in the repo rather than relying on
# whatever a given host happens to have (libvirt-daemon-system ships the
# default network but not always the default pool). Three steps for the
# same module short-circuit reason as the network split above;
# `state: present` defines only when absent, so an existing pool is left
# untouched. virsh_backup's pool-dumpxml captures the definition.
- name: Declare the default storage pool
  when: not (ansible_check_mode and (libvirt_apt.changed or libvirt_libvirtd_socket_started_result.changed))
  become: true
  tags:
    - libvirt
  block:
    - name: Define the default storage pool
      community.libvirt.virt_pool:
        name: default
        state: present
        xml: |
          <pool type='dir'>
            <name>default</name>
            <target><path>/var/lib/libvirt/images</path></target>
          </pool>

    - name: Activate the default storage pool
      community.libvirt.virt_pool:
        name: default
        state: active

    - name: Autostart the default storage pool
      community.libvirt.virt_pool:
        name: default
        autostart: true

- name: Create libvirt backup executable
  copy:
    src: virsh_backup.sh
    dest: /usr/local/bin/virsh_backup
    owner: root
    group: root
    mode: "0755"
    backup: true
  become: true
  tags:
    - libvirt

- name: Schedule the virsh_backup timer
  import_role:
    name: systemd_timer
    tasks_from: install
  vars:
    systemd_timer_args:
      name: virsh_backup
      description: Daily libvirt domain backup
      on_calendar: "*-*-* 00:05:00"
      exec_start: /usr/local/bin/virsh_backup
  tags:
    - libvirt
