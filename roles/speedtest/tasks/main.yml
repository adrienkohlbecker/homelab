- name: Set up speedtest system user and group
  import_role:
    name: service_user
    tasks_from: user
  vars:
    service_user_args:
      name: speedtest
  tags:
    - speedtest

# Writable by the speedtest user: the container entrypoint sed -i's the vhost
# in place at startup (WEBPORT rewrite), and sed needs to create its temp file
# in this directory as the container's root -- which the uidmap maps to the
# speedtest user.
- name: Create speedtest apache config dir
  when: not (ansible_check_mode and speedtest_user.changed)
  file:
    path: /mnt/services/speedtest/sites_available
    state: directory
    owner: "{{ speedtest_user.uid }}"
    group: "{{ speedtest_user.group }}"
    mode: "0755"
  become: true
  tags:
    - speedtest

# Same ownership story: the entrypoint's sed -i recreates this file with
# identical content, owned by the container root (= speedtest user on the
# host). Deploying it with that ownership keeps the next converge clean.
# No validate: apache only ships inside the container image.
- name: Configure speedtest apache vhost  # noqa: require-validate
  when: not (ansible_check_mode and speedtest_user.changed)
  template:
    src: 000-default.conf.j2
    dest: /mnt/services/speedtest/sites_available/000-default.conf
    owner: "{{ speedtest_user.uid }}"
    group: "{{ speedtest_user.group }}"
    mode: "0644"
    backup: true
  register: speedtest_vhost
  become: true
  tags:
    - speedtest

- name: Install speedtest service
  import_role:
    name: systemd_unit
    tasks_from: install
  vars:
    systemd_unit_args:
      src: speedtest.service.j2
      condition: "{{ not (ansible_check_mode and speedtest_user.changed) }}"
  tags:
    - speedtest

- name: Pull speedtest image
  containers.podman.podman_image:
    name: "{{ speedtest_image }}"
  register: speedtest_image_pull
  retries: 3
  delay: 10
  until: speedtest_image_pull is not failed
  become: true
  tags:
    - speedtest

- name: Create speedtest podman network
  when: not ansible_check_mode
  containers.podman.podman_network:
    name: speedtest
    disable_dns: false
    state: present
  register: speedtest_network
  become: true
  tags:
    - speedtest

- name: Enable speedtest service
  import_role:
    name: systemd_unit
    tasks_from: service
  vars:
    systemd_unit_args:
      src: speedtest
      condition: "{{ not (ansible_check_mode and (speedtest_user.changed or speedtest_service_result.changed)) }}"
      restart: "{{ speedtest_service_result.changed or speedtest_network.changed or speedtest_vhost.changed }}"
  tags:
    - speedtest

- name: Configure nginx
  import_role:
    name: nginx
    tasks_from: site
  vars:
    nginx_site_args:
      subdomain: speedtest
      proxy_pass: http://127.0.0.1:{{ service_ports.speedtest }}/
      client_max_body_size: "0"
      proxy_buffering: "off"
      proxy_request_buffering: "off"
      auth: required
  tags:
    - speedtest
