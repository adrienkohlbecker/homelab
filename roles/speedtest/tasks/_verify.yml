# The unit's --sdnotify=healthy gates systemd active on the in-container
# healthcheck, so HTTP is already up when _verify fires. Short retry
# covers the tiny race between active transition and this task.
- name: _verify | Speedtest answers on its loopback port
  uri:
    url: http://localhost:{{ service_ports.speedtest }}/
    status_code: 200
    return_content: true
    http_agent: speedtest-verify
  register: _speedtest_loopback
  retries: 5
  delay: 1
  until:
    - _speedtest_loopback.status == 200
    - "'LibreSpeed' in _speedtest_loopback.content"
  become: true

# Upload smoke-test -- exercises the client_max_body_size "0" and
# proxy_request_buffering "off" wiring that was added to fix 413 errors
# on fast connections (fe253810f). A regression in either setting breaks
# the speed test's upload measurement. LibreSpeed's /backend/empty.php
# discards the body and returns 200.
- name: _verify | Upload endpoint accepts a POST body
  uri:
    url: http://localhost:{{ service_ports.speedtest }}/backend/empty.php
    method: POST
    body: "{{ 'x' * 65536 }}"
    status_code: 200
  become: true

- name: _verify | Wait for the normalized speedtest access record
  command:
    argv:
      - python3
      - -c
      - |
        import json
        import sys

        verified = False
        healthcheck = False
        with open(sys.argv[1], encoding="utf-8") as handle:
            for line in handle:
                try:
                    record = json.loads(line)
                except json.JSONDecodeError:
                    continue
                if record.get("service") != "speedtest":
                    continue
                fields = record.get("fields", {})
                user_agent = fields.get("user_agent", "")
                if user_agent.startswith("curl/") or '"curl/' in record.get("message", ""):
                    healthcheck = True
                if (
                    record.get("message", "").endswith('"speedtest-verify"')
                    and record.get("level") == "debug"
                    and fields.get("method") == "GET"
                    and fields.get("path") == "/"
                    and fields.get("status") == 200
                    and fields.get("user_agent") == "speedtest-verify"
                    and fields.get("parser_status") == "parsed"
                    and "speedtest_access_timestamp" not in fields
                    and "CONTAINER_TAG" not in fields
                ):
                    verified = True
        sys.exit(0 if verified and not healthcheck else 1)
      - /var/log/fluent-bit/lnav.jsonl
  register: _speedtest_lnav_record
  changed_when: false
  retries: 30
  delay: 2
  until: _speedtest_lnav_record.rc == 0
  become: true

- name: _verify | Exercise speedtest fluent-bit record contracts
  import_role:
    name: fluentbit
    tasks_from: verify_extension
  vars:
    fluentbit_verify_args:
      name: speedtest
      records:
        - MESSAGE: '192.0.2.10 - - [02/Jan/2099:03:04:05 +0000] "GET /backend/empty.php HTTP/1.1" 200 0 "-" "curl/8.14.1"'
          CONTAINER_TAG: speedtest
          SYSLOG_IDENTIFIER: speedtest
          SYSTEMD_UNIT: speedtest.service
        - MESSAGE: '[Fri Jan 02 03:04:05.678901 2099] [mpm_prefork:notice] [pid 42:tid 43] Apache/2.4 configured -- resuming normal operations'
          CONTAINER_TAG: speedtest
          SYSLOG_IDENTIFIER: speedtest
          SYSTEMD_UNIT: speedtest.service
        - MESSAGE: Setting up docker env...
          CONTAINER_TAG: speedtest
          SYSLOG_IDENTIFIER: speedtest
          SYSTEMD_UNIT: speedtest.service
        - MESSAGE: Started speedtest.
          SYSLOG_IDENTIFIER: systemd
          SYSTEMD_UNIT: speedtest.service
      expected:
        - message: '192.0.2.10 - - [02/Jan/2099:03:04:05 +0000] "GET /backend/empty.php HTTP/1.1" 200 0 "-" "curl/8.14.1"'
          level: debug
          service: speedtest
          fields.client_ip: 192.0.2.10
          fields.method: GET
          fields.path: /backend/empty.php
          fields.protocol: HTTP/1.1
          fields.status: 200
          fields.bytes_sent: "0"
          fields.referrer: "-"
          fields.user_agent: curl/8.14.1
          fields.parser_status: parsed
          _absent:
            - fields.speedtest_access_timestamp
            - fields.CONTAINER_TAG
        - message: Apache/2.4 configured -- resuming normal operations
          level: info
          fields.source: mpm_prefork
          fields.process_id: 42
          fields.thread_id: 43
          fields.parser_status: parsed
          _absent:
            - fields.speedtest_error_timestamp
        - message: Setting up docker env...
          service: speedtest
          _absent:
            - fields.parser_status
            - fields.source
        - message: Started speedtest.
          service: systemd
          _absent:
            - fields.parser_status
            - fields.source

# Map the vhost FQDN to loopback so the SNI matches the server_name --
# keeps SNI correct on every release. Test-only mutation; box is torn down.
- name: _verify | Map the speedtest vhost FQDN to loopback for SNI-correct probing
  lineinfile:
    path: /etc/hosts
    line: "127.0.0.1 speedtest.{{ inventory_hostname }}.{{ domain }}"
    state: present
  become: true

- name: _verify | Unauthenticated hit redirects to Authelia
  uri:
    url: https://speedtest.{{ inventory_hostname }}.{{ domain }}/
    validate_certs: false
    follow_redirects: none
    status_code: 302
  register: speedtest_verify_nginx_gate
  retries: 10
  delay: 1
  until: speedtest_verify_nginx_gate.status == 302
  failed_when: speedtest_verify_nginx_gate is not authelia_redirects_to('speedtest', inventory_hostname, domain, require_rd=false)
  become: true
