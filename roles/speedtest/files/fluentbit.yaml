parsers:
  - name: speedtest_apache_access
    format: regex
    regex: '/^(?<speedtest_client_ip>\S+) \S+ \S+ \[(?<speedtest_access_timestamp>[^]]+)\] "(?<speedtest_method>\S+) (?<speedtest_path>\S+) (?<speedtest_protocol>[^"]+)" (?<speedtest_status>[0-9]{3}) (?<speedtest_bytes>[0-9]+|-) "(?<speedtest_referrer>[^"]*)" "(?<speedtest_user_agent>[^"]*)"$/'
    types: speedtest_status:integer
  - name: speedtest_apache_error
    format: regex
    regex: '/^\[(?<speedtest_error_timestamp>[^]]+)\] \[(?<speedtest_error_source>[^]:]+):(?<speedtest_error_level>[^]]+)\] \[pid (?<speedtest_process_id>[0-9]+):tid (?<speedtest_thread_id>[0-9]+)\] (?<speedtest_error_message>.*)$/m'
    types: speedtest_process_id:integer speedtest_thread_id:integer

pipeline:
  filters:
    - name: modify
      match: svc.speedtest.service
      condition: key_exists CONTAINER_TAG
      rename: MESSAGE log
    # The in-container healthcheck accounts for almost all retained output.
    # Keep its raw records in journald, but omit only successful loopback root
    # probes from the operator aggregate; failures and other curl requests stay.
    - name: grep
      match: svc.speedtest.service
      logical_op: and
      exclude:
        - 'CONTAINER_TAG ^speedtest$'
        - 'log ^(127\.0\.0\.1|::1) - - \[[^]]+\] "(HEAD|GET) / HTTP/1\.1" 200 [0-9]+ "-" "curl/'
    - name: parser
      match: svc.speedtest.service
      key_name: log
      parser: speedtest_apache_access
      reserve_data: true
      preserve_key: true
    - name: parser
      match: svc.speedtest.service
      key_name: log
      parser: speedtest_apache_error
      reserve_data: true
      preserve_key: true
    - name: modify
      match: svc.speedtest.service
      condition:
        - key_exists CONTAINER_TAG
        - key_exists speedtest_method
        - key_exists speedtest_status
      hard_rename:
        - speedtest_client_ip client_ip
        - speedtest_method method
        - speedtest_path path
        - speedtest_protocol protocol
        - speedtest_status status
        - speedtest_bytes bytes_sent
        - speedtest_referrer referrer
        - speedtest_user_agent user_agent
      remove: speedtest_access_timestamp
      set: parser_status parsed
    - name: modify
      match: svc.speedtest.service
      condition:
        - key_exists CONTAINER_TAG
        - key_exists speedtest_error_message
        - key_exists speedtest_error_level
      hard_rename:
        - speedtest_error_message log
        - speedtest_error_level _level
        - speedtest_error_source source
        - speedtest_process_id process_id
        - speedtest_thread_id thread_id
      remove: speedtest_error_timestamp
      set: parser_status parsed
