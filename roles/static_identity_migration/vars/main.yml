    - name: homepage
      uid: "{{ static_service_ids.homepage }}"
      gid: "{{ static_service_ids.homepage }}"
      old_uids: [ 967 ]
      old_gids: [ 964 ]
      paths: [ /mnt/services/homepage ]
    - name: influxdb
      uid: "{{ static_service_ids.influxdb }}"
      gid: "{{ static_service_ids.influxdb }}"
      old_uids: [ 995 ]
      old_gids: [ 994 ]
      paths: [ /mnt/services/influxdb ]
    - name: jellyfin
      uid: "{{ static_service_ids.jellyfin }}"
      gid: "{{ static_service_ids.jellyfin }}"
