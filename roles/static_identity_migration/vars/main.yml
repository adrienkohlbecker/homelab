      paths: [ /mnt/services/mosquitto, /mnt/services/sqlite/mosquitto ]
    - name: nexus
      uid: "{{ static_service_ids.nexus }}"
      gid: "{{ static_service_ids.nexus }}"
      old_uids: [ 968 ]
      old_gids: [ 966 ]
      paths: [ /mnt/services/nexus ]
    - name: openobserve
      uid: "{{ legacy_service_ids.openobserve }}"
      gid: "{{ legacy_service_ids.openobserve }}"
