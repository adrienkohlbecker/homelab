    - name: seerr
      uid: "{{ static_service_ids.seerr }}"
      gid: "{{ static_service_ids.seerr }}"
      old_uids: [ 961 ]
      old_gids: [ 957 ]
      paths: [ /mnt/services/seerr, /mnt/services/sqlite/seerr ]
    - name: sonarr
      uid: "{{ static_service_ids.sonarr }}"
      gid: "{{ static_service_ids.sonarr }}"
      old_uids: [ 992 ]
      old_gids: [ 990 ]
      paths: [ /mnt/services/sonarr, /mnt/services/sqlite/sonarr ]
    - name: speedtest
      uid: "{{ static_service_ids.speedtest }}"
      gid: "{{ static_service_ids.speedtest }}"
