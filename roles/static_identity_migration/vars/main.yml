      paths: [ /mnt/services/tautulli, /mnt/services/sqlite/tautulli ]
    - name: transmission
      uid: "{{ static_service_ids.transmission }}"
      gid: "{{ static_service_ids.transmission }}"
      old_uids: [ 985 ]
      old_gids: [ 983 ]
      paths: [ /mnt/services/transmission ]
    - name: wolweb
      uid: "{{ static_service_ids.wolweb }}"
      gid: "{{ static_service_ids.wolweb }}"
      old_uids: [ 993, 997 ]
      old_gids: [ 982, 984 ]
      paths: [ /mnt/services/wolweb ]
    - name: z2m
      uid: "{{ static_service_ids.z2m }}"
      gid: "{{ static_service_ids.z2m }}"
      old_uids: [ 974 ]
      old_gids: [ 972 ]
      paths: [ /mnt/services/z2m ]
    - name: zfs_autobackup
      uid: "{{ static_service_ids.zfs_autobackup }}"
      gid: "{{ static_service_ids.zfs_autobackup }}"
      old_uids: [ 997, 999 ]
      old_gids: [ 986, 987, 989, 999 ]
      paths: [ /var/lib/zfs_autobackup ]

  # Cross-service trees need explicit semantic mappings. In particular,
  # /mnt/media/Lidarr still contains an older lidarr uid 990 even though the
  # final Jammy passwd database later assigned 990 to authelia.
  paths:
    - path: /mnt/services
      gid_map:
        991: "{{ static_group_ids.media }}"
    - path: /mnt/services/sqlite
      gid_map:
        991: "{{ static_group_ids.media }}"
    - path: /mnt/scratch
      uid_map:
        958: "{{ static_service_ids.gitlab_runner }}"
        964: "{{ legacy_service_ids.github_runner }}"
        968: "{{ static_service_ids.nexus }}"
        985: "{{ static_service_ids.transmission }}"
        988: "{{ static_service_ids.plex }}"
        993: "{{ static_service_ids.sabnzbd }}"
        994: "{{ static_service_ids.jellyfin }}"
      gid_map:
        956: "{{ static_group_ids.homelab_ci }}"
        966: "{{ static_service_ids.nexus }}"
        991: "{{ static_group_ids.media }}"
        993: "{{ static_service_ids.jellyfin }}"
    - path: /mnt/media
      uid_map:
        973: "{{ static_service_ids.bazarr }}"
        985: "{{ static_service_ids.transmission }}"
        990: "{{ static_service_ids.lidarr }}"
        991: "{{ static_service_ids.radarr }}"
        992: "{{ static_service_ids.sonarr }}"
        993: "{{ static_service_ids.sabnzbd }}"
        994: "{{ static_service_ids.jellyfin }}"
      gid_map:
        985: "{{ static_group_ids.media }}"
        991: "{{ static_group_ids.media }}"
        993: "{{ static_service_ids.jellyfin }}"
    - path: /mnt/data/Software/Unreal Tournament 2004 PC multiplayer + SP ^^nosTEAM^^
      gid_map:
        1006: "{{ static_human_ids.operator }}"
