    - name: headscale
      uid: "{{ static_service_ids.headscale }}"
      gid: "{{ static_service_ids.headscale }}"
      old_uids: []
      old_gids: []
      paths: [ /mnt/services/headscale, /mnt/services/sqlite/headscale ]
    - name: healthchecks
      uid: "{{ legacy_service_ids.healthchecks }}"
      gid: "{{ legacy_service_ids.healthchecks }}"
      old_uids: [ 978 ]
      old_gids: [ 976 ]
      paths: [ /mnt/services/healthchecks, /mnt/services/sqlite/healthchecks ]
    - name: homeassistant
      uid: "{{ static_service_ids.homeassistant }}"
      gid: "{{ static_service_ids.homeassistant }}"
      old_uids: [ 983 ]
      old_gids: [ 981 ]
