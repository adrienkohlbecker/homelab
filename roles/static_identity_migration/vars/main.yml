---
# Jammy ownership is scoped by service path because several numbers were later
# reused by different Noble accounts. The migration script also adds the
# current passwd/group IDs for each named identity before changing any account.
static_identity_migration_config:
  required_mounts: "{{ static_identity_migration_required_mounts }}"
  identities:
    - name: adguard
      uid: "{{ static_service_ids.adguard }}"
      gid: "{{ static_service_ids.adguard }}"
      old_uids: [ 960 ]
      old_gids: [ 955 ]
      paths: [ /mnt/services/adguard ]
    - name: authelia
      uid: "{{ static_service_ids.authelia }}"
      gid: "{{ static_service_ids.authelia }}"
      old_uids: [ 990 ]
      old_gids: [ 988 ]
      paths: [ /mnt/services/authelia, /mnt/services/sqlite/authelia ]
    - name: bazarr
      uid: "{{ static_service_ids.bazarr }}"
      gid: "{{ static_service_ids.bazarr }}"
      old_uids: [ 973 ]
      old_gids: []
      paths: [ /mnt/services/bazarr, /mnt/services/sqlite/bazarr ]
    - name: compta
      uid: "{{ legacy_service_ids.compta }}"
      gid: "{{ legacy_service_ids.compta }}"
      old_uids: [ 982 ]
      old_gids: [ 980 ]
      paths: [ /mnt/services/compta ]
    - name: csplogger
      uid: "{{ legacy_service_ids.csplogger }}"
      gid: "{{ legacy_service_ids.csplogger }}"
      old_uids: [ 987 ]
      old_gids: [ 985 ]
      paths: [ /mnt/services/csplogger ]
    - name: eaton-ipp
      uid: "{{ legacy_service_ids['eaton-ipp'] }}"
      gid: "{{ legacy_service_ids['eaton-ipp'] }}"
      old_uids: [ 972 ]
      old_gids: [ 970 ]
      paths: [ /mnt/services/eaton_ipp ]
    - name: git
      uid: "{{ static_service_ids.git }}"
      gid: "{{ static_service_ids.git }}"
      old_uids: [ 984 ]
      old_gids: [ 982 ]
      paths: [ /mnt/services/gitea, /mnt/services/sqlite/gitea, /home/git ]
    - name: github_runner
      uid: "{{ legacy_service_ids.github_runner }}"
      gid: "{{ legacy_service_ids.github_runner }}"
      old_uids: [ 964 ]
      old_gids: [ 961 ]
      paths: [ /mnt/services/github_runner, /mnt/scratch/homelab_ci ]
    - name: gitlab_runner
      uid: "{{ static_service_ids.gitlab_runner }}"
      gid: "{{ static_service_ids.gitlab_runner }}"
