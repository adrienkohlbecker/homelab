    - name: radarr
      uid: "{{ static_service_ids.radarr }}"
      gid: "{{ static_service_ids.radarr }}"
      old_uids: [ 991 ]
      old_gids: [ 989 ]
      paths: [ /mnt/services/radarr, /mnt/services/sqlite/radarr ]
    - name: sabnzbd
      uid: "{{ static_service_ids.sabnzbd }}"
      gid: "{{ static_service_ids.sabnzbd }}"
      old_uids: [ 993 ]
      old_gids: []
