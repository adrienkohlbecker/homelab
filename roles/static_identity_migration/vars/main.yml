      paths: [ /mnt/services/pihole ]
    - name: plex
      uid: "{{ static_service_ids.plex }}"
      gid: "{{ static_service_ids.plex }}"
      old_uids: [ 988 ]
      old_gids: [ 986 ]
      paths: [ /mnt/services/plex, /mnt/services/sqlite/plex ]
    - name: profilarr
      uid: "{{ static_service_ids.profilarr }}"
      gid: "{{ static_service_ids.profilarr }}"
      old_uids: [ 970 ]
