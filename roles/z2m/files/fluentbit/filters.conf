# Preserve_Key retains malformed JSON for the normalizer to flag without
# sacrificing the raw message. Records without CONTAINER_TAG are systemd or
# podman lifecycle output and pass through normalize_z2m unchanged.
[FILTER]
    Name          parser
    Match         svc.z2m.service
    Key_Name      log
    Parser        z2m_json
    Reserve_Data  On
    Preserve_Key  On

[FILTER]
    Name    lua
    Match   svc.z2m.service
    script  /etc/fluent-bit/z2m_normalize.lua
    call    normalize_z2m
