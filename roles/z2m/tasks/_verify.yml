# SNI follows the URL host, not the Host header, so probing https://localhost/
# with a Host: override trips TLSV1_UNRECOGNIZED_NAME on openssl 3.x. Map the
# vhost FQDN to loopback and probe it directly so SNI and Host both carry z2m's
# server_name.
- name: _verify | Map the z2m vhost to loopback for SNI-correct probing
  lineinfile:
    path: /etc/hosts
    line: "127.0.0.1 z2m.{{ inventory_hostname }}.{{ domain }}"
    state: present
  become: true

# The vhost has `auth: true`, so the browser path goes through Authelia.
# A cookieless GET must redirect to the portal -- the only probe that fails if
# `auth: true` is dropped from nginx_site_args. The returnUrl (rd=) echoing
# z2m's own URL proves the request routed to z2m's server_name, not the default
# vhost.
- name: _verify | Z2M UI gate redirects unauthenticated requests to Authelia
  uri:
    url: https://z2m.{{ inventory_hostname }}.{{ domain }}/
    validate_certs: false
    follow_redirects: none
    status_code: 302
  register: z2m_verify_gate
  failed_when: z2m_verify_gate is not authelia_redirects_to('z2m', inventory_hostname, domain)

# The WindFront UI loads device images from zigbee2mqtt.io and device docs from
# raw.githubusercontent.com; assert csp_additional widened img-src/connect-src
# (emitted even on the 302 via add_header ... always) so a CSP regression here
# surfaces instead of silently breaking those panels in the browser.
- name: _verify | Z2M CSP allows zigbee2mqtt.io images and GitHub docs
  vars:
    z2m_csp: "{{ z2m_verify_gate.content_security_policy | default('') }}"
  assert:
    that:
      - "'img-src https://www.zigbee2mqtt.io' in z2m_csp"
      - "'connect-src https://raw.githubusercontent.com' in z2m_csp"
    fail_msg: "z2m CSP header missing widened img-src/connect-src: {{ z2m_csp }}"

- name: _verify | Exercise z2m fluent-bit record contracts
  import_role:
    name: fluentbit
    tasks_from: verify_extension
  vars:
    fluentbit_verify_args:
      name: z2m
      records:
        - MESSAGE: '{"level":"WARNING","message":"z2m:mqtt: z2m-valid","timestamp":"2099-01-02T03:04:05Z","stack":"trace","parser_status":"forged","service":"attribute"}'
          CONTAINER_TAG: z2m
          SYSLOG_IDENTIFIER: conmon
          SYSTEMD_UNIT: z2m.service
        - MESSAGE: z2m-raw
          CONTAINER_TAG: z2m
          SYSLOG_IDENTIFIER: conmon
          SYSTEMD_UNIT: z2m.service
      expected:
        - message: z2m-valid
          level: warn
          service: z2m
          fields.namespace: z2m:mqtt
          fields.exception: trace
          fields.service: attribute
        - message: z2m-raw
          service: z2m
