- name: _setup | Install podman
  import_role:
    name: podman
    tasks_from: install

- name: _setup | Install fluent-bit for container-log normalization
  import_role:
    name: fluentbit
    tasks_from: configure

- name: _setup | Install nginx
  import_role:
    name: nginx
    tasks_from: test_fixture
  vars:
    nginx_test_fixture_args:
      authelia_mode: gate

- name: _setup | Create the services dataset mountpoint
  file:
    path: /mnt/services
    state: directory
    mode: "0755"
  become: true
