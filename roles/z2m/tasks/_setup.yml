- name: _setup | Install podman
  import_role:
    name: podman
    tasks_from: install

- name: _setup | Install fluent-bit for container-log normalization
  import_role:
    name: fluentbit

- name: _setup | Install nginx
  import_role:
    name: nginx
    tasks_from: test_fixture

- name: _setup | Install authelia stub in gate mode for auth-enabled tests
  import_role:
    name: nginx
    tasks_from: test_authelia_stub

- name: _setup | Create the services dataset mountpoint
  file:
    path: /mnt/services
    state: directory
    mode: "0755"
  become: true
