# Purge unwanted packages and leftover snap data from vanilla Ubuntu images.
# Packer-built ZFS hosts start clean, so the same tasks converge as no-ops there.

# Prevent later package installs from silently pulling snapd back in.
# Apt has no single-file preferences parser, so this static policy is exempt
# from pre-write validation.
- name: Pin snapd against reinstallation  # noqa: require-validate
  copy:
    content: |
      Package: snapd
      Pin: release a=*
      Pin-Priority: -10
    dest: /etc/apt/preferences.d/nosnap.pref
    owner: root
    group: root
    mode: "0644"
    backup: true
  become: true
  tags:
    - cleanup

# Cloud-init stays on hosts where it owns bootstrap and networking; it is an
# unwanted baseline package everywhere else. snapd/fwupd/os-prober are always
# unwanted.
- name: Uninstall unneeded packages
  apt:
    name: "{{ ['snapd', 'fwupd', 'os-prober'] + (['cloud-init'] if not cloud_init_managed else []) }}"
    state: absent
    autoremove: true
    purge: true
    autoclean: true
  become: true
  tags:
    - cleanup

# thermald's D-Bus policy grants optional access to Debian's `power` group,
# which Ubuntu does not create. Keep it empty so access remains root-only while
# dbus-daemon can resolve the policy group without warning.
- name: Create power group (silence thermald dbus policy warning)
  group:
    name: power
    system: true
    state: present
  become: true
  tags:
    - cleanup

# Apt purge leaves untracked snap runtime data; debootstrap hosts have none.
- name: Remove snap data roots
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /var/snap
    - /var/lib/snapd
    - /var/cache/snapd
    - /root/snap
  become: true
  tags:
    - cleanup

# Keep one week of local Ansible backups; ZFS snapshots or the repository
# provide deeper recovery on every managed host.
- name: Install the ansible-backup prune script
  copy:
    src: prune_ansible_backups
    dest: /usr/local/sbin/prune_ansible_backups
    owner: root
    group: root
    mode: "0755"
    backup: true
    validate: bash -n %s
  become: true
  tags:
    - cleanup

- name: Schedule the ansible-backup prune timer
  import_role:
    name: systemd_timer
    tasks_from: install
  vars:
    systemd_timer_args:
      name: prune_ansible_backups
      description: Prune ansible config backups older than a week
      # 00:07, in the compact early small-job cluster (~25s run) -- finished well
      # before zfs_autosnapshot at 02:00.
      on_calendar: "*-*-* 00:07:00"
      exec_start: /usr/local/sbin/prune_ansible_backups
  tags:
    - cleanup
