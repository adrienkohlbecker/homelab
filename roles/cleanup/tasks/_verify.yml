# Apt and file modules own package and data-root absence. Verify the residual
# systemd and mount state they cannot guarantee, then exercise backup pruning.

- name: _verify | Assert no snap runtime residue
  shell: |
    set -euo pipefail
    [ "$(systemctl show snapd.socket --property=LoadState --value)" = not-found ]
    units=$(find /usr/lib/systemd/system /etc/systemd/system -name "snapd*" -print -quit)
    [ -z "$units" ]
    rc=0
    findmnt --first-only --noheadings --types squashfs >/dev/null || rc=$?
    [ "$rc" -eq 1 ]
  args:
    executable: /bin/bash
  changed_when: false

- name: _verify | Exercise filename-time pruning
  shell: |
    set -euo pipefail
    fixture=$(mktemp -d)
    mount_source=$(mktemp -d)
    cleanup() {
      if mountpoint -q "$fixture/readonly_view"; then
        umount "$fixture/readonly_view"
      fi
      rm -rf -- "$fixture" "$mount_source"
    }
    trap cleanup EXIT
    fresh={{ ansible_date_time.date }}@{{ ansible_date_time.time }}
    touch "$fixture/old.111.2020-01-01@00:00:00~"
    touch "$fixture/fresh.222.$fresh~"
    touch "$fixture/editor~"
    mkdir -p "$fixture/readonly_view" "$fixture/getmail"
    touch "$mount_source/old.333.2020-01-01@00:00:00~"
    touch "$fixture/getmail/old.444.2020-01-01@00:00:00~"
    mount --bind "$mount_source" "$fixture/readonly_view"
    mount -o remount,bind,ro "$fixture/readonly_view"
    /usr/local/sbin/prune_ansible_backups "$fixture"
    [ ! -e "$fixture/old.111.2020-01-01@00:00:00~" ]
    [ -e "$fixture/fresh.222.$fresh~" ]
    [ -e "$fixture/editor~" ]
    [ -e "$fixture/readonly_view/old.333.2020-01-01@00:00:00~" ]
    [ -e "$mount_source/old.333.2020-01-01@00:00:00~" ]
    [ ! -e "$fixture/getmail/old.444.2020-01-01@00:00:00~" ]
  args:
    executable: /bin/bash
  become: true
  changed_when: false

- name: _verify | Re-run production cleanup while preserving cloud-init
  import_role:
    name: cleanup
    tasks_from: main
  vars:
    cloud_init_managed: true  # noqa: var-naming[no-role-prefix]
