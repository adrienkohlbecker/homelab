# Apt and file modules own package and data-root absence. Verify the residual
# systemd and mount state they cannot guarantee, then exercise backup pruning.

- name: _verify | Assert no snap runtime residue
  shell: |
    set -euo pipefail
    [ "$(systemctl show snapd.socket --property=LoadState --value)" = not-found ]
    units=$(find /usr/lib/systemd/system /etc/systemd/system -name "snapd*" -print -quit)
    [ -z "$units" ]
    rc=0
    findmnt --first-only --noheadings --types squashfs >/dev/null || rc=$?
    [ "$rc" -eq 1 ]
  args:
    executable: /bin/bash
  changed_when: false

- name: _verify | Exercise filename-time pruning
  shell: |
    set -euo pipefail
    fixture=$(mktemp -d)
    trap "rm -rf -- \"$fixture\"" EXIT
    fresh={{ ansible_date_time.date }}@{{ ansible_date_time.time }}
    touch "$fixture/old.111.2020-01-01@00:00:00~"
    touch "$fixture/fresh.222.$fresh~"
    touch "$fixture/editor~"
    /usr/local/sbin/prune_ansible_backups "$fixture"
    [ ! -e "$fixture/old.111.2020-01-01@00:00:00~" ]
    [ -e "$fixture/fresh.222.$fresh~" ]
    [ -e "$fixture/editor~" ]
  args:
    executable: /bin/bash
  changed_when: false
