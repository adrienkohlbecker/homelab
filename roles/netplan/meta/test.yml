# Removes /etc/netplan/50-cloud-init.yaml and installer-generated configs,
# which only exist on the vanilla cloud image (minimal). Box starts with
# a clean netplan state from packer. Resolute exercises Netplan 1.2 transaction
# rollback and DNS recovery after SSH returns.
machines:
  box:
  minimal:
ubuntu:
  - resolute
skip:
  "minimal:resolute": >-
    Box covers Resolute rollback and DNS recovery; Minimal covers origin removal
    on Noble.
