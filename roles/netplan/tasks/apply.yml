# Shared by converge and the destructive rejection test. Netplan owns the
# candidate snapshot and restores it unless the transaction is confirmed.

- name: Create a netplan D-Bus configuration transaction
  command:
    argv:
      - busctl
      - call
      - io.netplan.Netplan
      - /io/netplan/Netplan
      - io.netplan.Netplan
      - Config
  register: netplan_dbus_config
  changed_when: false

- name: Resolve the netplan D-Bus transaction path
  set_fact:
    netplan_dbus_path: >-
      {{ netplan_dbus_config.stdout
         | regex_search('/io/netplan/Netplan/config/[A-Za-z0-9]+') }}
  changed_when: false

- name: Assert the netplan D-Bus transaction was created
  assert:
    that:
      - netplan_dbus_path is string
      - netplan_dbus_path | length > 0
    fail_msg: "Netplan did not return a D-Bus configuration object"

- name: Stage the complete netplan transaction
  block:
    - name: Clear the Ansible-managed origin in the netplan transaction
      when: netplan_replace_managed_config
      command:
        argv:
          - busctl
          - call
          - io.netplan.Netplan
          - "{{ netplan_dbus_path }}"
          - io.netplan.Netplan.Config
          - Set
          - ss
          - network=null
          - 01-netcfg
      register: netplan_clear_managed_result
      changed_when: true
      failed_when: >-
        netplan_clear_managed_result.rc != 0
        or netplan_clear_managed_result.stdout | trim != 'b true'

    - name: Remove the installer origin from the netplan transaction
      when: netplan_remove_installer_config
      command:
        argv:
          - busctl
          - call
          - io.netplan.Netplan
          - "{{ netplan_dbus_path }}"
          - io.netplan.Netplan.Config
          - Set
          - ss
          - network=null
          - 00-installer-config
      register: netplan_remove_installer_result
      changed_when: true
      failed_when: >-
        netplan_remove_installer_result.rc != 0
        or netplan_remove_installer_result.stdout | trim != 'b true'

    - name: Remove the cloud-init origin from the netplan transaction
      when: netplan_remove_cloud_init_config
      command:
        argv:
          - busctl
          - call
          - io.netplan.Netplan
          - "{{ netplan_dbus_path }}"
          - io.netplan.Netplan.Config
          - Set
          - ss
          - network=null
          - 50-cloud-init
      register: netplan_remove_cloud_init_result
      changed_when: true
      failed_when: >-
        netplan_remove_cloud_init_result.rc != 0
        or netplan_remove_cloud_init_result.stdout | trim != 'b true'

    - name: Stage the Ansible-managed netplan origin
      command:
        argv:
          - busctl
          - call
          - io.netplan.Netplan
          - "{{ netplan_dbus_path }}"
          - io.netplan.Netplan.Config
          - Set
          - ss
          - >-
            network={{ {'version': 2} | combine(netplan_apply_config) | to_json }}
          - 01-netcfg
      register: netplan_stage_config_result
      changed_when: true
      failed_when: >-
        netplan_stage_config_result.rc != 0
        or netplan_stage_config_result.stdout | trim != 'b true'

  rescue:
    - name: Cancel the incomplete netplan transaction
      command:
        argv:
          - busctl
          - call
          - io.netplan.Netplan
          - "{{ netplan_dbus_path }}"
          - io.netplan.Netplan.Config
          - Cancel
      changed_when: false
      failed_when: false

    - name: Report the netplan staging failure
      fail:
        msg: "Failed to stage the netplan D-Bus transaction"

- name: Start the 90-second netplan trial
  # Detach so a severed SSH connection cannot strand the controller inside
  # the D-Bus call; Netplan automatically rejects an unconfirmed trial.
  command:
    argv:
      - busctl
      - call
      - io.netplan.Netplan
      - "{{ netplan_dbus_path }}"
      - io.netplan.Netplan.Config
      - Try
      - u
      - "90"
  async: 30
  poll: 0
  register: netplan_try_async
  changed_when: true

- name: Drop the multiplexed SSH master so the canary forces a fresh handshake
  # ControlPersist could make the canary pass over a stale connection while a
  # fresh TCP/SSH handshake still fails.
  meta: reset_connection

- name: Wait for SSH to re-establish during the netplan trial
  # Fail before the trial deadline so Ansible cannot mistake an automatically
  # restored connection for successful application of the candidate.
  wait_for_connection:
    delay: 5
    timeout: 60

- name: Confirm the netplan trial started successfully
  # SSH may survive a rejected candidate, so reap the detached call before
  # confirming the transaction.
  async_status:
    jid: "{{ netplan_try_async.ansible_job_id }}"
  register: netplan_try_result
  until: netplan_try_result.finished
  retries: 5
  delay: 3

- name: Assert the netplan trial is awaiting confirmation
  assert:
    that:
      - netplan_try_result.stdout | trim == 'b true'
    fail_msg: "Netplan did not enter the trial state"

- name: Confirm the netplan transaction
  command:
    argv:
      - busctl
      - call
      - io.netplan.Netplan
      - "{{ netplan_dbus_path }}"
      - io.netplan.Netplan.Config
      - Apply
  register: netplan_apply_result
  changed_when: true
  failed_when: >-
    netplan_apply_result.rc != 0
    or netplan_apply_result.stdout | trim != 'b true'
