# Shared by the converge and the destructive rollback test. A 90s timer
# restores /run/netplan_prev unless the SSH canary creates /run/netplan_keep.

- name: Verify the pre-template snapshot exists before arming rollback
  # A start-at-task resume or reboot may skip or erase the snapshot; never arm
  # a rollback without a restore source.
  stat:
    path: /run/netplan_prev
  register: netplan_prev_snapshot
  failed_when: not (netplan_prev_snapshot.stat.exists and netplan_prev_snapshot.stat.isdir)

- name: Clear stale cancel-marker before arming
  file:
    path: /run/netplan_keep
    state: absent

- name: Arm 90s auto-rollback (timer counts 90s from this restart)
  # Restarting resets OnActiveSec even if a previous apply armed the timer.
  systemd:
    name: netplan_rollback.timer
    state: restarted

- name: Apply netplan with --state pointing at the snapshot
  # Detach so a severed SSH connection cannot strand the controller inside
  # the apply command; the connection canary takes over below.
  command: netplan apply --state /run/netplan_prev
  async: 30
  poll: 0
  register: netplan_apply_async
  changed_when: true

- name: Drop the multiplexed SSH master so the canary forces a fresh handshake
  # ControlPersist could make the canary pass over a stale connection while a
  # fresh TCP/SSH handshake still fails.
  meta: reset_connection

- name: Wait for SSH to re-establish (canary for the rollback timer)
  # Fail before the 90s rollback deadline so ansible cannot mistake a restored
  # connection for successful application of the requested configuration.
  wait_for_connection:
    delay: 5
    timeout: 60

- name: Confirm the async netplan apply actually exited 0
  # SSH may survive a failed netplan command; reap it before cancelling the
  # rollback so command failure still restores the prior config.
  async_status:
    jid: "{{ netplan_apply_async.ansible_job_id }}"
  register: netplan_apply_result
  until: netplan_apply_result.finished
  retries: 5
  delay: 3

- name: Touch cancel-marker so the timer no-ops when it fires
  # This closes the race between a successful canary and stopping the timer.
  file:
    path: /run/netplan_keep
    state: touch
    mode: "0600"

- name: Stop the rollback timer
  # Leave /run/netplan_prev for any outstanding --state reader; the next
  # converge rotates it. A stop error means the timer is wedged and must surface.
  systemd:
    name: netplan_rollback.timer
    state: stopped
