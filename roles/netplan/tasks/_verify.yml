# _setup seeded installer and cloud-init origins, and Minimal also carries its
# cloud image's own. Netplan merges every origin, so its merged view proves no
# leftover definition still configures an interface beside the managed ones.
- name: _verify origins | Read the merged netplan ethernets
  command: netplan get ethernets
  register: netplan_verify_merged
  changed_when: false
  become: true

- name: _verify origins | Confirm only the managed definitions remain
  assert:
    that:
      - (netplan_verify_merged.stdout | from_yaml).keys() | sort == netplan.ethernets.keys() | sort
    fail_msg: "Netplan still merges other origins: {{ netplan_verify_merged.stdout }}"

# Exercise Netplan's automatic rejection with a candidate that removes DHCP.
- name: _verify rejection | Run the apply path against a known-broken config
  become: true
  block:
    - name: _verify rejection | Try the broken netplan config (expect SSH loss)
      import_tasks: apply.yml
      vars:
        netplan_apply_config:
          ethernets:
            en:
              match:
                name: "en*"
              dhcp4: false
              dhcp6: false
              addresses:
                - 192.0.2.99/24
        netplan_remove_origins:
          - 01-netcfg

    - name: _verify rejection | Trial completed cleanly — rejection was not exercised
      fail:
        msg: "Expected the trial SSH canary to time out, but it succeeded"

  rescue:
    - name: _verify rejection | Confirm only the SSH canary failed
      assert:
        that:
          - ansible_failed_task.name == 'Wait for SSH to re-establish during the netplan trial'
        fail_msg: >-
          The transaction failed before exercising Netplan's automatic rejection

    - name: _verify rejection | Wait for SSH after Netplan restores the config
      # The canary consumes about 65 seconds of the 90-second trial, so delay
      # before probing to avoid observing the candidate state in transition.
      wait_for_connection:
        delay: 20
        timeout: 120

- name: _verify rejection | Read the restored Ansible-managed origin
  slurp:
    src: /etc/netplan/01-netcfg.yaml
  register: netplan_verify_restored_config
  become: true

- name: _verify rejection | Confirm Netplan restored the original document
  assert:
    that:
      - >-
        (netplan_verify_restored_config.content | b64decode | from_yaml)
        == {'network': {'version': 2} | combine(netplan)}

- name: _verify rejection | Confirm the candidate IP is gone from live interfaces
  command: ip -4 -oneline address show
  register: netplan_verify_restored_addrs
  changed_when: false
  failed_when: "'192.0.2.99' in netplan_verify_restored_addrs.stdout"
  become: true

# example.com is IANA-reserved and permanently delegated, so the probe measures
# resolved recovering its upstreams rather than a third party's availability.
# resolved can take several seconds past the DHCP re-lease to reach its DoT
# upstreams again, so the window is bounded at ~30s rather than a few retries.
- name: _verify rejection | Resolve a public name after rollback
  command: resolvectl query --cache=no example.com
  register: netplan_verify_restored_dns
  retries: 15
  delay: 2
  until: netplan_verify_restored_dns.rc == 0
  changed_when: false
  become: true

# The role's wait-online drop-in must gate network-online.target on the uplink
# even when the NIC appears after Netplan's generator ran, as it does under the
# Resolute Dracut initrd and on cloud images. network-online.target is passive,
# so a probe unit pulls it into the boot like production services do and
# records the routing table when network-online dependents start.
# Wait-online's success proves it did not time out, and on Resolute that a DNS
# server was also usable.
- name: _verify boot | Install a network-online probe unit
  copy:
    dest: /etc/systemd/system/netplan_online_probe.service
    content: |
      [Unit]
      Wants=network-online.target
      After=network-online.target

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/usr/sbin/ip -json route show default
      StandardOutput=truncate:/run/netplan_online_probe.json

      [Install]
      WantedBy=multi-user.target
    owner: root
    group: root
    mode: "0644"
  become: true

- name: _verify boot | Enable the network-online probe
  systemd:
    name: netplan_online_probe.service
    enabled: true
    daemon_reload: true
  become: true

- name: _verify boot | Reboot to exercise boot-time wait-online generation
  import_role:
    name: reboot
    tasks_from: reboot

# SSH readiness does not imply the probe ran: it queues behind wait-online,
# which may still be waiting for a DNS server. The drop-in pins wait-online's
# --timeout=120, so this 150-second bound covers a timed-out wait as well.
- name: _verify boot | Wait for the network-online probe to finish
  systemd:
    name: netplan_online_probe.service
  register: netplan_verify_probe_state
  until: netplan_verify_probe_state.status.ActiveState in ['active', 'failed']
  retries: 30
  delay: 5
  failed_when: netplan_verify_probe_state.status.ActiveState != 'active'

- name: _verify boot | Read the default route seen by network-online dependents
  slurp:
    src: /run/netplan_online_probe.json
  register: netplan_verify_online_probe
  become: true

- name: _verify boot | Read the wait-online outcome
  systemd:
    name: systemd-networkd-wait-online.service
  register: netplan_verify_wait_online

# Wait-online is a RemainAfterExit oneshot, so ActiveState active already
# means it exited successfully.
- name: _verify boot | Confirm network-online waited for the uplink
  vars:
    _netplan_probe_routes: "{{ netplan_verify_online_probe.content | b64decode | from_json }}"
    _netplan_wait_online: "{{ netplan_verify_wait_online.status }}"
  assert:
    that:
      - _netplan_wait_online.ActiveState == 'active'
      - _netplan_probe_routes | length > 0
    fail_msg: |-
      network-online.target must wait for a default-route uplink.
      Routes seen by the probe: {{ _netplan_probe_routes }}
      wait-online: ActiveState={{ _netplan_wait_online.ActiveState }}
      ExecStart={{ _netplan_wait_online.ExecStart }}

# Where cloud-init owns networking (fox), its origin stays and the managed one
# layers over it. Dropping the managed origin replays a cloud image's first
# converge through the transaction.
- name: _verify layering | Seed a cloud-init netplan origin
  copy:
    dest: /etc/netplan/50-cloud-init.yaml
    content: |
      network:
        version: 2
        ethernets:
          cloudinit0:
            dhcp4: true
    owner: root
    group: root
    mode: "0600"
  become: true

- name: _verify layering | Drop the managed netplan origin
  file:
    path: /etc/netplan/01-netcfg.yaml
    state: absent
  become: true

- name: _verify layering | Converge with cloud-init owning networking
  import_role:
    name: netplan
    tasks_from: main
  vars:
    cloud_init_managed: true  # noqa: var-naming[no-role-prefix]

- name: _verify layering | Read the merged netplan ethernets
  command: netplan get ethernets
  register: netplan_verify_layered
  changed_when: false
  become: true

- name: _verify layering | Confirm the managed definitions layer over cloud-init
  assert:
    that:
      - >-
        (netplan_verify_layered.stdout | from_yaml).keys() | sort
        == (netplan.ethernets.keys() | list + ['cloudinit0']) | sort
    fail_msg: "Unexpected merged netplan ethernets: {{ netplan_verify_layered.stdout }}"
