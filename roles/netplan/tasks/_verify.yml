# Exercise Netplan's automatic rejection with a candidate that removes DHCP.
- name: _verify rejection | Run the apply path against a known-broken config
  become: true
  block:
    - name: _verify rejection | Try the broken netplan config (expect SSH loss)
      import_tasks: apply.yml
      vars:
        netplan_apply_config:
          ethernets:
            en:
              match:
                name: "en*"
              dhcp4: false
              dhcp6: false
              addresses:
                - 192.0.2.99/24
        netplan_remove_origins:
          - 01-netcfg

    - name: _verify rejection | Trial completed cleanly — rejection was not exercised
      fail:
        msg: "Expected the trial SSH canary to time out, but it succeeded"

  rescue:
    - name: _verify rejection | Confirm only the SSH canary failed
      assert:
        that:
          - ansible_failed_task.name == 'Wait for SSH to re-establish during the netplan trial'
        fail_msg: >-
          The transaction failed before exercising Netplan's automatic rejection

    - name: _verify rejection | Wait for SSH after Netplan restores the config
      # The canary consumes about 65 seconds of the 90-second trial, so delay
      # before probing to avoid observing the candidate state in transition.
      wait_for_connection:
        delay: 20
        timeout: 120

- name: _verify rejection | Read the restored Ansible-managed origin
  slurp:
    src: /etc/netplan/01-netcfg.yaml
  register: netplan_verify_restored_config
  become: true

- name: _verify rejection | Confirm Netplan restored the original document
  assert:
    that:
      - >-
        (netplan_verify_restored_config.content | b64decode | from_yaml)
        == {'network': {'version': 2} | combine(netplan)}

- name: _verify rejection | Confirm the candidate IP is gone from live interfaces
  command: ip -4 -oneline address show
  register: netplan_verify_restored_addrs
  changed_when: false
  failed_when: "'192.0.2.99' in netplan_verify_restored_addrs.stdout"
  become: true

# example.com is IANA-reserved and permanently delegated, so the probe measures
# resolved recovering its upstreams rather than a third party's availability.
# resolved can take several seconds past the DHCP re-lease to reach its DoT
# upstreams again, so the window is bounded at ~30s rather than a few retries.
- name: _verify rejection | Resolve a public name after rollback
  become: true
  block:
    - name: _verify rejection | Query a public name after rollback
      command: resolvectl query --cache=no example.com
      register: netplan_verify_restored_dns
      retries: 15
      delay: 2
      until: netplan_verify_restored_dns.rc == 0
      changed_when: false

  rescue:
    - name: _verify rejection | Capture resolved state after the failed query
      command: resolvectl status
      register: netplan_verify_resolved_status
      changed_when: false
      failed_when: false

    - name: _verify rejection | Report the failed post-rollback resolution
      fail:
        msg: |-
          resolved did not recover its upstreams after rollback:
          {{ netplan_verify_restored_dns.stderr | default('') }}

          resolvectl status:
          {{ netplan_verify_resolved_status.stdout }}
          {{ netplan_verify_resolved_status.stderr }}

# The connectivity rejection above fails after staging. Exercise the separate
# staging-failure path and verify it cancels the D-Bus transaction before
# surfacing the error.
- name: _verify staging failure | Exercise transaction cancellation
  become: true
  block:
    - name: _verify staging failure | Try an unrenderable netplan config
      import_tasks: apply.yml
      vars:
        netplan_apply_config: "{{ netplan_undefined_fixture }}"
        netplan_remove_origins: []

    - name: _verify staging failure | Unexpectedly completed the transaction
      fail:
        msg: "Expected netplan staging to fail"

  rescue:
    - name: _verify staging failure | Confirm the staging error was reported
      assert:
        that:
          - ansible_failed_task.name == 'Report the netplan staging failure'
        fail_msg: >-
          The transaction did not exercise the staging rescue path

    # The rescue ignores Cancel's result. Netplan unregisters the config object
    # and removes its /run/netplan/config-<id> state only on a real cancel.
    - name: _verify staging failure | Probe the cancelled D-Bus config object
      command:
        argv:
          - busctl
          - introspect
          - io.netplan.Netplan
          - "{{ netplan_dbus_path }}"
      register: netplan_verify_cancelled_object
      changed_when: false
      failed_when: netplan_verify_cancelled_object.rc == 0

    - name: _verify staging failure | Cancelled transaction state was removed
      stat:
        path: "/run/netplan/config-{{ netplan_dbus_path | basename }}"
      register: netplan_verify_cancelled_state
      failed_when: netplan_verify_cancelled_state.stat.exists

# The setup fixture supplied an installer origin for the first converge. Its
# successful removal leaves the opposite production input for this final rerun.
- name: _verify | Re-run production Netplan tasks without an installer origin
  import_role:
    name: netplan
    tasks_from: main


# The role's wait-online drop-in must gate network-online.target on the uplink
# even when the NIC appears after Netplan's generator ran, as it does under the
# Resolute Dracut initrd and on cloud images. network-online.target is passive,
# so a probe unit pulls it into the boot like production services do and
# records the routing table when network-online dependents start.
# Wait-online's success proves it did not time out, and on Resolute that a DNS
# server was also usable.
- name: _verify boot | Install a network-online probe unit
  copy:
    dest: /etc/systemd/system/netplan_online_probe.service
    content: |
      [Unit]
      Wants=network-online.target
      After=network-online.target

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/usr/sbin/ip -json route show default
      StandardOutput=truncate:/run/netplan_online_probe.json

      [Install]
      WantedBy=multi-user.target
    owner: root
    group: root
    mode: "0644"
  become: true

- name: _verify boot | Enable the network-online probe
  systemd:
    name: netplan_online_probe.service
    enabled: true
    daemon_reload: true
  become: true

- name: _verify boot | Reboot to exercise boot-time wait-online generation
  import_role:
    name: reboot
    tasks_from: reboot

- name: _verify boot | Read the default route
  command: ip -json route show default
  register: netplan_verify_default_route
  changed_when: false

- name: _verify boot | Read the default route seen by network-online dependents
  slurp:
    src: /run/netplan_online_probe.json
  register: netplan_verify_online_probe
  become: true

- name: _verify boot | Read the wait-online outcome  # noqa: command-instead-of-module
  command: >-
    systemctl show systemd-networkd-wait-online.service
    --property=ConditionResult,ActiveState,Result,ExecStart
  register: netplan_verify_wait_online
  changed_when: false

- name: _verify boot | Confirm network-online waited for the uplink
  vars:
    _netplan_uplink: "{{ (netplan_verify_default_route.stdout | from_json | first).dev }}"
    _netplan_probe_routes: "{{ netplan_verify_online_probe.content | b64decode | from_json }}"
  assert:
    that:
      - "'ConditionResult=yes' in netplan_verify_wait_online.stdout_lines"
      - "'ActiveState=active' in netplan_verify_wait_online.stdout_lines"
      - "'Result=success' in netplan_verify_wait_online.stdout_lines"
      - _netplan_uplink in (_netplan_probe_routes | map(attribute='dev'))
    fail_msg: |-
      network-online.target was reached before {{ _netplan_uplink }} had its default route.
      Routes seen by the probe: {{ _netplan_probe_routes }}
      {{ netplan_verify_wait_online.stdout }}
