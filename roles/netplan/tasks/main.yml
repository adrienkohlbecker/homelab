# The base play invokes this role unconditionally; leave networking untouched
# on hosts without an Ansible-owned netplan configuration.
- name: End the netplan role on hosts without managed configuration
  when: netplan is undefined
  meta: end_role
  tags:
    - netplan

- name: Configure host networking via netplan
  tags:
    - netplan
  block:
    - name: Assert netplan host var defines at least one device stanza
      # Netplan accepts a mapping with no device stanzas but generates no
      # networkd configuration, disconnecting the host on apply.
      assert:
        that:
          - netplan is mapping
          - netplan.keys() | list | intersect(['ethernets', 'modems', 'wifis', 'bonds', 'bridges', 'vlans', 'vrfs', 'tunnels']) | length > 0
        fail_msg: "host_vars must define a `netplan` mapping with at least one device stanza (ethernets/bonds/bridges/vlans/...); see host_vars/lab.yml for the schema"

    - name: Install netplan
      apt:
        pkg:
          - netplan.io
        cache_valid_time: 3600
      become: true

    - name: Inspect the Ansible-managed netplan origin
      stat:
        path: /etc/netplan/01-netcfg.yaml
      register: netplan_managed_config
      become: true

    - name: Read the Ansible-managed netplan origin
      when: netplan_managed_config.stat.exists
      slurp:
        src: /etc/netplan/01-netcfg.yaml
      register: netplan_managed_config_content
      become: true

    - name: Inspect the installer netplan origin
      stat:
        path: /etc/netplan/00-installer-config.yaml
      register: netplan_installer_config
      become: true

    # Hosts where cloud-init owns networking keep its rendered configuration;
    # their Ansible netplan stanza only layers local overrides on top.
    - name: Inspect the cloud-init netplan origin
      when: not cloud_init_managed
      stat:
        path: /etc/netplan/50-cloud-init.yaml
      register: netplan_cloud_init_config
      become: true

    - name: Resolve desired and current netplan documents
      set_fact:
        netplan_desired_document: >-
          {{ {'network': {'version': 2} | combine(netplan)} }}
        netplan_current_document: >-
          {{ (netplan_managed_config_content.content | b64decode | from_yaml)
             if netplan_managed_config.stat.exists else {} }}
      changed_when: false

    - name: Detect changed netplan configuration
      set_fact:
        netplan_config_changed: >-
          {{ netplan_current_document != netplan_desired_document
             or netplan_installer_config.stat.exists
             or (not cloud_init_managed
                 and (netplan_cloud_init_config.stat.exists | default(false))) }}
      changed_when: netplan_config_changed

    # A conditional import leaks its condition onto reset_connection, which
    # cannot evaluate task conditions. End the role before the static import.
    - name: End the netplan role when no transaction should run
      when: not netplan_config_changed or ansible_check_mode
      meta: end_role

    # Kept separate so _verify can exercise the automatic rejection path.
    - name: Apply changed netplan configuration transactionally
      import_tasks: apply.yml
      become: true
      vars:
        netplan_apply_config: "{{ netplan }}"
        netplan_replace_managed_config: "{{ netplan_managed_config.stat.exists }}"
        netplan_remove_installer_config: "{{ netplan_installer_config.stat.exists }}"
        netplan_remove_cloud_init_config: >-
          {{ not cloud_init_managed
             and (netplan_cloud_init_config.stat.exists | default(false)) }}
