# The base play invokes this role unconditionally; leave networking untouched
# on hosts without an Ansible-owned netplan configuration.
- name: Configure host networking via netplan
  when: netplan is defined
  tags:
    - netplan
  block:
    - name: Assert netplan host var defines at least one device stanza
      # Netplan accepts a mapping with no device stanzas but generates no
      # networkd configuration, disconnecting the host on apply.
      assert:
        that:
          - netplan is mapping
          - netplan.keys() | list | intersect(['ethernets', 'modems', 'wifis', 'bonds', 'bridges', 'vlans', 'vrfs', 'tunnels']) | length > 0
        fail_msg: "host_vars must define a `netplan` mapping with at least one device stanza (ethernets/bonds/bridges/vlans/...); see host_vars/lab.yml for the schema"

    - name: Install netplan
      apt:
        pkg:
          - netplan.io
        cache_valid_time: 3600
      become: true

    # The minimal cloud image omits this unit, and systemd errors on a missing
    # service even in check mode.
    - name: Probe for networkd-dispatcher.service
      stat:
        path: /usr/lib/systemd/system/networkd-dispatcher.service
      register: netplan_networkd_dispatcher
      become: true

    - name: Mask networkd-dispatcher (unused, only emits podman-veth-churn noise)
      # No role installs dispatcher hooks; the daemon only races podman's
      # ephemeral interfaces and emits veth-churn errors.
      when: netplan_networkd_dispatcher.stat.exists
      systemd:
        name: networkd-dispatcher.service
        state: stopped
        masked: true
      become: true

    - name: Install rollback script
      copy:
        src: netplan_rollback.sh
        dest: /usr/local/bin/netplan_rollback
        owner: root
        group: root
        mode: "0755"
        backup: true
        validate: bash -n %s
      become: true

    # systemd_timer requires OnCalendar; this deadline timer is armed at runtime.
    - name: Install netplan_rollback.service
      import_role:
        name: systemd_unit
        tasks_from: install
      vars:
        systemd_unit_args:
          src: netplan_rollback.service

    - name: Install netplan_rollback.timer
      import_role:
        name: systemd_unit
        tasks_from: install
      vars:
        systemd_unit_args:
          src: netplan_rollback.timer

    - name: Remove stale rollback artifacts from a prior auto-rollback
      # A healthy converge no longer needs the console-recovery copies, which
      # may contain a Wi-Fi PSK and are outside backup rotation.
      file:
        path: "{{ item }}"
        state: absent
      become: true
      loop:
        - /etc/netplan.rollback_failed
        - /etc/netplan.restoring

    # Snapshot before rendering: `netplan apply --state` needs the old config
    # to remove retired virtual devices, and the timer restores the same copy
    # if SSH does not reconnect. Keep it unconditional so apply.yml always has
    # a valid rollback source.
    - name: Wipe any stale /run/netplan_prev
      file:
        path: /run/netplan_prev
        state: absent
      become: true
      changed_when: false

    - name: Snapshot current /etc/netplan to /run/netplan_prev  # noqa: require-backup
      copy:
        src: /etc/netplan/
        dest: /run/netplan_prev/
        remote_src: true
        mode: preserve
        # The snapshot may contain Wi-Fi secrets; do not inherit a lax dir mode.
        directory_mode: "0700"
      become: true
      changed_when: false

    - name: Configure netplan
      template:
        src: config.yaml.j2
        dest: /etc/netplan/01-netcfg.yaml
        owner: root
        group: root
        mode: "0600"
        backup: true
        validate: python3 -c 'import yaml,sys; yaml.safe_load(open(sys.argv[1]))' "%s"
      become: true
      register: netplan_cfg

    - name: Cleanup config added by installer
      file:
        path: /etc/netplan/00-installer-config.yaml
        state: absent
      become: true
      register: netplan_cleanup_installer

    # Hosts where cloud-init owns networking keep its rendered configuration;
    # their Ansible netplan stanza only layers local overrides on top.
    - name: Cleanup config added by cloud-init
      when: not cloud_init_managed
      file:
        path: /etc/netplan/50-cloud-init.yaml
        state: absent
      become: true
      register: netplan_cleanup_cloudinit

    - name: Validate and apply changed netplan configuration
      when: (netplan_cfg.changed or netplan_cleanup_installer.changed or netplan_cleanup_cloudinit.changed) and not ansible_check_mode
      become: true
      block:
        - name: Validate the netplan schema before applying
          # The template's `validate:` only checks YAML syntax. `netplan
          # generate` validates the merged schema without touching a live link.
          command: netplan generate
          changed_when: false

        # Kept separate so _verify can exercise the rollback path directly.
        - name: Apply netplan safely
          import_tasks: apply.yml
