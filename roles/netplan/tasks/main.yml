- name: Configure host networking via netplan
  tags:
    - netplan
  block:
    - name: Assert netplan host var defines at least one device stanza
      # Netplan accepts a mapping with no device stanzas but generates no
      # networkd configuration, disconnecting the host on apply.
      assert:
        that:
          - netplan is mapping
          - netplan.keys() | list | intersect(['ethernets', 'modems', 'wifis', 'bonds', 'bridges', 'vlans', 'vrfs', 'tunnels']) | length > 0
        fail_msg: "inventory must define a `netplan` mapping with at least one device stanza (ethernets/bonds/bridges/vlans/...); see group_vars/physical_lab.yml for the schema"

    - name: Install netplan
      apt:
        pkg:
          - netplan.io
        cache_valid_time: 3600
      become: true

    # Own the network-online wait so it does not depend on which NICs existed
    # when Netplan's generator ran; see the drop-in for the failure mode.
    - name: Install the systemd-networkd-wait-online drop-in
      import_role:
        name: systemd_unit
        tasks_from: install
      vars:
        systemd_unit_args:
          src: override_wait_online.conf.j2
          for: systemd-networkd-wait-online.service

    - name: Pull systemd-networkd-wait-online into network-online.target
      systemd:
        name: systemd-networkd-wait-online.service
        enabled: true
      become: true

    # The role owns only this origin. Others, such as cloud-init's
    # 50-cloud-init.yaml on fox, stay in place and Netplan merges them in.
    - name: Inspect the Ansible-managed netplan origin
      stat:
        path: /etc/netplan/01-netcfg.yaml
      register: netplan_managed_config
      become: true

    - name: Read the Ansible-managed netplan origin
      when: netplan_managed_config.stat.exists
      slurp:
        src: /etc/netplan/01-netcfg.yaml
      register: netplan_managed_config_content
      become: true

    - name: Detect changed netplan configuration
      set_fact:
        netplan_config_changed: >-
          {{ ((netplan_managed_config_content.content | b64decode | from_yaml)
              if netplan_managed_config.stat.exists else {})
             != {'network': {'version': 2} | combine(netplan)} }}
      changed_when: netplan_config_changed

    # A conditional import leaks its condition onto reset_connection, which
    # cannot evaluate task conditions. End the role before the static import.
    - name: End the netplan role when no transaction should run
      when: not netplan_config_changed or ansible_check_mode
      meta: end_role

    # Kept separate so _verify can exercise the automatic rejection path.
    - name: Apply changed netplan configuration transactionally
      import_tasks: apply.yml
      become: true
      vars:
        netplan_apply_config: "{{ netplan }}"
        netplan_remove_origins: "{{ ['01-netcfg'] if netplan_managed_config.stat.exists else [] }}"
