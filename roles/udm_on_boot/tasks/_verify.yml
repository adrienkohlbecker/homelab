# -- functional path: the framework actually runs scripts -------------------
- name: _verify | Install a marker probe script
  copy:
    content: |
      #!/bin/bash
      set -euo pipefail
      touch /run/udm_on_boot_verify_marker
    dest: /data/on_boot.d/98-verify-marker.sh
    owner: root
    group: root
    mode: "0755"
  become: true

- name: _verify | Start the framework and expect success
  systemd:
    name: on-boot.service
    state: restarted
  become: true

- name: _verify | Marker probe ran
  stat:
    path: /run/udm_on_boot_verify_marker
  register: _udm_on_boot_marker
  failed_when: not _udm_on_boot_marker.stat.exists
  become: true

# A failing script must fail the unit -- the exit-code propagation the unit
# file documents as load-bearing for post-firmware recovery visibility.
- name: _verify | Install a failing probe script
  copy:
    content: |
      #!/bin/bash
      set -euo pipefail
      exit 1
    dest: /data/on_boot.d/99-verify-fail.sh
    owner: root
    group: root
    mode: "0755"
  become: true

# noqa on the raw systemctl: the systemd module treats the failed restart as
# a module error; asserting on the exit code needs the plain command.
- name: _verify | Restart the framework and expect failure  # noqa: command-instead-of-module
  command: systemctl restart on-boot.service
  register: _udm_on_boot_fail_restart
  changed_when: false
  failed_when: _udm_on_boot_fail_restart.rc == 0
  become: true

- name: _verify | Framework unit reports failed
  systemd:
    name: on-boot.service
  register: _udm_on_boot_failed_state
  failed_when: _udm_on_boot_failed_state.status.ActiveState != 'failed'
  become: true

- name: _verify | Remove the probe scripts and marker
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /data/on_boot.d/98-verify-marker.sh
    - /data/on_boot.d/99-verify-fail.sh
    - /run/udm_on_boot_verify_marker
  become: true

- name: _verify | Framework recovers once the failing script is gone
  systemd:
    name: on-boot.service
    state: restarted
  become: true
