# -- functional path: the framework actually runs scripts -------------------
- name: _verify | Install a stateful probe script
  copy:
    content: |
      #!/bin/bash
      set -euo pipefail
      if [[ -e /run/udm_on_boot_verify_marker ]]; then
        exit 1
      fi
      touch /run/udm_on_boot_verify_marker
    dest: /data/on_boot.d/98-verify-marker.sh
    owner: root
    group: root
    mode: "0755"
  become: true

- name: _verify | Start the framework and expect success
  systemd:
    name: on-boot.service
    state: restarted
  become: true

# The first run creates the marker, so the same probe fails on its second run.
# That failure must propagate to the unit for recovery failures to be visible.
# noqa on the raw systemctl: the systemd module treats the failed restart as
# a module error; asserting on the exit code needs the plain command.
- name: _verify | Restart the framework and expect failure  # noqa: command-instead-of-module
  command: systemctl restart on-boot.service
  register: _udm_on_boot_fail_restart
  changed_when: false
  failed_when: _udm_on_boot_fail_restart.rc == 0
  become: true

- name: _verify | Framework unit reports failed
  systemd:
    name: on-boot.service
  register: _udm_on_boot_failed_state
  failed_when: _udm_on_boot_failed_state.status.ActiveState != 'failed'
  become: true

- name: _verify | Remove the probe script and marker
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /data/on_boot.d/98-verify-marker.sh
    - /run/udm_on_boot_verify_marker
  become: true

- name: _verify | Framework recovers once the failing script is gone
  systemd:
    name: on-boot.service
    state: restarted
  become: true
