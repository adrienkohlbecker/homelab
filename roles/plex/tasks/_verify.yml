# Functional probes against the running container. The pinned pms-docker
# tag is multi-arch, so Plex starts on both prod x86_64 and the local arm64
# box (cf. the unit having no start: arch gate) — these run everywhere, no
# stat-only fallback needed.

# Loopback probe through the published port — /identity returns the
# server's machineIdentifier as XML without auth, proving Plex is up
# beyond the container's own --sdnotify=healthy gate.
- name: _verify | Plex /identity over loopback
  uri:
    url: http://localhost:{{ service_ports.plex }}/identity
    status_code: 200
    return_content: true
  register: _plex_http
  retries: 30
  delay: 2
  until: _plex_http.status == 200
  failed_when: not (_plex_http.content is search('machineIdentifier'))

# Exercise the nginx-proxied path — catches a typo'd subdomain or
# proxy_pass regression the loopback probe would miss.
#
# Map the vhost FQDN to loopback so SNI matches the served certificate.
# Probing https://localhost with a Host: header leaves SNI=localhost, which
# OpenSSL 3.x (noble/resolute) rejects as a fatal unrecognized_name alert
# (status -1); hitting the FQDN directly keeps SNI correct on every release.
- name: _verify | Map the plex vhost FQDN to loopback for SNI-correct probing
  lineinfile:
    path: /etc/hosts
    line: "127.0.0.1 plex.{{ inventory_hostname }}.{{ domain }}"
    state: present
  become: true

- name: _verify | Plex /identity via nginx vhost
  uri:
    url: https://plex.{{ inventory_hostname }}.{{ domain }}/identity
    validate_certs: false
    status_code: 200
    return_content: true
  register: _plex_http_nginx
  retries: 30
  delay: 2
  until: _plex_http_nginx.status == 200
  failed_when: not (_plex_http_nginx.content is search('machineIdentifier'))

# A port answering proves Plex is up, but the unit reaching `active` is the
# stronger claim: with Type=notify + --sdnotify=healthy, `active` means the
# container's --health-cmd passed and podman propagated readiness. A broken
# health-cmd leaves the unit stuck `activating` until TimeoutSec even while
# the port answers, so assert the gate actually fired.
- name: _verify | Plex unit reached active via the sdnotify=healthy gate
  systemd:
    name: plex.service
  register: _plex_active
  failed_when: _plex_active.status.ActiveState != "active"
  become: true

# CHANGE_CONFIG_DIR_OWNERSHIP=false skips the entrypoint's recursive chown,
# relying on the host already owning /config as the plex uid. Exec a write as
# that uid (not the container's root, which could write regardless) to prove
# the invariant end-to-end. Facts don't cross the _verify invocation, so
# re-look-up the uid the same way the HW section re-looks-up the render gid.
- name: _verify | Re-lookup plex uid for the /config write probe
  getent:
    database: passwd
    key: plex
  become: true

- name: _verify | Plex can write /config as its own uid
  command:
    argv:
      - podman
      - exec
      - --user
      - "{{ getent_passwd.plex[1] }}"
      - plex
      - touch
      - /config/.verify_write_probe
  changed_when: false
  become: true

# The seeded Preferences.xml points Plex's transcoder at the /transcode
# tmpfs. Plex rewrites Preferences.xml on first boot, so this proves the
# seeded attribute survived that rewrite — i.e. transcoding lands on the
# tmpfs and not on the snapshotted /config dataset.
- name: _verify | Plex transcodes onto the /transcode tmpfs
  command:
    argv:
      - podman
      - exec
      - plex
      - grep
      - -q
      - TranscoderTempDirectory="/transcode"
      - /config/Library/Application Support/Plex Media Server/Preferences.xml
  changed_when: false
  become: true

# The seeded Butler window must survive Plex's first-boot rewrite the same way
# TranscoderTempDirectory does -- proves the maintenance tasks run 22:00-00:00
# local (before the 02:00 UTC backup), not at Plex's 02:00-05:00 default. Both
# ends are checked: a dropped ButlerEndHour would let the window run to Plex's
# default end and overlap the backup even with the start hour pinned.
- name: _verify | Plex Butler window seeded into Preferences.xml
  command:
    argv:
      - podman
      - exec
      - plex
      - grep
      - -q
      - '{{ item }}'
      - /config/Library/Application Support/Plex Media Server/Preferences.xml
  loop:
    - ButlerStartHour="{{ plex_butler_start_hour }}"
    - ButlerEndHour="{{ plex_butler_end_hour }}"
  changed_when: false
  become: true

# Content mounts: the library plus any host-specific read-only source trees
# (plex_extra_library_binds) must surface inside the container, and the
# read-only binds must actually reject writes — a dropped :ro would let Plex
# mutate the source library silently. A :ro bind is read-only even to the
# exec's root, so the touch fails at the mount layer regardless of
# in-container uid. The extra dests are empty on a host without the data
# mount (box), so this degrades to checking /media there.
- name: _verify | Content mounts are present in the container
  command:
    argv:
      - podman
      - exec
      - plex
      - test
      - -d
      - "{{ item }}"
  loop: "{{ ['/media'] + (plex_extra_library_binds | map(attribute='dest') | list) }}"
  changed_when: false
  become: true

- name: _verify | Read-only content mounts reject writes
  command:
    argv:
      - podman
      - exec
      - plex
      - touch
      - "{{ item }}/.verify_ro_probe"
  loop: "{{ ['/media'] + (plex_extra_library_binds | map(attribute='dest') | list) }}"
  register: _plex_ro
  changed_when: false
  failed_when: _plex_ro.rc == 0
  become: true

# SQLite bind round-trip: a host-side sentinel under the dedicated 4K
# dataset must surface inside the container at Plex's Databases dir,
# proving the --volume landed (a path typo would silently route DB writes
# back onto the services dataset). _verify is test-only, so the sentinel
# write is safe.
- name: _verify | Drop a sentinel on the host sqlite dataset
  copy:
    content: ""
    dest: /mnt/services/sqlite/plex/.verify_sentinel
    owner: plex
    group: media
    mode: "0640"
  become: true

- name: _verify | Confirm the sentinel is visible in the container Databases dir
  command:
    argv:
      - podman
      - exec
      - plex
      - stat
      - -c
      - "%n"
      - "/config/Library/Application Support/Plex Media Server/Plug-in Support/Databases/.verify_sentinel"
  changed_when: false
  become: true

# HW transcoding wiring smoke. On box the device is a phantom from
# test/fake_render_device.yml, so this proves the template's --device
# and --group-add reached the container, not that VAAPI works.
# _verify runs as a separate playbook, so re-lookup the render gid.
- name: _verify | Re-lookup render gid for assertions
  when: has_transcoding_acceleration
  getent:
    database: group
    key: render
  become: true

- name: _verify | Confirm /dev/dri/renderD128 inside container
  when: has_transcoding_acceleration
  command: podman exec plex stat -c %n /dev/dri/renderD128
  register: _plex_dri_in_container
  changed_when: false
  failed_when: _plex_dri_in_container.stdout != '/dev/dri/renderD128'
  become: true

- name: _verify | Confirm render gid in container supplementary groups
  when: has_transcoding_acceleration
  command: podman exec plex id -G
  register: _plex_container_groups
  changed_when: false
  failed_when: getent_group.render[1] not in _plex_container_groups.stdout.split()
  become: true

- name: _verify | Read normalized plex stdout records
  command:
    argv:
      - python3
      - -c
      - |
        import json
        import sys

        path = sys.argv[1]
        found = {}
        with open(path) as records:
            for line in records:
                record = json.loads(line)
                message = record.get("message", "")
                if message == "40-plex-first-run: exited 0.":
                    found["entrypoint"] = record
                elif message == "libusb_init failed":
                    found["critical"] = record
                elif message == "Starting Plex Media Server.":
                    found["plain"] = record
        if len(found) != 3:
            raise SystemExit(1)
        print(json.dumps(found))
      - /var/log/fluent-bit/lnav.jsonl
  register: plex_stdout_records
  retries: 15
  delay: 1
  until: plex_stdout_records.rc == 0
  changed_when: false

- name: _verify | Assert normalized plex stdout fields
  vars:
    records: "{{ plex_stdout_records.stdout | from_json }}"
  assert:
    that:
      - records.entrypoint.service == 'plex'
      - records.entrypoint.level == 'info'
      - records.entrypoint.fields.source == 'cont-init.d'
      - records.entrypoint.fields.parser_status == 'parsed'
      - records.critical.service == 'plex'
      - records.critical.level == 'fatal'
      - records.critical.fields.parser_status == 'parsed'
      - records.plain.service == 'plex'
      - records.plain.level == 'info'
      - records.plain.fields.parser_status == 'parsed'
      - records.plain.fields.source is not defined

- name: _verify | Define plex file-ingestion markers
  set_fact:
    plex_server_marker: "plex_server_{{ ansible_date_time.iso8601_basic_short }}_{{ 99999 | random }}"
    plex_scanner_marker: "plex_scanner_{{ ansible_date_time.iso8601_basic_short }}_{{ 99999 | random }}"
    plex_crash_marker: "plex_crash_{{ ansible_date_time.iso8601_basic_short }}_{{ 99999 | random }}"

- name: _verify | Append plex file-ingestion records
  shell: |
    set -euo pipefail
    printf "%s\n%s\n" \
      "Jul 12, 2026 12:00:00.000 [1a2b] WARN - {{ plex_server_marker }} first line" \
      "continuation line" \
      >> "/mnt/services/plex/Library/Application Support/Plex Media Server/Logs/Plex Media Server.log"
    printf "%s\n%s\n" \
      "Jul 12, 2026 12:00:01.000 [2b3c] ERROR - {{ plex_scanner_marker }} first line" \
      "scanner continuation" \
      >> "/mnt/services/plex/Library/Application Support/Plex Media Server/Logs/Plex Media Scanner Analysis.log"
    printf "%s\n" \
      "Jul 12, 2026 12:00:02.000 [3c4d] WARN - {{ plex_crash_marker }}" \
      >> "/mnt/services/plex/Library/Application Support/Plex Media Server/Logs/Plex Crash Uploader.log"
  args:
    executable: /bin/bash
  changed_when: true
  become: true

- name: _verify | Read normalized plex file records
  command:
    argv:
      - python3
      - -c
      - |
        import json
        import sys

        server_marker, scanner_marker, crash_marker, path = sys.argv[1:]
        expected = {
            "plex_file": server_marker,
            "plex_scanner": scanner_marker,
            "plex_crash_uploader": crash_marker,
        }
        found = {}
        with open(path) as records:
            for line in records:
                record = json.loads(line)
                stream = record.get("stream")
                if stream in expected and expected[stream] in record.get("message", ""):
                    found[stream] = record
        if len(found) != len(expected):
            raise SystemExit(1)
        print(json.dumps(found))
      - "{{ plex_server_marker }}"
      - "{{ plex_scanner_marker }}"
      - "{{ plex_crash_marker }}"
      - /var/log/fluent-bit/lnav.jsonl
  register: plex_file_records
  retries: 15
  delay: 1
  until: plex_file_records.rc == 0
  changed_when: false

- name: _verify | Assert normalized plex file fields
  vars:
    records: "{{ plex_file_records.stdout | from_json }}"
  assert:
    that:
      - records.plex_file.service == 'plex'
      - records.plex_file.stream == 'plex_file'
      - records.plex_file.unit == 'plex.service'
      - records.plex_file.identifier == 'plex'
      - records.plex_file.level == 'warn'
      - records.plex_file.message == plex_server_marker ~ ' first line\ncontinuation line'
      - records.plex_file.fields.thread == '1a2b'
      - records.plex_file.fields.source == 'plex_media_server'
      - records.plex_file.fields.parser_status == 'parsed'
      - records.plex_file.parse_error is not defined
      - records.plex_file.fields.plex_timestamp is not defined
      - records.plex_file.fields.filepath is not defined
      - records.plex_scanner.service == 'plex'
      - records.plex_scanner.stream == 'plex_scanner'
      - records.plex_scanner.unit == 'plex.service'
      - records.plex_scanner.identifier == 'plex'
      - records.plex_scanner.level == 'error'
      - records.plex_scanner.message == plex_scanner_marker ~ ' first line\nscanner continuation'
      - records.plex_scanner.fields.thread == '2b3c'
      - records.plex_scanner.fields.source == 'plex_media_scanner'
      - records.plex_scanner.fields.parser_status == 'parsed'
      - records.plex_scanner.parse_error is not defined
      - records.plex_scanner.fields.plex_timestamp is not defined
      - records.plex_scanner.fields.filepath is not defined
      - records.plex_crash_uploader.service == 'plex'
      - records.plex_crash_uploader.stream == 'plex_crash_uploader'
      - records.plex_crash_uploader.unit == 'plex.service'
      - records.plex_crash_uploader.identifier == 'plex'
      - records.plex_crash_uploader.level == 'warn'
      - records.plex_crash_uploader.message == plex_crash_marker
      - records.plex_crash_uploader.fields.thread == '3c4d'
      - records.plex_crash_uploader.fields.source == 'plex_crash_uploader'
      - records.plex_crash_uploader.fields.parser_status == 'parsed'
      - records.plex_crash_uploader.parse_error is not defined
      - records.plex_crash_uploader.fields.plex_timestamp is not defined
      - records.plex_crash_uploader.fields.filepath is not defined
