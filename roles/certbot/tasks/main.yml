- name: Install certbot
  apt:
    pkg:
      - certbot
      - python3-certbot-dns-cloudflare
      - ssl-cert
    policy_rc_d: 101
    cache_valid_time: 3600
  register: certbot_apt
  become: true
  tags:
    - certbot

- name: Configure certbot log compression
  import_role:
    name: logrotate
    tasks_from: compression
  vars:
    logrotate_args:
      configs:
        - path: /etc/logrotate.d/certbot
      condition: "{{ not (ansible_check_mode and certbot_apt.changed) }}"
  tags:
    - certbot

# Let explicit ssl-cert members such as netdata traverse Certbot storage
# without exposing the wildcard lineage to every local UID.
- name: Set permissions on storage directories
  file:
    dest: /etc/letsencrypt/{{ item }}
    state: directory
    owner: root
    group: ssl-cert
    mode: "0750"
  loop:
    - live
    - archive
  become: true
  when: not (ansible_check_mode and certbot_apt.changed)
  tags:
    - certbot

# Keep hand-run Certbot commands aligned with Ansible. Per-lineage renewal
# configuration and explicit arguments still override these defaults.
- name: Write certbot cli.ini  # noqa: require-validate
  copy:
    dest: /etc/letsencrypt/cli.ini
    content: |
      agree-tos = true
      email = {{ root_email }}
      key-type = ecdsa
      elliptic-curve = secp384r1
      dns-cloudflare-credentials = /etc/letsencrypt/cloudflare.ini
      dns-cloudflare-propagation-seconds = 60
    mode: "0644"
    owner: root
    group: root
    backup: true
  become: true
  when: not (ansible_check_mode and certbot_apt.changed)
  tags:
    - certbot

- name: Write cloudflare credentials  # noqa: require-validate
  copy:
    dest: /etc/letsencrypt/cloudflare.ini
    content: "dns_cloudflare_api_token = {{ cloudflare_api_token }}\n"
    mode: "0600"
    owner: root
    group: root
    backup: true
  register: certbot_cf_creds
  become: true
  when: not (ansible_check_mode and certbot_apt.changed)
  tags:
    - certbot

# --cert-name keeps the lineage path stable for every consumer. Omitting
# --reuse-key rotates the private key on renewal, and the persisted deploy
# hook makes timer-driven renewals reload nginx. Exact SAN comparison forces
# reissuance after host, domain, or extra-SAN changes and rejects fixtures at
# the same path whose certificate contents do not match.
- name: Stat existing certificate
  stat:
    path: /etc/letsencrypt/live/{{ inventory_hostname }}.{{ domain }}/fullchain.pem
  register: certbot_cert_stat
  become: true
  tags:
    - certbot

- name: Read existing certificate SANs
  community.crypto.x509_certificate_info:
    path: /etc/letsencrypt/live/{{ inventory_hostname }}.{{ domain }}/fullchain.pem
  register: certbot_cert_info
  when: certbot_cert_stat.stat.exists
  become: true
  tags:
    - certbot

# A certificate path can be a test fixture without a Certbot lineage. Treat a
# missing renewal config as drift so issuance replaces the incomplete fixture.
- name: Read existing renewal configuration
  slurp:
    src: /etc/letsencrypt/renewal/{{ inventory_hostname }}.{{ domain }}.conf
  register: certbot_renewal
  failed_when: false
  when: certbot_cert_stat.stat.exists
  become: true
  tags:
    - certbot

- name: Issue certificate  # noqa: no-changed-when -- when: gates execution, like creates: did
  command:
    argv: >-
      {{ ['certbot', 'certonly', '--noninteractive', '--dns-cloudflare',
          '--cert-name', inventory_hostname + '.' + domain,
          '--deploy-hook', certbot_deploy_hook]
         + (['-d'] | product(certbot_domains) | flatten | list)
         + (certbot_renewal_required | ternary(['--force-renewal'], []))
         + (certbot_production_certificates | ternary([], ['--test-cert'])) }}
  vars:
    certbot_deploy_hook: >-
      systemctl is-active --quiet nginx || exit 0; systemctl reload nginx
    certbot_domains: >-
      {{ [inventory_hostname + '.' + domain,
          '*.' + inventory_hostname + '.' + domain]
         + certbot_extra_sans }}
    certbot_expected_sans: >-
      {{ certbot_domains | map('regex_replace', '^', 'DNS:') | list }}
    certbot_sans_drifted: >-
      {{ certbot_cert_stat.stat.exists
         and (certbot_cert_info.subject_alt_name | sort) != (certbot_expected_sans | sort) }}
    certbot_renewal_text: "{{ certbot_renewal.content | default('') | b64decode }}"
    certbot_hook_drifted: >-
      {{ certbot_cert_stat.stat.exists
         and ('renew_hook = ' + certbot_deploy_hook) not in certbot_renewal_text }}
    certbot_renewal_required: "{{ certbot_sans_drifted or certbot_hook_drifted }}"
  become: true
  when:
    - not (ansible_check_mode and certbot_apt.changed)
    - (not certbot_cert_stat.stat.exists) or certbot_renewal_required
  tags:
    - certbot

# Exercise a rotated token immediately; initial issuance already covers this
# path on a fresh host.
- name: Exercise renewal after cloudflare token rotation  # noqa: no-changed-when -- diagnostic dry-run
  command: certbot renew --dry-run --no-random-sleep-on-renew
  become: true
  when:
    - certbot_cf_creds.changed
    - certbot_cert_stat.stat.exists
  tags:
    - certbot

- name: Enable certbot renewal timer
  when: not (ansible_check_mode and certbot_apt.changed)
  systemd:
    name: certbot.timer
    enabled: true
    state: started
  become: true
  tags:
    - certbot
