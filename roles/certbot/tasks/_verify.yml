# Exercise the issued certificate and renewal path. Netdata verifies the
# cross-role x509check configuration on its consumer side.

- name: _verify | Load production Certbot vars for a physical host
  include_vars:
    file: "{{ role_path }}/vars/main.yml"
    name: _certbot_physical_vars
  vars:
    qemu_test: false

- name: _verify | Physical hosts use the unprefixed requested domain
  assert:
    that:
      - _certbot_physical_vars.certbot_test_domain_label == ''
      - _certbot_physical_vars.certbot_requested_domain == inventory_hostname ~ '.' ~ domain
  vars:
    qemu_test: false

- name: _verify | Preserve the issued fixture domain
  set_fact:
    _certbot_fixture_domain: "{{ certbot_requested_domain }}"

- name: _verify | Create a controlled certbot executable directory
  file:
    path: /tmp/certbot_coverage_bin
    state: directory
    mode: "0755"
  become: true

- name: _verify | Install a controlled certbot executable
  copy:
    dest: /tmp/certbot_coverage_bin/certbot
    content: |
      #!/bin/bash
      set -euo pipefail
      printf '%s\n' "$@" > /tmp/certbot_issuance_args
      exit 42
    mode: "0755"
  become: true

- name: _verify | Exercise drifted physical issuance through production tasks
  environment:
    PATH: "/tmp/certbot_coverage_bin:{{ ansible_env.PATH }}"
  block:
    - name: _verify | Reconcile a drifted certificate without the test flag
      import_tasks: certificate.yml
      vars:
        certbot_apt:
          changed: false
        certbot_domains:
          - "{{ _certbot_fixture_domain }}"
          - "*.{{ _certbot_fixture_domain }}"
          - coverage.invalid
        qemu_test: false
      become: true

    - name: _verify | Reject an unexpectedly completed issuance fixture
      fail:
        msg: The controlled certbot executable did not stop issuance

  rescue:
    - name: _verify | Require the production issuance failure
      assert:
        that: ansible_failed_task.name == 'certificate | Issue certificate'

    - name: _verify | Read the controlled issuance arguments
      slurp:
        src: /tmp/certbot_issuance_args
      register: _certbot_issuance_args
      become: true

    - name: _verify | Drift forces renewal without staging flags
      assert:
        that:
          - "'--force-renewal' in (_certbot_issuance_args.content | b64decode)"
          - "'--test-cert' not in (_certbot_issuance_args.content | b64decode)"

  always:
    - name: _verify | Remove controlled certbot fixture files
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/certbot_coverage_bin
        - /tmp/certbot_issuance_args
      become: true

- name: _verify | Verify certbot
  become: true
  block:
    - name: _verify | Private key exists
      stat:
        path: /etc/letsencrypt/live/{{ inventory_hostname }}.{{ domain }}/privkey.pem
      register: _certbot_cert
      failed_when: not _certbot_cert.stat.exists

    # Reject a stale certificate that still has the expected SANs and issuer.
    - name: _verify | Certificate has expected SANs, validity, and issuer
      vars:
        _verify_expected_sans: >-
          {{ certbot_domains | map('regex_replace', '^', 'DNS:') | list }}
      community.crypto.x509_certificate_info:
        path: /etc/letsencrypt/live/{{ inventory_hostname }}.{{ domain }}/fullchain.pem
        valid_at:
          now: "+0s"
          week_out: "+7d"
      register: _certbot_cert_info
      failed_when: >-
        (_certbot_cert_info.subject_alt_name | sort) != (_verify_expected_sans | sort)
        or not _certbot_cert_info.valid_at.now
        or not _certbot_cert_info.valid_at.week_out
        or _certbot_cert_info.issuer == _certbot_cert_info.subject
