# Exercise the issued certificate and renewal path. Netdata verifies the
# cross-role x509check configuration on its consumer side.

- name: _verify | Private key exists
  stat:
    path: /etc/letsencrypt/live/{{ inventory_hostname }}.{{ domain }}/privkey.pem
  register: _certbot_cert
  failed_when: not _certbot_cert.stat.exists
  become: true

# Reject a stale certificate that still has the expected SANs and issuer.
- name: _verify | Inspect issued certificate
  community.crypto.x509_certificate_info:
    path: /etc/letsencrypt/live/{{ inventory_hostname }}.{{ domain }}/fullchain.pem
    valid_at:
      now: "+0s"
      week_out: "+7d"
  register: _certbot_cert_info
  become: true

- name: _verify | Certificate has expected SANs, validity, and issuer
  vars:
    _verify_expected_sans: >-
      {{ ([inventory_hostname + '.' + domain,
           '*.' + inventory_hostname + '.' + domain]
          + certbot_extra_sans)
         | map('regex_replace', '^', 'DNS:') | list }}
  assert:
    that:
      - (_certbot_cert_info.subject_alt_name | sort) == (_verify_expected_sans | sort)
      - _certbot_cert_info.valid_at.now
      - _certbot_cert_info.valid_at.week_out
      - _certbot_cert_info.issuer != _certbot_cert_info.subject
    fail_msg: >-
      cert missing expected SANs, expiring soon, or self-signed
      (SANs={{ _certbot_cert_info.subject_alt_name }},
      expected={{ _verify_expected_sans }},
      not_after={{ _certbot_cert_info.not_after }},
      valid_at={{ _certbot_cert_info.valid_at }},
      issuer={{ _certbot_cert_info.issuer }},
      subject={{ _certbot_cert_info.subject }})

- name: _verify | Certbot.timer is loaded, enabled, and active
  systemd:
    name: certbot.timer
  register: _certbot_timer
  failed_when: >-
    _certbot_timer.status.LoadState != "loaded"
    or _certbot_timer.status.UnitFileState != "enabled"
    or _certbot_timer.status.ActiveState != "active"
  become: true

# Restrict wildcard-lineage traversal to explicit ssl-cert consumers.
- name: _verify | LE storage directories are 0750 root:ssl-cert
  stat:
    path: /etc/letsencrypt/{{ item }}
  loop:
    - live
    - archive
  loop_control:
    label: "{{ item }}"
  register: _certbot_le_dir
  failed_when: >-
    not _certbot_le_dir.stat.exists
    or _certbot_le_dir.stat.mode != "0750"
    or _certbot_le_dir.stat.pw_name != "root"
    or _certbot_le_dir.stat.gr_name != "ssl-cert"
  become: true

# Exercise the credentials, Cloudflare plugin, and ACME renewal configuration.
# Certbot dry-runs do not execute deploy hooks; persistence is checked above.
- name: _verify | Certbot renew --dry-run exercises the renewal path
  command: certbot renew --dry-run --no-random-sleep-on-renew
  changed_when: false
  become: true
