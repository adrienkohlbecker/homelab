---
# CI_JOB_ID keeps concurrent cells apart; outside CI the harness-injected
# connection facts do the same for parallel local runs. A hand-run converge
# against a fixture that inherits its address from ssh_config has neither, so
# fall back to inventory_hostname: always defined, and still distinct per host.
certbot_test_domain_seed: >-
  {{ lookup('env', 'CI_JOB_ID')
     | default(ansible_ssh_host | default(inventory_hostname, true) ~ ':'
               ~ ansible_ssh_port | default('', true), true) }}
certbot_test_domain_label: >-
  {{ 'qemu-' + ((certbot_test_domain_seed | hash('sha256'))[:16])
     if qemu_test
     else '' }}
certbot_requested_domain: >-
  {{ inventory_hostname + '.'
     + ((certbot_test_domain_label + '.') if certbot_test_domain_label else '')
     + domain }}
certbot_domains: >-
  {{ [certbot_requested_domain,
      '*.' + certbot_requested_domain]
     + certbot_extra_sans }}
