# nut_server runs on every home host (site.yml, all:!bunk:!fox), not just
# lab: each host independently SNMP-polls the one Eaton UPS and exposes its
# own upsd, monitored by its own upsmon (roles/nut_monitor, ordered right
# after this role) — so no host depends on a peer NUT server being up, and
# the per-host ups.conf low-battery overrides form the staged shutdown
# ladder (see defaults/main.yml and host_vars/pug.yml). upsd also serves
# Home Assistant (on lab) + operator `upsc` reads. The nut-monitor unit
# itself (enablement, upsmon.conf) is entirely nut_monitor's; this role
# does not touch it.

- name: Assert required nut secrets are set
  assert:
    that:
      - nut_upsmon_password is defined and (nut_upsmon_password | length > 0)
      - nut_homeassistant_password is defined and (nut_homeassistant_password | length > 0)
      - nut_winnut_password is defined and (nut_winnut_password | length > 0)
    fail_msg: >-
      nut_upsmon_password, nut_homeassistant_password and nut_winnut_password must be set
      (group_vars/{prod,test}.yml); upsd.users renders them verbatim.
  tags:
    - nut_server

- name: Install nut
  apt:
    pkg:
      - nut-snmp
      - nut-cgi
      - fcgiwrap
    cache_valid_time: 3600
  become: true
  register: nut_server_apt
  tags:
    - nut_server

- name: Configure nut nut.conf  # noqa: require-validate
  when: not (ansible_check_mode and nut_server_apt.changed)
  copy:
    src: nut.conf
    dest: /etc/nut/nut.conf
    backup: true
    owner: root
    group: nut
    mode: "0640"
  become: true
  register: nut_server_nut_conf
  tags:
    - nut_server

- name: Configure nut ups.conf
  when: not (ansible_check_mode and nut_server_apt.changed)
  template:
    src: ups.conf.j2
    dest: /etc/nut/ups.conf
    owner: root
    group: nut
    mode: "0640"
    backup: true
    # Prepend a dummy section so Python 3.12 accepts the global `maxretry`
    # directive that precedes the first named UPS section.
    validate: python3 -c 'import configparser,sys; configparser.ConfigParser(allow_no_value=True).read_string("[__global__]\n" + open(sys.argv[1]).read())' "%s"
  register: nut_server_ups_conf
  become: true
  tags:
    - nut_server

- name: Configure the dummy UPS data for qemu  # noqa: require-validate
  when:
    - qemu_test | bool
    - not (ansible_check_mode and nut_server_apt.changed)
  copy:
    dest: /etc/nut/eaton.dev
    owner: root
    group: nut
    mode: "0640"
    backup: true
    content: |
      ups.status: OL
      battery.charge: 100
      battery.runtime: 1800
      ups.mfr: dummy
      ups.model: evolution500
  become: true
  tags:
    - nut_server

- name: Configure nut upsd.conf  # noqa: require-validate
  when: not (ansible_check_mode and nut_server_apt.changed)
  template:
    src: upsd.conf.j2
    dest: /etc/nut/upsd.conf
    backup: true
    owner: root
    group: nut
    mode: "0640"
  become: true
  register: nut_server_upsd_conf
  tags:
    - nut_server

- name: Configure nut upsd.users
  when: not (ansible_check_mode and nut_server_apt.changed)
  template:
    src: upsd.users.j2
    dest: /etc/nut/upsd.users
    owner: root
    group: nut
    mode: "0640"
    backup: true
    validate: python3 -c 'import configparser; configparser.ConfigParser(allow_no_value=True).read("%s")'
  become: true
  register: nut_server_upsd_users
  tags:
    - nut_server

- name: Configure nut hosts.conf  # noqa: require-validate
  when: not (ansible_check_mode and nut_server_apt.changed)
  copy:
    src: hosts.conf
    dest: /etc/nut/hosts.conf
    backup: true
    owner: root
    group: root
    mode: "0644"
  become: true
  tags:
    - nut_server

- name: Configure nut upsset.conf  # noqa: require-validate
  when: not (ansible_check_mode and nut_server_apt.changed)
  copy:
    src: upsset.conf
    dest: /etc/nut/upsset.conf
    backup: true
    owner: root
    group: root
    mode: "0644"
  become: true
  tags:
    - nut_server

- name: Enable nut-driver service
  when: not (ansible_check_mode and nut_server_apt.changed)
  systemd:
    name: nut-driver@eaton.service
    enabled: true
    state: "{{ 'restarted' if nut_server_nut_conf.changed or nut_server_ups_conf.changed else 'started' }}"
  become: true
  tags:
    - nut_server

- name: Enable nut-server service
  when: not (ansible_check_mode and nut_server_apt.changed)
  systemd:
    name: nut-server.service
    enabled: true
    state: >-
      {{ 'restarted'
         if nut_server_nut_conf.changed or nut_server_upsd_conf.changed or nut_server_upsd_users.changed
         else 'started' }}
  become: true
  tags:
    - nut_server

- name: Configure nginx
  import_role:
    name: nginx
    tasks_from: site
  vars:
    nginx_site_args:
      subdomain: nut
      auth: required
      server_conf: |
        location = / {
          return 301 /upsstats.cgi;
        }
      location_conf: |
        gzip off;
        root /usr/lib/cgi-bin/nut;

        # Hand only *.cgi requests to fcgiwrap, which exec's SCRIPT_FILENAME
        # directly -- an unscoped pass would run whatever file an arbitrary
        # path resolves to under the cgi-bin root. auth_request is inherited
        # from the enclosing `location /`, so this stays Authelia-gated.
        location ~ \.cgi$ {
          include /etc/nginx/fastcgi_params;

          fastcgi_pass  unix:/var/run/fcgiwrap.socket;
          fastcgi_param SCRIPT_FILENAME  /usr/lib/cgi-bin/nut$fastcgi_script_name;
        }
  tags:
    - nut_server
