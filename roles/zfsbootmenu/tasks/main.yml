- name: Create ZBM directory
  file:
    dest: /boot/efi/EFI/ZBM/
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true
  register: zfsbootmenu_zbm_directory
  tags:
    - zfsbootmenu

- name: Create ZBM artifact cache directory
  file:
    dest: "{{ zfsbootmenu_cache_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true
  register: zfsbootmenu_cache_directory
  tags:
    - zfsbootmenu

- name: Download zfsbootmenu bundle
  when:
    - not (ansible_check_mode and zfsbootmenu_cache_directory.changed)
  get_url:
    url: "{{ zfsbootmenu_artifact.url }}"
    checksum: "sha256:{{ zfsbootmenu_artifact.sha256_url }}"
    dest: "{{ zfsbootmenu_tarball_path }}"
    mode: "0644"
    owner: root
    group: root
    timeout: 120
  become: true
  register: zfsbootmenu_bundle
  retries: 3
  delay: 5
  until: zfsbootmenu_bundle is succeeded
  tags:
    - zfsbootmenu

- name: Extract zfsbootmenu bundle
  when:
    - not (ansible_check_mode and zfsbootmenu_cache_directory.changed)
  unarchive:
    src: "{{ zfsbootmenu_tarball_path }}"
    dest: "{{ zfsbootmenu_cache_dir }}"
    remote_src: true
    creates: "{{ zfsbootmenu_cache_dir }}/zfsbootmenu.EFI"
    owner: root
    group: root
  become: true
  register: zfsbootmenu_extract
  tags:
    - zfsbootmenu

# rEFInd LoadOptions replace the cmdline embedded in the unified EFI image, so
# keep the bundle cmdline beside it for rEFInd to pass explicitly on every arch.
# No backup: true — /boot/efi is vfat; backup_local's chown fails on FAT.
- name: Install common ZBM artifacts  # noqa: require-backup
  when:
    - not (ansible_check_mode and (zfsbootmenu_cache_directory.changed or zfsbootmenu_zbm_directory.changed or zfsbootmenu_extract.changed))
  copy:
    src: "{{ zfsbootmenu_cache_dir }}/{{ item.src }}"
    dest: "/boot/efi/EFI/ZBM/{{ item.dest }}"
    remote_src: true
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - src: zfsbootmenu.EFI
      dest: VMLINUZ.EFI
      mode: "0755"
    - src: cmdline
      dest: cmdline
      mode: "0644"
  loop_control:
    label: "{{ item.dest }}"
  become: true
  register: zfsbootmenu_common_artifact_install
  tags:
    - zfsbootmenu

# No backup: true — /boot/efi is vfat; backup_local's chown fails on FAT.
- name: Install aarch64 ZBM components  # noqa: require-backup
  when:
    - ansible_architecture == "aarch64"
    - not (ansible_check_mode and (zfsbootmenu_cache_directory.changed or zfsbootmenu_zbm_directory.changed or zfsbootmenu_extract.changed))
  copy:
    src: "{{ zfsbootmenu_cache_dir }}/{{ item }}"
    dest: "/boot/efi/EFI/ZBM/{{ item }}"
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  loop:
    - initramfs-bootmenu.img
    - vmlinux-bootmenu
  loop_control:
    label: "{{ item }}"
  become: true
  register: zfsbootmenu_aarch64_component_install
  tags:
    - zfsbootmenu

# Seed the backup loader the refind fallback menuentry (VMLINUZ-BACKUP.EFI)
# boots. Copy-if-absent (force: false) so a later primary update never clobbers
# the known-good backup.
# No backup: true — /boot/efi is vfat; backup_local's chown fails on FAT.
- name: Seed ZBM backup loader  # noqa: require-backup
  when:
    - not (ansible_check_mode and (zfsbootmenu_cache_directory.changed or zfsbootmenu_zbm_directory.changed or zfsbootmenu_extract.changed or zfsbootmenu_common_artifact_install.changed))
  copy:
    src: /boot/efi/EFI/ZBM/VMLINUZ.EFI
    dest: /boot/efi/EFI/ZBM/VMLINUZ-BACKUP.EFI
    remote_src: true
    force: false
    owner: root
    group: root
    mode: "0755"
  become: true
  tags:
    - zfsbootmenu

- name: Ask to reboot
  when:
    - >-
      zfsbootmenu_common_artifact_install is changed
      or (zfsbootmenu_aarch64_component_install is defined and zfsbootmenu_aarch64_component_install is changed)
  file:
    path: /var/run/reboot-required
    state: touch
    owner: root
    group: root
    mode: "0644"
  become: true
  tags:
    - zfsbootmenu
