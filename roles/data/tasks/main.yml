- name: Configure data datasets
  include_role:
    name: zfs_dataset
    tasks_from: dataset
    public: false
    apply:
      tags:
        - data
  vars:
    zfs_dataset_args:
      dataset: "tank/{{ data_dataset.name }}"
      mountpoint: "{{ data_dataset.mountpoint }}"
      extra_properties: "{{ data_extra_properties }}"
  loop: "{{ data_datasets }}"
  loop_control:
    loop_var: data_dataset
    label: "tank/{{ data_dataset.name }}"
  tags:
    - data
