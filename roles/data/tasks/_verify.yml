# Verify each site dataset owns the properties used by its mount and backup
# contracts rather than inheriting matching values.

- name: _verify | Expected properties set locally
  when: zfs_root
  vars:
    data_expected_properties: >-
      {{ {'mountpoint': item.mountpoint} | combine(data_extra_properties) }}
  command:
    argv:
      - zfs
      - get
      - -H
      - -p
      - -s
      - local
      - -o
      - property,value
      - "{{ data_expected_properties.keys() | join(',') }}"
      - "{{ zfs_tank_filesystem }}/{{ item.name }}"
  register: data_verify_properties
  changed_when: false
  failed_when: >-
    (data_verify_properties.stdout_lines | sort)
    != (data_expected_properties.items() | map('join', '\t') | sort)
  loop: '{{ data_datasets }}'
  loop_control:
    label: '{{ zfs_tank_filesystem }}/{{ item.name }}'
  become: true

- name: _verify | Dataset mount contract passes
  when: zfs_root
  command:
    argv:
      - /usr/local/bin/zfs_check_mount
      - "{{ zfs_tank_filesystem }}/{{ item.name }}"
      - "{{ item.mountpoint }}"
  changed_when: false
  loop: '{{ data_datasets }}'
  loop_control:
    label: '{{ item.mountpoint }} <- {{ zfs_tank_filesystem }}/{{ item.name }}'
  become: true

- name: _verify | Mountpoint is writable as ansible_user_id
  command:
    argv:
      - python3
      - -c
      - |
        import sys
        from tempfile import TemporaryFile

        with TemporaryFile(dir=sys.argv[1]) as probe:
            probe.write(b"data write probe\n")
            probe.flush()
      - "{{ item.mountpoint }}"
  loop: '{{ data_datasets }}'
  loop_control:
    label: "{{ item.mountpoint }}"
  changed_when: false
  become: false
