# Functional verify for the three site datasets created by main.yml.
#
# An idempotent converge is not evidence extra_properties actually
# landed -- community.general.zfs treats a property whose source is
# anything other than local|received|- as absent, so a property
# silently inherited from a parent dataset can read back as the right
# value while never being set locally. `zfs get` is the only reliable
# witness. Source must be `local`, not just the right value:
# zfs-autobackup's picker filters with `-s local`
# (roles/zfs_autobackup/templates/zfs_autosnapshot.sh.j2:14), so an
# inherited `autobackup:bak=true` would test-pass but never get backed
# up. Asserting `local` for the mountpoint as well as the extra
# properties keeps the role's "I set this explicitly" contract honest.

- name: _verify | Expected properties set locally
  when: zfs_root
  vars:
    data_expected_properties: >-
      {{ {'mountpoint': item.mountpoint} | combine(data_extra_properties) }}
  command:
    argv:
      - zfs
      - get
      - -H
      - -p
      - -s
      - local
      - -o
      - property,value
      - "{{ data_expected_properties.keys() | join(',') }}"
      - "{{ data_pool }}/{{ item.name }}"
  register: data_verify_properties
  changed_when: false
  failed_when: >-
    (data_verify_properties.stdout_lines | sort)
    != (data_expected_properties.items() | map('join', '\t') | sort)
  loop: '{{ data_datasets }}'
  loop_control:
    label: '{{ data_pool }}/{{ item.name }}'
  become: true

- name: _verify | Dataset mount contract passes
  when: zfs_root
  command:
    argv:
      - /usr/local/bin/zfs_check_mount
      - "{{ data_pool }}/{{ item.name }}"
      - "{{ item.mountpoint }}"
  changed_when: false
  loop: '{{ data_datasets }}'
  loop_control:
    label: '{{ item.mountpoint }} <- {{ data_pool }}/{{ item.name }}'
  become: true

- name: _verify | Mountpoint is writable as ansible_user_id
  when: zfs_root
  command:
    argv:
      - python3
      - -c
      - |
        import sys
        from tempfile import TemporaryFile

        with TemporaryFile(dir=sys.argv[1]) as probe:
            probe.write(b"data write probe\n")
            probe.flush()
      - "{{ item.mountpoint }}"
  loop: '{{ data_datasets }}'
  loop_control:
    label: "{{ item.mountpoint }}"
  changed_when: false
  become: false
