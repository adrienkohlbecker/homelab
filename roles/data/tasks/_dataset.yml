# Dynamic inclusion binds item before the imported role's inline vars are
# evaluated; those task-scoped vars also prevent zfs_dataset_args from leaking
# into later helper calls.
- name: _dataset | Configure dataset for {{ item.name }}
  import_role:
    name: zfs_dataset
    tasks_from: dataset
  vars:
    zfs_dataset_args:
      dataset: "tank/{{ item.name }}"
      mountpoint: "{{ item.mountpoint }}"
      extra_properties: "{{ data_extra_properties }}"
