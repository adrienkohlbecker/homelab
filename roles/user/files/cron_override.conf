[Service]
# Cron's per-job PAM session open/close records add no state beyond the
# command output they surround. PAM session errors still reach the journal.
#
# systemd before 258 matches syslog-transport messages before stripping the
# timestamp and "CRON[pid]: " identifier, so the pattern allows that prefix.
# It excludes parentheses so it cannot reach into a job's "(user) CMD (...)"
# text, which any crontab user controls.
LogFilterPatterns=~^([^()]*: )?pam_unix[(]cron:session[)]: session (opened|closed) for user
