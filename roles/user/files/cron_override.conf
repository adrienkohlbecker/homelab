[Service]
# Cron's per-job PAM session records and sysstat command announcement add no
# state beyond the command output and sysstat data they surround.
LogFilterPatterns=~^pam_unix[(]cron:session[)]
LogFilterPatterns=~^[(]root[)] CMD [(]command -v debian-sa1 > /dev/null && debian-sa1 (1 1|60 2)[)]$
