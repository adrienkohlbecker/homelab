[Service]
# Cron's per-job PAM session records and sysstat command announcement add no
# state beyond the command output and sysstat data they surround. Noble's
# sysstat cron job runs every ten minutes even with collection disabled.
#
# systemd before 258 matches syslog-transport messages before stripping the
# timestamp and "CRON[pid]: " identifier, so each pattern anchors either at the
# start or after that prefix. The filter applies from cron's next start.
LogFilterPatterns=~(^|: )pam_unix[(]cron:session[)]
LogFilterPatterns=~(^|: )[(]root[)] CMD [(]command -v debian-sa1 > /dev/null && debian-sa1 (1 1|60 2)[)]$
