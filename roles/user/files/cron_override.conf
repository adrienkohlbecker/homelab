[Service]
# Cron's per-job PAM session open/close records and sysstat command
# announcement add no state beyond the command output and sysstat data they
# surround. PAM session errors still reach the journal. Noble's sysstat cron
# job runs every ten minutes even with collection disabled.
#
# systemd before 258 matches syslog-transport messages before stripping the
# timestamp and "CRON[pid]: " identifier, so each pattern allows that prefix.
# It excludes parentheses so it cannot reach into a job's "(user) CMD (...)"
# text, which any crontab user controls. The filter applies from cron's next
# start.
LogFilterPatterns=~^([^()]*: )?pam_unix[(]cron:session[)]: session (opened|closed) for user
LogFilterPatterns=~^([^()]*: )?[(]root[)] CMD [(]command -v debian-sa1 > /dev/null && debian-sa1 (1 1|60 2)[)]$
