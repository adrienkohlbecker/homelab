- name: _verify | Login shell is zsh
  command: getent passwd {{ ansible_user_id }}
  changed_when: false
  register: _user_getent
  failed_when: _user_getent.rc != 0 or not _user_getent.stdout.endswith('/zsh')

- name: _verify | Member of adm group
  command: id -nG {{ ansible_user_id }}
  changed_when: false
  register: _user_groups
  failed_when: >-
    _user_groups.rc != 0
    or 'adm' not in _user_groups.stdout.split()

- name: _verify | Ghostty terminfo is compiled
  command: infocmp xterm-ghostty
  changed_when: false

- name: _verify | Passwordless sudo works
  command: sudo -n true
  changed_when: false

- name: _verify | EDAC monitoring service is active  # noqa: command-instead-of-module
  command: systemctl is-active edac.service
  changed_when: false
  become: true

- name: _verify | Check whether cron is installed
  stat:
    path: /usr/lib/systemd/system/cron.service
  register: _user_cron_unit

# The sysstat job runs its real command line so the filter sees the exact
# announcement. The delayed marker job proves cron's syslog lines still reach
# the journal and bounds the wait for the filtered lines.
- name: _verify | Cron housekeeping stays out of the journal
  when: _user_cron_unit.stat.exists
  become: true
  block:
    - name: _verify | Record the journal start time
      command: date +%s
      register: _user_cron_since
      changed_when: false

    - name: _verify | Schedule housekeeping and marker cron jobs
      copy:
        dest: /etc/cron.d/user_verify_cron_filter
        content: |
          * * * * * root command -v debian-sa1 > /dev/null && debian-sa1 1 1
          * * * * * root sleep 3 && logger -t user_verify_cron_filter done
        mode: "0644"

    - name: _verify | Wait for the marker job
      command: journalctl -t user_verify_cron_filter --since @{{ _user_cron_since.stdout }} -o cat
      register: _user_cron_marker
      changed_when: false
      until: "'done' in _user_cron_marker.stdout_lines"
      retries: 30
      delay: 5

    - name: _verify | Read cron messages
      command: journalctl -u cron.service --since @{{ _user_cron_since.stdout }} -o cat
      register: _user_cron_journal
      changed_when: false

    - name: _verify | Only unfiltered cron messages were stored
      assert:
        that:
          - "'(root) CMD (sleep 3 && logger -t user_verify_cron_filter done)' in _user_cron_journal.stdout_lines"
          - "_user_cron_journal.stdout is not search('pam_unix[(]cron:session[)]')"
          - "'debian-sa1' not in _user_cron_journal.stdout"
        fail_msg: "{{ _user_cron_journal.stdout_lines }}"
  always:
    - name: _verify | Remove the verification cron jobs
      file:
        path: /etc/cron.d/user_verify_cron_filter
        state: absent

# Resolute's postinst takes one background sample when collection is enabled.
- name: _verify | Sysstat keeps no activity history
  command: sar
  register: _user_sar
  changed_when: false
  failed_when: _user_sar.rc == 0 or (_user_sar.stdout + _user_sar.stderr) is not search('No such file')

# Shell startup needs these binaries; verification must not install missing tools.
- name: _verify | Mise tools execute without installing
  environment:
    HOME: "{{ ansible_user_dir }}"
    MISE_EXEC_AUTO_INSTALL: "false"
  block:
    - name: _verify | Load-bearing mise tools execute
      command: /usr/bin/mise exec -- {{ item }} --version
      changed_when: false
      loop:
        - zoxide
        - atuin

    - name: _verify | A missing tool fails without being reinstalled
      command:
        argv:
          - python3
          - -c
          - |
            from pathlib import Path
            import shutil
            import subprocess
            import tempfile

            version = Path(subprocess.check_output(["/usr/bin/mise", "where", "zoxide"], text=True).strip())
            with tempfile.TemporaryDirectory(dir=version.parent) as temp:
                saved = Path(temp) / "installed"
                version.rename(saved)
                try:
                    result = subprocess.run(
                        ["/usr/bin/mise", "exec", "--", "zoxide", "--version"],
                        capture_output=True, text=True, timeout=60,
                    )
                    assert result.returncode != 0, "Missing zoxide unexpectedly executed"
                    assert not version.exists(), "Verification reinstalled zoxide"
                finally:
                    # Discard only a test-triggered reinstall before restoring the original.
                    if version.exists():
                        shutil.rmtree(version)
                    saved.rename(version)
      changed_when: false

- name: _verify | Locate zoxide for the missing-tool fixture
  command: /usr/bin/mise where zoxide
  register: _user_zoxide_path
  changed_when: false

# Reproduce Resolute's postinst on upgrade from Noble (LP: #2073285); the Stow
# reconverges below must turn collection back off.
- name: _verify | Re-enable sysstat collection as the Noble upgrade does
  become: true
  block:
    - name: _verify | Set collection on
      lineinfile:
        path: /etc/default/sysstat
        regexp: ^ENABLED=
        line: ENABLED="true"

    - name: _verify | Enable and start the collection units  # noqa: command-instead-of-module
      command: systemctl enable --now sysstat.service
      changed_when: true

# Stow must reject conflicts without installing tools ahead of the explicit installer.
- name: _verify | Stow rejects conflicts and recovers incomplete deployment
  block:
    - name: _verify | Remove the zshrc link
      file:
        path: "{{ ansible_user_dir }}/.zshrc"
        state: absent

    - name: _verify | Create a conflicting zshrc
      copy:
        dest: "{{ ansible_user_dir }}/.zshrc"
        content: "Stow conflict fixture\n"
        mode: "0644"

    - name: _verify | Remove zoxide to exercise installation during reconverge
      file:
        path: "{{ _user_zoxide_path.stdout }}"
        state: absent

    - name: _verify | Converge with the conflict
      import_role:
        name: user

    - name: _verify | A conflicting file must fail deployment
      fail:
        msg: Stow accepted a conflicting zshrc
  rescue:
    - name: _verify | Failure came from the Stow conflict
      assert:
        that:
          - ansible_failed_task.name == 'Deploy dotfiles into $HOME (mise stow task)'
          - "'would cause conflicts' in ansible_failed_result.stderr"

    - name: _verify | Stow left tool installation to the installer
      command: /usr/bin/mise ls --missing --json
      register: _user_missing_after_stow
      changed_when: false
      failed_when: "'zoxide' not in (_user_missing_after_stow.stdout | from_json)"
  always:
    - name: _verify | Remove the conflict
      file:
        path: "{{ ansible_user_dir }}/.zshrc"
        state: absent

    - name: _verify | Converge to repair the missing link
      import_role:
        name: user

- name: _verify | Link repair and tool installation report changes
  assert:
    that:
      - user_dotfiles_stow.changed
      - user_mise_tools.changed

- name: _verify | No sysstat timer is scheduled  # noqa: command-instead-of-module
  command: systemctl list-timers --plain --no-legend sysstat*
  register: _user_sysstat_timers
  changed_when: false
  failed_when: _user_sysstat_timers.stdout | length > 0

- name: _verify | No sysstat unit starts at boot  # noqa: command-instead-of-module
  command: systemctl list-unit-files --state=enabled --no-legend sysstat*
  register: _user_sysstat_enabled
  changed_when: false
  failed_when: _user_sysstat_enabled.stdout | length > 0

# Noble's cron job and Resolute's unit conditions both source this file.
- name: _verify | Collectors see collection disabled
  command:
    argv: [ sh, -c, '. /etc/default/sysstat && test "$ENABLED" = false' ]
  changed_when: false

- name: _verify | Remove generated completions to exercise shell bootstrap
  file:
    path: "{{ ansible_user_dir }}/.local/share/mise/completions"
    state: absent

- name: _verify | Interactive shell generates and loads mise completion
  command:
    argv:
      - zsh
      - -ic
      - '[[ ${_comps[mise]} == _mise ]] && autoload -Uz +X _mise'
  environment:
    TERM: xterm-256color
  changed_when: false

- name: _verify | Dotfiles deployed (zshrc is a symlink)
  stat:
    path: "{{ ansible_user_dir }}/.zshrc"
  register: _user_zshrc
  failed_when: >-
    not (_user_zshrc.stat.exists | default(false))
    or not (_user_zshrc.stat.islnk | default(false))

- name: _verify | 1Password CLI is installed
  command: op --version
  changed_when: false
  register: _user_op_version
  failed_when: _user_op_version.rc != 0 or _user_op_version.stdout | length == 0

- name: _verify | Operator GPG public key is imported
  command: gpg --with-colons --list-keys C248DE6357445D6302F9A62E74BFD03C20CC21AF
  changed_when: false
