- name: _verify | Login shell is zsh
  command:
    argv:
      - su
      - --login
      - "{{ ansible_user_id }}"
      - --command
      - test -n "$ZSH_VERSION"
  changed_when: false
  become: true

# sudo initializes the supplementary groups, so adm applies without a new login.
- name: _verify | The adm group grants the system journal without sudo
  command: journalctl --system --lines 1 --quiet
  register: _user_journal
  changed_when: false
  failed_when: _user_journal.rc != 0 or _user_journal.stdout | length == 0
  become: true
  become_user: "{{ ansible_user_id }}"

- name: _verify | Ghostty terminfo resolves
  command: infocmp xterm-ghostty
  changed_when: false

- name: _verify | Passwordless sudo works
  command: sudo -n true
  changed_when: false

- name: _verify | Locate zoxide
  command: /usr/bin/mise where zoxide
  register: _user_zoxide_path
  changed_when: false

- name: _verify | Remove the zshrc link and zoxide
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ ansible_user_dir }}/.zshrc"
    - "{{ _user_zoxide_path.stdout }}"

- name: _verify | Converge to repair the deployment
  import_role:
    name: user

# The installer counts tools still missing after the stow task, so its change
# also proves stow left tool installation to it.
- name: _verify | Link repair and tool installation report changes
  assert:
    that:
      - user_dotfiles_stow.changed
      - user_mise_tools.changed

# Shell startup needs these binaries; verification must not install missing tools.
- name: _verify | Load-bearing mise tools execute
  command: /usr/bin/mise exec -- {{ item }} --version
  environment:
    MISE_EXEC_AUTO_INSTALL: "false"
  changed_when: false
  loop:
    - zoxide
    - atuin

- name: _verify | Remove generated completions to exercise shell bootstrap
  file:
    path: "{{ ansible_user_dir }}/.local/share/mise/completions"
    state: absent

- name: _verify | Interactive shell generates and loads mise completion
  command:
    argv:
      - zsh
      - -ic
      - '[[ ${_comps[mise]} == _mise ]] && autoload -Uz +X _mise'
  environment:
    TERM: xterm-256color
  changed_when: false

- name: _verify | 1Password CLI runs
  command: op --version
  changed_when: false

- name: _verify | Operator GPG public key is imported
  command: gpg --with-colons --list-keys C248DE6357445D6302F9A62E74BFD03C20CC21AF
  changed_when: false
