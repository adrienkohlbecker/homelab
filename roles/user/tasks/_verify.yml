- name: _verify | Login shell is zsh
  command: getent passwd {{ ansible_user_id }}
  changed_when: false
  register: _user_getent
  failed_when: _user_getent.rc != 0 or not _user_getent.stdout.endswith('/zsh')

- name: _verify | Member of adm and kvm groups
  command: id -nG {{ ansible_user_id }}
  changed_when: false
  register: _user_groups
  failed_when: >-
    _user_groups.rc != 0
    or 'adm' not in _user_groups.stdout.split()
    or 'kvm' not in _user_groups.stdout.split()

- name: _verify | Ghostty terminfo is compiled
  command: infocmp xterm-ghostty
  changed_when: false

- name: _verify | Passwordless sudo works
  command: sudo -n true
  changed_when: false

# `mise ls --installed` lists registry entries even when a tool's binary
# failed to download; .zshrc eval-loads zoxide and atuin unconditionally, so a
# listed-but-broken binary breaks every fleet shell. Execute the two
# load-bearing tools to prove the binaries actually run, not just that mise
# knows about them.
- name: _verify | Load-bearing mise tools execute
  command: /usr/bin/mise exec -- {{ item }} --version
  environment:
    HOME: "{{ ansible_user_dir }}"
  changed_when: false
  loop:
    - zoxide
    - atuin

- name: _verify | Dotfiles deployed (zshrc is a symlink)
  stat:
    path: "{{ ansible_user_dir }}/.zshrc"
  register: _user_zshrc
  failed_when: >-
    not (_user_zshrc.stat.exists | default(false))
    or not (_user_zshrc.stat.islnk | default(false))

- name: _verify | 1Password CLI is installed
  command: op --version
  changed_when: false
  register: _user_op_version
  failed_when: _user_op_version.rc != 0 or _user_op_version.stdout | length == 0

- name: _verify | Operator GPG public key is imported
  command: gpg --with-colons --list-keys C248DE6357445D6302F9A62E74BFD03C20CC21AF
  changed_when: false
