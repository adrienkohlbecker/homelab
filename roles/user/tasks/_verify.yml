- name: _verify | Login shell is zsh
  command: getent passwd {{ ansible_user_id }}
  changed_when: false
  register: _user_getent
  failed_when: _user_getent.rc != 0 or not _user_getent.stdout.endswith('/zsh')

- name: _verify | Member of adm group
  command: id -nG {{ ansible_user_id }}
  changed_when: false
  register: _user_groups
  failed_when: >-
    _user_groups.rc != 0
    or 'adm' not in _user_groups.stdout.split()

- name: _verify | Ghostty terminfo is compiled
  command: infocmp xterm-ghostty
  changed_when: false

- name: _verify | Passwordless sudo works
  command: sudo -n true
  changed_when: false

- name: _verify | EDAC monitoring service is active  # noqa: command-instead-of-module
  command: systemctl is-active edac.service
  changed_when: false
  become: true

- name: _verify | Check whether cron is installed
  stat:
    path: /usr/lib/systemd/system/cron.service
  register: _user_cron_unit

# The delayed marker job runs outside cron's cgroup, so it bounds the wait
# without passing through the filter. A PAM session error must still get
# through; journald attributes it to cron by the sender's cgroup, read from
# /proc on receipt, so logger stays alive on open stdin until then. The job run
# as nobody embeds the filtered phrase in its command text, which any crontab
# user controls; its CMD record must still be logged. It sleeps so the logging
# cron child is still alive when journald attributes the record to
# cron.service, where the filter applies. Records are read by the CRON
# identifier, not the unit, so one journald could not attribute still counts.
- name: _verify | Cron PAM session records stay out of the journal
  when: _user_cron_unit.stat.exists
  become: true
  vars:
    _user_pam_error: "pam_unix(cron:session): close_session - error recovering username"
    _user_pam_mimic: "(nobody) CMD (sleep 3 # : pam_unix(cron:session): session opened for user)"
  block:
    - name: _verify | Record the journal start time
      command: date +%s
      register: _user_cron_since
      changed_when: false

    - name: _verify | Schedule PAM-session and marker cron jobs
      copy:
        dest: /etc/cron.d/user_verify_cron_filter
        content: |
          * * * * * root sleep 3 && logger -t user_verify_cron_filter done
          * * * * * nobody sleep 3 # : pam_unix(cron:session): session opened for user
        mode: "0644"

    - name: _verify | Wait for the marker job
      command: journalctl -t user_verify_cron_filter --since @{{ _user_cron_since.stdout }} -o cat
      register: _user_cron_marker
      changed_when: false
      until: "'done' in _user_cron_marker.stdout_lines"
      retries: 30
      delay: 5

    - name: _verify | Log a PAM session error from cron's cgroup
      command:
        argv:
          - sh
          - -c
          - echo $$ > /sys/fs/cgroup/system.slice/cron.service/cgroup.procs && { echo "$0"; sleep 2; } | logger -t CRON
          - "{{ _user_pam_error }}"
      changed_when: false

    - name: _verify | Read cron messages
      command: journalctl -t CRON --since @{{ _user_cron_since.stdout }} -o cat
      register: _user_cron_journal
      changed_when: false
      until: _user_pam_error in _user_cron_journal.stdout_lines
      retries: 5
      delay: 1

    - name: _verify | Only PAM session records were dropped
      assert:
        that:
          - _user_cron_journal.stdout is search('(?m)^[(]root[)] CMD [(]sleep 3 && logger ')
          - _user_pam_error in _user_cron_journal.stdout_lines
          - _user_pam_mimic in _user_cron_journal.stdout_lines
          - "_user_cron_journal.stdout is not search('(?m)^pam_unix[(]cron:session[)]: session (opened|closed)')"
        fail_msg: "{{ _user_cron_journal.stdout_lines }}"
  always:
    - name: _verify | Remove the verification cron jobs
      file:
        path: /etc/cron.d/user_verify_cron_filter
        state: absent

# Resolute's postinst takes one background sample when collection is enabled.
- name: _verify | Sysstat keeps no activity history
  command: sar
  register: _user_sar
  changed_when: false
  failed_when: _user_sar.rc == 0 or (_user_sar.stdout + _user_sar.stderr) is not search('No such file')

# Noble ships the removed cron job as a conffile. A reinstall must leave it
# deleted, as an upgrade does, rather than bring its CMD records back.
- name: _verify | The sysstat cron job stays removed across a reinstall
  become: true
  block:
    - name: _verify | Read the sysstat conffiles
      command:
        argv:
          - dpkg-query
          - --showformat=${Conffiles}
          - --show
          - sysstat
      register: _user_sysstat_conffiles
      changed_when: false

    # The apt module cannot reinstall an installed package.
    - name: _verify | Reinstall sysstat  # noqa: command-instead-of-module
      when: _user_sysstat_conffiles.stdout is search('(?m)^ /etc/cron[.]d/sysstat ')
      command: apt-get install --reinstall --yes sysstat
      environment:
        DEBIAN_FRONTEND: noninteractive
      changed_when: true

    - name: _verify | Read the sysstat cron job
      when: _user_sysstat_conffiles.stdout is search('(?m)^ /etc/cron[.]d/sysstat ')
      stat:
        path: /etc/cron.d/sysstat
      register: _user_sysstat_cron

    - name: _verify | Dpkg left the sysstat cron job deleted
      when: _user_sysstat_conffiles.stdout is search('(?m)^ /etc/cron[.]d/sysstat ')
      assert:
        that:
          - not _user_sysstat_cron.stat.exists

# Shell startup needs these binaries; verification must not install missing tools.
- name: _verify | Mise tools execute without installing
  environment:
    HOME: "{{ ansible_user_dir }}"
    MISE_EXEC_AUTO_INSTALL: "false"
  block:
    - name: _verify | Load-bearing mise tools execute
      command: /usr/bin/mise exec -- {{ item }} --version
      changed_when: false
      loop:
        - zoxide
        - atuin

    - name: _verify | A missing tool fails without being reinstalled
      command:
        argv:
          - python3
          - -c
          - |
            from pathlib import Path
            import shutil
            import subprocess
            import tempfile

            version = Path(subprocess.check_output(["/usr/bin/mise", "where", "zoxide"], text=True).strip())
            with tempfile.TemporaryDirectory(dir=version.parent) as temp:
                saved = Path(temp) / "installed"
                version.rename(saved)
                try:
                    result = subprocess.run(
                        ["/usr/bin/mise", "exec", "--", "zoxide", "--version"],
                        capture_output=True, text=True, timeout=60,
                    )
                    assert result.returncode != 0, "Missing zoxide unexpectedly executed"
                    assert not version.exists(), "Verification reinstalled zoxide"
                finally:
                    # Discard only a test-triggered reinstall before restoring the original.
                    if version.exists():
                        shutil.rmtree(version)
                    saved.rename(version)
      changed_when: false

- name: _verify | Locate zoxide for the missing-tool fixture
  command: /usr/bin/mise where zoxide
  register: _user_zoxide_path
  changed_when: false

# Reproduce Resolute's postinst on upgrade from Noble (LP: #2073285); the Stow
# reconverges below must turn collection back off.
- name: _verify | Re-enable sysstat collection as the Noble upgrade does
  become: true
  block:
    - name: _verify | Set collection on
      lineinfile:
        path: /etc/default/sysstat
        regexp: ^ENABLED=
        line: ENABLED="true"

    - name: _verify | Enable and start the collection units  # noqa: command-instead-of-module
      command: systemctl enable --now sysstat.service
      changed_when: true

# Stow must reject conflicts without installing tools ahead of the explicit installer.
- name: _verify | Stow rejects conflicts and recovers incomplete deployment
  block:
    - name: _verify | Remove the zshrc link
      file:
        path: "{{ ansible_user_dir }}/.zshrc"
        state: absent

    - name: _verify | Create a conflicting zshrc
      copy:
        dest: "{{ ansible_user_dir }}/.zshrc"
        content: "Stow conflict fixture\n"
        mode: "0644"

    - name: _verify | Remove zoxide to exercise installation during reconverge
      file:
        path: "{{ _user_zoxide_path.stdout }}"
        state: absent

    - name: _verify | Converge with the conflict
      import_role:
        name: user

    - name: _verify | A conflicting file must fail deployment
      fail:
        msg: Stow accepted a conflicting zshrc
  rescue:
    - name: _verify | Failure came from the Stow conflict
      assert:
        that:
          - ansible_failed_task.name == 'Deploy dotfiles into $HOME (mise stow task)'
          - "'would cause conflicts' in ansible_failed_result.stderr"

    - name: _verify | Stow left tool installation to the installer
      command: /usr/bin/mise ls --missing --json
      register: _user_missing_after_stow
      changed_when: false
      failed_when: "'zoxide' not in (_user_missing_after_stow.stdout | from_json)"
  always:
    - name: _verify | Remove the conflict
      file:
        path: "{{ ansible_user_dir }}/.zshrc"
        state: absent

    - name: _verify | Converge to repair the missing link
      import_role:
        name: user

- name: _verify | Link repair and tool installation report changes
  assert:
    that:
      - user_dotfiles_stow.changed
      - user_mise_tools.changed

- name: _verify | No sysstat timer is scheduled  # noqa: command-instead-of-module
  command: systemctl list-timers --plain --no-legend sysstat*
  register: _user_sysstat_timers
  changed_when: false
  failed_when: _user_sysstat_timers.stdout | length > 0

- name: _verify | No sysstat unit starts at boot  # noqa: command-instead-of-module
  command: systemctl list-unit-files --state=enabled --no-legend sysstat*
  register: _user_sysstat_enabled
  changed_when: false
  failed_when: _user_sysstat_enabled.stdout | length > 0

# The simulated upgrade wrote a boot record into today's file. Run Resolute's
# timer unit, which gates on ENABLED (Noble's collects whenever its disabled
# timers fire), then every hook as systemd-sleep does around a suspend. None
# may add a record. run-parts would skip sysstat.sleep for its dotted name.
- name: _verify | Disabled collectors add no records
  become: true
  block:
    - name: _verify | Locate today's sysstat data file
      command: date +/var/log/sysstat/sa%d
      register: _user_sa_file
      changed_when: false

    - name: _verify | Record the data file before collecting
      stat:
        path: "{{ _user_sa_file.stdout }}"
      register: _user_sa_before

    - name: _verify | Check for the Noble cron wrapper
      stat:
        path: /usr/lib/sysstat/debian-sa1
      register: _user_debian_sa1

    - name: _verify | Run the Resolute timer collector  # noqa: command-instead-of-module
      when: not _user_debian_sa1.stat.exists
      command: systemctl start sysstat-collect.service
      changed_when: false

    - name: _verify | Run the sleep hooks around a suspend
      command:
        argv:
          - sh
          - -c
          - for phase in pre post; do for hook in /usr/lib/systemd/system-sleep/*; do [ -x "$hook" ] && "$hook" "$phase" suspend; done; done; true
      changed_when: false

    - name: _verify | Record the data file after collecting
      stat:
        path: "{{ _user_sa_file.stdout }}"
      register: _user_sa_after

    - name: _verify | The data file is unchanged
      assert:
        that:
          - _user_sa_before.stat.exists
          - _user_sa_after.stat.checksum == _user_sa_before.stat.checksum

- name: _verify | Remove generated completions to exercise shell bootstrap
  file:
    path: "{{ ansible_user_dir }}/.local/share/mise/completions"
    state: absent

- name: _verify | Interactive shell generates and loads mise completion
  command:
    argv:
      - zsh
      - -ic
      - '[[ ${_comps[mise]} == _mise ]] && autoload -Uz +X _mise'
  environment:
    TERM: xterm-256color
  changed_when: false

- name: _verify | Dotfiles deployed (zshrc is a symlink)
  stat:
    path: "{{ ansible_user_dir }}/.zshrc"
  register: _user_zshrc
  failed_when: >-
    not (_user_zshrc.stat.exists | default(false))
    or not (_user_zshrc.stat.islnk | default(false))

- name: _verify | 1Password CLI is installed
  command: op --version
  changed_when: false
  register: _user_op_version
  failed_when: _user_op_version.rc != 0 or _user_op_version.stdout | length == 0

- name: _verify | Operator GPG public key is imported
  command: gpg --with-colons --list-keys C248DE6357445D6302F9A62E74BFD03C20CC21AF
  changed_when: false
