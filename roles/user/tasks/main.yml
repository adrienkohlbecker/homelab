- name: Validate required inputs
  assert:
    that:
      - ssh_public_keys is defined and ssh_public_keys | length > 0
    fail_msg: >-
      ssh_public_keys must be set in host_vars/group_vars.
  tags:
    - user

- name: Install packages
  apt:
    pkg:
      - attr
      - bind9-dnsutils
      - btop
      - ccze
      - curl
      - edac-utils
      - fatrace
      - fdupes
      - git
      - git-lfs
      - gpg
      - gparted
      - htop
      - iotop
      - iperf3
      - iputils-arping
      - jq
      - lsof
      - make
      - man-db
      - mitmproxy
      - moreutils
      - mosh
      - mtr-tiny
      - ncdu
      - nmon
      - nnn
      - nvme-cli
      - pandoc
      - parallel
      - parted
      - pass
      - progress
      - psmisc
      - rsync
      - screen
      - socat
      - stow
      - strace
      - stress
      - tcpdump
      - telnet
      - tig
      - tmux
      - tree
      - usbutils
      - vim
      - zsh
    cache_valid_time: 3600
  become: true
  register: user_apt_packages
  tags:
    - user

# adm owns most of /var/log (syslog, auth.log, journal via systemd-journal),
# so membership lets the operator tail logs over SSH without sudo -- the
# diagnostic reads CLAUDE.md treats as pre-authorized. append is load-bearing:
# without it `groups:` replaces the supplementary set and would strip sudo.
- name: Set login shell and log access
  user:
    name: "{{ ansible_user_id }}"
    shell: /bin/zsh
    groups: [ adm ]
    append: true
  become: true
  tags:
    - user

# The operator connects from Ghostty (TERM=xterm-ghostty); a host that
# doesn't ship that terminfo entry leaves zsh's zle without capability
# lookups, which manifests as doubled keystrokes and runaway line redraw
# over SSH. Install system-wide so sudo/root shells inherit it too.
#
# files/xterm-ghostty is compiled from xterm-ghostty.terminfo with Ubuntu's
# `tic -x -o <dir>`, which writes it to <dir>/x/xterm-ghostty. The trailing
# slash on dest makes copy create the directory, also in check mode.
# ncurses reads entries only by name from a terminfo tree, so a lone compiled
# file has nothing to validate it.
- name: Install Ghostty terminfo  # noqa: require-validate
  copy:
    src: xterm-ghostty
    dest: /etc/terminfo/x/
    owner: root
    group: root
    mode: "0644"
    backup: true
  become: true
  tags:
    - user

# Operator log-triage helper: `journalctl ... | lognorm` masks volatile tokens
# (hashes, IPs, pids, numbers) and aggregates by frequency, collapsing a day of
# logs into a handful of patterns so the noise sources and the rare real errors
# both surface at a glance. Validate by byte-compiling the rendered copy.
- name: Install lognorm log-triage helper
  copy:
    src: lognorm
    dest: /usr/local/bin/lognorm
    owner: root
    group: root
    mode: "0755"
    backup: true
    validate: python3 -m py_compile %s
  become: true
  tags:
    - user

- name: Sudo without password
  when: ansible_user_id != "root"
  copy:
    dest: /etc/sudoers.d/{{ ansible_user_id }}
    content: "{{ ansible_user_id }} ALL=(ALL) NOPASSWD:ALL\n"
    validate: visudo -cf %s
    backup: true
    owner: root
    group: root
    mode: "0400"
  become: true
  tags:
    - user

- name: Cleanup sudoers added by cloud-init
  file:
    path: /etc/sudoers.d/90-cloud-init-users
    state: absent
  become: true
  tags:
    - user

- name: Add authorized keys
  authorized_key:
    user: "{{ ansible_user_id }}"
    key: "{{ (ssh_public_keys + '\n' + ssh_public_keys_additional) | trim }}"
    exclusive: true
  tags:
    - user

- name: Check for the operator GPG key
  command: gpg --with-colons --list-keys C248DE6357445D6302F9A62E74BFD03C20CC21AF
  register: user_gpg_check
  failed_when: false
  changed_when: false
  check_mode: false
  tags:
    - user

# Fetch over HTTPS rather than gpg --keyserver: bare HKP is port 11371
# (widely firewalled), and dirmngr hard-fails when keyserver.ubuntu.com
# resolves to an AAAA the host can't route (the qemu test net has no IPv6
# route) instead of falling back. curl rides 443 and happy-eyeballs to IPv4.
- name: Import the operator GPG public key
  when:
    - user_gpg_check.rc != 0
    - not (ansible_check_mode and user_apt_packages.changed)
  shell: |
    set -euo pipefail
    curl -fsSL "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0xC248DE6357445D6302F9A62E74BFD03C20CC21AF" | gpg --batch --import
  args:
    executable: /bin/bash
  changed_when: true
  register: user_gpg_import
  until: user_gpg_import.rc == 0
  retries: 3
  delay: 5
  tags:
    - user

# Clone direct from github.com, not mirror_github: the Nexus github proxy is a
# raw artifact proxy for release downloads and can't speak git smart-HTTP, so
# a clone through it 404s.
#
# Skip in check mode when git was only would-be-installed above: the git
# module shells out to the binary even to read status, so it hard-fails on a
# fresh host where the apt task above merely *reported* the install. Lets the
# operator dry-run the role with --check before a prod apply.
- name: Clone dotfiles repo  # noqa: latest[git]
  when: not (ansible_check_mode and user_apt_packages.changed)
  git:
    repo: https://github.com/adrienkohlbecker/dotfiles.git
    dest: "{{ ansible_user_dir }}/.dotfiles"
    update: false
  register: user_dotfiles_clone
  until: user_dotfiles_clone is not failed
  retries: 3
  delay: 5
  tags:
    - user

- name: Configure mise apt repository
  import_role:
    name: apt_source
    tasks_from: configure
  vars:
    apt_source_args:
      name: mise
      key_url: https://mise.en.dev/gpg-key.pub
      key_sha256: 91c72340c5cc84ae2ba98c1070083feacf789b0a4a3d34b2416147769e475d96
      uris: "{{ mirror_apt_mise }}"
      suites: stable
      components: main
  tags:
    - user

- name: Install mise
  when: not (ansible_check_mode and apt_source_mise_changed)
  apt:
    pkg:
      - mise
    install_recommends: false
    cache_valid_time: 3600
  become: true
  tags:
    - user

# Dotfiles own the Stow package set and flags. Its verbose actions report link
# changes; an existing mise config must not prevent repairing other missing links.
# On a fresh check run the predicted clone cannot be used as a working directory.
- name: Deploy dotfiles into $HOME (mise stow task)
  when: not (ansible_check_mode and (user_dotfiles_clone is skipped or user_dotfiles_clone.changed))
  shell: |
    set -euo pipefail
    /usr/bin/mise trust
    /usr/bin/mise run --skip-tools stow
  args:
    executable: /bin/bash
    chdir: "{{ ansible_user_dir }}/.dotfiles"
  environment:
    MISE_YES: "1"
  register: user_dotfiles_stow
  changed_when: "user_dotfiles_stow.stderr is search('(?m)^(LINK|UNLINK|MKDIR|RMDIR): ')"
  tags:
    - user

# Dotfiles own tool versions; leave MISE_ENV unset to exclude mac-only runtimes.
# Always run install for postinstall hooks and shim repair, even with no missing tools.
- name: Install mise-managed tools
  # Forward optional GitHub authentication without placing the token in argv.
  # CI provides only MISE_GITHUB_TOKEN; prefer it, as mise does. The value goes
  # out as GITHUB_TOKEN, the last name mise reads, because mise stops at the
  # first variable that is set, even when it is empty.
  environment:
    GITHUB_TOKEN: "{{ lookup('env', 'MISE_GITHUB_TOKEN') or lookup('env', 'GITHUB_TOKEN') }}"
    MISE_YES: "1"
  tags:
    - user
  block:
    - name: Find missing mise tools
      command: /usr/bin/mise ls --missing --json
      args:
        chdir: "{{ ansible_user_dir }}"
      register: user_mise_missing
      changed_when: false

    - name: Install configured mise tools
      command: /usr/bin/mise install
      args:
        chdir: "{{ ansible_user_dir }}"
      register: user_mise_tools
      changed_when: user_mise_missing.stdout | from_json | length > 0
      until: user_mise_tools is not failed
      retries: 3
      delay: 5

- name: Configure 1Password apt repository
  import_role:
    name: apt_source
    tasks_from: configure
  vars:
    apt_source_args:
      name: 1password
      key_sha256: f39e7dd9dedc581ced85732832f217e0de5860a3b80279b5af4bc7c6d8157bae
      key_url: https://downloads.1password.com/linux/keys/1password.asc
      uris: "{{ mirror_apt_1password }}"
      suites: stable
      components: main
  tags:
    - user

- name: Install 1Password CLI
  when: not (ansible_check_mode and apt_source_1password_changed)
  apt:
    pkg:
      - 1password-cli
    cache_valid_time: 3600
  become: true
  tags:
    - user
