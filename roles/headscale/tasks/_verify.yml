# Exercise the exact loopback metrics surface Netdata scrapes.
- name: _verify | Headscale serves prometheus metrics on its loopback port
  uri:
    url: http://localhost:{{ service_ports.headscale_metrics }}/metrics
    status_code: 200
    return_content: true
  register: _headscale_metrics
  failed_when: "'headscale_' not in (_headscale_metrics.content | default(''))"
  retries: 5
  delay: 1
  until: _headscale_metrics.status | default(0) == 200
  become: true

- name: _verify | Headscale /health is reachable through the nginx TLS vhost
  uri:
    url: https://headscale.{{ inventory_hostname }}.{{ domain }}/health
    validate_certs: false
    status_code: 200
  become: true

# Round-trip through CLI, gRPC, and SQLite. Ignore duplicate creation on kept VMs
# so the following read remains the functional assertion.
- name: _verify | Create a throwaway headscale user (gRPC write path)
  command: podman exec headscale headscale users create test-harness
  register: _headscale_user_create
  changed_when: false
  failed_when: false
  become: true

- name: _verify | The throwaway user round-trips back through list
  command: podman exec headscale headscale users list
  register: _headscale_user_list
  changed_when: false
  failed_when: "'test-harness' not in _headscale_user_list.stdout"
  become: true

# The single STUN publish must still cover IPv6. The fixture has no routable
# IPv6 address to probe from, so read the DNAT netavark derives; IPv4 gets a
# real STUN round trip below. Noble's netavark 1.4 derives no IPv6 DNAT from
# the publish, and fox, the only headscale host, runs Resolute.
- name: _verify | Netavark forwards DERP STUN over IPv6
  when: ansible_distribution_release != 'noble'
  command: nft list ruleset
  register: _headscale_nft
  changed_when: false
  failed_when: >-
    _headscale_nft.stdout is not search('udp dport ' ~ service_ports.headscale_stun ~ ' .*dnat (ip6 )?to [[]')
  become: true

# A restart is where stale port forwards surface: netavark 1.16 left a
# 0.0.0.0 + [::] publish pair's DNAT rules ahead of the next container's, so
# both published ports pointed at the stopped container's address.
- name: _verify | Restart headscale
  systemd:
    name: headscale.service
    state: restarted
  become: true

- name: _verify | /health answers through the published port after a restart
  uri:
    url: http://127.0.0.1:{{ service_ports.headscale }}/health
    status_code: 200
  register: _headscale_restart_health
  retries: 15
  delay: 2
  until: _headscale_restart_health.status | default(0) == 200

# Tailscale's STUN server answers only binding requests that carry its
# SOFTWARE=tailnode attribute and a FINGERPRINT, as tailscaled sends them.
- name: _verify | DERP STUN answers through the published port after a restart
  command:
    argv:
      - python3
      - -c
      - |
        import os, socket, struct, sys, zlib
        txid = os.urandom(12)
        software = struct.pack("!HH", 0x8022, 8) + b"tailnode"
        head = struct.pack("!HHI", 0x0001, len(software) + 8, 0x2112A442) + txid
        fingerprint = zlib.crc32(head + software) ^ 0x5354554E
        s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
        s.settimeout(2)
        s.sendto(head + software + struct.pack("!HHI", 0x8028, 4, fingerprint), ("127.0.0.1", int(sys.argv[1])))
        reply = s.recv(2048)
        assert reply[:2] == b"\x01\x01" and reply[8:20] == txid, reply[:20]
      - "{{ service_ports.headscale_stun }}"
  register: _headscale_restart_stun
  changed_when: false
  retries: 5
  delay: 2
  until: _headscale_restart_stun.rc == 0

- name: _verify | Exercise headscale fluent-bit record contracts
  import_role:
    name: fluentbit
    tasks_from: verify_extension
  vars:
    fluentbit_verify_args:
      name: headscale
      records:
        - MESSAGE: '{"level":"WARNING","message":"headscale-valid","time":4070908800,"service":"attribute"}'
          CONTAINER_TAG: headscale
          SYSLOG_IDENTIFIER: conmon
          SYSTEMD_UNIT: headscale.service
        - MESSAGE: headscale-raw
          CONTAINER_TAG: headscale
          SYSLOG_IDENTIFIER: conmon
          SYSTEMD_UNIT: headscale.service
        - MESSAGE: '{"level":"warn","message":"Listening without TLS but ServerURL does not start with http://","time":4070908800}'
          CONTAINER_TAG: headscale
          SYSLOG_IDENTIFIER: conmon
          SYSTEMD_UNIT: headscale.service
        - _tag: nginx.access
          log: headscale-latency-drop
          method: GET
          path: /derp/latency-check
          server_name: headscale.lab.example
          status: 200
        - _tag: nginx.access
          log: headscale-latency-failure
          method: GET
          path: /derp/latency-check
          server_name: headscale.lab.example
          status: 503
        - _tag: nginx.access
          log: headscale-nearby-path
          method: GET
          path: /derp/latency-check/details
          server_name: headscale.lab.example
          status: 200
      expected:
        - message: headscale-valid
          level: warn
          service: headscale
          fields.service: attribute
        - message: headscale-raw
          service: headscale
        - message: Listening without TLS but ServerURL does not start with http://
          level: info
          service: headscale
        - message: headscale-latency-failure
          level: error
          fields.status: 503
        - message: headscale-nearby-path
          level: debug
          fields.status: 200

- name: _verify | Successful Headscale DERP latency probe was omitted
  assert:
    that: "'headscale-latency-drop' not in fluentbit_verify_result.stdout"
