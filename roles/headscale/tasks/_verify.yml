# Exercise the exact loopback metrics surface Netdata scrapes.
- name: _verify | Headscale serves prometheus metrics on its loopback port
  uri:
    url: http://localhost:{{ service_ports.headscale_metrics }}/metrics
    status_code: 200
    return_content: true
  register: _headscale_metrics
  failed_when: "'headscale_' not in (_headscale_metrics.content | default(''))"
  retries: 5
  delay: 1
  until: _headscale_metrics.status | default(0) == 200
  become: true

- name: _verify | Map the headscale vhost FQDN to loopback for SNI-correct probing
  import_role:
    name: nginx
    tasks_from: test_loopback_hosts
  vars:
    nginx_test_loopback_hosts_args:
      hostnames:
        - "headscale.{{ inventory_hostname }}.{{ domain }}"

- name: _verify | Headscale /health is reachable through the nginx TLS vhost
  uri:
    url: https://headscale.{{ inventory_hostname }}.{{ domain }}/health
    validate_certs: false
    status_code: 200
  become: true

# Round-trip through CLI, gRPC, and SQLite. Ignore duplicate creation on kept VMs
# so the following read remains the functional assertion.
- name: _verify | Create a throwaway headscale user (gRPC write path)
  command: podman exec headscale headscale users create test-harness
  register: _headscale_user_create
  changed_when: false
  failed_when: false
  become: true

- name: _verify | The throwaway user round-trips back through list
  command: podman exec headscale headscale users list
  register: _headscale_user_list
  changed_when: false
  failed_when: "'test-harness' not in _headscale_user_list.stdout"
  become: true

# Podman's view is independent of netavark's firewall driver and proves both
# host families are mapped to the container's STUN listener.
- name: _verify | Headscale publishes DERP STUN on IPv4 and IPv6
  command: podman port headscale {{ service_ports.headscale_stun }}/udp
  register: _headscale_stun_ports
  changed_when: false
  failed_when: >-
    ('0.0.0.0:' ~ service_ports.headscale_stun) not in _headscale_stun_ports.stdout
    or (':::' ~ service_ports.headscale_stun) not in _headscale_stun_ports.stdout
  become: true

- name: _verify | Exercise headscale fluent-bit record contracts
  import_role:
    name: fluentbit
    tasks_from: verify_extension
  vars:
    fluentbit_verify_args:
      name: headscale
      records:
        - MESSAGE: '{"level":"WARNING","message":"headscale-valid","time":4070908800,"parser_status":"forged","service":"attribute"}'
          CONTAINER_TAG: headscale
          SYSLOG_IDENTIFIER: conmon
          SYSTEMD_UNIT: headscale.service
        - MESSAGE: headscale-raw
          CONTAINER_TAG: headscale
          SYSLOG_IDENTIFIER: conmon
          SYSTEMD_UNIT: headscale.service
        - MESSAGE: '{"level":"warn","message":"Listening without TLS but ServerURL does not start with http://","time":4070908800}'
          CONTAINER_TAG: headscale
          SYSLOG_IDENTIFIER: conmon
          SYSTEMD_UNIT: headscale.service
        - _tag: nginx.access
          log: headscale-latency-drop
          method: GET
          path: /derp/latency-check
          server_name: headscale.box.example
          status: 200
        - _tag: nginx.access
          log: headscale-latency-failure
          method: GET
          path: /derp/latency-check
          server_name: headscale.box.example
          status: 503
        - _tag: nginx.access
          log: headscale-nearby-path
          method: GET
          path: /derp/latency-check/details
          server_name: headscale.box.example
          status: 200
      expected:
        - message: headscale-valid
          level: warn
          service: headscale
          fields.service: attribute
        - message: headscale-raw
          service: headscale
        - message: Listening without TLS but ServerURL does not start with http://
          level: info
          service: headscale
        - message: headscale-latency-failure
          level: error
          fields.status: 503
        - message: headscale-nearby-path
          level: debug
          fields.status: 200

- name: _verify | Successful Headscale DERP latency probe was omitted
  assert:
    that: "'headscale-latency-drop' not in fluentbit_verify_result.stdout"
- name: _verify | Exercise alternate service storage layouts
  include_tasks: "{{ ansible_config_file | dirname }}/test/playbooks/tasks/_verify_service_storage.yml"
  vars:
    _storage_service: headscale
    _storage_template: "{{ role_path }}/templates/headscale.service.j2"
    _storage_mounts: [ services ]

- name: _verify | Exercise the advertised-address guard with host network facts
  block:
    - name: _verify | Add a temporary advertised IPv4 address
      command: ip address add 192.0.2.1/32 dev lo
      changed_when: true
      become: true

    - name: _verify | Add a temporary advertised IPv6 address
      command: ip -6 address add 2001:db8::1/128 dev lo
      changed_when: true
      become: true

    - name: _verify | Refresh network facts with the advertised addresses
      setup:
        gather_subset:
          - network

    - name: _verify | Run the production advertised-address guard
      import_tasks: validate_derp_ips.yml
      vars:
        headscale_derp_ipv4: 192.0.2.1
        headscale_derp_ipv6: 2001:db8::1
  always:
    - name: _verify | Remove the temporary advertised IPv4 address
      command: ip address delete 192.0.2.1/32 dev lo
      changed_when: true
      become: true

    - name: _verify | Remove the temporary advertised IPv6 address
      command: ip -6 address delete 2001:db8::1/128 dev lo
      changed_when: true
      become: true

    - name: _verify | Restore network facts after address cleanup
      setup:
        gather_subset:
          - network

- name: _verify | Render production config with pinned DERP addresses
  template:
    src: config.yaml.j2
    dest: /tmp/headscale-dual-stack.yaml
    mode: "0640"
  vars:
    headscale_derp_ipv4: 192.0.2.1
    headscale_derp_ipv6: 2001:db8::1
  diff: false
  become: true

- name: _verify | Render production config with only a pinned IPv4 DERP address
  template:
    src: config.yaml.j2
    dest: /tmp/headscale-ipv4.yaml
    mode: "0640"
  vars:
    headscale_derp_ipv4: 192.0.2.1
    headscale_derp_ipv6: "{{ undef() }}"
  diff: false
  become: true

- name: _verify | Verify pinned DERP addresses and DNS records
  command:
    argv:
      - python3
      - -c
      - |
        import pathlib
        import sys

        config = pathlib.Path(sys.argv[1]).read_text()
        assert config.count("192.0.2.1") == 2
        assert config.count("2001:db8::1") == 2
        assert 'type: "A"' in config
        assert 'type: "AAAA"' in config
        ipv4 = pathlib.Path(sys.argv[2]).read_text()
        assert ipv4.count("192.0.2.1") == 2
        assert 'type: "A"' in ipv4
        assert 'type: "AAAA"' not in ipv4
      - /tmp/headscale-dual-stack.yaml
      - /tmp/headscale-ipv4.yaml
  changed_when: false
  become: true

- name: _verify | Render the production unit for a physical host
  template:
    src: headscale.service.j2
    dest: /tmp/headscale-physical.service
    mode: "0644"
  vars:
    qemu_test: false
    zfs_root: false
    zfs_has_services_mount: false
  become: true

- name: _verify | Verify the physical unit waits for WireGuard
  command:
    argv:
      - grep
      - --fixed-strings
      - --line-regexp
      - After=wg-quick@wg0.service
      - /tmp/headscale-physical.service
  changed_when: false
  become: true

- name: _verify | Remove alternate Headscale files
  file:
    path: "/tmp/{{ item }}"
    state: absent
  loop:
    - headscale-dual-stack.yaml
    - headscale-ipv4.yaml
    - headscale-physical.service
  become: true
