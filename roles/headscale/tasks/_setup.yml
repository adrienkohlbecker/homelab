- name: _setup | Install podman
  import_role:
    name: podman
    tasks_from: install

- name: _setup | Install nginx
  import_role:
    name: nginx
    tasks_from: test_fixture

- name: _setup | Install fluent-bit for structured-log integration
  import_role:
    name: fluentbit

- name: _setup | Create /mnt/services
  file:
    path: /mnt/services
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true
