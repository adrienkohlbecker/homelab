- name: Install conntrack CLI for STUN flow cleanup
  apt:
    pkg: conntrack
    cache_valid_time: 3600
  become: true
  tags:
    - headscale

# A missing or mistyped input would leave interactive enrollment broken while
# the fail-open control plane keeps serving existing nodes.
- name: Assert required headscale OIDC inputs are set
  assert:
    that:
      - headscale_oidc_issuer | default('') | length > 0
      - headscale_oidc_client_id | default('') | length > 0
      - headscale_oidc_client_secret | default('') | length > 0
    fail_msg: >-
      Headscale requires non-empty headscale_oidc_issuer,
      headscale_oidc_client_id, and headscale_oidc_client_secret inputs.
  tags:
    - headscale

# The embedded DERP advertises these public IPs in its DERPMap; the config
# template omits each key if its var is unset. Catch the asymmetric-typo case
# (one set, one not) loudly here -- a half-set pair silently advertises the
# container's private podman address for the missing family and degrades NAT
# traversal for roaming clients on that protocol. Both-set (the dual-stack fox
# relay) and both-unset (the IPv4-only test box) are the two valid states.
- name: Assert headscale DERP advertised IPs are set together (both or neither)
  assert:
    that:
      - (headscale_derp_ipv4 is defined) == (headscale_derp_ipv6 is defined)
    fail_msg: >-
      Exactly one of headscale_derp_ipv4 / headscale_derp_ipv6 is set; set both
      (a dual-stack relay like fox) or neither (IPv4-only) -- a half-set pair
      makes the embedded DERP advertise a private address for the missing family.
  tags:
    - headscale

# The advertised addresses are hardcoded (headscale cannot auto-detect them
# behind nginx + the podman bridge) and duplicated from the reserved Hetzner
# primary IPs in terraform/hetzner.tf, so nothing else catches a stale pin. The
# original failure was precisely this: the AAAA published the /64 network base,
# an address fox never held, and IPv6-only clients simply could not reach the
# relay. Nothing inside the estate has IPv6 egress to notice, so assert at
# converge that the host actually holds what it advertises.
- name: Assert headscale DERP advertised IPs are held by this host
  assert:
    that:
      - headscale_derp_ipv4 in ansible_all_ipv4_addresses
      - headscale_derp_ipv6 in ansible_all_ipv6_addresses
    fail_msg: >-
      headscale_derp_ipv4 ({{ headscale_derp_ipv4 | default("unset") }}) or
      headscale_derp_ipv6 ({{ headscale_derp_ipv6 | default("unset") }}) is not
      configured on this host -- the DERPMap would advertise an address clients
      cannot reach. Reconcile with the reserved primary IPs in
      terraform/hetzner.tf (the IPv6 is cidrhost(ip_network, 1), not ip_address).
  when: headscale_derp_ipv4 is defined and headscale_derp_ipv6 is defined
  tags:
    - headscale

- name: Set up headscale system user, group, and config dir
  import_role:
    name: service_user
    tasks_from: user
  vars:
    service_user_args:
      name: headscale
  tags:
    - headscale

# State dir bind-mounted to /var/lib/headscale: the SQLite DB, auto-generated
# noise, DERP private keys, and CLI unix socket all land here. Owned by the
# headscale uid (tier-1 --user, no uidmap) so the container writes them directly.
- name: Create headscale data dir
  when: not ansible_check_mode or headscale_user.uid is defined
  file:
    dest: /mnt/services/headscale/data
    state: directory
    owner: headscale
    group: headscale
    mode: "0750"
  become: true
  tags:
    - headscale

# No host-side HuJSON parser is available; the container configtest below
# validates the policy before a changed unit is restarted.
- name: Render headscale ACL policy
  when: not ansible_check_mode or headscale_user.uid is defined
  template:
    src: acl.hujson.j2
    dest: /mnt/services/headscale/acl.hujson
    owner: headscale
    group: headscale
    mode: "0640"
    backup: true
  become: true
  register: headscale_acl_result
  tags:
    - headscale

- name: Pull headscale image
  import_role:
    name: podman
    tasks_from: image
  vars:
    podman_image_args:
      name: headscale
      image: "{{ headscale_image }}"
  tags:
    - headscale

- name: Create headscale OIDC client secret
  when:
    - not ansible_check_mode or headscale_podman_available
  containers.podman.podman_secret:
    name: headscale_oidc_secret
    data: "{{ headscale_oidc_client_secret }}"
  register: _headscale_oidc_secret
  become: true
  tags:
    - headscale

- name: Render headscale config
  when: not ansible_check_mode or headscale_user.uid is defined
  template:
    src: config.yaml.j2
    dest: /mnt/services/headscale/config.yaml
    owner: headscale
    group: headscale
    mode: "0640"
    backup: true
    # The template action can only validate YAML syntax; the pinned container's
    # native configtest below checks Headscale semantics before service changes.
    validate: python3 -c 'import yaml,sys; yaml.safe_load(open(sys.argv[1]))' %s
  become: true
  register: headscale_config_result
  tags:
    - headscale

- name: Install headscale fluent-bit extension
  import_role:
    name: fluentbit
    tasks_from: extension
  vars:
    fluentbit_extension_args:
      name: headscale
  tags:
    - headscale

# Dedicated dual-stack podman network so the embedded DERP STUN answers over
# IPv6 too (fox is a dual-stack relay -- see host_vars/fox.yml). The default
# podman bridge is IPv4-only; ipv6:true makes netavark hand the container an
# extra ULA /64 and set up the same DNAT path for v6 published ports. Inbound
# STUN to the host's public v6 is DNAT'd to the container's ULA with the client
# source preserved (netavark masquerades only container-subnet/localhost
# sources), so STUN reflects the real client address -- exactly as the IPv4 path
# already does.
- name: Create headscale dual-stack podman network
  when: not ansible_check_mode
  containers.podman.podman_network:
    name: headscale
    ipv6: true
    state: present
  become: true
  register: headscale_network
  tags:
    - headscale

# configtest initializes Headscale far enough to open its database and create
# private keys. Put all mutable state on a disposable tmpfs so validation can
# exercise the rendered config, ACL, OIDC secret, and pinned binary without
# touching the live database or keys.
- name: Validate rendered headscale configuration
  when:
    - not ansible_check_mode
    - >-
      headscale_config_result.changed
      or headscale_acl_result.changed
      or headscale_image_changed
      or (_headscale_oidc_secret.changed | default(false))
  command:
    argv: >-
      {{
        ['/usr/bin/podman', 'run', '--rm',
         '--network=headscale',
         '--security-opt=no-new-privileges',
         '--tmpfs=/var/lib/headscale:rw,mode=0700',
         '--volume=/mnt/services/headscale/config.yaml:/etc/headscale/config.yaml:ro',
         '--volume=/mnt/services/headscale/acl.hujson:/etc/headscale/acl.hujson:ro']
        + ['--secret=headscale_oidc_secret,type=mount,target=oidc_client_secret']
        + [headscale_image, 'configtest']
      }}
  changed_when: false
  become: true
  tags:
    - headscale

- name: Manage headscale service
  import_role:
    name: systemd_unit
    tasks_from: unit
  vars:
    systemd_unit_args:
      src: headscale.service.j2
      condition: "{{ not ansible_check_mode or headscale_user.uid is defined }}"
      # The mounted OIDC secret is read only at container start.
      restart: >-
        {{ headscale_config_result.changed
           or headscale_acl_result.changed
           or (headscale_network.changed | default(false))
           or (_headscale_oidc_secret.changed | default(false)) }}
  tags:
    - headscale

# Public vhost (NOT Authelia-gated -- Tailscale clients hit the raw control
# API + DERP relay here, all over https/443). No enable_http: certbot issues
# the cert via the DNS-01 Cloudflare challenge (no :80 needed) and clients
# never use plain HTTP, so the site stays https-only (the template's default
# :80 block just redirects to :443, and fox's firewall doesn't open 80
# anyway). Long read timeout + buffering off keep the long-poll control stream
# and the DERP websocket (handled by the site template's Upgrade/Connection
# headers) alive.
- name: Configure nginx
  import_role:
    name: nginx
    tasks_from: site
  vars:
    nginx_site_args:
      subdomain: headscale
      proxy_pass: http://127.0.0.1:{{ service_ports.headscale }}/
      location_conf: |
        proxy_buffering off;
        proxy_read_timeout 3600s;
  tags:
    - headscale
