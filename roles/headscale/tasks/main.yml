- name: Install conntrack CLI for STUN flow cleanup
  apt:
    pkg: conntrack
    cache_valid_time: 3600
  become: true
  tags:
    - headscale

# Fail-open OIDC keeps serving existing nodes even when enrollment is broken.
- name: Assert required headscale OIDC inputs are set
  assert:
    that:
      - headscale_oidc_issuer | default('') | length > 0
      - headscale_oidc_client_id | default('') | length > 0
      - headscale_oidc_client_secret | default('') | length > 0
    fail_msg: >-
      Headscale requires non-empty headscale_oidc_issuer,
      headscale_oidc_client_id, and headscale_oidc_client_secret inputs.
  tags:
    - headscale

# A half-set pair makes DERP advertise its private container address for the
# missing family. Fox sets both; the IPv4-only test fixture sets neither.
- name: Assert headscale DERP advertised IPs are set together (both or neither)
  assert:
    that:
      - (headscale_derp_ipv4 is defined) == (headscale_derp_ipv6 is defined)
    fail_msg: >-
      Exactly one of headscale_derp_ipv4 / headscale_derp_ipv6 is set; set both
      (a dual-stack relay like fox) or neither (IPv4-only) -- a half-set pair
      makes the embedded DERP advertise a private address for the missing family.
  tags:
    - headscale

# Headscale cannot discover its public addresses behind nginx and Podman. Catch
# stale Terraform pins at converge because the estate has no IPv6 egress probe.
- name: Assert headscale DERP advertised IPs are held by this host
  assert:
    that:
      - headscale_derp_ipv4 in ansible_all_ipv4_addresses
      - headscale_derp_ipv6 in ansible_all_ipv6_addresses
    fail_msg: >-
      headscale_derp_ipv4 ({{ headscale_derp_ipv4 | default("unset") }}) or
      headscale_derp_ipv6 ({{ headscale_derp_ipv6 | default("unset") }}) is not
      configured on this host -- the DERPMap would advertise an address clients
      cannot reach. Reconcile with the reserved primary IPs in
      terraform/hetzner.tf (the IPv6 is cidrhost(ip_network, 1), not ip_address).
  when: headscale_derp_ipv4 is defined and headscale_derp_ipv6 is defined
  tags:
    - headscale

- name: Set up headscale system user, group, and config dir
  import_role:
    name: service_user
    tasks_from: user
  vars:
    service_user_args:
      name: headscale
  tags:
    - headscale

# Persistent DB, keys, and CLI socket, owned by the container's direct host uid.
- name: Create headscale data dir
  when: not ansible_check_mode or headscale_user.uid is defined
  file:
    dest: /mnt/services/headscale/data
    state: directory
    owner: headscale
    group: headscale
    mode: "0750"
  become: true
  tags:
    - headscale

# The native configtest below validates HuJSON before restart.
- name: Render headscale ACL policy
  when: not ansible_check_mode or headscale_user.uid is defined
  template:
    src: acl.hujson.j2
    dest: /mnt/services/headscale/acl.hujson
    owner: headscale
    group: headscale
    mode: "0640"
    backup: true
  become: true
  register: headscale_acl_result
  tags:
    - headscale

- name: Pull headscale image
  import_role:
    name: podman
    tasks_from: image
  vars:
    podman_image_args:
      name: headscale
      image: "{{ headscale_image }}"
  tags:
    - headscale

- name: Create headscale OIDC client secret
  when:
    - not ansible_check_mode or headscale_podman_available
  containers.podman.podman_secret:
    name: headscale_oidc_secret
    data: "{{ headscale_oidc_client_secret }}"
  register: _headscale_oidc_secret
  become: true
  tags:
    - headscale

- name: Render headscale config
  when: not ansible_check_mode or headscale_user.uid is defined
  template:
    src: config.yaml.j2
    dest: /mnt/services/headscale/config.yaml
    owner: headscale
    group: headscale
    mode: "0640"
    backup: true
    # The native configtest below handles Headscale semantics.
    validate: python3 -c 'import yaml,sys; yaml.safe_load(open(sys.argv[1]))' %s
  become: true
  register: headscale_config_result
  tags:
    - headscale

- name: Install headscale fluent-bit extension
  import_role:
    name: fluentbit
    tasks_from: extension
  vars:
    fluentbit_extension_args:
      name: headscale
  tags:
    - headscale

# The default Podman bridge is IPv4-only. A dual-stack network gives embedded
# DERP STUN an IPv6 DNAT path while preserving the remote client address.
- name: Create headscale dual-stack podman network
  when: not ansible_check_mode
  containers.podman.podman_network:
    name: headscale
    ipv6: true
    state: present
  become: true
  register: headscale_network
  tags:
    - headscale

# Configtest opens the database and creates keys, so isolate all mutable state
# on tmpfs while exercising the rendered inputs and pinned binary.
- name: Validate rendered headscale configuration
  when:
    - not ansible_check_mode
    - >-
      headscale_config_result.changed
      or headscale_acl_result.changed
      or headscale_image_changed
      or (_headscale_oidc_secret.changed | default(false))
  command:
    argv: >-
      {{
        ['/usr/bin/podman', 'run', '--rm',
         '--network=headscale',
         '--security-opt=no-new-privileges',
         '--tmpfs=/var/lib/headscale:rw,mode=0700',
         '--volume=/mnt/services/headscale/config.yaml:/etc/headscale/config.yaml:ro',
         '--volume=/mnt/services/headscale/acl.hujson:/etc/headscale/acl.hujson:ro']
        + ['--secret=headscale_oidc_secret,type=mount,target=oidc_client_secret']
        + [headscale_image, 'configtest']
      }}
  changed_when: false
  become: true
  tags:
    - headscale

- name: Manage headscale service
  import_role:
    name: systemd_unit
    tasks_from: unit
  vars:
    systemd_unit_args:
      src: headscale.service.j2
      condition: "{{ not ansible_check_mode or headscale_user.uid is defined }}"
      # The mounted OIDC secret is read only at container start.
      restart: >-
        {{ headscale_config_result.changed
           or headscale_acl_result.changed
           or (headscale_network.changed | default(false))
           or (_headscale_oidc_secret.changed | default(false)) }}
  tags:
    - headscale

# The public control API and DERP relay cannot be Authelia-gated. DNS-01 keeps
# the site HTTPS-only; no buffering and a long timeout preserve control streams.
- name: Configure nginx
  import_role:
    name: nginx
    tasks_from: site
  vars:
    nginx_site_args:
      subdomain: headscale
      proxy_pass: http://127.0.0.1:{{ service_ports.headscale }}/
      location_conf: |
        proxy_buffering off;
        proxy_read_timeout 3600s;
  tags:
    - headscale
