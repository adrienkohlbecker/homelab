# The systemd input gives container output and unit lifecycle records the same
# tag. Preserve_Key retains malformed or legacy text under `log`; normalize.lua
# uses CONTAINER_TAG to restrict application parsing to container output.
[FILTER]
    Name          parser
    Match         svc.headscale.service
    Key_Name      log
    Parser        headscale_json
    Reserve_Data  On
    Preserve_Key  On

[FILTER]
    Name    lua
    Match   svc.headscale.service
    script  /etc/fluent-bit/headscale_normalize.lua
    call    normalize_headscale
