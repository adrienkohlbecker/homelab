parsers:
  - name: headscale_json
    format: json

pipeline:
  filters:
    - name: modify
      match: svc.headscale.service
      rename: MESSAGE log
    - name: parser
      match: svc.headscale.service
      key_name: log
      parser: headscale_json
      reserve_data: true
      preserve_key: true
    - name: modify
      match: svc.headscale.service
      condition:
        - key_exists CONTAINER_TAG
        - key_exists message
        - key_exists level
      hard_rename:
        - message log
        - level _level
      remove: time
      add: parser_status parsed
