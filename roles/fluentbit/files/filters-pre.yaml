pipeline:
  filters:
    # High-volume records retained in their source journal/file but omitted from
    # the operator aggregate.
    - name: grep
      match: svc.*
      exclude:
        - 'MESSAGE ^Printing VRRP as json for process'
        - 'MESSAGE ^pam_unix\(cron:session\)'
        - 'MESSAGE ^podman0: port'
        - 'MESSAGE ^veth[0-9]+( |@|: )'
        - 'MESSAGE name="/etc/gnutls/config"'
        - 'MESSAGE Failed to get interface "(veth|podman)'
        - 'MESSAGE Unknown index .* seen, reloading interface list'
        - 'MESSAGE which is not our child'
        - 'MESSAGE ^Configuration file /run/systemd/system/netplan-ovs-cleanup\.service is marked world-inaccessible'
        - 'MESSAGE container health_status .*health_status=healthy'

    - name: grep
      match: svc.*
      logical_op: and
      exclude:
        - 'SYSLOG_IDENTIFIER ^ansible-[A-Za-z0-9._]+$'
        - 'MESSAGE ^Invoked with '

    - name: grep
      match: svc.*
      logical_op: and
      exclude:
        - 'SYSTEMD_UNIT ^homepage_alerts\.service$'
        - 'MESSAGE ^(Starting homepage_alerts\.service - Generate homepage alerts panel static files\.\.\.|Finished homepage_alerts\.service - Generate homepage alerts panel static files\.|homepage_alerts\.service: Deactivated successfully\.)$'

    # Podman removes one-shot healthcheck units concurrently with systemd's
    # result collection during a container wave. Keep real probe failures but
    # omit only the resulting ENOENT cleanup race.
    - name: grep
      match: svc.*
      logical_op: and
      exclude:
        - 'UNIT ^[a-f0-9]{64}\.service$'
        - 'ERRNO ^2$'
        - 'MESSAGE ^[a-f0-9]{64}\.service: Failed to open /run/systemd/transient/[a-f0-9]{64}\.service: No such file or directory$'

    - name: lua
      match: svc.*
      script: /etc/fluent-bit/podman_events.lua
      call: normalize_podman_event

    # The final healthy/unhealthy event carries the operational result. The
    # repeated startup probes are retained in journald and add no new state.
    - name: grep
      match: svc.*
      logical_op: and
      exclude:
        - 'event ^health_status$'
        - 'health_status ^starting$'

    - name: grep
      match: audit
      exclude: "log ^type=SERVICE_(START|STOP) msg=audit\\([0-9.]+:[0-9]+\\): pid=1 uid=0 auid=4294967295 ses=4294967295 subj=unconfined msg='unit=[a-f0-9]{64}"

    - name: grep
      match: audit
      exclude: "log ^type=SERVICE_(START|STOP) msg=audit\\([0-9.]+:[0-9]+\\): pid=1 uid=0 auid=4294967295 ses=4294967295 subj=unconfined msg='unit=homepage_alerts .* res=success'"

    - name: grep
      match: svc.*
      logical_op: and
      exclude:
        - 'SYSTEMD_UNIT ^netdata\.service$'
        - 'MESSAGE (^Failed to prepare statement SQL_SELECT_HEALTH_LOG|^Failed to execute ''DROP TABLE|^LISTENER: Cannot validate ''localhost'')'

    - name: grep
      match: svc.*
      logical_op: and
      exclude:
        - 'SYSTEMD_UNIT ^netdata\.service$'
        - 'MESSAGE ^voltage sensor ''[^'']+'' transitioned from state'

    - name: grep
      match: svc.*
      logical_op: and
      exclude:
        - 'SYSTEMD_UNIT ^netdata\.service$'
        - 'MESSAGE ^temperature sensor ''temperature_nct6798-isa-'

    # Netdata logs these exact cancellation/teardown messages during every
    # orderly reload. Unexpected service failure remains visible through the
    # unit result and all non-teardown Netdata errors.
    - name: grep
      match: svc.*
      logical_op: and
      exclude:
        - 'SYSTEMD_UNIT ^netdata\.service$'
        - 'MESSAGE ^(PARSER: read failed: POLLHUP\.|PARSER: thread cancelled while waiting for data\.|PLUGINSD: buffered reader not OK \(-[0-9]+\)|Failed to delete socket [0-9]+ from nd_poll\(\) - called from poll_events_cleanup\(\) - is the socket already closed\?|stopped after [0-9]+ connects, [0-9]+ disconnects \(max concurrent [0-9]+\), [0-9]+ receptions and [0-9]+ sends)$'

    # charts.d deliberately restarts every four hours. Omit only the healthy
    # bootstrap wave; actual alert transitions and plugin failures stay.
    - name: grep
      match: svc.*
      logical_op: and
      exclude:
        - 'SYSTEMD_UNIT ^netdata\.service$'
        - 'MESSAGE ^ALERT .* raised from REMOVED to CLEAR\.'

    - name: grep
      match: svc.*
      logical_op: and
      exclude:
        - 'SYSTEMD_UNIT ^netdata\.service$'
        - 'MESSAGE ^(main: started from ''/usr/libexec/netdata/plugins\.d/charts\.d\.plugin'' with options: 5|main: Configuration file ''(/usr/lib/netdata/conf\.d|/etc/netdata)/charts\.d\.conf'' loaded\.|(example|libreswan|opensips): is disabled\.)'

    - name: grep
      match: svc.*
      logical_op: and
      exclude:
        - 'SYSLOG_IDENTIFIER ^CRON$'
        - 'MESSAGE ^\(root\) CMD \(command -v debian-sa1 > /dev/null && debian-sa1 (1 1|60 2)\)$'

    - name: grep
      match: svc.*
      logical_op: and
      exclude:
        - 'SYSTEMD_UNIT ^zfs_autosnapshot\.service$'
        - 'MESSAGE ^$'

    - name: grep
      match: svc.*
      logical_op: and
      exclude:
        - 'SYSTEMD_UNIT ^hd-idle\.service$'
        - 'MESSAGE ^probing sd[a-z]+: reads:'

    # These optional ATA extensions fail on part of the current disk mix while
    # standard SMART health/error/selftest monitoring remains active. Keep
    # actual disk alerts; omit only the one-time option diagnostics.
    - name: grep
      match: svc.*
      logical_op: and
      exclude:
        - 'SYSLOG_IDENTIFIER ^smartd$'
        - 'MESSAGE ^Device: /dev/disk/by-id/ata-[A-Za-z0-9_.:-]+, (no Extended Comprehensive SMART Error Log, ignoring -l xerror \(override with -T permissive\)|no SCT Error Recovery Control support, ignoring -l scterc|set of SCT Error Recovery Control failed)$'

    - name: grep
      match: svc.*
      logical_op: and
      exclude:
        - 'SYSLOG_IDENTIFIER ^systemd$'
        - 'MESSAGE ^tmp-crun\.[A-Za-z0-9]+\.mount: Deactivated successfully\.$'

    - name: grep
      match: nginx.access
      exclude:
        - 'log "homepage-alerts/1"'
        - 'log "POST /api/v2/write\?'

    - name: parser
      match: nginx.access
      key_name: log
      parser: nginx_access_custom
      reserve_data: true
      preserve_key: true

    - name: modify
      match: certbot.file
      add:
        - _service certbot
        - _stream certbot_file
        - _unit certbot.service
        - _identifier certbot

    - name: parser
      match: certbot.file
      key_name: log
      parser: certbot_file
      reserve_data: true
      preserve_key: true

    - name: modify
      match: certbot.file
      condition:
        - key_exists certbot_message
        - key_exists certbot_level
      hard_rename:
        - certbot_message log
        - certbot_level _level
        - certbot_source source
      remove: certbot_timestamp
      set: parser_status parsed

    - name: modify
      match: certbot.file
      condition: key_does_not_exist parser_status
      add:
        - parse_error certbot_file
        - _level warn

    # Services with header-aware grammars add their own multiline filter.
    - name: multiline
      match_regex: '^svc\.(?!(?:homeassistant|homepage|sonarr|socket_proxy)\.service$).*'
      multiline.parser: python,go,java,ruby
      multiline.key_content: MESSAGE
      buffer: true
      flush_ms: 1000
      emitter_name: multiline_emitter
      emitter_storage.type: filesystem
