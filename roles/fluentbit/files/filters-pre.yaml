pipeline:
  filters:
    # High-volume records retained in their source journal/file but omitted from
    # the operator aggregate.
    - name: grep
      match: svc.*
      exclude:
        - 'MESSAGE ^Printing VRRP as json for process'
        - 'MESSAGE ^pam_unix\(cron:session\)'
        - 'MESSAGE ^podman0: port'
        - 'MESSAGE ^veth[0-9]+( |@|: )'
        - 'MESSAGE name="/etc/gnutls/config"'
        - 'MESSAGE Failed to get interface "(veth|podman)'
        - 'MESSAGE Unknown index .* seen, reloading interface list'
        - 'MESSAGE which is not our child'
        - 'MESSAGE ^Configuration file /run/systemd/system/netplan-ovs-cleanup\.service is marked world-inaccessible'
        - 'MESSAGE container health_status .*health_status=healthy'

    # systemd logs a unit's own lifecycle from init.scope, so the target unit
    # is named by UNIT, not by SYSTEMD_UNIT (the logging process's unit).
    - name: grep
      match: svc.*
      logical_op: and
      exclude:
        - 'UNIT ^homepage_alerts\.service$'
        - 'MESSAGE \A(Starting homepage_alerts\.service - Generate homepage alerts panel static files\.\.\.|Finished homepage_alerts\.service - Generate homepage alerts panel static files\.|homepage_alerts\.service: Deactivated successfully\.)\z'

    # Podman removes one-shot healthcheck units concurrently with systemd's
    # result collection during a container wave. Keep real probe failures but
    # omit only the resulting ENOENT cleanup race.
    - name: grep
      match: svc.*
      logical_op: and
      exclude:
        - 'UNIT ^[a-f0-9]{64}\.service$'
        - 'ERRNO ^2$'
        - 'MESSAGE \A[a-f0-9]{64}\.service: Failed to open /run/systemd/transient/[a-f0-9]{64}\.service: No such file or directory\z'

    - name: lua
      match: svc.*
      script: /etc/fluent-bit/podman_events.lua
      call: normalize_podman_event

    # The final healthy/unhealthy event carries the operational result. The
    # repeated startup probes are retained in journald and add no new state.
    - name: grep
      match: svc.*
      logical_op: and
      exclude:
        - 'event ^health_status$'
        - 'health_status ^starting$'

    - name: grep
      match: svc.*
      logical_op: and
      exclude:
        - 'SYSLOG_IDENTIFIER ^CRON$'
        - 'MESSAGE ^\(root\) CMD \(command -v debian-sa1 > /dev/null && debian-sa1 (1 1|60 2)\)$'

    - name: grep
      match: svc.*
      logical_op: and
      exclude:
        - 'SYSTEMD_UNIT ^zfs_autosnapshot\.service$'
        - 'MESSAGE ^$'

    - name: grep
      match: svc.*
      logical_op: and
      exclude:
        - 'SYSTEMD_UNIT ^hd-idle\.service$'
        - 'MESSAGE ^probing sd[a-z]+: reads:'

    - name: grep
      match: svc.*
      logical_op: and
      exclude:
        - 'SYSLOG_IDENTIFIER ^systemd$'
        - 'MESSAGE ^tmp-crun\.[A-Za-z0-9]+\.mount: Deactivated successfully\.$'

    - name: grep
      match: nginx.access
      exclude:
        - 'log "homepage-alerts/1"'
        - 'log "POST /api/v2/write\?'

    - name: parser
      match: nginx.access
      key_name: log
      parser: nginx_access_custom
      reserve_data: true
      preserve_key: true

    - name: modify
      match: certbot.file
      add:
        - _service certbot
        - _stream certbot_file
        - _unit certbot.service
        - _identifier certbot

    - name: parser
      match: certbot.file
      key_name: log
      parser: certbot_file
      reserve_data: true
      preserve_key: true

    - name: modify
      match: certbot.file
      condition:
        - key_exists certbot_message
        - key_exists certbot_level
      hard_rename:
        - certbot_message log
        - certbot_level _level
        - certbot_source source
      remove: certbot_timestamp
      set: parser_status parsed

    - name: modify
      match: certbot.file
      condition: key_does_not_exist parser_status
      add:
        - parse_error certbot_file
        - _level warn

    # Services with header-aware grammars add their own multiline filter.
    - name: multiline
      match_regex: '^svc\.(?!(?:homeassistant|homepage|sonarr|socket_proxy)\.service$).*'
      multiline.parser: python,go,java,ruby
      multiline.key_content: MESSAGE
      buffer: true
      flush_ms: 1000
      emitter_name: multiline_emitter
      emitter_storage.type: filesystem
