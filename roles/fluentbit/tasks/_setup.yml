- name: _setup | Install nginx (for the tail input paths to resolve)
  import_role:
    name: nginx
    tasks_from: test_fixture

- name: _setup | Install logrotate
  import_role:
    name: logrotate
    tasks_from: main

- name: _setup | Create the certbot log fixture directory
  file:
    path: /var/log/letsencrypt
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

# The file must exist before Fluent Bit starts because read_from_head is false.
- name: _setup | Create an empty certbot log fixture
  copy:
    dest: /var/log/letsencrypt/letsencrypt.log
    content: ""
    owner: root
    group: root
    mode: "0644"
  become: true
