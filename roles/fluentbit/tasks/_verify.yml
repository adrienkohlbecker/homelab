- name: _verify | HTTP_Server uptime
  uri:
    url: "http://127.0.0.1:{{ service_ports.fluentbit }}/api/v1/uptime"
    status_code: 200
  register: _fluentbit_uptime
  retries: 6
  delay: 2
  until: _fluentbit_uptime.status == 200
  become: true

# The shared core filters run against the deployed parsers/filters-pre/
# filters-post files themselves, so this fixture cannot drift from what the
# daemon actually executes.
- name: _verify | Exercise shared core filters
  import_role:
    name: fluentbit
    tasks_from: verify_extension
  vars:
    fluentbit_verify_args:
      name: shared_filters
      includes:
        - /etc/fluent-bit/parsers.yaml
        - /etc/fluent-bit/filters-pre.yaml
        - /etc/fluent-bit/filters-post.yaml
      records:
        - _tag: svc.init.scope
          MESSAGE: Starting homepage_alerts.service - Generate homepage alerts panel static files...
          SYSLOG_IDENTIFIER: systemd
          UNIT: homepage_alerts.service
          marker: homepage-start-drop
        - _tag: svc.init.scope
          MESSAGE: Finished homepage_alerts.service - Generate homepage alerts panel static files.
          SYSLOG_IDENTIFIER: systemd
          UNIT: homepage_alerts.service
          marker: homepage-finish-drop
        - _tag: svc.init.scope
          MESSAGE: "homepage_alerts.service: Deactivated successfully."
          SYSLOG_IDENTIFIER: systemd
          UNIT: homepage_alerts.service
          marker: homepage-deactivated-drop
        - _tag: svc.init.scope
          MESSAGE: "homepage_alerts.service: Failed with result exit-code."
          SYSLOG_IDENTIFIER: systemd
          UNIT: homepage_alerts.service
          PRIORITY: "3"
          marker: homepage-failed-keep
        - _tag: svc.podman.service
          MESSAGE: verbose podman event
          SYSLOG_IDENTIFIER: podman
          SYSTEMD_UNIT: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa-startup.service
          PODMAN_EVENT: health_status
          PODMAN_TYPE: container
          PODMAN_NAME: fixture
          PODMAN_ID: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          PODMAN_HEALTH_STATUS: starting
          marker: podman-starting-drop
        - _tag: svc.podman.service
          MESSAGE: verbose podman event
          SYSLOG_IDENTIFIER: podman
          SYSTEMD_UNIT: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa.service
          PODMAN_EVENT: health_status
          PODMAN_TYPE: container
          PODMAN_NAME: fixture
          PODMAN_ID: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          PODMAN_HEALTH_STATUS: unhealthy
          marker: podman-unhealthy-keep
        - _tag: svc.init.scope
          MESSAGE: "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb.service: Failed to open /run/systemd/transient/bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb.service: No such file or directory"
          SYSLOG_IDENTIFIER: systemd
          UNIT: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb.service
          ERRNO: "2"
          marker: healthcheck-enoent-drop
        - _tag: svc.init.scope
          MESSAGE: "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb.service: Main process exited, code=exited, status=1/FAILURE"
          SYSLOG_IDENTIFIER: systemd
          UNIT: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb.service
          PRIORITY: "3"
          marker: healthcheck-failed-keep
        # ^ and $ are line anchors in Onigmo, so a suppressed line appearing
        # anywhere inside a merged multiline record used to drop the whole
        # record along with the real failure it was reported beside.
        - _tag: svc.init.scope
          MESSAGE: "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb.service: Main process exited, code=exited, status=1/FAILURE\nbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb.service: Failed to open /run/systemd/transient/bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb.service: No such file or directory"
          SYSLOG_IDENTIFIER: systemd
          UNIT: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb.service
          ERRNO: "2"
          PRIORITY: "3"
          marker: multiline-enoent-keep
      expected:
        - level: error
          fields.marker: homepage-failed-keep
        - fields.marker: podman-unhealthy-keep
          fields.health_status: unhealthy
        - level: error
          fields.marker: healthcheck-failed-keep
        - level: error
          fields.marker: multiline-enoent-keep

- name: _verify | Shared core noise was omitted
  assert:
    that: "'-drop' not in fluentbit_verify_result.stdout"

- name: _verify | Build per-run markers
  set_fact:
    fluentbit_lnav_journald_marker: "verify_journald_{{ ansible_date_time.iso8601_basic_short }}_{{ 99999 | random }}"
    fluentbit_lnav_nginx_marker: "verify_nginx_{{ ansible_date_time.iso8601_basic_short }}_{{ 99999 | random }}"
    fluentbit_lnav_nginx_access_marker: "verify_nginxaccess_{{ ansible_date_time.iso8601_basic_short }}_{{ 99999 | random }}"
    fluentbit_lnav_nginx_empty_marker: "verify_nginxempty_{{ ansible_date_time.iso8601_basic_short }}_{{ 99999 | random }}"
    fluentbit_lnav_certbot_marker: "verify_certbot_{{ ansible_date_time.iso8601_basic_short }}_{{ 99999 | random }}"
    fluentbit_lnav_ansi_marker: "verify_ansi_{{ ansible_date_time.iso8601_basic_short }}_{{ 99999 | random }}"
    fluentbit_lnav_priority_marker: "verify_priority_{{ ansible_date_time.iso8601_basic_short }}_{{ 99999 | random }}"
    fluentbit_lnav_multiline_marker: "verify_trace_{{ ansible_date_time.iso8601_basic_short }}_{{ 99999 | random }}"
    fluentbit_lnav_healthcheck_marker: "verify_healthcheck_{{ ansible_date_time.iso8601_basic_short }}_{{ 99999 | random }}"
    fluentbit_lnav_podman_event_marker: "verify_podman_event_{{ ansible_date_time.iso8601_basic_short }}_{{ 99999 | random }}"
    fluentbit_lnav_crun_barrier_marker: "verify_crun_barrier_{{ ansible_date_time.iso8601_basic_short }}_{{ 99999 | random }}"

- name: _verify | Podman event | derive fake 64-hex container id
  set_fact:
    fluentbit_lnav_podman_event_cid: "{{ fluentbit_lnav_podman_event_marker | hash('sha256') }}"

- name: _verify | Crun cleanup | derive transient mount id
  set_fact:
    fluentbit_lnav_crun_id: "{{ fluentbit_lnav_crun_barrier_marker | hash('sha256') }}"

- name: _verify | Journald path | emit marked log via transient unit
  command: >-
    systemd-run --unit=fluentbit_verify_journald --no-block --quiet
    /usr/bin/logger -t fluentbit_verify_journald
    "ERROR {{ fluentbit_lnav_journald_marker }}"
  changed_when: false
  become: true

- name: _verify | Nginx tail | append marked line to access.log
  command: tee -a /var/log/nginx/access.log
  args:
    stdin: "{{ fluentbit_lnav_nginx_marker }}\n"
  changed_when: false
  become: true

# A well-formed custom-format access line (the marker lives in the request
# path) exercises the nginx_access_custom parser end-to-end: structured fields
# must land in the JSONL record's `fields` object with the right types.
- name: _verify | Nginx access parse | append a 200 custom-format line
  command: tee -a /var/log/nginx/access.log
  args:
    stdin: "203.0.113.7 - - [08/Jun/2099:12:00:00 +0200] grafana.lab.example \"GET /{{ fluentbit_lnav_nginx_access_marker }}?x=1 HTTP/2.0\" grafana.lab.example 200 1234 567 0.042 0.040 \"https://ref.example\" \"Mozilla/5.0 verifyUA\" \"verifyuser\" TLSv1.3 TLS_AES_128_GCM_SHA256\n"
  changed_when: false
  become: true

# Nginx emits empty host, request, and server-name fields for malformed traffic
# rejected before a virtual server or request line can be selected.
- name: _verify | Nginx access parse | append an empty-field 400 line
  command: tee -a /var/log/nginx/access.log
  args:
    stdin: "203.0.113.7 - - [08/Jun/2099:12:00:02 +0200]  \"\"  400 0 0 9.856 - \"-\" \"{{ fluentbit_lnav_nginx_empty_marker }}\" \"\" - -\n"
  changed_when: false
  become: true

- name: _verify | Certbot tail | append a multiline error
  command: tee -a /var/log/letsencrypt/letsencrypt.log
  args:
    stdin: |
      2099-07-12 12:00:00,123:ERROR:certbot._internal.main:Renewal failed {{ fluentbit_lnav_certbot_marker }}
      Traceback (most recent call last):
        File "/usr/lib/python3/dist-packages/certbot/main.py", line 1, in main
      ValueError: {{ fluentbit_lnav_certbot_marker }}
  changed_when: false
  become: true

# A seerr-style colorized line: the level token is wrapped in SGR colour codes,
# which level_from_message must remove. printf interprets the \033 escapes into real ESC
# bytes; systemd-run captures stdout to the journal preserving them.
- name: _verify | ANSI | emit a colorized debug line via transient unit
  command: >-
    systemd-run --unit=fluentbit_verify_ansi --no-block --quiet
    --property=SyslogIdentifier=fluentbit_verify_ansi
    /usr/bin/printf "[\033[34mdebug\033[39m] ansi {{ fluentbit_lnav_ansi_marker }} colorized line\n"
  changed_when: false
  become: true

- name: _verify | Journald priority | emit native error without a level token
  command: logger --journald
  args:
    stdin: |
      MESSAGE=host service failure {{ fluentbit_lnav_priority_marker }}
      PRIORITY=3
      SYSLOG_IDENTIFIER=fluentbit_verify_priority
  changed_when: false
  become: true

- name: _verify | Crun cleanup | emit successful transient mount teardown
  command: logger --journald
  args:
    stdin: |
      MESSAGE=tmp-crun.{{ fluentbit_lnav_crun_id }}.mount: Deactivated successfully.
      SYSLOG_IDENTIFIER=systemd
  changed_when: false
  become: true

- name: _verify | Crun cleanup | emit retained barrier after teardown
  command: logger --journald
  args:
    stdin: |
      MESSAGE=filter barrier {{ fluentbit_lnav_crun_barrier_marker }}
      SYSLOG_IDENTIFIER=fluentbit_verify_crun_barrier
  changed_when: false
  become: true

- name: _verify | Multiline | emit python traceback via transient unit
  command: >-
    systemd-run --unit=fluentbit_verify_multiline --no-block --quiet
    --property=SyslogIdentifier=fluentbit_verify_multiline
    /usr/bin/python3 -c "raise ValueError('trace_{{ fluentbit_lnav_multiline_marker }}')"
  changed_when: false
  become: true

- name: _verify | Podman event | emit native structured journal record
  command: logger --journald
  args:
    stdin: |
      MESSAGE=2026-07-13 02:01:25.445274426 +0000 UTC m=+1.145839344 container start {{ fluentbit_lnav_podman_event_cid }} (image=ghcr.io/example/test:1, name={{ fluentbit_lnav_podman_event_marker }}, org.opencontainers.image.description=verbose metadata)
      SYSLOG_IDENTIFIER=podman
      PODMAN_EVENT=start
      PODMAN_TYPE=container
      PODMAN_NAME={{ fluentbit_lnav_podman_event_marker }}
      PODMAN_IMAGE=ghcr.io/example/test:1
      PODMAN_ID={{ fluentbit_lnav_podman_event_cid }}
      PODMAN_HEALTH_STATUS=
      PODMAN_TIME=2026-07-13T02:01:25.445274426Z
      PODMAN_LABELS={"org.opencontainers.image.description":"verbose metadata"}
  changed_when: false
  become: true

- name: _verify | Podman_healthcheck | derive fake 64-hex container id
  set_fact:
    fluentbit_lnav_healthcheck_cid: "{{ fluentbit_lnav_healthcheck_marker | hash('sha256') }}"

- name: _verify | Podman_healthcheck | run failing transient unit named like a container id
  command: >-
    systemd-run --unit={{ fluentbit_lnav_healthcheck_cid }}.service
    --quiet
    /bin/sh -c "exit 1"
  changed_when: false
  become: true

- name: _verify | JSONL | wait for shaped records
  command:
    argv:
      - python3
      - -c
      - |
        import json
        import sys

        path, marker, service = sys.argv[1:4]
        extra = sys.argv[4] if len(sys.argv) > 4 else ""

        with open(path, encoding="utf-8") as handle:
            for line in handle:
                if marker not in line:
                    continue
                try:
                    record = json.loads(line)
                except json.JSONDecodeError:
                    continue
                message = record.get("message", "")
                if record.get("service") == service and marker in message and (not extra or extra in message):
                    print(json.dumps(record, sort_keys=True))
                    sys.exit(0)

        sys.exit(1)
      - /var/log/fluent-bit/lnav.jsonl
      - "{{ item.marker }}"
      - "{{ item.service }}"
      - "{{ item.extra | default('') }}"
  register: _fluentbit_lnav_records
  changed_when: false
  retries: 60
  delay: 2
  until: _fluentbit_lnav_records.rc == 0
  loop:
    - name: journald
      marker: "{{ fluentbit_lnav_journald_marker }}"
      service: fluentbit_verify_journald
    - name: nginx
      marker: "{{ fluentbit_lnav_nginx_marker }}"
      service: nginx_access
    - name: nginx_access
      marker: "{{ fluentbit_lnav_nginx_access_marker }}"
      service: nginx_access
    - name: nginx_empty
      marker: "{{ fluentbit_lnav_nginx_empty_marker }}"
      service: nginx_access
    - name: certbot
      marker: "{{ fluentbit_lnav_certbot_marker }}"
      service: certbot
      extra: Traceback
    - name: ansi
      marker: "{{ fluentbit_lnav_ansi_marker }}"
      service: fluentbit_verify_ansi
    - name: priority
      marker: "{{ fluentbit_lnav_priority_marker }}"
      service: fluentbit_verify_priority
    - name: crun_barrier
      marker: "{{ fluentbit_lnav_crun_barrier_marker }}"
      service: fluentbit_verify_crun_barrier
    - name: multiline
      marker: "{{ fluentbit_lnav_multiline_marker }}"
      service: fluentbit_verify_multiline
      extra: Traceback
    - name: podman_event
      marker: "{{ fluentbit_lnav_podman_event_marker }}"
      service: podman
    - name: podman_healthcheck
      marker: "{{ fluentbit_lnav_healthcheck_cid }}"
      service: podman_healthcheck
  loop_control:
    label: "{{ item.name }}"
  become: true

- name: _verify | JSONL | collect shaped records
  set_fact:
    _fluentbit_lnav_by_name: >-
      {{ _fluentbit_lnav_by_name | default({}) |
         combine({item.item.name: (item.stdout | from_json)}) }}
  loop: "{{ _fluentbit_lnav_records.results }}"
  loop_control:
    label: "{{ item.item.name }}"

# A bare substring search is not enough here: the ansible task that emits the
# fixture line is itself journaled ("Invoked with ... tmp-crun.<id> ...") and
# legitimately retained, so match the exact systemd-identifier record.
- name: _verify | Crun cleanup | assert successful teardown was excluded
  command:
    argv:
      - python3
      - -c
      - |
        import json
        import sys

        path, message = sys.argv[1:3]
        with open(path, encoding="utf-8") as handle:
            for line in handle:
                try:
                    record = json.loads(line)
                except json.JSONDecodeError:
                    continue
                if record.get("identifier") == "systemd" and record.get("message") == message:
                    sys.exit(1)
      - /var/log/fluent-bit/lnav.jsonl
      - "tmp-crun.{{ fluentbit_lnav_crun_id }}.mount: Deactivated successfully."
  changed_when: false
  become: true

- name: _verify | Journald path | assert JSONL shape
  vars:
    row: "{{ _fluentbit_lnav_by_name.journald }}"
  assert:
    that:
      - "row.level == 'error'"
      - "row.service == 'fluentbit_verify_journald'"
      - "fluentbit_lnav_journald_marker in row.message"
      - "row.unit == 'fluentbit_verify_journald.service'"
      - "row.identifier == 'fluentbit_verify_journald'"
      - "row.host == inventory_hostname"
      - "row.stream == 'journald'"
      - "'SYSTEMD_UNIT' not in row.fields"
      - "'SYSLOG_IDENTIFIER' not in row.fields"
      # The lua filters must use the classic 3-arg signature so Fluent Bit does
      # not serialize event metadata into the JSONL as an __internal__ object.
      - "'__internal__' not in row"
      - "'level_number' not in row"
    fail_msg: "journald record landed with wrong shape: {{ row }}"

# The bare marker line above is NOT a valid custom-format access line, so the
# nginx_access_custom parser leaves it untouched (no status field). lnav_shape
# must flag the miss: parse_error names the parser and the level is raised to
# warn so a drifting parser is loud instead of the line blending into info.
- name: _verify | Nginx tail | assert unparsed line is flagged
  vars:
    row: "{{ _fluentbit_lnav_by_name.nginx }}"
  assert:
    that:
      - "row.service == 'nginx_access'"
      - "fluentbit_lnav_nginx_marker in row.message"
      - "row.stream == 'nginx'"
      - "row.parse_error == 'nginx_access_custom'"
      - "row.level == 'warn'"
    fail_msg: "nginx unparsed line not flagged with parse_error: {{ row }}"

- name: _verify | Nginx access parse | assert structured fields
  vars:
    row: "{{ _fluentbit_lnav_by_name.nginx_access }}"
  assert:
    that:
      - "row.level == 'debug'"
      - "row.service == 'nginx_access'"
      - "row.stream == 'nginx'"
      # Raw request line preserved as the message body (marker lives in path).
      - "fluentbit_lnav_nginx_access_marker in row.message"
      # Parsed HTTP fields with the expected types.
      - "row.fields.method == 'GET'"
      - "row.fields.protocol == 'HTTP/2.0'"
      - "row.fields.path == '/' ~ fluentbit_lnav_nginx_access_marker ~ '?x=1'"
      - "row.fields.http_host == 'grafana.lab.example'"
      - "row.fields.status == 200"
      - "row.fields.status is integer"
      - "row.fields.body_bytes_sent == 1234"
      - "row.fields.request_length == 567"
      - "(row.fields.request_time | float) >= 0.04"
      - "(row.fields.request_time | float) <= 0.05"
      - "row.fields.user_agent == 'Mozilla/5.0 verifyUA'"
      # Authelia user captured from the access line.
      - "row.fields.authelia_user == 'verifyuser'"
      - "row.fields.ssl_protocol == 'TLSv1.3'"
      # No Time_Key: the parsed request time is kept as a field, not adopted as
      # the record timestamp (which stays Fluent Bit ingest time).
      - "row.fields.time_local == '08/Jun/2099:12:00:00 +0200'"
      # http_host must NOT clobber the inventory host stamped by the modify filter.
      - "row.host == inventory_hostname"
      # A successful parse is not flagged.
      - "'parse_error' not in row"
    fail_msg: "nginx access line did not parse into structured fields: {{ row }}"

- name: _verify | Nginx access parse | assert empty fields are accepted
  vars:
    row: "{{ _fluentbit_lnav_by_name.nginx_empty }}"
  assert:
    that:
      - "row.level == 'debug'"
      - "row.service == 'nginx_access'"
      - "row.stream == 'nginx'"
      - "fluentbit_lnav_nginx_empty_marker in row.message"
      - "row.fields.status == 400"
      - "row.fields.status is integer"
      - "'parse_error' not in row"
    fail_msg: "nginx empty-field access line did not parse: {{ row }}"

- name: _verify | Certbot tail | assert parsed multiline shape
  vars:
    row: "{{ _fluentbit_lnav_by_name.certbot }}"
  assert:
    that:
      - "row.level == 'error'"
      - "row.service == 'certbot'"
      - "row.unit == 'certbot.service'"
      - "row.identifier == 'certbot'"
      - "row.stream == 'certbot_file'"
      - "fluentbit_lnav_certbot_marker in row.message"
      - "'Traceback' in row.message"
      - "'ValueError' in row.message"
      - "row.fields.source == 'certbot._internal.main'"
      - "row.fields.parser_status == 'parsed'"
      - "'parse_error' not in row"
    fail_msg: "certbot file record did not parse into one shaped record: {{ row }}"

- name: _verify | ANSI | assert colors stripped and level reclassified
  vars:
    row: "{{ _fluentbit_lnav_by_name.ansi }}"
  assert:
    that:
      - "row.service == 'fluentbit_verify_ansi'"
      - "fluentbit_lnav_ansi_marker in row.message"
      # The SGR colour codes are gone from the message...
      - "'[34m' not in row.message"
      - "'[39m' not in row.message"
      - "row.message == '[debug] ansi ' ~ fluentbit_lnav_ansi_marker ~ ' colorized line'"
      # ...and the de-coloured level token now classifies correctly (it would
      # have fallen through to info while the colour bytes hugged the word).
      - "row.level == 'debug'"
    fail_msg: "seerr-style ANSI not stripped / level not reclassified: {{ row }}"

- name: _verify | Journald priority | assert native severity fallback
  vars:
    row: "{{ _fluentbit_lnav_by_name.priority }}"
  assert:
    that:
      - "row.level == 'error'"
      - "fluentbit_lnav_priority_marker in row.message"
      - "row.service == 'fluentbit_verify_priority'"
    fail_msg: "Native journald priority fallback classified wrong: {{ row }}"

- name: _verify | Multiline | assert traceback joined
  vars:
    row: "{{ _fluentbit_lnav_by_name.multiline }}"
  assert:
    that:
      - "'Traceback' in row.message"
      - "'ValueError' in row.message"
      - "fluentbit_lnav_multiline_marker in row.message"
      - "row.service == 'fluentbit_verify_multiline'"
    fail_msg: "Multiline traceback not joined: {{ row }}"

- name: _verify | Podman event | assert normalized structured shape
  vars:
    row: "{{ _fluentbit_lnav_by_name.podman_event }}"
  assert:
    that:
      - "row.service == 'podman'"
      - "row.identifier == 'podman'"
      - "row.message == 'container start ' ~ fluentbit_lnav_podman_event_marker"
      - "row.level == 'info'"
      - "row.fields.event == 'start'"
      - "row.fields.object_type == 'container'"
      - "row.fields.name == fluentbit_lnav_podman_event_marker"
      - "row.fields.image == 'ghcr.io/example/test:1'"
      - "row.fields.object_id == fluentbit_lnav_podman_event_cid"
      - "row.fields.parser_status == 'parsed'"
      - "'PODMAN_EVENT' not in row.fields"
      - "'PODMAN_TIME' not in row.fields"
      - "'PODMAN_LABELS' not in row.fields"
    fail_msg: "podman event did not normalize into a compact structured record: {{ row }}"

- name: _verify | Podman_healthcheck | assert rewrite shape
  vars:
    row: "{{ _fluentbit_lnav_by_name.podman_healthcheck }}"
  assert:
    that:
      - "row.service == 'podman_healthcheck'"
      - "'CONTAINER_ID_FULL' not in row.fields"
      - "row.fields.CONTAINER_ID == fluentbit_lnav_healthcheck_cid[:12]"
      - "row.fields.UNIT == fluentbit_lnav_healthcheck_cid ~ '.service'"
      - "fluentbit_lnav_healthcheck_cid in row.message"
    fail_msg: "podman_healthcheck rewrite did not fire: {{ row }}"

- name: _verify | Fluent Bit journal has no Lua warnings
  command:
    argv:
      - journalctl
      - -u
      - fluent-bit
      - --since
      - -5 minutes
      - --no-pager
      - --grep
      - "lua.*(error|warn|warning)"
  register: _fluentbit_lua_journal
  changed_when: false
  failed_when: _fluentbit_lua_journal.rc != 1
  become: true
