- name: _verify | HTTP_Server uptime
  uri:
    url: "http://127.0.0.1:{{ service_ports.fluentbit }}/api/v1/uptime"
    status_code: 200
  register: _fluentbit_uptime
  retries: 6
  delay: 2
  until: _fluentbit_uptime.status == 200
  become: true

# The daemon started without this fragment, so the journald record below only
# carries its field if the reload that restores the managed config re-expands
# the services/*.yaml include glob.
- name: _verify | Seed a service extension behind the running daemon
  copy:
    dest: /etc/fluent-bit/services/fluentbit_verify_glob.yaml
    content: |
      pipeline:
        filters:
          - name: modify
            match: svc.fluentbit_verify_journald.service
            add: verify_glob reloaded
    owner: root
    group: root
    mode: "0644"
  become: true

- name: _verify | Read the hot reload count before the reload
  uri:
    url: "http://127.0.0.1:{{ service_ports.fluentbit }}/api/v2/reload"
  register: _fluentbit_reload_before

- name: _verify | Disturb the managed config before exercising reload
  lineinfile:
    path: /etc/fluent-bit/fluent-bit.yaml
    line: "# _verify reload path"
    state: present
  become: true

- name: _verify | Restore the managed config through the production tasks
  import_tasks: configure.yml

# SIGHUP returns before the reload finishes, and the HTTP server restarts
# with the pipeline, so poll until the new context reports itself.
- name: _verify | Wait for the hot reload to complete
  uri:
    url: "http://127.0.0.1:{{ service_ports.fluentbit }}/api/v2/reload"
  register: _fluentbit_reload_after
  failed_when: >-
    (_fluentbit_reload_after.json.hot_reload_count | default(-1) | int)
    <= (_fluentbit_reload_before.json.hot_reload_count | int)
  retries: 15
  delay: 2
  until: _fluentbit_reload_after is not failed

# Live records cover what a hand-built record cannot: journald field capture,
# the certbot tail multiline parser, and the multiline filter emitter. Every
# other shaping rule runs in the shared core fixture below.
- name: _verify | Build per-run markers
  set_fact:
    fluentbit_lnav_journald_marker: "verify_journald_{{ ansible_date_time.iso8601_basic_short }}_{{ 99999 | random }}"
    fluentbit_lnav_certbot_marker: "verify_certbot_{{ ansible_date_time.iso8601_basic_short }}_{{ 99999 | random }}"
    fluentbit_lnav_multiline_marker: "verify_trace_{{ ansible_date_time.iso8601_basic_short }}_{{ 99999 | random }}"

# journald reads the sending process cgroup to fill _SYSTEMD_UNIT when it
# handles the message, so a logger that already exited lands as unit=unknown:
# 5 of 10 emits on a fixture whose journal is mirrored to the console, 10 of
# 10 once the sender stays open past the write. Hold it open rather than
# assert on the race.
- name: _verify | Journald path | emit marked log via transient unit
  command:
    argv:
      - systemd-run
      - --unit=fluentbit_verify_journald
      - --no-block
      - --quiet
      - /bin/sh
      - -c
      - '{ echo "ERROR {{ fluentbit_lnav_journald_marker }}"; sleep 2; } | logger -t fluentbit_verify_journald'
  changed_when: false
  become: true

- name: _verify | Certbot tail | append a multiline error
  command: tee -a /var/log/letsencrypt/letsencrypt.log
  args:
    stdin: |
      2099-07-12 12:00:00,123:ERROR:certbot._internal.main:Renewal failed {{ fluentbit_lnav_certbot_marker }}
      Traceback (most recent call last):
        File "/usr/lib/python3/dist-packages/certbot/main.py", line 1, in main
      ValueError: {{ fluentbit_lnav_certbot_marker }}
  changed_when: false
  become: true

- name: _verify | Multiline | emit python traceback via transient unit
  command: >-
    systemd-run --unit=fluentbit_verify_multiline --no-block --quiet
    --property=SyslogIdentifier=fluentbit_verify_multiline
    /usr/bin/python3 -c "raise ValueError('trace_{{ fluentbit_lnav_multiline_marker }}')"
  changed_when: false
  become: true

- name: _verify | JSONL | wait for shaped records
  command:
    argv:
      - python3
      - -c
      - |
        import json
        import sys

        path, marker, service = sys.argv[1:4]
        extra = sys.argv[4] if len(sys.argv) > 4 else ""

        with open(path, encoding="utf-8") as handle:
            for line in handle:
                if marker not in line:
                    continue
                try:
                    record = json.loads(line)
                except json.JSONDecodeError:
                    continue
                message = record.get("message", "")
                if record.get("service") == service and marker in message and (not extra or extra in message):
                    print(json.dumps(record, sort_keys=True))
                    sys.exit(0)

        sys.exit(1)
      - /var/log/fluent-bit/lnav.jsonl
      - "{{ item.marker }}"
      - "{{ item.service }}"
      - "{{ item.extra | default('') }}"
  register: _fluentbit_lnav_records
  changed_when: false
  retries: 60
  delay: 2
  until: _fluentbit_lnav_records.rc == 0
  loop:
    - name: journald
      marker: "{{ fluentbit_lnav_journald_marker }}"
      service: fluentbit_verify_journald
    - name: certbot
      marker: "{{ fluentbit_lnav_certbot_marker }}"
      service: certbot
      extra: Traceback
    - name: multiline
      marker: "{{ fluentbit_lnav_multiline_marker }}"
      service: fluentbit_verify_multiline
      extra: Traceback
  loop_control:
    label: "{{ item.name }}"
  become: true

- name: _verify | JSONL | collect shaped records
  set_fact:
    _fluentbit_lnav_by_name: >-
      {{ _fluentbit_lnav_by_name | default({}) |
         combine({item.item.name: (item.stdout | from_json)}) }}
  loop: "{{ _fluentbit_lnav_records.results }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: _verify | Journald path | assert JSONL shape
  vars:
    row: "{{ _fluentbit_lnav_by_name.journald }}"
  assert:
    that:
      - "row.level == 'error'"
      - "row.service == 'fluentbit_verify_journald'"
      - "fluentbit_lnav_journald_marker in row.message"
      - "row.unit == 'fluentbit_verify_journald.service'"
      - "row.identifier == 'fluentbit_verify_journald'"
      - "row.host == inventory_hostname"
      - "row.stream == 'journald'"
      - "row.fields.verify_glob == 'reloaded'"
      - "'SYSTEMD_UNIT' not in row.fields"
      - "'SYSLOG_IDENTIFIER' not in row.fields"
      # The lua filters must use the classic 3-arg signature so Fluent Bit does
      # not serialize event metadata into the JSONL as an __internal__ object.
      - "'__internal__' not in row"
      - "'level_number' not in row"
    fail_msg: "journald record landed with wrong shape: {{ row }}"

- name: _verify | Certbot tail | assert parsed multiline shape
  vars:
    row: "{{ _fluentbit_lnav_by_name.certbot }}"
  assert:
    that:
      - "row.level == 'error'"
      - "row.service == 'certbot'"
      - "row.unit == 'certbot.service'"
      - "row.identifier == 'certbot'"
      - "row.stream == 'certbot_file'"
      - "fluentbit_lnav_certbot_marker in row.message"
      - "'Traceback' in row.message"
      - "'ValueError' in row.message"
      - "row.fields.source == 'certbot._internal.main'"
      - "'parser_status' not in row.fields"
      - "'parse_error' not in row"
    fail_msg: "certbot file record did not parse into one shaped record: {{ row }}"

- name: _verify | Multiline | assert traceback joined
  vars:
    row: "{{ _fluentbit_lnav_by_name.multiline }}"
  assert:
    that:
      - "'Traceback' in row.message"
      - "'ValueError' in row.message"
      - "fluentbit_lnav_multiline_marker in row.message"
      - "row.service == 'fluentbit_verify_multiline'"
    fail_msg: "Multiline traceback not joined: {{ row }}"

- name: _verify | Rotation | record the daemon PID
  systemd:
    name: fluent-bit.service
  register: _fluentbit_rotate_pid_before
  become: true

- name: _verify | Rotation | force the production logrotate policy
  command: logrotate --force /etc/logrotate.d/fluent-bit-lnav
  changed_when: false
  become: true

- name: _verify | Rotation | emit a marked log after rotation
  command:
    argv:
      - systemd-run
      - --unit=fluentbit_verify_rotate
      - --no-block
      - --quiet
      - /bin/sh
      - -c
      - '{ echo "ERROR rotated_{{ fluentbit_lnav_journald_marker }}"; sleep 2; } | logger -t fluentbit_verify_rotate'
  changed_when: false
  become: true

# Writes must land at the start of the truncated file: a writer without
# O_APPEND would keep its old offset and leave a NUL hole before them.
- name: _verify | Rotation | live path keeps receiving records
  command:
    argv:
      - python3
      - -c
      - |
        import sys

        live, rotated, marker = sys.argv[1:4]
        with open(rotated, "rb") as handle:
            if not handle.read(1):
                sys.exit("rotated generation is empty")
        with open(live, "rb") as handle:
            data = handle.read()
        if not data.startswith(b"{"):
            sys.exit("live file does not start with a record")
        if marker.encode() not in data:
            sys.exit(1)
      - /var/log/fluent-bit/lnav.jsonl
      - /var/log/fluent-bit/lnav.jsonl.1
      - rotated_{{ fluentbit_lnav_journald_marker }}
  register: _fluentbit_rotate_check
  changed_when: false
  retries: 30
  delay: 2
  until: _fluentbit_rotate_check.rc == 0
  become: true

- name: _verify | Rotation | daemon was not restarted
  systemd:
    name: fluent-bit.service
  register: _fluentbit_rotate_pid_after
  failed_when: _fluentbit_rotate_pid_after.status.MainPID != _fluentbit_rotate_pid_before.status.MainPID
  become: true

- name: _verify | Remove the seeded service extension
  import_role:
    name: fluentbit
    tasks_from: extension_remove
  vars:
    fluentbit_extension_remove_args:
      names:
        - fluentbit_verify_glob

# The shared core filters run against the deployed parsers/filters-pre/
# filters-post files themselves, so this fixture cannot drift from what the
# daemon actually executes. Hand-built journald records mirror the fields the
# systemd input emits with strip_underscores: string PRIORITY, COMM,
# SYSTEMD_UNIT, and TRANSPORT beside the writer-supplied fields.
- name: _verify | Exercise shared core filters
  import_role:
    name: fluentbit
    tasks_from: verify_extension
  vars:
    _fluentbit_nginx_ok: >-
      203.0.113.7 - - [08/Jun/2099:12:00:00 +0200] grafana.lab.example
      "GET /nginx-ok?x=1 HTTP/2.0" grafana.lab.example 200 1234 567 0.042 0.040
      "https://ref.example" "Mozilla/5.0 verifyUA" "verifyuser" TLSv1.3 TLS_AES_128_GCM_SHA256
    _fluentbit_nginx_upstream: >-
      203.0.113.7 - - [08/Jun/2099:12:00:01 +0200] grafana.lab.example
      "GET /nginx-upstream HTTP/2.0" grafana.lab.example 502 150 567 0.010 0.010
      "-" "Mozilla/5.0 verifyUA" "" TLSv1.3 TLS_AES_128_GCM_SHA256
    # Nginx leaves the host, request, and server name empty for malformed
    # traffic rejected before a virtual server or request line is selected.
    _fluentbit_nginx_empty: >-
      203.0.113.7 - - [08/Jun/2099:12:00:02 +0200]  ""  400 0 0 9.856 - "-" "nginx-empty-agent" "" - -
    _fluentbit_podman_cid: "{{ 'd' * 64 }}"
    # Podman 5 suffixes transient healthcheck units; the Lua unit tests cover
    # the other unit-name forms.
    _fluentbit_healthcheck_unit: "{{ 'e' * 64 }}-123abc.service"
    fluentbit_verify_args:
      name: shared_filters
      includes:
        - /etc/fluent-bit/parsers.yaml
        - /etc/fluent-bit/filters-pre.yaml
        - /etc/fluent-bit/filters-post.yaml
      records:
        - _tag: svc.init.scope
          MESSAGE: Starting homepage_alerts.service - Generate homepage alerts panel static files...
          SYSLOG_IDENTIFIER: systemd
          UNIT: homepage_alerts.service
          marker: homepage-start-drop
        - _tag: svc.init.scope
          MESSAGE: Finished homepage_alerts.service - Generate homepage alerts panel static files.
          SYSLOG_IDENTIFIER: systemd
          UNIT: homepage_alerts.service
          marker: homepage-finish-drop
        - _tag: svc.init.scope
          MESSAGE: "homepage_alerts.service: Deactivated successfully."
          SYSLOG_IDENTIFIER: systemd
          UNIT: homepage_alerts.service
          marker: homepage-deactivated-drop
        - _tag: svc.init.scope
          MESSAGE: "homepage_alerts.service: Failed with result exit-code."
          SYSLOG_IDENTIFIER: systemd
          UNIT: homepage_alerts.service
          PRIORITY: "3"
          marker: homepage-failed-keep
        - _tag: svc.podman.service
          MESSAGE: verbose podman event
          SYSLOG_IDENTIFIER: podman
          SYSTEMD_UNIT: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa-startup.service
          PODMAN_EVENT: health_status
          PODMAN_TYPE: container
          PODMAN_NAME: fixture
          PODMAN_ID: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          PODMAN_HEALTH_STATUS: starting
          marker: podman-starting-drop
        - _tag: svc.podman.service
          MESSAGE: verbose podman event
          SYSLOG_IDENTIFIER: podman
          SYSTEMD_UNIT: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa.service
          PODMAN_EVENT: health_status
          PODMAN_TYPE: container
          PODMAN_NAME: fixture
          PODMAN_ID: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          PODMAN_HEALTH_STATUS: unhealthy
          marker: podman-unhealthy-keep
        - _tag: svc.init.scope
          MESSAGE: "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb.service: Failed to open /run/systemd/transient/bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb.service: No such file or directory"
          SYSLOG_IDENTIFIER: systemd
          UNIT: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb.service
          ERRNO: "2"
          marker: healthcheck-enoent-keep
        - _tag: svc.init.scope
          MESSAGE: "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb.service: Main process exited, code=exited, status=1/FAILURE"
          SYSLOG_IDENTIFIER: systemd
          UNIT: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb.service
          PRIORITY: "3"
          marker: healthcheck-failed-keep
        - _tag: certbot.file
          log: "2099-07-12 12:00:00,123:ERROR:certbot._internal.main:certbot-valid"
        - _tag: certbot.file
          log: certbot-unparsed
        # A podman container's stderr: the level token is wrapped in SGR
        # colour codes that level_from_message must strip before it matches.
        - _tag: svc.fixture.service
          MESSAGE: "[\e[34mdebug\e[39m] ansi colorized line"
          SYSLOG_IDENTIFIER: fixture
          PRIORITY: "3"
          COMM: conmon
          SYSTEMD_UNIT: fixture.service
          TRANSPORT: journal
          CONTAINER_TAG: fixture
          CONTAINER_NAME: fixture
          CONTAINER_ID: cccccccccccc
          CONTAINER_ID_FULL: cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
          marker: ansi-keep
        - _tag: svc.fixture_native.service
          MESSAGE: host service failure
          SYSLOG_IDENTIFIER: fixture_native
          PRIORITY: "3"
          SYSLOG_FACILITY: "3"
          COMM: fixture_native
          SYSTEMD_UNIT: fixture_native.service
          TRANSPORT: journal
          marker: priority-keep
        - _tag: svc.init.scope
          MESSAGE: "tmp-crun.Xb3kQ9.mount: Deactivated successfully."
          SYSLOG_IDENTIFIER: systemd
          PRIORITY: "6"
          SYSLOG_FACILITY: "3"
          COMM: systemd
          SYSTEMD_UNIT: init.scope
          UNIT: tmp-crun.Xb3kQ9.mount
          TRANSPORT: journal
          marker: crun-cleanup-drop
        - _tag: svc.fixture.service
          MESSAGE: >-
            2026-07-13 02:01:25.445274426 +0000 UTC m=+1.145839344 container start
            {{ _fluentbit_podman_cid }} (image=ghcr.io/example/test:1, name=fixture,
            org.opencontainers.image.description=verbose metadata)
          SYSLOG_IDENTIFIER: podman
          PRIORITY: "6"
          COMM: podman
          SYSTEMD_UNIT: fixture.service
          TRANSPORT: journal
          PODMAN_EVENT: start
          PODMAN_TYPE: container
          PODMAN_NAME: fixture
          PODMAN_IMAGE: ghcr.io/example/test:1
          PODMAN_ID: "{{ _fluentbit_podman_cid }}"
          PODMAN_HEALTH_STATUS: ""
          PODMAN_TIME: "2026-07-13T02:01:25.445274426Z"
          PODMAN_LABELS: '{"org.opencontainers.image.description":"verbose metadata"}'
          parser_status: forged
          marker: podman-start-keep
        - _tag: svc.init.scope
          MESSAGE: "{{ _fluentbit_healthcheck_unit }}: Main process exited, code=exited, status=1/FAILURE"
          SYSLOG_IDENTIFIER: systemd
          PRIORITY: "5"
          SYSLOG_FACILITY: "3"
          COMM: systemd
          SYSTEMD_UNIT: init.scope
          UNIT: "{{ _fluentbit_healthcheck_unit }}"
          EXIT_CODE: exited
          EXIT_STATUS: "1"
          TRANSPORT: journal
          marker: healthcheck-rewrite-keep
        - _tag: nginx.access
          log: "{{ _fluentbit_nginx_ok }}"
          filepath: /var/log/nginx/access.log
        - _tag: nginx.access
          log: "{{ _fluentbit_nginx_upstream }}"
          filepath: /var/log/nginx/access.log
        - _tag: nginx.access
          log: "{{ _fluentbit_nginx_empty }}"
          filepath: /var/log/nginx/access.log
        - _tag: nginx.access
          log: nginx-unparsed
          filepath: /var/log/nginx/access.log
      expected:
        - level: error
          fields.marker: homepage-failed-keep
        - fields.marker: podman-unhealthy-keep
          fields.health_status: unhealthy
        - fields.marker: healthcheck-enoent-keep
        - level: error
          fields.marker: healthcheck-failed-keep
        - service: certbot
          unit: certbot.service
          identifier: certbot
          stream: certbot_file
          level: error
          message: certbot-valid
          fields.source: certbot._internal.main
          _absent:
            - parse_error
            - fields.parser_status
        - service: certbot
          level: warn
          message: certbot-unparsed
          parse_error: certbot_file
        - fields.marker: ansi-keep
          service: fixture
          message: "[debug] ansi colorized line"
          level: debug
        # Without a level keyword, a native service keeps its journald priority.
        - fields.marker: priority-keep
          service: fixture_native
          unit: fixture_native.service
          level: error
        - fields.marker: podman-start-keep
          service: podman
          identifier: podman
          unit: fixture.service
          message: container start fixture
          level: info
          fields.event: start
          fields.object_type: container
          fields.name: fixture
          fields.image: ghcr.io/example/test:1
          fields.object_id: "{{ _fluentbit_podman_cid }}"
          _absent:
            - fields.PODMAN_EVENT
            - fields.PODMAN_TIME
            - fields.PODMAN_LABELS
            - fields.parser_status
        - fields.marker: healthcheck-rewrite-keep
          service: podman_healthcheck
          message: "{{ _fluentbit_healthcheck_unit }}: Main process exited, code=exited, status=1/FAILURE"
          fields.UNIT: "{{ _fluentbit_healthcheck_unit }}"
          fields.CONTAINER_ID: eeeeeeeeeeee
          _absent:
            - fields.CONTAINER_ID_FULL
        # The parsed request keeps the inventory host and the ingest timestamp,
        # and a 4xx or 2xx access stays at the pinned debug level.
        - message: "{{ _fluentbit_nginx_ok }}"
          service: nginx_access
          stream: nginx
          host: "{{ inventory_hostname }}"
          level: debug
          fields.method: GET
          fields.protocol: HTTP/2.0
          fields.path: /nginx-ok?x=1
          fields.http_host: grafana.lab.example
          fields.status: 200
          fields.body_bytes_sent: 1234
          fields.request_length: 567
          fields.request_time: 0.042
          fields.user_agent: Mozilla/5.0 verifyUA
          fields.authelia_user: verifyuser
          fields.ssl_protocol: TLSv1.3
          fields.time_local: "08/Jun/2099:12:00:00 +0200"
          _absent:
            - parse_error
        # lnav_shape promotes a 5xx only when the parser typed status as a number.
        - message: "{{ _fluentbit_nginx_upstream }}"
          level: error
          fields.status: 502
        - message: "{{ _fluentbit_nginx_empty }}"
          service: nginx_access
          level: debug
          fields.status: 400
          _absent:
            - parse_error
        # A line the parser misses is flagged and raised to warn.
        - message: nginx-unparsed
          service: nginx_access
          stream: nginx
          parse_error: nginx_access_custom
          level: warn

- name: _verify | Shared core noise was omitted
  assert:
    that: "'-drop' not in fluentbit_verify_result.stdout"

- name: _verify | Fluent Bit journal has no Lua warnings
  command:
    argv:
      - journalctl
      - -u
      - fluent-bit
      - --since
      - -5 minutes
      - --no-pager
      - --grep
      - "lua.*(error|warn|warning)"
  register: _fluentbit_lua_journal
  changed_when: false
  failed_when: _fluentbit_lua_journal.rc != 1
  become: true
