- name: _verify | Validate fluent-bit extension fixture arguments
  assert:
    that:
      - fluentbit_verify_args.keys() | list | difference(['name', 'unit', 'includes', 'records', 'expected']) | length == 0
      - fluentbit_verify_args.name is string
      - fluentbit_verify_args.records | length > 0
      - fluentbit_verify_args.expected | length > 0

# Service fragments declare filters only, and the fixture has its own dummy
# inputs and storage path, so it runs beside the live daemon.
- name: _verify | Write fluent-bit extension fixture  # noqa: require-backup require-validate
  copy:
    dest: "/tmp/fluent-bit-{{ fluentbit_verify_args.name }}-verify.yaml"
    mode: "0644"
    content: |
      service:
        flush: 1
        grace: 1
        log_level: error
        storage.path: /tmp/fluent-bit-{{ fluentbit_verify_args.name }}-storage

      includes:
      {% for include in fluentbit_verify_args.includes | default(['/etc/fluent-bit/services/' ~ fluentbit_verify_args.name ~ '.yaml', '/etc/fluent-bit/filters-post.yaml']) %}
        - {{ include }}
      {% endfor %}

      pipeline:
        inputs:
      {% for record in fluentbit_verify_args.records %}
          - name: dummy
            tag: {{ record._tag | default('svc.' ~ (fluentbit_verify_args.unit | default(fluentbit_verify_args.name)) ~ '.service') }}
            dummy: >-
              {{ record | ansible.utils.remove_keys(target=['_tag']) | to_json }}
            samples: 1
      {% endfor %}

        outputs:
          - name: stdout
            match: '*'
            format: json_lines
  become: true

# A graceful exit normally lands within a second or two of SIGTERM, but a
# heavily loaded test VM can stall it far longer. The wide kill-after window
# tolerates that while a forced kill stays fatal, so a real shutdown hang is
# still reported rather than tolerated.
- name: _verify | Run fluent-bit extension fixture
  command:
    argv:
      - timeout
      - --signal=TERM
      - --kill-after=15
      - "4"
      - /opt/fluent-bit/bin/fluent-bit
      - --config
      - "/tmp/fluent-bit-{{ fluentbit_verify_args.name }}-verify.yaml"
  register: fluentbit_verify_result
  changed_when: false
  failed_when: fluentbit_verify_result.rc not in [0, 124]
  become: true

# The fixture runs the daemon detached from journald, so the live-daemon Lua
# error check in the fluentbit role's own _verify cannot see it. A Lua
# exception leaves records untouched and would otherwise pass unnoticed
# whenever some other record still satisfies the expectations.
- name: _verify | Fixture ran without fluent-bit errors
  assert:
    that:
      - "'[error]' not in fluentbit_verify_result.stderr"
      - "'[error]' not in fluentbit_verify_result.stdout"
    fail_msg: |-
      fluent-bit reported errors while running the {{ fluentbit_verify_args.name }} fixture:
      {{ fluentbit_verify_result.stderr }}

- name: _verify | Assert fluent-bit extension records
  command:
    argv:
      - python3
      - -c
      - "{{ lookup('file', 'lnav_match.py') }}"
      - "-"
      - "{{ fluentbit_verify_args.expected | to_json }}"
    stdin: "{{ fluentbit_verify_result.stdout }}"
  changed_when: false

- name: _verify | Remove fluent-bit extension fixture
  file:
    path: "/tmp/fluent-bit-{{ fluentbit_verify_args.name }}-verify.yaml"
    state: absent
  become: true
