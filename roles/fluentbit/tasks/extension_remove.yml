# Remove retired service extensions and rebuild the include manifest once.
#
# Inputs: caller passes `fluentbit_extension_remove_args.names`, a non-empty
# list of extension identifiers previously installed by extension.yml.
- name: extension_remove | Validate arguments
  assert:
    quiet: true
    that:
      - fluentbit_extension_remove_args is defined
      - fluentbit_extension_remove_args is mapping
      - fluentbit_extension_remove_args.keys() | list | difference(['names']) | length == 0
      - fluentbit_extension_remove_args.names is sequence
      - fluentbit_extension_remove_args.names is not string
      - fluentbit_extension_remove_args.names | length > 0
      - fluentbit_extension_remove_args.names | select('match', '^[a-z0-9_]+$') | list | length == fluentbit_extension_remove_args.names | length
    fail_msg: >-
      fluentbit_extension_remove_args.names must be a non-empty list of
      extension identifiers matching [a-z0-9_]+.
  tags:
    - fluentbit

- name: extension_remove | Remove retired service extensions
  file:
    path: /etc/fluent-bit/services/{{ item }}.yaml
    state: absent
  loop: "{{ fluentbit_extension_remove_args.names }}"
  register: fluentbit_extension_remove_configs
  become: true
  tags:
    - fluentbit

- name: extension_remove | Find remaining service extensions
  find:
    paths: /etc/fluent-bit/services
    patterns: "*.yaml"
    file_type: file
  register: fluentbit_extension_remove_remaining
  become: true
  tags:
    - fluentbit

- name: extension_remove | Rebuild service extension manifest
  copy:
    content: |
      includes:{{ '' if fluentbit_extension_remove_remaining.files else ' []' }}
      {% for extension in fluentbit_extension_remove_remaining.files | map(attribute='path') | sort %}
        - {{ extension }}
      {% endfor %}
    dest: /etc/fluent-bit/services.yaml
    owner: root
    group: root
    mode: "0644"
    backup: true
    validate: python3 -c 'import yaml,sys; yaml.safe_load(open(sys.argv[1]))' "%s"
  register: fluentbit_extension_remove_manifest
  become: true
  tags:
    - fluentbit

- name: extension_remove | Validate rebuilt configuration
  when:
    - not ansible_check_mode
    - >-
      fluentbit_extension_remove_configs.changed | default(false)
      or fluentbit_extension_remove_manifest.changed | default(false)
  command: /opt/fluent-bit/bin/fluent-bit --config /etc/fluent-bit/fluent-bit.yaml --dry-run
  changed_when: false
  become: true
  tags:
    - fluentbit

- name: extension_remove | Reload Fluent Bit
  when:
    - not ansible_check_mode
    - >-
      fluentbit_extension_remove_configs.changed | default(false)
      or fluentbit_extension_remove_manifest.changed | default(false)
  systemd:
    name: fluent-bit.service
    state: reloaded
  become: true
  tags:
    - fluentbit
