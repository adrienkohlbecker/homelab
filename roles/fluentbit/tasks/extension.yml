- name: Assert fluent-bit extension arguments
  assert:
    that:
      - fluentbit_extension_args.keys() | list | difference(['name', 'lua_files']) | length == 0
      - fluentbit_extension_args.name is string
      - fluentbit_extension_args.name is match('^[a-z0-9_]+$')
      - fluentbit_extension_args.lua_files | default([]) is not string

- name: Assert fluent-bit extension Lua filenames
  assert:
    that:
      - item is string
      - item is match('^[a-z0-9_]+[.]lua$')
  loop: "{{ fluentbit_extension_args.lua_files | default([]) }}"

# Shared filters live in roles/fluentbit/files/ and are pulled in by name rather
# than duplicated per service. No validate: the target has no lua interpreter to
# syntax-check with -- the extension dry-run below is what catches a broken
# script, since fluent-bit loads every referenced filter at config parse time.
- name: Install shared Lua dependencies for fluent-bit extension  # noqa: require-validate
  copy:
    src: "{{ playbook_dir }}/roles/fluentbit/files/{{ item }}"
    dest: "/etc/fluent-bit/{{ item }}"
    owner: root
    group: root
    mode: "0644"
    backup: true
  loop: "{{ fluentbit_extension_args.lua_files | default([]) }}"
  register: fluentbit_extension_shared_lua
  become: true

- name: Install fluent-bit service extension
  copy:
    src: "{{ playbook_dir }}/roles/{{ fluentbit_extension_args.name }}/files/fluentbit.yaml"
    dest: "/etc/fluent-bit/services/{{ fluentbit_extension_args.name }}.yaml"
    owner: root
    group: root
    mode: "0644"
    backup: true
    validate: python3 -c 'import yaml,sys; yaml.safe_load(open(sys.argv[1]))' "%s"
  register: fluentbit_extension_config
  become: true

- name: Remove obsolete fluent-bit service normalizer
  file:
    path: "/etc/fluent-bit/{{ fluentbit_extension_args.name }}_normalize.lua"
    state: absent
  register: fluentbit_extension_lua_removed
  become: true

- name: Find installed fluent-bit service extensions
  find:
    paths: /etc/fluent-bit/services
    patterns: "*.yaml"
    file_type: file
  register: fluentbit_installed_extensions
  become: true

- name: Configure fluent-bit service extension manifest
  copy:
    content: |
      includes:
      {% for extension in fluentbit_installed_extensions.files | map(attribute='path') | sort %}
        - {{ extension }}
      {% endfor %}
    dest: /etc/fluent-bit/services.yaml
    owner: root
    group: root
    mode: "0644"
    backup: true
    validate: python3 -c 'import yaml,sys; yaml.safe_load(open(sys.argv[1]))' "%s"
  register: fluentbit_extension_manifest
  become: true

- name: Validate fluent-bit service extension
  command: /opt/fluent-bit/bin/fluent-bit --config /etc/fluent-bit/fluent-bit.yaml --dry-run
  changed_when: false
  when:
    - not ansible_check_mode
    - >-
      fluentbit_extension_config.changed or
      fluentbit_extension_shared_lua.changed or
      fluentbit_extension_lua_removed.changed or
      fluentbit_extension_manifest.changed
  become: true

- name: Reload fluent-bit for service extension
  when: not ansible_check_mode
  systemd:
    name: fluent-bit.service
    enabled: true
    state: >-
      {{ 'reloaded'
         if fluentbit_extension_config.changed or fluentbit_extension_shared_lua.changed
            or fluentbit_extension_lua_removed.changed or fluentbit_extension_manifest.changed
         else 'started' }}
  become: true
