# Lab covers ZFSBootMenu hosts and Minimal GRUB hosts without a ZFS root; both
# must come back from a deliberate panic unattended. x86 Minimal boots SeaBIOS,
# so only the UEFI cells exercise EFI pstore. Lab Noble covers the
# initramfs-tools boot image.
machines:
  lab:
  minimal:
arm:
  - lab
  - minimal
ubuntu:
  - noble
skip:
  "minimal:noble": >-
    Lab Noble covers the initramfs-tools boot image; Minimal Resolute covers
    the GRUB reboot on a host without a ZFS root.
