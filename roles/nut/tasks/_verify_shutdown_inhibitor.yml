# SHUTDOWNCMD must power off even while a root shutdown block lock is held:
# adguard_reboot_guard holds one on the last DNS server, and systemd 257+
# logind enforces it against root. Powering off would end the fixture, so this
# runs the configured command with only its target swapped for reboot.target,
# the way upsmon runs it: /bin/sh -c from a system service, outside any logind
# session, and with polkit unavailable.
#
# A SHUTDOWNCMD that does not power off matches nothing and fails this task.
- name: _verify | Read the configured SHUTDOWNCMD up to its poweroff target
  set_fact:
    nut_verify_shutdowncmd_prefix: >-
      {{ lookup('template', 'upsmon.conf.j2')
         | regex_search('^SHUTDOWNCMD "(.+) poweroff[.]target"$', '\1', multiline=True)
         | first }}

- name: _verify | Hold a shutdown block lock with polkit unavailable
  import_role:
    name: reboot
    tasks_from: _verify_shutdown_block_lock

# Noble's logind ignores a lock held by the caller's own uid, so this control
# would reboot there. On newer releases it proves the lock binds root, so the
# reboot below can only succeed by bypassing logind. The systemd module cannot
# request a logind reboot.
- name: _verify | An unflagged reboot is refused while the lock is held
  when: ansible_distribution_release != 'noble'
  command: /usr/bin/systemctl reboot # noqa: command-instead-of-module
  register: nut_verify_unflagged
  changed_when: false
  failed_when: >-
    nut_verify_unflagged.rc == 0
    or 'inhibitor' not in nut_verify_unflagged.stderr
  become: true

# Mitogen can retain a severed sudo.root context when a become-elevated reboot
# severs SSH. Elevate only the command so Ansible polls through the base context.
- name: _verify | SHUTDOWNCMD reboots through the lock from a service context
  reboot:
    reboot_command: >-
      /usr/bin/sudo -n /usr/bin/systemd-run --unit=nut_verify_shutdowncmd --collect
      /bin/sh -c {{ (nut_verify_shutdowncmd_prefix ~ ' reboot.target') | quote }}
    reboot_timeout: 240
