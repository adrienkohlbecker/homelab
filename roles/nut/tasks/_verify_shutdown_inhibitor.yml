# SHUTDOWNCMD must power off even while a root shutdown block lock is held:
# adguard_reboot_guard holds one on the last DNS server, and systemd 257+
# logind enforces it against root. Powering off would end the fixture, so this
# runs the configured command with only its target swapped for reboot.target,
# the way upsmon runs it: /bin/sh -c from a system service, outside any logind
# session, and with polkit unavailable.
- name: _verify | Read the configured SHUTDOWNCMD
  set_fact:
    nut_verify_shutdowncmd: >-
      {{ lookup('template', 'upsmon.conf.j2')
         | regex_search('^SHUTDOWNCMD "(.+)"$', '\1', multiline=True)
         | first }}

- name: _verify | SHUTDOWNCMD powers the host off
  assert:
    that:
      - nut_verify_shutdowncmd is match('.* poweroff[.]target$')
    fail_msg: "Expected a poweroff.target SHUTDOWNCMD, got: {{ nut_verify_shutdowncmd }}"

- name: _verify | Hold a root shutdown block lock like the DNS reboot guard
  command:
    argv:
      - systemd-run
      - --unit=nut_verify_inhibitor
      - --collect
      - systemd-inhibit
      - --what=shutdown
      - --mode=block
      - --who=nut_verify_inhibitor
      - --why=Simulate the last-DNS-server reboot guard
      - sleep
      - infinity
  changed_when: true
  become: true

# Plain grep (not -q): it consumes all input so systemd-inhibit never
# takes a SIGPIPE under pipefail.
- name: _verify | The block lock is held
  shell:
    cmd: >-
      set -euo pipefail;
      systemd-inhibit --list --no-legend | grep nut_verify_inhibitor
    executable: /bin/bash
  register: nut_verify_lock
  changed_when: false
  retries: 10
  delay: 1
  until: nut_verify_lock.rc == 0
  become: true

# A runtime mask also blocks D-Bus activation and lasts until the reboot below.
- name: _verify | Make polkit unavailable
  command: systemctl mask --runtime --now polkit.service # noqa: command-instead-of-module
  changed_when: true
  become: true

# Noble's logind ignores a lock held by the caller's own uid, so this control
# would reboot there. On newer releases it proves the lock binds root, so the
# reboot below can only succeed by bypassing logind. The systemd module cannot
# request a logind reboot.
- name: _verify | An unflagged reboot is refused while the lock is held
  when: ansible_distribution_release not in ['noble']
  command: /usr/bin/systemctl reboot # noqa: command-instead-of-module
  register: nut_verify_unflagged
  changed_when: false
  failed_when: >-
    nut_verify_unflagged.rc == 0
    or 'inhibitor' not in nut_verify_unflagged.stderr
  become: true

# Mitogen can retain a severed sudo.root context when a become-elevated reboot
# severs SSH. Elevate only the command so Ansible polls through the base context.
- name: _verify | SHUTDOWNCMD reboots through the lock from a service context
  reboot:
    reboot_command: >-
      /usr/bin/sudo -n /usr/bin/systemd-run --unit=nut_verify_shutdowncmd --collect
      /bin/sh -c {{ nut_verify_shutdowncmd | regex_replace(' poweroff[.]target$', ' reboot.target') | quote }}
    reboot_timeout: 240
