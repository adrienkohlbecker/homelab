# Functional check of the notification path and the forced-shutdown chain
# through a live upsmon. The destructive fixture runs only in a throwaway QEMU
# machine.

# nut_notify puts /usr/local/bin before /usr/bin, so this shim captures mail
# without installing a real MTA in the fixture.
- name: _verify | Install a capturing mail shim
  copy:
    dest: /usr/local/bin/mail
    mode: "0755"
    content: |
      #!/bin/bash
      { printf 'ARGS: %s\n' "$*"; cat; } >>/tmp/nut-mail.out
  become: true

# Exercise the REAL dispatch path upsmon uses -- NOTIFYCMD=upssched reading
# upssched.conf and matching AT rules to CMDSCRIPT=nut_notify -- not just
# nut_notify in isolation. upssched takes the event from $NOTIFYTYPE/$UPSNAME
# (the env upsmon sets); an EXECUTE rule (LOWBATT) runs CMDSCRIPT synchronously,
# so this lands in the mail shim without waiting on a START-TIMER interval.
- name: _verify | Ensure the upssched runtime dir exists
  file:
    path: /run/nut
    state: directory
    owner: root
    group: nut
    mode: "0770"
  become: true

# 0666: the real dispatches run as the unprivileged nut user (upsmon's
# RUN_AS_USER) and must be able to append.
- name: _verify | Reset the mail capture before the upssched dispatch test
  copy:
    dest: /tmp/nut-mail.out
    mode: "0666"
    content: ""
  become: true

- name: _verify | Dispatch a real EXECUTE event through upssched to nut_notify
  command: /usr/sbin/upssched
  environment:
    UPSNAME: "{{ nut_ups }}"
    NOTIFYTYPE: LOWBATT
  changed_when: false
  become: true
  become_user: nut

- name: _verify | The upssched-dispatched event reached the mail
  command: grep -qF "UPS is on battery and has a low battery" /tmp/nut-mail.out
  changed_when: false
  become: true

- name: _verify | Live UPS status reached the mail (upsc dump + field extraction)
  command: grep -qF "{{ item }}" /tmp/nut-mail.out
  loop:
    - "Status: OL"
    - "Battery charge: 42.00"
    # 900.00 (float, as the real Eaton reports) must still format to a real
    # HH:MM:SS -- "unknown" here means nut_notify rejected the fractional value.
    - "Runtime: 00:15:00"
  changed_when: false
  become: true

# The debounce leg: a START-TIMER rule makes upssched spawn its background
# daemon, create PIPEFN/LOCKFN in /run/nut as the nut user, and only fire
# CMDSCRIPT after the interval -- the machinery every real outage mail rides,
# which the synchronous EXECUTE above never touches.
- name: _verify | Dispatch a debounced START-TIMER event through upssched
  command: /usr/sbin/upssched
  environment:
    UPSNAME: "{{ nut_ups }}"
    NOTIFYTYPE: COMMBAD
  changed_when: false
  become: true
  become_user: nut

# The commbad timer runs 30s; 45 bounds it with margin.
- name: _verify | The debounced event fired after its interval
  command: grep -qF "Communications lost to the UPS" /tmp/nut-mail.out
  register: nut_timer_mail
  until: nut_timer_mail.rc == 0
  retries: 45
  delay: 1
  changed_when: false
  become: true

# ---- Forced-shutdown drill ----------------------------------------------
# End-to-end exercise of the real shutdown chain: dummy driver -> upsd ->
# upsmon -> FSD -> SHUTDOWNCMD. SHUTDOWNCMD is first re-pointed at a marker
# file so the box survives to assert the outcome; then the dummy UPS flips
# to on-battery low-battery and upsmon must declare FSD and run the
# (re-pointed) shutdown. Destructive to the converged upsmon.conf -- fine,
# the box is torn down afterwards.
- name: _verify | Re-point SHUTDOWNCMD at a marker instead of halting the box
  replace:
    path: /etc/nut/upsmon.conf
    regexp: '^SHUTDOWNCMD .*$'
    replace: 'SHUTDOWNCMD "/usr/bin/touch /tmp/nut_fsd_marker"'
  become: true

# converge leaves the unit enabled but unstarted under qemu (no UPS);
# start it here against the dummy upsd, on the still-benign OL
# frame, so it is connected and polling before the critical flip below.
- name: _verify | Start upsmon against the dummy upsd
  systemd:
    name: nut-monitor.service
    state: restarted
  become: true

# dummy-ups accepts live variable writes via upsrw -- no frame-file rewrite,
# driver restart, or reconnect window inside the FSD wait. Lowering the battery
# metrics matters on NUT 2.8.4, which derives LB from the configured thresholds
# instead of trusting LB in a direct status write. The qemu upsd.users grants
# actions = SET.
- name: _verify | Flip the dummy UPS to on-battery low-battery
  command: upsrw -s "{{ item }}" -u upsmon -p {{ nut_upsmon_password }} {{ nut_ups }}
  loop:
    - battery.charge=1
    - battery.runtime=60
    - ups.status=OB
  changed_when: false
  become: true

# upsmon polls every 5s (POLLFREQALERT once on battery), HOSTSYNC has no
# secondaries to wait on, then FINALDELAY 5 before SHUTDOWNCMD; 90s bounds
# both delays with wide margin.
- name: _verify | Upsmon declared FSD and ran SHUTDOWNCMD
  wait_for:
    path: /tmp/nut_fsd_marker
    timeout: 90
  become: true

- name: _verify | Upsd published the forced-shutdown status
  command: upsc {{ nut_ups }} ups.status
  register: nut_fsd_status
  changed_when: false
  failed_when: "'FSD' not in nut_fsd_status.stdout"
  become: true

# The SHUTDOWN NOTIFY rode the real chain (upsmon's nut-user half ->
# upssched -> nut_notify -> mail); its absence means the unprivileged
# dispatch path is broken even though the marker proved SHUTDOWNCMD ran.
# SHUTDOWN, not FSD: a primary declaring FSD notifies itself with SHUTDOWN
# ("Auto logout and shutdown proceeding") -- the FSD notify type is what
# secondaries receive when they observe the flag.
- name: _verify | The shutdown notification reached the mail
  command: grep -qF "The system is being shutdown" /tmp/nut-mail.out
  register: nut_shutdown_mail
  until: nut_shutdown_mail.rc == 0
  retries: 10
  delay: 1
  changed_when: false
  become: true

# Stop upsmon before the unreachable-UPS tests below take upsd down, so
# its NOCOMM reactions don't interleave mail-shim writes with the greps.
- name: _verify | Stop upsmon after the drill
  systemd:
    name: nut-monitor.service
    state: stopped
  become: true

- name: _verify | Stop upsd to simulate an unreachable UPS
  command: pkill -x upsd
  register: nut_pkill
  failed_when: nut_pkill.rc not in [0, 1]
  changed_when: false
  become: true

- name: _verify | Clear the mail capture
  copy:
    dest: /tmp/nut-mail.out
    mode: "0666"
    content: ""
  become: true

# The errexit-tolerance fix: the events that fire when the UPS is gone must
# still mail, falling back to "unknown" rather than aborting before `mail`.
- name: _verify | Notification still mails when upsd is down
  command: /usr/local/bin/nut_notify commbad
  changed_when: false
  become: true

- name: _verify | Degraded notification falls back to unknown fields
  command: 'grep -qF "Status: unknown" /tmp/nut-mail.out'
  changed_when: false
  become: true

# The catch-all arm: an event without a bespoke sentence (2.8+ device-status
# events, a future timer name) must still deliver a mail naming it, never
# vanish.
- name: _verify | Unknown events fall back to a generic mail
  command: /usr/local/bin/nut_notify bogus
  changed_when: false
  become: true

- name: _verify | The generic mail names the event
  command: 'grep -qF "UPS event: bogus" /tmp/nut-mail.out'
  changed_when: false
  become: true

# ---- Wake leg -------------------------------------------------------------
# Exercise the boot leg and its real three-round wakeonlan dispatch.
- name: _verify | Run the boot-time peer wake unit
  systemd:
    name: nut_wake_peers.service
    state: started
  become: true

- name: _verify | The wake run sent its magic packets
  shell: |
    set -euo pipefail
    journalctl -u nut_wake_peers.service --no-pager | grep -F "Sending magic packet"
  args:
    executable: /bin/bash
  changed_when: false
  become: true

# RemainAfterExit must hold the unit active after the run -- converge
# idempotence rides on a later `started` being a no-op, not a re-broadcast.
# `changed` here means the unit went back to inactive and re-fired.
- name: _verify | A repeat start is a no-op on the still-active unit
  systemd:
    name: nut_wake_peers.service
    state: started
  register: nut_wake_restart
  failed_when: nut_wake_restart.changed
  become: true
