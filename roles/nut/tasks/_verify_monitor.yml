# Functional check of the notification path and the forced-shutdown chain
# through a live upsmon. The destructive fixture runs only in a throwaway QEMU
# machine.

# nut_notify puts /usr/local/bin before /usr/bin, so this shim captures mail
# without installing a real MTA in the fixture.
- name: _verify | Install a capturing mail shim
  copy:
    dest: /usr/local/bin/mail
    mode: "0755"
    content: |
      #!/bin/bash
      { printf 'ARGS: %s\n' "$*"; cat; } >>/tmp/nut-mail.out
  become: true

# 0666: the real dispatches run as the unprivileged nut user (upsmon's
# RUN_AS_USER) and must be able to append.
- name: _verify | Reset the mail capture before the upssched dispatch test
  copy:
    dest: /tmp/nut-mail.out
    mode: "0666"
    content: ""
  become: true

# Exercise the REAL dispatch path upsmon uses -- NOTIFYCMD=upssched reading
# upssched.conf and matching AT rules to CMDSCRIPT=nut_notify -- not just
# nut_notify in isolation. upssched takes the event from $NOTIFYTYPE/$UPSNAME
# (the env upsmon sets); an EXECUTE rule (LOWBATT) runs CMDSCRIPT synchronously,
# so this lands in the mail shim without waiting on a START-TIMER interval.
- name: _verify | Dispatch a real EXECUTE event through upssched to nut_notify
  command: /usr/sbin/upssched
  environment:
    UPSNAME: "{{ nut_ups }}"
    NOTIFYTYPE: LOWBATT
  changed_when: false
  become: true
  become_user: nut

- name: _verify | The upssched-dispatched event reached the mail
  command: grep -qF "UPS is on battery and has a low battery" /tmp/nut-mail.out
  changed_when: false
  become: true

- name: _verify | Live UPS status reached the mail (upsc dump + field extraction)
  command: grep -qF "{{ item }}" /tmp/nut-mail.out
  loop:
    - "Status: OL"
    - "Battery charge: 42.00"
    # 900.00 (float, as the real Eaton reports) must still format to a real
    # HH:MM:SS -- "unknown" here means nut_notify rejected the fractional value.
    - "Runtime: 00:15:00"
  changed_when: false
  become: true

# ---- Forced-shutdown drill ----------------------------------------------
# End-to-end exercise of the real shutdown chain: dummy driver -> upsd ->
# upsmon -> FSD -> SHUTDOWNCMD. SHUTDOWNCMD is first re-pointed at a marker
# file so the fixture survives to assert the outcome; then the dummy UPS flips
# to on-battery low-battery and upsmon must declare FSD and run the
# (re-pointed) shutdown. Destructive to the converged upsmon.conf -- fine,
# the fixture is torn down afterwards.
- name: _verify | Re-point SHUTDOWNCMD at a marker instead of halting the fixture
  replace:
    path: /etc/nut/upsmon.conf
    regexp: '^SHUTDOWNCMD .*$'
    replace: 'SHUTDOWNCMD "/usr/bin/touch /tmp/nut_fsd_marker"'
  become: true

# converge leaves the unit enabled but unstarted under qemu (no UPS);
# start it here against the dummy upsd, on the still-benign OL
# frame, so it is connected and polling before the critical flip below.
- name: _verify | Start upsmon against the dummy upsd
  systemd:
    name: nut-monitor.service
    state: restarted
  become: true

# dummy-ups accepts live variable writes via upsrw -- no frame-file rewrite,
# driver restart, or reconnect window inside the FSD wait. Lowering the battery
# metrics matters on NUT 2.8.4, which derives LB from the configured thresholds
# instead of trusting LB in a direct status write. The qemu upsd.users grants
# actions = SET.
- name: _verify | Flip the dummy UPS to on-battery low-battery
  command: upsrw -s "{{ item }}" -u upsmon -p {{ nut_upsmon_password }} {{ nut_ups }}
  loop:
    - battery.charge=1
    - battery.runtime=60
    - ups.status=OB
  changed_when: false
  become: true

# upsmon polls every 5s (POLLFREQALERT once on battery), HOSTSYNC has no
# secondaries to wait on, then FINALDELAY 5 before SHUTDOWNCMD; 90s bounds
# both delays with wide margin.
- name: _verify | Upsmon declared FSD and ran SHUTDOWNCMD
  wait_for:
    path: /tmp/nut_fsd_marker
    timeout: 90
  become: true

# The SHUTDOWN NOTIFY rode the real chain (upsmon's nut-user half ->
# upssched -> nut_notify -> mail); its absence means the unprivileged
# dispatch path is broken even though the marker proved SHUTDOWNCMD ran.
# SHUTDOWN, not FSD: a primary declaring FSD notifies itself with SHUTDOWN
# ("Auto logout and shutdown proceeding") -- the FSD notify type is what
# secondaries receive when they observe the flag.
- name: _verify | The shutdown notification reached the mail
  command: grep -qF "The system is being shutdown" /tmp/nut-mail.out
  register: nut_shutdown_mail
  until: nut_shutdown_mail.rc == 0
  retries: 10
  delay: 1
  changed_when: false
  become: true

# Stop upsmon before the unreachable-UPS tests below take upsd down, so
# its NOCOMM reactions don't interleave mail-shim writes with the greps.
- name: _verify | Stop upsmon after the drill
  systemd:
    name: nut-monitor.service
    state: stopped
  become: true

# ---- On-battery timer drill -----------------------------------------------
# The time-based ladder step: ONBATT starts upssched's onbatt_shutdown timer,
# ONLINE cancels it, and expiry makes nut_notify ask upsmon for FSD. The dummy
# keeps a healthy charge and runtime throughout, so only the timer can produce
# the FSD. group_vars/test.yml shortens the delay.

# The low-battery drill's ONBATT left timers pending in the upssched daemon;
# one firing `upsmon -c fsd` mid-drill would fake a pass.
- name: _verify | Stop the upssched timer daemon left by the low-battery drill
  command: pkill -x upssched
  register: nut_pkill_upssched
  failed_when: nut_pkill_upssched.rc not in [0, 1]
  changed_when: false
  become: true

# upsd holds the FSD flag until it restarts; the driver restart reloads the
# benign OL frame over the drill's upsrw writes.
- name: _verify | Restart the dummy driver and upsd to clear the drill FSD
  systemd:
    name: "{{ item }}"
    state: restarted
  loop:
    - nut-driver@eaton.service
    - nut-server.service
  become: true

- name: _verify | Dummy UPS is back on line without FSD
  command: upsc {{ nut_ups }} ups.status
  register: nut_timer_status
  until: nut_timer_status.stdout == 'OL'
  retries: 15
  delay: 1
  changed_when: false
  become: true

- name: _verify | Remove the forced-shutdown marker
  file:
    path: /tmp/nut_fsd_marker
    state: absent
  become: true

- name: _verify | Clear the mail capture before the timer drill
  copy:
    dest: /tmp/nut-mail.out
    mode: "0666"
    content: ""
  become: true

- name: _verify | Start upsmon for the timer drill
  systemd:
    name: nut-monitor.service
    state: started
  become: true

- name: _verify | Mark the start of the cancel leg
  command: date +%s
  register: nut_cancel_start
  changed_when: false

- name: _verify | Put the dummy UPS on battery for the cancel leg
  command: upsrw -s ups.status=OB -u upsmon -p {{ nut_upsmon_password }} {{ nut_ups }}
  changed_when: false
  become: true

# upsmon logs each transition it acts on, so the journal proves it saw OB
# (and so started the timer) before mains returns.
- name: _verify | Upsmon saw the on-battery transition
  command: journalctl -u nut-monitor.service --since @{{ nut_cancel_start.stdout }} --no-pager
  register: nut_cancel_journal
  until: "'on battery' in nut_cancel_journal.stdout"
  retries: 20
  delay: 1
  changed_when: false
  become: true

- name: _verify | Return the dummy UPS to mains
  command: upsrw -s ups.status=OL -u upsmon -p {{ nut_upsmon_password }} {{ nut_ups }}
  changed_when: false
  become: true

- name: _verify | Upsmon saw mains return
  command: journalctl -u nut-monitor.service --since @{{ nut_cancel_start.stdout }} --no-pager
  register: nut_cancel_journal
  until: "'on line power' in nut_cancel_journal.stdout"
  retries: 20
  delay: 1
  changed_when: false
  become: true

- name: _verify | Outlive the cancelled timer
  wait_for:
    timeout: "{{ nut_onbatt_shutdown_delay + 10 }}"

- name: _verify | Read the marker after the cancelled timer
  stat:
    path: /tmp/nut_fsd_marker
  register: nut_cancel_marker
  become: true

- name: _verify | Mains return cancelled the forced shutdown
  assert:
    that:
      - not nut_cancel_marker.stat.exists
    fail_msg: An on-battery blip shorter than the delay still forced a shutdown
    quiet: true

- name: _verify | Mark the start of the fire leg
  command: date +%s
  register: nut_fire_start
  changed_when: false

- name: _verify | Put the dummy UPS on battery for the fire leg
  command: upsrw -s ups.status=OB -u upsmon -p {{ nut_upsmon_password }} {{ nut_ups }}
  changed_when: false
  become: true

# The delay, plus one 5s poll to see OB, FINALDELAY 5, and margin.
- name: _verify | The timer forced the shutdown
  wait_for:
    path: /tmp/nut_fsd_marker
    timeout: "{{ nut_onbatt_shutdown_delay + 40 }}"
  become: true

- name: _verify | Read the marker after the fired timer
  stat:
    path: /tmp/nut_fsd_marker
  register: nut_fire_marker
  become: true

- name: _verify | Read the mail captured during the timer drill
  slurp:
    path: /tmp/nut-mail.out
  register: nut_fire_mail
  become: true

# Not before the delay elapsed, announced by the timer arm, and with no
# low-battery event behind it.
- name: _verify | The forced shutdown came from the on-battery timer
  assert:
    that:
      - nut_fire_marker.stat.mtime - (nut_fire_start.stdout | int) >= nut_onbatt_shutdown_delay
      - "'forcing shutdown' in (nut_fire_mail.content | b64decode)"
      - "'has a low battery' not in (nut_fire_mail.content | b64decode)"
    fail_msg: >-
      marker after {{ nut_fire_marker.stat.mtime - (nut_fire_start.stdout | int) }}s,
      mail: {{ nut_fire_mail.content | b64decode | truncate(600) }}
    quiet: true

- name: _verify | Stop upsmon after the timer drill
  systemd:
    name: nut-monitor.service
    state: stopped
  become: true

- name: _verify | Stop upsd to simulate an unreachable UPS
  command: pkill -x upsd
  register: nut_pkill
  failed_when: nut_pkill.rc not in [0, 1]
  changed_when: false
  become: true

- name: _verify | Clear the mail capture
  copy:
    dest: /tmp/nut-mail.out
    mode: "0666"
    content: ""
  become: true

# The errexit-tolerance fix: the events that fire when the UPS is gone must
# still mail, falling back to "unknown" rather than aborting before `mail`.
- name: _verify | Notification still mails when upsd is down
  command: /usr/local/bin/nut_notify commbad
  changed_when: false
  become: true

- name: _verify | Degraded notification falls back to unknown fields
  command: 'grep -qF "Status: unknown" /tmp/nut-mail.out'
  changed_when: false
  become: true

# The catch-all arm: an event without a bespoke sentence (2.8+ device-status
# events, a future timer name) must still deliver a mail naming it, never
# vanish.
- name: _verify | Unknown events fall back to a generic mail
  command: /usr/local/bin/nut_notify bogus
  changed_when: false
  become: true

- name: _verify | The generic mail names the event
  command: 'grep -qF "UPS event: bogus" /tmp/nut-mail.out'
  changed_when: false
  become: true

# ---- Wake leg -------------------------------------------------------------
# Exercise the boot leg and its real three-round wakeonlan dispatch.
- name: _verify | Exercise boot-time peer wake
  block:
    - name: _verify | Run the boot-time peer wake unit
      systemd:
        name: nut_wake_peers.service
        state: started
      become: true

    - name: _verify | The wake run sent its magic packets
      command:
        argv:
          - journalctl
          - -u
          - nut_wake_peers.service
          - --no-pager
      register: nut_wake_journal
      changed_when: false
      # Type=exec returns once the script starts; its first round follows.
      until: "'Sending magic packet' in nut_wake_journal.stdout"
      retries: 10
      delay: 1
      become: true
