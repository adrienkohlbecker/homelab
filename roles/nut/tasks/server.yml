- name: Configure nut nut.conf  # noqa: require-validate
  when: not (ansible_check_mode and nut_apt.changed)
  copy:
    src: nut.conf
    dest: /etc/nut/nut.conf
    backup: true
    owner: root
    group: nut
    mode: "0640"
  become: true
  register: nut_mode_conf
  tags:
    - nut

# upsdrvctl cannot validate an arbitrary render path; _verify starts the driver.
- name: Configure nut ups.conf  # noqa: require-validate
  when: not (ansible_check_mode and nut_apt.changed)
  template:
    src: ups.conf.j2
    dest: /etc/nut/ups.conf
    owner: root
    group: nut
    mode: "0640"
    backup: true
  register: nut_ups_conf
  become: true
  tags:
    - nut

- name: Configure the dummy UPS data for qemu  # noqa: require-validate
  when:
    - qemu_test | bool
    - not (ansible_check_mode and nut_apt.changed)
  copy:
    dest: /etc/nut/eaton.dev
    owner: root
    group: nut
    mode: "0640"
    backup: true
    content: |
      ups.status: OL
      battery.charge: 42.00
      battery.runtime: 900.00
      ups.mfr: dummy
      ups.model: evolution500
  become: true
  tags:
    - nut

- name: Configure nut upsd.conf  # noqa: require-validate
  when: not (ansible_check_mode and nut_apt.changed)
  template:
    src: upsd.conf.j2
    dest: /etc/nut/upsd.conf
    backup: true
    owner: root
    group: nut
    mode: "0640"
  become: true
  register: nut_upsd_conf
  tags:
    - nut

# upsd has no offline checker; _verify starts the server with this file.
- name: Configure nut upsd.users  # noqa: require-validate
  when: not (ansible_check_mode and nut_apt.changed)
  template:
    src: upsd.users.j2
    dest: /etc/nut/upsd.users
    owner: root
    group: nut
    mode: "0640"
    backup: true
  become: true
  register: nut_upsd_users
  tags:
    - nut

- name: Configure nut hosts.conf  # noqa: require-validate
  when: not (ansible_check_mode and nut_apt.changed)
  copy:
    src: hosts.conf
    dest: /etc/nut/hosts.conf
    backup: true
    owner: root
    group: root
    mode: "0644"
  become: true
  tags:
    - nut

- name: Enable nut-driver service
  when: not (ansible_check_mode and nut_apt.changed)
  systemd:
    name: nut-driver@eaton.service
    enabled: true
    state: "{{ 'restarted' if nut_mode_conf.changed or nut_ups_conf.changed else 'started' }}"
  become: true
  tags:
    - nut

- name: Enable nut-server service
  when: not (ansible_check_mode and nut_apt.changed)
  systemd:
    name: nut-server.service
    enabled: true
    state: >-
      {{ 'restarted'
         if nut_mode_conf.changed or nut_upsd_conf.changed or nut_upsd_users.changed
         else 'started' }}
  become: true
  tags:
    - nut

- name: Enable fcgiwrap socket
  when: not (ansible_check_mode and nut_apt.changed)
  systemd:
    name: fcgiwrap.socket
    enabled: true
    state: started
  become: true
  tags:
    - nut

- name: Configure nginx
  import_role:
    name: nginx
    tasks_from: site
  vars:
    nginx_site_args:
      subdomain: nut
      auth: true
      server_conf: |
        location = / {
          return 301 /upsstats.cgi;
        }
      location_conf: |
        gzip off;

        # Admit only the read-only status and image programs. auth_request is
        # inherited from the enclosing `location /`, so both stay
        # Authelia-gated while the state-changing upsset.cgi remains absent.
        location ~ ^/(upsstats|upsimage)\.cgi$ {
          include /etc/nginx/fastcgi_params;

          fastcgi_pass  unix:/var/run/fcgiwrap.socket;
          fastcgi_param SCRIPT_FILENAME  /usr/lib/cgi-bin/nut$fastcgi_script_name;
        }
  tags:
    - nut
