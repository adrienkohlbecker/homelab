# Qemu convergence runs the packaged driver and server units against a static
# dummy-ups frame. Reaching OL through upsc therefore exercises the normal
# systemd lifecycle as well as the driver -> upsd path.
- name: _verify | Wait for the dummy UPS to publish OL over upsc
  command: upsc {{ nut_ups }} ups.status
  register: nut_upsc
  until: '"OL" in nut_upsc.stdout'
  retries: 15
  delay: 1
  changed_when: false
  become: true

# WinNUT logs in the way a remote upsmon does. upsd grants LOGIN only to
# users with an upsmon role, so OK to all three proves the account, its
# password and its monitor role.
- name: _verify | WinNUT account logs in to upsd as a remote monitor
  command:
    argv:
      - python3
      - -c
      - |
        import socket
        import sys

        with socket.create_connection(("127.0.0.1", int(sys.argv[1])), timeout=5) as conn:
            stream = conn.makefile("rw")
            for line in ("USERNAME winnut", f"PASSWORD {sys.argv[2]}", "LOGIN eaton"):
                stream.write(line + "\n")
                stream.flush()
                print(stream.readline().strip())
      - "{{ service_ports.nut }}"
      - "{{ nut_winnut_password }}"
  register: nut_winnut_login
  changed_when: false
  failed_when: nut_winnut_login.stdout_lines != ['OK', 'OK', 'OK']

# The CGI status page: nginx 301s / -> /upsstats.cgi, proxied to nut-cgi over
# the role-managed fcgiwrap socket. The site has auth enabled,
# so _setup's Authelia stub admits the auth_request subrequest.
# Snakeoil cert -> validate_certs: false. Broad status_code list lets a
# transient 502 (fcgiwrap warming) retry; the `until` pins success on a real 200.
- name: _verify | NUT CGI status page is served through nginx + fcgiwrap
  uri:
    url: https://nut.{{ inventory_hostname }}.{{ domain }}/upsstats.cgi?host={{ nut_ups }}
    validate_certs: false
    return_content: true
    status_code: [ 200, 301, 302, 401, 403, 502, 503 ]
  register: nut_cgi
  until: nut_cgi.status is defined and nut_cgi.status == 200
  retries: 15
  delay: 2
  become: true

# 200 alone proves the nginx -> auth -> fcgiwrap -> CGI wiring; this proves the
# CGI actually reached upsd and rendered live data rather than an "unavailable"
# placeholder. `eaton` is the queried UPS name; hosts.conf's "Local UPS" desc
# also surfaces in the page.
- name: _verify | CGI rendered live UPS data (reached upsd, not "unavailable")
  assert:
    that:
      - "'eaton' in nut_cgi.content"
      - "'unavailable' not in (nut_cgi.content | lower)"
    fail_msg: "upsstats.cgi did not render live UPS data; content was: {{ nut_cgi.content | truncate(600) }}"

- name: _verify | NUT CGI status image is served
  uri:
    url: https://nut.{{ inventory_hostname }}.{{ domain }}/upsimage.cgi?host={{ nut_ups }}&display=battery.charge
    validate_certs: false
    status_code: 200
  become: true

- name: _verify | NUT control CGI is not exposed
  uri:
    url: https://nut.{{ inventory_hostname }}.{{ domain }}/upsset.cgi
    validate_certs: false
    status_code: 404
  become: true

- name: _verify | Exercise monitoring and shutdown behavior
  import_tasks: _verify_monitor.yml

# Last: it reboots the fixture.
- name: _verify | Exercise SHUTDOWNCMD through a shutdown block lock
  import_tasks: _verify_shutdown_inhibitor.yml
