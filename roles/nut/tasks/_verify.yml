# Qemu convergence runs the packaged driver and server units against a static
# dummy-ups frame. Reaching OL through upsc therefore exercises the normal
# systemd lifecycle as well as the driver -> upsd path.
- name: _verify | Render physical UPS and no-peer notification configs
  template:
    src: "{{ item.src }}"
    dest: "/tmp/{{ item.dest }}"
    mode: "0755"
  vars:
    qemu_test: false
    nut_wake_peers: []
  loop:
    - src: ups.conf.j2
      dest: nut-physical-ups.conf
    - src: nut_notify.sh.j2
      dest: nut-notify-no-peers.sh
    - src: upssched.conf.j2
      dest: nut-upssched-no-peers.conf
    - src: upsd.users.j2
      dest: nut-physical-upsd.users
  diff: false
  become: true

- name: _verify | Verify physical UPS and no-peer notification configs
  command:
    argv:
      - python3
      - -c
      - |
        import pathlib

        ups = pathlib.Path("/tmp/nut-physical-ups.conf").read_text()
        assert "driver = snmp-ups" in ups
        assert "driver = dummy-ups" not in ups
        notify = pathlib.Path("/tmp/nut-notify-no-peers.sh").read_text()
        assert "wake_peers)" not in notify
        schedule = pathlib.Path("/tmp/nut-upssched-no-peers.conf").read_text()
        assert "START-TIMER wake_peers" not in schedule
        users = pathlib.Path("/tmp/nut-physical-upsd.users").read_text()
        assert not any(line.strip() == "actions = SET" for line in users.splitlines())
  changed_when: false
  become: true

- name: _verify | Parse the no-peer notification script
  command: bash -n /tmp/nut-notify-no-peers.sh
  changed_when: false
  become: true

- name: _verify | Exercise changed physical monitor config in check mode
  import_tasks: monitor_config.yml
  vars:
    qemu_test: false
    nut_wake_peers: []
  check_mode: true

- name: _verify | Exercise physical monitor restart through production tasks
  import_tasks: monitor_state.yml
  vars:
    qemu_test: false
    nut_wake_peers: []
  check_mode: true

- name: _verify | Preserve the active QEMU monitor configs
  copy:
    src: "/etc/nut/{{ item }}"
    dest: "/tmp/nut-{{ item }}.qemu"
    remote_src: true
    mode: "0600"
  loop:
    - upsmon.conf
    - upssched.conf
  diff: false
  become: true

- name: _verify | Exercise unchanged physical monitor config
  block:
    - name: _verify | Apply physical monitor config through production tasks
      import_tasks: monitor_config.yml
      vars:
        qemu_test: false
        nut_wake_peers: []

    - name: _verify | Recheck physical monitor config through production tasks
      import_tasks: monitor_config.yml
      vars:
        qemu_test: false
        nut_wake_peers: []
      check_mode: true

    - name: _verify | Exercise physical monitor startup through production tasks
      import_tasks: monitor_state.yml
      vars:
        qemu_test: false
        nut_wake_peers: []
      check_mode: true

  always:
    - name: _verify | Restore active QEMU monitor configs
      copy:
        src: "/tmp/nut-{{ item }}.qemu"
        dest: "/etc/nut/{{ item }}"
        remote_src: true
        owner: root
        group: nut
        mode: "0640"
      loop:
        - upsmon.conf
        - upssched.conf
      diff: false
      become: true

    - name: _verify | Remove QEMU monitor config backups
      file:
        path: "/tmp/nut-{{ item }}.qemu"
        state: absent
      loop:
        - upsmon.conf
        - upssched.conf
      become: true

- name: _verify | Remove alternate NUT configs
  file:
    path: "/tmp/{{ item }}"
    state: absent
  loop:
    - nut-physical-ups.conf
    - nut-notify-no-peers.sh
    - nut-upssched-no-peers.conf
    - nut-physical-upsd.users
  become: true

- name: _verify | Wait for the dummy UPS to publish OL over upsc
  command: upsc eaton@localhost ups.status
  register: nut_upsc
  until: '"OL" in nut_upsc.stdout'
  retries: 15
  delay: 1
  changed_when: false
  become: true

- name: _verify | Read configured upsd users
  slurp:
    path: /etc/nut/upsd.users
  register: nut_upsd_users_file
  become: true

- name: _verify | WinNUT account is configured as a remote monitor
  assert:
    that:
      - "'[winnut]' in (nut_upsd_users_file.content | b64decode)"
      - "'password = ' ~ nut_winnut_password in (nut_upsd_users_file.content | b64decode)"
      - "'upsmon secondary' in (nut_upsd_users_file.content | b64decode)"
    quiet: true

- name: _verify | Map the nut vhost FQDN to loopback for SNI-correct probing
  import_role:
    name: nginx
    tasks_from: test_loopback_hosts
  vars:
    nginx_test_loopback_hosts_args:
      hostnames:
        - "nut.{{ inventory_hostname }}.{{ domain }}"

# The CGI status page: nginx 301s / -> /upsstats.cgi, proxied to nut-cgi over
# the role-managed fcgiwrap socket. The site has auth enabled,
# so _setup's Authelia stub admits the auth_request subrequest.
# Snakeoil cert -> validate_certs: false. Broad status_code list lets a
# transient 502 (fcgiwrap warming) retry; the `until` pins success on a real 200.
- name: _verify | NUT CGI status page is served through nginx + fcgiwrap
  uri:
    url: https://nut.{{ inventory_hostname }}.{{ domain }}/upsstats.cgi?host=eaton@localhost
    validate_certs: false
    return_content: true
    status_code: [ 200, 301, 302, 401, 403, 502, 503 ]
  register: nut_cgi
  until: nut_cgi.status is defined and nut_cgi.status == 200
  retries: 15
  delay: 2
  become: true

# 200 alone proves the nginx -> auth -> fcgiwrap -> CGI wiring; this proves the
# CGI actually reached upsd and rendered live data rather than an "unavailable"
# placeholder. `eaton` is the queried UPS name; hosts.conf's "Local UPS" desc
# also surfaces in the page.
- name: _verify | CGI rendered live UPS data (reached upsd, not "unavailable")
  assert:
    that:
      - "'eaton' in nut_cgi.content"
      - "'unavailable' not in (nut_cgi.content | lower)"
    fail_msg: "upsstats.cgi did not render live UPS data; content was: {{ nut_cgi.content | truncate(600) }}"

- name: _verify | NUT CGI status image is served
  uri:
    url: https://nut.{{ inventory_hostname }}.{{ domain }}/upsimage.cgi?host=eaton@localhost&display=battery.charge
    validate_certs: false
    status_code: 200
  become: true

- name: _verify | NUT control CGI is not exposed
  uri:
    url: https://nut.{{ inventory_hostname }}.{{ domain }}/upsset.cgi
    validate_certs: false
    status_code: 404
  become: true

- name: _verify | Exercise monitoring and shutdown behavior
  import_tasks: _verify_monitor.yml
