# Upsmon completes the staged shutdown ladder: the windows box (unmanaged, on
# Eaton's vendor IPP agent) drops first on a short on-battery timer, lab at
# 20%/300s, pug last at 5%/180s. Power cuts and restarts are card-native
# (per-group load shedding below each trigger, forced reboot on AC return;
# notes/ups_shutdown_ladder.md); the wake_peers hooks cover the hosts an
# outage strands shut-down-but-still-powered.

# upsmon.conf/upssched.conf carry no validate: -- NUT ships no offline config
# checker (the daemons only parse at startup) and the whitespace-directive
# format isn't INI, so there's no real parser to invent. nut_notify below
# validates with `bash -n` since it is a script.
- name: Configure nut upsmon.conf  # noqa: require-validate
  when: not (ansible_check_mode and nut_apt.changed)
  template:
    src: upsmon.conf.j2
    dest: /etc/nut/upsmon.conf
    backup: true
    owner: root
    group: nut
    mode: "0640"
  become: true
  register: nut_upsmon_conf
  tags:
    - nut

- name: Configure nut upssched.conf  # noqa: require-validate
  when: not (ansible_check_mode and nut_apt.changed)
  template:
    src: upssched.conf.j2
    dest: /etc/nut/upssched.conf
    backup: true
    owner: root
    group: nut
    mode: "0640"
  become: true
  register: nut_upssched_conf
  tags:
    - nut

# The fact's own broadcast key is empty on some NICs, including the QEMU fixture.
- name: Validate the wake network
  when: nut_wake_peers | length > 0
  assert:
    quiet: true
    that:
      - ansible_facts.default_ipv4.interface is defined
      - ansible_facts.default_ipv4.interface is not match('^(wg|podman|virbr|docker|br-|veth)')
      - nut_broadcast is match('^([0-9]{1,3}[.]){3}[0-9]{1,3}$')
    fail_msg: >-
      ansible_facts.default_ipv4 must identify a LAN interface and yield a
      valid broadcast address for the wake_peers arm
  tags:
    - nut

- name: Configure nut_notify
  template:
    src: nut_notify.sh.j2
    dest: /usr/local/bin/nut_notify
    owner: root
    group: root
    mode: "0755"
    backup: true
    validate: bash -n %s
  become: true
  tags:
    - nut

# Only hosts with peers to revive need the packaged wakeonlan sender.
- name: Install wakeonlan
  when: nut_wake_peers | length > 0
  apt:
    pkg:
      - wakeonlan
    cache_valid_time: 3600
  become: true
  tags:
    - nut

- name: Manage the boot-time peer wake unit
  when: nut_wake_peers | length > 0
  import_role:
    name: systemd_unit
    tasks_from: unit
  vars:
    systemd_unit_args:
      src: nut_wake_peers.service
      start: false
  tags:
    - nut

# Emptying the list must remove the boot unit so it cannot wake stale peers.
- name: Remove the boot-time peer wake unit
  when: nut_wake_peers | length == 0
  import_role:
    name: systemd_unit
    tasks_from: remove
  vars:
    systemd_unit_args:
      dest: nut_wake_peers.service
  tags:
    - nut

# start: gates on qemu_test -- the fixture has no real UPS to reach, so the
# unit is only enabled (it still starts at the _site_test reboot and idles
# on NOCOMM retries, which upsmon tolerates indefinitely).
#
# restart (not `upsmon -c reload`) is deliberate: reload cannot change
# SHUTDOWNCMD or POWERDOWNFLAG -- the privileged (root) half keeps its
# startup copy (upsmon split-process model). The cost is that a config converge
# mid-outage drops any in-flight upssched debounce timer; acceptable for a rare
# event.
# nut_notify is never a trigger -- upssched exec's it fresh per event, so a
# script-only change needs nothing.
- name: Enable NUT monitor service
  when: not (ansible_check_mode and nut_apt.changed)
  systemd:
    # nut-client.service is a symlink to nut-monitor.service (the upsmon unit).
    name: nut-client.service
    enabled: true
    state: >-
      {{ ('restarted' if nut_upsmon_conf.changed or nut_upssched_conf.changed else 'started')
         if not qemu_test else omit }}
  become: true
  tags:
    - nut
