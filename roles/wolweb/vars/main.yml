wolweb_broadcast_ip: "{{ (ansible_facts.default_ipv4.address + '/' + ansible_facts.default_ipv4.netmask) | ansible.utils.ipaddr('broadcast') }}"

# Role-owned UI targets whose MACs come from `mac_addresses`. Targets without
# wake_destination use the host's management broadcast; off-segment targets use
# the UDM gateway, where udm_wol_relay rebroadcasts the packet.
wolweb_devices:
  - name: Lab
    mac: "{{ mac_addresses.lab_i210 }}"
  - name: Pug
    mac: "{{ mac_addresses.pug }}"
  # The home-VLAN target is relayed through the UDM management gateway.
  - name: Windows
    mac: "{{ mac_addresses.game }}"
    wake_destination: "{{ network.sites.home.vlans.management.gateway }}:9"
