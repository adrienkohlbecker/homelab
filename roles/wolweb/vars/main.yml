# Wake-on-LAN targets advertised by the wolweb UI. Each entry references a
# key in `mac_addresses` (a host/group var); the catalog itself is role-owned
# structure, mirroring homepage_bookmarks. wolweb remains the UI for
# management-VLAN targets that lab/pug can reach directly; cross-VLAN wakes
# use the UDM UDP/9 relay instead. The role runs on lab and pug so each can
# wake the other (a host cannot WoL itself); the list is the union of their
# wakeable NICs.
wolweb_devices:
  - name: Lab
    mac: "{{ mac_addresses.lab_i210 }}"
  - name: Pug
    mac: "{{ mac_addresses.pug }}"
