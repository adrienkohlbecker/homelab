- name: _verify | Wolweb health endpoint answers on loopback port
  uri:
    url: http://localhost:{{ service_ports.wolweb }}/health
  register: _wolweb_health
  retries: 5
  delay: 1
  until: _wolweb_health.status == 200

- name: _verify | Create unique wolweb fluent-bit marker
  set_fact:
    wolweb_lnav_marker: "verify_wolweb_{{ ansible_date_time.iso8601_basic_short }}_{{ 99999 | random }}"

# Write through PID 1's stderr so conmon records the fixture; ordinary
# `podman exec` stderr returns directly to Ansible.
- name: _verify | Emit representative wolweb logger record
  command:
    argv:
      - podman
      - exec
      - wolweb
      - /bin/sh
      - -c
      - >-
        printf "%s\n" "2099/01/02 03:04:05 Warning: {{ wolweb_lnav_marker }}"
        > /proc/1/fd/2
  changed_when: false
  become: true

- name: _verify | Wait for normalized wolweb record in lnav store
  command:
    argv:
      - python3
      - -c
      - |
        import json
        import sys

        with open(sys.argv[1], encoding="utf-8") as handle:
            for line in handle:
                try:
                    record = json.loads(line)
                except json.JSONDecodeError:
                    continue
                if record.get("message") != sys.argv[2]:
                    continue
                fields = record.get("fields", {})
                if (
                    record.get("service") == "wolweb"
                    and record.get("unit") == "wolweb.service"
                    and record.get("level") == "warn"
                    and fields.get("parser_status") == "parsed"
                    and fields.get("CONTAINER_ID")
                    and "wolweb_timestamp" not in fields
                    and "wolweb_level" not in fields
                ):
                    print(json.dumps(record, sort_keys=True))
                    sys.exit(0)
        sys.exit(1)
      - /var/log/fluent-bit/lnav.jsonl
      - "{{ wolweb_lnav_marker }}"
  register: _wolweb_lnav_record
  changed_when: false
  retries: 30
  delay: 2
  until: _wolweb_lnav_record.rc == 0
  become: true

# Host networking removes port isolation, so prove the unauthenticated UI's
# loopback bind does not regress to the management LAN.
- name: _verify | Wolweb port is closed on the host LAN IP (bound to loopback only)
  wait_for:
    host: "{{ ansible_facts.default_ipv4.address }}"
    port: "{{ service_ports.wolweb }}"
    state: stopped
    timeout: 5

- name: _verify | Wolweb serves the templated device list
  uri:
    url: http://localhost:{{ service_ports.wolweb }}/data/get
    return_content: true
  register: _wolweb_data
  retries: 5
  delay: 1
  until: _wolweb_data.status == 200
  failed_when: >-
    _wolweb_data.status != 200
    or 'Lab' not in (_wolweb_data.content | default(''))
    or 'Pug' not in (_wolweb_data.content | default(''))
    or 'Windows' not in (_wolweb_data.content | default(''))
    or (network.sites.home.vlans.management.gateway ~ ':9') not in (_wolweb_data.content | default(''))

# A missing device exercises route and list loading without relying on a magic
# packet leaving the QEMU fixture.
- name: _verify | Wolweb wake route rejects an unknown device with 404
  uri:
    url: http://localhost:{{ service_ports.wolweb }}/wake/__nonexistent__
    status_code: 404

# A known device returns 200 when the broadcast leaves QEMU and 500 when SLIRP
# blocks it; either result proves name resolution reached the send path.
- name: _verify | Wolweb wake route resolves a known device (200, or 500 if the send fails under SLIRP)
  uri:
    url: http://localhost:{{ service_ports.wolweb }}/wake/Lab
    status_code: [ 200, 500 ]

# The UDM-gateway destination is unicast and deterministic under SLIRP.
- name: _verify | Wolweb wake route sends to a wake_destination device
  uri:
    url: http://localhost:{{ service_ports.wolweb }}/wake/Windows

# read_only leaves /data/save unregistered, keeping devices Ansible-managed.
- name: _verify | Wolweb in-UI device editor is disabled under read_only (route unregistered)
  uri:
    url: http://localhost:{{ service_ports.wolweb }}/data/save
    method: POST
    body_format: json
    body:
      name: __probe__
      mac: "00:00:00:00:00:00"
    status_code: 404

- name: _verify | Map the wolweb vhost FQDN to loopback for SNI-correct probing
  lineinfile:
    path: /etc/hosts
    line: "127.0.0.1 wolweb.{{ inventory_hostname }}.{{ domain }}"
  become: true

- name: _verify | Unauthenticated hit redirects to Authelia
  uri:
    url: https://wolweb.{{ inventory_hostname }}.{{ domain }}/
    validate_certs: false
    follow_redirects: none
    status_code: 302
  register: _wolweb_auth_gate
  retries: 10
  delay: 1
  until: _wolweb_auth_gate.status == 302
  failed_when: _wolweb_auth_gate is not authelia_redirects_to('wolweb', inventory_hostname, domain)

- name: _verify | Exercise wolweb fluent-bit record contracts
  import_role:
    name: fluentbit
    tasks_from: verify_extension
  vars:
    fluentbit_verify_args:
      name: wolweb
      records:
        - MESSAGE: "2099/01/02 03:04:05 Startup Webserver on \"127.0.0.1:8089\"\n"
          CONTAINER_TAG: wolweb
          SYSLOG_IDENTIFIER: wolweb
          SYSTEMD_UNIT: wolweb.service
        - MESSAGE: "2099/01/02 03:04:06 Warning: 101 bytes written, 102 expected!\n"
          CONTAINER_TAG: wolweb
          SYSLOG_IDENTIFIER: wolweb
          SYSTEMD_UNIT: wolweb.service
        - MESSAGE: "2099/01/02 03:04:07 ERROR: synthetic interface failure\n"
          CONTAINER_TAG: wolweb
          SYSLOG_IDENTIFIER: wolweb
          SYSTEMD_UNIT: wolweb.service
        - MESSAGE: "2099/01/02 03:04:08 Attempting to send a magic packet to MAC 00:11:22:33:44:55\n"
          CONTAINER_TAG: wolweb
          SYSLOG_IDENTIFIER: wolweb
          SYSTEMD_UNIT: wolweb.service
        - MESSAGE: "wolweb-raw\n"
          CONTAINER_TAG: wolweb
          SYSLOG_IDENTIFIER: wolweb
          SYSTEMD_UNIT: wolweb.service
        - MESSAGE: "2099/01/02 03:04:09 same-unit lifecycle record\n"
          SYSLOG_IDENTIFIER: systemd
          SYSTEMD_UNIT: wolweb.service
      expected:
        - message: 'Startup Webserver on "127.0.0.1:8089"'
          level: info
          service: wolweb
          fields.parser_status: parsed
          _absent:
            - fields.wolweb_timestamp
            - fields.wolweb_level
        - message: "101 bytes written, 102 expected!"
          level: warn
          fields.parser_status: parsed
        - message: synthetic interface failure
          level: error
          fields.parser_status: parsed
        - message: "Attempting to send a magic packet to MAC 00:11:22:33:44:55"
          level: info
          fields.parser_status: parsed
        - message: wolweb-raw
          service: wolweb
          _absent:
            - fields.parser_status
        - message: "2099/01/02 03:04:09 same-unit lifecycle record"
          service: systemd
          _absent:
            - fields.parser_status
            - fields.wolweb_timestamp
