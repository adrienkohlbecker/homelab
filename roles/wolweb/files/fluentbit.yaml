parsers:
  - name: wolweb_text
    format: regex
    regex: '/^(?:[0-9]{4}\/[0-9]{2}\/[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2})(?: (?<_level>ERROR|Warning):)? (?<wolweb_message>.*)$/m'

pipeline:
  filters:
    - name: modify
      match: svc.wolweb.service
      condition: key_exists CONTAINER_TAG
      rename: MESSAGE log
    - name: parser
      match: svc.wolweb.service
      key_name: log
      parser: wolweb_text
      reserve_data: true
      preserve_key: true
    - name: modify
      match: svc.wolweb.service
      condition:
        - key_exists CONTAINER_TAG
        - key_exists wolweb_message
      hard_rename: wolweb_message log
      set: parser_status parsed
