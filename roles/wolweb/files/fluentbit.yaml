parsers:
  - name: wolweb_text
    format: regex
    regex: '/^(?:[0-9]{4}\/[0-9]{2}\/[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2})(?: (?<_level>ERROR|Warning):)? (?<log>.*)$/m'

pipeline:
  filters:
    - name: parser
      match: svc.wolweb.service
      key_name: MESSAGE
      parser: wolweb_text
      reserve_data: true
