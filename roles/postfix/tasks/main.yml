# Postfix accepts an empty SASL password and fails only when relaying, so reject
# empty values before system alerts can be silently stranded.
- name: Assert required postfix relay inputs are set
  assert:
    that:
      - postfix_smtp_user | default('') | length > 0
      - postfix_smtp_password | default('') | length > 0
      - smtp_host | default('') | length > 0
      - smtp_port | default('') | string | length > 0
      - email_domain | default('') | length > 0
      - root_email | default('') | length > 0
    fail_msg: >-
      Postfix requires non-empty relay credentials and shared mail settings.
      Set credentials in group_vars/{prod,test}.yml and shared settings in
      group_vars/all/main.yml.
  tags:
    - postfix

# policy_rc_d: 101 stops dpkg from auto-starting postfix mid-install before its
# config is templated; it is a harmless no-op for libsasl2-modules/bsd-mailx
# (neither ships a daemon to suppress).
- name: Install Postfix, SMTP authentication, and BSD mailx
  apt:
    pkg:
      - postfix
      - libsasl2-modules
      - bsd-mailx
    policy_rc_d: 101
    cache_valid_time: 3600
  register: postfix_apt
  become: true
  tags:
    - postfix

- name: Remove retired networkd-dispatcher log filters
  import_role:
    name: systemd_unit
    tasks_from: remove
  vars:
    systemd_unit_args:
      for: networkd-dispatcher.service
      condition: "{{ not (ansible_check_mode and postfix_apt.changed) }}"
  tags:
    - postfix

- name: Enable networkd-dispatcher for Postfix network hooks
  when: not (ansible_check_mode and postfix_apt.changed)
  systemd:
    name: networkd-dispatcher.service
    enabled: true
    masked: false
    state: >-
      {{ 'restarted'
         if networkd_dispatcher_service_d_override_conf_result.changed
         else 'started' }}
  become: true
  tags:
    - postfix

# Postfix's parsers read the live /etc/postfix directory, not Ansible's
# temporary files. The self-contained SASL map can still be validated before
# installation; _verify.yml parses and exercises the installed configuration.
- name: Install Postfix configuration
  template:
    src: "{{ item.name }}.j2"
    dest: "/etc/postfix/{{ item.name }}"
    owner: root
    group: root
    mode: "{{ item.mode }}"
    backup: true
    validate: "{{ item.validate | default(omit) }}"
  loop:
    - name: main.cf
      mode: "0644"
    - name: generic
      mode: "0644"
    - name: aliases
      mode: "0644"
    - name: sasl_passwd
      mode: "0600"
      validate: grep -qE '^[^[:space:]]+[[:space:]]+[^[:space:]]+:[^[:space:]]+$' %s
  loop_control:
    label: "{{ item.name }}"
  become: true
  register: postfix_cfg
  tags:
    - postfix

- name: Enable postfix
  when: not (ansible_check_mode and postfix_apt.changed)
  systemd:
    name: postfix.service
    enabled: true
    state: >-
      {{ 'restarted'
         if postfix_cfg.changed or postfix_apt.changed
         else 'started' }}
  become: true
  tags:
    - postfix
