# The qemu fixture has no usable relay credentials, so verify the local wiring:
# parsing, effective parameters, maps, aliases, listener state, and sender
# qualification through a locally injected message.
- name: _verify | Postfix configuration parses with no warnings
  command: postfix check
  register: _postfix_check
  # `postfix check` exits 0 even when it prints `warning:` lines (unknown
  # parameter, bad permissions), so gate on stderr too, not just the rc.
  failed_when: _postfix_check.rc != 0 or (_postfix_check.stderr | length > 0)
  changed_when: false
  become: true

- name: _verify | Effective Postfix parameters match relay intent
  command: postconf -hx {{ item.key }}
  loop:
    - key: relayhost
      value: "[{{ smtp_host }}]:{{ smtp_port }}"
    - key: master_service_disable
      value: inet
    - key: myorigin
      value: "{{ inventory_hostname }}"
    - key: smtp_sasl_password_maps
      value: texthash:/etc/postfix/sasl_passwd
    - key: smtp_tls_security_level
      value: "{{ 'secure' if (smtp_use_ssl | bool or smtp_use_tls | bool) else 'none' }}"
    - key: smtp_sasl_auth_enable
      value: "yes"
    - key: smtp_tls_mandatory_protocols
      value: ">=TLSv1.2"
    - key: smtp_generic_maps
      value: texthash:/etc/postfix/generic
  loop_control:
    label: "{{ item.key }}"
  register: _postfix_conf
  failed_when: _postfix_conf.stdout != item.value
  changed_when: false
  become: true

- name: _verify | Query the SASL map for the relayhost key
  command: postmap -q "[{{ smtp_host }}]:{{ smtp_port }}" texthash:/etc/postfix/sasl_passwd
  register: _postfix_sasl
  failed_when: _postfix_sasl.stdout != postfix_smtp_user ~ ':' ~ postfix_smtp_password
  changed_when: false
  become: true

- name: _verify | Query the sender-rewrite map for the local hostname
  command: postmap -q @{{ inventory_hostname }} texthash:/etc/postfix/generic
  register: _postfix_generic
  failed_when: _postfix_generic.stdout != inventory_hostname ~ '@' ~ email_domain
  changed_when: false
  become: true

- name: _verify | Resolve the local aliases
  command: postmap -q {{ item.key }} texthash:/etc/postfix/aliases
  loop:
    - key: postmaster
      value: root
    - key: root
      value: "{{ root_email }}"
    - key: "{{ operator_user }}"
      value: "{{ root_email }}"
  loop_control:
    label: "{{ item.key }}"
  register: _postfix_alias
  failed_when: _postfix_alias.stdout != item.value
  changed_when: false
  become: true

# qmgr logs the qualified sender when the message enters the active queue, so
# this exercise does not depend on the intentionally unavailable relay.
- name: _verify | Inject a local root-origin probe through BSD mailx
  command: mail -s "postfix _verify sender-qualification probe" root
  args:
    stdin: "probe\n"
  changed_when: false
  become: true

- name: _verify | No SMTP listener is exposed
  command: ss -H -ltn sport = :25
  register: _postfix_smtp_listener
  failed_when: _postfix_smtp_listener.stdout | trim | length > 0
  changed_when: false
  become: true

- name: _verify | Probe's envelope sender was qualified with the host name
  command: journalctl -t postfix/qmgr --no-pager
  register: _postfix_qmgr
  until: ('from=<root@' ~ inventory_hostname ~ '>') in _postfix_qmgr.stdout
  retries: 10
  delay: 1
  changed_when: false
  become: true

- name: _verify | Drain the probe from the queue
  command: postsuper -d ALL
  changed_when: false
  become: true
