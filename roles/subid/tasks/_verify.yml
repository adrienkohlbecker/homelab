- name: _verify | Subuid ranges are visible through NSS
  command: getsubids {{ item }}
  register: _subid_getsubids
  changed_when: false
  failed_when: >-
    _subid_getsubids.rc != 0
    or not (_subid_getsubids.stdout is search(item ~ ' [0-9]+ 65536'))
  loop: "{{ [ansible_user_id] + subid_users }}"
  become: false

- name: _verify | Subgid ranges are visible through NSS
  command: getsubids -g {{ item }}
  register: _subid_getsubids
  changed_when: false
  failed_when: >-
    _subid_getsubids.rc != 0
    or not (_subid_getsubids.stdout is search(item ~ ' [0-9]+ 65536'))
  loop: "{{ [ansible_user_id] + subid_users }}"
  become: false
