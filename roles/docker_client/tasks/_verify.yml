# Exercises the docker_client role's contract:
# 1) docker / docker-buildx-plugin / docker-compose-plugin are
#    installed and runnable (binary exec, not just dpkg state).
# 2) PAM exports DOCKER_HOST for Bash and zsh login shells without overriding
#    an endpoint selected after login. Whether the Podman socket answers belongs
#    to the podman role.

# docker version returns rc=1 when it can't reach the daemon, even
# when --format only asks for client fields -- the server query is
# unconditional. The test VM has no podman socket, so the failure
# is expected; we only care that stdout reports a parseable client
# version. failed_when: false keeps the task green so the assert
# below speaks for itself.
- name: _verify | Docker CLI is installed and runnable
  command: >-
    docker version --format '{% raw %}{{.Client.Version}}{% endraw %}'
  changed_when: false
  failed_when: false
  register: _docker_client_docker_version

- name: _verify | Docker client version parses
  assert:
    that:
      - _docker_client_docker_version.stdout is match('^[0-9]+\.[0-9]+\.[0-9]+')
    fail_msg: >-
      Expected docker client version like X.Y.Z,
      got stdout={{ _docker_client_docker_version.stdout | default('') }}

- name: _verify | Buildx plugin loads
  command: docker buildx version
  changed_when: false
  register: _docker_client_buildx_version

- name: _verify | Buildx version is non-empty
  assert:
    that:
      - _docker_client_buildx_version.stdout | length > 0
    fail_msg: >-
      docker buildx version produced no stdout;
      got stdout={{ _docker_client_buildx_version.stdout | default('') }}

- name: _verify | Compose plugin loads
  command: docker compose version --short
  changed_when: false
  register: _docker_client_compose_version

- name: _verify | Compose version is non-empty
  assert:
    that:
      - _docker_client_compose_version.stdout | length > 0
    fail_msg: >-
      docker compose version --short produced no stdout;
      got stdout={{ _docker_client_compose_version.stdout | default('') }}

- name: _verify | Login shells inherit the Podman endpoint
  command:
    argv:
      - sudo
      - --user
      - "{{ ansible_user_id }}"
      - "{{ item }}"
      - -lc
      - test "$DOCKER_HOST" = unix:///run/user/{{ ansible_user_uid }}/podman/podman.sock
  changed_when: false
  loop:
    - bash
    - zsh

- name: _verify | Login shells preserve an explicit Docker endpoint
  command:
    argv:
      - sudo
      - --user
      - "{{ ansible_user_id }}"
      - env
      - DOCKER_HOST=tcp://docker.example.invalid:2375
      - "{{ item }}"
      - -lc
      - test "$DOCKER_HOST" = tcp://docker.example.invalid:2375
  changed_when: false
  loop:
    - bash
    - zsh
