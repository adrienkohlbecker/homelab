# Exercises the docker_client role's contract:
# 1) docker / docker-buildx-plugin / docker-compose-plugin are
#    installed and runnable (binary exec, not just dpkg state).
# 2) PAM exports DOCKER_HOST for Bash and zsh login shells. Whether the Podman
#    socket answers belongs to the podman role.

- name: _verify | Docker CLI is installed and runnable
  command: docker --version
  changed_when: false

- name: _verify | Buildx plugin loads
  command: docker buildx version
  changed_when: false

- name: _verify | Compose plugin loads
  command: docker compose version --short
  changed_when: false

- name: _verify | Login shells inherit the Podman endpoint
  command:
    argv:
      - sudo
      - --user
      - "{{ ansible_user_id }}"
      - "{{ item }}"
      - -lc
      - test "$DOCKER_HOST" = unix:///run/user/{{ ansible_user_uid }}/podman/podman.sock
  changed_when: false
  loop:
    - bash
    - zsh
