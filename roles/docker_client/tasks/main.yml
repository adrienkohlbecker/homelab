- name: Configure Docker apt repository
  import_role:
    name: apt_source
    tasks_from: configure
  vars:
    apt_source_args:
      name: docker
      key_id: 9DC858229FC7DD38854AE2D88D81803C0EBFCD88
      key_url: https://download.docker.com/linux/ubuntu/gpg
      uris: "{{ mirror_apt_docker }}"
      suites: "{{ ansible_distribution_release }}"
      components: stable
  tags:
    - docker_client

- name: Install docker client
  when: not (ansible_check_mode and apt_source_docker_changed)
  apt:
    pkg:
      - docker-ce-cli
      - docker-buildx-plugin
      - docker-compose-plugin
    cache_valid_time: 3600
  become: true
  tags:
    - docker_client

# PAM loads /etc/environment before the operator's login shell, so Bash and zsh
# inherit the same rootless Podman endpoint. Services still need DOCKER_HOST in
# their unit environment because system units do not inherit the login session.
- name: Point Docker CLI at Podman socket
  lineinfile:
    path: /etc/environment
    regexp: "^DOCKER_HOST="
    line: DOCKER_HOST=unix:///run/user/{{ ansible_user_uid }}/podman/podman.sock
    create: true
    owner: root
    group: root
    mode: "0644"
    backup: true
  become: true
  tags:
    - docker_client

- name: Remove shell-specific Docker host shim
  file:
    path: /etc/profile.d/docker_client.sh
    state: absent
  become: true
  tags:
    - docker_client
