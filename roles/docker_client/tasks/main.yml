- name: Configure Docker apt repository
  import_role:
    name: apt_source
    tasks_from: configure
  vars:
    apt_source_args:
      name: docker
      key_sha256: 1500c1f56fa9e26b9b8f42452a553675796ade0807cdce11975eb98170b3a570
      key_url: https://download.docker.com/linux/ubuntu/gpg
      uris: "{{ mirror_apt_docker }}"
      suites: "{{ ansible_distribution_release }}"
      components: stable
  tags:
    - docker_client

- name: Install docker client
  when: not (ansible_check_mode and apt_source_docker_changed)
  apt:
    pkg:
      - docker-ce-cli
      - docker-buildx-plugin
      - docker-compose-plugin
    cache_valid_time: 3600
  become: true
  tags:
    - docker_client

# PAM loads /etc/environment before the operator's login shell, so Bash and zsh
# inherit the same rootless Podman endpoint. Services still need DOCKER_HOST in
# their unit environment because system units do not inherit the login session.
- name: Point Docker CLI at Podman socket
  lineinfile:
    path: /etc/environment
    regexp: "^DOCKER_HOST="
    line: DOCKER_HOST=unix:///run/user/{{ ansible_user_uid }}/podman/podman.sock
    create: true
    owner: root
    group: root
    mode: "0644"
    backup: true
  become: true
  tags:
    - docker_client

# The podman role drops the package-wide user-socket enablement, so enable the
# socket DOCKER_HOST names for the operator alone. Linger keeps it answering
# without a login session.
- name: Enable linger for the operator Podman socket
  import_role:
    name: linger
    tasks_from: linger
  vars:
    linger_args:
      name: "{{ ansible_user_id }}"
      uid: "{{ ansible_user_uid }}"
  tags:
    - docker_client

- name: Check whether podman ships its user socket
  stat:
    path: /usr/lib/systemd/user/podman.socket
  register: docker_client_podman_socket
  tags:
    - docker_client

# A fresh check-mode run only predicts the podman package.
- name: Enable the operator rootless Podman socket
  when: not ansible_check_mode or docker_client_podman_socket.stat.exists
  systemd:
    name: podman.socket
    scope: user
    enabled: true
    state: started
  become: true
  become_user: "{{ ansible_user_id }}"
  tags:
    - docker_client
