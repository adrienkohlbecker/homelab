# Loopback probe -- exercises the container directly via the published
# port. Retries cover cold-start (--health-start-period is 100s; budget
# below gives 3 minutes to cover restart-after-deploy too).
- name: _verify | Seerr answers /api/v1/status on its loopback port
  uri:
    url: http://localhost:{{ service_ports.seerr }}/api/v1/status
    status_code: 200
    return_content: true
    timeout: 10
  register: _seerr_loopback
  retries: 90
  delay: 2
  until:
    - _seerr_loopback.status == 200
    - _seerr_loopback.json is defined
    - _seerr_loopback.json.version is defined
  become: true

# nginx reverse-proxy probe -- exercises the full reverse-proxy chain so
# a typo in nginx_site_args / proxy_pass fails here too. trustProxy is
# set in settings.json so the upstream X-Forwarded-* headers from nginx
# don't get rejected.
#
# Map the vhost FQDN to loopback so SNI matches the served certificate.
# Probing https://localhost with a Host: header leaves SNI=localhost, which
# OpenSSL 3.x (noble/resolute) rejects as a fatal unrecognized_name alert
# (status -1); hitting the FQDN directly keeps SNI correct on every release.
- name: _verify | Map the seerr vhost FQDN to loopback for SNI-correct probing
  lineinfile:
    path: /etc/hosts
    line: "127.0.0.1 seerr.{{ inventory_hostname }}.{{ domain }}"
    state: present
  become: true

- name: _verify | Seerr is reachable through nginx
  uri:
    url: https://seerr.{{ inventory_hostname }}.{{ domain }}/api/v1/status
    validate_certs: false
    return_content: true
  register: _seerr_nginx
  failed_when: >-
    _seerr_nginx.status != 200
    or _seerr_nginx.json is not defined
    or _seerr_nginx.json.version is not defined
  become: true

# Uidmap regression detector. seerr's `USER node:node` (in-container uid
# 1000) is routed to host uid `seerr` via --uidmap=+1000:N:1, so the
# settings.json the daemon rewrites on shutdown should land owned by the
# host seerr user. A mapping drift (wrong uid in the override, mismatch
# between service_user and the unit) would land the file at a different
# host uid silently; assert ownership so the regression is loud.
- name: _verify | Seerr writes settings.json as host seerr user
  stat:
    path: /mnt/services/seerr/settings.json
  register: _seerr_settings_owner
  failed_when: >-
    not _seerr_settings_owner.stat.exists
    or _seerr_settings_owner.stat.pw_name != 'seerr'
  become: true

# Media-network join probe. seerr reaches radarr, sonarr, and Jellyfin over
# *.dns.podman on the `media` network; no peer is deployed in the test, so
# resolve seerr by its own name from inside the container -- aardvark only
# answers *.dns.podman when the container actually joined `media`, so a dropped
# `--network media` makes this wget fail while the loopback/nginx probes (the
# published-port path, independent of the custom network) stay green.
- name: _verify | Seerr is joined to the media network (aardvark resolves .dns.podman)
  command: >-
    podman exec seerr
    wget -q -T 5 -O /dev/null http://seerr.dns.podman:5055/api/v1/status
  become: true
  register: _seerr_media_dns
  changed_when: false
  retries: 15
  delay: 2
  until: _seerr_media_dns.rc == 0

- name: _verify | Wait for normalized seerr startup record in lnav store
  command:
    argv:
      - python3
      - -c
      - |
        import json
        import sys

        with open(sys.argv[1], encoding="utf-8") as handle:
            for line in handle:
                try:
                    record = json.loads(line)
                except json.JSONDecodeError:
                    continue
                fields = record.get("fields", {})
                if (
                    record.get("service") == "seerr"
                    and record.get("message", "").startswith("Starting Seerr version ")
                    and fields.get("parser_status") == "parsed"
                    and "CONTAINER_TAG" not in fields
                    and "seerr_timestamp" not in fields
                    and "seerr_level" not in fields
                ):
                    print(json.dumps(record, sort_keys=True))
                    sys.exit(0)
        sys.exit(1)
      - /var/log/fluent-bit/lnav.jsonl
  register: _seerr_lnav_record
  changed_when: false
  retries: 30
  delay: 2
  until: _seerr_lnav_record.rc == 0
  become: true

- name: _verify | Exercise seerr fluent-bit record contracts
  import_role:
    name: fluentbit
    tasks_from: verify_extension
  vars:
    fluentbit_verify_args:
      name: seerr
      records:
        - MESSAGE: "2099-01-02T03:04:05.678Z [\u001b[32minfo\u001b[39m][Jellyfin Sync]: Scan starting {\"sessionId\":\"verify-session\"}\n"
          CONTAINER_TAG: seerr
          SYSLOG_IDENTIFIER: seerr
          SYSTEMD_UNIT: seerr.service
        - MESSAGE: "2099-01-02T03:04:06.789Z [\u001b[31merror\u001b[39m][Jellyfin API]: Request failed {\"error\":500}\n"
          CONTAINER_TAG: seerr
          SYSLOG_IDENTIFIER: seerr
          SYSTEMD_UNIT: seerr.service
        - MESSAGE: "2099-01-02T03:04:07.890Z [\u001b[32minfo\u001b[39m]: Starting Seerr version 3.2.0 \n"
          CONTAINER_TAG: seerr
          SYSLOG_IDENTIFIER: seerr
          SYSTEMD_UNIT: seerr.service
        - MESSAGE: '> seerr@3.2.0 start'
          CONTAINER_TAG: seerr
          SYSLOG_IDENTIFIER: seerr
          SYSTEMD_UNIT: seerr.service
        - MESSAGE: '2099-01-02T03:04:08.901Z [info][Server]: malformed-json {"port":5055'
          CONTAINER_TAG: seerr
          SYSLOG_IDENTIFIER: seerr
          SYSTEMD_UNIT: seerr.service
        - MESSAGE: '2099-01-02T03:04:09.012Z [info][Server]: must-not-parse'
          SYSLOG_IDENTIFIER: systemd
          SYSTEMD_UNIT: seerr.service
        - MESSAGE: '2099-01-02T03:04:10.123Z [debug][Jellyfin Sync]: Title already exists and no changes detected for routine-token'
          CONTAINER_TAG: seerr
          SYSLOG_IDENTIFIER: seerr
          SYSTEMD_UNIT: seerr.service
        - MESSAGE: '2099-01-02T03:04:11.234Z [debug][Jobs]: non-routine-debug'
          CONTAINER_TAG: seerr
          SYSLOG_IDENTIFIER: seerr
          SYSTEMD_UNIT: seerr.service
        - MESSAGE: '2099-01-02T03:04:12.345Z [info][Jobs]: Starting scheduled job: Jellyfin Recently Added Scan'
          CONTAINER_TAG: seerr
          SYSLOG_IDENTIFIER: seerr
          SYSTEMD_UNIT: seerr.service
          marker: seerr-job-start-routine-token
        - MESSAGE: '2099-01-02T03:04:13.456Z [info][Jellyfin Sync]: Beginning to process recently added for library: Movies'
          CONTAINER_TAG: seerr
          SYSLOG_IDENTIFIER: seerr
          SYSTEMD_UNIT: seerr.service
          marker: seerr-library-routine-token
        - MESSAGE: '2099-01-02T03:04:14.567Z [info][Jellyfin Sync]: Recently Added Scan Complete'
          CONTAINER_TAG: seerr
          SYSLOG_IDENTIFIER: seerr
          SYSTEMD_UNIT: seerr.service
          marker: seerr-scan-complete-routine-token
      expected:
        - message: Request failed
          level: error
          fields.source: Jellyfin API
          fields.error: 500
          fields.parser_status: parsed
        - message: Starting Seerr version 3.2.0
          level: info
          fields.parser_status: parsed
          _absent:
            - fields.source
        - message: '> seerr@3.2.0 start'
          service: seerr
          _absent:
            - fields.parser_status
            - fields.source
        - message: malformed-json
          level: warn
          service: seerr
          parse_error: seerr_metadata
          fields.parser_status: failed
          fields.seerr_metadata: '{"port":5055'
        - message: '2099-01-02T03:04:09.012Z [info][Server]: must-not-parse'
          service: systemd
          _absent:
            - fields.parser_status
            - fields.source
        - message: non-routine-debug
          level: debug
          fields.source: Jobs
          fields.parser_status: parsed

- name: _verify | Routine seerr records are omitted from the aggregate
  assert:
    that:
      - "'routine-token' not in fluentbit_verify_result.stdout"
      - "'verify-session' not in fluentbit_verify_result.stdout"

# Canonical-shape contract. Unlike radarr (which rewrites config.xml on every
# shutdown), seerr only writes settings.json when a setting actually changes --
# the migrator skips the write when settingsBefore == settingsAfter -- so a
# restart wouldn't force a writeback to diff against. Assert the inverse
# directly instead: fed the on-disk file as its slurp input, the template must
# reproduce that file byte-for-byte. A drift (seerr persisted a key we drop, or
# a different key order) makes the render diverge from disk and surfaces here,
# which the converge/idempotence passes can mask if seerr never rewrote.
- name: _verify | Re-slurp settings.json for the shape-match render
  slurp:
    src: /mnt/services/seerr/settings.json
  register: _seerr_shape_b64
  become: true

- name: _verify | The template reproduces the on-disk settings.json byte-for-byte
  vars:
    seerr_settings_json: "{{ _seerr_shape_b64 | slurp_text | from_json }}"
    _rendered: "{{ lookup('template', 'settings.json.j2') | rstrip_newlines }}"
  assert:
    that:
      - (_seerr_shape_b64 | slurp_text(trim=false)) == _rendered
    fail_msg: >-
      settings.json.j2 no longer reproduces the on-disk file -- seerr persisted a
      shape (key set or order) the template does not emit, so a converge would
      diff-churn and restart seerr. Re-capture the canonical shape from a running
      instance.
  become: true

# Populated-state shape contract. The byte-for-byte assert above only ever runs
# against a fresh, never-connected settings.json -- no Jellyfin peer is deployed
# in the test, so the slurp-preserved branches that fire only once the daemon
# owns data (the multi-line jellyfin libraries loop + SSO fields, a populated
# migrations ledger, and the wizard-completed flags)
# never get exercised here, yet those are the fragile ones. Synthesize a
# plausible post-bootstrap writeback by injecting daemon-owned values onto the
# fresh on-disk file (re-slurped above as _seerr_shape_b64), render the
# template against it, then feed that render back in and assert the two renders
# are byte-identical (a fixed point) and that every injected daemon value
# survived. A template that drops, reorders, or reformats a daemon-written key
# diverges on the second render or loses the value -- the exact churn-and-
# restart regression a connected instance would hit on the next converge.
- name: _verify | Synthetic post-bootstrap daemon-owned values
  set_fact:
    _seerr_pop_overrides:
      main:
        mediaServerType: 2
      public:
        initialized: true
      jellyfin:
        ip: jellyfin.dns.podman
        port: 8096
        useSsl: false
        urlBase: ""
        serverId: srv-abc123
        apiKey: jelly-test-key
        libraries:
          - { id: f1, name: Films, enabled: true, type: movie }
          - { id: s1, name: Shows, enabled: false, type: show }
      migrations:
        - "0007_migrate_arr_tags"
        - "0008_migrate_blacklist_to_blocklist"
        - "0099_synthetic_upgrade"

- name: _verify | Render the template against the synthetic post-bootstrap state
  vars:
    seerr_settings_json: "{{ (_seerr_shape_b64 | slurp_text | from_json) | combine(_seerr_pop_overrides, recursive=True) }}"
  set_fact:
    _seerr_pop_render1: "{{ lookup('template', 'settings.json.j2') | rstrip_newlines }}"

- name: _verify | Re-render feeding the populated render back in
  vars:
    seerr_settings_json: "{{ _seerr_pop_render1 | from_json }}"
  set_fact:
    _seerr_pop_render2: "{{ lookup('template', 'settings.json.j2') | rstrip_newlines }}"

- name: _verify | The populated render is a stable fixed point preserving daemon-owned fields
  vars:
    _parsed: "{{ _seerr_pop_render1 | from_json }}"
  assert:
    that:
      - _seerr_pop_render1 == _seerr_pop_render2
      - _parsed.jellyfin.ip == 'jellyfin.dns.podman'
      - _parsed.jellyfin.apiKey == 'jelly-test-key'
      - (_parsed.jellyfin.libraries | length) == 2
      - _parsed.plex.name == ''
      - _parsed.plex.ip == ''
      - (_parsed.plex.libraries | length) == 0
      - (_parsed.tautulli | length) == 0
      - "'0099_synthetic_upgrade' in _parsed.migrations"
      - _parsed.main.mediaServerType == 2
      - _parsed.public.initialized
    fail_msg: >-
      the template did not stably reproduce a populated post-bootstrap
      settings.json: a daemon-owned field (jellyfin SSO/libraries, migrations
      ledger, wizard flags) was dropped, reordered, or
      reformatted, which would diff-churn and restart seerr on the converge
      after the operator connects Jellyfin.
