# root's outbound SSH identity for the nightly ZFS backups. Two consumers read
# what this role produces:
#   - zfs_autobackup onsite: `zfs-autobackup --ssh-config /root/.ssh/config
#     --ssh-source zfs_autobackup@<peer>` spawns many short ssh calls per run, so
#     the ControlMaster block in files/ssh_config multiplexes them (load-bearing).
#   - zfs_autobackup offsite: rsync of bak-tagged snapshots to ak@bunk, which pins
#     this host's pubkey to a forced `rrsync -wo` command (host_vars/bunk.yml).
# /root/.ssh/known_hosts for those peers is owned by zfs_autobackup (dest.yml,
# ssh-keyscan), not this role -- so a regenerated keypair needs a manual bunk.yml
# update, which the "Warn on keypair regeneration" task below enforces.
- name: Create ssh directory
  file:
    dest: /root/.ssh
    state: directory
    owner: root
    group: root
    mode: "0700"
  become: true
  register: ssh_root_directory
  tags:
    - ssh_root

# --- identity persistence -------------------------------------------------
# The keypair rides /mnt/services (rpool/services), so a wipe-and-restore
# rebuild brings the same root identity back and the pins that authorize it
# -- zfs_autobackup_ssh_public_key on the pull peer, bunk's forced-command
# authorized_keys -- stay valid, with no Phase-7 re-pinning (see the rebuild
# runbooks). ssh_root runs in the host-base band, before zfs_mount/services,
# so on a first converge /mnt/services may not be mounted yet: the
# persistence tasks self-gate on the mount and catch up on the next run. On
# a rebuild the dataset restore precedes converge, so the persisted key is
# already in place here and the restore below wins over the fresh install's
# just-generated key. Deliberate rotation: delete both the persisted pair
# and /root/.ssh/id_ed25519*, converge, then update the pins.
- name: Check whether /mnt/services is mounted
  command: findmnt --mountpoint /mnt/services
  register: ssh_root_services_mount
  changed_when: false
  failed_when: false
  check_mode: false
  become: true
  tags:
    - ssh_root

- name: Create the identity persistence directory
  when: ssh_root_services_mount.rc == 0
  file:
    dest: /mnt/services/ssh_root
    state: directory
    owner: root
    group: root
    mode: "0700"
  become: true
  register: ssh_root_persist_dir
  tags:
    - ssh_root

- name: Stat the persisted keypair
  when: ssh_root_services_mount.rc == 0
  stat:
    path: /mnt/services/ssh_root/id_ed25519
  become: true
  register: ssh_root_persisted_stat
  tags:
    - ssh_root

# Only the private key is persisted/restored: openssh_keypair derives and
# fully manages the .pub file (including its mode), so shipping our own copy
# just fights the module and breaks idempotence.
- name: Restore the persisted key
  when:
    - ssh_root_services_mount.rc == 0
    - ssh_root_persisted_stat.stat.exists | default(false)
    - not (ansible_check_mode and ssh_root_directory.changed)
  copy:
    src: /mnt/services/ssh_root/id_ed25519
    remote_src: true
    dest: /root/.ssh/id_ed25519
    owner: root
    group: root
    mode: "0600"
    backup: true
  become: true
  tags:
    - ssh_root

- name: Check for existing keypair
  stat:
    path: /root/.ssh/id_ed25519
  become: true
  register: ssh_root_key_stat
  tags:
    - ssh_root

- name: Generate an OpenSSH keypair
  when: not (ansible_check_mode and ssh_root_directory.changed)
  community.crypto.openssh_keypair:
    path: /root/.ssh/id_ed25519
    type: ed25519
    owner: root
    group: root
    mode: "0600"
    comment: root@{{ inventory_hostname }}
    regenerate: full_idempotence
    backend: opensshbin
  become: true
  register: ssh_root_keypair
  tags:
    - ssh_root

# The module reports `changed` for benign repairs too (rewriting a missing
# .pub after a restore, mode fixes), so the regeneration guard compares the
# private key file itself before/after instead of trusting `changed`.
- name: Stat the keypair after generation
  stat:
    path: /root/.ssh/id_ed25519
  become: true
  register: ssh_root_key_stat_after
  tags:
    - ssh_root

# A regenerated key no longer matches the pubkey bunk pins in its forced-command
# authorized_keys, so offsite backups would fail to authenticate until
# host_vars/bunk.yml is updated by hand. Halting the converge here is deliberate:
# it forces that manual step before the host proceeds. Regeneration only happens
# on real key drift/corruption (regenerate: full_idempotence above), never on a
# clean re-run. Skipped under --check so a dry-run never aborts.
- name: Warn on keypair regeneration
  when:
    - not ansible_check_mode
    - ssh_root_key_stat.stat.exists
    - ssh_root_key_stat.stat.checksum != ssh_root_key_stat_after.stat.checksum
  fail:
    msg: >-
      Root SSH keypair regenerated on {{ inventory_hostname }} -- the old public
      key is now stale in bunk authorized_keys, so offsite backups will fail to
      authenticate. Replace the entry for root@{{ inventory_hostname }} in
      host_vars/bunk.yml ssh_public_keys_additional with the new public key below,
      then re-converge bunk. (If the host was recently renamed in inventory, a
      comment mismatch on the existing key may have triggered this regeneration.)
      {{ ssh_root_keypair.public_key }}
  tags:
    - ssh_root

# Live -> persisted, idempotent by checksum. On a fresh host this seeds the
# persisted copy; afterwards it is a no-op (a live key that diverged from the
# persisted one can only reach here on first generation -- real drift trips
# the regeneration guard above first, and a restored key already matches).
- name: Persist the key
  when:
    - ssh_root_services_mount.rc == 0
    - not (ansible_check_mode and (ssh_root_directory.changed or ssh_root_keypair.changed or ssh_root_persist_dir.changed))
  copy:
    src: /root/.ssh/id_ed25519
    remote_src: true
    dest: /mnt/services/ssh_root/id_ed25519
    owner: root
    group: root
    mode: "0600"
    backup: true
  become: true
  tags:
    - ssh_root

- name: Configure ssh
  when: not (ansible_check_mode and ssh_root_directory.changed)
  copy:
    src: ssh_config
    dest: /root/.ssh/config
    owner: root
    group: root
    mode: "0600"
    backup: true
    validate: ssh -G -F %s localhost
  become: true
  tags:
    - ssh_root
