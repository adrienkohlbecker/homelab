# root's outbound SSH identity for the nightly ZFS backups. Two consumers read
# what this role produces:
#   - zfs_autobackup onsite: `zfs-autobackup --ssh-config /root/.ssh/config
#     --ssh-source zfs_autobackup@<peer>` spawns many short ssh calls per run, so
#     the ControlMaster block in files/ssh_config multiplexes them (load-bearing).
#   - zfs_autobackup offsite: rsync of bak-tagged snapshots to ak@bunk, which pins
#     this host's pubkey to a forced `rrsync -wo` command (host_vars/bunk.yml).
# /root/.ssh/known_hosts for those peers is owned by zfs_autobackup (dest.yml,
# ssh-keyscan), not this role -- so a regenerated keypair needs a manual bunk.yml
# update. Existing invalid keys fail closed before replacement.
- name: Create ssh directory
  file:
    dest: /root/.ssh
    state: directory
    owner: root
    group: root
    mode: "0700"
  become: true
  register: ssh_root_directory
  tags:
    - ssh_root

# --- identity persistence -------------------------------------------------
# The keypair rides /mnt/services (rpool/services), so a wipe-and-restore
# rebuild brings the same root identity back and the pins that authorize it
# -- zfs_autobackup_ssh_public_key on the pull peer, bunk's forced-command
# authorized_keys -- stay valid, with no Phase-7 re-pinning (see the rebuild
# runbooks). The services role runs earlier and installs the shared mount
# validator used here. On a rebuild the dataset restore precedes converge, so
# the persisted key is already in place and wins over the fresh install's key.
# Deliberate rotation: delete both the persisted pair and
# /root/.ssh/id_ed25519*, converge, then update the pins.
- name: Check the services dataset mount
  command: /usr/local/bin/zfs_check_mount rpool/services /mnt/services
  register: ssh_root_services_mount
  changed_when: false
  failed_when: false
  check_mode: false
  become: true
  tags:
    - ssh_root

- name: Create the identity persistence directory
  when: ssh_root_services_mount.rc == 0
  file:
    dest: /mnt/services/ssh_root
    state: directory
    owner: root
    group: root
    mode: "0700"
  become: true
  register: ssh_root_persist_dir
  tags:
    - ssh_root

- name: Stat the persisted keypair
  when: ssh_root_services_mount.rc == 0
  stat:
    path: /mnt/services/ssh_root/id_ed25519
  become: true
  register: ssh_root_persisted_stat
  tags:
    - ssh_root

# Only the private key is persisted/restored; openssh_keypair recreates the
# derived public key when it is missing.
- name: Restore the persisted key
  when:
    - ssh_root_services_mount.rc == 0
    - ssh_root_persisted_stat.stat.exists | default(false)
    - not (ansible_check_mode and ssh_root_directory.changed)
  copy:
    src: /mnt/services/ssh_root/id_ed25519
    remote_src: true
    dest: /root/.ssh/id_ed25519
    owner: root
    group: root
    mode: "0600"
    backup: true
  become: true
  tags:
    - ssh_root

- name: Generate an OpenSSH keypair
  when: not (ansible_check_mode and ssh_root_directory.changed)
  community.crypto.openssh_keypair:
    path: /root/.ssh/id_ed25519
    type: ed25519
    owner: root
    group: root
    regenerate: fail
    backend: opensshbin
  become: true
  register: ssh_root_keypair
  tags:
    - ssh_root

# openssh_keypair applies its single mode argument to both files. Leave it
# unset so ssh-keygen creates the pair with its native split modes, then
# enforce the private key permission independently from the public key below.
- name: Normalize the OpenSSH private key permissions
  when: not (ansible_check_mode and (ssh_root_directory.changed or ssh_root_keypair.changed))
  file:
    path: /root/.ssh/id_ed25519
    owner: root
    group: root
    mode: "0600"
  become: true
  register: ssh_root_private_key
  tags:
    - ssh_root

# Live -> persisted, idempotent by checksum. A fresh host seeds the persisted
# copy; afterwards the restore above makes the live key match before this task.
- name: Persist the key
  when:
    - ssh_root_services_mount.rc == 0
    - not (ansible_check_mode and (ssh_root_directory.changed or ssh_root_keypair.changed or ssh_root_persist_dir.changed))
  copy:
    src: /root/.ssh/id_ed25519
    remote_src: true
    dest: /mnt/services/ssh_root/id_ed25519
    owner: root
    group: root
    mode: "0600"
    backup: true
  become: true
  tags:
    - ssh_root

- name: Configure ssh
  when: not (ansible_check_mode and ssh_root_directory.changed)
  copy:
    src: ssh_config
    dest: /root/.ssh/config
    owner: root
    group: root
    mode: "0600"
    backup: true
    validate: ssh -G -F %s localhost
  become: true
  tags:
    - ssh_root
