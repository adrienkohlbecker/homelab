# Functional testing (an actual SSH to bunk) is impossible on the box fixture: it
# has no WireGuard peer, and known_hosts for the backup peers is gated
# `when: not qemu_test` in zfs_autobackup. So these checks fall back to artifact
# state (key type/mode/owner, config mode/owner) plus `ssh -G`, which parses the
# shipped config and proves the load-bearing directives survive the Host-block
# merge -- the one genuinely functional assertion here. The closing block forces a
# regeneration to confirm the warn/fail gate in main.yml would catch a real
# rotation; safe because the box fixture is disposable.
- name: _verify | Stat /root/.ssh directory
  stat:
    path: /root/.ssh
  register: _ssh_root_dir
  become: true

- name: _verify | Assert /root/.ssh directory exists with mode 0700 owned by root
  assert:
    that:
      - _ssh_root_dir.stat.exists
      - (_ssh_root_dir.stat.mode | default('')) == '0700'
      - (_ssh_root_dir.stat.pw_name | default('')) == 'root'
      - (_ssh_root_dir.stat.gr_name | default('')) == 'root'
    fail_msg: >-
      /root/.ssh: exists={{ _ssh_root_dir.stat.exists }}
      mode={{ _ssh_root_dir.stat.mode | default('absent') }} (want 0700)
      owner={{ _ssh_root_dir.stat.pw_name | default('absent') }}:{{ _ssh_root_dir.stat.gr_name | default('absent') }} (want root:root)

- name: _verify | Stat ed25519 private key
  stat:
    path: /root/.ssh/id_ed25519
  register: _ssh_root_key
  become: true

- name: _verify | Assert ed25519 private key exists with mode 0600 owned by root
  assert:
    that:
      - _ssh_root_key.stat.exists
      - (_ssh_root_key.stat.mode | default('')) == '0600'
      - (_ssh_root_key.stat.pw_name | default('')) == 'root'
      - (_ssh_root_key.stat.gr_name | default('')) == 'root'
    fail_msg: >-
      /root/.ssh/id_ed25519: exists={{ _ssh_root_key.stat.exists }}
      mode={{ _ssh_root_key.stat.mode | default('absent') }} (want 0600)
      owner={{ _ssh_root_key.stat.pw_name | default('absent') }}:{{ _ssh_root_key.stat.gr_name | default('absent') }} (want root:root)

- name: _verify | Stat /root/.ssh/config
  stat:
    path: /root/.ssh/config
  register: _ssh_root_config_file
  become: true

- name: _verify | Assert /root/.ssh/config exists with mode 0600 owned by root
  assert:
    that:
      - _ssh_root_config_file.stat.exists
      - (_ssh_root_config_file.stat.mode | default('')) == '0600'
      - (_ssh_root_config_file.stat.pw_name | default('')) == 'root'
      - (_ssh_root_config_file.stat.gr_name | default('')) == 'root'
    fail_msg: >-
      /root/.ssh/config: exists={{ _ssh_root_config_file.stat.exists }}
      mode={{ _ssh_root_config_file.stat.mode | default('absent') }} (want 0600)
      owner={{ _ssh_root_config_file.stat.pw_name | default('absent') }}:{{ _ssh_root_config_file.stat.gr_name | default('absent') }} (want root:root)

- name: _verify | Assert ssh_config parses cleanly
  command: ssh -G -F /root/.ssh/config localhost
  register: _ssh_root_config
  become: true
  changed_when: false

- name: _verify | Assert expected directives are active
  assert:
    that:
      - "'batchmode yes' in _ssh_root_config.stdout"
      - "'ciphers aes128-gcm@openssh.com,' in _ssh_root_config.stdout"
      - "'compression no' in _ssh_root_config.stdout"
      - "'controlmaster auto' in _ssh_root_config.stdout"
      - "'controlpath /root/.ssh/.controlmaster-' in _ssh_root_config.stdout"
      - "'controlpersist 300' in _ssh_root_config.stdout"
      - "'forwardagent no' in _ssh_root_config.stdout"
      - "'identityfile ~/.ssh/id_ed25519' in _ssh_root_config.stdout"
      - "'identitiesonly yes' in _ssh_root_config.stdout"
      - "'preferredauthentications publickey' in _ssh_root_config.stdout"
      - "'serveralivecountmax 2' in _ssh_root_config.stdout"
      - "'serveraliveinterval 30' in _ssh_root_config.stdout"
      - "'connecttimeout 10' in _ssh_root_config.stdout"
    fail_msg: "ssh_config missing expected directives"

# --- identity persistence ---------------------------------------------------
- name: _verify | Live and persisted private keys match
  command:
    argv:
      - cmp
      - -s
      - /root/.ssh/id_ed25519
      - /mnt/services/ssh_root/id_ed25519
  changed_when: false
  become: true

- name: _verify | Stat the identity persistence directory
  stat:
    path: /mnt/services/ssh_root
  become: true
  register: _ssh_root_persist_dir

- name: _verify | Stat the persisted private key
  stat:
    path: /mnt/services/ssh_root/id_ed25519
  become: true
  register: _ssh_root_persisted_key

- name: _verify | Persisted root identity is private to root
  assert:
    that:
      - _ssh_root_persist_dir.stat.exists
      - _ssh_root_persist_dir.stat.mode == '0700'
      - _ssh_root_persist_dir.stat.pw_name == 'root'
      - _ssh_root_persist_dir.stat.gr_name == 'root'
      - _ssh_root_persisted_key.stat.exists
      - _ssh_root_persisted_key.stat.mode == '0600'
      - _ssh_root_persisted_key.stat.pw_name == 'root'
      - _ssh_root_persisted_key.stat.gr_name == 'root'
    fail_msg: >-
      /mnt/services/ssh_root or its private key has unsafe ownership or
      permissions.

# Rebuild simulation: after a wipe-and-restore, the persisted copy is in
# place but /root/.ssh is fresh. Re-running the role must bring back the
# SAME identity, not generate a new one (that is what keeps the lab/bunk
# pins valid across a rebuild).
- name: _verify | Remove the live keypair (simulated rebuild)
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /root/.ssh/id_ed25519
    - /root/.ssh/id_ed25519.pub
  become: true

- name: _verify | Re-run the role against the persisted identity
  import_role:
    name: ssh_root

- name: _verify | The restored key is the persisted identity
  command:
    argv:
      - cmp
      - -s
      - /root/.ssh/id_ed25519
      - /mnt/services/ssh_root/id_ed25519
  changed_when: false
  become: true

- name: _verify | Re-run the role after restoring the persisted identity
  import_role:
    name: ssh_root

- name: _verify | Restored identity is idempotent
  assert:
    that:
      - not ssh_root_keypair.changed
      - not ssh_root_public_key.changed
      - ssh_root_keypair.comment == ssh_root_key_comment
    fail_msg: >-
      ssh_root still changed after restoring the persisted identity:
      keypair={{ ssh_root_keypair }} public_key={{ ssh_root_public_key }}

- name: _verify | Preserve the valid root identity for repair
  copy:
    src: /root/.ssh/id_ed25519
    remote_src: true
    dest: /root/.ssh/id_ed25519.verify-backup
    owner: root
    group: root
    mode: "0600"
  become: true

- name: _verify | Corrupt both root identity copies
  copy:
    dest: "{{ item }}"
    content: "not a valid private key\n"
    owner: root
    group: root
    mode: "0600"
  loop:
    - /root/.ssh/id_ed25519
    - /mnt/services/ssh_root/id_ed25519
  become: true

- name: _verify | Stat the corrupt live identity
  stat:
    path: /root/.ssh/id_ed25519
  become: true
  register: _ssh_root_corrupt_before

- name: _verify | Re-run the role against the corrupt identity
  block:
    - name: _verify | Import the role (must fail before regeneration)
      import_role:
        name: ssh_root

    - name: _verify | Unreachable when regeneration fails closed
      set_fact:
        _ssh_root_regen_guard_tripped: false

  rescue:
    - name: _verify | The keypair task failed closed
      assert:
        that:
          - ansible_failed_task.name is search('Generate an OpenSSH keypair')
          - ansible_failed_result.msg is search('Unable to read the key')
        fail_msg: >-
          The nested role failed in {{ ansible_failed_task.name | default('<unknown>') }},
          not in the expected openssh_keypair validation.

    - name: _verify | Stat the rejected live identity
      stat:
        path: /root/.ssh/id_ed25519
      become: true
      register: _ssh_root_corrupt_after

    - name: _verify | Invalid key was rejected without replacement
      assert:
        that:
          - _ssh_root_corrupt_after.stat.checksum == _ssh_root_corrupt_before.stat.checksum

    - name: _verify | Record the regeneration guard firing
      set_fact:
        _ssh_root_regen_guard_tripped: true

  always:
    - name: _verify | Restore the valid root identity copies
      copy:
        src: /root/.ssh/id_ed25519.verify-backup
        remote_src: true
        dest: "{{ item }}"
        owner: root
        group: root
        mode: "0600"
      loop:
        - /root/.ssh/id_ed25519
        - /mnt/services/ssh_root/id_ed25519
      become: true

    - name: _verify | Remove the identity repair copy
      file:
        path: /root/.ssh/id_ed25519.verify-backup
        state: absent
      become: true

- name: _verify | Regeneration guard halted the converge
  assert:
    that:
      - _ssh_root_regen_guard_tripped
    fail_msg: >-
      re-running ssh_root with an invalid existing key did not fail before
      replacing the pinned identity.
