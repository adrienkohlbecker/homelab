# The package postinst decides from debconf whether to run refind-install, and
# would rewrite the ESP before the boot-chain check below if it did.
- name: _verify | Rerun the refind package configuration
  command: dpkg-reconfigure --frontend noninteractive refind
  environment:
    LC_ALL: C.UTF-8
  register: _refind_reconfigure
  changed_when: false
  become: true

# debconf's confmodule moves maintainer-script output to stderr.
- name: _verify | The postinst leaves the ESP to this role
  vars:
    _output: "{{ _refind_reconfigure.stdout }}{{ _refind_reconfigure.stderr }}"
  assert:
    that: "'Not installing rEFInd to the ESP' in _output"
    fail_msg: "{{ _output }}"

# One end-to-end check of the boot chain this role installs. rEFInd records
# the entry it booted as PreviousBoot, and only writes when that changes.
# refind.conf sets `use_nvram false`, so the record lands in
# EFI/refind/vars/ on the ESP, but rEFInd reads the NVRAM copy while that
# directory is missing. Forgetting both copies and rebooting proves the
# firmware started the installed rEFInd, which read the rendered config, picked
# the ZBM entry by default, and ZBM kexec'd back into the host.
- name: _verify | Forget the entry rEFInd booted last
  shell: |
    set -euo pipefail
    var=/sys/firmware/efi/efivars/PreviousBoot-36d08fa7-cf0b-42f5-8f14-68df73ed3740
    if [ -e "$var" ]; then
      chattr -i "$var"
      rm "$var"
    fi
    rm -f /boot/efi/EFI/refind/vars/PreviousBoot
  args:
    executable: /bin/bash
  changed_when: true
  become: true

- name: _verify | Reboot through firmware, rEFInd and ZFSBootMenu
  import_role:
    name: reboot
    tasks_from: reboot

# rEFInd writes through the firmware to the one ESP partition it booted from,
# underneath an md mirror, so read every ESP partition directly.
- name: _verify | Read the entry rEFInd booted
  shell: |
    set -euo pipefail
    mnt=$(mktemp -d)
    lsblk -nrpo PATH,PARTTYPE | awk '$2 == "c12a7328-f81f-11d2-ba4b-00a0c93ec93b" {print $1}' |
      while read -r part; do
        loop=$(losetup --find --read-only --show "$part")
        mount -t vfat -o ro "$loop" "$mnt"
        if [ -f "$mnt/EFI/refind/vars/PreviousBoot" ]; then
          iconv -f UTF-16LE -t UTF-8 "$mnt/EFI/refind/vars/PreviousBoot" | tr -d '\0'
          echo
        fi
        umount "$mnt"
        losetup --detach "$loop"
      done
    rmdir "$mnt"
  args:
    executable: /bin/bash
  register: _refind_previous_boot
  changed_when: false
  become: true

- name: _verify | The ZFSBootMenu entry is what rEFInd booted
  assert:
    that: "'Ubuntu (ZBM)' in _refind_previous_boot.stdout"
    fail_msg: "rEFInd recorded {{ _refind_previous_boot.stdout_lines }} instead of the Ubuntu (ZBM) entry"
