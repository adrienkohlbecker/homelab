# This role owns the boot chain on the ESP: firmware -> rEFInd -> ZFSBootMenu.
# The ZFSBootMenu tasks come first because the rEFInd menuentry reads the ZBM
# cmdline; they also carry the zfsbootmenu tag so `--tags zfsbootmenu` still
# refreshes only the ZBM image.
#
# The boot role mounts the vfat ESP with umask=0077. FAT has no per-path Unix
# permissions, so every on-ESP task uses the effective mode exposed by that
# mount policy.

- name: Create ZBM directory
  file:
    dest: /boot/efi/EFI/ZBM/
    state: directory
    owner: root
    group: root
    mode: "{{ boot_esp_mode }}"
  become: true
  register: refind_zbm_directory
  tags:
    - refind
    - zfsbootmenu

- name: Create ZBM artifact cache directory
  file:
    dest: "{{ refind_zbm_cache_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true
  register: refind_zbm_cache_directory
  tags:
    - refind
    - zfsbootmenu

- name: Download zfsbootmenu bundle
  when:
    - not (ansible_check_mode and refind_zbm_cache_directory.changed)
  get_url:
    url: "{{ refind_zbm_artifact.url }}"
    checksum: "sha256:{{ refind_zbm_artifact.url }}.sha256sum"
    dest: "{{ refind_zbm_tarball_path }}"
    mode: "0644"
    owner: root
    group: root
    timeout: 120
  become: true
  register: refind_zbm_bundle
  retries: 3
  delay: 5
  until: refind_zbm_bundle is succeeded
  tags:
    - refind
    - zfsbootmenu

- name: Extract zfsbootmenu bundle
  when:
    - >-
      not (ansible_check_mode and
           (refind_zbm_cache_directory.changed
            or refind_zbm_bundle.changed | default(false)))
  unarchive:
    src: "{{ refind_zbm_tarball_path }}"
    dest: "{{ refind_zbm_cache_dir }}"
    remote_src: true
    creates: "{{ refind_zbm_cache_dir }}/zfsbootmenu.EFI"
    owner: root
    group: root
  become: true
  register: refind_zbm_extract
  tags:
    - refind
    - zfsbootmenu

# rEFInd LoadOptions replace the cmdline embedded in the unified EFI image, so
# keep the bundle cmdline beside it for rEFInd to pass explicitly on every arch.
# No backup: true — /boot/efi is vfat; backup_local's chown fails on FAT.
- name: Install common ZBM artifacts  # noqa: require-backup
  when:
    - >-
      not (ansible_check_mode and
           (refind_zbm_cache_directory.changed or refind_zbm_directory.changed
            or refind_zbm_bundle.changed | default(false) or refind_zbm_extract.changed))
  copy:
    src: "{{ refind_zbm_cache_dir }}/{{ item.src }}"
    dest: "/boot/efi/EFI/ZBM/{{ item.dest }}"
    remote_src: true
    owner: root
    group: root
    mode: "{{ boot_esp_mode }}"
  loop:
    - src: zfsbootmenu.EFI
      dest: VMLINUZ.EFI
    - src: cmdline
      dest: cmdline
  loop_control:
    label: "{{ item.dest }}"
  become: true
  register: refind_zbm_artifact_install
  tags:
    - refind
    - zfsbootmenu

# Seed the backup loader the refind fallback menuentry (VMLINUZ-BACKUP.EFI)
# boots. Copy-if-absent (force: false) so a later primary update never clobbers
# the known-good backup.
# No backup: true — /boot/efi is vfat; backup_local's chown fails on FAT.
- name: Seed ZBM backup loader  # noqa: require-backup
  when:
    - >-
      not (ansible_check_mode and
           (refind_zbm_cache_directory.changed or refind_zbm_directory.changed
            or refind_zbm_bundle.changed | default(false) or refind_zbm_extract.changed
            or refind_zbm_artifact_install.changed))
  copy:
    src: /boot/efi/EFI/ZBM/VMLINUZ.EFI
    dest: /boot/efi/EFI/ZBM/VMLINUZ-BACKUP.EFI
    remote_src: true
    force: false
    owner: root
    group: root
    mode: "{{ boot_esp_mode }}"
  become: true
  tags:
    - refind
    - zfsbootmenu

- name: Ask to reboot for the new ZFSBootMenu image
  when:
    - refind_zbm_artifact_install is changed
  file:
    path: /var/run/reboot-required
    state: touch
    owner: root
    group: root
    mode: "0644"
  become: true
  tags:
    - refind
    - zfsbootmenu

# Left at its default (true), the package postinst runs refind-install on every
# upgrade: it rewrites the ESP, may sign with local keys and may add an NVRAM
# entry. This role installs the rEFInd binaries itself, and the boot role owns
# the NVRAM entries.
- name: Keep the refind package from running refind-install
  debconf:
    name: refind
    question: refind/install_to_esp
    vtype: boolean
    value: false
  become: true
  tags:
    - refind

# Noble's own rEFInd is too old to survive a warm reboot under edk2-stable202408
# (see refind_noble_release in versions.yml); later releases use the archive.
- name: Download the pinned rEFInd package
  when: ansible_distribution_release == 'noble'
  get_url:
    url: "{{ refind_noble_release[ansible_architecture].url }}"
    dest: /var/cache/refind.deb
    checksum: "sha256:{{ refind_noble_release[ansible_architecture].sha256 }}"
    owner: root
    group: root
    mode: "0644"
  register: refind_deb_download
  retries: 3
  delay: 5
  until: refind_deb_download is succeeded
  become: true
  tags:
    - refind

# apt reads the archive's embedded package/version and skips an exact match. A
# missing cache is only predicted by get_url in check mode, so there is no local
# archive for apt to inspect until a real apply downloads it.
- name: Install the pinned refind
  when:
    - ansible_distribution_release == 'noble'
    - not (ansible_check_mode and refind_deb_download.changed)
  apt:
    deb: /var/cache/refind.deb
    allow_downgrade: true
  become: true
  tags:
    - refind

- name: Install refind
  when: ansible_distribution_release != 'noble'
  apt:
    package:
      - refind
    cache_valid_time: 3600
  register: refind_apt
  become: true
  tags:
    - refind

- name: Create the rEFInd + firmware-fallback directories on the ESP
  file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "{{ boot_esp_mode }}"
  loop:
    - /boot/efi/EFI/refind
    - /boot/efi/EFI/refind/drivers_{{ refind_arch }}
    - /boot/efi/EFI/BOOT
  become: true
  register: refind_esp_dirs
  tags:
    - refind

# Own the rEFInd binary on the ESP. We copy it straight from the package's
# /usr/share/refind/refind/ (the nested dir refind-install reads via
# RefindDir="$ThisDir/refind") rather than run refind-install, which would also
# register an NVRAM boot entry — boot order / per-disk entries are managed by
# hand at bootstrap, not by this role. The second copy lands at the firmware
# fallback path \EFI\BOOT\BOOT<arch>.EFI so a host whose NVRAM was wiped (CMOS
# clear, BIOS update, "Restore Defaults") still boots rEFInd off the ESP. No
# backup: true — /boot/efi is vfat and backup_local's ownership-preserving chown
# fails on FAT.
#
# Runs on both arches: the package ships refind_x64.efi on x86 and
# refind_aa64.efi on arm64 under the same path.
- name: Install the rEFInd binaries on the ESP  # noqa: require-backup
  when: not (ansible_check_mode and (refind_apt.changed or refind_deb_download.changed))
  copy:
    src: "/usr/share/refind/refind/refind_{{ refind_arch }}.efi"
    dest: "{{ item }}"
    remote_src: true
    owner: root
    group: root
    mode: "{{ boot_esp_mode }}"
  loop:
    - "/boot/efi/EFI/refind/refind_{{ refind_arch }}.efi"
    - "/boot/efi/EFI/BOOT/BOOT{{ refind_arch | upper }}.EFI"
  loop_control:
    label: "{{ item }}"
  become: true
  tags:
    - refind

# This tiny HII driver switches the firmware text input layout to French
# AZERTY so rEFInd's kernel-args editor matches the physical keyboard. No
# backup: true — /boot/efi is vfat, and backup_local's ownership-preserving
# chown fails on FAT. rEFInd automatically scans drivers_<arch> in its own
# directory before presenting the menu.
- name: Install rEFInd AZERTY keymap driver on the ESP  # noqa: require-backup
  when: not (ansible_check_mode and refind_esp_dirs.changed)
  copy:
    src: "homelab_fr_azerty_{{ refind_arch }}.efi"
    dest: "/boot/efi/EFI/refind/drivers_{{ refind_arch }}/homelab_fr_azerty_{{ refind_arch }}.efi"
    owner: root
    group: root
    mode: "{{ boot_esp_mode }}"
  become: true
  register: refind_azerty_keymap_driver
  tags:
    - refind

- name: Create theme directory
  file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "{{ boot_esp_mode }}"
  loop:
    - /boot/efi/EFI/refind/themes
    - /boot/efi/EFI/refind/themes/refind-theme-regular
  become: true
  register: refind_theme_dir
  tags:
    - refind

- name: Download refind theme
  get_url:
    url: "{{ refind_theme_artifact.url }}"
    checksum: "sha256:{{ refind_theme_artifact.sha256 }}"
    # Download cache: persists deliberately. get_url re-verifies the sha256 and
    # skips the fetch when the file already matches, so this is the idempotence
    # mechanism — deleting it would force a re-download on every converge.
    dest: /var/cache/refind-theme.tar.gz
    owner: root
    group: root
    mode: "0644"
  become: true
  register: refind_theme_download
  retries: 3
  delay: 2
  until: refind_theme_download is succeeded
  tags:
    - refind

# Allowlist (not denylist) what lands on the ESP: extract only the PNG icon/
# font assets theme.conf references, plus LICENSE. Matching by *.png extension
# (not by directory) is load-bearing — it means a future pinned-commit bump
# cannot smuggle an active file (.efi/.conf/script) onto the boot partition,
# whatever the upstream tree adds under icons/ or fonts/. --wildcards-match-slash
# lets the globs reach the nested size dirs (icons/128-48/, ...).
- name: Unpack refind theme
  when: >-
    not (ansible_check_mode and
         (refind_theme_dir.changed or refind_theme_download.changed))
  unarchive:
    src: /var/cache/refind-theme.tar.gz
    dest: /boot/efi/EFI/refind/themes/refind-theme-regular
    remote_src: true
    extra_opts:
      - --strip-components=1
      - --wildcards
      - --wildcards-match-slash
      - "*/icons/*.png"
      - "*/fonts/*.png"
      - "*/LICENSE"
    creates: "/boot/efi/EFI/refind/themes/refind-theme-regular/.installed-{{ refind_theme_artifact.sha256 }}"
  become: true
  register: refind_theme_unpack
  tags:
    - refind

- name: Stamp installed theme checksum
  when:
    - not (ansible_check_mode and refind_theme_dir.changed)
    - refind_theme_unpack is changed
  file:
    path: "/boot/efi/EFI/refind/themes/refind-theme-regular/.installed-{{ refind_theme_artifact.sha256 }}"
    state: touch
    owner: root
    group: root
    mode: "{{ boot_esp_mode }}"
  become: true
  tags:
    - refind

- name: Read ZBM cmdline for refind entries
  slurp:
    src: /boot/efi/EFI/ZBM/cmdline
  register: refind_zbm_cmdline_content
  become: true
  tags:
    - refind

# No backup: true on these two — /boot/efi is vfat, and backup_local's chown
# to preserve ownership fails on FAT, so a backup can't be written on the ESP.
- name: Configure refind  # noqa: require-backup require-validate
  template:
    src: refind.conf.j2
    dest: /boot/efi/EFI/refind/refind.conf
    owner: root
    group: root
    mode: "{{ boot_esp_mode }}"
  become: true
  register: refind_conf
  tags:
    - refind

# Mirror the config next to the firmware-fallback binary. rEFInd only reads
# refind.conf from its own directory, so the fallback copy at \EFI\BOOT
# otherwise boots config-less — 20s default countdown, then the first
# auto-scanned loader (the ZBM image) with empty load options: no zbm.skip
# and no serial console args. With the mirror, an NVRAM-wipe recovery boot
# (and every boot on EC2 test cells, whose NVRAM starts empty) behaves
# exactly like the normal NVRAM-entry path, minus theme and keymap driver
# (both resolve relative to rEFInd's own directory; rEFInd skips a missing
# include and falls back to text mode).
- name: Mirror refind.conf to the firmware-fallback directory  # noqa: require-backup require-validate
  when: not (ansible_check_mode and refind_conf.changed)
  copy:
    src: /boot/efi/EFI/refind/refind.conf
    dest: /boot/efi/EFI/BOOT/refind.conf
    remote_src: true
    owner: root
    group: root
    mode: "{{ boot_esp_mode }}"
  become: true
  tags:
    - refind

- name: Configure refind theme  # noqa: require-backup require-validate
  copy:
    src: theme.conf
    dest: /boot/efi/EFI/refind/themes/refind-theme-regular/theme.conf
    owner: root
    group: root
    mode: "{{ boot_esp_mode }}"
  become: true
  tags:
    - refind

# Only the boot config warrants a reboot. rEFInd re-reads the theme + its
# theme.conf fresh from the ESP at every boot, so a theme change takes effect
# at the next natural boot without forcing one.
- name: Ask to reboot
  when: refind_conf.changed or refind_azerty_keymap_driver.changed
  file:
    path: /var/run/reboot-required
    state: touch
    owner: root
    group: root
    mode: "0644"
  become: true
  tags:
    - refind
