- name: Assert the authelia redis password is provided
  assert:
    that:
      - redis_authelia_password | default('') | length > 0
    fail_msg: >-
      redis_authelia_password must be set in group_vars/{prod,test}.yml (a required
      input; role vars sit above inventory vars and must not default it).
  tags:
    - redis

# Redis is Authelia's session store, so it joins Authelia's network and Authelia
# reaches it at `redis.dns.podman` without a host port. Both roles create the
# network independently (idempotent); whichever converges first wins.
- name: Create authelia podman network
  when: not ansible_check_mode
  containers.podman.podman_network:
    name: authelia
    disable_dns: false
    state: present
  become: true
  tags:
    - redis

- name: Set up redis system user, group, and config dir
  import_role:
    name: service_user
    tasks_from: user
  vars:
    service_user_args:
      name: redis
  tags:
    - redis

- name: Pull redis image
  import_role:
    name: podman
    tasks_from: image
  vars:
    podman_image_args:
      name: redis
      image: "{{ redis_image }}"
  tags:
    - redis

# vm.overcommit_memory stays at the kernel default despite the startup warning:
# the heuristic never refuses the RDB fork of a 64mb maxmemory store, and the
# host-wide sysctl would drop the oversized-allocation check for every process.

# Ansible-owned config is mounted read-only, apart from the RDB data redis writes.
- name: Create redis config and data directories
  when: not ansible_check_mode or redis_user.uid is defined
  file:
    dest: "{{ item }}"
    state: directory
    owner: redis
    group: redis
    mode: "0750"
  loop:
    - /mnt/services/redis/config
    - /mnt/services/redis/data
  become: true
  tags:
    - redis

# No validate: -- redis-server has no offline config-parse mode; it validates
# only at full startup, which the unit's Type=notify/--sdnotify=healthy gate
# catches.
- name: Configure redis  # noqa: require-validate
  when: not ansible_check_mode or redis_user.uid is defined
  template:
    src: redis.conf.j2
    dest: /mnt/services/redis/config/redis.conf
    owner: redis
    group: redis
    mode: "0640"
    backup: true
  register: redis_conf
  become: true
  tags:
    - redis

- name: Manage redis service
  import_role:
    name: systemd_unit
    tasks_from: unit
  vars:
    systemd_unit_args:
      src: redis.service.j2
      condition: "{{ not ansible_check_mode or redis_user.uid is defined }}"
      restart: "{{ redis_conf.changed }}"
  tags:
    - redis
