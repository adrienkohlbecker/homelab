# Authelia reaches redis at redis.dns.podman over the `authelia` network. A
# throwaway peer container (not `podman exec` into redis itself) exercises that
# aardvark-dns path. The peer authenticates through REDISCLI_AUTH forwarded with
# a bare `--env`, so the password never appears as an argv token.
- name: _verify | Authenticated ping over the authelia network
  command: >-
    podman run --rm --network authelia --env REDISCLI_AUTH {{ redis_image }}
    redis-cli -h redis.dns.podman -e ping
  become: true
  environment:
    REDISCLI_AUTH: "{{ redis_password }}"
  register: redis_ping
  until: redis_ping.rc == 0 and redis_ping.stdout == 'PONG'
  retries: 15
  delay: 2
  changed_when: false

- name: _verify | Unauthenticated connection is refused
  command: >-
    podman run --rm --network authelia {{ redis_image }}
    redis-cli -h redis.dns.podman ping
  become: true
  register: redis_noauth
  changed_when: false
  failed_when: "'NOAUTH' not in (redis_noauth.stdout + redis_noauth.stderr)"

# A dropped rename-command line would silently re-expose CONFIG SET, so prove
# the hardening is live: an authenticated CONFIG GET must be an unknown command.
- name: _verify | CONFIG command is renamed out
  command: >-
    podman run --rm --network authelia --env REDISCLI_AUTH {{ redis_image }}
    redis-cli -h redis.dns.podman config get maxmemory
  become: true
  environment:
    REDISCLI_AUTH: "{{ redis_password }}"
  register: redis_config_disabled
  changed_when: false
  failed_when: "'unknown command' not in (redis_config_disabled.stdout + redis_config_disabled.stderr)"

# Sessions must survive the clean stop/start of the nightly zfs_autosnapshot and
# any restart. Write a key with a TTL, as Authelia does, and read it back after
# a restart (Type=notify blocks until the healthcheck passes again).
- name: _verify | Write an expiring key before restart
  command: >-
    podman run --rm --network authelia --env REDISCLI_AUTH {{ redis_image }}
    redis-cli -h redis.dns.podman -e set homelab:verify survived ex 3600
  become: true
  environment:
    REDISCLI_AUTH: "{{ redis_password }}"
  changed_when: false

- name: _verify | Restart redis
  systemd:
    name: redis
    state: restarted
  become: true

- name: _verify | Key survived the restart
  command: >-
    podman run --rm --network authelia --env REDISCLI_AUTH {{ redis_image }}
    redis-cli -h redis.dns.podman -e get homelab:verify
  become: true
  environment:
    REDISCLI_AUTH: "{{ redis_password }}"
  register: redis_persist
  until: redis_persist.rc == 0 and redis_persist.stdout == 'survived'
  retries: 15
  delay: 2
  changed_when: false

- name: _verify | Key kept its expiry across the restart
  command: >-
    podman run --rm --network authelia --env REDISCLI_AUTH {{ redis_image }}
    redis-cli -h redis.dns.podman -e ttl homelab:verify
  become: true
  environment:
    REDISCLI_AUTH: "{{ redis_password }}"
  register: redis_ttl
  changed_when: false
  failed_when: redis_ttl.rc != 0 or not (0 < (redis_ttl.stdout | int) <= 3600)

# The snapshot that carried the key across the restart is written by the
# container user, not root.
- name: _verify | Snapshot is owned by the redis user
  stat:
    path: /mnt/services/redis/dump.rdb
  become: true
  register: redis_dump
  failed_when: >-
    not redis_dump.stat.exists
    or redis_dump.stat.pw_name != 'redis'

# Clear the test key so a re-run against a --keep VM starts clean.
- name: _verify | Clear the test key
  command: >-
    podman run --rm --network authelia --env REDISCLI_AUTH {{ redis_image }}
    redis-cli -h redis.dns.podman -e del homelab:verify
  become: true
  environment:
    REDISCLI_AUTH: "{{ redis_password }}"
  changed_when: false

- name: _verify | Exercise alternate service storage layouts
  include_tasks: "{{ ansible_config_file | dirname }}/test/playbooks/tasks/_verify_service_storage.yml"
  vars:
    _storage_service: redis
    _storage_mounts: [ services ]
