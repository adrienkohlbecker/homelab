# Authelia reaches redis at redis.dns.podman over the `authelia` network. A
# throwaway peer container (not `podman exec` into redis itself) exercises that
# aardvark-dns path. A bare `--env REDISCLI_AUTH` forwards the password only
# when the task sets it, so it never appears as an argv token.
- name: _verify | Redis over the authelia network
  become: true
  vars:
    redis_cli: >-
      podman run --rm --network authelia --env REDISCLI_AUTH {{ redis_image }}
      redis-cli -h redis.dns.podman
  block:
    - name: _verify | Authenticated ping as authelia
      command: "{{ redis_cli }} --user authelia -e ping"
      environment:
        REDISCLI_AUTH: "{{ redis_authelia_password }}"
      register: redis_ping
      until: redis_ping.rc == 0 and redis_ping.stdout == 'PONG'
      retries: 15
      delay: 2
      changed_when: false

    - name: _verify | Unauthenticated clients cannot read keys
      command: "{{ redis_cli }} get homelab:verify"
      register: redis_noauth
      changed_when: false
      failed_when: "'NOPERM' not in (redis_noauth.stdout + redis_noauth.stderr)"

    # A widened ACL would silently re-expose CONFIG SET, so prove the
    # restriction is live: an authenticated CONFIG GET must be refused.
    - name: _verify | CONFIG is denied to authelia
      command: "{{ redis_cli }} --user authelia config get maxmemory"
      environment:
        REDISCLI_AUTH: "{{ redis_authelia_password }}"
      register: redis_config_disabled
      changed_when: false
      failed_when: "'NOPERM' not in (redis_config_disabled.stdout + redis_config_disabled.stderr)"

# Startup notices stay visible at the default loglevel while the unit filters
# the accepted overcommit warning that redis prints on every start.
- name: _verify | Redis startup reaches the journal
  command: >-
    journalctl --boot --no-pager --output=cat _SYSTEMD_UNIT=redis.service
    --grep="Ready to accept connections"
  become: true
  register: redis_startup_log
  changed_when: false
  until: redis_startup_log.rc == 0
  retries: 5
  delay: 2

# Redis prints the warning only when overcommit is off; otherwise there is
# nothing to filter and the check below would pass vacuously.
- name: _verify | Read the host overcommit mode
  slurp:
    src: /proc/sys/vm/overcommit_memory
  register: redis_overcommit_mode

- name: _verify | Overcommit warning is filtered from the journal
  when: redis_overcommit_mode.content | b64decode | trim != '1'
  command: >-
    journalctl --boot --no-pager --output=cat _SYSTEMD_UNIT=redis.service
    --grep="Memory overcommit"
  become: true
  register: redis_overcommit_log
  changed_when: false
  failed_when: redis_overcommit_log.rc == 0

- name: _verify | Exercise alternate service storage layouts
  include_tasks: "{{ ansible_config_file | dirname }}/test/playbooks/tasks/_verify_service_storage.yml"
  vars:
    _storage_service: redis
    _storage_mounts: [ services ]
