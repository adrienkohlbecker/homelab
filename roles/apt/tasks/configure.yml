# Wait up to 5 minutes for dpkg's frontend lock instead of failing at once:
# raw apt-get calls (the strict updates here and in apt_source) bypass the apt
# module's lock_timeout. Acquire retries and timeouts keep apt's defaults.
- name: Configure the apt lock timeout
  copy:
    content: |
      DPkg::Lock::Timeout "300";
    dest: /etc/apt/apt.conf.d/80-lock-timeout
    owner: root
    group: root
    mode: "0644"
    backup: true
    validate: 'apt-config dump -c %s'
  become: true
  tags:
    - apt

# Field order and X-Repolib-Name match the files Ansible's deb822_repository
# module writes, so hosts it converged see no diff. Languages: none skips
# Translation-* index downloads; servers run C.UTF-8.
# No validate: apt cannot parse one .sources file in isolation, so the strict
# update below is the functional check.
- name: Configure apt sources  # noqa: require-validate
  copy:
    content: |
      Architectures: {{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}
      Components: main universe restricted multiverse
      Languages: none
      X-Repolib-Name: {{ item.name }}
      Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
      Suites: {{ item.suites }}
      Types: deb
      URIs: {{ item.uris }}
    dest: /etc/apt/sources.list.d/{{ item.name }}.sources
    owner: root
    group: root
    mode: "0644"
    backup: true
  loop:
    - name: ubuntu
      uris: "{{ ubuntu_mirror }}"
      suites: "{{ ansible_distribution_release }} {{ ansible_distribution_release }}-updates {{ ansible_distribution_release }}-backports"
    - name: ubuntu-security
      uris: "{{ ubuntu_mirror_security }}"
      suites: "{{ ansible_distribution_release }}-security"
  loop_control:
    label: "{{ item.name }}"
  register: apt_sources
  become: true
  tags:
    - apt

- name: Empty legacy /etc/apt/sources.list  # noqa: require-validate
  copy:
    content: ""
    dest: /etc/apt/sources.list
    owner: root
    group: root
    mode: "0644"
    backup: true
  register: apt_mirror_legacy_emptied
  become: true
  tags:
    - apt

# Use apt-get directly (not the apt module's update_cache) so that
# --error-on=any turns a half-broken suite into a hard fail at apply
# time. The apt module's update_cache silently tolerates partial-suite
# failures.
- name: Force apt update (--error-on=any)  # noqa: command-instead-of-module
  when: apt_mirror_legacy_emptied.changed or apt_sources.changed
  command: apt-get update --error-on=any
  retries: 5
  delay: 30
  changed_when: true
  become: true
  tags:
    - apt

# Ubuntu 26.04+ defaults to Rust coreutils, whose timeout contract differs from
# the GNU implementation required by the QEMU watchdog.
- name: Read the GNU coreutils selection
  when: ansible_distribution_version is version('26.04', '>=')
  command:
    argv:
      - dpkg-query
      - -W
      - -f=${Status}
      - coreutils-from-gnu
  register: apt_coreutils_from_gnu
  failed_when: false
  changed_when: false
  check_mode: false
  tags:
    - apt

# Solver3 will not infer removal of the conflicting uutils provider, so both
# sides ride one apt transaction. --allow-remove-essential is a blanket waiver,
# so plan the transaction first and refuse it if apt wants to take out anything
# beyond the provider being replaced.
- name: Select GNU coreutils
  when:
    - ansible_distribution_version is version('26.04', '>=')
    - apt_coreutils_from_gnu.rc != 0 or 'install ok installed' not in apt_coreutils_from_gnu.stdout
  tags:
    - apt
  block:
    - name: Plan the GNU coreutils selection  # noqa: command-instead-of-module
      command:
        argv:
          - apt-get
          - --simulate
          - --allow-remove-essential
          - install
          - coreutils-from-gnu
          - coreutils-from-uutils-
      register: apt_coreutils_plan
      changed_when: ansible_check_mode
      check_mode: false
      become: true

    - name: Selecting GNU coreutils removes only the uutils provider
      vars:
        apt_coreutils_removals: >-
          {{ apt_coreutils_plan.stdout_lines
             | select('match', '^Remv ')
             | map('regex_replace', '^Remv ([^ ]+).*$', '\1')
             | list }}
      assert:
        that: apt_coreutils_removals == ['coreutils-from-uutils']
        fail_msg: >-
          Selecting coreutils-from-gnu plans removals beyond the uutils provider
          it replaces: {{ apt_coreutils_removals }}. Refusing to run apt-get
          with --allow-remove-essential against that plan.

    - name: Apply the GNU coreutils selection  # noqa: command-instead-of-module
      when: not ansible_check_mode
      command: >-
        apt-get -y --allow-remove-essential -o DPkg::Lock::Timeout=300
        install coreutils-from-gnu coreutils-from-uutils-
      changed_when: true
      become: true

- name: Configure package-manager log compression
  import_role:
    name: logrotate
    tasks_from: compression
  vars:
    logrotate_args:
      configs:
        - path: /etc/logrotate.d/apt
        - path: /etc/logrotate.d/dpkg
        - path: /etc/logrotate.d/alternatives
  tags:
    - apt
