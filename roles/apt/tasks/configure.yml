- name: Configure apt retries
  copy:
    src: 80-retries.conf
    dest: /etc/apt/apt.conf.d/80-retries
    owner: root
    group: root
    mode: "0644"
    backup: true
    validate: 'apt-config dump -c %s'
  become: true
  tags:
    - apt

- name: Configure apt sources
  import_tasks: sources.yml
  tags:
    - apt

- name: Configure package-manager log compression
  import_role:
    name: logrotate
    tasks_from: compression
  vars:
    logrotate_args:
      configs:
        - path: /etc/logrotate.d/apt
        - path: /etc/logrotate.d/dpkg
        - path: /etc/logrotate.d/alternatives
  tags:
    - apt
