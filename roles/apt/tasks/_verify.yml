# /var/lib/apt/lists/ filenames encode the mirror and suite. InRelease is
# present even for an empty pocket such as resolute-backports before its first
# upload, so it confirms every expected source was fetched.
- name: _verify | Each (mirror, suite) has fetched metadata
  find:
    paths: /var/lib/apt/lists/
    patterns: "{{ _verify_mirror_prefix }}_dists_{{ item.suite }}_InRelease"
  register: _apt_lists
  failed_when: _apt_lists.matched == 0
  vars:
    _verify_mirror_prefix: "{{ item.mirror | regex_replace('^https?://', '') | regex_replace('/+$', '') | regex_replace('/', '_') }}"
  loop:
    - { mirror: "{{ ubuntu_mirror }}", suite: "{{ ansible_distribution_release }}" }
    - { mirror: "{{ ubuntu_mirror }}", suite: "{{ ansible_distribution_release }}-updates" }
    - { mirror: "{{ ubuntu_mirror }}", suite: "{{ ansible_distribution_release }}-backports" }
    - { mirror: "{{ ubuntu_mirror_security }}", suite: "{{ ansible_distribution_release }}-security" }
  loop_control:
    label: "{{ item.mirror }} {{ item.suite }}"

# Functional check: every configured suite serves valid signed metadata.
# --error-on=any turns transient warnings (one unreachable suite, stale
# Release.gpg) into a non-zero exit; the apt module's update_cache lets
# them slide silently.
- name: _verify | Apt-get update succeeds (--error-on=any)  # noqa: command-instead-of-module
  command: apt-get update --error-on=any
  changed_when: false
  become: true

# GNU timeout may die with its process group (-9) or reap the child (137).
- name: _verify | Exercise timeout TERM-to-KILL escalation
  command:
    argv:
      - timeout
      - --kill-after=1s
      - 1s
      - /usr/bin/python3
      - -c
      - "import signal, time; signal.signal(signal.SIGTERM, signal.SIG_IGN); time.sleep(10)"
  register: _apt_verify_timeout
  failed_when: _apt_verify_timeout.rc not in [-9, 137]
  changed_when: false

- name: _verify | Resolve both repository architecture variants through the production tasks
  check_mode: true
  block:
    - name: _verify | Resolve x86 apt sources
      import_role:
        name: apt
        tasks_from: sources
      vars:
        ansible_architecture: x86_64  # noqa: var-naming[no-role-prefix]

    - name: _verify | Resolve ARM apt sources
      import_role:
        name: apt
        tasks_from: sources
      vars:
        ansible_architecture: aarch64  # noqa: var-naming[no-role-prefix]
