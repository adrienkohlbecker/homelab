- name: mirrors | Set hostname and seed /etc/hosts
  import_role:
    name: hostname

- name: mirrors | Ensure systemd-resolved drop-in dir exists
  file:
    path: /etc/systemd/resolved.conf.d
    state: directory
    mode: "0755"
    owner: root
    group: root
  become: true

# Backend-conditional server selection lives in group_vars/all/main.yml
# (bootstrap_dot_servers, next to bootstrap_dns_resolver) so _verify
# asserts against the same single source this drop-in renders.
- name: mirrors | Force DNS-over-TLS so all queries ride TCP
  copy:
    dest: /etc/systemd/resolved.conf.d/10-test-dns-over-tls.conf
    mode: "0644"
    owner: root
    group: root
    content: |
      [Resolve]
      DNS={{ bootstrap_dot_servers }}
      FallbackDNS=
      DNSOverTLS=yes
      Domains=~.
    validate: python3 -c 'import configparser,sys; configparser.ConfigParser(strict=False, delimiters=("=",)).read(sys.argv[1])' "%s"
  register: test_resolved_dot
  become: true

- name: mirrors | Restart systemd-resolved to pick up DoT config
  systemd:
    name: systemd-resolved
    state: restarted
  when: test_resolved_dot.changed
  become: true

- name: mirrors | Configure apt retries and sources
  import_role:
    name: apt

- name: mirrors | Ensure /etc/containers/registries.conf.d exists
  when: (nexus_url | length > 0) or test_use_ecr_registry_mirrors
  file:
    path: /etc/containers/registries.conf.d
    state: directory
    mode: "0755"
    owner: root
    group: root
  become: true

- name: mirrors | Configure podman registry mirrors
  when: (nexus_url | length > 0) or test_use_ecr_registry_mirrors
  copy:
    dest: /etc/containers/registries.conf.d/homelab-mirrors.conf
    mode: "0644"
    owner: root
    group: root
    # Nexus locations include /repository/<repo>: podman bakes the path into
    # the image namespace and roles/nexus's nginx rewrite moves it ahead of
    # /v2/. A bare Nexus host would address an API that does not exist.
    content: |
      {% set mirror_base = test_ecr_registry if test_use_ecr_registry_mirrors else nexus_url ~ '/repository' %}
      {% set registry_mirrors = test_ecr_registry_mirrors if test_use_ecr_registry_mirrors else {'docker.io': 'docker.io', 'ghcr.io': 'ghcr.io'} %}
      {% for source, prefix in registry_mirrors | dictsort %}
      [[registry]]
      location = "{{ source }}"

      [[registry.mirror]]
      location = "{{ mirror_base }}/{{ prefix }}"
      {% endfor %}
  become: true

- name: mirrors | Ensure root containers auth dir exists
  when: test_use_ecr_registry_mirrors
  file:
    path: /root/.config/containers
    state: directory
    mode: "0700"
    owner: root
    group: root
  become: true

- name: mirrors | Write ECR auth for root podman pulls
  when: test_use_ecr_registry_mirrors
  copy:
    dest: /root/.config/containers/auth.json
    mode: "0600"
    owner: root
    group: root
    content: |
      {
        "auths": {
          "{{ test_ecr_registry }}": {
            "auth": "{{ ('AWS:' ~ lookup('pipe', 'aws --region ' ~ test_aws_region ~ ' ecr get-login-password')) | b64encode }}"
          }
        }
      }
    validate: python3 -m json.tool "%s"
  become: true
