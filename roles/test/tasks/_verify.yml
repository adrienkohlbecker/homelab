# Assertions for the test bootstrap applied before every role test. Reuse the
# owner-role verifiers for imported hostname and apt behavior; this file owns
# only the registry-mirror and DNS-over-TLS contracts added by mirrors.yml.
- name: _verify | Verify the hostname fixture
  import_role:
    name: hostname
    tasks_from: _verify

- name: _verify | Verify the apt fixture
  import_role:
    name: apt
    tasks_from: _verify

- name: _verify | Read podman registry mirror config
  when: (nexus_url | length > 0) or test_use_ecr_registry_mirrors
  slurp:
    src: /etc/containers/registries.conf.d/homelab-mirrors.conf
  register: test_registries_content

- name: _verify | Podman registry mirrors reference the selected backend
  when: (nexus_url | length > 0) or test_use_ecr_registry_mirrors
  vars:
    _test_registry_mirror_base: >-
      {{ test_ecr_registry
         if test_use_ecr_registry_mirrors
         else nexus_url ~ '/repository' }}
    _test_registry_mirrors: >-
      {{ test_ecr_registry_mirrors
         if test_use_ecr_registry_mirrors
         else {'docker.io': 'docker.io', 'ghcr.io': 'ghcr.io'} }}
  assert:
    that:
      # Check mirror destinations rather than source locations, which remain
      # present even if a [[registry.mirror]] block disappears.
      - (_test_registry_mirror_base ~ '/' ~ item.value) in (test_registries_content.content | b64decode)
    fail_msg: >-
      registries.conf.d/homelab-mirrors.conf doesn't mirror {{ item.key }} to
      {{ _test_registry_mirror_base }}/{{ item.value }}
  loop: "{{ _test_registry_mirrors | dict2items }}"
  loop_control:
    label: "{{ item.key }} -> {{ item.value }}"

# Functional mirror probe: the config assertions prove registries.conf names
# Nexus, but only its API proves the path layout actually serves.
- name: _verify | Podman docker.io mirror serves its v2 API
  when:
    - nexus_url | length > 0
    - not test_use_ecr_registry_mirrors
  uri:
    # nexus_url is a bare host (the registries.conf mirror location, where podman
    # supplies the scheme); add https:// for a direct probe. validate_certs:false
    # -- this checks the mirror *serves*, not its cert, on a throwaway VM.
    url: "https://{{ nexus_url }}/repository/docker.io/v2/"
    validate_certs: false
    # Nexus answers the v2 root 200 (anonymous) or 401 (auth-gated); a 404 means
    # the mirror location the registries.conf points at doesn't exist.
    status_code: [ 200, 401 ]
    timeout: 15
# DNS-over-TLS verification: mirrors.yml forces DoT so every query rides TCP
# (the qemu SLIRP UDP-drop class of flakes). A stat of the drop-in would be a
# tautology -- assert the *running* resolver state instead, scoped to the Global
# Protocols line (driven by resolved.conf.d/) the way roles/resolved does.
- name: _verify | Read resolvectl status
  command: resolvectl status
  register: test_resolvectl
  changed_when: false
  become: true

- name: _verify | Isolate the Global resolver section
  set_fact:
    # Everything before the first per-link section: resolved routes queries
    # to link scopes ahead of the global scope, so a DHCP-supplied per-link
    # resolver matching anywhere in the full output must not satisfy the
    # assert -- only the Global block proves the drop-in is authoritative.
    test_resolvectl_global: >-
      {{ test_resolvectl.stdout.split('\nLink ') | first }}
    test_resolvectl_global_protocols: >-
      {{ test_resolvectl.stdout_lines
         | select('search', 'Protocols:') | list | first | default('') }}
    # Same single source mirrors.yml renders into the drop-in
    # (group_vars/all/main.yml), split back into per-server tokens --
    # including the #dns.fahm.fr SNI suffix, so a dropped SNI (which
    # breaks DoT certificate validation) fails here too.
    test_expected_resolvers: "{{ bootstrap_dot_servers.split() }}"

- name: _verify | DNS-over-TLS is enforced at the configured resolver
  assert:
    that:
      - "'+DNSOverTLS' in test_resolvectl_global_protocols"
      - >-
        (test_expected_resolvers | select('in', test_resolvectl_global) | list | length)
        == (test_expected_resolvers | length)
    fail_msg: >-
      systemd-resolved isn't enforcing DNS-over-TLS via {{ test_expected_resolvers | join(', ') }};
      the 10-test-dns-over-tls.conf drop-in didn't take effect, so queries can fall
      back to UDP and revive the SLIRP UDP-drop flakes it exists to prevent. Global
      Protocols line: {{ test_resolvectl_global_protocols }}

# Functional proof that public resolution actually works end-to-end: the
# whole reason for the backend-aware resolver. qemu rides the LAN VIP →
# household AdGuard → DoH upstreams; AWS rides public DoT directly. Retried
# because a single DoT handshake can lose the first round trip on a cold
# resolver. wikipedia.org is a neutral name the household filter lists pass.
- name: _verify | Resolve a public name over the enforced resolver
  command: resolvectl query --cache=no wikipedia.org
  register: test_public_resolve
  changed_when: false
  become: true
  retries: 5
  delay: 3
  until: test_public_resolve.rc == 0
