- name: _setup | Install podman
  import_role:
    name: podman
    tasks_from: install

# The full media role (network, group, /mnt/media dataset with the prod
# owner/group/0775 shape, library dirs) -- so the write probe in _verify
# exercises the same permissions prod grants, not a hand-rolled fixture.
- name: _setup | Converge the media role
  import_role:
    name: media

- name: _setup | Install nginx
  import_role:
    name: test
    tasks_from: nginx

- name: _setup | Install fluent-bit for structured-log integration
  import_role:
    name: fluentbit

- name: _setup | Ensure /mnt/services and /mnt/scratch exist
  file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /mnt/services
    - /mnt/services/sqlite
    - /mnt/scratch
  become: true
