- name: _setup | Install podman
  import_role:
    name: podman
    tasks_from: install

- name: _setup | Create media podman network
  import_role:
    name: media
    tasks_from: network

- name: _setup | Create media group
  import_role:
    name: media
    tasks_from: group

- name: _setup | Install nginx
  import_role:
    name: test
    tasks_from: nginx

- name: _setup | Install fluent-bit for structured-log integration
  import_role:
    name: fluentbit

- name: _setup | Ensure /mnt/services and /mnt/scratch exist
  file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /mnt/services
    - /mnt/services/sqlite
    - /mnt/scratch
  become: true

- name: _setup | Create writable media fixture
  file:
    path: /mnt/media
    state: directory
    group: media
    mode: "0775"
  become: true
