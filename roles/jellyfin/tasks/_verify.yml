# Exercise both the published host port and nginx vhost. Together they verify
# valid Jellyfin JSON and catch proxy routing regressions that the container
# healthcheck cannot see.
- name: _verify | Jellyfin public API through each ingress path
  uri:
    url: "{{ item.url }}"
    validate_certs: "{{ item.validate_certs }}"
    status_code: 200
  register: _jellyfin_http
  retries: 30
  delay: 2
  until: _jellyfin_http.status == 200
  failed_when: not ((_jellyfin_http.json.ProductName | default('')) is search('^Jellyfin'))
  loop:
    - name: loopback
      url: http://localhost:{{ service_ports.jellyfin }}/System/Info/Public
      validate_certs: true
    - name: nginx
      url: https://jellyfin.{{ inventory_hostname }}.{{ domain }}/System/Info/Public
      validate_certs: false
  loop_control:
    label: "{{ item.name }}"

# nginx overwrites X-Forwarded-For with its own peer, and the port publish
# masquerades nginx to the media network gateway. A denied login for a unique
# unknown user makes Jellyfin log the IP it attributes the request to: the
# client nginx saw (127.0.0.1) proves Jellyfin trusts the gateway hop, where
# the gateway itself would mean the header was ignored and the spoofed address
# would mean it leaked through nginx.
- name: _verify | Send a denied login through nginx with a spoofed X-Forwarded-For
  uri:
    url: https://jellyfin.{{ inventory_hostname }}.{{ domain }}/Users/AuthenticateByName
    method: POST
    validate_certs: false
    headers:
      Authorization: 'MediaBrowser Client="verify", Device="verify", DeviceId="verify", Version="1"'
      X-Forwarded-For: 203.0.113.7
    body_format: json
    body:
      Username: verify_forwarded_for_probe
      Pw: not-a-password
    status_code: 401

- name: _verify | Jellyfin attributes the proxied login to the client nginx saw
  command:
    argv:
      - journalctl
      - -u
      - jellyfin
      - -b
      - --no-pager
      - --output=cat
      - --grep=verify_forwarded_for_probe
  register: _jellyfin_forwarded_for
  changed_when: false
  retries: 15
  delay: 2
  until: _jellyfin_forwarded_for.stdout is search('"IP":"127\.0\.0\.1"')
  become: true

# Jellyfin's operator-managed library options write beside media (trickplay
# images, downloaded subtitles). Exercise a full create/remove round-trip
# through the container bind so both mount flags and the shared media-group
# permissions are covered. One task, not touch-then-rm: an interrupted run
# must not leave the probe file in the library.
- name: _verify | Round-trip a media write probe from Jellyfin
  command:
    argv:
      - podman
      - exec
      - jellyfin
      - sh
      - -c
      - touch /media/.verify_write_probe && rm /media/.verify_write_probe
  changed_when: false
  become: true

# Functional transcode probe: lavfi testsrc → libx264 → HLS segments on
# /cache/transcodes — Jellyfin's effective transcode path (the image's
# $JELLYFIN_CACHE_DIR/transcodes, pinned as /cache/transcodes in the live
# encoding.xml), which the /cache volume backs with scratch storage.
# Exercises jellyfin-ffmpeg presence, transcode-storage writability, and
# the codec chain in a way stat-only checks can't. Software encode so the
# probe runs identically with or without real HW; HW-accelerated
# transcoding requires real codec silicon and isn't covered in CI.
# Full path, not bare `ffmpeg`: the jellyfin/jellyfin image ships
# jellyfin-ffmpeg only at /usr/lib/jellyfin-ffmpeg/ffmpeg and puts nothing
# on $PATH, so `podman exec jellyfin ffmpeg` is rc 127. Do not "simplify"
# this back to bare ffmpeg.
- name: _verify | Functional ffmpeg transcode into /cache/transcodes
  command: >-
    podman exec jellyfin /usr/lib/jellyfin-ffmpeg/ffmpeg
    -nostdin -hide_banner -loglevel error
    -f lavfi -i testsrc=duration=2:size=320x180:rate=10
    -c:v libx264 -preset ultrafast
    -f hls -hls_time 1
    -hls_segment_filename /cache/transcodes/_verify-%d.ts
    /cache/transcodes/_verify.m3u8 -y
  changed_when: false
  become: true

- name: _verify | Confirm transcode output reached scratch storage
  stat:
    path: /mnt/scratch/jellyfin/cache/transcodes/_verify.m3u8
  register: _jellyfin_scratch_transcode
  failed_when: not _jellyfin_scratch_transcode.stat.exists or (_jellyfin_scratch_transcode.stat.size | int) == 0
  become: true

# --- SSO plugin ---------------------------------------------------------
# A normalized SSO startup record proves the pinned plugin loaded, Jellyfin
# emitted structured logs, and Fluent Bit ingested the same live event.
- name: _verify | Wait for normalized Jellyfin SSO startup record
  import_role:
    name: fluentbit
    tasks_from: verify_live
  vars:
    fluentbit_verify_live_args:
      expected:
        - service: jellyfin
          fields.PluginName: SSO-Auth
          fields.PluginVersion: "{{ jellyfin_sso_plugin_version }}"
          _present:
            - fields.source
          _absent:
            - fields.@t
            - fields.@m
            - fields.JellyfinFormat

# The sign-in page reads this anonymous endpoint before login, so it proves
# Jellyfin parsed the seeded branding.xml and serves the SSO button and the
# CSS that hides password login.
- name: _verify | Jellyfin serves the SSO login button
  uri:
    url: http://localhost:{{ service_ports.jellyfin }}/Branding/Configuration
    status_code: 200
  register: _jellyfin_branding
  failed_when: >-
    _jellyfin_branding.status != 200
    or not ((_jellyfin_branding.json.LoginDisclaimer | default(''))
            is search('action="https://jellyfin\.' ~ inventory_hostname ~ '\.' ~ domain ~ '/sso/OID/start/authelia"'))
    or not ((_jellyfin_branding.json.CustomCss | default('')) is search('\.manualLoginForm'))

- name: _verify | Exercise jellyfin fluent-bit record contracts
  import_role:
    name: fluentbit
    tasks_from: verify_extension
  vars:
    fluentbit_verify_args:
      name: jellyfin
      records:
        - MESSAGE: '{"@t":"2099-01-02T03:04:05Z","@m":"jellyfin-valid","@l":"Warning","JellyfinFormat":"clef","SourceContext":"Verify","service":"attribute"}'
          CONTAINER_TAG: jellyfin
          SYSLOG_IDENTIFIER: conmon
          SYSTEMD_UNIT: jellyfin.service
        - MESSAGE: jellyfin-raw
          CONTAINER_TAG: jellyfin
          SYSLOG_IDENTIFIER: conmon
          SYSTEMD_UNIT: jellyfin.service
      expected:
        - message: jellyfin-valid
          level: warn
          service: jellyfin
          fields.source: Verify
          fields.service: attribute
        - message: jellyfin-raw
          service: jellyfin
- name: _verify | Exercise alternate service storage layouts
  include_tasks: "{{ ansible_config_file | dirname }}/test/playbooks/tasks/_verify_service_storage.yml"
  vars:
    _storage_service: jellyfin
    _storage_group: media
    _storage_mounts: [ services, scratch, media ]
