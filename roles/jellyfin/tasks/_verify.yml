# Loopback probe through the host-side published port -- confirms
# /System/Info/Public returns valid JSON, not just that the container's
# own healthcheck passes (which the unit's --sdnotify=healthy already
# gates the "active" state on).
- name: _verify | Jellyfin /System/Info/Public over loopback
  uri:
    url: http://localhost:{{ service_ports.jellyfin }}/System/Info/Public
    status_code: 200
    return_content: true
  register: _jellyfin_http
  retries: 30
  delay: 2
  until: _jellyfin_http.status == 200
  failed_when: not ((_jellyfin_http.json.ProductName | default('')) is search('^Jellyfin'))

# Map the vhost FQDN to loopback so SNI matches the served certificate.
# Probing https://localhost with a Host: header leaves SNI=localhost, which
# OpenSSL 3.x (noble/resolute) rejects as a fatal unrecognized_name alert
# (status -1); jammy's OpenSSL 1.1 only warns. Hitting the FQDN directly
# keeps SNI correct on every release. Test-only mutation; box is torn down.
- name: _verify | Map the jellyfin vhost FQDN to loopback for SNI-correct probing
  lineinfile:
    path: /etc/hosts
    line: "127.0.0.1 jellyfin.{{ inventory_hostname }}.{{ domain }}"
    state: present
  become: true

# Exercise the nginx-proxied path -- catches typo'd subdomain or
# proxy_pass regressions that the loopback probe would miss.
- name: _verify | Jellyfin /System/Info/Public via nginx vhost
  uri:
    url: https://jellyfin.{{ inventory_hostname }}.{{ domain }}/System/Info/Public
    validate_certs: false
    status_code: 200
    return_content: true
  register: _jellyfin_http_nginx
  retries: 30
  delay: 2
  until: _jellyfin_http_nginx.status == 200
  failed_when: not ((_jellyfin_http_nginx.json.ProductName | default('')) is search('^Jellyfin'))

# Jellyfin stores trickplay images beside their media. Exercise a full
# create/remove round-trip through the container bind so both mount flags and
# the shared media-group permissions are covered.
- name: _verify | Create media write probe from Jellyfin
  command:
    argv:
      - podman
      - exec
      - jellyfin
      - touch
      - /media/.verify_write_probe
  changed_when: false
  become: true

- name: _verify | Remove media write probe from Jellyfin
  command:
    argv:
      - podman
      - exec
      - jellyfin
      - rm
      - /media/.verify_write_probe
  changed_when: false
  become: true

# SQLite wiring: the symlinks at /config/data/<name>.db MUST resolve
# through to the dedicated /mnt/services/sqlite/ dataset (the role's
# whole reason to exist). Without this assert a regression in the
# symlink task or the self-pathed bind-mount lands DB writes back on
# the services dataset silently.
- name: _verify | Stat jellyfin SQLite symlinks
  stat:
    path: "/mnt/services/jellyfin/data/{{ item }}"
    follow: false
  register: _jellyfin_symlinks
  become: true
  loop:
    - jellyfin.db
    - introskipper/introskipper.db

- name: _verify | Assert symlink targets land on sqlite dataset
  assert:
    that:
      - item.stat.islnk
      - item.stat.lnk_target == '/mnt/services/sqlite/jellyfin/' ~ (item.item | basename)
    fail_msg: >-
      /mnt/services/jellyfin/data/{{ item.item }} should be a symlink
      pointing into /mnt/services/sqlite/jellyfin/, but is
      {{ 'a regular file' if not item.stat.islnk else 'pointing at ' ~ item.stat.lnk_target }}.
  loop: "{{ _jellyfin_symlinks.results }}"
  loop_control:
    label: "{{ item.item }}"

# HW transcoding wiring smoke. On box the device is a phantom set up by
# test/tasks/fake_render_device.yml (open() returns ENXIO), so anything
# that actually probes VAAPI would fall back to software. The checks
# below verify the ansible-side templating reached the container:
# (1) the device is visible inside the container, (2) the container has
# the render gid in its supplementary groups. Catches a regression in
# the unit template's --device or --group-add lines that the previous
# host-side stat-equality check would have missed (it just compared
# getent against itself).
#
# _verify.yml runs as a separate ansible-playbook invocation, so the
# getent_group fact set in main.yml's converge phase isn't in scope
# here — re-lookup before asserting.
- name: _verify | Re-lookup render gid for assertions
  when: has_transcoding_acceleration
  become: true
  getent:
    database: group
    key: render

- name: _verify | Confirm /dev/dri/renderD128 inside container
  when: has_transcoding_acceleration
  command: podman exec jellyfin stat -c %n /dev/dri/renderD128
  register: _jellyfin_dri_in_container
  changed_when: false
  failed_when: _jellyfin_dri_in_container.stdout != '/dev/dri/renderD128'
  become: true

- name: _verify | Confirm render gid in container supplementary groups
  when: has_transcoding_acceleration
  command: podman exec jellyfin id -G
  register: _jellyfin_container_groups
  changed_when: false
  failed_when: getent_group.render[1] not in _jellyfin_container_groups.stdout.split()
  become: true

# Functional transcode probe: lavfi testsrc → libx264 → HLS segments on
# /cache/transcodes — Jellyfin's effective transcode path (default
# $JELLYFIN_CACHE_DIR/transcodes, pinned as /cache/transcodes in the live
# encoding.xml), which the /cache volume backs with scratch storage.
# Exercises jellyfin-ffmpeg presence, transcode-storage writability, and
# the codec chain in a way stat-only checks can't. Software encode so the
# probe runs identically with or without real HW; HW-accelerated
# transcoding requires real codec silicon and isn't covered in CI.
# Full path, not bare `ffmpeg`: the jellyfin/jellyfin image ships
# jellyfin-ffmpeg only at /usr/lib/jellyfin-ffmpeg/ffmpeg and puts nothing
# on $PATH, so `podman exec jellyfin ffmpeg` is rc 127. Do not "simplify"
# this back to bare ffmpeg.
- name: _verify | Functional ffmpeg transcode into /cache/transcodes
  command: >-
    podman exec jellyfin /usr/lib/jellyfin-ffmpeg/ffmpeg
    -nostdin -hide_banner -loglevel error
    -f lavfi -i testsrc=duration=2:size=320x180:rate=10
    -c:v libx264 -preset ultrafast
    -f hls -hls_time 1
    -hls_segment_filename /cache/transcodes/_verify-%d.ts
    /cache/transcodes/_verify.m3u8 -y
  changed_when: false
  become: true

- name: _verify | Confirm transcode produced a non-empty playlist
  command: podman exec jellyfin stat -c %s /cache/transcodes/_verify.m3u8
  register: _jellyfin_ffmpeg_output
  changed_when: false
  failed_when: (_jellyfin_ffmpeg_output.stdout | int) == 0
  become: true

- name: _verify | Confirm transcode output reached scratch storage
  stat:
    path: /mnt/scratch/jellyfin/cache/transcodes/_verify.m3u8
  register: _jellyfin_scratch_transcode
  failed_when: not _jellyfin_scratch_transcode.stat.exists or (_jellyfin_scratch_transcode.stat.size | int) == 0
  become: true

# --- SSO plugin ---------------------------------------------------------
# A real OIDC round-trip can't be exercised here: Authelia isn't running
# in the jellyfin role test and the box snakeoil chain doesn't validate
# auth.box.mhaf.fr (the same IdP gap minio/gitea hit). So we assert the
# strongest signals available without a live IdP -- the plugin files are
# present, the DLL actually LOADED (proving the pinned version is
# ABI-compatible with this Jellyfin), and the seeded login button reached
# disk with the host substituted in.
- name: _verify | Stat SSO plugin files
  stat:
    path: "/mnt/services/jellyfin/plugins/sso/{{ item }}"
  register: _jellyfin_sso_files
  become: true
  loop:
    - SSO-Auth.dll
    - Duende.IdentityModel.dll
    - Duende.IdentityModel.OidcClient.dll
    - meta.json

- name: _verify | Assert SSO plugin files present
  assert:
    that:
      - item.stat.exists
    fail_msg: "SSO plugin file missing: {{ item.item }}"
  loop: "{{ _jellyfin_sso_files.results }}"
  loop_control:
    label: "{{ item.item }}"

# Jellyfin logs "Loaded plugin: <Name> <Version>" (PluginManager.cs:604)
# only for plugins whose targetAbi <= the running server version
# (:702). A plugin pinned too new is skipped, not loaded -- so matching the
# structured PluginName/PluginVersion fields proves the ABI pin is right; a stat
# of the DLL on disk can't give. Logs come over the journald log-driver;
# the container is the same instance from converge, so startup lines are
# still readable.
- name: _verify | Read jellyfin container logs
  command: podman logs jellyfin
  register: _jellyfin_jf_logs
  changed_when: false
  become: true

- name: _verify | Assert jellyfin emits rendered compact JSON
  command:
    argv:
      - python3
      - -c
      - |
        import json
        import sys

        for line in sys.stdin:
            try:
                record = json.loads(line)
            except json.JSONDecodeError:
                continue
            if (
                record.get("JellyfinFormat") == "clef"
                and isinstance(record.get("@t"), str)
                and isinstance(record.get("@m"), str)
            ):
                sys.exit(0)
        sys.exit(1)
  args:
    stdin: "{{ _jellyfin_jf_logs.stdout }}"
  changed_when: false

- name: _verify | Wait for normalized jellyfin record in lnav store
  command:
    argv:
      - python3
      - -c
      - |
        import json
        import sys

        with open(sys.argv[1], encoding="utf-8") as handle:
            for line in handle:
                try:
                    record = json.loads(line)
                except json.JSONDecodeError:
                    continue
                fields = record.get("fields", {})
                if (
                    record.get("service") == "jellyfin"
                    and fields.get("parser_status") == "parsed"
                    and fields.get("source")
                    and "@t" not in fields
                    and "@m" not in fields
                    and "JellyfinFormat" not in fields
                ):
                    print(json.dumps(record, sort_keys=True))
                    sys.exit(0)
        sys.exit(1)
      - /var/log/fluent-bit/lnav.jsonl
  register: _jellyfin_lnav_record
  changed_when: false
  retries: 30
  delay: 2
  until: _jellyfin_lnav_record.rc == 0
  become: true

- name: _verify | Assert SSO plugin loaded (ABI-compatible)
  command:
    argv:
      - python3
      - -c
      - |
        import json
        import sys

        expected = sys.argv[1]
        for line in sys.stdin:
            try:
                record = json.loads(line)
            except json.JSONDecodeError:
                continue
            if (
                record.get("PluginName") == "SSO-Auth"
                and record.get("PluginVersion") == expected
            ):
                sys.exit(0)
        sys.exit(1)
      - "{{ jellyfin_sso_plugin_version }}"
  args:
    stdin: "{{ _jellyfin_jf_logs.stdout ~ _jellyfin_jf_logs.stderr }}"
  changed_when: false

- name: _verify | Read seeded branding.xml
  slurp:
    src: /mnt/services/jellyfin/config/branding.xml
  register: _jellyfin_branding
  become: true

- name: _verify | Assert SSO login button seeded with this host
  assert:
    that:
      - >-
        (_jellyfin_branding.content | b64decode)
        is search('jellyfin\.' ~ inventory_hostname ~ '\.' ~ domain ~ '/sso/OID/start/authelia')
    fail_msg: >-
      branding.xml is missing the SSO login-button form for
      jellyfin.{{ inventory_hostname }}.{{ domain }}.

# Confirm the API-driven library-scan pin actually landed -- the converge POST
# only does anything against a live Jellyfin (--check / non-token hosts skip it),
# so this is the real coverage. Re-auth with the throwaway admin the converge
# bootstrapped, then assert the trigger.
- name: _verify | Mint a token for the throwaway admin
  uri:
    url: http://localhost:{{ service_ports.jellyfin }}/Users/AuthenticateByName
    method: POST
    headers:
      Authorization: 'MediaBrowser Client="ansible-verify", Device="box", DeviceId="ansible-verify-box", Version="1.0"'
    body_format: json
    body:
      Username: "{{ jellyfin_test_admin_user }}"
      Pw: "{{ jellyfin_test_admin_password }}"
    status_code: 200
    return_content: true
  register: _jellyfin_verify_auth
  retries: 10
  delay: 2
  until: _jellyfin_verify_auth.status == 200

- name: _verify | Fetch scheduled tasks
  uri:
    url: http://localhost:{{ service_ports.jellyfin }}/ScheduledTasks?isHidden=false
    headers:
      Authorization: 'MediaBrowser Token="{{ _jellyfin_verify_auth.json.AccessToken }}"'
    return_content: true
    status_code: 200
  register: _jellyfin_verify_tasks

- name: _verify | Each heavy task is pinned to its nightly DailyTrigger
  vars:
    _task: "{{ _jellyfin_verify_tasks.json | selectattr('Key', 'equalto', item.key) | list | first | default({}) }}"
  assert:
    that:
      - _task.Triggers | default([]) | length == 1
      - _task.Triggers[0].Type == 'DailyTrigger'
      - (_task.Triggers[0].TimeOfDayTicks | int) == (item.value | int)
    fail_msg: >-
      Expected the {{ item.key }} task to carry a single DailyTrigger at
      {{ item.value }} ticks; got {{ _task.Triggers | default([]) }}.
  loop: "{{ jellyfin_scheduled_task_times | dict2items }}"
  loop_control:
    label: "{{ item.key }} -> {{ item.value }}"

- name: _verify | Exercise jellyfin fluent-bit record contracts
  import_role:
    name: fluentbit
    tasks_from: verify_extension
  vars:
    fluentbit_verify_args:
      name: jellyfin
      records:
        - MESSAGE: '{"@t":"2099-01-02T03:04:05Z","@m":"jellyfin-valid","@l":"Warning","JellyfinFormat":"clef","SourceContext":"Verify","parser_status":"forged","service":"attribute"}'
          CONTAINER_TAG: jellyfin
          SYSLOG_IDENTIFIER: conmon
          SYSTEMD_UNIT: jellyfin.service
        - MESSAGE: jellyfin-raw
          CONTAINER_TAG: jellyfin
          SYSLOG_IDENTIFIER: conmon
          SYSTEMD_UNIT: jellyfin.service
      expected:
        - message: jellyfin-valid
          level: warn
          service: jellyfin
          _not_prefix:
            time: 2099-
          fields.parser_status: parsed
          fields.source: Verify
          fields.service: attribute
        - message: jellyfin-raw
          service: jellyfin
          _absent:
            - fields.parser_status
