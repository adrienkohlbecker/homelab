# Parse only Jellyfin's systemd-unit tag. Preserve_Key keeps the original line
# long enough for normalize.lua to retain malformed JSON and distinguish it
# from intentional non-JSON child-process output such as FFmpeg and libva.
[FILTER]
    Name          parser
    Match         svc.jellyfin.service
    Key_Name      log
    Parser        jellyfin_clef
    Reserve_Data  On
    Preserve_Key  On

[FILTER]
    Name    lua
    Match   svc.jellyfin.service
    script  /etc/fluent-bit/jellyfin_normalize.lua
    call    normalize_jellyfin
