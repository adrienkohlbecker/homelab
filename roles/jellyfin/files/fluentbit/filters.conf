# Parse Jellyfin's systemd-unit tag. The parser filter cannot condition on a
# record field, so normalize.lua uses CONTAINER_TAG presence to distinguish
# container output from podman command and unit lifecycle records. Preserve_Key
# keeps the original line long enough to retain malformed JSON and distinguish
# it from intentional non-JSON child-process output such as FFmpeg and libva.
[FILTER]
    Name          parser
    Match         svc.jellyfin.service
    Key_Name      log
    Parser        jellyfin_clef
    Reserve_Data  On
    Preserve_Key  On

[FILTER]
    Name    lua
    Match   svc.jellyfin.service
    script  /etc/fluent-bit/jellyfin_normalize.lua
    call    normalize_jellyfin
