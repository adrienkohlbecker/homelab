# Install a per-mountpoint oneshot that asserts the dataset is mounted before
# consumer services start. Callers pass one `zfs_mount_args` dict:
#   dataset    zfs dataset path (e.g. rpool/services)
#   mountpoint absolute mountpoint (e.g. /mnt/services)
#
# Unit names preserve the historical slash-to-underscore mapping ('root' for
# '/'). It is non-injective, so the filter rejects the known /root alias.
# Consumers hard-code these names; changing the mapping is a fleet-wide rename.
- name: mount_unit | Assert required inputs
  assert:
    that:
      - zfs_mount_args.dataset is defined
      - zfs_mount_args.dataset is match('^[A-Za-z0-9][A-Za-z0-9_.:/-]*$')
      - zfs_mount_args.mountpoint is defined
    quiet: true
  tags:
    - zfs
    - zfs_mount

- name: mount_unit | Derive unit name suffix
  set_fact:
    _zfs_mount_unit_name: "{{ zfs_mount_args.mountpoint | zfs_mount_unit }}"
  tags:
    - zfs
    - zfs_mount

- name: Add check mount binary
  copy:
    src: zfs_check_mount.sh
    dest: /usr/local/bin/zfs_check_mount
    mode: "0755"
    owner: root
    group: root
    backup: true
    validate: bash -n %s
  become: true
  tags:
    - zfs
    - zfs_mount

- name: mount_unit | Manage systemd mount service
  import_role:
    name: systemd_unit
    tasks_from: unit
  vars:
    systemd_unit_args:
      src: zfs_mount.service.j2
      dest: "{{ _zfs_mount_unit_name }}"
  tags:
    - zfs
    - zfs_mount
