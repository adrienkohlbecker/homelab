- name: install | Configure the boot image provider
  import_role:
    name: boot
    tasks_from: initramfs_provider
  tags:
    - zfs

- name: install | Install ZoL
  apt:
    package:
      - zfsutils-linux
      - "{{ 'zfs-dracut' if initramfs_use_dracut else 'zfs-initramfs' }}"
      - zfs-zed
    policy_rc_d: 101
    cache_valid_time: 3600
  register: zfs_apt
  become: true
  tags:
    - zfs
