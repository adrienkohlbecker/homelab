# Restart after a package upgrade so the running zed picks up the installed
# binary, or when zed.rc changed so the notification config takes effect;
# otherwise just ensure it is started and leave a healthy daemon undisturbed.
- name: Enable and start zed
  when: not (ansible_check_mode and zfs_apt.changed)
  systemd:
    name: zfs-zed
    enabled: true
    state: '{{ "restarted" if zfs_apt.changed or zfs_zedrc.changed else "started" }}'
  become: true
  tags:
    - zfs
