- name: arc | Configure ARC
  template:
    src: zfs.conf.j2
    dest: /etc/modprobe.d/zfs.conf
    mode: "0644"
    owner: root
    group: root
    backup: true
    validate: modprobe --config %s --showconfig
  register: zfs_module_conf
  become: true
  tags:
    - zfs

# Module options take effect only when zfs.ko loads at boot. A userspace
# update refreshes the image's tools but leaves the loaded module unchanged.
- name: arc | Rebuild boot images with the ZFS module policy
  import_role:
    name: boot
    tasks_from: initramfs_rebuild
  vars:
    boot_initramfs_args:
      changed: '{{ zfs_module_conf.changed or zfs_apt.changed }}'
      reboot: '{{ zfs_module_conf.changed }}'
  tags:
    - zfs
