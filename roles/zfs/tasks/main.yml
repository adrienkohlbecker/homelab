- name: Install ZoL
  import_tasks: install.yml
  tags:
    - zfs

- name: Assert required inputs
  assert:
    that:
      - zfs_root is boolean
      - zfs_trim_pools is defined
      - zfs_mount_cache_pools is defined
      - zfs_pool_properties is defined
  tags:
    - zfs

# Catches divergence between the userspace zfsutils and the loaded zfs.ko.
# Ubuntu ships the kernel module with the kernel (linux-modules-<abi> on Noble,
# linux-main-modules-zfs-<abi> on Resolute), so its OpenZFS release tracks the
# installed kernel independently of zfsutils-linux. Ubuntu's package revisions
# can legitimately differ; only the upstream release matters for
# kernel/userspace compatibility.
#
# Gates — the assert is only meaningful in a settled state:
#   - zfs_apt.changed: just upgraded userspace; the loaded kmod won't
#     refresh until reboot, mismatch is expected for the rest of this
#     play.
#   - reboot-required: a kernel upgrade is pending, so the loaded kmod is stale
#     by definition and the comparison would false-positive.
- name: Stat /var/run/reboot-required
  stat:
    path: /var/run/reboot-required
  register: zfs_reboot_required
  tags:
    - zfs

- name: Read zfs userspace + kmod versions
  when: not (ansible_check_mode and zfs_apt.changed)
  command: zfs --version
  register: zfs_version_out
  changed_when: false
  check_mode: false
  tags:
    - zfs

- name: Assert userspace and kmod ZFS versions match
  vars:
    zfs_release_pattern: '[0-9]+\.[0-9]+\.[0-9]+'
  when:
    - not zfs_apt.changed
    - not zfs_reboot_required.stat.exists
  assert:
    that:
      # Length guard first: a kmod that is not loaded yet makes `zfs --version`
      # emit only the userspace line, so an unguarded [1] would IndexError with
      # an opaque template error instead of this diagnostic. The second clause
      # short-circuits (Jinja `or`) when length < 2, so it never indexes [1]
      # past the end.
      - zfs_version_out.stdout_lines | length >= 2
      - >-
        (zfs_version_out.stdout_lines | length < 2) or
        ((zfs_version_out.stdout_lines[0] | regex_search(zfs_release_pattern)) ==
         (zfs_version_out.stdout_lines[1] | regex_search(zfs_release_pattern)))
    fail_msg: |-
      ZFS version check failed (expected two lines whose upstream OpenZFS
      releases agree -- Ubuntu package revisions may differ):
      {{ zfs_version_out.stdout }}
  tags:
    - zfs

# init_on_alloc=0 — the kernel's page-zeroing-on-alloc default taxes ZFS's
# alloc-heavy ARC. The boot cmdline engine threads it into grub.d
# (GRUB_CMDLINE_LINUX_DEFAULT) or the ZBM property per the host's bootloader.
- name: Disable init_on_alloc
  import_role:
    name: boot
    tasks_from: cmdline
  vars:
    boot_cmdline_args:
      name: zfs
      contents: init_on_alloc=0
      grub_scope: default
  tags:
    - zfs

- name: Configure ARC module policy
  import_tasks: arc.yml
  tags:
    - zfs

# zfs_cull is intentionally unscheduled operator tooling; zfs_scrub is the
# timer entry point configured below.
- name: Copy ZFS scripts
  copy:
    src: "{{ item }}.sh"
    dest: "/usr/local/bin/{{ item }}"
    mode: "0755"
    owner: root
    group: root
    backup: true
    validate: bash -n %s
  loop:
    - zfs_cull
    - zfs_scrub
  become: true
  tags:
    - zfs

# Own the scrub schedule rather than leaving it to the distro's
# /etc/cron.d/zfsutils-linux (second Sunday, 00:24) -- a single scheduler is
# easier to reason about. Second Sunday preserves the distro's monthly cadence;
# a stable randomized delay spreads the fleet's scrubs over half an hour. The
# script waits for each pool's scrub in turn and fails on an incomplete scrub or
# an unhealthy pool, so netdata's failed-unit alarm reports the outcome and its
# overdue alarm a timer that stopped firing. Two days covers the longest serial
# run (pug ~17h) with room for growth.
- name: Schedule the zfs_scrub timer
  import_role:
    name: systemd_timer
    tasks_from: install
  vars:
    systemd_timer_args:
      name: zfs_scrub
      description: Monthly ZFS scrub
      on_calendar: "Sun *-*-08..14 01:00:00"
      persistent: true
      exec_start: /usr/local/bin/zfs_scrub
      timeout_start_sec: 2d
      randomized_delay_sec: 1800
  tags:
    - zfs

# Keep one scheduler per job: the role-owned scrub timer and the package's
# weekly trim timer. Remove the package cron conffile; dpkg preserves local
# conffile removal across upgrades. Mask the unused package timer templates
# defensively against preset changes.
- name: Remove distro ZFS scrub/trim cron
  file:
    path: /etc/cron.d/zfsutils-linux
    state: absent
  become: true
  tags:
    - zfs

- name: Mask unused distro ZFS scrub/trim systemd timers
  systemd:
    name: "{{ item }}"
    masked: true
  loop:
    - zfs-scrub-monthly@.timer
    - zfs-scrub-weekly@.timer
    - zfs-trim-monthly@.timer
  become: true
  tags:
    - zfs

- name: Unmask the distro weekly ZFS trim timer
  systemd:
    name: zfs-trim-weekly@.timer
    masked: false
  become: true
  tags:
    - zfs

# zfs-trim@.service runs `zpool trim -w`, so a failed trim leaves a failed unit.
- name: Enable the weekly ZFS trim timer for each pool
  when: not (ansible_check_mode and zfs_apt.changed)
  systemd:
    name: zfs-trim-weekly@{{ item }}.timer
    enabled: true
    state: started
  loop: "{{ zfs_trim_pools }}"
  become: true
  tags:
    - zfs

# ZED is enabled for its cache-rebuild zedlet regardless, but with
# ZED_EMAIL_ADDR unset (the package default) it mails nothing. Pointing it at
# root lights up the stock statechange-notify / data-notify / scrub_finish
# zedlets, which deliver event-driven fault + checksum + scrub-error mail within
# seconds. Netdata's zfspool alarms cover pool and vdev state, and the zfs_scrub
# unit a scrub that did not happen or did not complete. ZED_NOTIFY_VERBOSE stays
# at its 0 default so clean scrub completions don't mail; only faults and
# errored scrubs do.
- name: Configure ZED email notifications
  when: not (ansible_check_mode and zfs_apt.changed)
  lineinfile:
    path: /etc/zfs/zed.d/zed.rc
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    backup: true
    validate: bash -n %s
  loop:
    - regexp: '^#?ZED_EMAIL_ADDR='
      line: 'ZED_EMAIL_ADDR="root"'
    # Deliberate non-default: a resilver only verifies the replaced device, so
    # auto-scrub the whole pool afterwards to confirm end-to-end integrity on
    # the multi-disk pools after a disk swap.
    - regexp: '^#?ZED_SCRUB_AFTER_RESILVER='
      line: ZED_SCRUB_AFTER_RESILVER=1
  loop_control:
    label: "{{ item.line }}"
  register: zfs_zedrc
  become: true
  tags:
    - zfs

# A package upgrade or zed.rc change requires the running daemon to reload its
# binary or notification settings; otherwise leave a healthy process alone.
- name: Manage ZED service
  when: not (ansible_check_mode and zfs_apt.changed)
  systemd:
    name: zfs-zed
    enabled: true
    state: '{{ "restarted" if zfs_apt.changed or zfs_zedrc.changed else "started" }}'
  become: true
  tags:
    - zfs

# The core ZFS boot services come enabled via the package's systemd preset on
# any root-on-ZFS host (it wouldn't boot otherwise) — enable them explicitly so
# an ansible-from-stock-Ubuntu host owns the state rather than inheriting it.
- name: Enable core ZFS boot services
  when:
    - zfs_root
    - not (ansible_check_mode and zfs_apt.changed)
  systemd:
    name: "{{ item }}"
    enabled: true
  loop:
    - zfs.target
    - zfs-import.target
    - zfs-import-cache
    - zfs-mount
  become: true
  tags:
    - zfs

# Own the pool-level properties the install set at creation (autotrim=on on the
# SSD-backed pools; autoexpand=on on a grow-on-first-boot Hetzner rpool) so an
# ansible-from-stock-Ubuntu host owns them rather than inheriting them from the
# bootstrap scripts. Read-then-set via `zpool get`/`set` rather than
# community.general.zpool: that module can create AND destroy pools -- too sharp
# an edge to point at the prod pools holding every household dataset. `zpool
# set` can only change a property (it cannot lose a pool).
#
# The root dataset's autobackup:bak rides the same loop: a root restored via
# `zfs recv` can keep autobackup:bak=true with source=received, which
# zfs-autobackup's `-s local` picker ignores, so the source must match too.
- name: Read owned pool and root dataset properties
  when: zfs_root
  vars:
    zfs_owned_properties: >-
      {{ zfs_pool_properties
         | map('combine', {'cmd': 'zpool'})
         | list
         + [{'cmd': 'zfs', 'pool': 'rpool/ROOT/' ~ ansible_distribution_release,
             'name': 'autobackup:bak', 'value': 'true'}] }}
  command: "{{ item.cmd }} get -H -o value,source {{ item.name }} {{ item.pool }}"
  loop: "{{ zfs_owned_properties }}"
  loop_control:
    label: "{{ item.pool }} {{ item.name }}"
  register: zfs_owned_properties_current
  changed_when: false
  check_mode: false
  become: true
  tags:
    - zfs

- name: Set owned pool and root dataset properties
  when:
    - zfs_root
    - item.stdout.split() != [item.item.value, 'local']
  command: "{{ item.item.cmd }} set {{ item.item.name }}={{ item.item.value }} {{ item.item.pool }}"
  loop: "{{ zfs_owned_properties_current.results | default([]) }}"
  loop_control:
    label: "{{ item.item.pool }} {{ item.item.name }}={{ item.item.value }}"
  changed_when: true
  become: true
  tags:
    - zfs

- name: Setup mount generator
  import_tasks: mount_generator.yml

# Pin the expected root boot environment into a failed-state signal. If a host
# boots another BE without a converge, generic failed-unit monitoring reports
# the mismatch immediately. Re-converge after a deliberate BE switch.
- name: Add zfs mount service for root pool
  when: zfs_root
  import_tasks: mount_unit.yml
  vars:
    zfs_mount_args:
      dataset: "rpool/ROOT/{{ ansible_distribution_release }}"
      mountpoint: /
  tags:
    - zfs
    - zfs_mount
