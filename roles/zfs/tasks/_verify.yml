# ZFS role _verify: assert the role's converged state is live.
# testrole.py / testall.py only (qemu); never site.yml or --tags zfs against prod.

- name: _verify | Reboot to load the configured ZFS module options
  import_role:
    name: reboot
    tasks_from: reboot

- name: _verify | Load ZFS on hosts without a ZFS root
  when: not zfs_root
  command: modprobe zfs
  changed_when: false
  become: true

- name: _verify | Live ARC parameters match the configured limits
  command: cat /sys/module/zfs/parameters/{{ item.name }}
  loop:
    - { name: zfs_arc_min, value: '{{ zfs_arc_min }}' }
    - { name: zfs_arc_max, value: '{{ zfs_arc_max }}' }
  loop_control:
    label: '{{ item.name }}'
  register: _zfs_verify_arc
  changed_when: false
  failed_when: _zfs_verify_arc.stdout | trim | int != item.value | int
  become: true

# --- Root mount guard ---

- name: _verify | Check root mount guard is active
  when: zfs_root
  systemd:
    name: zfs_mount_root.service
  register: _zfs_verify_root_mount_unit
  become: true

- name: _verify | Root mount guard is active
  when: zfs_root
  assert:
    that: _zfs_verify_root_mount_unit.status.ActiveState == 'active'

- name: _verify | Root mount guard rejects invalid mount states
  when: zfs_root
  command:
    argv: "{{ ['/usr/local/bin/zfs_check_mount'] + item.args }}"
  register: _zfs_verify_mount_negative
  changed_when: false
  failed_when: _zfs_verify_mount_negative.rc == 0
  loop:
    - { label: mountpoint mismatch, args: [ "rpool/ROOT/{{ ansible_distribution_release }}", /nonexistent ] }
    - { label: missing dataset, args: [ rpool/nonexistent_dataset, / ] }
    - { label: extra argument, args: [ "rpool/ROOT/{{ ansible_distribution_release }}", /, "on" ] }
  loop_control:
    label: "{{ item.label }}"
  become: true

# --- Mount generator ---

# Check the initial refresh before child creation triggers another zed update.
- name: _verify | Read mount cache content for each pool
  command: cat /etc/zfs/zfs-list.cache/{{ item }}
  loop: "{{ zfs_mount_cache_pools }}"
  register: _zfs_verify_cache_files
  changed_when: false
  become: true

- name: _verify | Initial mount cache lists its pool root
  assert:
    that: item.stdout_lines | select('match', '^' ~ item.item ~ '\t') | list | length > 0
    fail_msg: >-
      /etc/zfs/zfs-list.cache/{{ item.item }} does not list
      pool root {{ item.item }} -- the zed cacher did not populate it.
  loop: "{{ _zfs_verify_cache_files.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: _verify | Create a dataset after the initial cache refresh
  community.general.zfs:
    name: "{{ item }}/_verify_mount_cache"
    state: present
    extra_zfs_properties:
      canmount: "off"
      mountpoint: none
  loop: "{{ zfs_mount_cache_pools }}"
  become: true

- name: _verify | Mount cache follows later dataset creation
  command: cat /etc/zfs/zfs-list.cache/{{ item }}
  loop: "{{ zfs_mount_cache_pools }}"
  register: _zfs_verify_new_cache
  changed_when: false
  until: (item ~ '/_verify_mount_cache') in _zfs_verify_new_cache.stdout
  retries: 20
  delay: 1
  become: true

# --- Trim scheduler ---

# Run the unit the weekly timer triggers. It is not a oneshot, so --wait holds
# until the trim ends and fails if the unit failed; zpool then confirms the trim
# completed rather than being skipped by a unit condition.
- name: _verify | The stock trim unit trims each scheduled pool
  shell: |
    set -euo pipefail
    timeout -k 10 300 systemctl start --wait zfs-trim@{{ item }}.service
    [[ "$(LC_ALL=C zpool status -t {{ item }})" == *"trimmed, completed"* ]]
  args:
    executable: /bin/bash
  loop: "{{ zfs_trim_pools }}"
  changed_when: false
  become: true

# --- Scrub scheduler ---

# The unit is a oneshot, so start blocks until every pool's scrub is done and
# fails with the unit.
- name: _verify | The scrub unit scrubs every pool
  shell: |
    set -euo pipefail
    timeout -k 10 600 systemctl start zfs_scrub.service
    for pool in $(zpool list -H -o name); do
      [[ "$(LC_ALL=C zpool status "$pool")" == *"scan: scrub repaired"* ]]
    done
  args:
    executable: /bin/bash
  changed_when: false
  become: true

# Build a throwaway mirror over two backing files and corrupt one leg's data
# region underneath ZFS. The scrub repairs the damage from the other leg, but
# the checksum errors leave the pool unhealthy, so the scrub unit must fail and
# ZED must mail the scrub_finish report. A stand-in mail command, replacing any
# installed one on the throwaway fixture, records what ZED sends. Then cancel
# scrubs mid-run (scan progress suspended so they cannot finish first) and
# require the unit to fail on the incomplete scrub. The pool needs no ZFS root,
# so hosts without one exercise ZED and the scrub unit against a real pool too.
- name: _verify | Scrub failure drill
  become: true
  block:
    - name: _verify | Scrub drill | Record ZED mail instead of sending it
      copy:
        content: |
          #!/bin/sh
          { echo "mail $*"; cat; } >>/var/tmp/zfs_scrub_test_mail.log
        dest: /usr/bin/mail
        force: true
        mode: "0755"

    - name: _verify | Scrub drill | Create backing files for a throwaway pool
      command: truncate -s 64M /var/tmp/zfs_scrub_test_{{ item }}.img
      loop: [ 0, 1 ]
      changed_when: true

    - name: _verify | Scrub drill | Create a mirror pool over the files
      command: >-
        zpool create -f zfs_scrub_test mirror
        /var/tmp/zfs_scrub_test_0.img /var/tmp/zfs_scrub_test_1.img
      changed_when: true

    - name: _verify | Scrub drill | Write incompressible data into the pool
      command: dd if=/dev/urandom of=/zfs_scrub_test/payload bs=1M count=16 conv=fsync
      changed_when: true

    # Overwrite the data region of one leg (4-60 MiB) with random bytes, leaving
    # the four vdev labels (first/last ~512 KiB) intact so the leg stays ONLINE
    # and the damage surfaces as checksum errors rather than a missing device.
    - name: _verify | Scrub drill | Corrupt one mirror leg underneath ZFS
      command: >-
        dd if=/dev/urandom of=/var/tmp/zfs_scrub_test_0.img
        bs=1M seek=4 count=56 conv=notrunc,fsync
      changed_when: true

    - name: _verify | Scrub drill | Scrub through the unit
      command: timeout -k 10 600 systemctl start zfs_scrub.service
      register: _zfs_scrub_damaged_run
      changed_when: true
      failed_when: _zfs_scrub_damaged_run.rc == 0

    - name: _verify | Scrub drill | Read the failed run's log
      shell: |
        set -euo pipefail
        journalctl -o cat _SYSTEMD_INVOCATION_ID="$(systemctl show -P InvocationID zfs_scrub.service)"
      args:
        executable: /bin/bash
      register: _zfs_scrub_damaged_log
      changed_when: false

    - name: _verify | Scrub drill | The unit failed on the unhealthy pool
      assert:
        that: "'zfs_scrub_test is not healthy after its scrub' in _zfs_scrub_damaged_log.stdout"
        fail_msg: "{{ _zfs_scrub_damaged_log.stdout }}"

    - name: _verify | Scrub drill | ZED mails the scrub report to root
      command: cat /var/tmp/zfs_scrub_test_mail.log
      register: _zfs_scrub_mail
      changed_when: false
      until: >-
        'ZFS scrub_finish event for zfs_scrub_test' in _zfs_scrub_mail.stdout
        and ' root' in _zfs_scrub_mail.stdout
      retries: 20
      delay: 1

    - name: _verify | Scrub drill | Clear the repaired checksum errors
      command: zpool clear zfs_scrub_test
      changed_when: true

    # The unit scrubs each pool in turn; cancel whichever scrub is running until
    # the unit gives up.
    - name: _verify | Scrub drill | Cancel scrubs while the unit runs
      shell: |
        set -euo pipefail
        echo 1 >/sys/module/zfs/parameters/zfs_scan_suspend_progress
        systemctl start --no-block zfs_scrub.service
        for _ in $(seq 120); do
          sleep 1
          if [ "$(systemctl show -P ActiveState zfs_scrub.service)" != activating ]; then
            break
          fi
          for pool in $(zpool list -H -o name); do
            zpool scrub -s "$pool" 2>/dev/null || true
          done
        done
        echo 0 >/sys/module/zfs/parameters/zfs_scan_suspend_progress
        systemctl show -P ActiveState zfs_scrub.service
        journalctl -o cat _SYSTEMD_INVOCATION_ID="$(systemctl show -P InvocationID zfs_scrub.service)"
      args:
        executable: /bin/bash
      register: _zfs_scrub_canceled
      changed_when: true

    - name: _verify | Scrub drill | The unit failed on the canceled scrub
      assert:
        that:
          - _zfs_scrub_canceled.stdout_lines[0] == 'failed'
          - "'scrub on zfs_scrub_test did not complete' in _zfs_scrub_canceled.stdout"
        fail_msg: "{{ _zfs_scrub_canceled.stdout }}"
