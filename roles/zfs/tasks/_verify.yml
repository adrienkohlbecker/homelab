# ZFS role _verify: assert the role's converged state is live.
# testrole.py / testall.py only (qemu); never site.yml or --tags zfs against prod.

- name: _verify | Reboot to load the configured ZFS module options
  import_role:
    name: reboot
    tasks_from: reboot

- name: _verify | Load ZFS on hosts without a ZFS root
  when: not zfs_root
  command: modprobe zfs
  changed_when: false
  become: true

- name: _verify | Live ARC parameters match the configured limits
  command: cat /sys/module/zfs/parameters/{{ item.name }}
  loop:
    - { name: zfs_arc_min, value: '{{ zfs_arc_min }}' }
    - { name: zfs_arc_max, value: '{{ zfs_arc_max }}' }
  loop_control:
    label: '{{ item.name }}'
  register: _zfs_verify_arc
  changed_when: false
  failed_when: _zfs_verify_arc.stdout | trim | int != item.value | int
  become: true

# --- Pool properties ---

- name: _verify | Read managed pool properties
  command: zpool get -H -o value {{ item.name }} {{ item.pool }}
  loop: "{{ zfs_pool_properties }}"
  loop_control:
    label: "{{ item.pool }} {{ item.name }}"
  changed_when: false
  register: _zfs_verify_props
  become: true

- name: _verify | Managed pool properties are applied
  assert:
    that: item.stdout | trim == item.item.value
    fail_msg: >-
      {{ item.item.pool }} {{ item.item.name }} is
      {{ item.stdout | trim }}, expected {{ item.item.value }}.
  loop: "{{ _zfs_verify_props.results }}"
  loop_control:
    label: "{{ item.item.pool }} {{ item.item.name }}"

# --- Root dataset autobackup property ---

- name: _verify | Read autobackup:bak value+source on root dataset
  when: zfs_root
  command: zfs get -H -o value,source autobackup:bak rpool/ROOT/{{ ansible_distribution_release }}
  register: _zfs_verify_autobackup
  changed_when: false
  become: true

# Value AND source must be right: zfs-autobackup's picker filters `-s local`, so
# an autobackup:bak=true left inherited or `received` (after a DR `zfs recv`)
# reads back true yet never gets snapshotted. Assert source=local, not just true.
- name: _verify | Root dataset autobackup:bak is true with a local source
  when: zfs_root
  assert:
    that: (_zfs_verify_autobackup.stdout | trim).split() == ["true", "local"]
    fail_msg: >-
      autobackup:bak on rpool/ROOT/{{ ansible_distribution_release }} is
      "{{ _zfs_verify_autobackup.stdout | trim }}", expected value=true source=local.

# --- Root mount guard ---

- name: _verify | Check root mount guard is active
  when: zfs_root
  systemd:
    name: zfs_mount_root.service
  register: _zfs_verify_root_mount_unit
  become: true

- name: _verify | Root mount guard is active
  when: zfs_root
  assert:
    that: _zfs_verify_root_mount_unit.status.ActiveState == 'active'

- name: _verify | Check root mount passes
  when: zfs_root
  command: /usr/local/bin/zfs_check_mount rpool/ROOT/{{ ansible_distribution_release }} /
  register: _zfs_verify_root_mount
  changed_when: false
  become: true

- name: _verify | Successful root mount check is silent
  when: zfs_root
  assert:
    that: _zfs_verify_root_mount.stdout == ''

# --- Zed service ---

- name: _verify | Query zed unit state
  systemd:
    name: zfs-zed
  register: _zfs_verify_zed
  failed_when: >-
    _zfs_verify_zed.status.ActiveState != 'active'
    or _zfs_verify_zed.status.UnitFileState != 'enabled'
  become: true

# --- Scrub scheduler ---

# Every imported pool must end up with a completed scrub, so the later health
# runs see real scan history.
- name: _verify | The scrub script scrubs every pool
  shell: |
    set -euo pipefail
    /usr/local/bin/zfs_scrub
    for pool in $(zpool list -H -o name); do
      timeout -k 10 300 zpool wait -t scrub "$pool"
      LC_ALL=C zpool status "$pool" | grep -q "scan: scrub repaired"
    done
  args:
    executable: /bin/bash
  environment:
    ZFS_SCRUB_STAGGER_SEC: "0"  # skip the prod anti-thundering-herd stagger; img-backed CI pools can't hard-lock
  changed_when: false
  become: true

# --- Mount generator ---

# Check the initial refresh before child creation triggers another zed update.
- name: _verify | Read mount cache content for each pool
  command: cat /etc/zfs/zfs-list.cache/{{ item }}
  loop: "{{ zfs_mount_cache_pools }}"
  register: _zfs_verify_cache_files
  changed_when: false
  become: true

- name: _verify | Initial mount cache lists its pool root
  assert:
    that: item.stdout_lines | select('match', '^' ~ item.item ~ '\t') | list | length > 0
    fail_msg: >-
      /etc/zfs/zfs-list.cache/{{ item.item }} does not list
      pool root {{ item.item }} -- the zed cacher did not populate it.
  loop: "{{ _zfs_verify_cache_files.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: _verify | Create a dataset after the initial cache refresh
  community.general.zfs:
    name: "{{ item }}/_verify_mount_cache"
    state: present
    extra_zfs_properties:
      canmount: "off"
      mountpoint: none
  loop: "{{ zfs_mount_cache_pools }}"
  become: true

- name: _verify | Mount cache follows later dataset creation
  command: cat /etc/zfs/zfs-list.cache/{{ item }}
  loop: "{{ zfs_mount_cache_pools }}"
  register: _zfs_verify_new_cache
  changed_when: false
  until: (item ~ '/_verify_mount_cache') in _zfs_verify_new_cache.stdout
  retries: 20
  delay: 1
  become: true

# --- Dry-run health script ---

- name: _verify | Health script runs without error
  when: zfs_root
  command: /usr/local/bin/zfs_health
  changed_when: false
  become: true

# --- tank special vdev (functional) ---
# tank carries an NVMe special-vdev mirror across the per-disk p6 meta partitions
# (provision.sh wires it; notes/unified_disk_layout.md). It is the performance
# contract behind special_small_blocks on tank/brumath + media -- a regression
# that dropped the special vdev would silently push that metadata + small blocks
# back onto the slow raidz2 HDDs. Only hosts declaring `tank` as their tank
# filesystem carry it; a missing declared pool is a fixture or provisioning
# failure, not a reason to skip the contract.
# 'mirror' appears in `zpool status tank` only for the special mirror -- the
# data vdev is raidz2 and the HDD device names carry no such token.
- name: _verify | Tank carries its NVMe special-vdev mirror
  when: zfs_tank_filesystem == 'tank'
  block:
    - name: _verify | Read tank vdev topology
      command: zpool status tank
      register: _zfs_verify_tank_status
      changed_when: false
      become: true

    - name: _verify | Assert tank has a special mirror vdev
      assert:
        that:
          - "'special' in _zfs_verify_tank_status.stdout"
          - "'mirror' in _zfs_verify_tank_status.stdout"
        fail_msg: >-
          tank has no special-vdev mirror -- the p6 meta partitions were not
          wired into the pool. {{ _zfs_verify_tank_status.stdout }}

# --- Health script fault detection (functional) ---
# zfs_health's checks only mean something if they actually fire on a damaged
# pool -- asserting the script merely "ran" proves nothing, and is exactly how
# the `zpool status -e` regression hid: the drive-error check silently never
# executed yet the script still exited 0. Build a throwaway mirror over two
# backing files, corrupt one leg's data region underneath ZFS, scrub to surface
# the checksum errors, and assert the script flags them via the drive-error
# branch. Clear those repaired errors and use the just-completed scrub to assert
# the scrub-age branch, then offline one leg to assert the pool-state branch.
# qemu-only (gated on zfs_root); never prod, and fully torn down at the end of
# the block.
- name: _verify | Health fault detection
  when: zfs_root
  become: true
  block:
    - name: _verify | Health fault | Create backing files for a throwaway pool
      command: truncate -s 64M /var/tmp/zfs_health_test_{{ item }}.img
      loop: [ 0, 1 ]
      changed_when: true

    - name: _verify | Health fault | Create a mirror pool over the files
      command: >-
        zpool create -f zfs_health_test mirror
        /var/tmp/zfs_health_test_0.img /var/tmp/zfs_health_test_1.img
      changed_when: true

    - name: _verify | Health fault | Write incompressible data into the pool
      command: dd if=/dev/urandom of=/zfs_health_test/payload bs=1M count=16 conv=fsync
      changed_when: true

    # Overwrite the data region of one leg (4-60 MiB) with random bytes, leaving
    # the four vdev labels (first/last ~512 KiB) intact so the leg stays ONLINE
    # and the damage surfaces as checksum errors rather than a missing device.
    - name: _verify | Health fault | Corrupt one mirror leg underneath ZFS
      command: >-
        dd if=/dev/urandom of=/var/tmp/zfs_health_test_0.img
        bs=1M seek=4 count=56 conv=notrunc
      changed_when: true

    - name: _verify | Health fault | Flush the corruption to disk
      command: sync
      changed_when: false

    - name: _verify | Health fault | Scrub to surface the checksum errors
      command: timeout -k 10 60 zpool scrub -w zfs_health_test
      changed_when: true

    - name: _verify | Health fault | Run the health script against the damaged pool
      command: /usr/local/bin/zfs_health
      register: _zfs_health_damaged
      changed_when: false
      failed_when: false

    - name: _verify | Health fault | Script flags the drive errors and exits non-zero
      assert:
        that:
          - _zfs_health_damaged.rc != 0
          - "'Detected drive errors (READ/WRITE/CKSUM)' in _zfs_health_damaged.stderr"
        fail_msg: >-
          zfs_health did not flag the corrupted pool via the drive-error check.
          rc={{ _zfs_health_damaged.rc }} stderr={{ _zfs_health_damaged.stderr }}

    - name: _verify | Health fault | Clear repaired checksum errors
      command: zpool clear zfs_health_test
      changed_when: true

    # SCRUB_EXPIRE=0 (the role's env seam) expires any scrub, even one that
    # finished this second. Without the pool-creation suffix, the age came
    # from the scrub's own end time.
    - name: _verify | Health fault | Run the health script with a zero scrub-expiry threshold
      command: /usr/local/bin/zfs_health
      environment:
        SCRUB_EXPIRE: "0"
      register: _zfs_health_scrub_age
      changed_when: false
      failed_when: false

    - name: _verify | Health fault | Script flags the expired scrub from its end time
      assert:
        that:
          - _zfs_health_scrub_age.rc != 0
          - "'ERROR :: Scrub expired on zfs_health_test' in _zfs_health_scrub_age.stderr_lines"
        fail_msg: >-
          zfs_health did not age the completed scrub on zfs_health_test.
          rc={{ _zfs_health_scrub_age.rc }} stderr={{ _zfs_health_scrub_age.stderr }}

    - name: _verify | Health fault | Offline one leg to degrade the pool
      command: zpool offline zfs_health_test /var/tmp/zfs_health_test_0.img
      changed_when: true

    - name: _verify | Health fault | Run the health script against the degraded pool
      command: /usr/local/bin/zfs_health
      register: _zfs_health_degraded
      changed_when: false
      failed_when: false

    - name: _verify | Health fault | Script flags the degraded pool and exits non-zero
      assert:
        that:
          - _zfs_health_degraded.rc != 0
          - "'zpool status -x reports a problem' in _zfs_health_degraded.stderr"
        fail_msg: >-
          zfs_health did not flag the DEGRADED pool via the pool-health check.
          rc={{ _zfs_health_degraded.rc }} stderr={{ _zfs_health_degraded.stderr }}

  always:
    # Teardown runs even if an assertion above fails, so a red test leaves no
    # stray pool/files behind for a re-run on the same (kept) VM.
    - name: _verify | Health fault | Destroy the throwaway pool
      command: zpool destroy zfs_health_test
      changed_when: true
      failed_when: false

    - name: _verify | Health fault | Remove backing files and mountpoint
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /var/tmp/zfs_health_test_0.img
        - /var/tmp/zfs_health_test_1.img
        - /zfs_health_test
