- name: mount_generator | Create /etc/zfs/zfs-list.cache directory
  file:
    dest: /etc/zfs/zfs-list.cache
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true
  tags:
    - zfs
    - zfs_mount_generator

- name: mount_generator | Enable zfs-mount-generator for pool
  file:
    path: /etc/zfs/zfs-list.cache/{{ item }}
    state: touch
    access_time: preserve
    modification_time: preserve
    owner: root
    group: root
    mode: "0644"
  loop: "{{ zfs_mount_cache_pools }}"
  become: true
  tags:
    - zfs
    - zfs_mount_generator

# The zfs-zed package enables the history_event-zfs-list-cacher zedlet, which
# rewrites a pool's cache on every change to a tracked property. Only a fresh
# empty cache needs a first fill: re-setting canmount to its current value is a
# tracked-property event with no effect on the pool.
- name: mount_generator | Fill an empty mount cache
  shell: |
    set -euo pipefail
    cache=/etc/zfs/zfs-list.cache/{{ item }}
    if [ -s "$cache" ]; then
      exit 0
    fi
    zfs set canmount="$(zfs get -H -o value canmount {{ item }})" {{ item }}
    for _ in $(seq 50); do
      if [ -s "$cache" ]; then
        echo filled
        exit 0
      fi
      sleep 0.2
    done
    echo "zed did not fill $cache within 10s" >&2
    exit 1
  args:
    executable: /bin/bash
  register: zfs_mount_cache_fill
  changed_when: zfs_mount_cache_fill.stdout == 'filled'
  loop: "{{ zfs_mount_cache_pools }}"
  become: true
  tags:
    - zfs
    - zfs_mount_generator
