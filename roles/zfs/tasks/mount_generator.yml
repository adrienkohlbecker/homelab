- name: mount_generator | Create /etc/zfs/zfs-list.cache directory
  file:
    dest: /etc/zfs/zfs-list.cache
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true
  tags:
    - zfs
    - zfs_mount_generator

- name: mount_generator | Enable zfs-mount-generator for pool
  file:
    path: /etc/zfs/zfs-list.cache/{{ item }}
    state: touch
    access_time: preserve
    modification_time: preserve
    owner: root
    group: root
    mode: "0644"
  loop: "{{ zfs_mount_cache_pools }}"
  become: true
  tags:
    - zfs
    - zfs_mount_generator

- name: mount_generator | Configure symlink
  when: not (ansible_check_mode and (zfs_apt.changed | default(false)))
  file:
    src: /usr/lib/zfs-linux/zed.d/history_event-zfs-list-cacher.sh
    dest: /etc/zfs/zed.d/history_event-zfs-list-cacher.sh
    state: link
  become: true
  tags:
    - zfs
    - zfs_mount_generator

- name: mount_generator | Copy the mount cache script
  copy:
    src: zfs_update_mount_cache.sh
    dest: /usr/local/bin/zfs_update_mount_cache
    mode: "0755"
    owner: root
    group: root
    backup: true
    validate: bash -n %s
  become: true
  tags:
    - zfs
    - zfs_mount_generator

- name: mount_generator | Generate mount cache
  command: /usr/local/bin/zfs_update_mount_cache {{ item }}
  register: zfs_mount_cache_cmd
  changed_when: "'file updated' in zfs_mount_cache_cmd.stdout"
  loop: "{{ zfs_mount_cache_pools }}"
  become: true
  tags:
    - zfs
    - zfs_mount_generator
