- name: _setup | Clear stale reboot-required state before the settled-version check
  file:
    path: /var/run/reboot-required
    state: absent
  become: true

# Deliberately drift the safe boolean pool property used by the fixtures. The
# production task must detect and restore the declared value; its idempotence
# pass then exercises the already-correct direction.
- name: _setup | Drift the fixture autotrim property
  when:
    - zfs_root
    - item.name == 'autotrim'
    - item.value == 'on'
  command: zpool set autotrim=off {{ item.pool }}
  loop: "{{ zfs_pool_properties }}"
  loop_control:
    label: "{{ item.pool }} autotrim=off"
  changed_when: true
  become: true

# Embed another hostid in the boot images, so the converge must restore
# /etc/hostid and rebuild them. The running kernel keeps ZBM's command-line
# hostid, so the pools stay as they are meanwhile.
- name: _setup | Embed a stale hostid in the boot images
  when: zfs_root
  shell: |
    set -euo pipefail
    zgenhostid -f 0x0badc0de
    {{ initramfs_rebuild_command }}
  args:
    executable: /bin/bash
  changed_when: true
  become: true
