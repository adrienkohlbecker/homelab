- name: status | Create the ZFS tooling directory
  file:
    path: /opt/zfs
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true
  tags:
    - zfs

- name: status | Install the status reader
  copy:
    src: zfs_status.py
    dest: /opt/zfs/zfs_status.py
    owner: root
    group: root
    mode: "0755"
    backup: true
    validate: python3 -m py_compile %s
  become: true
  tags:
    - zfs

# OpenZFS 2.2 has no `zpool status -j`, so only Noble runs the text parser.
# When noble leaves data/ubuntu_releases.yml, delete this task, the script,
# and the legacy launcher branch in zfs_status.py.
- name: status | Install the Noble health parser
  when: ansible_distribution_release == 'noble'
  copy:
    src: zfs_health_legacy.sh
    dest: /opt/zfs/zfs_health_legacy.sh
    owner: root
    group: root
    mode: "0755"
    backup: true
    validate: bash -n %s
  become: true
  tags:
    - zfs
