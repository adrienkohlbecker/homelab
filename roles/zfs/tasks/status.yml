- name: status | Create the ZFS tooling directory
  file:
    path: /opt/zfs
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true
  tags:
    - zfs

- name: status | Install the status reader
  copy:
    src: zfs_status.py
    dest: /opt/zfs/zfs_status.py
    owner: root
    group: root
    mode: "0755"
    backup: true
    validate: python3 -c 'import ast,sys; ast.parse(open(sys.argv[1]).read())' %s
  become: true
  tags:
    - zfs

# Transitional: OpenZFS 2.2 has no `zpool status -j`. When noble leaves
# data/ubuntu_releases.yml, delete this script, _verify_health_legacy.sh, the
# text branch in zfs_status.py and the _verify_scan.sh date and `status -p`
# stubs, and replace this task with `state: absent`.
- name: status | Install the Noble health parser
  copy:
    src: zfs_health_legacy.sh
    dest: /opt/zfs/zfs_health_legacy.sh
    owner: root
    group: root
    mode: "0755"
    backup: true
    validate: bash -n %s
  become: true
  tags:
    - zfs
