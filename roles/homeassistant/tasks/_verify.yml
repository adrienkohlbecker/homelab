# Resolve includes, secrets, and integration schemas through Home Assistant's
# own checker before HTTP probes obscure configuration failures.
#
# This is also the only coverage the `homeassistant:` core config block gets.
# HA overlays it onto .storage/core.config in memory and writes nothing back,
# every endpoint reporting the running config needs an API token, and the log
# timestamps that look like a tell are really the units --tz. check_config does
# run the block through CORE_CONFIG_SCHEMA, so a bad key, a bad coordinate, or
# a vault reference that rendered empty all fail here.
- name: _verify | Homeassistant configuration is valid
  command:
    argv:
      - podman
      - exec
      - homeassistant
      - python3
      - -m
      - homeassistant
      - --script
      - check_config
      - --config
      - /config
  changed_when: false
  become: true

- name: _verify | Install an integration Python dependency as the service user
  command:
    argv:
      - podman
      - exec
      - homeassistant
      - python3
      - -c
      - |
        import asyncio
        import importlib
        import os
        import sys

        from homeassistant.util.package import async_get_user_site, install_package

        assert os.getuid() == {{ static_service_ids.homeassistant }}
        assert "UV_SYSTEM_PYTHON" not in os.environ
        assert os.environ["PYTHONUSERBASE"] == "/config/deps"
        dependency_path = asyncio.run(async_get_user_site("/config/deps"))
        if dependency_path not in sys.path:
            sys.path.insert(0, dependency_path)
        assert install_package("Unidecode>=1.3.6")
        importlib.invalidate_caches()
        from unidecode import unidecode

        assert unidecode("électricité") == "electricite"
  changed_when: false
  become: true

- name: _verify | Restart homeassistant after dependency installation
  systemd:
    name: homeassistant
    state: restarted
  become: true

- name: _verify | Wait for homeassistant to become healthy after restart
  command:
    argv:
      - podman
      - inspect
      - homeassistant
      - --format
      - "{{ '{{.State.Health.Status}}' }}"
  register: _homeassistant_health_after_dependency_restart
  changed_when: false
  retries: 30
  delay: 4
  until: _homeassistant_health_after_dependency_restart.stdout == "healthy"
  become: true

- name: _verify | Import the persisted integration Python dependency
  command:
    argv:
      - podman
      - exec
      - homeassistant
      - python3
      - -c
      - |
        from unidecode import unidecode

        assert unidecode("électricité") == "electricite"
  changed_when: false
  become: true

# Exercise the complete nginx-proxied path.
- name: _verify | Map the homeassistant vhost FQDN to loopback for SNI-correct probing
  import_role:
    name: nginx
    tasks_from: test_loopback_hosts
  vars:
    nginx_test_loopback_hosts_args:
      hostnames:
        - "homeassistant.{{ inventory_hostname }}.{{ domain }}"

- name: _verify | Homeassistant answers /manifest.json via nginx vhost
  uri:
    url: https://homeassistant.{{ inventory_hostname }}.{{ domain }}/manifest.json
    validate_certs: false
    status_code: 200
  register: _homeassistant_http_nginx
  retries: 30
  delay: 2
  until: _homeassistant_http_nginx.status == 200

# Prove the seeded .storage/http actually took effect end-to-end: HA's ban
# logger prints the source it attributes a request to. Without
# use_x_forwarded_for + trusted_proxies covering podman_bridge_pool, every
# nginx-proxied request is attributed to the bridge gateway, so a single
# client's failed logins would rate-limit and IP-ban the whole household. One
# bogus-token request through the vhost is enough; login_attempts_threshold is
# -1 (banning disabled) so the probe cannot lock the host out of itself.
- name: _verify | Homeassistant attributes proxied requests to the real client
  uri:
    url: https://homeassistant.{{ inventory_hostname }}.{{ domain }}/api/
    validate_certs: false
    headers:
      Authorization: Bearer not-a-valid-token
    status_code: 401

- name: _verify | Homeassistant logged the proxied client, not the podman bridge
  command:
    argv:
      - journalctl
      - -u
      - homeassistant
      - -b
      - --no-pager
      - --grep=Login attempt or request with invalid authentication
  register: _homeassistant_forwarded_for
  changed_when: false
  retries: 15
  delay: 2
  until: >-
    '(127.0.0.1)' in _homeassistant_forwarded_for.stdout
  become: true

# Prove HA actually consumed the config entry the role wrote into
# core.config_entries: it only logs a setup result for `email`/smtp once it has
# parsed that entry, recognised the domain, and reached the SMTP client. A
# malformed entry never gets this far -- HA drops it while loading the registry
# and says nothing about `email` at all.
#
# The result here is always a failure, and that is the point: the fixture points
# the entry at the real relay with the placeholder credentials from
# group_vars/test.yml, so authentication cannot succeed. Giving the test
# environment working credentials would silence this line and invalidate the
# check; assert on a successful send instead if that ever changes.
- name: _verify | Homeassistant loaded the smtp config entry written by ansible
  command:
    argv:
      - journalctl
      - -u
      - homeassistant
      - -b
      - --no-pager
      - --grep=entry email for smtp
  register: _homeassistant_smtp_entry
  changed_when: false
  retries: 30
  delay: 4
  until: _homeassistant_smtp_entry.stdout | length > 0
  become: true

- name: _verify | Homeassistant reaches influxdb over the homeassistant podman network
  command:
    argv:
      - podman
      - exec
      - homeassistant
      - curl
      - --location
      - --fail
      - --silent
      - --show-error
      - --connect-timeout
      - "1"
      - --max-time
      - "5"
      - -o
      - /dev/null
      - http://influxdb.dns.podman:8086/health
  changed_when: false
  become: true

- name: _verify | Homeassistant reaches mosquitto over the homeassistant podman network
  command:
    argv:
      - podman
      - exec
      - homeassistant
      - python3
      - -c
      - >-
        import socket;
        socket.create_connection(("mosquitto.dns.podman", 1883), timeout=2).close()
  changed_when: false
  become: true

# Asserting only which iface wins `route get` is not enough: with the macvlan
# and the bridge both holding a default at the same metric, the winner is
# decided by FIB insertion order, so the check can pass on a fixture while prod
# egresses out the IoT VLAN (where the inter-VLAN policy drops home-VLAN
# traffic). Assert the stronger invariant instead -- the bridge default must
# *strictly* outrank every other default. That holds whether the macvlan
# default is down-ranked or absent entirely, and fails on a tie.
#
# Parsing /proc/net/route rather than `ip` keeps this independent of which
# iproute2 flavour the image ships (busybox `ip` has no --json).
- name: _verify | Homeassistant bridge default strictly outranks the macvlan default
  command:
    argv:
      - podman
      - exec
      - homeassistant
      - python3
      - -c
      - |
        import sys

        bridge = sys.argv[1]
        defaults = []
        with open("/proc/net/route") as fh:
            next(fh)
            for line in fh:
                cols = line.split()
                # destination and genmask both 0.0.0.0 == default route
                if cols[1] == "00000000" and cols[7] == "00000000":
                    defaults.append((int(cols[6]), cols[0]))

        if not defaults:
            sys.exit("no default route in the container")

        defaults.sort()
        best = [d for d in defaults if d[0] == defaults[0][0]]
        if len(best) > 1:
            sys.exit(f"defaults tie at metric {defaults[0][0]}, winner is insertion-order luck: {defaults}")
        if best[0][1] != bridge:
            sys.exit(f"lowest-metric default is on {best[0][1]}, expected {bridge}: {defaults}")
        print(f"ok: {defaults}")
      - "{{ homeassistant_networks | selectattr('name', 'equalto', 'homeassistant') | map(attribute='interface_name') | first }}"
  changed_when: false
  become: true

- name: _verify | Homeassistant mac_iot adapter has its declared identity
  command:
    argv:
      - podman
      - exec
      - homeassistant
      - cat
      - >-
        /sys/class/net/{{
          homeassistant_networks
          | selectattr('name', 'equalto', 'mac_iot')
          | map(attribute='interface_name')
          | first
        }}/address
  register: _homeassistant_mac_iot_address
  changed_when: false
  failed_when: >-
    _homeassistant_mac_iot_address.stdout | trim != (
      homeassistant_networks
      | selectattr('name', 'equalto', 'mac_iot')
      | map(attribute='mac')
      | first
    )
  become: true

# Functional HACS check: grep HA's journal for the loader's "We found
# a custom integration hacs" warning. That line fires when HA actually
# discovers HACS at startup, proving: HACS files visible inside the
# container, manifest.json parsed, integration registered with HA's
# loader. Stronger than stat'ing the bind-mount the role just wrote.
# --grep bounds journalctl's output so a long-running prod host
# doesn't dump megabytes into stdout.
- name: _verify | HA loader discovered HACS at startup
  command:
    argv:
      - journalctl
      - -u
      - homeassistant
      - -b
      - --no-pager
      - --grep=custom integration hacs
  register: _homeassistant_hacs_loaded
  changed_when: false
  retries: 30
  delay: 4
  until: _homeassistant_hacs_loaded.stdout | length > 0
  become: true

- name: _verify | Exercise homeassistant fluent-bit record contracts
  import_role:
    name: fluentbit
    tasks_from: verify_extension
  vars:
    fluentbit_verify_args:
      name: homeassistant
      records:
        - MESSAGE: |-
            2099-01-02 03:04:05.678 CRITICAL (MainThread) [homeassistant.verify] homeassistant-valid
            Traceback (most recent call last):
              File verify.py, line 9, in run
            Exception: homeassistant-valid
          CONTAINER_TAG: homeassistant
          SYSLOG_IDENTIFIER: conmon
          SYSTEMD_UNIT: homeassistant.service
          parser_status: forged
        - MESSAGE: homeassistant-raw
          CONTAINER_TAG: homeassistant
          SYSLOG_IDENTIFIER: conmon
          SYSTEMD_UNIT: homeassistant.service
      expected:
        - message: |-
            homeassistant-valid
            Traceback (most recent call last):
              File verify.py, line 9, in run
            Exception: homeassistant-valid
          level: fatal
          service: homeassistant
          fields.thread: MainThread
          fields.source: homeassistant.verify
        - message: homeassistant-raw
          service: homeassistant
- name: _verify | Exercise alternate service storage layouts
  include_tasks: "{{ ansible_config_file | dirname }}/test/playbooks/tasks/_verify_service_storage.yml"
  vars:
    _storage_service: homeassistant
    _storage_template: "{{ role_path }}/templates/homeassistant.service.j2"
    _storage_mounts: [ services ]
