- name: _verify | Homeassistant unit is loaded and active
  systemd:
    name: homeassistant
  register: _homeassistant_unit
  failed_when: >-
    _homeassistant_unit.status.LoadState != "loaded"
    or _homeassistant_unit.status.ActiveState != "active"
  become: true

# Resolve includes, secrets, and integration schemas through Home Assistant's
# own checker before HTTP probes obscure configuration failures.
- name: _verify | Homeassistant configuration is valid
  command:
    argv:
      - podman
      - exec
      - homeassistant
      - python3
      - -m
      - homeassistant
      - --script
      - check_config
      - --config
      - /config
  changed_when: false
  become: true

# Functional probe of HA itself. /manifest.json is the same endpoint
# the unit's --health-cmd polls, so a 200 here proves the container
# is serving on the published port -- not just that systemd called it
# active. Retry budget matches the unit's 100s start-period plus slack.
- name: _verify | Homeassistant answers /manifest.json on loopback
  uri:
    url: http://localhost:{{ service_ports.homeassistant }}/manifest.json
    status_code: 200
  register: _homeassistant_http
  retries: 60
  delay: 2
  until: _homeassistant_http.status == 200

# Exercise the nginx-proxied path too. A regression in the nginx_site
# wiring (typo'd subdomain, broken proxy_pass, CSP rewriting the
# response away) would pass the loopback probe above silently.
#
# Map the vhost FQDN to loopback so SNI matches the served certificate.
# Probing https://localhost with a Host: header leaves SNI=localhost, which
# OpenSSL 3.x (noble/resolute) rejects as a fatal unrecognized_name alert
# (status -1); hitting the FQDN directly keeps SNI correct on every release.
- name: _verify | Map the homeassistant vhost FQDN to loopback for SNI-correct probing
  lineinfile:
    path: /etc/hosts
    line: "127.0.0.1 homeassistant.{{ inventory_hostname }}.{{ domain }}"
    state: present
  become: true

- name: _verify | Homeassistant answers /manifest.json via nginx vhost
  uri:
    url: https://homeassistant.{{ inventory_hostname }}.{{ domain }}/manifest.json
    validate_certs: false
    status_code: 200
  register: _homeassistant_http_nginx
  retries: 30
  delay: 2
  until: _homeassistant_http_nginx.status == 200

- name: _verify | Homeassistant reaches influxdb over the homeassistant podman network
  command:
    argv:
      - podman
      - exec
      - homeassistant
      - curl
      - --location
      - --fail
      - --silent
      - --show-error
      - --connect-timeout
      - "1"
      - --max-time
      - "5"
      - -o
      - /dev/null
      - http://influxdb.dns.podman:8086/health
  changed_when: false
  become: true

- name: _verify | Homeassistant reaches mosquitto over the homeassistant podman network
  command:
    argv:
      - podman
      - exec
      - homeassistant
      - python3
      - -c
      - >-
        import socket;
        socket.create_connection(("mosquitto.dns.podman", 1883), timeout=2).close()
  changed_when: false
  become: true

# Exercise the multi-default branch deterministically by making mac_iot the
# preferred route, running the real script, then asserting the bridge wins.
- name: _verify | Pin_default_route down-ranks a preferred mac_iot default so the bridge wins
  shell: |
    set -euo pipefail
    {% raw %}
    pid="$(podman inspect -f "{{.State.Pid}}" homeassistant)"
    mac_gw="$(podman inspect homeassistant --format "{{.NetworkSettings.Networks.mac_iot.Gateway}}")"
    br_gw="$(podman inspect homeassistant --format "{{.NetworkSettings.Networks.homeassistant.Gateway}}")"
    nsenter -t "$pid" -n ip route flush default
    nsenter -t "$pid" -n ip route add default via "$br_gw" metric 100
    nsenter -t "$pid" -n ip route add default via "$mac_gw" metric 50
    pre="$(nsenter -t "$pid" -n ip -4 route get 1.1.1.1)"
    echo "before script (mac_iot preferred): $pre"
    case "$pre" in
      *"via $mac_gw"*) ;;
      *) echo "SETUP FAIL: mac_iot should win egress before the script, got: $pre" >&2; exit 1 ;;
    esac
    /opt/homeassistant/pin_default_route.sh
    post="$(nsenter -t "$pid" -n ip -4 route get 1.1.1.1)"
    echo "after script (bridge should win): $post"
    case "$post" in
      *"via $br_gw"*) ;;
      *) echo "FAIL: expected bridge gw $br_gw to win egress after down-rank, got: $post" >&2; exit 1 ;;
    esac
    {% endraw %}
  args:
    executable: /bin/bash
  changed_when: false
  become: true

# Functional HACS check: grep HA's journal for the loader's "We found
# a custom integration hacs" warning. That line fires when HA actually
# discovers HACS at startup, proving: HACS files visible inside the
# container, manifest.json parsed, integration registered with HA's
# loader. Stronger than stat'ing the bind-mount the role just wrote.
# --grep bounds journalctl's output so a long-running prod host
# doesn't dump megabytes into stdout.
- name: _verify | HA loader discovered HACS at startup
  command:
    argv:
      - journalctl
      - -u
      - homeassistant
      - -b
      - --no-pager
      - --grep=custom integration hacs
  register: _homeassistant_hacs_loaded
  changed_when: false
  retries: 30
  delay: 4
  until: _homeassistant_hacs_loaded.stdout | length > 0
  become: true

- name: _verify | Exercise homeassistant fluent-bit record contracts
  import_role:
    name: fluentbit
    tasks_from: verify_extension
  vars:
    fluentbit_verify_args:
      name: homeassistant
      records:
        - MESSAGE: |-
            2099-01-02 03:04:05.678 CRITICAL (MainThread) [homeassistant.verify] homeassistant-valid
            Traceback (most recent call last):
              File verify.py, line 9, in run
            Exception: homeassistant-valid
          CONTAINER_TAG: homeassistant
          SYSLOG_IDENTIFIER: conmon
          SYSTEMD_UNIT: homeassistant.service
          parser_status: forged
        - MESSAGE: homeassistant-raw
          CONTAINER_TAG: homeassistant
          SYSLOG_IDENTIFIER: conmon
          SYSTEMD_UNIT: homeassistant.service
      expected:
        - message: |-
            homeassistant-valid
            Traceback (most recent call last):
              File verify.py, line 9, in run
            Exception: homeassistant-valid
          level: fatal
          service: homeassistant
          fields.parser_status: parsed
          fields.thread: MainThread
          fields.source: homeassistant.verify
        - message: homeassistant-raw
          service: homeassistant
          _absent:
            - fields.parser_status
