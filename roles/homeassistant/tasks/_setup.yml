- name: _setup | Install podman
  import_role:
    name: podman
    tasks_from: install

- name: _setup | Install nginx
  import_role:
    name: nginx
    tasks_from: test_fixture

- name: _setup | Install fluent-bit
  import_role:
    name: fluentbit
    tasks_from: configure

# Provision the mac_iot iface + podman network from the integration inventory's
# macvlan_blocks. In site.yml the macvlan role runs early in the
# play order so homeassistant's `--network=mac_iot` finds it
# already created; under testrole.py only the role-under-test runs,
# so we replay the dep here.
- name: _setup | Install macvlan
  import_role:
    name: macvlan
    tasks_from: main

# Run the real influxdb role so the bootstrap exercises the same image
# tag + the same `home` org / default bucket the prod host runs against
# -- not a hand-rolled `podman run influxdb` that drifts vs prod.
- name: _setup | Install influxdb
  import_role:
    name: influxdb
    tasks_from: main

# Provision a real mosquitto broker so _verify exercises HA's MQTT
# integration path end-to-end instead of joining a nameplate-only
# `homeassistant` network that no broker is listening on. Test fixture
# `group_vars/test.yml` already defines `mosquitto_accounts`.
- name: _setup | Install mosquitto
  import_role:
    name: mosquitto

# Stand-in for the SMTP relay, which group_vars/test.yml points HA's smtp config
# entry at, so the fixture never logs in to the real one. It runs the HA image,
# which ships aiosmtpd, on the network the mosquitto role just created, and
# accepts only the fixture credentials: a login it accepts proves HA built its
# client from the entry the role wrote.
- name: _setup | Start the stub SMTP relay
  containers.podman.podman_container:
    name: smtpstub
    image: "{{ homeassistant_image }}"
    network: homeassistant
    entrypoint: python3
    command:
      - -c
      - |
        import sys
        import threading

        from aiosmtpd.controller import Controller
        from aiosmtpd.handlers import Sink
        from aiosmtpd.smtp import AuthResult

        user, password, port = sys.argv[1], sys.argv[2], int(sys.argv[3])


        def authenticate(server, session, envelope, mechanism, auth_data):
            login = auth_data.login.decode()
            accepted = (login, auth_data.password.decode()) == (user, password)
            print(f"login {'accepted' if accepted else 'rejected'} for {login}", flush=True)
            return AuthResult(success=accepted, handled=False)


        Controller(
            Sink(),
            hostname="0.0.0.0",
            port=port,
            authenticator=authenticate,
            auth_require_tls=False,
        ).start()
        threading.Event().wait()
      - "{{ homeassistant_smtp_user }}"
      - "{{ homeassistant_smtp_password }}"
      - "{{ homeassistant_smtp_port }}"
    state: started
  become: true
