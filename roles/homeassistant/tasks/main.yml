# Precondition: the host must have a `mac_iot` macvlan_block in
# host_vars with `podman_network: true` (lab has both). The macvlan
# role provisions the iface + the podman network named `mac_iot` on
# the IoT VLAN; HA attaches via --network=mac_iot (see
# homeassistant_networks in vars/main.yml).
#
# The podman network gives HA an L2 presence on the IoT VLAN
# (netplan-named `iot`, vlan id 4 on nic0) so it can do mDNS/SSDP
# discovery of Sonos / HomeKit / Zigbee-bridge targets and talk
# directly to IoT devices on the /24 (Philips airpurifier CoAP,
# etc.). ip_range is the upper /29 of lab's IoT block (.136/29 — 8
# container slots, lower /29 = mac_iot iface + libvirt VMs); HA gets
# whatever netavark allocates first.

# Shared backend network for HA, mosquitto, z2m, and influxdb. Keeping HA's
# backend dependencies in one aardvark-dns view avoids multi-network resolver
# ordering: one network DNS server knows every backend name HA needs.
#
# metric 50 (below netavark's default 100) makes this bridge's default route
# strictly outrank the one mac_iot installs, so HA egresses over the bridge
# from the instant its netns exists. Without it both defaults sit at 100 and
# the winner is FIB insertion order -- when the macvlan wins, HA leaves on the
# IoT VLAN and the inter-VLAN policy drops everything bound for the home VLAN.
# netavark 1.4.0 (noble) rejects `metric` on a macvlan and ignores
# `no_default_route`, so down-ranking the bridge is the one lever it honours.
# Inert for the single-homed members; only HA holds two defaults.
- name: Create homeassistant podman network
  when: not ansible_check_mode
  containers.podman.podman_network:
    name: homeassistant
    disable_dns: false
    opt:
      metric: "50"
    state: present
  become: true
  tags:
    - homeassistant

- name: Set up homeassistant system user, group, and config dir
  import_role:
    name: service_user
    tasks_from: user
  vars:
    service_user_args:
      name: homeassistant
  tags:
    - homeassistant

- name: Create homeassistant state directories
  when: not ansible_check_mode or homeassistant_user.uid is defined
  file:
    dest: "{{ item }}"
    state: directory
    owner: homeassistant
    group: homeassistant
    mode: "0755"
  become: true
  loop:
    - /mnt/services/sqlite/homeassistant
    - /mnt/services/homeassistant/dashboards
    - /mnt/services/homeassistant/custom_components/hacs
    - /mnt/services/homeassistant/.storage
  tags:
    - homeassistant

# Restrict HA's zeroconf/mDNS announcements to the mac_iot adapter.
# Without this, HA advertises *all* its adapters -- including the
# internal backend-bridge IP -- to every adapter it can reach. LAN clients
# pick up the bridge IP from mDNS, try to connect to it from outside, and the
# packets land on lab's eth0 destined to a podman-only IP, triggering kernel
# "martian source" logs (~120k/day on lab). The interface name baked into
# core.network.j2 comes from the same homeassistant_networks entry that sets
# Podman's interface_name option.
#
# force: false so an operator's UI edit (Settings -> System -> Network)
# stays authoritative. First apply lands our default; subsequent UI
# changes win. Deleting the file on disk reverts HA to "use all
# adapters" (the unconfigured default), so a recovery path exists.
- name: Restrict homeassistant network adapters
  template:
    src: core.network.j2
    dest: /mnt/services/homeassistant/.storage/core.network
    owner: homeassistant
    group: homeassistant
    mode: "0600"
    force: false
    backup: true
  register: homeassistant_network_storage
  become: true
  tags:
    - homeassistant

# HA 2026.9 migrated the `http:` integration out of configuration.yaml into a
# GUI-owned store; YAML is ignored once the migration flag is set. Seeding the
# store keeps the reverse-proxy contract (use_x_forwarded_for + trusted_proxies
# derived from podman_bridge_pool) declared in this repo rather than only in
# HA's UI, so a from-scratch HA comes up trusting nginx instead of logging,
# rate-limiting, and IP-banning every client as the one podman bridge gateway.
#
# force: false for the same reason as core.network above -- first converge
# lands our default, later UI edits win. Deleting the file reverts HA to its
# built-in defaults (and re-imports YAML `http:` if any exists), so there is a
# recovery path.
- name: Seed homeassistant http configuration store
  template:
    src: http.j2
    dest: /mnt/services/homeassistant/.storage/http
    owner: homeassistant
    group: homeassistant
    mode: "0600"
    force: false
    backup: true
    validate: python3 -c 'import json,sys; json.load(open(sys.argv[1]))' "%s"
  register: homeassistant_http_storage
  become: true
  tags:
    - homeassistant

# The influxdb integration is configured through HA's UI (not via
# configuration.yaml); the helper below lands the org / user / bucket /
# write-auth. It does NOT surface the token (influxd 2.8+ redacts it from
# `auth list`, returning it only at `auth create`). On the converge that
# first mints the auth, bucket.yml's `auth create --json` prints the token
# to the interactive converge output -- the operator copies it from there
# into the one-time HA UI integration setup, and vaults it for their own
# records if desired. To recover a lost token, delete the auth and re-run.
- name: Bootstrap influxdb tenant for homeassistant
  import_role:
    name: influxdb
    tasks_from: bucket
  vars:
    influxdb_bucket_args:
      user: homeassistant
      bucket: homeassistant
  tags:
    - homeassistant

# The house location renders into configuration.yaml's `homeassistant:` block.
# Vaulted, so a missing vault-id would otherwise render an empty latitude and
# put HA on the null island rather than failing.
- name: Assert homeassistant location inputs are set
  assert:
    that:
      - homeassistant_latitude | default('') | string is match('^-?[0-9.]+$')
      - homeassistant_longitude | default('') | string is match('^-?[0-9.]+$')
      - homeassistant_elevation | default('') | string is match('^-?[0-9]+$')
    fail_msg: >-
      homeassistant_latitude/longitude/elevation must be set (group_vars) --
      they render HA core location config in configuration.yaml.
  tags:
    - homeassistant

# HA-flavoured YAML uses custom tags (!include, !include_dir_merge_named,
# !secret, ...). yaml.safe_load chokes on those, so register a stub
# constructor that returns None for any !-prefixed tag before parsing.
#
# Scope of this check: well-formedness only -- catches jinja quoting
# bugs, vault-substitution typos that break YAML structure, indentation
# regressions. It does NOT check HA-tag semantics: a typo'd
# `!include automatons.yaml` (target missing) or `!secret no_such_key`
# (key missing) both parse fine here -- the stub returns None and YAML
# is structurally valid. HA's own schema + integration loaders catch
# those at startup, where they're loud but post-deploy.
- name: Configure homeassistant
  template:
    src: configuration.yaml.j2
    dest: /mnt/services/homeassistant/configuration.yaml
    owner: homeassistant
    group: homeassistant
    mode: "0600"
    backup: true
    validate: python3 -c 'import yaml,sys; yaml.add_multi_constructor("!",lambda l,s,n:None,Loader=yaml.SafeLoader); yaml.safe_load(open(sys.argv[1]))' "%s"
  register: homeassistant_conf
  become: true
  tags:
    - homeassistant

# sensors.yaml / templates.yaml / custom_templates/macros.jinja and the
# blueprint sources live in the ha_gui_config clone, deployed by
# `mise run ha:sync push` (see CLAUDE.md > Home Assistant GUI YAML sync).
# This task only touches the include-targets HA reads at startup; their
# absence would log "file not found" before the operator runs the first sync.
# HA owns these files thereafter and rewrites them at 0644 whenever they are
# edited in the GUI, so match that mode -- forcing 0600 only re-chmods (and
# re-touches) them every converge, fighting HA. The dir already gates access
# and these carry no secrets (integration credentials live in HA's own
# config-entry store -- see notes/runbooks/homeassistant_gui_config.md).
- name: Ensure files exist
  file:
    path: /mnt/services/homeassistant/{{ item }}
    owner: homeassistant
    group: homeassistant
    mode: "0644"
    state: touch
    modification_time: preserve
    access_time: preserve
  become: true
  with_items:
    - automations.yaml
    - scripts.yaml
    - scenes.yaml
    - sensors.yaml
    - templates.yaml
    - input_numbers.yaml
    - input_selects.yaml
    - climate.yaml
    - counters.yaml
    - timers.yaml
  tags:
    - homeassistant

# YAML-mode Lovelace dashboards (registered under `lovelace:` in
# configuration.yaml) are deployed by `mise run ha:sync push`. A missing
# dashboard file logs a per-dashboard error until the first sync, and the
# "Ensure files exist" touch above leaves an empty file that fails Lovelace
# validation -- so seed a minimal *valid* placeholder instead. force: false so
# ha:sync's deployed copy is authoritative and converge never re-clobbers it.
- name: Seed dashboard placeholder
  copy:
    dest: /mnt/services/homeassistant/dashboards/climate.yaml
    content: |
      title: Climate
      views:
        - title: Climate
    owner: homeassistant
    group: homeassistant
    mode: "0644"
    force: false
    backup: true
    validate: python3 -c 'import yaml,sys; yaml.safe_load(open(sys.argv[1]))' "%s"
  become: true
  tags:
    - homeassistant

# unarchive's zip codepath shells out to /usr/bin/unzip; ubuntu cloud
# images don't ship it by default.
- name: Install unzip
  apt:
    pkg: unzip
    cache_valid_time: 3600
  become: true
  tags:
    - homeassistant

# Bootstrap HACS. Anything else HACS-installable is intentionally managed
# via the HACS UI inside HA -- adding it twice double-loads its frontend
# resources. Examples currently managed via HACS: thermal_comfort,
# thermal_comfort_icons. The version, URL, and sha256 stay together so a
# bump touches one place; the `creates:` sentinel + checksum-pinned
# download give content-pinning without an on-disk version file.
- name: Create HACS download cache dir
  file:
    path: /var/cache/homeassistant
    state: directory
    owner: root
    group: root
    mode: "0700"
  register: homeassistant_hacs_dir
  become: true
  tags:
    - homeassistant

- name: Download HACS archive
  # In check mode the cache dir creation above is would-only, so
  # get_url's destination dir doesn't exist and it errors with
  # "Destination /var/cache/homeassistant does not exist".
  when: not (ansible_check_mode and homeassistant_hacs_dir.changed)
  get_url:
    url: "{{ homeassistant_hacs_archive.url }}"
    checksum: "sha256:{{ homeassistant_hacs_archive.sha256 }}"
    dest: /var/cache/homeassistant/hacs.zip
    mode: "0644"
    owner: root
    group: root
  register: homeassistant_hacs_download
  become: true
  tags:
    - homeassistant

- name: Unpack HACS
  when:
    - not ansible_check_mode or homeassistant_user.uid is defined
    - >-
      not (ansible_check_mode and
           (homeassistant_hacs_dir.changed
            or homeassistant_hacs_download.changed | default(false)))
  unarchive:
    src: /var/cache/homeassistant/hacs.zip
    remote_src: true
    dest: /mnt/services/homeassistant/custom_components/hacs
    creates: /mnt/services/homeassistant/custom_components/hacs/manifest.json
    owner: homeassistant
    group: homeassistant
  register: homeassistant_hacs_unpack
  become: true
  tags:
    - homeassistant

- name: Pull homeassistant image
  import_role:
    name: podman
    tasks_from: image
  vars:
    podman_image_args:
      name: homeassistant
      image: "{{ homeassistant_image }}"
  tags:
    - homeassistant

- name: Install homeassistant fluent-bit extension
  import_role:
    name: fluentbit
    tasks_from: extension
  vars:
    fluentbit_extension_args:
      name: homeassistant
  tags:
    - homeassistant

# HA 2026.9 replaced the SMTP notify YAML platform with a config entry, and
# ships no offline API for one -- so the role reconciles the entry inside
# .storage/core.config_entries itself, keeping the relay, the sender identity,
# and the vaulted password declared here rather than only in HA's UI.
#
# Ordering is the subtle part. HA holds that registry in memory and flushes it
# on shutdown, so a write to a *running* instance is undone by the very restart
# meant to pick it up. The service therefore has to be stopped before the write,
# and the very next task starts it again (it sees an inactive unit and issues
# `started`). That adjacency is deliberate: it keeps the window where HA is
# down to the write itself, so a converge that aborts mid-role is unlikely to
# leave the household without Home Assistant. The check pass runs first so a
# converge with nothing to reconcile never stops the service at all -- which is
# every converge, since the entry only changes when these inputs do.
- name: Assert SMTP notify inputs are set
  assert:
    that:
      - homeassistant_smtp_from | default('') | length > 0
      - homeassistant_smtp_user | default('') | length > 0
      - homeassistant_smtp_password | default('') | length > 0
    fail_msg: >-
      homeassistant_smtp_from/user/password must be set (host_vars/group_vars) --
      they configure HA notify.email SMTP config entry.
  tags:
    - homeassistant

# check_mode: false because the pass is read-only and the tasks below need its
# verdict; without it a --check run reports no SMTP work regardless of drift.
- name: Check the homeassistant smtp config entry
  script: smtp_config_entry.py --check {{ homeassistant_smtp_entry_args }}
  environment:
    HOMEASSISTANT_SMTP_PASSWORD: "{{ homeassistant_smtp_password }}"
  register: homeassistant_smtp_check
  changed_when: false
  check_mode: false
  become: true
  tags:
    - homeassistant

- name: Stat the homeassistant unit before stopping it
  stat:
    path: /etc/systemd/system/homeassistant.service
  register: homeassistant_unit_file
  tags:
    - homeassistant

- name: Stop homeassistant to reconcile its config entry registry
  when:
    - (homeassistant_smtp_check.stdout | from_json).changed
    - homeassistant_unit_file.stat.exists
  systemd:
    name: homeassistant
    state: stopped
  become: true
  tags:
    - homeassistant

- name: Configure the homeassistant smtp config entry
  when: (homeassistant_smtp_check.stdout | from_json).changed
  script: smtp_config_entry.py {{ homeassistant_smtp_entry_args }}
  environment:
    HOMEASSISTANT_SMTP_PASSWORD: "{{ homeassistant_smtp_password }}"
  become: true
  tags:
    - homeassistant

- name: Manage homeassistant service
  import_role:
    name: systemd_unit
    tasks_from: unit
  vars:
    systemd_unit_args:
      src: homeassistant.service.j2
      condition: "{{ not ansible_check_mode or homeassistant_user.uid is defined }}"
      restart: "{{ homeassistant_conf.changed or homeassistant_hacs_unpack.changed or homeassistant_network_storage.changed or homeassistant_http_storage.changed }}"
  tags:
    - homeassistant

- name: Configure nginx
  import_role:
    name: nginx
    tasks_from: site
  vars:
    nginx_site_args:
      subdomain: homeassistant
      proxy_pass: http://127.0.0.1:{{ service_ports.homeassistant }}/
      csp_additional: "connect-src tile.openstreetmap.org a.tile.openstreetmap.org b.tile.openstreetmap.org c.tile.openstreetmap.org {{ nginx_csp_default }}; img-src *.cartocdn.com *.home-assistant.io {{ nginx_csp_default }}"
      location_conf: |
        add_header Access-Control-Allow-Origin "https://brands.home-assistant.io";
  tags:
    - homeassistant
