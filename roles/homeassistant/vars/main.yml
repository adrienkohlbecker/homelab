# Podman networks the HA container joins. Both the unit and core.network
# templates read the explicit interface names from this list; netavark does not
# guarantee that interface numbering follows --network flag order.
homeassistant_networks:
  # homeassistant bridge: shared backend for HA, mosquitto, z2m, and influxdb.
  # HA needs one aardvark-dns view containing both mosquitto.dns.podman and
  # influxdb.dns.podman; multiple backend bridges make resolver ordering decide
  # which names work. Discovery/zeroconf is intentionally NOT enabled on this
  # adapter (see core.network.j2 + main.yml).
  - name: homeassistant
    interface_name: eth0
  # mac_iot: HA's L2 presence on the IoT VLAN. Netavark allocates its address
  # from the role-derived /29; discovery uses mDNS/UPnP identity and nothing
  # downstream keys on a specific IP.
  #
  # mac IS pinned: without it podman mints a fresh random MAC every
  # container recreate (unit restart / image bump), UniFi sees that as
  # a new IoT-VLAN client each time, and lab's UniFi client list grows
  # a stale entry per HA recreate. Same prefix + seed shape as the
  # host-iface MACs in roles/macvlan so all L2 identities under this
  # repo are derived from one rule.
  - name: mac_iot
    interface_name: eth1
    mac: "{{ '82:48:10' | random_mac(seed=inventory_hostname ~ '_homeassistant') }}"
