parsers:
  - name: homeassistant_text
    format: regex
    regex: '/^(?<ha_timestamp>[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{3}) (?<ha_level>DEBUG|INFO|WARNING|ERROR|CRITICAL) \((?<ha_thread>[^)]*)\) \[(?<ha_source>[^]]+)\] (?<ha_message>.*)$/m'

multiline_parsers:
  - name: multiline_homeassistant
    type: regex
    flush_timeout: 1000
    rules:
      - state: start_state
        regex: '/^[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9:.]+ (DEBUG|INFO|WARNING|ERROR|CRITICAL) /'
        next_state: continuation
      - state: continuation
        regex: '/^($|Traceback \(most recent call last\):|The above exception was|During handling of the above exception|[[:space:]]|(?:[A-Za-z_][A-Za-z0-9_.]*)?(Error|Exception|ExceptionGroup|Warning)(:|$))/'
        next_state: continuation

pipeline:
  filters:
    - name: modify
      match: svc.homeassistant.service
      rename: MESSAGE log
    - name: multiline
      match: svc.homeassistant.service
      multiline.parser: multiline_homeassistant,python,go,java,ruby
      multiline.key_content: log
      buffer: true
      flush_ms: 1000
      emitter_name: multiline_homeassistant_emitter
      emitter_storage.type: filesystem
    - name: parser
      match: svc.homeassistant.service
      key_name: log
      parser: homeassistant_text
      reserve_data: true
      preserve_key: true
    - name: modify
      match: svc.homeassistant.service
      condition:
        - key_exists CONTAINER_TAG
        - key_exists ha_message
        - key_exists ha_level
      hard_rename:
        - ha_message log
        - ha_level _level
        - ha_thread thread
        - ha_source source
      remove: ha_timestamp
      set: parser_status parsed
