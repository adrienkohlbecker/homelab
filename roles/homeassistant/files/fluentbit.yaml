parsers:
  - name: homeassistant_text
    format: regex
    regex: '/^[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{3} (?<_level>DEBUG|INFO|WARNING|ERROR|CRITICAL) \((?<thread>[^)]*)\) \[(?<source>[^]]+)\] (?<log>.*)$/m'

pipeline:
  filters:
    - name: parser
      match: svc.homeassistant.service
      key_name: MESSAGE
      parser: homeassistant_text
      reserve_data: true
