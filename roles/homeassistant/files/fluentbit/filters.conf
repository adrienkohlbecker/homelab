# Join continuation lines before extracting the header. The fleet-wide
# multiline filter excludes this tag so exactly one emitter processes it; using
# two multiline filters on one tag can loop emitted records through each other.
[FILTER]
    Name                   multiline
    Match                  svc.homeassistant.service
    multiline.parser       multiline_homeassistant,python,go,java,ruby
    multiline.key_content  log
    buffer                 on
    flush_ms               1000
    emitter_name           multiline_homeassistant_emitter
    emitter_storage.type   filesystem

# Parse only Home Assistant's unit stream. The Lua filter uses CONTAINER_TAG to
# leave podman command and systemd lifecycle records from the same unit alone.
[FILTER]
    Name          parser
    Match         svc.homeassistant.service
    Key_Name      log
    Parser        homeassistant_text
    Reserve_Data  On
    Preserve_Key  On

[FILTER]
    Name    lua
    Match   svc.homeassistant.service
    script  /etc/fluent-bit/homeassistant_normalize.lua
    call    normalize_homeassistant
