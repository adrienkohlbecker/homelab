# Home Assistant's logger emits a stable plain-text header. Keep journald's
# arrival timestamp as the event time: ha_timestamp is local wall time without
# an offset, so promoting it would make Fluent Bit interpret it as UTC.
[PARSER]
    Name    homeassistant_text
    Format  regex
    Regex   /^(?<ha_timestamp>[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{3}) (?<ha_level>DEBUG|INFO|WARNING|ERROR|CRITICAL) \((?<ha_thread>[^)]*)\) \[(?<ha_source>[^]]+)\] (?<ha_message>.*)$/m

# Start at every canonical Home Assistant header and attach subsequent records
# until another header arrives or the buffer flushes. This joins Python warning
# source lines and exception traces to the event that supplied their metadata.
[MULTILINE_PARSER]
    Name          multiline_homeassistant
    Type          regex
    Flush_Timeout 1000
    Rule          "start_state" "/^[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9:.]+ (DEBUG|INFO|WARNING|ERROR|CRITICAL) /" "continuation"
    Rule          "continuation" "/^(Traceback \(most recent call last\):|The above exception was|During handling of the above exception|[[:space:]]|[A-Za-z_][A-Za-z0-9_.]*(Error|Exception|ExceptionGroup|Warning)(:|$))/" "continuation"
