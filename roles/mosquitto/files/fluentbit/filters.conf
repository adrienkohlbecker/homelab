# Mosquitto logs an informational persistence-save line every five minutes.
# Keep it in the raw journal for persistence debugging, but omit it from the
# lnav aggregate where it accounted for more than 97% of retained broker output
# on lab. Logical_Op=and scopes the drop to container records from this unit.
[FILTER]
    Name        grep
    Match       svc.mosquitto.service
    Logical_Op  and
    Exclude     CONTAINER_TAG  ^.+$
    Exclude     log            ^([0-9]+: )?Saving in-memory database

# The systemd input tags every record from the unit identically. The Lua filter
# uses CONTAINER_TAG presence to leave podman command and unit lifecycle output
# untouched while cleaning broker stdout.
[FILTER]
    Name    lua
    Match   svc.mosquitto.service
    script  /etc/fluent-bit/mosquitto_normalize.lua
    call    normalize_mosquitto
