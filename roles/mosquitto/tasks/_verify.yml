- name: _verify | Record volumes before client runs and broker restart
  command: podman volume ls --quiet
  become: true
  register: mosquitto_volumes_before
  changed_when: false

# Peer containers exercise the consumer DNS path and every full-access
# password-file entry; accounts restricted by mosquitto_acl get their own
# probes below. Retained messages must survive the clean shutdown used by ZFS
# snapshots.
- name: _verify | Each account publishes a retained message via DNS
  command: >-
    podman run --rm --image-volume=ignore --network homeassistant {{ mosquitto_image }}
    mosquitto_pub -h mosquitto.dns.podman -p 1883
    -u {{ item.key | quote }} -P {{ item.value.password | quote }}
    -t {{ ('homelab/verify/' ~ item.key) | quote }} -m ok -r
  args:
    expand_argument_vars: false
  become: true
  register: mosquitto_authed
  until: mosquitto_authed.rc == 0
  retries: 15
  delay: 2
  changed_when: false
  loop: "{{ mosquitto_accounts | dict2items | rejectattr('key', 'in', mosquitto_acl) }}"
  loop_control:
    label: "{{ item.key }}"

- name: _verify | Publish a retained bridge state as z2m
  command: >-
    podman run --rm --image-volume=ignore --network homeassistant {{ mosquitto_image }}
    mosquitto_pub -h mosquitto.dns.podman -p 1883
    -u z2m -P {{ mosquitto_accounts.z2m.password | quote }}
    -t zigbee2mqtt/bridge/state -m '{"state":"online"}' -r
  args:
    expand_argument_vars: false
  become: true
  changed_when: false

- name: _verify | Restart the broker
  systemd:
    name: mosquitto
    state: restarted
  become: true

- name: _verify | Each account receives its retained message after restart
  command: >-
    podman run --rm --image-volume=ignore --network homeassistant {{ mosquitto_image }}
    mosquitto_sub -h mosquitto.dns.podman -p 1883
    -u {{ item.key | quote }} -P {{ item.value.password | quote }}
    -t {{ ('homelab/verify/' ~ item.key) | quote }} -C 1 -W 3
  args:
    expand_argument_vars: false
  become: true
  register: mosquitto_persist
  until: mosquitto_persist.rc == 0 and mosquitto_persist.stdout == 'ok'
  retries: 15
  delay: 2
  changed_when: false
  loop: "{{ mosquitto_accounts | dict2items | rejectattr('key', 'in', mosquitto_acl) }}"
  loop_control:
    label: "{{ item.key }}"

# Kuma's MQTT monitor connects over the kuma network with a read-only account.
- name: _verify | Kuma reads the retained bridge state over the kuma network
  command: >-
    podman run --rm --image-volume=ignore --network kuma {{ mosquitto_image }}
    mosquitto_sub -h mosquitto.dns.podman -p 1883
    -u kuma -P {{ mosquitto_accounts.kuma.password | quote }}
    -t zigbee2mqtt/bridge/state -C 1 -W 3
  args:
    expand_argument_vars: false
  become: true
  register: mosquitto_kuma_read
  until: mosquitto_kuma_read.rc == 0 and mosquitto_kuma_read.stdout == '{"state":"online"}'
  retries: 15
  delay: 2
  changed_when: false

- name: _verify | Kuma cannot read other topics
  command: >-
    podman run --rm --image-volume=ignore --network kuma {{ mosquitto_image }}
    mosquitto_sub -h mosquitto.dns.podman -p 1883
    -u kuma -P {{ mosquitto_accounts.kuma.password | quote }}
    -t homelab/verify/z2m -C 1 -W 3
  args:
    expand_argument_vars: false
  become: true
  register: mosquitto_kuma_other
  failed_when: mosquitto_kuma_other.rc == 0 or mosquitto_kuma_other.stdout | length > 0
  changed_when: false

# The broker drops a denied QoS 0 publish without telling the client, so the
# exit code says nothing; the retained state read back below is the check.
- name: _verify | Kuma attempts to overwrite the bridge state
  command: >-
    podman run --rm --image-volume=ignore --network kuma {{ mosquitto_image }}
    mosquitto_pub -h mosquitto.dns.podman -p 1883
    -u kuma -P {{ mosquitto_accounts.kuma.password | quote }}
    -t zigbee2mqtt/bridge/state -m '{"state":"offline"}' -r
  args:
    expand_argument_vars: false
  become: true
  failed_when: false
  changed_when: false

- name: _verify | Bridge state is unchanged after the Kuma publish
  command: >-
    podman run --rm --image-volume=ignore --network homeassistant {{ mosquitto_image }}
    mosquitto_sub -h mosquitto.dns.podman -p 1883
    -u z2m -P {{ mosquitto_accounts.z2m.password | quote }}
    -t zigbee2mqtt/bridge/state -C 1 -W 3
  args:
    expand_argument_vars: false
  become: true
  register: mosquitto_bridge_state
  failed_when: mosquitto_bridge_state.stdout != '{"state":"online"}'
  changed_when: false

- name: _verify | Broker logs its startup through native syslog
  command: >-
    journalctl --boot --no-pager --output=cat --lines=1
    _SYSTEMD_UNIT=mosquitto.service _COMM=mosquitto _TRANSPORT=syslog PRIORITY=6
    --grep="^mosquitto version .* running$"
  become: true
  register: mosquitto_startup
  changed_when: false
  until: mosquitto_startup.rc == 0 and mosquitto_startup.stdout | length > 0
  retries: 5
  delay: 2

- name: _verify | Broker startup reaches the lnav store
  import_role:
    name: fluentbit
    tasks_from: verify_live
  vars:
    fluentbit_verify_live_args:
      expected:
        - service: mosquitto
          unit: mosquitto.service
          level: info
          message: "{{ mosquitto_startup.stdout }}"

- name: _verify | Anonymous connection is refused
  command: >-
    podman run --rm --image-volume=ignore --network homeassistant {{ mosquitto_image }}
    mosquitto_pub -h mosquitto.dns.podman -p 1883
    -t homelab/verify -m nope
  become: true
  register: mosquitto_anon
  failed_when: mosquitto_anon.rc == 0
  changed_when: false

- name: _verify | Wrong password is refused
  command: >-
    podman run --rm --image-volume=ignore --network homeassistant {{ mosquitto_image }}
    mosquitto_pub -h mosquitto.dns.podman -p 1883
    -u z2m -P definitely-wrong -t homelab/verify -m nope
  become: true
  register: mosquitto_badpw
  failed_when: mosquitto_badpw.rc == 0
  changed_when: false

- name: _verify | Broker restart and disposable clients create no volumes
  command: podman volume ls --quiet
  become: true
  register: mosquitto_volumes_after
  changed_when: false
  failed_when: mosquitto_volumes_after.stdout_lines | sort != mosquitto_volumes_before.stdout_lines | sort
- name: _verify | Exercise alternate service storage layouts
  include_tasks: "{{ ansible_config_file | dirname }}/test/playbooks/tasks/_verify_service_storage.yml"
  vars:
    _storage_service: mosquitto
    _storage_mounts: [ services ]
