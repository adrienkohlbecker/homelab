# Each consumer reaches the broker from its own container over the
# `homeassistant` network, resolving `mosquitto.dns.podman` via aardvark-dns --
# the path z2m and home-assistant use. A throwaway peer container (not
# `podman exec` into the broker) is what exercises cross-container name
# resolution; looping over every account covers the whole pwfile, not just the
# first line.
- name: _verify | Each account authenticates over the network via DNS
  shell: |
    set -euo pipefail
    podman run --rm --network homeassistant {{ mosquitto_image }} \
      mosquitto_pub -h mosquitto.dns.podman -p 1883 \
      -u {{ item.key }} -P {{ item.value.password }} \
      -t homelab/verify/{{ item.key }} -m ok -r
    podman run --rm --network homeassistant {{ mosquitto_image }} \
      mosquitto_sub -h mosquitto.dns.podman -p 1883 \
      -u {{ item.key }} -P {{ item.value.password }} \
      -t homelab/verify/{{ item.key }} -C 1 -W 3
  args:
    executable: /bin/bash
  become: true
  register: mosquitto_authed
  until: mosquitto_authed.rc == 0 and 'ok' in mosquitto_authed.stdout
  retries: 15
  delay: 2
  changed_when: false
  loop: "{{ mosquitto_accounts | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: _verify | Anonymous connection is refused
  command: >-
    podman run --rm --network homeassistant {{ mosquitto_image }}
    mosquitto_pub -h mosquitto.dns.podman -p 1883
    -t homelab/verify -m nope
  become: true
  register: mosquitto_anon
  failed_when: mosquitto_anon.rc == 0
  changed_when: false

- name: _verify | Wrong password is refused
  command: >-
    podman run --rm --network homeassistant {{ mosquitto_image }}
    mosquitto_pub -h mosquitto.dns.podman -p 1883
    -u z2m -P definitely-wrong -t homelab/verify -m nope
  become: true
  register: mosquitto_badpw
  failed_when: mosquitto_badpw.rc == 0
  changed_when: false

# A retained message must survive a broker bounce -- the nightly ZFS-snapshot
# restart relies on clean-shutdown writes to the persistence dataset. Publish
# retained, restart (Type=notify blocks until healthy), then resubscribe.
- name: _verify | Publish a retained message before restart
  shell: |
    set -euo pipefail
    podman run --rm --network homeassistant {{ mosquitto_image }} \
      mosquitto_pub -h mosquitto.dns.podman -p 1883 \
      -u z2m -P {{ mosquitto_accounts.z2m.password }} \
      -t homelab/persist -m survived -r
  args:
    executable: /bin/bash
  become: true
  changed_when: false

- name: _verify | Exercise mosquitto fluent-bit record contracts
  import_role:
    name: fluentbit
    tasks_from: verify_extension
  vars:
    fluentbit_verify_args:
      name: mosquitto
      records:
        - MESSAGE: "4070908800: Warning: mosquitto-valid"
          CONTAINER_TAG: mosquitto
          SYSLOG_IDENTIFIER: conmon
          SYSTEMD_UNIT: mosquitto.service
        - MESSAGE: mosquitto-raw
          CONTAINER_TAG: mosquitto
          SYSLOG_IDENTIFIER: conmon
          SYSTEMD_UNIT: mosquitto.service
      expected:
        - message: mosquitto-valid
          level: warn
          service: mosquitto
        - message: mosquitto-raw
          level: info
          service: mosquitto

- name: _verify | Restart the broker
  systemd:
    name: mosquitto
    state: restarted
  become: true

- name: _verify | Retained message survived the restart
  shell: |
    set -euo pipefail
    podman run --rm --network homeassistant {{ mosquitto_image }} \
      mosquitto_sub -h mosquitto.dns.podman -p 1883 \
      -u z2m -P {{ mosquitto_accounts.z2m.password }} \
      -t homelab/persist -C 1 -W 3
  args:
    executable: /bin/bash
  become: true
  register: mosquitto_persist
  until: mosquitto_persist.rc == 0 and 'survived' in mosquitto_persist.stdout
  retries: 15
  delay: 2
  changed_when: false

- name: _verify | Set mosquitto fluent-bit journal marker
  set_fact:
    mosquitto_lnav_marker: "verify_mosquitto_{{ ansible_date_time.iso8601_basic_short }}_{{ 99999 | random }}"

- name: _verify | Write mosquitto record through container stderr
  command:
    argv:
      - podman
      - exec
      - mosquitto
      - /bin/sh
      - -c
      - >-
        printf "%s\n" "4070908800: Warning: {{ mosquitto_lnav_marker }}"
        > /proc/1/fd/2
  changed_when: false
  become: true

- name: _verify | Wait for cleaned mosquitto record in lnav store
  command:
    argv:
      - python3
      - -c
      - |
        import json
        import sys

        with open(sys.argv[1], encoding="utf-8") as handle:
            for line in handle:
                try:
                    record = json.loads(line)
                except json.JSONDecodeError:
                    continue
                if (
                    record.get("service") == "mosquitto"
                    and sys.argv[2] in record.get("message", "")
                ):
                    print(json.dumps(record, sort_keys=True))
                    sys.exit(0)
        sys.exit(1)
      - /var/log/fluent-bit/lnav.jsonl
      - "{{ mosquitto_lnav_marker }}"
  register: _mosquitto_lnav_record
  changed_when: false
  retries: 30
  delay: 2
  until: _mosquitto_lnav_record.rc == 0
  become: true

# Clear the retained test messages so a re-run against a --keep VM starts clean.
- name: _verify | Clear retained test messages
  shell: |
    set -euo pipefail
    for t in homelab/verify/z2m homelab/verify/homeassistant homelab/persist; do
      podman run --rm --network homeassistant {{ mosquitto_image }} \
        mosquitto_pub -h mosquitto.dns.podman -p 1883 \
        -u z2m -P {{ mosquitto_accounts.z2m.password }} -t "$t" -r -n
    done
  args:
    executable: /bin/bash
  become: true
  changed_when: false
