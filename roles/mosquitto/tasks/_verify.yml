# Peer containers exercise the consumer DNS path and every password-file entry.
# Retained messages must survive the clean shutdown used by ZFS snapshots.
- name: _verify | Each account publishes a retained message via DNS
  command: >-
    podman run --rm --network homeassistant {{ mosquitto_image }}
    mosquitto_pub -h mosquitto.dns.podman -p 1883
    -u {{ item.key | quote }} -P {{ item.value.password | quote }}
    -t {{ ('homelab/verify/' ~ item.key) | quote }} -m ok -r
  args:
    expand_argument_vars: false
  become: true
  register: mosquitto_authed
  until: mosquitto_authed.rc == 0
  retries: 15
  delay: 2
  changed_when: false
  loop: "{{ mosquitto_accounts | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: _verify | Restart the broker
  systemd:
    name: mosquitto
    state: restarted
  become: true

- name: _verify | Each account receives its retained message after restart
  command: >-
    podman run --rm --network homeassistant {{ mosquitto_image }}
    mosquitto_sub -h mosquitto.dns.podman -p 1883
    -u {{ item.key | quote }} -P {{ item.value.password | quote }}
    -t {{ ('homelab/verify/' ~ item.key) | quote }} -C 1 -W 3
  args:
    expand_argument_vars: false
  become: true
  register: mosquitto_persist
  until: mosquitto_persist.rc == 0 and mosquitto_persist.stdout == 'ok'
  retries: 15
  delay: 2
  changed_when: false
  loop: "{{ mosquitto_accounts | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: _verify | Anonymous connection is refused
  command: >-
    podman run --rm --network homeassistant {{ mosquitto_image }}
    mosquitto_pub -h mosquitto.dns.podman -p 1883
    -t homelab/verify -m nope
  become: true
  register: mosquitto_anon
  failed_when: mosquitto_anon.rc == 0
  changed_when: false

- name: _verify | Wrong password is refused
  command: >-
    podman run --rm --network homeassistant {{ mosquitto_image }}
    mosquitto_pub -h mosquitto.dns.podman -p 1883
    -u z2m -P definitely-wrong -t homelab/verify -m nope
  become: true
  register: mosquitto_badpw
  failed_when: mosquitto_badpw.rc == 0
  changed_when: false

- name: _verify | Exercise mosquitto fluent-bit record contracts
  import_role:
    name: fluentbit
    tasks_from: verify_extension
  vars:
    fluentbit_verify_args:
      name: mosquitto
      records:
        - MESSAGE: "4070908800: Warning: mosquitto-valid"
          CONTAINER_TAG: mosquitto
          SYSLOG_IDENTIFIER: conmon
          SYSTEMD_UNIT: mosquitto.service
        - MESSAGE: mosquitto-raw
          CONTAINER_TAG: mosquitto
          SYSLOG_IDENTIFIER: conmon
          SYSTEMD_UNIT: mosquitto.service
      expected:
        - message: mosquitto-valid
          level: warn
          service: mosquitto
        - message: mosquitto-raw
          level: info
          service: mosquitto

- name: _verify | Set mosquitto fluent-bit journal marker
  set_fact:
    mosquitto_lnav_marker: "verify_mosquitto_{{ ansible_date_time.iso8601_basic_short }}_{{ 99999 | random }}"

- name: _verify | Write mosquitto record through container stderr
  command:
    argv:
      - podman
      - exec
      - mosquitto
      - /bin/sh
      - -c
      - >-
        printf "%s\n" "4070908800: Warning: {{ mosquitto_lnav_marker }}"
        > /proc/1/fd/2
  changed_when: false
  become: true

- name: _verify | Wait for cleaned mosquitto record in lnav store
  command:
    argv:
      - python3
      - -c
      - |
        import json
        import sys

        with open(sys.argv[1], encoding="utf-8") as handle:
            for line in handle:
                try:
                    record = json.loads(line)
                except json.JSONDecodeError:
                    continue
                if (
                    record.get("service") == "mosquitto"
                    and sys.argv[2] in record.get("message", "")
                ):
                    print(json.dumps(record, sort_keys=True))
                    sys.exit(0)
        sys.exit(1)
      - /var/log/fluent-bit/lnav.jsonl
      - "{{ mosquitto_lnav_marker }}"
  register: _mosquitto_lnav_record
  changed_when: false
  retries: 30
  delay: 2
  until: _mosquitto_lnav_record.rc == 0
  become: true

# Clear the retained test messages so a re-run against a --keep VM starts clean.
- name: _verify | Clear retained test messages
  command: >-
    podman run --rm --network homeassistant {{ mosquitto_image }}
    mosquitto_pub -h mosquitto.dns.podman -p 1883
    -u {{ item.key | quote }} -P {{ item.value.password | quote }}
    -t {{ ('homelab/verify/' ~ item.key) | quote }} -r -n
  args:
    expand_argument_vars: false
  become: true
  changed_when: false
  loop: "{{ mosquitto_accounts | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
