# Metric-wiring phase, imported by main.yml after the service is up: sibling
# roles drop collector configuration and alerts through Netdata's helpers.
# netdata_presence is Netdata's own collector rather than a sibling role.

- name: Install hdparm metrics
  when: rotational_disks_by_id | length > 0
  import_role:
    name: hdparm
    tasks_from: netdata
  vars:
    hdparm_netdata_condition: "{{ not (ansible_check_mode and (netdata_apt.changed or netdata_apt_source_changed)) }}"
  tags:
    - netdata

- name: Install zfs metrics
  import_role:
    name: zfs
    tasks_from: netdata
  vars:
    zfs_netdata_condition: "{{ not (ansible_check_mode and (netdata_apt.changed or netdata_apt_source_changed)) }}"
  tags:
    - netdata

- name: Install systemd_timer metrics
  import_role:
    name: systemd_timer
    tasks_from: netdata
  vars:
    systemd_timer_netdata_condition: "{{ not (ansible_check_mode and (netdata_apt.changed or netdata_apt_source_changed)) }}"
  tags:
    - netdata

- name: Install netdata_presence metrics
  import_tasks: presence.yml
  vars:
    netdata_presence_condition: "{{ not (ansible_check_mode and (netdata_apt.changed or netdata_apt_source_changed)) }}"
  tags:
    - netdata

- name: Install lm_sensors metrics
  import_tasks: config.yml
  vars:
    netdata_args:
      src: sensors.conf
      dest: go.d/sensors.conf
      condition: "{{ not (ansible_check_mode and (netdata_apt.changed or netdata_apt_source_changed)) }}"
      validate: >-
        python3 -c 'import sys,yaml; yaml.safe_load(open(sys.argv[1]))' %s
  tags:
    - netdata

- name: Install certbot metrics
  import_role:
    name: certbot
    tasks_from: netdata
  vars:
    certbot_netdata_condition: "{{ not (ansible_check_mode and (netdata_apt.changed or netdata_apt_source_changed)) }}"
  tags:
    - netdata

- name: Install nginx metrics
  import_role:
    name: nginx
    tasks_from: netdata
  vars:
    nginx_netdata_condition: "{{ not (ansible_check_mode and (netdata_apt.changed or netdata_apt_source_changed)) }}"
  tags:
    - netdata

# keepalived VRRP master-state collector. Reads directly off the host: is the
# DNS VIP bound to a local interface? Gated by host var so non-DNS hosts stay
# clean; the plugin's own _check is a second guard.
- name: Install keepalived VRRP metrics
  import_tasks: charts_d.yml
  vars:
    netdata_args:
      name: keepalived_vrrp
      script: keepalived_vrrp.chart.sh
      conf: charts_d_keepalived_vrrp.conf.j2
      condition: "{{ netdata_keepalived_vrrp_enabled and not (ansible_check_mode and (netdata_apt.changed or netdata_apt_source_changed)) }}"
  tags:
    - netdata

- name: Remove stale keepalived VRRP collector files
  when: not netdata_keepalived_vrrp_enabled
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /usr/libexec/netdata/charts.d/keepalived_vrrp.chart.sh
    - /etc/netdata/charts.d/keepalived_vrrp.conf
  register: netdata_keepalived_vrrp_absent
  become: true
  tags:
    - netdata

- name: Restart netdata after stale keepalived VRRP collector removal
  when: netdata_keepalived_vrrp_absent.changed
  systemd:
    name: netdata
    state: restarted
  become: true
  tags:
    - netdata
