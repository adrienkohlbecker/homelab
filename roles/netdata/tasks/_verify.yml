- name: _verify | Run the common checks
  import_tasks: _verify_common.yml

- name: _verify | Run the full-fixture checks
  import_tasks: _verify_full.yml
- name: _verify | Load the production defaults for variant checks
  include_vars:
    file: "{{ role_path }}/defaults/main.yml"
    name: _netdata_defaults

- name: _verify | Resolve expected charts with a keepalive peer
  vars:
    wireguard_peers:
      bunk:
        keepalive_from:
          - "{{ inventory_hostname }}"
  assert:
    that: "'wireguard_bunk_peer' in _netdata_defaults.netdata_expected_charts"

- name: _verify | Resolve expected charts without a keepalive peer
  vars:
    wireguard_peers: {}
  assert:
    that: _netdata_defaults.netdata_expected_charts == {}

- name: _verify | Keepalived collector omits an unset cadence
  vars:
    netdata_keepalived_vrrp_update_every: "{{ undef() }}"
    _netdata_keepalived_default: "{{ lookup('template', 'charts_d_keepalived_vrrp.conf.j2') }}"
  assert:
    that: "'keepalived_vrrp_update_every=' not in _netdata_keepalived_default"

- name: _verify | Check alternate collector configuration
  vars:
    qemu_test: false
    netdata_keepalived_vrrp_update_every: 11
    netdata_collectors:
      - go.d:collector:prometheus:kuma
      - go.d:collector:prometheus:headscale
    netdata_zfspool_thresholds:
      verify_pool: [ 70, 80, 90 ]
    _netdata_keepalived: "{{ lookup('template', 'charts_d_keepalived_vrrp.conf.j2') }}"
    _netdata_presence: "{{ lookup('template', 'charts_d_netdata_presence.conf.j2') }}"
    _netdata_gitlab_runner_alerts: "{{ lookup('template', 'gitlab_runner_alerts.conf.j2') }}"
    _netdata_prometheus: "{{ lookup('template', 'prometheus.conf.j2') }}"
    _netdata_zfs_alerts: "{{ lookup('template', 'zfs_alerts_override.conf.j2') }}"
  assert:
    that:
      - "'keepalived_vrrp_update_every=11' in _netdata_keepalived"
      - "'netdata_presence_update_every=60' in _netdata_presence"
      - "'netdata_presence_startup_grace=300' in _netdata_presence"
      - "'lookup: max -5m' in _netdata_gitlab_runner_alerts"
      - "'name: kuma' in _netdata_prometheus"
      - "'name: headscale' in _netdata_prometheus"
      - "'name: gitlab_runner' not in _netdata_prometheus"
      - "'zfspool.zfspool_verify_pool_space_utilization' in _netdata_zfs_alerts"
      - "'? (70) : (80)' in _netdata_zfs_alerts"

- name: _verify | Probe lighter-than-restart config application
  import_tasks: _verify_reload.yml
