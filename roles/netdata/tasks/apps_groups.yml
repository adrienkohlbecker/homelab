# apps.plugin groups processes by name via apps_groups.conf. A process that
# matches no group inherits its parent's group, so everything running inside a
# container is folded into that container's `conmon` monitor: a CI bake pegging
# a CPU core shows up as `app.conmon` at ~100%, not as the tool actually
# burning it. Define a `packer` group so the bake's CPU (the amazon builder
# plugin spins a core per build, hashicorp/packer#13483) is attributed to
# packer instead of misread as conmon.
#
# netdata uses /etc/netdata/apps_groups.conf *instead of* the stock file when
# present (it does not merge), so this re-emits the stock content verbatim plus
# the homelab block — re-synced from stock every converge, so a netdata upgrade
# that ships new default groups still propagates.
- name: Read the stock apps_groups.conf
  when:
    - netdata_packer_process_group_enabled
    - netdata_package_ready
  slurp:
    src: /usr/lib/netdata/conf.d/apps_groups.conf
  register: netdata_apps_groups_stock
  become: true

- name: Install apps_groups.conf with homelab process groups  # noqa: require-validate
  when:
    - netdata_packer_process_group_enabled
    - netdata_package_ready
  copy:
    dest: /etc/netdata/apps_groups.conf
    content: |-
      {{ netdata_apps_groups_stock.content | b64decode | trim }}

      # --- homelab additions (managed by roles/netdata) ---
      # Pull CI bake processes out of the gitlab_runner build container's conmon
      # rollup so their CPU is attributed correctly. See the header of
      # roles/netdata/tasks/apps_groups.yml.
      # Prefix match catches `packer` and the comm-truncated `packer-plugin-a`
      # (the builder/provisioner plugin subprocesses) in one rule.
      packer: packer*
    owner: netdata
    group: netdata
    mode: "0644"
    backup: true
  register: netdata_apps_groups
  become: true

- name: Remove custom apps_groups.conf when disabled
  when: not netdata_packer_process_group_enabled
  file:
    path: /etc/netdata/apps_groups.conf
    state: absent
  register: netdata_apps_groups_removed
  become: true

# apps.plugin reads apps_groups.conf only at start, so killing it is enough
# when it runs: netdata respawns it within seconds and the new process reads
# the file on disk (_verify_reload.yml proves it). The plugin is matched by
# command line because charts.d.plugin runs as a bash script. When nothing
# matches after this run already killed it, a respawn is pending and will read
# the latest file too. Otherwise it is disabled (charts.d.plugin disables
# itself when netdata starts it with no collectors) or netdata is not running,
# and only a netdata restart relaunches it.
- name: Restart apps.plugin after an apps_groups change
  when: >-
    netdata_apps_groups.changed | default(false)
    or netdata_apps_groups_removed.changed | default(false)
  command:
    argv:
      - pkill
      - --signal
      - TERM
      - --full
      - plugins.d/apps.plugin
  register: netdata_apps_plugin_kill
  changed_when: netdata_apps_plugin_kill.rc == 0
  failed_when: netdata_apps_plugin_kill.rc > 1
  become: true

- name: Record the apps.plugin kill
  when: netdata_apps_plugin_kill.rc | default(1) == 0
  set_fact:
    netdata_killed_plugins: "{{ netdata_killed_plugins | default([]) | union(['apps.plugin']) }}"

- name: Restart netdata when apps.plugin is not running
  when:
    - netdata_apps_plugin_kill.rc | default(0) == 1
    - "'apps.plugin' not in netdata_killed_plugins | default([])"
  systemd:
    name: netdata
    state: restarted
  become: true
