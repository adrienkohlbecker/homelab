# A package version change must leave the running plugins with their file
# capabilities. dpkg configures netdata before its plugins (they depend on its
# exact version), so netdata's postinst restarts the daemon before the plugins'
# postinst reapplies setcap. The apt hook must restart netdata afterwards so
# the running go.d.plugin holds cap_net_admin (needed by the wireguard
# collector) rather than an empty set. Move the installed netdata packages to
# another in-series release, as a series bump through apt_upgrade would.
- name: _verify | Read the chartsd plugin apt policy
  command: apt-cache policy netdata-plugin-chartsd
  changed_when: false
  register: _netdata_chartsd_policy

- name: _verify | List the in-series chartsd plugin versions, newest first
  set_fact:
    _netdata_chartsd_series: "{{ _netdata_chartsd_policy.stdout | regex_findall('(?m)^ [* ]{3} ([^ ]+) 999$') }}"

- name: _verify | The index offers an older in-series release to move to
  assert:
    that:
      - _netdata_chartsd_series | length > 1
    fail_msg: "Expected several in-series chartsd plugin versions; got policy: {{ _netdata_chartsd_policy.stdout }}"

- name: _verify | List the installed netdata packages
  command:
    argv:
      - dpkg-query
      - --show
      - "--showformat=${db:Status-Abbrev}${Package}\n"
      - netdata*
  changed_when: false
  register: _netdata_installed_packages

# Plugins depend on netdata at its exact version, so the whole installed set
# moves together. The apt module cannot select a version its preferences pin
# outranks, but an explicit version on the apt-get command line can.
- name: _verify | Downgrade the installed netdata packages to the previous in-series release  # noqa: command-instead-of-module
  vars:
    _netdata_downgrade: >-
      {{ _netdata_installed_packages.stdout
         | regex_findall('(?m)^ii ([^ ]+)$')
         | map('regex_replace', '$', '=' ~ _netdata_chartsd_series[1])
         | join(' ') }}
  command: >-
    apt-get install --yes --allow-downgrades
    -o Dpkg::Options::=--force-confdef -o Dpkg::Options::=--force-confold
    {{ _netdata_downgrade }}
  environment:
    DEBIAN_FRONTEND: noninteractive
  changed_when: true
  become: true

- name: _verify | Read the running go.d.plugin capabilities
  shell: |
    set -euo pipefail
    getpcaps "$(pgrep --oldest --exact go.d.plugin)"
  args:
    executable: /bin/bash
  changed_when: false
  register: _netdata_go_d_caps
  until: _netdata_go_d_caps.rc == 0
  retries: 12
  delay: 5
  become: true

- name: _verify | The running go.d.plugin holds its file capabilities
  assert:
    that:
      - "'cap_net_admin' in _netdata_go_d_caps.stdout"
    fail_msg: >-
      Expected go.d.plugin to run with cap_net_admin after a package version
      change; got {{ _netdata_go_d_caps.stdout }}
