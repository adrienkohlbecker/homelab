# Imported right after a raw apt-get version change. dpkg configures netdata
# before its plugins (they depend on its exact version), so netdata's postinst
# restarts the daemon before the plugins' postinst reapplies setcap. The apt
# hook must restart netdata afterwards so the running go.d.plugin holds
# cap_net_admin (needed by the wireguard collector) rather than an empty set.
- name: _verify | Read the running go.d.plugin capabilities
  shell: |
    set -euo pipefail
    getpcaps "$(pgrep --oldest --exact go.d.plugin)"
  args:
    executable: /bin/bash
  changed_when: false
  register: _netdata_go_d_caps
  until: _netdata_go_d_caps.rc == 0
  retries: 12
  delay: 5
  become: true

- name: _verify | The running go.d.plugin holds its file capabilities
  assert:
    that:
      - "'cap_net_admin' in _netdata_go_d_caps.stdout"
    fail_msg: >-
      Expected go.d.plugin to run with cap_net_admin after a package version
      change; got {{ _netdata_go_d_caps.stdout }}
