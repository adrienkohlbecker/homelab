# Source is netdata's upstream stable repo (repo.netdata.cloud), which
# carries the current 2.x series for noble across amd64 + arm64 +
# armhf. Flat layout (trailing-slash Suites, no Components), signed with
# Netdatabot's key (6E155DC1…). The apt_preferences pin holds netdata at
# 2.* so a fresh install lands on the latest 2.x and only a deliberate
# pin bump moves to a future major. See notes/netdata_v2_migration_analysis.md.

# Flat repo (no components). The apt_source helper fetches the key into the scoped
# /usr/share/keyrings/netdata.gpg (not the global trust store), verifies it
# against key_id, and renders the 2.* pin.
- name: install | Configure netdata apt repository
  import_role:
    name: apt_source
    tasks_from: configure
  vars:
    apt_source_args:
      name: netdata
      key_id: 6E155DC153906B73765A74A99DD4A74CECFA8F4F
      key_url: https://repo.netdata.cloud/netdatabot.gpg.key
      uris: "{{ mirror_apt_netdata }}/"
      suites: "{{ ansible_distribution_release }}/"
      pin:
        package: "netdata*"
        version: "{{ netdata_version }}"
        priority: 999
  tags:
    - netdata

- name: install | Install netdata
  when: not (ansible_check_mode and apt_source_netdata_changed)
  apt:
    pkg:
      - netdata
    policy_rc_d: 101
    cache_valid_time: 3600
  register: netdata_apt
  become: true
  tags:
    - netdata

# Letsencrypt live/ + archive/ are 0750 root:ssl-cert (see
# roles/certbot/tasks/main.yml); netdata's go.d/x509check reads
# /etc/letsencrypt/live/<host>/fullchain.pem, so the netdata user
# needs ssl-cert to traverse those dirs. Create the group here
# rather than relying on certbot having run first — the ssl-cert
# apt package's postinst is idempotent against the group already
# existing, so certbot installing the package later is fine.
- name: install | Ensure ssl-cert group exists
  group:
    name: ssl-cert
    system: true
    state: present
  become: true
  tags:
    - netdata

- name: install | Add netdata to ssl-cert group
  when: not (ansible_check_mode and netdata_apt.changed)
  user:
    name: netdata
    groups: ssl-cert
    append: true
  become: true
  tags:
    - netdata

# No explicit netdata-plugin-* list: the v2 base `netdata` package pulls the
# whole suite + the local dashboard (go, chartsd, apps, debugfs, nfacct, perf,
# pythond, slabinfo, otel, netdata-dashboard, …), so apt resolves them. The
# only amd64-only piece is netdata-plugin-ebpf, which simply has no arm64 build
# and is skipped there (everything else, slabinfo included, is multi-arch), so
# `apt install netdata` resolves on the Apple-Silicon test box too. On amd64
# ebpf.plugin lands but stays idle (`[plugins] ebpf = no` in main.yml).
# Verified by testrole.py netdata on the arm64 box (netdata 2.10.3).
# See notes/netdata_v2_migration_analysis.md.
