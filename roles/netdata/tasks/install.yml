# netdata's upstream stable repo (repo.netdata.cloud): a flat repo
# (trailing-slash suite, no components) whose Netdatabot key is trusted only
# through the scoped /usr/share/keyrings/netdata.asc. The pin holds netdata* at
# the netdata_version series in versions.yml; see
# notes/archive/netdata_v2_migration_analysis.md.
- name: install | Configure netdata apt repository
  import_role:
    name: apt_source
    tasks_from: configure
  vars:
    apt_source_args:
      name: netdata
      key_sha256: a18bd0303840126254b05a972f20df17c851d1573d28866ff67f55e152762e4f
      key_url: https://repo.netdata.cloud/netdatabot.gpg.key
      uris: "{{ mirror_apt_netdata }}/"
      suites: "{{ ansible_distribution_release }}/"
      pin:
        package: netdata*
        version: "{{ netdata_version }}"
  tags:
    - netdata

# The apt hook below restarts netdata after package runs that strip plugin
# file capabilities; see the script for the race.
- name: install | Install the stale-plugin restart script
  copy:
    src: netdata_restart_stale_plugins
    dest: /usr/local/sbin/netdata_restart_stale_plugins
    owner: root
    group: root
    mode: "0755"
    backup: true
    validate: bash -n %s
  become: true
  tags:
    - netdata

- name: install | Restart netdata after package runs replace its plugins
  copy:
    src: 80netdata_plugin_caps.conf
    dest: /etc/apt/apt.conf.d/80netdata_plugin_caps
    owner: root
    group: root
    mode: "0644"
    backup: true
    validate: apt-config dump -c %s
  become: true
  tags:
    - netdata

# The base package pulls the whole plugin suite and the local dashboard, so
# there is no netdata-plugin-* list. netdata-plugin-ebpf has no arm64 build and
# is skipped there; on amd64 it stays idle (`[plugins] ebpf = no`).
- name: install | Install netdata
  when: not (ansible_check_mode and apt_source_netdata_changed)
  apt:
    pkg:
      - netdata
    policy_rc_d: 101
    cache_valid_time: 3600
  register: netdata_apt
  become: true
  tags:
    - netdata

- name: install | Record whether the netdata package is available
  set_fact:
    netdata_package_ready: >-
      {{ not (ansible_check_mode and
              (netdata_apt.changed or apt_source_netdata_changed)) }}
  tags:
    - netdata

- name: install | Configure netdata log compression
  import_role:
    name: logrotate
    tasks_from: compression
  vars:
    logrotate_args:
      configs:
        - path: /etc/logrotate.d/netdata
      condition: "{{ netdata_package_ready }}"
  tags:
    - netdata

# Letsencrypt live/ + archive/ are 0750 root:ssl-cert (see
# roles/certbot/tasks/main.yml); netdata's go.d/x509check reads
# /etc/letsencrypt/live/<host>/fullchain.pem, so the netdata user
# needs ssl-cert to traverse those dirs. Create the group here
# rather than relying on certbot having run first — the ssl-cert
# apt package's postinst is idempotent against the group already
# existing, so certbot installing the package later is fine.
- name: install | Ensure ssl-cert group exists
  group:
    name: ssl-cert
    system: true
    state: present
  become: true
  tags:
    - netdata

- name: install | Add netdata to ssl-cert group
  when: not (ansible_check_mode and netdata_apt.changed)
  user:
    name: netdata
    groups: ssl-cert
    append: true
  become: true
  tags:
    - netdata
