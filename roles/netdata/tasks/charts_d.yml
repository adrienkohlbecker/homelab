# Install a charts.d.plugin shell collector. Drops the caller-provided
# script under /usr/libexec/netdata/charts.d/ and the caller-provided conf
# under /etc/netdata/charts.d/, then restarts netdata when anything changed.
#
# Inputs: caller passes a single dict `netdata_args` with keys
#   name        required; collector module name (e.g. 'hdparm'). Used as
#               the on-disk basename: charts.d/<name>.chart.sh and
#               charts.d/<name>.conf. charts.d.plugin discovers modules
#               by the <name>.chart.sh filename and sources the matching
#               <name>.conf before <name>_check.
#   script      required; file under caller's files/ to install as the
#               chart.sh. Always copied verbatim (no template form — chart
#               scripts shouldn't carry host-specific values; put those in
#               the conf instead).
#   conf        required; file under caller's files/ (or templates/, if the
#               name ends in .j2) to install as the charts.d conf.
#   condition   optional bool, default true; gates the whole call
#
# The whole dict is replaced at each call, so optional values cannot leak from
# a previous collector import.
- name: charts_d | Assert required inputs are set
  assert:
    that:
      - netdata_args.name is defined and netdata_args.name | length > 0
      - netdata_args.script is defined and netdata_args.script | length > 0
      - netdata_args.conf is defined and netdata_args.conf | length > 0
    fail_msg: >-
      charts_d helper requires netdata_args.name (collector module name),
      netdata_args.script (chart.sh under the caller's files/), and
      netdata_args.conf (charts.d conf under the caller's files/ or templates/)

- name: "charts_d | Install chart.sh for {{ netdata_args.name }}"
  when: netdata_args.condition | default(true)
  copy:
    src: "{{ netdata_args.script }}"
    dest: /usr/libexec/netdata/charts.d/{{ netdata_args.name }}.chart.sh
    owner: root
    group: root
    mode: "0755"
    backup: true
    validate: bash -n %s
  register: _netdata_charts_d_chart_sh
  become: true

- name: charts_d | Ensure /etc/netdata/charts.d/ exists
  when: netdata_args.condition | default(true)
  file:
    path: /etc/netdata/charts.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

# Inline rather than via netdata/template: charts.d collectors have no
# meaningful upstream config stub to seed from, and the helper's restart
# hook fires only on its own template-change, missing chart.sh / package
# changes that also need a daemon respawn.
- name: "charts_d | Install charts.d conf for {{ netdata_args.name }}"
  when: netdata_args.condition | default(true)
  vars:
    # default('') so the dynamic `action` resolves even when a caller gates
    # the whole charts_d import out (e.g. the x86_64-only hdparm collector
    # verify): ansible templates the module name to load its arg spec before
    # honoring `when:`, so an undefined netdata_args.conf here would
    # raise even though the task itself is skipped.
    _module: "{{ 'template' if (netdata_args.conf | default('')).endswith('.j2') else 'copy' }}"
  action: "{{ _module }}"
  args:
    src: "{{ netdata_args.conf }}"
    dest: /etc/netdata/charts.d/{{ netdata_args.name }}.conf
    owner: netdata
    group: netdata
    mode: "0644"
    backup: true
    validate: bash -n %s
  register: _netdata_charts_d_conf_result
  become: true

- name: "charts_d | Restart netdata for collector {{ netdata_args.name }}"
  when:
    - netdata_args.condition | default(true)
    - _netdata_charts_d_chart_sh.changed or _netdata_charts_d_conf_result.changed
  systemd:
    name: netdata
    state: restarted
  become: true
  register: _netdata_charts_d_restart_result

# netdata's Type=notify ExecStartPost signals READY=1 before the HTTP
# listener is up, so `state: restarted` returns "early" and an
# immediately-following `netdatacli reload-health` (which talks to the
# HTTP API) would race the listener coming up. netdata/main.yml installs
# an ExecStartPost drop-in that polls /api/v1/info to close that race;
# callers that invoke charts_d outside that flow (e.g. role _setup
# paths) need this uri probe as the equivalent backstop.
#
# Don't wait_for /run/netdata/netdata.pipe -- that named pipe is gone in
# netdata 1.46.x+ (netdatacli switched to HTTP-only), so it never appears
# and the wait would time out at 120s even on a perfectly healthy netdata.
# /api/v1/info is the functional check.
- name: charts_d | Wait for netdata HTTP API
  when:
    - netdata_args.condition | default(true)
    - _netdata_charts_d_restart_result.changed | default(false)
  uri:
    url: http://127.0.0.1:{{ service_ports.netdata }}/api/v1/info
    status_code: 200
  register: _netdata_charts_d_api_probe
  retries: 60
  delay: 2
  until: _netdata_charts_d_api_probe.status == 200
