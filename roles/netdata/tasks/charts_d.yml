# Install a charts.d.plugin shell collector. Drops the caller-provided
# script under /usr/libexec/netdata/charts.d/ and the caller-provided conf
# under /etc/netdata/charts.d/, then requests a netdata restart (restart.yml)
# when anything changed. remove.yml is the matching removal entry point.
#
# Inputs: caller passes a single dict `netdata_args` with keys
#   name        required; collector module name (e.g. 'hdparm'). Used as
#               the on-disk basename: charts.d/<name>.chart.sh and
#               charts.d/<name>.conf. charts.d.plugin discovers modules
#               by the <name>.chart.sh filename and sources the matching
#               <name>.conf before <name>_check.
#   script      required; file under caller's files/ to install as the
#               chart.sh. Always copied verbatim (no template form — chart
#               scripts shouldn't carry host-specific values; put those in
#               the conf instead).
#   conf        required; file under caller's files/ (or templates/, if the
#               name ends in .j2) to install as the charts.d conf.
#   condition   optional bool, default true; gates the whole call
#
# The whole dict is replaced at each call, so optional values cannot leak from
# a previous collector import.
- name: "charts_d | Install chart.sh for {{ netdata_args.name }}"
  when: netdata_args.condition | default(true)
  copy:
    src: "{{ netdata_args.script }}"
    dest: /usr/libexec/netdata/charts.d/{{ netdata_args.name }}.chart.sh
    owner: root
    group: root
    mode: "0755"
    backup: true
    validate: bash -n %s
  register: _netdata_charts_d_chart_sh
  become: true

# Inline rather than via config.yml so every charts.d conf, which the plugin
# sources as shell, gets the bash parse check.
- name: "charts_d | Install charts.d conf for {{ netdata_args.name }}"
  when: netdata_args.condition | default(true)
  vars:
    # default('') so the dynamic `action` resolves even when a caller gates
    # the whole charts_d import out (e.g. the x86_64-only hdparm collector
    # verify): ansible templates the module name to load its arg spec before
    # honoring `when:`, so an undefined netdata_args.conf here would
    # raise even though the task itself is skipped.
    _module: "{{ 'template' if (netdata_args.conf | default('')).endswith('.j2') else 'copy' }}"
  action: "{{ _module }}"
  args:
    src: "{{ netdata_args.conf }}"
    dest: /etc/netdata/charts.d/{{ netdata_args.name }}.conf
    owner: netdata
    group: netdata
    mode: "0644"
    backup: true
    validate: bash -n %s
  register: _netdata_charts_d_conf_result
  become: true

# charts.d.plugin reads collector scripts and confs only at start.
- name: "charts_d | Request a netdata restart for collector {{ netdata_args.name }}"
  when: _netdata_charts_d_chart_sh.changed or _netdata_charts_d_conf_result.changed
  set_fact:
    netdata_restart_needed: true
