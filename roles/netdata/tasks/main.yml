# Context and collector policies must stay explicit per host so an omitted
# monitoring surface fails closed. ZFS thresholds and disk-space overrides are
# optional and default empty.
- name: Require the per-host netdata context and collector inputs
  assert:
    that:
      - netdata_contexts is defined
      - netdata_collectors is defined
    fail_msg: >-
      netdata_contexts and netdata_collectors must be set in host_vars
      (per-host alert and presence-collector inputs). See host_vars/box.yml
      for the shape.
  tags:
    - netdata

- name: Require unique derived netdata context names
  vars:
    _netdata_context_names: >-
      {{ netdata_contexts
         | map('regex_replace', '[^a-zA-Z0-9_]', '_')
         | list }}
  assert:
    that:
      - >-
        (_netdata_context_names | unique | list | length)
        == (_netdata_context_names | length)
    fail_msg: >-
      netdata_contexts contains IDs that collapse to the same chart name after
      punctuation is replaced with underscores: {{ _netdata_context_names }}
  tags:
    - netdata

- name: Require valid expected netdata charts
  vars:
    _netdata_expected_chart_names: >-
      {{ netdata_expected_charts.keys()
         | map('regex_replace', '[^a-zA-Z0-9_]', '_')
         | list }}
  assert:
    that:
      - netdata_expected_charts is mapping
      - netdata_expected_charts.keys() | reject('equalto', '') | list | length == netdata_expected_charts | length
      - netdata_expected_charts.values() | reject('equalto', '') | list | length == netdata_expected_charts | length
      - >-
        (_netdata_expected_chart_names | unique | list | length)
        == (_netdata_expected_chart_names | length)
    fail_msg: >-
      netdata_expected_charts must map non-empty names to exact chart IDs, and
      its names must remain unique after punctuation is replaced with
      underscores: {{ netdata_expected_charts }}
  tags:
    - netdata

- name: Install netdata package
  import_tasks: install.yml
  tags:
    - netdata

- name: Configure netdata daemon
  import_tasks: configure.yml
  tags:
    - netdata

- name: Configure netdata alerts
  import_tasks: alerts.yml
  tags:
    - netdata

- name: Configure systemdunits metrics
  import_tasks: config.yml
  vars:
    netdata_args:
      src: systemdunits.conf
      dest: go.d/systemdunits.conf
      validate: python3 -c 'import yaml,sys; yaml.safe_load(open(sys.argv[1]))' "%s"
      condition: "{{ not (ansible_check_mode and (netdata_apt.changed or netdata_apt_source_changed)) }}"
  tags:
    - netdata

- name: Configure nginx
  import_role:
    name: nginx
    tasks_from: site
  vars:
    nginx_site_args:
      subdomain: netdata
      proxy_pass: http://127.0.0.1:{{ service_ports.netdata }}/
      # Browser access uses Authelia sessions. Homepage's machine poller sends
      # a dedicated Basic-auth service account to the same vhost; forward that
      # header only to Authelia, then strip it before netdata receives the API
      # request. The transition query asks for 10,000 records; a comparable
      # response measured 1.7 MiB on pug, so 4 MiB of proxy buffers keeps the
      # minute poll out of nginx temporary files. See notes/authelia_nginx_gating.md.
      auth: true
      auth_request_authorization: true
      location_conf: |
        proxy_buffer_size 16k;
        proxy_buffers 32 128k;
  tags:
    - netdata

- name: Configure apps.plugin process groups
  import_tasks: apps_groups.yml
  tags:
    - netdata

- name: Wire sibling-role metrics
  import_tasks: metrics.yml
  tags:
    - netdata

- name: Install netdata fluent-bit extension
  import_role:
    name: fluentbit
    tasks_from: extension
  vars:
    fluentbit_extension_args:
      name: netdata
  tags:
    - netdata
