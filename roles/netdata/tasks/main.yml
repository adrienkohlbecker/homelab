# Per-host alert/presence inputs. The alert templates iterate these
# without a default (context_liveness.conf.j2, zfs_alerts_override.conf.j2),
# so a host that forgets one fails the converge with a cryptic jinja
# "is undefined" rather than this actionable message. Empty dict/list is
# fine (box has no ZFS pools); only "set at all" is required.
- name: Require the per-host netdata alert/collector inputs to be defined
  assert:
    that:
      - netdata_contexts is defined
      - netdata_collectors is defined
      - netdata_zfspool_thresholds is defined
      - netdata_diskspace_blocklist is defined
    fail_msg: >-
      netdata_contexts, netdata_collectors, netdata_zfspool_thresholds and
      netdata_diskspace_blocklist must be set in host_vars (per-host alert +
      presence-collector inputs). See host_vars/box.yml for the shape.
  tags:
    - netdata

- name: Install netdata package
  import_role:
    name: netdata
    tasks_from: install
  tags:
    - netdata

- name: Configure netdata daemon
  import_tasks: configure.yml
  tags:
    - netdata

- name: Configure netdata alerts
  import_tasks: alerts.yml
  tags:
    - netdata

- name: Configure systemdunits metrics
  import_role:
    name: netdata
    tasks_from: config
  vars:
    netdata_args:
      src: systemdunits.conf
      dest: go.d/systemdunits.conf
      validate: python3 -c 'import yaml,sys; yaml.safe_load(open(sys.argv[1]))' "%s"
      condition: "{{ not (ansible_check_mode and (netdata_apt.changed or netdata_apt_repo.changed)) }}"
  tags:
    - netdata

- name: Setup shell for netdata user (for console troubleshooting)
  # Depends on the netdata user/group + /var/lib/netdata, all created by the
  # package; on a fresh host in check mode the package only "would" install,
  # so skip rather than fail chowning to a not-yet-existent user. Mirrors the
  # guard on "Add netdata to ssl-cert group" in install.yml.
  when: not (ansible_check_mode and netdata_apt.changed)
  file:
    path: /var/lib/netdata/.zshrc
    state: touch
    access_time: preserve
    modification_time: preserve
    # Owned by netdata, not root: netdata chowns /var/lib/netdata to itself
    # on startup, so a root-owned file here flips back to netdata every
    # converge (breaks idempotence) and can't durably resist the daemon
    # anyway.
    owner: netdata
    group: netdata
    mode: "0644"
  become: true
  tags:
    - netdata

- name: Configure nginx
  import_role:
    name: nginx
    tasks_from: site
  vars:
    nginx_site_args:
      subdomain: netdata
      proxy_pass: http://127.0.0.1:{{ service_ports.netdata }}/
      # Browser access uses Authelia sessions. Homepage's machine poller sends
      # a dedicated Basic-auth service account to the same vhost; forward that
      # header only to Authelia, then strip it before netdata receives the API
      # request. See notes/authelia_nginx_gating.md.
      auth: required
      auth_request_authorization: true
      location_conf: |
        proxy_buffer_size 16k;
        proxy_buffers 32 128k;
  tags:
    - netdata

- name: Configure apps.plugin process groups
  import_tasks: apps_groups.yml
  tags:
    - netdata

- name: Wire sibling-role metrics
  import_tasks: metrics.yml
  tags:
    - netdata
