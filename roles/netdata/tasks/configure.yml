# Daemon-configuration phase, imported by main.yml right after the
# package install: netdata.conf settings, cloud opt-out, the role's own go.d
# collectors and health alerts, telegram alerting, and the startup-readiness
# drop-in. Split out of main.yml for navigability.
# Only the load-bearing overrides are templated; netdata overlays the file on
# its compiled-in defaults, so this is deliberately not a wholesale netdata.conf
# (which would freeze the hundreds of auto-tuned [plugin:*] sections). The
# validate parses the rendered INI so a vault/jinja typo fails the converge
# rather than being silently accept-then-defaulted by the daemon.
- name: Configure netdata
  template:
    src: netdata.conf.j2
    dest: /etc/netdata/netdata.conf
    owner: netdata
    group: netdata
    mode: "0644"
    backup: true
    validate: python3 -c 'import configparser,sys; configparser.ConfigParser(strict=False, delimiters=("=",)).read(sys.argv[1])' "%s"
  register: netdata_conf
  become: true
  tags:
    - netdata

# charts.d.plugin auto-probes every bundled collector (libreswan, opensips,
# example, ...) on each start; on a host running none of those services each
# check() fails and logs a warning on a loop, and the absent file itself logs
# `charts.d.conf not found`. This authoritative copy disables the blanket
# auto-enable and force-enables only the fleet's own collectors (see the file).
# Plain copy, not the config helper: charts.d.conf is host-independent and has
# no go.d-style stock stub worth seeding from.
- name: Configure charts.d collectors
  copy:
    src: charts.d.conf
    dest: /etc/netdata/charts.d.conf
    owner: netdata
    group: netdata
    mode: "0644"
    backup: true
    validate: bash -n %s
  register: netdata_charts_d_conf
  become: true
  tags:
    - netdata

- name: Copy the cloud config
  copy:
    src: cloud.conf
    dest: /var/lib/netdata/cloud.d/cloud.conf
    owner: netdata
    group: netdata
    mode: "0660"
    backup: true
    validate: python3 -c 'import configparser,sys; configparser.ConfigParser(strict=False, delimiters=("=",)).read(sys.argv[1])' %s
  register: netdata_cloud_conf
  become: true
  tags:
    - netdata

# The opt-out above (enabled = no) does NOT disconnect an already-claimed
# agent: a host that still carries claim state in cloud.d/ reconnects ACLK to
# Netdata Cloud on every start regardless of the flag. Cloud then polls it
# remotely, and on 2.10.x that alert-transitions polling churns the metadata
# sqlite under lock contention (bloated meta DB, stalled reload-health, restarts
# that exceed the stop timeout). Remove any stale claim so the opt-out is real.
# Idempotent: absent on a never-claimed host, so this only acts if a claim
# reappears.
- name: Unclaim from Netdata Cloud
  file:
    path: "/var/lib/netdata/cloud.d/{{ item }}"
    state: absent
  loop:
    - claimed_id
    - private.pem
    - public.pem
  register: netdata_cloud_unclaim
  become: true
  tags:
    - netdata

# Drop-in override that blocks `systemctl start/restart netdata` on the HTTP
# API answering: netdata's Type=notify signals READY=1 before the listener is
# fully accepting connections, so a bare restart returns "early" and a
# following API consumer would race the listener coming up. Mirrors the podman
# --health-startup-cmd pattern.
- name: Install netdata service override
  import_role:
    name: systemd_unit
    tasks_from: install
  vars:
    systemd_unit_args:
      src: override.conf
      for: netdata.service
  tags:
    - netdata

- name: Install intel-gpu-tools
  when:
    - "'go.d:collector:intelgpu:intelgpu' in netdata_collectors"
    - ansible_architecture == "x86_64"
  apt:
    pkg: intel-gpu-tools
    cache_valid_time: 3600
  become: true
  tags:
    - netdata

- name: Ensure the netdata config directories exist
  when: netdata_package_ready
  file:
    path: /etc/netdata/{{ item }}
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - go.d
    - health.d
  become: true
  tags:
    - netdata

# The role's own go.d collector jobs and health.d alerts. Sibling roles install
# theirs through config.yml (metrics.yml). go.d jobs are YAML; health configs
# are a netdata-specific DSL with no offline parser, so only go.d/ validates.
- name: Configure go.d collectors and health alerts
  when:
    - netdata_package_ready
    - item.condition | default(true)
  vars:
    _netdata_yaml_validate: python3 -c 'import yaml,sys; yaml.safe_load(open(sys.argv[1]))' "%s"
  template:
    src: "{{ item.src }}"
    dest: /etc/netdata/{{ item.dest }}
    owner: netdata
    group: netdata
    mode: "{{ item.mode | default('0644') }}"
    backup: true
    validate: "{{ _netdata_yaml_validate if item.dest.startswith('go.d/') else omit }}"
  loop:
    - src: prometheus.conf.j2
      dest: go.d/prometheus.conf
      mode: "0600"
    - src: postfix.conf.j2
      dest: go.d/postfix.conf
    - src: docker.conf.j2
      dest: go.d/docker.conf
    - src: systemdunits.conf.j2
      dest: go.d/systemdunits.conf
    - src: sensors.conf.j2
      dest: go.d/sensors.conf
    - src: intelgpu.conf.j2
      dest: go.d/intelgpu.conf
      condition: "{{ 'go.d:collector:intelgpu:intelgpu' in netdata_collectors and ansible_architecture == 'x86_64' }}"
    - src: systemdunits_alerts.conf.j2
      dest: health.d/systemdunits.conf
    - src: gitlab_runner_alerts.conf.j2
      dest: health.d/gitlab_runner.conf
    - src: zfs_alerts_override.conf.j2
      dest: health.d/zfs_alerts_override.conf
    - src: postfix_alerts.conf.j2
      dest: health.d/postfix.conf
    - src: wireguard_alerts.conf.j2
      dest: health.d/wireguard.conf
    # keepalived lost-master alarm, fed by the keepalived_vrrp collector in
    # metrics.yml. Deployed only on the designated primary peer: a backup
    # normally has holds_vip=0, so the alarm there would be a permanent false
    # positive.
    - src: keepalived_vrrp_alerts.conf.j2
      dest: health.d/keepalived_vrrp.conf
      condition: "{{ netdata_keepalived_lost_master_alert }}"
    - src: disk_health_alerts.conf.j2
      dest: health.d/disk_health.conf
    - src: reboot_alerts.conf.j2
      dest: health.d/reboot.conf
    - src: timex_alerts.conf.j2
      dest: health.d/timex.conf
    - src: go_d_plugin_alerts.conf.j2
      dest: health.d/go.d.plugin.conf
  loop_control:
    label: "{{ item.dest }}"
  register: netdata_templates
  become: true
  tags:
    - netdata

# alarm-notify.sh reads this on every notification, so it needs no restart.
# Owner and mode keep the telegram bot token away from other users.
- name: Configure alarm notifications
  when: netdata_package_ready
  template:
    src: health_alarm_notify.conf.j2
    dest: /etc/netdata/health_alarm_notify.conf
    owner: root
    group: netdata
    mode: "0640"
    backup: true
    validate: bash -n %s
  become: true
  tags:
    - netdata

- name: Mount debugfs
  mount:
    path: /sys/kernel/debug
    src: /debugfs
    fstype: debugfs
    opts: defaults,noatime
    state: mounted
    backup: true
  register: netdata_debugfs_mount
  become: true
  tags:
    - netdata

- name: Request a netdata restart after daemon configuration changes
  when: >-
    [netdata_conf, netdata_charts_d_conf, netdata_cloud_conf,
     netdata_cloud_unclaim, netdata_service_d_override_conf_result,
     netdata_templates, netdata_debugfs_mount]
    | selectattr('changed') | list | length > 0
  set_fact:
    netdata_restart_needed: true
  tags:
    - netdata
