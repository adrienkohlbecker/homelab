- name: _setup | Install nginx
  import_role:
    name: nginx
    tasks_from: test_fixture
  vars:
    nginx_test_fixture_args:
      authelia_mode: gate

# Mirror the production prerequisites: Fluent Bit needs the earlier logrotate
# layer, and netdata validates its Fluent Bit extension with the real binary.
- name: _setup | Install logrotate
  import_role:
    name: logrotate
    tasks_from: main

- name: _setup | Install Fluent Bit
  import_role:
    name: fluentbit
    tasks_from: main

# Seed retired optional files before Netdata is installed. The production role
# must remove them and reload/restart the relevant subsystem on hosts where the
# corresponding feature is disabled.
- name: _setup | Create stale Netdata fixture directories
  file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /etc/netdata/health.d
    - /etc/netdata/charts.d
    - /usr/libexec/netdata/charts.d
  become: true

- name: _setup | Seed retired Netdata files
  when: item.enabled | default(true) | bool
  copy:
    dest: "{{ item.path }}"
    content: "{{ item.content }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - path: /etc/netdata/health.d/disks.conf
      content: "# stale disk-fill override fixture\n"
    - path: /etc/netdata/health.d/keepalived_vrrp.conf
      content: "# stale keepalived alert fixture\n"
      enabled: "{{ not netdata_keepalived_lost_master_alert }}"
    - path: /usr/libexec/netdata/charts.d/keepalived_vrrp.chart.sh
      content: "# stale keepalived collector fixture\n"
      enabled: "{{ not dns_vrrp_enabled }}"
    - path: /etc/netdata/charts.d/keepalived_vrrp.conf
      content: "# stale keepalived collector fixture\n"
      enabled: "{{ not dns_vrrp_enabled }}"
  loop_control:
    label: "{{ item.path }}"
  become: true

- name: _setup | Install Postfix collector fixture
  apt:
    pkg: postfix
    cache_valid_time: 3600
  become: true

- name: _setup | Create GitLab Runner metrics fixture directory
  file:
    path: /var/lib/netdata_test
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: _setup | Write initial GitLab Runner metrics fixture
  template:
    src: _gitlab_runner_metrics.prom.j2
    dest: /var/lib/netdata_test/gitlab_runner_metrics.prom
    owner: root
    group: root
    mode: "0644"
  vars:
    netdata_gitlab_runner_failure_count: 0
  become: true

- name: _setup | Serve GitLab Runner metrics fixture
  copy:
    dest: /etc/nginx/conf.d/netdata_gitlab_runner_metrics.conf
    owner: root
    group: root
    mode: "0644"
    backup: true
    content: |
      server {
          listen 127.0.0.1:{{ service_ports.gitlab_runner }};

          location = /metrics {
              default_type text/plain;
              alias /var/lib/netdata_test/gitlab_runner_metrics.prom;
          }
      }
  register: netdata_gitlab_runner_nginx_conf
  become: true

- name: _setup | Validate GitLab Runner metrics fixture
  when: netdata_gitlab_runner_nginx_conf.changed
  command: nginx -t
  changed_when: false
  become: true

- name: _setup | Reload nginx for GitLab Runner metrics fixture
  when: netdata_gitlab_runner_nginx_conf.changed
  systemd:
    name: nginx
    state: reloaded
  become: true

- name: _setup | Add keepalived VRRP loopback VIP fixture
  command: ip addr replace 198.51.100.10/32 dev lo
  changed_when: false
  become: true
