# Health-alert phase, imported by main.yml: the role's own health.d alert
# configs. Sibling roles install theirs through health.yml. Split out of
# main.yml for navigability.
- name: Ensure the netdata alert directory exists
  when: netdata_package_ready
  file:
    path: /etc/netdata/health.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true
  tags:
    - netdata

# Health configs are a netdata-specific DSL with no offline parser.
- name: Configure netdata alerts  # noqa: require-validate
  when:
    - netdata_package_ready
    - item.condition | default(true)
  template:
    src: "{{ item.src }}"
    dest: /etc/netdata/health.d/{{ item.dest }}
    owner: netdata
    group: netdata
    mode: "0644"
    backup: true
  loop:
    - src: systemdunits_alerts.conf.j2
      dest: systemdunits.conf
    - src: gitlab_runner_alerts.conf.j2
      dest: gitlab_runner.conf
    - src: zfs_alerts_override.conf.j2
      dest: zfs_alerts_override.conf
    - src: postfix_alerts.conf.j2
      dest: postfix.conf
    - src: wireguard_alerts.conf.j2
      dest: wireguard.conf
    # keepalived lost-master alarm, fed by the keepalived_vrrp collector in
    # metrics.yml. Deployed only on the designated primary peer: a backup
    # normally has holds_vip=0, so the alarm there would be a permanent false
    # positive.
    - src: keepalived_vrrp_alerts.conf.j2
      dest: keepalived_vrrp.conf
      condition: "{{ netdata_keepalived_lost_master_alert }}"
    - src: disk_health_alerts.conf.j2
      dest: disk_health.conf
    - src: fluentbit_alerts.conf.j2
      dest: fluentbit.conf
    - src: reboot_alerts.conf.j2
      dest: reboot.conf
    - src: timex_alerts.conf.j2
      dest: timex.conf
    - src: go_d_plugin_alerts.conf.j2
      dest: go.d.plugin.conf
  loop_control:
    label: "{{ item.dest }}"
  register: netdata_alerts
  become: true
  tags:
    - netdata

- name: Request a netdata restart after alert changes
  when: netdata_alerts.changed
  set_fact:
    netdata_restart_needed: true
  tags:
    - netdata
