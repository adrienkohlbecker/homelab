[Service]
# Drop exact routine daemon chatter at the unit boundary. Alert transitions
# into non-clear states and non-teardown parser failures remain in the journal.
LogFilterPatterns=~^Failed to prepare statement SQL_SELECT_HEALTH_LOG
LogFilterPatterns=~^Failed to execute \x27DROP TABLE
LogFilterPatterns=~^LISTENER: Cannot validate \x27localhost\x27
LogFilterPatterns=~^voltage sensor \x27[^\x27]+\x27 transitioned from state
LogFilterPatterns=~^temperature sensor \x27temperature_nct6798-isa-
LogFilterPatterns=~^ALERT .* raised from REMOVED to CLEAR[.]
LogFilterPatterns=~^main: started from \x27/usr/libexec/netdata/plugins[.]d/charts[.]d[.]plugin\x27 with options: 5
LogFilterPatterns=~^main: Configuration file \x27(/usr/lib/netdata/conf[.]d|/etc/netdata)/charts[.]d[.]conf\x27 loaded[.]
LogFilterPatterns=~^(example|libreswan|opensips): is disabled[.]
LogFilterPatterns=~^PARSER: read failed: POLLHUP[.]$
LogFilterPatterns=~^PARSER: thread cancelled while waiting for data[.]$
LogFilterPatterns=~^PLUGINSD: buffered reader not OK [(]-[0-9]+[)]$
LogFilterPatterns=~^Failed to delete socket [0-9]+ from nd_poll[(][)] - called from poll_events_cleanup[(][)] - is the socket already closed[?]$
LogFilterPatterns=~^stopped after [0-9]+ connects, [0-9]+ disconnects [(]max concurrent [0-9]+[)], [0-9]+ receptions and [0-9]+ sends[)]$

# Drop the vendor LogNamespace=netdata — it sends all netdata output to a
# separate journal namespace invisible to plain `journalctl -u netdata`.
LogNamespace=

# Opt out of netdata's anonymous telemetry at the daemon level (and for the
# anonymous-statistics.sh helpers it spawns, which inherit this env).
# Documented equivalent of the .opt-out-from-anonymous-statistics sentinel.
Environment=DO_NOT_TRACK=1

# Block service start until the HTTP API answers — netdata's stock
# Type=notify signals READY=1 before the listener is fully up, so a bare
# `systemctl start` returns "early" from a CLI consumer's POV and a
# downstream `netdatacli reload-health` then races the listener coming up.
# Mirrors the podman --health-startup-cmd pattern used in *.service.j2.
#
# --retry-connrefused treats the pre-bind ECONNREFUSED window as transient
# (plain --retry only covers HTTP/transport errors), so one curl replaces
# the old timeout+until+sleep shell loop. --retry-max-time 120 caps the
# total wait; --connect-timeout/--max-time bound each attempt.
# Use 127.0.0.1, not localhost: when a hostname resolves to multiple addresses
# (A + AAAA), curl considers "all addresses tried" as final and skips retries.
ExecStartPost=/usr/bin/curl --fail --silent --show-error --retry 240 --retry-connrefused --retry-delay 1 --retry-max-time 120 --connect-timeout 1 --max-time 5 -o /dev/null http://127.0.0.1:19999/api/v1/info
