# vim:ft=yaml
## All available configuration options, their descriptions and default values:
## https://github.com/netdata/netdata/tree/master/src/go/plugin/go.d/collector/postfix#readme

# The stock config declares several same-name platform fallbacks as
# auto-detected jobs. Pin the Ubuntu binary and keep retrying so a transient
# startup failure cannot permanently remove Postfix queue metrics.
jobs:
  - name: local
    binary_path: /usr/sbin/postqueue
    autodetection_retry: 60
