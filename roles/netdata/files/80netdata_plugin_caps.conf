// Re-spawn netdata plugins whose file capabilities a package run reapplied
// after the daemon restarted. The guard keeps apt working if the script is
// ever removed ahead of this file.
DPkg::Post-Invoke { "if [ -x /usr/local/sbin/netdata_restart_stale_plugins ]; then /usr/local/sbin/netdata_restart_stale_plugins; fi"; };
