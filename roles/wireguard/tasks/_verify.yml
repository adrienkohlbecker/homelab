---
# Behavior probes against the live wg interface. Only invoked by
# test/testrole.py against a qemu VM; never from site.yml or
# `mise run ansible --tags wireguard`.

# Roaming clients never converge (mise run wg:show renders their config), so
# their MTU and endpoint branches are the checks made on the rendered template.
- name: _verify | Roaming client config pins its MTU and dials both endpoint kinds
  vars:
    own_peer_name: laptop
    _wireguard_roaming_conf: "{{ lookup('template', 'wg.conf.j2') }}"
  assert:
    that:
      - "'MTU = 1280' in _wireguard_roaming_conf"
      - "('Endpoint = ' ~ wireguard_peers.lab.public_endpoint) in _wireguard_roaming_conf"
      - "('Endpoint = ' ~ wireguard_peers.fox.dynamic_endpoint) in _wireguard_roaming_conf"

# One `wg show wg0 dump` carries the whole live interface + peer table as
# tab-separated columns, so the scalar probes below parse a single register
# instead of re-invoking wg (and hand-parsing it) per attribute. Columns:
#   interface line: private-key  public-key  listen-port  fwmark
#   peer lines:     public-key  preshared-key  endpoint  allowed-ips
#                   latest-handshake  transfer-rx  transfer-tx  persistent-keepalive
- name: _verify | Dump live wg interface + peer state
  command: wg show wg0 dump
  register: wireguard_dump
  become: true
  changed_when: false

# Count equals all-peers-minus-self only because converge is server-only
# (main.yml asserts the host belongs to network.hosts), so the template includes every
# other peer; against a non-server converge it would be servers-only.
- name: _verify | Assert peer count matches wireguard_peers - 1
  assert:
    quiet: true
    that: wireguard_dump.stdout_lines[1:] | length == (wireguard_peers | length - 1)
    fail_msg: >-
      live peer count {{ wireguard_dump.stdout_lines[1:] | length }} !=
      wireguard_peers - 1 ({{ wireguard_peers | length - 1 }})

# The test inventory deliberately gives same-site server pom no public
# endpoint, so its live endpoint must come from network topology. Cross-site
# fox has a DNS name that nothing resolves yet: wg0 came up anyway, with no
# endpoint for fox, and a keepalive because it lists the Lab fixture in
# keepalive_from.
- name: _verify | Assert peer endpoints and fox keepalive
  vars:
    peer_fields: "{{ wireguard_dump.stdout_lines[1:] | map('split', '\t') | list }}"
    pom_peer_fields: "{{ peer_fields | selectattr('0', 'eq', wireguard_keys.pom.public_key) | list }}"
    fox_peer_fields: "{{ peer_fields | selectattr('0', 'eq', wireguard_keys.fox.public_key) | list }}"
    expected_pom_endpoint: "{{ network.hosts.pom.physical }}:{{ service_ports.wireguard }}"
  assert:
    quiet: true
    that:
      - pom_peer_fields | length == 1
      - pom_peer_fields[0][2] == expected_pom_endpoint
      - fox_peer_fields | length == 1
      - fox_peer_fields[0][2] == '(none)'
      - fox_peer_fields[0][7] == '25'
    fail_msg: >-
      pom endpoint {{ pom_peer_fields[0][2] | default('(missing)') }} (expected
      {{ expected_pom_endpoint }}); fox endpoint
      {{ fox_peer_fields[0][2] | default('(missing)') }} (expected none) with
      keepalive {{ fox_peer_fields[0][7] | default('(missing)') }} (expected 25)

- name: _verify | Re-resolve follows a DNS change on a peer with no live session
  vars:
    fox_name: "{{ wireguard_peers.fox.dynamic_endpoint.split(':')[0] }}"
    expected_pom_endpoint: "{{ network.hosts.pom.physical }}:{{ service_ports.wireguard }}"
  shell: |
    set -euo pipefail
    endpoint() { wg show wg0 endpoints | awk -v key="$1" '$1 == key { print $2 }'; }
    systemctl is-active wireguard_reresolve.timer

    echo "192.0.2.50 {{ fox_name }}" >> /etc/hosts
    systemctl start wireguard_reresolve.service
    test "$(endpoint '{{ wireguard_keys.fox.public_key }}')" = 192.0.2.50:51820

    sed -i "s/^192.0.2.50 /192.0.2.51 /" /etc/hosts
    systemctl start wireguard_reresolve.service
    test "$(endpoint '{{ wireguard_keys.fox.public_key }}')" = 192.0.2.51:51820

    test "$(endpoint '{{ wireguard_keys.pom.public_key }}')" = {{ expected_pom_endpoint }}
  args:
    executable: /bin/bash
  become: true
  changed_when: false

# A real peer in a namespace, with no keepalive, so only the script's own packet
# can start the handshake. Once the session is live a DNS change must not move
# it: that would break a peer reaching us through NAT.
- name: _verify | Re-resolve starts a handshake, then leaves the live session alone
  vars:
    own_address: "{{ network.hosts[inventory_hostname].wireguard }}"
  shell: |
    set -euo pipefail
    endpoint() { wg show wg0 endpoints | awk -v key="$1" '$1 == key { print $2 }'; }

    peer_key=$(wg genkey)
    peer_public=$(printf "%s" "$peer_key" | wg pubkey)
    ip netns add wgpeer
    ip link add wgpeer0 type veth peer name wgpeer1 netns wgpeer
    ip addr add 198.18.0.1/30 dev wgpeer0
    ip link set wgpeer0 up
    ip -n wgpeer addr add 198.18.0.2/30 dev wgpeer1
    ip -n wgpeer link set wgpeer1 up
    ip -n wgpeer link add wg1 type wireguard
    printf "%s" "$peer_key" | ip netns exec wgpeer wg set wg1 listen-port 51820 \
      private-key /dev/stdin peer "$(wg show wg0 public-key)" allowed-ips {{ own_address }}/32
    ip -n wgpeer addr add 198.18.1.2/32 dev wg1
    ip -n wgpeer link set wg1 up
    ip -n wgpeer route add {{ own_address }}/32 dev wg1

    wg set wg0 peer "$peer_public" allowed-ips 198.18.1.2/32
    ip route add 198.18.1.2/32 dev wg0
    echo "198.18.0.2 wireguard-peer.test" >> /etc/hosts
    echo "$peer_public wireguard-peer.test:51820 198.18.1.2" >> /etc/wireguard/wg0_dynamic_peers
    systemctl start wireguard_reresolve.service

    latest=0
    for _ in $(seq 1 10); do
      latest=$(wg show wg0 latest-handshakes | awk -v key="$peer_public" '$1 == key { print $2 }')
      if [ "$latest" != 0 ]; then
        break
      fi
      sleep 1
    done
    test "$latest" != 0
    test "$(endpoint "$peer_public")" = 198.18.0.2:51820

    sed -i "s/^198.18.0.2 /198.18.0.99 /" /etc/hosts
    systemctl start wireguard_reresolve.service
    test "$(endpoint "$peer_public")" = 198.18.0.2:51820
  args:
    executable: /bin/bash
  become: true
  changed_when: false

- name: _verify | Assert interface carries its topology address
  vars:
    own_address: "{{ network.hosts[inventory_hostname].wireguard }}"
  command: ip -4 -o addr show dev wg0
  register: wireguard_ip_addr
  become: true
  changed_when: false
  failed_when: ('inet ' ~ own_address ~ '/32') not in wireguard_ip_addr.stdout

- name: _verify | Assert preshared keys are loaded for every peer
  vars:
    psk_fields: "{{ wireguard_dump.stdout_lines[1:] | map('split', '\t') | map(attribute=1) | list }}"
  assert:
    quiet: true
    that: "'(none)' not in psk_fields"
    fail_msg: "preshared keys missing: {{ psk_fields }}"

# PersistentKeepalive is emitted per-pair (wg.conf.j2), only when the converging
# host appears in a peer's keepalive_from. Assert the live count of peers with a
# keepalive interval matches that membership -- guards the per-pair condition
# from regressing to per-peer (which would force a heartbeat on mobile peers).
# Only fox lists the Lab fixture, so the expected count is 1.
- name: _verify | Assert persistent-keepalive matches keepalive_from membership
  vars:
    expected_keepalive_count: "{{ wireguard_peers | dict2items | selectattr('value.keepalive_from', 'defined') | map(attribute='value.keepalive_from') | select('contains', inventory_hostname) | list | length }}"
    keepalive_on_count: "{{ wireguard_dump.stdout_lines[1:] | map('split', '\t') | map(attribute=7) | reject('eq', 'off') | list | length }}"
  assert:
    quiet: true
    that: keepalive_on_count | int == expected_keepalive_count | int
    fail_msg: >-
      keepalive-on count {{ keepalive_on_count }} != keepalive_from membership
      ({{ expected_keepalive_count }})

# Regression guard for the syncconf-vs-routes bug: every non-default peer
# AllowedIP must have a kernel route via the wg iface, else traffic to that
# peer's wg IP falls through the default route and is silently lost (handshakes
# still work). Excludes 0.0.0.0/0 + ::/0 (wg-quick fwmark/policy routing).
- name: _verify | Assert kernel routes exist for every peer AllowedIP
  shell: |
    set -euo pipefail
    missing=""
    cidrs=$(wg show wg0 allowed-ips | sed 's/\t/ /' | cut -d' ' -f2- \
            | tr ' ' '\n' | grep -E '/[0-9]+$' | grep -vxE '0\.0\.0\.0/0|::/0' | sort -u || true)
    for cidr in $cidrs; do
      ip route show "$cidr" dev wg0 | grep -q . || missing="$missing $cidr"
    done
    echo "missing_routes:$missing"
    test -z "$missing"
  args:
    executable: /bin/bash
  become: true
  changed_when: false
