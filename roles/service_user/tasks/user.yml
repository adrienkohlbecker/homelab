# `service_user_args` contract:
#   name          required system group/user name and config-dir basename
#   extra_groups  optional existing supplementary groups, default []
#   shared_group  optional existing supplementary/config-dir group
#   createhome    optional bool, default false
#   home          optional, default /nonexistent
#   shell         optional, default /usr/sbin/nologin
#   config_dir    optional bool, default true; false skips /mnt/services/<name>
#
# One dict replaces the complete input at each import, preventing optional
# values from an earlier call leaking into the next call at play-var scope.
#
# Publishes `<name>_user` with changed, name, config_group, uid, and gid. The
# fact key replaces non-identifier characters with `_` (foo-bar -> foo_bar_user).
# On a fresh host in check mode, uid/gid are undefined; gate consumers with
# `not ansible_check_mode or <name>_user.uid is defined` so a proper run does
# not silently skip work if the expected fact is missing.
- name: "Validate inputs for {{ service_user_args.name | default('<unset>') }}"
  assert:
    quiet: true
    that:
      - service_user_args.name is defined
      - service_user_args.name is string
      # name becomes the group/user name, the /mnt/services/<name> basename,
      # and (via ansible_var_key below) the <name>_user fact key, so keep it
      # inside the repo's service-name shape. Same guard as linger.
      - service_user_args.name is match('^[a-z_][a-z0-9_-]*$')
      - static_service_ids is defined and service_user_args.name in static_service_ids
      # Avoid materializing /nonexistent, a sentinel several system tools special-case.
      - not (service_user_args.createhome | default(false) | bool) or (service_user_args.home | default('/nonexistent')) != '/nonexistent'
    fail_msg: >-
      service_user_args needs name (a valid identifier matching
      [a-z_][a-z0-9_-]*) and a static id -- allocate
      {{ service_user_args.name | default('<unset>') }} in static_service_ids
      (group_vars/all/identities.yml) at the next free value per its header;
      createhome also needs a real home instead of /nonexistent.

- name: Resolve caller defaults for {{ service_user_args.name }}
  set_fact:
    service_user_resolved:
      name: "{{ service_user_args.name }}"
      id: "{{ static_service_ids[service_user_args.name] }}"
      extra_groups: >-
        {{
          (service_user_args.extra_groups | default([]))
          + ([service_user_args.shared_group] if service_user_args.shared_group is defined else [])
        }}
      createhome: "{{ service_user_args.createhome | default(false) }}"
      shell: "{{ service_user_args.shell | default('/usr/sbin/nologin') }}"
      home: "{{ service_user_args.home | default('/nonexistent') }}"
      config_dir: "{{ service_user_args.config_dir | default(true) }}"
      config_dir_group: "{{ service_user_args.shared_group | default(service_user_args.name) }}"

- name: "Add group {{ service_user_args.name }}"
  group:
    name: "{{ service_user_resolved.name }}"
    gid: "{{ service_user_resolved.id }}"
    system: true
  become: true

- name: "Add user {{ service_user_args.name }}"
  user:
    name: "{{ service_user_resolved.name }}"
    uid: "{{ service_user_resolved.id }}"
    group: "{{ service_user_resolved.name }}"
    groups: "{{ service_user_resolved.extra_groups }}"
    append: true
    createhome: "{{ service_user_resolved.createhome }}"
    system: true
    # nologin + system already lock the account; pin the password field to
    # '!' so the locked state is explicit and survives a future relaxation.
    password: "!"
    shell: "{{ service_user_resolved.shell }}"
    home: "{{ service_user_resolved.home }}"
  become: true
  register: service_user_result

# Capture the user record under a per-service fact so successive calls in
# the same play don't clobber a shared register, and so callers can
# reference {{ <name>_user.uid }} / .gid in their templates.
#
# The fact name is sanitized because ansible variable names must match
# [A-Za-z_][A-Za-z0-9_]*. Some upstream daemons hardcode hyphenated names.
# Same filter as systemd_unit's per-unit fact.
- name: Record user record for {{ service_user_args.name }}
  set_fact:
    "{{ service_user_resolved.name | ansible_var_key }}_user": >-
      {{
        {
          'changed': service_user_result.changed,
          'name': service_user_resolved.name,
          'config_group': service_user_resolved.config_dir_group
        }
        | combine(
            {'uid': service_user_result.uid, 'gid': service_user_result.group}
            if service_user_result.uid is defined and service_user_result.group is defined
            else {}
          )
      }}

# Stateless services (no config / no on-host state) opt out via
# config_dir: false. The helper still owns user/group/uid capture; callers
# that don't bind-mount /mnt/services/<svc> anywhere shouldn't be carrying
# an empty dir.
- name: Create configuration directory for {{ service_user_args.name }}
  when:
    - service_user_resolved.config_dir
    - not ansible_check_mode or service_user_result.uid is defined
  file:
    dest: /mnt/services/{{ service_user_resolved.name }}
    state: directory
    owner: "{{ service_user_resolved.name }}"
    group: "{{ service_user_resolved.config_dir_group }}"
    mode: "0750"
  become: true
