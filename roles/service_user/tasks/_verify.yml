# All scenarios run inside one block so the always: teardown removes every
# fixture even when a scenario asserts mid-way -- otherwise a failure on a
# --keep VM leaks service_user_test* users/groups/dirs that the next manual
# re-run then stats against stale state.
- name: _verify | All service_user scenarios
  become: true
  vars:
    # Resolve through a scoped registry rather than an id override so the
    # production static_service_ids lookup is exercised end-to-end.
    # Test-only values below systemd's DynamicUser allocation range. The
    # global-var shadow is deliberate, hence the var-naming noqa.
    static_service_ids: # noqa: var-naming[no-role-prefix]
      service_user_test: 61180
      service-user-test-hyphen: 61181
  block:
    - name: _verify | Provision a test service user
      import_role:
        name: service_user
        tasks_from: user
      vars:
        service_user_args:
          name: service_user_test

    - name: _verify | User record fact is exposed
      assert:
        that:
          - service_user_test_user is defined
          - service_user_test_user.name == 'service_user_test'
          - service_user_test_user.config_group == 'service_user_test'
          - service_user_test_user.uid == 61180
          - service_user_test_user.gid == 61180

    # Second scenario exercises every override plus hyphenated fact-key
    # sanitization (foo-bar -> foo_bar_user).
    - name: _verify | Create pre-existing groups for the override test
      group:
        name: "{{ item }}"
        system: true
      loop:
        - service_user_test_grp
        - service_user_test_extra_grp

    - name: _verify | Provision a hyphenated-name user with arg overrides
      import_role:
        name: service_user
        tasks_from: user
      vars:
        service_user_args:
          name: service-user-test-hyphen
          extra_groups:
            - service_user_test_extra_grp
          shared_group: service_user_test_grp
          home: /tmp/service-user-test-hyphen
          createhome: true
          shell: /bin/bash

    - name: _verify | Membership reflects shared_group
      command: id -nG service-user-test-hyphen
      register: _service_user_hyphen_groups
      changed_when: false

    - name: _verify | Read passwd database
      getent:
        database: passwd

    - name: _verify | Config dir honors shared_group
      stat:
        path: /mnt/services/service-user-test-hyphen
      register: _service_user_hyphen_dir

    - name: _verify | Override dir + membership attributes
      assert:
        that:
          - service_user_test_hyphen_user is defined
          - service_user_test_hyphen_user.name == 'service-user-test-hyphen'
          - service_user_test_hyphen_user.config_group == 'service_user_test_grp'
          - service_user_test_hyphen_user.uid == 61181
          - service_user_test_hyphen_user.gid == 61181
          # getent_passwd[user]: [password, uid, gid, gecos, home, shell]
          - ansible_facts.getent_passwd['service_user_test'][4] == '/nonexistent'
          - ansible_facts.getent_passwd['service_user_test'][5] == '/usr/sbin/nologin'
          # The primary group plus shared_group and extra_groups memberships
          # must all be present.
          - "'service-user-test-hyphen' in _service_user_hyphen_groups.stdout.split()"
          - "'service_user_test_grp' in _service_user_hyphen_groups.stdout.split()"
          - "'service_user_test_extra_grp' in _service_user_hyphen_groups.stdout.split()"
          - ansible_facts.getent_passwd['service-user-test-hyphen'][4] == '/tmp/service-user-test-hyphen'
          - ansible_facts.getent_passwd['service-user-test-hyphen'][5] == '/bin/bash'
          - _service_user_hyphen_dir.stat.exists
          - _service_user_hyphen_dir.stat.gr_name == 'service_user_test_grp'

  always:
    - name: _verify | Tear down test users
      user:
        name: "{{ item }}"
        state: absent
        remove: true
        force: true
      loop:
        - service_user_test
        - service-user-test-hyphen

    - name: _verify | Tear down test groups
      group:
        name: "{{ item }}"
        state: absent
      loop:
        - service_user_test
        - service-user-test-hyphen
        - service_user_test_grp
        - service_user_test_extra_grp

    - name: _verify | Tear down test config + home dirs
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /mnt/services/service_user_test
        - /tmp/service-user-test-hyphen
        - /mnt/services/service-user-test-hyphen
