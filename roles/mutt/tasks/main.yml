# Host-local neomutt viewer for the getmail Gmail "All Mail" archive. The
# getmail role fetches and owns the Maildir at /mnt/services/getmail (0700);
# this role installs neomutt + a curated read-only config so the operator can
# browse it from a shell on the host. Replaces the former webmail role (Dovecot
# + Roundcube + nginx + Authelia). Design: notes/archive/getmail_webmail_design.md.

# === neomutt archive viewer ====================================================
- name: Install neomutt, notmuch, and w3m
  apt:
    package:
      - neomutt
      - notmuch
      - w3m
    cache_valid_time: 3600
  become: true
  tags:
    - mutt

- name: Create /opt/mutt config directory
  file:
    path: /opt/mutt
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true
  tags:
    - mutt

# neomutt's header cache and notmuch's index live here (operator-owned, on the
# services dataset) so reopening/searching the multi-year archive doesn't
# re-parse every message, and nothing lands in the operator's
# dotfiles-managed $HOME.
- name: Create neomutt and notmuch state directories and archive mountpoint
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_user_id }}"
    group: "{{ ansible_user_id }}"
    mode: "0700"
  loop:
    - /mnt/services/mutt
    - /mnt/services/mutt/headers
    - /mnt/services/mutt/notmuch
    - /mnt/services/mutt/archive
  become: true
  tags:
    - mutt

- name: Install the HTML mailcap
  copy:
    src: mailcap
    dest: /opt/mutt/mailcap
    owner: root
    group: root
    mode: "0644"
    backup: true
  become: true
  tags:
    - mutt

- name: Configure notmuch archive index
  template:
    src: notmuch-config.j2
    dest: /opt/mutt/notmuch-config
    owner: root
    group: root
    mode: "0644"
    backup: true
    validate: /usr/bin/notmuch --config %s config list
  become: true
  tags:
    - mutt

- name: Install the mail-archive launcher
  copy:
    src: mail-archive
    dest: /usr/local/bin/mail-archive
    owner: root
    group: root
    mode: "0755"
    backup: true
    validate: bash -n %s
  become: true
  tags:
    - mutt

# The bind mount's source must already exist: getmail creates and owns this
# Maildir ahead of mutt in site.yml (and _setup stands it up for the harness).
# Assert it directly so a standalone `--tags mutt` run on an unconverged host
# fails with a clear precondition error rather than a confusing mount failure.
- name: Stat the getmail archive Maildir
  stat:
    path: /mnt/services/getmail/new
  register: _mutt_getmail_maildir
  tags:
    - mutt

- name: Assert the getmail archive Maildir exists
  when: not ansible_check_mode or _mutt_getmail_maildir.stat.exists
  assert:
    that:
      - _mutt_getmail_maildir.stat.exists
      - _mutt_getmail_maildir.stat.isdir
    fail_msg: >-
      /mnt/services/getmail is not a Maildir — the getmail role must converge
      before mutt (it creates and owns the archive this viewer binds read-only).
    quiet: true
  tags:
    - mutt

- name: Prime the notmuch archive index
  command: /usr/bin/notmuch --config /opt/mutt/notmuch-config new
  args:
    creates: /mnt/services/mutt/notmuch/xapian
  become: true
  become_user: "{{ ansible_user_id }}"
  when: not ansible_check_mode
  tags:
    - mutt

# Virtual-mailbox validation needs the notmuch config and initial index.
- name: Configure neomutt
  template:
    src: muttrc.j2
    dest: /opt/mutt/muttrc
    owner: root
    group: root
    mode: "0644"
    backup: true
    validate: neomutt -n -F %s -Q folder
  become: true
  tags:
    - mutt

- name: Schedule notmuch archive indexing
  import_role:
    name: systemd_timer
    tasks_from: install
  vars:
    systemd_timer_args:
      name: mutt_notmuch
      description: Index the getmail archive with notmuch
      # Runs after the 00:10 getmail timer's normal fetch window.
      on_calendar: "*-*-* 00:30:00"
      exec_start: /usr/bin/notmuch --config /opt/mutt/notmuch-config new
      run_as: "{{ ansible_user_id }}"
      timeout_start_sec: 30m
  tags:
    - mutt

# Hard read-only guard: neomutt browses the archive through a ro bind mount of
# the getmail Maildir (set as `folder` in muttrc), so a write physically cannot
# reach the archive even if -R is bypassed. getmail keeps writing the source
# path directly. The directory loop above creates the mountpoint first.

# Install via the systemd_unit helper: it validates the rendered unit with
# systemd-analyze verify in place (rolling back on a bad unit) and reloads the
# daemon. .mount is not a .service, so the helper's podman pre-pull steps no-op.
- name: Manage the read-only archive bind mount
  import_role:
    name: systemd_unit
    tasks_from: unit
  vars:
    systemd_unit_args:
      src: archive.mount.j2
      dest: mnt-services-mutt-archive.mount
  tags:
    - mutt
