- name: Set up media runtime
  import_role:
    name: media
    tasks_from: runtime
  tags:
    - profilarr

- name: Set up profilarr system user, group, and config dir
  import_role:
    name: service_user
    tasks_from: user
  vars:
    service_user_args:
      name: profilarr
  tags:
    - profilarr

- name: Check whether podman is installed
  stat:
    path: /usr/bin/podman
  register: profilarr_podman
  tags:
    - profilarr

- name: Pull profilarr image
  when: not ansible_check_mode or profilarr_podman.stat.exists
  containers.podman.podman_image:
    name: "{{ profilarr_image }}"
  register: profilarr_image_pull
  retries: 3
  delay: 10
  until: profilarr_image_pull is not failed
  become: true
  tags:
    - profilarr

- name: Install profilarr fluent-bit extension
  import_role:
    name: fluentbit
    tasks_from: extension
  vars:
    fluentbit_extension_args:
      name: profilarr
  tags:
    - profilarr

- name: Manage profilarr service
  import_role:
    name: systemd_unit
    tasks_from: unit
  vars:
    systemd_unit_args:
      src: profilarr.service.j2
      condition: "{{ not ansible_check_mode or profilarr_user.uid is defined }}"
      restart: "{{ profilarr_user.changed }}"
  tags:
    - profilarr

- name: Configure nginx
  import_role:
    name: nginx
    tasks_from: site
  vars:
    nginx_site_args:
      subdomain: profilarr
      proxy_pass: http://127.0.0.1:{{ service_ports.profilarr }}/
      auth: true
  tags:
    - profilarr
