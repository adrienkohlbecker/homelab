- name: Set up media runtime
  import_role:
    name: media
    tasks_from: runtime
  tags:
    - profilarr

- name: Set up profilarr system user, group, and config dir
  import_role:
    name: service_user
    tasks_from: user
  vars:
    service_user_args:
      name: profilarr
  tags:
    - profilarr

- name: Pull profilarr image
  import_role:
    name: podman
    tasks_from: image
  vars:
    podman_image_args:
      name: profilarr
      image: "{{ profilarr_image }}"
  tags:
    - profilarr

- name: Install profilarr fluent-bit extension
  import_role:
    name: fluentbit
    tasks_from: extension
  vars:
    fluentbit_extension_args:
      name: profilarr
  tags:
    - profilarr

- name: Manage profilarr service
  import_role:
    name: systemd_unit
    tasks_from: unit
  vars:
    systemd_unit_args:
      src: profilarr.service.j2
      condition: "{{ not ansible_check_mode or profilarr_user.uid is defined }}"
      restart: "{{ profilarr_user.changed }}"
  tags:
    - profilarr

- name: Configure nginx
  import_role:
    name: nginx
    tasks_from: site
  vars:
    nginx_site_args:
      subdomain: profilarr
      proxy_pass: http://127.0.0.1:{{ service_ports.profilarr }}/
      auth: true
  tags:
    - profilarr
