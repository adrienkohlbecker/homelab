# The test Authelia stub admits the auth_request subrequest, so /ping exercises
# Profilarr through its published loopback port and nginx proxy. Resolve the
# FQDN to loopback so SNI matches the served certificate.
- name: _verify | Map the profilarr vhost FQDN to loopback for SNI-correct probing
  lineinfile:
    path: /etc/hosts
    line: "127.0.0.1 profilarr.{{ inventory_hostname }}.{{ domain }}"
    state: present
  become: true

- name: _verify | Profilarr answers /ping through the nginx vhost
  uri:
    url: https://profilarr.{{ inventory_hostname }}.{{ domain }}/ping
    validate_certs: false
    timeout: 10

# Symlink-relocation probe -- proves the /config/profilarr.db symlink resolves
# onto the 4K sqlite dataset end-to-end (the reason the sqlite_dataset helper
# is wired in). A botched links: target or a clobbered symlink fails here
# rather than silently landing the DB + WAL on the wrong dataset.
- name: _verify | Profilarr DB symlink resolves onto the sqlite dataset
  stat:
    path: /mnt/services/profilarr/profilarr.db
    follow: false
  register: _profilarr_db_link
  failed_when: >-
    not _profilarr_db_link.stat.exists
    or not _profilarr_db_link.stat.islnk
    or _profilarr_db_link.stat.lnk_target != '/mnt/services/sqlite/profilarr/profilarr.db'
  become: true

# Ownership + content probe -- profilarr creates the DB as the in-container
# PUID/PGID, which must land as the host profilarr user; a PUID/PGID drift would
# write it under a different host uid silently. The size check proves the
# container wrote a real DB through the symlink, not the empty placeholder the
# sqlite_dataset helper pre-creates on a cold host (also profilarr-owned, so it
# would satisfy the ownership check alone). The world-readable assertion proves
# --env UMASK=027 took effect -- the DB holds every synced *arr instance's API
# key, so a silently-ignored UMASK (mode 0644) must fail here, not slip past the
# owner check. (stat no longer emits the roth boolean, so derive other-read from
# the mode's last octal digit: read bit set iff digit >= 4.)
- name: _verify | Profilarr SQLite DB is profilarr-owned, owner-private, non-empty
  stat:
    path: /mnt/services/sqlite/profilarr/profilarr.db
  register: _profilarr_db_owner
  failed_when: >-
    not _profilarr_db_owner.stat.exists
    or _profilarr_db_owner.stat.islnk
    or _profilarr_db_owner.stat.pw_name != 'profilarr'
    or (_profilarr_db_owner.stat.mode[-1] | int) >= 4
    or _profilarr_db_owner.stat.size == 0
  become: true

- name: _verify | Exercise profilarr fluent-bit record contracts
  import_role:
    name: fluentbit
    tasks_from: verify_extension
  vars:
    fluentbit_verify_args:
      name: profilarr
      records:
        - MESSAGE: "2099-01-02 03:04:05 - app.verify - INFO - profilarr-info\n"
          CONTAINER_TAG: profilarr
          SYSLOG_IDENTIFIER: conmon
          SYSTEMD_UNIT: profilarr.service
        - MESSAGE: "2099-01-02 03:04:06 - task_system - DEBUG - profilarr-debug\n"
          CONTAINER_TAG: profilarr
          SYSLOG_IDENTIFIER: conmon
          SYSTEMD_UNIT: profilarr.service
        - MESSAGE: "[2099-01-02 03:04:07 +0000] [42] [WARNING] profilarr-gunicorn\n"
          CONTAINER_TAG: profilarr
          SYSLOG_IDENTIFIER: conmon
          SYSTEMD_UNIT: profilarr.service
        - MESSAGE: "Starting application as user 1000:1000\n"
          CONTAINER_TAG: profilarr
          SYSLOG_IDENTIFIER: conmon
          SYSTEMD_UNIT: profilarr.service
        - MESSAGE: "2099-01-02 03:04:08 - app.verify - ERROR - must-not-parse\n"
          SYSLOG_IDENTIFIER: systemd
          SYSTEMD_UNIT: profilarr.service
        - MESSAGE: "2099-01-02 03:04:09 - apscheduler.scheduler - DEBUG - Looking for jobs to run profilarr-routine\n"
          CONTAINER_TAG: profilarr
          SYSLOG_IDENTIFIER: conmon
          SYSTEMD_UNIT: profilarr.service
      expected:
        - message: profilarr-info
          level: info
          service: profilarr
          fields.source: app.verify
          fields.parser_status: parsed
          _absent:
            - fields.profilarr_timestamp
            - fields.profilarr_level
            - fields.profilarr_message
        - message: profilarr-debug
          level: debug
          service: profilarr
          fields.source: task_system
          fields.parser_status: parsed
        - message: profilarr-gunicorn
          level: warn
          service: profilarr
          fields.source: gunicorn
          fields.parser_status: parsed
          _absent:
            - fields.profilarr_gunicorn_timestamp
            - fields.profilarr_gunicorn_pid
            - fields.profilarr_gunicorn_level
            - fields.profilarr_gunicorn_message
        - message: Starting application as user 1000:1000
          level: info
          service: profilarr
          _absent:
            - fields.parser_status
            - fields.source
        - message: 2099-01-02 03:04:08 - app.verify - ERROR - must-not-parse
          service: systemd
          _absent:
            - fields.parser_status
            - fields.source

- name: _verify | Routine repository-sync record is omitted from the aggregate
  assert:
    that: "'profilarr-routine' not in fluentbit_verify_result.stdout"
