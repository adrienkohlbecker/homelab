# The test Authelia stub admits the auth_request subrequest, so /ping exercises
# Profilarr through its published loopback port and nginx proxy. Resolve the
# FQDN to loopback so SNI matches the served certificate.
- name: _verify | Map the profilarr vhost FQDN to loopback for SNI-correct probing
  lineinfile:
    path: /etc/hosts
    line: "127.0.0.1 profilarr.{{ inventory_hostname }}.{{ domain }}"
    state: present
  become: true

- name: _verify | Profilarr answers /ping through the nginx vhost
  uri:
    url: https://profilarr.{{ inventory_hostname }}.{{ domain }}/ping
    validate_certs: false
    timeout: 10

# Profilarr must write through its PUID mapping, and its database contains the
# API keys of every synced instance, so the DB must not be world-readable.
- name: _verify | Profilarr SQLite DB is profilarr-owned and not world-readable
  stat:
    path: /mnt/services/profilarr/profilarr.db
  register: _profilarr_db_owner
  failed_when: >-
    _profilarr_db_owner.stat.pw_name != 'profilarr'
    or (_profilarr_db_owner.stat.mode[-1] | int) >= 4
  become: true

- name: _verify | Exercise profilarr fluent-bit record contracts
  import_role:
    name: fluentbit
    tasks_from: verify_extension
  vars:
    fluentbit_verify_args:
      name: profilarr
      records:
        - MESSAGE: "2099-01-02 03:04:06 - task_system - DEBUG - profilarr-debug\n"
          CONTAINER_TAG: profilarr
          SYSLOG_IDENTIFIER: conmon
          SYSTEMD_UNIT: profilarr.service
        - MESSAGE: "[2099-01-02 03:04:07 +0000] [42] [WARNING] profilarr-gunicorn\n"
          CONTAINER_TAG: profilarr
          SYSLOG_IDENTIFIER: conmon
          SYSTEMD_UNIT: profilarr.service
        - MESSAGE: "Starting application as user 1000:1000\n"
          CONTAINER_TAG: profilarr
          SYSLOG_IDENTIFIER: conmon
          SYSTEMD_UNIT: profilarr.service
        - MESSAGE: "2099-01-02 03:04:08 - app.verify - ERROR - must-not-parse\n"
          SYSLOG_IDENTIFIER: systemd
          SYSTEMD_UNIT: profilarr.service
      expected:
        - message: profilarr-debug
          level: debug
          service: profilarr
          fields.source: task_system
          fields.parser_status: parsed
          _absent:
            - fields.profilarr_timestamp
            - fields.profilarr_level
            - fields.profilarr_message
        - message: profilarr-gunicorn
          level: warn
          service: profilarr
          fields.source: gunicorn
          fields.parser_status: parsed
          _absent:
            - fields.profilarr_timestamp
            - fields.profilarr_gunicorn_pid
            - fields.profilarr_level
            - fields.profilarr_message
        - message: Starting application as user 1000:1000
          level: info
          service: profilarr
          _absent:
            - fields.parser_status
            - fields.source
        - message: 2099-01-02 03:04:08 - app.verify - ERROR - must-not-parse
          service: systemd
          _absent:
            - fields.parser_status
            - fields.source
