parsers:
  - name: profilarr_python
    format: regex
    regex: '/\A(?<profilarr_timestamp>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}) - (?<profilarr_source>.+?) - (?<profilarr_level>DEBUG|INFO|WARNING|ERROR|CRITICAL) - (?<profilarr_message>[\s\S]*?)[[:space:]]*\z/'
  - name: profilarr_gunicorn
    format: regex
    regex: '/\A\[(?<profilarr_timestamp>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2} [+-]\d{4})\] \[(?<profilarr_gunicorn_pid>\d+)\] \[(?<profilarr_level>DEBUG|INFO|WARNING|ERROR|CRITICAL)\] (?<profilarr_message>[\s\S]*?)[[:space:]]*\z/'

pipeline:
  filters:
    - name: modify
      match: svc.profilarr.service
      condition: key_exists CONTAINER_TAG
      rename: MESSAGE log
    - name: parser
      match: svc.profilarr.service
      key_name: log
      parser: profilarr_python
      reserve_data: true
      preserve_key: true
    - name: parser
      match: svc.profilarr.service
      key_name: log
      parser: profilarr_gunicorn
      reserve_data: true
      preserve_key: true
    - name: modify
      match: svc.profilarr.service
      condition:
        - key_exists CONTAINER_TAG
        - key_exists profilarr_gunicorn_pid
      add: profilarr_source gunicorn
    - name: modify
      match: svc.profilarr.service
      condition:
        - key_exists CONTAINER_TAG
        - key_exists profilarr_message
        - key_exists profilarr_level
        - key_exists profilarr_source
      hard_rename:
        - profilarr_message log
        - profilarr_level _level
        - profilarr_source source
      remove:
        - profilarr_timestamp
        - profilarr_gunicorn_pid
      set: parser_status parsed
