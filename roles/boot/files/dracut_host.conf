# Installed systems keep the drivers and configuration for their own hardware.
# Sloppy host-only mode still includes the NVMe, VMD, virtio and USB storage
# drivers; other controllers (ahci, SAS HBAs) only when present at build time.
# Before moving rpool to another controller family, follow the storage
# controller change in notes/runbooks/zbm-recovery.md.
hostonly="yes"
hostonly_mode="sloppy"
# Host sysctl and modules-load files are snapshots refreshed with image builds.
# Real-root changes do not rebuild them; see notes/runbooks/panic.md.
# Keep root selection in ZFSBootMenu rather than baking it into the image.
hostonly_cmdline="no"

# The initial chroot build is generic, but must carry local module options.
install_optional_items+=" /etc/modprobe.d/*.conf "
mdadmconf="yes"

# ZFSBootMenu can leave a nonempty cache containing only non-root pools.
# Let the native ZFS scan discover the root pool instead of trusting that cache.
remove_items+=" /etc/zfs/zpool.cache "

# Panic escalation starts in the real root, so a slow root-pool import cannot
# trip the hung-task panic.
remove_items+=" /etc/sysctl.d/30-panic.conf "

# --regenerate-all builds each installed kernel's image concurrently.
parallel="yes"
