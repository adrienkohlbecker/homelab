# Installed systems keep the drivers and configuration for their own hardware.
hostonly="yes"
# Host sysctl and modules-load files are snapshots refreshed with image builds.
# Real-root changes do not rebuild them; see notes/runbooks/kdump.md.
# Keep root selection in ZFSBootMenu rather than baking it into the image.
hostonly_cmdline="no"

# The initial chroot build is generic, but must carry local module options.
install_optional_items+=" /etc/modprobe.d/*.conf "
mdadmconf="yes"

# ZFSBootMenu can leave a nonempty cache containing only non-root pools.
# Let the native ZFS scan discover the root pool instead of trusting that cache.
remove_items+=" /etc/zfs/zpool.cache "

# Panic escalation starts in the real root, after the capture loader can run.
remove_items+=" /etc/sysctl.d/30-kdump.conf "
