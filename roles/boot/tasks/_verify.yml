# Functional checks for the boot role. The converge proves the tasks exit-code
# cleanly; these assert the end-state they're responsible for.
#
# Reboot first so /proc/cmdline reflects the role's writes. Same pattern as
# console/_verify.yml. The non-GRUB aarch64 fixture bypasses ZBM, so the command
# line staged outside this role cannot reflect its writes yet.

- name: _verify | Reboot to apply boot-chain changes
  import_role:
    name: reboot
    tasks_from: reboot

# The hold blocks apt from installing an absent grub package, while the dpkg
# check below confirms none was installed during converge.
- name: _verify | Grub package family was held
  when: not grub_bootloader
  command: apt-mark showhold 'grub*'
  changed_when: false
  register: _boot_verify_grub_hold
  failed_when: "'grub-common' not in _boot_verify_grub_hold.stdout_lines"
  become: true

- name: _verify | Dpkg install status for grub*
  when: not grub_bootloader
  command: dpkg-query -W -f='${binary:Package} ${db:Status-Status}\n' 'grub*'
  changed_when: false
  register: _boot_verify_grub_status
  failed_when: >-
    _boot_verify_grub_status.stdout_lines
    | select('search', '\\sinstalled$')
    | list | length > 0
  become: true

# A masked unit cannot be started, whether or not its package is installed.
- name: _verify | Unused multipath monitor refuses to start # noqa: command-instead-of-module
  when: zfs_root | bool
  command: systemctl start multipathd.service
  register: _boot_verify_multipathd
  changed_when: false
  failed_when: >-
    _boot_verify_multipathd.rc == 0
    or 'is masked' not in _boot_verify_multipathd.stderr
  become: true

- name: _verify | Exercise the all-kernel GRUB command-line scope
  when: grub_bootloader
  block:
    - name: _verify | Install an all-kernel command-line contribution
      import_role:
        name: boot
        tasks_from: cmdline
      vars:
        boot_cmdline_args:
          name: _verify_all_scope
          contents: verify_scope=all
          grub_scope: all

    - name: _verify | Read the all-kernel GRUB fragment
      slurp:
        src: /etc/default/grub.d/99-_verify_all_scope.cfg
      register: _boot_verify_all_scope
      become: true

    - name: _verify | All-kernel scope selected GRUB_CMDLINE_LINUX
      assert:
        that:
          - (_boot_verify_all_scope.content | b64decode).startswith('GRUB_CMDLINE_LINUX=')
          - "'verify_scope=all' in (_boot_verify_all_scope.content | b64decode)"

  always:
    - name: _verify | Remove the all-kernel command-line contribution
      import_role:
        name: boot
        tasks_from: cmdline
      vars:
        boot_cmdline_args:
          name: _verify_all_scope
          contents: ""
          grub_scope: all

# Noble keeps its broad driver policy. Resolute's host-only image is exercised
# by the normal-boot reboot check above and the NVMe driver check below.
- name: _verify | Find the host initramfs (cloud images may boot initrd-less)
  stat:
    path: /boot/initrd.img-{{ ansible_kernel }}
  register: _boot_verify_initrd
  become: true

- name: _verify | Boot image carries non-virtio drivers (ahci/e1000)
  # Skipped where the host boots without an initramfs at all (the arm64 cloud
  # fixture has no /boot/initrd.img to inspect).
  when:
    - not initramfs_use_dracut
    - _boot_verify_initrd.stat.exists
  shell:
    cmd: >-
      set -euo pipefail;
      lsinitramfs /boot/initrd.img-{{ ansible_kernel }} | grep -E '/(ahci|e1000)\.ko' >/dev/null
    executable: /bin/bash
  changed_when: false
  become: true

# The shared Dracut policy keeps the pool cache out of every image (kdump's
# verify covers its panic policy exclusion). Rebuild so the archive reflects the
# host-only policy. A ZFS-root fixture must already have a nonempty cache, or
# its absence from the image would prove nothing.
- name: _verify | Exercise the Dracut image exclusions
  when:
    - initramfs_use_dracut
    - _boot_verify_initrd.stat.exists
  block:
    - name: _verify | ZFS-root fixture has a nonempty pool cache
      when: zfs_root
      stat:
        path: /etc/zfs/zpool.cache
      register: _boot_verify_zpool_cache
      failed_when: not _boot_verify_zpool_cache.stat.exists or _boot_verify_zpool_cache.stat.size == 0
      become: true

    - name: _verify | Rebuild boot images
      command: '{{ initramfs_rebuild_command }}'
      changed_when: true
      become: true

    - name: _verify | Image carries the boot modules but not the pool cache
      command: lsinitrd /boot/initrd.img-{{ ansible_kernel }}
      register: _boot_verify_dracut_files
      changed_when: false
      failed_when: >-
        (zfs_root and 'zfs' not in _boot_verify_dracut_files.stdout_lines)
        or _boot_verify_dracut_files.stdout is search('(?m)\setc/zfs/zpool\.cache$')
      become: true

    # Sloppy host-only mode keeps the NVMe and Intel VMD drivers even on this
    # virtio-only fixture, so a board swap that keeps rpool on NVMe still boots.
    - name: _verify | Host-only image keeps the NVMe root drivers
      when: zfs_root
      assert:
        that:
          - _boot_verify_dracut_files.stdout is search('(?m)/nvme\.ko(\.(zst|xz|gz))?$')
          - >-
            ansible_architecture != 'x86_64'
            or _boot_verify_dracut_files.stdout is search('(?m)/vmd\.ko(\.(zst|xz|gz))?$')

# The 'default' fragment carries the base console args. On test VMs (qemu) this
# includes earlycon + serial for harness output capture; on prod (no legacy UART)
# it's just console=tty0.
- name: _verify | Read the assembled ZBM commandline
  when: not grub_bootloader
  command: zfs get -H -o value org.zfsbootmenu:commandline rpool/ROOT
  register: _boot_verify_cmdline
  changed_when: false
  failed_when: >-
    _boot_verify_cmdline.rc != 0
    or 'console=tty0' not in _boot_verify_cmdline.stdout
    or (_console_serial | trim | length > 0
        and _console_serial | trim not in _boot_verify_cmdline.stdout)
  become: true

# /proc/cmdline exposes the args the running kernel actually booted with.
# Post-reboot this proves the ZBM property propagated through the boot chain,
# not just that the ZFS property was set.
- name: _verify | Read the running kernel's cmdline
  when: not grub_bootloader
  slurp:
    src: /proc/cmdline
  register: _boot_verify_proc_cmdline
  failed_when: >-
    _boot_verify_proc_cmdline is failed
    or 'console=tty0' not in (_boot_verify_proc_cmdline.content | b64decode)
    or 'earlycon=' not in (_boot_verify_proc_cmdline.content | b64decode)
  become: true

# --- EFI NVRAM boot entries ---

- name: _verify | EFI entries are converged
  when: not grub_bootloader
  script:
    cmd: efi_entries.py --check
    executable: /usr/bin/python3
  environment:
    BOOT_EFI_ENTRIES: "{{ boot_efi_entries | to_json }}"
    # Skip timeout: QEMU OVMF does not persist BootTimeout across reboots,
    # so the post-reboot check would always drift. Converge + idempotence
    # already prove the timeout is applied within a session.
    BOOT_EFI_TIMEOUT: "null"
  changed_when: false
  become: true
  register: _boot_verify_efi

- name: _verify | No EFI entry drift
  when: not grub_bootloader
  vars:
    _efi_result: "{{ _boot_verify_efi.stdout | from_json }}"
  assert:
    that: not _efi_result.changed
    fail_msg: >-
      EFI boot entries need changes: {{ _efi_result.actions | join(', ') }}

# The first managed entry must name the arch's rEFInd binary on the ESP, or the
# firmware falls through to the next entry. Ansible keeps both backslashes of
# the Jinja literal, so the regex matches one backslash.
- name: _verify | First EFI entry loader exists on the ESP
  when: not grub_bootloader
  stat:
    path: '/boot/efi{{ boot_efi_entries[0].loader | regex_replace("\\", "/") }}'
  register: _boot_verify_loader
  failed_when: not _boot_verify_loader.stat.exists
  become: true

# --- /tmp mount ---

# tmpfs /tmp -- enabled by tasks/main.yml, applied at the reboot above. Assert
# both the next-boot intent (is-enabled, every machine) and, where we actually
# rebooted, the live end-state (/tmp is really tmpfs) rather than just intent.
- name: _verify | Tmp.mount is enabled # noqa: command-instead-of-module
  command: systemctl is-enabled tmp.mount
  changed_when: false
  become: true
  register: _boot_verify_tmp_enabled
  failed_when: _boot_verify_tmp_enabled.stdout not in ['enabled', 'enabled-runtime', 'static']

- name: _verify | Read /tmp filesystem type
  command: findmnt -no FSTYPE -T /tmp
  changed_when: false
  become: true
  register: _boot_verify_tmp_fstype
  failed_when: >-
    _boot_verify_tmp_fstype.rc != 0
    or _boot_verify_tmp_fstype.stdout | trim != 'tmpfs'
