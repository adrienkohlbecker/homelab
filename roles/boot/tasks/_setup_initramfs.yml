# A fresh Resolute bake already carries the new policy. Recreate the provider
# transition so tag-limited callers must configure Dracut before installing it.
- name: _setup_initramfs | Restore the initramfs-tools migration source
  when: ansible_distribution_release == 'resolute'
  apt:
    pkg: "{{ ['initramfs-tools'] + (['zfs-initramfs'] if zfs_root else []) }}"
    cache_valid_time: 3600
    policy_rc_d: 101
  become: true

- name: _setup_initramfs | Remove the baked Dracut configuration
  when: ansible_distribution_release == 'resolute'
  file:
    path: '{{ item }}'
    state: absent
  loop:
    - /etc/dracut.conf.d/90_portable.conf
    - /etc/dracut.conf.d/90_host.conf
  become: true
