# Shared kernel-cmdline engine. A feature role contributes one named fragment:
#
#   import_role: { name: boot, tasks_from: cmdline }
#   vars:
#     boot_cmdline_args:
#       name: <fragment>   # /etc/zfsbootmenu/<name>
#       contents: <args>   # '' removes the fragment
#
# The engine reassembles every fragment, in name order, into rpool/ROOT's
# org.zfsbootmenu:commandline property, which ZFSBootMenu passes to the kernel
# it boots, and touches /var/run/reboot-required on change so the site.yml
# reboot check applies the new cmdline. It publishes no result.
#
# Every host boots rEFInd -> ZFSBootMenu from a ZFS root. Without one
# (zfs_root false, as on the GRUB-booted minimal fixture) the engine is a
# no-op, so callers import it unconditionally.

- name: cmdline | Validate inputs ({{ boot_cmdline_args.name }})
  assert:
    that:
      - boot_cmdline_args is defined
      - boot_cmdline_args.name is defined
      - boot_cmdline_args.contents is defined
    fail_msg: boot_cmdline_args requires 'name' and 'contents'.

- name: cmdline | Deliver the fragment through ZFSBootMenu
  when: zfs_root | bool
  become: true
  block:
    - name: cmdline | Create zfsbootmenu etc directory
      file:
        dest: /etc/zfsbootmenu
        state: directory
        owner: root
        group: root
        mode: "0755"
      register: boot_cmdline_zbm_directory

    - name: cmdline | Write fragment ({{ boot_cmdline_args.name }})  # noqa: require-validate
      when:
        - boot_cmdline_args.contents | length > 0
        - not (ansible_check_mode and boot_cmdline_zbm_directory.changed)
      copy:
        dest: /etc/zfsbootmenu/{{ boot_cmdline_args.name }}
        content: "{{ boot_cmdline_args.contents }}\n"
        mode: "0644"
        owner: root
        group: root
        backup: true
      register: boot_cmdline_zbm_present

    - name: cmdline | Remove fragment ({{ boot_cmdline_args.name }})
      when: boot_cmdline_args.contents | length == 0
      file:
        path: /etc/zfsbootmenu/{{ boot_cmdline_args.name }}
        state: absent
      register: boot_cmdline_zbm_absent

    - name: cmdline | Assemble ZFSBootMenu command line
      when: >-
        not (ansible_check_mode and
             (boot_cmdline_zbm_directory is changed
              or boot_cmdline_zbm_present is changed
              or boot_cmdline_zbm_absent is changed))
      block:
        - name: cmdline | Get fragments
          find:
            paths: /etc/zfsbootmenu
            file_type: file
            patterns: '^[a-z][a-z0-9_-]*$'
            use_regex: true
          register: boot_cmdline_files

        - name: cmdline | Read fragments
          slurp:
            src: "{{ item }}"
          loop: "{{ boot_cmdline_files.files | sort(attribute='path') | map(attribute='path') }}"
          register: boot_cmdline_slurped

        - name: cmdline | Set commandline
          zfs:
            name: rpool/ROOT
            state: present
            extra_zfs_properties:
              'org.zfsbootmenu:commandline': "{% for f in boot_cmdline_slurped.results %}{{ f['content'] | b64decode | replace('\n', ' ') | trim }}{% if not loop.last %} {% endif %}{% endfor %}"
          register: boot_cmdline_properties

    - name: cmdline | Ask to reboot ({{ boot_cmdline_args.name }})
      when: >-
        boot_cmdline_zbm_present is changed
        or boot_cmdline_zbm_absent is changed
        or boot_cmdline_properties is changed
      file:
        path: /var/run/reboot-required
        state: touch
        owner: root
        group: root
        mode: "0644"
