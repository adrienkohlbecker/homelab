# Cross-cutting boot setup. This role owns the kernel-cmdline engine
# (tasks/cmdline.yml, imported by zfs/console to contribute a fragment to
# whichever bootloader the host uses) plus the boot-chain config below that no
# feature role owns. site.yml runs the role on the ZBM hosts; tasks specific to
# ZBM skip on grub hosts.
# Bootloader install + image staging stay owned by the refind role;
# disk/ESP creation stays one-time bootstrap, while this role owns its mount
# policy.

# We boot via rEFInd -> ZFSBootMenu, never grub. linux-generic Recommends a
# grub-* alternation; hold the whole grub family, including packages not yet
# installed, so a later kernel upgrade cannot pull it in.
- name: Hold grub packages
  when: not grub_bootloader
  command: apt-mark hold 'grub*'
  register: boot_grub_hold
  changed_when: >-
    boot_grub_hold.stdout_lines
    | reject('search', ' was already set on hold')
    | list | length > 0
  become: true
  tags:
    - boot

- name: Configure the boot image provider
  import_tasks: initramfs_provider.yml
  tags:
    - boot

# fsck.vfat (ESP integrity) + mkdosfs. The ESP itself is created at bootstrap,
# but the tooling belongs with the role that owns the boot chain.
- name: Install ESP filesystem tools
  apt:
    package:
      - dosfstools
      - efibootmgr
    cache_valid_time: 3600
  become: true
  tags:
    - boot

- name: Read the configured ESP mount
  command: findmnt --fstab --noheadings --output SOURCE,FSTYPE --target /boot/efi
  register: boot_esp_fstab
  changed_when: false
  failed_when: false
  check_mode: false
  become: true
  tags:
    - boot

- name: Assert the ESP has a vfat fstab entry
  assert:
    that:
      - boot_esp_fstab.rc == 0
      - boot_esp_fstab.stdout.split() | length == 2
      - boot_esp_fstab.stdout.split()[1] == "vfat"
    fail_msg: >-
      boot requires an existing vfat /boot/efi entry in /etc/fstab; got
      rc={{ boot_esp_fstab.rc }},
      entry={{ boot_esp_fstab.stdout | default("") | trim | default("<none>", true) }}.
  tags:
    - boot

- name: Mount the ESP root-only
  mount:
    path: /boot/efi
    src: "{{ boot_esp_fstab.stdout.split()[0] }}"
    fstype: vfat
    opts: "{{ boot_esp_mount_opts }}"
    state: mounted
    backup: true
  become: true
  tags:
    - boot

# These units are useful only when the host has LVM or multipath state to
# monitor. The packages may remain installed as dependencies, so mask the
# systemd entry points instead of purging shared storage tooling. Masking also
# covers units that are not installed, and a running monitor stops at the next
# boot.
- name: Mask unused LVM and multipath monitor units
  when: zfs_root | bool
  systemd:
    name: "{{ item }}"
    masked: true
  loop:
    - lvm2-monitor.service
    - lvm2-lvmpolld.service
    - dm-event.service
    - multipathd.service
    - lvm2-lvmpolld.socket
    - dm-event.socket
    - multipathd.socket
  become: true
  tags:
    - boot

# Base kernel console args — the twin of the `zfs set` in chroot.sh, reproduced
# so the cmdline engine doesn't silently drop them on every converge. tty0 keeps
# VGA output. The earlycon + serial args come from _console_cmdline (group_vars),
# which selects the arch-specific QEMU UART on test VMs and boot_serial_console
# on real hardware (unset on lab/pug, which have no UART).
- name: Set the base console command line
  when: not grub_bootloader
  import_role:
    name: boot
    tasks_from: cmdline
  vars:
    boot_cmdline_args:
      name: default
      contents: "{{ _console_cmdline }}"
  tags:
    - boot

# NVRAM boot entries — managed after the boot-chain config above is in place.
# Firmware points at boot loaders on the ESP; per-loader config carries the
# loader-specific kernel command line.
- name: Manage EFI boot entries
  when: not grub_bootloader
  import_tasks: efi_entries.yml
  tags:
    - boot

# tmpfs /tmp -- the twin of chroot.sh's tmp.mount enablement in the baked image,
# reproduced so an ansible-from-stock-Ubuntu host gets the same RAM-backed /tmp
# (it pages out to swap under pressure). Resolute's systemd ships and
# pre-enables /usr/lib/systemd/system/tmp.mount with the same size, mode, and
# ordering, so this only acts on Noble, where the unit is a disabled template
# under /usr/share/systemd/.
- name: Probe for the systemd tmp.mount template
  stat:
    path: /usr/share/systemd/tmp.mount
  register: boot_tmp_mount_template
  become: true
  tags:
    - boot

# Link the template, as `systemctl enable /usr/share/systemd/tmp.mount` would,
# so the unit follows package updates. force replaces a copied unit file.
- name: Link tmp.mount to the systemd template
  when: boot_tmp_mount_template.stat.exists
  file:
    src: /usr/share/systemd/tmp.mount
    dest: /etc/systemd/system/tmp.mount
    state: link
    force: true
  register: boot_tmp_mount_linked
  become: true
  tags:
    - boot

- name: Reload systemd for the linked tmp.mount
  when: boot_tmp_mount_linked.changed and not ansible_check_mode
  systemd:
    daemon_reload: true
  become: true
  tags:
    - boot

- name: Enable tmpfs /tmp via tmp.mount
  # In check mode on a fresh host the link above only *reports* it would be
  # created, so systemd can't find the unit to enable. Skip enabling when the
  # unit is merely pending -- the link task already covers the diff.
  when: not (ansible_check_mode and boot_tmp_mount_linked.changed | default(false))
  systemd:
    name: tmp.mount
    enabled: true
  register: boot_tmp_mount
  become: true
  tags:
    - boot

# Enabling only takes effect at the next boot: a live /tmp can't be remounted.
- name: Ask to reboot after enabling tmp.mount
  when: boot_tmp_mount.changed
  file:
    path: /var/run/reboot-required
    state: touch
    owner: root
    group: root
    mode: "0644"
  become: true
  tags:
    - boot
