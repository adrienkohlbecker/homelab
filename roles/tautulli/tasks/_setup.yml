- name: _setup | Install nginx
  import_role:
    name: test
    tasks_from: nginx

- name: _setup | Install podman
  import_role:
    name: podman
    tasks_from: install

- name: _setup | Install fluent-bit for log normalization
  import_role:
    name: fluentbit

- name: _setup | Create media podman network
  import_role:
    name: media
    tasks_from: network

- name: _setup | Install authelia stub for auth=required tests
  import_role:
    name: test
    tasks_from: authelia_stub

- name: _setup | Create fixture directories
  file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /mnt/services
    - /mnt/services/sqlite
  become: true

- name: _setup | Install the legacy sort_ini binary
  import_role:
    name: sort_ini

- name: _setup | Install the legacy tautulli ini watcher
  import_role:
    name: sort_ini
    tasks_from: path
  vars:
    sort_ini_args:
      path: /mnt/services/tautulli/config.ini

- name: _setup | Create Plex identity fixture
  copy:
    content: '<MediaContainer machineIdentifier="{{ plex_machine_id }}" version="test" />'
    dest: /tmp/tautulli_plex_identity
    owner: root
    group: root
    mode: "0644"
  become: true

- name: _setup | Run Plex identity stub on the media network
  containers.podman.podman_container:
    name: plex
    image: docker.io/library/busybox
    command: httpd -f -p 32400 -h /www
    network: media
    volume:
      - /tmp/tautulli_plex_identity:/www/identity:ro
    state: started
    recreate: true
  become: true
