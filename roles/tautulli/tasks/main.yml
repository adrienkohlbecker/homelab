- name: Assert required tautulli inputs are provided
  assert:
    that:
      - tautulli_api_key | default('') | length > 0
      - tautulli_pms_token | default('') | length > 0
      - themoviedb_api_key | default('') | length > 0
      - plex_machine_id | default('') | length > 0
      - service_ports.tautulli is defined
      - external_ips.lab is defined
      - system_timezone | default('') | length > 0
      - domain | default('') | length > 0
  tags:
    - tautulli

- name: Add media group
  import_role:
    name: media
    tasks_from: group
  tags:
    - tautulli

- name: Set up tautulli system user and group
  import_role:
    name: service_user
    tasks_from: user
  vars:
    service_user_args:
      name: tautulli
      shared_group: media
      # /config holds config.ini (api_key/pms_token/jwt_secret) and Tautulli's
      # own backups/ which bundle copies of it; 0700 keeps the dir untraversable
      # by the media co-tenants the shared group would otherwise let in.
      config_dir_mode: "0700"
  tags:
    - tautulli

# Tautulli's --datadir bundles config.ini, logs, backups, and tautulli.db
# into one directory. The helper symlinks only the live DB so SQLite resolves
# to the 4K sqlite dataset; backups stay on the 128K dataset (one-shot full DB
# files compress and snapshot fine at 128K). force: true skips target
# pre-creation so Tautulli can create the real DB through the dangling link.
- name: Place tautulli SQLite DB on the sqlite dataset
  import_role:
    name: sqlite_dataset
    tasks_from: dataset
  vars:
    sqlite_dataset_args:
      name: tautulli
      owner: tautulli
      group: media
      condition: "{{ not ansible_check_mode or tautulli_user.uid is defined }}"
      force: true
      links:
        - /mnt/services/tautulli/tautulli.db
  tags:
    - tautulli

- name: Remove the retired tautulli ini path watcher
  import_role:
    name: systemd_unit
    tasks_from: remove
  vars:
    systemd_unit_args:
      dest: sort_ini_mnt-services-tautulli-config.ini.path
  tags:
    - tautulli

- name: Remove the retired tautulli ini watcher service
  import_role:
    name: systemd_unit
    tasks_from: remove
  vars:
    systemd_unit_args:
      dest: sort_ini_mnt-services-tautulli-config.ini.service
  tags:
    - tautulli

# Tautulli (and many other apps) write their in-memory state back to the config
# file on container shutdown. When Ansible does `systemctl restart`, the stop
# phase triggers that write-back after Ansible has already edited the file.
# Probe every setting first, stop once if any will change, then make the edits
# while the daemon is down. Settings not listed here remain application-owned.
- name: Check for an existing tautulli config
  stat:
    path: /mnt/services/tautulli/config.ini
  register: _tautulli_config_file
  become: true
  tags:
    - tautulli

# The pinned image's schema upgrade from 21 to 22 enables dynamic anonymous-link
# redirects when both redirect settings are empty. A fresh deployment already
# uses schema 22, so seed that version once and leave future migrations to the
# application; managing config_version continuously would fight image upgrades.
- name: Seed the current tautulli schema on fresh installs
  community.general.ini_file:
    path: /mnt/services/tautulli/config.ini
    section: Advanced
    option: config_version
    value: "22"
    owner: tautulli
    group: media
    mode: "0600"
    backup: true
  when:
    - not _tautulli_config_file.stat.exists
    - not ansible_check_mode or tautulli_user.uid is defined
  become: true
  tags:
    - tautulli

- name: Configure tautulli deployment settings
  vars:
    _tautulli_settings:
      - section: Advanced
        option: system_analytics
        value: "0"
      - section: General
        option: anon_redirect
        value: '""'
      - section: General
        option: anon_redirect_dynamic
        value: "0"
      - section: General
        option: api_enabled
        value: "1"
      - section: General
        option: api_key
        value: "{{ tautulli_api_key }}"
      - section: General
        option: backup_interval
        value: "24"
      - section: General
        option: first_run_complete
        value: "1"
      - section: General
        option: http_base_url
        value: "https://tautulli.{{ inventory_hostname }}.{{ domain }}"
      - section: General
        option: http_host
        value: 0.0.0.0
      - section: General
        option: http_port
        value: "8181"
      - section: General
        option: http_proxy
        value: "1"
      - section: General
        option: launch_startup
        value: "0"
      - section: General
        option: musicbrainz_lookup
        value: "1"
      - section: General
        option: show_advanced_settings
        value: "1"
      - section: General
        option: sys_tray_icon
        value: "0"
      - section: General
        option: themoviedb_apikey
        value: "{{ themoviedb_api_key }}"
      - section: General
        option: themoviedb_lookup
        value: "1"
      - section: General
        option: tvmaze_lookup
        value: "1"
      - section: General
        option: update_show_changelog
        value: "0"
      - section: General
        option: week_start_monday
        value: "1"
      - section: PMS
        option: pms_identifier
        value: "{{ plex_machine_id }}"
      - section: PMS
        option: pms_ip
        value: "{{ external_ips.lab }}"
      - section: PMS
        option: pms_is_cloud
        value: "0"
      - section: PMS
        option: pms_is_remote
        value: "0"
      - section: PMS
        option: pms_port
        value: "32400"
      - section: PMS
        option: pms_ssl
        value: "0"
      - section: PMS
        option: pms_token
        value: "{{ tautulli_pms_token }}"
      - section: PMS
        option: pms_url
        value: "http://{{ external_ips.lab }}:32400"
      - section: PMS
        option: pms_url_manual
        value: "0"
      - section: PMS
        option: pms_web_url
        value: "https://plex.{{ inventory_hostname }}.{{ domain }}/web/index.html"
  become: true
  tags:
    - tautulli
  block:
    - name: Probe tautulli settings to gate the pre-write service stop
      community.general.ini_file:
        path: /mnt/services/tautulli/config.ini
        section: "{{ item.section }}"
        option: "{{ item.option }}"
        value: "{{ item.value }}"
        owner: tautulli
        group: media
        mode: "0600"
        backup: true
      loop: "{{ _tautulli_settings }}"
      loop_control:
        label: "{{ item.section }}.{{ item.option }}"
      register: _tautulli_conf_probe
      check_mode: true
      when: not ansible_check_mode or tautulli_user.uid is defined

    - name: Stop tautulli before changing settings
      systemd:
        name: tautulli
        state: stopped
        scope: system
      failed_when: false
      when:
        - not ansible_check_mode
        - _tautulli_conf_probe is not skipped
        - _tautulli_conf_probe.results | selectattr('changed') | list | length > 0

    - name: Apply tautulli deployment settings
      community.general.ini_file:
        path: /mnt/services/tautulli/config.ini
        section: "{{ item.section }}"
        option: "{{ item.option }}"
        value: "{{ item.value }}"
        owner: tautulli
        group: media
        mode: "0600"
        backup: true
      loop: "{{ _tautulli_settings }}"
      loop_control:
        label: "{{ item.section }}.{{ item.option }}"
      register: tautulli_conf
      when: not ansible_check_mode or tautulli_user.uid is defined

- name: Install tautulli fluent-bit extension
  import_role:
    name: fluentbit
    tasks_from: extension
  vars:
    fluentbit_extension_args:
      name: tautulli
  tags:
    - tautulli

- name: Install tautulli service
  import_role:
    name: systemd_unit
    tasks_from: install
  vars:
    systemd_unit_args:
      src: tautulli.service.j2
      condition: "{{ not ansible_check_mode or tautulli_user.uid is defined }}"
  tags:
    - tautulli

- name: Check whether podman is installed
  stat:
    path: /usr/bin/podman
  register: tautulli_podman
  tags:
    - tautulli

- name: Pull tautulli image
  when: not ansible_check_mode or tautulli_podman.stat.exists
  containers.podman.podman_image:
    name: "{{ tautulli_image }}"
  register: tautulli_image_pull
  retries: 3
  delay: 10
  until: tautulli_image_pull is not failed
  become: true
  tags:
    - tautulli

- name: Enable tautulli service
  import_role:
    name: systemd_unit
    tasks_from: service
  vars:
    systemd_unit_args:
      src: tautulli.service
      condition: "{{ not ansible_check_mode or tautulli_user.uid is defined }}"
      restart: "{{ tautulli_service_result.changed or tautulli_conf.changed or tautulli_user.changed or media_group.changed }}"
  tags:
    - tautulli

- name: Configure nginx
  import_role:
    name: nginx
    tasks_from: site
  vars:
    nginx_site_args:
      subdomain: tautulli
      proxy_pass: "http://127.0.0.1:{{ service_ports.tautulli }}/"
      # Tautulli's Plex sign-in does browser-side XHR to plex.tv; scope it to
      # connect-src (matching radarr/sonarr) rather than widening default-src.
      csp_additional: "connect-src plex.tv *.plex.tv {{ nginx_csp_default }}"
      auth: required
  tags:
    - tautulli
