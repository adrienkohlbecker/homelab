# Tautulli's /api/v2 returns HTTP 200 for all calls, with a JSON
# response.result of "error" when the key is wrong or missing. Proving both
# sides (rejected without / accepted with) is the only way to confirm the
# api_key we templated is the one the running container uses.
- name: _verify | Tautulli /api/v2 rejects requests without the api_key
  uri:
    url: http://127.0.0.1:{{ service_ports.tautulli }}/api/v2?cmd=get_tautulli_info
    return_content: true
  register: _tautulli_api_unauth
  failed_when: >-
    _tautulli_api_unauth.json.response.result | default('') != 'error'

- name: _verify | Tautulli /api/v2 accepts our api_key
  uri:
    url: http://127.0.0.1:{{ service_ports.tautulli }}/api/v2?apikey={{ tautulli_api_key }}&cmd=get_tautulli_info
    return_content: true
  register: _tautulli_api_auth
  failed_when: >-
    _tautulli_api_auth.json.response.result | default('') != 'success'

- name: _verify | Tautulli reaches Plex through podman DNS
  uri:
    url: http://127.0.0.1:{{ service_ports.tautulli }}/api/v2?apikey={{ tautulli_api_key }}&cmd=get_server_identity
    return_content: true
  register: _tautulli_plex_identity
  retries: 15
  delay: 2
  until:
    - _tautulli_plex_identity.json.response.result | default('') == 'success'
    - _tautulli_plex_identity.json.response.data.machine_identifier | default('') == plex_machine_id
  failed_when: >-
    _tautulli_plex_identity.json.response.data.version | default('') != 'test'

- name: _verify | Check the retired ini watcher unit files
  stat:
    path: /etc/systemd/system/{{ item }}
  loop:
    - sort_ini_mnt-services-tautulli-config.ini.path
    - sort_ini_mnt-services-tautulli-config.ini.service
  register: _tautulli_ini_watcher_files
  become: true

- name: _verify | Check the retired ini watcher unit state  # noqa: command-instead-of-module -- read-only query must distinguish inactive and missing units
  command: systemctl is-active {{ item }}
  loop:
    - sort_ini_mnt-services-tautulli-config.ini.path
    - sort_ini_mnt-services-tautulli-config.ini.service
  register: _tautulli_ini_watcher_units
  changed_when: false
  failed_when: false
  become: true

- name: _verify | The retired ini watcher is uninstalled
  assert:
    that:
      - _tautulli_ini_watcher_files.results | selectattr('stat.exists') | list | length == 0
      - _tautulli_ini_watcher_units.results | map(attribute='rc') | select('equalto', 0) | list | length == 0
    fail_msg: "the retired tautulli sort_ini watcher is still installed or active"

# The vhost is `auth: required`, so a cookieless request must bounce to
# Authelia. With the stub in gate mode (see _setup.yml), assert a cookieless
# GET / lands on nginx's 401 =302 redirect to the portal. This is the only
# probe that fails if `auth: required` is dropped from nginx_site_args.
#
# Map the vhost FQDN to loopback so SNI matches the served certificate.
# Probing https://localhost with a Host: header leaves SNI=localhost, which
# OpenSSL 3.x (noble/resolute) rejects with TLSV1_UNRECOGNIZED_NAME.
- name: _verify | Map the tautulli vhost FQDN to loopback for SNI-correct probing
  lineinfile:
    path: /etc/hosts
    line: "127.0.0.1 tautulli.{{ inventory_hostname }}.{{ domain }}"
    state: present
  become: true

- name: _verify | Tautulli UI gate redirects unauthenticated requests to Authelia
  uri:
    url: https://tautulli.{{ inventory_hostname }}.{{ domain }}/
    validate_certs: false
    follow_redirects: none
    status_code: 302
  register: _tautulli_nginx_gate
  failed_when: _tautulli_nginx_gate is not authelia_redirects_to('tautulli', inventory_hostname, domain)

# Media-network join probe. Intra-stack peers (seerr) reach tautulli at
# tautulli.dns.podman:8181 with the api_key, bypassing nginx. A dropped
# `--network media` strands it while leaving loopback probes green.
- name: _verify | Tautulli is reachable intra-stack at tautulli.dns.podman over the media network
  command: >-
    podman exec tautulli
    curl -s -o /dev/null -w '%{http_code}'
    http://tautulli.dns.podman:8181/status
  become: true
  register: _tautulli_dns_podman
  changed_when: false
  retries: 15
  delay: 2
  until: _tautulli_dns_podman.rc == 0 and _tautulli_dns_podman.stdout == "200"

# The sqlite_dataset symlink (force: true) plants a dangling link on a cold
# host; Tautulli creates the real DB through it on first start. Assert both
# the symlink and the dataset-side file exist and are non-empty.
- name: _verify | Stat the tautulli DB symlink
  stat:
    path: /mnt/services/tautulli/tautulli.db
    follow: false
  register: _tautulli_db_link
  become: true

- name: _verify | Tautulli DB is a symlink onto the sqlite dataset
  assert:
    that:
      - _tautulli_db_link.stat.islnk
      - _tautulli_db_link.stat.lnk_target == "/mnt/services/sqlite/tautulli/tautulli.db"
    fail_msg: "tautulli.db is not a symlink onto the sqlite dataset (stat={{ _tautulli_db_link.stat }})"

- name: _verify | Tautulli wrote a real, non-empty DB onto the dataset
  stat:
    path: /mnt/services/sqlite/tautulli/tautulli.db
  register: _tautulli_db_file
  retries: 15
  delay: 2
  until:
    - _tautulli_db_file.stat.exists
    - not _tautulli_db_file.stat.islnk
    - (_tautulli_db_file.stat.size | default(0) | int) > 0
  become: true

# Change one managed setting and several application-owned settings together.
# The reconverge must stop the daemon before correcting http_proxy, while the
# daemon's shutdown write and Ansible's selective edits must preserve everything
# outside the role's settings table.
- name: _verify | Stop tautulli before seeding mixed config drift
  systemd:
    name: tautulli
    state: stopped
  become: true

- name: _verify | Seed managed and application-owned config values
  community.general.ini_file:
    path: /mnt/services/tautulli/config.ini
    section: "{{ item.section }}"
    option: "{{ item.option }}"
    value: "{{ item.value }}"
    owner: tautulli
    group: media
    mode: "0600"
    backup: true
  loop:
    - section: General
      option: http_proxy
      value: "0"
    - section: Advanced
      option: jwt_secret
      value: 0123456789abcdef0123456789abcdef
    - section: PMS
      option: pms_client_id
      value: tautulli-test-client
    - section: PMS
      option: pms_uuid
      value: fedcba9876543210fedcba9876543210
    - section: PMS
      option: pms_version
      value: 1.40.0.8395-abc123def
    - section: TautulliTest
      option: unmanaged_sentinel
      value: preserve-me
  loop_control:
    label: "{{ item.section }}.{{ item.option }}"
  become: true

- name: _verify | Start tautulli with the seeded config values
  systemd:
    name: tautulli
    state: started
  become: true

- name: _verify | Re-run the role after mixed config drift
  import_role:
    name: tautulli

- name: _verify | The managed config drift was corrected
  assert:
    that:
      - tautulli_conf.changed
    fail_msg: "tautulli did not correct the seeded http_proxy drift"

- name: _verify | Read config after the selective reconverge
  slurp:
    src: /mnt/services/tautulli/config.ini
  register: _tautulli_verify_ini
  become: true

- name: _verify | Application-owned values survived the selective reconverge
  vars:
    _ini: "{{ _tautulli_verify_ini.content | b64decode }}"
  assert:
    that:
      - _ini is regex('(?m)^http_proxy = 1$')
      - _ini is regex('(?m)^jwt_secret = 0123456789abcdef0123456789abcdef$')
      - _ini is regex('(?m)^pms_client_id = tautulli-test-client$')
      - _ini is regex('(?m)^pms_uuid = fedcba9876543210fedcba9876543210$')
      - _ini is regex('(?m)^pms_version = 1[.]40[.]0[.]8395-abc123def$')
      - _ini is regex('(?m)^unmanaged_sentinel = preserve-me$')
    fail_msg: "tautulli reconverge changed application-owned config values"

- name: _verify | Wait for normalized tautulli startup record in lnav store
  command:
    argv:
      - python3
      - -c
      - |
        import json
        import sys

        with open(sys.argv[1], encoding="utf-8") as handle:
            for line in handle:
                try:
                    record = json.loads(line)
                except json.JSONDecodeError:
                    continue
                if not record.get("message", "").startswith("Starting Tautulli v"):
                    continue
                fields = record.get("fields", {})
                if (
                    record.get("service") == "tautulli"
                    and record.get("unit") == "tautulli.service"
                    and record.get("level") == "info"
                    and fields.get("thread") == "MainThread"
                    and fields.get("parser_status") == "parsed"
                    and fields.get("CONTAINER_ID")
                    and "source" not in fields
                    and "CONTAINER_TAG" not in fields
                    and "CONTAINER_ID_FULL" not in fields
                    and "PRIORITY" not in fields
                    and "SYSTEMD_UNIT" not in fields
                ):
                    sys.exit(0)
        sys.exit(1)
      - /var/log/fluent-bit/lnav.jsonl
  register: _tautulli_lnav_record
  changed_when: false
  retries: 30
  delay: 1
  until: _tautulli_lnav_record.rc == 0
  become: true

- name: _verify | Define tautulli websocket file-ingestion marker
  set_fact:
    tautulli_websocket_marker: "tautulli_websocket_{{ ansible_date_time.iso8601_basic_short }}_{{ 99999 | random }}"

- name: _verify | Append tautulli websocket file-ingestion record
  command:
    argv:
      - /usr/bin/tee
      - --append
      - /mnt/services/tautulli/logs/plex_websocket.log
    stdin: >-
      2026-07-12 12:00:00 - WARNING :: Thread-99 (run) : {"marker":"{{ tautulli_websocket_marker }}"}
  changed_when: true
  become: true
  become_user: tautulli

- name: _verify | Read normalized tautulli websocket file record
  command:
    argv:
      - python3
      - -c
      - |
        import json
        import sys

        marker, path = sys.argv[1:]
        with open(path) as records:
            for line in records:
                record = json.loads(line)
                if record.get("stream") == "tautulli_websocket" and marker in record.get("message", ""):
                    print(json.dumps(record))
                    sys.exit(0)
        sys.exit(1)
      - "{{ tautulli_websocket_marker }}"
      - /var/log/fluent-bit/lnav.jsonl
  register: _tautulli_websocket_record
  retries: 15
  delay: 1
  until: _tautulli_websocket_record.rc == 0
  changed_when: false

- name: _verify | Assert normalized tautulli websocket file fields
  vars:
    record: "{{ _tautulli_websocket_record.stdout | from_json }}"
  assert:
    that:
      - record.service == "tautulli"
      - record.stream == "tautulli_websocket"
      - record.unit == "tautulli.service"
      - record.identifier == "tautulli"
      - record.level == "warn"
      - record.message == '{"marker":"' ~ tautulli_websocket_marker ~ '"}'
      - record.fields.thread == "Thread-99 (run)"
      - record.fields.source == "plex_websocket"
      - record.fields.parser_status == "parsed"
      - record.parse_error is not defined
      - record.fields.filepath is not defined

- name: _verify | Exercise tautulli fluent-bit record contracts
  import_role:
    name: fluentbit
    tasks_from: verify_extension
  vars:
    fluentbit_verify_args:
      name: tautulli
      records:
        - MESSAGE: "2099-01-02 03:04:05 - INFO :: MainThread : Tautulli WebStart :: tautulli-info\n"
          CONTAINER_TAG: tautulli
          SYSLOG_IDENTIFIER: tautulli
          SYSTEMD_UNIT: tautulli.service
          parser_status: forged
        - MESSAGE: "2099-01-02 03:04:06 - WARNING :: Thread-15 (run) : tautulli-warning\n"
          CONTAINER_TAG: tautulli
          SYSLOG_IDENTIFIER: tautulli
          SYSTEMD_UNIT: tautulli.service
        - MESSAGE: "[migrations] no migrations found\n"
          CONTAINER_TAG: tautulli
          SYSLOG_IDENTIFIER: tautulli
          SYSTEMD_UNIT: tautulli.service
        - MESSAGE: "2099-01-02 03:04:07 - ERROR :: MainThread : Tautulli WebSocket :: tautulli-unit-record\n"
          SYSLOG_IDENTIFIER: systemd
          SYSTEMD_UNIT: tautulli.service
      expected:
        - message: tautulli-info
          level: info
          service: tautulli
          fields.source: Tautulli WebStart
          fields.thread: MainThread
          fields.parser_status: parsed
          _absent:
            - fields.tautulli_level
            - fields.tautulli_thread
            - fields.tautulli_source
            - fields.tautulli_message
            - fields.CONTAINER_TAG
            - fields.CMDLINE
        - message: tautulli-warning
          level: warn
          fields.thread: Thread-15 (run)
          _absent:
            - fields.source
        - message: "[migrations] no migrations found"
          level: info
          _absent:
            - fields.parser_status
            - fields.source
            - fields.thread
        - message: "2099-01-02 03:04:07 - ERROR :: MainThread : Tautulli WebSocket :: tautulli-unit-record"
          service: systemd
          level: error
          _absent:
            - fields.parser_status
            - fields.source
            - fields.thread
