# Release-divergent install paths: Resolute uses netavark's native nftables
# driver and the stock seccomp profile; Noble keeps the iptables compatibility
# package and the fchmodat2 profile.
#
# Lab cells run single-disk: _setup frees a member of the fixture's podman
# RAID5 so the store lands on one raw partition, as on pug and fox. Every other
# role's Lab cell converges podman on the mdadm array.
machines:
  lab:
  minimal:
ubuntu:
  - noble
skip:
  "minimal:noble": >-
    Lab covers the Noble install path; Minimal Resolute covers the
    root-filesystem fallback on a host without a ZFS root.
