# Release-divergent install paths: the default noble cell installs the podman
# userspace stack natively; resolute drops the iptables compat package and takes
# the >= 26 branch.
#
# Storage coverage: box uses a dedicated raw ext4 partition, minimal stays on
# the root filesystem, and lab exercises the three-member mdadm raid5 device.
# box + minimal run on every push; lab is also available through a manual
# `testrole.py podman --machine lab` run.
machines:
  box:
  minimal:
  lab:
ubuntu:
  - resolute
