# Release-divergent install paths: the default noble cell keeps the iptables
# compatibility package; resolute uses netavark's native nftables driver.
#
# Storage coverage: box uses a dedicated raw ext4 partition, minimal stays on
# the root filesystem, and lab exercises the three-member mdadm raid5 device.
# All declared variants run in CI.
machines:
  box:
  minimal:
  lab:
ubuntu:
  - resolute
skip:
  "minimal:resolute": >-
    Box covers the release-divergent install path; Minimal Noble covers
    root-filesystem storage.
  "lab:resolute": >-
    Box covers the release-divergent install path; Lab Noble covers mdadm
    storage and operator pruning.
