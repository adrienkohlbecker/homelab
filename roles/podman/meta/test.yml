# Release-divergent install paths: Noble keeps the iptables compatibility
# package and the fchmodat2 seccomp profile; Resolute uses netavark's native
# nftables driver and the stock profile.
#
# Lab cells run single-disk: _setup frees a member of the fixture's podman
# RAID5 so the store lands on one raw partition, as on pug and fox. Every other
# role's Lab cell converges podman on the mdadm array. Minimal exercises the
# root-filesystem fallback on a host without a ZFS root.
machines:
  lab:
  minimal:
ubuntu:
  - resolute
skip:
  "minimal:resolute": >-
    Lab covers the Resolute install path; Minimal Noble covers root storage.
