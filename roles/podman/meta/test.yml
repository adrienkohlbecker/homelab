# Release-divergent install paths: Lab Noble keeps the iptables compatibility
# package and the fchmodat2 seccomp profile; Pug Resolute uses netavark's
# native nftables driver and the stock profile.
#
# Lab exercises mdadm RAID5 storage and Pug a labelled raw partition. The
# firewall role's Minimal cell installs podman on the root filesystem.
machines:
  lab:
  pug:
ubuntu:
  - resolute
skip:
  "lab:resolute": >-
    Pug covers the Resolute install path; Lab Noble covers mdadm storage.
  "pug": >-
    Lab covers the Noble install path; Pug Resolute covers the raw partition.
