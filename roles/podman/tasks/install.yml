# Podman's storage database records its graph driver the first time any podman
# command, including an apt postinst trigger, touches it. Install the complete
# configuration before the package so that first initialization sees the same
# driver and paths every later command will use.
- name: install | Ensure /etc/containers exists
  file:
    path: /etc/containers
    state: directory
    mode: "0755"
    owner: root
    group: root
  become: true
  tags:
    - podman

- name: install | Configure podman storage before apt
  copy:
    dest: /etc/containers/storage.conf
    content: |
      [storage]
      driver = "overlay"
      # containers/storage overwrites these fields from the parsed config, so
      # they must stay explicit even though they match the rootful defaults.
      runroot = "/run/containers/storage"
      graphroot = "/var/lib/containers/storage"
      rootless_storage_path = "/var/lib/containers/rootless/$USER"
    mode: "0644"
    owner: root
    group: root
    backup: true
    validate: python3 -c 'import sys, tomllib; tomllib.load(open(sys.argv[1], "rb"))' %s
  become: true
  tags:
    - podman

# Older releases need iptables: netavark's iptables firewall_driver
# shells out to /usr/sbin/iptables for --publish port forwarding, and
# the firewall role's cohabitation-cleanup task pokes `ip filter`
# policies via the same binary. Without it container start fails with
# the misleading "Error: netavark: No such file or directory" (it's
# iptables that's missing, not netavark). Resolute+ runs netavark on
# the native nftables driver and has no iptables-nft compat tables to
# clean up — drop the dependency so `iptables -L` doesn't silently
# resurrect empty `ip filter` chains. Drop releases from this list as
# they age out.
- name: install | Install podman
  apt:
    pkg: "{{ ['podman', 'aardvark-dns', 'netavark', 'passt']
             + (['iptables'] if ansible_distribution_release == 'noble' else []) }}"
    policy_rc_d: 101
    cache_valid_time: 3600
    # Cached test images can briefly be ahead of the archive they converge
    # against. Let apt bring ephemeral fixtures back to the archive candidate;
    # prod should fail closed on any downgrade.
    allow_downgrade: "{{ qemu_test | default(false) }}"
  register: podman_apt
  become: true
  tags:
    - podman

# Ubuntu's Podman package globally enables these user units, so every login
# starts a rootless API service even when the user never runs containers.
# Rootless consumers such as gitlab_runner enable their own socket explicitly.
- name: install | Remove package-wide rootless Podman activation
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/user/default.target.wants/podman.service
    - /etc/systemd/user/sockets.target.wants/podman.socket
  become: true
  tags:
    - podman

# Every image tag is pinned in versions.yml and updates are driven through
# ansible, so podman's auto-update path (enabled by the package) has no role
# here. No container carries an io.containers.autoupdate label, so it's a no-op
# today -- mask it so a stray label can never trigger an unpinned pull/restart
# behind ansible's back, and so the daily timer stops churning. The package
# enables BOTH the daily timer (timers.target.wants) and the service itself
# (default.target.wants/podman-auto-update.service), so masking only the timer
# would leave a boot-time auto-update path open -- mask both.
# Guarded like the seccomp tasks below: the units ship with the podman package
# (the `Install podman` apt task above), which in check mode on a fresh host
# only *reports* installing -- so the units aren't on disk yet and the mask
# would fail "Could not find the requested service". Skip in that case; on a
# converged host (apt no-op) or any real apply it runs normally.
- name: install | Mask podman auto-update units (image tags are ansible-pinned)
  when: not (ansible_check_mode and podman_apt.changed)
  systemd:
    name: "{{ item }}"
    masked: true
    state: stopped
  loop:
    - podman-auto-update.timer
    - podman-auto-update.service
  become: true
  tags:
    - podman

# /etc/containers/containers.conf is for user overrides; the package ships
# defaults at /usr/share/containers/containers.conf and won't create the
# /etc/ copy. We write a small overlay holding only the keys the homelab
# pins -- podman layers it over the package defaults. A `copy:` with a
# templated `content:` (mirroring the storage.conf write above) carries a
# TOML `validate:` so a jinja/vault typo fails here rather than being
# silently accepted-then-defaulted by containers/common.
#
# [containers]
# - seccomp_profile: point at the fchmodat2-augmented profile built a few
#   tasks below. The path is static, so it's written here even though the
#   file itself is created later in the same converge; podman only reads it
#   at container (re)create.
#
# [network]
# - network_backend: force netavark. Otherwise podman auto-detects
#   and stays on CNI when any CNI network already exists; CNI
#   doesn't wire DNS without the dnsname plugin (deprecated). With
#   netavark + aardvark-dns container-name resolution Just Works on
#   user-created networks. Existing CNI hosts need a one-shot
#   manual `podman system reset --force` to drop leaked iptables
#   rules.
# - default_network: pin the default network's *name*. roles/firewall's
#   _verify attaches a probe container with `--network podman`, so the name
#   is load-bearing; pinning it keeps that test (and any future name-based
#   consumer) robust against an upstream default-name change.
# - default_subnet: pin the *default* podman network's subnet to
#   podman_default_network. Podman's compiled-in default happens to
#   equal it today, so the firewall's PODMAN_DEFAULT egress/DNS rules
#   and adguard's upstream line up by coincidence; pinning makes it
#   explicit so an upstream change to the built-in default can't
#   silently move the default network out from under those rules.
# - default_subnet_pools: shrink the upstream 5-range list to just
#   podman_bridge_pool. The firewall INPUT accept for aardvark-dns and
#   homeassistant's trusted_proxies are scoped to that prefix; if podman
#   ever auto-allocated a named bridge from the wider 10.90.0.0/15
#   (etc) ranges, container-name DNS would silently fail and HA would
#   reject X-Forwarded-For from a "stranger" gateway. Pinning to a
#   single range with size 24 gives us 256 named bridges before
#   exhaustion (vs. ~7 today) and turns "ran out of pool" into a loud
#   create-time error rather than a quiet drift into untrusted space.
#   default_subnet and default_subnet_pools draw from podman_default_network
#   / podman_bridge_pool (group_vars/all/main.yml).
# - dns_bind_port: move aardvark-dns off port 53 so it doesn't fight
#   with services (adguard) that bind on the bridge-gateway interface.
#   netavark redirects container DNS queries to gateway:5333 via
#   iptables; nothing on the host changes from the container POV.
# - firewall_driver: native nftables, not iptables-nft compat. Lands
#   netavark's rules in `inet netavark` instead of `ip filter`/
#   `ip nat`. The driver was added in netavark 1.10 (Jun 2024). Ubuntu
#   noble archive is frozen on netavark 1.4.0-4, so the
#   setting would be silently ignored on those releases. Gate to
#   resolute+, where the archive is expected to carry 1.10+. Drop
#   releases from the absent-list as they age out *and* their netavark
#   crosses 1.10.
# - default_rootless_network_cmd: back rootless egress with pasta
#   instead of the slirp4netns default. Rootless-only key (rootful
#   podman ignores it), so it's consulted just on the hosts that run
#   rootless podman -- the CI runner (gitlab_runner) --
#   and is inert everywhere else. pasta shares passt's robust UDP
#   datapath, so a rootless container's outbound DNS/UDP no longer drops
#   datagrams under load the way slirp4netns does. Needs podman >= 4.4
#   and the pasta binary: both ship natively fleet-wide, so it is ungated.
#   Takes effect on the next container create -- the runners'
#   per-job containers pick it up without a daemon restart.
- name: install | Configure podman containers.conf
  copy:
    dest: /etc/containers/containers.conf
    content: |
      [containers]
      seccomp_profile = "/etc/containers/seccomp-fchmodat2.json"

      [network]
      network_backend = "netavark"
      default_rootless_network_cmd = "pasta"
      default_network = "podman"
      default_subnet = "{{ podman_default_network }}"
      default_subnet_pools = [{"base" = "{{ podman_bridge_pool }}", "size" = 24}]
      dns_bind_port = 5333
      {% if ansible_distribution_release != 'noble' %}
      firewall_driver = "nftables"
      {% endif %}
    owner: root
    group: root
    mode: "0644"
    backup: true
    # Parse as TOML so a jinja/vault typo fails here; containers/common
    # otherwise accepts-then-defaults a broken file and silently drops our
    # netavark backend + scoped subnets back to compiled-in defaults.
    validate: python3 -c 'import sys, tomllib; tomllib.load(open(sys.argv[1], "rb"))' %s
  register: podman_containers_conf
  become: true
  tags:
    - podman

# Re-create netavark's firewall rules and DNS resolver under the
# possibly-new firewall_driver / dns_bind_port. Aardvark-dns reads
# dns_bind_port once at launch and keeps the port for its lifetime;
# `podman network reload --all` tears down and respawns it with the
# new config. Same flow covers a flip from iptables-nft compat to
# native nft: NETAVARK_FORWARD / NETAVARK-HOSTPORT-* move out of
# `ip filter` and `ip nat` into the new `inet netavark` table.
# No-op on a fresh host with no networks.
#
# Ordering: in site.yml the `firewall` role runs *before* podman, so on a
# converge that flips firewall_driver this reload re-creates netavark's
# `inet netavark` table *after* the firewall role has already laid down
# its tables + policy this pass. The host is then mid-transition until a
# follow-up converge re-runs the firewall role against the new driver --
# so never apply a driver flip with `--tags podman` alone; do a full
# converge, then converge once more.
- name: install | Reload netavark firewall + dns after containers.conf change
  when: podman_containers_conf.changed and not ansible_check_mode
  command: podman network reload --all
  changed_when: true
  become: true
  tags:
    - podman

# Ubuntu noble's golang-github-containers-common 0.57.4
# ships a default seccomp profile that predates several syscalls the fleet
# needs on the HWE 6.x kernel:
#
#   fchmodat2 (kernel 6.6): GNU tar 1.35+ routes directory chmods through
#     it; the profile's SCMP_ACT_ERRNO blocks it (EPERM), breaking any
#     image whose entrypoint extracts+chmods (an apache/php image self-
#     extracting its webroot 403s the lot). Full writeup:
#     notes/podman_seccomp_fchmodat2.md.
#
#   io_uring_setup/enter/register (kernel 5.1): QEMU aio=io_uring inside
#     CI job containers needs the syscall family unblocked; without it the
#     VM exits immediately with "failed to init linux io_uring ring".
#
# libseccomp 2.5.3 resolves the names; only the profile's allow-list
# lacks them, so backporting libseccomp wouldn't help. Derive an augmented
# profile (live default + missing syscalls) and make it podman's default.
# Purely additive -- no existing container that already starts can regress.
# Picked up at the next container (re)create; no daemon reload needed.
#
# Gated on `not (ansible_check_mode and podman_apt.changed)`: the stock
# profile ships with golang-github-containers-common, pulled in by the
# `Install podman` apt task above. In check mode on a fresh host that apt
# only *reports*, so the file isn't there yet and the slurp would hard-fail;
# skip both in that case. Same guard on the slurp and the template so the
# latter never references an unset podman_seccomp_stock. On a converged host
# (apt no-op) or any real apply, they run normally.
- name: install | Read stock seccomp profile
  when: not (ansible_check_mode and podman_apt.changed)
  slurp:
    src: /usr/share/containers/seccomp.json
  register: podman_seccomp_stock
  become: true
  tags:
    - podman

- name: install | Install augmented seccomp profile
  when: not (ansible_check_mode and podman_apt.changed)
  template:
    src: seccomp.json.j2
    dest: /etc/containers/seccomp-fchmodat2.json
    owner: root
    group: root
    mode: "0644"
    backup: true
    validate: python3 -c 'import json,sys; json.load(open(sys.argv[1]))' "%s"
  become: true
  tags:
    - podman

# 0755 (up from the 0700 the dir is first created with) lets netdata's
# disk-space collector traverse to the mountpoint. The value is
# load-bearing on zfs_root hosts: this task runs before the dedicated mount,
# so on the second converge it sees the partition's ext4 root, which mkfs
# makes 0755 — matching that keeps the task idempotent. Tightening it
# (e.g. 0711) fights the mkfs default and the task never converges.
- name: install | Update containers permissions for netdata disk space monitoring
  file:
    dest: /var/lib/containers
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true
  tags:
    - podman

# ZFS-root hosts keep the reconstructible container store outside rpool on a
# dedicated raw ext4 partition (single-disk) or mdadm array (multi-disk). The
# install layer creates the device; this role formats and mounts it. Minimal
# fixtures have zfs_root=false and intentionally keep Podman on the root
# filesystem.
- name: install | Assert podman_storage_device is set on ZFS-root hosts
  when: zfs_root
  assert:
    that:
      - podman_storage_device is defined
      - podman_storage_device | length > 0
    fail_msg: >-
      ZFS-root hosts require podman_storage_device (the partition or /dev/md
      path) in host_vars; got
      {{ podman_storage_device | default('<unset>') }}.
  tags:
    - podman

# resizefs grows ext4 to fill a deliberately enlarged partition and is a no-op
# on fixed fixtures. On mdadm, mke2fs derives stripe geometry from the array.
- name: install | Create ext4 filesystem on the podman partition
  when: zfs_root
  filesystem:
    fstype: ext4
    dev: "{{ podman_storage_device }}"
    resizefs: true
  become: true
  tags:
    - podman

# A raw partition is exposed by udev early, and an mdadm array assembles from
# mdadm.conf in the initramfs/udev, both well before local-fs.target.
- name: install | Mount the podman partition
  when: zfs_root
  mount:
    path: /var/lib/containers
    src: "{{ podman_storage_device }}"
    fstype: ext4
    opts: defaults,noatime
    state: mounted
    backup: true
  become: true
  tags:
    - podman

# Rootless storage lives under /var/lib/containers/rootless/$USER -- on the
# dedicated Podman store where zfs_root, else on the plain root filesystem.
# Created on every podman host so storage.conf's rootless_storage_path
# always has its parent. Sticky-bit 1777 (like /tmp) lets each user create
# and own their own subdir without being able to touch anyone else's. The
# mode is load-bearing — a user needs write+traverse on the parent to create
# its own store — so it can't be tightened. The residual first-touch risk (a
# hostile local account pre-creating another user's not-yet-existing subdir)
# is out of scope: every rootless consumer is an ansible-provisioned service
# user, on single-operator hosts with no untrusted local logins.
- name: install | Create rootless storage parent
  file:
    path: /var/lib/containers/rootless
    state: directory
    owner: root
    group: root
    mode: "1777"
  become: true
  tags:
    - podman
