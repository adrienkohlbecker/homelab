# Status-only read: with no state/enabled requested the module just returns
# `systemctl show podman.service`, which succeeds (LoadState=not-found) before
# the package exists. Cheaper than service_facts, which enumerates every unit.
- name: Read podman.service state before package changes
  systemd:
    name: podman.service
  register: podman_service_before_install
  become: true
  tags:
    - podman

- name: Install podman package
  import_tasks: install.yml
  tags:
    - podman

- name: Install podman service override
  import_role:
    name: systemd_unit
    tasks_from: install
  vars:
    systemd_unit_args:
      src: override_service.conf
      for: podman.service
  tags:
    - podman

- name: Enable podman.socket
  when: not (ansible_check_mode and podman_apt.changed)
  systemd:
    name: podman.socket
    enabled: true
    state: started
  become: true
  tags:
    - podman

# override_service.conf (LOGGING) and a noble binary-swap change the running
# podman.service, not the socket — and podman.service is a long-lived active
# unit (netdata holds a persistent connection over the API socket), so the
# socket restart above never recycles it. Restart the daemon directly when
# its drop-in changed or apt swapped the binary under it: apt under
# policy_rc_d=101 leaves the running daemon on disk, so the new /run/podman
# socket would otherwise still be served by the stale process. A fresh install
# has no active daemon to recycle; the socket task above starts it with the new
# binary and environment.
- name: Restart an existing podman.service after runtime changes
  when:
    - not ansible_check_mode
    - podman_service_before_install.status.ActiveState | default('inactive') == 'active'
    - >-
      podman_apt.changed
      or podman_service_d_override_conf_result.changed | default(false)
  systemd:
    name: podman.service
    state: restarted
  become: true
  tags:
    - podman

- name: Enable linger for the Lab operator prune timer
  when: podman_operator_prune_enabled
  import_role:
    name: linger
    tasks_from: linger
  vars:
    linger_args:
      name: "{{ ansible_user_id }}"
      uid: "{{ ansible_user_uid }}"
  tags:
    - podman

- name: Install the Lab operator prune timer
  when: podman_operator_prune_enabled
  import_tasks: prune.yml
  vars:
    podman_prune_args:
      user: "{{ ansible_user_id }}"
  tags:
    - podman

- name: Disable operator linger outside Lab
  when: not podman_operator_prune_enabled
  import_role:
    name: linger
    tasks_from: disable
  vars:
    # Keep the manager serving the current login; it stops after logout once
    # the persistence marker is gone.
    linger_args:
      name: "{{ ansible_user_id }}"
  tags:
    - podman

- name: Install rootful podman prune timer
  import_tasks: prune.yml
  vars:
    podman_prune_args: {}
  tags:
    - podman
