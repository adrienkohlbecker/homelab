- name: Install podman package
  import_tasks: install.yml
  tags:
    - podman

- name: Install podman service override
  import_role:
    name: systemd_unit
    tasks_from: install
  vars:
    systemd_unit_args:
      src: override_service.conf
      for: podman.service
  tags:
    - podman

- name: Enable podman.socket
  when: not (ansible_check_mode and podman_apt.changed)
  systemd:
    name: podman.socket
    enabled: true
    state: started
  become: true
  tags:
    - podman

# Socket activation does not recycle a running daemon, so restart it onto a
# changed drop-in. A fresh install writes the drop-in too; starting the daemon
# then matches the package, which enables podman.service at boot.
- name: Restart podman.service after its drop-in changes
  when:
    - podman_service_d_override_conf_result.changed
    - not (ansible_check_mode and podman_apt.changed)
  systemd:
    name: podman.service
    state: restarted
  become: true
  tags:
    - podman

# The operator prune runs as the operator from a system unit; linger keeps
# the runtime directory its rootless podman state lives in.
- name: Enable linger for the Lab operator prune timer
  when: podman_operator_prune_enabled
  import_role:
    name: linger
    tasks_from: linger
  vars:
    linger_args:
      name: "{{ ansible_user_id }}"
      uid: "{{ ansible_user_uid }}"
  tags:
    - podman

# Daily prune of stopped containers, dangling images and unused volumes older
# than 48h; named images stay cached so the next pull is a no-op. Deliberately
# not `podman system prune`, which also deletes unused networks: a
# single-consumer network (mac_iot, adguard, ...) is unused whenever its service
# is down, and only a converge recreates it. The volume prune also removes
# unused named volumes, which is safe only because services keep their state in
# bind mounts. The operator timer prunes the Lab operator's rootless store and
# shares the operator's run root, as interactive podman does.
- name: Install the Lab operator prune timer
  import_role:
    name: systemd_timer
    tasks_from: install
  vars:
    systemd_timer_args:
      name: podman_prune_operator
      description: Prune the operator's stopped rootless podman containers, dangling images and unused volumes
      exec_start: >-
        /bin/sh -c '/usr/bin/podman container prune --force --filter until=48h
        && /usr/bin/podman image prune --force --filter until=48h
        && /usr/bin/podman volume prune --force --filter until=48h'
      on_calendar: "*-*-* 00:20:00"
      run_as: "{{ ansible_user_id }}"
      environment:
        XDG_RUNTIME_DIR: /run/user/{{ ansible_user_uid }}
      condition: "{{ podman_operator_prune_enabled }}"
  tags:
    - podman

- name: Install rootful podman prune timer
  import_role:
    name: systemd_timer
    tasks_from: install
  vars:
    systemd_timer_args:
      name: podman_prune
      description: Prune stopped podman containers, dangling images and unused volumes
      exec_start: >-
        /bin/sh -c '/usr/bin/podman container prune --force --filter until=48h
        && /usr/bin/podman image prune --force --filter until=48h
        && /usr/bin/podman volume prune --force --filter until=48h'
      on_calendar: "*-*-* 00:20:00"
  tags:
    - podman
