- name: Install podman package
  import_tasks: install.yml
  tags:
    - podman

- name: Install podman service override
  import_role:
    name: systemd_unit
    tasks_from: install
  vars:
    systemd_unit_args:
      src: override_service.conf
      for: podman.service
  tags:
    - podman

- name: Enable podman.socket
  when: not (ansible_check_mode and podman_apt.changed)
  systemd:
    name: podman.socket
    enabled: true
    state: started
  become: true
  tags:
    - podman

# Socket activation does not recycle an existing daemon after its package or
# runtime drop-in changes; try-restart leaves an inactive daemon alone.
- name: Restart an active podman.service after runtime changes  # noqa: command-instead-of-module
  when:
    - not ansible_check_mode
    - >-
      podman_apt.changed
      or podman_service_d_override_conf_result.changed | default(false)
  command: systemctl try-restart podman.service
  changed_when: true
  become: true
  tags:
    - podman

- name: Enable linger for the Lab operator prune timer
  when: podman_operator_prune_enabled
  import_role:
    name: linger
    tasks_from: linger
  vars:
    linger_args:
      name: "{{ ansible_user_id }}"
      uid: "{{ ansible_user_uid }}"
  tags:
    - podman

- name: Install the Lab operator prune timer
  when: podman_operator_prune_enabled
  import_tasks: prune.yml
  vars:
    podman_prune_args:
      user: "{{ ansible_user_id }}"
  tags:
    - podman

- name: Install rootful podman prune timer
  import_tasks: prune.yml
  vars:
    podman_prune_args: {}
  tags:
    - podman
