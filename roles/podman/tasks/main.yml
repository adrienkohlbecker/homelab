- name: Install podman package
  import_tasks: install.yml
  tags:
    - podman

- name: Install podman service override
  import_role:
    name: systemd_unit
    tasks_from: install
  vars:
    systemd_unit_args:
      src: override_service.conf
      for: podman.service
  tags:
    - podman

- name: Enable the service
  when: not (ansible_check_mode and podman_apt.changed)
  systemd:
    name: podman
    enabled: true
  become: true
  tags:
    - podman

- name: Enable podman.socket
  when: not (ansible_check_mode and podman_apt.changed)
  systemd:
    name: podman.socket
    enabled: true
    state: started
  become: true
  tags:
    - podman

# override_service.conf (LOGGING) and a noble binary-swap change the running
# podman.service, not the socket — and podman.service is a long-lived active
# unit (netdata holds a persistent connection over the API socket), so the
# socket restart above never recycles it. Restart the daemon directly when
# its drop-in changed or apt swapped the binary under it: apt under
# policy_rc_d=101 leaves the running daemon on disk, so the new /run/podman
# socket would otherwise still be served by the stale process. Skipped on a
# fresh install (podman_apt.changed): the socket task above brings the daemon
# up with the correct env + binary already in place, nothing stale to recycle.
- name: Restart podman.service to pick up drop-in changes
  when:
    - not ansible_check_mode
    - not podman_apt.changed
    - podman_service_d_override_conf_result.changed | default(false)
  systemd:
    name: podman.service
    state: restarted
  become: true
  tags:
    - podman

- name: Install podman prune timer
  when: podman_prune_enabled
  import_role:
    name: systemd_timer
    tasks_from: install
  vars:
    systemd_timer_args:
      name: podman_prune
      description: Prune unused podman containers, images and networks
      # Keep named images warm and never prune named volumes, which may contain
      # stopped service state despite the fleet's bind-mount convention.
      exec_start: /usr/bin/podman system prune -f --filter until=48h
      on_calendar: "*-*-* 00:20:00"
  tags:
    - podman

- name: Remove podman prune timer where it is disabled
  when: not podman_prune_enabled
  import_role:
    name: systemd_timer
    tasks_from: remove
  vars:
    systemd_timer_args:
      name: podman_prune
  tags:
    - podman

# Podman macvlan networks are owned by the macvlan role now — each
# entry in host_vars.macvlan_blocks with `podman_network: true` gets
# its podman network created alongside its host-side iface. See
# roles/macvlan/tasks/install.yml.
