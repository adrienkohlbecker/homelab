- name: Install podman package
  import_tasks: install.yml
  tags:
    - podman

- name: Install podman service override
  import_role:
    name: systemd_unit
    tasks_from: install
  vars:
    systemd_unit_args:
      src: override_service.conf
      for: podman.service
  tags:
    - podman

- name: Enable podman.socket
  when: not (ansible_check_mode and podman_apt.changed)
  systemd:
    name: podman.socket
    enabled: true
    state: started
  become: true
  tags:
    - podman

# override_service.conf (LOGGING) and a noble binary-swap change the running
# podman.service, not the socket — and podman.service is a long-lived active
# unit (netdata holds a persistent connection over the API socket), so the
# socket restart above never recycles it. Restart the daemon directly when
# its drop-in changed or apt swapped the binary under it: apt under
# policy_rc_d=101 leaves the running daemon on disk, so the new /run/podman
# socket would otherwise still be served by the stale process. Skipped on a
# fresh install (podman_apt.changed): the socket task above brings the daemon
# up with the correct env + binary already in place, nothing stale to recycle.
- name: Restart podman.service to pick up drop-in changes
  when:
    - not ansible_check_mode
    - not podman_apt.changed
    - podman_service_d_override_conf_result.changed | default(false)
  systemd:
    name: podman.service
    state: restarted
  become: true
  tags:
    - podman

- name: Enable linger for the Lab operator prune timer
  when: podman_operator_prune_enabled
  import_role:
    name: linger
    tasks_from: linger
  vars:
    linger_args:
      name: "{{ ansible_user_id }}"
      uid: "{{ ansible_user_uid }}"
  tags:
    - podman

- name: Install the Lab operator prune timer
  when: podman_operator_prune_enabled
  import_tasks: prune.yml
  vars:
    podman_prune_args:
      user: "{{ ansible_user_id }}"
  tags:
    - podman

- name: Check for operator linger outside Lab
  when: not podman_operator_prune_enabled
  stat:
    path: /var/lib/systemd/linger/{{ ansible_user_id }}
  register: podman_operator_linger
  become: true
  tags:
    - podman

- name: Remove the operator prune timer outside Lab
  when:
    - not podman_operator_prune_enabled
    - podman_operator_linger.stat.exists
  import_role:
    name: systemd_timer
    tasks_from: remove
  vars:
    systemd_timer_args:
      name: podman_prune
      user: "{{ ansible_user_id }}"
  tags:
    - podman

- name: Disable operator linger outside Lab
  when: not podman_operator_prune_enabled
  import_role:
    name: linger
    tasks_from: disable
  vars:
    # Keep the manager serving the current login; it stops after logout once
    # the persistence marker is gone.
    linger_args:
      name: "{{ ansible_user_id }}"
  tags:
    - podman

- name: Install rootful podman prune timer
  import_tasks: prune.yml
  vars:
    podman_prune_args: {}
  tags:
    - podman
