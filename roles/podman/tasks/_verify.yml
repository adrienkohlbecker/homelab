# Exercise Podman's runtime configuration with throwaway containers. Rootful
# checks cover storage, netavark DNS, seccomp and the nightly prune; a
# rootless pass proves pasta backs container egress. The test harness invokes
# this only against QEMU fixtures, never production hosts.

- name: _verify | Resolve a tiny probe image
  set_fact:
    podman_probe_image: docker.io/library/busybox

# On ZFS-root hosts, prove /var/lib/containers is actually backed by the
# dedicated device; a skipped mount would silently put reconstructible
# container data back in rpool. findmnt resolves by-partlabel and /dev/md
# aliases before matching, so one query pins the mountpoint, source, and
# filesystem type together.
- name: _verify | The podman store is on its dedicated device
  when: zfs_root
  command:
    argv:
      - findmnt
      - --noheadings
      - --mountpoint
      - /var/lib/containers
      - --source
      - "{{ podman_storage_device }}"
      - --types
      - ext4
  become: true
  changed_when: false

# Noble's stock profile denies fchmodat2 to tar-based entrypoints, so the role
# augments it there; later releases must allow it with the stock profile. Call
# fchmodat2(AT_FDCWD, "/tmp", 01777, 0) -- syscall 452 on x86_64 and aarch64
# -- under the default profile and require success.
- name: _verify | Default seccomp profile allows fchmodat2
  command:
    argv:
      - podman
      - run
      - --rm
      - docker.io/library/python:3-alpine
      - python3
      - -c
      - |
        import ctypes
        libc = ctypes.CDLL(None, use_errno=True)
        rc = libc.syscall(452, -100, b"/tmp", 0o1777, 0)
        print(ctypes.get_errno() if rc < 0 else 0)
  register: podman_fchmodat2
  until: podman_fchmodat2.rc == 0
  retries: 3
  delay: 5
  changed_when: false
  failed_when: podman_fchmodat2.rc != 0 or podman_fchmodat2.stdout != '0'
  become: true

# Inter-container DNS is the load-bearing reason netavark + dns_bind_port are
# pinned: a peer resolves another container by its <name>.dns.podman FQDN via
# aardvark-dns (the path every service role uses). A throwaway DNS-enabled
# network + a named server + a peer that resolves it by FQDN exercises the
# resolution chain end-to-end. (nslookup, not ping -- ICMP needs CAP_NET_RAW
# the probe container doesn't carry, and resolution is what we're testing.)
- name: _verify | Create a throwaway DNS-enabled network
  containers.podman.podman_network:
    name: podman_verify_dns
    disable_dns: false
  become: true

# This is the first rootful container start and may need to pull over the qemu
# NAT, so tolerate a transient registry failure.
- name: _verify | Start a named server container on it
  command: >-
    podman run -d --name podman_verify_server
    --network podman_verify_dns {{ podman_probe_image }} sleep 300
  become: true
  register: podman_dns_server
  until: podman_dns_server.rc == 0
  retries: 3
  delay: 5
  changed_when: true

- name: _verify | A peer resolves it by <name>.dns.podman
  command: >-
    podman run --rm --network podman_verify_dns {{ podman_probe_image }}
    nslookup podman_verify_server.dns.podman
  become: true
  register: podman_dns_probe
  until: podman_dns_probe.rc == 0
  retries: 10
  delay: 2
  changed_when: false

- name: _verify | Tear down the DNS probe container + network
  command: "{{ item }}"
  become: true
  changed_when: true
  loop:
    - podman rm -f podman_verify_server
    - podman network rm podman_verify_dns

# The nightly prune must reclaim dangling images yet keep unused networks: a
# single-consumer network is unused whenever its service is down. Backdate a
# throwaway network past the 48h window (podman reads `created` from its
# netavark config), leave an old image dangling, then run the real unit.
- name: _verify | Exercise the nightly prune
  become: true
  block:
    - name: _verify | Create an unused network for the prune check
      containers.podman.podman_network:
        name: podman_verify_prune

    - name: _verify | Read the prune-check network config
      slurp:
        src: /etc/containers/networks/podman_verify_prune.json
      register: _podman_prune_network

    - name: _verify | Backdate the network past the prune window
      copy:
        dest: /etc/containers/networks/podman_verify_prune.json
        content: >-
          {{ _podman_prune_network.content | b64decode | from_json
             | combine({'created': '2020-01-01T00:00:00Z'}) | to_nice_json }}
        owner: root
        group: root
        mode: "0644"

    # An end-of-life tag, so its image predates the prune window and differs
    # from the probe image other checks still use.
    - name: _verify | Pull an old image to leave dangling
      command: podman pull --quiet docker.io/library/busybox:1.35.0
      register: _podman_prune_image
      until: _podman_prune_image.rc == 0
      retries: 3
      delay: 5
      changed_when: true

    - name: _verify | Untag the old image
      command: podman untag {{ _podman_prune_image.stdout }}
      changed_when: true

    - name: _verify | Run the prune unit
      systemd:
        name: podman_prune.service
        state: started

    - name: _verify | The prune kept the unused network
      command: podman network exists podman_verify_prune
      changed_when: false

    - name: _verify | The prune reclaimed the dangling image
      command: podman image exists {{ _podman_prune_image.stdout }}
      register: _podman_prune_image_exists
      changed_when: false
      failed_when: _podman_prune_image_exists.rc != 1
  always:
    - name: _verify | Remove the prune-check network
      command: podman network rm --force podman_verify_prune
      changed_when: true
      failed_when: false

# pasta is a rootless-only network connector (default_rootless_network_cmd,
# set in install.yml), so this exercises it as the Lab fixture's
# rootless-capable login user. A successful rootless container start is
# itself proof the connector works -- podman errors out rather than silently
# falling back when the configured connector is missing or broken; the
# process check then pins that the connector is pasta specifically.
- name: _verify | Prove pasta backs a rootless container with egress wired
  environment:
    XDG_RUNTIME_DIR: /run/user/{{ ansible_user_uid }}
  block:
    - name: _verify | Pull a tiny image through the Nexus mirror
      command: podman pull {{ podman_probe_image }}
      changed_when: false

    # Default network -> podman invokes the configured rootless connector.
    # Container named without "pasta"/"slirp" so the pgrep -f matches below
    # hit the connector process, never this container's conmon argv.
    - name: _verify | Start a rootless container on the default network
      command: podman run -d --replace --name net_verify {{ podman_probe_image }} sleep 60
      changed_when: true

    - name: _verify | Count the pasta connector helper
      command: pgrep -u {{ ansible_user_id }} -c -f pasta
      register: _podman_pasta_count
      changed_when: false
      # pgrep -c exits 1 (and prints 0) when there are no matches; the
      # assert below is the real gate, so don't fail on the empty count.
      failed_when: false

    - name: _verify | Read the container's routing table
      command: podman exec net_verify ip route
      register: _podman_container_route
      changed_when: false

    - name: _verify | Assert pasta backs the container with egress wired
      assert:
        that:
          - _podman_pasta_count.stdout | int > 0
          - '"default" in _podman_container_route.stdout'
        fail_msg: >-
          Expected pasta to back the rootless container with a default
          route. pasta procs={{ _podman_pasta_count.stdout }},
          container routes={{ _podman_container_route.stdout }}.
  always:
    - name: _verify | Remove the net-verify container
      environment:
        XDG_RUNTIME_DIR: /run/user/{{ ansible_user_uid }}
      command: podman rm -f net_verify
      changed_when: false
      failed_when: false
