---
# Seed enabled linger outside Lab so converge proves the policy disables it.
- name: _setup | Enable operator linger outside Lab
  when: not podman_operator_prune_enabled
  import_role:
    name: linger
    tasks_from: linger
  vars:
    linger_args:
      name: "{{ ansible_user_id }}"
      uid: "{{ ansible_user_uid }}"

# Full fixtures prestart the API daemon to exercise restart; Minimal covers the
# fresh-install path.
- name: _setup | Prepare the running-service restart exercise
  when: not (qemu_test_minimal | default(false))
  block:
    - name: _setup | Install the podman runtime before the restart exercise
      import_tasks: install.yml

    - name: _setup | Create the podman service drop-in directory
      file:
        path: /etc/systemd/system/podman.service.d
        state: directory
        owner: root
        group: root
        mode: "0755"
      become: true

    # Preserve the stock $LOGGING expansion for the live argv assertion.
    - name: _setup | Disable the API service idle timeout for the restart exercise
      copy:
        dest: /etc/systemd/system/podman.service.d/condition_coverage.conf
        content: |
          [Service]
          ExecStart=
          ExecStart=/usr/bin/podman $LOGGING system service --time=0
        owner: root
        group: root
        mode: "0644"
      become: true

    - name: _setup | Reload systemd after installing the test drop-in
      systemd:
        daemon_reload: true
      become: true

    - name: _setup | Start podman.service before its drop-in is installed
      systemd:
        name: podman.service
        state: started
      become: true
