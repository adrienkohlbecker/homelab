# Inputs: caller passes a single dict `podman_secret_args` with keys
#   name              required; the podman secret's name
#   data              required when state=present; the secret payload as a
#                     string (JSON-encode structured data with `| to_json`
#                     before passing). Ignored when state=absent.
#   state             optional, default 'present'; 'absent' removes (tombstones)
#                     the secret so a consumer that drops a credential can
#                     retire it through the helper instead of a raw module call.
#
# The dict form prevents inter-call leakage at play-vars scope: each
# import_role pass replaces the whole `podman_secret_args` value, so a
# previous caller's state/data can't bleed into the next caller that
# doesn't explicitly override.
#
# Outputs (facts set only when this role actually runs — a caller that
# gates the import_role on a `when:` must read them through
# `| default(false)`, as headscale does for its conditional OIDC secret):
#   <name>_rotated         the secret was created, its content changed, or
#                          (with state=absent) it was removed this run; drive
#                          a container restart off this.
#   <name>_existed_before  the secret already existed before this run,
#                          captured pre-create so a bootstrap-only consumer
#                          can tell a first install from a later rotation
#                          (e.g. a Django superuser made once from
#                          SUPERUSER_PASSWORD — see influxdb,
#                          which fail loudly if it rotates post-bootstrap).
#
# containers.podman.podman_secret is create-or-replace with native content
# drift detection on podman >= 4.7 AND containers.podman >= 1.12.0 (which added
# the byte-compare: it `secret inspect --showsecret`s the stored value and
# recreates only when the bytes differ); the homelab pins podman 4.9 fleet-wide
# and ships the collection well above 1.12.0. So we hand it name/data
# unconditionally and let the module decide whether to rotate. The pre-create
# existence probe below stays only to derive `existed_before`, which the module
# doesn't expose.
- name: Validate inputs for {{ podman_secret_args.name | default('<unset>') }}
  assert:
    that:
      - podman_secret_args.name is defined
      - podman_secret_args.name is string
      # name prefixes the output fact keys below; assert it's a sane,
      # sanitizable identifier so a bad name fails loudly here rather than
      # crashing set_fact. Same guard as roles/linger/tasks/linger.yml.
      - (podman_secret_args.name | default('')) is match('^[a-z_][a-z0-9_-]*$')
      - (podman_secret_args.state | default('present')) in ['present', 'absent']
      # data is the payload only when creating/rotating; an absent tombstone
      # carries none, so require it solely for state=present.
      - >-
        (podman_secret_args.state | default('present')) == 'absent'
        or (podman_secret_args.data is defined and podman_secret_args.data is string)
    quiet: true
    fail_msg: >-
      podman_secret_args needs name (a valid identifier matching
      [a-z_][a-z0-9_-]*, since it prefixes the output fact keys), an optional
      state of present|absent, and — when present — data (string; JSON-encode
      structured data with `| to_json`); got
      name={{ podman_secret_args.name | default('<unset>') }}.

- name: Resolve caller defaults for {{ podman_secret_args.name }}
  set_fact:
    _podman_secret_name: "{{ podman_secret_args.name }}"
    _podman_secret_data: "{{ podman_secret_args.data | default('') }}"
    _podman_secret_state: "{{ podman_secret_args.state | default('present') }}"

- name: Check whether podman is installed
  stat:
    path: /usr/bin/podman
  register: _podman_secret_podman

- name: List existing podman secrets
  when: not ansible_check_mode or _podman_secret_podman.stat.exists
  containers.podman.podman_secret_info:
  register: _podman_secret_existing_all
  become: true

# Captured before the create/rotate task so the caller can distinguish a
# first install (existed_before=false) from a real rotation
# (existed_before=true, rotated=true).
- name: Record pre-existing state of {{ podman_secret_args.name }}
  set_fact:
    "{{ _podman_secret_name | ansible_var_key }}_existed_before": "{{ _podman_secret_existing_all.secrets | default([]) | selectattr('Spec.Name', 'eq', _podman_secret_name) | list | length > 0 }}"

- name: Create, rotate or remove {{ podman_secret_args.name }}
  when: not ansible_check_mode or _podman_secret_podman.stat.exists
  containers.podman.podman_secret:
    name: "{{ _podman_secret_name }}"
    state: "{{ _podman_secret_state }}"
    data: "{{ _podman_secret_data if _podman_secret_state == 'present' else omit }}"
  register: _podman_secret_result
  become: true

# Capture per-secret rotation status so successive import_role calls in the
# same play don't clobber the shared register.
- name: Record rotation status for {{ podman_secret_args.name }}
  set_fact:
    "{{ _podman_secret_name | ansible_var_key }}_rotated": "{{ _podman_secret_result.changed | default(false) }}"
