- name: _verify | Scenario 1 — create new secret
  import_role:
    name: podman_secret
    tasks_from: secret
  vars:
    podman_secret_args:
      name: podman_secret_test
      data: alpha

- name: _verify | Scenario 1 — assert created
  assert:
    that:
      - podman_secret_test_rotated

- name: _verify | Scenario 2 — re-run with same data
  import_role:
    name: podman_secret
    tasks_from: secret
  vars:
    podman_secret_args:
      name: podman_secret_test
      data: alpha

- name: _verify | Scenario 2 — assert NOT rotated
  assert:
    that:
      - not podman_secret_test_rotated

- name: _verify | Scenario 3 — re-run with new data
  import_role:
    name: podman_secret
    tasks_from: secret
  vars:
    podman_secret_args:
      name: podman_secret_test
      data: beta

- name: _verify | Scenario 3 — assert rotated
  assert:
    that:
      - podman_secret_test_rotated

- name: _verify | Cleanup test secret
  containers.podman.podman_secret:
    name: podman_secret_test
    state: absent
  become: true

# Scenario 4 — two distinct secrets in one play must keep independent facts:
# A stays un-rotated on its no-op re-run while B rotates. Guards the per-secret
# fact namespacing that every multi-secret consumer (authelia's 5, influxdb's 3)
# relies on; a leak would clobber one secret's restart trigger with another's.
- name: _verify | Scenario 4 — create secret A
  import_role:
    name: podman_secret
    tasks_from: secret
  vars:
    podman_secret_args:
      name: podman_secret_test_a
      data: aaa

- name: _verify | Scenario 4 — create secret B
  import_role:
    name: podman_secret
    tasks_from: secret
  vars:
    podman_secret_args:
      name: podman_secret_test_b
      data: bbb

- name: _verify | Scenario 4 — re-run A unchanged
  import_role:
    name: podman_secret
    tasks_from: secret
  vars:
    podman_secret_args:
      name: podman_secret_test_a
      data: aaa

- name: _verify | Scenario 4 — rotate B
  import_role:
    name: podman_secret
    tasks_from: secret
  vars:
    podman_secret_args:
      name: podman_secret_test_b
      data: bbb2

- name: _verify | Scenario 4 — assert per-secret fact isolation
  assert:
    that:
      - not podman_secret_test_a_rotated
      - podman_secret_test_b_rotated

- name: _verify | Scenario 4 — cleanup secrets A and B
  containers.podman.podman_secret:
    name: "{{ item }}"
    state: absent
  loop:
    - podman_secret_test_a
    - podman_secret_test_b
  become: true

# Scenario 5 — the state=absent tombstone path: create a secret, then remove
# it through the helper and confirm it reports removed (_rotated) and is gone
# from the store. Proves a consumer dropping a credential can retire it via the
# helper rather than a raw module call.
- name: _verify | Scenario 5 — create a secret to later remove
  import_role:
    name: podman_secret
    tasks_from: secret
  vars:
    podman_secret_args:
      name: podman_secret_tombstone
      data: doomed

- name: _verify | Scenario 5 — remove it via state=absent
  import_role:
    name: podman_secret
    tasks_from: secret
  vars:
    podman_secret_args:
      name: podman_secret_tombstone
      state: absent

- name: _verify | Scenario 5 — list secrets after removal
  containers.podman.podman_secret_info:
  register: _podman_secret_tombstone_after
  become: true

- name: _verify | Scenario 5 — assert removed and gone from the store
  assert:
    that:
      - podman_secret_tombstone_rotated
      - _podman_secret_tombstone_after.secrets | selectattr('Spec.Name', 'eq', 'podman_secret_tombstone') | list | length == 0

# Scenario 6 — the validation guards must fail loudly, not silently pass a bad
# input down to an opaque module/template error. These exercise the assert/guard
# paths that are otherwise only ever hit on the happy path.
- name: _verify | Scenario 6 — an invalid name is rejected
  block:
    - name: _verify | Scenario 6 — attempt an invalid secret name
      import_role:
        name: podman_secret
        tasks_from: secret
      vars:
        podman_secret_args:
          name: Bad.Name
          data: irrelevant
    - name: _verify | Scenario 6 — fail if the invalid name was accepted
      assert:
        that: false
        fail_msg: podman_secret accepted an invalid name
  rescue:
    - name: _verify | Scenario 6 — confirm the name-validation assert fired
      assert:
        that:
          - "'valid identifier' in (ansible_failed_result.msg | default(''))"
