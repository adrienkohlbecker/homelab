- name: Assert inputs
  assert:
    that:
      # zfs_root decides the compression direction (off on ZFS, which already
      # compresses on disk; on elsewhere). Catch missing inventory defaults here
      # rather than failing mid-loop with a cryptic "zfs_root is undefined".
      - zfs_root is defined
    fail_msg: zfs_root must be set in host/group vars (true on ZFS-root hosts, false elsewhere)
  tags:
    - logrotate

- name: Install logrotate
  apt:
    pkg:
      - logrotate
    policy_rc_d: 101
    update_cache: true
    cache_valid_time: 3600
  register: logrotate_apt
  become: true
  tags:
    - logrotate

# Service roles own their package drop-ins. These files belong to logrotate
# itself or baseline packages without a dedicated role.
- name: Configure baseline logrotate compression
  include_tasks:
    file: compression.yml
    apply:
      tags: logrotate
  loop:
    - path: /etc/logrotate.conf
    - path: /etc/logrotate.d/btmp
    - path: /etc/logrotate.d/wtmp
    - path: /etc/logrotate.d/rsyslog
      optional: true
    - path: /etc/logrotate.d/ubuntu-pro-client
      optional: true
    - path: /etc/logrotate.d/cloud-init
      optional: true
  loop_control:
    loop_var: logrotate_config
    label: "{{ logrotate_config.path }}"
  vars:
    logrotate_args:
      item: "{{ logrotate_config.path }}"
      optional: "{{ logrotate_config.optional | default(false) }}"
      condition: "{{ not (ansible_check_mode and logrotate_apt.changed) }}"
  tags:
    - logrotate
