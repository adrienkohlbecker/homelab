# Exercise both compression directions across box and minimal, including
# diversion changes, repeated helper calls, and an untouched unowned policy.
- name: _verify | Create a fixture logrotate config
  copy:
    dest: /etc/logrotate.d/_verify_logrotate
    mode: "0644"
    content: |
      /tmp/_verify_logrotate.log {
        su root root
        weekly
        missingok
        rotate 1
        {{ zfs_root | ternary('compress', '# compress # zfs already compresses disk contents') }}
        compresscmd /bin/gzip
        notifempty
      }
  become: true

- name: _verify | Register the diversion to remove on non-ZFS hosts
  when: not zfs_root
  community.general.dpkg_divert:
    path: /etc/logrotate.d/_verify_logrotate
    divert: /etc/logrotate.d/_verify_logrotate.dpkg-dist
  become: true

- name: _verify | Compression helper with condition:false over a bogus path
  import_role:
    name: logrotate
    tasks_from: compression
  vars:
    logrotate_args:
      item: /etc/logrotate.d/_verify_does_not_exist
      condition: false

- name: _verify | Assert condition:false skipped the compression replace
  assert:
    that:
      - logrotate_conf is skipped

- name: _verify | Compression helper over an absent optional config
  import_role:
    name: logrotate
    tasks_from: compression
  vars:
    logrotate_args:
      item: /etc/logrotate.d/_verify_optional_does_not_exist
      optional: true

- name: _verify | Assert optional config was checked and skipped
  assert:
    that:
      - not logrotate_optional_config.stat.exists
      - logrotate_conf is skipped

- name: _verify | Run the compression toggle over the fixture
  import_role:
    name: logrotate
    tasks_from: compression
  vars:
    logrotate_args:
      item: /etc/logrotate.d/_verify_logrotate

- name: _verify | List diversion for the fixture
  command:
    argv:
      - dpkg-divert
      - --list
      - /etc/logrotate.d/_verify_logrotate
  changed_when: false
  register: logrotate_verify_divert
  become: true

- name: _verify | Diversion matches the compression policy
  assert:
    that:
      - >-
        ('/etc/logrotate.d/_verify_logrotate.dpkg-dist' in logrotate_verify_divert.stdout)
        == zfs_root
    fail_msg: compression toggle did not reconcile the dpkg diversion

- name: _verify | Read back the toggled fixture
  slurp:
    src: /etc/logrotate.d/_verify_logrotate
  register: logrotate_verify_fixture
  become: true

- name: _verify | Assert compress matches zfs_root and compresscmd survived
  vars:
    fixture: "{{ logrotate_verify_fixture.content | b64decode }}"
  assert:
    that:
      - >-
        (zfs_root and fixture is search('(?m)^\s*# compress # zfs'))
        or (not zfs_root and fixture is search('(?m)^\s*compress\s*$'))
      - fixture is search('(?m)^\s*compresscmd /bin/gzip\s*$')
    fail_msg: compress not toggled per zfs_root, or compresscmd was clobbered

- name: _verify | Create the log to rotate
  copy:
    dest: /tmp/_verify_logrotate.log
    content: "owned log payload\n"
    mode: "0600"
  become: true

- name: _verify | Rotate the owned and unowned logs
  command:
    argv:
      - /usr/sbin/logrotate
      - --force
      - --state
      - /tmp/_verify_logrotate.state
      - /etc/logrotate.d/{{ item }}
  loop:
    - _verify_logrotate
    - _verify_logrotate_unowned
  changed_when: true
  become: true

- name: _verify | Read the rotated log in the expected format
  command:
    argv: >-
      {{ ['/bin/cat', '/tmp/_verify_logrotate.log.1'] if zfs_root
         else ['/bin/gzip', '-cd', '/tmp/_verify_logrotate.log.1.gz'] }}
  register: logrotate_verify_rotated
  changed_when: false
  failed_when: logrotate_verify_rotated.rc != 0 or logrotate_verify_rotated.stdout != 'owned log payload'
  become: true

- name: _verify | Unowned policy still compresses its log
  command: /bin/gzip -cd /tmp/_verify_logrotate_unowned.log.1.gz
  register: logrotate_verify_unowned
  changed_when: false
  failed_when: logrotate_verify_unowned.rc != 0 or logrotate_verify_unowned.stdout != 'unowned log payload'
  become: true

- name: _verify | Exercise the template helper (renders + validates)
  import_role:
    name: logrotate
    tasks_from: template
  vars:
    logrotate_args:
      src: _verify_fixture.j2
      dest: /etc/logrotate.d/_verify_logrotate_tmpl

- name: _verify | Read back the templated drop-in
  slurp:
    src: /etc/logrotate.d/_verify_logrotate_tmpl
  register: logrotate_verify_tmpl
  become: true

- name: _verify | Templated drop-in rendered compress per zfs_root
  vars:
    tmpl: "{{ logrotate_verify_tmpl.content | b64decode }}"
  assert:
    that:
      # The slurp proves it exists; the content proves the ternary rendered
      # the right form for this host.
      - >-
        (zfs_root and tmpl is search('(?m)^\s*# compress\s*$'))
        or (not zfs_root and tmpl is search('(?m)^\s*compress\s*$'))
    fail_msg: templated drop-in did not render compress per zfs_root

- name: _verify | Template helper with condition:false
  # import_tasks (not a second import_role: tasks_from: template) so it can't be
  # deduped against the real template test above into a trivially-passing assert.
  import_tasks: template.yml
  vars:
    logrotate_args:
      src: _verify_fixture.j2
      dest: /etc/logrotate.d/_verify_logrotate_cond
      condition: false

- name: _verify | Stat the condition:false template dest
  stat:
    path: /etc/logrotate.d/_verify_logrotate_cond
  register: logrotate_verify_cond
  become: true

- name: _verify | Assert condition:false skipped the template
  assert:
    that:
      - not logrotate_verify_cond.stat.exists
    fail_msg: condition:false still wrote the drop-in

- name: _verify | Remove the test diversion
  when: zfs_root
  community.general.dpkg_divert:
    path: /etc/logrotate.d/_verify_logrotate
    divert: /etc/logrotate.d/_verify_logrotate.dpkg-dist
    state: absent
  become: true

- name: _verify | Clean up fixtures
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/logrotate.d/_verify_logrotate
    - /etc/logrotate.d/_verify_logrotate_tmpl
    - /etc/logrotate.d/_verify_logrotate_unowned
    - /tmp/_verify_logrotate.log.1
    - /tmp/_verify_logrotate.log.1.gz
    - /tmp/_verify_logrotate_unowned.log.1.gz
    - /tmp/_verify_logrotate.state
  become: true
