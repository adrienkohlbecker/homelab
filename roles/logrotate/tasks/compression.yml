# Inputs: caller passes one `logrotate_args` dict:
#   configs     required; explicit list of config paths and optional flags
#   condition   optional bool, default true; gates the whole call
- name: compression | Assert inputs
  assert:
    that:
      - logrotate_args.configs is defined
      - logrotate_args.configs | length > 0
      - logrotate_args.condition is not defined or logrotate_args.condition is boolean
      - zfs_root is defined
    fail_msg: >-
      logrotate_args.configs and zfs_root are required; condition, when set,
      must be a boolean.

- name: compression | Inspect package configs
  when: logrotate_args.condition | default(true)
  stat:
    path: "{{ item.path }}"
  loop: "{{ logrotate_args.configs }}"
  loop_control:
    label: "{{ item.path }}"
  register: logrotate_configs
  become: true

# ZFS already compresses on disk, so ZFS-root hosts comment out the package
# compress directive; other hosts keep the package default untouched.
- name: compression | Disable logrotate compression on ZFS
  when:
    - zfs_root
    - logrotate_args.condition | default(true)
    - not (item.item.optional | default(false)) or item.stat.exists
  replace:
    # Match only a bare compress directive; [ \t] avoids matching across lines
    # or clobbering compresscmd/options/ext.
    regexp: ^(\s*)compress([ \t].*)?$
    replace: '\1# compress # zfs already compresses disk contents'
    path: "{{ item.item.path }}"
    backup: true
    # Package snippets can fail whole-file validation for unrelated reasons.
  loop: "{{ logrotate_configs.results | default([]) }}"
  loop_control:
    label: "{{ item.item.path }}"
  become: true
