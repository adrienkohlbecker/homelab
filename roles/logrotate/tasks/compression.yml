# Inputs: caller passes one `logrotate_args` dict:
#   configs     required; explicit list of config paths and optional flags
#   condition   optional bool, default true; gates the whole call
- name: compression | Assert inputs
  assert:
    that:
      - logrotate_args.configs is defined
      - logrotate_args.configs | length > 0
      - zfs_root is defined
    fail_msg: logrotate_args.configs and zfs_root are required

- name: compression | Inspect package configs
  when: logrotate_args.condition | default(true)
  stat:
    path: "{{ item.path }}"
  loop: "{{ logrotate_args.configs }}"
  loop_control:
    label: "{{ item.path }}"
  register: logrotate_configs
  become: true

- name: compression | Configure logrotate compression
  when:
    - logrotate_args.condition | default(true)
    - not (item.item.optional | default(false)) or item.stat.exists
  replace:
    # Match only a bare compress directive or the exact marker written here;
    # [ \t] avoids matching across lines or clobbering compresscmd/options/ext.
    regexp: "{{ zfs_root | ternary(disable_rx, enable_rx) }}"
    replace: "{{ zfs_root | ternary(disable_to, enable_to) }}"
    path: "{{ item.item.path }}"
    backup: true
    # Package snippets can fail whole-file validation for unrelated reasons.
  loop: "{{ logrotate_configs.results | default([]) }}"
  loop_control:
    label: "{{ item.item.path }}"
  become: true
  vars:
    disabled_line: '# compress # zfs already compresses disk contents'
    disable_rx: ^(\s*)compress([ \t].*)?$
    enable_rx: '^(\s*){{ disabled_line }}[ \t]*$'
    disable_to: '\1{{ disabled_line }}'
    enable_to: '\1compress'
