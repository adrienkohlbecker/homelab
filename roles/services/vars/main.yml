# Datasets carved under rpool/services on every zfs_root host. Both the
# zfs_dataset helper and _verify.yml consume this list, so one entry updates
# convergence and verification.
#
# The sqlite child carves recordsize=4K for Home Assistant's write-heavy
# recorder. It matches SQLite's page_size=4096 exactly, so each modified page
# contributes 4K to the snapshot diff instead of 128K at the parent's default.
# Compression is sacrificed because a 4K record cannot compress below the 4K
# ashift=12 sector floor, but snapshot growth is the binding constraint.
# atime=off prevents reads from dirtying the recorder dataset. primarycache and
# logbias stay at their ZFS defaults deliberately -- Home Assistant keeps only
# a small in-process SQLite page cache, so ARC still earns its keep on cold reads
# (primarycache=metadata would starve it), and the small synchronous commits
# want logbias=latency, not throughput.
#
# autobackup:bak=true tags both datasets for zfs-autobackup; the picker filters
# with `-s local` (see _verify.yml's header for why source matters).
# Order is load-bearing: ZFS requires parent datasets to exist before children.
services_datasets:
  - dataset: rpool/services
    mountpoint: /mnt/services
    extra_properties:
      'autobackup:bak': 'true'
  - dataset: rpool/services/sqlite
    mountpoint: /mnt/services/sqlite
    extra_properties:
      'autobackup:bak': 'true'
      recordsize: '4096'
      atime: 'off'
