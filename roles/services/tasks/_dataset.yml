# The dynamic include binds item before import_role while keeping
# zfs_dataset_args task-scoped; set_fact would leak it into later helper calls.
- name: _dataset | Configure dataset for {{ item.dataset }}
  import_role:
    name: zfs_dataset
    tasks_from: dataset
  vars:
    zfs_dataset_args:
      dataset: "{{ item.dataset }}"
      mountpoint: "{{ item.mountpoint }}"
      owner: root
      group: root
      mode: '0755'
      extra_properties: "{{ item.extra_properties | default({}) }}"
