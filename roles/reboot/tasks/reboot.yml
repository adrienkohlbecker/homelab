# Mitogen can retain a severed sudo.root context after a reboot, which
# wedges Ansible's become-elevated boot-id poll. Fire the reboot async,
# reset the whole connection tree, then wait on the transport-only path.
# `reboot_args.timeout` defaults to 120 seconds for normal boots.

- name: Trigger reboot
  become: true
  # Give Ansible time to detach the async job before SSH drops.
  shell: |
    set -euo pipefail
    sleep 2
    systemctl reboot
  args:
    executable: /bin/bash
  async: 60
  poll: 0
  changed_when: true

- name: Reset the connection so mitogen rebuilds its context tree
  # Load-bearing: discard the stale sudo.root child before the next become task.
  meta: reset_connection

- name: Wait for the host to come back after reboot
  wait_for_connection:
    # The probe must not match the still-up pre-reboot connection.
    delay: 15
    timeout: "{{ (reboot_args | default({})).timeout | default(120) | int }}"
