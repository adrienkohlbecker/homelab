# Mitogen can retain a severed sudo.root context when a become-elevated reboot
# severs SSH. Elevate only systemctl so Ansible polls through the base context.
- name: Reboot and wait for the host to return
  reboot:
    reboot_command: "/usr/bin/sudo -n /usr/bin/systemctl{{ ' --check-inhibitors=no' if qemu_test | default(false) else '' }} reboot"
    reboot_timeout: 240
