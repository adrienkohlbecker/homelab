# Mitogen can retain a severed sudo.root context when a become-elevated reboot
# severs SSH. Elevate only systemctl so Ansible polls through the base context.
- name: Reboot QEMU host and wait for it to return
  when: qemu_test | default(false)
  reboot:
    reboot_command: /usr/bin/sudo -n /usr/bin/systemctl --check-inhibitors=no reboot
    reboot_timeout: 240

- name: Reboot host and wait for it to return
  when: not (qemu_test | default(false))
  reboot:
    reboot_command: /usr/bin/sudo -n /usr/bin/systemctl reboot
    reboot_timeout: 240
