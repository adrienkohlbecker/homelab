- name: _verify | Reboot through the helper
  import_role:
    name: reboot
    tasks_from: reboot

# The reboot action verifies that boot_id changed. This separate become probe
# catches Mitogen retaining a severed sudo.root context across the reboot.
- name: _verify | Elevated context works after reboot
  command: id -u
  register: _reboot_verify_uid
  changed_when: false
  failed_when: _reboot_verify_uid.stdout | trim != '0'
  become: true
