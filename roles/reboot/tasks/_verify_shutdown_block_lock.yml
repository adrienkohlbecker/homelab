# Holds a root shutdown block lock the way adguard_reboot_guard does on the
# last DNS server, then makes polkit unavailable, so a following reboot must
# get through without logind's or polkit's consent. systemd 257+ logind
# enforces the lock against root. Imported by reboot and nut verification.
- name: _verify | Hold a root shutdown block lock like the DNS reboot guard
  command:
    argv:
      - systemd-run
      - --unit=verify_shutdown_block_lock
      - --collect
      - systemd-inhibit
      - --what=shutdown
      - --mode=block
      - --who=verify_shutdown_block_lock
      - --why=Simulate the last-DNS-server reboot guard
      - sleep
      - infinity
  changed_when: true
  become: true

- name: _verify | The block lock is held
  command: systemd-inhibit --list --no-legend
  register: _reboot_verify_lock
  changed_when: false
  retries: 10
  delay: 1
  until: "'verify_shutdown_block_lock' in _reboot_verify_lock.stdout"
  become: true

# A runtime mask also blocks D-Bus activation and lasts until the next reboot.
- name: _verify | Make polkit unavailable
  command: systemctl mask --runtime --now polkit.service # noqa: command-instead-of-module
  changed_when: true
  become: true
