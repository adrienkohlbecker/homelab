parsers:
  - name: lidarr_console
    format: regex
    regex: '/\A\[(?<_level>Trace|Debug|Info|Warn|Error|Fatal)\] (?<source>[^:]+): (?<log>[^\r\n]*?)[ \t]*(?:\r?\n\r?\n\[v(?<app_version>[^]]+)\] (?<exception>[\s\S]*?))?[[:space:]]*\z/'

pipeline:
  filters:
    - name: parser
      match: svc.lidarr.service
      key_name: MESSAGE
      parser: lidarr_console
      reserve_data: true
