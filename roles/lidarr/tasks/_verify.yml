# Together the unauthenticated and authenticated probes prove the configured
# API key is both required and active.
- name: _verify | Lidarr /api/v1/system/status rejects unauth'd requests
  uri:
    url: http://127.0.0.1:{{ service_ports.lidarr }}/api/v1/system/status
    status_code: 401
  register: _lidarr_http_unauth
  retries: 30
  delay: 2
  until: _lidarr_http_unauth.status == 401

# Header form keeps the key out of journald.
- name: _verify | Lidarr answers /api/v1/system/status with our apikey
  uri:
    url: http://127.0.0.1:{{ service_ports.lidarr }}/api/v1/system/status
    headers:
      X-Api-Key: "{{ lidarr_api_key }}"
    status_code: 200
  register: _lidarr_http
  retries: 30
  delay: 2
  until: _lidarr_http.status == 200
  failed_when: (_lidarr_http.json | default({})) | length == 0

- name: _verify | Verify Lidarr Authelia gate
  import_role:
    name: nginx
    tasks_from: verify_authelia_gate
  vars:
    nginx_verify_authelia_gate_args:
      subdomain: lidarr

# Lidarr rewrites config.xml only on shutdown, beyond the idempotence pass;
# restart and compare the production contract to prevent restart churn.
- name: _verify | Restart lidarr to force a config.xml writeback
  systemd:
    name: lidarr
    state: restarted
  become: true

# Any predicted change after Lidarr's writeback is configuration drift.
- name: _verify | Config.xml remains converged after lidarr's writeback
  copy:
    content: "{{ lookup('template', 'config.xml.j2') | rstrip_newlines }}"
    dest: /mnt/services/lidarr/config.xml
    owner: lidarr
    group: media
    mode: "0600"
  check_mode: true
  diff: false
  register: _lidarr_conf_check
  failed_when: _lidarr_conf_check.changed
  become: true

- name: _verify | Wait for normalized lidarr startup record in lnav store
  command:
    argv:
      - python3
      - -c
      - |
        import json
        import sys

        with open(sys.argv[1], encoding="utf-8") as handle:
            for line in handle:
                try:
                    record = json.loads(line)
                except json.JSONDecodeError:
                    continue
                fields = record.get("fields", {})
                if (
                    record.get("service") == "lidarr"
                    and record.get("message") == "Data directory is being overridden to [/config]"
                    and record.get("level") == "info"
                    and fields.get("source") == "AppFolderInfo"
                    and fields.get("parser_status") == "parsed"
                    and "CONTAINER_TAG" not in fields
                    and "CMDLINE" not in fields
                ):
                    sys.exit(0)
        sys.exit(1)
      - /var/log/fluent-bit/lnav.jsonl
  register: _lidarr_lnav_record
  changed_when: false
  retries: 30
  delay: 2
  until: _lidarr_lnav_record.rc == 0
  become: true

- name: _verify | Exercise lidarr fluent-bit record contracts
  import_role:
    name: fluentbit
    tasks_from: verify_extension
  vars:
    fluentbit_verify_args:
      name: lidarr
      records:
        - MESSAGE: "[Info] VerifyInfo: lidarr-info \n"
          CONTAINER_TAG: lidarr
          SYSLOG_IDENTIFIER: lidarr
          SYSTEMD_UNIT: lidarr.service
        - MESSAGE: "[Warn] VerifyWarn: lidarr-warn \n"
          CONTAINER_TAG: lidarr
          SYSLOG_IDENTIFIER: lidarr
          SYSTEMD_UNIT: lidarr.service
        - MESSAGE: "[Error] VerifyError: lidarr-error \n\n[v3.1.0.4875] System.InvalidOperationException: failed\n   at Verify.Run()\n"
          CONTAINER_TAG: lidarr
          SYSLOG_IDENTIFIER: lidarr
          SYSTEMD_UNIT: lidarr.service
        - MESSAGE: "[migrations] no migrations found\n"
          CONTAINER_TAG: lidarr
          SYSLOG_IDENTIFIER: lidarr
          SYSTEMD_UNIT: lidarr.service
        - MESSAGE: "[Info] Lifecycle: lidarr-unit-record \n"
          SYSLOG_IDENTIFIER: systemd
          SYSTEMD_UNIT: lidarr.service
        - MESSAGE: "[Info] RssSyncService: RSS Sync Completed. Reports found: 1, Reports grabbed: 0 \n"
          CONTAINER_TAG: lidarr
          SYSLOG_IDENTIFIER: lidarr
          SYSTEMD_UNIT: lidarr.service
      expected:
        - message: lidarr-info
          level: info
          service: lidarr
          fields.source: VerifyInfo
          fields.parser_status: parsed
          _absent:
            - fields.CONTAINER_TAG
            - fields.CMDLINE
        - message: lidarr-warn
          level: warn
          fields.source: VerifyWarn
        - message: lidarr-error
          level: error
          fields.source: VerifyError
          fields.app_version: 3.1.0.4875
          fields.exception: "System.InvalidOperationException: failed    at Verify.Run()"
        - message: "[migrations] no migrations found"
          level: info
          _absent:
            - fields.parser_status
            - fields.source
        - message: "[Info] Lifecycle: lidarr-unit-record"
          service: systemd
          _absent:
            - fields.parser_status
            - fields.source
        - message: "RSS Sync Completed. Reports found: 1, Reports grabbed: 0"
          fields.source: RssSyncService
