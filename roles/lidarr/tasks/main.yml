- name: Assert lidarr_api_key is provided
  assert:
    that:
      - (lidarr_api_key | default('')) | length > 0
    fail_msg: >-
      lidarr_api_key is required (vaulted in group_vars/{prod,test}.yml). Without it
      config.xml renders an empty <ApiKey>, lidarr self-generates a random key on
      boot, and every intra-stack X-Api-Key consumer silently breaks.
  tags:
    - lidarr

- name: Set up media runtime
  import_role:
    name: media
    tasks_from: runtime
  tags:
    - lidarr

- name: Set up lidarr system user, group, and config dir
  import_role:
    name: service_user
    tasks_from: user
  vars:
    service_user_args:
      name: lidarr
      # Match linuxserver's recursive PUID:PGID chown so Ansible does not
      # flap the configuration directory group after each container start.
      shared_group: media
  tags:
    - lidarr

- name: Configure lidarr
  # Lidarr writes config.xml without a trailing newline on shutdown.
  copy:
    content: "{{ lookup('template', 'config.xml.j2') | rstrip_newlines }}"
    dest: /mnt/services/lidarr/config.xml
    owner: lidarr
    group: media
    mode: "0600"
    backup: true
    validate: python3 -c 'import xml.etree.ElementTree as ET, sys; ET.parse(sys.argv[1])' "%s"
  register: lidarr_conf
  become: true
  # A fresh check-mode run has no resolved user or config directory yet.
  when: not ansible_check_mode or lidarr_user.uid is defined
  tags:
    - lidarr

- name: Install lidarr fluent-bit extension
  import_role:
    name: fluentbit
    tasks_from: extension
  vars:
    fluentbit_extension_args:
      name: lidarr
  tags:
    - lidarr

- name: Pull lidarr image
  import_role:
    name: podman
    tasks_from: image
  vars:
    podman_image_args:
      name: lidarr
      image: "{{ lidarr_image }}"
  tags:
    - lidarr

- name: Manage lidarr service
  import_role:
    name: systemd_unit
    tasks_from: unit
  vars:
    systemd_unit_args:
      src: lidarr.service.j2
      condition: "{{ not ansible_check_mode or lidarr_user.uid is defined }}"
      restart: "{{ lidarr_conf.changed or lidarr_user.changed or media_group.changed }}"
  tags:
    - lidarr

- name: Configure nginx
  import_role:
    name: nginx
    tasks_from: site
  vars:
    nginx_site_args:
      subdomain: lidarr
      proxy_pass: http://127.0.0.1:{{ service_ports.lidarr }}/
      # Browsers use Authelia; podman peers connect directly with X-Api-Key.
      auth: true
  tags:
    - lidarr
