# ipp-linux ships amd64 only; the helper's tasks inherit this when: so the
# version check, download and result fact are all skipped on the arm64 box.
- name: Install eaton ipp
  when: ansible_architecture == "x86_64"
  import_role:
    name: deb_install
    tasks_from: install
  vars:
    deb_install_args:
      name: ipp-linux
      version: "{{ eaton_ipp_version }}"
      url: "{{ eaton_ipp_release[ansible_architecture].url }}"
      sha256: "{{ eaton_ipp_release[ansible_architecture].sha256 }}"
      timeout: 30
  tags:
    - eaton_ipp

# The deb drops binaries and mutable state side by side under
# /usr/local/eaton/IntelligentPowerProtector on the rootfs: configs/
# (config.js with the admin password hash and shutdown thresholds, TLS
# material, scripts) and db/ (the mc2.db event database). Relocate both
# onto rpool/services so they ride the ZFS snapshot schedule and the
# offsite replica and survive a host rebuild -- the rootfs does not. The
# daemon opens both paths relative to its install dir, so directory
# symlinks are transparent to it. A future deb upgrade whose postinst
# recreates real directories next to the migrated copies is refused
# loudly below rather than reconciled silently.
- name: Create state directory on /mnt/services
  when: ansible_architecture == "x86_64" and not (ansible_check_mode and (ipp_linux_deb_changed | default(false) | bool))
  file:
    path: /mnt/services/eaton_ipp
    state: directory
    owner: eaton-ipp
    group: eaton-ipp
    mode: "0755"
  become: true
  tags:
    - eaton_ipp

- name: Check state directories for pending migration
  when: ansible_architecture == "x86_64"
  stat:
    path: /usr/local/eaton/IntelligentPowerProtector/{{ item }}
  loop:
    - configs
    - db
  register: eaton_ipp_state_src
  become: true
  tags:
    - eaton_ipp

# One-shot: only runs while a real (non-symlink) state directory sits in
# the install tree, i.e. the first converge after install or after a deb
# upgrade recreated one. Refuses before stopping anything when both sides
# exist (snapshot restore or upgrade) -- picking a side silently could
# discard live state, so the operator reconciles and re-runs.
- name: Migrate state directories onto /mnt/services
  when:
    - ansible_architecture == "x86_64"
    - not (ansible_check_mode and (ipp_linux_deb_changed | default(false) | bool))
    - eaton_ipp_state_src.results | selectattr('stat.exists') | rejectattr('stat.islnk') | list | length > 0
  shell:
    executable: /bin/bash
    cmd: |
      set -euo pipefail
      install_dir=/usr/local/eaton/IntelligentPowerProtector
      state_dir=/mnt/services/eaton_ipp
      for d in configs db; do
        if [ -d "$install_dir/$d" ] && [ ! -L "$install_dir/$d" ] && [ -e "$state_dir/$d" ]; then
          echo "Refusing to migrate $d: both $install_dir/$d and $state_dir/$d exist; move one aside and re-run" >&2
          exit 1
        fi
      done
      systemctl stop eaton-ipp.service
      for d in configs db; do
        if [ -d "$install_dir/$d" ] && [ ! -L "$install_dir/$d" ]; then
          mv "$install_dir/$d" "$state_dir/$d"
          ln -sT "$state_dir/$d" "$install_dir/$d"
          chown -h eaton-ipp:eaton-ipp "$install_dir/$d"
        fi
      done
  # The when: above already restricts this task to converges where a real
  # directory needs moving, so it always mutates when it runs.
  changed_when: true
  become: true
  tags:
    - eaton_ipp

# Steady-state enforcement of the symlinks the migration planted. Gated
# per-directory on the pre-migration stat: on the converge that migrates,
# the stat still shows a real directory (the shell above already linked
# it), and in check mode on an unmigrated host state=link would otherwise
# fail refusing to convert the directory. No force: -- a real directory
# reappearing at the dest (deb upgrade) must fail loudly, same safety as
# roles/sqlite_dataset.
- name: Symlink state directories into the install tree
  when:
    - ansible_architecture == "x86_64"
    - not (ansible_check_mode and (ipp_linux_deb_changed | default(false) | bool))
    - not item.stat.exists or item.stat.islnk
  file:
    src: /mnt/services/eaton_ipp/{{ item.item }}
    dest: /usr/local/eaton/IntelligentPowerProtector/{{ item.item }}
    state: link
    owner: eaton-ipp
    group: eaton-ipp
  loop: "{{ eaton_ipp_state_src.results }}"
  loop_control:
    label: "{{ item.item }}"
  become: true
  tags:
    - eaton_ipp

# Couple the daemon to the storage it now lives on: refuse to start ahead
# of the /mnt/services mount, and join zfs_autosnapshot.target so the
# nightly backup quiesces it around the snapshot (consistent mc2.db).
- name: Install eaton-ipp service override
  import_role:
    name: systemd_unit
    tasks_from: dropin
  vars:
    systemd_unit_args:
      src: override_service.conf.j2
      for: eaton-ipp.service
      condition: '{{ zfs_root and ansible_architecture == "x86_64" }}'
  tags:
    - eaton_ipp

- name: Enable eaton-ipp service
  import_role:
    name: systemd_unit
    tasks_from: service
  vars:
    systemd_unit_args:
      src: eaton-ipp
      # deb_install names its changed-flag after the *deb* (ipp-linux ->
      # ipp_linux_deb_changed), not the role -- so eaton_ipp_deb_changed was
      # never set and the check-mode guard collapsed to `not false` = true.
      # That ran the enable in --check even when the package wasn't installed
      # (check mode doesn't install), erroring "Could not find the requested
      # service eaton-ipp". Use the real var so the enable is correctly skipped
      # whenever the deb-install block runs under check mode.
      condition: '{{ not (ansible_check_mode and (ipp_linux_deb_changed | default(false) | bool)) and ansible_architecture == "x86_64" }}'
      restart: '{{ (ipp_linux_deb_changed | default(false) | bool) or ((eaton_ipp_service_d_override_conf_result | default({})).changed | default(false)) }}'
  tags:
    - eaton_ipp

# The eaton-ipp daemon binds 0.0.0.0:4679 (HTTP) and 0.0.0.0:4680
# (HTTPS) — config.js's "httpServers" block is not configurable down
# to loopback. External access is dropped by roles/firewall's
# default-drop input chain (nothing in nftables.conf.j2 accepts those
# ports), and confirmed by a probe: external TCP gets a RST while
# nginx reaches the UI via iif lo accept. Default admin/admin login
# is therefore only reachable via the nginx subdomain (which fronts a
# real TLS cert and could later carry CSP/auth) or via host-local
# processes, not from the broader LAN.
#
# Eaton's own ports table: TCP 4679 = "Eaton Supervision" (HTTP UI),
# TCP 4680 = "Eaton SSL Supervision" (HTTPS UI). UDP 4679/4680 are
# "Eaton Notification/Alarms Broadcast"; IPP polls the UPS over SNMP
# (UDP 161/162), so the UDP-4679-IN broadcast path isn't load-bearing
# here.
#
# Co-tenant on the same UPS: roles/nut_server runs the snmp-ups driver
# polling this Eaton over the same SNMP v1/`public` community (see
# roles/nut_server/templates/ups.conf.j2). Two pollers per host is
# deliberate; keep SNMP changes here in step with that role.
- name: Configure nginx
  import_role:
    name: nginx
    tasks_from: site
  vars:
    nginx_site_args:
      condition: '{{ ansible_architecture == "x86_64" }}'
      subdomain: ipp
      # Vendor binary has a hard-coded `admin/admin` default only
      # changeable in the IPP UI itself; Authelia gates the perimeter,
      # vendor login stays as the second wall (accept the double click).
      auth: required
      # The HTTP listener on 4679 unconditionally 301-redirects to
      # https://<host>:4680/, so proxying through it just bounces every
      # request back at the browser. Front the HTTPS listener directly;
      # the self-signed loopback cert is fine since we're on lo and the
      # site-template's proxy_ssl_server_name handles SNI.
      proxy_pass: https://localhost:{{ service_ports.eaton_ipp }}/
      location_conf: |
        # By default the header name is lowercase, and this app expects it in capitalized form, otherwise we can't login.
        proxy_set_header Content-Type      $content_type;
        proxy_set_header Cookie            $http_cookie;
  tags:
    - eaton_ipp
