# Eaton IPP is x86_64-only — the install block in main.yml is gated
# to that arch, so there's nothing to verify on aarch64.
- name: _verify | IPP install and reachability
  when: ansible_architecture == "x86_64"
  block:

    # IPP's actual function is SNMP-polling a UPS and triggering a host
    # shutdown on AC loss. The harness has no UPS attached, so we can't
    # exercise the polling path or the shutdown trigger here. Verify
    # the management UI is reachable (loopback + nginx route); the
    # SNMP/shutdown path is exercised in production by the absence of
    # spurious shutdowns, not by this verify file.

    - name: _verify | Stat the relocated state directories
      stat:
        path: /usr/local/eaton/IntelligentPowerProtector/{{ item }}
      loop:
        - configs
        - db
      register: _eaton_ipp_state_links

    - name: _verify | State directories are symlinks onto /mnt/services
      assert:
        that:
          - item.stat.islnk
          - item.stat.lnk_source == "/mnt/services/eaton_ipp/" ~ item.item
        quiet: true
      loop: "{{ _eaton_ipp_state_links.results }}"
      loop_control:
        label: "{{ item.item }}"

    # Exercise the snapshot quiesce coupling for real: stopping the target
    # must stop the daemon (PartOf=), starting it must bring the daemon
    # back (WantedBy= wants-symlink planted by the converge reenable). The
    # HTTPS probes below then prove the resumed daemon actually serves.
    # zfs_root-gated to mirror the override condition in main.yml.
    - name: _verify | Stopping the snapshot target quiesces the daemon
      when: zfs_root
      shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          systemctl stop zfs_autosnapshot.target
          state=$(systemctl is-active eaton-ipp.service || true)
          test "$state" = inactive
      changed_when: true
      become: true

    - name: _verify | Starting the snapshot target resumes the daemon
      when: zfs_root
      shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          systemctl start zfs_autosnapshot.target
          systemctl is-active eaton-ipp.service
      changed_when: true
      become: true

    # IPP's HTTP listener on 4679 unconditionally 301s to https://
    # 4680/, so the real UI only lives on the HTTPS socket. Self-
    # signed cert on the daemon; we're on loopback so there's no
    # TLS-trust guarantee to verify. Index typically redirects to a
    # login page on a fresh install — accept any reasonable
    # 2xx/3xx/4xx so the probe doesn't pin a specific UI flow. We
    # want to catch 5xx / connection failures (daemon bound but not
    # actually serving).
    - name: _verify | IPP serves HTTPS on 4680
      uri:
        url: https://localhost:{{ service_ports.eaton_ipp }}/
        validate_certs: false
        status_code: [ 200, 301, 302, 303, 401, 403 ]
      register: _eaton_ipp_http_direct
      retries: 15
      delay: 2
      until: _eaton_ipp_http_direct is succeeded

    # Map the vhost FQDN to loopback so SNI matches the served certificate.
    # Probing https://localhost with a Host: header leaves SNI=localhost, which
    # OpenSSL 3.x (noble/resolute) rejects as a fatal unrecognized_name alert
    # (status -1); hitting the FQDN directly keeps SNI correct on every release.
    - name: _verify | Map the ipp vhost FQDN to loopback for SNI-correct probing
      lineinfile:
        path: /etc/hosts
        line: "127.0.0.1 ipp.{{ inventory_hostname }}.{{ domain }}"
        state: present
      become: true

    # Snakeoil certs in test → validate_certs: false.
    - name: _verify | IPP reachable through nginx subdomain
      uri:
        url: https://ipp.{{ inventory_hostname }}.{{ domain }}/
        validate_certs: false
        status_code: [ 200, 301, 302, 303, 401, 403 ]
      register: _eaton_ipp_http_nginx
      retries: 5
      delay: 2
      until: _eaton_ipp_http_nginx is succeeded

    # The daemon creates mc2.db on first start; it appearing here proves
    # the write path really lands on the dataset, not just that the
    # symlinks point there. Bounded retry: the file shows up within a few
    # seconds of the daemon serving.
    - name: _verify | Daemon writes its database on /mnt/services
      stat:
        path: /mnt/services/eaton_ipp/db/mc2.db
      register: _eaton_ipp_db
      retries: 5
      delay: 2
      until: _eaton_ipp_db.stat.exists
