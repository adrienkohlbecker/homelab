- name: _setup | Install nginx
  import_role:
    name: test
    tasks_from: nginx

- name: _setup | Install authelia stub for auth=required tests
  import_role:
    name: test
    tasks_from: authelia_stub

# The fixture never converges roles/zfs_autobackup, so the quiesce target
# the service override couples to does not exist. Stub it so the converge
# can plant the WantedBy symlink and _verify can exercise the stop/start
# propagation for real.
- name: _setup | Install zfs_autosnapshot.target stub for the quiesce verify
  copy:
    dest: /etc/systemd/system/zfs_autosnapshot.target
    content: |
      [Unit]
      Description=Stub of the zfs-autobackup quiesce target (roles/zfs_autobackup)
    owner: root
    group: root
    mode: "0644"
  become: true

- name: _setup | Reload systemd for the stub target
  systemd:
    daemon_reload: true
  become: true
