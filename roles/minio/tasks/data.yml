- name: data | Provision buckets and access
  become: true
  tags:
    - minio
  block:
    # Feed credentials on stdin so they never land in argv. Reapply them every
    # converge so rotations and server-side drift are repaired.
    - name: data | Create users
      command: mcli admin user add default
      args:
        stdin: "{{ minio_user.access_key }}\n{{ minio_user.secret_key }}"
      changed_when: false
      loop: "{{ minio_users }}"
      loop_control:
        loop_var: minio_user
        label: "{{ minio_user.access_key }}"

    # --ignore-existing avoids coupling idempotence to the on-disk layout.
    - name: data | Create buckets
      command: mcli mb --ignore-existing default/{{ item }}
      changed_when: false
      loop: "{{ minio_buckets }}"

    # useronly scopes each user to its own bucket; admins matches the Authelia
    # OIDC group. Reapply both policies to repair server-side drift.
    - name: data | Provision IAM policies
      command: mcli admin policy add default {{ item }} /dev/stdin
      args:
        stdin: "{{ lookup('file', item ~ '.json') | from_json | to_json }}"
      changed_when: false
      loop:
        - useronly
        - admins

    - name: data | Attach useronly policy
      command: mcli admin policy set default useronly user={{ minio_user.access_key }}
      changed_when: false
      loop: "{{ minio_users }}"
      loop_control:
        loop_var: minio_user
        label: "{{ minio_user.access_key }}"
