- name: Assert required inputs are set
  assert:
    that:
      - minio_root_user | default('') | length > 0
      - minio_root_password | default('') | length > 0
      - minio_oidc_client_secret | default('') | length > 0
      - minio_users is defined
      - minio_buckets is defined
      - zfs_dozer_filesystem | length > 0
    fail_msg: >-
      minio requires minio_root_user, minio_root_password,
      minio_oidc_client_secret, minio_users, minio_buckets and non-empty
      zfs_dozer_filesystem. A mistyped vault key renders to an empty string
      that boots an auth-broken MinIO which still reaches `active`, so check
      for non-empty, not just defined.
  tags:
    - minio

# The useronly policy (files/useronly.json) scopes every user to
# arn:aws:s3:::${aws:username}, which resolves to the access_key. A user
# whose access_key has no same-named bucket authenticates fine but 403s on
# every operation -- catch that here rather than as a runtime ARQ/restic 403.
- name: Assert each minio user has a matching bucket
  assert:
    that: item.access_key in minio_buckets
    fail_msg: >-
      minio user '{{ item.access_key }}' has no bucket of the same name in
      minio_buckets. Add '{{ item.access_key }}' to minio_buckets or rename
      the user.
    quiet: true
  loop: "{{ minio_users }}"
  loop_control:
    label: "{{ item.access_key }}"
  tags:
    - minio

- name: Download minio server package
  get_url:
    url: "{{ minio_release[ansible_architecture].url }}"
    dest: /var/cache/minio.deb
    checksum: "sha256:{{ minio_release[ansible_architecture].sha256 }}"
    owner: root
    group: root
    mode: "0644"
  register: minio_deb_download
  retries: 3
  delay: 5
  until: minio_deb_download is succeeded
  become: true
  tags:
    - minio

# apt reads the archive's embedded package/version and skips an exact match.
# A missing cache is only predicted by get_url in check mode, so there is no
# local archive for apt to inspect until a real apply downloads it.
- name: Install minio server
  when: not (ansible_check_mode and minio_deb_download.changed)
  apt:
    deb: /var/cache/minio.deb
    allow_downgrade: true
  register: minio_deb
  become: true
  tags:
    - minio

- name: Create minio system user
  import_role:
    name: service_user
    tasks_from: user
  vars:
    service_user_args:
      name: minio-user
      # /mnt/minio is a ZFS mountpoint (created below), not /mnt/services/<svc>
      config_dir: false
  tags:
    - minio

- name: Provision the minio dataset
  import_role:
    name: zfs_dataset
    tasks_from: dataset
  vars:
    zfs_dataset_args:
      dataset: '{{ zfs_dozer_filesystem }}/minio'
      mountpoint: /mnt/minio
      owner: minio-user
      group: minio-user
      extra_properties:
        'autobackup:bak': 'true'
  tags:
    - minio

- name: Configure minio
  template:
    src: minio.cfg.j2
    dest: /etc/default/minio
    owner: minio-user
    group: minio-user
    mode: "0600"
    backup: true
    validate: 'sh -c ''. "%s" && test -n "${MINIO_VOLUMES:-}"'''
  register: minio_cfg
  become: true
  tags:
    - minio

- name: Install minio fluent-bit extension
  import_role:
    name: fluentbit
    tasks_from: extension
  vars:
    fluentbit_extension_args:
      name: minio
  tags:
    - minio

- name: Install minio service override
  import_role:
    name: systemd_unit
    tasks_from: install
  vars:
    systemd_unit_args:
      src: override_service.conf.j2
      for: minio.service
      condition: "{{ zfs_root }}"
  tags:
    - minio

- name: Enable minio service
  when: not (ansible_check_mode and (minio_deb_download.changed or minio_deb.changed))
  systemd:
    name: minio.service
    enabled: true
    state: >-
      {{ 'restarted'
         if minio_service_d_override_conf_result.changed or minio_cfg.changed or minio_deb.changed
         else 'started' }}
  become: true
  tags:
    - minio

- name: Configure nginx (console)
  import_role:
    name: nginx
    tasks_from: site
  vars:
    nginx_site_args:
      subdomain: minio
      proxy_pass: http://127.0.0.1:{{ service_ports.minio_console }}/
  tags:
    - minio

- name: Configure nginx (api)
  import_role:
    name: nginx
    tasks_from: site
  vars:
    nginx_site_args:
      subdomain: minio-api
      proxy_pass: http://127.0.0.1:{{ service_ports.minio_api }}/
      # MINIO_PROMETHEUS_AUTH_TYPE=public leaves the metrics endpoint
      # unauthenticated; the scrapers hit it on loopback, so close the
      # public path rather than expose bucket names/sizes.
      location_conf: |
        # Stream uploads without temporary files; the proxy uses HTTP/1.1
        # so this also applies to chunked request bodies.
        proxy_request_buffering off;
        # ARQ uploads are large: raise the body limit to avoid HTTP 413.
        client_max_body_size 60M;
        # Remote ARQ backups can traverse a DERP relay. Allow a five-minute
        # gap between body reads rather than terminating a resumable upload
        # after nginx's 60-second default.
        client_body_timeout 5m;
        location /minio/v2/metrics/ { deny all; return 404; }
  tags:
    - minio

- name: Configure minio client
  import_tasks: client.yml
  tags:
    - minio

- name: Configure minio data
  import_tasks: data.yml
  tags:
    - minio
