- name: Assert required inputs are set
  assert:
    that:
      - minio_root_user | default('') | length > 0
      - minio_root_password | default('') | length > 0
      - minio_oidc_client_secret | default('') | length > 0
      - minio_users is defined
      - zfs_dozer_filesystem | length > 0
    fail_msg: >-
      minio requires minio_root_user, minio_root_password,
      minio_oidc_client_secret, minio_users and non-empty
      zfs_dozer_filesystem. A mistyped vault key renders to an empty string
      that boots an auth-broken MinIO which still reaches `active`, so check
      for non-empty, not just defined.
  tags:
    - minio

# The server package comes first: the restart below reads results[0].
- name: Download minio server and mcli packages
  get_url:
    url: "{{ item.release[ansible_architecture].url }}"
    dest: /var/cache/{{ item.name }}.deb
    checksum: "sha256:{{ item.release[ansible_architecture].sha256 }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - name: minio
      release: "{{ minio_release }}"
    - name: mcli
      release: "{{ minio_mcli_release }}"
  loop_control:
    label: "{{ item.name }}"
  register: minio_deb_download
  retries: 3
  delay: 5
  until: minio_deb_download is succeeded
  become: true
  tags:
    - minio

# apt reads the archive's embedded package/version and skips an exact match.
# A missing cache is only predicted by get_url in check mode, so there is no
# local archive for apt to inspect until a real apply downloads it.
- name: Install minio server and mcli packages
  when: not (ansible_check_mode and item.changed)
  apt:
    deb: /var/cache/{{ item.item.name }}.deb
    allow_downgrade: true
  loop: "{{ minio_deb_download.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  register: minio_deb
  become: true
  tags:
    - minio

- name: Create minio system user
  import_role:
    name: service_user
    tasks_from: user
  vars:
    service_user_args:
      name: minio-user
      # /mnt/minio is a ZFS mountpoint (created below), not /mnt/services/<svc>
      config_dir: false
  tags:
    - minio

- name: Provision the minio dataset
  import_role:
    name: zfs_dataset
    tasks_from: dataset
  vars:
    zfs_dataset_args:
      dataset: '{{ zfs_dozer_filesystem }}/minio'
      mountpoint: /mnt/minio
      owner: minio-user
      group: minio-user
      extra_properties:
        'autobackup:bak': 'true'
  tags:
    - minio

- name: Configure minio
  template:
    src: minio.cfg.j2
    dest: /etc/default/minio
    owner: minio-user
    group: minio-user
    mode: "0600"
    backup: true
    validate: 'sh -c ''. "%s" && test -n "${MINIO_VOLUMES:-}"'''
  register: minio_cfg
  become: true
  tags:
    - minio

- name: Install minio fluent-bit extension
  import_role:
    name: fluentbit
    tasks_from: extension
  vars:
    fluentbit_extension_args:
      name: minio
  tags:
    - minio

- name: Install minio service override
  import_role:
    name: systemd_unit
    tasks_from: install
  vars:
    systemd_unit_args:
      src: override_service.conf.j2
      for: minio.service
      condition: "{{ zfs_root }}"
  tags:
    - minio

- name: Enable minio service
  when: not (ansible_check_mode and (minio_deb_download.results[0].changed or minio_deb.results[0].changed))
  systemd:
    name: minio.service
    enabled: true
    state: >-
      {{ 'restarted'
         if minio_service_d_override_conf_result.changed or minio_cfg.changed or minio_deb.results[0].changed
         else 'started' }}
  become: true
  tags:
    - minio

- name: Configure nginx (console)
  import_role:
    name: nginx
    tasks_from: site
  vars:
    nginx_site_args:
      subdomain: minio
      proxy_pass: http://127.0.0.1:{{ service_ports.minio_console }}/
  tags:
    - minio

- name: Configure nginx (api)
  import_role:
    name: nginx
    tasks_from: site
  vars:
    nginx_site_args:
      subdomain: minio-api
      proxy_pass: http://127.0.0.1:{{ service_ports.minio_api }}/
      # MINIO_PROMETHEUS_AUTH_TYPE=public leaves the metrics endpoint
      # unauthenticated; the scrapers hit it on loopback, so close the
      # public path rather than expose bucket names/sizes.
      server_conf: |
        # Stream uploads without temporary files; the proxy uses HTTP/1.1
        # so this also applies to chunked request bodies.
        proxy_request_buffering off;
        # ARQ uploads are large: raise the body limit to avoid HTTP 413.
        client_max_body_size 60M;
        # Remote ARQ backups can traverse a DERP relay. Allow a five-minute
        # gap between body reads rather than terminating a resumable upload
        # after nginx's 60-second default.
        client_body_timeout 5m;
        location /minio/v2/metrics/ { deny all; return 404; }
  tags:
    - minio

# Persist the `default` alias for the data.yml / _verify mcli calls. Feed the
# credentials as a JSON blob on stdin (`mcli alias import` reads /dev/stdin) so
# the root password never lands in argv / the process table -- unlike
# `mcli alias set`, which takes the secret as a positional arg. Re-run every
# converge so a rotated MINIO_ROOT_PASSWORD is picked up; import overwrites.
- name: Configure mcli alias
  command: mcli alias import default /dev/stdin
  args:
    stdin: "{{ {'url': 'http://localhost:' ~ service_ports.minio_api, 'accessKey': minio_root_user, 'secretKey': minio_root_password, 'api': 'S3v4', 'path': 'auto'} | to_json }}"
  changed_when: false
  become: true
  tags:
    - minio

- name: Configure minio data
  import_tasks: data.yml
  tags:
    - minio
