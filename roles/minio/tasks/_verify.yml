# Use the real vhost names so both TLS SNI and the Host header match nginx.
- name: _verify | Map the MinIO vhosts to loopback
  lineinfile:
    path: /etc/hosts
    line: "127.0.0.1 {{ item }}.{{ inventory_hostname }}.{{ domain }}"
    state: present
  loop:
    - minio-api
    - minio
  become: true

- name: _verify | Wait for normalized minio record in lnav store
  command:
    argv:
      - python3
      - -c
      - |
        import json
        import sys

        with open(sys.argv[1], encoding="utf-8") as handle:
            for line in handle:
                try:
                    record = json.loads(line)
                except json.JSONDecodeError:
                    continue
                fields = record.get("fields", {})
                if (
                    record.get("service") == "minio"
                    and fields.get("parser_status") == "parsed"
                    and "time" not in fields
                    and "message" not in fields
                ):
                    print(json.dumps(record, sort_keys=True))
                    sys.exit(0)
        sys.exit(1)
      - /var/log/fluent-bit/lnav.jsonl
  register: _minio_lnav_record
  changed_when: false
  retries: 30
  delay: 2
  until: _minio_lnav_record.rc == 0
  become: true

- name: _verify | Exercise minio fluent-bit record contracts
  import_role:
    name: fluentbit
    tasks_from: verify_extension
  vars:
    fluentbit_verify_args:
      name: minio
      records:
        - MESSAGE: '{"level":"WARNING","errKind":"MINIO","time":"2099-01-02T03:04:05Z","message":"minio-valid","parser_status":"forged","service":"attribute"}'
          SYSLOG_IDENTIFIER: minio
          SYSTEMD_UNIT: minio.service
        - MESSAGE: '{"level":"ERROR","errKind":"MINIO","time":"2099-01-02T03:04:05Z","api":{"name":"SYSTEM","args":{}},"error":{"message":"minio-nested-error","source":["cmd/server-main.go:1:cmd.serverMain()"]}}'
          SYSLOG_IDENTIFIER: minio
          SYSTEMD_UNIT: minio.service
        - MESSAGE: '{"level":"broken"'
          SYSLOG_IDENTIFIER: minio
          SYSTEMD_UNIT: minio.service
        - MESSAGE: '{"level":"ERROR","message":"must-not-parse"}'
          SYSLOG_IDENTIFIER: systemd
          SYSTEMD_UNIT: minio.service
      expected:
        - message: minio-valid
          level: warn
          service: minio
          fields.errKind: MINIO
          fields.parser_status: parsed
          fields.service: attribute
          _absent:
            - fields.time
            - fields.message
        - message: minio-nested-error
          level: error
          service: minio
          fields.errKind: MINIO
          fields.api.name: SYSTEM
          fields.error_source:
            - cmd/server-main.go:1:cmd.serverMain()
          fields.parser_status: parsed
          _absent:
            - fields.time
            - fields.error
            - fields.error_message
        - message: '{"level":"broken"'
          level: warn
          service: minio
          parse_error: minio_json
          fields.parser_status: failed
        - message: '{"level":"ERROR","message":"must-not-parse"}'
          service: systemd
          _absent:
            - fields.parser_status

# The SPA reads this endpoint to choose between a login form and an IdP redirect.
- name: _verify | MinIO console returns its login strategy through HTTPS
  uri:
    url: https://minio.{{ inventory_hostname }}.{{ domain }}/api/v1/login
    validate_certs: false
    status_code: 200
    return_content: true
  register: minio_verify_console
  retries: 30
  delay: 2
  until: minio_verify_console.status == 200 and minio_verify_console.json.loginStrategy is defined
  become: true

# Client access uses the public HTTPS path; the default loopback alias is only
# for root provisioning and inspection. The fixture certificate is self-signed.
- name: _verify | Data-plane checks
  become: true
  block:

    - name: _verify | Import an alias scoped to the provisioned user
      command: mcli alias import scoped /dev/stdin
      args:
        stdin: "{{ {'url': 'https://minio-api.' ~ inventory_hostname ~ '.' ~ domain, 'accessKey': minio_users[0].access_key, 'secretKey': minio_users[0].secret_key, 'api': 'S3v4', 'path': 'auto'} | to_json }}"
      changed_when: false

    # A signed bucket listing proves readiness of nginx, S3 and IAM together.
    - name: _verify | Wait for authenticated bucket access through HTTPS
      command: timeout 10s mcli --insecure ls scoped/{{ minio_users[0].access_key }}
      register: minio_verify_api
      changed_when: false
      retries: 30
      delay: 2
      until: minio_verify_api.rc == 0

    - name: _verify | Exercise IAM drift repair
      block:
        - name: _verify | Replace both managed policies with deny-only documents
          command: mcli admin policy add default {{ item }} /dev/stdin
          args:
            stdin: >-
              {"Version":"2012-10-17","Statement":[{"Effect":"Deny","Action":["s3:*"],"Resource":["arn:aws:s3:::*"]}]}
          loop:
            - useronly
            - admins
          changed_when: true

        - name: _verify | Drift the user assignment to admins
          command: mcli admin policy set default admins user={{ minio_users[0].access_key }}
          changed_when: true

        - name: _verify | Drift denies access to the own bucket
          command: mcli --insecure ls scoped/{{ minio_users[0].access_key }}
          register: minio_verify_denied
          changed_when: false
          failed_when: minio_verify_denied.rc == 0 or 'access denied' not in minio_verify_denied.stderr | lower
      always:
        - name: _verify | Reapply data provisioning to repair IAM
          import_tasks: data.yml

    - name: _verify | Repaired user can list its own bucket
      command: mcli --insecure ls scoped/{{ minio_users[0].access_key }}
      changed_when: false

    - name: _verify | Repaired user does not retain admin access
      command: mcli --insecure admin user list scoped
      register: minio_verify_admin_denied
      changed_when: false
      failed_when: minio_verify_admin_denied.rc == 0 or 'access denied' not in minio_verify_admin_denied.stderr | lower

    - name: _verify | Every provisioned bucket is listable
      command: mcli ls default/{{ item }}
      loop: "{{ minio_buckets }}"
      changed_when: false

    # The API must return the intended document after drift repair. OIDC claim
    # mapping to this policy still requires a manual login (see below).
    - name: _verify | Admins IAM policy is repaired
      command: mcli admin policy info default admins
      register: minio_verify_admins_policy
      changed_when: false
      failed_when: >-
        minio_verify_admins_policy.rc != 0
        or (minio_verify_admins_policy.stdout | from_json).Policy != lookup('file', 'admins.json') | from_json

- name: _verify | Inspect nginx upload temporary directory
  stat:
    path: /var/lib/nginx/body
  register: minio_verify_body_dir
  become: true

# Denying temporary-file writes makes a buffering regression fail the upload,
# including files nginx would otherwise unlink before a directory inspection.
- name: _verify | Upload through nginx without disk buffering
  become: true
  block:
    - name: _verify | Deny writes to nginx upload temporary directory
      file:
        path: /var/lib/nginx/body
        mode: "0555"

    - name: _verify | Round-trip large signed uploads over HTTP/1.1 and HTTP/2
      command:
        argv:
          - python3
          - -c
          - |
            import hashlib
            import json
            import pathlib
            import subprocess
            import sys
            import tempfile
            import uuid

            config = json.load(sys.stdin)
            credentials = "user = " + json.dumps(config["access_key"] + ":" + config["secret_key"])
            curl = ["curl", "--silent", "--show-error", "--fail-with-body", "--insecure",
                    "--max-time", "120", "--aws-sigv4", "aws:amz:us-east-1:s3", "--config", "-"]
            with tempfile.TemporaryDirectory() as directory:
                source = pathlib.Path(directory, "upload")
                payload = bytes(range(256)) * (48 * 1024 * 1024 // 256)
                source.write_bytes(payload)
                digest = hashlib.sha256(payload).hexdigest()
                target = pathlib.Path(directory, "download")
                for protocol, flags in [
                    ("1.1", ["--http1.1"]),
                    ("1.1", ["--http1.1", "--limit-rate", "4M"]),
                    ("2", ["--http2"]),
                ]:
                    url = config["url"] + "/" + config["access_key"] + "/verify_" + uuid.uuid4().hex
                    try:
                        result = subprocess.run(
                            curl + flags + ["--request", "PUT", "--data-binary", "@" + str(source),
                                            "--header", "x-amz-content-sha256: " + digest,
                                            "--write-out", "%{http_version}", url],
                            input=credentials, text=True, stdout=subprocess.PIPE, check=True,
                        )
                        assert result.stdout == protocol, result.stdout
                        subprocess.run(curl + ["--output", str(target), url],
                                       input=credentials, text=True, check=True)
                        assert target.read_bytes() == payload, "Upload content changed"
                        print("48 MiB round-trip passed:", flags, flush=True)
                    finally:
                        subprocess.run(curl + ["--request", "DELETE", url],
                                       input=credentials, text=True, check=True)
      args:
        stdin: "{{ minio_users[0] | combine({'url': 'https://minio-api.' ~ inventory_hostname ~ '.' ~ domain}) | to_json }}"
      changed_when: false
  always:
    - name: _verify | Restore nginx upload temporary directory permissions
      file:
        path: /var/lib/nginx/body
        mode: "{{ minio_verify_body_dir.stat.mode }}"

# OIDC login and the admins claim are verified manually on prod. The fixture
# lacks Authelia, a discovery-host mapping, and a trusted certificate for it.
# Required OIDC inputs are asserted in main.yml; login behavior is not tested here.
