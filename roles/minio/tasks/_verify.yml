- name: _verify | Wait for normalized minio record in lnav store
  import_role:
    name: fluentbit
    tasks_from: verify_live
  vars:
    fluentbit_verify_live_args:
      expected:
        - service: minio
          _present:
            - fields.errKind
          _absent:
            - fields.time
            - fields.message

- name: _verify | Exercise minio fluent-bit record contracts
  import_role:
    name: fluentbit
    tasks_from: verify_extension
  vars:
    fluentbit_verify_args:
      name: minio
      records:
        - MESSAGE: '{"level":"WARNING","errKind":"MINIO","time":"2099-01-02T03:04:05Z","message":"minio-valid","service":"attribute"}'
          SYSLOG_IDENTIFIER: minio
          SYSTEMD_UNIT: minio.service
        - MESSAGE: '{"level":"ERROR","errKind":"MINIO","time":"2099-01-02T03:04:05Z","api":{"name":"SYSTEM","args":{}},"error":{"message":"minio-nested-error","source":["cmd/server-main.go:1:cmd.serverMain()"]}}'
          SYSLOG_IDENTIFIER: minio
          SYSTEMD_UNIT: minio.service
        - MESSAGE: '{"level":"broken"'
          SYSLOG_IDENTIFIER: minio
          SYSTEMD_UNIT: minio.service
        - MESSAGE: '{"level":"ERROR","message":"must-not-parse"}'
          SYSLOG_IDENTIFIER: systemd
          SYSTEMD_UNIT: minio.service
      expected:
        - message: minio-valid
          level: warn
          service: minio
          fields.errKind: MINIO
          fields.service: attribute
          _absent:
            - fields.time
            - fields.message
        - message: minio-nested-error
          level: error
          service: minio
          fields.errKind: MINIO
          fields.api.name: SYSTEM
          fields.error_source:
            - cmd/server-main.go:1:cmd.serverMain()
          _absent:
            - fields.time
            - fields.error
            - fields.error_message
        - message: '{"level":"broken"'
          level: warn
          service: minio
          parse_error: minio_json
        - message: '{"level":"ERROR","message":"must-not-parse"}'
          service: systemd

# The SPA reads this endpoint to choose between a login form and an IdP redirect.
- name: _verify | MinIO console returns its login strategy through HTTPS
  uri:
    url: https://minio.{{ inventory_hostname }}.{{ domain }}/api/v1/login
    validate_certs: false
    status_code: 200
    return_content: true
  register: minio_verify_console
  retries: 30
  delay: 2
  until: minio_verify_console.status == 200 and minio_verify_console.json.loginStrategy is defined
  become: true

# Client access uses the public HTTPS path; the default loopback alias is only
# for root provisioning and inspection. The fixture certificate is self-signed.
- name: _verify | Data-plane checks
  become: true
  block:

    - name: _verify | Import an alias scoped to each provisioned user
      command: mcli alias import scoped_{{ minio_user.access_key }} /dev/stdin
      args:
        stdin: "{{ {'url': 'https://minio-api.' ~ inventory_hostname ~ '.' ~ domain, 'accessKey': minio_user.access_key, 'secretKey': minio_user.secret_key, 'api': 'S3v4', 'path': 'auto'} | to_json }}"
      loop: "{{ minio_users }}"
      loop_control:
        loop_var: minio_user
        label: "{{ minio_user.access_key }}"
      changed_when: false

    # A signed bucket listing proves readiness of nginx, S3 and IAM together.
    - name: _verify | Every user has authenticated bucket access through HTTPS
      command: timeout 10s mcli --insecure ls scoped_{{ minio_user.access_key }}/{{ minio_user.access_key }}
      loop: "{{ minio_users }}"
      loop_control:
        loop_var: minio_user
        label: "{{ minio_user.access_key }}"
      register: minio_verify_api
      changed_when: false
      retries: 30
      delay: 2
      until: minio_verify_api.rc == 0

    # useronly scopes each user to the bucket named after its access key.
    - name: _verify | A user cannot list another user's bucket
      command: mcli --insecure ls scoped_{{ minio_users[0].access_key }}/{{ minio_users[1].access_key }}
      register: minio_verify_cross_user
      changed_when: false
      failed_when: minio_verify_cross_user.rc == 0 or 'access denied' not in minio_verify_cross_user.stderr | lower

# Denying temporary-file writes makes a buffering regression fail the upload,
# including files nginx would otherwise unlink before a directory inspection.
- name: _verify | Upload through nginx without disk buffering
  become: true
  block:
    - name: _verify | Deny writes to nginx upload temporary directory
      file:
        path: /var/lib/nginx/body
        mode: "0555"

    - name: _verify | Round-trip large signed uploads over HTTP/1.1 and HTTP/2
      command:
        argv:
          - python3
          - -c
          - |
            import hashlib
            import json
            import pathlib
            import subprocess
            import sys
            import tempfile
            import uuid

            config = json.load(sys.stdin)
            credentials = "user = " + json.dumps(config["access_key"] + ":" + config["secret_key"])
            curl = ["curl", "--silent", "--show-error", "--fail-with-body", "--insecure",
                    "--max-time", "120", "--aws-sigv4", "aws:amz:us-east-1:s3", "--config", "-"]
            with tempfile.TemporaryDirectory() as directory:
                source = pathlib.Path(directory, "upload")
                payload = bytes(range(256)) * (48 * 1024 * 1024 // 256)
                source.write_bytes(payload)
                digest = hashlib.sha256(payload).hexdigest()
                target = pathlib.Path(directory, "download")
                for protocol, flags in [
                    ("1.1", ["--http1.1"]),
                    ("2", ["--http2"]),
                ]:
                    url = config["url"] + "/" + config["access_key"] + "/verify_" + uuid.uuid4().hex
                    try:
                        result = subprocess.run(
                            curl + flags + ["--request", "PUT", "--data-binary", "@" + str(source),
                                            "--header", "x-amz-content-sha256: " + digest,
                                            "--write-out", "%{http_version}", url],
                            input=credentials, text=True, stdout=subprocess.PIPE, check=True,
                        )
                        assert result.stdout == protocol, result.stdout
                        subprocess.run(curl + ["--output", str(target), url],
                                       input=credentials, text=True, check=True)
                        assert target.read_bytes() == payload, "Upload content changed"
                        print("48 MiB round-trip passed:", flags, flush=True)
                    finally:
                        subprocess.run(curl + ["--request", "DELETE", url],
                                       input=credentials, text=True, check=True)
      args:
        stdin: "{{ minio_users[0] | combine({'url': 'https://minio-api.' ~ inventory_hostname ~ '.' ~ domain}) | to_json }}"
      changed_when: false

# OIDC login and the admins claim are verified manually on prod. The fixture
# lacks Authelia, a discovery-host mapping, and a trusted certificate for it.
# Required OIDC inputs are asserted in main.yml; login behavior is not tested here.
