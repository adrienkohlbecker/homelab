parsers:
  - name: gitlab_runner_json
    format: json

pipeline:
  filters:
    - name: modify
      match: svc.gitlab_runner.service
      condition: key_value_matches SYSLOG_IDENTIFIER '^gitlab-runner$'
      rename: MESSAGE log
    - name: parser
      match: svc.gitlab_runner.service
      key_name: log
      parser: gitlab_runner_json
      reserve_data: true
      preserve_key: true
    - name: modify
      match: svc.gitlab_runner.service
      condition:
        - key_value_matches SYSLOG_IDENTIFIER '^gitlab-runner$'
        - key_exists msg
        - key_exists level
      hard_rename:
        - msg log
        - level _level
      remove: time
    - name: modify
      match: svc.gitlab_runner.service
      condition:
        - key_value_matches SYSLOG_IDENTIFIER '^gitlab-runner$'
        - key_value_matches log '^\{'
        - key_does_not_exist msg
      add:
        - parse_error gitlab_runner_json
        - _level warn
