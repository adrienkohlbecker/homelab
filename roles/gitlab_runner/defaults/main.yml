# Optional deploy tuning belongs in defaults so host_vars can override it.
# Fixed values stay inline in config.toml.j2.
# Optional host-native shell executor for qemu CI fallback work on lab.
gitlab_runner_shell_enabled: false
gitlab_runner_shell_token: ""
gitlab_runner_shell_limit: 0

# Process-wide ceiling across every [[runners]] block. Each block also has an
# independent `limit`; AWS host capacity is managed separately.
gitlab_runner_concurrent: 8

# ── AWS qemu runner (instance / fleeting) ───────────────────────────────────
# Instance executor that scales an ASG from zero and runs the qemu harness on
# nested-KVM hosts. Capacity starts at one job on one host.
gitlab_runner_aws_qemu_enabled: false
gitlab_runner_aws_qemu_token: ""

# AWS SDK profile rendered under /mnt/services/gitlab_runner/.aws when the
# runner is enabled. fox is not an EC2 instance, so the plugin needs a
# manager-side AWS identity rather than an instance profile.
gitlab_runner_aws_qemu_profile: homelab-ci-fleeting
gitlab_runner_aws_qemu_region: eu-central-1
gitlab_runner_aws_qemu_access_key_id: ""
gitlab_runner_aws_qemu_secret_access_key: ""

# Terraform owns the matching ASG.
gitlab_runner_aws_qemu_asg_name: homelab-ci-qemu-host
gitlab_runner_aws_qemu_capacity_per_instance: 1
gitlab_runner_aws_qemu_max_instances: 1
gitlab_runner_aws_qemu_idle_time: "15m"
gitlab_runner_aws_qemu_username: ubuntu

# Dedicated one-host pool for _site_test. It reuses the AWS plugin/profile and
# has its own GitLab token and Terraform-owned ASG.
gitlab_runner_aws_qemu_site_token: ""
gitlab_runner_aws_qemu_site_asg_name: homelab-ci-qemu-site
gitlab_runner_aws_qemu_site_idle_time: "5m"
