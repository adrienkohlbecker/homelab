# Optional deploy tuning belongs in defaults so inventory vars can override it.
# Fixed values stay inline in config.toml.j2.
# Optional host-native shell executor for qemu CI fallback work on lab.
gitlab_runner_shell_enabled: false
gitlab_runner_shell_token: ""

# Process-wide ceiling across every [[runners]] block. Each block also has an
# independent `limit`; AWS host capacity is managed separately.
gitlab_runner_concurrent: 8

# ── AWS qemu runners (instance / fleeting) ──────────────────────────────────
# Instance executors that scale Terraform-owned ASGs from zero and run the qemu
# harness on nested-KVM hosts. One entry per pool:
#   suffix           runner name suffix, after the inventory hostname
#   token            vaulted project-runner token
#   asg_name         Auto Scaling Group the plugin scales
#   capacity         concurrent jobs per instance
#   max_instances    autoscaler ceiling; keep it at the ASG max_size
#   idle_time        how long an idle instance survives
#   acquire_timeout  bound on waiting for a ready instance
#   ssh_key          optional static connector key whose public half the AMI
#                    bakes in; without it the plugin pushes a per-connection
#                    key through EC2 Instance Connect
gitlab_runner_aws_pools: []

# Manager-side AWS identity for every pool. fox is not an EC2 instance, so the
# plugin needs static credentials rather than an instance profile.
gitlab_runner_aws_qemu_access_key_id: ""
gitlab_runner_aws_qemu_secret_access_key: ""
