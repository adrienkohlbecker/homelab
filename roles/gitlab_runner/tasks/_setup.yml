# Recreate the prerequisites normally supplied by earlier site.yml layers.

- name: _setup | Ensure shell-runner supplementary groups exist
  when: gitlab_runner_shell_enabled
  group:
    name: "{{ item }}"
    state: present
    system: true
  loop:
    - kvm
    - homelab_ci
  become: true

- name: _setup | Install fluent-bit for structured-log integration
  import_role:
    name: fluentbit
