# Host-native GitLab Runner. fox manages the AWS fleeting pools; lab runs the
# qemu harness through a protected shell executor. Both trust operator-authored
# pipelines. The only local listener is loopback metrics.
- name: GitLab Runner
  tags:
    - gitlab_runner
  block:
    # Required inputs live in inventory vars; reject empty rendered vault values.
    - name: Assert a runner backend is configured
      assert:
        that:
          - >-
            gitlab_runner_shell_enabled | bool
            or gitlab_runner_aws_qemu_enabled | bool
            or gitlab_runner_aws_qemu_arm_enabled | bool
          - not (gitlab_runner_shell_enabled | bool) or gitlab_runner_shell_token | length > 0
        fail_msg: >-
          No gitlab_runner backend is configured for {{ inventory_hostname }},
          or the enabled shell runner has no token. Enable the shell or AWS qemu
          runner and vault its project-runner token before deploying the role.

    # fox needs manager credentials to scale the ASG; workers use their own
    # read-only instance profile.
    - name: Assert the AWS qemu runner secrets are set
      when: >-
        gitlab_runner_aws_qemu_enabled
        or gitlab_runner_aws_qemu_arm_enabled
      assert:
        that:
          - >-
            not gitlab_runner_aws_qemu_enabled
            or gitlab_runner_aws_qemu_token | length > 0
          - >-
            not gitlab_runner_aws_qemu_arm_enabled
            or gitlab_runner_aws_qemu_arm_token | length > 0
          - >-
            not gitlab_runner_aws_qemu_arm_enabled
            or gitlab_runner_aws_qemu_arm_ssh_private_key | length > 0
          - gitlab_runner_aws_qemu_access_key_id | length > 0
          - gitlab_runner_aws_qemu_secret_access_key | length > 0
        fail_msg: >-
          An AWS qemu runner is enabled but its runner token and/or the manager
          AWS credentials are unset for {{ inventory_hostname }}, or the ARM
          runner has no static connector key. Create the required project
          runners and vault their tokens, manager credentials, and ARM
          connector key before enabling the runner in prod.

    - name: Set up gitlab_runner system user, group, and config dir
      import_role:
        name: service_user
        tasks_from: user
      vars:
        service_user_args:
          name: gitlab_runner
          extra_groups: "{{ ['kvm', 'homelab_ci'] if gitlab_runner_shell_enabled else [] }}"
          home: /mnt/services/gitlab_runner

    # The checksum drives version replacement and verifies the download.
    - name: Download gitlab-runner binary
      get_url:
        url: "{{ gitlab_runner_archive[ansible_architecture].url }}"
        dest: /usr/local/bin/gitlab-runner
        checksum: "sha256:{{ gitlab_runner_archive[ansible_architecture].sha256 }}"
        owner: root
        group: root
        mode: "0755"
        backup: true
      become: true
      register: gitlab_runner_binary

    # The instance executor resolves this plugin by PATH name.
    - name: Download fleeting-plugin-aws binary
      when: >-
        gitlab_runner_aws_qemu_enabled
        or gitlab_runner_aws_qemu_arm_enabled
      get_url:
        url: "{{ gitlab_runner_fleeting_aws_archive[ansible_architecture].url }}"
        dest: /usr/local/bin/fleeting-plugin-aws
        checksum: "sha256:{{ gitlab_runner_fleeting_aws_archive[ansible_architecture].sha256 }}"
        owner: root
        group: root
        mode: "0755"
        backup: true
      become: true
      register: gitlab_runner_fleeting_aws_binary

    - name: Render AWS qemu runner credential profile
      when:
        - >-
          gitlab_runner_aws_qemu_enabled
          or gitlab_runner_aws_qemu_arm_enabled
        - not ansible_check_mode or gitlab_runner_user.uid is defined
      block:
        - name: Create gitlab_runner AWS config directory
          file:
            path: /mnt/services/gitlab_runner/.aws
            state: directory
            owner: gitlab_runner
            group: gitlab_runner
            mode: "0700"
          become: true

        - name: Render gitlab_runner AWS config
          copy:
            dest: /mnt/services/gitlab_runner/.aws/config
            owner: gitlab_runner
            group: gitlab_runner
            mode: "0600"
            backup: true
            content: |
              [profile {{ gitlab_runner_aws_qemu_profile }}]
              region = {{ gitlab_runner_aws_qemu_region }}
            validate: python3 -c 'import configparser,sys; configparser.ConfigParser().read(sys.argv[1])' %s
          become: true

        - name: Render gitlab_runner AWS credentials
          copy:
            dest: /mnt/services/gitlab_runner/.aws/credentials
            owner: gitlab_runner
            group: gitlab_runner
            mode: "0600"
            backup: true
            content: |
              [{{ gitlab_runner_aws_qemu_profile }}]
              aws_access_key_id = {{ gitlab_runner_aws_qemu_access_key_id }}
              aws_secret_access_key = {{ gitlab_runner_aws_qemu_secret_access_key }}
          become: true

    - name: Render ARM Fleeting SSH key
      when:
        - gitlab_runner_aws_qemu_arm_enabled
        - not ansible_check_mode or gitlab_runner_user.uid is defined
      block:
        - name: Create gitlab_runner SSH config directory
          file:
            path: "{{ gitlab_runner_aws_qemu_arm_ssh_private_key_path | dirname }}"
            state: directory
            owner: gitlab_runner
            group: gitlab_runner
            mode: "0700"
          become: true

        - name: Render ARM Fleeting SSH private key
          copy:
            dest: "{{ gitlab_runner_aws_qemu_arm_ssh_private_key_path }}"
            owner: gitlab_runner
            group: gitlab_runner
            mode: "0600"
            backup: true
            content: "{{ gitlab_runner_aws_qemu_arm_ssh_private_key }}\n"
            validate: ssh-keygen -y -f %s
          diff: false
          become: true
          register: gitlab_runner_aws_qemu_arm_ssh_key

    - name: Remove ARM Fleeting SSH key when disabled
      when: not gitlab_runner_aws_qemu_arm_enabled
      file:
        path: "{{ gitlab_runner_aws_qemu_arm_ssh_private_key_path }}"
        state: absent
      become: true

    # Parse TOML locally; `gitlab-runner verify` is an online registration check,
    # not a configuration linter.
    - name: Render gitlab-runner config.toml
      when: not ansible_check_mode or gitlab_runner_user.uid is defined
      template:
        src: config.toml.j2
        dest: /mnt/services/gitlab_runner/config.toml
        owner: gitlab_runner
        group: gitlab_runner
        mode: "0600"
        backup: true
        validate: python3 -c 'import sys,tomllib; tomllib.load(open(sys.argv[1], "rb"))' %s
      become: true
      register: gitlab_runner_config

    - name: Install gitlab_runner fluent-bit extension
      import_role:
        name: fluentbit
        tasks_from: extension
      vars:
        fluentbit_extension_args:
          name: gitlab_runner

    # QEMU fixtures enable without registering. Runner notices config changes,
    # but an existing autoscaler's connector keeps the settings and private key
    # loaded when its taskscaler started. Restart to apply either one.
    - name: Manage gitlab_runner.service
      import_role:
        name: systemd_unit
        tasks_from: unit
      vars:
        systemd_unit_args:
          src: gitlab_runner.service.j2
          condition: "{{ not ansible_check_mode or gitlab_runner_user.uid is defined }}"
          start: "{{ not qemu_test }}"
          restart: >-
            {{ gitlab_runner_binary.changed
               or gitlab_runner_fleeting_aws_binary.changed
               or (gitlab_runner_config.changed | default(false))
               or (gitlab_runner_aws_qemu_arm_ssh_key.changed | default(false)) }}
