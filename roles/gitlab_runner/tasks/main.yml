# GitLab Runner (host-native binary). fox uses the Docker executor against the
# runner user's rootless podman socket to orchestrate AWS test cells; lab uses a
# shell executor to run the same qemu harness locally as a CI fallback. box is
# the CI fixture. Gated on gitlab_runner_enabled.
#
# The Docker executor keeps branch code inside a job container rather than
# running it directly as the runner user. The lab shell executor deliberately
# does run job payloads as gitlab_runner so it can drive local qemu/KVM; keep
# that runner protected, project-locked, and only used through the manual lab
# fallback path. Neither executor is a hostile-multi-tenant boundary: every
# pipeline is operator-authored.
#
# No nginx vhost and no homepage bookmark on purpose: this service exposes no
# operator-facing HTTP surface. The runner UI is gitlab.com itself; the only
# local listener is the loopback Prometheus metrics endpoint (for netdata).
- name: GitLab Runner
  when: gitlab_runner_enabled | default(false) | bool
  tags:
    - gitlab_runner
  block:
    # Required input lives in host_vars and the role asserts it (CLAUDE.md).
    # It renders straight into config.toml, so an unset value would boot a
    # runner that silently fails to register -- catch it loudly here instead.
    # Non-empty, not just defined: a mistyped vault key renders to "" which
    # passes `is defined`.
    - name: Assert the required gitlab_runner secret is set
      assert:
        that:
          - gitlab_runner_token | default('') | length > 0
          - gitlab_runner_executor in ['docker', 'shell']
          - not (gitlab_runner_aws_qemu_enabled | default(false) | bool) or gitlab_runner_executor == 'docker'
        fail_msg: >-
          gitlab_runner_enabled is true but gitlab_runner_token is unset, or
          gitlab_runner_executor is unsupported/incompatible with the
          AWS qemu runner, for {{ inventory_hostname }}.
          Create a project runner on gitlab.com (Settings -> CI/CD -> Runners ->
          New project runner) with the {{ inventory_hostname }}-{{ gitlab_runner_name_suffix }}
          name/tag convention, run-untagged off, locked to the project, and
          protected; then vault the glrt- token for this host.

    # The AWS qemu runner is a manager-side instance executor. Its GitLab token
    # stays on fox, and the AWS plugin needs an SDK credential profile because
    # fox is not an EC2 instance with an instance profile. The worker hosts get
    # their own read-only instance profile; this identity only scales the ASG.
    - name: Assert the AWS qemu runner secrets are set
      when: gitlab_runner_aws_qemu_enabled
      assert:
        that:
          - gitlab_runner_aws_qemu_token | default('') | length > 0
          - (qemu_test | default(false) | bool) or (gitlab_runner_aws_qemu_access_key_id | default('') | length > 0)
          - (qemu_test | default(false) | bool) or (gitlab_runner_aws_qemu_secret_access_key | default('') | length > 0)
        fail_msg: >-
          gitlab_runner_aws_qemu_enabled is true but
          gitlab_runner_aws_qemu_token and/or the manager AWS credentials are
          unset for {{ inventory_hostname }}. Create a protected project runner
          tagged aws-shell-qemu, create an IAM access key for the
          homelab-ci-fleeting manager user, and vault the token/key values
          before enabling the runner in prod.

    # The dedicated _site_test pool reuses the role-cell pool's AWS plugin and
    # rendered .aws credential profile (both gated on the main aws_qemu flag), so
    # it can only run when the role-cell runner is also enabled; it just needs its
    # own GitLab project-runner token (tagged aws-shell-qemu-site).
    - name: Assert the AWS qemu site runner inputs are set
      when: gitlab_runner_aws_qemu_site_enabled | default(false)
      assert:
        that:
          - gitlab_runner_aws_qemu_enabled | bool
          - gitlab_runner_aws_qemu_site_token | default('') | length > 0
        fail_msg: >-
          gitlab_runner_aws_qemu_site_enabled is true but either the role-cell
          aws_qemu runner is disabled (the site pool reuses its AWS credentials)
          or gitlab_runner_aws_qemu_site_token is unset for
          {{ inventory_hostname }}. Create a protected project runner tagged
          aws-shell-qemu-site and vault its token before enabling the site pool.

    - name: Set up gitlab_runner system user, group, and config dir
      import_role:
        name: service_user
        tasks_from: user
      vars:
        service_user_args:
          name: gitlab_runner
          extra_groups: "{{ gitlab_runner_extra_groups }}"
          # Real passwd home (the unit's Environment=HOME matches): the
          # user-scope `systemctl enable podman.socket` below writes
          # ~/.config/systemd/user/, which fails against the /nonexistent
          # sentinel. The config-dir task creates the directory; createhome
          # stays off so useradd doesn't race it.
          home: /mnt/services/gitlab_runner

    # This fixed allocation is part of the runner storage format: fox's rootless
    # store maps container IDs through 165536:65536. Changing it requires an
    # explicit podman system migrate before the old store can be used again.
    - name: Configure subordinate IDs for the Docker executor
      when: gitlab_runner_executor == 'docker'
      lineinfile:
        path: /etc/{{ item }}
        regexp: '^gitlab_runner:'
        line: 'gitlab_runner:165536:65536'
        owner: root
        group: root
        mode: "0644"
        backup: true
        validate: python3 -c 'import sys; lines = [x.strip() for x in open(sys.argv[1]) if x.strip()]; sys.exit(1 if [x for x in lines if len(x.split(":")) != 3 or not x.split(":")[1].isdigit() or not x.split(":")[2].isdigit()] else 0)' "%s"
      loop:
        - subuid
        - subgid
      register: gitlab_runner_subid_result
      become: true

    - name: Warn when existing runner storage needs migration
      when:
        - gitlab_runner_executor == 'docker'
        - gitlab_runner_subid_result.changed
        - not gitlab_runner_user.changed
      debug:
        msg: "Run: sudo -u gitlab_runner podman system migrate"

    # checksum: drives re-download on a version bump (sha mismatch forces fetch)
    # and surfaces tampering on the plain-https URL.
    - name: Download gitlab-runner binary
      when: not ansible_check_mode or gitlab_runner_user.uid is defined
      get_url:
        url: "{{ gitlab_runner_archive[ansible_architecture].url }}"
        dest: /usr/local/bin/gitlab-runner
        checksum: "sha256:{{ gitlab_runner_archive[ansible_architecture].sha256 }}"
        owner: root
        group: root
        mode: "0755"
        backup: true
      become: true
      register: gitlab_runner_binary

    # The AWS instance executor's ASG plugin, manually installed and referenced
    # by PATH name in config.toml (plugin = "fleeting-plugin-aws").
    - name: Download fleeting-plugin-aws binary
      when:
        - gitlab_runner_aws_qemu_enabled
        - not ansible_check_mode or gitlab_runner_user.uid is defined
      get_url:
        url: "{{ gitlab_runner_fleeting_aws_archive[ansible_architecture].url }}"
        dest: /usr/local/bin/fleeting-plugin-aws
        checksum: "sha256:{{ gitlab_runner_fleeting_aws_archive[ansible_architecture].sha256 }}"
        owner: root
        group: root
        mode: "0755"
        backup: true
      become: true
      register: gitlab_runner_fleeting_aws_binary

    - name: Render AWS qemu runner credential profile
      when:
        - gitlab_runner_aws_qemu_enabled
        - not ansible_check_mode or gitlab_runner_user.uid is defined
      block:
        - name: Create gitlab_runner AWS config directory
          file:
            path: /mnt/services/gitlab_runner/.aws
            state: directory
            owner: gitlab_runner
            group: gitlab_runner
            mode: "0700"
          become: true

        - name: Render gitlab_runner AWS config
          copy:
            dest: /mnt/services/gitlab_runner/.aws/config
            owner: gitlab_runner
            group: gitlab_runner
            mode: "0600"
            backup: true
            content: |
              [profile {{ gitlab_runner_aws_qemu_profile }}]
              region = {{ gitlab_runner_aws_qemu_region }}
            validate: python3 -c 'import configparser,sys; configparser.ConfigParser().read(sys.argv[1])' %s
          become: true

        - name: Render gitlab_runner AWS credentials
          copy:
            dest: /mnt/services/gitlab_runner/.aws/credentials
            owner: gitlab_runner
            group: gitlab_runner
            mode: "0600"
            backup: true
            content: |
              [{{ gitlab_runner_aws_qemu_profile }}]
              aws_access_key_id = {{ gitlab_runner_aws_qemu_access_key_id | default('TEST_PLACEHOLDER_DO_NOT_USE') }}
              aws_secret_access_key = {{ gitlab_runner_aws_qemu_secret_access_key | default('TEST_PLACEHOLDER_DO_NOT_USE') }}
          become: true

    # Linger so rootless podman has a user systemd manager up at all times:
    # crun makes sd-bus calls when creating containers, which fail with
    # "Permission denied" without one. The helper enables linger and waits
    # for user@<uid>.service (which provides the dbus + cgroup hierarchy
    # crun expects) so the socket tasks below find a live bus. Rootless podman
    # is the one accepted user-scope exception (CLAUDE.md "Prefer system-scope
    # systemd units").
    - name: Turn on linger
      when: gitlab_runner_executor == 'docker'
      import_role:
        name: linger
        tasks_from: linger
      vars:
        linger_args:
          name: gitlab_runner
          uid: "{{ gitlab_runner_user.uid }}"

    - name: Install rootless podman prune timer
      when:
        - gitlab_runner_executor == 'docker'
        - not (ansible_check_mode and (gitlab_runner_user.changed or (gitlab_runner_lingered | default(false))))
      import_role:
        name: podman
        tasks_from: prune
      vars:
        podman_prune_args:
          name: gitlab_runner_podman_prune
          user: gitlab_runner
      tags:
        - gitlab_runner

    # The Docker executor dials this socket (config.toml [runners.docker]
    # host); socket-activated, so the podman service itself only runs while
    # jobs do. Storage rides the podman role's system config
    # (rootless_storage_path on the dedicated /var/lib/containers store); no
    # per-user storage.conf is needed since jobs are plain containers (no
    # uidmapped siblings).
    - name: Enable rootless podman socket
      when:
        - gitlab_runner_executor == 'docker'
        - not (ansible_check_mode and (gitlab_runner_user.changed or (gitlab_runner_lingered | default(false))))
      systemd:
        name: podman.socket
        enabled: true
        scope: user
      become: true
      become_user: gitlab_runner

    - name: Start rootless podman socket
      when:
        - gitlab_runner_executor == 'docker'
        - not (ansible_check_mode and (gitlab_runner_user.changed or (gitlab_runner_lingered | default(false))))
      systemd:
        name: podman.socket
        state: started
        scope: user
      become: true
      become_user: gitlab_runner

    # Switching the primary runner away from Docker must tear down the
    # rootless runtime state Docker mode needed. Stop the socket/service while
    # the lingering user manager is still alive, then remove the enable symlink
    # as a managerless tombstone and disable linger.
    - name: Disable Docker-executor runtime state for non-Docker executors
      when:
        - gitlab_runner_executor != 'docker'
        - not ansible_check_mode or gitlab_runner_user.uid is defined
      block:
        - name: Check whether gitlab_runner linger is enabled
          stat:
            path: /var/lib/systemd/linger/gitlab_runner
          register: gitlab_runner_linger_marker
          become: true

        - name: Remove rootless podman prune timer
          when: gitlab_runner_linger_marker.stat.exists
          import_role:
            name: systemd_timer
            tasks_from: remove
          vars:
            systemd_timer_args:
              name: gitlab_runner_podman_prune
              user: gitlab_runner

        - name: Stop and disable rootless podman.socket
          when: gitlab_runner_linger_marker.stat.exists
          systemd:
            name: podman.socket
            state: stopped
            enabled: false
            scope: user
          become: true
          become_user: gitlab_runner

        - name: Stop rootless podman.service
          when: gitlab_runner_linger_marker.stat.exists
          systemd:
            name: podman.service
            state: stopped
            scope: user
          become: true
          become_user: gitlab_runner

        - name: Remove rootless podman.socket enable symlink
          file:
            path: /mnt/services/gitlab_runner/.config/systemd/user/sockets.target.wants/podman.socket
            state: absent
          become: true

        - name: Turn off linger
          import_role:
            name: linger
            tasks_from: disable
          vars:
            linger_args:
              name: gitlab_runner
              uid: "{{ gitlab_runner_user.uid }}"

    - name: Remove subordinate IDs from the shell executor
      when: gitlab_runner_executor != 'docker'
      lineinfile:
        path: /etc/{{ item }}
        regexp: '^gitlab_runner:'
        state: absent
        owner: root
        group: root
        mode: "0644"
        backup: true
        validate: python3 -c 'import sys; lines = [x.strip() for x in open(sys.argv[1]) if x.strip()]; sys.exit(1 if [x for x in lines if len(x.split(":")) != 3 or not x.split(":")[1].isdigit() or not x.split(":")[2].isdigit()] else 0)' "%s"
      loop:
        - subuid
        - subgid
      become: true

    # 0600 + owned by the runner: holds the glrt- runner token. validate
    # parses the rendered TOML (gitlab-runner falls back to defaults on a
    # parse error, so catch typos here). A bare TOML parse is the best
    # validate available: `gitlab-runner verify` is a live server check
    # (dials gitlab.com with the configured token), not an offline lint --
    # upstream ships none.
    - name: Render gitlab-runner config.toml
      when: not ansible_check_mode or gitlab_runner_user.uid is defined
      template:
        src: config.toml.j2
        dest: /mnt/services/gitlab_runner/config.toml
        owner: gitlab_runner
        group: gitlab_runner
        mode: "0600"
        backup: true
        validate: python3 -c 'import sys,tomllib; tomllib.load(open(sys.argv[1], "rb"))' %s
      become: true

    - name: Install gitlab_runner fluent-bit extension
      import_role:
        name: fluentbit
        tasks_from: extension
      vars:
        fluentbit_extension_args:
          name: gitlab_runner

    - name: Manage gitlab_runner.service
      import_role:
        name: systemd_unit
        tasks_from: unit
      vars:
        systemd_unit_args:
          src: gitlab_runner.service.j2
          condition: "{{ not ansible_check_mode or gitlab_runner_user.uid is defined }}"
          start: "{{ not qemu_test }}"
          restart: >-
            {{ gitlab_runner_binary.changed
               or (gitlab_runner_fleeting_aws_binary.changed | default(false)) }}

    # Live registration needs a real gitlab.com runner token -- none exists in
    # the qemu harness, so enable-only under qemu_test and let _verify exercise
    # the host-side artifacts. Prod (fox) starts the runner for real. restart
    # propagates a unit or binary change only -- NOT a config change:
    # gitlab-runner hot-reloads config.toml every 3s, and the one rendered
    # setting that genuinely needs a restart (listen_address) comes from the
    # stable service_ports map, so restarting on config would risk a 30-min
    # drain for changes the runner picks up live.
    # Bound the rootless runner's user slice so a wide CI fan-out can't exhaust
    # host RAM and swap out a co-tenant control plane (fox: headscale + nginx).
    # The job containers live under user-<uid>.slice (rootless podman), not
    # under gitlab_runner.service in system.slice, so the cap goes on the slice.
    # Opt-in via host_vars (host-RAM-dependent); removed as a tombstone when
    # unconfigured. uid is service_user-allocated, so check-mode-gate the
    # fresh-user case where it only reports creation.
    - name: Cap the rootless runner user slice memory
      when:
        - gitlab_runner_executor == 'docker'
        - not ansible_check_mode or gitlab_runner_user.uid is defined
      vars:
        _slice_dropin_dir: /etc/systemd/system/user-{{ gitlab_runner_user.uid }}.slice.d
      block:
        - name: Create the runner user-slice drop-in dir
          when: gitlab_runner_memory_max | default('') | length > 0
          file:
            path: "{{ _slice_dropin_dir }}"
            state: directory
            owner: root
            group: root
            mode: "0755"
          become: true

        # No validate: a drop-in can't be checked at the template's temp path
        # (systemd-analyze needs the parent unit on the live search path), and
        # unlike a malformed unit file a bad resource-control value doesn't
        # brick daemon-reload -- systemd logs-and-ignores it. _verify asserts
        # the cap actually landed finite on the live slice, which is the
        # stronger functional check.
        - name: Render the runner user-slice memory cap  # noqa: require-validate
          when: gitlab_runner_memory_max | default('') | length > 0
          template:
            src: slice-memory.conf.j2
            dest: "{{ _slice_dropin_dir }}/50-memory.conf"
            owner: root
            group: root
            mode: "0644"
            backup: true
          become: true
          register: gitlab_runner_slice_cap

        - name: Remove the runner user-slice memory cap when unconfigured
          when: gitlab_runner_memory_max | default('') | length == 0
          file:
            path: "{{ _slice_dropin_dir }}/50-memory.conf"
            state: absent
          become: true
          register: gitlab_runner_slice_cap_removed

        # daemon-reload re-reads the slice drop-in and applies (or lifts)
        # MemoryMax/MemoryHigh on the live cgroup -- no restart needed.
        - name: Apply the user-slice memory cap change
          when: >-
            gitlab_runner_slice_cap.changed
            or gitlab_runner_slice_cap_removed.changed
          systemd:
            daemon_reload: true
            scope: system
          become: true
