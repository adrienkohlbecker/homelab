# Host-native GitLab Runner. fox manages the AWS fleeting pools; lab runs the
# qemu harness through a protected shell executor. Both trust operator-authored
# pipelines. The only local listener is loopback metrics.
- name: GitLab Runner
  tags:
    - gitlab_runner
  block:
    # Required inputs live in inventory vars; reject empty rendered vault values.
    # The AWS pools share manager credentials to scale their ASGs; workers use
    # their own read-only instance profile.
    - name: Assert the runner backends are configured
      assert:
        that:
          - gitlab_runner_shell_enabled | bool or gitlab_runner_aws_pools | length > 0
          - not (gitlab_runner_shell_enabled | bool) or gitlab_runner_shell_token | length > 0
          - gitlab_runner_aws_pools | map(attribute='token', default='') | reject | list | length == 0
          - >-
            gitlab_runner_aws_pools | length == 0
            or (gitlab_runner_aws_qemu_access_key_id | length > 0
                and gitlab_runner_aws_qemu_secret_access_key | length > 0)
        fail_msg: >-
          {{ inventory_hostname }} enables no gitlab_runner backend, or an
          enabled shell runner or AWS pool lacks its project-runner token, or
          the AWS pools lack manager credentials. Create the project runners
          and vault their tokens and the manager credentials before deploying.

    - name: Set up gitlab_runner system user, group, and config dir
      import_role:
        name: service_user
        tasks_from: user
      vars:
        service_user_args:
          name: gitlab_runner
          extra_groups: "{{ ['kvm', 'homelab_ci'] if gitlab_runner_shell_enabled else [] }}"
          home: /mnt/services/gitlab_runner

    # The checksum drives version replacement and verifies the download.
    - name: Download gitlab-runner binary
      get_url:
        url: "{{ gitlab_runner_archive[ansible_architecture].url }}"
        dest: /usr/local/bin/gitlab-runner
        checksum: "sha256:{{ gitlab_runner_archive[ansible_architecture].sha256 }}"
        owner: root
        group: root
        mode: "0755"
        backup: true
      become: true
      register: gitlab_runner_binary

    # The instance executor resolves this plugin by PATH name.
    - name: Download fleeting-plugin-aws binary
      when: gitlab_runner_aws_pools | length > 0
      get_url:
        url: "{{ gitlab_runner_fleeting_aws_archive[ansible_architecture].url }}"
        dest: /usr/local/bin/fleeting-plugin-aws
        checksum: "sha256:{{ gitlab_runner_fleeting_aws_archive[ansible_architecture].sha256 }}"
        owner: root
        group: root
        mode: "0755"
        backup: true
      become: true
      register: gitlab_runner_fleeting_aws_binary

    # The unit's HOME puts this file at the AWS SDK default path.
    - name: Render AWS qemu runner credentials
      when: gitlab_runner_aws_pools | length > 0
      block:
        - name: Create gitlab_runner AWS config directory
          file:
            path: /mnt/services/gitlab_runner/.aws
            state: directory
            owner: gitlab_runner
            group: gitlab_runner
            mode: "0700"
          become: true

        - name: Render gitlab_runner AWS credentials
          copy:
            dest: /mnt/services/gitlab_runner/.aws/credentials
            owner: gitlab_runner
            group: gitlab_runner
            mode: "0600"
            backup: true
            content: |
              [default]
              aws_access_key_id = {{ gitlab_runner_aws_qemu_access_key_id }}
              aws_secret_access_key = {{ gitlab_runner_aws_qemu_secret_access_key }}
            validate: python3 -c 'import configparser,sys; configparser.ConfigParser().read(sys.argv[1])' %s
          become: true

    - name: Render Fleeting static SSH keys
      when: gitlab_runner_aws_pools | selectattr('ssh_key', 'defined') | list | length > 0
      block:
        - name: Create gitlab_runner SSH config directory
          file:
            path: /mnt/services/gitlab_runner/.ssh
            state: directory
            owner: gitlab_runner
            group: gitlab_runner
            mode: "0700"
          become: true

        - name: Render Fleeting static SSH private keys
          copy:
            dest: /mnt/services/gitlab_runner/.ssh/{{ item.suffix }}
            owner: gitlab_runner
            group: gitlab_runner
            mode: "0600"
            backup: true
            content: "{{ item.ssh_key }}\n"
            validate: ssh-keygen -y -f %s
          loop: "{{ gitlab_runner_aws_pools | selectattr('ssh_key', 'defined') | list }}"
          loop_control:
            label: "{{ item.suffix }}"
          diff: false
          become: true
          register: gitlab_runner_aws_ssh_keys

    # Parse TOML locally; `gitlab-runner verify` is an online registration check,
    # not a configuration linter.
    - name: Render gitlab-runner config.toml
      template:
        src: config.toml.j2
        dest: /mnt/services/gitlab_runner/config.toml
        owner: gitlab_runner
        group: gitlab_runner
        mode: "0600"
        backup: true
        validate: python3 -c 'import sys,tomllib; tomllib.load(open(sys.argv[1], "rb"))' %s
      become: true
      register: gitlab_runner_config

    - name: Install gitlab_runner fluent-bit extension
      import_role:
        name: fluentbit
        tasks_from: extension
      vars:
        fluentbit_extension_args:
          name: gitlab_runner

    # Runner notices config changes, but an existing autoscaler's connector
    # keeps the settings and private key loaded when its taskscaler started.
    # Restart to apply either one.
    - name: Manage gitlab_runner.service
      import_role:
        name: systemd_unit
        tasks_from: unit
      vars:
        systemd_unit_args:
          src: gitlab_runner.service.j2
          restart: >-
            {{ gitlab_runner_binary.changed
               or gitlab_runner_fleeting_aws_binary.changed
               or (gitlab_runner_config.changed | default(false))
               or (gitlab_runner_aws_ssh_keys.changed | default(false)) }}
