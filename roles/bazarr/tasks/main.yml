- name: Set up media runtime
  import_role:
    name: media
    tasks_from: runtime
  tags:
    - bazarr

- name: Set up bazarr system user, group, and config dir
  import_role:
    name: service_user
    tasks_from: user
  vars:
    service_user_args:
      name: bazarr
      # Match linuxserver's startup chown to prevent group flapping.
      shared_group: media
  tags:
    - bazarr

- name: Create bazarr config subdirectory
  when: not ansible_check_mode or bazarr_user.uid is defined
  file:
    dest: /mnt/services/bazarr/config
    state: directory
    owner: bazarr
    group: media
    mode: "0755"
  become: true
  tags:
    - bazarr

- name: Configure bazarr
  template:
    src: config.yaml.j2
    dest: /mnt/services/bazarr/config/config.yaml
    owner: bazarr
    group: media
    mode: "0600"
    backup: true
    validate: python3 -c 'import yaml,sys; yaml.safe_load(open(sys.argv[1]))' "%s"
  register: bazarr_conf
  become: true
  when: not ansible_check_mode or bazarr_user.uid is defined
  tags:
    - bazarr

- name: Install bazarr fluent-bit extension
  import_role:
    name: fluentbit
    tasks_from: extension
  vars:
    fluentbit_extension_args:
      name: bazarr
  tags:
    - bazarr

- name: Pull bazarr image
  import_role:
    name: podman
    tasks_from: image
  vars:
    podman_image_args:
      name: bazarr
      image: "{{ bazarr_image }}"
  tags:
    - bazarr

- name: Manage bazarr service
  import_role:
    name: systemd_unit
    tasks_from: unit
  vars:
    systemd_unit_args:
      src: bazarr.service.j2
      condition: "{{ not ansible_check_mode or bazarr_user.uid is defined }}"
      restart: "{{ bazarr_conf.changed or bazarr_user.changed or media_group.changed }}"
  tags:
    - bazarr

- name: Configure nginx
  import_role:
    name: nginx
    tasks_from: site
  vars:
    nginx_site_args:
      subdomain: bazarr
      proxy_pass: http://127.0.0.1:{{ service_ports.bazarr }}/
      # Native auth stays disabled; Authelia guards browser access.
      auth: true
  tags:
    - bazarr
