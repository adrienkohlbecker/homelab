# Negative probe first: confirms /api/* enforces the apikey. Pairs with the
# auth'd probe below -- together they prove the apikey we templated is both
# required by bazarr and the one it accepted. Without this, a future bug that
# disabled apikey enforcement would let the auth'd probe pass on any key.
- name: _verify | Bazarr /api/system/status rejects unauth'd requests
  uri:
    url: http://localhost:{{ service_ports.bazarr }}/api/system/status
    status_code: 401
  register: _bazarr_http_unauth
  retries: 30
  delay: 2
  until: _bazarr_http_unauth.status == 401

# Authenticated probe -- proves the apikey we templated into config.yaml is
# the one the running container accepted, not just one we wrote to disk.
# Header form keeps the key out of journald.
- name: _verify | Bazarr answers /api/system/status with our apikey
  uri:
    url: http://localhost:{{ service_ports.bazarr }}/api/system/status
    headers:
      X-API-KEY: "{{ bazarr_api_key }}"
    status_code: 200
    return_content: true
  register: _bazarr_http
  retries: 30
  delay: 2
  until: _bazarr_http.status == 200
  failed_when: (_bazarr_http.json.data | default({})) | length == 0

- name: _verify | Wait for normalized bazarr record in lnav store
  command:
    argv:
      - python3
      - -c
      - |
        import json
        import sys

        with open(sys.argv[1], encoding="utf-8") as handle:
            for line in handle:
                try:
                    record = json.loads(line)
                except json.JSONDecodeError:
                    continue
                fields = record.get("fields", {})
                if (
                    record.get("service") == "bazarr"
                    and fields.get("parser_status") == "parsed"
                    and fields.get("logger")
                    and fields.get("thread_id")
                    and fields.get("source")
                    and isinstance(fields.get("source_line"), int)
                    and record.get("level") in {"debug", "info", "warn", "error", "fatal"}
                    and not record.get("message", "").startswith("20")
                    and "bazarr_time" not in fields
                    and "bazarr_level" not in fields
                    and "CONTAINER_TAG" not in fields
                    and "PRIORITY" not in fields
                ):
                    print(json.dumps(record, sort_keys=True))
                    sys.exit(0)
        sys.exit(1)
      - /var/log/fluent-bit/lnav.jsonl
  register: _bazarr_lnav_record
  changed_when: false
  retries: 30
  delay: 2
  until: _bazarr_lnav_record.rc == 0
  become: true

# The vhost has `auth: true`, so the real browser access pattern is an
# Authelia-gated UI -- the API path above is reached intra-stack via
# bazarr.dns.podman with X-API-KEY, bypassing nginx entirely. With the
# stub in gate mode (see _setup.yml), assert a cookieless GET / lands on
# nginx's error_page 401 =302 redirect to the portal. This is the only
# probe that fails if `auth: true` is dropped from nginx_site_args
# (the loopback apikey probes stay green without it). Asserting the 302
# returnUrl (rd=) echoes bazarr's own URL proves the request routed to
# bazarr's server_name (not the default vhost) and the request URI survived.
#
# Map the vhost FQDN to loopback so SNI matches the served certificate.
# Probing https://localhost with a Host: header leaves SNI=localhost, which
# OpenSSL 3.x (noble/resolute) rejects as a fatal unrecognized_name alert
# (status -1); hitting the FQDN directly keeps SNI correct on every release.
- name: _verify | Map the bazarr vhost FQDN to loopback for SNI-correct probing
  lineinfile:
    path: /etc/hosts
    line: "127.0.0.1 bazarr.{{ inventory_hostname }}.{{ domain }}"
    state: present
  become: true

- name: _verify | Bazarr UI gate redirects unauthenticated requests to Authelia
  uri:
    url: https://bazarr.{{ inventory_hostname }}.{{ domain }}/
    validate_certs: false
    follow_redirects: none
    status_code: 302
  register: _bazarr_nginx_gate
  failed_when: _bazarr_nginx_gate is not authelia_redirects_to('bazarr', inventory_hostname, domain)

- name: _verify | Exercise bazarr fluent-bit record contracts
  import_role:
    name: fluentbit
    tasks_from: verify_extension
  vars:
    fluentbit_verify_args:
      name: bazarr
      records:
        - MESSAGE: "2099-01-02 03:04:05,678 - root (abcdef) : CRITICAL (server:42) - bazarr-valid"
          CONTAINER_TAG: bazarr
          SYSLOG_IDENTIFIER: conmon
          SYSTEMD_UNIT: bazarr.service
          parser_status: forged
        - MESSAGE: bazarr-raw
          CONTAINER_TAG: bazarr
          SYSLOG_IDENTIFIER: conmon
          SYSTEMD_UNIT: bazarr.service
      expected:
        - message: bazarr-valid
          level: fatal
          service: bazarr
          fields.parser_status: parsed
          fields.source_line: 42
        - message: bazarr-raw
          service: bazarr
          _absent:
            - fields.parser_status
