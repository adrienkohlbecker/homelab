# Parse only records carrying Bazarr's explicit console grammar. Reserve_Data
# and Preserve_Key keep the journald envelope and raw line available until the
# Lua filter has validated the parsed schema.
[FILTER]
    Name          parser
    Match         svc.bazarr.service
    Key_Name      log
    Parser        bazarr_console
    Reserve_Data  On
    Preserve_Key  On

# The systemd input tags every record from the unit identically. The Lua filter
# uses CONTAINER_TAG presence to leave podman command and unit lifecycle output
# untouched while normalizing container output.
[FILTER]
    Name    lua
    Match   svc.bazarr.service
    script  /etc/fluent-bit/bazarr_normalize.lua
    call    normalize_bazarr
