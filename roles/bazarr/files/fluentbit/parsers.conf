# Bazarr 1.5.2 configures this console format directly in app/logger.py. Keep
# journald's arrival timestamp as the aggregate event time; bazarr_time is
# removed by normalize.lua after a successful parse.
[PARSER]
    Name   bazarr_console
    Format regex
    Regex  ^(?<bazarr_time>[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2},[0-9]{3}) - (?<logger>[[:alnum:]_.-]+)[[:space:]]+\((?<thread_id>[0-9a-f]+)\) :[[:space:]]+(?<bazarr_level>[A-Z]+) \((?<source>[[:alnum:]_.-]+):(?<source_line>[0-9]+)\) - (?<message>.*)$
    Types  source_line:integer
