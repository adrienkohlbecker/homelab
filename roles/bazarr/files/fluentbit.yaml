parsers:
  - name: bazarr_console
    format: regex
    regex: '^[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2},[0-9]{3} - (?<logger>[[:alnum:]_.-]+)[[:space:]]+\((?<thread_id>[0-9a-f]+)\) :[[:space:]]+(?<_level>[A-Z]+) \((?<source>[[:alnum:]_.-]+):(?<source_line>[0-9]+)\) - (?<message>.*)$'
    types: source_line:integer

pipeline:
  filters:
    - name: parser
      match: svc.bazarr.service
      key_name: MESSAGE
      parser: bazarr_console
      reserve_data: true
    - name: modify
      match: svc.bazarr.service
      condition:
        - key_exists CONTAINER_TAG
        - key_exists message
        - key_exists _level
      hard_rename: message log
