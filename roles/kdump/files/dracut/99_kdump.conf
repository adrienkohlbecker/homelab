# kdump capture-initrd preset, selected with "dracut --add-confdir kdump-tools"
# and never applied to normal initrds. The crash is saved after switch-root by
# kdump-tools-dump.service, so the image only needs to reach the real root.

# Include only what this host needs to boot now, the analogue of MODULES=dep
# on initramfs-tools. The kernel hook rebuilds the image as the host changes.
hostonly="yes"
hostonly_mode="strict"

# Enable the opt-in 50kdump-tools module.
force_add_dracutmodules+=" kdump-tools "

# Microcode is already applied to the CPUs and survives kexec.
early_microcode="no"
