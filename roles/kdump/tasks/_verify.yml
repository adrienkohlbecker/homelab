# Verify the bootloader integration and post-reboot capture state.

- name: _verify | Provide a reserved-memory result through Ansible
  command: printf 1
  register: kdump_kexec_crash_size
  changed_when: false

- name: _verify | Drift the kdump config before production reconciliation
  lineinfile:
    path: /etc/default/kdump-tools
    line: '# coverage fixture'
  become: true

- name: _verify | Reconcile kdump config through production tasks
  import_tasks: config.yml
  vars:
    kdump_apt_tools:
      changed: false

- name: _verify | Exercise changed kdump service lifecycle
  import_tasks: service_state.yml
  vars:
    kdump_apt_tools:
      changed: false
    kdump_dracut_rebuild:
      changed: false
  check_mode: true

- name: _verify | Reconcile policy changes made by earlier roles
  import_tasks: _verify_policy.yml

- name: _verify | Reconcile module changes made by earlier roles
  import_tasks: _verify_module_policy.yml

- name: _verify | ZBM commandline includes crashkernel
  when: zfs_root and not grub_bootloader
  command: zfs get -H -o value org.zfsbootmenu:commandline rpool/ROOT
  register: kdump_verify_zbm_cmdline
  changed_when: false
  failed_when: "'crashkernel=' not in kdump_verify_zbm_cmdline.stdout"
  become: true

# GRUB hosts delegate crashkernel configuration to the package-owned fragment.
- name: _verify | GRUB cmdline file (kdump-tools package's) includes crashkernel
  when: grub_bootloader
  slurp:
    src: /etc/default/grub.d/kdump-tools.cfg
  register: kdump_verify_grub_cfg
  failed_when: "'crashkernel=' not in (kdump_verify_grub_cfg.content | b64decode)"
  become: true

- name: _verify | Exercise post-reboot kdump state
  block:
    - name: _verify | Reboot to exercise crashkernel reservation
      import_role:
        name: reboot
        tasks_from: reboot

    - name: _verify | Detect a perf PMU for the NMI watchdog
      when: ansible_architecture == 'x86_64'
      command:
        argv:
          - find
          - /sys/bus/event_source/devices
          - -maxdepth
          - "1"
          - -name
          - cpu*
          - -print
          - -quit
      register: kdump_verify_perf_pmu
      changed_when: false

    # The timer fires three minutes after boot, after KVM and PowerTOP have had
    # time to disable the detector. Verify the policy outcome rather than the
    # timer's requested enablement state.
    - name: _verify | NMI watchdog is armed post-reboot
      when:
        - ansible_architecture == 'x86_64'
        - kdump_verify_perf_pmu.stdout | trim | length > 0
      command: cat /proc/sys/kernel/nmi_watchdog
      register: kdump_verify_nmi_watchdog
      changed_when: false
      retries: 45
      delay: 5
      until: kdump_verify_nmi_watchdog.stdout | trim == '1'
      become: true

    # A vCPU without a perf PMU cannot back the hard-lockup detector. Exercise
    # the unit directly and require its capability condition to skip cleanly.
    - name: _verify | Exercise unsupported-PMU watchdog condition
      when:
        - ansible_architecture == 'x86_64'
        - kdump_verify_perf_pmu.stdout | trim | length == 0
      systemd:
        name: kdump_nmi_watchdog.service
        state: started
      become: true

    - name: _verify | Read unsupported-PMU watchdog state
      when:
        - ansible_architecture == 'x86_64'
        - kdump_verify_perf_pmu.stdout | trim | length == 0
      systemd:
        name: kdump_nmi_watchdog.service
      register: kdump_verify_nmi_watchdog_unsupported
      become: true

    - name: _verify | Unsupported-PMU watchdog unit is cleanly skipped
      when: not (kdump_verify_nmi_watchdog_unsupported is skipped)
      assert:
        that:
          - kdump_verify_nmi_watchdog_unsupported.status.ActiveState == 'inactive'
          - kdump_verify_nmi_watchdog_unsupported.status.ConditionResult == 'no'
        fail_msg: >-
          expected the watchdog unit to skip on a guest without a perf PMU, got
          {{ kdump_verify_nmi_watchdog_unsupported.status }}

    # Wait for the oneshot loader to finish before inspecting its image.
    - name: _verify | Wait for the capture loader to finish
      systemd:
        name: kdump-tools.service
      register: kdump_verify_loader
      changed_when: false
      retries: 60
      delay: 2
      until: kdump_verify_loader.status.ActiveState == 'active'
      become: true

    # Wait for the package-native loaded-state check after reboot.
    - name: _verify | Kdump-config status reports ready to kdump
      command: kdump-config status
      register: kdump_verify_config
      changed_when: false
      retries: 30
      delay: 4
      until: kdump_verify_config.stdout is search('(?m)^current state\s*:\s*ready to kdump\s*$')
      failed_when: kdump_verify_config.stdout is not search('(?m)^current state\s*:\s*ready to kdump\s*$')
      become: true

    - name: _verify | Capture image contains the kdump safety hooks
      # Noble's unmkinitramfs probes zstd without following symlinks, so list
      # the regular per-kernel image rather than kdump-config's initrd symlink.
      command: '{{ initramfs_list_command }} /var/lib/kdump/initrd.img-{{ ansible_kernel }}'
      register: kdump_verify_initrd
      changed_when: false
      failed_when: >-
        (not initramfs_use_dracut
         and 'scripts/local-bottom/kdump-sysctl' not in kdump_verify_initrd.stdout_lines)
        or (initramfs_use_dracut
            and 'hooks/pre-pivot/99-kdump-sysctl.sh' not in kdump_verify_initrd.stdout)
      become: true

    # Without the host file the archive check below would pass vacuously, for
    # example after renaming it in the converge but not in the image policy.
    - name: _verify | Host panic policy exists for the image check
      when: initramfs_use_dracut
      stat:
        path: /etc/sysctl.d/30-kdump.conf
      register: kdump_verify_panic_sysctl
      failed_when: not kdump_verify_panic_sysctl.stat.exists
      become: true

    - name: _verify | Capture initramfs defers host panic policy until the real root
      when: initramfs_use_dracut
      assert:
        that: kdump_verify_initrd.stdout is not search('(?m)\setc/sysctl.d/30-kdump\.conf$')

    - name: _verify | Capture image can mount its ZFS root
      when: zfs_root
      assert:
        that:
          - >-
            ('scripts/zfs' in kdump_verify_initrd.stdout_lines)
            if not initramfs_use_dracut
            else ('zfs' in kdump_verify_initrd.stdout_lines)
          - kdump_verify_initrd.stdout is search('(usr/)?sbin/zpool')
        fail_msg: >-
          The capture image needs ZFS root support and the zpool tool;
          loading zfs.ko alone cannot import and mount the root dataset.

    - name: _verify | Normal boot image is generated by Dracut
      when:
        - initramfs_use_dracut
        - not qemu_test_minimal
      command: lsinitrd /boot/initrd.img-{{ ansible_kernel }}
      register: kdump_verify_boot_initrd
      changed_when: false
      failed_when: >-
        'dracut modules:' not in kdump_verify_boot_initrd.stdout
        or (zfs_root and 'zfs' not in kdump_verify_boot_initrd.stdout_lines)
        or kdump_verify_boot_initrd.stdout is search('(?m)\setc/sysctl.d/30-kdump\.conf$')
      become: true

    # Loaded state alone cannot prove the capture image can mount root and
    # write a dump. This hook runs only against disposable QEMU fixtures.
    - name: _verify | Record existing nonempty vmcores before the panic
      find:
        paths: /var/crash
        recurse: true
        patterns: dump.*
        size: 1
      register: kdump_verify_previous_vmcores
      become: true

    - name: _verify | Capture a deliberate panic and return to normal boot
      reboot:
        reboot_command: '/usr/bin/sudo -n /bin/sh -c "echo c > /proc/sysrq-trigger"'
        reboot_timeout: 240

    - name: _verify | Find a fresh nonempty captured vmcore
      find:
        paths: /var/crash
        recurse: true
        patterns: dump.*
        size: 1
      register: kdump_verify_vmcores
      failed_when: >-
        kdump_verify_vmcores.files | length == 0
        or (kdump_verify_vmcores.files | map(attribute='mtime') | max | default(0))
           <= (kdump_verify_previous_vmcores.files | map(attribute='mtime') | max | default(0))
      become: true

    - name: _verify | Saved vmcore contains the deliberate panic
      shell: |
        set -euo pipefail
        tempdir=$(mktemp -d)
        trap "rm -rf -- \"$tempdir\"" EXIT
        makedumpfile -R "$tempdir/vmcore" < {{ (kdump_verify_vmcores.files | sort(attribute="mtime") | last).path | quote }}
        makedumpfile --dump-dmesg "$tempdir/vmcore" "$tempdir/dmesg"
        grep -F "sysrq triggered crash" "$tempdir/dmesg"
      args:
        executable: /bin/bash
      changed_when: false
      become: true

    # Verify no package resets the protected crash directory across reboot.
    - name: _verify | /var/crash perms survive reboot
      stat:
        path: /var/crash
      register: kdump_verify_crash_dir
      failed_when: >-
        kdump_verify_crash_dir.stat.mode != '0750'
        or kdump_verify_crash_dir.stat.pw_name != 'root'
        or kdump_verify_crash_dir.stat.gr_name != 'root'
      become: true
