# Verify the bootloader integration and post-reboot capture state.

- name: _verify | Reconcile policy changes made by earlier roles
  import_tasks: _verify_policy.yml

- name: _verify | Reconcile module changes made by earlier roles
  import_tasks: _verify_module_policy.yml

- name: _verify | Hand the capture integration over to a native package
  import_tasks: _verify_native.yml

- name: _verify | ZBM commandline includes crashkernel
  when: zfs_root and not grub_bootloader
  command: zfs get -H -o value org.zfsbootmenu:commandline rpool/ROOT
  register: kdump_verify_zbm_cmdline
  changed_when: false
  failed_when: "'crashkernel=' not in kdump_verify_zbm_cmdline.stdout"
  become: true

# GRUB hosts delegate crashkernel configuration to the package-owned fragment.
- name: _verify | GRUB cmdline file (kdump-tools package's) includes crashkernel
  when: grub_bootloader
  slurp:
    src: /etc/default/grub.d/kdump-tools.cfg
  register: kdump_verify_grub_cfg
  failed_when: "'crashkernel=' not in (kdump_verify_grub_cfg.content | b64decode)"
  become: true

- name: _verify | Normal boot image is generated by Dracut
  when:
    - initramfs_use_dracut
    - not qemu_test_minimal
  command: lsinitrd --mod /boot/initrd.img-{{ ansible_kernel }}
  register: kdump_verify_boot_initrd
  changed_when: false
  failed_when: >-
    'dracut modules:' not in kdump_verify_boot_initrd.stdout
    or (zfs_root and 'zfs' not in kdump_verify_boot_initrd.stdout_lines)
  become: true

- name: _verify | Exercise the capture path through a deliberate panic
  import_tasks: _verify_capture.yml

# Crash memory is reserved now, so a configuration change must reload the
# loaded capture kernel rather than wait for the next boot.
- name: _verify | Exercise a kdump configuration reload
  block:
    - name: _verify | Drift the kdump config
      lineinfile:
        path: /etc/default/kdump-tools
        line: '# reload fixture'
      become: true

    - name: _verify | Kdump reconciles the config and loader
      import_tasks: main.yml

    - name: _verify | Read the reconciled config time
      stat:
        path: /etc/default/kdump-tools
        get_checksum: false
      register: kdump_verify_cfg
      become: true

    # The systemd module reports timestamps only in the local display format.
    - name: _verify | Loader restarted after the config change  # noqa: command-instead-of-module
      command: systemctl show --property=ExecMainStartTimestamp --timestamp=unix --value kdump-tools.service
      register: kdump_verify_cfg_loader
      changed_when: false
      failed_when: (kdump_verify_cfg_loader.stdout | trim)[1:] | int < kdump_verify_cfg.stat.mtime | int

- name: _verify | Detect a perf PMU for the NMI watchdog
  when: ansible_architecture == 'x86_64'
  command:
    argv:
      - find
      - /sys/bus/event_source/devices
      - -maxdepth
      - "1"
      - -name
      - cpu*
      - -print
      - -quit
  register: kdump_verify_perf_pmu
  changed_when: false

# The timer fires three minutes after boot, after KVM and PowerTOP have had
# time to disable the detector. Verify the policy outcome rather than the
# timer's requested enablement state.
- name: _verify | NMI watchdog is armed post-reboot
  when:
    - ansible_architecture == 'x86_64'
    - kdump_verify_perf_pmu.stdout | trim | length > 0
  command: cat /proc/sys/kernel/nmi_watchdog
  register: kdump_verify_nmi_watchdog
  changed_when: false
  retries: 45
  delay: 5
  until: kdump_verify_nmi_watchdog.stdout | trim == '1'
  become: true

# A vCPU without a perf PMU cannot back the hard-lockup detector. Exercise
# the unit directly and require its capability condition to skip cleanly.
- name: _verify | Exercise unsupported-PMU watchdog condition
  when:
    - ansible_architecture == 'x86_64'
    - kdump_verify_perf_pmu.stdout | trim | length == 0
  systemd:
    name: kdump_nmi_watchdog.service
    state: started
  become: true

- name: _verify | Read unsupported-PMU watchdog state
  when:
    - ansible_architecture == 'x86_64'
    - kdump_verify_perf_pmu.stdout | trim | length == 0
  systemd:
    name: kdump_nmi_watchdog.service
  register: kdump_verify_nmi_watchdog_unsupported
  become: true

- name: _verify | Unsupported-PMU watchdog unit is cleanly skipped
  when: not (kdump_verify_nmi_watchdog_unsupported is skipped)
  assert:
    that:
      - kdump_verify_nmi_watchdog_unsupported.status.ActiveState == 'inactive'
      - kdump_verify_nmi_watchdog_unsupported.status.ConditionResult == 'no'
    fail_msg: >-
      expected the watchdog unit to skip on a guest without a perf PMU, got
      {{ kdump_verify_nmi_watchdog_unsupported.status }}

# Verify no package resets the protected crash directory across reboot.
- name: _verify | /var/crash perms survive reboot
  stat:
    path: /var/crash
  register: kdump_verify_crash_dir
  failed_when: >-
    kdump_verify_crash_dir.stat.mode != '0750'
    or kdump_verify_crash_dir.stat.pw_name != 'root'
    or kdump_verify_crash_dir.stat.gr_name != 'root'
  become: true
