- name: _setup_fresh | Start without an installed capture package
  apt:
    pkg: kdump-tools
    state: absent
    purge: true
  become: true

- name: _setup_fresh | Configure kdump directly on Dracut
  import_role:
    name: kdump
    tasks_from: main

- name: _setup_fresh | Exercise the fresh capture image through a panic
  import_tasks: _verify_capture.yml

- name: _setup_fresh | Reset the package conffile before the legacy fixture
  apt:
    pkg: kdump-tools
    state: absent
    purge: true
  become: true

# A Noble host has never carried the backported integration, so the migration
# converge must install it as production does.
- name: _setup_fresh | Remove the backported capture integration before the legacy fixture
  file:
    path: '{{ item }}'
    state: absent
  loop:
    - /usr/lib/dracut/modules.d/50kdump-tools
    - /usr/lib/dracut/dracut.conf.d/kdump-tools
  become: true
