# Backport the capture integration the installed package lacks. Native
# support, even in a stable-release backport, stops the converge so the
# backport is retired rather than left overriding the package.
- name: dracut | Install capture image integration
  when:
    - initramfs_use_dracut
    - not (ansible_check_mode and kdump_apt_tools.changed)
  become: true
  tags:
    - kdump
  block:
    # The package's own Dracut module marks native support. The files below
    # cannot: the package already owns the hook, and never the local preset.
    # Exit 1 means no package owns the module path, 0 means one does, and
    # anything else is a dpkg error.
    - name: dracut | Package lacks native capture support (else retire the backport per notes/runbooks/kdump.md)
      command: dpkg-query --search /usr/lib/dracut/modules.d/50kdump-tools/module-setup.sh
      register: kdump_dracut_native
      changed_when: false
      failed_when: kdump_dracut_native.rc != 1
      check_mode: false

    - name: dracut | Create capture profile directory
      file:
        path: /usr/lib/dracut/dracut.conf.d/kdump-tools
        state: directory
        owner: root
        group: root
        mode: "0755"

    # Keep the capture preset separate from normal boot configuration.
    - name: dracut | Install capture profile and image generator
      copy:
        src: '{{ item.src }}'
        dest: '{{ item.dest }}'
        owner: root
        group: root
        mode: "{{ item.mode | default('0644') }}"
        backup: true
        validate: 'bash -n %s'
      loop:
        - src: dracut/99_kdump.conf
          dest: /usr/lib/dracut/dracut.conf.d/kdump-tools/99_kdump.conf
        # This package conffile is preserved by dpkg during upgrades.
        - src: kdump_dracut.sh
          dest: /etc/kernel/postinst.d/kdump-tools
          mode: "0755"
      loop_control:
        label: '{{ item.dest }}'
      register: kdump_dracut_files

# Rebuild every image when the capture integration changes, before the service
# reloads them. Kernel upgrades use the same hook through run-parts. Boot image
# rebuilds leave capture images on their last build; notes/runbooks/kdump.md
# covers refreshing both.
- name: dracut | Rebuild capture images after an integration change
  when:
    - initramfs_use_dracut
    - not ansible_check_mode
    - kdump_dracut_files.changed
  shell:
    cmd: |
      set -euo pipefail
      for version in $(linux-version list); do
        /etc/kernel/postinst.d/kdump-tools "$version"
      done
    chdir: /
    executable: /bin/bash
  changed_when: true
  register: kdump_dracut_rebuild
  become: true
  tags:
    - kdump
