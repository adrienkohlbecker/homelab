# Backport native capture support only while the installed package lacks it.
# Inspect package ownership so a stable-release backport is recognized too.
- name: dracut | Install capture image integration
  when:
    - initramfs_use_dracut
    - not (ansible_check_mode and kdump_apt_tools.changed)
  become: true
  tags:
    - kdump
  block:
    - name: dracut | Read package-owned capture integration files
      command: dpkg-query --listfiles kdump-tools
      changed_when: false
      check_mode: false
      register: kdump_dracut_package_files

    - name: dracut | Detect native package capture support
      set_fact:
        kdump_dracut_native: >-
          {{ '/usr/lib/dracut/modules.d/50kdump-tools/module-setup.sh'
             in kdump_dracut_package_files.stdout_lines }}

    - name: dracut | Create module and profile directories
      when: not kdump_dracut_native
      file:
        path: '{{ item }}'
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - /usr/lib/dracut/modules.d/50kdump-tools
        - /usr/lib/dracut/dracut.conf.d/kdump-tools

    # Keep the capture preset separate from normal boot configuration.
    - name: dracut | Install capture profile and sysctl hooks
      when: not kdump_dracut_native
      copy:
        src: dracut/{{ item.src }}
        dest: '{{ item.dest }}'
        owner: root
        group: root
        mode: "0644"
        backup: true
        validate: 'bash -n %s'
      loop:
        - src: 99_kdump.conf
          dest: /usr/lib/dracut/dracut.conf.d/kdump-tools/99_kdump.conf
        - src: module-setup.sh
          dest: /usr/lib/dracut/modules.d/50kdump-tools/module-setup.sh
        - src: kdump-sysctl.sh
          dest: /usr/lib/dracut/modules.d/50kdump-tools/kdump-sysctl.sh
      register: kdump_dracut_files

    # This package conffile is preserved by dpkg during upgrades.
    - name: dracut | Install the Dracut capture image generator
      when: not kdump_dracut_native
      copy:
        src: kdump_dracut.sh
        dest: /etc/kernel/postinst.d/kdump-tools
        owner: root
        group: root
        mode: "0755"
        backup: true
        validate: 'bash -n %s'
      register: kdump_dracut_generator

    - name: dracut | Inspect the native hook offered by dpkg
      when: kdump_dracut_native
      stat:
        path: /etc/kernel/postinst.d/kdump-tools.dpkg-dist
      register: kdump_dracut_pending_hook

    - name: dracut | Adopt the native package kernel hook
      when:
        - kdump_dracut_native
        - kdump_dracut_pending_hook.stat.exists
      copy:
        src: /etc/kernel/postinst.d/kdump-tools.dpkg-dist
        dest: /etc/kernel/postinst.d/kdump-tools
        remote_src: true
        owner: root
        group: root
        mode: "0755"
        backup: true
        validate: bash -n %s
      register: kdump_dracut_native_hook

    - name: dracut | Remove the adopted package conffile candidate
      when:
        - kdump_dracut_native
        - kdump_dracut_pending_hook.stat.exists
      file:
        path: /etc/kernel/postinst.d/kdump-tools.dpkg-dist
        state: absent

    # The module scripts are now package-owned; only remove our local preset.
    - name: dracut | Remove the backported capture preset
      when: kdump_dracut_native
      file:
        path: /usr/lib/dracut/dracut.conf.d/kdump-tools/99_kdump.conf
        state: absent
      register: kdump_dracut_native_profile

    - name: dracut | Read installed kernel versions
      command: linux-version list
      changed_when: false
      check_mode: false
      register: kdump_dracut_kernels

    # Capture and boot images share their inputs: Dracut, the host policy,
    # module options and the console keymap. A boot image newer than its
    # capture image means an input changed after the capture build, in this
    # run, an earlier or tagged one, or a package trigger. Kernel installs run
    # the dracut hook before kdump-tools, leaving the capture image newer.
    # Without a boot image, only a missing capture image counts.
    - name: dracut | Find capture images older than their boot image
      shell:
        cmd: |
          set -euo pipefail
          for version in {{ kdump_dracut_kernels.stdout_lines | join(" ") }}; do
            capture=/var/lib/kdump/initrd.img-$version
            if [ ! -e "$capture" ] || [ "/boot/initrd.img-$version" -nt "$capture" ]; then
              echo "$version"
            fi
          done
        executable: /bin/bash
      changed_when: false
      check_mode: false
      register: kdump_dracut_stale

# Rebuild every image when the capture integration changes, and otherwise the
# stale ones, before the service reloads them. Kernel upgrades use the same
# hook through run-parts. Check mode lists the kernels it would rebuild.
- name: dracut | Rebuild changed or stale capture images
  when:
    - initramfs_use_dracut
    - not ansible_check_mode
  command:
    cmd: /etc/kernel/postinst.d/kdump-tools {{ item }}
    chdir: /
  changed_when: true
  loop: >-
    {{ (kdump_dracut_kernels.stdout_lines
        if kdump_apt_tools.changed or kdump_dracut_files.changed
           or kdump_dracut_generator.changed or kdump_dracut_native_hook.changed
           or kdump_dracut_native_profile.changed
        else kdump_dracut_stale.stdout_lines) | default([]) }}
  register: kdump_dracut_rebuild
  become: true
  tags:
    - kdump
