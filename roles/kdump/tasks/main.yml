# Escalate kernel stalls to panic, then boot a capture kernel that writes the
# vmcore to /var/crash. Panic sysctls apply immediately; crashkernel memory
# reservation requires a reboot. Operator procedure: notes/runbooks/kdump.md.

# Some arm64 kernels omit the NMI-related knobs; probing prevents sysctl reload
# failures while preserving real errors for knobs the kernel does expose.
- name: Detect available panic sysctls
  stat:
    path: /proc/sys/kernel/{{ item.name }}
  loop:
    # nmi_watchdog is managed through the x86 kernel cmdline and re-arm timer;
    # writing its ineffective arm64 knob would report changed forever.
    - { name: hardlockup_panic, value: '1' }
    - { name: softlockup_panic, value: '1' }
    - { name: hung_task_panic, value: '1' }
    - { name: panic_on_rcu_stall, value: '1' }
    - { name: unknown_nmi_panic, value: '1' }
    - { name: panic_on_io_nmi, value: '1' }
    # Include every CPU backtrace so the lock holder is visible.
    - { name: softlockup_all_cpu_backtrace, value: '1' }
    - { name: hardlockup_all_cpu_backtrace, value: '1' }
    - { name: hung_task_all_cpu_backtrace, value: '1' }
    - { name: oops_all_cpu_backtrace, value: '1' }
    # Panic log includes tasks, memory, timers, locks, and ftrace.
    - { name: panic_print, value: '31' }
    # Reboot after panics outside the kdump capture path; the capture service
    # performs its own reboot after writing the vmcore.
    - { name: panic, value: '10' }
  register: kdump_panic_sysctls
  become: true
  tags:
    - kdump

- name: Set panic sysctls
  ansible.posix.sysctl:
    name: kernel.{{ item.item.name }}
    value: '{{ item.item.value }}'
    sysctl_file: /etc/sysctl.d/30-kdump.conf
  loop: '{{ kdump_panic_sysctls.results | selectattr("stat.exists") }}'
  loop_control:
    label: 'kernel.{{ item.item.name }}'
  become: true
  tags:
    - kdump

- name: Install kdump-tools
  apt:
    pkg:
      - kdump-tools
    policy_rc_d: 101
    cache_valid_time: 3600
  register: kdump_apt_tools
  become: true
  tags:
    - kdump

# Apport's boot script makes /var/crash world-writable, exposing vmcores that
# may contain in-memory secrets. These servers do not use its crash reporter.
- name: Purge apport (collides with /var/crash lockdown, unused)
  apt:
    pkg:
      - apport
      - apport-symptoms
      - python3-apport
      - python3-problem-report
    state: absent
    purge: true
  become: true
  tags:
    - kdump

# vmcores can contain in-memory secrets, so pin the dump directory root-only.
- name: Lock down /var/crash permissions
  when: not (ansible_check_mode and kdump_apt_tools.changed)
  file:
    path: /var/crash
    state: directory
    owner: root
    group: root
    mode: "0750"
  become: true
  tags:
    - kdump

# Existing dumps retain their package-owned modes; only correct ownership
# recursively so old content is protected too.
- name: Lock down /var/crash contents (recursive)
  when: not (ansible_check_mode and kdump_apt_tools.changed)
  file:
    path: /var/crash
    state: directory
    owner: root
    group: root
    recurse: true
  become: true
  tags:
    - kdump

# Keep the upstream structure and documentation recognizable while applying
# the local values atomically. Shell validation protects the sourced config.
- name: Copy /etc/default/kdump-tools
  when: not (ansible_check_mode and kdump_apt_tools.changed)
  copy:
    src: kdump-tools
    dest: /etc/default/kdump-tools
    owner: root
    group: root
    mode: "0644"
    backup: true
    validate: 'sh -n %s'
  become: true
  register: kdump_tools_cfg
  tags:
    - kdump

# The crashkernel range starts at 2G; fail instead of silently reserving none.
- name: Assert host has enough RAM for crashkernel reservation
  assert:
    # MemTotal excludes firmware and kernel reservations, so a 2G fixture
    # reports about 1950MB even though the kernel sees the full 2G.
    that: ansible_memtotal_mb >= 1900
    fail_msg: >-
      kdump's crashkernel range starts at 2G; host has
      {{ ansible_memtotal_mb }}MB. Either bump RAM or extend the
      range in roles/kdump/tasks/main.yml.
  tags:
    - kdump

# GRUB hosts use the package's grub.d fragment. ZBM hosts need this explicit
# command-line contribution because GRUB never runs. The high reservation holds
# the capture environment above 4G; the low reservation preserves DMA32 space
# for capture-kernel devices.
- name: Reserve crashkernel memory in ZBM commandline
  when: not grub_bootloader
  import_role:
    name: boot
    tasks_from: cmdline
  vars:
    boot_cmdline_args:
      name: crashkernel
      contents: 'crashkernel=512M,high crashkernel=128M,low'
  tags:
    - kdump

# Arm the perf-NMI detector before userspace on x86; the delayed timer below
# restores it after boot-time tuners disable it.
- name: Enable NMI hard-lockup detector on the kernel commandline
  when: ansible_architecture == 'x86_64'
  import_role:
    name: boot
    tasks_from: cmdline
  vars:
    boot_cmdline_args:
      name: nmi_watchdog
      contents: 'nmi_watchdog=1'
  tags:
    - kdump

# Start kdump-tools only when the running kernel has reserved crash memory;
# otherwise enable it for the reboot requested by the command-line change.
# Kernels without CONFIG_KEXEC_CORE omit kexec_crash_size and degrade to the
# same enable-only state, while real read errors still fail the play.
- name: Stat /sys/kernel/kexec_crash_size
  stat:
    path: /sys/kernel/kexec_crash_size
  register: kdump_kexec_crash_size_stat
  become: true
  tags:
    - kdump

- name: Read /sys/kernel/kexec_crash_size
  when: kdump_kexec_crash_size_stat.stat.exists
  slurp:
    src: /sys/kernel/kexec_crash_size
  register: kdump_kexec_crash_size
  become: true
  tags:
    - kdump

- name: Enable kdump-tools service
  when: not (ansible_check_mode and kdump_apt_tools.changed)
  systemd:
    name: kdump-tools.service
    enabled: true
    state: >-
      {{ ('restarted' if kdump_tools_cfg.changed else 'started')
         if (kdump_kexec_crash_size.content | default('') | b64decode | trim | default('0', true) | int) > 0
         else omit }}
  become: true
  tags:
    - kdump

# KVM and PowerTOP can disable the watchdog after the kernel command line arms
# it. Re-assert once after boot; the fixed delay clears KVM's asynchronous
# teardown and also covers x86 hosts without qemu-kvm.service.

# Install the timer-triggered service before validating its paired timer.
- name: Install NMI watchdog re-arm service unit
  import_role:
    name: systemd_unit
    tasks_from: install
  vars:
    systemd_unit_args:
      src: kdump_nmi_watchdog.service
      condition: "{{ ansible_architecture == 'x86_64' }}"
  tags:
    - kdump

- name: Manage NMI watchdog re-arm timer unit
  import_role:
    name: systemd_unit
    tasks_from: unit
  vars:
    systemd_unit_args:
      src: kdump_nmi_watchdog.timer
      condition: "{{ ansible_architecture == 'x86_64' }}"
  tags:
    - kdump
