parsers:
  - name: kuma_json
    format: json

pipeline:
  filters:
    - name: modify
      match: svc.kuma.service
      condition: key_exists CONTAINER_TAG
      rename: MESSAGE log
    - name: parser
      match: svc.kuma.service
      key_name: log
      parser: kuma_json
      reserve_data: true
      preserve_key: true
    - name: modify
      match: svc.kuma.service
      condition:
        - key_exists CONTAINER_TAG
        - key_exists msg
        - key_exists level
        - key_exists module
      hard_rename:
        - msg log
        - level _level
        - module source
      remove: time
    - name: modify
      match: svc.kuma.service
      condition:
        - key_exists CONTAINER_TAG
        - key_value_matches log '^\{'
        - key_does_not_exist msg
      add:
        - parse_error kuma_json
        - _level warn
