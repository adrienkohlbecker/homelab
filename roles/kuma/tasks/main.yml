- name: Set up kuma system user, group, and config dir
  import_role:
    name: service_user
    tasks_from: user
  vars:
    service_user_args:
      name: kuma
  tags:
    - kuma

- name: Install sqlite3 CLI
  # The disableAuth seed below drives the sqlite3 CLI against kuma's live DB
  # on prod (and the _verify probes use it too). libsqlite3-0 is pulled in
  # transitively by kuma; the CLI binary isn't -- install it explicitly.
  apt:
    pkg: sqlite3
    cache_valid_time: 3600
  become: true
  tags:
    - kuma

- name: Create kuma podman network
  when: not ansible_check_mode
  containers.podman.podman_network:
    name: kuma
    disable_dns: false
    state: present
  register: kuma_network
  become: true
  tags:
    - kuma

- name: Check whether podman is installed
  stat:
    path: /usr/bin/podman
  register: kuma_podman
  tags:
    - kuma

- name: Pull kuma image
  when: not ansible_check_mode or kuma_podman.stat.exists
  containers.podman.podman_image:
    name: "{{ kuma_image }}"
  register: kuma_image_pull
  retries: 3
  delay: 10
  until: kuma_image_pull is not failed
  become: true
  tags:
    - kuma

- name: Install kuma fluent-bit extension
  import_role:
    name: fluentbit
    tasks_from: extension
  vars:
    fluentbit_extension_args:
      name: kuma
  tags:
    - kuma

- name: Manage kuma service
  import_role:
    name: systemd_unit
    tasks_from: unit
  vars:
    systemd_unit_args:
      src: kuma.service.j2
      condition: "{{ not ansible_check_mode or kuma_user.uid is defined }}"
      restart: "{{ kuma_network.changed }}"
  tags:
    - kuma

# Kuma has no config knob for disabling its login, so seed its setting after
# the setup wizard creates a user. Enabling it earlier breaks auto-login because
# Kuma expects to find the first user. Authelia then remains the sole gate.
# The timeout accommodates WAL writes; changes() limits the restart to a flip.
# A missing schema is tolerated until Kuma completes its first start.
- name: Disable kuma's built-in auth (Authelia fronts it)
  when: not ansible_check_mode
  command:
    argv:
      - sqlite3
      - -cmd
      - .timeout 30000
      - /mnt/services/kuma/kuma.db
  args:
    stdin: "{{ lookup('file', 'disable_auth.sql') }}"
  register: kuma_disableauth_seed
  changed_when: (kuma_disableauth_seed.stdout | trim | int) > 0
  failed_when:
    - kuma_disableauth_seed.rc != 0
    - "'no such table' not in kuma_disableauth_seed.stderr"
  become: true
  tags:
    - kuma

- name: Restart kuma to load disableAuth
  when: kuma_disableauth_seed.changed | default(false)
  systemd:
    name: kuma.service
    state: restarted
  become: true
  tags:
    - kuma

- name: Configure nginx
  import_role:
    name: nginx
    tasks_from: site
  vars:
    nginx_site_args:
      subdomain: kuma
      proxy_pass: http://127.0.0.1:{{ service_ports.kuma }}/
      # Kuma's login is disabled above, leaving Authelia as the dashboard gate.
      auth: true
      # Off-host push monitors authenticate with the URL token, without an
      # Authelia session, so their exact endpoint bypasses auth_request.
      server_conf: |
        # Anchor the token-shaped path so future push routes stay authenticated.
        # A regex location requires proxy_pass without a URI component.
        location ~ ^/api/push/[A-Za-z0-9_-]+/?$ {
          proxy_pass http://127.0.0.1:{{ service_ports.kuma }};
          proxy_http_version 1.1;
          proxy_set_header Host              $host;
          proxy_set_header X-Real-IP         $remote_addr;
          # Do not pass a client-supplied forwarding chain to this open route.
          proxy_set_header X-Forwarded-For   $remote_addr;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header X-Forwarded-Host  $host;
        }
  tags:
    - kuma
