# Loopback probe -- the unit's --sdnotify=healthy gates systemd `active`
# on kuma's in-container healthcheck, which itself probes HTTP, so by the
# time _verify runs HTTP is already up. The short retry covers the tiny
# race between active transition and this task firing; a real failure
# reports in seconds, not minutes.
- name: _verify | Kuma answers on its loopback port
  uri:
    url: http://localhost:{{ service_ports.kuma }}/
    status_code: 200
  register: _kuma_loopback
  retries: 5
  delay: 1
  until: _kuma_loopback.status == 200
  become: true

# nginx auth-gate probe -- the UI subdomain has `auth: true`, so a
# cookieless GET / has to land on Authelia's 302 redirect chain. Validates
# both the auth_request wiring and the proxy_pass port.
#
# Map the vhost FQDN to loopback so SNI matches the served certificate.
# Probing https://localhost with a Host: header leaves SNI=localhost, which
# OpenSSL 3.x (noble/resolute) rejects as a fatal unrecognized_name alert
# (status -1); hitting the FQDN directly keeps SNI correct on every release.
- name: _verify | Map the kuma vhost FQDN to loopback for SNI-correct probing
  lineinfile:
    path: /etc/hosts
    line: "127.0.0.1 kuma.{{ inventory_hostname }}.{{ domain }}"
    state: present
  become: true

- name: _verify | Kuma UI gate redirects unauthenticated to Authelia
  uri:
    url: https://kuma.{{ inventory_hostname }}.{{ domain }}/
    validate_certs: false
    follow_redirects: none
    status_code: 302
  register: _kuma_nginx_gate
  failed_when: _kuma_nginx_gate is not authelia_redirects_to('kuma', inventory_hostname, domain, require_rd=false)
  become: true

# /api/push/ bypass -- exercises the sibling location carved out for
# push-monitor heartbeats. An unknown token still proves the request
# reached kuma: it answers with JSON `{ok:false, msg:"Monitor not
# found or not active."}` (status 404 on 1.23.13; older builds 200).
# What we actually care about is that the response came from kuma,
# not from Authelia -- a 302 here means auth_request inside `location /`
# is still firing on this path.
- name: _verify | /api/push/<token> bypasses the Authelia gate
  uri:
    url: https://kuma.{{ inventory_hostname }}.{{ domain }}/api/push/00000000
    validate_certs: false
    follow_redirects: none
    status_code: [ 200, 404 ]
  register: _kuma_push_bypass
  failed_when: >-
    _kuma_push_bypass.status == 302
    or (_kuma_push_bypass.json | default({})).get('msg') != 'Monitor not found or not active.'
  become: true

# Uid regression detector -- kuma runs as the kuma host uid directly
# (tier-1 --user, no uidmap, entrypoint shell wrapper bypassed). kuma.db
# should land owned by that user. A regression that drops the --user
# flag or re-introduces uidmap could land the file as root or another
# uid silently; assert ownership so the regression is loud.
- name: _verify | Kuma sqlite DB is owned by kuma
  stat:
    path: /mnt/services/kuma/kuma.db
  register: _kuma_db_owner
  failed_when: >-
    not _kuma_db_owner.stat.exists
    or _kuma_db_owner.stat.pw_name != 'kuma'
  become: true

# disableAuth guard probe -- main.yml must never flip disableAuth on an
# instance with no user: kuma's auto-login derefs the first user row and
# crashes the socket handshake. A fresh test VM has an empty user table, so
# assert the row was left unset. The populated-user (prod) path can't be
# driven here without scripting kuma's socket.io setup wizard to mint a
# user, so only the safety-critical guard is exercised in-harness.
- name: _verify | DisableAuth stays unset while the user table is empty
  command: >-
    sqlite3 -readonly /mnt/services/kuma/kuma.db
    "SELECT (SELECT count(*) FROM user),
            coalesce((SELECT value FROM setting WHERE key='disableAuth'), 'unset');"
  register: _kuma_disableauth
  changed_when: false
  failed_when: >-
    (_kuma_disableauth.stdout.split('|')[0] | int) == 0
    and _kuma_disableauth.stdout.split('|')[1] | trim == 'true'
  become: true

# Functional WAL probe catches a startup regression that leaves the database
# in the default delete-journal mode. Read-only probe, does not lock.
- name: _verify | Kuma sqlite is in WAL journal mode
  command: sqlite3 -readonly /mnt/services/kuma/kuma.db 'PRAGMA journal_mode;'
  register: _kuma_wal
  changed_when: false
  failed_when: _kuma_wal.stdout | trim != 'wal'
  become: true

# Positive seed path -- the empty-table guard above proves the seed is
# SKIPPED with no user; this proves it FLIPS once a user exists, the
# prod-only branch unreachable against the harness's fresh kuma (which has
# an empty user table). Run against a synthetic kuma-shaped DB so we neither
# mutate the live instance nor depend on kuma's full user schema; the
# statement mirrors main.yml's seed -- keep the two in sync.
- name: _verify | DisableAuth seed flips once, then is idempotent
  block:
    - name: _verify | Build a synthetic kuma-shaped DB with one user
      command: >-
        sqlite3 /tmp/_verify_kuma_seed.db
        "CREATE TABLE user (id INTEGER PRIMARY KEY, username TEXT);
         CREATE TABLE setting (key TEXT PRIMARY KEY, value TEXT, type TEXT);
         INSERT INTO user (username) VALUES ('_verify');"
      changed_when: true
      become: true

    - name: _verify | First seed pass mutates (changes()=1)
      command: >-
        sqlite3 -cmd ".timeout 30000" /tmp/_verify_kuma_seed.db
        "INSERT INTO setting (key, value, type)
           SELECT 'disableAuth', 'true', 'general' WHERE EXISTS (SELECT 1 FROM user)
         ON CONFLICT(key) DO UPDATE SET value='true', type='general'
           WHERE setting.value != 'true';
         SELECT changes();"
      register: _kuma_seed_first
      changed_when: false
      failed_when: (_kuma_seed_first.stdout | trim) != '1'
      become: true

    - name: _verify | Second seed pass is a no-op (changes()=0)
      command: >-
        sqlite3 -cmd ".timeout 30000" /tmp/_verify_kuma_seed.db
        "INSERT INTO setting (key, value, type)
           SELECT 'disableAuth', 'true', 'general' WHERE EXISTS (SELECT 1 FROM user)
         ON CONFLICT(key) DO UPDATE SET value='true', type='general'
           WHERE setting.value != 'true';
         SELECT changes();"
      register: _kuma_seed_second
      changed_when: false
      failed_when: (_kuma_seed_second.stdout | trim) != '0'
      become: true
  always:
    - name: _verify | Drop the synthetic DB
      file:
        path: /tmp/_verify_kuma_seed.db
        state: absent
      become: true

- name: _verify | Kuma emits native structured records
  command: podman logs kuma
  register: _kuma_container_logs
  changed_when: false
  become: true

- name: _verify | Validate kuma structured log schema
  command:
    argv:
      - python3
      - -c
      - |
        import json
        import sys

        for line in sys.stdin:
            try:
                record = json.loads(line)
            except json.JSONDecodeError:
                continue
            if (
                isinstance(record.get("time"), str)
                and isinstance(record.get("module"), str)
                and isinstance(record.get("level"), str)
                and isinstance(record.get("msg"), str)
            ):
                sys.exit(0)
        sys.exit(1)
  args:
    stdin: "{{ _kuma_container_logs.stdout }}"
  changed_when: false

- name: _verify | Wait for normalized kuma record in lnav store
  command:
    argv:
      - python3
      - -c
      - |
        import json
        import sys

        with open(sys.argv[1], encoding="utf-8") as handle:
            for line in handle:
                try:
                    record = json.loads(line)
                except json.JSONDecodeError:
                    continue
                fields = record.get("fields", {})
                if (
                    record.get("service") == "kuma"
                    and fields.get("parser_status") == "parsed"
                    and fields.get("source")
                    and fields.get("CONTAINER_ID")
                    and "time" not in fields
                    and "module" not in fields
                    and "level" not in fields
                    and "msg" not in fields
                    and "CONTAINER_TAG" not in fields
                    and "CONTAINER_ID_FULL" not in fields
                ):
                    print(json.dumps(record, sort_keys=True))
                    sys.exit(0)
        sys.exit(1)
      - /var/log/fluent-bit/lnav.jsonl
  register: _kuma_lnav_record
  changed_when: false
  retries: 30
  delay: 2
  until: _kuma_lnav_record.rc == 0
  become: true

- name: _verify | Exercise kuma fluent-bit record contracts
  import_role:
    name: fluentbit
    tasks_from: verify_extension
  vars:
    fluentbit_verify_args:
      name: kuma
      records:
        - MESSAGE: '{"time":"2099-01-02T03:04:05Z","module":"SERVER","level":"WARN","msg":"kuma-valid","parser_status":"forged","service":"attribute"}'
          CONTAINER_TAG: kuma
          SYSLOG_IDENTIFIER: conmon
          SYSTEMD_UNIT: kuma.service
        - MESSAGE: Welcome to Uptime Kuma
          CONTAINER_TAG: kuma
          SYSLOG_IDENTIFIER: conmon
          SYSTEMD_UNIT: kuma.service
        - MESSAGE: '(node:42) [DEP0040] DeprecationWarning: punycode is deprecated.'
          CONTAINER_TAG: kuma
          SYSLOG_IDENTIFIER: conmon
          SYSTEMD_UNIT: kuma.service
        - MESSAGE: '{"time":"broken"'
          CONTAINER_TAG: kuma
          SYSLOG_IDENTIFIER: conmon
          SYSTEMD_UNIT: kuma.service
        - MESSAGE: '{"time":"2099-01-02T03:04:05Z","module":"SYSTEMD","level":"ERROR","msg":"must-not-parse"}'
          SYSLOG_IDENTIFIER: systemd
          SYSTEMD_UNIT: kuma.service
      expected:
        - message: kuma-valid
          level: warn
          service: kuma
          fields.parser_status: parsed
          fields.source: SERVER
          fields.service: attribute
          _absent:
            - fields.time
            - fields.module
            - fields.msg
        - message: Welcome to Uptime Kuma
          level: info
          service: kuma
          _absent:
            - fields.parser_status
            - fields.source
        - message: '(node:42) [DEP0040] DeprecationWarning: punycode is deprecated.'
          level: info
          service: kuma
          _absent:
            - fields.parser_status
        - message: '{"time":"broken"'
          level: warn
          service: kuma
          parse_error: kuma_json
          fields.parser_status: failed
        - message: '{"time":"2099-01-02T03:04:05Z","module":"SYSTEMD","level":"ERROR","msg":"must-not-parse"}'
          service: systemd
          _absent:
            - fields.parser_status
            - fields.source
