# nginx auth-gate probe -- the UI subdomain has `auth: true`, so a
# cookieless GET / has to land on Authelia's 302 redirect chain. Validates
# both the auth_request wiring and the proxy_pass port.
#
- name: _verify | Verify Kuma Authelia gate
  import_role:
    name: nginx
    tasks_from: verify_authelia_gate
  vars:
    nginx_verify_authelia_gate_args:
      subdomain: kuma
      require_rd: false

# An unknown push token proves the bypass reached Kuma: v2 returns its 404 JSON
# response instead of Authelia's redirect.
- name: _verify | /api/push/<token> bypasses the Authelia gate
  uri:
    url: https://kuma.{{ inventory_hostname }}.{{ domain }}/api/push/00000000
    validate_certs: false
    follow_redirects: none
    status_code: 404
  register: _kuma_push_bypass
  failed_when: >-
    _kuma_push_bypass.status != 404
    or (_kuma_push_bypass.json | default({})).get('msg') != 'Monitor not found or not active.'
  become: true

# A fresh Kuma has no user, so auth must remain enabled until setup completes.
- name: _verify | DisableAuth stays unset while the user table is empty
  command: >-
    sqlite3 -readonly /mnt/services/kuma/kuma.db
    "SELECT (SELECT count(*) FROM user),
            coalesce((SELECT value FROM setting WHERE key='disableAuth'), 'unset');"
  register: _kuma_disableauth
  changed_when: false
  failed_when: >-
    (_kuma_disableauth.stdout.split('|')[0] | int) == 0
    and _kuma_disableauth.stdout.split('|')[1] | trim == 'true'
  become: true

# A read-only probe catches a regression to delete-journal mode.
- name: _verify | Kuma sqlite is in WAL journal mode
  command: sqlite3 -readonly /mnt/services/kuma/kuma.db 'PRAGMA journal_mode;'
  register: _kuma_wal
  changed_when: false
  failed_when: _kuma_wal.stdout | trim != 'wal'
  become: true

# Exercise the shared seed against a synthetic DB without mutating live state.
- name: _verify | DisableAuth seed flips once, then is idempotent
  block:
    - name: _verify | Build a synthetic kuma-shaped DB with one user
      command: >-
        sqlite3 /tmp/_verify_kuma_seed.db
        "CREATE TABLE user (id INTEGER PRIMARY KEY, username TEXT);
         CREATE TABLE setting (key TEXT PRIMARY KEY, value TEXT, type TEXT);
         INSERT INTO user (username) VALUES ('_verify');"
      changed_when: true
      become: true

    - name: _verify | DisableAuth seed mutates once, then is idempotent
      command:
        argv:
          - sqlite3
          - -cmd
          - .timeout 30000
          - /tmp/_verify_kuma_seed.db
      args:
        stdin: "{{ lookup('file', 'disable_auth.sql') }}"
      loop:
        - "1"
        - "0"
      loop_control:
        loop_var: kuma_seed_expected_changes
        label: "changes()={{ kuma_seed_expected_changes }}"
      register: _kuma_seed
      changed_when: false
      failed_when: (_kuma_seed.stdout | trim) != kuma_seed_expected_changes
      become: true
  always:
    - name: _verify | Drop the synthetic DB
      file:
        path: /tmp/_verify_kuma_seed.db
        state: absent
      become: true

- name: _verify | Kuma emits native structured records
  command: podman logs kuma
  register: _kuma_container_logs
  changed_when: false
  become: true

- name: _verify | Validate kuma structured log schema
  command:
    argv:
      - python3
      - -c
      - |
        import json
        import sys

        for line in sys.stdin:
            try:
                record = json.loads(line)
            except json.JSONDecodeError:
                continue
            if (
                isinstance(record.get("time"), str)
                and isinstance(record.get("module"), str)
                and isinstance(record.get("level"), str)
                and isinstance(record.get("msg"), str)
            ):
                sys.exit(0)
        sys.exit(1)
  args:
    stdin: "{{ _kuma_container_logs.stdout }}"
  changed_when: false

- name: _verify | Wait for normalized kuma record in lnav store
  command:
    argv:
      - python3
      - -c
      - |
        import json
        import sys

        with open(sys.argv[1], encoding="utf-8") as handle:
            for line in handle:
                try:
                    record = json.loads(line)
                except json.JSONDecodeError:
                    continue
                fields = record.get("fields", {})
                if (
                    record.get("service") == "kuma"
                    and fields.get("parser_status") == "parsed"
                    and fields.get("source")
                    and fields.get("CONTAINER_ID")
                    and "time" not in fields
                    and "module" not in fields
                    and "level" not in fields
                    and "msg" not in fields
                    and "CONTAINER_TAG" not in fields
                    and "CONTAINER_ID_FULL" not in fields
                ):
                    print(json.dumps(record, sort_keys=True))
                    sys.exit(0)
        sys.exit(1)
      - /var/log/fluent-bit/lnav.jsonl
  register: _kuma_lnav_record
  changed_when: false
  retries: 30
  delay: 2
  until: _kuma_lnav_record.rc == 0
  become: true

- name: _verify | Exercise kuma fluent-bit record contracts
  import_role:
    name: fluentbit
    tasks_from: verify_extension
  vars:
    fluentbit_verify_args:
      name: kuma
      records:
        - MESSAGE: '{"time":"2099-01-02T03:04:05Z","module":"SERVER","level":"WARN","msg":"kuma-valid","parser_status":"forged","service":"attribute"}'
          CONTAINER_TAG: kuma
          SYSLOG_IDENTIFIER: conmon
          SYSTEMD_UNIT: kuma.service
        - MESSAGE: Welcome to Uptime Kuma
          CONTAINER_TAG: kuma
          SYSLOG_IDENTIFIER: conmon
          SYSTEMD_UNIT: kuma.service
        - MESSAGE: '(node:42) [DEP0040] DeprecationWarning: punycode is deprecated.'
          CONTAINER_TAG: kuma
          SYSLOG_IDENTIFIER: conmon
          SYSTEMD_UNIT: kuma.service
        - MESSAGE: '{"time":"broken"'
          CONTAINER_TAG: kuma
          SYSLOG_IDENTIFIER: conmon
          SYSTEMD_UNIT: kuma.service
        - MESSAGE: '{"time":"2099-01-02T03:04:05Z","module":"SYSTEMD","level":"ERROR","msg":"must-not-parse"}'
          SYSLOG_IDENTIFIER: systemd
          SYSTEMD_UNIT: kuma.service
      expected:
        - message: kuma-valid
          level: warn
          service: kuma
          fields.parser_status: parsed
          fields.source: SERVER
          fields.service: attribute
          _absent:
            - fields.time
            - fields.module
            - fields.msg
        - message: Welcome to Uptime Kuma
          level: info
          service: kuma
          _absent:
            - fields.parser_status
            - fields.source
        - message: '(node:42) [DEP0040] DeprecationWarning: punycode is deprecated.'
          level: info
          service: kuma
          _absent:
            - fields.parser_status
        - message: '{"time":"broken"'
          level: warn
          service: kuma
          parse_error: kuma_json
          fields.parser_status: failed
        - message: '{"time":"2099-01-02T03:04:05Z","module":"SYSTEMD","level":"ERROR","msg":"must-not-parse"}'
          service: systemd
          _absent:
            - fields.parser_status
            - fields.source
