- name: Create persistent relay directory
  file:
    path: /data/wol_relay
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true
  tags:
    - udm_wol_relay

- name: Deploy WoL relay script
  template:
    src: wol_relay.py.j2
    dest: /data/wol_relay/wol_relay.py
    owner: root
    group: root
    mode: "0755"
    backup: true
    validate: python3 %s --check-config
  register: udm_wol_relay_script
  become: true
  tags:
    - udm_wol_relay

- name: Deploy WoL relay service to persistent storage
  copy:
    src: udm_wol_relay.service
    dest: /data/wol_relay/udm_wol_relay.service
    owner: root
    group: root
    mode: "0644"
    backup: true
    validate: >-
      sh -c 'd=$(mktemp -d); trap "rm -rf $d" EXIT; cp "%s" "$d/udm_wol_relay.service"; systemd-analyze verify "$d/udm_wol_relay.service"'
  register: udm_wol_relay_unit
  become: true
  tags:
    - udm_wol_relay

- name: Symlink WoL relay service into systemd
  file:
    src: /data/wol_relay/udm_wol_relay.service
    dest: /etc/systemd/system/udm_wol_relay.service
    state: link
    force: true
  register: udm_wol_relay_unit_link
  become: true
  tags:
    - udm_wol_relay

- name: Deploy on-boot WoL relay script
  template:
    src: on-boot-wol-relay.sh.j2
    dest: /data/on_boot.d/40-wol-relay.sh
    owner: root
    group: root
    mode: "0755"
    backup: true
    validate: bash -n %s
  register: udm_wol_relay_onboot_script
  become: true
  tags:
    - udm_wol_relay

- name: Check WoL relay iptables rules
  command: >-
    iptables -w 5 -C INPUT -s {{ item }} -p udp --dport {{ udm_wol_relay_port }}
    -m comment --comment "wol relay" -j ACCEPT
  loop: "{{ udm_wol_relay_source_cidrs }}"
  register: udm_wol_relay_iptables_check
  changed_when: false
  failed_when: false
  become: true
  tags:
    - udm_wol_relay

- name: Add WoL relay iptables rules
  when: item.rc != 0
  command: >-
    iptables -w 5 -A INPUT -s {{ item.item }} -p udp --dport {{ udm_wol_relay_port }}
    -m comment --comment "wol relay" -j ACCEPT
  loop: "{{ udm_wol_relay_iptables_check.results }}"
  loop_control:
    label: "{{ item.item }}"
  changed_when: true
  become: true
  tags:
    - udm_wol_relay

- name: Reload systemd
  when: >-
    udm_wol_relay_unit.changed or
    udm_wol_relay_unit_link.changed
  systemd:
    daemon_reload: true
  become: true
  tags:
    - udm_wol_relay

- name: Start WoL relay
  when: not (ansible_check_mode and udm_wol_relay_unit_link.changed)
  systemd:
    name: udm_wol_relay.service
    state: "{{ (udm_wol_relay_script.changed or udm_wol_relay_unit.changed) | ternary('restarted', 'started') }}"
    enabled: true
  become: true
  tags:
    - udm_wol_relay
