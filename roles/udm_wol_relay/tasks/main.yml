- name: Create persistent relay directory
  file:
    path: /data/wol_relay
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true
  tags:
    - udm_wol_relay

- name: Deploy WoL relay script
  template:
    src: wol_relay.py.j2
    dest: /data/wol_relay/wol_relay.py
    owner: root
    group: root
    mode: "0755"
    backup: true
    validate: python3 %s --check-config
  register: udm_wol_relay_script
  become: true
  tags:
    - udm_wol_relay

# The unit lives in /etc, which firmware updates keep -- the udm_on_boot
# framework's own unit relies on the same guarantee. The script stays on /data.
- name: Deploy WoL relay service
  copy:
    src: udm_wol_relay.service
    dest: /etc/systemd/system/udm_wol_relay.service
    owner: root
    group: root
    mode: "0644"
    backup: true
    validate: >-
      sh -c 'd=$(mktemp -d); trap "rm -rf $d" EXIT; cp "%s" "$d/udm_wol_relay.service"; systemd-analyze verify "$d/udm_wol_relay.service"'
  register: udm_wol_relay_unit
  become: true
  tags:
    - udm_wol_relay

# In check mode on a fresh host the unit is only predicted, so systemd cannot
# find it yet.
- name: Start WoL relay
  when: not (ansible_check_mode and udm_wol_relay_unit.changed)
  systemd:
    name: udm_wol_relay.service
    state: "{{ (udm_wol_relay_script.changed or udm_wol_relay_unit.changed) | ternary('restarted', 'started') }}"
    enabled: true
    daemon_reload: "{{ udm_wol_relay_unit.changed }}"
  become: true
  tags:
    - udm_wol_relay

# Remove the /data master unit and on-boot script from the layout that
# symlinked the unit into /etc. retired_services does not run on the UDM, so
# the cleanup lives here; drop it once the UDM has converged.
- name: Remove the superseded persistent WoL relay layout
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /data/wol_relay/udm_wol_relay.service
    - /data/on_boot.d/40-wol-relay.sh
  become: true
  tags:
    - udm_wol_relay
