- name: Create persistent relay directory
  file:
    path: /data/wol_relay
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true
  tags:
    - udm_wol_relay

- name: Deploy WoL relay script
  template:
    src: wol_relay.py.j2
    dest: /data/wol_relay/wol_relay.py
    owner: root
    group: root
    mode: "0755"
    backup: true
    validate: python3 %s --check-config
  register: udm_wol_relay_script
  become: true
  tags:
    - udm_wol_relay

- name: Deploy WoL relay service to persistent storage
  copy:
    src: udm_wol_relay.service
    dest: /data/wol_relay/udm_wol_relay.service
    owner: root
    group: root
    mode: "0644"
    backup: true
    validate: >-
      sh -c 'd=$(mktemp -d); trap "rm -rf $d" EXIT; cp "%s" "$d/udm_wol_relay.service"; systemd-analyze verify "$d/udm_wol_relay.service"'
  register: udm_wol_relay_unit
  become: true
  tags:
    - udm_wol_relay

- name: Symlink WoL relay service into systemd
  file:
    src: /data/wol_relay/udm_wol_relay.service
    dest: /etc/systemd/system/udm_wol_relay.service
    state: link
    force: true
  register: udm_wol_relay_unit_link
  become: true
  tags:
    - udm_wol_relay

- name: Deploy on-boot WoL relay script
  copy:
    src: on-boot-wol-relay.sh
    dest: /data/on_boot.d/40-wol-relay.sh
    owner: root
    group: root
    mode: "0755"
    backup: true
    validate: bash -n %s
  register: udm_wol_relay_onboot_script
  become: true
  tags:
    - udm_wol_relay

# No ACCEPT rules of our own: UniFi keeps the INPUT policy ACCEPT with all
# verdicts inside its own jumped chains, so an appended accept can never
# change a packet's fate -- proven live (rule counters stayed 0 across real
# relays). This tombstone clears the rules the first deployment appended;
# packets reach the relay through the vendor chains, and source filtering is
# the script's ALLOWED_SOURCES check.
- name: Remove WoL relay iptables rules
  iptables:
    chain: INPUT
    protocol: udp
    source: "{{ item }}"
    destination_port: "{{ udm_wol_relay_port }}"
    comment: wol relay
    jump: ACCEPT
    wait: "5"
    state: absent
  loop: "{{ udm_wol_relay_source_cidrs }}"
  become: true
  tags:
    - udm_wol_relay

- name: Reload systemd
  when: >-
    udm_wol_relay_unit.changed or
    udm_wol_relay_unit_link.changed
  systemd:
    daemon_reload: true
  become: true
  tags:
    - udm_wol_relay

- name: Start WoL relay
  when: not (ansible_check_mode and udm_wol_relay_unit_link.changed)
  systemd:
    name: udm_wol_relay.service
    state: "{{ (udm_wol_relay_script.changed or udm_wol_relay_unit.changed) | ternary('restarted', 'started') }}"
    enabled: true
  become: true
  tags:
    - udm_wol_relay
