- name: _verify | Relay service is active and enabled
  systemd:
    name: udm_wol_relay.service
  register: _udm_wol_relay_service
  failed_when: >-
    _udm_wol_relay_service.status.ActiveState != 'active' or
    _udm_wol_relay_service.status.UnitFileState != 'enabled'
  become: true

- name: _verify | Relay is listening on each source-VLAN gateway
  command: ss -H -lun 'sport = :{{ udm_wol_relay_port }}'
  register: _udm_wol_relay_socket
  changed_when: false
  failed_when: >-
    udm_wol_relay_source_gateways | reject('in', _udm_wol_relay_socket.stdout) | list | length > 0
  become: true

# -- functional path -------------------------------------------------------
# The relay binds the source-VLAN gateways (FREEBIND, the fixture does not
# own them); aliasing the management gateway onto lo makes packets sent to it
# deliver locally, with a source address inside the management CIDR.
- name: _verify | Alias the management gateway onto loopback for local delivery
  command: ip addr replace {{ udm_wol_relay_source_gateways[0] }}/32 dev lo
  changed_when: true
  become: true

# Two magic packets must be relayed; the junk payload and the magic packet
# from loopback, outside every allowed CIDR, must be dropped.
- name: _verify | Send allowed, junk, and disallowed-source packets
  command:
    argv:
      - python3
      - -c
      - |
        import socket
        target = ("{{ udm_wol_relay_source_gateways[0] }}", {{ udm_wol_relay_port }})
        magic = b"\xff" * 6 + bytes.fromhex("aabbccddeeff") * 16
        allowed = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
        outsider = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
        outsider.bind(("127.0.0.1", 0))
        allowed.sendto(magic, target)
        allowed.sendto(b"\x00" * 102, target)
        outsider.sendto(magic, target)
        allowed.sendto(magic, target)
  changed_when: false

# The single-threaded relay drains the loopback receive queue in send order, so
# the second allowed log is a barrier proving both intervening drops ran.
- name: _verify | Relay logged both allowed rebroadcasts
  command: journalctl -u udm_wol_relay.service --no-pager -o cat
  register: _udm_wol_relay_journal
  changed_when: false
  retries: 10
  delay: 1
  until: _udm_wol_relay_journal.stdout_lines | select('search', 'relayed magic packet') | list | length >= 2
  become: true

- name: _verify | Only the two allowed packets were relayed
  assert:
    that:
      - _udm_wol_relay_journal.stdout_lines | select('search', 'relayed magic packet') | list | length == 2

# -- firmware-wipe recovery ------------------------------------------------
- name: _verify | On-boot framework unit is enabled
  systemd:
    name: on-boot.service
  register: _udm_wol_relay_onboot
  failed_when: _udm_wol_relay_onboot.status.UnitFileState != 'enabled'
  become: true

- name: _verify | Run the on-boot recovery script by hand
  command: /data/on_boot.d/40-wol-relay.sh
  changed_when: false
  become: true

- name: _verify | Stat the recovered unit symlink
  stat:
    path: /etc/systemd/system/udm_wol_relay.service
  register: _udm_wol_relay_unit_link
  become: true

- name: _verify | Recovered unit points at the persistent master
  assert:
    that:
      - _udm_wol_relay_unit_link.stat.islnk
      - _udm_wol_relay_unit_link.stat.lnk_target == '/data/wol_relay/udm_wol_relay.service'

- name: _verify | Relay remains active after recovery
  systemd:
    name: udm_wol_relay.service
  register: _udm_wol_relay_after_recovery
  failed_when: _udm_wol_relay_after_recovery.status.ActiveState != 'active'
  become: true
