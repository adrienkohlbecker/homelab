# Functional contract: smbd is up (nmbd is deliberately masked -- asserted
# below), the rendered config exposes the configured share with its access
# restriction, an authenticated client can reach it, and an anonymous client
# cannot. The smbtest share (test/host_vars/lab.yml, valid users = the login user,
# fruit:time machine = yes) is the vehicle.

- name: _verify | Render a share with the default writable policy
  template:
    src: smb.conf.j2
    dest: /tmp/samba-default-writable.conf
    mode: "0644"
  vars:
    samba_shares:
      - name: fixture
        path: /srv/fixture
      - name: read_only_fixture
        path: /srv/read_only_fixture
        "read only": "yes"
  diff: false
  become: true

- name: _verify | Verify the default writable policy parses
  command:
    argv:
      - testparm
      - --suppress-prompt
      - --parameter-name=read only
      - "--section-name={{ item.section }}"
      - /tmp/samba-default-writable.conf
  register: _samba_default_writable
  loop:
    - section: fixture
      expected: "No"
    - section: read_only_fixture
      expected: "Yes"
  loop_control:
    label: "{{ item.section }}"
  changed_when: false
  failed_when: >-
    _samba_default_writable.rc != 0 or
    _samba_default_writable.stdout | trim != item.expected
  become: true

- name: _verify | Each ZFS mount dependency is emitted once
  vars:
    samba_shares:
      - name: first_data
        path: /mnt/data/first
      - name: second_data
        path: /mnt/data/second
      - name: media
        path: /mnt/media
      - name: ignored
        path: /srv/ignored
    _samba_zfs_override: "{{ lookup('template', 'smbd_zfs_mounts_override.conf.j2') }}"
  assert:
    that:
      - _samba_zfs_override.count('Requires=zfs_mount_mnt_data.service') == 1
      - _samba_zfs_override.count('Requires=zfs_mount_mnt_media.service') == 1
      - "'/srv/ignored' not in _samba_zfs_override"

- name: _verify | Remove alternate Samba config
  file:
    path: /tmp/samba-default-writable.conf
    state: absent
  become: true

# nmbd is masked (NetBIOS retired) -- prove it can't be started, not merely
# that it's stopped. A masked unit reports `masked` and `is-active` is non-zero.
- name: _verify | Service nmbd is masked  # noqa: command-instead-of-module -- is-enabled query, not a state change
  command: systemctl is-enabled nmbd
  register: samba_nmbd_enabled
  changed_when: false
  failed_when: samba_nmbd_enabled.stdout != 'masked'
  become: true

- name: _verify | Browse Samba services over mDNS
  command:
    argv:
      - avahi-browse
      - --terminate
      - --resolve
      - "{{ item.service }}"
  loop:
    - service: _smb._tcp
      expected: "{{ 'port = \\[' ~ service_ports.samba ~ '\\]' }}"
    - service: _adisk._tcp
      expected: dk0=adVN=smbtest,adVF=0x82
  loop_control:
    label: "{{ item.service }}"
  register: samba_mdns_browse
  changed_when: false
  failed_when: >-
    samba_mdns_browse.rc != 0 or
    samba_mdns_browse.stdout is not search(item.expected)
  become: true

# testparm -v dumps the EFFECTIVE value of every parameter (incl. defaults), so
# this catches a silently-dropped hardening directive: a typo'd `server smb
# encrypt` would fall back to the default here rather than `required`. Samba
# accepts-then-defaults on an unknown key, so grepping the rendered file isn't
# enough -- assert against the resolved value.
- name: _verify | Dump the effective config including defaults
  command: testparm -v -s
  register: samba_testparm_verbose
  changed_when: false
  failed_when: >-
    samba_testparm_verbose.rc != 0 or
    samba_testparm_verbose.stderr is search('(?i)unknown parameter')
  become: true

# Proves the critical per-share-key fix: the smbtest share renders, and its
# `valid users` restriction is present (the regression that silently dropped it
# would leave the share world-accessible with this line absent). Samba 4.23
# reports `smb ports` as `server smb transports`, so accept either label.
- name: _verify | Effective Samba config preserves share and hardening policy
  assert:
    that:
      - "'[smbtest]' in samba_testparm_verbose.stdout"
      - "'[homes]' in samba_testparm_verbose.stdout"
      - samba_testparm_verbose.stdout is search('valid users = ' ~ ansible_user_id)
      - samba_testparm_verbose.stdout is search('fruit:time machine = yes')
      - samba_testparm_verbose.stdout is search('fruit:time machine max size = 1T')
      - samba_testparm_verbose.stdout is search('server smb encrypt = required')
      - samba_testparm_verbose.stdout is search('disable spoolss = Yes')
      - samba_testparm_verbose.stdout is search('load printers = No')
      - samba_testparm_verbose.stdout is search('disable netbios = Yes')
      - samba_testparm_verbose.stdout is search('(?:smb ports|server smb transports) = 445')
    fail_msg: >-
      testparm -v does not report the expected share, Time Machine, encryption,
      printing, or NetBIOS policy.

- name: _verify | Printing helper is not running
  command: pgrep -x samba-bgqd
  register: samba_bgqd_process
  changed_when: false
  failed_when: samba_bgqd_process.rc != 1
  become: true

# A read-only `ls` against a freshly-created empty dir proves little; the share
# exists to be written to (the Time Machine path). argv form keeps the
# space-bearing `put` command one token without quoting.
- name: _verify | Valid user can write through the share
  command:
    argv:
      - smbclient
      - //localhost/smbtest
      - -U
      - "{{ ansible_user_id }}%{{ samba_password }}"
      - -c
      - put /etc/hostname probe.dat
  changed_when: false
  become: true

- name: _verify | The written file landed on the backing directory
  stat:
    path: /srv/smbtest/probe.dat
  register: samba_probe_stat
  failed_when: not samba_probe_stat.stat.exists
  become: true

# restrict anonymous = 2 + map to guest = never must refuse an unauthenticated
# connection -- proves the hardening is enforced, not merely configured.
- name: _verify | Anonymous access is refused
  command: smbclient -L localhost -N
  register: samba_anon
  changed_when: false
  failed_when: samba_anon.rc == 0
  become: true
