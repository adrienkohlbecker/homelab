- name: _setup | Configure Avahi
  import_role:
    name: avahi
    tasks_from: main

- name: _setup | Install dependencies
  apt:
    pkg:
      - avahi-utils
      # smbclient is a separate package from the samba server; _verify uses it
      # to exercise the live share over the wire.
      - smbclient
    install_recommends: false
    cache_valid_time: 3600
  become: true

# Start from a host serving NetBIOS, as Noble's stock Samba does: a config that
# enables it and a running nmbd. Converge must take both away, which _verify
# checks at the socket level. Pre-installing trades away the fresh-install
# path in these cells; the SITE converge covers it on a fresh fixture.
- name: _setup | Install Samba with its services allowed to start
  apt:
    pkg:
      - samba
    cache_valid_time: 3600
  become: true

- name: _setup | Write a config that serves NetBIOS
  copy:
    dest: /etc/samba/smb.conf
    content: |
      [global]
      disable netbios = no
      smb ports = 445 139
    mode: "0644"
    validate: testparm -s %s
  become: true

- name: _setup | Run nmbd and smbd with the NetBIOS config
  systemd:
    name: "{{ item }}"
    enabled: true
    state: restarted
  loop:
    - nmbd
    - smbd
  become: true

# Without live NetBIOS sockets here, the check in _verify would pass vacuously.
- name: _setup | NetBIOS name, datagram, and session ports are listening
  command:
    argv:
      - ss
      - -H
      - -lntup
      - ( sport = :137 or sport = :138 or sport = :139 )
  register: samba_setup_netbios_listeners
  changed_when: false
  failed_when: >-
    samba_setup_netbios_listeners.stdout is not search(':137\s')
    or samba_setup_netbios_listeners.stdout is not search(':138\s')
    or samba_setup_netbios_listeners.stdout is not search(':139\s')
  become: true

# The smbtest share used by test/host_vars/lab.yml points here; create
# it owned by the SMB login user so the valid-users / write path is exercisable.
- name: _test | Create test share directory
  file:
    path: /srv/smbtest
    state: directory
    owner: "{{ ansible_user_id }}"
    group: "{{ ansible_user_id }}"
    mode: "0755"
  become: true
