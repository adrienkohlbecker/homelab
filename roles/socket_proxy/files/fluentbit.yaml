parsers:
  - name: socket_proxy_haproxy
    format: regex
    regex: '/\A\[(?<_level>ALERT|WARNING|NOTICE|INFO|DEBUG)\][[:space:]]+\((?<process_id>[0-9]+)\)[[:space:]]+:[[:space:]]+(?<log>[\s\S]*?)[[:space:]]*\z/'
    types: process_id:integer

pipeline:
  filters:
    - name: parser
      match: svc.socket_proxy.service
      key_name: MESSAGE
      parser: socket_proxy_haproxy
      reserve_data: true
