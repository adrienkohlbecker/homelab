# Read-only Docker-API proxy fronting the rootful podman socket, so netdata's
# docker collector can read container metrics over tcp loopback without the
# host-root-equivalent podman-socket group membership. See the .service.j2
# header for the trust rationale. Deployed wherever podman + netdata co-locate
# (site.yml), ordered before netdata so its docker collector finds the proxy.
- name: Install socket_proxy service
  import_role:
    name: systemd_unit
    tasks_from: install
  vars:
    systemd_unit_args:
      src: socket_proxy.service.j2
  tags:
    - socket_proxy

# socket_proxy sits in the base band, ahead of most podman consumers, so a
# fresh-host `--check` run reaches the pull before the podman role has actually
# installed podman (its apt install was only simulated). podman_image would then
# fail invoking a missing /usr/bin/podman. Probe for the binary (stat runs for
# real in check mode) and skip the pull only in that case; a real converge --
# where podman is installed by the time this runs -- always pulls.
- name: Check whether podman is installed
  stat:
    path: /usr/bin/podman
  register: socket_proxy_podman
  tags:
    - socket_proxy

- name: Pull socket_proxy image
  when: not ansible_check_mode or socket_proxy_podman.stat.exists
  containers.podman.podman_image:
    name: "{{ socket_proxy_image }}"
  register: socket_proxy_image_pull
  retries: 3
  delay: 10
  until: socket_proxy_image_pull is not failed
  become: true
  tags:
    - socket_proxy

- name: Create socket_proxy podman network
  when: not ansible_check_mode
  containers.podman.podman_network:
    name: socket_proxy
    disable_dns: false
    state: present
  register: socket_proxy_network
  become: true
  tags:
    - socket_proxy

- name: Install socket_proxy fluent-bit extension
  import_role:
    name: fluentbit
    tasks_from: extension
  vars:
    fluentbit_extension_args:
      name: socket_proxy
  tags:
    - socket_proxy

- name: Enable socket_proxy service
  import_role:
    name: systemd_unit
    tasks_from: service
  vars:
    systemd_unit_args:
      src: socket_proxy.service
      condition: "{{ not (ansible_check_mode and socket_proxy_service_result.changed) }}"
      restart: "{{ socket_proxy_service_result.changed or socket_proxy_network.changed }}"
  tags:
    - socket_proxy
