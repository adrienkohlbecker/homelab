# Read-only Docker-API proxy fronting the rootful podman socket, so netdata's
# docker collector can read container metrics over tcp loopback without the
# host-root-equivalent direct socket access. See the .service.j2
# header for the trust rationale. Deployed wherever podman + netdata co-locate
# (site.yml), ordered before netdata so its docker collector finds the proxy.
# socket_proxy sits in the base band, ahead of most podman consumers, so a
# fresh-host `--check` run reaches the pull before the podman role has actually
# installed podman (its apt install was only simulated). podman_image would then
# fail invoking a missing /usr/bin/podman. Probe for the binary (stat runs for
# real in check mode) and skip the pull only in that case; a real converge --
# where podman is installed by the time this runs -- always pulls.
- name: Pull socket_proxy image
  import_role:
    name: podman
    tasks_from: image
  vars:
    podman_image_args:
      name: socket_proxy
      image: "{{ socket_proxy_image }}"
  tags:
    - socket_proxy

- name: Create socket_proxy podman network
  when: not ansible_check_mode
  containers.podman.podman_network:
    name: socket_proxy
    disable_dns: false
    state: present
  register: socket_proxy_network
  become: true
  tags:
    - socket_proxy

- name: Install socket_proxy fluent-bit extension
  import_role:
    name: fluentbit
    tasks_from: extension
  vars:
    fluentbit_extension_args:
      name: socket_proxy
  tags:
    - socket_proxy

- name: Manage socket_proxy service
  import_role:
    name: systemd_unit
    tasks_from: unit
  vars:
    systemd_unit_args:
      src: socket_proxy.service.j2
      restart: "{{ socket_proxy_network.changed }}"
  tags:
    - socket_proxy
