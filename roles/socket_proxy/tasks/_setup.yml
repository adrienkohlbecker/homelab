- name: _setup | Install podman
  import_role:
    name: podman
    tasks_from: install

- name: _setup | Enable the rootful podman socket
  when: not (ansible_check_mode and podman_apt.changed)
  systemd:
    name: podman.socket
    enabled: true
    state: started
  become: true

- name: _setup | Install fluent-bit for container-log normalization
  import_role:
    name: fluentbit
    tasks_from: configure
