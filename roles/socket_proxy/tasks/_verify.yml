# Functional verification of the read-only filter: the GET sections netdata's
# docker collector needs answer 200, while write requests and denied sections
# are blocked. The proxy fronts the host's rootful podman socket (box_deps
# pre-bakes podman).
- name: _verify | The socket_proxy unit is loaded and active
  systemd:
    name: socket_proxy
  register: _socket_proxy_unit
  failed_when: >-
    _socket_proxy_unit.status.LoadState != "loaded"
    or _socket_proxy_unit.status.ActiveState != "active"
  become: true

- name: _verify | Create unique socket_proxy fluent-bit marker
  set_fact:
    socket_proxy_lnav_marker: "verify_socket_proxy_{{ ansible_date_time.iso8601_basic_short }}_{{ 99999 | random }}"

# Write through the container init stderr so conmon records the fixture with
# the same journald metadata as HAProxy itself. The continuation lines exercise
# the retained startup-warning grammar, including the service-owned emitter.
- name: _verify | Emit representative multiline HAProxy warning
  command:
    argv:
      - podman
      - exec
      - socket_proxy
      - /bin/sh
      - -c
      - >-
        printf "%s\n" "[WARNING]  (42) : {{ socket_proxy_lnav_marker }}"
        "   | first detail" "   | second detail" > /proc/1/fd/2
  changed_when: false
  become: true

- name: _verify | Wait for normalized socket_proxy record in lnav store
  command:
    argv:
      - python3
      - -c
      - |
        import json
        import sys

        with open(sys.argv[1], encoding="utf-8") as handle:
            for line in handle:
                try:
                    record = json.loads(line)
                except json.JSONDecodeError:
                    continue
                if not record.get("message", "").startswith(sys.argv[2]):
                    continue
                fields = record.get("fields", {})
                if (
                    record.get("service") == "socket_proxy"
                    and record.get("unit") == "socket_proxy.service"
                    and record.get("level") == "warn"
                    and record.get("message")
                    == sys.argv[2] + "\n   | first detail\n   | second detail"
                    and fields.get("process_id") == 42
                    and fields.get("parser_status") == "parsed"
                    and fields.get("CONTAINER_ID")
                    and "socket_proxy_level" not in fields
                    and "socket_proxy_message" not in fields
                    and "socket_proxy_process_id" not in fields
                    and "CONTAINER_TAG" not in fields
                    and "CONTAINER_ID_FULL" not in fields
                    and "PRIORITY" not in fields
                    and "SYSTEMD_UNIT" not in fields
                ):
                    print(json.dumps(record, sort_keys=True))
                    sys.exit(0)
        sys.exit(1)
      - /var/log/fluent-bit/lnav.jsonl
      - "{{ socket_proxy_lnav_marker }}"
  register: _socket_proxy_lnav_record
  changed_when: false
  retries: 30
  delay: 1
  until: _socket_proxy_lnav_record.rc == 0
  become: true

- name: _verify | Exercise socket_proxy fluent-bit record contracts
  import_role:
    name: fluentbit
    tasks_from: verify_extension
  vars:
    fluentbit_verify_args:
      name: socket_proxy
      records:
        - MESSAGE: "[NOTICE]   (2) : Loading success."
          CONTAINER_TAG: socket_proxy
          SYSLOG_IDENTIFIER: conmon
          SYSTEMD_UNIT: socket_proxy.service
          parser_status: forged
        - MESSAGE: "[WARNING]  (8) : Current worker (9) exited with code 0 (Exit)"
          CONTAINER_TAG: socket_proxy
          SYSLOG_IDENTIFIER: conmon
          SYSTEMD_UNIT: socket_proxy.service
        - MESSAGE: "[WARNING]  (8) : missing timeouts for backend 'docker-events'.\n   | While not properly invalid, you will certainly encounter various problems"
          CONTAINER_TAG: socket_proxy
          SYSLOG_IDENTIFIER: conmon
          SYSTEMD_UNIT: socket_proxy.service
          marker: socket-proxy-docker-events-drop
        - MESSAGE: "[WARNING]  (8) : missing timeouts for backend 'dockerbackend'."
          CONTAINER_TAG: socket_proxy
          SYSLOG_IDENTIFIER: conmon
          SYSTEMD_UNIT: socket_proxy.service
        - MESSAGE: "Proxy dockerbackend stopped (cumulated conns: FE: 0, BE: 1181)."
          CONTAINER_TAG: socket_proxy
          SYSLOG_IDENTIFIER: conmon
          SYSTEMD_UNIT: socket_proxy.service
        - MESSAGE: '127.0.0.1:40000 [12/Jul/2026:18:17:25.123] dockerfrontend dockerbackend/dockersocket 0/0/0/1/1 200 1234 - - ---- 1/1/1/1/0 0/0 "GET /version HTTP/1.1"'
          CONTAINER_TAG: socket_proxy
          SYSLOG_IDENTIFIER: conmon
          SYSTEMD_UNIT: socket_proxy.service
        - MESSAGE: '10.89.0.1:54321 [12/Jul/2026:18:17:26.456] dockerfrontend dockerbackend/dockersocket 0/0/0/2/2 200 4321 - - ---- 2/2/1/1/0 0/0 "GET /info HTTP/1.1"'
          CONTAINER_TAG: socket_proxy
          SYSLOG_IDENTIFIER: conmon
          SYSTEMD_UNIT: socket_proxy.service
        - MESSAGE: '10.89.0.1:54322 [12/Jul/2026:18:17:27.456] dockerfrontend dockerbackend/dockersocket 0/0/0/2/2 200 4321 - - ---- 2/2/1/1/0 0/0 "GET /v1.41/info HTTP/1.1"'
          CONTAINER_TAG: socket_proxy
          SYSLOG_IDENTIFIER: conmon
          SYSTEMD_UNIT: socket_proxy.service
        - MESSAGE: '10.89.0.1:54323 [12/Jul/2026:18:17:28.456] dockerfrontend dockerbackend/dockersocket 0/0/0/2/2 200 4321 - - ---- 2/2/1/1/0 0/0 "GET /v1.41/images/json HTTP/1.1"'
          CONTAINER_TAG: socket_proxy
          SYSLOG_IDENTIFIER: conmon
          SYSTEMD_UNIT: socket_proxy.service
        - MESSAGE: '10.89.0.1:54324 [12/Jul/2026:18:17:29.456] dockerfrontend dockerbackend/dockersocket 0/0/0/2/2 200 4321 - - ---- 2/2/1/1/0 0/0 "GET /v1.41/containers/json?all=1&filters=%7B%22health%22%3A%7B%22healthy%22%3Atrue%7D%7D HTTP/1.1"'
          CONTAINER_TAG: socket_proxy
          SYSLOG_IDENTIFIER: conmon
          SYSTEMD_UNIT: socket_proxy.service
        - MESSAGE: '10.89.0.1:54325 [12/Jul/2026:18:17:30.456] dockerfrontend dockerbackend/dockersocket 0/0/0/2/2 200 4321 - - ---- 2/2/1/1/0 0/0 "GET /v1.41/containers/json?all=1&filters=%7B%22health%22%3A%7B%22unhealthy%22%3Atrue%7D%7D HTTP/1.1"'
          CONTAINER_TAG: socket_proxy
          SYSLOG_IDENTIFIER: conmon
          SYSTEMD_UNIT: socket_proxy.service
        - MESSAGE: '10.89.0.1:54326 [12/Jul/2026:18:17:31.456] dockerfrontend dockerbackend/dockersocket 0/0/0/2/2 200 4321 - - ---- 2/2/1/1/0 0/0 "GET /v1.41/containers/json?all=1&filters=%7B%22health%22%3A%7B%22starting%22%3Atrue%7D%7D HTTP/1.1"'
          CONTAINER_TAG: socket_proxy
          SYSLOG_IDENTIFIER: conmon
          SYSTEMD_UNIT: socket_proxy.service
        - MESSAGE: '10.89.0.1:54327 [12/Jul/2026:18:17:32.456] dockerfrontend dockerbackend/dockersocket 0/0/0/2/2 200 4321 - - ---- 2/2/1/1/0 0/0 "GET /v1.41/containers/json?all=1&filters=%7B%22health%22%3A%7B%22none%22%3Atrue%7D%7D HTTP/1.1"'
          CONTAINER_TAG: socket_proxy
          SYSLOG_IDENTIFIER: conmon
          SYSTEMD_UNIT: socket_proxy.service
        - MESSAGE: '10.89.0.1:54328 [12/Jul/2026:18:17:33.456] dockerfrontend dockerbackend/dockersocket 0/0/0/2/2 500 4321 - - ---- 2/2/1/1/0 0/0 "GET /v1.41/info HTTP/1.1"'
          CONTAINER_TAG: socket_proxy
          SYSLOG_IDENTIFIER: conmon
          SYSTEMD_UNIT: socket_proxy.service
        - MESSAGE: '10.89.0.1:54329 [12/Jul/2026:18:17:34.456] dockerfrontend dockerbackend/dockersocket 0/0/0/2/2 200 4321 - - ---- 2/2/1/1/0 0/0 "GET /v1.41/containers/json?all=1 HTTP/1.1"'
          CONTAINER_TAG: socket_proxy
          SYSLOG_IDENTIFIER: conmon
          SYSTEMD_UNIT: socket_proxy.service
        - MESSAGE: socket-proxy-prose
          CONTAINER_TAG: socket_proxy
          SYSLOG_IDENTIFIER: conmon
          SYSTEMD_UNIT: socket_proxy.service
        - MESSAGE: "[WARNING]  (8) : socket-proxy-lifecycle"
          SYSLOG_IDENTIFIER: systemd
          SYSTEMD_UNIT: socket_proxy.service
      expected:
        - message: Loading success.
          level: info
          service: socket_proxy
          fields.process_id: 2
          fields.parser_status: parsed
          _absent:
            - fields.socket_proxy_level
            - fields.socket_proxy_message
            - fields.socket_proxy_process_id
            - fields.CONTAINER_TAG
        - message: Current worker (9) exited with code 0 (Exit)
          level: warn
          fields.process_id: 8
          fields.parser_status: parsed
        - message: missing timeouts for backend 'dockerbackend'.
          level: warn
          fields.process_id: 8
          fields.parser_status: parsed
        - message: GET /info HTTP/1.1
          level: debug
          fields.client_address: 10.89.0.1
          fields.client_port: 54321
          fields.frontend: dockerfrontend
          fields.backend: dockerbackend
          fields.server: dockersocket
          fields.request_wait_ms: 0
          fields.queue_wait_ms: 0
          fields.connect_ms: 0
          fields.response_ms: 2
          fields.total_ms: 2
          fields.status: 200
          fields.bytes: 4321
          fields.termination_state: "----"
          fields.active_connections: 2
          fields.frontend_connections: 2
          fields.backend_connections: 1
          fields.server_connections: 1
          fields.retries: 0
          fields.server_queue: 0
          fields.backend_queue: 0
          fields.method: GET
          fields.path: /info
          fields.protocol: HTTP/1.1
          fields.parser_status: parsed
          _absent:
            - fields.socket_proxy_accept_date
            - fields.socket_proxy_request_cookie
            - fields.socket_proxy_response_cookie
            - fields.socket_proxy_request
        - message: GET /v1.41/info HTTP/1.1
          fields.status: 500
        - message: GET /v1.41/containers/json?all=1 HTTP/1.1
          fields.status: 200
        - message: socket-proxy-prose
          service: socket_proxy
          _absent:
            - fields.parser_status
            - fields.process_id
        - message: "[WARNING]  (8) : socket-proxy-lifecycle"
          service: systemd
          _absent:
            - fields.parser_status
            - fields.process_id

- name: _verify | Duplicate HAProxy shutdown record is omitted from aggregate
  assert:
    that:
      - "'Proxy dockerbackend stopped (cumulated conns: FE: 0, BE: 1181).' not in fluentbit_verify_result.stdout"
      - "'GET /version HTTP/1.1' not in fluentbit_verify_result.stdout"
      - "'-drop' not in fluentbit_verify_result.stdout"

- name: _verify | Netdata polling successes are omitted from aggregate
  command:
    argv:
      - python3
      - -c
      - |
        import json
        import sys

        routine_paths = {
            "/v1.41/info",
            "/v1.41/images/json",
            "/v1.41/containers/json?all=1&filters=%7B%22health%22%3A%7B%22healthy%22%3Atrue%7D%7D",
            "/v1.41/containers/json?all=1&filters=%7B%22health%22%3A%7B%22unhealthy%22%3Atrue%7D%7D",
            "/v1.41/containers/json?all=1&filters=%7B%22health%22%3A%7B%22starting%22%3Atrue%7D%7D",
            "/v1.41/containers/json?all=1&filters=%7B%22health%22%3A%7B%22none%22%3Atrue%7D%7D",
        }
        for line in sys.stdin:
            try:
                record = json.loads(line)
            except json.JSONDecodeError:
                continue
            fields = record.get("fields", {})
            assert not (
                fields.get("status") == 200
                and fields.get("method") == "GET"
                and fields.get("path") in routine_paths
            ), record
    stdin: "{{ fluentbit_verify_result.stdout }}"
  changed_when: false

- name: _verify | Allowed GET /version returns 200
  uri:
    url: http://127.0.0.1:{{ service_ports.socket_proxy }}/version
    status_code: 200
  register: _socket_proxy_version
  retries: 15
  delay: 2
  until: _socket_proxy_version.status == 200
  become: true

- name: _verify | Allowed GET /_ping returns 200
  uri:
    url: http://127.0.0.1:{{ service_ports.socket_proxy }}/_ping
    status_code: 200
  become: true

- name: _verify | Allowed GET /containers/json returns 200
  uri:
    url: http://127.0.0.1:{{ service_ports.socket_proxy }}/containers/json
    status_code: 200
  register: _socket_proxy_containers
  become: true

- name: _verify | /containers/json body is non-empty (proxy reaches the socket)
  assert:
    that:
      - _socket_proxy_containers.json | length > 0
  become: true

- name: _verify | Allowed GET /containers/<id>/stats returns 200 (netdata data-plane)
  uri:
    url: "http://127.0.0.1:{{ service_ports.socket_proxy }}/containers/{{ _socket_proxy_containers.json[0].Id }}/stats?stream=false"
    status_code: 200
  become: true

- name: _verify | Allowed GET /images/json returns 200
  uri:
    url: http://127.0.0.1:{{ service_ports.socket_proxy }}/images/json
    status_code: 200
  become: true

- name: _verify | Allowed GET /info returns 200
  uri:
    url: http://127.0.0.1:{{ service_ports.socket_proxy }}/info
    status_code: 200
  become: true

- name: _verify | Versioned GET /v1.41/containers/json returns 200
  uri:
    url: http://127.0.0.1:{{ service_ports.socket_proxy }}/v1.41/containers/json
    status_code: 200
  become: true

# POST is denied by default (read-only). A blocked write must 403, not reach
# the socket -- this is the whole point of the proxy.
- name: _verify | Write POST /containers/create is blocked (403)
  uri:
    url: http://127.0.0.1:{{ service_ports.socket_proxy }}/containers/create
    method: POST
    body_format: json
    body: {"Image": "alpine"}
    status_code: 403
  become: true

- name: _verify | Write DELETE /containers/test is blocked (403)
  uri:
    url: http://127.0.0.1:{{ service_ports.socket_proxy }}/containers/test
    method: DELETE
    status_code: 403
  become: true

- name: _verify | POST /containers/<id>/exec is blocked (EXEC=0)
  uri:
    url: "http://127.0.0.1:{{ service_ports.socket_proxy }}/containers/{{ _socket_proxy_containers.json[0].Id }}/exec"
    method: POST
    body_format: json
    body:
      Cmd:
        - "true"
    status_code: 403
  become: true

# A section we never enabled (SECRETS) must be denied too, proving the filter
# is default-deny rather than allow-all.
- name: _verify | Denied GET /secrets is blocked (403)
  uri:
    url: http://127.0.0.1:{{ service_ports.socket_proxy }}/secrets
    status_code: 403
  become: true

# EVENTS is explicitly disabled (--env EVENTS=0); verify it is blocked.
- name: _verify | Disabled GET /events is blocked (403)
  uri:
    url: http://127.0.0.1:{{ service_ports.socket_proxy }}/events
    status_code: 403
  become: true

- name: _verify | Wait for parsed live HAProxy access record in lnav store
  command:
    argv:
      - python3
      - -c
      - |
        import json
        import sys

        with open(sys.argv[1], encoding="utf-8") as handle:
            for line in handle:
                try:
                    record = json.loads(line)
                except json.JSONDecodeError:
                    continue
                fields = record.get("fields", {})
                if (
                    record.get("service") == "socket_proxy"
                    and record.get("message") == "GET /info HTTP/1.1"
                    and record.get("level") == "debug"
                    and fields.get("method") == "GET"
                    and fields.get("path") == "/info"
                    and fields.get("status") == 200
                    and fields.get("parser_status") == "parsed"
                ):
                    print(json.dumps(record, sort_keys=True))
                    sys.exit(0)
        sys.exit(1)
      - /var/log/fluent-bit/lnav.jsonl
  register: _socket_proxy_access_record
  changed_when: false
  retries: 30
  delay: 1
  until: _socket_proxy_access_record.rc == 0
  become: true

- name: _verify | Wait for the real loopback healthcheck access grammar
  command:
    argv:
      - journalctl
      - CONTAINER_TAG=socket_proxy
      - --no-pager
      - --output=cat
  register: _socket_proxy_health_journal
  changed_when: false
  retries: 35
  delay: 1
  until: >-
    _socket_proxy_health_journal.stdout is search(
      '127\\.0\\.0\\.1:[0-9]+ .* "GET /version HTTP/1\\.[01]"'
    )
  become: true
