---
# Shared by initial registration and steady-state preference reconciliation.
tailscale_preference_args:
  - "--advertise-routes={{ tailscale_advertise_routes | join(',') }}"
  - "--advertise-exit-node={{ tailscale_advertise_exit_node | ternary('true', 'false') }}"
  - "--accept-routes={{ tailscale_accept_routes | ternary('true', 'false') }}"
  - "--accept-dns={{ tailscale_accept_dns | ternary('true', 'false') }}"
  - "--snat-subnet-routes={{ tailscale_snat_subnet_routes | ternary('true', 'false') }}"
  - "--stateful-filtering={{ tailscale_stateful_filtering | ternary('true', 'false') }}"
