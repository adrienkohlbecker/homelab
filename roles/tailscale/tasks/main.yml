# Apt-installed Tailscale client. Shared Linux/DSM registration lives in
# tasks/register.yml.

- name: Configure tailscale apt repository
  import_role:
    name: apt_source
    tasks_from: configure
  vars:
    apt_source_args:
      name: tailscale
      key_id: 2596A99EAAB33821893C0A79458CA832957F5868
      key_url: "https://pkgs.tailscale.com/stable/ubuntu/{{ ansible_distribution_release }}.asc"
      uris: "{{ mirror_apt_tailscale }}"
      suites: "{{ ansible_distribution_release }}"
      components: main
  tags:
    - tailscale

# Keep node identity on the backed-up services dataset so re-imaging does not
# create a new Headscale node and lose route approvals. The stock unit hardcodes
# /var/lib/tailscale/tailscaled.state, so symlink that directory; mode 0700
# protects the node private key.
- name: Create the tailscale state directory on the services dataset
  file:
    path: /mnt/services/tailscale
    state: directory
    owner: root
    group: root
    mode: "0700"
  become: true
  tags:
    - tailscale

# Plant the link before installing the package so tailscaled can never create
# identity state on the root filesystem. A legacy real directory fails closed:
# force permits a dangling source, but does not replace a directory.
- name: Symlink the tailscale state path onto the services dataset
  file:
    src: /mnt/services/tailscale
    dest: /var/lib/tailscale
    state: link
    force: true
  become: true
  tags:
    - tailscale

# Suppress the package postinst start until the state link and systemd drop-in
# are ready. The explicit lifecycle task below starts or restarts the daemon.
- name: Install tailscale
  apt:
    pkg: tailscale
    update_cache: true
    cache_valid_time: 3600
    policy_rc_d: 101
  register: tailscale_apt
  when: not (ansible_check_mode and apt_source_tailscale_changed)
  become: true
  tags:
    - tailscale

# The underlay port is a daemon setting, not a `tailscale up` flag. Distinct
# host_vars ports give lab and pug unambiguous forwards behind their shared NAT.
- name: Pin tailscaled underlay port in /etc/default/tailscaled
  lineinfile:
    path: /etc/default/tailscaled
    regexp: '^PORT='
    line: 'PORT="{{ tailscale_port }}"'
    backup: true
  register: tailscale_default_port
  when: not (ansible_check_mode and apt_source_tailscale_changed)
  become: true
  tags:
    - tailscale

- name: Install tailscale fluent-bit extension
  import_role:
    name: fluentbit
    tasks_from: extension
  vars:
    fluentbit_extension_args:
      name: tailscale
  tags:
    - tailscale

# The drop-in clears stock StateDirectory handling for the state symlink, orders
# tailscaled after the services mount, quiesces it for snapshots, and persists
# GRO tuning. Mount ordering prevents a fresh identity being hidden beneath the
# services dataset.
- name: Install the tailscaled drop-in
  import_role:
    name: systemd_unit
    tasks_from: install
  vars:
    systemd_unit_args:
      for: tailscaled.service
      src: tailscaled-override.conf.j2
  tags:
    - tailscale

# PartOf propagates the snapshot stop but not its subsequent start. Wire the want
# explicitly when the target exists; the standalone role fixture omits it.
- name: Check whether the snapshot target is installed
  stat:
    path: /etc/systemd/system/zfs_autosnapshot.target
  register: tailscale_snapshot_target
  become: true
  tags:
    - tailscale

- name: Bind tailscaled to the snapshot target so it restarts after snapshots
  command: systemctl add-wants zfs_autosnapshot.target tailscaled.service  # noqa: command-instead-of-module
  args:
    creates: /etc/systemd/system/zfs_autosnapshot.target.wants/tailscaled.service
  when: tailscale_snapshot_target.stat.exists
  become: true
  tags:
    - tailscale

# Restart inline when the package, port, or drop-in changed so the current
# daemon configuration is active before register.yml runs `tailscale up`/`set`.
- name: Enable and start tailscaled
  import_role:
    name: systemd_unit
    tasks_from: service
  vars:
    systemd_unit_args:
      src: tailscaled.service
      condition: "{{ not (ansible_check_mode and apt_source_tailscale_changed) }}"
      restart: >-
        {{ (tailscale_apt.changed | default(false))
           or (tailscale_default_port.changed | default(false))
           or (tailscaled_service_d_override_conf_result.changed | default(false)) }}
  tags:
    - tailscale

# Subnet routers and exit nodes need the kernel to forward between the tailnet
# interface and the LAN. Pure mesh clients leave forwarding unchanged.
- name: Enable IP forwarding for subnet routing / exit node
  ansible.posix.sysctl:
    name: "{{ item }}"
    value: "1"
    sysctl_file: /etc/sysctl.d/99-tailscale.conf
    sysctl_set: true
  loop:
    - net.ipv4.ip_forward
    - net.ipv6.conf.all.forwarding
  when: (tailscale_advertise_routes | length > 0) or (tailscale_advertise_exit_node | bool)
  become: true
  tags:
    - tailscale

# Register last so the binary and forwarding settings are ready.
- name: Register against the headscale control plane
  import_tasks: register.yml
  tags:
    - tailscale

# Enable UDP GRO forwarding on the physical underlay, not tailscale0. The drop-in
# persists it across reboots; unsupported drivers reject it harmlessly.
# https://tailscale.com/kb/1320/performance-best-practices
- name: Enable UDP GRO forwarding offload on the underlay NIC
  command: ethtool -K {{ ansible_default_ipv4.interface }} rx-udp-gro-forwarding on rx-gro-list off
  when:
    - not ansible_check_mode
    - ansible_default_ipv4.interface is defined
  changed_when: false
  failed_when: false
  become: true
  tags:
    - tailscale
