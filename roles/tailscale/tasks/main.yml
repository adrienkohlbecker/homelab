# Apt-installed Tailscale client. Shared Linux/DSM registration lives in
# tasks/register.yml.

- name: Configure tailscale apt repository
  import_role:
    name: apt_source
    tasks_from: configure
  vars:
    apt_source_args:
      name: tailscale
      key_id: 2596A99EAAB33821893C0A79458CA832957F5868
      key_url: "https://pkgs.tailscale.com/stable/ubuntu/{{ ansible_distribution_release }}.asc"
      uris: "{{ mirror_apt_tailscale }}"
      suites: "{{ ansible_distribution_release }}"
      components: main
  tags:
    - tailscale

# Keep node identity on the backed-up services dataset so re-imaging does not
# create a new Headscale node and lose route approvals. Mode 0700 protects the
# node private key.
- name: Create the tailscale state directory on the services dataset
  file:
    path: /mnt/services/tailscale
    state: directory
    owner: root
    group: root
    mode: "0700"
  become: true
  tags:
    - tailscale

# Suppress the package postinst start until the state path and systemd drop-in
# are ready. The explicit lifecycle task below starts or restarts the daemon.
- name: Install tailscale
  apt:
    pkg: tailscale
    update_cache: true
    cache_valid_time: 3600
    policy_rc_d: 101
  register: tailscale_apt
  when: not (ansible_check_mode and apt_source_tailscale_changed)
  become: true
  tags:
    - tailscale

# The underlay port and persistent state path are daemon settings, not
# `tailscale up` flags. FLAGS follows the stock --state argument, so the direct
# services-dataset path wins without overriding the package unit.
- name: Configure tailscaled daemon defaults
  lineinfile:
    path: /etc/default/tailscaled
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    backup: true
  loop:
    - regexp: '^PORT='
      line: 'PORT="{{ tailscale_port }}"'
    - regexp: '^FLAGS='
      line: 'FLAGS="--state=/mnt/services/tailscale/tailscaled.state"'
  register: tailscale_defaults
  when: not (ansible_check_mode and apt_source_tailscale_changed)
  become: true
  tags:
    - tailscale

# Deployed hosts may still have the former /var/lib/tailscale symlink. Stop the
# daemon after its direct state path is configured, then remove only that link;
# systemd recreates its stock StateDirectory when the service starts below.
- name: Inspect the stock tailscale state directory
  stat:
    path: /var/lib/tailscale
  register: tailscale_stock_state
  become: true
  tags:
    - tailscale

- name: Stop tailscaled before replacing its legacy state symlink
  systemd:
    name: tailscaled.service
    state: stopped
  when: tailscale_stock_state.stat.islnk | default(false)
  become: true
  tags:
    - tailscale

- name: Remove the legacy tailscale state symlink
  file:
    path: /var/lib/tailscale
    state: absent
  when: tailscale_stock_state.stat.islnk | default(false)
  become: true
  tags:
    - tailscale

- name: Install tailscale fluent-bit extension
  import_role:
    name: fluentbit
    tasks_from: extension
  vars:
    fluentbit_extension_args:
      name: tailscale
  tags:
    - tailscale

# The drop-in orders tailscaled after the services mount, quiesces it for
# snapshots, and persists GRO tuning. Mount ordering prevents tailscaled from
# writing identity state to the bare mountpoint during boot.
- name: Install the tailscaled drop-in
  import_role:
    name: systemd_unit
    tasks_from: install
  vars:
    systemd_unit_args:
      for: tailscaled.service
      src: tailscaled-override.conf.j2
  tags:
    - tailscale

# PartOf propagates the snapshot stop but not its subsequent start. Wire the want
# explicitly when the target exists; the standalone role fixture omits it.
- name: Check whether the snapshot target is installed
  stat:
    path: /etc/systemd/system/zfs_autosnapshot.target
  register: tailscale_snapshot_target
  become: true
  tags:
    - tailscale

- name: Bind tailscaled to the snapshot target so it restarts after snapshots
  command: systemctl add-wants zfs_autosnapshot.target tailscaled.service  # noqa: command-instead-of-module
  args:
    creates: /etc/systemd/system/zfs_autosnapshot.target.wants/tailscaled.service
  when: tailscale_snapshot_target.stat.exists
  become: true
  tags:
    - tailscale

# Restart inline when the package, defaults, or drop-in changed so the current
# daemon configuration is active before register.yml runs `tailscale up`/`set`.
- name: Enable and start tailscaled
  when: not (ansible_check_mode and apt_source_tailscale_changed)
  systemd:
    name: tailscaled.service
    enabled: true
    state: >-
      {{ 'restarted'
         if (tailscale_apt.changed | default(false))
            or (tailscale_defaults.changed | default(false))
            or (tailscaled_service_d_override_conf_result.changed | default(false))
         else 'started' }}
  become: true
  tags:
    - tailscale

# Subnet routers and exit nodes need the kernel to forward between the tailnet
# interface and the LAN. Pure mesh clients leave forwarding unchanged.
- name: Enable IP forwarding for subnet routing / exit node
  ansible.posix.sysctl:
    name: "{{ item }}"
    value: "1"
    sysctl_file: /etc/sysctl.d/99-tailscale.conf
    sysctl_set: true
  loop:
    - net.ipv4.ip_forward
    - net.ipv6.conf.all.forwarding
  when: (tailscale_advertise_routes | length > 0) or (tailscale_advertise_exit_node | bool)
  become: true
  tags:
    - tailscale

# Register last so the binary and forwarding settings are ready.
- name: Register against the headscale control plane
  import_tasks: register.yml
  tags:
    - tailscale
