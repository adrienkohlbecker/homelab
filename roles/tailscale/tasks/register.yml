# Shared Linux/DSM Headscale registration: mint a single-use key, log in,
# reconcile local preferences, then approve routes.
- name: register | Assert required tailscale inputs are set
  assert:
    that:
      - tailscale_login_server | default('') | length > 0
      - tailscale_headscale_host | default('') | length > 0
      - tailscale_headscale_user | default('') | length > 0
      - tailscale_advertise_routes is defined
      - tailscale_advertise_routes | default([]) | length > 0
    fail_msg: >-
      tailscale registration needs tailscale_login_server, tailscale_headscale_host
      and tailscale_headscale_user (group_vars/{prod,test}) plus non-empty
      tailscale_advertise_routes (host_vars, e.g. ["10.123.0.0/21"]).
      The pre-auth key is minted on-the-fly from the control plane at registration
      time, so there's no vaulted long-lived key to set.
  tags:
    - tailscale

# Skip registration when the backend is Running; `tailscale set` reconciles live
# nodes later. Run this read-only probe in check mode so its result remains
# defined, and treat a missing binary or unregistered backend as not running.
- name: register | Check whether tailscale is already registered and running
  command: "{{ tailscale_bin }} status --json --peers=false"
  register: tailscale_status
  changed_when: false
  failed_when: false
  check_mode: false
  # Poll until BackendState settles out of 'Starting': a mid-restart converge
  # would otherwise see rc=0 + valid JSON but tailscale_running=false, which
  # triggers full re-registration (mint + tailscale login) and creates a
  # duplicate headscale node entry.
  retries: 5
  delay: 2
  until: >-
    tailscale_status.rc != 0
    or not (tailscale_status.stdout | default('') | trim).startswith('{')
    or ((tailscale_status.stdout | from_json).BackendState | default('')) != 'Starting'
  become: true
  tags:
    - tailscale

# Mint a short-lived, single-use key only for an unregistered node. Control-plane
# commands run on tailscale_headscale_host; check mode skips their mutations.
# The node is not ephemeral because subnet routers must survive disconnects, and
# Headscale 0.26 requires the numeric user ID.
- name: register | Provision a single-use pre-auth key from the control plane
  when:
    - not ansible_check_mode
    - not _tailscale_running
  become: true
  tags:
    - tailscale
  vars:
    # tailscaled can return rc=0 with a non-JSON warning banner mid-restart.
    # Short-circuit before parsing it.
    _tailscale_running: >-
      {{ ((tailscale_status.rc | default(1)) == 0
         and (tailscale_status.stdout | default('') | trim | length > 0)
         and (tailscale_status.stdout | default('') | trim).startswith('{')
         and ((tailscale_status.stdout | from_json).BackendState | default('')) == 'Running') | bool }}
  block:
    # Registration against a fresh control plane must create its own user.
    - name: register | Ensure the headscale user for this node exists
      command: podman exec headscale headscale users create {{ tailscale_headscale_user }}
      delegate_to: "{{ tailscale_headscale_host }}"
      changed_when: false
      failed_when: false

    # Convert delegated control-plane failures into the explicit assertion below.
    - name: register | List headscale users to resolve the user id
      command: podman exec headscale headscale users list -o json
      delegate_to: "{{ tailscale_headscale_host }}"
      register: tailscale_users
      changed_when: false
      failed_when: false

    - name: register | Assert the headscale control plane is reachable
      assert:
        that:
          - tailscale_users.rc == 0
          - (tailscale_users.stdout | default('') | trim).startswith('[')
        fail_msg: >-
          headscale control plane on {{ tailscale_headscale_host }} is not
          answering (rc={{ tailscale_users.rc | default('n/a') }}). It must be
          converged and up before {{ inventory_hostname }} can register: this
          path mints its pre-auth key and approves routes by delegating to
          {{ tailscale_headscale_host }}. Converge fox/headscale there first.

    - name: register | Assert the headscale user for this node exists exactly once
      assert:
        that:
          - (tailscale_users.stdout | from_json | selectattr('name', 'eq', tailscale_headscale_user) | list | length) == 1
        fail_msg: >-
          headscale user {{ tailscale_headscale_user }} is not present exactly once
          on {{ tailscale_headscale_host }}. The `users create` above swallows all
          errors (benign only for already-exists), so a real failure (permissions,
          gRPC error) surfaces here instead of as an opaque empty-list crash at the
          user-id lookup below.

    - name: register | Mint a single-use pre-auth key
      command: >-
        podman exec headscale headscale preauthkeys create
        --user {{ (tailscale_users.stdout | from_json | selectattr('name', 'eq', tailscale_headscale_user) | first).id }}
        --expiration 5m
        -o json
      delegate_to: "{{ tailscale_headscale_host }}"
      register: tailscale_preauth
      changed_when: false

    # Keep the key out of argv/ps in a generated root-only file, then remove it.
    - name: register | Create a temporary authkey file
      tempfile:
        state: file
        prefix: tailscale_authkey.
      register: tailscale_authkey_temp

    - name: register | Stage the pre-auth key in a root-only file  # noqa: require-backup
      copy:
        content: "{{ (tailscale_preauth.stdout | from_json).key }}"
        dest: "{{ tailscale_authkey_temp.path }}"
        owner: root
        group: root
        mode: "0600"

    # Authentication and preference reconciliation are deliberately separate:
    # `tailscale login` joins the control plane, then `tailscale set` below owns
    # every mutable routing preference.
    - name: register | Log in to headscale
      command:
        argv: >-
          {{ [tailscale_bin, 'login',
              '--login-server', tailscale_login_server,
              '--auth-key', 'file:' + tailscale_authkey_temp.path,
              '--timeout=60s'] }}
      changed_when: true

  always:
    # Always remove the staged key; an unconsumed key expires after five minutes.
    - name: register | Remove the staged pre-auth key file
      file:
        path: "{{ tailscale_authkey_temp.path }}"
        state: absent
      when: tailscale_authkey_temp.path is defined

# Reconcile every local preference after an existing session or a successful
# login. `tailscale set` cannot report whether it changed a preference, so
# functional verification proves correctness.
- name: register | Reconcile routes / exit node / accept-routes / accept-dns
  vars:
    _tailscale_preference_args:
      - "--advertise-routes={{ tailscale_advertise_routes | join(',') }}"
      - "--advertise-exit-node=true"
      - "--accept-routes={{ tailscale_accept_routes | ternary('true', 'false') }}"
      # Server nodes keep their host DNS and use conventional SNAT forwarding.
      - "--accept-dns=false"
      - "--snat-subnet-routes=true"
      - "--stateful-filtering=false"
  command:
    argv: "{{ [tailscale_bin, 'set'] + _tailscale_preference_args }}"
  when: not ansible_check_mode
  changed_when: false
  become: true
  tags:
    - tailscale

# Headscale owns the approved-route set, so query it on every real apply and
# compare the actual approvals directly. A newly registered node can lag
# `tailscale login`/`set`, so poll before resolving its ID.
- name: register | Reconcile approved routes on headscale
  when: not ansible_check_mode
  become: true
  tags:
    - tailscale
  vars:
    tailscale_desired_routes: >-
      {{ tailscale_advertise_routes + ['0.0.0.0/0', '::/0'] }}
  block:
    - name: register | List headscale nodes (on the control server)
      command: podman exec headscale headscale nodes list -o json
      delegate_to: "{{ tailscale_headscale_host }}"
      register: tailscale_nodes
      changed_when: false
      retries: 15
      delay: 2
      until: >-
        ((tailscale_nodes.stdout | default('[]', true) | from_json)
            | selectattr('user.name', 'eq', tailscale_headscale_user)
            | selectattr('given_name', 'eq', ansible_hostname | lower)
            | list
            | length > 0)

    # Headscale lowercases given_name, including DSM's mixed-case hostname. Scope
    # the match by user because approve-routes replaces all approved routes.
    - name: register | Reconcile this host's headscale node
      vars:
        tailscale_node_matches: >-
          {{ (tailscale_nodes.stdout | default('[]', true) | from_json)
             | selectattr('user.name', 'eq', tailscale_headscale_user)
             | selectattr('given_name', 'eq', ansible_hostname | lower)
             | list }}
      block:
        - name: register | Fail if this host has no headscale node yet
          assert:
            that:
              - tailscale_node_matches | length == 1
              - (tailscale_node_matches | first | default({})).id is defined
            fail_msg: >-
              Expected exactly 1 headscale node with given_name
              {{ ansible_hostname | lower }} on {{ tailscale_headscale_host }}, found
              {{ tailscale_node_matches | length }}. 0 = registration did not complete
              (check tailscaled logs + login-server reachability), or the node joined a
              DIFFERENT control plane (`tailscale down` + re-run). >1 = stale node from
              a prior registration; remove the duplicate via `headscale nodes delete`.

        # approve-routes replaces the whole approved set, so run only on drift.
        - name: register | Approve advertised routes + exit node on headscale
          command: >-
            podman exec headscale headscale nodes approve-routes
            --identifier {{ (tailscale_node_matches | first).id }}
            --routes {{ tailscale_desired_routes | join(',') }}
          delegate_to: "{{ tailscale_headscale_host }}"
          when: >-
            (tailscale_desired_routes | sort)
            != (((tailscale_node_matches | first).approved_routes | default([], true)) | sort)
          changed_when: true
