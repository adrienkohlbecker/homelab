# Functional join test -- exercises the real control path: the client must be
# registered and Running against the local headscale, the node must show up in
# the control server's gRPC-backed `nodes list`, and the routes the role
# advertised must be approved. A stat-only "tailscaled is active" check would
# pass even if registration silently failed, so assert the round-trip instead.

- name: _verify | Tailscale backend is Running (registered with headscale)
  command: tailscale status --json --peers=false
  register: _tailscale_status
  changed_when: false
  retries: 5
  delay: 2
  until: >-
    _tailscale_status.rc == 0
    and (_tailscale_status.stdout | from_json).BackendState == 'Running'
    and (((_tailscale_status.stdout | from_json).TailscaleIPs | default([])
          | select('match', '^[0-9.]+$') | list | length) > 0)
  become: true

# The node identity must live on the services dataset, which rides the backup.
- name: _verify | Node state is stored on the services dataset
  stat:
    path: /mnt/services/tailscale/tailscaled.state
  register: _tailscale_state_file
  failed_when: not (_tailscale_state_file.stat.exists | default(false))
  become: true

- name: _verify | This node appears in headscale's node list
  command: podman exec headscale headscale nodes list -o json
  register: _tailscale_nodes
  changed_when: false
  become: true

- name: _verify | The node registered and approved routes match exactly
  vars:
    _tailscale_node: >-
      {{ (_tailscale_nodes.stdout | from_json)
         | selectattr('given_name', 'eq', ansible_hostname | lower)
         | first | default({}) }}
    _tailscale_desired_routes: >-
      {{ tailscale_advertise_routes + ['0.0.0.0/0', '::/0'] }}
  assert:
    that:
      - _tailscale_node.id is defined
      - (_tailscale_desired_routes | symmetric_difference(_tailscale_node.approved_routes | default([], true))) | length == 0
    fail_msg: >-
      headscale node for {{ ansible_hostname | lower }} is missing, or its
      approved routes don't match the desired set.
      desired={{ _tailscale_desired_routes | sort }}
      approved={{ _tailscale_node.approved_routes | default([], true) | sort }}

- name: _verify | Read local preferences
  command: tailscale get --json all
  register: _tailscale_prefs
  changed_when: false
  become: true

- name: _verify | Local preferences match host_vars
  vars:
    _prefs: "{{ _tailscale_prefs.stdout | from_json }}"
  assert:
    that:
      - ((_prefs['advertise-routes'] | default('', true)).split(',') | sort) == (tailscale_advertise_routes | sort)
      - _prefs['advertise-exit-node'] | default(false) | bool
      - (_prefs['accept-routes'] | default(false) | bool) == (tailscale_accept_routes | bool)
      - not (_prefs['accept-dns'] | default(false) | bool)
      - _prefs['snat-subnet-routes'] | default(false) | bool
      - not (_prefs['stateful-filtering'] | default(false) | bool)
    fail_msg: >-
      Local preferences do not match desired server routing policy:
      {{ _prefs }}

# Assert the forwarding settings are live, not just present in the sysctl file.
- name: _verify | IP forwarding is enabled
  command: sysctl -n {{ item }}
  loop:
    - net.ipv4.ip_forward
    - net.ipv6.conf.all.forwarding
  register: _tailscale_forwarding
  changed_when: false
  failed_when: _tailscale_forwarding.stdout | trim != '1'
  become: true

# DSM itself cannot boot in QEMU, so provide its package-owned paths and client
# commands while retaining the production DSM task file and shared registration
# flow. The live headscale node remains the functional registration witness.
- name: _verify DSM | Create package fixture directories
  file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /var/packages/Tailscale/scripts
    - /usr/syno/bin
  become: true

- name: _verify DSM | Install package client fixture
  copy:
    dest: /tmp/tailscale_dsm_fixture
    content: |
      #!/bin/bash
      set -euo pipefail
      printf '%s\n' "$*" >>/tmp/tailscale_dsm_fixture.log
      case "${1:-}" in
        configure)
          mkdir -p /var/packages/Tailscale/conf
          touch /var/packages/Tailscale/conf/resource.own
          ;;
        status)
          printf '%s\n' '{"BackendState":"Running"}'
          ;;
      esac
    mode: "0755"
  become: true

- name: _verify DSM | Install package launcher fixture
  copy:
    dest: /var/packages/Tailscale/scripts/start-stop-status
    content: |
      PORT="0"
    mode: "0755"
  become: true

- name: _verify DSM | Install package restart fixture
  copy:
    dest: /usr/syno/bin/synosystemctl
    content: |
      #!/bin/bash
      set -euo pipefail
      printf '%s\n' "$*" >>/tmp/tailscale_dsm_synosystemctl.log
    mode: "0755"
  become: true

- name: _verify DSM | Exercise the package entry point
  import_tasks: dsm.yml
  vars:
    tailscale_bin: /tmp/tailscale_dsm_fixture

- name: _verify DSM | Read the package fixture state
  slurp:
    src: "{{ item }}"
  loop:
    - /var/packages/Tailscale/scripts/start-stop-status
    - /tmp/tailscale_dsm_fixture.log
    - /tmp/tailscale_dsm_synosystemctl.log
  register: _tailscale_dsm_state
  become: true

- name: _verify DSM | Package was configured, pinned, restarted, and reconciled
  vars:
    _launcher: "{{ _tailscale_dsm_state.results[0].content | b64decode }}"
    _client_calls: "{{ (_tailscale_dsm_state.results[1].content | b64decode).splitlines() }}"
    _restart_calls: "{{ (_tailscale_dsm_state.results[2].content | b64decode).splitlines() }}"
  assert:
    that:
      - _launcher is search('(?m)^PORT="' ~ tailscale_port ~ '"$')
      - "'configure synology' in _client_calls"
      - _client_calls | select('match', '^set --advertise-routes=') | list | length == 1
      - _restart_calls == ['restart pkgctl-Tailscale.service']
    fail_msg: >-
      DSM entry point did not drive the package as expected.
      launcher={{ _launcher }} client={{ _client_calls }} restart={{ _restart_calls }}

# The successful converge exercises cleanup after login. Repeat registration
# with a failing client binary to prove the staged one-time key is also removed
# when login aborts the block.
- name: _verify failure cleanup | Exercise auth-key cleanup after failed login
  block:
    - name: _verify failure cleanup | Register with a failing client
      import_tasks: register.yml
      vars:
        tailscale_bin: /bin/false

    - name: _verify failure cleanup | Registration unexpectedly succeeded
      fail:
        msg: "Expected the fixture Tailscale login to fail"

  rescue:
    - name: _verify failure cleanup | Confirm login reached the failure path
      assert:
        that:
          - ansible_failed_task.name == 'register | Log in to headscale'
        fail_msg: >-
          Registration did not reach the failed-login cleanup path

    - name: _verify failure cleanup | Staged auth key was removed
      stat:
        path: "{{ tailscale_authkey_temp.path }}"
      register: tailscale_authkey_after_failed_login
      failed_when: tailscale_authkey_after_failed_login.stat.exists
      become: true

# The snapshot binding (tasks/main.yml): PartOf carries the target's stop to
# tailscaled, and the add-wants link brings it back with the target's start.
# Kept last because it bounces the daemon; the harness reaches the VM over the
# qemu port-forward, not the tailnet.
- name: _verify | Start the snapshot target fixture
  systemd:
    name: zfs_autosnapshot.target
    state: started
  become: true

- name: _verify | Stop the snapshot target
  systemd:
    name: zfs_autosnapshot.target
    state: stopped
  become: true

- name: _verify | Tailscaled stopped with the snapshot target
  systemd:
    name: tailscaled.service
  register: _tailscale_after_target_stop
  failed_when: _tailscale_after_target_stop.status.ActiveState != 'inactive'
  become: true

- name: _verify | Start the snapshot target again
  systemd:
    name: zfs_autosnapshot.target
    state: started
  become: true

# tailscaled is ordered after the target, so the target's start job returns
# while the daemon is still activating.
- name: _verify | Tailscaled came back with the snapshot target
  systemd:
    name: tailscaled.service
  register: _tailscale_after_target_start
  until: _tailscale_after_target_start.status.ActiveState == 'active'
  retries: 15
  delay: 2
  become: true
