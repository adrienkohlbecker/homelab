# Functional join test -- exercises the real control path: the client must be
# registered and Running against the local headscale, the node must show up in
# the control server's gRPC-backed `nodes list`, and the routes the role
# advertised must be approved. A stat-only "tailscaled is active" check would
# pass even if registration silently failed, so assert the round-trip instead.

- name: _verify | Tailscale backend is Running (registered with headscale)
  command: tailscale status --json --peers=false
  register: _tailscale_status
  changed_when: false
  retries: 5
  delay: 2
  until: >-
    _tailscale_status.rc == 0
    and (_tailscale_status.stdout | from_json).BackendState == 'Running'
    and (((_tailscale_status.stdout | from_json).TailscaleIPs | default([])
          | select('match', '^[0-9.]+$') | list | length) > 0)
  become: true

# The node identity must live on the services dataset, which rides the backup.
- name: _verify | Node state is stored on the services dataset
  stat:
    path: /mnt/services/tailscale/tailscaled.state
  register: _tailscale_state_file
  failed_when: not (_tailscale_state_file.stat.exists | default(false))
  become: true

- name: _verify | This node appears in headscale's node list
  command: podman exec headscale headscale nodes list -o json
  register: _tailscale_nodes
  changed_when: false
  become: true

# Headscale sees what `tailscale set` advertised, independently of the
# approve-routes step.
- name: _verify | The node registered and its advertised and approved routes match exactly
  vars:
    _tailscale_node: >-
      {{ (_tailscale_nodes.stdout | from_json)
         | selectattr('given_name', 'eq', ansible_hostname | lower)
         | first | default({}) }}
    _tailscale_desired_routes: >-
      {{ tailscale_advertise_routes + ['0.0.0.0/0', '::/0'] }}
  assert:
    that:
      - _tailscale_node.id is defined
      - (_tailscale_desired_routes | symmetric_difference(_tailscale_node.available_routes | default([], true))) | length == 0
      - (_tailscale_desired_routes | symmetric_difference(_tailscale_node.approved_routes | default([], true))) | length == 0
    fail_msg: >-
      headscale node for {{ ansible_hostname | lower }} is missing, or its
      advertised or approved routes don't match the desired set.
      desired={{ _tailscale_desired_routes | sort }}
      advertised={{ _tailscale_node.available_routes | default([], true) | sort }}
      approved={{ _tailscale_node.approved_routes | default([], true) | sort }}

# The snapshot binding (tasks/main.yml): PartOf carries the target's stop to
# tailscaled, and the WantedBy link brings it back with the target's start.
# Kept last because it bounces the daemon; the harness reaches the VM over the
# qemu port-forward, not the tailnet.
- name: _verify | Start the snapshot target fixture
  systemd:
    name: zfs_autosnapshot.target
    state: started
  become: true

- name: _verify | Stop the snapshot target
  systemd:
    name: zfs_autosnapshot.target
    state: stopped
  become: true

- name: _verify | Tailscaled stopped with the snapshot target
  systemd:
    name: tailscaled.service
  register: _tailscale_after_target_stop
  failed_when: _tailscale_after_target_stop.status.ActiveState != 'inactive'
  become: true

- name: _verify | Start the snapshot target again
  systemd:
    name: zfs_autosnapshot.target
    state: started
  become: true

# tailscaled is ordered after the target, so the target's start job returns
# while the daemon is still activating.
- name: _verify | Tailscaled came back with the snapshot target
  systemd:
    name: tailscaled.service
  register: _tailscale_after_target_start
  until: _tailscale_after_target_start.status.ActiveState == 'active'
  retries: 15
  delay: 2
  become: true
