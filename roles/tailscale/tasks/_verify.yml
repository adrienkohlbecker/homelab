# Functional join test -- exercises the real control path: the client must be
# registered and Running against the local headscale, the node must show up in
# the control server's gRPC-backed `nodes list`, and the routes the role
# advertised must be approved. A stat-only "tailscaled is active" check would
# pass even if registration silently failed, so assert the round-trip instead.

- name: _verify | Tailscale backend is Running (registered with headscale)
  command: tailscale status --json --peers=false
  register: _tailscale_status
  changed_when: false
  retries: 5
  delay: 2
  until: >-
    _tailscale_status.rc == 0
    and (_tailscale_status.stdout | from_json).BackendState == 'Running'
    and (((_tailscale_status.stdout | from_json).TailscaleIPs | default([])
          | select('match', '^[0-9.]+$') | list | length) > 0)
  become: true

# The node identity must live on the services dataset, which rides the backup.
- name: _verify | Node state is stored on the services dataset
  stat:
    path: /mnt/services/tailscale/tailscaled.state
  register: _tailscale_state_file
  failed_when: not (_tailscale_state_file.stat.exists | default(false))
  become: true

- name: _verify | This node appears in headscale's node list
  command: podman exec headscale headscale nodes list -o json
  register: _tailscale_nodes
  changed_when: false
  become: true

- name: _verify | The node registered and approved routes match exactly
  vars:
    _tailscale_node: >-
      {{ (_tailscale_nodes.stdout | from_json)
         | selectattr('given_name', 'eq', ansible_hostname | lower)
         | first | default({}) }}
    _tailscale_desired_routes: >-
      {{ tailscale_advertise_routes + ['0.0.0.0/0', '::/0'] }}
  assert:
    that:
      - _tailscale_node.id is defined
      - (_tailscale_desired_routes | symmetric_difference(_tailscale_node.approved_routes | default([], true))) | length == 0
    fail_msg: >-
      headscale node for {{ ansible_hostname | lower }} is missing, or its
      approved routes don't match the desired set.
      desired={{ _tailscale_desired_routes | sort }}
      approved={{ _tailscale_node.approved_routes | default([], true) | sort }}

- name: _verify | Read local preferences
  command: tailscale get --json all
  register: _tailscale_prefs
  changed_when: false
  become: true

- name: _verify | Local preferences match host_vars
  vars:
    _prefs: "{{ _tailscale_prefs.stdout | from_json }}"
  assert:
    that:
      - ((_prefs['advertise-routes'] | default('', true)).split(',') | sort) == (tailscale_advertise_routes | sort)
      - _prefs['advertise-exit-node'] | default(false) | bool
      - (_prefs['accept-routes'] | default(false) | bool) == (tailscale_accept_routes | bool)
      - not (_prefs['accept-dns'] | default(false) | bool)
      - _prefs['snat-subnet-routes'] | default(false) | bool
      - not (_prefs['stateful-filtering'] | default(false) | bool)
    fail_msg: >-
      Local preferences do not match desired server routing policy:
      {{ _prefs }}

# Assert the forwarding settings are live, not just present in the sysctl file.
- name: _verify | IP forwarding is enabled
  command: sysctl -n {{ item }}
  loop:
    - net.ipv4.ip_forward
    - net.ipv6.conf.all.forwarding
  register: _tailscale_forwarding
  changed_when: false
  failed_when: _tailscale_forwarding.stdout | trim != '1'
  become: true
