# Functional join test -- exercises the real control path: the client must be
# registered and Running against the local headscale, the node must show up in
# the control server's gRPC-backed `nodes list`, and the routes the role
# advertised must be approved. A stat-only "tailscaled is active" check would
# pass even if registration silently failed, so assert the round-trip instead.

- name: _verify | Tailscale backend is Running (registered with headscale)
  command: tailscale status --json
  register: _tailscale_status
  changed_when: false
  retries: 5
  delay: 2
  until: >-
    _tailscale_status.rc == 0
    and (_tailscale_status.stdout | from_json).BackendState == 'Running'
  become: true

- name: _verify | Tailscale interface carries a mesh IP
  command: tailscale ip -4
  register: _tailscale_ip
  changed_when: false
  failed_when: _tailscale_ip.rc != 0 or (_tailscale_ip.stdout | trim | length == 0)
  become: true

# The node identity must live on the services dataset, which rides the backup.
- name: _verify | Node state file lives on the services dataset
  stat:
    path: /mnt/services/tailscale/tailscaled.state
  register: _tailscale_state_file
  become: true

- name: _verify | State is stored on the services dataset
  assert:
    that:
      - _tailscale_state_file.stat.exists | default(false)
    fail_msg: >-
      tailscale node identity must ride the backup at
      /mnt/services/tailscale/tailscaled.state.

- name: _verify | This node appears in headscale's node list
  command: podman exec headscale headscale nodes list -o json
  register: _tailscale_nodes
  changed_when: false
  become: true

- name: _verify | Resolve the registered node + its approved routes
  set_fact:
    _tailscale_node: >-
      {{ (_tailscale_nodes.stdout | from_json)
         | matching_by_attr('given_name', ansible_hostname | lower)
         | first | default({}) }}
    _tailscale_desired_routes: >-
      {{ tailscale_advertise_routes
         + (tailscale_advertise_exit_node | ternary(['0.0.0.0/0', '::/0'], [])) }}

- name: _verify | The node registered and approved routes match exactly
  assert:
    that:
      - _tailscale_node.id is defined
      - (_tailscale_desired_routes | symmetric_difference(_tailscale_node.approved_routes | default([], true))) | length == 0
    fail_msg: >-
      headscale node for {{ ansible_hostname | lower }} is missing, or its
      approved routes don't match the desired set.
      desired={{ _tailscale_desired_routes | sort }}
      approved={{ _tailscale_node.approved_routes | default([], true) | sort }}

- name: _verify | Read local preferences
  command: tailscale debug prefs
  register: _tailscale_prefs
  changed_when: false
  become: true

- name: _verify | Local preferences match host_vars
  vars:
    _prefs: "{{ _tailscale_prefs.stdout | from_json }}"
  assert:
    that:
      - (_prefs.AdvertiseRoutes | default([], true) | sort) == (_tailscale_desired_routes | sort)
      - (_prefs.RouteAll | default(false) | bool) == (tailscale_accept_routes | bool)
      - (_prefs.CorpDNS | default(false) | bool) == (tailscale_accept_dns | bool)
    fail_msg: >-
      Local preferences don't match desired:
      AdvertiseRoutes={{ _prefs.AdvertiseRoutes | default([], true) | sort }}
      (want {{ _tailscale_desired_routes | sort }}),
      RouteAll={{ _prefs.RouteAll | default(false) }}
      (want {{ tailscale_accept_routes }}), CorpDNS={{ _prefs.CorpDNS | default(false) }}
      (want {{ tailscale_accept_dns }})

# Assert the forwarding settings are live, not just present in the sysctl file.
- name: _verify | IP forwarding is enabled
  command: sysctl -n {{ item }}
  loop:
    - net.ipv4.ip_forward
    - net.ipv6.conf.all.forwarding
  register: _tailscale_forwarding
  changed_when: false
  failed_when: _tailscale_forwarding.stdout | trim != '1'
  become: true

- name: _verify | Exercise tailscale fluent-bit noise filters
  import_role:
    name: fluentbit
    tasks_from: verify_extension
  vars:
    fluentbit_verify_args:
      name: tailscale
      unit: tailscaled
      records:
        - MESSAGE: "netcheck: netcheck: UDP is blocked, trying HTTPS"
          marker: tailscale-udp-https-drop
        - MESSAGE: "netcheck: UDP is blocked, trying ICMP"
          marker: tailscale-udp-icmp-drop
        - MESSAGE: "netmap: suggested exit node:  ()"
          marker: tailscale-empty-exit-drop
        - MESSAGE: "netcheck: DetectCaptivePortal(found=false)"
          marker: tailscale-captive-false-drop
        - MESSAGE: "magicsock: disco: node [leV4J] d:abcdef now using 192.0.2.1:41641 mtu=1280 tx=1234abcd"
          marker: tailscale-path-change-drop
        - MESSAGE: "magicsock: disco: failed to send ping tx=1234 sendto: destination address required"
          marker: tailscale-disco-ping-drop
        - MESSAGE: "magicsock: derp-12 does not know about peer [leV4J], removing route"
          marker: tailscale-derp-route-drop
        - MESSAGE: 'control: NetInfo: NetInfo{varies=false ipv6=false udp=true}'
          marker: tailscale-netinfo-keep
      expected:
        - message: 'control: NetInfo: NetInfo{varies=false ipv6=false udp=true}'
          service: tailscaled
          fields.marker: tailscale-netinfo-keep

- name: _verify | Routine tailscale probe and path records are omitted
  assert:
    that: "'-drop' not in fluentbit_verify_result.stdout"
