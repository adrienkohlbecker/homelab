# End-to-end client test: stand up a real headscale control plane on Lab, then
# let the role's `tailscale login` register against it and have the approve-routes
# step (delegated back to Lab) round-trip through the live gRPC API. This proves
# the full mesh-join path, not just "the package installed".
#
# The control server runs with a plain-http loopback server_url
# (headscale_server_url below) so the Tailscale client trusts it without the
# snakeoil TLS dance -- the prod path is https via nginx, exercised by
# roles/headscale's own _verify.

- name: _setup | Install podman
  import_role:
    name: podman
    tasks_from: install

- name: _setup | Install nginx
  import_role:
    name: nginx
    tasks_from: test_fixture

# Fluent Bit's logrotate drop-in validates with the binary, which the Minimal
# cloud image does not ship.
- name: _setup | Install logrotate
  import_role:
    name: logrotate
    tasks_from: main

# headscale:main registers and dry-run validates a fluent-bit extension.
- name: _setup | Install fluent-bit for the headscale log extension
  import_role:
    name: fluentbit
    tasks_from: configure

- name: _setup | Create /mnt/services
  file:
    path: /mnt/services
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

# The standalone role fixture normally omits the snapshot target. Install a
# real target on ZFS-root fixtures so converge also exercises the cross-role
# PartOf/Wants binding used on production ZFS hosts. Non-ZFS hosts have no such
# target, and the role must not reference one there.
- name: _setup | Install a snapshot target fixture
  when: zfs_root
  copy:
    dest: /etc/systemd/system/zfs_autosnapshot.target
    content: |
      [Unit]
      Description=Tailscale snapshot binding fixture
    owner: root
    group: root
    mode: "0644"
  become: true

- name: _setup | Reload systemd after installing the target fixture
  when: zfs_root
  systemd:
    daemon_reload: true
  become: true

# Bring up the headscale control plane. server_url points at the plain-http
# loopback listener (not the https vhost) so the client below can register
# without trusting the Lab fixture's snakeoil cert.
- name: _setup | Stand up headscale control plane
  import_role:
    name: headscale
    tasks_from: main
  vars:
    headscale_server_url: "http://localhost:{{ service_ports.headscale }}"
