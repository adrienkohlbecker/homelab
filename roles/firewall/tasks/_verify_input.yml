# INPUT chain probes. Counters are reset up-front so every probe in
# this file contributes to the assertion block in _verify_counters.yml
# from a clean baseline; positives fire `>= 1` (any number is fine) and
# negative-only counters stay at 0. The reset is up-front (not between
# the TCP and UDP blocks) so it can't wipe TCP probe hits before assertion
# time.
- name: _verify_input | Reset nftables counters before INPUT probes
  command: nft reset counters table inet homelab
  changed_when: false
  become: true

# Unscoped INPUT allow / catch-all reject — baseline coverage.
- name: _verify_input | INPUT allow — public HTTP ports reachable from extns
  command: >
    ip netns exec extns curl --interface {{ _firewall_probe_nonscope }}
    --connect-timeout 3 --max-time 5 -sf http://192.0.2.1:{{ item }}/
  loop:
    - 80
    - 443
  loop_control:
    label: tcp/{{ item }}
  register: _firewall_public_http
  changed_when: false
  failed_when: _firewall_public_http.rc != 0 or 'firewall-verify-ok' not in _firewall_public_http.stdout
  become: true

# Loopback accept (`iif lo accept`). The fixture listener returns a known
# body so this proves real delivery, while the counter assertion at the end
# still confirms the packet matched the loopback rule rather than a broader
# allow.
- name: _verify_input | INPUT allow — iif lo (loopback 127.0.0.1:80 from host)  # noqa: command-instead-of-module
  command: curl --connect-timeout 3 --max-time 5 -sf http://127.0.0.1:80/
  register: _firewall_input_loopback
  changed_when: false
  failed_when: _firewall_input_loopback.rc != 0 or 'firewall-verify-ok' not in _firewall_input_loopback.stdout
  become: true

- name: _verify_input | INPUT allow — tailscale0 ingress reaches mesh accept
  command: >
    ip netns exec extns curl --interface {{ _firewall_probe_tailscale }}
      --connect-timeout 3 --max-time 5 -sf http://100.64.99.1:80/
  register: _firewall_input_tailscale
  changed_when: false
  failed_when: _firewall_input_tailscale.rc != 0 or 'firewall-verify-ok' not in _firewall_input_tailscale.stdout
  become: true

# SSH (22/tcp) is in the unscoped `tcp dport { 22, 80, 443 } accept`
# set. The harness's own ansible connection is over WAN-side slirp
# hostfwd, so a regression that scopes 22 to @lan_admin_ifaces would
# still pass via the test rig's enp0s2 — probe from extns to lock in
# the unscoped contract on top of that. bash /dev/tcp opens a raw TCP
# connection; rc=0 means the SYN-ACK landed, rc!=0 means the catch-all
# fired.
- name: _verify_input | INPUT allow — SSH (22/tcp) reachable from extns (unscoped)
  shell: ip netns exec extns timeout 3 bash -c "exec 3<>/dev/tcp/192.0.2.1/22"
  args: { executable: /bin/bash }
  changed_when: false
  become: true

# Controller-side UDP forwards exercise the real WAN interface. UDP has no
# response contract here; named counters below distinguish accepted probes
# from the deliberately rejected mDNS source.
- name: _verify_input | Send WAN-side UDP policy probes
  delegate_to: localhost
  command:
    argv:
      - nc
      - -u
      - -w
      - "1"
      - "{{ wan_probe_host }}"
      - "{{ item.port }}"
    stdin: .
  loop:
    - label: wireguard accept
      port: "{{ wan_forward_ports.udp['51820'] }}"
    - label: transmission accept
      port: "{{ wan_forward_ports.udp[(service_ports.transmission_bt | string)] }}"
    - label: tailscale underlay accept
      port: "{{ wan_forward_ports.udp[(tailscale_port | string)] }}"
      enabled: "{{ tailscale_wan_direct | default(false) }}"
    - label: mDNS non-home-source reject
      port: "{{ wan_forward_ports.udp['5353'] }}"
  loop_control:
    label: "{{ item.label }}"
  when: item.enabled | default(true) | bool
  changed_when: false
  failed_when: false

# Transmission BT peer port is WAN-only (iif=$WAN_IFACE). Harness backends
# that expose controller-side forwards for both protocols prove WAN ingress;
# the wg0 probes below still catch regressions that drop the iif scope and
# expose 51413 to tunnel peers.
- name: _verify_input | INPUT allow — transmission (51413/tcp) reachable on WAN iface from controller  # noqa: command-instead-of-module
  delegate_to: localhost
  command: >
    curl --connect-timeout 3 --max-time 5 -sf
      http://{{ wan_probe_host }}:{{ wan_forward_ports.tcp[(service_ports.transmission_bt | string)] }}/
  register: _firewall_input_transmission_wan
  changed_when: false
  failed_when: _firewall_input_transmission_wan.rc != 0 or 'firewall-verify-ok' not in _firewall_input_transmission_wan.stdout

# --- probe_wg group (wireguard-source positives) ---------------------
# The concatenated admin set accepts WG_SUBNET sources on wg0. mDNS is the
# paired negative because it additionally requires WAN ingress + HOME_LAN.
- name: _verify_input | Send wireguard-source UDP policy probes
  command:
    argv:
      - ip
      - netns
      - exec
      - extns
      - nc
      - -u
      - -w
      - "1"
      - -s
      - "{{ _firewall_probe_wg }}"
      - 192.0.2.1
      - "{{ item.port }}"
    stdin: .
  loop:
    - { label: mosh accept, port: "60000" }
    - label: tailscale LAN-direct accept
      port: "{{ tailscale_port }}"
      enabled: "{{ tailscale_wan_direct | default(false) }}"
    - { label: mDNS source reject, port: "5353" }
  loop_control:
    label: "{{ item.label }}"
  when: item.enabled | default(true) | bool
  changed_when: false
  become: true

- name: _verify_input | INPUT — admin TCP services reachable from wireguard source
  command: >
    ip netns exec extns curl --interface {{ _firewall_probe_wg }}
    --connect-timeout 3 --max-time 5 -sf http://192.0.2.1:{{ item.port }}/
  loop:
    - { label: Samba, port: "445" }
    - { label: nut, port: "{{ service_ports.nut }}" }
    - { label: Authelia, port: "{{ service_ports.authelia }}" }
  loop_control:
    label: "{{ item.label }}"
  register: _firewall_wg_admin_tcp
  changed_when: false
  failed_when: _firewall_wg_admin_tcp.rc != 0 or 'firewall-verify-ok' not in _firewall_wg_admin_tcp.stdout
  become: true

# IGMP accept is unscoped (link-local TTL=1 — no WAN-routable IGMP), so
# a raw proto-2 packet from any ingress must hit igmp_accept. hping3
# --rawip -H 2 sends an IGMP (protocol 2) datagram (same mechanism as
# the VRRP proto-112 negative probe).
- name: _verify_input | INPUT — IGMP (proto 2) reaches the igmp_accept rule
  command: ip netns exec extns hping3 --rawip -H 2 -c 1 -d 0 --quiet 192.0.2.1
  changed_when: false
  failed_when: false
  become: true

# --- probe_home group (home_LAN-source iif/saddr-mismatch negatives) -
# HOME_LAN sources arriving on wg0 must miss the paired admin and mDNS rules.
- name: _verify_input | Send home-source UDP mismatch probes
  command:
    argv:
      - ip
      - netns
      - exec
      - extns
      - nc
      - -u
      - -w
      - "1"
      - -s
      - "{{ _firewall_probe_home }}"
      - 192.0.2.1
      - "{{ item.port }}"
    stdin: .
  loop:
    - { label: mosh reject, port: "60000" }
    - { label: mDNS interface reject, port: "5353" }
  loop_control:
    label: "{{ item.label }}"
  changed_when: false
  become: true

- name: _verify_input | INPUT — admin TCP services reject mismatched home source on wg0
  command: >
    ip netns exec extns curl --interface {{ _firewall_probe_home }}
    --connect-timeout 3 --max-time 5 -sf http://192.0.2.1:{{ item.port }}/
  loop:
    - { label: Samba, port: "445" }
    - { label: nut, port: "{{ service_ports.nut }}" }
  loop_control:
    label: "{{ item.label }}"
  register: _firewall_home_tcp_mismatch
  changed_when: false
  failed_when: _firewall_home_tcp_mismatch.rc == 0
  become: true

- name: _verify_input | INPUT — admin TCP services reachable through mac_mgmt
  command: >
    ip netns exec extns curl --interface {{ _firewall_probe_home_mac }}
    --connect-timeout 3 --max-time 5 -sf
    http://{{ _firewall_probe_home_mac_host }}:{{ item.port }}/
  loop:
    - { label: Samba, port: "445" }
    - { label: nut, port: "{{ service_ports.nut }}" }
  loop_control:
    label: "{{ item.label }}"
  register: _firewall_mac_admin_tcp
  changed_when: false
  failed_when: _firewall_mac_admin_tcp.rc != 0 or 'firewall-verify-ok' not in _firewall_mac_admin_tcp.stdout
  become: true

- name: _verify_input | INPUT — tailscale direct endpoint reachable through mac_mgmt
  when: tailscale_wan_direct | default(false)
  command:
    argv:
      - ip
      - netns
      - exec
      - extns
      - nc
      - -u
      - -w
      - "1"
      - -s
      - "{{ _firewall_probe_home_mac }}"
      - "{{ _firewall_probe_home_mac_host }}"
      - "{{ tailscale_port }}"
    stdin: .
  changed_when: false
  become: true

# --- probe_nonscope group (out-of-scope negatives) -------------------
# probe_nonscope is in none of the trusted source ranges. These probes must
# miss every source- or WAN-scoped UDP allow.
- name: _verify_input | Send non-scope UDP rejection probes
  command:
    argv:
      - ip
      - netns
      - exec
      - extns
      - nc
      - -u
      - -w
      - "1"
      - -s
      - "{{ _firewall_probe_nonscope }}"
      - 192.0.2.1
      - "{{ item.port }}"
    stdin: .
  loop:
    - { label: wireguard interface reject, port: "51820" }
    - { label: transmission interface reject, port: "{{ service_ports.transmission_bt }}" }
    - { label: mosh source reject, port: "60000" }
  loop_control:
    label: "{{ item.label }}"
  changed_when: false
  become: true

- name: _verify_input | INPUT — scoped TCP services reject non-scope source
  command: >
    ip netns exec extns curl --interface {{ _firewall_probe_nonscope }}
    --connect-timeout 3 --max-time 5 -sf http://192.0.2.1:{{ item.port }}/
  loop:
    - { label: Samba, port: "445" }
    - { label: nut, port: "{{ service_ports.nut }}" }
    - { label: transmission, port: "{{ service_ports.transmission_bt }}" }
  loop_control:
    label: "{{ item.label }}"
  register: _firewall_nonscope_tcp
  changed_when: false
  failed_when: _firewall_nonscope_tcp.rc == 0
  become: true

# --- podman-source positives -----------------------------------------
# Aardvark accepts both the default bridge and named-bridge pool; NUT accepts
# the named pool used by Home Assistant.
- name: _verify_input | INPUT — aardvark-dns reachable from podman source ranges
  command:
    argv:
      - ip
      - netns
      - exec
      - extns
      - nc
      - -u
      - -w
      - "1"
      - -s
      - "{{ item.source }}"
      - 192.0.2.1
      - "5333"
    stdin: .
  loop:
    - { label: default bridge, source: "{{ _firewall_probe_podman }}" }
    - { label: named bridge pool, source: "{{ _firewall_probe_podman_pool }}" }
  loop_control:
    label: "{{ item.label }}"
  changed_when: false
  become: true

- name: _verify_input | INPUT — nut (3493/tcp) reachable from podman_bridge_pool source
  command: >
    ip netns exec extns curl --interface {{ _firewall_probe_podman_pool }}
    --connect-timeout 3 --max-time 5 -sf
    http://192.0.2.1:{{ service_ports.nut }}/
  register: _firewall_podman_pool_nut
  changed_when: false
  failed_when: _firewall_podman_pool_nut.rc != 0 or 'firewall-verify-ok' not in _firewall_podman_pool_nut.stdout
  become: true

# VRRP and mDNS still need structural checks: the harness can't
# generate arbitrary L4 protocol 112 through the WAN path, and the qemu
# WAN forward doesn't preserve a HOME_LAN source address for mDNS.
# JSON output is more stable than text against nft's canonicalization
# quirks (e.g. `ip protocol 112` ↔ `ip protocol vrrp`).
- name: _verify_input | INPUT — get nft ruleset (JSON, for structural scope checks)
  command: nft -j list table inet homelab
  register: _firewall_nft_ruleset_scope
  changed_when: false
  become: true

- name: _verify_input | INPUT — VRRP rule absent on non-keepalived peers
  vars:
    vrrp_rules: "{{ _firewall_nft_ruleset_scope.stdout | nft_rules_by_counter('vrrp_accept') }}"
  assert:
    that:
      - vrrp_rules | length == 0
    fail_msg: >-
      Non-keepalived host rendered a VRRP accept rule; only hosts in
      dns_keepalived_peers should accept peer VRRP.
  when: not (inventory_hostname in dns_keepalived_peers or qemu_test | default(false))

- name: _verify_input | INPUT — VRRP rule renders with iifname + protocol scope
  vars:
    # Anchor on the rule's counter reference rather than its comment
    # text. Counter names are part of each rule's functional identity;
    # comments are documentation and may be rephrased without breaking
    # the rule. nft -j renders a per-rule `counter name "<name>"`
    # reference as `{"counter": "<name>"}` (bare string value), not
    # `{"counter": {"name": "<name>"}}` -- the latter shape is what
    # nft uses for the standalone counter *declaration* at the head
    # of the table, not for references inside rule expressions.
    # `contains` on the exact reference dict finds the matching rule.
    vrrp_rule: "{{ _firewall_nft_ruleset_scope.stdout | nft_rule_by_counter('vrrp_accept') }}"
    vrrp_matches: "{{ vrrp_rule.expr
                      | selectattr('match', 'defined')
                      | map(attribute='match') | list }}"
  assert:
    that:
      - (vrrp_matches | selectattr('left.meta', 'defined') | selectattr('left.meta.key', 'eq', 'iifname') | map(attribute='right') | first) == default_interface
      - (vrrp_matches | selectattr('left.payload', 'defined') | selectattr('left.payload.field', 'eq', 'protocol') | map(attribute='right') | first) in ['vrrp', 112]
    fail_msg: >-
      VRRP rule referencing counter `vrrp_accept` is missing
      iifname={{ default_interface }} or protocol=vrrp scope.
  when: inventory_hostname in dns_keepalived_peers or qemu_test | default(false)

- name: _verify_input | DNS VIP silence rules retain their destination scope
  vars:
    input_vip_tcp_rule: "{{ _firewall_nft_ruleset_scope.stdout | nft_rule_by_counter('input_silenced_vip_tcp') }}"
    input_vip_rule: "{{ _firewall_nft_ruleset_scope.stdout | nft_rule_by_counter('input_silenced_vip') }}"
    forward_vip_rule: "{{ _firewall_nft_ruleset_scope.stdout | nft_rule_by_counter('forward_silenced_vip') }}"
    input_vip_tcp_matches: "{{ input_vip_tcp_rule.expr | selectattr('match', 'defined') | map(attribute='match') | list }}"
    input_vip_matches: "{{ input_vip_rule.expr | selectattr('match', 'defined') | map(attribute='match') | list }}"
    forward_vip_matches: "{{ forward_vip_rule.expr | selectattr('match', 'defined') | map(attribute='match') | list }}"
  assert:
    that:
      - (input_vip_tcp_matches | selectattr('left.payload', 'defined') | selectattr('left.payload.field', 'eq', 'daddr') | map(attribute='right') | first) == network.virtual_ips.dns
      - (input_vip_matches | selectattr('left.payload', 'defined') | selectattr('left.payload.field', 'eq', 'daddr') | map(attribute='right') | first) == network.virtual_ips.dns
      - (forward_vip_matches | selectattr('left.ct', 'defined') | selectattr('left.ct.key', 'eq', 'ip daddr') | selectattr('left.ct.dir', 'eq', 'original') | map(attribute='right') | first) == network.virtual_ips.dns
    fail_msg: >-
      DNS VIP silence rules must match the current INPUT destination or the
      original FORWARD destination so unrelated vmac traffic stays observable.
  when: inventory_hostname in dns_keepalived_peers or qemu_test | default(false)

- name: _verify_input | INPUT — mDNS rendered rule keeps LAN iif/source/port scope
  vars:
    mdns_rule: "{{ _firewall_nft_ruleset_scope.stdout | nft_rule_by_counter('mdns_accept') }}"
    mdns_matches: "{{ mdns_rule.expr
                      | selectattr('match', 'defined')
                      | map(attribute='match') | list }}"
    mdns_saddr: "{{ mdns_matches
                    | selectattr('left.payload', 'defined')
                    | selectattr('left.payload.protocol', 'eq', 'ip')
                    | selectattr('left.payload.field', 'eq', 'saddr')
                    | map(attribute='right') | first }}"
  assert:
    that:
      - (mdns_matches | selectattr('left.meta', 'defined') | selectattr('left.meta.key', 'eq', 'iifname') | map(attribute='right') | first) == default_interface
      - mdns_saddr.prefix.addr == (network.sites.home.cidr | ansible.utils.ipaddr('network'))
      - (mdns_saddr.prefix.len | int) == (network.sites.home.cidr | ansible.utils.ipaddr('prefix') | int)
      - (mdns_matches | selectattr('left.payload', 'defined') | selectattr('left.payload.protocol', 'eq', 'udp') | selectattr('left.payload.field', 'eq', 'dport') | map(attribute='right') | first | int) == 5353
    fail_msg: >-
      mDNS firewall rule lost its iifname, home-LAN source, or UDP/5353 scope.
