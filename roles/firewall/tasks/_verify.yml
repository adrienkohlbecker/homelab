# Functional firewall verification against live netfilter: the rig gives
# probe sources the ingress interfaces the ruleset keys on, and each packet
# path is judged by the homelab table's named counters.
- name: _verify | Set up the probe rig
  import_tasks: _verify_rig.yml
- name: _verify | Run lifecycle (reload, stop/start) checks
  import_tasks: _verify_lifecycle.yml
- name: _verify | Run named podman bridge checks
  import_tasks: _verify_forward.yml
- name: _verify | Run the counter-judged probe matrix
  import_tasks: _verify_probes.yml
- name: _verify | Run the auto-revert lockout check
  import_tasks: _verify_revert.yml
