# FORWARD/DNAT verification requires the production podman stack and
# its netavark chains, masquerade, and published-port DNAT.
- name: _setup | Install podman stack via prod install.yml
  import_role:
    name: podman
    tasks_from: install

# Force a valid ruleset drift on full fixtures so converge exercises live
# reload and rollback. Minimal remains inactive to cover first installation.
- name: _setup | Prepare the live reload exercise
  when: not (qemu_test_minimal | default(false))
  block:
    - name: _setup | Seed the confirmed pre-reload snapshot
      copy:
        src: /etc/nftables.conf
        dest: /etc/nftables.conf.pre-reload
        remote_src: true
        owner: root
        group: root
        mode: "0644"
      become: true

    - name: _setup | Start nftables before the reload exercise
      systemd:
        name: nftables.service
        state: started
      become: true

    # A comment keeps the currently loaded firewall semantics unchanged until
    # converge applies the drift.
    - name: _setup | Drift the persisted nftables ruleset
      lineinfile:
        path: /etc/nftables.conf
        line: '# condition coverage drift fixture'
        insertafter: EOF
        create: false
      become: true

- name: _setup | Build the probe topology
  import_tasks: _rig_topology.yml
