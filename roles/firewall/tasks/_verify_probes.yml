# Probe matrix: one row per packet path, each judged by the counters of the
# rules it must reach (`hit`) and bypass (`miss`). See _verify_probe.yml for
# the row contract and _rig_topology.yml for the address aliases. Rows run in
# extns and enter through the wg0-named veth unless they say otherwise.

# Reproduce the stale-DNAT VIP handoff: the original destination is the DNS
# VIP, but PREROUTING rewrites it to a peer behind wg0. The packet enters on
# the vmac and reaches FORWARD without matching the podman DNAT accept.
- name: _verify_probes | Install stale DNS VIP DNAT fixture
  when: dns_vrrp_enabled
  command:
    argv: [ nft, -f, "-" ]
    stdin: |
      add chain inet homelab firewall_verify_vip_dnat {
          type nat hook prerouting priority -101; policy accept;
      }
      add rule inet homelab firewall_verify_vip_dnat \
          iifname "vrrp.{{ dns_keepalived_vrid }}" \
          ip daddr {{ _firewall_addr.vip }} udp dport 12345 \
          dnat ip to {{ _firewall_addr.nonscope }}
  changed_when: true
  become: true

- name: _verify_probes | Run probe matrix
  include_tasks: _verify_probe.yml
  when: firewall_probe.enabled | default(true) | bool
  vars:
    _samba: "{{ samba_shares | default([]) | length > 0 }}"
    _ts_direct: "{{ tailscale_wan_direct | default(false) }}"
    _ts_routes: "{{ tailscale_advertise_routes is defined }}"
    _ts_port: "{{ tailscale_port | default(0) }}"
    _nut: "{{ service_ports.nut }}"
    _authelia: "{{ service_ports.authelia }}"
    _published: "{{ _firewall_container_port }}"
  loop_control:
    loop_var: firewall_probe
    label: "{{ firewall_probe.name }}"
  loop:
    # Unscoped INPUT accepts.
    - { name: SSH from a non-scope source, proto: tcp, port: 22, expect: pass, hit: [ input_public_tcp ] }
    - { name: HTTP from a non-scope source, proto: tcp, port: 80, expect: pass, hit: [ input_public_tcp ] }
    - { name: HTTPS from a non-scope source, proto: tcp, port: 443, expect: pass, hit: [ input_public_tcp ] }
    - name: Loopback
      runner: host
      argv: [ curl, -sf, --max-time, "5", "http://127.0.0.1:80/" ]
      expect: pass
      hit: [ input_loopback ]
      miss: [ input_public_tcp ]
    - { name: Tailscale0 ingress, enabled: "{{ _ts_routes }}", proto: tcp, port: 80, from: tailscale, to: tailscale_host, expect: pass,
        hit: [ tailscale_input_accept ], miss: [ input_public_tcp ] }
    - { name: ICMP echo, argv: [ ping, -c, "1", -W, "2", "{{ _firewall_addr.host }}" ], expect: pass, hit: [ input_icmp_accept ] }
    # IGMP is link-local, so any ingress is accepted.
    - { name: IGMP, argv: [ hping3, --rawip, -H, "2", -c, "1", -d, "0", --quiet, "{{ _firewall_addr.host }}" ], hit: [ igmp_accept ] }

    # WAN ingress from the controller.
    - name: WireGuard from WAN
      runner: controller
      argv: [ nc, -u, -w, "1", "{{ wan_probe_host }}", "{{ wan_forward_ports.udp['51820'] }}" ]
      hit: [ wireguard_accept ]
    - name: Tailscale underlay from WAN
      enabled: "{{ _ts_direct }}"
      runner: controller
      argv: [ nc, -u, -w, "1", "{{ wan_probe_host }}", "{{ wan_forward_ports.udp[_ts_port | string] | default(0) }}" ]
      hit: [ tailscale_underlay_accept ]
    # The forward does not preserve a home-LAN source.
    - name: mDNS from WAN with a non-home source
      runner: controller
      argv: [ nc, -u, -w, "1", "{{ wan_probe_host }}", "{{ wan_forward_ports.udp['5353'] }}" ]
      hit: [ input_catchall ]
      miss: [ mdns_accept ]

    # Admin services accept the wireguard subnet on wg0.
    - { name: Mosh from a wireguard source, proto: udp, port: 60000, from: wg, hit: [ input_admin ] }
    - { name: Tailscale direct endpoint from a wireguard source, enabled: "{{ _ts_direct }}", proto: udp, port: "{{ _ts_port }}", from: wg,
        hit: [ input_admin ], miss: [ input_silenced ] }
    - { name: Samba from a wireguard source, enabled: "{{ _samba }}", proto: tcp, port: 445, from: wg, expect: pass, hit: [ input_admin ] }
    - { name: NUT from a wireguard source, proto: tcp, port: "{{ _nut }}", from: wg, expect: pass, hit: [ input_admin ] }
    # mDNS additionally requires WAN ingress and a home-LAN source.
    - { name: mDNS from a wireguard source, proto: udp, port: 5353, from: wg, hit: [ input_catchall ], miss: [ mdns_accept ] }

    # Home-LAN sources must arrive on the WAN iface, not wg0.
    - { name: Mosh from a home source on wg0, proto: udp, port: 60000, from: home, hit: [ input_catchall ], miss: [ input_admin ] }
    - { name: mDNS from a home source on wg0, proto: udp, port: 5353, from: home, hit: [ input_catchall ], miss: [ mdns_accept ] }
    - { name: Samba from a home source on wg0, enabled: "{{ _samba }}", proto: tcp, port: 445, from: home, expect: fail,
        hit: [ input_catchall_reset ], miss: [ input_admin ] }
    - { name: NUT from a home source on wg0, proto: tcp, port: "{{ _nut }}", from: home, expect: fail,
        hit: [ input_catchall_reset ], miss: [ input_admin ] }

    # A source outside every trusted range misses each scoped accept.
    - { name: WireGuard from a non-scope source on wg0, proto: udp, port: 51820, hit: [ input_catchall ], miss: [ wireguard_accept ] }
    - { name: Mosh from a non-scope source, proto: udp, port: 60000, hit: [ input_catchall ], miss: [ input_admin ] }
    - { name: Samba from a non-scope source, enabled: "{{ _samba }}", proto: tcp, port: 445, expect: fail,
        hit: [ input_catchall_reset ], miss: [ input_admin ] }
    - { name: NUT from a non-scope source, proto: tcp, port: "{{ _nut }}", expect: fail,
        hit: [ input_catchall_reset ], miss: [ input_admin, input_nut_podman ] }
    - { name: Aardvark DNS TCP from a non-scope source, proto: tcp, port: 5333, expect: fail,
        hit: [ input_catchall_reset ], miss: [ aardvark_tcp_accept ] }

    # Container sources: aardvark-dns serves both the default bridge and the
    # named-bridge pool; NUT admits the pool used by Home Assistant.
    - { name: Aardvark DNS UDP from the default bridge, proto: udp, port: 5333, from: podman, hit: [ aardvark_accept ] }
    - { name: Aardvark DNS UDP from the named-bridge pool, proto: udp, port: 5333, from: pool, hit: [ aardvark_accept ] }
    - { name: Aardvark DNS TCP from the default bridge, proto: tcp, port: 5333, from: podman, expect: pass, hit: [ aardvark_tcp_accept ] }
    - { name: Aardvark DNS TCP from the named-bridge pool, proto: tcp, port: 5333, from: pool, expect: pass, hit: [ aardvark_tcp_accept ] }
    - { name: NUT from the named-bridge pool, proto: tcp, port: "{{ _nut }}", from: pool, expect: pass,
        hit: [ input_nut_podman ], miss: [ input_admin ] }

    # Crafted mid-stream packets. Loose conntrack classifies them as NEW.
    - name: INPUT TCP ACK without SYN
      argv: [ hping3, -A, -p, "80", -c, "1", --quiet, "{{ _firewall_addr.host }}" ]
      hit: [ input_nonsyn ]
      miss: [ input_public_tcp ]
    - name: FORWARD TCP ACK without SYN
      argv: [ hping3, -A, -p, "{{ _published }}", -c, "1", --quiet, "{{ _firewall_addr.container_dest }}" ]
      hit: [ forward_nonsyn ]

    # Container reach through netavark's DNAT. The controller-side forward
    # completes the handshake itself, so only an HTTP response proves the
    # guest delivered. A container querying its bridge gateway DNATs back
    # into the same bridge.
    - { name: Published container from wg0, proto: tcp, port: "{{ _published }}", expect: pass }
    - name: Published container from WAN
      runner: controller
      argv: [ curl, -sf, --max-time, "10", "http://{{ wan_probe_host }}:{{ wan_forward_ports.tcp[_published | string] }}/" ]
      expect: pass
    - name: Same-bridge DNAT through the default bridge gateway
      runner: host
      argv: [ podman, run, --rm, --network, podman, docker.io/library/busybox, wget, -q, -O, "-", -T, "5",
              "http://{{ podman_default_network | ansible.utils.ipmath(1) }}:{{ _published }}/" ]
      expect: pass
    # The tailscale source reaches the container without DNAT, standing in
    # for a subnet-router destination.
    - { name: Tailscale0 forward to a container, enabled: "{{ _ts_routes }}", proto: tcp, port: "{{ _published }}", from: tailscale,
        to: "{{ _firewall_container_ip }}", expect: pass, hit: [ tailscale_forward_accept ] }

    # Container egress to anything but another bridge: the WAN through
    # netavark's masquerade, and a non-WAN wg0 peer so a WAN-only tightening
    # fails loudly.
    - name: Default-bridge container egress to WAN
      runner: host
      argv: [ podman, exec, firewall_verify_httpd, nc, -z, -w, "10", 1.1.1.1, "80" ]
      expect: pass
      retries: 5
    - name: Default-bridge container egress to a wg0 peer
      runner: host
      argv: [ podman, exec, firewall_verify_httpd, ping, -c, "1", -W, "3", "{{ _firewall_addr.nonscope }}" ]
      expect: pass

    # FORWARD catch-all: no DNAT, so no container or egress accept applies.
    # The egress rows above prove the transit destination is reachable.
    - { name: Direct container IP from wg0, proto: tcp, port: 80, to: container_dest, expect: fail, hit: [ forward_catchall ] }
    - { name: WireGuard source transit to WAN, proto: tcp, port: 80, from: wg, to: 1.1.1.1, expect: fail, hit: [ forward_catchall ] }

    # Authelia's published port admits only nginx: loopback on this host and
    # the wireguard mesh from the others. The fixture container stands in.
    - name: Authelia over loopback
      runner: host
      argv: [ curl, -sf, --max-time, "5", "http://127.0.0.1:{{ _authelia }}/" ]
      expect: pass
      miss: [ forward_authelia_wg, forward_authelia_drop ]
    - { name: Authelia from a wireguard source, proto: tcp, port: "{{ _authelia }}", from: wg, expect: pass, hit: [ forward_authelia_wg ] }
    - { name: Authelia from a non-scope source on wg0, proto: tcp, port: "{{ _authelia }}", expect: fail,
        hit: [ forward_authelia_drop ], miss: [ forward_authelia_wg ] }
    - name: Authelia from WAN
      runner: controller
      argv: [ curl, -sf, --max-time, "5", "http://{{ wan_probe_host }}:{{ wan_forward_ports.tcp[_authelia | string] }}/" ]
      expect: fail
      hit: [ forward_authelia_drop ]

    # Silenced noise lands on its own drop, not the logging catch-all.
    - { name: SSDP noise, proto: udp, port: 1900, hit: [ input_silenced ] }
    - { name: NetBIOS noise, proto: udp, port: 137, hit: [ input_silenced ] }
    - { name: Tailscale disco probe from a non-scope source, enabled: "{{ _ts_direct }}", proto: udp, port: "{{ _ts_port }}",
        hit: [ input_silenced ], miss: [ input_admin ] }
    - { name: Unscoped UDP port, proto: udp, port: 18181, hit: [ input_catchall ] }

    # Household DNS: a LAN client reaches the resolver container published on
    # the VIP through the vmac. Any leakage counter would mean the DNAT missed.
    - { name: DNS VIP to its published container through the vmac, enabled: "{{ dns_vrrp_enabled }}", proto: tcp, port: 53,
        from: vrrp_peer, to: vip, expect: pass, miss: [ input_silenced_vip_tcp, forward_silenced_vip, forward_catchall ] }
    # DNS VIP leakage through the vmac. TCP keeps its fast-fail reset so DoT
    # clients fail over; UDP and stale FORWARD DNAT drop silently.
    - name: TCP to the DNS VIP through the vmac
      enabled: "{{ dns_vrrp_enabled }}"
      argv: [ hping3, -S, -p, "853", -c, "1", --quiet, --interface, vrrp_ext, "{{ _firewall_addr.vip }}" ]
      hit: [ input_silenced_vip_tcp ]
    - { name: UDP to the DNS VIP through the vmac, enabled: "{{ dns_vrrp_enabled }}", proto: udp, port: 9999, from: vrrp_peer, to: vip,
        hit: [ input_silenced_vip ] }
    - { name: Stale DNS VIP DNAT through the vmac, enabled: "{{ dns_vrrp_enabled }}", proto: udp, port: 12345, from: vrrp_peer, to: vip,
        hit: [ forward_silenced_vip ], miss: [ forward_catchall ] }
    # The rig cannot send protocol 112 through the WAN path; wg0 ingress
    # must miss the WAN-scoped VRRP accept.
    - name: VRRP on wg0
      enabled: "{{ dns_vrrp_enabled }}"
      argv: [ hping3, --rawip, -H, "112", -c, "1", -d, "0", --quiet, "{{ _firewall_addr.host }}" ]
      hit: [ input_catchall ]
      miss: [ vrrp_accept ]
