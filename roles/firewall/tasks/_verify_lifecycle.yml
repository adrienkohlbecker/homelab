# Reload and ExecStop drop-in coverage. Runs before the probes, so their
# DNAT rows prove the reload and restart left netavark's tables intact.

# Reload through systemd to exercise the drop-in and reattach wg0 to the
# recreated flowtable.
- name: _verify_lifecycle | Read wg0 flowtable unit invocation before reload
  systemd:
    name: wg0_flowtable.service
  register: _firewall_flowtable_invocation_before_reload
  become: true

# Drop-in ExecReload entries append to the stock one, so systemd's merged
# view is what proves the reload loads the ruleset exactly once. The systemd
# module keeps only the last of a repeated property.
- name: _verify_lifecycle | Reload runs the ruleset load once  # noqa: command-instead-of-module
  command: systemctl show nftables.service --property ExecReload
  register: _firewall_exec_reload
  changed_when: false
  failed_when: _firewall_exec_reload.stdout.split('argv[]=/usr/sbin/nft ') | length != 2
  become: true

- name: _verify_lifecycle | Re-apply nftables ruleset via systemctl reload (must not disturb netavark)
  systemd:
    name: nftables.service
    state: reloaded
  become: true

- name: _verify_lifecycle | Wait for reload to re-run wg0 flowtable attachment
  systemd:
    name: wg0_flowtable.service
  register: _firewall_flowtable_invocation_after_reload
  until:
    - _firewall_flowtable_invocation_after_reload.status.InvocationID | length > 0
    - _firewall_flowtable_invocation_after_reload.status.InvocationID != _firewall_flowtable_invocation_before_reload.status.InvocationID
  retries: 20
  delay: 1
  become: true

- name: _verify_lifecycle | Inspect flowtable devices after reload
  command: nft list flowtable inet homelab bulk
  register: _firewall_flowtable_after_reload
  changed_when: false
  failed_when:
    - default_interface not in _firewall_flowtable_after_reload.stdout
      or 'wg0' not in _firewall_flowtable_after_reload.stdout
  become: true

# Stock nftables.service ExecStop is `nft flush ruleset` — would nuke
# netavark tables on any systemctl stop. Confirm the drop-in
# scopes the stop to inet homelab only. Sentinel table simulates a
# co-tenant; if ExecStop still flushed everything, it'd disappear.
- name: _verify_lifecycle | ExecStop drop-in — install sentinel table
  command: nft add table ip firewall_verify_sentinel
  changed_when: false
  become: true

- name: _verify_lifecycle | ExecStop drop-in — stop nftables.service
  systemd: { name: nftables.service, state: stopped }
  become: true

- name: _verify_lifecycle | ExecStop drop-in — list tables after stop
  command: nft list tables
  register: _firewall_tables_after_stop
  changed_when: false
  become: true

- name: _verify_lifecycle | ExecStop drop-in — sentinel survived, homelab deleted
  assert:
    that:
      - "'table ip firewall_verify_sentinel' in _firewall_tables_after_stop.stdout"
      - "'table inet homelab' not in _firewall_tables_after_stop.stdout"
    fail_msg: >-
      ExecStop drop-in didn't scope correctly: sentinel table should
      survive a stop (it didn't) and inet homelab should be gone (it
      wasn't). Stock `nft flush ruleset` likely still in effect.

- name: _verify_lifecycle | ExecStop drop-in — restart nftables.service
  systemd: { name: nftables.service, state: started }
  become: true

- name: _verify_lifecycle | ExecStop drop-in — homelab table restored after start
  command: nft list tables
  register: _firewall_tables_after_start
  changed_when: false
  failed_when: "'table inet homelab' not in _firewall_tables_after_start.stdout"
  become: true
