# Named-bridge coverage: most real services live on named podman bridges, not
# podman0. Prove separate contracts from one long-lived peer on a throwaway
# bridge: external egress is allowed, host-published DNAT to a different
# bridge works, raw container-IP lateral movement remains blocked, and DNS
# over TCP passes the INPUT policy.
- name: _verify_forward | Create named podman probe network
  containers.podman.podman_network:
    name: firewall_verify_named
    disable_dns: false
    state: present
  become: true

- name: _verify_forward | Start a peer on the named probe network
  command: >
    podman run -d --replace --name firewall_verify_named_peer
    --network firewall_verify_named docker.io/library/busybox sleep 300
  changed_when: true
  become: true

- name: _verify_forward | Named bridge egress through netavark MASQUERADE works
  command: podman exec firewall_verify_named_peer nc -z -w 10 1.1.1.1 80
  changed_when: false
  become: true

- name: _verify_forward | Read named-network gateway IP
  command: >
    podman network inspect firewall_verify_named
    --format
    {% raw %}'{{ (index .Subnets 0).Gateway }}'{% endraw %}
  register: _firewall_named_gateway_ip
  changed_when: false
  become: true

- name: _verify_forward | Cross-bridge DNAT reaches the published container
  command: >
    podman exec firewall_verify_named_peer
    wget -q -O - -T 5 http://{{ _firewall_named_gateway_ip.stdout | trim }}:{{ _firewall_container_port }}/
  register: _firewall_cross_bridge_dnat
  changed_when: false
  failed_when: _firewall_cross_bridge_dnat.rc != 0 or 'firewall-verify-ok' not in _firewall_cross_bridge_dnat.stdout
  become: true

- name: _verify_forward | Direct cross-network container-IP path is isolated
  include_tasks: _verify_probe.yml
  vars:
    firewall_probe:
      name: Direct cross-network container IP
      runner: host
      argv: [ podman, exec, firewall_verify_named_peer, wget, -q, -O, "-", -T, "3", "http://{{ _firewall_container_ip }}:{{ _firewall_container_port }}/" ]
      expect: fail
      hit: [ forward_podman_isolation ]

# The INPUT probes reach tcp/5333 directly; this one follows the real
# path, container -> gateway:53 -> netavark DNAT -> aardvark's tcp/5333.
# Aardvark-dns serves TCP from 1.12 (Noble ships 1.4). busybox nslookup
# cannot force TCP, so the host dig runs inside the peer's netns.
- name: _verify_forward | Named-bridge DNS over TCP passes the INPUT policy
  when: ansible_distribution_release != 'noble'
  block:
    - name: _verify_forward | Install dig for the TCP DNS probe
      apt:
        name: bind9-dnsutils
        cache_valid_time: 3600
      become: true

    - name: _verify_forward | Inspect the named peer
      command: podman inspect firewall_verify_named_peer
      register: _firewall_named_peer
      changed_when: false
      become: true

    - name: _verify_forward | A TCP dig from the peer netns resolves the peer
      vars:
        _container: "{{ _firewall_named_peer.stdout | from_json | first }}"
      command: >-
        nsenter --target {{ _container.State.Pid }} --net
        dig +tcp +short +tries=1 +time=2 @{{ _firewall_named_gateway_ip.stdout | trim }}
        firewall_verify_named_peer.dns.podman A
      register: _firewall_tcp_dns_probe
      until: >-
        _firewall_tcp_dns_probe.stdout | trim
        == _container.NetworkSettings.Networks.firewall_verify_named.IPAddress
      retries: 5
      delay: 2
      changed_when: false
      become: true
