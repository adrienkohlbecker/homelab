# WAN-scoped rules must bind to the configured physical interface.
# Reject bridge/tunnel-shaped values before rendering the ruleset.
- name: Assert default_interface is plausible (not a bridge/tunnel)
  assert:
    that:
      - default_interface is defined
      - default_interface is not match("^(wg|podman|virbr|docker|br-|veth)")
    fail_msg: >-
      default_interface resolved to
      '{{ default_interface }}', which looks like a
      bridge/tunnel — the firewall's iifname-scoped rules would
      attach to the wrong iface. Override `default_interface` in
      host_vars (group_vars/all/main.yml defaults it to
      ansible_default_ipv4.interface) when gather-facts is picking
      the wrong default-route owner.
  tags:
    - firewall

# policy_rc_d: 101 keeps the postinst from starting nftables.service
# with the stock ruleset before the drop-in and template land.
- name: Install nftables
  apt:
    pkg:
      - nftables
    cache_valid_time: 3600
    policy_rc_d: 101
  register: firewall_apt_nftables
  become: true
  tags:
    - firewall

# Stock nftables.service stops with `nft flush ruleset`, which would
# tear down netavark's tables too. Scope the stop to our own table.
- name: Install nftables.service ExecStop drop-in
  import_role:
    name: systemd_unit
    tasks_from: install
  vars:
    systemd_unit_args:
      src: override_nftables.conf
      for: nftables.service
  tags:
    - firewall

# Register flowtable support at boot, before nftables.service parses the
# ruleset's `bulk` flowtable.
- name: Load flowtable modules at boot  # noqa: require-validate
  copy:
    src: modules-load.conf
    dest: /etc/modules-load.d/30-firewall-hardening.conf
    owner: root
    group: root
    mode: "0644"
    backup: true
  become: true
  tags:
    - firewall

# Network-stack hardening sysctls, written and applied live. The 90-
# prefix is load-bearing: systemd-sysctl applies files in basename
# order, so this file must sort after 50-default.conf.
- name: Install network-stack hardening sysctls
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/90-firewall-hardening.conf
  loop:
    # Disable IPv6 at the kernel so no parallel v6 policy is needed.
    - { name: net.ipv6.conf.all.disable_ipv6, value: "{{ '1' if firewall_disable_ipv6 else '0' }}" }
    - { name: net.ipv6.conf.default.disable_ipv6, value: "{{ '1' if firewall_disable_ipv6 else '0' }}" }
    # Ignore inbound ICMP redirects (no attacker-controlled reroute).
    - { name: net.ipv4.conf.all.accept_redirects, value: '0' }
    - { name: net.ipv4.conf.default.accept_redirects, value: '0' }
    # Don't emit ICMP redirects either.
    - { name: net.ipv4.conf.all.send_redirects, value: '0' }
    - { name: net.ipv4.conf.default.send_redirects, value: '0' }
    # Log packets with bogus source IPs (e.g. RFC1918 on WAN). Real
    # interfaces inherit this from `default` at creation (verified: a host
    # with default=1 carries log_martians=1 on every real iface, one with
    # default=0 carries 0), so `default=1` is what actually arms the logging.
    #
    # `all` is NOT set to 1: the kernel OR-folds it into every interface's
    # effective value (IN_DEV_LOG_MARTIANS reads `all || <iface>`). Keepalived
    # hosts run a vrrp.<VRID> macvlan that ingresses LAN broadcast + VRRP-peer
    # traffic whose sources don't route back through it, so each such packet
    # is a "martian" -- tens of thousands of log lines/day. keepalived's
    # 99-vrrp-martians.rules zeroes that iface's own flag to silence them, but
    # an `all=1` here would OR straight over that 0 and defeat it. Pinning
    # `all=0` makes the per-iface suppression effective; real interfaces still
    # log via their own default-inherited flag, only the vrrp vmac goes quiet.
    - { name: net.ipv4.conf.all.log_martians, value: '0' }
    - { name: net.ipv4.conf.default.log_martians, value: '1' }
    # Drop RSTs in TIME-WAIT (RFC 1337) — closes a narrow TCP-hijack
    # window.
    - { name: net.ipv4.tcp_rfc1337, value: '1' }
    # Strict ARP for a multi-homed host. arp_ignore=1: reply only if
    # the target IP is on the receiving interface. arp_announce=2:
    # source ARPs with the local address best-matched for the dest
    # instead of leaking another iface's IP. Same as keepalived's
    # canonical VRRP recommendation. The `all` pins also carry the
    # macvlan role's ARP-flux contract: the kernel applies the stricter
    # of `all` and the interface, so every macvlan parent and child is
    # covered without per-interface keys.
    - { name: net.ipv4.conf.all.arp_ignore, value: '1' }
    - { name: net.ipv4.conf.default.arp_ignore, value: '1' }
    - { name: net.ipv4.conf.all.arp_announce, value: '2' }
    - { name: net.ipv4.conf.default.arp_announce, value: '2' }
  loop_control:
    label: "{{ item.name }}"
  become: true
  tags:
    - firewall

# `nft -c` cannot detect a valid ruleset that drops the operator's SSH
# path. Before replacing an active ruleset, arm a 60-second timer that
# restores the last confirmed snapshot; cancel it only after Ansible
# remains connected. First install has no rollback target.
#
# check_mode: false forces a real probe even in --check; otherwise
# command{} reports "would have run" with rc=0 in the register and
# the gates below trust a fabricated state.
- name: Check if nftables.service is currently active (gates auto-revert)  # noqa: command-instead-of-module
  command: systemctl is-active nftables.service
  register: firewall_nftables_pre_active
  changed_when: false
  failed_when: false
  check_mode: false
  become: true
  tags:
    - firewall

- name: Stat prior pre-reload snapshot (gates auto-revert scheduling)
  stat:
    path: /etc/nftables.conf.pre-reload
  register: firewall_pre_reload_snapshot
  become: true
  tags:
    - firewall

# Validate the assembled ruleset before it touches the kernel. Skip
# the same-run install check-mode branch because nft is not on disk.
- name: Configure nftables ruleset
  when: not (ansible_check_mode and firewall_apt_nftables.changed)
  template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: "0644"
    backup: true
    validate: "nft -c -f %s"
  register: firewall_ruleset
  become: true
  tags:
    - firewall

# Clear any interrupted transient unit before reusing its name.
- name: Schedule auto-revert timer (60s — cancelled on successful reload)
  when:
    - firewall_nftables_pre_active.rc == 0
    - firewall_ruleset.changed
    - firewall_pre_reload_snapshot.stat.exists
  shell: |
    set -euo pipefail
    systemctl stop firewall_emergency_revert.timer 2>/dev/null || true
    systemctl reset-failed firewall_emergency_revert.timer firewall_emergency_revert.service 2>/dev/null || true
    systemd-run --unit firewall_emergency_revert --on-active=60 /usr/sbin/nft -f /etc/nftables.conf.pre-reload
  args: { executable: /bin/bash }
  changed_when: true
  become: true
  tags:
    - firewall

# The ExecReload drop-in makes `reloaded` an atomic `nft -f` with no
# firewall-less window; an inactive unit is started instead.
- name: Apply nftables.service ruleset and lifecycle
  when: not (ansible_check_mode and firewall_apt_nftables.changed)
  systemd:
    name: nftables.service
    enabled: true
    state: >-
      {{ 'reloaded'
         if firewall_ruleset.changed or nftables_service_d_override_conf_result.changed
         else 'started' }}
  become: true
  tags:
    - firewall

# Cancel the auto-revert. The reload completed and ansible can still
# reach the host. If we never get here (reload broke SSH, role
# errored, network blip), the systemd-run timer fires in 60s and
# restores /etc/nftables.conf.pre-reload via `nft -f`.
- name: Cancel auto-revert timer (post-reload alive)
  when:
    - firewall_nftables_pre_active.rc == 0
    - firewall_ruleset.changed
    - firewall_pre_reload_snapshot.stat.exists
  shell: |
    set -euo pipefail
    systemctl stop firewall_emergency_revert.timer 2>/dev/null || true
    systemctl reset-failed firewall_emergency_revert.timer firewall_emergency_revert.service 2>/dev/null || true
  args: { executable: /bin/bash }
  changed_when: true
  become: true
  tags:
    - firewall

# Promote the confirmed live ruleset as the next apply's rollback
# target. Compare checksums explicitly because remote_src copy reports
# byte-identical files changed under Mitogen.
- name: Stat live + pre-reload for post-reload snapshot
  stat:
    path: "{{ item }}"
    checksum_algorithm: sha256
  loop:
    - /etc/nftables.conf
    - /etc/nftables.conf.pre-reload
  register: firewall_post_reload_stats
  become: true
  tags:
    - firewall

# Source-exists gate covers the same-run-as-install check-mode branch
# (apt reported changed but didn't install, so /etc/nftables.conf
# isn't on disk yet to snapshot).
- name: Snapshot post-reload ruleset for next run's auto-revert  # noqa: require-backup
  when:
    - firewall_post_reload_stats.results[0].stat.exists
    - >-
      not firewall_post_reload_stats.results[1].stat.exists
      or firewall_post_reload_stats.results[0].stat.checksum
         != firewall_post_reload_stats.results[1].stat.checksum
  copy:
    src: /etc/nftables.conf
    dest: /etc/nftables.conf.pre-reload
    remote_src: true
    mode: "0644"
    validate: nft -c -f %s
  become: true
  tags:
    - firewall

# Attach wg0 to the `bulk` flowtable once it exists; see the unit header.
- name: Manage wg0_flowtable.service
  import_role:
    name: systemd_unit
    tasks_from: unit
  vars:
    systemd_unit_args:
      src: wg0_flowtable.service
  tags:
    - firewall
