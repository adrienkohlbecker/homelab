# Probe rig: the shared veth topology, probe-only packages, a published
# busybox httpd container and host TCP listeners. Podman itself comes from
# _setup.yml.
- name: _verify_rig | Build the probe topology
  import_tasks: _rig_topology.yml

- name: _verify_rig | Install probe-only deps
  apt:
    name:
      - iproute2
      - curl
      - iputils-ping
      - hping3       # crafted TCP-ACK probes for `! --syn` rules
      - netcat-openbsd
    cache_valid_time: 3600
  become: true

- name: _verify_rig | Pick the httpd container port
  set_fact:
    _firewall_container_port: 18080

# The port is arbitrary; the FORWARD rule scopes by --ctstate DNAT, not by
# dport. The second publish stands in for Authelia, whose host port carries
# its own FORWARD scope; the third for AdGuard on the DNS VIP. --cap-add=NET_RAW
# restores the capability podman 5.x dropped from default_capabilities for the
# container ping probe.
- name: _verify_rig | Run busybox httpd test container with --publish
  command: >
    podman run -d --replace --name firewall_verify_httpd
      --publish 0.0.0.0:{{ _firewall_container_port }}:{{ _firewall_container_port }}
      --publish 0.0.0.0:{{ service_ports.authelia }}:{{ _firewall_container_port }}
      --publish {{ _firewall_addr.vip }}:53:{{ _firewall_container_port }}
      --cap-add=NET_RAW
      docker.io/library/busybox
      sh -c 'mkdir -p /www && echo firewall-verify-ok > /www/index.html && exec httpd -f -p {{ _firewall_container_port }} -h /www'
  changed_when: true
  become: true

- name: _verify_rig | Read the httpd container address
  command: >
    podman inspect firewall_verify_httpd
    --format
    {% raw %}'{{ .NetworkSettings.Networks.podman.IPAddress }}'{% endraw %}
  register: _firewall_container_inspect
  changed_when: false
  become: true

- name: _verify_rig | Name the httpd container address
  set_fact:
    _firewall_container_ip: "{{ _firewall_container_inspect.stdout | trim }}"

# Stand-in for a subnet-router destination: the tailscale source reaches the
# container directly, without DNAT.
- name: _verify_rig | Route the container address through tailscale0
  command: >-
    ip -n extns route replace {{ _firewall_container_ip }}/32
    via {{ _firewall_addr.tailscale_host }} dev ts_ext
  changed_when: true
  become: true

- name: _verify_rig | Run host TCP fixture listeners
  command:
    argv:
      - podman
      - run
      - -d
      - --replace
      - --name
      - firewall_verify_tcp_listener
      - --network=host
      - --pull=missing
      - docker.io/library/busybox
      - sh
      - -c
      # aardvark-dns 1.12+ holds tcp/5333 on every DNS-enabled bridge gateway,
      # so a wildcard listener would steal the port from the named-bridge
      # probes. Bind the rig address instead.
      - |
        set -eu
        mkdir -p /www
        echo firewall-verify-ok > /www/index.html
        for port in 80 443 445 {{ service_ports.nut }} {{ _firewall_addr.host }}:5333; do
            httpd -f -p "$port" -h /www &
        done
        wait
  changed_when: true
  become: true

- name: _verify_rig | Wait for the published and host listeners
  wait_for:
    host: "{{ item.host | default(_firewall_addr.host) }}"
    port: "{{ item.port }}"
    timeout: 30
  loop:
    - { host: 127.0.0.1, port: "{{ _firewall_container_port }}" }
    - { port: 80 }
    - { port: 443 }
    - { port: 445 }
    - { port: "{{ service_ports.nut }}" }
    - { port: 5333 }
  become: true
