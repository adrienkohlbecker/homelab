# Fixture bringup: probe-only apt deps, busybox httpd test container,
# extns netns + probe veths. Podman itself is installed by
# _setup.yml (CLAUDE.md reserves _setup.yml for genuine fixture deps).

- name: _verify_rig | Install probe-only deps
  apt:
    name:
      - python3
      - iproute2
      - curl
      - iputils-ping
      - hping3       # crafted TCP-ACK probes for `! --syn` rules
    cache_valid_time: 3600
  become: true

- name: _verify_rig | Run host TCP fixture listeners
  command:
    argv:
      - podman
      - run
      - -d
      - --replace
      - --name
      - firewall_verify_tcp_listener
      - --network=host
      - --pull=missing
      - docker.io/library/busybox
      - sh
      - -c
      - |
        set -eu
        mkdir -p /www
        echo firewall-verify-ok > /www/index.html
        for port in 80 443 445 {{ service_ports.nut }} {{ service_ports.authelia }} {{ service_ports.transmission_bt }}; do
            httpd -f -p "$port" -h /www &
        done
        wait
  changed_when: true
  become: true

# The port is arbitrary; the FORWARD rule scopes by --ctstate DNAT, not by
# dport. Run busybox httpd on the dedicated fixture port to serve a tiny
# known-content page the probe can grep for.
# --cap-add=NET_RAW restores the capability podman 5.x dropped from
# default_capabilities — the container-egress probe below uses busybox
# ping (SOCK_RAW), which fails with "permission denied" without it.
- name: _verify_rig | Run busybox httpd test container with --publish
  command: >
    podman run -d --replace --name firewall_verify_httpd
      --publish 0.0.0.0:{{ _firewall_probe_container_port }}:{{ _firewall_probe_container_port }}
      --cap-add=NET_RAW
      docker.io/library/busybox
      sh -c 'mkdir -p /www && echo firewall-verify-ok > /www/index.html && exec httpd -f -p {{ _firewall_probe_container_port }} -h /www'
  changed_when: true
  become: true

# Configure the probe interfaces created by _setup.yml. Representative
# source aliases and their host return routes live together here; probe
# tasks select the source explicitly with curl/nc.
- name: _verify_rig | Configure probe netns
  shell: |
    set -euo pipefail
    if ! ip link show tailscale0 >/dev/null 2>&1; then
      ip link add tailscale0 type veth peer name ts_ext
      ip link set ts_ext netns extns
    fi
    if ! ip link show mac_mgmt >/dev/null 2>&1; then
      ip link add mac_mgmt type veth peer name mgmt_ext
      ip link set mgmt_ext netns extns
    fi
    if ! ip link show vrrp.{{ dns_keepalived_vrid }} >/dev/null 2>&1; then
      ip link add vrrp.{{ dns_keepalived_vrid }} type veth peer name vrrp_ext
      ip link set vrrp_ext netns extns
    fi
    if ! ip link show untrusted0 >/dev/null 2>&1; then
      ip link add untrusted0 type veth peer name untrusted_ext
      ip link set untrusted_ext netns extns
    fi
    ip addr replace 192.0.2.1/24 dev wg0
    ip link set wg0 up
    ip -n extns addr replace {{ _firewall_probe_nonscope }}/24 dev veth_ext
    ip -n extns addr replace {{ _firewall_probe_home }}/32 dev veth_ext
    ip -n extns addr replace {{ _firewall_probe_wg }}/32 dev veth_ext
    ip -n extns addr replace {{ _firewall_probe_podman }}/32 dev veth_ext
    ip -n extns addr replace {{ _firewall_probe_podman_pool }}/32 dev veth_ext
    ip -n extns link set veth_ext up
    ip addr replace 100.64.99.1/24 dev tailscale0
    ip link set tailscale0 up
    ip -n extns addr replace {{ _firewall_probe_tailscale }}/24 dev ts_ext
    ip -n extns link set ts_ext up
    ip addr replace {{ _firewall_probe_home_mac_host }}/24 dev mac_mgmt
    ip link set mac_mgmt up
    ip -n extns addr replace {{ _firewall_probe_home_mac }}/24 dev mgmt_ext
    ip -n extns link set mgmt_ext up
    ip addr replace {{ _firewall_probe_vrrp_host }}/24 dev vrrp.{{ dns_keepalived_vrid }}
    ip addr replace {{ network.virtual_ips.dns }}/32 dev vrrp.{{ dns_keepalived_vrid }}
    ip link set vrrp.{{ dns_keepalived_vrid }} up
    ip -n extns addr replace {{ _firewall_probe_vrrp_peer }}/24 dev vrrp_ext
    ip -n extns link set vrrp_ext up
    ip addr replace {{ _firewall_probe_untrusted_host }}/24 dev untrusted0
    ip link set untrusted0 up
    ip -n extns addr replace {{ _firewall_probe_untrusted_peer }}/24 dev untrusted_ext
    ip -n extns link set untrusted_ext up
    ip -n extns link set lo up
    ip -n extns route replace default via 192.0.2.1
    ip -n extns route replace {{ network.virtual_ips.dns }}/32 via {{ _firewall_probe_vrrp_host }} dev vrrp_ext
    ip route replace {{ _firewall_probe_home }}/32 dev wg0
    ip route replace {{ _firewall_probe_wg }}/32 dev wg0
    ip route replace {{ _firewall_probe_podman }}/32 dev wg0
    ip route replace {{ _firewall_probe_podman_pool }}/32 dev wg0
  args:
    executable: /bin/bash
  changed_when: true
  become: true

- name: _verify_rig | Wait for httpd container
  wait_for: { host: 127.0.0.1, port: "{{ _firewall_probe_container_port }}", timeout: 30 }
  become: true

- name: _verify_rig | Wait for TCP fixture listener
  wait_for:
    host: 127.0.0.1
    port: "{{ item }}"
    timeout: 30
  loop:
    - 80
    - 443
    - 445
    - "{{ service_ports.nut }}"
    - "{{ service_ports.authelia }}"
    - "{{ service_ports.transmission_bt }}"
  become: true
