# Drop-rule probes: crafted non-syn (input + forward), forward
# catch-all, ICMP overflow, silenced-noise UDP, catch-all UDP, and
# the VRRP iif-scope negative. Each one fires a counter that the
# assertion block in _verify_counters.yml checks.

# Re-enable conntrack loose mode for the duration of the non-SYN
# probes. nf_conntrack_tcp_loose=0 (which the role pins via sysctl)
# makes the kernel classify mid-stream non-SYN as INVALID *before*
# nftables sees it -- which means the packets hit `ct state invalid
# drop` and never reach the input_nonsyn / forward_nonsyn counter
# rules. The nftables rules are intentionally a backstop for the
# tcp_loose=1 path (and for hosts where the sysctl hasn't applied
# yet -- first-apply before reboot); flipping loose=1 here exercises
# exactly that backstop. Test fixture only — no restore needed since
# the box is torn down after _verify.
- name: _verify_drops | Re-enable tcp_loose so non-SYN probes reach the nftables rules
  command: sysctl -w net.netfilter.nf_conntrack_tcp_loose=1
  changed_when: false
  become: true

# Crafted-packet probes for non-SYN DROP rules on input and forward.
# hping3 always exits 0 on send (it doesn't fail just because no reply
# arrived), so we use nft per-rule counters as the actual assertion:
# send the crafted packet, then confirm the specific rule's counter
# incremented. Counters were reset earlier (before the UDP probe sweep),
# so this section adds to the same counter state.
- name: _verify_drops | Input — TCP-ACK (no SYN) from extns to :80 hits the non-SYN drop
  command: ip netns exec extns hping3 -A -p 80 -c 1 --quiet 192.0.2.1
  changed_when: false
  failed_when: false
  become: true

- name: _verify_drops | Forward — TCP-ACK (no SYN) from extns to a container hits the non-SYN drop
  command: ip netns exec extns hping3 -A -p {{ _firewall_probe_container_port }} -c 1 --quiet {{ _firewall_probe_container_dest }}
  changed_when: false
  failed_when: false
  become: true

# forward catch-all drop — direct curl from extns to a container's
# bridge IP (no DNAT involved, so the wg0→podman0 ct-status-dnat
# allow doesn't match either). With established, invalid, non-SYN,
# and the scoped allows all not matching, the packet falls through
# to the trailing counter-drop.
- name: _verify_drops | Forward — direct-to-container TCP-SYN with no DNAT hits the catch-all drop
  command: ip netns exec extns curl --connect-timeout 2 --max-time 3 -sf http://{{ _firewall_probe_container_dest }}:80/
  register: _firewall_probe_forward_drop
  changed_when: false
  failed_when: _firewall_probe_forward_drop.rc == 0
  become: true

# The positive host and container egress probes run before this file, so the
# external destination is known to be reachable. A WireGuard-scoped source must
# still fall through the FORWARD chain now that wg0-to-WAN transit is absent.
- name: _verify_drops | Forward — WireGuard source cannot transit to WAN
  command: >
    ip netns exec extns curl --interface {{ _firewall_probe_wg }}
    --connect-timeout 2 --max-time 3 -sI http://1.1.1.1/
  register: _firewall_probe_wg_transit_drop
  changed_when: false
  failed_when: _firewall_probe_wg_transit_drop.rc == 0
  become: true

# ICMP echo flood with varying IDs — must vary ICMP-id per packet to
# exercise the rate-limit rule, because conntrack tracks ICMP echo by
# (src, dst, type, id): a same-id flood collapses to one flow that
# short-circuits via `ct state established,related accept` after the
# first packet. Python's raw-ICMP socket sends 50 packets with IDs
# 1000-1049 back-to-back from extns; each is a NEW conntrack flow
# reaching the icmp rule. Burst 20 + ~10/sec refill over <1s → ~30
# overflow drops.
- name: _verify_drops | Input — ICMP echo flood (varying IDs) overflows the rate-limit
  command:
    argv:
      - ip
      - netns
      - exec
      - extns
      - python3
      - "-"
    stdin: |
      import socket, struct
      sock = socket.socket(socket.AF_INET, socket.SOCK_RAW, socket.IPPROTO_ICMP)
      for i in range(50):
          icmp_id = 1000 + i
          # echo-request: type=8 code=0 chksum=0 (placeholder)
          hdr = struct.pack("!BBHHH", 8, 0, 0, icmp_id, 0)
          chksum = 0
          for j in range(0, len(hdr), 2):
              chksum += (hdr[j] << 8) | hdr[j + 1]
          while chksum >> 16:
              chksum = (chksum & 0xFFFF) + (chksum >> 16)
          chksum = ~chksum & 0xFFFF
          pkt = struct.pack("!BBHHH", 8, 0, chksum, icmp_id, 0)
          sock.sendto(pkt, ("192.0.2.1", 0))
  changed_when: false
  failed_when: false
  become: true

# Silenced-noise (dport 1900/SSDP) — sending UDP to any port in the
# silenced set should land on that rule, not the catch-all.
- name: _verify_drops | Input — UDP to silenced-noise port hits the silenced-noise drop  # noqa: risky-shell-pipe
  shell: echo ping | ip netns exec extns nc -u -w 1 192.0.2.1 1900
  args: { executable: /bin/bash }
  changed_when: false
  failed_when: false
  become: true

# NetBIOS silenced-noise — UDP to dport 137 must land on the NetBIOS
# silence rule, not the catch-all.
- name: _verify_drops | Input — UDP to NetBIOS port 137 hits the NetBIOS silenced-noise drop  # noqa: risky-shell-pipe
  shell: echo ping | ip netns exec extns nc -u -w 1 192.0.2.1 137
  args: { executable: /bin/bash }
  changed_when: false
  failed_when: false
  become: true

# DNS VIP fallthrough during an AdGuard restart terminates on the vmac because
# netavark's DNAT is temporarily absent. Exercise TCP and UDP separately: TCP
# must preserve the fast-fail reset, while UDP is silently dropped.
- name: _verify_drops | Input — TCP to the DNS VIP through the vmac hits the VIP reset rule
  command: >
    ip netns exec extns hping3 -S -p 853 -c 1 --quiet
    --interface vrrp_ext {{ network.virtual_ips.dns }}
  changed_when: false
  failed_when: false
  become: true

- name: _verify_drops | Input — UDP to the DNS VIP through the vmac hits the VIP drop rule
  command:
    argv:
      - ip
      - netns
      - exec
      - extns
      - nc
      - -u
      - -w
      - "1"
      - -s
      - "{{ _firewall_probe_vrrp_peer }}"
      - "{{ network.virtual_ips.dns }}"
      - "9999"
    stdin: ping
  changed_when: false
  failed_when: false
  become: true

# Reproduce the stale-DNAT handoff shape: original destination is the DNS VIP,
# but PREROUTING rewrites it to a peer reachable through wg0. The packet enters
# on the vmac and reaches FORWARD without matching the earlier podman DNAT allow.
- name: _verify_drops | Install stale DNS VIP DNAT fixture
  command:
    argv:
      - nft
      - -f
      - "-"
    stdin: |
      add chain inet homelab firewall_verify_vip_dnat {
          type nat hook prerouting priority -101; policy accept;
      }
      add rule inet homelab firewall_verify_vip_dnat \
          iifname "vrrp.{{ dns_keepalived_vrid }}" \
          ip daddr {{ network.virtual_ips.dns }} udp dport 12345 \
          dnat ip to {{ _firewall_probe_nonscope }}
  changed_when: true
  become: true

- name: _verify_drops | Forward — stale DNS VIP DNAT through the vmac hits the VIP drop rule
  command:
    argv:
      - ip
      - netns
      - exec
      - extns
      - nc
      - -u
      - -w
      - "1"
      - -s
      - "{{ _firewall_probe_vrrp_peer }}"
      - "{{ network.virtual_ips.dns }}"
      - "12345"
    stdin: ping
  changed_when: false
  failed_when: false
  become: true

# Tailscale disco silenced-noise — UDP from a representative untrusted zone
# must land on the Tailscale silence rule rather than the catch-all.
- name: _verify_drops | Input — UDP to tailscale port from untrusted zone hits the tailscale silenced-noise drop
  when: tailscale_wan_direct | default(false)
  command:
    argv:
      - ip
      - netns
      - exec
      - extns
      - nc
      - -u
      - -w
      - "1"
      - -s
      - "{{ _firewall_probe_untrusted_peer }}"
      - "{{ _firewall_probe_untrusted_host }}"
      - "{{ tailscale_port }}"
    stdin: ping
  changed_when: false
  failed_when: false
  become: true

# Catch-all (UDP to a port with no rule, no listener, no scope match)
# — falls through to the trailing counter-drop.
- name: _verify_drops | Input — UDP to unscoped 18181 hits the catch-all drop  # noqa: risky-shell-pipe
  shell: echo ping | ip netns exec extns nc -u -w 1 -s {{ _firewall_probe_nonscope }} 192.0.2.1 18181
  args: { executable: /bin/bash }
  changed_when: false
  failed_when: false
  become: true

# VRRP iif-scope negative probe. The rule is `iifname $WAN_IFACE ip
# saddr $HOME_LAN ip protocol vrrp accept` — wg0 ingress (which is how
# every extns packet arrives) must not match. Positive probe isn't
# possible in this rig because slirp doesn't pass arbitrary L4
# protocols on WAN, and adding a second veth named like $WAN_IFACE
# would conflict with the netns topology. Confirm the rule's counter
# stays at 0 after a proto-112 packet from extns — a regression that
# drops the iif scope (`ip saddr ... ip protocol vrrp accept`) would
# accept this packet and increment the counter.
- name: _verify_drops | Input — VRRP (proto 112) on wg0 ingress doesn't match the WAN-iif rule
  command: ip netns exec extns hping3 --rawip -H 112 -c 1 -d 0 --quiet 192.0.2.1
  changed_when: false
  failed_when: false
  become: true
