# Scope ExecStop to the homelab table so co-tenant tables survive.
# Ignore an absent table when a failed start is subsequently stopped.
# ExecReload atomically replaces the homelab table without a
# firewall-less stop/start window.
#
# Re-run wg0_flowtable.service because recreating the table drops its
# dynamic wg0 attachment. Failure must not block the base reload.
#
# `--no-block` avoids a dependency cycle: the attachment starts after
# nftables, whose reload cannot finish while ExecReload is waiting.
[Unit]
# Flowtable expressions require their pinned modules to be registered.
After=systemd-modules-load.service

[Service]
ExecStop=
ExecStop=-/usr/sbin/nft delete table inet homelab
ExecReload=/usr/sbin/nft -f /etc/nftables.conf
ExecReload=-/bin/systemctl --no-block try-restart wg0_flowtable.service
