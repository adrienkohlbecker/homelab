# Inputs: caller passes a single dict `systemd_unit_args` with keys
#   src               exact unit filename (e.g. "mosquitto.service")
#   user              default 'root'; non-root drives the named user's
#                     user manager (linger must already be on)
#   condition         default true; gates the whole call
#   start             default true; false → enable only, don't touch state
#   restart           default false; refresh an already-active unit
#   reload            default false; hitless alternative when restart is false
#   throttle          default 0; limits only restart/reload across hosts
#
# Replacing this dict on every import prevents argument leakage. Non-root users
# select a lingered user manager. Image pulls remain the caller's responsibility.
- name: service | Validate service args
  assert:
    quiet: true
    that:
      - systemd_unit_args is defined
      - systemd_unit_args is mapping
      - systemd_unit_args.src is defined
      - systemd_unit_args.src is string
      - systemd_unit_args.src is match('^.+\.(service|socket|target|timer|mount|automount|path|slice|scope|device|swap)$')
    fail_msg: >-
      systemd_unit_args needs src (exact unit filename);
      got {{ systemd_unit_args | default('<unset>') }}

# set_fact keys resolve concurrently, so defaults and derivatives need separate
# tasks.
- name: service | Resolve caller defaults for {{ systemd_unit_args.src }}
  set_fact:
    _systemd_unit_user: "{{ systemd_unit_args.user | default('root') }}"
    _systemd_unit_condition: "{{ systemd_unit_args.condition | default(true) }}"
    _systemd_unit_start: "{{ systemd_unit_args.start | default(true) }}"
    _systemd_unit_name: "{{ systemd_unit_args.src }}"

- name: service | Derive scope for {{ systemd_unit_args.src }}
  set_fact:
    _systemd_unit_scope: "{{ 'system' if _systemd_unit_user == 'root' else 'user' }}"
    _systemd_unit_file_result: >-
      {{ lookup('vars', (systemd_unit_args.src | ansible_var_key) ~ '_result', default={})
         | default({}) }}

# Linger keeps a user manager alive after logout. See install.yml for check-mode
# and task-name constraints.
- name: service | Verify user-scope linger marker exists for {{ systemd_unit_args.user | default('root') }}
  when:
    - _systemd_unit_condition
    - _systemd_unit_scope == 'user'
  stat:
    path: "/var/lib/systemd/linger/{{ _systemd_unit_user }}"
  register: _systemd_unit_linger
  failed_when: not _systemd_unit_linger.stat.exists and not ansible_check_mode

- name: service | Enable the service
  when: _systemd_unit_condition and not (ansible_check_mode and _systemd_unit_file_result.changed | default(false))
  systemd:
    name: "{{ _systemd_unit_name }}"
    enabled: true
    scope: "{{ _systemd_unit_scope }}"
  register: _systemd_unit_enable
  become: true
  become_user: "{{ _systemd_unit_user }}"

# Raw `systemctl --user` needs XDG_RUNTIME_DIR to reach the named user manager,
# unlike the Ansible systemd module.
- name: service | Resolve uid for the user-scope reenable bus environment
  when:
    - _systemd_unit_condition
    - not ansible_check_mode
    - _systemd_unit_scope == 'user'
    - _systemd_unit_file_result.changed | default(false)
  getent:
    database: passwd
    key: "{{ _systemd_unit_user }}"
  become: true

# `enable` adds current [Install] symlinks but does not prune obsolete ones.
# Reenable changed, enabled units to rebuild that set; skip static units and
# steady-state converges. The file write already owns the changed result.
- name: service | Reenable to prune stale [Install] symlinks on a unit-file change
  when:
    - _systemd_unit_condition
    - not ansible_check_mode
    - _systemd_unit_enable is not skipped
    - _systemd_unit_enable.status.UnitFileState | default('') == 'enabled'
    - _systemd_unit_file_result.changed | default(false)
  command:
    argv: >-
      {{ ['systemctl'] +
         (['--user'] if _systemd_unit_scope == 'user' else []) +
         ['reenable', _systemd_unit_name] }}
  changed_when: false
  environment:
    XDG_RUNTIME_DIR: "{{ ('/run/user/' ~ getent_passwd[_systemd_unit_user][1]) if _systemd_unit_scope == 'user' else omit }}"
  become: true
  become_user: "{{ _systemd_unit_user }}"

# A unit can be masked after installation. Reuse enable's LoadState to preserve
# that operator intent without another probe.
- name: service | Refuse to start a masked unit
  when:
    - _systemd_unit_condition
    - _systemd_unit_start
    - _systemd_unit_enable is not skipped
    - _systemd_unit_enable.status.LoadState | default('') == 'masked'
  fail:
    msg: >-
      Refusing to start {{ _systemd_unit_name }}: it is masked.
      Unmask with `systemctl{{ ' --user' if _systemd_unit_scope == 'user' else '' }} unmask {{ _systemd_unit_name }}`
      before re-running, or --limit the play to skip this role.

# Clear rate limits only before an imminent start or restart. Reuse enable's
# ActiveState to avoid a separate probe; tolerate an as-yet-absent unit.
- name: service | Reset failed state to clear any rate-limit
  when:
    - _systemd_unit_condition
    - _systemd_unit_start
    - not ansible_check_mode
    - (systemd_unit_args.restart | default(false)) or ((_systemd_unit_enable.status.ActiveState | default('inactive')) != 'active')
  command:
    argv: >-
      {{ ['systemctl'] +
         (['--user'] if _systemd_unit_scope == 'user' else []) +
         ['reset-failed', _systemd_unit_name] }}
  changed_when: false
  failed_when: false
  become: true
  become_user: "{{ _systemd_unit_user }}"

# The systemd module reports changed after issuing start even when Condition or
# Assert skips ExecStart. Reflect the unchanged runtime state for idempotence.
- name: service | Start the service
  when:
    - _systemd_unit_condition
    - _systemd_unit_start
    - _systemd_unit_enable is not skipped
  systemd:
    name: "{{ _systemd_unit_name }}"
    state: started
    scope: "{{ _systemd_unit_scope }}"
  register: systemd_unit_started
  changed_when:
    - systemd_unit_started.changed
    - systemd_unit_started.status.ConditionResult | default('yes') != 'no'
    - systemd_unit_started.status.AssertResult | default('yes') != 'no'
  become: true
  become_user: "{{ _systemd_unit_user }}"

# Apply a requested refresh after ensuring the unit is active. Restart wins
# when both flags are set; reload is the hitless alternative for daemons that
# pick up config via SIGHUP. A freshly started unit already has current config.
- name: service | Restart or reload the service
  when:
    - _systemd_unit_condition
    - _systemd_unit_start
    - _systemd_unit_enable is not skipped
    - (systemd_unit_args.restart | default(false)) or (systemd_unit_args.reload | default(false))
    - not systemd_unit_started.changed
  throttle: "{{ systemd_unit_args.throttle | default(0) }}"
  systemd:
    name: "{{ _systemd_unit_name }}"
    state: "{{ 'restarted' if systemd_unit_args.restart | default(false) else 'reloaded' }}"
    scope: "{{ _systemd_unit_scope }}"
  become: true
  become_user: "{{ _systemd_unit_user }}"

# Preserve each start result across later helper calls; enable-only calls publish
# changed=false.
- name: service | Record service result for {{ systemd_unit_args.src }}
  set_fact:
    "{{ _systemd_unit_name | ansible_var_key }}_started_result": "{{ systemd_unit_started | default({'changed': false}) }}"
