# Tests for the systemd_unit helper's install / unit / remove entrypoints.
# Each scenario installs a fixture unit, drives the path,
# asserts the observable behaviour, and cleans up.

# Install-path coverage: the rescue block fires on any systemd-analyze
# verify failure (validate runs against the unit *after* it lands at its
# production path), but the regular test matrix ships valid units only,
# so the rescue is never exercised — a regression there would silently
# brick the host's recovery path. The fixtures below install a good
# unit, then deliberately install one verify rejects (`Bogus=` in [Unit]
# is a stable trip-wire across systemd versions), and assert both rescue
# branches: backup-restore and fresh-file-delete.

- name: _verify | Install valid template via tasks_from=install
  import_role:
    name: systemd_unit
    tasks_from: install
  vars:
    systemd_unit_args:
      src: systemd_unit_verify_ok.service.j2

- name: _verify | First install published a changed per-unit result
  assert:
    that:
      - systemd_unit_verify_ok_service_result is defined
      - systemd_unit_verify_ok_service_result.changed

- name: _verify | Re-install same template is idempotent
  import_role:
    name: systemd_unit
    tasks_from: install
  vars:
    systemd_unit_args:
      src: systemd_unit_verify_ok.service.j2

- name: _verify | Second install reported no change
  assert:
    that: not systemd_unit_verify_ok_service_result.changed

- name: _verify | Rescue restores backup when validate fails over a prior unit
  block:
    - name: _verify | Install broken unit over the good one (expect failure)
      import_role:
        name: systemd_unit
        tasks_from: install
      vars:
        systemd_unit_args:
          src: systemd_unit_verify_bad.service.j2
          dest: systemd_unit_verify_ok.service
    - name: _verify | Sentinel fail if bad-over-good install succeeded
      fail:
        msg: broken install over the good unit should have failed but did not
  rescue:
    - name: _verify | On-disk content reverted to the good unit
      command: grep -qF Description=systemd_unit_verify_ok /etc/systemd/system/systemd_unit_verify_ok.service
      changed_when: false

- name: _verify | Rescue deletes new file on fresh-install validate failure
  block:
    - name: _verify | Install broken unit fresh (expect failure)
      import_role:
        name: systemd_unit
        tasks_from: install
      vars:
        systemd_unit_args:
          src: systemd_unit_verify_bad.service.j2
    - name: _verify | Sentinel fail if fresh bad install succeeded
      fail:
        msg: broken install should have failed but did not
  rescue:
    - name: _verify | Stat verify_bad path after expected rescue
      stat:
        path: /etc/systemd/system/systemd_unit_verify_bad.service
      register: _systemd_unit_bad_stat
    - name: _verify | Assert fresh bad unit was deleted by rescue
      assert:
        that: not _systemd_unit_bad_stat.stat.exists

# Mask guardrail: `systemctl mask` lives as a symlink to /dev/null at the
# unit path, and operator intent is "do not start this." The install
# preamble refuses to overwrite that. Fixture pre-creates the symlink
# (no daemon-reload needed -- we never call systemctl, we just check
# the on-disk shape), tries to install over it, asserts the play failed
# AND the symlink survived.
- name: _verify | Pre-mask a test unit path
  file:
    src: /dev/null
    dest: /etc/systemd/system/systemd_unit_mask_test.service
    state: link
    force: true
  become: true

- name: _verify | Install over a masked unit (expect failure)
  block:
    - name: _verify | Attempt install over masked unit (should raise)
      import_role:
        name: systemd_unit
        tasks_from: install
      vars:
        systemd_unit_args:
          src: systemd_unit_verify_ok.service.j2
          dest: systemd_unit_mask_test.service
    - name: _verify | Sentinel fail if masked-unit install succeeded
      fail:
        msg: install over masked unit should have refused but did not
  rescue:
    - name: _verify | Stat mask-test path after expected install refusal
      stat:
        path: /etc/systemd/system/systemd_unit_mask_test.service
      register: _systemd_unit_masked_stat
    - name: _verify | Assert mask symlink survived the install refusal
      assert:
        that:
          - _systemd_unit_masked_stat.stat.islnk
          - _systemd_unit_masked_stat.stat.lnk_target == '/dev/null'

- name: _verify | Unmask + remove mask-test fixture
  file:
    path: /etc/systemd/system/systemd_unit_mask_test.service
    state: absent
  become: true

# Exercise the copy dispatch (extension-derived): src without .j2 picks the
# copy module so install.yml reads from files/ rather than templates/. The
# composed-unit assertions below verify that systemd loaded the copied unit.
- name: _verify | Install valid unit via tasks_from=install (copy path)
  import_role:
    name: systemd_unit
    tasks_from: install
  vars:
    systemd_unit_args:
      src: systemd_unit_verify_copy_ok.service

# Drop-in install smoke test. install.yml derives dest as <unit>.d/override.conf
# and verify as the parent unit, so the override
# is validated as part of the composed unit. Layer over the still-installed
# copy-path fixture (cleanup is shared below).
- name: _verify | Install default drop-in
  import_role:
    name: systemd_unit
    tasks_from: install
  vars:
    systemd_unit_args:
      src: systemd_unit_verify_dropin.conf
      for: systemd_unit_verify_copy_ok.service

# Absolute-path dropin mode: dest_abs lets callers place daemon-config
# drop-ins (journald.conf.d/, resolved.conf.d/) at arbitrary absolute
# paths. The path derivation and fact-name computation differ from the
# default mode, so exercise them separately.
- name: _verify | Install drop-in via dest_abs mode
  import_role:
    name: systemd_unit
    tasks_from: install
  vars:
    systemd_unit_args:
      src: systemd_unit_verify_abs_dropin.conf
      for: systemd_unit_verify_copy_ok.service
      dest_abs: /etc/systemd/system/systemd_unit_verify_copy_ok.service.d/99-abs-test.conf

- name: _verify | Read environment with both drop-ins active  # noqa: command-instead-of-module
  command:
    argv:
      - systemctl
      - show
      - systemd_unit_verify_copy_ok.service
      - --property=Environment
      - --value
  register: _systemd_unit_dropin_environment
  changed_when: false

- name: _verify | Both drop-ins affect the composed unit
  assert:
    that:
      - "'DROPIN_TEST=1' in _systemd_unit_dropin_environment.stdout.split()"
      - "'ABS_DROPIN_TEST=1' in _systemd_unit_dropin_environment.stdout.split()"

- name: _verify | Remove drop-in via dest_abs mode
  import_role:
    name: systemd_unit
    tasks_from: remove
  vars:
    systemd_unit_args:
      for: systemd_unit_verify_copy_ok.service
      dest_abs: /etc/systemd/system/systemd_unit_verify_copy_ok.service.d/99-abs-test.conf

- name: _verify | Read environment after absolute drop-in removal  # noqa: command-instead-of-module
  command:
    argv:
      - systemctl
      - show
      - systemd_unit_verify_copy_ok.service
      - --property=Environment
      - --value
  register: _systemd_unit_abs_dropin_removed_environment
  changed_when: false

- name: _verify | Absolute removal preserves the default drop-in
  assert:
    that:
      - "'DROPIN_TEST=1' in _systemd_unit_abs_dropin_removed_environment.stdout"
      - "'ABS_DROPIN_TEST=1' not in _systemd_unit_abs_dropin_removed_environment.stdout"

- name: _verify | Cleanup drop-in directory
  file:
    path: /etc/systemd/system/systemd_unit_verify_copy_ok.service.d
    state: absent
  become: true

- name: _verify | Daemon-reload after drop-in cleanup
  systemd:
    daemon_reload: true
  become: true

# Remove-path coverage consumes the valid fixture left by the install-path
# scenarios, then exercises the four observable behaviours of
# tasks_from=remove: deletes-on-first-call, idempotent on second call,
# reports a stop when the file is already absent, and refuses to delete a mask.
- name: _verify | Remove via tasks_from=remove
  import_role:
    name: systemd_unit
    tasks_from: remove
  vars:
    systemd_unit_args:
      dest: systemd_unit_verify_ok.service

- name: _verify | First remove deleted the file and reported changed
  block:
    - name: _verify | Stat verify_ok path after remove
      stat:
        path: /etc/systemd/system/systemd_unit_verify_ok.service
      register: _systemd_unit_removed_stat
    - name: _verify | Assert verify_ok result shows changed and file is gone
      assert:
        that:
          - systemd_unit_verify_ok_service_result is defined
          - systemd_unit_verify_ok_service_result.changed
          - not _systemd_unit_removed_stat.stat.exists

- name: _verify | Re-remove same unit is idempotent
  import_role:
    name: systemd_unit
    tasks_from: remove
  vars:
    systemd_unit_args:
      dest: systemd_unit_verify_ok.service

- name: _verify | Second remove reported no change
  assert:
    that: not systemd_unit_verify_ok_service_result.changed

- name: _verify | Manage fixture for stop-only removal
  import_role:
    name: systemd_unit
    tasks_from: unit
  vars:
    systemd_unit_args:
      src: systemd_unit_verify_ok.service.j2

- name: _verify | Disable fixture while leaving it active
  systemd:
    name: systemd_unit_verify_ok.service
    state: started
    enabled: false
  become: true

- name: _verify | Delete active fixture file before helper removal
  file:
    path: /etc/systemd/system/systemd_unit_verify_ok.service
    state: absent
  become: true

- name: _verify | Remove active fixture whose file is already absent
  import_role:
    name: systemd_unit
    tasks_from: remove
  vars:
    systemd_unit_args:
      dest: systemd_unit_verify_ok.service

- name: _verify | Read stop-only fixture state  # noqa: command-instead-of-module
  command: systemctl is-active systemd_unit_verify_ok.service
  register: _systemd_unit_stop_only_state
  changed_when: false
  failed_when: false

- name: _verify | Stop-only removal reported the runtime change
  assert:
    that:
      - systemd_unit_verify_ok_service_result.changed
      - _systemd_unit_stop_only_state.rc != 0

# Mask guardrail (symmetric with the install-path mask test): a
# pre-existing symlink to /dev/null is operator intent that `rm`
# must not silently undo.
- name: _verify | Pre-mask a test unit path
  file:
    src: /dev/null
    dest: /etc/systemd/system/systemd_unit_remove_mask_test.service
    state: link
    force: true
  become: true

- name: _verify | Remove a masked unit (expect failure)
  block:
    - name: _verify | Attempt to remove a masked unit (should raise)
      import_role:
        name: systemd_unit
        tasks_from: remove
      vars:
        systemd_unit_args:
          dest: systemd_unit_remove_mask_test.service
    - name: _verify | Sentinel fail if remove succeeded (should not reach here)
      fail:
        msg: remove of a masked unit should have refused but did not
  rescue:
    - name: _verify | Stat mask-test path after expected refusal
      stat:
        path: /etc/systemd/system/systemd_unit_remove_mask_test.service
      register: _systemd_unit_remove_masked_stat
    - name: _verify | Assert mask is still intact after refusal
      assert:
        that:
          - _systemd_unit_remove_masked_stat.stat.islnk
          - _systemd_unit_remove_masked_stat.stat.lnk_target == '/dev/null'

- name: _verify | Unmask + remove the mask-test fixture
  file:
    path: /etc/systemd/system/systemd_unit_remove_mask_test.service
    state: absent
  become: true

# --- unit.yml coverage ---
# Exercise the combined lifecycle: install + start, idempotent re-run,
# caller-requested restart/reload, enable-only, and cleanup.
- name: _verify | Install and start fixture via tasks_from=unit
  import_role:
    name: systemd_unit
    tasks_from: unit
  vars:
    systemd_unit_args:
      src: systemd_unit_verify_ok.service.j2

- name: _verify | Unit is active after first start  # noqa: command-instead-of-module
  command: systemctl is-active systemd_unit_verify_ok.service
  changed_when: false

- name: _verify | Re-run unit management idempotently
  import_role:
    name: systemd_unit
    tasks_from: unit
  vars:
    systemd_unit_args:
      src: systemd_unit_verify_ok.service.j2

- name: _verify | Restart fires when requested
  import_role:
    name: systemd_unit
    tasks_from: unit
  vars:
    systemd_unit_args:
      src: systemd_unit_verify_ok.service.j2
      restart: true

- name: _verify | Reload fires when ExecReload is present
  import_role:
    name: systemd_unit
    tasks_from: unit
  vars:
    systemd_unit_args:
      src: systemd_unit_verify_ok.service.j2
      reload: true

- name: _verify | Enable the copy-path fixture without starting it
  import_role:
    name: systemd_unit
    tasks_from: unit
  vars:
    systemd_unit_args:
      src: systemd_unit_verify_copy_ok.service
      start: false

- name: _verify | Read enable-only fixture state  # noqa: command-instead-of-module
  command:
    argv:
      - systemctl
      - show
      - systemd_unit_verify_copy_ok.service
      - --property=UnitFileState
      - --property=ActiveState
  register: _systemd_unit_enable_only_state
  changed_when: false

- name: _verify | Enable-only leaves the fixture inactive
  assert:
    that:
      - "'UnitFileState=enabled' in _systemd_unit_enable_only_state.stdout_lines"
      - "'ActiveState=inactive' in _systemd_unit_enable_only_state.stdout_lines"

- name: _verify | Cleanup enable-only fixture
  import_role:
    name: systemd_unit
    tasks_from: remove
  vars:
    systemd_unit_args:
      dest: systemd_unit_verify_copy_ok.service

- name: _verify | Cleanup unit-path fixture
  import_role:
    name: systemd_unit
    tasks_from: remove
  vars:
    systemd_unit_args:
      dest: systemd_unit_verify_ok.service

# --- Reenable follows the current unit write ---
# `systemctl enable` only adds the symlinks named in a unit's *current*
# [Install]; it never removes ones dropped from the template. So a unit that
# leaves a target (e.g. a service leaving zfs_autosnapshot.target) keeps a
# dangling .wants symlink on every already-converged host. unit.yml reenables
# only on its own file change, so prove steady state preserves the planted link
# before a template change prunes it.
- name: _verify | Install the fixture for the prune test
  import_role:
    name: systemd_unit
    tasks_from: install
  vars:
    systemd_unit_args:
      src: systemd_unit_verify_ok.service.j2

- name: _verify | Plant a legacy target.wants dir for the prune test
  file:
    path: /etc/systemd/system/systemd_unit_verify_stale.target.wants
    state: directory
    mode: "0755"
  become: true

- name: _verify | Plant the legacy enable symlink (simulates a removed WantedBy=)
  file:
    path: /etc/systemd/system/systemd_unit_verify_stale.target.wants/systemd_unit_verify_ok.service
    src: /etc/systemd/system/systemd_unit_verify_ok.service
    state: link
    force: true
    follow: false
  become: true

- name: _verify | Manage the unchanged unit
  import_role:
    name: systemd_unit
    tasks_from: unit
  vars:
    systemd_unit_args:
      src: systemd_unit_verify_ok.service.j2

- name: _verify | Stat the legacy link after the unchanged run
  stat:
    path: /etc/systemd/system/systemd_unit_verify_stale.target.wants/systemd_unit_verify_ok.service
    follow: false
  register: _systemd_unit_unrelated_reenable_link
  become: true

- name: _verify | Unchanged unit did not trigger reenable
  assert:
    that: _systemd_unit_unrelated_reenable_link.stat.islnk | default(false)

- name: _verify | Change and manage the current unit
  import_role:
    name: systemd_unit
    tasks_from: unit
  vars:
    systemd_unit_verify_suffix: _updated
    systemd_unit_args:
      src: systemd_unit_verify_ok.service.j2

- name: _verify | Stat the legacy and current enable symlinks
  stat:
    path: "{{ item }}"
    follow: false
  loop:
    - /etc/systemd/system/systemd_unit_verify_stale.target.wants/systemd_unit_verify_ok.service
    - /etc/systemd/system/multi-user.target.wants/systemd_unit_verify_ok.service
  register: _systemd_unit_reenable_links
  become: true

- name: _verify | Stale [Install] symlink pruned, current enable intact
  assert:
    that:
      - not _systemd_unit_reenable_links.results[0].stat.exists
      - _systemd_unit_reenable_links.results[1].stat.islnk | default(false)
    fail_msg: >-
      reenable should have pruned
      systemd_unit_verify_stale.target.wants/systemd_unit_verify_ok.service
      (present={{ _systemd_unit_reenable_links.results[0].stat.exists }}) while
      keeping multi-user.target.wants/systemd_unit_verify_ok.service
      (islnk={{ _systemd_unit_reenable_links.results[1].stat.islnk | default(false) }}).

- name: _verify | Cleanup reenable-test unit
  import_role:
    name: systemd_unit
    tasks_from: remove
  vars:
    systemd_unit_args:
      dest: systemd_unit_verify_ok.service

- name: _verify | Cleanup the legacy target.wants dir
  file:
    path: /etc/systemd/system/systemd_unit_verify_stale.target.wants
    state: absent
  become: true
