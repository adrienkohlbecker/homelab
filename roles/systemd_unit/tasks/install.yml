# Validate after placement so systemd-analyze can resolve dependencies. Treat
# stderr as failure because it carries warnings despite a zero exit code; only
# removed-option notices from transitively loaded stock units are benign.
#
# Inputs: caller passes a single dict `systemd_unit_args` with keys
#   src               file under role files/ (copy) or templates/ (.j2 → template)
#   dest              optional on-disk filename; defaults to src with .j2 stripped
#   for               drop-in only: parent unit (e.g. podman.socket); derives
#                     dest=<for>.d/override.conf and verify=<for>
#   user              default 'root'; non-root drives /etc/systemd/user
#   condition         default true; gates the whole call
#
# Replacing this dict on every import prevents caller arguments leaking between
# calls. A non-root user selects /etc/systemd/user and its lingered user manager.
# The src suffix selects template (.j2) or copy; .j2 is stripped on disk.
- name: install | Validate install args
  assert:
    quiet: true
    that:
      - systemd_unit_args is defined
      - systemd_unit_args is mapping
      - systemd_unit_args.src is defined
      - systemd_unit_args.src is string
      - systemd_unit_args.for is not defined or systemd_unit_args.for is string
      - systemd_unit_args.dest is not defined or systemd_unit_args.for is not defined
      - systemd_unit_args.keys() | difference(['src', 'dest', 'for', 'user', 'condition', 'start', 'restart', 'reload', 'throttle']) | length == 0
    fail_msg: >-
      systemd_unit_args needs src (source filename); dest and for are mutually
      exclusive, for must be a string when set, and no other keys are accepted;
      got {{ systemd_unit_args | default('<unset>') }}

# set_fact keys resolve concurrently, so defaults and their derivatives need
# separate tasks.
- name: install | Resolve caller defaults for {{ systemd_unit_args.src }}
  set_fact:
    _systemd_unit_user: "{{ systemd_unit_args.user | default('root') }}"
    _systemd_unit_condition: "{{ systemd_unit_args.condition | default(true) }}"
    _systemd_unit_name: >-
      {{ systemd_unit_args.dest
         | default((systemd_unit_args.for ~ '.d/override.conf') if systemd_unit_args.for is defined
                   else (systemd_unit_args.src | regex_replace('\.j2$', ''))) }}
    _systemd_unit_verify: >-
      {{ systemd_unit_args.for
         if systemd_unit_args.for is defined
         else (systemd_unit_args.dest
               | default(systemd_unit_args.src | regex_replace('\.j2$', ''))) }}

- name: install | Derive install scope for {{ systemd_unit_args.src }}
  set_fact:
    _systemd_unit_scope: "{{ 'system' if _systemd_unit_user == 'root' else 'user' }}"
    _systemd_unit_dir: "{{ '/etc/systemd/system' if _systemd_unit_user == 'root' else '/etc/systemd/user' }}"

- name: install | Create drop-in directory for {{ systemd_unit_args.src }}
  when:
    - _systemd_unit_condition
    - systemd_unit_args.for is defined
  file:
    path: "{{ _systemd_unit_dir }}/{{ systemd_unit_args.for }}.d"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

# A user manager must be lingered to survive logout. Task names use the caller
# var because imports render them before set_fact runs. Check mode may predict
# linger creation without creating its marker; real applies still fail closed.
- name: install | Verify user-scope linger marker exists for {{ systemd_unit_args.user | default('root') }}
  when:
    - _systemd_unit_condition
    - _systemd_unit_scope == 'user'
  stat:
    path: "/var/lib/systemd/linger/{{ _systemd_unit_user }}"
  register: _systemd_unit_linger
  failed_when: not _systemd_unit_linger.stat.exists and not ansible_check_mode

# A mask is operator intent stored as a /dev/null symlink. Check the verify
# target so a drop-in cannot bypass a masked parent unit.
- name: install | Stat unit path to detect a pre-existing mask
  when: _systemd_unit_condition
  stat:
    path: "{{ _systemd_unit_dir }}/{{ _systemd_unit_verify }}"
  register: _systemd_unit_mask
  become: true

- name: install | Refuse to overwrite masked unit
  when:
    - _systemd_unit_condition
    - _systemd_unit_mask.stat.islnk | default(false)
    - _systemd_unit_mask.stat.lnk_target | default('') == '/dev/null'
  fail:
    msg: >-
      Refusing to overwrite {{ _systemd_unit_dir }}/{{ _systemd_unit_verify }}:
      it is masked (symlink to /dev/null). Unmask with
      `systemctl{{ ' --user' if _systemd_unit_scope == 'user' else '' }} unmask {{ _systemd_unit_verify }}`
      before re-running, or --limit the play to skip this role.

- name: install | Install systemd unit
  vars:
    _systemd_unit_path: "{{ _systemd_unit_dir }}/{{ _systemd_unit_name }}"
  block:
    # Keep dispatch task-local so a host fact cannot poison the next call. The
    # action string form avoids the mapping form deprecated in ansible-core 2.23.
    - name: install | Write the unit file ({{ _module }})
      when: _systemd_unit_condition
      vars:
        _module: "{{ 'template' if systemd_unit_args.src.endswith('.j2') else 'copy' }}"
      action: "{{ _module }}"
      args:
        src: "{{ systemd_unit_args.src }}"
        dest: "{{ _systemd_unit_path }}"
        owner: root
        group: root
        mode: "0644"
        backup: true
      become: true
      register: systemd_unit_file

    # Skip man-page completeness checks that fail on minimal images; --man=no
    # works on systemd 249+. Verify user units by path in the system context to
    # avoid user-manager resolution warnings becoming false rollbacks.
    - name: install | Validate unit file
      when: systemd_unit_file.changed
      command:
        argv:
          - systemd-analyze
          - verify
          - --no-pager
          - --man=no
          - "{{ _systemd_unit_dir }}/{{ _systemd_unit_verify }}"
      register: systemd_unit_verify
      changed_when: false
      # Ignore removed-option notices from stock dependencies and blank lines.
      failed_when: >-
        systemd_unit_verify.rc != 0
        or (systemd_unit_verify.stderr_lines
            | reject('search', 'has been removed and it is ignored')
            | select | list | length > 0)
      become: true

    - name: install | Reload daemon
      when: systemd_unit_file.changed
      systemd:
        daemon_reload: true
        scope: "{{ _systemd_unit_scope }}"
      become: true
      become_user: "{{ _systemd_unit_user }}"

    # Publish a per-unit result so later helper calls cannot clobber it. The
    # task name uses the import-time caller var; the body can use resolved facts.
    - name: install | Record install result for {{ systemd_unit_args.src }}
      set_fact:
        "{{ _systemd_unit_name | ansible_var_key }}_result":
          changed: "{{ systemd_unit_file.changed }}"

  # Validation needs the production path. Restore the backup or delete a new
  # file on failure so one broken unit cannot poison daemon-reload host-wide.
  rescue:
    - name: install | Copy backup file to original  # noqa: require-backup
      when: '"backup_file" in systemd_unit_file'
      copy:
        remote_src: true
        dest: "{{ _systemd_unit_path }}"
        src: "{{ systemd_unit_file.backup_file }}"
        owner: root
        group: root
        mode: "0644"
      become: true

    - name: install | Delete backup file
      when: '"backup_file" in systemd_unit_file'
      file:
        path: "{{ systemd_unit_file.backup_file }}"
        state: absent
      become: true

    - name: install | Delete newly added file
      when: systemd_unit_file.changed and "backup_file" not in systemd_unit_file
      file:
        path: "{{ _systemd_unit_path }}"
        state: absent
      become: true

    - name: install | Record failure
      fail:
        msg: >-
          Unable to install {{ _systemd_unit_path }}:
          {{ ansible_failed_result.stderr
             | default(ansible_failed_result.msg
             | default('unknown error')) }}
