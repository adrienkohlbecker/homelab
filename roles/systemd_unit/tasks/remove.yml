# Inputs: caller passes a single dict `systemd_unit_args` with keys
#   dest              exact unit filename; mutually exclusive with for
#   for               drop-in parent; derives dest=<for>.d/override.conf
#   user              default 'root'; non-root acts on the named user's
#                     user manager (linger must already be on).
#   condition         default true; gates the whole call.
#
# Stop and disable units, remove their files, reload after deletion, and publish
# the same per-unit result shape as install. Never remove an operator mask.
- name: remove | Validate remove args
  assert:
    quiet: true
    that:
      - systemd_unit_args is defined
      - systemd_unit_args is mapping
      - systemd_unit_args.dest is defined or systemd_unit_args.for is defined
      - systemd_unit_args.dest is not defined or systemd_unit_args.for is not defined
      - systemd_unit_args.keys() | difference(['dest', 'for', 'user', 'condition']) | length == 0
    fail_msg: >-
      systemd_unit_args needs exactly one of dest or for and accepts only user
      and condition as optional keys;
      got dest={{ systemd_unit_args.dest | default('<unset>') }},
      for={{ systemd_unit_args.for | default('<unset>') }}

- name: remove | Resolve caller defaults for {{ systemd_unit_args.dest | default(systemd_unit_args.for | default('?')) }}
  set_fact:
    _systemd_unit_user: "{{ systemd_unit_args.user | default('root') }}"
    _systemd_unit_condition: "{{ systemd_unit_args.condition | default(true) }}"
    _systemd_unit_name: >-
      {{ systemd_unit_args.dest
         if systemd_unit_args.dest is defined
         else systemd_unit_args.for ~ '.d/override.conf' }}

- name: remove | Derive scope for {{ systemd_unit_args.dest | default(systemd_unit_args.for | default('?')) }}
  set_fact:
    _systemd_unit_scope: "{{ 'system' if _systemd_unit_user == 'root' else 'user' }}"
    _systemd_unit_remove_path: "{{ ('/etc/systemd/system' if _systemd_unit_user == 'root' else '/etc/systemd/user') }}/{{ _systemd_unit_name }}"

# See install.yml for linger check-mode and task-name constraints.
- name: remove | Verify user-scope linger marker exists for {{ systemd_unit_args.user | default('root') }}
  when:
    - _systemd_unit_condition
    - _systemd_unit_scope == 'user'
  stat:
    path: "/var/lib/systemd/linger/{{ _systemd_unit_user }}"
  register: _systemd_unit_linger
  failed_when: not _systemd_unit_linger.stat.exists and not ansible_check_mode

# Deleting a /dev/null symlink would silently undo an operator mask.
- name: remove | Stat unit path to detect a pre-existing mask
  when: _systemd_unit_condition
  stat:
    path: "{{ _systemd_unit_remove_path }}"
  register: _systemd_unit_mask
  become: true

- name: remove | Refuse to delete masked unit
  when:
    - _systemd_unit_condition
    - _systemd_unit_mask.stat.islnk | default(false)
    - _systemd_unit_mask.stat.lnk_target | default('') == '/dev/null'
  fail:
    msg: >-
      Refusing to remove {{ _systemd_unit_remove_path }}:
      it is masked (symlink to /dev/null). Unmask with
      `systemctl{{ ' --user' if _systemd_unit_scope == 'user' else '' }} unmask {{ _systemd_unit_name }}`
      before re-running, or --limit the play to skip this role.

# Missing units are already in the desired state. Skip template units and
# drop-ins: callers stop template instances, while drop-ins have no lifecycle.
- name: remove | Stop and disable {{ systemd_unit_args.dest | default(systemd_unit_args.for | default('?')) }}
  when:
    - _systemd_unit_condition
    - "'@.' not in _systemd_unit_name"
    - systemd_unit_args.for is not defined
  systemd:
    name: "{{ _systemd_unit_name }}"
    state: stopped
    enabled: false
    scope: "{{ _systemd_unit_scope }}"
  become: true
  become_user: "{{ _systemd_unit_user }}"
  register: _systemd_unit_stop
  failed_when: >-
    _systemd_unit_stop.failed | default(false) and
    'could not find' not in (_systemd_unit_stop.msg | default('') | lower)

- name: remove | Delete the unit file
  when: _systemd_unit_condition
  file:
    path: "{{ _systemd_unit_remove_path }}"
    state: absent
  become: true
  register: systemd_unit_file

- name: remove | Reload daemon
  when:
    - _systemd_unit_condition
    - systemd_unit_file.changed
  systemd:
    daemon_reload: true
    scope: "{{ _systemd_unit_scope }}"
  become: true
  become_user: "{{ _systemd_unit_user }}"

# Same fact name install.yml uses, so callers can read `.changed` off
# `<name>_<type>_result` regardless of which operation just ran.
- name: remove | Record removal result for {{ systemd_unit_args.dest | default(systemd_unit_args.for | default('?')) }}
  set_fact:
    "{{ _systemd_unit_name | ansible_var_key }}_result":
      changed: >-
        {{ ((_systemd_unit_stop.changed | default(false))
            or systemd_unit_file.changed) | bool }}
