# Inputs: caller passes a single dict `systemd_unit_args` with keys
#   dest              exact unit filename; mutually exclusive with for
#   for               drop-in parent; derives dest=<for>.d/override.conf
#
# Stop and disable units, remove their files, and reload after deletion. Callers
# gate a conditional removal with `when:` on the import: remove publishes no
# result a skipped import could leave undefined.
- name: remove | Validate remove args
  assert:
    quiet: true
    that:
      - systemd_unit_args is defined
      - systemd_unit_args is mapping
      - systemd_unit_args.dest is defined or systemd_unit_args.for is defined
      - systemd_unit_args.dest is not defined or systemd_unit_args.for is not defined
      - systemd_unit_args.keys() | difference(['dest', 'for']) | length == 0
    fail_msg: >-
      systemd_unit_args needs exactly one of dest or for and no other keys;
      got dest={{ systemd_unit_args.dest | default('<unset>') }},
      for={{ systemd_unit_args.for | default('<unset>') }}

- name: remove | Resolve caller defaults for {{ systemd_unit_args.dest | default(systemd_unit_args.for | default('?')) }}
  set_fact:
    _systemd_unit_name: >-
      {{ systemd_unit_args.dest
         if systemd_unit_args.dest is defined
         else systemd_unit_args.for ~ '.d/override.conf' }}

# Missing units are already in the desired state. Drop-ins have no lifecycle.
- name: remove | Stop and disable {{ systemd_unit_args.dest | default(systemd_unit_args.for | default('?')) }}
  when: systemd_unit_args.for is not defined
  systemd:
    name: "{{ _systemd_unit_name }}"
    state: stopped
    enabled: false
  become: true
  register: _systemd_unit_stop
  failed_when: >-
    _systemd_unit_stop.failed | default(false) and
    'could not find' not in (_systemd_unit_stop.msg | default('') | lower)

- name: remove | Delete the unit file
  file:
    path: /etc/systemd/system/{{ _systemd_unit_name }}
    state: absent
  become: true
  register: systemd_unit_file

- name: remove | Reload daemon
  when: systemd_unit_file.changed
  systemd:
    daemon_reload: true
  become: true
