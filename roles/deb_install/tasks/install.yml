# Install an exact pinned .deb, including downgrades and config-files reinstalls.
# `deb_install_args` requires:
#   name      dpkg package name and unique staging/result prefix
#   version   exact dpkg ${Version}, including epoch and Debian revision
#   url       download URL
#   sha256    expected archive checksum
# Dependencies must already be satisfied. Publishes `<name>_deb_changed`, with
# non-identifier characters replaced by underscores.
- name: Assert deb_install args
  assert:
    quiet: true
    that:
      - (deb_install_args.name | default('')) is match('^[A-Za-z0-9][A-Za-z0-9.+_-]*$')
      - deb_install_args.version | default('') | length > 0
      - deb_install_args.url | default('') | length > 0
      - (deb_install_args.sha256 | default('')) is match('^[0-9a-fA-F]{64}$')
    fail_msg: >-
      deb_install_args must define name (slash-free dpkg package name),
      version, url and a 64-hex sha256; got {{ deb_install_args }}

# Keep the repeated package-derived path and result prefix in one place.
- name: Resolve deb_install caller defaults
  set_fact:
    _deb_install_name: "{{ deb_install_args.name }}"

# The status word distinguishes installed packages from retained config files;
# package_facts exposes only the version.
- name: Check installed deb version  # noqa: command-instead-of-module
  command:
    argv:
      - dpkg-query
      - -W
      - -f=${db:Status-Status} ${Version}
      - "{{ _deb_install_name }}"
  register: deb_install_query
  changed_when: false
  # rc 1 means absent; other failures must not trigger a blind reinstall.
  failed_when: deb_install_query.rc not in [0, 1]
  check_mode: false

- name: Install deb if needed
  when: deb_install_query.stdout != ("installed " ~ deb_install_args.version)
  become: true
  block:

    # apt cannot checksum a deb URL, so verify it before installation.
    - name: Download deb
      check_mode: false
      get_url:
        url: "{{ deb_install_args.url }}"
        # Root-owned staging prevents local users replacing the archive.
        dest: "/var/cache/{{ _deb_install_name }}.deb"
        mode: '0600'
        owner: root
        group: root
        checksum: "sha256:{{ deb_install_args.sha256 }}"
      register: deb_install_download
      retries: 3
      delay: 5
      until: deb_install_download is succeeded

    - name: Install the deb package
      apt:
        deb: "/var/cache/{{ _deb_install_name }}.deb"
        # The exact-version gate makes an older pin a deliberate rollback.
        allow_downgrade: true
      register: deb_install_apt

  always:

    # Also clean up after a failed install or check-mode download.
    - name: Delete deb file
      check_mode: false
      file:
        path: "/var/cache/{{ _deb_install_name }}.deb"
        state: absent

# Publish a stable false result when the install block was skipped.
- name: Record whether an install happened
  set_fact:
    "{{ _deb_install_name | ansible_var_key }}_deb_changed": "{{ deb_install_apt.changed | default(false) }}"
