- name: _verify | Run zfs-autobackup --version
  command: /usr/local/bin/zfs-autobackup --version
  changed_when: false
  failed_when: zfs_autobackup_verify_version.stdout is not defined or zfs_autobackup_verify_version.stdout | length == 0
  register: zfs_autobackup_verify_version

- name: _verify | Installed version matches pinned version
  assert:
    that:
      - zfs_autobackup_version in zfs_autobackup_verify_version.stdout
    fail_msg: >-
      installed={{ zfs_autobackup_verify_version.stdout | trim }},
      expected={{ zfs_autobackup_version }}

# Functional check: converge granted zfs allow on the scratch dataset that
# _setup tagged; assert the grant landed, then drive a real local backup and
# confirm a @bak- snapshot appears -- exercising script discovery, the
# zfs-autobackup invocation, and the snapshot-target quiesce end to end.
- name: _verify | Read zfs allow on the scratch dataset
  command: zfs allow rpool/zfs_autobackup_test
  changed_when: false
  register: zfs_autobackup_verify_allow
  become: true

- name: _verify | User zfs_autobackup was granted send,hold,release
  assert:
    that:
      - "'user zfs_autobackup' in zfs_autobackup_verify_allow.stdout"
      - "'send' in zfs_autobackup_verify_allow.stdout"
      - "'hold' in zfs_autobackup_verify_allow.stdout"
      - "'release' in zfs_autobackup_verify_allow.stdout"
    fail_msg: >-
      zfs allow did not grant send,hold,release to zfs_autobackup
      ({{ zfs_autobackup_verify_allow.stdout }})

- name: _verify | Run a local backup against the scratch dataset
  command: /usr/local/bin/zfs_backup_local
  changed_when: false
  become: true

- name: _verify | List snapshots on the scratch dataset
  command: zfs list -t snapshot -H -o name -r rpool/zfs_autobackup_test
  changed_when: false
  register: zfs_autobackup_verify_snaps
  become: true

- name: _verify | A bak snapshot was created
  assert:
    that:
      - zfs_autobackup_verify_snaps.stdout is search('@bak-')
    fail_msg: >-
      zfs_backup_local created no @bak- snapshot on rpool/zfs_autobackup_test
      ({{ zfs_autobackup_verify_snaps.stdout }})

# Functional check for the quiesce path: --no-resume must snapshot but leave
# zfs_autosnapshot.target stopped (the rebuild runbooks depend on state
# writers NOT restarting after the final pre-wipe snapshot).
- name: _verify | Wait out the snapshot-name second (bak-%Y%m%d%H%M%S)
  pause:
    seconds: 2

- name: _verify | Run a local backup with --no-resume
  command: /usr/local/bin/zfs_backup_local --no-resume
  changed_when: false
  become: true

- name: _verify | Read zfs_autosnapshot.target state after --no-resume  # noqa: command-instead-of-module
  command: systemctl is-active zfs_autosnapshot.target
  changed_when: false
  failed_when: false
  register: zfs_autobackup_verify_target_state
  become: true

- name: _verify | Target stayed stopped after --no-resume
  assert:
    that:
      - zfs_autobackup_verify_target_state.stdout | trim == 'inactive'
    fail_msg: >-
      zfs_backup_local --no-resume left zfs_autosnapshot.target
      {{ zfs_autobackup_verify_target_state.stdout }} (expected inactive)

- name: _verify | Restart the target the --no-resume run left down
  systemd:
    name: zfs_autosnapshot.target
    state: started
  become: true

# Functional check for zfs_backup_offsite's change-gate. With a marker recording
# the latest snapshot and nothing written since, the script must skip before any
# rsync; once a write bumps written@, it must proceed to the transfer. bunk is
# unreachable from the fixture, so the no-skip path targets an unresolvable host
# and we assert it reached the rsync stage (the f_trace banner), not its outcome.
- name: _verify | Latest bak snapshot on the offsite-gate dataset
  shell: set -euo pipefail; zfs list -t snapshot -o name -s creation -r rpool/zfs_autobackup_offsite_test | awk -F@ '/@bak-/ {s=$2} END {print s}'
  args:
    executable: /bin/bash
  changed_when: false
  register: zfs_autobackup_verify_gate_snap
  become: true

- name: _verify | A bak snapshot exists to gate against
  assert:
    that:
      - zfs_autobackup_verify_gate_snap.stdout | length > 0
    fail_msg: "no @bak- snapshot on rpool/zfs_autobackup_offsite_test to seed the gate marker"

- name: _verify | Seed the offsite marker (simulate a prior successful sync)
  copy:
    dest: /var/lib/zfs_backup_offsite/rpool_zfs_autobackup_offsite_test
    content: "{{ zfs_autobackup_verify_gate_snap.stdout }}\n"
    owner: root
    group: root
    mode: "0644"
  become: true

- name: _verify | Offsite gate skips an unchanged dataset (written=0)
  command: /usr/local/bin/zfs_backup_offsite offsite.invalid rpool/zfs_autobackup_offsite_test
  changed_when: false
  register: zfs_autobackup_verify_gate_skip
  become: true

- name: _verify | Skip path exited cleanly without attempting rsync
  assert:
    that:
      - "'skipping offsite sync' in zfs_autobackup_verify_gate_skip.stdout"
      - "'rsync' not in zfs_autobackup_verify_gate_skip.stdout"
    fail_msg: >-
      offsite gate did not skip an unchanged dataset
      (stdout={{ zfs_autobackup_verify_gate_skip.stdout }})

# Monthly reconciliation: even with nothing written since the marker snapshot,
# a marker older than 30 days must fall through to a full rsync (re-verifying the
# tree against bunk). Age the marker's mtime past the threshold and confirm the
# gate no longer short-circuits. The dataset is still unchanged here, so reaching
# rsync can only be the mtime branch, not a real write.
- name: _verify | Age the marker past the 30-day reconciliation threshold
  command: touch -d "40 days ago" /var/lib/zfs_backup_offsite/rpool_zfs_autobackup_offsite_test
  changed_when: false
  become: true

- name: _verify | Offsite gate reconciles an unchanged dataset with a stale marker
  command: timeout 30 /usr/local/bin/zfs_backup_offsite offsite.invalid rpool/zfs_autobackup_offsite_test
  changed_when: false
  failed_when: false
  register: zfs_autobackup_verify_gate_reconcile
  become: true

- name: _verify | Stale-marker dataset reconciles to a full rsync
  assert:
    that:
      - "'skipping offsite sync' not in zfs_autobackup_verify_gate_reconcile.stdout"
      - "'rsync' in zfs_autobackup_verify_gate_reconcile.stdout"
      - "'--out-format=dataset=rpool/zfs_autobackup_offsite_test' in zfs_autobackup_verify_gate_reconcile.stdout"
      - "'change=%i' in zfs_autobackup_verify_gate_reconcile.stdout"
      - "'path=%n%L' in zfs_autobackup_verify_gate_reconcile.stdout"
      - "'--log-file' not in zfs_autobackup_verify_gate_reconcile.stdout"
    fail_msg: >-
      offsite gate failed to reconcile an unchanged dataset with a >30d marker
      (rc={{ zfs_autobackup_verify_gate_reconcile.rc }},
      stdout={{ zfs_autobackup_verify_gate_reconcile.stdout }})

# Restore a fresh-mtime marker so the change test below exercises the written@
# branch, not the stale-mtime fallthrough just aged above.
- name: _verify | Re-seed the offsite marker with a current mtime
  copy:
    dest: /var/lib/zfs_backup_offsite/rpool_zfs_autobackup_offsite_test
    content: "{{ zfs_autobackup_verify_gate_snap.stdout }}\n"
    owner: root
    group: root
    mode: "0644"
  become: true

- name: _verify | Change the dataset so written@ is no longer zero
  copy:
    dest: /mnt/zfs_autobackup_offsite_test/changed.txt
    content: "changed\n"
    mode: "0644"
  become: true

# written@ only reflects data once its txg commits (~5s cadence); the copy
# above lands in an open txg, so force a sync before checking. Test-only race:
# in prod the gate compares against a prior day's long-committed snapshot.
- name: _verify | Commit the write to a txg so written@ reflects it
  command: zpool sync rpool
  changed_when: false
  become: true

- name: _verify | Offsite gate does NOT skip after a change
  command: timeout 30 /usr/local/bin/zfs_backup_offsite offsite.invalid rpool/zfs_autobackup_offsite_test
  changed_when: false
  failed_when: false
  register: zfs_autobackup_verify_gate_nochange
  become: true

- name: _verify | Changed dataset passes the gate and reaches the rsync stage
  assert:
    that:
      - "'skipping offsite sync' not in zfs_autobackup_verify_gate_nochange.stdout"
      - "'rsync' in zfs_autobackup_verify_gate_nochange.stdout"
    fail_msg: >-
      offsite gate failed to proceed to rsync after a change
      (rc={{ zfs_autobackup_verify_gate_nochange.rc }},
      stdout={{ zfs_autobackup_verify_gate_nochange.stdout }})

# Regression guard for the gate/mount ordering: the change-gate must never
# short-circuit the mount check. Seed a marker that WOULD skip (a fresh snapshot
# with nothing written since, recent mtime), then unmount the dataset. A correct
# script validates the mount first and fails loudly; a gate-before-mount order
# would skip an unmounted dataset and report a phantom up-to-date backup.
- name: _verify | Snapshot the offsite-gate dataset for the unmount test
  command: zfs snapshot rpool/zfs_autobackup_offsite_test@bak-verify-unmount
  changed_when: true
  become: true

- name: _verify | Seed a would-skip marker (fresh snapshot, written=0, current mtime)
  copy:
    dest: /var/lib/zfs_backup_offsite/rpool_zfs_autobackup_offsite_test
    content: "bak-verify-unmount\n"
    owner: root
    group: root
    mode: "0644"
  become: true

- name: _verify | Unmount the offsite-gate dataset
  command: zfs unmount rpool/zfs_autobackup_offsite_test
  changed_when: true
  become: true

- name: _verify | Run the offsite script against the unmounted dataset
  command: timeout 30 /usr/local/bin/zfs_backup_offsite offsite.invalid rpool/zfs_autobackup_offsite_test
  changed_when: false
  failed_when: false
  register: zfs_autobackup_verify_gate_unmounted
  become: true

- name: _verify | Unmounted dataset fails the mount check instead of skipping
  assert:
    that:
      - zfs_autobackup_verify_gate_unmounted.rc != 0
      - "'skipping offsite sync' not in zfs_autobackup_verify_gate_unmounted.stdout"
    fail_msg: >-
      offsite gate did not fail on an unmounted dataset
      (rc={{ zfs_autobackup_verify_gate_unmounted.rc }},
      stdout={{ zfs_autobackup_verify_gate_unmounted.stdout }},
      stderr={{ zfs_autobackup_verify_gate_unmounted.stderr }})

# Second ordering guard, for the no-@bak- skip path: it too must not short-
# circuit the mount check. This dataset has no snapshot; unmounted, a correct
# script fails the mount check rather than exiting cleanly on "No @bak- snapshot".
- name: _verify | Unmount the snapshot-free dataset
  command: zfs unmount rpool/zfs_autobackup_offsite_nosnap_test
  changed_when: true
  become: true

- name: _verify | Run the offsite script against the unmounted snapshot-free dataset
  command: timeout 30 /usr/local/bin/zfs_backup_offsite offsite.invalid rpool/zfs_autobackup_offsite_nosnap_test
  changed_when: false
  failed_when: false
  register: zfs_autobackup_verify_gate_nosnap
  become: true

- name: _verify | Snapshot-free unmounted dataset fails the mount check, not the no-snapshot skip
  assert:
    that:
      - zfs_autobackup_verify_gate_nosnap.rc != 0
      - "'skipping offsite sync' not in zfs_autobackup_verify_gate_nosnap.stdout"
    fail_msg: >-
      offsite gate skipped a no-snapshot dataset ahead of the mount check
      (rc={{ zfs_autobackup_verify_gate_nosnap.rc }},
      stdout={{ zfs_autobackup_verify_gate_nosnap.stdout }},
      stderr={{ zfs_autobackup_verify_gate_nosnap.stderr }})

# Functional round-trip for zfs_backup_restore. The root target starts at a
# clean stream boundary while the child has an interrupted full receive, so one
# run exercises both continuation paths as well as the selected history range.
- name: _verify | Generate a loopback ssh key for the restore test
  command:
    argv:
      - ssh-keygen
      - -t
      - ed25519
      - -N
      - ''
      - -f
      - "{{ ansible_user_dir }}/.ssh/zfs_restore_test_key"
    creates: "{{ ansible_user_dir }}/.ssh/zfs_restore_test_key"

- name: _verify | Read the loopback pubkey
  slurp:
    src: "{{ ansible_user_dir }}/.ssh/zfs_restore_test_key.pub"
  register: zfs_autobackup_verify_restore_pubkey

- name: _verify | Authorize the loopback key
  ansible.posix.authorized_key:
    user: "{{ ansible_user_id }}"
    key: "{{ zfs_autobackup_verify_restore_pubkey.content | b64decode }}"

- name: _verify | Point loopback ssh at the test key
  blockinfile:
    path: "{{ ansible_user_dir }}/.ssh/config"
    create: true
    mode: "0600"
    block: |
      Host 127.0.0.1
        IdentityFile ~/.ssh/zfs_restore_test_key
        StrictHostKeyChecking accept-new
        Compression yes
        ControlMaster auto
        ControlPersist 60s
        ControlPath ~/.ssh/zfs_restore_test_control

- name: _verify | Create the restore origin dataset
  community.general.zfs:
    name: rpool/zfs_autobackup_restore_source_test
    state: present
    extra_zfs_properties:
      autobackup:bak: "true"
      compression: lz4
      mountpoint: /mnt/zfs_autobackup_restore_source_test
  become: true

- name: _verify | Create an origin child with a non-default property
  community.general.zfs:
    name: rpool/zfs_autobackup_restore_source_test/child
    state: present
    extra_zfs_properties:
      autobackup:bak: "true"
      recordsize: 64K
  become: true

- name: _verify | Define production-shaped restore snapshot suffixes
  set_fact:
    zfs_autobackup_verify_restore_before_suffix: bak-20000101000000
    zfs_autobackup_verify_restore_start_suffix: bak-20000102000000
    zfs_autobackup_verify_restore_middle_suffix: bak-20000103000000
    zfs_autobackup_verify_restore_end_suffix: bak-20000104000000

- name: _verify | Write the pre-cutoff marker
  copy:
    dest: /mnt/zfs_autobackup_restore_source_test/restore_marker.txt
    content: "before-cutoff\n"
    mode: "0644"
  become: true

- name: _verify | Add incompressible data so an interrupted stream retains a token
  command:
    argv:
      - dd
      - if=/dev/urandom
      - of=/mnt/zfs_autobackup_restore_source_test/child/restore_payload.bin
      - bs=1M
      - count=32
      - status=none
    creates: /mnt/zfs_autobackup_restore_source_test/child/restore_payload.bin
  become: true

- name: _verify | Snapshot the origin tree before the restore cutoff
  command: >-
    zfs snapshot -r
    rpool/zfs_autobackup_restore_source_test@{{ zfs_autobackup_verify_restore_before_suffix }}
  changed_when: true
  become: true

- name: _verify | Write the cutoff marker
  copy:
    dest: /mnt/zfs_autobackup_restore_source_test/restore_marker.txt
    content: "cutoff\n"
    mode: "0644"
  become: true

- name: _verify | Snapshot the origin tree at the restore cutoff
  command: >-
    zfs snapshot -r
    rpool/zfs_autobackup_restore_source_test@{{ zfs_autobackup_verify_restore_start_suffix }}
  changed_when: true
  become: true

- name: _verify | Write the intermediate marker
  copy:
    dest: /mnt/zfs_autobackup_restore_source_test/restore_marker.txt
    content: "intermediate\n"
    mode: "0644"
  become: true

- name: _verify | Snapshot an intermediate restore point
  command: >-
    zfs snapshot -r
    rpool/zfs_autobackup_restore_source_test@{{ zfs_autobackup_verify_restore_middle_suffix }}
  changed_when: true
  become: true

- name: _verify | Write the endpoint marker
  copy:
    dest: /mnt/zfs_autobackup_restore_source_test/restore_marker.txt
    content: "round-trip\n"
    mode: "0644"
  become: true

- name: _verify | Snapshot the origin tree for the restore stream
  command: >-
    zfs snapshot -r
    rpool/zfs_autobackup_restore_source_test@{{ zfs_autobackup_verify_restore_end_suffix }}
  changed_when: true
  become: true

- name: _verify | Receive the origin as a scrubbed pull replica
  shell: |
    set -euo pipefail
    zfs send -Rc "rpool/zfs_autobackup_restore_source_test@{{ zfs_autobackup_verify_restore_end_suffix }}" |
      zfs recv -u -o readonly=on -o canmount=noauto -o mountpoint=none rpool/zfs_autobackup_restore_replica_test
  args:
    executable: /bin/bash
  changed_when: true
  become: true

- name: _verify | Read replica property provenance
  shell: |
    set -euo pipefail
    zfs get -H -o value,source readonly rpool/zfs_autobackup_restore_replica_test
    zfs get -H -p -o value,received recordsize rpool/zfs_autobackup_restore_replica_test/child
  args:
    executable: /bin/bash
  changed_when: false
  register: zfs_autobackup_verify_replica_properties
  become: true

- name: _verify | Replica has local scrub overrides and received origin properties
  assert:
    that:
      - zfs_autobackup_verify_replica_properties.stdout_lines == ['on\tlocal', '65536\t65536']

# The root has completed its starting snapshot, while the child stops inside
# that same full stream and retains a resume token.
- name: _verify | Receive the root through the selected starting snapshot
  shell: |
    set -euo pipefail
    sudo zfs send -bpc "rpool/zfs_autobackup_restore_replica_test@{{ zfs_autobackup_verify_restore_start_suffix }}" |
      ssh {{ ansible_user_id }}@127.0.0.1 sudo zfs recv -su rpool/zfs_autobackup_restore_target_test
  args:
    executable: /bin/bash
  changed_when: true

- name: _verify | Interrupt the child starting-snapshot stream
  shell: |
    set -euo pipefail
    sudo zfs send -bpc "rpool/zfs_autobackup_restore_replica_test/child@{{ zfs_autobackup_verify_restore_start_suffix }}" |
      dd bs=1M count=8 status=none |
      ssh {{ ansible_user_id }}@127.0.0.1 sudo zfs recv -su rpool/zfs_autobackup_restore_target_test/child
  args:
    executable: /bin/bash
  changed_when: true
  failed_when: false
  register: zfs_autobackup_verify_interrupted_child_restore

- name: _verify | Read the interrupted receive token
  command: zfs get -H -o value receive_resume_token rpool/zfs_autobackup_restore_target_test/child
  changed_when: false
  register: zfs_autobackup_verify_resume_token
  become: true

- name: _verify | Interrupted receive retained resumable state
  assert:
    that:
      - zfs_autobackup_verify_interrupted_child_restore.rc != 0
      - zfs_autobackup_verify_resume_token.stdout != '-'

# Runs as the fixture user, exactly like the operator would on the replica
# holder: the SSH hop authenticates with the user key, sudo happens inside.
- name: _verify | Complete the explicit snapshot range over loopback ssh
  command:
    argv:
      - /usr/local/bin/zfs_backup_restore
      - "{{ ansible_user_id }}@127.0.0.1"
      - rpool/zfs_autobackup_restore_replica_test
      - "{{ zfs_autobackup_verify_restore_start_suffix }}"
      - "{{ zfs_autobackup_verify_restore_end_suffix }}"
      - rpool/zfs_autobackup_restore_target_test
      - /mnt/zfs_autobackup_restore_target_test
  args:
    stdin: "y\n"
  changed_when: true
  register: zfs_autobackup_verify_restore_run

- name: _verify | Read restored state and snapshot history
  shell: |
    set -euo pipefail
    cat /mnt/zfs_autobackup_restore_target_test/restore_marker.txt
    zfs get -H -o value readonly rpool/zfs_autobackup_restore_target_test
    zfs get -H -o value mounted rpool/zfs_autobackup_restore_target_test
    zfs get -H -o value mountpoint rpool/zfs_autobackup_restore_target_test
    zfs get -H -o value autobackup:bak rpool/zfs_autobackup_restore_target_test
    zfs get -H -o source autobackup:bak rpool/zfs_autobackup_restore_target_test
    zfs get -H -o value readonly rpool/zfs_autobackup_restore_target_test/child
    zfs get -H -o value mounted rpool/zfs_autobackup_restore_target_test/child
    zfs get -H -o value mountpoint rpool/zfs_autobackup_restore_target_test/child
    zfs get -H -p -o value recordsize rpool/zfs_autobackup_restore_target_test/child
    zfs get -H -o value autobackup:bak rpool/zfs_autobackup_restore_target_test/child
    zfs get -H -o source autobackup:bak rpool/zfs_autobackup_restore_target_test/child
    zfs list -r -t snapshot -H -o name rpool/zfs_autobackup_restore_target_test
  args:
    executable: /bin/bash
  changed_when: false
  register: zfs_autobackup_verify_restore_state
  become: true

- name: _verify | Restore resumed both states and kept exactly the selected range
  assert:
    that:
      - "'Resuming an interrupted restore' in zfs_autobackup_verify_restore_run.stdout"
      - zfs_autobackup_verify_restore_state.stdout_lines[0:12] == [
          'round-trip', 'off', 'yes', '/mnt/zfs_autobackup_restore_target_test',
          'true', 'local', 'off', 'yes', '/mnt/zfs_autobackup_restore_target_test/child',
          '65536', 'true', 'local']
      - zfs_autobackup_verify_restore_state.stdout_lines[12:] | length == 6
      - zfs_autobackup_verify_restore_state.stdout_lines | select('search', '@' ~ zfs_autobackup_verify_restore_start_suffix ~ '$') | list | length == 2
      - zfs_autobackup_verify_restore_state.stdout_lines | select('search', '@' ~ zfs_autobackup_verify_restore_middle_suffix ~ '$') | list | length == 2
      - zfs_autobackup_verify_restore_state.stdout_lines | select('search', '@' ~ zfs_autobackup_verify_restore_end_suffix ~ '$') | list | length == 2
      - zfs_autobackup_verify_restore_before_suffix not in zfs_autobackup_verify_restore_state.stdout
    fail_msg: >-
      restore round-trip state mismatch
      (state={{ zfs_autobackup_verify_restore_state.stdout_lines }},
      restore stdout={{ zfs_autobackup_verify_restore_run.stdout }})

- name: _verify | Refuse to restore over the completed target
  command:
    argv:
      - /usr/local/bin/zfs_backup_restore
      - "{{ ansible_user_id }}@127.0.0.1"
      - rpool/zfs_autobackup_restore_replica_test
      - "{{ zfs_autobackup_verify_restore_start_suffix }}"
      - "{{ zfs_autobackup_verify_restore_end_suffix }}"
      - rpool/zfs_autobackup_restore_target_test
      - /mnt/zfs_autobackup_restore_target_test
  args:
    stdin: "y\n"
  changed_when: false
  failed_when: false
  register: zfs_autobackup_verify_restore_refusal

- name: _verify | Existing target refusal is non-destructive
  assert:
    that:
      - zfs_autobackup_verify_restore_refusal.rc != 0
      - "'already contains' in zfs_autobackup_verify_restore_refusal.stderr"

- name: _verify | Restore only the endpoint when it is also the cutoff
  command:
    argv:
      - /usr/local/bin/zfs_backup_restore
      - "{{ ansible_user_id }}@127.0.0.1"
      - rpool/zfs_autobackup_restore_replica_test
      - "{{ zfs_autobackup_verify_restore_end_suffix }}"
      - "{{ zfs_autobackup_verify_restore_end_suffix }}"
      - rpool/zfs_autobackup_restore_single_target_test
      - /mnt/zfs_autobackup_restore_single_target_test
  args:
    stdin: "y\n"
  changed_when: true

- name: _verify | Read single-snapshot restore history
  command: >-
    zfs list -r -t snapshot -H -o name
    rpool/zfs_autobackup_restore_single_target_test
  changed_when: false
  register: zfs_autobackup_verify_single_restore_history
  become: true

- name: _verify | Single-snapshot restore contains only the endpoint
  assert:
    that:
      - zfs_autobackup_verify_single_restore_history.stdout_lines | length == 2
      - zfs_autobackup_verify_restore_before_suffix not in zfs_autobackup_verify_single_restore_history.stdout
      - zfs_autobackup_verify_restore_start_suffix not in zfs_autobackup_verify_single_restore_history.stdout
      - zfs_autobackup_verify_restore_middle_suffix not in zfs_autobackup_verify_single_restore_history.stdout
      - zfs_autobackup_verify_single_restore_history.stdout_lines | select('search', '@' ~ zfs_autobackup_verify_restore_end_suffix ~ '$') | list | length == 2

# Functional check for the freshness dead-man switch: cover a fresh fleet,
# missing snapshots, deliberate retirement, the exact age boundary, and the
# invalid state where no dataset remains protected.
- name: _verify | Freshness check passes while everything is fresh
  command: /usr/local/bin/zfs_backup_freshness
  changed_when: false
  become: true

- name: _verify | Create a tagged dataset with no snapshot (silent-exclusion shape)
  community.general.zfs:
    name: rpool/zfs_autobackup_freshness_test
    state: present
    extra_zfs_properties:
      autobackup:bak: "true"
      mountpoint: none
  become: true

- name: _verify | Freshness check flags the never-snapshotted dataset
  command: /usr/local/bin/zfs_backup_freshness
  changed_when: false
  failed_when: false
  register: zfs_autobackup_verify_freshness_stale
  become: true

- name: _verify | Stale dataset produced a nonzero exit and a STALE line
  assert:
    that:
      - zfs_autobackup_verify_freshness_stale.rc != 0
      - "'STALE: rpool/zfs_autobackup_freshness_test' in zfs_autobackup_verify_freshness_stale.stderr"
    fail_msg: >-
      freshness check did not flag the never-snapshotted dataset
      (rc={{ zfs_autobackup_verify_freshness_stale.rc }},
      stderr={{ zfs_autobackup_verify_freshness_stale.stderr }})

- name: _verify | Retire the snapshot-free dataset from freshness monitoring
  command:
    argv:
      - zfs
      - set
      - autobackup:bak=false
      - rpool/zfs_autobackup_freshness_test
  changed_when: true
  become: true

- name: _verify | Freshness check skips a deliberately retired dataset
  command: /usr/local/bin/zfs_backup_freshness
  changed_when: false
  become: true

- name: _verify | List currently enabled backup datasets
  shell: |
    set -euo pipefail
    zfs get -t filesystem -H -o name,value autobackup:bak | awk -F '\t' '$2 == "true" {print $1}'
  args:
    executable: /bin/bash
  changed_when: false
  register: zfs_autobackup_verify_enabled_datasets
  become: true

- name: _verify | Disable every enabled tag except the boundary-test dataset
  command:
    argv:
      - zfs
      - set
      - autobackup:bak=false
      - "{{ item }}"
  changed_when: true
  when: item != 'rpool/zfs_autobackup_test'
  loop: "{{ zfs_autobackup_verify_enabled_datasets.stdout_lines }}"
  become: true

- name: _verify | Read the boundary-test snapshot creation time
  shell: |
    set -euo pipefail
    zfs list -t snapshot -H -p -o name,creation -s creation rpool/zfs_autobackup_test |
      awk -F '\t' '$1 ~ /@bak-/ {c = $2} END {print c}'
  args:
    executable: /bin/bash
  changed_when: false
  register: zfs_autobackup_verify_boundary_creation
  become: true

- name: _verify | Snapshot exactly at the age limit is fresh
  command: /usr/local/bin/zfs_backup_freshness
  environment:
    MAX_AGE_SECONDS: "0"
    NOW_SECONDS: "{{ zfs_autobackup_verify_boundary_creation.stdout }}"
  changed_when: false
  become: true

- name: _verify | Snapshot one second beyond the age limit is stale
  command: /usr/local/bin/zfs_backup_freshness
  environment:
    MAX_AGE_SECONDS: "0"
    NOW_SECONDS: "{{ zfs_autobackup_verify_boundary_creation.stdout | int + 1 }}"
  changed_when: false
  failed_when: false
  register: zfs_autobackup_verify_boundary_stale
  become: true

- name: _verify | Age boundary produced the expected stale result
  assert:
    that:
      - zfs_autobackup_verify_boundary_stale.rc != 0
      - "'STALE: rpool/zfs_autobackup_test' in zfs_autobackup_verify_boundary_stale.stderr"

- name: _verify | Disable the final enabled backup tag
  command:
    argv:
      - zfs
      - set
      - autobackup:bak=false
      - rpool/zfs_autobackup_test
  changed_when: true
  become: true

- name: _verify | Freshness check rejects an empty protected set
  command: /usr/local/bin/zfs_backup_freshness
  changed_when: false
  failed_when: false
  register: zfs_autobackup_verify_no_enabled_datasets
  become: true

- name: _verify | Empty protected set failed loudly
  assert:
    that:
      - zfs_autobackup_verify_no_enabled_datasets.rc != 0
      - "'no datasets have autobackup:bak=true' in zfs_autobackup_verify_no_enabled_datasets.stderr"

- name: _verify | Restore enabled backup tags
  command:
    argv:
      - zfs
      - set
      - autobackup:bak=true
      - "{{ item }}"
  changed_when: true
  loop: "{{ zfs_autobackup_verify_enabled_datasets.stdout_lines }}"
  become: true

- name: _verify | Drop the freshness-test dataset
  community.general.zfs:
    name: rpool/zfs_autobackup_freshness_test
    state: absent
  become: true
