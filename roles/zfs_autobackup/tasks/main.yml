- name: Assert backup inputs are configured
  assert:
    that:
      - zfs_autobackup_ssh_public_key | default('') | length > 0
      - zfs_autobackup_sources is defined
      - zfs_autobackup_sources | map(attribute='host', default='') | reject('in', external_ips) | list == []
      - zfs_autobackup_sources | map(attribute='dest_dataset', default='') | reject | list == []
    fail_msg: >-
      zfs_autobackup_ssh_public_key must be a non-empty string and
      zfs_autobackup_sources a list of { host, dest_dataset } dicts whose host
      is in external_ips.
  tags:
    - zfs_autobackup

- name: Manage the backup SSH identity
  import_tasks: identity.yml
  tags:
    - zfs_autobackup

- name: Install zfs autobackup dependencies
  apt:
    package:
      - pipx
      - mbuffer
      - rsync
    cache_valid_time: 3600
  become: true
  register: _zfs_autobackup_apt
  tags:
    - zfs_autobackup

- name: Check zfs-autobackup version
  command: /usr/local/bin/zfs-autobackup --version
  register: _zfs_autobackup_version_check
  changed_when: false
  failed_when: false
  become: true
  tags:
    - zfs_autobackup

- name: Install zfs-autobackup via pipx
  when: >-
    not (ansible_check_mode and _zfs_autobackup_apt.changed)
    and ('v' ~ zfs_autobackup_version)
        not in (_zfs_autobackup_version_check.stdout | default('')).split()
  command: pipx install --force "zfs-autobackup=={{ zfs_autobackup_version }}"
  changed_when: true
  environment:
    PIPX_HOME: /opt/pipx
    PIPX_BIN_DIR: /usr/local/bin
  become: true
  tags:
    - zfs_autobackup

- name: Manage zfs_autosnapshot.target
  import_role:
    name: systemd_unit
    tasks_from: unit
  vars:
    systemd_unit_args:
      src: zfs_autosnapshot.target
  tags:
    - zfs_autobackup

# Root-owned offsite change-gate state: one marker file per dataset recording
# the snapshot last confirmed on bunk (see zfs_backup_offsite.sh). Kept out of
# the zfs_autobackup user's home (/var/lib/zfs_autobackup) so the backup user
# can't tamper with the gate.
- name: Create offsite marker directory
  file:
    dest: /var/lib/zfs_backup_offsite
    state: directory
    owner: root
    group: root
    mode: "0700"
  become: true
  tags:
    - zfs_autobackup

- name: Configure backup SSH client
  copy:
    src: ssh_config
    dest: /etc/zfs_autobackup_ssh_config
    owner: root
    group: root
    mode: "0600"
    backup: true
    validate: ssh -G -F %s localhost
  become: true
  tags:
    - zfs_autobackup

- name: Copy the backup scripts
  copy:
    src: "{{ item }}.sh"
    dest: "/usr/local/bin/{{ item }}"
    mode: "0755"
    owner: root
    group: root
    backup: true
    validate: bash -n %s
  loop:
    - zfs_backup_local
    - zfs_backup_onsite
    - zfs_backup_offsite
    - zfs_backup_freshness
  register: zfs_autobackup_scripts
  become: true
  tags:
    - zfs_autobackup

- name: Copy the restore program
  copy:
    src: zfs_backup_restore.py
    dest: /usr/local/bin/zfs_backup_restore
    mode: "0755"
    owner: root
    group: root
    backup: true
    validate: python3 -m py_compile %s
  become: true
  tags:
    - zfs_autobackup

# The offsite change-gate skips rsync while a dataset's written@ stays 0, so a
# change to zfs_backup_offsite.sh -- the rsync excludes/flags or the gate logic
# itself -- would otherwise not take effect on unchanged datasets until their
# next write or the 30-day reconcile. (Most pointed for a future secret-spill
# exclude: already-shipped files would linger on bunk meanwhile.) Drop the
# markers whenever that script changes so the next run re-establishes every
# baseline under the new policy. The dir survives (recreated above and needed
# for the marker write); -delete on an empty dir is a no-op.
- name: Force an offsite reconcile when the offsite script changed
  command: find /var/lib/zfs_backup_offsite -mindepth 1 -delete
  changed_when: true
  when: >-
    zfs_autobackup_scripts.results
    | selectattr('item', 'equalto', 'zfs_backup_offsite')
    | selectattr('changed')
    | list | length > 0
  become: true
  tags:
    - zfs_autobackup

- name: Copy the snapshot script
  template:
    src: zfs_autosnapshot.sh.j2
    dest: /usr/local/bin/zfs_autosnapshot
    mode: "0755"
    owner: root
    group: root
    backup: true
    validate: bash -n %s
  become: true
  tags:
    - zfs_autobackup

# Snapshots, pulls, and the freshness check all need a pool. A host without
# one (a non-ZFS root with no data pools) has nothing to back up or receive,
# so it keeps the identity and tooling but schedules no timer that would fail
# every night. Lists every imported pool, not just rpool: a data pool alone
# makes the host a snapshot and pull source.
- name: List the imported pools
  command: zpool list -H -o name
  register: zfs_autobackup_pools
  changed_when: false
  check_mode: false
  become: true
  tags:
    - zfs_autobackup

# Nightly schedule: every host snapshots at 02:00 plus a randomized offset of
# up to 5min, which the helper pins per host so the ordering is reproducible,
# then pulls its sources at 02:15. Snapshotting finishes within about a minute,
# so every source has its new @bak- by then; a pull that still runs first copies
# the previous night, which the next pull catches up. lab pulls from pug and
# pug from lab, each pull waking the other's disks, so keeping both legs inside
# one hd-idle spindown window (-i 1200, 20min, on their HDDs) holds each host
# to a single spin-up a night.
#
# Snapshotting hundreds of datasets or a first pull of a large source can run
# for hours, so both units override the helper's 1h timeout with 23h, which
# still ends before the next fire. Both set HOME because mbuffer reads
# ~/.mbuffer and, with no HOME (systemd oneshots inherit none), warns
# "HOME environment variable not set" on every stream.
- name: Schedule the zfs_autosnapshot timer
  import_role:
    name: systemd_timer
    tasks_from: install
  vars:
    systemd_timer_args:
      name: zfs_autosnapshot
      condition: "{{ zfs_autobackup_pools.stdout_lines | length > 0 }}"
      description: Daily ZFS autosnapshot
      on_calendar: "*-*-* 02:00:00"
      randomized_delay_sec: 300
      exec_start: /usr/local/bin/zfs_autosnapshot
      timeout_start_sec: 23h
      environment:
        HOME: /root
  tags:
    - zfs_autobackup

- name: Schedule the zfs_backup_pull timer
  import_role:
    name: systemd_timer
    tasks_from: install
  vars:
    systemd_timer_args:
      name: zfs_backup_pull
      condition: "{{ zfs_autobackup_pools.stdout_lines | length > 0 and zfs_autobackup_sources | length > 0 }}"
      description: Daily ZFS onsite pull
      on_calendar: "*-*-* 02:15:00"
      exec_start: /usr/local/bin/zfs_autosnapshot --pull
      timeout_start_sec: 23h
      environment:
        HOME: /root
  tags:
    - zfs_autobackup

# Data-level dead-man switch behind the nightly (see the script header):
# every tagged dataset must carry a fresh @bak-. 10:00 leaves the 02:00 run
# ample time to finish; a failure fails this unit, which the netdata
# systemd-units alert pages on like any other failed unit.
- name: Schedule the zfs_backup_freshness timer
  import_role:
    name: systemd_timer
    tasks_from: install
  vars:
    systemd_timer_args:
      name: zfs_backup_freshness
      condition: "{{ zfs_autobackup_pools.stdout_lines | length > 0 }}"
      description: Daily ZFS backup freshness check
      on_calendar: "*-*-* 10:00:00"
      exec_start: /usr/local/bin/zfs_backup_freshness
  tags:
    - zfs_autobackup

- name: Configure host as a source for backups
  import_tasks: source.yml
  tags:
    - zfs_autobackup

- name: Configure host as a destination for backups
  import_tasks: dest.yml
  tags:
    - zfs_autobackup
