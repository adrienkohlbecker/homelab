- name: source | Create zfs_autobackup service user
  import_role:
    name: service_user
    tasks_from: user
  vars:
    service_user_args:
      name: zfs_autobackup
      shell: /bin/bash
      createhome: true
      home: /var/lib/zfs_autobackup
      config_dir: false
  tags:
    - zfs_autobackup

- name: source | Configure backup login
  when: not ansible_check_mode or zfs_autobackup_user.uid is defined
  become: true
  tags:
    - zfs_autobackup
  block:
    - name: source | Add authorized keys
      ansible.posix.authorized_key:
        user: zfs_autobackup
        key: "{{ zfs_autobackup_ssh_public_key }}"
        # restrict denies all current and future SSH features (pty, all
        # forwarding, user-rc, etc.), so new OpenSSH primitives cannot leak in
        # via an outdated allowlist.
        key_options: "restrict"
        exclusive: true

    - name: source | Create zfs_autobackup user systemd unit dir
      file:
        path: /var/lib/zfs_autobackup/.config/systemd/user
        state: directory
        owner: zfs_autobackup
        group: zfs_autobackup
        mode: "0755"

    # zfs_autobackup is a backup-only login user; it never runs containers. The
    # podman package globally enables podman.service/podman.socket for every user
    # (/etc/systemd/user/{default.target,sockets.target}.wants), so each login
    # starts a pointless rootless API socket that fails without subuid ranges.
    - name: source | Mask podman user units for zfs_autobackup
      file:
        path: "/var/lib/zfs_autobackup/.config/systemd/user/{{ item }}"
        src: /dev/null
        state: link
        owner: zfs_autobackup
        group: zfs_autobackup
        # lchown the link itself; following it would chown the shared /dev/null.
        follow: false
        force: true
      loop:
        - podman.service
        - podman.socket

- name: source | Configure backup dataset permissions
  when: not qemu_test_minimal
  become: true
  tags:
    - zfs_autobackup
  block:
    # The permission machinery runs everywhere ZFS exists; only the minimal
    # ext4 fixture is excluded.
    - name: source | Get backed-up datasets
      shell: set -euo pipefail; zfs get 'autobackup:bak' -t filesystem -H -s local -o name,value | awk -v FS='\t' '$2=="true" {print $1}'
      args:
        executable: /bin/bash
      changed_when: false
      register: _zfs_autobackup_datasets

    - name: source | Grant ZFS permissions on backed-up datasets
      community.general.zfs_delegate_admin:
        name: "{{ item }}"
        users:
          - zfs_autobackup
        permissions:
          - send
          - hold
          - release
      loop: "{{ _zfs_autobackup_datasets.stdout_lines }}"
