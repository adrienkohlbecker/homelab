- name: Install locale data
  apt:
    pkg:
      - locales
      - tzdata
    cache_valid_time: 3600
  become: true
  register: locale_apt
  tags:
    - locale

- name: Set up locales
  when: not (ansible_check_mode and locale_apt.changed)
  community.general.locale_gen:
    name: en_US.UTF-8
  become: true
  tags:
    - locale

- name: Configure timezone
  when: not (ansible_check_mode and locale_apt.changed)
  community.general.timezone:
    name: Etc/UTC
    # Tell systemd the RTC is in UTC (timedatectl set-local-rtc 0) so the kernel
    # applies no local-time offset -- explicit rather than relying on the
    # installer default. On the RTC-less qemu/VPS guests this is just the systemd
    # flag, with no hardware clock to write.
    hwclock: UTC
  become: true
  tags:
    - locale

- name: Set default locale
  copy:
    # LANG alone is the system default -- it cascades to every unset LC_*
    # category. We deliberately set nothing else: LC_ALL is a transient
    # debugging override (system-wide it masks every per-shell/per-service
    # locale choice), and LANGUAGE is a gettext message-priority list, not
    # a locale. `_verify.yml` asserts neither creeps back in.
    content: "#  File generated by update-locale\nLANG=en_US.UTF-8\n"
    dest: /etc/locale.conf
    validate: sh -n %s
    backup: true
    owner: root
    group: root
    mode: "0644"
  become: true
  register: locale_cfg
  tags:
    - locale

- name: Ask to reboot
  when: locale_cfg.changed
  file:
    path: /var/run/reboot-required
    state: touch
    owner: root
    group: root
    mode: "0644"
  become: true
  tags:
    - locale
