# Exercise the production repair path after the normal idempotence pass has
# already covered an unchanged locale file.
- name: _verify | Remove any existing reboot marker
  file:
    path: /var/run/reboot-required
    state: absent
  become: true

- name: _verify | Drift the default locale
  copy:
    content: "LANG=C.UTF-8\n"
    dest: /etc/locale.conf
    backup: true
    owner: root
    group: root
    mode: "0644"
  become: true

- name: _verify | Reconcile the locale through the production tasks
  import_tasks: main.yml

- name: _verify | Inspect the reboot marker
  stat:
    path: /var/run/reboot-required
  register: locale_verify_reboot_marker

- name: _verify | Locale repair requested a reboot
  assert:
    that: locale_verify_reboot_marker.stat.exists

# Load the file PAM reads, without inherited locale overrides masking it.
# An unavailable locale can return zero, so reject warnings and non-UTF-8 output.
- name: _verify | Configured default is unmasked UTF-8
  shell: |
    set -euo pipefail
    unset LANG LANGUAGE "${!LC_@}"
    set -a
    source /etc/default/locale
    test "${LANG-}" = en_US.UTF-8
    test -z "${LC_ALL+x}${LANGUAGE+x}"
    locale charmap
  args:
    executable: /bin/bash
  register: locale_verify_charmap
  changed_when: false
  failed_when: >-
    locale_verify_charmap.rc != 0 or
    locale_verify_charmap.stdout != 'UTF-8' or
    locale_verify_charmap.stderr != ''
  become: true

# Exercise systemd's parser; tolerate label spacing but anchor the LANG value.
- name: _verify | System default locale is LANG=en_US.UTF-8
  command: localectl status
  register: locale_verify_localectl
  changed_when: false
  failed_when: >-
    locale_verify_localectl.rc != 0 or
    locale_verify_localectl.stdout | regex_findall('^\s*System Locale:\s+LANG=en_US\.UTF-8$', multiline=True) | length != 1
  become: true

# Exercise libc independently of the timezone module's systemd/RTC checks.
- name: _verify | Libc timezone is UTC
  command: date +%Z
  register: locale_verify_timezone
  changed_when: false
  failed_when: locale_verify_timezone.rc != 0 or locale_verify_timezone.stdout != 'UTC'
