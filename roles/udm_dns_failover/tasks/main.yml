# Provisions keepalived on the UDM Pro as a last-resort DNS VIP failover peer.
# When the UDM claims the VIP, its own dnsmasq (which binds every address on
# br0) automatically serves DNS on it — no separate resolver needed.
#
# Config, healthcheck and heartbeat units live in /etc, which firmware updates
# keep -- the udm_on_boot framework's own unit relies on the same guarantee.
# Firmware does wipe /usr, so an on-boot script reinstalls the apt package.
#
# This role targets the UDM only (hosts: udm in site.yml). The UDM is not
# a standard Ubuntu host — it runs UniFi OS (Debian bullseye, SquashFS root,
# overlay /etc/). No handlers, no systemd_unit helper, no podman.
#
# The heartbeat timer is hand-rolled rather than via the systemd_timer
# helper: the helper's netdata cadence alerting has nothing to attach to (no
# netdata on the UDM). The Kuma push heartbeat below is this peer's alerting
# channel instead.
- name: Validate required variables
  assert:
    that:
      - udm_dns_failover_heartbeat_url is defined
      # The heartbeat template appends ?status=up / ?status=down, so the
      # stored value must be the bare Kuma push endpoint with no query of
      # its own -- a full copied push URL (…?status=up&msg=…) would render
      # …?status=up&msg=…?status=down and Kuma would read the first status.
      - udm_dns_failover_heartbeat_url is not search('[?]')
    fail_msg: >-
      udm_dns_failover requires udm_dns_failover_heartbeat_url set to the bare
      Kuma push endpoint, without a query string.
  tags:
    - udm_dns_failover

# -- keepalived (apt) -----------------------------------------------------

# The same install the on-boot script runs after a firmware wipe: no role
# maintains the appliance's package cache, so refresh it first. In check mode
# `creates` reports a pending install on a fresh host without running it.
- name: Install keepalived  # noqa: command-instead-of-module -- mirrors files/on-boot-keepalived.sh
  shell: |
    set -euo pipefail
    apt-get update -qq
    apt-get install -y -qq keepalived
  args:
    executable: /bin/bash
    creates: /usr/sbin/keepalived
  register: udm_dns_failover_keepalived_install
  become: true
  tags:
    - udm_dns_failover

# -- configuration files --------------------------------------------------

- name: Create keepalived config directory
  file:
    path: /etc/keepalived
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true
  tags:
    - udm_dns_failover

- name: Deploy healthcheck script
  copy:
    src: healthcheck.sh
    dest: /etc/keepalived/dnsmasq_healthcheck
    owner: root
    group: root
    mode: "0755"
    backup: true
    validate: bash -n %s
  become: true
  tags:
    - udm_dns_failover

- name: Deploy keepalived config
  template:
    src: keepalived.conf.j2
    dest: /etc/keepalived/keepalived.conf
    owner: root
    group: root
    mode: "0640"
    backup: true
    validate: /usr/sbin/keepalived -t -f %s
  register: udm_dns_failover_conf
  become: true
  tags:
    - udm_dns_failover

- name: Enable ip_nonlocal_bind
  ansible.posix.sysctl:
    name: net.ipv4.ip_nonlocal_bind
    value: '1'
    sysctl_file: /etc/sysctl.d/30-keepalived.conf
    sysctl_set: true
  become: true
  tags:
    - udm_dns_failover

- name: Deploy on-boot keepalived script
  copy:
    src: on-boot-keepalived.sh
    dest: /data/on_boot.d/30-keepalived.sh
    owner: root
    group: root
    mode: "0755"
    backup: true
    validate: bash -n %s
  become: true
  tags:
    - udm_dns_failover

# 0640: the rendered unit embeds the Kuma push URL (a bearer
# token), so it must not be world-readable.
- name: Deploy heartbeat service
  template:
    src: udm_keepalived_heartbeat.service.j2
    dest: /etc/systemd/system/udm_keepalived_heartbeat.service
    owner: root
    group: root
    mode: "0640"
    backup: true
    validate: >-
      sh -c 'd=$(mktemp -d); trap "rm -rf $d" EXIT; cp "%s" "$d/udm_keepalived_heartbeat.service"; systemd-analyze verify "$d/udm_keepalived_heartbeat.service"'
  register: udm_dns_failover_heartbeat_service
  become: true
  tags:
    - udm_dns_failover

- name: Deploy heartbeat timer
  copy:
    src: udm_keepalived_heartbeat.timer
    dest: /etc/systemd/system/udm_keepalived_heartbeat.timer
    owner: root
    group: root
    mode: "0644"
    backup: true
    validate: >-
      sh -c 'd=$(mktemp -d); trap "rm -rf $d" EXIT; cp "%s" "$d/udm_keepalived_heartbeat.timer"; systemd-analyze verify "$d/udm_keepalived_heartbeat.timer"'
  register: udm_dns_failover_heartbeat_timer
  become: true
  tags:
    - udm_dns_failover

# -- services ---------------------------------------------------------------

# Check-mode guard: on a fresh host apt hasn't installed keepalived yet, so
# a check-mode start can't find the unit. On a converged host the install is
# a no-op and the start/reload idempotence check still runs under --check.
- name: Start keepalived
  when: not (ansible_check_mode and udm_dns_failover_keepalived_install.changed)
  systemd:
    name: keepalived.service
    state: "{{ udm_dns_failover_conf.changed | ternary('reloaded', 'started') }}"
    enabled: true
  become: true
  tags:
    - udm_dns_failover

# In check mode on a fresh host the timer unit is only predicted, so
# systemd cannot find it yet.
- name: Enable heartbeat timer
  when: not (ansible_check_mode and udm_dns_failover_heartbeat_timer.changed)
  systemd:
    name: udm_keepalived_heartbeat.timer
    state: started
    enabled: true
    daemon_reload: "{{ udm_dns_failover_heartbeat_service.changed or udm_dns_failover_heartbeat_timer.changed }}"
  become: true
  tags:
    - udm_dns_failover

# Remove the /data master copies and the healthcheck link from the layout
# that symlinked them into /etc and /usr. retired_services does not run on
# the UDM, so the cleanup lives here; drop it once the UDM has converged.
- name: Remove the superseded persistent keepalived layout
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /usr/local/bin/dnsmasq_healthcheck
    - /data/keepalived
  become: true
  tags:
    - udm_dns_failover
