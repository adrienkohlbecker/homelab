- name: Install keepalived
  apt:
    pkg:
      - keepalived
    policy_rc_d: 101
    cache_valid_time: 3600
  register: keepalived_apt
  become: true
  tags:
    - keepalived

- name: Remove keepalived log override
  import_role:
    name: systemd_unit
    tasks_from: remove
  vars:
    systemd_unit_args:
      for: keepalived.service
      condition: "{{ not (ansible_check_mode and keepalived_apt.changed) }}"
  tags:
    - keepalived

# Services must bind the DNS VIP on a BACKUP node before it owns the address.
- name: Install ip_nonlocal_bind sysctl
  ansible.posix.sysctl:
    name: net.ipv4.ip_nonlocal_bind
    value: '1'
    sysctl_file: /etc/sysctl.d/30-keepalived.conf
    sysctl_set: true
  become: true
  tags:
    - keepalived

# The vmac exists only after keepalived starts, so configure it at creation.
- name: Install vrrp martian-logging udev rule  # noqa: require-validate
  copy:
    src: 99-vrrp-martians.rules
    dest: /etc/udev/rules.d/99-vrrp-martians.rules
    owner: root
    group: root
    mode: "0644"
    backup: true
  register: keepalived_martians_rule
  become: true
  tags:
    - keepalived

- name: Reload and apply vrrp martian-logging udev rule
  when: keepalived_martians_rule.changed
  shell: |
    set -euo pipefail
    udevadm control --reload
    udevadm trigger --action=add --subsystem-match=net --sysname-match="vrrp*"
    udevadm settle
  args:
    executable: /bin/bash
  changed_when: true
  become: true
  tags:
    - keepalived

- name: Configure the AdGuard health script
  template:
    src: adguard_healthcheck.sh.j2
    dest: /usr/local/bin/adguard_healthcheck
    owner: root
    group: root
    mode: "0755"
    backup: true
    validate: bash -n %s
  become: true
  tags:
    - keepalived

- name: Render the DNS keepalived configuration
  template:
    src: keepalived.conf.j2
    dest: /etc/keepalived/keepalived.conf
    owner: root
    group: root
    mode: "0640"
    backup: true
    validate: >-
      {{ '/usr/sbin/keepalived -t -f %s'
         if not (ansible_check_mode and keepalived_apt.changed)
         else omit }}
  register: keepalived_config
  become: true
  tags:
    - keepalived

# Serialize config reloads so the DNS peers never release the VIP together.
- name: Enable keepalived service
  when: not (ansible_check_mode and keepalived_apt.changed)
  systemd:
    name: keepalived.service
    enabled: true
    state: >-
      {{ 'reloaded'
         if keepalived_config.changed
            or keepalived_service_d_override_conf_result.changed
         else 'started' }}
  become: true
  throttle: 1
  tags:
    - keepalived
