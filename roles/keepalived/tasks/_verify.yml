- name: _verify | Query keepalived state
  systemd:
    name: keepalived
  register: _keepalived_unit
  become: true

- name: _verify | Keepalived is active and enabled
  assert:
    that:
      - _keepalived_unit.status.ActiveState == 'active'
      - _keepalived_unit.status.UnitFileState == 'enabled'

# Force the role-owned template to change and prove the service reload is
# hitless: a reload preserves ActiveEnterTimestampMonotonic, unlike a restart.
- name: _verify | Perturb the installed configuration
  lineinfile:
    path: /etc/keepalived/keepalived.conf
    line: "# _verify reload perturbation"
    insertafter: EOF
  become: true

- name: _verify | Re-run keepalived to exercise the reload path
  import_role:
    name: keepalived

- name: _verify | Query keepalived after reload
  systemd:
    name: keepalived
  register: _keepalived_unit_reloaded
  become: true

- name: _verify | Reload kept the daemon active without restarting it
  assert:
    that:
      - _keepalived_unit_reloaded.status.ActiveState == 'active'
      - >-
        _keepalived_unit_reloaded.status.ActiveEnterTimestampMonotonic ==
        _keepalived_unit.status.ActiveEnterTimestampMonotonic

- name: _verify | Exercise the vrrp martian udev rule end-to-end
  become: true
  block:
    - name: _verify | Create a vrrp-named macvlan
      command: ip link add vrrp.99 link {{ ansible_default_ipv4.interface }} type macvlan mode private
      changed_when: false

    - name: _verify | Settle udev
      command: udevadm settle
      changed_when: false

    - name: _verify | Read log_martians on the vrrp iface
      command: cat /proc/sys/net/ipv4/conf/vrrp.99/log_martians
      register: _keepalived_vrrp_martians
      changed_when: false

    - name: _verify | Martian logging is disabled on the vrrp iface
      assert:
        that:
          - _keepalived_vrrp_martians.stdout == '0'
  always:
    - name: _verify | Remove the throwaway vrrp iface
      command: ip link del vrrp.99
      changed_when: false
      failed_when: false
