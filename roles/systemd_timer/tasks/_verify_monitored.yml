# Contracts 3+4: system-scope timers write netdata metadata
# with period_secs derived from on_calendar, and the systemd_timers charts.d
# collector emits a chart per timer with age_secs / overdue tracking read
# from the persistent trigger stamp (/var/lib/systemd/timers/stamp-*.timer).
#
# Split into its own file (imported from _verify.yml) only to keep that file
# readable -- the collector rides netdata-plugin-chartsd, which is part of
# netdata's multi-arch 2.x repo, so this runs on the arm64 box as well as
# x86_64.
#
# Both fixtures use the same hourly OnCalendar, are stopped so systemd can't
# fire them and rewrite the stamp underneath us, then have their stamps planted
# directly: recent => mtime 90m ago (below the two-period overdue threshold),
# overdue => mtime 3h ago (above it). Faking the stamp keeps the test
# deterministic while exercising exactly what the collector reads.

# ============================================================
# Contract 3+4: monitored timer + overdue detection via netdata
# ============================================================
- name: _verify | Install recent monitored fixture (hourly)
  import_role:
    name: systemd_timer
    tasks_from: install
  vars:
    systemd_timer_args:
      name: _verify_timer_recent
      description: monitored fixture, recent stamp
      on_calendar: "*-*-* *:00:00"
      exec_start: /bin/true

- name: _verify | Install overdue monitored fixture (hourly)
  import_role:
    name: systemd_timer
    tasks_from: install
  vars:
    systemd_timer_args:
      name: _verify_timer_overdue
      description: monitored fixture, stale stamp
      on_calendar: "*-*-* *:00:00"
      exec_start: /bin/true

# Stop both timers so systemd won't fire them and overwrite the stamps we
# plant below.
- name: _verify | Stop fixture timers to freeze their stamps
  systemd:
    name: "{{ item }}.timer"
    state: stopped
  loop:
    - _verify_timer_recent
    - _verify_timer_overdue
  become: true

- name: _verify | Plant a 90-minute stamp for the recent fixture
  command: touch -d "90 minutes ago" /var/lib/systemd/timers/stamp-_verify_timer_recent.timer
  changed_when: false
  become: true

- name: _verify | Plant a stale stamp (3h ago) for the overdue fixture
  command: touch -d "3 hours ago" /var/lib/systemd/timers/stamp-_verify_timer_overdue.timer
  changed_when: false
  become: true

# Charts.d.plugin re-scans the metadata dir each tick (update_every=5s
# under our override). Wait for both charts to appear in netdata's
# registry, then check the data API for the expected age + overdue.
- name: _verify | Wait for both fixture charts to register
  uri:
    # Per-chart endpoint (404 until the chart appears) keeps the response a few
    # hundred bytes. /api/v1/charts returns netdata's whole registry — every
    # per-unit systemdunits chart — and a retried task dumps its full body into
    # the job log, which blew past GitLab's 4 MB trace cap.
    url: "http://localhost:19999/api/v1/chart?chart={{ item }}"
    status_code: 200
  register: _systemd_timer_charts
  retries: 30
  delay: 2
  until: _systemd_timer_charts.status == 200
  loop:
    - systemd_timers.verify_timer_recent
    - systemd_timers.verify_timer_overdue

- name: _verify | Fixture data reports expected freshness
  uri:
    url: "http://localhost:19999/api/v1/data?chart={{ item.chart }}&points=1&after=-30&format=json"
    return_content: true
  register: _systemd_timer_fixture_data
  retries: 30
  delay: 2
  until: >-
    _systemd_timer_fixture_data.status == 200
    and 'overdue' in (_systemd_timer_fixture_data.json.labels | default([]))
    and 'age_secs' in (_systemd_timer_fixture_data.json.labels | default([]))
    and (_systemd_timer_fixture_data.json.data | default([])) | length > 0
    and _systemd_timer_fixture_data.json.data[0][_systemd_timer_fixture_data.json.labels.index('overdue')] | int == item.overdue
    and _systemd_timer_fixture_data.json.data[0][_systemd_timer_fixture_data.json.labels.index('age_secs')] | int > item.min_age
    and _systemd_timer_fixture_data.json.data[0][_systemd_timer_fixture_data.json.labels.index('age_secs')] | int < item.max_age
  loop:
    - chart: systemd_timers.verify_timer_recent
      overdue: 0
      min_age: 4800
      max_age: 6600
    - chart: systemd_timers.verify_timer_overdue
      overdue: 1
      min_age: 7200
      max_age: 14400
  loop_control:
    label: "{{ item.chart }}"

# Alert binds on context systemd.timer_lag; netdata keys the instance
# as <chart_id>.<template_name>, e.g.
# systemd_timers.verify_timer_overdue.systemd_timer_overdue.
- name: _verify | Wait for overdue alert to register against the fixture
  uri:
    url: http://localhost:19999/api/v1/alarms?all
    return_content: true
  register: _systemd_timer_alarms
  retries: 30
  delay: 2
  until: >-
    _systemd_timer_alarms.status == 200
    and _systemd_timer_alarms.json.alarms.keys() | list
        | select('search', 'systemd_timers.verify_timer_recent.systemd_timer_overdue') | list | length > 0
    and _systemd_timer_alarms.json.alarms.keys() | list
        | select('search', 'systemd_timers.verify_timer_overdue.systemd_timer_overdue') | list | length > 0

- name: _verify | Assert overdue alert uses an uptime state guard
  vars:
    _alarm: >-
      {{
        (_systemd_timer_alarms.json.alarms.values()
         | selectattr('name', 'equalto', 'systemd_timer_overdue')
         | first)
        | default({})
      }}
  assert:
    that:
      - _alarm.recipient | default('') == "sysadmin"
      - "'system.uptime.uptime' in (_alarm.crit | default(''))"
      - _alarm.delay_up_duration | default(0) == 0
      - _alarm.delay_down_duration | default(0) == 600
    fail_msg: >-
      Expected systemd_timer_overdue to suppress alert state during the first
      35 minutes of host uptime without an up-notification delay. Got:
      {{ _alarm }}

# Cleanup: remove fixtures so a follow-on test run starts clean.
# Two separate import_role calls instead of a loop — import_role
# doesn't accept `loop:`, and include_role + loop binds the vars
# block once (per [[feedback_include_role_loop_vars]]) so {{ item }}
# inside systemd_timer_args wouldn't re-evaluate per iteration.
- name: _verify | Remove recent monitored fixture
  import_role:
    name: systemd_timer
    tasks_from: remove
  vars:
    systemd_timer_args:
      name: _verify_timer_recent
- name: _verify | Remove overdue monitored fixture
  import_role:
    name: systemd_timer
    tasks_from: remove
  vars:
    systemd_timer_args:
      name: _verify_timer_overdue

# Asserts both the metadata cleanup and remove.yml's persistent-stamp drop.
- name: _verify | Stat metadata + stamp files after removal (should NOT exist)
  stat:
    path: "{{ item }}"
  loop:
    - /etc/netdata/charts.d/systemd_timers.d/_verify_timer_recent.conf
    - /etc/netdata/charts.d/systemd_timers.d/_verify_timer_overdue.conf
    - /var/lib/systemd/timers/stamp-_verify_timer_recent.timer
    - /var/lib/systemd/timers/stamp-_verify_timer_overdue.timer
  register: _systemd_timer_meta_after
  become: true
- name: _verify | Assert metadata + stamps cleaned up
  assert:
    that:
      - not item.stat.exists
    fail_msg: "{{ item.item }} still present after remove"
  loop: "{{ _systemd_timer_meta_after.results }}"
  loop_control:
    label: "{{ item.item }}"
