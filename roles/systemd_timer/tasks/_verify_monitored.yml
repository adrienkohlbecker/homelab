# Contracts 3+4: system-scope timers write netdata metadata
# with period_secs derived from on_calendar, and the systemd_timers charts.d
# collector emits a chart per timer with age_secs / overdue tracking read
# from the persistent trigger stamp (/var/lib/systemd/timers/stamp-*.timer).
#
# Split into its own file (imported from _verify.yml) only to keep that file
# readable -- the collector rides netdata-plugin-chartsd, which is part of
# netdata's multi-arch 2.x repo, so this runs on the arm64 box as well as
# x86_64.
#
# The fixture uses an hourly OnCalendar and is stopped so systemd cannot rewrite
# its stamp underneath us. Moving that stamp from 90 minutes old to three hours
# old exercises both sides of the two-period overdue threshold deterministically.

# ============================================================
# Contract 3+4: monitored timer + overdue detection via netdata
# ============================================================
- name: _verify | Install monitored fixture (hourly)
  import_role:
    name: systemd_timer
    tasks_from: install
  vars:
    systemd_timer_args:
      name: _verify_timer_monitored
      description: monitored timer fixture
      on_calendar: "*-*-* *:00:00"
      exec_start: /bin/true

- name: _verify | Stop fixture timer to freeze its stamp
  systemd:
    name: _verify_timer_monitored.timer
    state: stopped
  become: true

- name: _verify | Plant a 90-minute stamp for the recent fixture
  command: touch -d "90 minutes ago" /var/lib/systemd/timers/stamp-_verify_timer_monitored.timer
  changed_when: false
  become: true

# Charts.d.plugin re-scans the metadata dir each tick (update_every=5s
# under our override). Wait for the chart to appear in netdata's registry.
- name: _verify | Wait for fixture chart to register
  uri:
    # Per-chart endpoint (404 until the chart appears) keeps the response a few
    # hundred bytes. /api/v1/charts returns netdata's whole registry — every
    # per-unit systemdunits chart — and a retried task dumps its full body into
    # the job log, which blew past GitLab's 4 MB trace cap.
    url: http://localhost:19999/api/v1/chart?chart=systemd_timers.verify_timer_monitored
    status_code: 200
  register: _systemd_timer_chart
  retries: 30
  delay: 2
  until: _systemd_timer_chart.status == 200

- name: _verify | Fixture data reports recent stamp as healthy
  uri:
    url: http://localhost:19999/api/v1/data?chart=systemd_timers.verify_timer_monitored&points=1&after=-30&format=json
    return_content: true
  register: _systemd_timer_recent_data
  retries: 30
  delay: 2
  until: >-
    _systemd_timer_recent_data.status == 200
    and 'overdue' in (_systemd_timer_recent_data.json.labels | default([]))
    and 'age_secs' in (_systemd_timer_recent_data.json.labels | default([]))
    and (_systemd_timer_recent_data.json.data | default([])) | length > 0
    and _systemd_timer_recent_data.json.data[0][_systemd_timer_recent_data.json.labels.index('overdue')] | int == 0
    and _systemd_timer_recent_data.json.data[0][_systemd_timer_recent_data.json.labels.index('age_secs')] | int > 4800
    and _systemd_timer_recent_data.json.data[0][_systemd_timer_recent_data.json.labels.index('age_secs')] | int < 6600

- name: _verify | Plant a stale stamp for the fixture
  command: touch -d "3 hours ago" /var/lib/systemd/timers/stamp-_verify_timer_monitored.timer
  changed_when: false
  become: true

- name: _verify | Fixture data reports stale stamp as overdue
  uri:
    url: http://localhost:19999/api/v1/data?chart=systemd_timers.verify_timer_monitored&points=1&after=-30&format=json
    return_content: true
  register: _systemd_timer_stale_data
  retries: 30
  delay: 2
  until: >-
    _systemd_timer_stale_data.status == 200
    and 'overdue' in (_systemd_timer_stale_data.json.labels | default([]))
    and 'age_secs' in (_systemd_timer_stale_data.json.labels | default([]))
    and (_systemd_timer_stale_data.json.data | default([])) | length > 0
    and _systemd_timer_stale_data.json.data[0][_systemd_timer_stale_data.json.labels.index('overdue')] | int == 1
    and _systemd_timer_stale_data.json.data[0][_systemd_timer_stale_data.json.labels.index('age_secs')] | int > 7200
    and _systemd_timer_stale_data.json.data[0][_systemd_timer_stale_data.json.labels.index('age_secs')] | int < 14400

# Alert binds on context systemd.timer_lag; netdata keys the instance
# as <chart_id>.<template_name>, e.g.
# systemd_timers.verify_timer_monitored.systemd_timer_overdue.
- name: _verify | Wait for overdue alert to register against the fixture
  uri:
    url: http://localhost:19999/api/v1/alarms?all
    return_content: true
  register: _systemd_timer_alarms
  retries: 30
  delay: 2
  until: >-
    _systemd_timer_alarms.status == 200
    and _systemd_timer_alarms.json.alarms.keys() | list
        | select('search', 'systemd_timers.verify_timer_monitored.systemd_timer_overdue') | list | length > 0

- name: _verify | Assert overdue alert uses an uptime state guard
  vars:
    _alarm: >-
      {{
        (_systemd_timer_alarms.json.alarms.values()
         | selectattr('name', 'equalto', 'systemd_timer_overdue')
         | first)
        | default({})
      }}
  assert:
    that:
      - _alarm.recipient | default('') == "sysadmin"
      - "'system.uptime.uptime' in (_alarm.crit | default(''))"
      - _alarm.delay_up_duration | default(0) == 0
      - _alarm.delay_down_duration | default(0) == 600
    fail_msg: >-
      Expected systemd_timer_overdue to suppress alert state during the first
      35 minutes of host uptime without an up-notification delay. Got:
      {{ _alarm }}

# Cleanup: remove the fixture so a follow-on test run starts clean.
- name: _verify | Remove monitored fixture
  import_role:
    name: systemd_timer
    tasks_from: remove
  vars:
    systemd_timer_args:
      name: _verify_timer_monitored

# Asserts both the metadata cleanup and remove.yml's persistent-stamp drop.
- name: _verify | Stat metadata + stamp files after removal (should NOT exist)
  stat:
    path: "{{ item }}"
  loop:
    - /etc/netdata/charts.d/systemd_timers.d/_verify_timer_monitored.conf
    - /var/lib/systemd/timers/stamp-_verify_timer_monitored.timer
  register: _systemd_timer_meta_after
  become: true
- name: _verify | Assert metadata + stamps cleaned up
  assert:
    that:
      - not item.stat.exists
    fail_msg: "{{ item.item }} still present after remove"
  loop: "{{ _systemd_timer_meta_after.results }}"
  loop_control:
    label: "{{ item.item }}"
