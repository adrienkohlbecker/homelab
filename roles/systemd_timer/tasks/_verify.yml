# Verify covers six contracts:
#   1. install + manual-trigger + remove for a system-scope timer
#   2. systemd-cat routes stderr to journal priority err and preserves the
#      command's exit code
#   3. system-scope timers write netdata metadata with period_secs
#      derived from on_calendar via systemd-analyze
#   4. systemd_timers.chart.sh emits a chart per registered timer, age_secs
#      tracks the persistent trigger stamp's mtime, and overdue fires when
#      the stamp is older than 2 * period
#   5. condition:false is a no-op that still publishes <name>_result
#   6. extension knobs (environment, accuracy_sec, randomized_delay_sec,
#      additional_service_directives)

- name: _verify | Install systemd_timers netdata collector
  import_tasks: netdata.yml

# Poll quickly so fixture charts materialize in seconds rather than 60s.
- name: _verify | Speed up systemd_timers update_every for tests
  lineinfile:
    path: /etc/netdata/charts.d/systemd_timers.conf
    regexp: ^systemd_timers_update_every=
    line: systemd_timers_update_every=5
    owner: netdata
    group: netdata
    mode: "0644"
    backup: true
  become: true
- name: _verify | Restart netdata to apply update_every override
  systemd:
    name: netdata
    state: restarted
  become: true

# ============================================================
# Contracts 1+2+5: one fixture exercises the successful lifecycle, privilege
# drop, environment, timer knobs, service hardening, and journal priorities.
# ============================================================
# systemd-analyze verify (run by systemd_unit) warns "Special user nobody
# configured, this is not safe!" for User=nobody, and systemd_unit treats any
# verify stderr as a failure. Use a dedicated created user instead -- it also
# mirrors how real run_as callers work (a service's own system user).
- name: _verify | Create a dedicated user for the run_as fixture
  user:
    name: _verify_runas
    system: true
    create_home: false
    shell: /usr/sbin/nologin
  become: true

- name: _verify | Exercise the false-condition install path
  import_role:
    name: systemd_timer
    tasks_from: install
  vars:
    systemd_timer_args:
      name: _verify_timer_condition
      on_calendar: "2030-01-01 00:00:00"
      exec_start: /bin/true
      condition: false
      # These would fail validation or user-scope setup if the condition did
      # not gate the helper internally.
      user: _missing_timer_user
      run_as: root
      environment:
        invalid-key: value

- name: _verify | Stat false-condition install paths
  stat:
    path: "{{ item }}"
  loop:
    - /etc/systemd/user/_verify_timer_condition.service
    - /etc/systemd/user/_verify_timer_condition.timer
    - /etc/netdata/charts.d/systemd_timers.d/_verify_timer_condition.conf
  register: _systemd_timer_condition_paths
  become: true

- name: _verify | Assert false-condition install published a no-change result
  assert:
    that:
      - _verify_timer_condition_result is defined
      - not _verify_timer_condition_result.changed
      - _systemd_timer_condition_paths.results | map(attribute='stat.exists') | select | list | length == 0

- name: _verify | Remove stale fixture output
  file:
    path: /tmp/_verify_timer.out
    state: absent
  become: true

- name: _verify | Remove stale combined fixture stamp
  file:
    path: /var/lib/systemd/timers/stamp-_verify_timer.timer
    state: absent
  become: true

- name: _verify | Capture pre-run timestamp for journal filter
  command: date +%s
  register: _systemd_timer_stderr_t0
  changed_when: false

- name: _verify | Install combined fixture timer
  import_role:
    name: systemd_timer
    tasks_from: install
  vars:
    systemd_timer_args:
      name: _verify_timer
      description: systemd_timer self-test
      on_calendar: "*-*-* 23:59:00"
      exec_start: >-
        /usr/bin/python3 -c 'import os, sys;
        open("/tmp/_verify_timer.out", "w").write("ENV_KEY=" + os.environ["ENV_KEY"] + "|ENV_OTHER=" + os.environ["ENV_OTHER"] + chr(10));
        print("STDOUT_VERIFY_LINE"); print("STDERR_VERIFY_LINE", file=sys.stderr)'
      run_as: _verify_runas
      environment:
        ENV_KEY: knob_value
        ENV_OTHER: "value with spaces, and a comma"
      accuracy_sec: 1s
      randomized_delay_sec: 600
      additional_service_directives:
        # ProtectSystem=strict makes the filesystem read-only except for the
        # explicit test output path, exercising the directive passthrough.
        - "ProtectSystem=strict"
        - "ProtectHome=yes"
        - "ReadWritePaths=/tmp"

- name: _verify | Trigger the combined fixture manually  # noqa: command-instead-of-module
  command: systemctl start --wait _verify_timer.service
  changed_when: false
  become: true

- name: _verify | Stat combined fixture trigger stamp
  stat:
    path: /var/lib/systemd/timers/stamp-_verify_timer.timer
  register: _systemd_timer_timer_stamp
  become: true

- name: _verify | Sync journal before reading
  command: journalctl --sync
  changed_when: false
  become: true

- name: _verify | Read stderr through unit and identifier journal filters
  command: >-
    journalctl {{ item }} -p err
    --since=@{{ _systemd_timer_stderr_t0.stdout }} --no-pager --output=cat
  loop:
    - -u _verify_timer.service
    - --identifier _verify_timer
  register: _systemd_timer_stderr_journals
  changed_when: false
  become: true

- name: _verify | Read service Result property  # noqa: command-instead-of-module
  command: systemctl show -p Result --value _verify_timer.service
  register: _systemd_timer_timer_result
  changed_when: false
  become: true

- name: _verify | Read timer ActiveState  # noqa: command-instead-of-module
  command: systemctl show -p ActiveState --value _verify_timer.timer
  register: _systemd_timer_timer_active
  changed_when: false
  become: true

- name: _verify | Read fixture output
  slurp:
    src: /tmp/_verify_timer.out
  register: _systemd_timer_timer_out
  become: true

- name: _verify | Stat fixture output ownership
  stat:
    path: /tmp/_verify_timer.out
  register: _systemd_timer_timer_out_stat
  become: true

- name: _verify | Read timer and service properties  # noqa: command-instead-of-module
  command: >-
    systemctl show -p AccuracyUSec,RandomizedDelayUSec,FixedRandomDelay,TimeoutStopUSec,ProtectSystem,ProtectHome
    _verify_timer.timer _verify_timer.service
  register: _systemd_timer_knobs_show
  changed_when: false
  become: true

- name: _verify | Assert combined fixture behavior
  vars:
    _output: "{{ (_systemd_timer_timer_out.content | b64decode).rstrip() }}"
  assert:
    that:
      - _systemd_timer_timer_result.stdout == 'success'
      - _systemd_timer_timer_active.stdout == 'active'
      - _verify_timer_result.changed
      - _systemd_timer_timer_stamp.stat.exists
      - _systemd_timer_timer_out_stat.stat.pw_name == '_verify_runas'
      - _output == "ENV_KEY=knob_value|ENV_OTHER=value with spaces, and a comma"
      - "'AccuracyUSec=1s' in _systemd_timer_knobs_show.stdout"
      - "'RandomizedDelayUSec=10min' in _systemd_timer_knobs_show.stdout"
      - "'FixedRandomDelay=yes' in _systemd_timer_knobs_show.stdout"
      - "'TimeoutStopUSec=30s' in _systemd_timer_knobs_show.stdout"
      - "'ProtectSystem=strict' in _systemd_timer_knobs_show.stdout"
      - "'ProtectHome=yes' in _systemd_timer_knobs_show.stdout"

- name: _verify | Assert stderr priority through each journal filter
  assert:
    that:
      - "'STDERR_VERIFY_LINE' in item.stdout"
      - "'STDOUT_VERIFY_LINE' not in item.stdout"
  loop: "{{ _systemd_timer_stderr_journals.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: _verify | Exercise the false-condition remove path
  import_role:
    name: systemd_timer
    tasks_from: remove
  vars:
    systemd_timer_args:
      name: _verify_timer
      condition: false

- name: _verify | Stat unit files after false-condition removal
  stat:
    path: "/etc/systemd/system/_verify_timer.{{ item }}"
  loop:
    - service
    - timer
  register: _systemd_timer_condition_remove_files
  become: true

- name: _verify | Assert false-condition removal preserved the timer
  assert:
    that:
      - not _verify_timer_result.changed
      - _systemd_timer_condition_remove_files.results | map(attribute='stat.exists') | select | list | length == 2

- name: _verify | Remove the combined fixture timer
  import_role:
    name: systemd_timer
    tasks_from: remove
  vars:
    systemd_timer_args:
      name: _verify_timer

- name: _verify | Stat unit files after removal
  stat:
    path: "/etc/systemd/system/_verify_timer.{{ item }}"
  loop:
    - service
    - timer
  register: _systemd_timer_timer_files
  become: true

- name: _verify | Systemctl status for the removed timer  # noqa: command-instead-of-module
  command: systemctl status _verify_timer.timer
  register: _systemd_timer_timer_status
  changed_when: false
  failed_when: false
  become: true

- name: _verify | Assert fixture removal
  assert:
    that:
      - not _systemd_timer_timer_files.results[0].stat.exists
      - not _systemd_timer_timer_files.results[1].stat.exists
      - _systemd_timer_timer_status.rc != 0
      - _verify_timer_result.changed

- name: _verify | Cleanup combined fixture
  file:
    path: /tmp/_verify_timer.out
    state: absent
  become: true

- name: _verify | Remove the run_as fixture user
  user:
    name: _verify_runas
    state: absent
  become: true

# --- exit-code propagation ---
# The logging transport must preserve a failing command's status so systemd
# reports the failure and the stock failed-state alert can fire.
- name: _verify | Install monitored exit-code fixture
  import_role:
    name: systemd_timer
    tasks_from: install
  vars:
    systemd_timer_args:
      name: _verify_timer_exitcode
      description: stderr priority exit-code propagation self-test
      on_calendar: "*-*-* 23:59:00"
      exec_start: /bin/sh -c 'exit 2'

- name: _verify | Remove any stale exit-code fixture stamp
  file:
    path: /var/lib/systemd/timers/stamp-_verify_timer_exitcode.timer
    state: absent
  become: true

- name: _verify | Record time before triggering the exit-code fixture
  command: date +%s
  register: _systemd_timer_exitcode_started_at
  changed_when: false

- name: _verify | Trigger the exit-code fixture manually  # noqa: command-instead-of-module
  command: systemctl start --wait _verify_timer_exitcode.service
  register: _systemd_timer_exitcode_start
  changed_when: false
  failed_when: false
  become: true

- name: _verify | Read exit-code fixture Result property  # noqa: command-instead-of-module
  command: systemctl show -p Result --value _verify_timer_exitcode.service
  register: _systemd_timer_exitcode_result
  changed_when: false
  become: true

- name: _verify | Assert logging transport preserves non-zero exit code
  assert:
    that:
      - _systemd_timer_exitcode_start.rc != 0
      - _systemd_timer_exitcode_result.stdout == 'exit-code'

# ExecStartPre must refresh the stamp before a failing workload starts.
- name: _verify | Stat the trigger stamp after the failed run
  stat:
    path: /var/lib/systemd/timers/stamp-_verify_timer_exitcode.timer
  register: _systemd_timer_exitcode_stamp
  become: true
- name: _verify | Assert the failed run still touched the trigger stamp
  assert:
    that:
      - _systemd_timer_exitcode_stamp.stat.exists
      - _systemd_timer_exitcode_stamp.stat.mtime | int >= _systemd_timer_exitcode_started_at.stdout | int
    fail_msg: >-
      stamp-_verify_timer_exitcode.timer was not refreshed before the failed
      service run.

- name: _verify | Remove the exit-code fixture timer
  import_role:
    name: systemd_timer
    tasks_from: remove
  vars:
    systemd_timer_args:
      name: _verify_timer_exitcode

# Contracts 3+4 exercise the netdata charts.d collector. netdata installs
# from repo.netdata.cloud's multi-arch 2.x series (see roles/netdata), so
# netdata-plugin-chartsd resolves on arm64 as well as x86_64 -- no arch gate.
- name: _verify | Monitored-timer + overdue netdata contracts
  import_tasks: _verify_monitored.yml
