# QEMU-only functional checks. authdata proves chronyd is responsive and
# exposes whether NTS-KE established keys and cookies for each source.
- name: _verify | Read per-source authentication state (CSV)
  command: chronyc -c authdata
  changed_when: false
  become: true
  register: chrony_verify_authdata

- name: _verify | At least two sources complete NTS key establishment
  assert:
    that:
      - chrony_verify_authdata.stdout_lines | length >= 2
      - chrony_verify_authdata.stdout_lines | select('match', '^[^,]+,(?!NTS,)') | list | length == 0
      - >-
        chrony_verify_authdata.stdout_lines
        | select('match', '^[^,]+,NTS,[^,]+,[^,]+,[^,]+,[^,]+,[^,]+,[^,]+,[1-9][0-9]*,[^,]+$')
        | list
        | length >= 2
    fail_msg: >-
      chrony lacks two NTS sources with negotiated cookies (authdata rows:
      {{ chrony_verify_authdata.stdout_lines }})
    success_msg: >-
      all {{ chrony_verify_authdata.stdout_lines | length }} loaded source(s) use
      NTS and at least two hold negotiated cookies

# Read the ntp-units.d registries the way timedated does: every config
# directory, entries trimmed, comments skipped. Timesyncd is queried
# explicitly because removing its package drops its registry entry while an
# instance nobody stopped keeps steering the clock until reboot.
- name: _verify | List active time synchronizers
  shell: |
    set -euo pipefail
    shopt -s nullglob
    lists=(/etc/systemd/ntp-units.d/*.list /run/systemd/ntp-units.d/*.list
           /usr/local/lib/systemd/ntp-units.d/*.list /usr/lib/systemd/ntp-units.d/*.list)
    units="$(sed -e "s/^[[:space:]]*//" -e "s/[[:space:]]*$//" "${lists[@]}" </dev/null \
      | grep -vE "^(#|$)" | sort -u)"
    systemctl list-units --state=active --plain --no-legend $units systemd-timesyncd.service
  args:
    executable: /bin/bash
  changed_when: false
  become: true
  register: chrony_verify_synchronizers

- name: _verify | Chrony is the sole active synchronizer
  assert:
    that:
      - chrony_verify_synchronizers.stdout_lines | map('split') | map('first') | list == ['chrony.service']
    fail_msg: >-
      expected only chrony.service among active time synchronizers, got
      {{ chrony_verify_synchronizers.stdout_lines }}

- name: _verify | Read the timesyncd boot state  # noqa: command-instead-of-module -- property query; the module rejects a not-found unit
  command: systemctl show --property=LoadState,UnitFileState systemd-timesyncd.service
  changed_when: false
  become: true
  register: chrony_verify_timesyncd

- name: _verify | Timesyncd cannot start at next boot
  vars:
    timesyncd: "{{ dict(chrony_verify_timesyncd.stdout_lines | map('split', '=', 1)) }}"
  assert:
    that:
      - timesyncd.LoadState == 'not-found' or timesyncd.UnitFileState in ['disabled', 'masked']
    fail_msg: "systemd-timesyncd would start at next boot: {{ timesyncd }}"
