# QEMU-only functional checks. authdata proves chronyd is responsive and
# exposes whether NTS-KE established keys and cookies for each source. -N
# reports each source under its configured name, so pool members keep the
# pool hostname rather than a resolved address; -a includes sources whose
# name has not resolved yet, which authdata otherwise omits.
- name: _verify | Read per-source authentication state (CSV)
  command: chronyc -c -N authdata -a
  changed_when: false
  become: true
  register: chrony_verify_authdata
  # chronyd reloads saved NTS cookies at start, but a first start or a new
  # server must finish NTS-KE first. Not waitsync: syncing needs NTP over UDP,
  # which SLIRP egress drops under load; NTS-KE runs over TCP.
  until: >-
    chrony_verify_authdata.stdout_lines
    | select('match', '^[^,]+,NTS,[^,]+,[^,]+,[^,]+,[^,]+,[^,]+,[^,]+,[1-9][0-9]*,[^,]+$')
    | list | length >= 2
  retries: 15
  delay: 2

# Every loaded source must use NTS, but Resolute's packaged
# sources.d/ubuntu-ntp-pools.sources is NTS too, so the names must also match
# to tell whether a sourcedir include pulled Ubuntu's pools in.
- name: _verify | Loaded sources are exactly the managed servers
  vars:
    chrony_verify_loaded: "{{ chrony_verify_authdata.stdout_lines | map('split', ',') | map('first') | unique | sort }}"
    chrony_verify_expected: "{{ lookup('file', 'chrony.conf') | regex_findall('(?m)^server\\s+(\\S+)') | sort }}"
  assert:
    that:
      - chrony_verify_loaded == chrony_verify_expected
      - chrony_verify_authdata.stdout_lines | select('match', '^[^,]+,(?!NTS,)') | list | length == 0
    fail_msg: >-
      chronyd loaded {{ chrony_verify_loaded }}, expected only the managed
      NTS servers {{ chrony_verify_expected }} (authdata rows:
      {{ chrony_verify_authdata.stdout_lines }})
    success_msg: chronyd loaded only the managed NTS servers {{ chrony_verify_loaded }}
