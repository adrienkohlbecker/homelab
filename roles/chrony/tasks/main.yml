- name: Install chrony
  apt:
    pkg: chrony
    cache_valid_time: 3600
  register: chrony_apt
  become: true
  tags:
    - chrony

# AppArmor blocks chronyd from parsing Ansible's temporary file, so _verify
# exercises the installed configuration through chronyc instead.
- name: Configure chrony for NTS-only time sync  # noqa: require-validate
  when: not (ansible_check_mode and chrony_apt.changed)
  copy:
    src: chrony.conf
    dest: /etc/chrony/chrony.conf
    owner: root
    group: root
    mode: "0644"
    backup: true
  register: chrony_conf
  become: true
  tags:
    - chrony

- name: Enable and start chrony
  when: not (ansible_check_mode and chrony_apt.changed)
  systemd:
    name: chrony.service
    enabled: true
    state: "{{ 'restarted' if chrony_conf.changed else 'started' }}"
  become: true
  tags:
    - chrony
