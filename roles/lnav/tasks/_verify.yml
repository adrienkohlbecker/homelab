- name: Lnav is installed at expected version
  command: /usr/local/bin/lnav -V
  register: lnav_installed_version
  changed_when: false
  failed_when: >-
    lnav_installed_version.rc != 0 or
    lnav_version not in lnav_installed_version.stdout
  tags:
    - lnav

# The retired format planted in _setup must have been pruned by converge, and the
# managed formats must be exactly what remains -- proving the prune removes
# retired files without taking out live ones.
- name: Enumerate format files left on disk after converge
  find:
    paths: /etc/lnav/formats/homelab
    patterns: "*.json"
  register: lnav_verify_formats
  become: true
  tags:
    - lnav

- name: Assert orphan pruned and exactly the managed formats remain
  vars:
    on_disk: "{{ lnav_verify_formats.files | map(attribute='path') | map('basename') | sort }}"
  assert:
    that: on_disk == (lnav_format_files | sort)
    fail_msg: >-
      lnav formats dir mismatch: on disk {{ on_disk }}, expected {{ lnav_format_files | sort }}
      (syslog_body_scan.json should have been pruned)
  tags:
    - lnav

- name: Create lnav format verification directory
  file:
    path: /tmp/lnav_verify
    state: directory
    mode: "0755"
  tags:
    - lnav

- name: Write representative lnav sample log
  copy:
    dest: /tmp/lnav_verify/lnav.jsonl
    content: |
      {"time":"2026-06-08T12:34:56.789Z","host":"lab","service":"homeassistant","unit":"homeassistant.service","identifier":"homeassistant","level":"warn","message":"connection failed","stream":"journald","fields":{"CONTAINER_NAME":"homeassistant","SYSTEMD_UNIT":"homeassistant.service","SYSLOG_IDENTIFIER":"homeassistant","context":{"retry":3}}}
      {"time":"2026-06-08T12:34:56.500Z","host":"lab","service":"netdata","unit":null,"identifier":null,"level":"info","message":"earlier out-of-order record","stream":"journald","fields":{}}
    mode: "0644"
  tags:
    - lnav

# The second record is deliberately 289ms earlier than the first. The merged
# store is written in ingest order, so this exercises `ordered-by-time`.
- name: Lnav format matches its representative sample
  become: true
  become_user: "{{ ansible_user_id }}"
  command:
    argv:
      - /usr/local/bin/lnav
      - -m
      - format
      - fluentbit_lnav
      - test
      - /tmp/lnav_verify/lnav.jsonl
  changed_when: false
  tags:
    - lnav

- name: Lnav config check accepts representative sample
  become: true
  become_user: "{{ ansible_user_id }}"
  command:
    argv:
      - /usr/local/bin/lnav
      - -n
      - -N
      - -C
      - /tmp/lnav_verify/lnav.jsonl
  changed_when: false
  tags:
    - lnav

- name: Read effective lnav configuration
  become: true
  become_user: "{{ ansible_user_id }}"
  command:
    argv:
      - /usr/local/bin/lnav
      - -m
      - config
      - get
  register: lnav_effective_config
  changed_when: false
  tags:
    - lnav

- name: Select the configured F9 action
  set_fact:
    lnav_f9_command: >-
      {{ (lnav_effective_config.stdout | from_json).ui['keymap-defs']['default'].f9.command }}
  tags:
    - lnav

- name: Assert lnav selects its bundled Dracula theme
  vars:
    effective_config: "{{ lnav_effective_config.stdout | from_json }}"
  assert:
    that:
      - effective_config.ui.theme == 'dracula'
      - "'dracula' in effective_config.ui['theme-defs']"
    fail_msg: "lnav did not select its bundled Dracula theme"
  tags:
    - lnav

# Headless render: the fluentbit_lnav format must show each record on a single
# message-only line -- unit/identifier/stream and the fields object are hidden,
# not expanded onto their own rows nor appended as JSON.
- name: Lnav headless-renders the fluentbit_lnav sample
  become: true
  become_user: "{{ ansible_user_id }}"
  command:
    argv:
      - /usr/local/bin/lnav
      - -n
      - /tmp/lnav_verify/lnav.jsonl
  register: lnav_render
  changed_when: false
  tags:
    - lnav

- name: Lnav renders each record on one clean line, in file order
  vars:
    body_lines: "{{ lnav_render.stdout_lines | reject('match', '^\\s*$') | list }}"
  assert:
    that:
      # Two records -> exactly two lines: no unit/identifier/stream or fields
      # expanding onto their own rows, and no fields JSON appended.
      - body_lines | length == 2
      - "'connection failed' in lnav_render.stdout"
      - "'CONTAINER_NAME' not in lnav_render.stdout"
      # ordered-by-time: lnav trusts the store's order and does not insert an
      # out-of-time-order banner for the earlier record that follows.
      - "lnav_render.stdout is not search('Out-Of-Time-Order')"
    fail_msg: |
      lnav did not render the records cleanly (one message-only line each, no
      fields JSON, no out-of-order banner).
      stdout:
      {{ lnav_render.stdout }}
  tags:
    - lnav

- name: Lnav fluentbit_lnav SQL table exposes shaped fields
  become: true
  become_user: "{{ ansible_user_id }}"
  command:
    argv:
      - timeout
      - -k
      - 5s
      - 20s
      - /usr/local/bin/lnav
      - -n
      - -N
      - -c
      - ";SELECT level, host, service, log_body AS message,
         json_extract(fields, '$.CONTAINER_NAME') AS container_name,
         json_extract(fields, '$.context.retry') AS context_retry
         FROM fluentbit_lnav LIMIT 1"
      - -c
      - ":write-jsonlines-to -"
      - -c
      - ":quit"
      - /tmp/lnav_verify/lnav.jsonl
  register: lnav_fluentbit_sql_export
  changed_when: false
  failed_when: >-
    lnav_fluentbit_sql_export.rc != 0
    or lnav_fluentbit_sql_export.stderr | length > 0
  tags:
    - lnav

- name: Lnav fluentbit_lnav SQL output contains shaped fields
  vars:
    expected:
      level: warn
      host: lab
      service: homeassistant
      message: connection failed
      container_name: homeassistant
      context_retry: 3
  assert:
    that: lnav_fluentbit_sql_export.stdout | from_json == expected
  tags:
    - lnav

- name: Create lnav-journal verification store directory
  file:
    path: /var/log/fluent-bit
    state: directory
    mode: "0755"
  become: true
  tags:
    - lnav

# The leading record predates any --since bound the tasks below use. It sits
# first so the ordered-by-time format keeps its old timestamp (later in the
# file it would be clamped up to its neighbor), giving the relative-bound task
# an exclusion witness inside a file that still spans the cutoff (lnav refuses
# to open a file wholly outside the time cutoffs).
- name: Write lnav-journal verification stores
  copy:
    dest: "{{ item.path }}"
    content: "{{ item.content }}"
    mode: "0644"
  loop:
    - path: /var/log/fluent-bit/lnav.jsonl
      content: |
        {"time":"2020-01-01T00:00:00Z","host":"box","service":"lnav_ancient","unit":"lnav_ancient.service","identifier":"lnav_ancient","level":"info","message":"lnav wrapper ancient history","stream":"journald","fields":{"SYSTEMD_UNIT":"lnav_ancient.service"}}
        {"time":"{{ ansible_date_time.iso8601 }}","host":"box","service":"lnav_other","unit":"lnav_other.service","identifier":"lnav_other","level":"info","message":"lnav wrapper other unit","stream":"journald","fields":{"SYSTEMD_UNIT":"lnav_other.service"}}
        {"time":"{{ ansible_date_time.iso8601 }}","host":"box","service":"lnav_verify","unit":"lnav_verify.service","identifier":"lnav_verify","level":"info","message":"lnav wrapper verification","stream":"journald","fields":{"SYSTEMD_UNIT":"lnav_verify.service"}}
        {"time":"{{ ansible_date_time.iso8601 }}","host":"box","service":"lnav_verify","unit":"lnav_verify.service","identifier":"lnav_verify","level":"debug","message":"lnav wrapper debug hidden","stream":"journald","fields":{"SYSTEMD_UNIT":"lnav_verify.service"}}
    - path: /var/log/fluent-bit/lnav.jsonl.1
      content: |
        {"time":"{{ ansible_date_time.iso8601 }}","host":"box","service":"lnav_rotated","unit":"lnav_rotated.service","identifier":"lnav_rotated","level":"info","message":"lnav wrapper rotated history","stream":"journald","fields":{"SYSTEMD_UNIT":"lnav_rotated.service"}}
        {"time":"{{ ansible_date_time.iso8601 }}","host":"box","service":"lnav_verify","unit":"lnav_verify.service","identifier":"lnav_verify","level":"info","message":"lnav wrapper filtered history","stream":"journald","fields":{"SYSTEMD_UNIT":"lnav_verify.service"}}
    - path: /var/log/fluent-bit/lnav.jsonl.2
      content: |
        {"time":"{{ ansible_date_time.iso8601 }}","host":"box","service":"lnav_older","unit":"lnav_older.service","identifier":"lnav_older","level":"info","message":"lnav wrapper older history","stream":"journald","fields":{"SYSTEMD_UNIT":"lnav_older.service"}}
  become: true
  tags:
    - lnav

- name: Lnav-journal wrapper exposes lnav version without log discovery
  become: true
  become_user: "{{ ansible_user_id }}"
  command:
    argv:
      - /usr/local/bin/lnav-journal
      - -V
  register: lnav_journal_version
  changed_when: false
  failed_when: >-
    lnav_journal_version.rc != 0 or
    lnav_version not in lnav_journal_version.stdout
  tags:
    - lnav

# Each case runs in a fresh session; :goto 0 exports the full visible window.
- name: Verify lnav history and wrapper scenarios
  become: true
  become_user: "{{ ansible_user_id }}"
  command:
    argv: "{{ ['timeout', '-k', '5s', '20s'] + item.argv }}"
  register: lnav_case
  changed_when: false
  failed_when: >-
    lnav_case.rc != 0 or
    item.present | reject('in', lnav_case.stdout) | list | length > 0 or
    item.absent | default([]) | select('in', lnav_case.stdout) | list | length > 0
  loop:
    - name: Load one rotation
      argv:
        - /usr/local/bin/lnav
        - -n
        - -N
        - -c
        - "{{ lnav_f9_command }}"
        - -c
        - ':goto 0'
        - /var/log/fluent-bit/lnav.jsonl
      present: [ lnav wrapper rotated history ]
      absent: [ lnav wrapper older history ]
    - name: Load remaining rotations and tolerate exhaustion
      argv:
        - /usr/local/bin/lnav
        - -n
        - -N
        - -c
        - "{{ lnav_f9_command }}"
        - -c
        - "{{ lnav_f9_command }}"
        - -c
        - "{{ lnav_f9_command }}"
        - -c
        - ':goto 0'
        - /var/log/fluent-bit/lnav.jsonl
      present: [ lnav wrapper rotated history, lnav wrapper older history ]
    - name: Preserve unit filter when loading history
      argv: [ /usr/local/bin/lnav-journal, -n, -u, lnav_verify, -c, "{{ lnav_f9_command }}", -c, ':goto 0' ]
      present: [ lnav wrapper filtered history ]
      absent: [ lnav wrapper rotated history ]
    - name: Apply relative time bounds
      argv: [ /usr/local/bin/lnav-journal, -n, -S, 1 hour ago, -c, ':goto 0' ]
      present: [ lnav wrapper verification ]
      absent: [ lnav wrapper ancient history ]
    - name: Pass native negative-relative bounds through
      argv: [ /usr/local/bin/lnav-journal, -n, -S, -15m, -c, ':goto 0' ]
      present: [ lnav wrapper verification ]
      absent: [ lnav wrapper ancient history ]
    - name: Open the active store at the end with debug hidden
      argv: [ /usr/local/bin/lnav-journal, -n ]
      present: [ lnav wrapper verification ]
      absent: [ lnav wrapper debug hidden, lnav wrapper rotated history ]
    - name: Filter by unit
      argv: [ /usr/local/bin/lnav-journal, -n, -u, lnav_verify ]
      present: [ lnav wrapper verification ]
      absent: [ lnav wrapper other unit ]
    - name: Open all retained history
      argv: [ /usr/local/bin/lnav-journal, -n, --all, -c, ':goto 0' ]
      present: [ lnav wrapper verification, lnav wrapper rotated history ]
    - name: Override the default debug threshold
      argv: [ /usr/local/bin/lnav-journal, -n, -c, ':set-min-log-level debug' ]
      present: [ lnav wrapper debug hidden ]
  loop_control:
    label: "{{ item.name }}"
  tags:
    - lnav
