# Seed the retired syslog format to exercise pruning.
- name: Create lnav formats directory for orphan fixture
  file:
    path: /etc/lnav/formats/homelab
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Plant retired lnav format file
  copy:
    dest: /etc/lnav/formats/homelab/syslog_body_scan.json
    content: |
      {
        "$schema": "https://lnav.org/schemas/format-v1.schema.json",
        "syslog_body_scan": {
          "title": "Retired format that must be pruned on converge",
          "regex": { "std": { "pattern": "^(?<body>.*)$" } },
          "value": { "body": { "kind": "string" } },
          "sample": [ { "line": "orphan" } ]
        }
      }
    owner: root
    group: root
    mode: "0644"
  become: true
