# Seed both a generic orphan and the retired syslog format to exercise pruning.
- name: Create lnav formats directory for orphan fixture
  file:
    path: /etc/lnav/formats/homelab
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Plant orphaned lnav format files
  copy:
    dest: "/etc/lnav/formats/homelab/{{ item }}.json"
    content: |
      {
        "$schema": "https://lnav.org/schemas/format-v1.schema.json",
        "{{ item }}": {
          "title": "Retired format that must be pruned on converge",
          "regex": { "std": { "pattern": "^(?<body>.*)$" } },
          "value": { "body": { "kind": "string" } },
          "sample": [ { "line": "orphan" } ]
        }
      }
    owner: root
    group: root
    mode: "0644"
  loop:
    - orphan_retired
    - syslog_body_scan
  become: true
