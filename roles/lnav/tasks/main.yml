- name: Install unzip (required to extract lnav release)
  apt:
    pkg: unzip
    install_recommends: false
    cache_valid_time: 3600
  become: true
  tags:
    - lnav

- name: Download lnav release zip
  get_url:
    url: "{{ lnav_artifacts[ansible_architecture].url }}"
    dest: "/var/cache/lnav-{{ lnav_version }}-{{ ansible_architecture }}.zip"
    checksum: "sha256:{{ lnav_artifacts[ansible_architecture].sha256 }}"
    owner: root
    group: root
    mode: "0644"
  become: true
  register: lnav_zip_download
  retries: 3
  delay: 5
  until: lnav_zip_download is succeeded
  tags:
    - lnav

- name: Create lnav directories
  file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /opt/lnav
    - /etc/lnav/formats/homelab
    - /etc/lnav/configs/homelab
  register: lnav_dirs
  become: true
  tags:
    - lnav

- name: Extract lnav binary
  when: >-
    not (ansible_check_mode and
         (lnav_zip_download.changed or lnav_dirs.changed))
  unarchive:
    src: "/var/cache/lnav-{{ lnav_version }}-{{ ansible_architecture }}.zip"
    dest: /opt/lnav
    remote_src: true
    include:
      - "lnav-{{ lnav_version }}/lnav"
    creates: "/opt/lnav/lnav-{{ lnav_version }}/lnav"
  become: true
  tags:
    - lnav

# force replaces a regular file at the path and lets check mode link to a
# binary the guarded extract above has not unpacked yet.
- name: Link lnav into PATH
  file:
    src: "/opt/lnav/lnav-{{ lnav_version }}/lnav"
    dest: /usr/local/bin/lnav
    state: link
    force: true
  become: true
  tags:
    - lnav

- name: Deploy lnav configuration
  copy:
    src: configs/homelab.json
    dest: /etc/lnav/configs/homelab/config.json
    owner: root
    group: root
    mode: "0644"
    backup: true
    validate: python3 -m json.tool %s
  become: true
  tags:
    - lnav

- name: Deploy lnav format
  copy:
    src: formats/fluentbit_lnav.json
    dest: /etc/lnav/formats/homelab/fluentbit_lnav.json
    owner: root
    group: root
    mode: "0644"
    backup: true
    validate: python3 -m json.tool %s
  become: true
  tags:
    - lnav

- name: Deploy lnav scripts  # noqa: require-validate
  copy:
    src: formats/load_older_journal.lnav
    dest: /etc/lnav/formats/homelab/load_older_journal.lnav
    owner: root
    group: root
    mode: "0644"
    backup: true
  become: true
  tags:
    - lnav

- name: Deploy lnav-journal wrapper
  copy:
    src: lnav_journal.py
    dest: /usr/local/bin/lnav-journal
    owner: root
    group: root
    mode: "0755"
    backup: true
    validate: python3 -m py_compile %s
  become: true
  tags:
    - lnav
