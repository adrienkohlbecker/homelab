- name: _setup | Install nginx
  import_role:
    name: nginx
    tasks_from: test_fixture
  vars:
    nginx_test_fixture_args:
      authelia_mode: gate

- name: _setup | Install podman
  import_role:
    name: podman
    tasks_from: install

- name: _setup | Install fluent-bit for log normalization
  import_role:
    name: fluentbit

- name: _setup | Ensure test mountpoints exist
  file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /mnt/services
    # SABnzbd creates this category directory before Sonarr starts in prod.
    - /mnt/scratch/sonarr
    - /mnt/media
  become: true
