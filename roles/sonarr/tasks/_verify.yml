# Together the 401 and authenticated probes prove the templated API key is
# required and active.
- name: _verify | Sonarr /api/v3/system/status rejects unauth'd requests
  uri:
    url: http://127.0.0.1:{{ service_ports.sonarr }}/api/v3/system/status
    status_code: 401
  register: _sonarr_http_unauth
  retries: 30
  delay: 2
  until: _sonarr_http_unauth.status == 401

# Header form keeps the key out of journald.
- name: _verify | Sonarr answers /api/v3/system/status with our apikey
  uri:
    url: http://127.0.0.1:{{ service_ports.sonarr }}/api/v3/system/status
    headers:
      X-Api-Key: "{{ sonarr_api_key }}"
    status_code: 200
  register: _sonarr_http
  retries: 30
  delay: 2
  until: _sonarr_http.status == 200
  failed_when: >-
    (_sonarr_http.json | default({})) | length == 0
    or (_sonarr_http.json | default({})).authentication | default('') != "external"

# Probe the Authelia-gated browser path separately from direct API access.
- name: _verify | Verify Sonarr Authelia gate
  import_role:
    name: nginx
    tasks_from: verify_authelia_gate
  vars:
    nginx_verify_authelia_gate_args:
      subdomain: sonarr

# Intra-stack peers use sonarr.dns.podman; a 401 from inside the container
# proves media-network DNS and API-key enforcement on that path.
- name: _verify | Sonarr is reachable intra-stack at sonarr.dns.podman over the media network
  command: >-
    podman exec sonarr
    curl -s -o /dev/null -w '%{http_code}'
    http://sonarr.dns.podman:8989/api/v3/system/status
  become: true
  register: _sonarr_dns_podman
  changed_when: false
  retries: 15
  delay: 2
  until: _sonarr_dns_podman.rc == 0 and _sonarr_dns_podman.stdout == "401"

# SABnzbd and Sonarr share this category path; HTTP health does not exercise imports.
- name: _verify | Scratch volume is mounted inside the container
  command: >-
    podman exec sonarr
    test -d /scratch/sonarr
  become: true
  changed_when: false

# Sonarr rewrites config.xml only on shutdown, beyond the idempotence pass;
# restart and compare bytes to prevent element-order drift and restart churn.
- name: _verify | Restart sonarr to force a config.xml writeback
  systemd:
    name: sonarr
    state: restarted
  become: true

# Re-run the production file contract in check mode after Sonarr's writeback.
# Any predicted change means content, ownership, or mode drifted.
- name: _verify | Config.xml remains converged after sonarr's writeback
  copy:
    content: "{{ lookup('template', 'config.xml.j2') | rstrip_newlines }}"
    dest: /mnt/services/sonarr/config.xml
    owner: sonarr
    group: media
    mode: "0600"
  check_mode: true
  diff: false
  register: _sonarr_conf_check
  failed_when: _sonarr_conf_check.changed
  become: true

- name: _verify | Create unique sonarr fluent-bit marker
  set_fact:
    sonarr_lnav_marker: "verify_sonarr_{{ ansible_date_time.iso8601_basic_short }}_{{ 99999 | random }}"

# Write through the container init stdout so conmon gives the fixture the same
# journald metadata as Sonarr. Separate writes exercise the retained exception
# grammar: header, blank separator, versioned exception, then stack frames.
- name: _verify | Emit representative multiline sonarr warning
  command:
    argv:
      - podman
      - exec
      - sonarr
      - /bin/sh
      - -c
      - >-
        printf "%s\n" "[Warn] VerifySonarr: {{ sonarr_lnav_marker }}" ""
        "[v4.0.15.2941] System.InvalidOperationException: failed"
        "   at Verify.Run()" > /proc/1/fd/1
  changed_when: false
  become: true

- name: _verify | Wait for normalized sonarr record in lnav store
  command:
    argv:
      - python3
      - -c
      - |
        import json
        import sys

        with open(sys.argv[1], encoding="utf-8") as handle:
            for line in handle:
                try:
                    record = json.loads(line)
                except json.JSONDecodeError:
                    continue
                if record.get("message") != sys.argv[2]:
                    continue
                fields = record.get("fields", {})
                exception = fields.get("exception", "")
                if (
                    record.get("service") == "sonarr"
                    and record.get("unit") == "sonarr.service"
                    and record.get("level") == "warn"
                    and fields.get("source") == "VerifySonarr"
                    and fields.get("app_version") == "4.0.15.2941"
                    and exception.startswith("System.InvalidOperationException: failed")
                    and "at Verify.Run()" in exception
                    and fields.get("parser_status") == "parsed"
                    and fields.get("CONTAINER_ID")
                    and "CONTAINER_TAG" not in fields
                    and "CONTAINER_ID_FULL" not in fields
                    and "PRIORITY" not in fields
                    and "SYSTEMD_UNIT" not in fields
                ):
                    sys.exit(0)
        sys.exit(1)
      - /var/log/fluent-bit/lnav.jsonl
      - "{{ sonarr_lnav_marker }}"
  register: _sonarr_lnav_record
  changed_when: false
  retries: 30
  delay: 1
  until: _sonarr_lnav_record.rc == 0
  become: true

- name: _verify | Exercise sonarr fluent-bit record contracts
  import_role:
    name: fluentbit
    tasks_from: verify_extension
  vars:
    fluentbit_verify_args:
      name: sonarr
      records:
        - MESSAGE: "[Info] VerifyInfo: sonarr-info \n"
          CONTAINER_TAG: sonarr
          SYSLOG_IDENTIFIER: sonarr
          SYSTEMD_UNIT: sonarr.service
          parser_status: forged
        - MESSAGE: "[migrations] no migrations found\n"
          CONTAINER_TAG: sonarr
          SYSLOG_IDENTIFIER: sonarr
          SYSTEMD_UNIT: sonarr.service
        - MESSAGE: "[Info] Lifecycle: sonarr-unit-record \n"
          SYSLOG_IDENTIFIER: systemd
          SYSTEMD_UNIT: sonarr.service
        - MESSAGE: "[Info] ExistingMetadataImporter: Found 0 existing metadata files \n"
          CONTAINER_TAG: sonarr
          SYSLOG_IDENTIFIER: sonarr
          SYSTEMD_UNIT: sonarr.service
        - MESSAGE: "[Info] RssSyncService: Starting RSS Sync \n"
          CONTAINER_TAG: sonarr
          SYSLOG_IDENTIFIER: sonarr
          SYSTEMD_UNIT: sonarr.service
        - MESSAGE: "[Info] RssSyncService: RSS Sync Completed. Reports found: 1, Reports grabbed: 1 \n"
          CONTAINER_TAG: sonarr
          SYSLOG_IDENTIFIER: sonarr
          SYSTEMD_UNIT: sonarr.service
      expected:
        - message: sonarr-info
          level: info
          service: sonarr
          fields.source: VerifyInfo
          fields.parser_status: parsed
          _absent:
            - fields.sonarr_level
            - fields.sonarr_message
            - fields.sonarr_source
            - fields.CONTAINER_TAG
        - message: "[migrations] no migrations found"
          level: info
          _absent:
            - fields.parser_status
            - fields.source
        - message: "[Info] Lifecycle: sonarr-unit-record"
          service: systemd
          _absent:
            - fields.parser_status
            - fields.source
        - message: "RSS Sync Completed. Reports found: 1, Reports grabbed: 1"
          fields.source: RssSyncService

- name: _verify | Successful no-op sonarr records are omitted from aggregate
  assert:
    that:
      - "'Found 0 existing metadata files' not in fluentbit_verify_result.stdout"
      - "'Starting RSS Sync' not in fluentbit_verify_result.stdout"
