# Functional verification of the role's premise: bans land in
# `inet f2b-table` (the nftables-native banaction) and not in the
# iptables-nft compat `ip filter` table. Stat-only checks (unit
# active, file present) would pass even if the banaction silently
# regressed to iptables-multiport.

# Harness-invoked only; nftables is implicit on prod via the firewall
# role, but testrole.py fail2ban runs in isolation.
- name: _verify | Install nftables
  apt:
    pkg:
      - nftables
    cache_valid_time: 3600
  become: true

# fail2ban cold-starts in a few seconds after enable; status returns an
# error before the daemon is ready.
- name: _verify | Sshd jail uses the systemd journal backend
  command: fail2ban-client status sshd
  register: _fail2ban_status
  retries: 15
  delay: 2
  until:
    - _fail2ban_status.rc == 0
    - "'Journal matches:' in _fail2ban_status.stdout"
    - "'_COMM=sshd' in _fail2ban_status.stdout"
  changed_when: false
  become: true

# State-only assertion (function-test would need synthetic sshd-failure
# journal injection + findtime wait, and fail2ban-client `set banip`
# explicitly bypasses ignoreip — manual bans skip BanManager's filter,
# so a "ban an ignored IP" test would always land in f2b-table). This
# proves the daemon parsed the rendered jail and loaded each expected
# entry — catches empty-interpolation regressions that would silently
# shrink the whitelist.
- name: _verify | Fail2ban-client knows the configured ignoreip
  command: fail2ban-client get sshd ignoreip
  register: _fail2ban_ignoreip
  changed_when: false
  failed_when: >-
    _fail2ban_ignoreip.rc != 0
    or '127.0.0.0/8' not in _fail2ban_ignoreip.stdout
    or '::1' not in _fail2ban_ignoreip.stdout
    or network.sites.home.cidr not in _fail2ban_ignoreip.stdout
    or network.partitions.wireguard.cidr not in _fail2ban_ignoreip.stdout
  become: true

# Proves the sendmail-whois-lines.local override was parsed and the
# inherited start/stop notification handlers are neutralized -- queried
# from the loaded daemon, not stat'd off disk, so a precedence regression
# (e.g. the .local not winning over sendmail-common.conf) would surface.
# actionban is left intact and not asserted here (it carries the whois
# expansion that the synthetic-ban path below already exercises).
- name: _verify | Sendmail action start/stop handlers are empty
  command: fail2ban-client get sshd action sendmail-whois-lines {{ item }}
  register: _fail2ban_mail_handler
  changed_when: false
  failed_when: >-
    _fail2ban_mail_handler.rc != 0
    or _fail2ban_mail_handler.stdout | trim != ""
  become: true
  loop:
    - actionstart
    - actionstop

# Synthetic ban against TEST-NET-1 (RFC 5737); never matches a real client.
- name: _verify | Issue a synthetic ban
  command: fail2ban-client set sshd banip 192.0.2.1
  changed_when: true
  become: true

- name: _verify | Banned IP appears in inet f2b-table
  command: nft list table inet f2b-table
  register: _fail2ban_f2b_table
  changed_when: false
  failed_when: >-
    _fail2ban_f2b_table.rc != 0
    or '192.0.2.1' not in _fail2ban_f2b_table.stdout
  become: true

# Negative assertion: the iptables-nft compat `ip filter` table either
# does not exist (rc != 0) or does not carry an f2b-sshd chain. If it
# does, the banaction override silently reverted to iptables-multiport.
- name: _verify | Iptables-nft compat path is NOT used
  command: nft list table ip filter
  register: _fail2ban_ip_filter
  changed_when: false
  failed_when: _fail2ban_ip_filter.rc == 0 and 'chain f2b-' in _fail2ban_ip_filter.stdout
  become: true

- name: _verify | Unban the synthetic IP
  command: fail2ban-client set sshd unbanip 192.0.2.1
  changed_when: true
  become: true

- name: _verify | Banned IP is gone from inet f2b-table
  command: nft list table inet f2b-table
  register: _fail2ban_f2b_after
  changed_when: false
  failed_when: "'192.0.2.1' in _fail2ban_f2b_after.stdout"
  become: true
