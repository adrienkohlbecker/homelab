# Verify bans use the nftables-native table rather than the iptables-nft
# compatibility path.

# The isolated role harness does not run the firewall role.
- name: _verify | Install nftables
  apt:
    pkg:
      - nftables
    cache_valid_time: 3600
  become: true

# Status fails briefly while fail2ban cold-starts.
- name: _verify | Sshd jail uses the systemd journal backend
  command: fail2ban-client status sshd
  register: _fail2ban_status
  retries: 15
  delay: 2
  until:
    - _fail2ban_status.rc == 0
    - "'Journal matches:' in _fail2ban_status.stdout"
    - "'_COMM=sshd' in _fail2ban_status.stdout"
  changed_when: false
  become: true

# Manual bans bypass ignoreip, so query the daemon's loaded whitelist.
- name: _verify | Fail2ban-client knows the configured ignoreip
  command: fail2ban-client get sshd ignoreip
  register: _fail2ban_ignoreip
  changed_when: false
  failed_when: >-
    _fail2ban_ignoreip.rc != 0
    or '127.0.0.0/8' not in _fail2ban_ignoreip.stdout
    or '::1' not in _fail2ban_ignoreip.stdout
    or network.sites.home.cidr not in _fail2ban_ignoreip.stdout
    or network.partitions.wireguard.cidr not in _fail2ban_ignoreip.stdout
  become: true

# Query the loaded action so an override-precedence regression surfaces.
- name: _verify | Sendmail action start/stop handlers are empty
  command: fail2ban-client get sshd action sendmail-whois-lines {{ item }}
  register: _fail2ban_mail_handler
  changed_when: false
  failed_when: >-
    _fail2ban_mail_handler.rc != 0
    or _fail2ban_mail_handler.stdout | trim != ""
  become: true
  loop:
    - actionstart
    - actionstop

# Synthetic ban against TEST-NET-1 (RFC 5737); never matches a real client.
- name: _verify | Issue a synthetic ban
  command: fail2ban-client set sshd banip 192.0.2.1
  changed_when: true
  become: true

- name: _verify | Banned IP appears in inet f2b-table
  command: nft list table inet f2b-table
  register: _fail2ban_f2b_table
  changed_when: false
  failed_when: >-
    _fail2ban_f2b_table.rc != 0
    or '192.0.2.1' not in _fail2ban_f2b_table.stdout
  become: true

# An f2b chain here means the banaction reverted to iptables-multiport.
- name: _verify | Iptables-nft compat path is NOT used
  command: nft list table ip filter
  register: _fail2ban_ip_filter
  changed_when: false
  failed_when: _fail2ban_ip_filter.rc == 0 and 'chain f2b-' in _fail2ban_ip_filter.stdout
  become: true

- name: _verify | Unban the synthetic IP
  command: fail2ban-client set sshd unbanip 192.0.2.1
  changed_when: true
  become: true
