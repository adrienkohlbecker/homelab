- name: Assert radarr_api_key is provided
  assert:
    that:
      - (radarr_api_key | default('')) | length > 0
    fail_msg: >-
      radarr_api_key is required (vaulted in group_vars/{prod,test}.yml). Without it
      config.xml renders an empty <ApiKey>, radarr self-generates a random key on
      boot, and every intra-stack X-Api-Key consumer (bazarr, seerr, ...) silently
      breaks.
  tags:
    - radarr

- name: Set up media runtime
  import_role:
    name: media
    tasks_from: runtime
  tags:
    - radarr

- name: Set up radarr system user, group, and config dir
  import_role:
    name: service_user
    tasks_from: user
  vars:
    service_user_args:
      name: radarr
      # Match linuxserver's recursive PUID:PGID chown of /config so Ansible
      # does not flap the directory group after each container start.
      shared_group: media
  tags:
    - radarr

- name: Configure radarr
  # Radarr writes config.xml without a trailing newline on shutdown. Its API
  # key has no file/env override, and podman-network peers bypass nginx, so
  # local-address authentication must remain X-Api-Key-gated.
  copy:
    content: "{{ lookup('template', 'config.xml.j2') | rstrip_newlines }}"
    dest: /mnt/services/radarr/config.xml
    owner: radarr
    group: media
    mode: "0600"
    backup: true
    validate: python3 -c 'import xml.etree.ElementTree as ET, sys; ET.parse(sys.argv[1])' "%s"
  register: radarr_conf
  become: true
  # A fresh check-mode run has no resolved user or config directory yet.
  when: not ansible_check_mode or radarr_user.uid is defined
  tags:
    - radarr

- name: Pull radarr image
  import_role:
    name: podman
    tasks_from: image
  vars:
    podman_image_args:
      name: radarr
      image: "{{ radarr_image }}"
  tags:
    - radarr

- name: Manage radarr service
  import_role:
    name: systemd_unit
    tasks_from: unit
  vars:
    systemd_unit_args:
      src: radarr.service.j2
      condition: "{{ not ansible_check_mode or radarr_user.uid is defined }}"
      restart: "{{ radarr_conf.changed or radarr_user.changed or media_group.changed }}"
  tags:
    - radarr

- name: Configure nginx
  import_role:
    name: nginx
    tasks_from: site
  vars:
    nginx_site_args:
      subdomain: radarr
      proxy_pass: http://127.0.0.1:{{ service_ports.radarr }}/
      # Browsers use Authelia forward-auth; podman peers bypass nginx with
      # X-Api-Key at radarr.dns.podman.
      auth: true
  tags:
    - radarr
