# Together the 401 and authenticated probes prove the templated API key is
# required and active.
- name: _verify | Radarr /api/v3/system/status rejects unauth'd requests
  uri:
    url: http://127.0.0.1:{{ service_ports.radarr }}/api/v3/system/status
    status_code: 401
  register: _radarr_http_unauth
  retries: 30
  delay: 2
  until: _radarr_http_unauth.status == 401

# Header form keeps the key out of journald.
- name: _verify | Radarr answers /api/v3/system/status with our apikey
  uri:
    url: http://127.0.0.1:{{ service_ports.radarr }}/api/v3/system/status
    headers:
      X-Api-Key: "{{ radarr_api_key }}"
    status_code: 200
  register: _radarr_http
  retries: 30
  delay: 2
  until: _radarr_http.status == 200
  failed_when: (_radarr_http.json | default({})) | length == 0

# Probe the Authelia-gated browser path separately from direct API access.
# Resolve the FQDN to loopback because a Host header on https://localhost
# leaves SNI=localhost, which OpenSSL rejects for this vhost.
- name: _verify | Map the radarr vhost FQDN to loopback for SNI-correct probing
  lineinfile:
    path: /etc/hosts
    line: "127.0.0.1 radarr.{{ inventory_hostname }}.{{ domain }}"
    state: present
  become: true

- name: _verify | Radarr UI gate redirects unauthenticated requests to Authelia
  uri:
    url: https://radarr.{{ inventory_hostname }}.{{ domain }}/
    validate_certs: false
    follow_redirects: none
    status_code: 302
  register: _radarr_nginx_gate
  failed_when: _radarr_nginx_gate is not authelia_redirects_to('radarr', inventory_hostname, domain)

# A 401 from radarr.dns.podman inside the container proves media-network DNS,
# API reachability, and authentication enforcement on the intra-stack path.
- name: _verify | Radarr is reachable intra-stack at radarr.dns.podman over the media network
  command: >-
    podman exec radarr
    curl -s -o /dev/null -w '%{http_code}'
    http://radarr.dns.podman:7878/api/v3/system/status
  become: true
  register: _radarr_dns_podman
  until: _radarr_dns_podman.rc == 0 and _radarr_dns_podman.stdout == "401"
  retries: 15
  delay: 2
  changed_when: false

# HTTP health does not prove that the hardcoded DB paths route onto the
# 4K-recordsize sqlite dataset or that the application populated them.
- name: _verify | Radarr DBs are populated on the sqlite dataset
  import_role:
    name: sqlite_dataset
    tasks_from: verify_dataset
  vars:
    sqlite_dataset_verify_args:
      name: radarr
      databases:
        - radarr.db
        - logs.db
      require_nonempty: true

# Radarr rewrites config.xml only on shutdown, beyond the idempotence pass;
# restart and compare the production contract to prevent restart churn.
- name: _verify | Restart radarr to force a config.xml writeback
  systemd:
    name: radarr
    state: restarted
  become: true

- name: _verify | Radarr is back up after the restart
  uri:
    url: http://127.0.0.1:{{ service_ports.radarr }}/api/v3/system/status
    headers:
      X-Api-Key: "{{ radarr_api_key }}"
    status_code: 200
  register: _radarr_http_postrestart
  retries: 60
  delay: 2
  until: _radarr_http_postrestart.status == 200

# Re-run the production file contract in check mode after Radarr's writeback.
# Any predicted change means content, ownership, or mode drifted.
- name: _verify | Config.xml remains converged after radarr's writeback
  copy:
    content: "{{ lookup('template', 'config.xml.j2') | rstrip_newlines }}"
    dest: /mnt/services/radarr/config.xml
    owner: radarr
    group: media
    mode: "0600"
  check_mode: true
  diff: false
  register: _radarr_conf_check
  failed_when: _radarr_conf_check.changed
  become: true
