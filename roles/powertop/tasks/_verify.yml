# Auto-tune choices depend on VM hardware and rejected sysfs writes do not
# fail the process, so successful process completion is the portable contract.

- name: _verify | Read powertop unit state  # noqa: command-instead-of-module
  command: systemctl show powertop --property=ActiveState,Result,ExecMainStatus
  register: powertop_show
  changed_when: false
  become: true

- name: _verify | Assert --auto-tune ran to completion
  assert:
    that:
      - "'ActiveState=active' in powertop_show.stdout"
      - "'Result=success' in powertop_show.stdout"
      - "'ExecMainStatus=0' in powertop_show.stdout"
    fail_msg: >-
      powertop.service did not complete cleanly; --auto-tune may have
      errored. systemctl show output: {{ powertop_show.stdout }}
