- name: Install powertop
  apt:
    pkg: powertop
    policy_rc_d: 101
    cache_valid_time: 3600
  become: true
  register: powertop_apt
  tags:
    - powertop

- name: Manage powertop service
  import_role:
    name: systemd_unit
    tasks_from: unit
  vars:
    systemd_unit_args:
      src: powertop.service
      # Fresh check mode predicts the package before its binary or unit exists.
      condition: "{{ not (ansible_check_mode and powertop_apt.changed) }}"
  tags:
    - powertop
