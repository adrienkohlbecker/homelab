# The probe is the send side of the received-property repair check on ZFS
# hosts and the plain-directory fallback on the others. Consumer roles
# (services, data, media, scratch) assert the mount contract of real datasets.
- name: _verify | Exercise dataset helper with a throwaway probe
  vars:
    zfs_dataset_args:
      dataset: '{{ zfs_tank_filesystem }}/_verify_probe'
      mountpoint: /mnt/_verify_probe
  import_tasks: dataset.yml

- name: _verify | Set a property on the send-side probe
  when: zfs_root
  command: zfs set compression=zstd {{ zfs_tank_filesystem }}/_verify_probe
  changed_when: true
  become: true

- name: _verify | Snapshot the send-side probe
  when: zfs_root
  command: zfs snapshot {{ zfs_tank_filesystem }}/_verify_probe@received_property
  changed_when: true
  become: true

- name: _verify | Receive a dataset with inherited property sources
  when: zfs_root
  shell: |
    set -euo pipefail
    zfs send -p {{ zfs_tank_filesystem }}/_verify_probe@received_property |
      zfs receive -u {{ zfs_tank_filesystem }}/_verify_received
  args:
    executable: /bin/bash
  changed_when: true
  become: true

- name: _verify | Confirm the received property starts non-local
  when: zfs_root
  command: zfs get -H -o property,source compression {{ zfs_tank_filesystem }}/_verify_received
  register: _zfs_dataset_verify_received_before
  changed_when: false
  failed_when: _zfs_dataset_verify_received_before.stdout != "compression\treceived"
  become: true

- name: _verify | Reconcile the received dataset through the production helper
  when: zfs_root
  vars:
    zfs_dataset_args:
      dataset: '{{ zfs_tank_filesystem }}/_verify_received'
      mountpoint: /mnt/_verify_received
      extra_properties:
        compression: zstd
  import_tasks: dataset.yml

- name: _verify | Confirm the production helper localized the property
  when: zfs_root
  command: zfs get -H -o property,source compression {{ zfs_tank_filesystem }}/_verify_received
  register: _zfs_dataset_verify_received_after
  changed_when: false
  failed_when: _zfs_dataset_verify_received_after.stdout != "compression\tlocal"
  become: true

- name: _verify | Exercise the plain-directory fallback as the operator
  when: not zfs_root
  command:
    argv:
      - python3
      - -c
      - |-
        from pathlib import Path
        probe = Path("/mnt/_verify_probe/operator-write")
        probe.write_text("fallback works\n")
        print(probe.read_text(), end="")
  register: _zfs_dataset_verify_fallback
  changed_when: true
  failed_when: _zfs_dataset_verify_fallback.stdout != 'fallback works'

# Retire the probe holding a nightly-style snapshot and data written after it:
# the data leaves the live dataset but stays in its history, including what
# the nightly snapshot missed, a final empty @bak- snapshot joins it, and the
# dataset stays in the backup mesh, unmounted. Non-ZFS hosts lose their plain
# directory.
- name: _verify | Tag the probe for backups
  when: zfs_root
  command: zfs set autobackup:bak=true {{ zfs_tank_filesystem }}/_verify_probe
  changed_when: true
  become: true

- name: _verify | Write a payload into the probe
  when: zfs_root
  command:
    argv:
      - dd
      - if=/dev/urandom
      - of=/mnt/_verify_probe/payload.bin
      - bs=1M
      - count=4
    creates: /mnt/_verify_probe/payload.bin
  become: true

- name: _verify | Snapshot the probe like a nightly run
  when: zfs_root
  command: zfs snapshot {{ zfs_tank_filesystem }}/_verify_probe@bak-20260101020000
  changed_when: true
  become: true

- name: _verify | Write into the probe after its nightly snapshot
  when: zfs_root
  command:
    argv:
      - dd
      - if=/dev/urandom
      - of=/mnt/_verify_probe/late.bin
      - bs=1M
      - count=4
    creates: /mnt/_verify_probe/late.bin
  become: true

# A filesystem mounted over the probe is what the delete would traverse, while
# the snapshot would capture only the probe: retirement must refuse, leaving
# both untouched.
- name: _verify | Refuse to retire the probe under a shadowing mount
  when: zfs_root
  block:
    # ansible.posix.mount would treat the mounted probe path as already done.
    - name: _verify | Mount a tmpfs over the probe
      command: mount -t tmpfs _verify_shadow /mnt/_verify_probe  # noqa: command-instead-of-module
      changed_when: true
      become: true

    - name: _verify | Write into the shadowing tmpfs
      command: touch /mnt/_verify_probe/shadow
      changed_when: true
      become: true

    - name: _verify | Retire the shadowed probe through the production helper
      vars:
        zfs_dataset_args:
          dataset: '{{ zfs_tank_filesystem }}/_verify_probe'
          mountpoint: /mnt/_verify_probe
      import_tasks: remove.yml

    - name: _verify | Reject a retirement that went ahead
      fail:
        msg: Retirement emptied a probe shadowed by another mount

  rescue:
    - name: _verify | Require the mount guard to refuse
      assert:
        that: ansible_failed_task.name == 'remove | Assert the dataset is what is mounted'
        fail_msg: "Expected the mount guard to refuse, got {{ ansible_failed_task.name | default('<unknown>') }}"

- name: _verify | Shadowing tmpfs kept its contents
  when: zfs_root
  command: test -e /mnt/_verify_probe/shadow
  changed_when: false
  become: true

- name: _verify | Unmount the shadowing tmpfs
  when: zfs_root
  command: umount --types tmpfs /mnt/_verify_probe
  changed_when: true
  become: true

- name: _verify | Probe kept its contents and mount unit
  when: zfs_root
  command: test -e {{ item }}
  loop:
    - /mnt/_verify_probe/late.bin
    - /etc/systemd/system/{{ '/mnt/_verify_probe' | zfs_mount_unit }}
  changed_when: false
  become: true

- name: _verify | Retire the probe through the production helper
  vars:
    zfs_dataset_args:
      dataset: '{{ zfs_tank_filesystem }}/_verify_probe'
      mountpoint: /mnt/_verify_probe
  import_tasks: remove.yml

# A second retirement must find nothing left to do.
- name: _verify | Retire the probe again
  vars:
    zfs_dataset_args:
      dataset: '{{ zfs_tank_filesystem }}/_verify_probe'
      mountpoint: /mnt/_verify_probe
  import_tasks: remove.yml

# A boot-time mount pass must leave the retired dataset alone.
- name: _verify | Mount every ZFS filesystem
  when: zfs_root
  command: zfs mount -a
  changed_when: false
  become: true

- name: _verify | Read the retired probe
  when: zfs_root
  command:
    argv:
      - zfs
      - get
      - -H
      - -p
      - -o
      - property,value
      - canmount,mounted,autobackup:bak,referenced
      - '{{ zfs_tank_filesystem }}/_verify_probe'
  register: _zfs_dataset_verify_retired
  changed_when: false
  become: true

- name: _verify | List the retired probe snapshots
  when: zfs_root
  command: zfs list -H -p -t snapshot -s createtxg -o name,referenced {{ zfs_tank_filesystem }}/_verify_probe
  register: _zfs_dataset_verify_retired_snapshots
  changed_when: false
  become: true

- name: _verify | Stat the retired probe mountpoint and mount unit
  stat:
    path: '{{ item }}'
  loop:
    - /mnt/_verify_probe
    - /etc/systemd/system/{{ '/mnt/_verify_probe' | zfs_mount_unit }}
  register: _zfs_dataset_verify_retired_paths

- name: _verify | Retired probe is empty, unmounted, and still backed up
  when: zfs_root
  vars:
    props: "{{ dict(_zfs_dataset_verify_retired.stdout_lines | map('split', '\t')) }}"
    snapshots: "{{ dict(_zfs_dataset_verify_retired_snapshots.stdout_lines | map('split', '\t')) }}"
    nightly: "{{ zfs_tank_filesystem ~ '/_verify_probe@bak-20260101020000' }}"
    kept: "{{ snapshots.keys() | list | select('search', '@bak-') | reject('equalto', nightly) | first }}"
    final: "{{ snapshots.keys() | list | last }}"
  assert:
    that:
      - props.canmount == 'off'
      - props.mounted == 'no'
      - props['autobackup:bak'] == 'true'
      - props.referenced | int < 1048576
      - nightly in snapshots
      - snapshots.keys() | select('search', '@bak-') | list | length == 3
      - snapshots[kept] | int >= 8388608
      - final is match('.*@bak-[0-9]{14}$')
      - final != kept
      - snapshots[final] | int < 1048576
      - _zfs_dataset_verify_retired_paths.results | selectattr('stat.exists') | list | length == 0
    fail_msg: "{{ props }} {{ snapshots }}"

- name: _verify | Plain-directory fallback is deleted
  when: not zfs_root
  assert:
    that: not _zfs_dataset_verify_retired_paths.results[0].stat.exists
