# The probe is the send side of the received-property repair check on ZFS
# hosts and the plain-directory fallback on the others. Consumer roles
# (services, data, media, scratch) assert the mount contract of real datasets.
- name: _verify | Exercise dataset helper with a throwaway probe
  vars:
    zfs_dataset_args:
      dataset: '{{ zfs_tank_filesystem }}/_verify_probe'
      mountpoint: /mnt/_verify_probe
  import_tasks: dataset.yml

- name: _verify | Set a property on the send-side probe
  when: zfs_root
  command: zfs set compression=zstd {{ zfs_tank_filesystem }}/_verify_probe
  changed_when: true
  become: true

- name: _verify | Snapshot the send-side probe
  when: zfs_root
  command: zfs snapshot {{ zfs_tank_filesystem }}/_verify_probe@received_property
  changed_when: true
  become: true

- name: _verify | Receive a dataset with inherited property sources
  when: zfs_root
  shell: |
    set -euo pipefail
    zfs send -p {{ zfs_tank_filesystem }}/_verify_probe@received_property |
      zfs receive -u {{ zfs_tank_filesystem }}/_verify_received
  args:
    executable: /bin/bash
  changed_when: true
  become: true

- name: _verify | Confirm the received property starts non-local
  when: zfs_root
  command: zfs get -H -o property,source compression {{ zfs_tank_filesystem }}/_verify_received
  register: _zfs_dataset_verify_received_before
  changed_when: false
  failed_when: _zfs_dataset_verify_received_before.stdout != "compression\treceived"
  become: true

- name: _verify | Reconcile the received dataset through the production helper
  when: zfs_root
  vars:
    zfs_dataset_args:
      dataset: '{{ zfs_tank_filesystem }}/_verify_received'
      mountpoint: /mnt/_verify_received
      extra_properties:
        compression: zstd
  import_tasks: dataset.yml

- name: _verify | Confirm the production helper localized the property
  when: zfs_root
  command: zfs get -H -o property,source compression {{ zfs_tank_filesystem }}/_verify_received
  register: _zfs_dataset_verify_received_after
  changed_when: false
  failed_when: _zfs_dataset_verify_received_after.stdout != "compression\tlocal"
  become: true

- name: _verify | Exercise the plain-directory fallback as the operator
  when: not zfs_root
  command:
    argv:
      - python3
      - -c
      - |-
        from pathlib import Path
        probe = Path("/mnt/_verify_probe/operator-write")
        probe.write_text("fallback works\n")
        print(probe.read_text(), end="")
  register: _zfs_dataset_verify_fallback
  changed_when: true
  failed_when: _zfs_dataset_verify_fallback.stdout != 'fallback works'

# Retire the probe holding live data and a nightly-style snapshot: the data
# leaves the live dataset but stays in its history, and the dataset stays in
# the backup mesh, unmounted. Non-ZFS hosts keep their plain directory.
- name: _verify | Tag the probe for backups
  when: zfs_root
  command: zfs set autobackup:bak=true {{ zfs_tank_filesystem }}/_verify_probe
  changed_when: true
  become: true

- name: _verify | Write a payload into the probe
  when: zfs_root
  command:
    argv:
      - dd
      - if=/dev/urandom
      - of=/mnt/_verify_probe/payload.bin
      - bs=1M
      - count=4
    creates: /mnt/_verify_probe/payload.bin
  become: true

- name: _verify | Snapshot the probe like a nightly run
  when: zfs_root
  command: zfs snapshot {{ zfs_tank_filesystem }}/_verify_probe@bak-20260101020000
  changed_when: true
  become: true

- name: _verify | Retire the probe through the production helper
  vars:
    zfs_dataset_args:
      dataset: '{{ zfs_tank_filesystem }}/_verify_probe'
      mountpoint: /mnt/_verify_probe
  import_tasks: remove.yml

# A second retirement must find nothing left to do.
- name: _verify | Retire the probe again
  vars:
    zfs_dataset_args:
      dataset: '{{ zfs_tank_filesystem }}/_verify_probe'
      mountpoint: /mnt/_verify_probe
  import_tasks: remove.yml

# A boot-time mount pass must leave the retired dataset alone.
- name: _verify | Mount every ZFS filesystem
  when: zfs_root
  command: zfs mount -a
  changed_when: false
  become: true

- name: _verify | Read the retired probe
  when: zfs_root
  command:
    argv:
      - zfs
      - get
      - -H
      - -p
      - -o
      - property,value
      - canmount,mounted,autobackup:bak,referenced
      - '{{ zfs_tank_filesystem }}/_verify_probe'
  register: _zfs_dataset_verify_retired
  changed_when: false
  become: true

- name: _verify | List the retired probe snapshots
  when: zfs_root
  command: zfs list -H -t snapshot -o name {{ zfs_tank_filesystem }}/_verify_probe
  register: _zfs_dataset_verify_retired_snapshots
  changed_when: false
  become: true

- name: _verify | Stat the retired probe mountpoint and mount unit
  stat:
    path: '{{ item }}'
  loop:
    - /mnt/_verify_probe
    - /etc/systemd/system/{{ '/mnt/_verify_probe' | zfs_mount_unit }}
  register: _zfs_dataset_verify_retired_paths

- name: _verify | Retired probe is empty, unmounted, and still backed up
  when: zfs_root
  vars:
    props: "{{ dict(_zfs_dataset_verify_retired.stdout_lines | map('split', '\t')) }}"
  assert:
    that:
      - props.canmount == 'off'
      - props.mounted == 'no'
      - props['autobackup:bak'] == 'true'
      - props.referenced | int < 1048576
      - (zfs_tank_filesystem ~ '/_verify_probe@bak-20260101020000') in _zfs_dataset_verify_retired_snapshots.stdout_lines
      - _zfs_dataset_verify_retired_paths.results | selectattr('stat.exists') | list | length == 0
    fail_msg: "{{ props }} {{ _zfs_dataset_verify_retired_snapshots.stdout_lines }}"

- name: _verify | Plain-directory fallback keeps its data
  when: not zfs_root
  assert:
    that: _zfs_dataset_verify_retired_paths.results[0].stat.exists
