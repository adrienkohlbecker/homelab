# Retire a dataset `dataset` created. Inputs: a single dict `zfs_dataset_args`
# with keys:
#   dataset     full dataset path (e.g. rpool/services/sqlite)
#   mountpoint  its mountpoint (e.g. /mnt/services/sqlite)
#
# Retiring is not destroying: a @bak- snapshot in zfs-autobackup's naming
# keeps the contents as they stand, the live dataset is emptied, a final @bak-
# snapshot records that empty state, and the dataset is left unmounted
# (canmount=off) with its mount unit and mountpoint directory removed. Every
# snapshot is kept and autobackup:bak is left alone, so the onsite and offsite
# legs carry the final state. The history then thins like any other dataset's
# until the operator sets autobackup:bak=false on the source and its replicas
# (freezing it) and destroys them by hand.
#
# On a non-ZFS host the mountpoint is a plain directory and is deleted.
#
# Publishes nothing and takes no `condition`; gate a conditional retirement
# with `when:` on the import.
- name: remove | Assert required dataset inputs
  assert:
    that:
      - zfs_dataset_args.dataset is defined
      - zfs_dataset_args.mountpoint is defined
    quiet: true

- name: remove | Retire the dataset
  when: zfs_root
  block:
    - name: remove | Retire the dataset mount unit
      import_role:
        name: systemd_unit
        tasks_from: remove
      vars:
        systemd_unit_args:
          dest: "{{ zfs_dataset_args.mountpoint | zfs_mount_unit }}"

    - name: remove | Read the dataset mount state
      command:
        argv:
          - zfs
          - get
          - -H
          - -o
          - value
          - canmount,mounted
          - "{{ zfs_dataset_args.dataset }}"
      register: _zfs_dataset_remove_state
      changed_when: false
      check_mode: false
      failed_when: >-
        _zfs_dataset_remove_state.rc != 0
        and 'dataset does not exist' not in _zfs_dataset_remove_state.stderr
      become: true

    - name: remove | Empty the dataset and stop mounting it
      when:
        - _zfs_dataset_remove_state.rc == 0
        - _zfs_dataset_remove_state.stdout_lines[0] != 'off'
      block:
        # Guard the delete: it must only ever see the dataset, never the parent
        # directory underneath an unmounted mountpoint. A not-yet-retired
        # dataset that is not mounted fails here rather than being left
        # unmountable with its contents still live. Only the mount table is
        # checked: zfs_check_mount's live-service contract (readonly=off) does
        # not hold for a dataset already frozen by hand, and a read-only one
        # with contents left fails the delete below instead.
        - name: remove | Assert the dataset is what is mounted
          command:
            argv:
              - findmnt
              - --source
              - "{{ zfs_dataset_args.dataset }}"
              - --mountpoint
              - "{{ zfs_dataset_args.mountpoint }}"
              - --types
              - zfs
              - --noheadings
          changed_when: false
          become: true

        # Keeps what changed since the last nightly @bak-. Host-local time, as
        # zfs-autobackup names its own snapshots.
        - name: remove | Snapshot the dataset before emptying it
          shell: |
            set -euo pipefail
            stamp=$(date +%Y%m%d%H%M%S)
            zfs snapshot "{{ zfs_dataset_args.dataset }}@bak-$stamp"
            echo "$stamp"
          args:
            executable: /bin/bash
          register: _zfs_dataset_remove_kept
          changed_when: true
          become: true

        - name: remove | Empty the dataset
          command:
            argv:
              - find
              - "{{ zfs_dataset_args.mountpoint }}"
              - -xdev
              - -mindepth
              - 1
              - -delete
          changed_when: true
          become: true

        # Snapshot names have one-second resolution, so wait out the second
        # the snapshot above took.
        - name: remove | Take the final snapshot
          shell: |
            set -euo pipefail
            while [ "$(date +%Y%m%d%H%M%S)" = "{{ _zfs_dataset_remove_kept.stdout }}" ]; do
              sleep 0.1
            done
            zfs snapshot "{{ zfs_dataset_args.dataset }}@bak-$(date +%Y%m%d%H%M%S)"
          args:
            executable: /bin/bash
          changed_when: true
          become: true

        - name: remove | Stop mounting the dataset
          community.general.zfs:
            name: "{{ zfs_dataset_args.dataset }}"
            state: present
            extra_zfs_properties:
              canmount: 'off'
          become: true

    - name: remove | Unmount the dataset
      when:
        - _zfs_dataset_remove_state.rc == 0
        - _zfs_dataset_remove_state.stdout_lines[1] == 'yes'
      command:
        argv:
          - zfs
          - unmount
          - "{{ zfs_dataset_args.dataset }}"
      register: _zfs_dataset_remove_unmount
      changed_when: _zfs_dataset_remove_unmount.rc == 0
      # canmount=off unmounts on its own; an already-unmounted dataset is fine.
      failed_when: >-
        _zfs_dataset_remove_unmount.rc != 0
        and 'not currently mounted' not in _zfs_dataset_remove_unmount.stderr
      become: true

    # rmdir refuses a non-empty directory, so anything written underneath the
    # unmounted mountpoint fails loudly instead of vanishing.
    - name: remove | Remove the mountpoint directory
      command:
        argv:
          - rmdir
          - "{{ zfs_dataset_args.mountpoint }}"
        removes: "{{ zfs_dataset_args.mountpoint }}"
      become: true

- name: remove | Delete the plain mountpoint directory
  when: not zfs_root
  file:
    path: "{{ zfs_dataset_args.mountpoint }}"
    state: absent
  become: true
