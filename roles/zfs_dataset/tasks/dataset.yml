# Generic zfs dataset creator. Inputs: caller passes a single dict
# `zfs_dataset_args` with keys:
#   dataset             full dataset path (e.g. rpool/services)
#   mountpoint          mountpoint (e.g. /mnt/brumath)
#   extra_properties    optional dict of extra zfs properties to set
#   owner               optional mountpoint dir owner (default: ansible_user_id)
#   group               optional mountpoint dir group (default: ansible_user_id)
#   mode                optional mountpoint dir mode (default: "0755")
#
# The dict form prevents inter-call leakage at play-vars scope: each
# import_role pass replaces the whole `zfs_dataset_args` value, so a
# previous caller's mode/group/etc. can't bleed into the next caller
# that doesn't explicitly override.
#
# When `zfs_root` is false (the minimal fixture), the
# dataset and its mount unit are skipped, but the mountpoint directory is
# still created unconditionally: consumer roles bind-mount or write into that
# path and expect it to exist regardless of the storage backend, so a plain
# directory is the correct degraded behavior rather than a hard failure.

# Inner task `name:` strings are static -- no `{{ zfs_dataset_args.* }}`
# interpolation. Ansible renders `name:` at parse time, but callers only
# populate `zfs_dataset_args` at runtime via `import_role` inline vars under
# a dynamic include -- so a parse-time render would fail with
# "zfs_dataset_args is undefined". Per-iteration context comes from the
# caller's loop_control.label.
- name: Create and mount zfs dataset
  tags:
    - zfs_dataset
  block:
    - name: Assert required dataset inputs
      assert:
        that:
          - zfs_dataset_args.dataset is defined
          - zfs_dataset_args.mountpoint is defined
        fail_msg: >-
          zfs_dataset_args must include 'dataset' and 'mountpoint' keys.

    - name: Create zfs filesystem
      when: zfs_root
      community.general.zfs:
        name: '{{ zfs_dataset_args.dataset }}'
        state: present
        extra_zfs_properties: "{{ (zfs_dataset_args.extra_properties | default({})) | combine({'mountpoint': zfs_dataset_args.mountpoint}) }}"
      become: true

    # community.general.zfs treats a property whose value already matches as
    # set, even when its source is `received` -- so a dataset restored via
    # `zfs recv` (the fox rebuild lab->fox restore) keeps every property at
    # source=received and the module never forces it local. That silently
    # breaks backups: zfs-autobackup picks with `-s local`, so a received
    # autobackup:bak drops the dataset from all snapshots/offsite, and _verify
    # (which asserts source=local) would fail. Re-set any extra property whose
    # live source drifted from local; the get is read-only and the set only
    # fires on the drifted ones, so a normal converge stays idempotent.
    - name: Read the source of each extra property
      when:
        - zfs_root
        - (zfs_dataset_args.extra_properties | default({})) | length > 0
      command:
        argv:
          - zfs
          - get
          - -H
          - -o
          - property,source
          - "{{ (zfs_dataset_args.extra_properties | default({})).keys() | join(',') }}"
          - '{{ zfs_dataset_args.dataset }}'
      register: _zfs_dataset_prop_sources
      changed_when: false
      become: true

    - name: Force extra properties to a local source when a restore left them received
      when:
        - zfs_root
        - (zfs_dataset_args.extra_properties | default({})) | length > 0
        - __prop_line.split()[1] != 'local'
      command:
        argv:
          - zfs
          - set
          - "{{ __prop_line.split()[0] }}={{ (zfs_dataset_args.extra_properties)[__prop_line.split()[0]] }}"
          - '{{ zfs_dataset_args.dataset }}'
      loop: "{{ _zfs_dataset_prop_sources.stdout_lines | default([]) }}"
      loop_control:
        # Distinct loop_var: the parent services/data role includes this file in a
        # loop over `item`, so reusing `item` here collides with that outer dict.
        loop_var: __prop_line
        label: "{{ zfs_dataset_args.dataset }} {{ __prop_line.split()[0] }} ({{ __prop_line.split()[1] | default('?') }} -> local)"
      changed_when: true
      become: true

    - name: Create mount point
      file:
        dest: '{{ zfs_dataset_args.mountpoint }}'
        state: directory
        owner: "{{ zfs_dataset_args.owner | default(ansible_user_id) }}"
        group: "{{ zfs_dataset_args.group | default(ansible_user_id) }}"
        mode: "{{ zfs_dataset_args.mode | default('0755') }}"
      become: true

    - name: Set up mount service
      when: zfs_root
      import_role:
        name: zfs
        tasks_from: mount_unit
      vars:
        zfs_mount_args:
          dataset: '{{ zfs_dataset_args.dataset }}'
          mountpoint: '{{ zfs_dataset_args.mountpoint }}'
