# With rpc-authentication-required on, transmission answers an unauthenticated
# request with 401 (Basic realm="Transmission") -- auth is checked before the
# CSRF handshake, so the 401 (not the 409 you'd see auth-off) proves the daemon
# is up, serving RPC over the host loopback publish, AND enforcing auth.
- name: _verify | Transmission RPC is listening on loopback and enforcing auth
  uri:
    url: http://127.0.0.1:{{ service_ports.transmission }}/transmission/rpc
    method: POST
    body: '{"method":"session-get"}'
    body_format: json
    status_code: 401
  register: _transmission_rpc
  retries: 30
  delay: 2
  until: _transmission_rpc.status == 401

- name: _verify | Read authentication warnings before the container healthcheck
  command:
    argv:
      - journalctl
      - --boot
      - CONTAINER_TAG=transmission
      - --grep=Rejected request from 127.0.0.1
      - --output=json
      - --no-pager
  register: _transmission_auth_warnings_before_healthcheck
  changed_when: false
  failed_when: false
  become: true

- name: _verify | Run the configured container healthcheck
  command:
    argv:
      - podman
      - healthcheck
      - run
      - transmission
  changed_when: false
  become: true

- name: _verify | Read authentication warnings after the container healthcheck
  command:
    argv:
      - journalctl
      - --boot
      - CONTAINER_TAG=transmission
      - --grep=Rejected request from 127.0.0.1
      - --output=json
      - --no-pager
  register: _transmission_auth_warnings_after_healthcheck
  changed_when: false
  failed_when: false
  become: true

- name: _verify | Container healthcheck does not attempt RPC authentication
  assert:
    that:
      - >-
        _transmission_auth_warnings_after_healthcheck.stdout_lines | length ==
        _transmission_auth_warnings_before_healthcheck.stdout_lines | length
    fail_msg: "Transmission healthcheck emitted an RPC authentication warning"

- name: _verify | Read the image-managed blocklist schedule
  command:
    argv:
      - podman
      - exec
      - transmission
      - crontab
      - -l
      - -u
      - abc
  register: _transmission_crontab
  changed_when: false
  become: true

- name: _verify | Image schedules the daily blocklist update
  assert:
    that:
      - >-
        _transmission_crontab.stdout_lines
        | select('match',
        '^0\s+3\s+\*\s+\*\s+\*\s+/app/blocklist-update[.]sh(?:\s+2>&1)?$')
        | list | length == 1
    fail_msg: "Transmission image no longer schedules /app/blocklist-update.sh daily at 03:00"

- name: _verify | Image blocklist updater is executable
  command:
    argv:
      - podman
      - exec
      - transmission
      - test
      - -x
      - /app/blocklist-update.sh
  changed_when: false
  become: true

# The vhost has `auth: true`, so the real browser path goes through
# Authelia. Assert a cookieless GET redirects to the portal -- this is the
# only probe that fails if `auth: true` is dropped from nginx_site_args.
# Asserting the returnUrl (rd=) echoes transmission's own URL proves the
# request routed to transmission's server_name, not the default vhost.
- name: _verify | Verify Transmission Authelia gate
  import_role:
    name: nginx
    tasks_from: verify_authelia_gate
  vars:
    nginx_verify_authelia_gate_args:
      subdomain: transmission

# The --network media join + transmission.dns.podman FQDN is how the *arr stack
# reaches transmission's RPC, bypassing nginx -- the loopback/nginx probes above
# don't exercise it, so a dropped `--network media` strands that path while
# leaving them green. transmission-remote completes the full CSRF handshake +
# login from a throwaway container on the media network, so this proves three
# things at once: aardvark resolves the FQDN, transmission listens on the podman
# network path, and the configured credential authenticates.
- name: _verify | Transmission RPC accepts the configured credential over the media network
  command: >-
    podman run --rm --network media --entrypoint /usr/bin/transmission-remote
    {{ transmission_image }}
    transmission.dns.podman:9091 --auth transmission:{{ transmission_rpc_password }} --session-info
  become: true
  register: _transmission_auth_ok
  until: _transmission_auth_ok.rc == 0
  retries: 15
  delay: 2
  changed_when: false

# shared_group: media (see main.yml) exists to stop ansible flapping
# /mnt/services/transmission's gid back to `transmission` against the
# linuxserver image's startup chown to PUID:PGID=transmission:media. Assert the
# dir landed group `media` so a regression in that setting surfaces here, not as
# a silent per-converge flap.
- name: _verify | Stat the transmission config dir
  stat:
    path: /mnt/services/transmission
  register: _transmission_config_dir
  become: true

- name: _verify | Transmission config dir is group media
  assert:
    that:
      - _transmission_config_dir.stat.gr_name == "media"
    fail_msg: "/mnt/services/transmission is not group media (gr_name={{ _transmission_config_dir.stat.gr_name }})"

# settings.json is the role's other fragile contract: transmission (and the
# linuxserver init) rewrite it on shutdown/start, so settings.json.j2 must match
# that writeback byte-for-byte or the next converge drifts and restart-churns
# forever. The idempotence pass can't catch this -- the harness never restarts
# transmission between converges. Force a clean shutdown+restart, read the
# rewritten rpc-password hash back (as main.yml does to stay idempotent), then
# assert our template still matches what was written.
- name: _verify | Restart transmission to force a settings.json writeback
  systemd:
    name: transmission
    state: restarted
  become: true

- name: _verify | Read the rewritten rpc-password hash back
  command: >-
    python3 -c 'import json,sys;
    print(json.load(open(sys.argv[1])).get("rpc-password",""))'
    /mnt/services/transmission/settings.json
  register: _transmission_postrestart_pw
  become: true
  changed_when: false

- name: _verify | Render the settings.json our template would write
  set_fact:
    _transmission_conf_expected: "{{ lookup('template', 'settings.json.j2') | rstrip_newlines }}"
  vars:
    transmission_rpc_password_hash: "{{ _transmission_postrestart_pw.stdout }}"

- name: _verify | Read settings.json back after the writeback
  slurp:
    src: /mnt/services/transmission/settings.json
  register: _transmission_conf_ondisk
  become: true

- name: _verify | Templated settings.json survives transmission's writeback without drift
  assert:
    that:
      - (_transmission_conf_ondisk.content | b64decode) == _transmission_conf_expected
    fail_msg: >-
      transmission rewrote settings.json into a form settings.json.j2 no longer
      matches -- its key order/types drifted from the writeback, so deploying
      would restart-churn. Re-capture settings.json.j2 from a running instance.

- name: _verify | Wait for normalized transmission output in lnav store
  command:
    argv:
      - python3
      - -c
      - |
        import json
        import sys

        with open(sys.argv[1], encoding="utf-8") as handle:
            for line in handle:
                try:
                    record = json.loads(line)
                except json.JSONDecodeError:
                    continue
                fields = record.get("fields", {})
                if (
                    record.get("service") == "transmission"
                    and record.get("message", "").startswith("Rejected request from 127.0.0.1")
                ):
                    sys.exit(0)
        sys.exit(1)
      - /var/log/fluent-bit/lnav.jsonl
  register: _transmission_lnav_record
  changed_when: false
  retries: 30
  delay: 2
  until: _transmission_lnav_record.rc == 0
  become: true

- name: _verify | Exercise transmission fluent-bit record contracts
  import_role:
    name: fluentbit
    tasks_from: verify_extension
  vars:
    fluentbit_verify_args:
      name: transmission
      records:
        - MESSAGE: "[2099-01-02T03:04:05.678+0100] ERR utils.cc:144 Couldn't read '/config/queue.json': No such file or directory (2) (utils.cc:144)"
          CONTAINER_TAG: transmission
          SYSLOG_IDENTIFIER: transmission
          SYSTEMD_UNIT: transmission.service
        - MESSAGE: '[2099-01-02T03:04:06.789+0100] WRN rpc-server.cc:570 Rejected request from 127.0.0.1 (failed authentication) (rpc-server.cc:570)'
          CONTAINER_TAG: transmission
          SYSLOG_IDENTIFIER: transmission
          SYSTEMD_UNIT: transmission.service
        - MESSAGE: '[ls.io-init] done.'
          CONTAINER_TAG: transmission
          SYSLOG_IDENTIFIER: transmission
          SYSTEMD_UNIT: transmission.service
        - MESSAGE: Started transmission.
          SYSLOG_IDENTIFIER: systemd
          SYSTEMD_UNIT: transmission.service
      expected:
        - message: "Couldn't read '/config/queue.json': No such file or directory (2)"
          level: error
          service: transmission
          fields.source: utils.cc
          fields.source_line: 144
          _absent:
            - fields.transmission_level
            - fields.CONTAINER_TAG
        - message: Rejected request from 127.0.0.1 (failed authentication)
          level: warn
          fields.source: rpc-server.cc
          fields.source_line: 570
        - message: '[ls.io-init] done.'
          service: transmission
        - message: Started transmission.
          service: systemd
