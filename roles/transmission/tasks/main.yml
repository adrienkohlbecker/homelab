- name: Assert required inputs
  assert:
    that:
      - transmission_rpc_password is defined
      - (transmission_rpc_password | default('')) | length > 0
      - not (transmission_rpc_password | transmission_password_is_salted_hash)
    fail_msg: >-
      transmission_rpc_password must be a plaintext password (vaulted in
      group_vars/{prod,test}.yml), not Transmission's persisted salted hash.
    quiet: true
  tags:
    - transmission

- name: Add media group
  import_role:
    name: media
    tasks_from: group
  tags:
    - transmission

- name: Set up transmission system user, group, and config dir
  import_role:
    name: service_user
    tasks_from: user
  vars:
    service_user_args:
      name: transmission
      shared_group: media
  tags:
    - transmission

- name: Create scratch directory
  when: not ansible_check_mode or transmission_user.uid is defined
  file:
    dest: /mnt/scratch/transmission
    state: directory
    owner: transmission
    group: media
    mode: "0775"
  become: true
  tags:
    - transmission

- name: Create storage directory
  when: not ansible_check_mode or transmission_user.uid is defined
  file:
    dest: /mnt/media/Torrents
    state: directory
    owner: transmission
    group: media
    mode: "0775"
  become: true
  tags:
    - transmission

# Transmission salts+hashes rpc-password on first read into `{<salt+sha1>}`
# form and writes it back on every shutdown. Reusing an existing hash only
# when it matches the managed plaintext keeps converges idempotent without
# preventing password rotation or committing the random salt to the repo.
# Empty, stale, or non-hash content falls through to the plaintext template
# var, which transmission then rehashes on next start.
- name: Read existing transmission rpc-password hash if present
  command: >-
    python3 -c 'import json,sys,os;
    f=sys.argv[1];
    print(json.load(open(f)).get("rpc-password","") if os.path.exists(f) else "")'
    /mnt/services/transmission/settings.json
  register: transmission_existing_pw
  become: true
  check_mode: false
  changed_when: false
  tags:
    - transmission

- name: Resolve transmission rpc-password (preserve matching salted hash)
  set_fact:
    _transmission_rpc_password_hash: >-
      {{ transmission_existing_pw.stdout
         if transmission_existing_pw.stdout
            | transmission_password_matches(transmission_rpc_password)
         else transmission_rpc_password }}
  tags:
    - transmission

# Transmission writes its in-memory state back to settings.json on every
# shutdown. `systemctl restart` stops the container AFTER Ansible writes the
# template, so the write-back clobbers our values. Fix: probe for drift; if
# the config will change, stop first so the write-back lands on the OLD state,
# then Ansible overwrites it, then the service starts with our values.
- name: Probe transmission config drift to gate the pre-write service stop
  check_mode: true
  when: not ansible_check_mode or transmission_user.uid is defined
  vars:
    transmission_rpc_password_hash: "{{ _transmission_rpc_password_hash }}"
  copy:
    content: "{{ lookup('template', 'settings.json.j2') | rstrip_newlines }}"
    dest: /mnt/services/transmission/settings.json
    owner: transmission
    group: media
    mode: "0664"
    validate: python3 -c 'import json,sys; json.load(open(sys.argv[1]))' "%s"
  register: _transmission_conf_probe
  become: true
  # noqa: require-backup — probe never writes; backup on the real write task below
  tags:
    - transmission

- name: Stop transmission before config write to prevent shutdown-time state overwrite
  systemd:
    name: transmission
    state: stopped
  become: true
  failed_when: false
  when:
    - not ansible_check_mode
    - _transmission_conf_probe.changed
  tags:
    - transmission

- name: Configure transmission
  when: not ansible_check_mode or transmission_user.uid is defined
  # Render via copy:content + rstrip_newlines because transmission rewrites
  # settings.json on every shutdown without a trailing newline; a plain
  # template: leaves us drifting forever.
  vars:
    transmission_rpc_password_hash: "{{ _transmission_rpc_password_hash }}"
  copy:
    content: "{{ lookup('template', 'settings.json.j2') | rstrip_newlines }}"
    dest: /mnt/services/transmission/settings.json
    owner: transmission
    group: media
    # 0664 owner:transmission group:media -- not a choice: transmission
    # rewrites settings.json on shutdown/hash-persist under its own umask 002
    # (load-bearing so downloaded media stays group-accessible to the *arr
    # stack), landing it 0664 root-of-the-rewrite. Declaring anything tighter
    # just flaps idempotence; the rpc-password is only a salted hash here.
    mode: "0664"
    backup: true
    validate: python3 -c 'import json,sys; json.load(open(sys.argv[1]))' "%s"
  register: transmission_conf
  become: true
  tags:
    - transmission

- name: Check whether podman is installed
  stat:
    path: /usr/bin/podman
  register: transmission_podman
  tags:
    - transmission

- name: Create transmission rpc-password secret
  when: not ansible_check_mode or transmission_podman.stat.exists
  containers.podman.podman_secret:
    name: transmission_rpc_password
    data: "{{ transmission_rpc_password }}"
  register: _transmission_rpc_password_secret
  become: true
  tags:
    - transmission

- name: Install transmission fluent-bit extension
  import_role:
    name: fluentbit
    tasks_from: extension
  vars:
    fluentbit_extension_args:
      name: transmission
  tags:
    - transmission

- name: Install transmission service
  import_role:
    name: systemd_unit
    tasks_from: install
  vars:
    systemd_unit_args:
      src: transmission.service.j2
      condition: "{{ not ansible_check_mode or transmission_user.uid is defined }}"
  tags:
    - transmission

- name: Pull transmission image
  when: not ansible_check_mode or transmission_podman.stat.exists
  containers.podman.podman_image:
    name: "{{ transmission_image }}"
  register: transmission_image_pull
  retries: 3
  delay: 10
  until: transmission_image_pull is not failed
  become: true
  tags:
    - transmission

- name: Enable transmission service
  import_role:
    name: systemd_unit
    tasks_from: service
  vars:
    systemd_unit_args:
      src: transmission.service
      condition: "{{ not (ansible_check_mode and (transmission_service_result.changed or transmission_user.changed)) }}"
      restart: >-
        {{ transmission_service_result.changed
           or transmission_conf.changed
           or (_transmission_rpc_password_secret.changed | default(false))
           or transmission_user.changed
           or media_group.changed }}
  tags:
    - transmission

- name: Configure nginx
  import_role:
    name: nginx
    tasks_from: site
  vars:
    nginx_site_args:
      subdomain: transmission
      proxy_pass: http://127.0.0.1:{{ service_ports.transmission }}/
      # Authelia gates the browser UI. The *arr leg uses
      # transmission.dns.podman:9091 over the media podman network
      # with rpc-username/rpc-password, bypassing nginx entirely.
      auth: required
  tags:
    - transmission

# The LinuxServer image runs /app/blocklist-update.sh daily at 03:00. Its s6
# environment loads USER/PASS from the unit's USER/FILE__PASS settings for the
# authenticated RPC call, so the enabled blocklist needs no host-side timer.
- name: Remove the redundant blocklist refresh timer
  import_role:
    name: systemd_timer
    tasks_from: remove
  vars:
    systemd_timer_args:
      name: transmission_blocklist_update
  tags:
    - transmission

- name: Remove the retired /opt/transmission code directory
  file:
    path: /opt/transmission
    state: absent
  become: true
  tags:
    - transmission
