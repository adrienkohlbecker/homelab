parsers:
  - name: transmission_console
    format: regex
    regex: '/\A\[[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{3}(?:Z|[+-][0-9]{4})\] (?<_level>TRC|DBG|INF|WRN|ERR|FTL) (?<source>[^:[:space:]]+):(?<source_line>[0-9]+) (?<log>[\s\S]*?) \([^:()]+:[0-9]+\)[[:space:]]*\z/'
    types: source_line:integer

pipeline:
  filters:
    - name: parser
      match: svc.transmission.service
      key_name: MESSAGE
      parser: transmission_console
      reserve_data: true
