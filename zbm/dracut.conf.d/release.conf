# Build a host-agnostic image like upstream's release builds. Without this,
# ZBM's dracut module bakes the build container's hostid into the image (glibc
# derives one from the container IP when /etc/hostid is absent), and ZBM boots
# every root with it. Without a baked hostid ZBM uses upstream's default
# 0x00bab10c, which provision.sh and the zfs role give every root.
zfsbootmenu_release_build=1
